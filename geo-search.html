11 | Rainforest regenerates slowly | Soil poor in nutrients (leached, nutrients stored in plants; rapid decay) | | 2011 | African–Eurasian desert belt | Subtropical high-pressure cells (not warm currents). Rain-shadow (Gobi) and cold currents (Namib, Atacama) are other causes | | 2012 | Tropical savannah | Definite dry and wet season | | 2015 | \"Clear morning, heat builds, thunder, short rain\" | Equatorial (ITCZ; two rainfall peaks) | | 2018 | Desert leaf modifications | Hard waxy, tiny, thorns – all three | | 2021 | What keeps savannah forest in check | Fire, grazing herbivores, seasonal rainfall (2, 3, 4) | | 2021 | Fast leaf-litter decay, bare soil, epiphytes | Tropical rain forest | | 2023 | Rainforest soil rich in nutrients? | Statement I wrong; II right (fast decay, nutrients absorbed) | | 2024 | Low annual/daily range, rain all year, 50–250 cm | Marine West Coast | | no year | Dust in subtropical/temperate areas | I correct (deserts, wind); II wrong – these have strong dry winds |"}, {"c": 2, "n": "Climatology · quick", "id": "q-6-recall-sheet-climatology", "t": "6 · Recall sheet – Climatology", "x": "Q A Troposphere height; lapse 8–18 km (13 avg); 1 °C per 165 m (≈6.5 °C/km) Ozone layer height 20–25 km Coldest layer; layer for jets Mesosphere; lower stratosphere Kármán line 100 km Energy surplus/deficit boundary 40° N/S Coriolis: where zero / max; direction Equator / poles; right in N, left in S Roaring / Furious / Shrieking 40s / 50s / 60s Polar jet vs subtropical jet 50–60° (winter-strong) / 20–30° Warm cold-front cloud types Warm: stratus, cirrostratus; Cold: cumulonimbus Cyclone SST ≥ 26.5 °C Where does Chinook blow; its nickname E. Rockies; snow-eater PSC altitude & temperature 15–25 km; below −78 °C Cloud seeding agents Silver iodide, potassium iodide, salt, dry ice Which hemisphere has stronger westerlies, why Southern – less land Desert belts' main cause Subtropical high-pressure cells (plus rain shadow, cold currents) Traps: \"Jet streams only in the Northern Hemisphere\" ✘ · \"Temperature contrast of land-sea is greater in summer\" ✘ (winter) · \"Westerlies 30°N–60°S\" ✘ · \"Ozone causes radio reflection\" ✘ · \"More moisture aloft makes it colder\" ✘ · \"Gulf Stream is a cold current\" ✘ (statement 2 in PYQ 2024 is wrong) · \"Eye is 10 °C cooler\" ✘ · \"Rainforest soil is rich\" ✘. Connects to: Pressure belts shift with the Sun → Geomorphology (23.5° tilt, 21 June) · Western disturbances, monsoon, Loo → Indian Geography (climate) · Ocean currents shape isotherms and deserts → Oceanography · Climatic regions → Economic Geography (agriculture)."}, {"c": 3, "n": "Oceanography", "id": "s1", "t": "WateronEarth", "x": "The hydrosphere covers nearly 71% of the total surface area of the earth. Divided into Oceans, Inland Seas, Small enclosed seas, Bays, etc. based on size and location. 5 major oceans : Pacific Ocean, Atlantic Ocean, Indian Ocean, Arctic Ocean and Southern Ocean The ocean floors are characterized by various relief zones – Continental Shelf, Continental Slope, Deep Sea Plain, and Oceanic deep or trench. Ocean relief is created largely due to tectonic, volcanic, erosional, and depositional processes and their interactions. The average depth of the ocean is 3,800 m against the 840 m average height of the lithosphere. Water on Earth"}, {"c": 3, "n": "Oceanography", "id": "s3", "t": "Continental Shelf:", "x": "The continental shelf is the submerged extension of a continent , sloping gently (1-2 degrees) from the shoreline to the continental slope. The width of the continental shelf varies widely , ranging from a few kilometers to hundreds of kilometers. The depth of the continental shelf is relatively shallow , typically extending to depths of about 200 meters (656 feet) but can reach depths of up to 500 meters (1,640 feet) in some areas. The continental shelf is composed of continental crust and sedimentary deposits , including sand, silt, and clay. It may feature submerged ridges, valleys, and canyons formed by geological processes such as erosion, sedimentation, and tectonic activity. Economic Significance: The continental shelf is often rich in hydrocarbon resources such as oil and natural gas, which accumulate in sedimentary layers over millions of years. Offshore drilling and exploration are conducted on continental shelves to extract these resources. The continental shelf supports diverse marine ecosystems , including coral reefs, kelp forests, and commercially important fish species. It provides habitat and feeding grounds for marine organisms and supports commercial fisheries . This biodiversity can also attract tourism . Examples: The North Sea : Located off the coasts of Norway, Denmark, Germany, the Netherlands, and the United Kingdom, the North Sea has a wide continental shelf and is known for its oil and gas reserves. The Gulf of Mexico : Bordered by the southern United States and Mexico, the Gulf of Mexico has an extensive continental shelf and is a major oil-producing region. The Great Barrier Reef : Off the coast of Australia, the Great Barrier Reef is the world's largest coral reef system, extending over 2,300 kilometers along the continental shelf of Queensland."}, {"c": 3, "n": "Oceanography", "id": "s4", "t": "Continental Slope:", "x": "The continental slope is the steeply sloping transition zone between the continental shelf and the deep ocean floor. The continental slope begins at the outer edge of the continental shelf and extends to the continental rise or the abyssal plain. The gradient of the continental slope is much steeper than that of the continental shelf, typically ranging from 3 to 6 degrees but can be as steep as 25 degrees in some areas. The depth of the continental slope varies widely, ranging from depths of about 200 meters (656 feet) to 3,000 meters (9,843 feet) or more. The continental slope is characterized by underwater cliffs, canyons, and steep slopes formed by erosion, sedimentation, and tectonic activity. Submarine canyons, such as the Monterey Canyon off the coast of California, are common features of continental slopes. Sediments eroded from the continental shelf are transported down the continental slope by underwater currents and gravity, contributing to the formation of deep-sea fans, Continental Rise, and turbidity currents. It supports deep-sea ecosystems adapted to high pressure, low light, and cold temperatures. Resource Exploration : The continental slope is of interest for resource exploration, including oil and gas deposits, mineral resources, and deep-sea mining opportunities. But we are yet to develop proper technologies for resource extraction. Deep-sea research and exploration expeditions study the geological, biological, and environmental characteristics of the continental slope. Examples: The Blake Plateau: Located off the southeastern coast of the United States, the Blake Plateau features a prominent continental slope and is known for its rich biodiversity and geological formations. The Antarctic Slope Front: Surrounding the Antarctic continent, the Antarctic Slope Front marks the boundary between the continental shelf and the deep ocean and plays a key role in ocean circulation and climate dynamics."}, {"c": 3, "n": "Oceanography", "id": "s5", "t": "Deep Sea Plains", "x": "Deep-sea plains, also known as abyssal plains , are vast, flat expanses of the ocean floor located at depths greater than 2,000 meters (6,560 feet). Deep-sea plains are found in the abyssal zones of the ocean , typically beyond the continental slope and rise, covering large areas of the ocean basin. Deep-sea plains are characterized by depths ranging from 2,000 meters (6,560 feet) to 6,000 meters (19,685 feet) or more, with relatively gentle slopes and low relief. Deep-sea plains have relatively flat topography compared to the rugged terrain of the continental slope and rise. They are composed of fine-grained sediments , including clay, silt, and sand, deposited over millions of years by marine currents and processes. Biological Activity: Deep-sea plains support diverse ecosystems adapted to extreme conditions, including high pressure, low light, and cold temperatures. Benthic organisms such as deep-sea corals, sponges, and echinoderms inhabit the sediments and substrates of deep-sea plains. Mineral Resources: Deep-sea plains are of interest for their mineral resources, including polymetallic nodules, manganese crusts, and hydrothermal vent deposits . These resources contain valuable metals and minerals used in various industries, including technology, manufacturing, and construction. However, their extraction is a challenge. We are yet to develop technologies for that. Geological Processes : Deep-sea plains are shaped by geological processes such as sedimentation, erosion, and tectonic activity. Sediments accumulate slowly over time, forming flat layers that may preserve geological and environmental records. There are also volcanic features like sea mounds, guyots, trenches, etc. Example: The Clarion-Clipperton Zone: Located in the Pacific Ocean between Hawaii and Mexico, the Clarion-Clipperton Zone is one of the largest deep-sea plains in the world and is known for its abundance of polymetallic nodules. Trenches: Trenches are long, narrow, and deep depressions in the ocean floor , formed at convergent plate boundaries where one tectonic plate is forced beneath another. They are the deepest parts of the ocean , with depths exceeding 6,000 meters (19,685 feet) in some cases. Submarine Canyons : Submarine canyons are deep, steep-sided valleys cut into the continental slope and extending across the continental shelf and sometimes into the abyssal plain. They are formed by erosional processes such as turbidity currents, underwater landslides, and river discharge. Submarine canyons serve as conduits for sediment transport from the continental shelf to the deep ocean , and they provide habitat for diverse marine life. E.g. Hudson Canyon, off the coast of New York. Continental Rise: The continental rise is a gently sloping sedimentary deposit located at the base of the continental slope , where it meets the abyssal plain. It consists of accumulated sediments transported from the continental shelf and slope by gravity, turbidity currents, and sediment gravity flows. The continental rise marks the transition between the continental margin and the deep ocean basin. E.g. Amazon Continental Rise off the coast of northeastern South America Trenches are associated with intense geological activity , including subduction zones, earthquakes, and volcanic eruptions. E.g. Mariana Trench in the Western Pacific Ocean, east of the Mariana Islands Seamounts: Seamounts are underwater mountains rising from the ocean floor , typically with heights of 1,000 meters (3,280 feet) or more above the surrounding seabed. They can be either active or extinct volcanoes , formed by hotspot activity or tectonic processes. Seamounts provide habitat for diverse marine life , including deep-sea corals, sponges, and fish, and they serve as important fishing grounds and navigation hazards. E.g. Davidson Seamount Off the coast of central California, USA Guyots: Guyots, also known as table mounts, are flat-topped seamounts that have been eroded by wave action and submer"}, {"c": 3, "n": "Oceanography", "id": "s6", "t": "General Terminologies Associated With Oceans:", "x": "Strait: A narrow waterway connecting two larger bodies of water. Example: Palk Strait, separating India and Sri Lanka. Isthmus: A narrow strip of land connecting two larger landmasses, with water on either side. Example: Isthmus of Kra, connecting the Malay Peninsula with mainland Asia. Archipelago : A group or chain of islands clustered together in a body of water. Example:Japanese Archipelago, in Western Pacific Ocean. Lakes : Bodies of water surrounded by land, larger and deeper than ponds. Example: Lake Baikal in Russia, Wular Lake in India. Bay: A recessed, coastal body of water that is partly surrounded by land. Example: Bay of Bengal. Cape : A pointed or curved piece of land extending into a body of water. Example: Cape Comorin (Kanyakumari), the southernmost tip of the Indian Peninsula; Cape of Good Hope, Africa. Lagoon : A shallow body of water separated from a larger body of water by a barrier island or reef. Example: Chilika Lake, a brackish water lagoon in Odisha, India. Island : A landmass surrounded by water. Example: Lakshadweep Islands, located in the Arabian Sea off the western coast of India. Gulf: A inlet with constricted entrance compared to a bay. Example: Gulf of Kutch, along the western coast of Gujarat, India. Peninsula : A piece of land surrounded by water on three sides, connected to a larger landmass. Example: Indian Peninsula, surrounded by Arabian Sea, Bay of Bengal and Indian Ocean."}, {"c": 3, "n": "Oceanography", "id": "s7", "t": "Properties Of The Oceanic Water: Temperature", "x": "Temperature is a vital property of ocean water that influences a wide range of physical, chemical, and biological processes. Factors Affecting Temperature Distribution : Solar Radiation (Latitude) : Solar radiation is the primary driver of ocean temperature distribution. Near the equator, where solar radiation is most intense, ocean temperatures tend to be warmer. At higher latitudes, solar radiation is less direct, resulting in cooler surface temperatures. Ocean Currents: Ocean currents redistribute heat horizontally across the ocean's surface. Warm ocean currents, such as the Gulf Stream and the Kuroshio Current, transport heat from the equator toward higher latitudes, influencing regional climates and ocean temperatures. Atmospheric Circulation : Atmospheric circulation patterns, such as the Hadley, Ferrel, and Polar cells, affect ocean temperature distribution by influencing wind patterns, evaporation rates, and heat exchange between the atmosphere and the ocean. Continentality: The water body surrounded by land on its majority of shores, will be warmer than a body surrounded by land on less of its sides. This is because just like oceans have a moderating impact on the land’s temperature, similarly land has the opposite i.e. “extreming” effect on the sea’s temperature. Ocean Depth : Temperature distribution in the ocean varies vertically with depth. Surface waters are generally warmer due to solar heating and mixing by wind and waves, while deeper waters tend to be colder. Seasonal Variation : Seasonal changes in solar radiation and atmospheric conditions lead to seasonal variations in ocean temperature. For example, ocean temperatures may be warmer in summer and cooler in winter due to changes in solar insolation and atmospheric circulation. Horizontal Distribution of Temperature: The horizontal distribution of ocean temperature is influenced by factors such as latitude, solar radiation, ocean currents, and atmospheric circulation patterns. Near the equator, ocean temperatures are generally warm, with surface temperatures often exceeding 25°C (77°F) due to direct exposure to intense solar radiation. As you move away from the equator toward higher latitudes, ocean temperatures tend to decrease. In polar regions, surface temperatures can drop below freezing due to the influence of cold polar air masses. Ocean currents play a crucial role in redistributing heat horizontally across the ocean surface. Warm ocean currents, such as the Gulf Stream in the North Atlantic and the Kuroshio Current in the North Pacific, transport heat from the equator toward higher latitudes, influencing regional climates and ecosystems. Vertical Distribution of Temperature: The vertical distribution of ocean temperature varies with depth , forming distinct layers known as water masses. The uppermost layer of the ocean, called the surface mixed layer up to 200-400m, is typically warmer due to direct solar heating and mixing by wind and waves. Surface temperatures can vary widely depending on factors such as location, season, and ocean currents. Below the surface mixed layer lies the thermocline, a transition zone characterized by a rapid decrease in temperature with depth. The thermocline separates the warm, well-mixed surface layer from the colder, deeper layers of the ocean. In the deep ocean, temperatures are relatively uniform and cold, typically ranging from 2°C to 4°C (35.6°F to 39.2°F). This deep layer, known as the abyssal zone, extends from the base of the thermocline to the ocean floor and is largely unaffected by solar heating or surface processes. Here sporadically certain locations are heated due to volcanic activities, but that is an exception and not a rule. Significance of Temperature: Ocean temperature influences the distribution and behaviour of marine organisms, including fish, plankton, and marine mammals. Temperature gradients in the ocean drive ocean currents , which play a crucial role in regulating Earth’s climate and transpor"}, {"c": 3, "n": "Oceanography", "id": "s8", "t": "Properties Of The Ocean Water: Salinity", "x": "Salinity, the concentration of dissolved salts in ocean water , is a crucial property that influences various oceanographic processes. Factors Affecting Salinity Distribution: Evaporation and Precipitation : Regions with high evaporation rates and low precipitation, such as subtropical oceans, experience higher salinity due to water loss and salt accumulation. Conversely, areas with high precipitation rates, such as the equator and high latitudes, may have lower salinity due to dilution by freshwater inputs. Riverine Input: Rivers transport freshwater and dissolved minerals from land to the ocean, contributing to variations in salinity along coastlines and estuaries. Regions near river mouths tend to have lower salinity due to freshwater influx, while areas further offshore may exhibit higher salinity. Sea Ice Formation and Melting: During sea ice formation, salt is excluded from the ice crystals , increasing the salinity of surrounding seawater. Conversely, when sea ice melts, freshwater is added to the ocean, reducing salinity . These processes influence salinity distribution in polar regions and areas affected by seasonal ice cover. Ocean Currents : Ocean currents transport water masses with different salinities across the ocean's surface and depths. Warm, saline currents, such as the Gulf Stream, contribute to higher salinity in regions they influence , while cold, freshwater currents, such as the Labrador Current, can lower salinity in adjacent areas. Atmospheric Circulation : Atmospheric circulation patterns, such as trade winds and westerlies, influence surface ocean currents and evaporation rates, affecting regional salinity patterns. Horizontal Distribution of Salinity: Latitudinal Variations: Salinity levels tend to be higher in subtropical regions and lower in equatorial and polar regions. Subtropical regions, around 20-30 degrees latitude, experience high evaporation rates and limited precipitation, leading to elevated salinity levels. Equatorial regions receive high levels of precipitation but also experience significant evaporation, resulting in relatively lower salinity. Polar regions have lower salinity due to freshwater input from melting ice, precipitation, and runoff from land. Coastal Influence: Salinity near coastlines can vary significantly due to factors such as river discharge, freshwater input, and local weather patterns. Riverine input from streams and rivers can reduce salinity near coastlines, especially during periods of high runoff. Estuaries, where rivers meet the ocean, often have lower salinity due to mixing with freshwater. Inland Seas: The salinity of the inland Seas and lakes is very high because of the regular supply of salt by ‘the rivers falling into them. Their water becomes progressively more saline due to evaporation . For instance, the salinity of the Great Salt Lake, (Utah, USA), the Dead Sea, and the Lake Van in Turkey are 220, 240, and 330 respectively . The oceans and salt lakes are becoming saltier as time goes on because the rivers dump more salt into them, while freshwater is lost due to evaporation. Vertical Distribution of Salinity: Surface Layer: The surface layer of the ocean, known as the mixed layer, generally has salinity variations latitudinally, as stated above. Halocline: Below the surface layer lies the thermocline, a transition zone characterized by a rapid change in temperature with depth, creating a layer of Halocline. Salinity levels may also change within this zone but generally remain relatively stable compared to temperature changes. Deep Ocean: Salinity in the deep ocean is relatively uniform compared to surface and intermediate layers. It is approx. 34.7 ppt . Significance of Salinity : Salinity influences seawater density, which drives ocean circulation patterns, mixing processes, and vertical stratification . Changes in salinity can affect ocean density gradients, leading to alterations in thermohaline circulation, nutrient distribution, and marine habitat"}, {"c": 3, "n": "Oceanography", "id": "s9", "t": "Properties Of Ocean Water: Density", "x": "Density is a critical property of ocean water that influences various physical processes, including ocean circulation, stratification, and mixing. Factors affecting Density Distribution: Temperature : Cold water is denser than warm water , so temperature variations play a significant role in determining ocean density. Cold polar waters tend to be denser than warmer equatorial waters, leading to density gradients across latitudes. Vertical variations in temperature also contribute to density differences within the ocean. Salinity : Salinity affects seawater density, with higher salinity generally increasing water density. Evaporation and precipitation influence salinity levels, leading to variations in density in regions with different water balances. Pressure: Pressure increases with depth in the ocean , compressing water molecules and increasing density. Deep ocean waters are denser than surface waters due to the higher pressures experienced at depth. The impact of temperature on density is higher than the impact of Salinity on it. Horizontal Distribution: Latitudinal Variations: Density varies horizontally across latitudes due to temperature and salinity gradients. Subtropical regions often have higher density due to higher salinity and lower temperatures associated with subtropical gyres. Equatorial regions may have lower density due to warmer temperatures and lower salinity associated with precipitation. Coastal Influence: Coastal areas may exhibit density variations due to factors such as river runoff, freshwater input, and mixing with terrestrial sources. Estuaries and coastal upwelling zones often experience density gradients due to interactions between freshwater and seawater. Vertical Distribution : Vertical variation of density is not constant and is different for different latitudinal areas. However, a general trend is that it increases with depth due to an increase in pressure. Significance: Density variations drive vertical and horizontal ocean circulation , influencing heat transport, nutrient distribution, and marine habitats. Ocean density gradients contribute to the formation of ocean currents, upwelling and downwelling zones , and the global conveyor belt circulation system."}, {"c": 3, "n": "Oceanography", "id": "s10", "t": "OCEAN ACIDIFICATION", "x": "Reduction in the pH of Oceanic water. Pre-industrial oceanic pH was 8.2, 8.11 in 1985 to 8.04 in 2024 . (30% increase in acidity in the past 200 yrs). Seen more in arctic region compared to tropics, as colder water have a higher capacity to absorb CO2. Causes: Dissolution of Carbon Dioxide in Water. Volcanoes Agricultural runoff Impact: Coral bleaching, weakening of shells & exoskeleton of shellfish, changes in the growth of some species of phytoplankton."}, {"c": 3, "n": "Oceanography", "id": "s11", "t": "PYQ", "x": "Q.1) On the planet earth, most of the freshwater exists as ice caps and glaciers. Out of the remaining freshwater, the largest proportion (2013) (a) is found in the atmosphere as moisture and clouds (b) is found in freshwater lakes and rivers\\ (c) exists as groundwater (d) exists as soil moisture Ans: C According to the U.S. Geological Survey, over 68 percent of the freshwater on Earth is found in ice caps and glaciers, and just over 30 per cent is found in groundwater. Only about 0.3 percent of our freshwater is found in the surface water of lakes, rivers, and swamps. Over 68 percent of the freshwater on Earth is found in icecaps and glaciers, and just over 30 percent is found in groundwater. Only about 0.3 percent of our freshwater is found in the surface water of lakes, rivers, and swamps. US and Canadian researchers recently calculated the total amount of the world's groundwater and estimated that it is equivalent to a lake 180 metres deep covering the entire Earth. This makes groundwater the largest active freshwater resource on the planet. Q.2) With reference to the water on the planet Earth, consider the following statements: (2021) 1. The amount of water in the rivers and lakes is more than the amount of groundwater. 2. The amount of water in polar ice caps and glaciers is more than the amount of groundwater. Which of the statements given above is/are correct? (a) 1 only (b) 2 only (c) Both 1 and 2 (d) Neither 1 nor 2 Ans.- B Groundwater represents about 30% of world's fresh water. From the other 70%, nearly 69% is captured in the ice caps and mountain snow/glaciers and merely 1% is found in river and lakes. Of the total freshwater, 69% resides in glaciers and 30% underground. Polar ice caps and glaciers has more water than groundwater. 3% of the earth's water is fresh. 2.5% of the earth's fresh water is unavailable: locked up in glaciers, polar ice caps, atmosphere, and soil; highly polluted; or lies too far under the earth's surface to be extracted at an affordable cost. 0.5% of the earth's water is available fresh water. Q.3) Account for variations in oceanic salinity and discuss its multi-dimensional effects. (2017, 15m)"}, {"c": 3, "n": "Oceanography", "id": "s13", "t": "Typesofcurrents:", "x": "Ocean currents are continuous flows of large volumes of water in a definite direction. Unlike waves, ocean currents are continuous in nature, flowing all year round . Just like the prevailing winds, the ocean currents are also responsible for the transfer of heat from the tropics to the poles. Types of currents: Surface Currents : Surface currents are driven primarily by wind patterns and occur in the upper layer of the ocean (typically the top 400 meters). They affect only 10% of the ocean water . They flow horizontally and can extend over large distances, influencing weather patterns, climate, and marine ecosystems. Examples include the Gulf Stream in the North Atlantic, the Kuroshio Current in the North Pacific, and the Antarctic Circumpolar Current in the Southern Ocean. Open Ocean Currents Equatorial Currents : Equatorial currents are primarily driven by the trade winds , which blow from east to west across the equatorial region. These winds generate surface currents that flow in the same direction as the wind, known as the equatorial drift. This is supported further by the West to east movement of the Earth , which, due to inertia makes the equatorial water move west. The Coriolis effect , caused by the Earth's rotation, deflects the equatorial drift to the right in the Northern Hemisphere and the left in the Southern Hemisphere, resulting in the formation of the North Equatorial Current and South Equatorial Current. These currents converge near the equator and form the eastward-flowing Equatorial Counter Current. Circumpolar Currents: Ocean currents that flow around the polar regions of the Earth. Continuous Flow : Circumpolar boundary currents form a continuous loop around the poles , unlike other ocean currents that may be interrupted by landmasses. Isolation of Polar Waters: These currents help to isolate the polar waters from the warmer waters of the mid-latitudes, playing a crucial role in the Earth's climate system. E.g.: Antarctic Circumpolar Current, West wind drift Boundary currents : Flowing at the oceanic boundaries , cutting across the latitudes. Depending upon the latitudes from where they start, they can be warm or cold currents. Warm Currents or the West Boundary Currents: Western boundary currents are strong, narrow, and fast-moving currents that flow along the western edges of ocean basins. They are characterized by warm water and high speeds . They are warm as they flow from the tropics towards the poles . In the Northern Hemisphere, the trade winds blow from northeast to southwest, pushing surface water towards the western boundary of ocean basins. The Coriolis effect deflects this water to the right, resulting in the formation of strong western boundary currents. Similarly, in the Southern Hemisphere, the trade winds blow from southeast to northwest, causing the formation of western boundary currents. Eastern boundary currents are slower, broader, and cooler currents that flow along the eastern edges of ocean basins. They are driven by the upwelling of deep, nutrient-rich water and the return flow of equatorial currents. They are cold as they flow from the poles towards the tropics . They are created due to the impact of the Westerlies , causing the water to accumulate at the Eastern boundaries of the oceans in the upper latitudes. Deep Water Currents : Deep ocean currents, also known as thermohaline currents or abyssal currents , occur below the surface layer of the ocean and are driven by density differences. These currents result from variations in temperature and salinity , with cold, dense water sinking and warmer, less dense water rising. The down-welling happens at the polar locations , and the upwelling at the tropical regions of cold currents. Deep ocean currents play a crucial role in global thermohaline circulation, which helps redistribute heat and nutrients around the world's oceans. Factors affecting Ocean Currents: Latitude : It determines whether the current will be warm or cold. Wind"}, {"c": 3, "n": "Oceanography", "id": "s14", "t": "WATERMASSES", "x": "North Atlantic Gyre: The North Atlantic Gyre is a clockwise circulation pattern in the North Atlantic Ocean. It consists of several currents, including the Gulf Stream, North Atlantic Current, Canary Current, and North Equatorial Current. The Gulf Stream, a warm and swift Atlantic Ocean current, is one of the most prominent features of this gyre. Sargasso Sea , the only sea without a coastline lies in the middle of this Gyre . It is named after the Sargassum weed , which grows here, sustaining a huge biodiversity. South Atlantic Gyre: The South Atlantic Gyre is a counterclockwise circulation pattern in the South Atlantic Ocean. It includes currents such as the Brazil Current, Benguela Current, and South Equatorial Current. North Pacific Gyre: The North Pacific Gyre is a clockwise circulation pattern in the North Pacific Ocean. It features currents like the Kuroshio Current, North Pacific Current, and California Current. South Pacific Gyre: The South Pacific Gyre is a counterclockwise circulation pattern in the South Pacific Ocean. It includes currents such as the East Australian Current, Peru Current, and South Equatorial Current. Indian Ocean Gyre: The Indian Ocean Gyre is a anti-clockwise circulation pattern in the Indian Ocean. It consists of currents like the Agulhas Current, West Australian Current, and South Equatorial Current. Southern Ocean Anomaly The Southern Ocean Carbon Anomaly refers to the unexpectedly high absorption of anthropogenic CO₂ by the Southern Ocean , making it a stronger carbon sink than predicted by climate models. The anomaly is primarily driven by surface stratification , where freshwater from Antarctic glacier melt and increased rainfall forms a light, stable surface layer over denser saline water. This \"freshwater lid\" inhibits vertical mixing , trapping carbon-rich deep waters 100–200 m below the surface and preventing CO₂ from escaping into the atmosphere despite strong westerly winds. The Southern Ocean currently absorbs about 40% of the carbon dioxide taken up by the global oceans , temporarily slowing global warming. However, this is considered a \"fleeting reprieve\" , as weakening of the freshwater layer could trigger rapid CO₂ release and accelerate climate change in the future. WATER MASSES Water masses are large, homogenous bodies of ocean water that have distinct temperature , salinity , and density characteristics formed in specific source regions. Once formed, they retain these properties for long distances and time periods as they move through the ocean. Water masses primarily define the physical and chemical environment for marine life. Their temperature, salinity, and nutrient content determine the types of organisms that can thrive in a particular region. Water masses, once formed, move and circulate through the ocean due to a combination of gravity, density differences, wind stress, and Earth's rotation . This movement happens in three dimensions — vertically and horizontally — and forms the backbone of the global ocean circulation system ."}, {"c": 3, "n": "Oceanography", "id": "s16", "t": "AtlanticMeridionalOverturningCirculation:(AOC)", "x": "Defining the Physical and Chemical Environment: Water masses primarily determine the \"habitat\" for marine life by influencing characteristics like temperature, salinity, and nutrients. Supporting Specific Ecosystems: Different water masses create unique environments that favor specific types of ecosystems: Coral Reefs: Warm, nutrient-poor water masses with high clarity often support vibrant coral reef ecosystems. Kelp Forests: Cold, nutrient-rich water masses can support the growth of kelp forests, which provide a habitat for diverse marine life. Deep-sea ecosystems: Deep-sea water masses with constant cold temperatures and high pressure create a unique environment for specialized deep-sea organisms. Impact on Marine Productivity: The temperature, salinity, and nutrient content of a water mass directly influence the overall productivity of an area . Nutrient-rich, cooler water masses can support larger populations of phytoplankton (the base of the marine food chain), leading to higher overall productivity. Atlantic Meridional Overturning Circulation: (AOC) The AMOC is a crucial component of global ocean circulation, responsible for redistributing heat around the Atlantic Ocean. It involves the northward transport of warm surface waters and the southward flow of cooler, denser waters at depth. Warm, salty surface waters from the tropics are transported northward by currents like the Gulf Stream. These waters cool and sink in the North Atlantic, forming the North Atlantic Deep Water (NADW) current. NADW flows southward along the ocean floor, completing the overturning circulation. The AMOC plays a vital role in regulating climate patterns, and influencing weather, and precipitation in regions bordering the Atlantic. Changes in the AMOC can lead to shifts in regional climate patterns, affecting temperature, rainfall, and storm frequency. Climate change is affecting the AMOC through various mechanisms, including increased freshwater input from melting ice caps and increased precipitation. These changes can disrupt the formation of NADW and weaken the overturning circulation, by disrupting the temperature and salinity properties of the polar water leading to regional climate disruptions."}, {"c": 3, "n": "Oceanography", "id": "s18", "t": "MarineHeatwaves", "x": "AMOC is weaker than at any point in the past millennium, primarily due to global warming Weakening of the AMOC could lead to altered weather patterns, more frequent extreme events (such as heatwaves, coldwaves and storms), and changes in ocean currents and ecosystems. Reduced heat transport from the tropics to higher latitudes could lead to cooler temperatures in regions typically influenced by warm ocean currents, such as Western Europe. The weakening of the AMOC may also reduce the ocean's capacity to absorb carbon dioxide, exacerbating global warming. Increased frequency and intensity of hurricanes along the east coast of North America due to changes in ocean temperature gradients and atmospheric dynamics. Human-induced climate change has elevated Atlantic hurricane wind speeds by 18 miles per hour (29 kilometers per hour) over the past six years. Changes in the strength and position of major ocean currents , such as the Gulf Stream, could affect the distribution and abundance of marine life in the North Atlantic. Declines in fish populations due to changes in ocean currents and temperature regimes could have cascading effects on marine ecosystems and fisheries. It could also contribute to sea level rise and impact global climate stability. Impact of Climate Change on Ocean Currents: Disruption of the Thermohaline circulations . Can even cause their collapse, due to a reduction in the thermal gradient between tropical and polar waters, and a reduction of salinity difference as a result of the entry of fresh waters into the oceans due to the melting of glaciers. Disruption in thermohaline currents can affect upwelling and downwelling, thereby reducing nutrients in upwelling zones, and reducing Oxygen availability in downwelling zones. Can change how winds move , thereby altering the movement of both equatorial and boundary currents . Warmer waters beneath the Arctic and Antarctic ice caps can affect the melting of ice from below. Changes in ocean currents can disrupt marine ecosystems , affecting species distribution, migration patterns, and breeding grounds. This can lead to a decline in biodiversity and changes in the availability of marine resources. Coastal communities may experience changes in weather patterns, increased frequency of extreme weather events, and impacts on fisheries, tourism, and shipping routes. Altered ocean currents can also affect regional climates, agriculture, and water resources. Ekman Currents: Ekman Current: Ekman currents are ocean currents caused by wind blowing over the surface of the sea. Because of Earth's rotation (the Coriolis effect), water near the surface moves at an angle to the direction of the wind—usually about 45° to the right in the Northern Hemisphere and to the left in the Southern Hemisphere. As you go deeper, each layer of water moves slightly differently, forming a spiral pattern called the Ekman spiral (in the image). Significance: Nutrient Upwelling : Ekman currents cause upwelling , particularly near coastlines, where deep, cold, nutrient-rich waters rise to the surface, enhancing marine productivity and supporting rich fisheries. Heat Distribution : Ekman currents help in the redistribution of heat in the ocean, affecting local and global climate patterns by moving warm and cold water masses. Wind Stress and Transport : Ekman transport , the net movement of surface water, occurs at an angle to the wind, influencing coastal circulation and the formation of important features like gyres . Climate and Weather : Ekman currents and upwelling regions have significant effects on regional climates and contribute to weather phenomena such as El Niño and La Niña . CO₂ Absorption : The upwelling associated with Ekman currents aids in the exchange of carbon dioxide between the atmosphere and ocean, impacting the carbon cycle . Marine Heatwaves Prolonged periods of unusually warm ocean temperatures, that can disrupt marine ecosystems. They can lead to significant impacts on marine li"}, {"c": 3, "n": "Oceanography", "id": "s19", "t": "Ocean Movements: Tides", "x": "Rise (High tide/ Flood) and Fall (Low Tide/ Ebb) of Seawater Due to the gravitational pull of the Moon and Sun. On average, every place experiences a high and a low tide twice a day (semi-diurnal). Period: 12 hr 26 minutes. A particular tide centre takes 24 hours 52 minutes to come under the moon but by that time there is another tide at the opposite side of the referred tide centre due to centrifugal force of the Earth. So, a place experiences the same tide after 12 hours 26 minutes. Diurnal tides occur in specific regions due to the unique geography and resonance effects, resulting in one dominant high tide and one dominant low tide each day. (Gulf of Mexico, Gulf of Thailand); Semi-diurnal tides , on the other hand, are more widespread . Spring & Neap Tides: There is a lot of temporal and spatial variation in the tide-producing forces due to different positions of the sun and the moon. Spring Tides : Very high tides are caused when the sun, the moon, and the earth are almost in the same line. This is the syzygy position. Height 20% more than normal tides. Highest high and lowest low tides created. Occur twice every month (during new moon & full moon) Neap Tides : The sun, the earth, and the moon come in the position of quadrature (form right angle); tide-producing forces of the sun and the moon work in opposite directions , with the result, of lower high tides and higher low tides are created. Factors affecting tides: Relative distances of Sun, Moon, and Earth: When the Sun, Moon, and Earth are aligned (during full and new moons), their combined gravitational pull creates higher high tides (spring tides) and lower low tides (neap tides). When the Sun and Moon are at right angles to each other (during quarter moons), their gravitational forces partially cancel out, resulting in lower high tides and higher low tides. Shape of Shoreline: Funnel-shaped bays and estuaries can amplify tidal ranges , leading to higher high tides and lower low tides compared to open coastlines. Irregular coastlines with headlands and bays can cause tidal currents to intensify and create areas of convergence and divergence, affecting local tidal patterns. Local winds: Wind can influence tidal currents by creating surface water movement and altering the distribution of water masses. Strong onshore winds can push water toward the shore, causing higher high tides, while offshore winds can result in lower high tides. Wind-driven currents can interact with tidal currents, enhancing or opposing their direction and intensity, especially in coastal areas with complex bathymetry. Pressure systems: Atmospheric pressure variations associated with weather systems, such as high and low-pressure systems, can affect sea level and tidal height. Low-pressure systems can cause sea level to rise, leading to higher high tides, while high-pressure systems can cause sea level to fall, resulting in lower high tides. These pressure-induced changes in sea level can influence tidal ranges and coastal flooding events, particularly during storm surges. Impact of tides: Sustenance of life (nutrient circulation): Tidal movements play a crucial role in the circulation of nutrients within coastal ecosystems, including estuaries, salt marshes, and intertidal zones. Tidal currents transport nutrients such as nitrogen, phosphorus, and organic matter from the open ocean to coastal areas , where they support the growth of phytoplankton and other primary producers. As tides ebb and flow, they mix and distribute nutrients throughout coastal waters, enhancing productivity and biodiversity. Nutrient-rich tidal flats and marshes serve as important feeding and breeding grounds for a variety of marine organisms, including fish, birds, and invertebrates. Temperature moderation: Tidal movements help regulate water temperatures in coastal areas by mixing surface waters with cooler, deeper waters . During incoming tides (flood tide), cooler water from deeper layers is brought to the surface, lowe"}, {"c": 3, "n": "Oceanography", "id": "s20", "t": "Ocean Movements: Waves", "x": "Waves are the energy, not the water as such, which moves across the ocean surface. Water particles only travel in a small circle as a wave passes. Wind provides energy to the waves . Waves travel because the wind pushes the water body in its course while gravity pulls the crests of the waves downward. The falling water pushes the former troughs upward , and the wave moves to a new position. The actual motion of the water beneath the waves is circular. Impact of Climate Change: Global warming can lead to stronger and more frequent storms , particularly hurricanes and typhoons, which generate larger and more powerful waves. This increased wave energy can contribute to coastal erosion and damage infrastructure. Higher sea levels mean that waves , including those from storm surges, can travel further inland , increasing the potential for coastal flooding and erosion. Changes in wind patterns and ocean currents due to global warming can alter wave patterns. This can impact coastal erosion rates, sediment transport, and the stability of coastal structures. Increased wave energy and frequency can damage coral reefs , which are already stressed by warmer water temperatures and ocean acidification. The physical destruction of reefs reduces their ability to act as natural barriers against waves. Tsunamis: Extremely long waves , Caused by a large and sudden displacement of the ocean due to earthquakes, volcanic eruptions, etc. These are also called seismic sea waves . When they reach the coast, they can cause dangerous coastal flooding and powerful currents that can last for several hours or days. Causes: Just like winds are the source of energy in the case of normal surface waves, for Tsunamis, this energy comes from some other sources. Earthquake – Most tsunamis are generated by earthquakes that occur along the subduction boundaries of plates along the ocean trenches. The size of the Tsunami is related to the size of the earthquake and the vertical shift. Volcanic eruption Landslides Meteorite Impacts – Though no historical example of meteorite impact has caused tsunamis, the apparent impact of a meteorite about 5 million years ago produced tsunamis leaving deposits along the Gulf Coast of Mexico and the United States. Can also be caused due to Anthropogenic causes like Nuclear Explosions. E.g.- Nuclear Testing by the US generated Tsunami in 1940 and the 1950s in Marshall Island. Characteristics: Long Wavelengths : Tsunamis have long wavelengths, often hundreds of kilometers, which allow them to travel rapidly across ocean basins. High Speeds : Tsunamis travel at high speeds in deep water, typically around 500 to 1000 kilometers per hour (300 to 600 miles per hour). Low Wave Heights : In the deep ocean, tsunamis may have low wave heights, often less than one meter, making them difficult to detect. Amplification near Coast : As tsunamis approach shallow coastal areas, their speed decreases while their wave height increases, leading to amplification and potential devastation upon landfall. Destructive Power : Tsunamis can cause catastrophic flooding, inundation of coastal areas, destruction of infrastructure, and loss of life. Multiple Waves : A single tsunami event may consist of multiple waves, with successive waves arriving minutes to hours apart. Warning Signs : Before the arrival of a tsunami, warning signs may include rapid sea level changes, unusual ocean behavior, and the sound of approaching waves."}, {"c": 3, "n": "Oceanography", "id": "s24", "t": "2.FocusingbyCurrentsandTopography", "x": "Rogue waves , also called freak waves , monster waves , or killer waves , are unusually large, spontaneous, and unpredictable ocean surface waves that are far larger than the surrounding waves. They can occur even in relatively calm seas and pose significant danger to ships and offshore structures. Creation: 1. Constructive Interference When several wave systems coincide in phase , their energies combine to form a single giant wave . This is a random and rare alignment, but can create extremely high waves. 2. Focusing by Currents and Topography Strong ocean currents (e.g., Agulhas Current) flowing opposite to wave direction can compress wave fronts , increasing wave height. Seafloor features like ridges or continental shelves can also focus energy."}, {"c": 3, "n": "Oceanography", "id": "s26", "t": "Creation:", "x": "A seiche is a standing wave oscillation of water in an enclosed or semi-enclosed water body , such as a lake, bay, reservoir, or even a swimming pool , caused by disturbances like strong winds, atmospheric pressure changes , earthquakes , etc. Creation: Wind Action: Strong, persistent winds push water toward one end of a lake or basin. When the wind stops suddenly, the water sloshes back, creating oscillations. Atmospheric Pressure Changes: Rapid changes in air pressure can depress water levels on one side and cause it to oscillate when the pressure equalizes. Seismic Activity: Underwater earthquakes or landslides can displace water, initiating back-and-forth wave motion. Resonance Effect: If the disturbance (like wind or pressure) matches the natural rhythm of the lake, the waves grow stronger and keep going longer—like pushing a swing at just the right time. Basin Geometry: The size, shape, and depth of the lake decide how big the waves will be and how long they will last."}, {"c": 3, "n": "Oceanography", "id": "s30", "t": "ImpactofClimateChangeonClimate&Oceans", "x": "Significance: 69% Earth’s freshwater stored in Cryosphere. During the warm season, these ice reservoirs feed the rivers of the world. Albedo , which prevents heating of the earth via insolation. These ice sheets/permafrost have trapped within themselves many greenhouse gasses when they were freezing. E.g. Methane, CO2 Their seasonal melting and freezing affects the oceanic circulations . Their melting due to Global warming will affect the global oceanic salinity, further affecting the oceanic circulations. In hilly regions, like the Himalayas, Alps, Andes, etc, the melting of the cryosphere will cause increased GLOF events. Impacts of melting of Cryosphere: Affects thermohaline circulations. Impact on prevailing winds, jet streams Affect freshwater availability (increases in short-term, reduces in long term) Albedo reduces, earth’s heat budget will get affected Release of GHG, thus global warming Release of heavy elements. Increase GLOF events Release of pathogens and micro-organisms Isostatic rebounce and volcanic activity Impact on climate, flora, fauna & economy. How Arctic and Antarctic melting affect us? Arctic: Climatic Impacts Weakening of Polar vortex , and more frequent chilly conditions in North America and Europe Due to the southward movement of cold air masses, more frequent Temperate storms , as these cold air masses meet the warmer air masses at lower latitudes. Impact on Human Activities Opening up of new navigation routes. However, recent studies on the Northwest passenger of Canada have shown that global warming is causing thick ice blocks to flow into this channel from Greenland. This can pose a danger to shipping vessels, reducing the navigability of the shipping passages, at least in the short term. Easing resource exploration in these regions. Change in fish and wildlife patterns , that may affect the local communities and their traditional livelihoods. Increased GLOF events : In Greenland, hundreds of lakes have burst since 2008. According to a latest study, toxic Mercury trapped in the Arctic is now leaking into the environment. (How this mercury reaches the Arctic? Through atmospheric and oceanic circulation) Antarctica: Climate Jet stream weakening can cause changes in weather in South America, southern Africa, and Australia. The weakening of the polar vortex is causing winter season heatwaves here. Some parts of Antarctica, in mid-July had temperatures as high as -25 to -30 degrees Celcius compared to -50 and -60 degrees Celcius. On Humans Will affect research activities in Antarctica. Affect the wildlife in the region (Penguins, seals, microorganisms, etc) Impact of Climate Change on Climate & Oceans Climate Urban Areas: Quarter of global urban population to face 0.5°C temperature increase by 2040. The temperature rise will disproportionately impact vulnerable populations, leading to increased health risks, reduced labor productivity, and greater energy demands for cooling. Increase instances of extreme weather events. Biodiversity 2023 report by the Intergovernmental Panel on Climate Change had warned that if the carbon dioxide emission and global warming continued unabated, the tropical rainforest community may altogether collapse much before the end of this century. According to a BHU study, while increased CO₂ can initially enhance crop growth through the \"CO₂ fertilization effect,\" surpassing certain temperature thresholds due to climate change leads to significant reductions in crop yields. Oceans Increased acidification Increased temperature due to global warming: a r ise in s ea surface temperature from 0.06°C per decade in the 1980s to 0.27°C per decade now. Changes in oceanic circulations, and thus, nutrient circulation."}, {"c": 3, "n": "Oceanography", "id": "s31", "t": "PYQ", "x": "Q.1) What explains the eastward flow of the equatorial counter-current? (2015) (a) The Earth’s rotation on its axis (b) Convergence of the two equatorial currents (c) Difference in salinity of the water (d) Occurrence of the belt of calm near the equator Ans: B The Equatorial Counter Current is an eastward flowing, wind-driven current which extends to depths of 100-150m in the Atlantic, Indian, and Pacific Oceans. As the earth rotates from west to east, water near the equator tends to move from east to west (due to the prevailing winds). This leads to the formation of Equatorial currents, both North and South of the equator. Now, as the North Equatorial Current and South Equatorial Current take the water from east to the western part of the ocean basins, there is a piling up water in the western parts of ocean basins ( or eastern boundaries of land masses near the equator). This piled up water then flows from west to east, under the effect of gravity, resulting in Counter Equatorial Current (CEC). So, while the rotation of the earth is the primary causative factor for Equatorial Currents, it is piling up of water and subsequent backflow (convergence of both equatorial currents) under gravity which causes the eastward flow of CEC. More often called the North Equatorial Countercurrent (NECC), this current flows west-to-east at about 3-10°N in the Atlantic, Indian Ocean and Pacific basins, between the North Equatorial Current (NEC) and the South Equatorial Current (SEC). The NECC is not to be confused with the Equatorial Undercurrent (EUC) that flows eastward along the equator at depths around 200m in the western Pacific rising to 100m in the eastern Pacific. Q.2) Tides occur in oceans and seas due to which among the following? (2015) 1. Gravitational Force of the Sun 2. Gravitational Force of the Moon 3. Centrifugal force of the Earth Select the correct answer using the code given below (a) 1 only (b) 2 and 3 only (c) 1 and 3 only (d) 1, 2, and 3 Ans: D Tides are the rise and fall of sea levels caused by the combined effects of the gravitational forces exerted by the Moon and the Sun, and the rotation of the Earth. The periodical rise and fall of the sea level is known as tide. The Moon's gravitational pull is the major cause of a tide. Sun’s gravitational pull and centrifugal force due to the gravitational pull of the earth to a lesser extent so causes types. Tides are very long waves that move across the oceans. They are caused by the gravitational forces exerted on the earth by the moon, and to a lesser extent, the sun. Gravity pulls the ocean towards the moon and high tide occurs. High tides and low tides are caused by the moon. The moon's gravitational pull generates something called the tidal force. The tidal force causes Earth—and its water—to bulge out on the side closest to the moon and the side farthest from the moon. Q.3) Consider the following statements: 1. In the tropical zone, the western sections of the oceans are warmer than the eastern sections owing to the influence of trade winds. 2. In the temperate Zone, westerlies make the eastern sections of oceans warmer than the western sections Which of the statements given above is/are correct? (2021) (a) 1 only (b) 2 only (c) Both 1 and 2 (d) Neither 1 and 2 Ans.- C Statement 1 is correct. Warmer water is transported westward in the ocean by the Northeast trade winds in the Northern hemisphere of the tropical zone (as the figure given below shows). So, in tropical zones, the western section of ocean is warmer than eastern sections due to trade winds. Statement 2 is correct. Similarly, the Westerlies play an important role in carrying the warm, equatorial waters and winds to the western coasts of continents (that is eastern section of the Oceans in temperate zone). Thus, in temperate zones, westerlies make the eastern section of the ocean warmer than the western sections."}, {"c": 3, "n": "Oceanography", "id": "s32", "t": "CORAL REEFS", "x": "Corals are marine invertebrates , which exist in colonies composed of numerous individual coral polyps , which are tiny, soft-bodied organisms. Corals secrete calcium carbonate to form hard skeletons , which accumulate over time to create large, underwater structures known as coral reefs. These reefs provide habitat and shelter for a diverse range of marine life and are often referred to as the \"rainforests of the sea\" due to their high biodiversity. Corals rely on symbiotic algae called zooxanthellae for energy through photosynthesis, and they thrive in warm, clear, shallow waters with abundant sunlight. Necessary conditions: Warm Water Temperatures: Coral reefs thrive in warm tropical and subtropical waters with temperatures typically ranging between 20°C to 29°C . These temperatures support the growth and reproduction of coral polyps. Clear, Sunlit Waters: Corals require clear, sunlit waters to facilitate photosynthesis by their symbiotic algae (zooxanthellae) , which provides them with essential nutrients and energy. Adequate sunlight penetration is crucial for the growth and survival of corals. Shallow Depths: Most coral reefs develop in shallow water environments, typically less than 50 meters deep. Shallow depths allow corals to access sunlight for photosynthesis and promote the growth of reef-building corals. Stable Salinity Levels: Corals prefer stable salinity levels within the range of 32 to 40 parts per thousand (ppt). Fluctuations in salinity can stress corals and affect their ability to maintain osmotic balance. Low Nutrient Levels: Coral reefs thrive in oligotrophic (nutrient-poor) waters . Excessive nutrient runoff from land-based sources can lead to eutrophication, which promotes the growth of algae that can outcompete corals for space and resources. Moderate Wave Action: Moderate wave action helps to oxygenate the water and remove sediment , promoting coral growth and reef development. However, excessive wave energy from storms or strong currents can damage coral reefs. Other type of Corals: Hard Corals: Also known as stony corals or reef-building corals. Secrete calcium carbonate skeletons, which contribute to the formation of coral reefs. Examples include branching corals like Acropora and massive corals like Porites. Soft Corals:"}, {"c": 3, "n": "Oceanography", "id": "s33", "t": "IMPACTOFCLIMATECHANGEONCORALREEFS", "x": "Lack a hard skeleton and have flexible structures. Often referred to as gorgonians or octocorals. Include sea fans, sea whips, and sea pens. Cold-water Corals: Found in deep, cold waters, including polar regions and temperate seas. Adapted to low light levels and cooler temperatures compared to tropical corals. Examples include species of Lophelia, Paragorgia, and Primnoa. Black Corals: Typically found in deeper waters, ranging from 30 meters to over 300 meters deep. Have a dark appearance due to the presence of a protein called melanin. Often prized for their use in jewelry and ornamental pieces. Found in India in Gulf of Mannar region, along with other corals. Types of Coral Reefs: Fringing Reefs: Found close to the shoreline, directly adjacent to land. Develop along the edges of continental coastlines or islands. Characterized by their shallow depths and proximity to land, with the reef crest often exposed during low tide. They might create small lagoons, known as boat channels . Barrier Reefs: Parallel to the shoreline but separated from land by a lagoon. Form farther offshore compared to fringing reefs and are separated from the mainland by a deep lagoon. Barrier reefs can stretch for long distances and are often associated with large oceanic islands or continental landmasses. Atolls: Circular or horseshoe-shaped reefs surrounding a central lagoon. Formed from the gradual subsidence of volcanic islands or seamounts over time, leaving behind a ring-shaped coral reef. Atolls are often found in the open ocean, far from continental landmasses, and may contain several small islands or islets within the lagoon. Coral Bleaching: Coral bleaching occurs when corals expel the symbiotic algae (zooxanthellae) living within their tissues , leading to a loss of color and vital nutrients. Bleached corals appear white or pale due to the loss of pigmented algae. This may be temporary or permanent. Bleaching weakens corals and can lead to their death if the stress is prolonged. Factors Responsible for this: Elevated Water Temperatures : High water temperatures, particularly during periods of ocean warming associated with climate change, can trigger coral bleaching. Ocean Acidification: Increased carbon dioxide levels in the atmosphere lead to ocean acidification, which can weaken coral skeletons and make them more susceptible to bleaching. Pollution: Pollution from agricultural runoff, sewage, and coastal development can increase stress on corals and contribute to bleaching events. UV Radiation: Excessive exposure to ultraviolet (UV) radiation, often exacerbated by clear skies and calm seas, can also induce coral bleaching. Tectonic Activity: Sudden exposure of the corals above the sea level due to land upliftment. Or drowning of corals to non-photic zones due to subsidence. Overfishing: Fish help keep coral reefs clean. If they are removed, sediments and non-useful algae start accumulating over the corals and suffocate them. Diseases: Pathogenic diseases may also at times force the coral polyps to expel the zooxanthellae. Irresponsible Tourism: This may cause pollution, sedimentation, and in certain cases diseases in the corals. Massive coral bleaching event is ongoing since Jan 2023. IMPACT OF CLIMATE CHANGE ON CORAL REEFS Coral Bleaching: Rising sea temperatures due to global warming are the primary culprit. Bleached corals are weakened and more susceptible to diseases. Example: The Great Barrier Reef in Australia has experienced large-scale bleaching events in recent years, jeopardizing its vast coral ecosystems. Currently, 4th mass bleaching event going on since Feb 2023. Ocean Acidification: Increased absorption of carbon dioxide from the atmosphere by the oceans leads to acidification. This makes it harder for corals to build their calcium carbonate skeletons, hindering their growth and survival. Example: Coral reefs in Florida, USA, have shown signs of reduced growth and weakened skeletons due to ocean acidification. Increased Stor"}, {"c": 3, "n": "Oceanography", "id": "s34", "t": "OCEANIC DEPOSITS", "x": "Terrigenous Deposits: Derived from land-based sources , such as rivers, glaciers, and wind-blown dust. Found primarily on continental margins , including continental shelves and slopes. Examples include sand, silt, and clay, as well as larger particles like gravel and boulders. Biogenous Deposits : Composed of remains of marine organisms , such as shells, skeletons, and coral fragments. Accumulate on the seafloor over long periods. Found in both shallow and deep ocean environments , including continental shelves, slopes, and abyssal plains. Biogenous deposits include : Calcareous Ooze : Composed primarily of calcium carbonate shells and skeletons of foraminifera, coccolithophores, and other calcareous organisms. Found in warmer, shallower waters. Siliceous Ooze : Made up of silica-based remains of diatoms, radiolarians, and sponge spicules. Found in colder, deeper waters. Hydrogenous Deposits: Formed through chemical precipitation from seawater . Found in various oceanic environments , including continental shelves, slopes, and deep-sea hydrothermal vent areas. Examples include: Manganese Nodules : Formed of manganese, iron, and other metals precipitated from seawater onto the seafloor. Phosphorite Deposits : Consist of phosphate minerals precipitated from marine sediments. Cosmogenous Deposits: Derived from extraterrestrial sources , such as meteorites and interplanetary dust. Found distributed throughout the oceans , with higher concentrations in deep-sea environments. Examples include microscopic meteorite particles and cosmic dust grains."}, {"c": 3, "n": "Oceanography", "id": "s39", "t": "HowtoCombat?", "x": "Dead zones, also known as hypoxic zones , are areas in oceans and large lakes where oxygen levels become so low that most marine life cannot survive. Causes: The primary culprit behind dead zones is nutrient pollution , particularly excess nitrogen and phosphorus. This pollution often comes from: Agricultural runoff: Fertilizers used in farming can be washed away by rain, carrying these nutrients into rivers and ultimately into coastal waters. Sewage discharge: Untreated or inadequately treated sewage can also contribute excess nutrients. Industrial waste: Certain industries may release nitrogen and phosphorus into waterways. Wind Deposits: A massive algal bloom off the coast of Madagascar was triggered by dust blown from drought-stricken regions of southern Africa. The dust contained nutrients like iron and phosphorus that acted like fertilizers. Formation: When these nutrients reach coastal waters, they trigger a rapid growth of algae. This phenomenon is called an algal bloom . As the algae die and decompose, they sink to the bottom, where they are consumed by bacteria. This bacterial decomposition process consumes a large amount of oxygen dissolved in the water. Consequences: The spread of dead zones poses a serious threat to marine ecosystems, with cascading effects: Loss of Marine Life: When oxygen levels become depleted, fish, shrimp, and other marine organisms suffocate and die. This disrupts the food chain and can lead to ecosystem collapse. Dead zones can become \"ecological graveyards\" devoid of most marine life. Economic Damage: Dead zones can have a significant economic impact on fisheries, tourism, and other industries that rely on healthy marine ecosystems. As fish populations decline, fishing communities suffer economic losses, and tourism to affected areas can decrease. Public Health Risks: Decomposition of organic matter in dead zones can release harmful toxins and bacteria. This can contaminate seafood and pose a risk to human health if affected fish are consumed. Examples: Northern Gulf of Mexico: One of the world's largest dead zones occurs annually in the Gulf of Mexico, primarily due to agricultural runoff from the Mississippi River basin. Baltic Sea: This semi-enclosed sea suffers from chronic oxygen depletion due to nutrient pollution from surrounding countries. Black Sea: The Black Sea has a naturally occurring dead zone in its deep waters due to limited circulation and high organic matter content. How to Combat? Reducing Nutrient Pollution: Implementing stricter regulations on agricultural practices, improving wastewater treatment, and promoting sustainable farming methods are essential to curb nutrient runoff. Monitoring and Management: Regular monitoring of water quality and implementing measures to manage nutrient loads in vulnerable areas can help prevent dead zone formation. Public Awareness: Raising public awareness about the causes and impacts of dead zones is essential for promoting behavioral changes and supporting policies that address this environmental threat."}, {"c": 3, "n": "Oceanography", "id": "s40", "t": "OCEAN RESOURCES:", "x": "Biotic Resources: Edible Resources: Fish: Tuna and salmon are abundant in the Pacific Ocean, while cod fisheries are prominent in the North Atlantic. Sardines are found in the Mediterranean Sea and off the coast of Peru. Shellfish: Shrimp and crabs are harvested in the Gulf of Mexico and along the coast of Alaska. Lobsters are abundant in the waters of Maine and the North Atlantic, while oysters are farmed in the Chesapeake Bay and along the Gulf Coast. Seaweed: Japan is a major producer of seaweed, particularly nori, used in sushi. Other countries like China, Korea, and Indonesia also cultivate seaweed for culinary and industrial purposes. Non-Edible Resources: Marine Pharmaceuticals: Marine organisms from coral reefs in the Caribbean and the Great Barrier Reef in Australia have been studied for their potential pharmaceutical properties. Coral Reefs: The Great Barrier Reef in Australia, the Coral Triangle in Southeast Asia, and the Caribbean Sea are renowned for their rich coral reef ecosystems. Pearls: Pearl farming occurs in regions like the South Pacific, particularly in countries like Japan, China, and Indonesia, where pearl oysters are cultivated for their pearls. Seal and Whale Products: Seal fur and whale blubber have historically been harvested in regions such as the Arctic and Antarctic, though regulations have limited commercial harvesting in recent years. Non-Biotic Resources: Energy Resources: Oil and Gas: Offshore oil and gas reserves are found in regions such as the North Sea, the Gulf of Mexico, and the Persian Gulf. Renewable Energy: Tidal energy, Ocean Thermal Energy Conversion, Wave energy; Offshore wind farms are located in the North Sea, the Baltic Sea, and along the coastlines of countries like the United Kingdom, Germany, and Denmark. Wave energy converters are being tested in regions with strong wave action, such as the Pacific Northwest and the Atlantic coast of the United States. Mineral Resources: Dissolves salts , especially NaCl. Manganese Nodules (Poly-Metallic Nodules): Found on the abyssal plains of the Pacific Ocean, particularly in the Clarion-Clipperton Zone. Recent discovery states that these nodules, also known as Polymetallic nodules, are an important source of “dark oxygen”, sustaining the life in the ocean bottom regions. Phosphorite Deposits: Located off the coast of countries like Morocco, Peru, and the United States, where upwelling currents bring nutrient-rich waters to the surface. Intangible Resources Regulating Services (Environmental Balance) Climate regulation : Oceans absorb ~90% of the excess heat trapped by greenhouse gases. Carbon sink : Absorb ~25–30% of anthropogenic CO₂; “blue carbon” ecosystems like mangroves and seagrass sequester it long-term. In fact, recent research has shown that the ocean's surface absorbs significantly more carbon dioxide than previously believed, especially the upper layers. Heat & circulation regulation : Ocean currents redistribute heat, influencing monsoons and global climate. Weather & water cycle regulation : Evaporation drives rainfall, storms, and global hydrological balance. Coastal protection : Coral reefs, mangroves, wetlands reduce storm surges, erosion, and flooding. Cultural & Recreational Services Tourism & recreation : Beaches, diving, surfing, cruises fuel coastal economies. Cultural & spiritual values : Sacred seascapes, heritage of coastal communities. Education & research : Source of marine knowledge, climate science, biodiversity studies. Aesthetic & inspiration : Oceans inspire literature, art, and human imagination. Supporting Services (Underlying Systems) Oxygen production : Phytoplankton generate 50–60% of Earth’s oxygen . Biodiversity hotspots : Coral reefs, estuaries, deep-sea vents harbor immense species diversity. Nutrient cycling : Recycle nitrogen, phosphorus, and carbon essential for global food webs. Habitat provision : Support breeding, nursery, and migratory grounds for marine life."}, {"c": 3, "n": "Oceanography", "id": "s41", "t": "LAW OF SEA", "x": "The Law of the Sea refers to a body of international law that governs the use of the world's oceans and seas. It encompasses rules and principles regarding maritime boundaries, navigation, exploitation of marine resources, conservation, and protection of the marine environment. United Nations Convention on the Law of the Sea (UNCLOS): Adopted in 1982 , UNCLOS is the primary international legal framework governing the rights and responsibilities of states in maritime zones. It establishes rules on maritime boundaries, navigation, marine resources, and the protection of the marine environment. Components: Territorial Sea: A belt of water adjacent to a coastal state's land territory, usually extending up to 12 nautical miles (22.2 kilometres ) from the baseline. Contiguous Zone : A zone adjacent to the territorial sea, extending up to 24 nautical miles (44.4 kilometres) from the baseline, where a coastal state may exercise limited control to prevent and punish violations of its customs, fiscal, immigration, or sanitary laws and regulations within its territory or territorial sea. Exclusive Economic Zone (EEZ): An area extending up to 200 nautical miles (370.4 kilometres) from a coastal state's baseline, within which the state has sovereign rights over the exploration and exploitation of natural resources. High Seas: Areas of the ocean beyond the jurisdiction of any state, where all states enjoy freedoms such as navigation, overflight, fishing, and scientific research."}, {"c": 3, "n": "Oceanography", "id": "s42", "t": "PYQ", "x": "Q.1) The most important fishing grounds of the world are found in the regions where: (2013) (a) Warm and cold atmospheric currents meet (b) Rivers drain out large amounts of fresh water into the sea (c) Warm and cold oceanic currents meet (d) Continental shelf is undulating Ans.- C Reasons that determining Fishing grounds The location of major world fishing grounds is governed by many factors: Abundance of plankton coastal waters are beneficial to fish in more than one way— There is plentiful food supply from the erosion of continents, which provide mineral and organic matter. There is enough sunlight penetration, which is critical to the photosynthesis process required by plants. Areas where warm and cold currents meet tend to have high biological productivity, because plankton growth is encouraged by the mixing of cold currents and warm currents. Some of the world’s most productive fishing grounds are located here, where warm and cold currents converge. Examples of these phenomena are the Newfoundland 'banks' and the Sea of Japan. In areas of coastal upwelling high rates of primary production takes place. Conventional mixing provides plenty of oxygen to sustain life in coastal zones as well as assuring a favourable dispersion of nutrients. Broken coastline with numerous indentations provides excellent berthing facility. Accessible forest resources, which favour the manufacture of fishing boats, jetties, etc. The character of land: Rugged land, which hinders the development of other activities like agriculture and forces the people to go for fishing. Climatic condition: Temperate climate with a temperature of less than 20°C is the best region for marine life."}, {"c": 3, "n": "Oceanography · quick", "id": "q-1-oceans-and-their-relief", "t": "1 · Oceans and their relief", "x": "Basics: hydrosphere ≈ 71% of Earth's surface · 5 oceans: Pacific, Atlantic, Indian, Arctic, Southern · average ocean depth 3,800 m vs average land height 840 m. 🏠 Ocean floor = a house, from the beach inwards: Part House picture Facts Continental shelf front porch gentle 1–2°; to ~200 m (up to 500 m); continental crust + sediment; oil & gas, fisheries; North Sea, Gulf of Mexico; Great Barrier Reef (>2,300 km) Continental slope steep stairs 3–6° (up to 25°); ~200–3,000 m; submarine canyons (Monterey, Hudson); Blake Plateau Continental rise landing gentle sediment apron at slope base; Amazon rise Abyssal (deep-sea) plain living-room floor > 2,000 m (2,000–6,000+); flat, fine sediment; polymetallic nodules – Clarion–Clipperton Zone (Hawaii–Mexico) Trench cellar > 6,000 m; convergent boundaries; subduction, quakes; Mariana Trench Seamounts: ≥ 1,000 m underwater volcanoes (Davidson). Guyots (table mounts): flat-topped seamounts, wave-eroded then submerged (Emperor Seamounts). Hydrothermal vents: mineral-rich water; black smokers; life may have begun here. Terms (with the handout's examples): Strait – Palk · Isthmus – Kra · Archipelago – Japanese · Lake – Baikal, Wular · Bay – Bengal · Cape – Comorin (Kanyakumari; southernmost tip of the Peninsula), Good Hope · Lagoon – Chilika (brackish) · Gulf – Kutch · Peninsula – Indian."}, {"c": 3, "n": "Oceanography · quick", "id": "q-2-temperature-salinity-density", "t": "2 · Temperature, salinity, density", "x": "Temperature Salinity Density Key numbers 26.7 °C equatorial mean; 12.7 °C at 45° N/S; deep ocean 2–4 °C; mixed layer to 200–400 m; thermocline = rapid fall deep ocean ≈ 34.7 ppt; Great Salt Lake 220 · Dead Sea 240 · Lake Van 330 cold > warm; high salinity > low; deep > surface Pattern warmest at equator; Indian Ocean warmest; N. Hemisphere warmer (more land) highest at ~20–30° (subtropics): high evaporation, little rain; lower at equator & poles temperature matters more than salinity Factors latitude, currents (Gulf Stream, Kuroshio warm), atmospheric circulation, continentality, depth, season evaporation/precipitation, river inflow, sea-ice (freezing leaves salt behind), currents (Gulf Stream saline; Labrador cold fresher), winds temperature, salinity, pressure 🧂 Salt rule: \"Sun + No Rain = Salty.\" Subtropics (hot, dry) are saltiest; equator and poles are diluted. Enclosed seas keep getting saltier (rivers add salt, evaporation removes water): 220 – 240 – 330 = Great Salt Lake → Dead Sea → Lake Van. Continentality twist: a sea ringed by land is warmer – land \"extremes\" the sea just as sea moderates the land. Ocean acidification: pH 8.2 (pre-industrial) → 8.11 (1985) → 8.04 (2024); ~30% more acidic in 200 yrs. More in the Arctic than tropics (cold water absorbs more CO₂). Causes: CO₂ dissolving, volcanoes, agricultural runoff. Effects: coral bleaching, weaker shells, changes in phytoplankton. Mains 2017 (15m) skeleton – salinity. Intro: salinity = dissolved salts (avg ~35 ppt, deep 34.7). Body (variation): latitude (subtropical high), evaporation vs rain, rivers, sea ice, currents, inland seas (220/240/330). Effects: controls density → thermohaline circulation, stratification (halocline), nutrient distribution, marine habitats and productivity. Close: freshwater from melting ice is now altering salinity and circulation. Freshwater PYQs. 2013 (ans C): after ice caps/glaciers, the largest share of freshwater is groundwater. 2021 (ans B): ice caps and glaciers hold more than groundwater (≈69% vs 30%); rivers and lakes ≈ 1% (handout also gives 0.3% for surface water). Only ~3% of Earth's water is fresh."}, {"c": 3, "n": "Oceanography · quick", "id": "q-3-ocean-currents", "t": "3 · Ocean currents", "x": "🌀 West = Warm & Wild; East = cold & Easygoing. Western boundary currents (Gulf Stream, Kuroshio, Brazil, East Australian, Agulhas): warm, narrow, fast, strong. Eastern boundary currents (Canary, Benguela, California, Peru, West Australian): cold, broad, slow, upwelling nutrient-rich water. Gyres: N. Hemisphere clockwise, S. Hemisphere anticlockwise (Coriolis). Indian Ocean gyre is anticlockwise. Surface currents (top ~400 m, only ~10% of ocean water; wind-driven) vs deep (thermoh
