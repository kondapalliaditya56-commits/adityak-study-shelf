s Mid-Atlantic ridge : Iceland (above sea surface presence) Great African Rift : Mt. Kilimanjaro; Mt. Kenya; Other Volcanoes o Africa : Mt. Cameroon (only active volcano in West Africa) o West Indies : Mt Pelee o Mediterranean : Spain to Caucasus; Alps: Vesuvius, Stromboli; Asia Minor: Ararat, Elburz No volcanoes in Australia Only one active lava volcano in South Asia: Barren Island, India. Mud Volcano in South Asia: Chandragup, Pakistan. Does not emit any lava or pyroclast, so not a true volcano. Volcanoes in India: o Narcondam island and Barren Island are volcanic islands of India, of them, the latter is active. Erupted last in 2022. o Baratang: Only mud volcano of India. o No volcanoes in the Himalayas, as it is a continent-continent collision boundary. o There is a mud volcano “Chandragup” located in Balochistan, Pakistan."}, {"c": 1, "n": "Geomorphology", "id": "s56", "t": "Volcanic Landforms:", "x": "Extrusive: above earth’s surface Conical vents and fissure vents (basaltic plateaus) Mid-Oceanic Ridges Pyroclastic Debris, Caldera & Crater Lakes (E.g. Crater Lake, Oregon); Intrusive: Inside Earth’s surface Appear on Earth’s surface after erosion has removed the upper layers. Massive: Batholiths or Plutons . Large rock masses formed due to the cooling down and the solidification of hot magma inside the earth. E.g. Mt. Wicklow of Ireland Smaller: Horizontal: Sill ( Horizontal; E.g. Great Whin Sill, England), Laccolith ( dome-shaped ; E.g. Henry Mountains, Utah, USA), Lopolith ( saucer-shaped ; E.g. Transvaal, South Africa), Phacolith ( wavy ; E.g. Cordon Hill, USA) Vertical: Dyke E.g. Alaskan Dyke, USA."}, {"c": 1, "n": "Geomorphology", "id": "s57", "t": "Types of Volcanoes:", "x": "On the basis of the frequency of eruption: Active : erupt fairly frequently. E.g. Mt. St. Helena, USA; Mt. Merapi, Indonesia. Dormant : No eruption recently but can erupt. E.g. Mt. Vesuvius was dormant before it erupted in 79 AD. Extinct : No eruptions in the recorded history. E.g. Narcondam. On the basis of structure: Cinder cones : Small, steep-sided, conical volcanic landforms built primarily from pyroclastic fragments like cinders. These volcanoes form through explosive eruptions of gas-rich basaltic magma, creating a distinctive and relatively simple structure. Cinder cones often have relatively short lifespans compared to other types of volcanoes, as their eruptions tend to be singular events rather than prolonged periods of volcanic activity. Composite (Stratovolcanoes): A special type of Composite volcano is a caldera volcano. Shield On the basis of Eruption Icelandic : fissure type; basaltic lava Hawaiian : similar to Icelandic. Difference: Hawaiian eruptions have the greatest quantity of lava pouring out of the main vent at the volcano's summit, not alongside fissures. Strombolian : short-lived explosive eruptions releasing pasty lava into the air along with bursts of steam and gas. Vulcanian : more violent than Strombolian. Along with pasty lava, creates high dark clouds of steam, ash, and gas. (Cauliflower cloud) Pelean: Most dangerous and explosive. Release \"Glowing clouds\" of gas and ash. Plinian : Most explosive. Very high ash clouds that rise upwards to 50,000 feet (almost 10 miles) high. Very deadly pyroclastic flows. Vulcanian, Pelean and Plinian volcanoes release huge amount of Pyroclastic material that acts as Hygroscopic Nucleii, helping in creation of raindrops. The force of the volcano, pushes the air up, causing updraft. A combination of these processes, causes often thunderstorms and rainfall after the volcanoes take place. The rainwater gets mixed with the Pyroclastic mud, and create mudflows called LAHARS."}, {"c": 1, "n": "Geomorphology", "id": "s58", "t": "Mantle Plumes & Hotspots:", "x": "Region within the Earth’s mantle from which heat rises through the process of convection. This rising arm = Mantle Plume. This does not occur at plate boundaries. It is an intra-plate event . Cause Hotspot Volcanism o A volcano above a hotspot does not erupt forever . Attached to the tectonic plate below, the volcano moves and is eventually cut off from the hot spot. o Without any source of heat, the volcano becomes extinct and cools. o According to the latest studies, which are yet to be accepted by geologists, hotspots may be the first stage in the formation of diverging plate boundaries. Azores Island: They are created both due to hotspot activity as well as the action of the Mid-Atlantic ridge. Create island chains. E.g. Hawaii Reunion Hotspot: o Believed to be active for over 65 million years . o Reunion Island is over reunion hotspot. o When the Indian plate moved over the Reunion hotspot, Deccan traps were created."}, {"c": 1, "n": "Geomorphology", "id": "s59", "t": "PYQ", "x": "Q.1) Consider the following : (2024) Pyroclastic debris Ash and dust Nitrogen compounds Sulphur compounds How many of the above are products of volcanic eruptions? Only one Only two Only three All four Answer : (d) All four"}, {"c": 1, "n": "Geomorphology", "id": "s61", "t": "MOUNTAIN BUILDING", "x": "Process known as Orogeny . Types: On basis of Location: Continental, Coastal, Oceanic (Ridge or Hotspots) On Basis of formation: Residual, Fold, Fault, Volcanic"}, {"c": 1, "n": "Geomorphology", "id": "s63", "t": "FOLD MOUNTAINS", "x": "Fold mountains are formed when sedimentary rock strata are subjected to compressive forces . They are the loftiest mountains. The Young Fold Mountains are found near the active converging boundaries . E.g. Himalayas (India-Eurasia convergence); Alps & Atlas (Eurasia, Africa); Andes (South America & Pacific), etc. This is the reason why there are seismic and volcanic activities seen here. There are old fold mountains too which were formed millions of years ago at the active plate boundaries of that time. E.g. Appalachians (USA), Aravallis (India)"}, {"c": 1, "n": "Geomorphology", "id": "s64", "t": "BLOCK MOUNTAINS", "x": "Block mountains are created when large areas or blocks of earth are broken and displaced vertically. Formed due to dip-slip faults (vertical displacement) . Block mountains are also called fault block mountains since they are formed due to faulting as a result of tensile and compressive forces. The uplifted blocks are termed as horsts and the lowered blocks are called graben . The Great African Rift Valley (valley floor is graben and Mitumba & Muchinga mountains are horsts), The Rhine Valley and the Vosges mountain in Europe are examples. There are two basic types . Tilted block mountains have one steep side contrasted by a gentle slope on the other side. Lifted block mountains have a flat top and extremely steep slopes"}, {"c": 1, "n": "Geomorphology", "id": "s65", "t": "VOLCANIC MOUNTAINS", "x": "Volcanic mountains are formed due to volcanic activity . Materials including molten lava, volcanic bombs, cinders, ashes, dust and liquid mud fall around the vent in successive layers, building up a characteristic volcanic cone. Volcanic mountains are often called mountains of accumulation . They are common in the Circum-Pacific belt and include such volcanic peaks as Mt. Fuji (Japan) Mt. Mayon (Philippines), Mt. Merapi (Sumatra), Mt. Etna (Italy) etc."}, {"c": 1, "n": "Geomorphology", "id": "s66", "t": "RESIDUAL MOUNTAINS", "x": "The mountains left after erosional activities have eroded the majority portion of the erstwhile fold/fault/volcanic mountains. Basically, they evolve from denudation. E.g. Monadnock mts. In the USA."}, {"c": 1, "n": "Geomorphology", "id": "s67", "t": "ISOSTASY", "x": "Equilibrium between the Earth's lithosphere and asthenosphere. Balance between buoyant force and gravitational force. When weight is added or removed, such as through erosion or mountain building, the crust responds by subsiding or uplifting to achieve isostatic equilibrium. The Isostatic re-adjustments can be due to both Tectonic factors (subsidence & Upliftment) , as well as Climatic Factors (addition or melting of snow) . Can cause earthquakes . Scientists have predicted that they can also be responsible for the reactivation of volcanoes in Antarctica , as the ice melts, the lithosphere rebounds, cracks get created, and magma might pour out."}, {"c": 1, "n": "Geomorphology", "id": "s70", "t": "ROCKS", "x": "Igneous Rocks: Formed out of magma and lava and are known as primary rocks . Having their origin under conditions of high temperatures , the igneous rocks are not fossiliferous. Granite, gabbro, pegmatite, basalt , etc. are some of the examples of igneous rocks. Based on place and time taken in cooling of the molten matter, igneous rocks can be divided into: Plutonic Rocks or intrusive rocks Lava or Volcanic Rocks or Extrusive rocks If molten material is cooled slowly at great depths (plutonic/intrusive), mineral grains may be very large. Sudden cooling (at the surface) results in small and smooth grains. (extrusive igneous) Acid igneous rocks, such as granite, are less dense and are lighter in colour than basic rocks. Economic Significance: Since magma is the chief source of metal ores , many of them are associated with igneous rocks. The minerals of great economic value found in igneous rocks are magnetic iron, nickel, copper, lead, zinc, chromite, manganese, gold, diamond and platinum. Amygdales are almond-shaped bubbles formed in basalt due to escape of gases and are filled with minerals like Copper. Many igneous rocks like granite are used as building material as they come in beautiful shades. Source of fertile soils like Black Soil. Sedimentary Rocks: These rocks consist of a number of layers or strata. These rocks have fossils of plants and animals. These rocks are generally porous and allow water to percolate through them. Contain petroleum, natural gas, placer deposits. Formed as a result of denudation (weathering and erosion). These deposits through compaction turn into rocks . This process is called lithification. Cover 75 percent of the earth’s crust but volumetrically occupy only 5 per cent. They are layered or stratified of varying thickness. Example: sandstone, shale etc. Till or Tillite: Ice deposited sedimentary rocks. Loess: Wind deposited sediments. Depending upon the mode of formation ,Sedimentary rocks are classified into Mechanically formed : Sandstone, conglomerate, shale, loess etc. Organically formed : Geyserite, chalk, limestone, coal etc. Chemically formed : Chert, limestone, halite, potash etc. Economic Significance: Sedimentary rocks are not as rich in minerals of economic value as the igneous rocks. But some important minerals such as hematite iron ore, phosphates, building stones, coals, petroleum and material used in cement industry like limestone are found. The decay of tiny marine organisms yields petroleum. Petroleum occurs in suitable structures only. Important minerals like bauxite, manganese, tin are derived from other rocks but are found in gravels and sands carried by water. (PLACER DEPOSITS) Sedimentary rocks also yield some of the richest soils. Metamorphic Rocks The word metamorphic means ‘change of form’ . Form under the action of pressure, volume and temperature (PVT) changes. Metamorphism occurs when rocks are forced down to lower levels by tectonic processes or when molten magma rising through the crust comes in contact with the crustal rocks. Metamorphism is a process by which already consolidated rocks undergo recrystallization and reorganization of materials takes place. In the process of metamorphism in some rocks grains or minerals get arranged in layers or lines . Such an arrangement is called foliation or lineation . Sometimes minerals or materials of different groups are arranged into alternating thin to thick layers . Such a structure is called banding. Gneissoid, slate, schist, marble, quartzite etc. are some examples of metamorphic rocks. May or may not have strata and fossils. On the basis of the agency of metamorphism, metamorphic rocks can be of two types: Thermal Metamorphism: The change of form or re-crystallisation of minerals of sedimentary and igneous rocks under the influence of high temperatures is known as thermal metamorphism. (hot magma, hot gases, vapours and liquids, geothermal heat, etc.) Dynamic Metamorphism : This refers to the formation of metamorphic"}, {"c": 1, "n": "Geomorphology", "id": "s71", "t": "Rock Cycle:", "x": "Rock cycle is a continuous process through which old rocks are transformed into new ones . Igneous rocks are primary rocks and other rocks form from these rocks. Igneous rocks can be changed into sedimentary or metamorphic rocks. The fragments derived out of igneous and metamorphic rocks form into sedimentary rocks. Sedimentary and igneous rocks themselves can turn into metamorphic rocks The crustal rocks (igneous, metamorphic and sedimentary) may be carried down into the mantle (interior of the earth) through subduction process and the same melt down and turn into molten magma, the original source for igneous rocks."}, {"c": 1, "n": "Geomorphology", "id": "s72", "t": "SOME IMPORTANT MINERALS", "x": "The numbers in the \"Hardness/Softness\" column of the table refer to the Mohs Hardness Scale, a qualitative scale for measuring the scratch resistance of minerals. The scale ranges from 1 to 10, with 1 being the softest and 10 being the hardest."}, {"c": 1, "n": "Geomorphology", "id": "s73", "t": "PYQ", "x": "Q.1) Describe the characteristics and types of primary rocks. (2022, 10m)"}, {"c": 1, "n": "Geomorphology", "id": "s75", "t": "EROSION", "x": "Removal, transportation and deposition of Earth Material. TRANSPORTATION is what differentiates it from weathering. Agents of Erosion: Flowing water; Underground water; Wind; Glaciers; Coastal Waves Cycles of Erosion: o Fluvial landforms and Cycle of Erosion o Glacial landforms and Cycle of Erosion o Marine landforms and Cycle of Erosion o Arid landforms and Cycle of Erosion o Karst landforms and Cycle of Erosion"}, {"c": 1, "n": "Geomorphology", "id": "s76", "t": "Fluvial Erosion:", "x": "Terms associated with Fluvial Erosion: How does water erode? Hydraulic Action : the force of running water wearing down rocks. Corrosion : chemical action that leads to weathering. Attrition : river load particles striking, colliding against each other and breaking down in the process. Corrasion or abrasion : solid river load striking against rocks and wearing them down. Classification of erosion based on the location: Downcutting (vertical erosion) : the erosion of the base of a stream (downcutting leads to valley deepening ). Lateral erosion : the erosion of the walls of a stream (leads to valley widening ). Headward erosion : erosion at the origin of a stream channel, which causes the origin to move back away from the direction of the stream flow, and so causes the stream channel to lengthen. It is responsible for river Piracy . Evolution of Fluvial Erosion: Splash : A drop of water falls on the surface and disturbs the sediments, creating a tiny crater due to its kinetic energy. Sheet: A sheet of water flows over the surface, and carries away the loose sediments of the topsoil. Rills, Gullies & Valleys: After the sheet erosion, the areas with weaker rocks, or with rock joints, get more eroded than the rest. This creates small, narrow channels called Rills. Rills grow to form Gullies, which grow to form Valleys. Stages of Erosion: Youth stage: Young rivers close to their source tend to be fast-flowing, high-energy environments with rapid headward erosion , despite the hardness of the rock over which they may flow. Steep-sided \"V-shaped' valleys, waterfalls, and rapids are characteristic features. Mature stage: Mature rivers are lower-energy systems . Erosion takes place on the outside of bends, creating looping meanders in the soft alluvium of the river plain. Deposition occurs on the inside of the bends and the riverbed. Old Stage: At a river's mouth (C), sediment is deposited as the velocity of the river slows. As the river becomes shallower more deposition occurs, forming islands and braiding the main channel into multiple, narrower channels. As the sediment is laid down, the actual mouth of the river moves away from the source into the sea or lake, forming a delta. Valley Formation: The extended depression on the ground through which a stream flows throughout its course is called a river valley. At different stages of the erosional cycle, the valley acquires different profiles. At a young stage , the valley is deep and narrow with steep wall-like sides and a convex slope. The erosional action here is characterized by a predominantly vertical downcutting nature. The profile of the valley here is typically ‘V’ shaped. A deep and steeper valley is also referred to as a gorge and may result in downcutting erosion because of the recession of a waterfall. A gorge is a valley which is much narrower compared to its depth. Antecedent rivers like the Indus and Brahmaputra form gorges at Nanga Parbat and Namche Barwa respectively. It is characterized by cliffs or steep walls, and it is usually formed by more intense erosional forces, such as the rapid erosion of a river through resistant rock. A gorge is typically considered a narrower and steeper landform , whereas a canyon is broader with more open valley walls. However, there is no universally strict scientific boundary between the two, and regional usage often overlaps. The Grand Canyon of the Colorado River in Arizona (USA) runs for 483 km and has a depth of 2.88 km. A tributary valley lies above the main valley and is separated from it by a steep slope down which the stream may flow as a waterfall or a series of rapids. As the cycle attains maturity, the lateral erosion becomes prominent, and the valley floor flattens out . The valley profile now becomes typically ‘U’ shaped with a broad base and a concave slope. Major Erosional Fluvial Landforms: Waterfall: A waterfall is simply the fall of an enormous volume of water from a great height. They are mostly seen in the youth s"}, {"c": 1, "n": "Geomorphology", "id": "s77", "t": "Drainage Patterns:", "x": "The typical shape of a river course as it completes its erosional cycle is referred to as the drainage pattern of a stream. A drainage pattern reflects the structure of basal rocks, resistance and strength, cracks or joints and tectonic irregularity, if any. Dendritic or Pinnate: This is an irregular tree branch-shaped pattern. Examples: Indus, Godavari, Mahanadi, Cauvery, Krishna Trellis: In this type of pattern, the short tributaries meet the mainstream at right angles , and differential erosion through soft rocks paves the way for tributaries. Examples: The Seine and its tributaries in the Paris basin (France). Rectangular: The mainstream bends at right angles and the tributaries join at right angles creating rectangular patterns. E.g. Colorado River in the USA, and Mahanadi River in India. Angular : The tributaries join the mainstream at acute angles. This pattern is common in Himalayan foothill regions. Parallel: The streams/tributaries seem to be running parallel to each other in a uniformly sloping region. Example: rivers of lesser Himalayas. Radial: The tributaries from a summit follow the slope downwards and drain down in all directions. Examples: The Central French Plateau, Mt. Kilimanjaro, Amarkantak and Saurashtra region are good examples of radial drainage in India. Annular: When the upland has an outer soft stratum, the radial streams develop subsequent tributaries which try to follow a circular drainage around the summit. Example: Black Hill streams of South Dakota Centripetal: In a low-lying basin the streams converge from all sides. Examples: streams of Ladakh, Tibet, and the Bagmati and its tributaries in Nepal."}, {"c": 1, "n": "Geomorphology", "id": "s78", "t": "KARST CYCLE:", "x": "Terminologies associated with Groundwater: Groundwater: Water that percolates into soil and rock pores. Porous Rocks: Rocks which have a lot of pore spaces between their grains. E.g. sandstone Permeable/Pervious Rocks: Rocks that allow water to pass through them easily. Most (but not all) porous rocks are permeable. E.g. Clay: highly porous, but the pores are not big enough to allow easy movement of water. Aquifer : A geological formation that can store and transmit water. Water Table : The upper surface of the zone of saturation in an aquifer, where the pressure is equal to atmospheric pressure. Confined Aquifer : An aquifer overlain by an impermeable layer, causing the water to be under pressure. Unconfined Aquifer : An aquifer without an overlying impermeable layer, where the water table is open to the atmosphere. Artesian Well : A well drilled into a confined aquifer where the water pressure allows it to rise without pumping. Groundwater Springs : Natural discharge points where groundwater flows to the surface, typically occurring where the water table intersects the ground. Perched Water Table : A localized zone of saturation above the main water table, formed by an impermeable layer. Karst Cycle Named after a province of Yugoslavia (now Slovenia) on the Adriatic Sea coast where such formations are most noticeable. In locations with thick deposits of Limestone dolomite or gypsum . These rocks should be dense, highly jointed and thickly bedded Erosional Features: Sinkholes/Swallow holes: Sinkholes are funnel-shaped depressions having an average depth of three to nine meters. These holes are developed by enlargement of the cracks found in such rocks, as a result of continuous solvent action of the rainwater . The surface streams that sink disappear underground through swallow holes. Larger sinkholes can be called Dolines, Uvalas and Polje (faulting+erosion) . Lappies: usually formed when the limestones are vertically bedded . Lappies are uneven grooves and ridges that form when the majority of the limestone's surface is removed by the solution process. Deep grooves separate the etched, fluted, and pitted rock pinnacles that make up the weathered limestone surface seen in the karst region. Karst Windows: When several adjoining sinkholes collapse , they form an open, broad area called a karst window. Karst Arch/Bridge: When a part of the cavern collapses the portion which keeps standing forms an arch. Karst Cave: This is an underground cave formed by water action by various methods in a limestone or chalk area. Blind Valley: A stephead valley, or blind valley is a deep, narrow, f lat-bottomed valley with an abrupt ending. Karst valley abruptly terminated by the passage underground of the watercourse which has hitherto resisted the karst processes and remained at the surface. Depositional Features: Found in the Karst Caves and known as Speleothems . Stalactites, Stalagmites and Karst Pillars: The water containing limestone in solution, seeps through the roof in the form of a continuous chain of drops. A portion of the solution hangs on the roof and on evaporation of water, a small deposit of limestone is left behind contributing to the formation of a stalactite, growing downwards from the roof. The remaining portion of the drop falls to the floor. This also evaporates, leaving behind a small deposit of limestone aiding the formation of a stalagmite, thicker and flatter, rising upwards from the floor. Sometimes, stalactite and stalagmite join to form a complete pillar known as the column or Karst pillar . Flow stones: Flowstone is one of the most common speleothems. It has been described as “melted cake icing” and “frozen waterfalls.” Flowstone is usually composed of calcite or other carbonate minerals, and deposition is in layers or bands. Where composed of calcite, individual flowstone layers may be very colourful: yellows, reds, and oranges. Cave Pearls: Cave pearls are concentrically banded concretions that form in shallow "}, {"c": 1, "n": "Geomorphology", "id": "s79", "t": "MARINE CYCLE:", "x": "Sea waves, aided by winds, currents, tides and storms carry on the erosional and depositional processes. The erosive work of the sea depends upon size and strength of waves, slope, height of the shore between low and high tides, shape of the coast, composition of rocks, depth of water, human activity, etc. The wave pressure compresses the air trapped inside rock fissures, joints, faults, etc . forcing it to expand and rupture the rocks along weak points. Waves also use rock debris as instruments of erosion. These rock fragments carried by waves themselves get worn down by striking against the coast or one another. The solvent or chemical action of waves is another mode of erosion, but it is pronounced only in the case of soluble rocks like limestone and chalk. Erosional Features: 1. Chasms: These are narrow, deep indentations (a deep recess or notch on the edge or surface of something) carved due to headward erosion (downcutting) through vertical planes of weakness in the rocks by wave action. 1. With time, further headward erosion is hindered by lateral erosion of the chasm mouth, which itself keeps widening till a bay is formed. 2. Wave Cut Platform: Formed due to the backward retreat of the sea cliffs. 1. The bottom of the cliff suffers the maximum intensive erosion by waves and, as a result, a notch appears at this position. 3. Sea Cave : Differential erosion by sea waves through a rock with varying resistance across its structure produces arched caves in rocks called sea caves. With further erosion, they get converted into sea arches. 4. Stack: When the sea caves get extremely eroded , all that is left is some rock pillars standing in the offshore location called stacks. When these stacks further get eroded (often below the Low Tide limit), we get Stumps. 5. Blow Holes/ Spouting holes : The burst of water through a small hole on a sea cave due to the compression of air in the cave by strong waves. They make a peculiar noise. With further erosion these holes get bigger, the walls collapse, and we get Geos/gloup . Depositional Features: 1. Beach: This is the temporary covering of rock debris on or along a wave-cut platform 2. Bar: Currents and tidal currents deposit rock debris and sand along the coast at a distance from the shoreline . The resultant landforms which remain submerged are called bars. The enclosed water body so created is called a lagoon . They are of various types: 1. Barrier: It is the overwater counterpart of a bar. 2. Spit and Hook: A spit is a projected deposition joined at one end to the headland, with the other end free in the sea. The mode of formation is like a bar or barrier. A shorter spit with one end curved towards the land is called a hook. 3. Tombolo: Sometimes, islands are connected by a bar called tombolo. 3. Marine Dunes : Deposited in coastal locations, but due to the action of Wind and not Waves."}, {"c": 1, "n": "Geomorphology", "id": "s80", "t": "TYPES OF COASTLINES:", "x": "Coastline of emergence: These are formed either by an uplift of the land or by the lowering of the sea level . Bars, spits, lagoons, salt marshes, beaches, sea cliffs, and arches are the typical features. Coastline of submergence: A submerged coast is produced either by subsidence of land or by a rise in sea level. Ria, Fjord, Dalmatian, and drowned lowlands are its typical features. Ria Coast: When a region is dissected by streams into a system of valleys and divides, submergence produces a highly irregular shoreline called Ria coastline. The coast of south-west Ireland is a typical example of the ria coastline. Fjord: Some coastal regions have been heavily eroded by glacial action and the valley glacial troughs (U-shaped valley) have been excavated below sea level. 1. After the glaciers have disappeared, a fjord coastline emerges. 2. These coasts have long and narrow inlets with very steep sides. 3. The fjord coasts of Norway are a typical example. Dalmatian: The Dalmatian coasts result from the submergence of mountain ridges with alternating crests and troughs which run parallel to the seacoast. The Dalmatian coast of Yugoslavia is a typical example. Drowned Lowland: A drowned lowland coast is low and free from indentations , as it is formed by the submergence of a low-lying area. The Baltic coast of eastern Germany is an example of this type of coastline. Neutral Coastline: These are coastlines formed as a result of new materials being built out into the water. The word ‘neutral’ implies that there need be no relative change between the level of the sea and the coastal region of the continent. Whatever is taken away by the wave, gets deposited by the agents of erosion, such that there is no net change. Neutral coastlines include the alluvial fan-shaped coastline, delta coastline, volcano coastline, and the coral reef coastline. Compound Coastline: Such coastlines show the forms of two of the previous classes combined, for example, submergence followed by emergence or vice versa. The coastlines of Norway and Sweden are examples of compound coastlines. Fault Coastline: Such coastlines are unusual features and result from the submergence of a downthrown block along a fault , such that the uplifted block has its steep side (or the Faultline) standing against the sea forming a fault coastline. E.g. Konkan Coast of India ."}, {"c": 1, "n": "Geomorphology", "id": "s81", "t": "GLACIAL CYCLE:", "x": "A glacier is a moving mass of ice at speeds averaging a few meters a day . Types of Glaciers: continental glaciers, ice caps, piedmont glaciers, and valley glaciers. A glacier is charged with rock debris which are used for erosional activity by moving ice. Erosional Features: 1. Cirque/Corrie/Cwm: Hollow basin cut into a mountain ridge. It has a steep-sided slope on three sides, an open end on one side, and a slightly concave bottom/base. When the ice melts, tarn lakes may develop at the base of the cirques. 2. Horn/Pyramidal Peak: Ridge that acquires a ‘horn’ shape when the glacial activity cuts it from more than two sides 3. Arete: It is the knife-edged boundary between two cirques. 4. Bergschrund: Crevasse that forms between a moving glacier and the stationary ice or rock of a mountain, typically at the upper end of a glacier, where it separates the flowing ice from the stagnant ice above. 5. Glacial Trough: Original stream-cut valley, further modified by glacial action. It is a ‘U’ Shaped Valley . It is at the mature stage of valley formation. Since glacial mass is heavy and slow-moving, erosional activity is uniform – horizontally as well as vertically. A steep-sided and flat-bottomed valley results, which has a ‘U’ shaped profile. These U-shaped valleys, when filled with water, form Fjords. 6. Hanging Valley: Formed when smaller tributaries are unable to cut as deeply as bigger ones and remain ‘hanging’ at higher levels than the main valley as discordant tributaries. A valley carved out by a small tributary glacier that joins with a valley carved out by a much larger glacier. 7. Roche Moutonnee: Roche Moutonnée, a term derived from French meaning \"sheep rock, \" refers to a glacially eroded bedrock formation characterized by a smooth, gently sloping side facing the direction from which the glacier advanced, and a rough, steep side where the glacier plucked and quarried the rock as it moved. These features provide insights into the direction and nature of past glacial movements. 8. Craig & Tail: Landform consisting of a resistant rock mass (the Craig) with a gently sloping ridge of softer material (the Tail) extending downstream, formed by glacial erosion. Depositional Features: 9. Includes both depositional and erosional features . 10. Outwash Plain: When the glacier reaches its lowest point and melts, it leaves behind a stratified deposition material , consisting of rock debris, clay, sand, gravel, etc. This layered surface is called a till plain or an outwash plain . 11. Esker: Winding ridge of un-assorted depositions of rock, gravel, clay, etc. running along a glacier in a till plain. The eskers resemble the features of an embankment and are often used for making roads. They are analogous to levees. 12. Kame Terraces: Broken ridges or un-assorted depositions looking like a hump in a till plain. 13. Drumlin: Inverted boat-shaped deposition in a till plain . They help in determining the direction of movement of the glacier , as the glacier side is always high and steep , while the lee side is smooth and tapers gently in the direction of ice movement. 14. Kettle Holes : Formed when the deposited material in a till plain gets depressed locally and forms a basin. 15. Moraine: General term applied to rock fragments, gravel, sand, etc. carried by a glacier. Depending on its position, the moraine can be ground moraine, lateral moraine, and end moraine."}, {"c": 1, "n": "Geomorphology", "id": "s82", "t": "ARID CYCLE:", "x": "Types of Deserts: 1. Hamada (Rocky) : Consist of large rocks that have been smoothened by exogenic forces. 2. Reg (Stony)/Serir : Covered with extensive sheets of gravel and pebbles. More accessible than sandy deserts (easier mobility). 3. Erg (Sandy)/Koum: Typical pop-culture desert with vast expanses of sand. 4. Cold Deserts: Either at high altitudes or high latitudes. Both Water (flash floods) and wind are agents of erosion here. Water-related landforms: 1. Bolsons: The intermontane basins in dry regions are generally known as bolsons. 2. Erosional: 1. A gully is a landform created by running water. Gullies resemble large ditches or small valleys but are meters to tens of meters in depth and width. 2. Ravine : A ravine is a landform narrower than a canyon and is often the product of stream-cutting erosion. Ravines are typically classified as larger in scale than gullies, although smaller than valleys. 3. Badland Topography: In arid regions, occasional rainstorms produce numerous rills and channels which extensively erode weak sedimentary formations. Lack of any vegetation causes this extreme level of erosion. As the top soil gets eroded, any chance of undertaking agriculture as a source of livelihood also erodes away. This lack of utility gives these regions their name . Ravines and gullies are developed by linear fluvial erosion leading to the formation of badland topography. Example: Chambal Ravines 4. Playas: Small streams flow into bolsons, and this water accumulates in the depressions. These temporary lakes are called playas. After the evaporation of water, salt-covered playas are called Salinas. 5. Pediments: Pediment is an erosional landform. A true pediment is a rock-cut surface at the foot of mountain. 3. Depositional: 1. Bajada: Bajadas are moderately sloping depositional plains in the desert regions. Wind related processes: 1. Deflation ⇒ removing, lifting, and carrying away dry, unsorted dust particles by winds. 2. Abrasion ⇒ When wind loaded with sand grains erodes the rock by grinding against its walls. 3. Attrition ⇒ Attrition refers to wear and tear of the sand particles while they are being transported. Wind Related landforms: 1. Erosional: 1. Blowouts/ Deflation Hollows: hollows formed by the removal of particles by wind. They are generally small but may be up to several kilometres in diameter. 2. Mushroom rocks: a cap or cap-like structure atop a narrower stem. 3. Zeugen: A table-shaped area of rock found in arid and semi-arid areas formed when more resistant rock is reduced at a slower rate than softer rocks around it. Rocks are in horizontal layers. 4. Yardang: Rocks are in vertical layers . The hard rocks stay resistant while the soft rocks get eroded. 5. Wind bridges and windows: Powerful wind continuously abrades stone lattices, creating holes. Sometimes the holes are gradually widened to reach the other end of the rocks to create the effect of a window—thus forming a wind window. 1. Window bridges, are formed when the holes are further widened to form an arch-like feature 6. Inselbergs: A inselberg is an isolated hill, knob, ridge, outcrop, or small mountain that rises abruptly from a gently sloping or virtually level surrounding plain. Analogous to Monadnocks in the arid regions. 7. Pediplain: equivalent of Peneplain in the arid regions. 2. Depositional: 1. Ripple Marks: These are depositional features on a small scale formed by saltation (the transport of hard particles over an uneven surface in a turbulent flow of air or water). 2. Dunes (in-situ): Dunes are heaps or mounds of sand found in deserts. Generally, their heights vary from a few meters to 20 meters but in some cases, dunes are several hundred meters high and 5 to 6 km long. 1. Formed both in deserts and coastal locations. 2. Longitudinal dunes: Formed parallel to the wind movement . These dunes are commonly found at the heart of trade-wind deserts like the Sahara, Australian, Libyan, South African and Thar deserts. 3. Transverse dunes "}, {"c": 1, "n": "Geomorphology", "id": "s83", "t": "LAKES", "x": "Body of water of considerable size, localized in a basin, surrounded by land apart from a river or other outlet that feeds/drains it. Larger and deeper than ponds. Most lakes have at least one natural outflow to maintain its average level by allowing the drainage of excess water. Endorheic Lakes: do not have a natural outflow and lose water solely by evaporation or underground seepage or both . Formation of lakes: Lakes formed by earth movements: Tectonic lakes (Titicaca, Caspian Sea), Rift valley lakes (Tanganyika, Malawi, Dead Sea) By glaciation: Tarns, Rock hollow lakes . Many such lakes in Scandinavia, Canada, Siberia. By Volcanic Activities: Crater and Caldera lakes (Lonar lake, Krakatoa lake) By Erosion: Karst, Playa, Wind deflated lakes (Great Basin of Utah) By Deposition: Ox-Bow lakes, Lagoons (Chilika), Glacial lakes (moraine-dammed) Man-made lakes"}, {"c": 1, "n": "Geomorphology", "id": "s84", "t": "PLATEAUS", "x": "Flat-topped tableland. Plateaus occur in every continent and take up a third of the Earth's land Sometimes, a plateau is so eroded that it is broken up into smaller raised sections called outliers. Many outlier plateaus are composed of very old, dense rock formations. Iron ore and coal often are found in plateau outliers. Plateaus are rich in mineral deposits. As a result, many of the mining areas in the world are in the plateau areas. Tectonic plateaus are formed from processes that create mountain ranges – volcanism (Deccan Plateau), crustal shortening (thrusting of one block of crust over another, and folding occurs. Example: Tibet (an intermontane plateau)), and thermal expansion (Ethiopian Highlands). Plateaus can also be erosional. Erosion of mountains can lead to their creation. E.g. Alleghany plateau in Appalachians."}, {"c": 1, "n": "Geomorphology", "id": "s85", "t": "PYQ", "x": "Q.1) Consider the following statements (2025): Statement I: In the context of effect of water on rocks, chalk is known as a very permeable rock, whereas clay is known as quite an impermeable or least permeable rock. Statement II: Chalk is porous and hence can absorb water. Statement III: Clay is not at all porous. Which one of the following is correct in respect of the above statements? (a) Both Statement II and Statement III are correct and both of them explain Statement I (b) Both Statement II and Statement III are correct but only one of them explains Statement I (c) Only one of the Statements II and III is correct and that explains Statement I (d) Neither Statement II nor Statement III is correct Answer: (c) Only one of the Statements II and III is correct and that explains Statement I Chalk is both porous and permeable → absorbs and transmits water easily. Clay is porous but not permeable → holds water but does not allow it to flow through. USGS Water Science Glossary: Clay has very high porosity, but low permeability."}, {"c": 1, "n": "Geomorphology · quick", "id": "q-1-universe-solar-system", "t": "1 · Universe & Solar System", "x": "Origin theories – \"who said what\" Theory By Core idea Drawback (handout) Gaseous hypothesis Kant Colliding particles → heat → nebula; rotating nebula threw rings → planets; same process → moons Source of primordial matter unexplained; collisions can't give rotation Nebular hypothesis Laplace, 1796 (modified Kant) Hot rotating nebula cooled, shrank, spun faster, rings detached → planets; rest = Sun Source of nebula unexplained; Sun should spin fastest but doesn't Planetesimal Chamberlin–Moulton A passing star pulled material off the young Sun → planetesimals → protoplanets → planets – Accretion model Otto Schmidt 1944, Safronov 1969 Nebula → dust grains → boulders → planetesimals → planets – Big Bang Lemaître (1920s), \"primordial atom\" Dense primordial matter exploded; slightly denser regions pulled together → gas clouds, stars, galaxies Validated 1972 (handout) 👨‍👩‍👧 Who-is-who: Kant = Kollision, Laplace = Loses heat (cools & shrinks, spins faster). Schmidt–Safronov = Small Steps (dust → planet). Proofs of the Big Bang: Hubble's law – farther galaxies recede faster (basis: redshift). CMB – found by Penzias & Wilson, 1965; oldest light, ~380,000 yrs after Big Bang; at ~3000 K electrons joined protons (recombination) so photons flew free – \"a baby photo of the universe\". Universe age 13.8 bn yrs. Dark side: dark matter ≈ 27% (gravity glue, lensing); dark energy ≈ 68% (pushes space apart, accelerating expansion); together ≈ 95%. Galaxies & stars Types: Spiral (Milky Way) · Elliptical (old, cool stars, little gas) · Lenticular (bulge + disk, no arms) · Irregular (chaotic, gas-rich). Active galaxies (~10%; supermassive black hole + accretion disk; Milky Way is not active): Seyfert (most common, lowest energy) · Quasar (brightest) · Blazar (jet points at Earth). Populations: Pop III – hypothetical first stars, no heavy metals · Pop II – oldest observed (5–10 bya), halo/globular clusters · Pop I – younger, metal-rich (4–5 bya), disk & arms, our Sun. ⭐ Star fate – \"Small stars retire quietly, big stars quit with a bang\" Mass Path End Main sequence → Red giant → Planetary nebula White dwarf > 8 × Sun Red supergiant → Supernova (iron core) Neutron star (8–20/25×) or Black hole (>25×) Chandrasekhar limit 1.44 – 3: core 1.44 = white dwarf; 1.44–3 = neutron star; > 3 = black hole. Pulsar = spinning neutron star (\"lighthouse\"). Black-hole words: event horizon, accretion disk, spaghettification, Hawking radiation, gravitational waves (LIGO, Nobel 2017). Solar system – numbers worth holding Item Fact Planets Terrestrial: Mercury, Venus, Earth, Mars · Gas giants: Jupiter, Saturn · Ice giants: Uranus, Neptune Dwarf planets (5) Pluto (biggest), Ceres (biggest in asteroid belt), Eris, Haumea, Makemake (newest). Criteria: orbits Sun · round · not a moon · has not cleared its orbit Moons Mercury 0, Venus 0 · Earth 1 · Mars 2 · Jupiter 101 · Saturn 274 · Uranus 28 · Neptune 16 · Pluto 5. Biggest moon: Ganymede (Jupiter) Kuiper belt Beyond Neptune, 30–50 AU; icy bodies; source of comets (1 AU = 149.6 m km) Oort cloud Spherical shell; starts 2,000–5,000 AU, outer edge 10,000–100,000 AU; long-period comets Asteroids Belt between Mars & Jupiter; Vesta largest (~530 km); Trojans sit at L4/L5 Lagrange points Meteors Meteoroid (in space) → meteor (burns in air) → meteorite (hits ground). 99.8% of meteorites are from asteroids; 0.2% Mars + Moon Heliosphere Termination shock → heliosheath → heliopause (solar wind = interstellar pressure) → bow shock (existence contested by Voyager data) Handout alert: Saturn's moons are printed as 274 in the moons list but 74 in the inner/outer planets table → use 274. \"Earth's escape velocity 11.8 m/s\" – unit looks like a typo; don't memorise it. Planet Nine is only hypothesised (5–7 × Earth mass). Inner vs outer planets: inner = rocky, dense, small, few/no moons, weak magnetic field, short orbits (Mercury 88 d, Earth 365, Mars 687) · outer = gaseous, big, many moons, rings, strong fields, long orbits (Jupiter 12 y, Saturn "}, {"c": 1, "n": "Geomorphology · quick", "id": "q-2-earth-evolution-motion-moon-time", "t": "2 · Earth – evolution, motion, Moon, time", "x": "Crust → atmosphere → ocean → life. Atmosphere in 3 stages: (1) H & He, blown away by solar wind → (2) degassing: volcanoes give CO₂, N & S oxides, water vapour → clouds → rain → oceans → (3) life raises oxygen (photosynthesis). Timeline: Earth 4.5 bya · simple life 3.8 bya near deep-sea vents (blue-green algae) · LUCA ~4.2 bya (as printed) · Miller–Urey 1953 (organic molecules from inorganic). PYQ 2018: Statements 1 (magnetic field reverses every few hundred thousand yrs) ✔ and 3 (life modified early atmosphere) ✔ are right; \"54% oxygen, no CO₂ at birth\" ✘. → 1 & 3. (Early air: water vapour, CO₂, N₂, no O₂.) PYQ 2012: elements behind origin of life = Carbon, Hydrogen, Nitrogen. Earth fact Value Axial tilt 23.5° Rotation (sidereal day) 23 h 56 m 4.1 s, West→East (counter-clockwise from above the North Pole); slowing (wind/wave friction, Moon receding, core slowdown) Revolution (sidereal year) 365 d 5 h 48 m; aphelion farthest, perihelion nearest Pole drift Groundwater pumping (NW India, W North America) shifted the pole ~80 cm east (1993–2010); melting ice moving water to low latitudes also shifts the axis Magnetic field Flips every 2–3 lakh years; magnetic north drifting from Canada → Arctic → Siberia since the 1990s Why the magnetic field matters: blocks solar wind, stops atmospheric loss, creates the magnetosphere (holds Van Allen belts), causes auroras, helps compasses, guides migrating animals, protects satellites/grids. Day/night & seasons – PYQs 2012, 2013, 2019, 2024: - Pole star lies due North: villager 5 km east keeps the pole star on his left (2012). - Variation of day length with season = revolution on a tilted axis + latitude (ans B, 2013). With no tilt, no seasons and equal days. - 21 June: Sun does not set at the Arctic Circle (2019, ans A). >12 h daylight on 21 June at the Tropic of Cancer and Arctic Circle (2024, ans d: 2 and 4). Equator gets overhead Sun only at the equinoxes. 🌙 Moon quick-fire: 384,400 km · 27% of Earth's size · tidally locked (same face always) · Perigee = Pear-close, Apogee = Away. Origins: Fission (George Darwin) – rejected · Giant Impact (Theia, Mars-sized, 4.5 bya) – accepted · Binary-exchange capture – proposed. Eclipses. Lunar = Earth between Sun and Moon (Blood Moon = whole Moon inside umbra; Blue Moon = 2nd full moon in a month, no relation to eclipses). Solar = Moon between Sun and Earth; Annular (Moon farther → ring), Total (Moon closer; diamond-ring effect), Partial (penumbra only). Not every full/new moon gives an eclipse because the Moon's orbit is tilted 5°. Time. 4 minutes per 1° of longitude; Earth rotates W→E so east is ahead; International Date Line keeps the calendar day consistent. 🕐 Most time zones: France 12 · Russia & USA 11 (\"two elevens – a cricket team each\") · A-A-U = Antarctica, Australia, UK 9 · Canada 6 · Denmark 5. PYQs with no year printed: (a) Anadyr vs Nome → only Statement I right (different days at breakfast; but Monday in Anadyr is Sunday in Nome, not Tuesday). (b) UK, Denmark, NZ, Australia, Brazil – four have more than four zones (Denmark 5, NZ 5, Australia 6+, UK 9 with territories; Brazil only 4). (c) Shift in Earth's rotation/axis → answer (b): melting polar ice moving water toward the equator explains it; solar flares are true but don't explain it."}, {"c": 1, "n": "Geomorphology · quick", "id": "q-3-earths-interior-earthquakes", "t": "3 · Earth's interior & earthquakes", "x": "🥚 Earth = a boiled egg. Shell = crust (0.5–1% of volume, 30–50 km) · White = mantle (83%, to 2,900 km) · Yolk = core (16%, 2,900–6,400 km, NiFe; outer liquid, inner solid). Boundaries, top → bottom: Conrad · Moho · Repetti · Gutenberg · Lehmann → \"Cool Men Really Get Love\". Conrad (continental/oceanic crust) · Mohorovičić (crust/mantle) · Repetti (upper/lower mantle) · Gutenberg (mantle/core, 2,900 km) · Lehmann (outer/inner core). Crust Mantle Core Oceanic (SiMa): dense, thin, 5–30 km, basaltic · Continental (SiAl): light, 50–70 km (70–100 km under Himalaya), granitic Upper 2.9–3.3, lower 3.3–5.7, avg 4.5 g/cm³. Lithosphere = crust + uppermost mantle (10–200 km, brittle). Asthenosphere to ~400 km: semi-solid, source of magma Heaviest, densest; nickel + iron How we know: Direct – deepest mines (Mponeng, TauTona 3.6 km), deepest drill (Kola, 12 km), volcanic eruptions. Indirect – meteorites, gravity anomalies (heavy material = higher gravity), magnetic field shifts, and best of all earthquake waves. Earthquake basics Focus (hypocentre) = where energy is released; epicentre = surface point nearest the focus. Distribution: mostly at plate boundaries; two belts – Circum-Pacific, Mid-continental; deep-focus at convergent, shallow-focus at divergent boundaries. Wave Type Motion Medium Order P (primary) Body, longitudinal to-and-fro along travel solid, liquid, gas (faster in solids) 1st, fastest S (secondary) Body, transverse up-down, at right angles solids only 2nd L (Love) Surface, shear horizontal shaking; fastest surface wave – 3rd; collapses buildings R (Rayleigh) Surface, rolling ellipse vertical + horizontal – slowest; tsunamis 🌊 P = Push-pull, Prompt. S = Sideways, Solids only. Love shakes Left-right; Rayleigh Rolls like a surf. Shadow zones: P: 103°–143° (a band) · S: everything beyond 103° (bigger, ~40% of the globe). S-waves vanish → liquid outer core; P-shadow clue → solid inner core. Scales: Richter – magnitude from surface-wave amplitude, log scale 0–10 (5 → 6 = ×10 amplitude) · Mercalli – intensity (damage) 1–12 · Moment magnitude – energy released (fault area, slip, rock rigidity), log, most widely used now. PYQ 2023 (ans c, both right): P waves are recorded earlier than S; P particles vibrate along the direction of travel, S at right angles. Mains 2017 (10m): \"How does NASA's Juno mission help understand the origin and evolution of the Earth?\" – the handout prints the question only, no answer. Notes on Jupiter above (gas giant, storms) are all it offers."}, {"c": 1, "n": "Geomorphology · quick", "id": "q-4-earth-movements-weathering", "t": "4 · Earth movements & weathering", "x": "Endogenic (internal energy: radioactivity, tidal/rotational friction, primordial heat) Exogenic (Sun-driven: temperature + rain) Slow Diastrophism – Orogenic (mountain-building, horizontal force → vertical effect, long narrow belts) and Epeirogenic (continent-building, vertical force → horizontal effect, radial up/down) Weathering · Erosion · Deposition · Mass movement = denudation Sudden Earthquakes, volcanism – Epeirogenic: uplift – Colorado Plateau, Brazilian Highlands, Australian Shield, Siberian Platform; subsidence – Siberian Basin, Konkan. Sudden: 2004 earthquake submerged Indira Point; NZ 1885 uplift up to 3 m; Japan 1891 subsidence 6 m. 🧂 Weathering – chemical \"S-C-O-R\" = \"Some Chefs Often Roast\": Solution/hydration · Carbonation (CO₂ + water → carbonic acid) · Oxidation (iron, manganese, sulphur rocks) · Reduction (red iron oxide → green/blue-grey). Physical: unloading · granular disintegration · exfoliation (diurnal temperature, \"onion peeling\", smooth rounded surfaces, dry/high places) · block separation (jointed rocks) · shattering (angular pieces) · frost wedging (water freezes, expands) · salt weathering (crystallisation, deserts). Biological: burrowing, roots, acids from decay. Mass movement = movement only under gravity. Denudation gives: soils, ore concentration (iron, manganese, aluminium, copper), landforms. PYQ 2024 (ans a): Rain weathers rock because rainwater carries dissolved CO₂ and O₂ – both statements explain it."}, {"c": 1, "n": "Geomorphology · quick", "id": "q-5-drift-sea-floor-spreading-plate-tectonics", "t": "5 · Drift → sea-floor spreading → plate tectonics", "x": "Pre-Wegener: Pellegrini 1858 (same fossil plants either side of the Atlantic) · Suess (ancient big continents) · F. B. Taylor (arc mountains from creep toward Equator). Wegener 1912: one landmass Pangaea + ocean Panthalassa; Tethys Sea split it into Laurentia (Laurasia) north and Gondwanaland south; forces = tidal (westward) + gravity & polar-fleeing (equator-ward); break-up in Triassic (251–199.6 mya). Evidence Detail Jigsaw fit Brazil bulge ↔ Gulf of Guinea; Greenland ↔ Ellesmere/Baffin; India–Madagascar–Africa Rocks/fossils Ghana gold placers derived from Brazil plateau; Mesosaurus fossils only in South Africa & Brazil (4,800 km apart); 2-bn-yr-old rocks on both coasts Climate Tillite; India's Gondwana sediments have counterparts in six southern landmasses Mountains Caledonian/Hercynian (Europe) continue as the Appalachians Drawbacks: no free float of SiAl on SiMa – the lithosphere moves over the asthenosphere · ocean floor isn't passive · tides/gravity too weak (convection currents are the engine) · only equator/west movement (but Antarctica moved away, Australia east, India NE) · no reason for Triassic break-up. 🧩 Relay of ideas: Wegener (1912, continents) → Holmes (1930s, convection currents; rising limbs diverge, sinking limbs converge) → Hess (1960, sea-floor spreading: young rocks mirror each other either side of the ridge; shallow quakes at ridges) → Paleomagnetism (magnetic stripes alternate normal/reversed) → McKenzie & Parker 1967, Morgan 1968 = plate tectonics. Plate tectonics 7 major plates: Antarctica+ocean · North American · South American · Pacific · India-Australia-NZ · Africa+E. Atlantic floor · Eurasia+ocean. Minor plates arise from stress where majors converge (e.g. the Mediterranean). Plates can be continental (Arabian), oceanic (Pacific) or both (Indo-Australian). Ring of Fire (Pacific plate boundary, NZ → Chile): 70% of earthquakes, 90% of volcanoes (75% of active); 20% of quakes in mid-continental belt. Slowest ridge: Arctic (fastest: East Pacific Rise (>15 cm/yr). 💔 Divorce · Collide · Slide Boundary Plates… Creates Example Divergent (constructive) move apart new crust, mid-ocean ridges, rift valleys, volcanic islands, shallow quakes Mid-oceanic ridges, Great African Rift (Lebanon → Mozambique), Chagos Convergent C–C (colliding) continent meets continent fold mountains, no volcanoes (no subduction) India–Eurasia → Himalayas Convergent O–C (subducting) dense ocean plate dives trench, volcanoes, fold mountains (Cordilleran) Pacific–South American → Andes Transform (conservative) slide past only deformation; usually ⟂ ridges San Andreas Fault Himalayas have no volcanoes; the Andes and Alps do. Indian plate story: island off Australia → Tethys separated it from Asia till ~225 mya → started north ~200 mya (Pangaea breaks) → ~140 mya at 50°S → Deccan Traps ~65 mya → collision 40–50 mya (some say 60) → Himalayas still rising. Margins: E Arakan Yoma → Java Trench · W Kirthar · N Himalaya. Limits of plate tectonics: doesn't explain hotspots; can't place ancient plates or predict future boundaries. PYQs: 2014 (ans c) – continental drift and glacial cycles both influenced evolution. Drift evidences (no year, ans c) – Brazil–W. Africa rocks, Ghana gold, Gondwana sediments: all three right. 2013 (ans d) – electromagnetic radiation, geothermal energy, gravity, plate movement, rotation, revolution: all cause dynamic surface change."}, {"c": 1, "n": "Geomorphology · quick", "id": "q-6-volcanism", "t": "6 · Volcanism", "x": "Magma (underground) → lava (surface). Acidic lava: light, high silica, viscous, solidifies in vent → explosive, pyroclasts. Basic lava: dark, dense, low silica, runny, spreads → lava plateaus, gentle cones. Fumarole vents steam/gas: sulphur-rich = solfatara; CO₂-rich = mofette. Geysers are confined to Iceland, New Zealand, Yellowstone. Volcanic gases: carbon, sulphur, nitrogen oxides, water vapour, H₂S, trace chlorine. PYQ 2024 (ans d): pyroclastic debris, ash and dust, nitrogen compounds, sulphur compounds – all four are volcanic products. Where: only 10–20% of volcanic activity is above sea · Ring of Fire 75% of active · Mid-Atlantic ridge (Iceland) · Great African Rift (Kilimanjaro, Kenya) · Cameroon (only active volcano in West Africa) · Pelée (West Indies) · Mediterranean: Vesuvius, Stromboli, Ararat, Elburz · none in Australia · South Asia's only active lava volcano: Barren Island (India; last erupted 2022); Narcondam extinct; Baratang = India's only mud volcano; Chandragup (Pakistan, mud, \"not a true volcano\"). No volcanoes in the Himalaya. Landforms Extrusive (surface) Intrusive (inside; show after erosion) Conical & fissure vents, basalt plateaus · mid-ocean ridges · pyroclastic debris · caldera & crater lakes (Crater Lake, Oregon) Batholith/pluton (huge; Mt Wicklow) · Sill (flat; Great Whin Sill) · Laccolith (dome; Henry Mts) · Lopolith (saucer; Transvaal) · Phacolith (wavy; Cordon Hill) · Dyke (vertical; Alaska) 🪟 Intrusives: Sill = window-sill, lies flat · Dyke = wall, stands upright · Laccolith = Loaf (dome) · Lopolith = Lota (bowl/saucer) · Phacolith = wavy. 🍛 Eruption styles, calm → crazy: \"I Have Some Vada-Pav, Please\" = Icelandic (fissure, basalt) → Hawaiian (central vent, most lava) → Strombolian (short bursts, pasty lava) → Vulcanian (dark cauliflower clouds) → Pelean (most dangerous, \"glowing clouds\") → Plinian (ash up to 50,000 ft, deadly pyroclastic flows). By frequency: Active (St Helens, Merapi) · Dormant (Vesuvius before AD 79) · Extinct (Narcondam). By shape: cinder cone · composite (strato) · shield. Vulcanian/Pelean/Plinian ash = hygroscopic nuclei → rain + ash → lahars (mudflows). Mantle plumes & hotspots: rising heat arm, intra-plate (not at boundaries); plate moves over it → island chains (Hawaii); volcano cut off from heat goes extinct. Azores = hotspot + Mid-Atlantic ridge. Réunion hotspot: active >65 million yrs; when the Indian plate passed over it → Deccan Traps."}, {"c": 1, "n": "Geomorphology · quick", "id": "q-7-mountains-isostasy-rocks", "t": "7 · Mountains, isostasy, rocks", "x": "Types: by location – continental, coastal, oceanic; by formation – fold, fault (block), volcanic, residual. Mountain Formed by Notes / examples Fold Compression of sedimentary strata; loftiest; young near converging boundaries Himalaya, Alps, Atlas, Andes (quakes + volcanoes); old: Appalachians, Aravallis Block (fault) Dip-slip faults, tension/compression; horst = raised, graben = lowered Great African Rift (valley floor graben; Mitumba & Muchinga horsts), Rhine valley–Vosges Volcanic Accumulated lava/ash cones (\"mountains of accumulation\") Fuji, Mayon, Merapi, Etna Residual Left by denudation of older mountains Monadnocks (USA) Isostasy: equilibrium between lithosphere and asthenosphere (buoyancy vs gravity); crust rises/sinks when load changes (erosion, mountain-building, ice melt); can cause earthquakes and may reactivate Antarctic volcanoes. 📏 Longest ranges (km): Mid-Atlantic Ridge 16,000 · Andes 7,000 · W. Cordillera 4,830 · Great Dividing Range & Trans-Antarctic 3,500 · Urals & Atlas 2,500 · Appalachians 2,414 · Himalayas 2,400 · Altai 2,000. Say it as \"16, 7, 48, 35-35, 25-25, 24-24, 20\". Rocks Igneous (primary) Sedimentary Metamorphic Origin Magma/lava cooling Denudation → deposits → lithification PVT change of existing rock (recrystallise) Features No fossils; intrusive/plutonic (slow cooling, big grains) vs extrusive (fast, small grains) Layered, fossils, porous; 75% of crust area, 5% of volume Foliation, lineation, banding; may/may not have strata/fossils Examples Granite, gabbro, pegmatite, basalt Sandstone, shale, limestone, coal, chalk, chert, halite; tillite (ice), loess (wind) Gneiss, slate, schist, marble, quartzite Value Metal ores (iron, nickel, copper, lead, zinc, chromite, manganese, gold, diamond, platinum); building stone; black soil Petroleum, gas, coal, phosphates, hematite iron ore, limestone; placers (bauxite, manganese, tin); rich soils Thermal (heat) and dynamic (pressure) types Sedimentary by mode: mechanical (sandstone, conglomerate, shale, loess) · organic (chalk, limestone, coal, geyserite) · chemical (chert, limestone, halite, potash). Amygdales = almond bubbles in basalt filled with minerals (copper). Rock cycle: igneous → (erosion) sedimentary → (heat/pressure) metamorphic → (subduction, melting) magma → igneous; any rock can go to any other. Minerals (hardness, Mohs 1–10): Feldspar 6–7 (glass, ceramics) · Quartz 7 (jewellery, electronics) · Bauxite 1–3 (aluminium) · Cinnabar 2–3 (mercury) · Dolomite 3.5–4 · Hematite 5.5–6 & Magnetite 5.5–6 (iron). Mains 2022 (10m) – \"Describe the characteristics and types of primary rocks\": Intro – igneous rocks form from magma/lava, hence \"primary\". Body – non-fossiliferous; plutonic vs volcanic by cooling place/time; acid (granite, light) vs basic; examples; economic value (ores, building stone, black soil). Close – all other rocks are derived from them via the rock cycle."}, {"c": 1, "n": "Geomorphology · quick", "id": "q-8-cycles-of-erosion", "t": "8 · Cycles of erosion", "x": "Erosion = removal + transport + deposition (transport separates it from weathering). Five cycles: fluvial · glacial · marine · arid · karst. 🏞️ River life: Young – V, Mature – meander, Old – delta. Youth: fast, V-valley, waterfalls, rapids, headward erosion. Mature: lateral erosion, meanders, U-profile. Old: deposition, braiding, delta. Rejuvenation (tectonic or sea-level change) restarts the cycle → terraces. Erosion types: hydraulic action · corrosion (chemical) · attrition (load vs load) · corrasion/abrasion (load vs rock). Downcutting deepens, lateral widens, headward lengthens (→ river piracy: Saraswati; Shyok captured Nubra). Erosional fluvial forms: Gorge (narrow; Indus at Nanga Parbat, Brahmaputra at Namche Barwa – antecedent rivers) vs canyon (broader; Grand Canyon 483 km long, 2.88 km deep) · Waterfall (youth; Jog/Gersoppa on Sharavati 260 m) · Rapids/cataracts · Potholes (swirling boulders drill) · Meanders (outer = cliff-slope, erosion, concave; inner = slip-off, deposition, point bars) · Ox-bow lake (cut-off meander; Ganga shifted south leaving ox-bows north) · Peneplain (end product) with monadnocks. Depositional: Alluvial fans/cones · natural levees (breach = flood) · delta (arcuate fan; bird's-foot weak tides; cuspate strong waves) · braided channel · estuary (drowned valley; ports/fisheries). 🌳 Drainage patterns: Dendritic = tree (Indus, Godavari, Mahanadi, Cauvery, Krishna) · Trellis = garden fence, tributaries at right angles (Seine, Paris basin) · Rectangular = right-angle bends (Colorado; Mahanadi) · Angular = acute angles (Himalayan foothills) · Parallel = lesser Himalayas · Radial = wheel spokes outward (Amarkantak, Saurashtra, Kilimanjaro) · Annular = ring (Black Hills, S. Dakota) · Centripetal = all into one basin (Ladakh, Tibet, Bagmati). Handout alert: Mahanadi is listed under both dendritic and rectangular. Take it as dendritic unless the question says rectangular. Karst (limestone, dolomite, gypsum; dense, jointed, thickly bedded) Named after a province of Yugoslavia (now Slovenia). Groundwater words: porous (pores), permeable (water passes; clay is porous but not permeable), aquifer, water table, confined/unconfined, artesian well (rises unpumped), spring, perched table. Erosional: sinkholes/swallow holes (3–9 m; dolines, uvalas, polje) · lapies (grooves and ridges) · karst window · karst arch/bridge · caves · blind valley. Depositional (speleothems): stalactite hangs from roof, stalagmite rises from floor, column when joined; flowstone, cave pearls, draperies. 🕳️ Stalactite = Ceiling (holds tight to the roof). Stalagmite = Ground (might reach the roof). PYQ 2025 (ans c): chalk = porous and permeable; clay = porous but not permeable. So Statement III (\"clay not porous at all\") is wrong; Statement II is right and explains I. Marine (waves) 🌊 Cliff → Cave → Arch → Stack → Stump (\"Cats Always Sit Still\"). Wave-cut platform forms as the cliff retreats (notch at base). Chasm → bay. Blowhole (air compressed in cave) → geo/gloup. Depositional: beach · bar (submerged; encloses a lagoon) · barrier · spit (one end tied to headland) → hook (curved end) · tombolo (bar joining an island) · marine dunes (wind). Coast type Cause Examples Emergence land up / sea down bars, spits, lagoons, cliffs, arches Submergence land sinks / sea up Ria (SW Ireland) · Fjord (Norway; drowned U-valley) · Dalmatian (ridges ∥ coast, Yugoslavia) · Drowned lowland (Baltic, E. Germany) Neutral new material built out; no net change fan, delta, volcano, coral-reef coasts Compound submergence + emergence Norway & Sweden Fault down-thrown block, steep fault face to sea Konkan coast Glacial Glacier = moving ice (a few metres/day); types: continental, ice cap, piedmont, valley. 🏔️ Cirque = armchair (steep on 3 sides, open on 1; tarn lake) · Arête = knife-edge between two cirques · Horn = pyramid peak (cut from >2 sides) · U-valley (glacial trough; flooded = fjord) · Hanging valley (tributary left high) · Roche moutonnée = \"sheep rock\" (smoo"}, {"c": 1, "n": "Geomorphology · quick", "id": "q-9-recall-sheet-geomorphology", "t": "9 · Recall sheet – Geomorphology", "x": "Q A CMB found by whom, when? Penzias & Wilson, 1965; ~380,000 yrs after Big Bang White dwarf vs neutron star vs black hole (mass) 3 (Chandrasekhar) Dark matter / dark energy share 27% / 68% Moons: Jupiter, Saturn, Uranus, Neptune 101, 274, 28, 16 Kuiper belt distance; Oort start 30–50 AU; 2,000–5,000 AU Flares classes; CME time A B C M X; 15–18 h Earth tilt; sidereal day 23.5°; 23 h 56 m 4.1 s Time zones champion France 12 Earth volume: crust / mantle / core 0.5–1% / 83% / 16% Boundaries top → bottom Conrad, Moho, Repetti, Gutenberg, Lehmann P shadow / S shadow 103–143° / beyond 103° Richter vs Mercalli Magnitude 0–10 vs intensity 1–12 Drift / spreading / plates Wegener 1912 / Hess 1960 / McKenzie-Parker 1967 Which plate boundary has no volcanoes? Continent–continent (Himalaya) Only active lava volcano in S. Asia Barren Island (India) Indian plate collision with Asia 40–50 mya (Deccan Traps ~65 mya) Fastest / slowest ridge East Pacific Rise / Arctic Karst depositional forms Stalactite, stalagmite, column Fjord vs ria Glacial U-valley drowned vs river valley drowned Barchan windward side Convex Traps: \"Himalayas have volcanoes\" ✘ · \"P waves can't pass liquids\" ✘ (that's S) · \"orogeny = continent-building\" ✘ (that's epeirogeny) · \"solar flares cause tsunamis/forest fires\" ✘ · \"Blue Moon = eclipse\" ✘ · \"Sun overhead on equator on 21 June\" ✘ (equinoxes). Connects to: Himalaya & Deccan story → Indian Geography; Tilt and 21 June → Climatology; Ridges, trenches, coral reefs → Oceanography; Karst/gorge examples (Indus, Brahmaputra) → Indian drainage."}, {"c": 2, "n": "Climatology", "id": "s0", "t": "ATMOSPHERE", "x": "Layer of air surrounding the Earth. Importance: It protects the earth from the harmful radiation from the sun. The Ozone Layer absorbs harmful UV radiations. The Greenhouse Effect by certains gases in the atmosphere helps keep the Earth warm, to allow the survival of life. The atmosphere also takes care of extra-terrestrial objects like meteors that get burnt up while passing through it, due to air friction. The gasses of the present atmosphere are a product of volcanic eruptions , hot springs, chemical breakdowns of solid matter, and redistribution from the biosphere. Composition of the atmosphere: The atmosphere is a mixture of many gases. In addition, it contains huge numbers of solid and liquid particles, collectively called aerosols. Nitrogen and oxygen make up nearly 99% of the clean, dry air . The remaining gases are mostly inert and constitute about 1% of the atmosphere. Oxygen constitutes 21% of the total volume of the atmosphere. All living organisms inhale oxygen . Besides, oxygen can combine with other elements to form important compounds, such as oxides. Also, combustion is not possible without oxygen. Nitrogen accounts for 78% of total atmospheric volume. It is a relatively inert gas and is an important constituent of all organic compounds. The main function of nitrogen is to control combustion by diluting oxygen . Carbon Dioxide: constitutes only about 0.038% (now 0.04%) of the dry air and is a product of combustion. Green plants, through photosynthesis, absorb carbon dioxide from the atmosphere and use it to manufacture food and keep other biophysical processes going. It is an important greenhouse gas, and helps maintain the Heat Budget of Earth. Carbon dioxide and water vapour are found only up to 90 km from the surface of the earth. Water vapour depends on temperature and therefore it decreases from the equator poleward in response to changes in temperature (and evaporation). 0 to 5 % by volume; More than 90% found up to the height of 5 km. Argon: The third important gas which constitutes only about 0.93%. Ozone (O3) Formed at higher altitudes and transported downwards . The ozone layer is between 20 km and 25 km altitude where the greatest concentrations of ozone are found. Protects from harmful UV radiations. Other gases: Neon, helium, hydrogen, xenon, krypton, methane. Particulate Matter: Consists of sand particles (from weathered rocks, and volcanic ash), pollen grains, small organisms, soot, and ocean salts ; the upper layers of the atmosphere may even have fragments of meteors . Help in the absorbing, reflecting, and scattering of the solar radiation which adds the varied charming colours of red and orange at sunrise and sunset. Salt particles become hygroscopic nuclei and thus help in the formation of water drops , clouds, and various forms of condensation and precipitation. Recent research: Microplastics in the atmosphere can act as nuclei for cloud formation, leading to ice crystal formation at temperatures 5 to 10 degrees Celsius warmer than usual."}, {"c": 2, "n": "Climatology", "id": "s1", "t": "Layers Of The Atmosphere:", "x": "Based on Composition: Homosphere : Up to 80 km . The gases are distributed uniformly , therefore, there is a homogenous composition. Heterosphere: Beyond 80 km . Here the gases are layered according to their molecular masses. Based on Change in the temperature: Troposphere: 8-18 km (13 km avg.) It is thicker at the equator (18 km) due to the strong convection experienced here. It's thinner at the poles (8 km). Temperature change: Temperature gradually decreases with height, approx. 1℃ for every 165 meters (normal lapse rate). Why does the temperature reduce? The prime source of heat for the troposphere is terrestrial radiation. As the distance from the surface of the earth increases , the temperature reduces. All weather phenomena like cloud formation, movement of air masses and jet streams, etc , take place in this layer. It is separated from the stratosphere by Tropopause. Stratosphere: Upto 50 kilometres above the earth's surface, beyond the tropopause. Ozone layer : Present in the lower part of the stratosphere . The absorption of ultraviolet (UV) energy from the sun by this ozone causes the temperature to rise with height. Temperatures are highest over the summer pole and lowest over the winter pole in the stratosphere. This layer is almost free from clouds and associated weather phenomena, making conditions most ideal for flying aeroplanes. Sometimes, rarely, cirrus clouds are present at lower levels in this layer. Mesosphere: 50-80 km. Up to the Mesopause The coldest layer of the atmosphere, where the temperature again reduces with the height. The air is so cold just below the mesopause that even the scarce water vapour can be sublimated into polar-mesospheric noctilucent clouds . Most of the meteors burn up in this layer. Thermosphere: 80-400 km. Above the mesopause, temperatures again increase with height. Due to the absorption of energetic ultraviolet and X-ray radiation from the sun. The International Space Station and satellites orbit here. The Kármán line , located at an altitude of 100 km : is widely used to describe the border between Earth's atmosphere and outer space . Ionosphere is a part of this layer, where electrically charged currents flow in the air in this sphere. Radio waves are reflected on the earth from this sphere and due to this radio broadcasting has become possible. Exosphere: Beyond 400 km; High temperature of air particles , but less density , so temperature reduces with height . Above the ionosphere and extends to 400 km above the earth. The air here is extremely rareﬁed . Due to proximity to solar radiations, the temperature of air particles can go up to 1000 ℃. But due to low density, the air particles are so far apart that they are unable to transfer the temperature. Thus, the temperature feels cold."}, {"c": 2, "n": "Climatology", "id": "s2", "t": "Heat & Temperature", "x": "The interaction of insolation with the atmosphere and the earth’s surface creates heat , which is measured in terms of temperature. The distribution of temperature varies both horizontally and vertically. Factors affecting the distribution of temperature: The latitude, which determines the angle of inclination. The higher the angle of inclination, more the distance sun rays have to travel within the atmosphere, which increases the heat lost by the sun rays. So, less heat is transferred to the Earth. This is why the poles, which get slanting solar radiation, are much cooler than the equator, which gets direct sunlight. Duration of sunlight: During the summers, the duration of sunlight is more than during the winters (except at the equator, where day and night are equal). So, summers are warmer. Sunspot Cycle (discussed in the Universe part) Transparency of the atmosphere : On a cloudy day, the clouds obstruct the sunlight from reaching the earth’s surface, which is why cloudy days are cooler. On the other hand, cloudy nights are warmer as the clouds do not allow terrestrial radiation to escape. The same happens when there are lots of aerosols and particulate matter in the atmosphere. Altitude of the place: as the altitude increases, the temperature reduces per the Normal Lapse rate. Orientation: The places to the North of mountain ranges in the Northern Hemisphere, north of the Tropic of Cancer, and those to the South of the Mountain Ranges, south of the Tropic of Capricorn, are perpetually in the shadow of the mountains (until the mountains are eroded). Vegetation cover: Trees undertake transpiration, which has a cooling effect on the environment. Distance from the sea: The continental locations have more extreme temperatures than the coastal locations, due to the moderating impact of the ocean/sea through the land and sea breezes. Ocean Currents: Warm and cold ocean currents increase or reduce the temperature of the place respectively. Local factors like local winds, urban area distribution, etc , can also affect the temperature of a location."}, {"c": 2, "n": "Climatology", "id": "s3", "t": "Ways of heat transfer:", "x": "Conduction: Transfer of heat through a solid material from molecule to molecule . Mechanism: Direct contact between particles , with heat moving from a region of higher temperature to one of lower temperature. Example: A metal rod heated at one end will gradually transfer heat to the other end. Convection: Transfer of heat by the movement of a fluid (liquid or gas). Mechanism: Warmer, less dense fluid rises while cooler, denser fluid sinks , creating a circulation pattern. Example: Boiling water, where hot water rises to the surface and cooler water sinks to the bottom. Advection: Transfer of heat through the horizontal movement of air or water . Mechanism: Large-scale horizontal movement of fluid carrying heat from one place to another. Example: Warm air moving into a region from another area, such as warm winds bringing heat to a cooler area. Radiation: Transfer of heat through electromagnetic waves without the need for a medium . Mechanism: Heat is emitted as infrared radiation and can travel through a vacuum . Example: The heat from the sun warming the Earth. Horizontal temperature distribution: Distribution of temperature across the latitudes over the surface of the earth. Shown by “Isotherms” Generally, from the equator to poleward , the temperature keeps on declining . In general, the equatorial region is hot , and its temperature is high throughout the year. The lowest temperature is at and near the poles. The amount of insolation received varies from latitude to latitude. Regions within the equator and 40° N and S latitudes receive abundant sunlight and hence more heat will be gained than lost. Hence, they are energy surplus regions. Regions beyond 40° N and S latitudes lose more heat than that gained from sunlight. Hence, they are energy deﬁcit regions. The atmosphere (planetary winds) and the oceans (ocean currents) transfer excess heat from the tropics (energy surplus region) towards the poles (energy deﬁcit regions) Most of the heat transfer takes place across the mid-latitudes (30° to 50°), hence the high frequency of storms here. Heat Budget: The earth receives a certain amount of Insolation (incoming short-wave solar radiation) and gives back heat into space by terrestrial radiation (outgoing long-wave terrestrial radiation). Through this give and take, or the heat budget, the earth maintains a constant temperature."}, {"c": 2, "n": "Climatology", "id": "s4", "t": "Albedo", "x": "Albedo is a measure of the reflectivity of a surface , indicating how much solar radiation is reflected by that surface compared to how much is absorbed. Surfaces with high albedo , such as snow and ice , reflect a large portion of incoming solar radiation, contributing to cooling. Conversely, dark surfaces like oceans, forests, and urban areas have low albedo and absorb more solar radiation, leading to warming. Short and Long wave radiation: The higher the temperature of the body, the shorter the wavelength of the electromagnetic radiation released by it. Since the sun has a higher temperature than the Earth, the EMRs from the sun to the Earth are called Short wave radiations, and the EMRs released by the Earth are called Long wave radiations. Vertical Distribution of Temperature: Covered under “Layers of Atmosphere”.= ISOTHERMS Isotherms are the lines joining locations with same temperature. Bending of isotherms refers to the way lines of equal temperature (isotherms) on weather maps deviate from their expected straight east-west pattern. This occurs due to factors like: Land-sea contrast: Land heats and cools faster than water, causing isotherms to bend inland in summer and towards the coast in winter . In Northern Hemisphere (NH): In July, isotherms shift towards equator on land, and towards pole on oceans. In January the isotherms deviate to the pole over the ocean and to the equator over the continent. In Southern Hemisphere (SH), this shift is not very evident due to lack of land. But, though at smaller scale, due to opposite seasons in this hemisphere compared to NH, the shift here is opposite. What NH sees in January, is seen here in July, and vice versa. To summarize, in July, isotherms shift to south over oceans, and north over land. In January the isotherms deviate to the north over the ocean and to the south over the continent. Ocean currents: Warm or cold currents can cause isotherms to bulge or curve depending on their temperature. Topography: Mountains can block or channel air masses , leading to localized temperature variations and bending of isotherms."}, {"c": 2, "n": "Climatology", "id": "s5", "t": "PYQ", "x": "Q.1) A layer in the Earth’s atmosphere called Ionosphere facilitates radio communication. Why? 1. The presence of ozone causes the reflection of radio waves to Earth. 2. Radio waves have a very long wavelength. Which of the statements given above is/are correct? (2011) (a) 1 only (b) 2 only (c) Both 1 and 2 (d) Neither 1 nor 2 Answer: D The ionosphere is deﬁned as the layer of the Earth's atmosphere that is ionized by solar and cosmic radiation. It lies 75-1000 km (46-621 miles) above the Earth. (The Earth’s radius is 6370 km, so the thickness of the ionosphere is quite tiny compared with the size of Earth.) Because of the high energy from the Sun an
