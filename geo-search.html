marine ecosystems, ﬁsheries, and storm tracks across the Paciﬁc basin. In India, the PDO can modulate monsoon variability by influencing ENSO teleconnections , thereby affecting droughts, floods, and long-term climatic trends."}, {"c": 4, "n": "Indian Geography", "id": "s43", "t": "Indian Ocean Dipole", "x": "The Indian Ocean Dipole (IOD) is a climate phenomenon characterized by differences in sea surface temperatures (SSTs) between the western and eastern parts of the Indian Ocean. It has signiﬁcant impacts on weather and climate patterns in the surrounding regions. Characteristics of Indian Ocean Dipole Positive IOD: During a positive IOD event, the Western Indian Ocean (near the eastern coast of Africa) becomes warmer than usual , while the Eastern Indian Ocean (near Indonesia and Australia) becomes cooler . Negative IOD : In a negative IOD event, the Eastern Indian Ocean warms up while the Western Indian Ocean cools down , creating the opposite dipole pattern. Climatological Impacts of Indian Ocean Dipole The IOD has wide-ranging impacts on weather and climate across the Indian Ocean rim and beyond: Indian Subcontinent: Monsoon Variability : A positive IOD often enhances the Indian monsoon , leading to above-average rainfall in the Indian subcontinent. Conversely, a negative IOD can suppress the monsoon , causing drought conditions in the region. Australia : Positive IOD events are typically associated with drier conditions in Australia, particularly in the southeastern parts, leading to droughts and increased bushﬁre risk. Negative IOD events bring wetter conditions , increasing the likelihood of floods. East Africa : Positive IOD events can lead to increased rainfall in East Africa, resulting in wetter conditions and sometimes causing floods. Negative IOD can lead to drier conditions and droughts in the region. Indonesia and Southeast Asia : During a positive IOD , Indonesia and parts of Southeast Asia can experience drier conditions , affecting agriculture and water resources. Negative IOD usually brings wetter conditions to these areas. Global Climate Teleconnections : El Niño Interaction: The IOD often interacts with El Niño-Southern Oscillation (ENSO) phenomena."}, {"c": 4, "n": "Indian Geography", "id": "s44", "t": "Atlantic Ocean Dipole", "x": "The Atlantic Ocean Dipole (AOD), also known as the Atlantic Zonal Mode , refers to the climate variability pattern characterized by sea surface temperature (SST) anomalies between the northern tropical Atlantic (NTA) and the southern tropical Atlantic (STA). Characteristics of Atlantic Ocean Dipole Positive Phase : During the positive phase, the northern tropical Atlantic experiences warmer SSTs, while the southern tropical Atlantic sees cooler SSTs . Negative Phase : In the negative phase, the northern tropical Atlantic has cooler SSTs , and the southern tropical Atlantic is warmer . Atlantic Nino & Nina Atlantic Nina: The Atlantic Ocean cousin of La Nina. When the eastern equatorial Atlantic cools down more than normal , western equatorial Atlantic warms up. Atlantic Nino: warming of eastern equatorial Atlantic and cooling of Western equatorial Atlantic. Do not have as wide climatic impacts as Paciﬁc El Nino and la nina."}, {"c": 4, "n": "Indian Geography", "id": "s45", "t": "Arctic Ocean Dipole", "x": "The Arctic Ocean Dipole (AOD) or Arctic Dipole Anomaly refers to the sea level pressure pattern in the Arctic."}, {"c": 4, "n": "Indian Geography", "id": "s46", "t": "Madden Julian Oscillation", "x": "The Madden-Julian Oscillation (MJO) is a major atmospheric phenomenon that signiﬁcantly influences global weather patterns and climate. It is characterized by a large-scale coupling between atmospheric circulation and tropical deep convection, primarily affecting the Indian and Paciﬁc Oceans. Characteristics of the MJO Propagation: The MJO is an eastward-moving disturbance of clouds, rainfall, winds, and pressure that typically recurs every 30 to 60 days. It travels from the Indian Ocean across the Paciﬁc Ocean and sometimes continues into the Atlantic. Phases: The MJO consists of two primary phases: Active (Convective) Phase: Characterized by enhanced cloudiness and precipitation. This phase is associated with increased convection and storm activity. Inactive (Suppressed) Phase: Marked by reduced cloudiness and precipitation , leading to drier and more stable conditions. Climatological Impacts of the MJO Tropical Regions: Monsoon Variability: The MJO affects monsoon systems in Asia, Africa, and Australia. During the active phase, it can enhance monsoon rainfall , while the inactive phase can suppress it . For instance, the Indian monsoon can see increased rainfall during the MJO's active phase. The shorter the cycle, the better the impact on the monsoon. Cyclone Formation: The MJO can modulate the formation of tropical cyclones. Enhanced convection during the active phase increases the likelihood of cyclone development in the Indian Ocean, Paciﬁc Ocean, and Atlantic Ocean."}, {"c": 4, "n": "Indian Geography", "id": "s47", "t": "Seasons Of India: Retreating Monsoon Season", "x": "Shift of ITCZ and increase in pressure over Northern India. October Heat : High Temperature and Humidity. Its causes include: As the southwest monsoon retreats, there is a transition period where the atmospheric moisture remains high, but the cooling effect of the rains is absent , leading to increased humidity and heat. With the reduction in cloud cover post-monsoon, there is increased solar radiation , which raises daytime temperatures. Northeast Monsoon experienced in this season in coastal Andhra Pradesh and a major part of Tamil Nadu , due to movement of the Northeastern trade winds from over the Bay of Bengal. During the El Nino years, the SW Monsoons get weaker while the NE Monsoons get stronger. During the La Nina years, the NE Monsoons get weaker while the SW Monsoons get stronger. Season of most severe cyclones , especially in the Bay of Bengal (high sea surface temperature; southward shift of monsoon trough; change in wind direction)"}, {"c": 4, "n": "Indian Geography", "id": "s48", "t": "Spatial Distribution Of Rainfall In India", "x": "High Rainfall Regions (>200 cm annually) Windward side of Western Ghats: This includes the western coastal strip and the Western Ghats, extending from southern Gujarat through Maharashtra, Goa, Karnataka, and Kerala. Northeastern India: Primarily Assam, Meghalaya, and parts of Arunachal Pradesh. Notable places include Cherrapunji and Mawsynram, which receive some of the highest rainfall in the world. Funneling effect: Clouds get channeled into constricted space between mountains. Happens in NE India. Andaman and Nicobar Islands: Island location. Experience both South-West and North-East Monsoons. Medium Rainfall Regions (100-200 cm annually) Foothills of the Himalayas: This includes regions in Uttarakhand, Himachal Pradesh, and northern West Bengal (like Darjeeling). Eastern India: Odisha, Jharkhand, Bihar, Eastern MP, parts of North East India. East Tamil Nadu (NE Monsoon). Low Rainfall Regions (50-100 cm annually) Parts of Peninsular India: Parts of Deccan plateau in Maharashtra and Karnataka. North-Western India: Punjab, Haryana, western Uttar Pradesh, Gujarat, and Eastern Rajasthan. Parts of Jammu Kashmir. Very Low Rainfall Regions ( Rajsthan: This includes the semi-arid regions of Rajasthan, particularly the Western part. Rain Shadow Regions: The eastern slopes of the Western Ghats, including parts of Maharashtra, Karnataka, and Tamil Nadu. Also Ladakh (rainshadow of the Himalayas)."}, {"c": 4, "n": "Indian Geography", "id": "s49", "t": "PYQs", "x": "Q.) La Nina is suspected to have caused recent floods in Australia. How is La Nina different from El Nino? 1. La Nina is characterised by unusually cold ocean temperature in the equatorial Indian Ocean whereas El Nino is characterised by unusually warm ocean temperatures in the equatorial Paciﬁc Ocean. 2. El Nino has an adverse effect on the south-west monsoon of India, but La Nina has no effect on monsoon climate. Which of the statements given above is/are correct? (2011) (a) 1 only (b) 2 only (c) Both 1 and 2 (d) Neither 1 nor 2 Answer: D La Niña is a climate pattern that describes the cooling of surface ocean waters along the tropical west coast of South America ( It means when Peru/Chile cold current reestablished itself). La Nina is considered to be the counterpart to El Nino, which is characterised by unusually warm ocean temperatures in the equatorial region of the Paciﬁc Ocean. Over the Indian subcontinent, El Nino during winter results in the development of warm conditions. During summer, it leads to dry conditions and deﬁcient monsoon. It also leads to drought in Australia. On the other hand, La Nina results in better than normal monsoon in India. At the same time, in Australia, it has caused floods. La Nina is characterised by unusually cold ocean temperature in the equatorial Indian Ocean whereas, El Nino is characterised by unusually warm ocean temperature in the equatorial Paciﬁc Ocean.El Nino has an adverse effect on the south-west monsoon of India, but La Nina has no effect on the monsoon climate. Q.) With reference to ‘Indian Ocean Dipole (IOD)’ sometimes mentioned in the news while forecasting Indian monsoon, which of the following statements is/are correct? 1. IOD phenomenon is characterized by a difference in sea surface temperature between tropical Western Indian Ocean and tropical Eastern Paciﬁc Ocean. 2. An IOD phenomenon can influence El Nino’s impact on the monsoon. Select the correct answer using the code given below: (2017) (a) 1 only (b) 2 only (c) Both 1 and 2 (d) Neither 1 nor 2 Answer: B The Indian Ocean Dipole (IOD) is deﬁned by the difference in the sea surface temperature between the two equatorial areas of the Indian Ocean – a western pole near the Arabian Sea (in western Indian Ocean) and an eastern pole closer to the Bay of Bengal (in the eastern Indian Ocean). The IOD affects the climate of Southeast Asia, Australia and other countries that surround the Indian Ocean Basin. The Indian Monsoon is invariably influenced by the IOD. A positive IOD occurs when the sea surface temperatures are greater than normal in the Arabian Sea and less than normal in the tropical eastern Indian Ocean. When the reverse is the case, a negative IOD is said to have developed. A positive IOD leads to greater monsoon rainfall and more active (above normal rainfall) monsoon days while negative IOD leads to less rainfall and more monsoon break days (no rainfall). El-Nino conditions normally result in diminished monsoonal rainfall. However, if there is a positive IOD, it can bring good rains to India despite an El Nino year. Q.) With reference to the climate of Andaman and Nicobar Islands, which of the following statements is/are correct? 1. The climate can be deﬁned as a humid, tropical coastal climate. 2. It receives rainfall from both South-west monsoon and North-east monsoon. 3. Maximum precipitation is between December and May. Select the answer using the code given below: (a) 1 only (b) 1 and 2 (c) 2 and 3 (d) 3 only Answer: B The Andaman and Nicobar Islands experience a humid tropical maritime/coastal climate. In Ocean, so both SW and NE winds are onshore. Maximum rainfall generally occurs during the South-West Monsoon months, especially May to September. (Heat=LP=rain, and NH has heat in March-Sept)"}, {"c": 4, "n": "Indian Geography", "id": "s50", "t": "FORESTS OF INDIA", "x": "India boasts of a variety of vegetation , owing to the diverse climatic conditions . Important forest types in India include: Tropical Evergreen and Semi Evergreen forests. Tropical Deciduous forests. Tropical Thorn forests. Montane forests. Littoral and Swamp forests."}, {"c": 4, "n": "Indian Geography", "id": "s51", "t": "Tropical Evergreen Forests:", "x": "The trees do not shed their leaves due to optimal conditions all year round. Due to high canopy density, they lack an undergrowth. Depending upon the precipitation levels, they can be further divided into the following types: Wet Evergreen: Rainfall >200cm; Temperature: 25-27 degrees C Found in Western Ghats (south of Mumbai), Northeast India, Andaman & Nicobar Jackfruit, Rosewood, Mahogany, Aini, ebony, Agarwood (Oudh) etc Semi-Evergreen: Bordering wet evergreen Rainfall: 175-225cm; Temperature: 24-27 degrees C Found in the Western Coast, Assam, the lower slope of Eastern Ghats, Odisha, and parts of Andamans. Transition between wet evergreen and moist deciduous . Have a mix of trees from both the above forests. Evergreen due to undergrowth . Kadam, Cashew, cedar, chestnut, thorny bamboo, etc. Dry Evergreen About 100 cm of rain spread throughout the year. Found on the Tamil Nadu coast . They have short trees as the amount of rainfall here is low. Tamarind, Neem, toddy palm, etc."}, {"c": 4, "n": "Indian Geography", "id": "s52", "t": "Tropical Deciduous Forests", "x": "The trees in these forests shed their leaves once a year. Based on the amount of precipitation received, can be classiﬁed into: Moist Deciduous: Rainfall: 100-200cm; Temperature: about 27 degrees C Found in parts surrounding western ghats, NE India, Shiwalik range (along Terai & Bhabher belt); hills of Eastern MP, CG, Chotanagpur plateau; most of Odisha, parts of WB & Andaman and Nicobar. They have a shrubby undergrowth. Valuable trees like teak, sal, mahua, tendu, bamboo, etc. Dry Deciduous: Rainfall: 75-100 cm. Transition between moist deciduous and thorny forests . Found in the rainier parts of the Peninsula, plains of UP, Bihar, and Madhya Pradesh. Some parts of Rajasthan, also show these type of forests, but with scantier growth. Teak, tendu, Red Sanders, sal, Khair, etc."}, {"c": 4, "n": "Indian Geography", "id": "s53", "t": "Tropical Thorny Forests:", "x": "Found in Arid locations. Rain Low, widely scattered trees In India, they are present in Arid, Semi-arid Northwestern India: Rajasthan, SW Punjab, Western Haryana, Kachchh, Saurashtra, some parts of UP; lee-side of Western Ghats (MH, Karnataka, Telangana, Andhra Pradesh, Tamil Nadu) Acacia, Babul, Neem, Khair, Cacti. In wetter margins, Indian wild date and some grasses."}, {"c": 4, "n": "Indian Geography", "id": "s54", "t": "Littoral & Swamp", "x": "In and around deltas, estuaries, and creeks. Highly developed in the Andaman and Nicobar Islands and Sunderbans (Sundri tree) of West Bengal. Also seen in Mahanadi, the Godavari and the Krishna deltas. These are the mangrove forests , which are important for protecting the coastline from erosion, storm surges, and tsunamis, but their capacity to adapt to rising sea levels is being compromised. Mangroves play a crucial role in coastal protection, biodiversity, and carbon sequestration, but their capacity to adapt to rising sea levels is being compromised. India has about 7% of the world’s Mangrove forests . Survive and grow in both fresh & Brackish water. Have special adaptations like Viviparity and Pneumatophores . Sundri, Keora, Agar, Rhizophora, etc."}, {"c": 4, "n": "Indian Geography", "id": "s55", "t": "Alpine:", "x": "In the mountain regions, depending on the altitude , different types of forests are found. In the Northern Mountains: The base region has moist deciduous forests , as the height increases, the forests become temperate. At further heights, beyond the tree line, up to the snow line, there is alpine tundra vegetation . At 1000-2000m we get wet temperate forests with Pine trees. British replaced Oaks with Pine in these forests, and used it for laying Railways. Above this upto 3000 m (approx) are Blue Pine, Spruce and some Grasslands. 3000-4000m: Alpine forests (Silver ﬁrs, Junipers, Rhodohenderon), and Grasslands (Bugyals) At further heights, beyond the tree line, up to the snow line, there is alpine tundra vegetation. The Northern slopes of the Himalayas do not have much vegetation , as this region continuously remains devoid of sunlight. Southern Mountains (Western Ghats): On their western slopes , at the base they have evergreen forests which eventually convert into temperate evergreen forests known as sholas , as the height increases. Found in Nilgiris, Annmalai and Palani hills mainly. On the eastern slopes there are dry evergreen or deciduous forests , which again change into temperate sholas as the height increases. Due to height limitation, the southern forests do not have alpine tundra type of vegetation."}, {"c": 4, "n": "Indian Geography", "id": "s56", "t": "Status of Indian Forests:", "x": "Key Points: Total forest and tree cover is 8,27,357 sq km (25.17% of India's geographical area). Forest cover is 7,15,343 sq km (21.76%), and tree cover is 1,12,014 sq km (3.41%). As compared to 2021, forest and tree cover increased by 1445 sq km (156 sq km increase in the forest cover and 1289 sq km increase in tree cover) However, this is still below the recommended 33% for ecological stability. The total mangrove cover in the country is 4,992 sq km. The bamboo-bearing area has increased compared to the 2021 assessment by 5227 sq. km. Forest cover in hill districts increased by 234.14 sq.km. 19 states/UTs have over 33% forest cover, with 8 states/UTs—Mizoram, Lakshadweep, Andaman & Nicobar Islands, Arunachal Pradesh, Nagaland, Meghalaya, Tripura, and Manipur—having over 75% forest cover. Among the six megacities—Bengaluru, Chennai, Delhi, Kolkata, Hyderabad, and Mumbai—Delhi has the highest forest cover Concerns: Total cover grew only by 1445 sq.km, compared to 1540 sq.km in 2021. Notable decrease in Andhra Pradesh and Maharashtra. Decline in total mangrove cover by 7.43 sq.km. In Western Ghats Ecologically Sensitive Area, an overall loss of 58.22 km² in forest cover in the past 10 years. In North-East India, decline in forest cover by 327.30 sq. km Difference between 2021 & 2023 reports: Separate chapter on Agroforestry. Re-introduction (after 10yrs) of chapter on “Forest characteristics” which talks about soil health, grazing instances etc. Bamboo cover estimates done and added under tree cover. For the ﬁrst time, an estimate of tree cover contributed by smaller trees with a diameter of 5 to 10 cm at breast height has been provided. Reason: smaller trees like Sababul are being planted for commercial purposes. Gives estimates for 751 districts compared to 636 in 2021. FAO Report: According to the latest report ( State of World’s Forests Report ) by FAO (released July 22, 2024), India gained 2,66,000 hectares of forest area annually from 2010 to 2020 , securing the third spot (after China and Australia) among the top 10 countries with the most signiﬁcant forest area gains during this period. FAO appreciated Indian efforts in Agroforestry and reclamation of degraded lands for forestry. FAO's Global Forest Resources Assessment (GFRA) 2025 report indicates that India has risen to 9th globally in total forest area and maintains its 3rd position for annual net forest area gain . The report also highlights that global deforestation rates have slowed but remain high, and Asia is the only continent to have seen an increase in forest area since 1990 , thanks to contributions from countries like India and China."}, {"c": 4, "n": "Indian Geography", "id": "s57", "t": "Social Forestry", "x": "Social forestry is a land management approach that aims to increase tree cover and improve the livelihoods of rural communities through the involvement of local people. The emphasis is on planting trees that meet the social and economic needs of local communities, while also providing environmental beneﬁts. The term \"social forestry\" was ﬁrst used in India in 1976 by the National Commission on Agriculture. Its types include: Community Forestry: This involves local communities actively participating in the management of forests on degraded or wasteland. Urban Forestry: This type of social forestry involves planting and managing trees in urban areas , including parks, streetscapes, and institutional lands. Miyawaki method: Japanese method. Growing native trees in high density in a region. Extension Forestry: Extension of forests in previously non-forested regions. This approach involves educating and empowering rural communities about the beneﬁts of trees and providing technical assistance for tree planting and management. Agroforestry: This combines trees and shrubs with crop production on the same land. ( Not necessarily by a single farmer ). Farm Forestry: Focus: This approach encourages farmers to integrate trees into their existing agricultural lands for commercial as well as protection purposes. Beneﬁts: Trees planted along ﬁeld borders or in small woodlots provide wind protection for crops, reduce soil erosion, and offer additional income from timber, fruits, or other non-timber forest products (NTFPs). Advantages: Social Beneﬁts: Creates rural employment opportunities through tree planting and maintenance. Provides fuelwood, fodder, and other forest products for local communities , improving livelihoods. Empowers local communities through participation in decision-making and management of forest resources. Economic Beneﬁts: Provides a source of income for rural communities through the sale of timber, fruits, and other non-timber forest products (NTFPs) like medicinal plants and honey. Environmental Beneﬁts: Increased tree cover helps mitigate climate change by absorbing carbon dioxide. Reduces soil erosion and promotes land reclamation . Provides habitat for diverse species, promoting biodiversity . Reduces dependence on traditional forests , potentially leading to less deforestation. Supports sustainable agriculture by improving soil quality and providing wind protection."}, {"c": 4, "n": "Indian Geography", "id": "s59", "t": "Multiple factors affect the formation of soils:", "x": "Relief (Topography): o Slope: Steeper slopes experience faster erosion, leading to thinner and less developed soils. Gentle slopes allow for better weathering and accumulation of organic matter, promoting richer soil development. o Drainage: Well-drained areas allow for water to percolate through the soil, influencing nutrient leaching and mineral composition. Poorly drained areas can lead to waterlogging, affecting oxygen availability and plant growth. o Aspect: South-facing slopes in the Northern Hemisphere receive more sunlight, leading to faster decomposition of organic matter and potentially drier soils. North-facing slopes may have slower decomposition and cooler, moister soils. Parent Material (Bedrock): o Texture: The type of rock the soil forms from determines its initial mineral content. For example, granite weathers into sandier soils, while basalt weathers into clay-rich soils. o Chemical composition: Parent material can influence soil fertility. Rocks rich in certain minerals like calcium or potassium can contribute to a more fertile soil. Climate: o Temperature: Warmer temperatures accelerate the rate of chemical weathering of rocks, releasing minerals for soil formation. Cold temperatures slow down the process. o Precipitation: Rainfall patterns directly impact soil development. High rainfall can leach nutrients from the upper layers, while low rainfall can lead to salinization in arid regions. Vegetation and Other Forms of Life (Biota): o Plants: Plant roots help break down rocks, contributing to physical weathering. Decomposing plant matter adds organic material to the soil, enhancing fertility and soil structure. o Microorganisms: Bacteria and fungi in the soil break down organic matter and rock minerals, releasing nutrients for plants and influencing soil structure. o Animals: Earthworms and burrowing animals improve aeration and drainage by creating tunnels in the soil. Time: o Soil formation is a slow and continuous process. Over time, the interaction of the above factors leads to the development of distinct soil horizons with varying characteristics. The older the soil, the more developed and mature its proﬁle will be . o Time helps in the further disintegration of the rocks into ﬁner material and the addition of minerals to the soil via various biotic and abiotic activities. Anthropogenic Factors: The Indian Council of Agriculture Research Deﬁnes 8 types of soils in India: Alluvial soil Red and Yellow soil Black soil Arid Desert soil Laterite soil Saline soil Peaty / marshy soil Forest & Mountain soil Descriptions of the soils: Alluvial: The most common soil of India , covering >40% Indian area. Found in Northern Plains, Coastal Plains. Types include Bhangar, i.e. the less fertile older alluvium, and Khadar, i.e. the more fertile newer alluvium. Rich in Potash, and Lime, Phosphoric acid . Poor in Nitrogen, Humus . Ideal for the growth of sugarcane, paddy, wheat, and other cereal and pulse crops . Black (Regur): 3rd common soil of India. Plateaus of Maharashtra, Saurashtra, Madhya Pradesh, and Chhattisgarh; also extend in the Southeast direction along the Godavari and the Krishna valleys. Rich: Magnesium, potash, iron, lime and alumina. Poor: Phosphoric contents, Nitrogen, and organic matter. When dry, it develops cracks which gives it self-ploughing ability. High water retention , making it an ideal soil for rain-fed agriculture. Important crops: Cotton and sugarcane, Pulses Very ideal for the growth of cotton, and often called Cotton soil too. Red (& Yellow) soil Develops on crystalline igneous rocks, rich in Iron, giving it a red hue. Becomes yellow when iron occurs in hydrated form. Red soil is found in areas of low rainfall in the eastern and southern parts of the Deccan Plateau and also along the Piedmont zone of the Western Ghats. Yellow in parts of Odisha & Chhattisgarh. Rich in Iron, Potash; Poor in Nitrogen, Phosphorous, and Humus Fertile if ﬁne-grained. Important Crops: Wheat, cotton, pulses, t"}, {"c": 4, "n": "Indian Geography", "id": "s61", "t": "Descriptions of the soils:", "x": "Found in Southern states, the Western Ghats region of Maharashtra, Odisha, some parts of West Bengal, and the North-east regions. Tea, coffee, Cashew Arid Soils Sandy & Saline soil Lack of moisture, Humus, and Nitrogen; Phosphorous is adequate. Include Calcium Kankar nodules which reach the topsoil layers by the capillary action. Can be cultivated if irrigation is available . E.g. The Indira Gandhi Canal project has helped cultivate these soils. Found in Rajasthan, in and around the Thar desert. Millets, Fodder crops, some beans (Guar Beans), wheat if irrigated . Saline Soils Also called Usara soil. Infertile, with a large proportion of salts of Sodium, Potassium, Magnesium, etc. Found in arid and semi-arid parts of Rajasthan, Punjab, Uttar Pradesh, Haryana, Gujarat (Kachchh), and Maharashtra. In some parts, coconuts, and salt resistant fodder crops being grown ( White Revolution Impact ). Peaty/Marshy In the areas of heavy rainfall and high humidity. Rich in humus , and organic content may go even up to 40-50 percent . If properly drained and fertilized , can be used for cultivating crops like rice . In Odisha, the Sundarbans in West Bengal, parts of Bihar, Uttar Pradesh, and parts of Kerala. Forest & Mountain Soil In Forest areas, with adequate rainfall . In Forest regions of Himalayas, Western and Eastern Ghats. They vary in their structure and texture depending upon the mountain environment where they are formed. Valley sides- loamy and silty soil (can be used to grow rice and wheat) Upper slopes- coarse-grained soil (can be used for Horticulture)"}, {"c": 4, "n": "Indian Geography", "id": "s62", "t": "Soil Degradation", "x": "Soil degradation is the decline in quality and health of soil . It's a gradual process caused by various factors that diminish the soil's ability to support life. Excessive degradation can cause desertiﬁcation. According to a UNCCD Report, deforestation, urbanization, and unsustainable farming practices are causing land degradation at an unprecedented scale, affecting 15 million square kilometers—an area larger than Antarctica. The report emphasizes that the global area impacted by land degradation is expanding by about 1 million square kilometers each year, posing signiﬁcant threats to biodiversity, climate stability, and human livelihoods. Causes of Soil Degradation: Soil Erosion: Wind and water can wear away topsoil, the most fertile layer. This happens due to: Deforestation: Lack of trees exposes soil to wind and heavy rain. Unsustainable farming practices: Tilling practices and leaving ﬁelds bare leave soil vulnerable. Overgrazing: Excessive grazing by livestock removes vegetation and compacts soil. Chemical Degradation: Excessive use of fertilizers and pesticides can disrupt the natural balance of nutrients and soil organisms. Improper use of chemicals can lead to salinization, where salts accumulate in the soil, making it unsuitable for plant growth. Improper irrigation practices can lead to an increase in the acidity of soils. Physical Degradation : Activities like mining, construction, and heavy machinery trafﬁc can damage soil structure and reduce fertility."}, {"c": 4, "n": "Indian Geography", "id": "s63", "t": "INDIA: A SUB-CONTINENT", "x": "Has natural borders , separating it from the rest of Asia (The Himalayas). Sits on a separate plate which has a geological history separate from the rest of Asia (rest of Asis in Eurasian plate, which was part of Laurasia; India was a part of Gondwanaland). Within itself has almost all the major global climate and forest types , ranging from deserts to Tundra. Because of its Physical separation from the rest of Asia, has a distinct history, cultures, traditions , etc."}, {"c": 4, "n": "Indian Geography", "id": "s64", "t": "PYQ", "x": "Q.) Consider the following statements: Statement-I : The soil in tropical rain forests is rich in nutrients. Statement-II : The high temperature and moisture of tropical rain forests cause dead organic matter in the soil to decompose quickly. Which one of the following is correct in respect of the above statements? (2023) Both Statement-I and Statement-II are correct and Statement-II is the correct explanation for Statement-I Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for Statement-I Statement-I is correct but Statement-II is incorrect Statement-I is incorrect but Statement-II is correct Answer: D The soil of Tropical Rainforests is highly leached and poor in nutrients. Though there is a high availability of leaf litter and high decomposing activity, the trees in the region consume these nutrients as fast as they are produced. This leaves the soil devoid of nutrients. Q.) The 2004 Tsunami made people realise that mangroves can serve as a reliable safety hedge against coastal calamities. How do mangroves function as a safety hedge? (2011) The mangrove swamps separate the human settlements from the sea by a wide zone in which people neither live nor venture out\\ The mangroves provide both food and medicines which people are in need of after any natural disaster The mangrove trees are tall with dense canopies and serve as art excellent shelter during a cyclone or tsunami The mangrove trees do not get uprooted by storms and tides because of their extensive roots. Answer: D Beneﬁts of mangroves: Coastal protection: The dense root systems of mangrove forests trap sediments flowing down rivers and off the land. This helps stabilize the coastline and prevents erosion from waves and storms. In areas where mangroves have been cleared, coastal damage from hurricanes and typhoons is much more severe. By ﬁltering out sediments, the forests also protect coral reefs and seagrass meadows from being smothered in sediment. Fisheries: Mangrove forests are home to a large variety of ﬁsh, crab, shrimp, and mollusk species. These ﬁsheries form an essential source of food for thousands of coastal communities around the world. The forests also serve as nurseries for many ﬁsh species, including coral reef ﬁsh. This makes mangrove forests vitally important to coral reef and commercial ﬁsheries as well. Timber and plant products: Mangrove wood is resistant to rot and insects, making it extremely valuable. Many coastal and indigenous communities rely on this wood for construction material as well as for fuel. These communities also collect medicinal plants from mangrove ecosystems and use mangrove leaves as animal fodder. Recently, the forests have also been commercially harvested for pulp, wood chip, and charcoal production. Tourism: Given the diversity of life inhabiting mangrove systems, and their proximity in many cases to other tourist attractions such as coral reefs and sandy beaches, it is perhaps surprising that only a few countries have started to tap into the tourism potential of their mangrove forests. Q.) Which of the following statements regarding laterite soils of India are correct? 1. They are generally red in colour. 2. They are rich in nitrogen and potash. 3. They are well-developed in Rajasthan and UP. 4. Tapioca and cashew nuts grow well on these soils. Select the correct answer using the codes given below. (2013) (a) 1 only (b) 1 and 2 only (c) 1 and 4 only (d) 1, 2, 3 and 4 Ans: C Laterite is soil and rock type rich in iron and aluminium but poor in nitrogen, potash, potassium, lime and organic matter and is commonly considered to have formed in hot and wet tropical areas. Nearly all laterites are of rusty-red colouration , because of high iron oxide content. They develop by intensive and prolonged weathering of the underlying parent rock. Tropical weathering (alteration) is a prolonged process of chemical weathering which produces a wide variety in the thickness, grade, chemistry an"}, {"c": 4, "n": "Indian Geography · quick", "id": "q-1-location-and-neighbours", "t": "1 · Location and neighbours", "x": "🚂 Standard Meridian 82°30′E passes through 5 states – \"U C My Old Aunt\": Uttar Pradesh · Chhattisgarh · Madhya Pradesh · Odisha · Andhra Pradesh. (Handout mnemonic.) Fact Number Area 32,87,263 km² · 7th largest · 2.4% of world area North–south (Indira Col → Kanyakumari) 3,214 km · East–west (Rann of Kutch → Arunachal) 2,933 km Latitudes / longitudes 8°4′N (6°45′ for islands) to 37°6′N · 68°7′E to 97°25′E · wholly Northern Hemisphere Southernmost point Indira Point / Pygmalion Point, 6°45′N Time 1° longitude = 4 min · east–west gap ≈ 2 hrs · Chai Bagan time = 1 hr ahead of IST (British, NE India) Tropic of Cancer splits India in two; north ≈ 2× south; 8 states: Gujarat, Rajasthan, MP, CG, Jharkhand, West Bengal, Tripura, Mizoram Borders land 15,106.7 km through 17 states · coastline 11,098 km, 13 states/UTs · longest = Bangladesh · shortest = Afghanistan (Wakhan) Landlocked / no border states Telangana, MP, CG, Jharkhand, Delhi, Chandigarh, Haryana have no international border or coastline – all others are \"frontline\" Neighbours clockwise: Pakistan, Afghanistan, China, Nepal, Bhutan, Bangladesh, Myanmar, Sri Lanka, Maldives, Indonesia. Neighbour Bordering Indian states/UTs Pakistan J&K, Ladakh, Punjab, Rajasthan, Gujarat Afghanistan Ladakh China Ladakh, HP, Uttarakhand, Sikkim, Arunachal Nepal UP, Uttarakhand, Bihar, Sikkim, West Bengal Bhutan Assam, Sikkim, Arunachal, West Bengal Bangladesh West Bengal, Assam, Meghalaya, Mizoram, Tripura Myanmar Arunachal, Nagaland, Manipur, Mizoram PYQs on location. 2015 (ans D): easternmost/westernmost states = Arunachal Pradesh and Gujarat. 2018 (ans A): the city on the longitude closest to Delhi = Bengaluru (both ≈ 77°E). 2017 (ans B): Kohima → Kottayam by road needs 7 states (Nagaland, Assam, WB, Odisha, AP, TN, Kerala)."}, {"c": 4, "n": "Indian Geography · quick", "id": "q-2-six-physical-divisions-the-map-of-india", "t": "2 · Six physical divisions (the \"map\" of India)", "x": "🏔️→🏝️ Walk top to bottom: \"Mountains, Plains, Desert, Plateau, Coasts, Islands\" – \"My Parents Do Play Cricket Indoors\". These are the handout's six units. 2.1 Northern & North-eastern mountains Origin: Indian–Eurasian plates converge; Tethys sediments fold. Multiple upliftment episodes → parallel ranges; steep south, gentle north (hogback); ridge-valley topography. 2,500 km long; width 500 km (Kashmir) → 200 km (Arunachal). Main Himalaya runs from Nanga Parbat (Indus gorge) to Namche Barwa (Brahmaputra gorge) = the two syntaxial (knee-joint) bends; then the Purvanchals. Spread over 13 states/UTs. Belt Also called Height Notes Trans-Himalaya Karakoram, Ladakh, Zaskar highest, cold dry maximum glaciers in Karakoram; K2 (Godwin-Austen); Ladakh = highest Indian plateau; Zaskar south of the Indus; Kailash entirely outside India Great Himalaya Himadri, inner avg 6,100 m tallest peaks Middle Himalaya Himachal, Lesser 3,500–4,500 m Pir Panjal, Dhauladhar (southernmost HP range), Kumaon, Mussoorie, Mahabharat; Karewas (clay-silt-sand-gravel of Pleistocene lakes, between Pir Panjal and Zaskar) → saffron (zafran), walnuts, almonds; Bugyals (high meadows) Outer Himalaya Shiwaliks lowest nearly unbroken, gap of 80–90 km at Teesta valley 🛌 Foothill sleep-over, top to bottom: mountain → Bhabar (stones – rivers vanish underground) → Terai (swamp – rivers reappear) → plains. Duns (Dehradun, Patli, Kota) = valleys between Shiwaliks and Himachals (west); Duars = floodplain foothills in NE; Chos/Choes/Raos = seasonal Shiwalik streams of Punjab (sandy beds). Transhumance (seasonal herding to bugyals): Bakarwals, Gaddis, Bhotiyas, Drokpas. Purvanchals: crescent, convex to west, perpendicular to Himalaya; Mishmi & Patkai Bum, Naga, Kohima, Manipur hills (Loktak), Barail (separates Manipur & Naga hills; divides Brahmaputra and Barak basins), Mizo (Lushai). Rough, forested = hard to develop. Regional Himalaya Limits Peaks / valleys (as printed) Punjab/Kashmir/Himachal Indus → Sutlej Nanga Parbat 8,126 m · K2 8,611 m · Dhaulagiri I 8,167 m · Kashmir, Kullu, Kangra valleys Kumaon (central) Sutlej → Kali Nanda Devi 7,816 m (highest peak entirely in India) · Nanda Kot 7,818 m · Trishul 7,120 m · Valley of Flowers (UNESCO) · Ganga source Nepal (eastern) Kali → Teesta Everest 8,848 m · Kanchenjunga 8,586 m (3rd highest) · Lhotse 8,516 m · Annapurna I 8,091 m Assam (easternmost) Teesta → Arunachal/Purvanchals Namche Barwa 7,756 m · Manas NP (UNESCO) ⚠️ Handout alert: Nanda Devi 7,816 m vs Nanda Kot 7,818 m (and the 2022 PYQ note says Nanda Devi 7,817 m). Learn ~7,816 and, in the exam, rely on \"highest entirely in India\" rather than the digit. 2.2 Peaks, passes, glaciers (image pages – read for you) 🗺️ \"Highest peak of …\" = the favourite question. Remember by region walking west → east → south: Region Peak → what the handout says Trans/Himadri Nanga Parbat – Ladakh Himadri, >8,000 m, syntaxial bend · K2/Godwin-Austen – Karakoram, 2nd highest in world · Broad Peak, Gasherbrum I & II – Gasherbrum group, all >8,000 m · Nun (J&K) and Kun (Ladakh) – Himadri HP Reo Purgyil – highest of HP, Zaskar Range Uttarakhand Satopanth (Satopanth Lake at foot) · Kamet – highest of Uttarakhand and of Zaskar · Trishul – group of 3 peaks like a trident · Nanda Devi – Greater Himalaya, UNESCO World Heritage (with its NP) Shiwalik peaks Karoh – highest of Haryana · Amsot – highest of UP · Someshwar – highest of Bihar East Himalaya Kanchenjunga – highest Himalayan peak in India, Sikkim, biosphere reserve + NP, India's first UNESCO mixed heritage site · Sandakphu – highest of West Bengal, Darjeeling, tea · Tiger Hill – Himachal range · Kangto – highest of Arunachal Purvanchal / NE Dapha Bum – highest of Purvanchals (Mishmi) · Saramati – Nagaland · Mt Esii/Iso – Manipur · Phawngpui (Blue Mountain) – Mizoram · Betlingchhip (Thaidawr Tlang) – Tripura · Nokrek – Garo, NP + biosphere reserve · Shillong Peak – Khasi, highest of Meghalaya · Tumjang/Sielkal/Thingtuibung – Barail, highest of "}, {"c": 4, "n": "Indian Geography · quick", "id": "q-3-drainage-and-water-resources", "t": "3 · Drainage and water resources", "x": "Factors: slope/relief · rock permeability (basalt low; granite impermeable) · rainfall + snowfall · perennial vs seasonal · geological time · humans (deforestation, urbanisation, dams). Type Meaning Example Consequent flows down the original slope Himalayan streams Subsequent tributary on softer rock Appalachian Antecedent river older than the uplift, cuts gorges Indus, Brahmaputra (through Himalaya); Ghaghara Superimposed pattern from older landscape laid onto new rocks Subarnarekha Concordant = follows structure (stable regions) · Discordant = does not (uplift/erosion past) Big numbers: 77% drains to Bay of Bengal, 23% to Arabian Sea · Divide: Delhi Ridge – Aravallis – Vindhyas – Satpuras – Western Ghats · Himalayan rivers 40–60 mn yrs, peninsular 200 mn yrs · Basins: major >20,000 km²; medium 2,000–20,000; minor · Himalayan basin areas Indus 11.78, Ganga 8.61, Brahmaputra 5.8 lakh km²; Godavari 3.12 lakh km² is the largest peninsular basin. 🏞️ HIMALAYAN rivers = teenagers (young, V-valleys, perennial, snow+rain, meanders, big deltas). PENINSULAR rivers = grandparents (mature, shallow valleys, seasonal – except Kaveri, straight courses, small basins, Narmada & Tapi make estuaries, others deltas). 3.1 Indus system (Himalayan) Indus: origin Bokhar Chu, Kailash; in India only Ladakh (riparian: Ladakh, J&K, HP, Punjab); gorge near Nanga Parbat. Panjnad = I-J-K-R-B-S (Indus left tributaries – as printed). River Origin / hook Jhelum Verinag; meanders; Wular Lake; joins Chenab in Pakistan Chenab near Baralacha La (Lahaul-Spiti); joins Sutlej in Pakistan Ravi west of Rohtang, Kullu hills; joins Chenab in Pakistan Beas Beas Kund near Rohtang; gorges at Kati & Largi (Dhauladhar); entirely in India; meets Sutlej in Punjab Sutlej Rakshasthal near Mansarovar; enters India at Shipki La; joins Indus in Pak as Panjnad Others Zanskar, Suru · Right bank: Shyok (from Rimo glacier, joins Indus at Keris), Gilgit PYQ 2021 (ans D): of Chenab, Jhelum, Ravi, Sutlej – Sutlej is the one that joins the Indus directly (handout: the others join into the Sutlej system first). 3.2 Ganga system Origin: Gangotri (Bhagirathi) + Satopanth (Alaknanda). Panch Prayag: Vishnu, Nand, Karna, Rudra, Dev. NW-1: Haldia → Prayagraj. Padma in Bangladesh. Flows through Uttarakhand, UP, Bihar, Jharkhand, WB. 🛕 Panch Prayag – handout mnemonic \"Vasudev Ne Karna ko Rasta Dikhaya\" = Vishnuprayag, Nandprayag, Karnaprayag, Rudraprayag, Devprayag (in order up→down). Feeder rivers – \"Dhul Nandakini ke Pair Mein Bikhri\" = Dhauli (Ganga) · Nandakini · Pindar · Mandakini · Bhagirathi (decoded from the figure). Handout figure: the five confluences and the streams that make the Ganga (Dhauli, Nandakini, Pindar, Mandakini, Bhagirathi). ⬅️ LEFT-bank tributaries – \"Rama Ghoomte hue Ghaghara Ganda Kar Mat\" = Ramganga · Gomti · Ghaghara · Gandak · Kosi · Mahananda (+ Burhi Gandak between Gandak and Kosi). Left bank Facts Ramganga Chamoli; meets Ganga at Kannauj Gomti Pilibhit; meets Ganga at Ghazipur Ghaghara Tibet; antecedent; joins in Bihar; tribs Sarda, Saryu, Rapti, Choti Gandak Gandak Tibet–Nepal border; Kali Gandak, Mayangadi, Trishuli; joins near Patna Burhi Gandak West Champaran; Kanwar Tal (India's biggest oxbow) Kosi Sapt Kosi (7 tribs: Arun, Tumar, Sun Kosi); Sorrow of Bihar (shifting course); Nepal; joins near Kursela Mahananda near Tiger Hill; last major right-bank…(handout wording) tributary to join Ganga in India Right bank Yamuna (Yamunotri; joins at Prayagraj; Chambal, Sind, Ken, Betwa) · Tons/Tamsa · Son (Amarkantak radial drainage with Narmada, Johila; joins near Patna) · Phalgu (Gayaji) Distributary Hooghly (Giria → Sagar Island, estuary) · Damodar (Chotanagpur → Hooghly near Kolkata) · Mayurakshi, Ajay ⚠️ Handout alert: Mahananda is listed under left-bank tributaries but described as \"last major right bank tributary\". Treat it as printed (left list) and note the wording clash. 3.3 Brahmaputra and Barak Brahmaputra: Chemayungdung & Angsi glaciers, Kailash – near the Sutl"}, {"c": 4, "n": "Indian Geography · quick", "id": "q-4-indian-climate", "t": "4 · Indian climate", "x": "Monsoon climate: ~75% of rain in monsoon months. Controls: latitude (~6°N–35°N) · Himalayas (block Central Asian cold; shape monsoon) · pressure & winds (summer low pulls SW winds; winter high → dry NE winds; sub-tropical westerly jet → Western Disturbances) · ocean currents · continentality · relief. 📅 Four seasons – \"WiSAR\": Winter (mid-Nov–Feb) · Summer/pre-monsoon · Advancing monsoon (Jun–Sep) · Retreating monsoon (Oct–Nov). Winter: fog/smog, inversion, pollution domes, frost, cold waves; offshore NE trades; WD rain – \"Mawath/Mahawat\" – vital for Rabi; fewest tropical cyclones (ITCZ shifts, high pressure). Western Disturbances: extratropical storms from the Mediterranean, steered by the sub-tropical westerly jet; lose moisture on the Himalaya. Give winter and pre-monsoon rain in Punjab, Haryana, UP, Delhi, Himalayan snow (feeds Ganga/Indus perennial flow), moderate winter cold; also hail/thunderstorms. Climate change: may be more intense (warmer air, more moisture), shifted timing/path, now seen in summers and interacting with cyclones and monsoon → extreme rain. Summer: ITCZ ≈ 25°N; Loo, dust storms (Aandhi); heat waves; 1% of annual rain. ☕🥭 Pre-monsoon showers by \"what they help\": Mango showers (Karnataka/Kerala) · Coffee / Cherry-blossom showers (Karnataka, Kerala) · Norwester / Kaal Baisakhi (WB, Bihar, Jharkhand, Odisha – rice, tea, jute) · Bardoli Chheerha / Bordoisila – tea showers (Assam). Cyclones: coast >7,500 km (as printed); season April–Dec, peaks May–June and Oct–Nov; Bay : Arabian Sea ≈ 4 : 1 (bigger warm-water area, lower wind shear); 5–6 per year, 2–3 severe. Climate change: intensity up, not necessarily frequency; Arabian Sea activity rising; a 2022 study says Bay numbers may fall but intensity rise. IMD colour warning Lead time Pre-cyclone watch (no colour) 72 h Cyclone Alert – Yellow ≥48 h Cyclone Warning – Orange ≥24 h (landfall point forecast) Post-landfall outlook – Red ≥12 h (Mnemonic: 72 – 48 – 24 – 12, halving each step: \"Watch → Yellow → Orange → Red\".) Naming: WMO/ESCAP Panel, since September 2004; 13 countries (Bangladesh, India, Iran, Pakistan, Oman, Maldives, Myanmar, Sri Lanka, Thailand, UAE, Yemen, Qatar, Saudi Arabia) × 13 names each; RSMC New Delhi assigns; names are retired after use; a South China Sea cyclone entering the Bay keeps its name. Urban heat island: causes – concrete/asphalt, less vegetation, vehicle/industrial/AC heat, anthropogenic energy, urban geometry (\"heat canyons\"). Advancing monsoon (Jun–Sep) Drivers: land–sea differential heating (primary) · ITCZ shifts north · sub-tropical westerly jet (weaker/northward = stronger monsoon) · Tibetan Plateau heating → Tropical Easterly Jet (TEJ) · Somali jet (moisture across the Arabian Sea) · ENSO · IOD · MJO · Arctic sea ice (reduced ice → more rain in central & NE India, less in west & south peninsula; mechanism not yet identified). Monsoon trough = low over India. Burst = sudden onset with thunder/lightning, ~1 June at Kerala. Two branches: Arabian Sea (stronger; splits into Malabar, Konkan, Kathiawar) and Bay of Bengal (blocked by Arakan; Utkal and North-Eastern branches); meet around Agra–Ferozepur. Tamil Nadu is dry: rain-shadow of Western Ghats, and the branches run parallel to its coast. Break: usually August – weak Tibetan Low and winds running parallel to the west coast. Cloudbursts: ≥10 cm of rain in an hour over a small area; orographic lift + rapid condensation + cold-air downdraft; Himalaya and Western Ghats; monsoon; hard to predict (needs dense radar, high-res models); more with warming. Urban flooding: impervious surfaces + drains overwhelmed. Handout examples: Mumbai 2005 (944 mm in a day), Chennai 2015 (drainage, water-body encroachment), Bengaluru (unplanned growth), Hyderabad (lake encroachment), mangrove loss in Mumbai; climate-linked heavy rain in Mumbai/Kolkata. ENSO and the other \"oscillation\" family 🥶🔥 El Niño = El Nasty (warm east Pacific → weak SW monsoon, drought India/Australia; NE monsoon stronger). "}, {"c": 4, "n": "Indian Geography · quick", "id": "q-5-forests-of-india", "t": "5 · Forests of India", "x": "🌳 Rainfall ladder (cm): >200 wet evergreen → 175–225 semi-evergreen → 100–200 moist deciduous → 75–100 dry deciduous → ~100 spread through year: dry evergreen (TN coast) → . Wetter = evergreener, taller; drier = shorter, thornier. Forest Climate Where Trees / traits Wet evergreen >200 cm; 25–27 °C W. Ghats (south of Mumbai), NE, A&N no undergrowth (dense canopy); jackfruit, rosewood, mahogany, aini, ebony, agarwood Semi-evergreen 175–225; 24–27 °C W. coast, Assam, lower E. Ghats, Odisha, Andamans wet evergreen + moist deciduous mix; evergreen due to undergrowth; kadam, cashew, cedar, chestnut, thorny bamboo Dry evergreen ~100 cm all year TN coast short; tamarind, neem, toddy palm Moist deciduous 100–200; ~27 °C around W. Ghats, NE, Shiwalik (Terai–Bhabar), E. MP, CG, Chotanagpur, Odisha shrubby undergrowth; teak, sal, mahua, tendu, bamboo (also shisham, sandalwood, khair, kusum, arjun, mulberry) Dry deciduous 75–100 rainier peninsula, plains of UP, Bihar, MP, Rajasthan transition to thorn; teak, tendu, red sanders, sal, khair Thorn Rajasthan, SW Punjab, W. Haryana, Kachchh, Saurashtra, lee of W. Ghats low scattered; acacia, babul, neem, khair, cacti, wild date Littoral & swamp (mangroves) brackish water Sundarbans (Sundri), A&N, Mahanadi–Godavari–Krishna deltas viviparity, pneumatophores; sundri, keora, agar, rhizophora; ~7% of world mangroves Mangroves protect coast from erosion, storm surge, tsunami; trap sediment (protect coral and seagrass); fisheries nurseries; timber, fodder, medicine; tourism. Handout alert: capacity to adapt to rising seas is being compromised. Mountain forests. Himalaya (north): base moist deciduous → 1,000–2,000 m wet temperate with pine (British replaced oak with pine for railway sleepers) → up to ~3,000 m blue pine, spruce, grassland → 3,000–4,000 m silver fir, juniper, rhododendron + bugyals → tree line → alpine tundra → snow line. Northern Himalayan slopes carry little vegetation. Western Ghats (south): evergreen at base → temperate evergreen \"sholas\" (Nilgiris, Anamalai, Palani) on both slopes; no alpine tundra (height limit). Forest status (handout numbers). Item Figure Forest + tree cover 8,27,357 km² = 25.17% of area (target 33% for stability) Forest cover 7,15,343 km² = 21.76% · Tree cover 1,12,014 km² = 3.41% Change vs 2021 +1,445 km² (forest +156, tree +1,289) – lower than +1,540 in 2021 Mangrove 4,992 km² (−7.43 km²) Bamboo area +5,227 km² >33% forest 19 states/UTs; >75%: 8 – Mizoram, Lakshadweep, A&N, Arunachal, Nagaland, Meghalaya, Tripura, Manipur Highest % cover Lakshadweep 91.33 · Mizoram 85.34 · A&N 81.62 Largest forest + tree cover MP, Arunachal, Maharashtra · largest forest cover: MP, Arunachal, Chhattisgarh Max increase total Chhattisgarh, UP, Odisha · forest: Mizoram, Gujarat, Odisha · tree: Gujarat, Bihar, Kerala Biggest bamboo area MP, Arunachal, Maharashtra Megacities Delhi has the highest forest cover among the six Worries decline in Andhra Pradesh, Maharashtra; Western Ghats ESA −58.22 km² in 10 years; NE −327.30 km² New in 2023 report agroforestry chapter; \"forest characteristics\" chapter back after 10 years; bamboo in tree cover; first estimate of 5–10 cm DBH small trees; 751 districts (636 in 2021) FAO India +2,66,000 ha/year, 2010–2020, 3rd (after China, Australia); GFRA 2025: 9th in total forest area, 3rd in annual gain; Asia the only continent with forest gain since 1990 Social forestry – term first used in India in 1976 by the National Commission on Agriculture. Types: community, urban (Miyawaki = dense native planting, Japanese), extension, agroforestry (trees with crops, not necessarily one farmer), farm forestry. Benefits: jobs, fuel/fodder, NTFPs, carbon, erosion control, habitat, less pressure on natural forests. Andaman & Nicobar forests (for the 2015 PYQ): ~2,200 plant varieties, 200 endemic, 1,300 not on the mainland · South Andaman epiphytes (ferns, orchids) · Middle moist deciduous · North wet evergreen + woody climbers · North Nicobar has no evergreen fore"}, {"c": 4, "n": "Indian Geography · quick", "id": "q-6-soils-of-india", "t": "6 · Soils of India", "x": "Formation factors: relief · parent rock · climate · biota · time · humans. 🎨 ICAR's 8 soils – \"A Red Black Arid Laterite Saline Peaty Forest\" → Alluvial · Red & yellow · Black · Arid desert · Laterite · Saline · Peaty/marshy · Forest & mountain. Memory pairs: Black = cotton + cracks (self-ploughing); Red = iron; Laterite = tea-coffee-cashew (acidic, leached); Alluvial = the breadbasket. Soil Where Rich / poor Crops & hooks Alluvial N. plains, coastal plains; >40% of India, most common rich: potash, lime, phosphoric acid; poor: nitrogen, humus sugarcane, paddy, wheat, pulses; Bhangar / Khadar Black (Regur) Maharashtra, Saurashtra, MP, CG; along Godavari–Krishna; 3rd most common rich: Mg, potash, iron, lime, alumina; poor: phosphoric, N, organic cotton, sugarcane, pulses; cracks when dry; high water retention; volcanic (Deccan/Rajmahal trap lava) Red & yellow low-rain E and S Deccan; Western Ghat piedmont; yellow in parts of Odisha/CG rich: iron, potash; poor: N, phosphorus, humus crystalline igneous rocks; yellow = hydrated iron; wheat, cotton, pulses, tobacco, oilseeds, potato Laterite wetter margins; south, W. Ghats of Maharashtra, Odisha, WB, NE iron oxide + potash high; poor in organic, N, phosphate, calcium acidic; tea, coffee, cashew (tapioca – PYQ) Arid Rajasthan/Thar little humus, N; phosphorus adequate; kankar millets, fodder, guar; Indira Gandhi Canal Saline (Usara) arid/semi-arid Rajasthan, Punjab, UP, Haryana, Kachchh, Maharashtra salts of Na, K, Mg some coconut, salt-resistant fodder (White Revolution) Peaty/marshy heavy rain: Odisha, Sundarbans, Bihar, UP, Kerala humus/organic 40–50% rice if drained Forest & mountain Himalaya, W & E Ghats varies valley sides loamy-silty (rice, wheat); upper slopes coarse (horticulture) Soil degradation: erosion (deforestation, bad tillage, overgrazing) · chemical (fertiliser/pesticide, salinisation, irrigation acidity) · physical (mining, construction, machinery). UNCCD: land degradation affects 15 million km² (larger than Antarctica), growing ~1 million km²/year. \"India: a sub-continent\": Himalaya as natural border; own plate (Gondwana, vs Eurasian/Laurasia); almost all major climate and forest types (desert to tundra); distinct history/culture. Forest and soil PYQs Year Asked Answer / rule 2023 Tropical rainforest soil is nutrient-rich because of fast decomposition I false, II true (D) – soil is leached and poor; trees take nutrients as fast as they are produced 2011 How do mangroves act as a safety hedge (2004 tsunami)? D – extensive roots hold against storms and tides 2013 Laterite: red ✔; rich in N & potash ✘; Rajasthan/UP ✘; tapioca & cashew ✔ C (1 and 4) 2015 Region with mangrove + evergreen + deciduous Andaman & Nicobar (D) 2015 Tropical wet evergreen in: Arunachal, HP, Mizoram Arunachal + Mizoram (C) 2015 Teak is dominant in Tropical moist deciduous (A) 2016 Red Sanders: found in a part of S. India ✔; important in tropical rainforest ✘ A (1 only) – endemic to southern Eastern Ghats; not aromatic, not Santalum sandalwood; dry deciduous 2021 Black cotton soil forms from weathering of Fissure volcanic rock (B) 2023 Jackfruit, Mahua, Teak – how many deciduous? Two (B) – jackfruit evergreen – Mangrove rationale for climate resilience D – \"bio-shield + livelihood\"; roots are salt-tolerant, not salt-sensitive; they do not store freshwater"}, {"c": 4, "n": "Indian Geography · quick", "id": "q-7-recall-sheet", "t": "7 · Recall sheet", "x": "82°30′E: U C My Old Aunt (UP, CG, MP, Odisha, AP). Ten – Nine – Six channels: Andaman|Nicobar, Lakshadweep|Minicoy, Great Nicobar|Sumatra. Highest: Kanchenjunga (India's Himalayan peak) · Nanda Devi (entirely in India) · Kamet (Uttarakhand) · Kalsubai (Maharashtra) · Anaimudi (W. Ghats/Kerala) · Doddabetta (TN) · Gurudongmar (lake) · Kunchikal (waterfall). Panch Prayag: Vishnu–Nand–Karna–Rudra–Dev. Left Ganga tributaries: Ram-Gomti-Ghaghara-Gandak-Kosi-Mahananda. Mahi crosses Tropic of Cancer twice · Luni = inland-drainage best example · Kosi = Sorrow of Bihar · Kanwar Tal = Asia's biggest oxbow (Burhi Gandak). Godavari longest peninsular river; Narmada in a rift – estuary; Kaveri gets both monsoons. Cyclone alerts: 72 – 48 – 24 – 12. Season: Oct–Nov and May–June. IOD +ve = good monsoon; El Niño = weak SW monsoon, stronger NE. ELLA = heatwave years. Soils: Black=cotton, Alluvial >40%, Laterite=tea-coffee-cashew. Forest cover: 21.76% + tree 3.41% = 25.17% (33% target)."}, {"c": 4, "n": "Indian Geography · quick", "id": "q-8-traps", "t": "8 · Traps", "x": "Peak \"highest of …\" lists are state-specific – Karoh (Haryana), Amsot (UP), Someshwar (Bihar) are Shiwalik peaks; Kangto is Arunachal; Shillong Peak is Meghalaya. Narmada flows west because of the rift, not the slope (2013). Kolleru lies between Krishna and Godavari (not fed directly by Krishna). Nokrek = Meghalaya, not Sikkim; Namcha Barwa ≠ Garhwal (2022). Amarkantak = Vindhya + Satpura (2023). IOD is Indian Ocean W–E, not the Pacific (2017). La Niña is Pacific; it helps the monsoon (2011). Rainforest soil is poor despite lush trees (2023). Laterite is poor in N and potash... but rich in iron (the handout's two lists differ slightly – laterite \"rich in iron oxide and potash\" in the notes vs \"poor in nitrogen, potash\" in the 2013 explanation) → rule: PYQ asks N-rich? say no. Jackfruit evergreen; mahua/teak deciduous. Red Sanders is not aromatic sandalwood. Mahananda / last-tributary wording; UP/Rajasthan/Sikkim PYQ answer conflict – see alerts above. Connects to: Geomorphology (Tethys, plate collision, drainage patterns, antecedent/superimposed) · Climatology (jet streams, ITCZ, cyclones) · Oceanography (ENSO, IOD) · Economic Geography (soils → crops, minerals of the plateau)."}, {"c": 5, "n": "Human Geography", "id": "s0", "t": "DEMOGRAPHY", "x": "Demography is the study of populations, including their size, structure, distribution, and dynamics. It involves analyzing various demographic factors such as birth rates, death rates, migration patterns, age distribution, and fertility rates to understand population trends and processes."}, {"c": 5, "n": "Human Geography", "id": "s1", "t": "Factors Affecting Population Growth", "x": "Birth Rate: The number of live births per thousand people in a given population over a specific period . High birth rates contribute to population growth. Death Rate: The number of deaths per thousand people in a given population over a specific period . Low death rates can contribute to population growth by reducing population loss. Migration: The movement of people from one place to another . Immigration (inward migration) can increase population size, while emigration (outward migration) can decrease it. Fertility Rate: The number of live births per 1000 women of childbearing age in a population . The total fertility rate is the average number of children born to women of childbearing age in a population. High fertility rates lead to population growth, while low fertility rates can lead to population decline. Age Structure : The distribution of individuals in different age groups within a population . A youthful age structure (with a high proportion of young people) can lead to rapid population growth, while an aging population structure may lead to slower growth or decline. Economic and Social Factors : Socioeconomic conditions, access to healthcare, education, employment opportunities, and cultural norms can influence fertility rates, mortality rates, and migration patterns, thereby affecting population growth."}, {"c": 5, "n": "Human Geography", "id": "s2", "t": "Temporal Distribution of Population", "x": "According to the UN World Population Prospects report, the global population will peak at 10.3 billion people around the mid-2080s."}, {"c": 5, "n": "Human Geography", "id": "s3", "t": "Spatial Distribution of Population", "x": "Factors affecting population distribution: Geography and Climate: Areas with favorable climates, such as temperate regions, tend to have higher population densities. Harsh climates, such as deserts or polar regions, generally have lower population densities. Example: The Indo-Gangetic Plain in India is densely populated due to its fertile land and favorable climate. Resources: Availability of natural resources like water, minerals, and fertile land attracts populations. Example: River valleys like the Nile in Egypt and the Ganges in India are densely populated due to their water resources and fertile land. Economic Opportunities: Regions with more economic opportunities, such as jobs and industries, attract people. Example: Urban areas like Mumbai, New York, and Tokyo have high population densities due to abundant job opportunities and economic activities. Political and Social Factors: Stability, government policies, and social services also influence population distribution. Example: Countries with political stability and good social services, like Canada and Australia, attract migrants and have specific regions with high population densities. Historical Factors: Historical events, colonization, trade routes, and historical settlements impact population distribution. Example: Coastal regions and ancient trade routes often have higher population densities due to historical trade and settlement patterns. Patterns of Population Distribution Urban vs. Rural: Urban areas tend to have higher population densities due to concentrated economic activities, better infrastructure, and more services. Rural areas generally have lower population densities. Example: Metropolitan cities like Delhi, Mumbai, and Kolkata in India are densely populated compared to the rural hinterlands. Continental Distribution: Population density varies significantly across different continents. Example: Asia is the most populous continent, home to major population centers like China and India, while continents like Australia and Antarctica have very low population densities. Coastal vs. Inland: Coastal areas are often more densely populated than inland areas due to access to trade, transportation, and resources. Example: Coastal cities like Mumbai, Chennai, and New York are densely populated compared to many inland areas. In 2025, Asia was home to about 62.18% of the world's population, followed by Africa (19.36%), Europe (9.3%; reduction of 0.09% compared to 2024), North America (7.71%), South America (5.47%). Oceania had the smallest population, with just 0.58% of the world's total population. Indian Population (a) India is the most populous country in the world. (b) According to UN Population data, India’s population is 1.46 billion (1.31 billion according to 2011 census.) (c) UN World Population Prospect report has stated that Indian population will peak in early 2060s, at 1.7 billion, and then will start reducing. (d) However, the latest SRS report, released last month by India’s Office of the Registrar General and Census Commissioner, said that India’s Total Fertility Rate (TFR) had dropped to 1.9 children per woman."}, {"c": 5, "n": "Human Geography", "id": "s4", "t": "Important Terminologies", "x": "Total Fertility Rate: average number of children a woman is expected to have during her reproductive years , based on the current Birth Rate. 2.1 is the replacement rate. NFHS 5 data: TFR of India is 2.0 Only 5 states TFR > 2.1; Bihar, Meghalaya, Uttar Pradesh, Jharkhand and Manipur India's fertility rate is projected to decline to 1.29 by 2050, significantly below the replacement level of 2.1, IMR (Infant Mortality Rate): deaths of infants under one year of age per 1,000 live births in a given year. In India: 25.5 in 2021 Sex Ratio: Males per 1000 females . In India calculated by females per 1000 males. 2011: 943; NFHS-5: 1020; Child Sex Ratio: aka Juvenile Sex Ratio; 0-6 yrs age group . 2011: 914; NFHS-5: 920 Life Expectancy: Average number of years a person is expected to live if current mortality rates continue. 70.19 yrs in 2022 Child Wasting (low weight for height); Child Stunting (low height for age); Child Underweight (low weight for age). Dependency Ratio : Ratio of dependent (0-14 yrs & >65 yrs) to total working age population Working age population : 15-64 yrs Demographic Dividend: When working age population is much higher than the dependent population. India: 56% in 2022-23 Will peak at 68.9% in 2030. Second Demographic Dividend : Lower fertility and increased life expectancy generally lead to greater wealth. Older people with fewer dependents and large savings can improve the money available for investment in an economy, thereby boosting growth."}, {"c": 5, "n": "Human Geography", "id": "s5", "t": "Population Pyramids", "x": "(a) A population pyramid is a graphical representation of the age and sex distribution of a population. (b) It is a useful tool for understanding the demographic structure of a population , which can provide insights into the population’s growth patterns, economic development, and potential future challenges. (c) Population pyramids are typically divided into different shapes based on the characteristics of the population they represent. (d) Expansive Pyramid (i) Broad base , indicating a high number of young people. (ii) Narrow top , indicating a lower number of older people. (iii) Rapid population growth . (iv) Example: Nigeria ’s population pyramid has a wide base, showing a high proportion of children and young people. This reflects high birth rates and a high dependency ratio. The pyramid narrows sharply at older ages, indicating lower life expectancy. (v) Indian Pyramid is expansive but with a stabilizing base . (e) Constricted Pyramid (i) Narrow base , indicating lower birth rates. (ii) Bulging middle , indicating a higher proportion of working-age individuals. (iii) Narrow top , reflecting fewer elderly people compared to the working-age population. (iv) Population growth slowing down . (v) Example: Japan ’s population pyramid is more constricted at the base, showing lower birth rates. The middle section is wider, indicating a large working-age population. The top of the pyramid is wider compared to the base, reflecting an aging population with longer life expectancy. (f) Stationary Pyramid (i) Relatively equal distribution across all age groups , except for the very old. (ii) Population growth is stable or very slow. (iii) Example: The U.S . population pyramid shows a more balanced distribution across different age groups. The birth and death rates are low, leading to a relatively stable population size."}, {"c": 5, "n": "Human Geography", "id": "s6", "t": "Population Theory of Malthus", "x": "Thomas Robert Malthus , an English cleric and scholar, proposed one of the most influential theories on population growth in his work \"An Essay on the Principle of Population ,\" first published in 1798 . Malthus's theory focuses on the relationship between population growth and resources , particularly food supply. Key Principles of Malthus's Theory Population Growth : Malthus asserted that the population grows geometrically (exponentially), meaning it doubles at regular intervals (e.g., 2, 4, 8, 16, etc.). Food Supply : He argued that food supply grows arithmetically (linearly), meaning it increases by a fixed amount each period (e.g., 1, 2, 3, 4, etc.). Imbalance : According to Malthus, over time , the potential for population growth outstrips the potential for food production , leading to a situation where the population exceeds the food supply. Checks on Population : Malthus proposed two types of checks to keep the population in balance with the food supply: Preventive Checks : These are measures that reduce the birth rate , such as moral restraint (delaying marriage and celibacy), and contraceptive methods. These methods are under our control. Positive Checks : Occur after the Malthusian catastrophe takes place. They are not under our control. These increase the death rate through famine, disease, war, and other calamities that reduce the population. Criticisms Technological Advancements : Critics argue that Malthus underestimated human ingenuity and the capacity for technological advancements to increase food production. The Industrial Revolution and later the Green Revolution significantly increased food supply, countering Malthus's predictions. Economic and Social Factors : Malthus did not fully account for the complex social and economic factors that influence population growth and resource distribution. He equated sociological and biological needs as the same. Modern interpretations of Malthusian theory consider the impact of population growth on environmental sustainability and resource depletion beyond just food supply."}, {"c": 5, "n": "Human Geography", "id": "s7", "t": "Demographic Transition Theory", "x": "The Demographic Transition Theory (DTT) is a model that describes the transformation of a country's population structure over time. This theory outlines the transition from high birth and death rates to low birth and death rates as a country develops from a pre-industrial to an industrialized economic system. Assumption: Fertility and mortality rates reduce over time. Former before latter The theory is divided into four to five stages, each characterized by distinct demographic patterns. Stage 1: High Stationary Stage (Pre-Industrial Stage) Birth Rates: High Death Rates: High Population Growth: Slow and fluctuating Characteristics: This stage is marked by high fertility and high mortality due to limited access to medical care, poor nutrition, and lack of sanitation. Populations remain relatively stable but can fluctuate due to famines, diseases, and wars. Example: Most societies before the 18th century. Primitive tribal societies still display this stage. Stage 2: Early Expanding Stage (Transitional Stage) Birth Rates: High Death Rates: Declining Population Growth: Rapid Characteristics: Improved healthcare, sanitation, and food supply lead to a significant decline in mortality rates, particularly among infants and children. Birth rates remain high, resulting in rapid population growth. Example: Many developing countries in Africa. Stage 3: Late Expanding Stage (Industrial Stage) Birth Rates: Declining Death Rates: Low Population Growth: Slowing Characteristics: Birth rates begin to decline due to changes in social norms, increased access to contraception, improved women's education and employment opportunities, and urbanization. Population growth rates begin to slow down. Example: Countries like India, and Brazil. Stage 4: Low Stationary Stage (Post-Industrial Stage) Birth Rates: Low Death Rates: Low Population Growth: Stable or declining Characteristics: Both birth and death rates are low, leading to a stable or slowly growing population. Societies in this stage often face challenges related to aging populations and the economic impacts of a shrinking workforce. Example: Most developed countries, such as the United States, and much of Europe. Stage 5: (Proposed) Decline Stage Birth Rates: Very low Death Rates: Low Population Growth: Declining Characteristics: In this speculative stage, birth rates fall below death rates, leading to a decline in the overall population. This stage is associated with highly developed economies, where the cost of raising children is high and social attitudes towards family size have changed significantly. Example: Some demographers suggest that countries like Japan, South Korea, Germany, and Italy are entering this stage. Significance of the Demographic Transition Theory Economic Development : The DTT suggests that economic development is associated with lower birth and death rates. As countries develop, they move through the stages, which has implications for planning and policy-making. Population Aging : In the later stages, countries face challenges related to aging populations, such as increased healthcare costs and the need for pension systems. Urbanization : The transition often accompanies increased urbanization, changing patterns of settlement and resource use. Education and Women's Rights : The decline in birth rates is closely linked to improvements in women's rights, education, and employment opportunities. Environmental Impact : Population dynamics affect environmental sustainability. Rapid population growth can lead to increased pressure on natural resources while declining populations might lead to labor shortages and economic challenges. Demographic Transition in India 1. Till 1921: Stagnant population 2. 1921-1951: Increasing population 3. 1951-1981: Population explosion 4. (1921-81: Early Expanding stage) 5. 1981- till date: Late Expanding Stage (Growth with stability) MAJOR TRIBES OF INDIA"}, {"c": 5, "n": "Human Geography", "id": "s8", "t": "PYQ", "x": "Q.) Consider the following pairs : 1. Limboo (Limbu): Sikkim 2. Karbi: Himachal Pradesh 3. Dongaria: Odisha 4. Bonda: Tamil Nadu Which of the above pairs are correctly matched? (2013) 1 and 3 only 1 and 2 only 2 and 3 only 1, 2, 3 and 4 Answer: A The Limbu are Kirati people indigenous and native to the Himalayan Limbuwan region of the Indian subcontinent, what is now modern-day Eastern Nepal, Northern Sikkim, India and Western Bhutan. The Niyamgiri hill range in Odisha state, eastern India, is home to the Dongria Kondh tribe . Niyamgiri is an area of densely forested hills, deep gorges and cascading streams. To be a Dongria Kondh is to farm the hills’ fertile slopes, harvest their produce, and worship the mountain god Niyam Raja and the hills he presides over, including the 4,000 metre Mountain of the Law, Niyam Dongar. Q.) With reference to ‘Changpa’ community of India, consider the following statement: They live mainly in the State of Uttarakhand. They rear the Pashmina goats that yield fine wool. They are kept in the category of Scheduled Tribes. Which of the statements given above is/are correct? (2014) (a) 1 only (b) 2 and 3 only (c) 3 only (d) 1, 2 and 3 Answer: B The Changpa or Champa are a semi-nomadic Tibetan people found mainly in the Changtang in Ladakh and in Jammu and Kashmir. The Changpa or Champa are a semi-nomadic Tibetan people found mainly in the Changtang in Ladakh, India. A smaller number resides in the western regions of the Tibet Autonomous Region and were partially relocated for the establishment of the Changtang Nature Reserve. Most of the regions that the Changpas reside in is quite inhospitable and unsuitable for farming. Thus, the primary occupation for the tribe is rearing of yaks, horses and sheep. Cashmere, also known as pashmina, is majorly sourced from the pashmina sheep that the tribe rears. A smaller number resides in the western regions of the Tibet Autonomous Region and were partially relocated for the establishment of the Changtang Nature Reserve. As of 1989, there were half a million nomads living in the Changtang area. Q.) The total fertility rate in an economy is defined as: The number of children born per 1000 people in the population in a year. The number of children born to a couple in their lifetime in a given population. The birth rate minus death rate. The average number of live births a woman would have by the end of her child-bearing age. Answer: (d) The average number of live births a woman would have by the end of her child-bearing age. Q.) Consider the following countries: Italy Japan Nigeria South Korea South Africa Which of the above countries are frequently mentioned in the media for their low birth rates, or ageing population or declining population? (a) 1, 2 and 4 (b) 1, 3 and 5 (c) 2 and 4 only (d) 3 and 5 only Answer: A MISSED QNS OF INDIAN GEOGRAPHY Q.) With reference to the climate of Andaman and Nicobar Islands, which of the following statements is/are correct? 1. The climate can be defined as a humid, tropical coastal climate. 2. It receives rainfall from both South-west monsoon and North-east monsoon. 3. Maximum precipitation is between December and May. Select the answer using the code given below: (a) 1 only (b) 1 and 2 (c) 2 and 3 (d) 3 only Ans: (b) Explanation: The Andaman and Nicobar Islands experience a humid tropical maritime/coastal climate. It is in the ocean, so both SW and NE winds are onshore. Maximum rainfall generally occurs during the South-West Monsoon months, especially May to September. (Heat=LP=rain, and NH has heat in March-Sept) Q. Which of the following geographical features or phenomena is/are associated with the Peninsular Block of India? 1. Submergence of parts of the western coast due to tectonic activity 2. Presence of residual mountain ranges such as the Veliconda Hills and Mahendragiri Hills 3. Deep, V-shaped river valleys formed by fast-flowing rivers Select the answer using the code given below: (a) 1 only (b) 1 and 2 (c) 2 and 3 (d)"}, {"c": 5, "n": "Human Geography", "id": "s11", "t": "Factors Affecting Settlements", "x": "Rural settlements are influenced by a variety of factors that determine their location, size, structure, and pattern. Physical Factors Topography: Flat and fertile plains are more conducive to agriculture and human habitation. Hilly and mountainous regions often lead to dispersed settlements due to difficult terrain and limited arable land. Example: The Ganges Plains in India have dense rural settlements due to flat terrain and fertile soil. Climate: Areas with moderate climates are more likely to have higher population densities. Extreme climates (too hot, too cold, or too wet) can hinder large-scale settlements. Example: The Thar Desert in Rajasthan, India, has sparse rural settlements due to harsh climatic conditions. Water Supply: Proximity to rivers, lakes, or groundwater sources is crucial for drinking water, irrigation, and other daily needs. Settlements are often concentrated near reliable water sources. Example: The rural settlements along the Nile River in Egypt depend heavily on the river for water. Soil Fertility: Fertile soils support agriculture, which is the primary livelihood in rural areas. Areas with rich, alluvial soils are densely populated. Example: The Indo-Gangetic Plain in India has high rural population density due to its fertile soil. Natural Resources: Availability of resources like minerals, forests, and fisheries can attract settlements. Regions rich in natural resources often see clustered settlements. Example: The mining regions in Jharkhand, India, have developed settlements around mining activities. Economic Factors Agricultural Productivity: High agricultural productivity supports larger populations and dense settlements. Regions with better irrigation, technology, and crop yields tend to have more stable settlements. Example: The Punjab region in India has high rural population density due to its advanced agricultural practices. Employment Opportunities: The availability of non-agricultural jobs (e.g., cottage industries, mining) can attract and retain population. Economic diversification can influence the settlement pattern. Example: The rural areas near industrial towns often have higher population densities. Accessibility and Transportation: Proximity to roads, railways, and other transport networks facilitates trade, and access to markets, and services. Better connectivity generally leads to more populated and prosperous settlements. Example: Villages near major highways or railway lines tend to be larger and more developed. Social and Cultural Factors Community and Kinship: Social bonds and kinship ties can influence the location and growth of rural settlements. Communities with strong social networks often cluster together. Example: Traditional villages in India often have extended families living in close proximity. Cultural Practices: Cultural and religious practices can dictate settlement patter
