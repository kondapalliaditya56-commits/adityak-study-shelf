ns, such as the layout and structure of homes. Specific cultural requirements (e.g., space for religious rituals) influence the design of rural settlements. Example: Some rural areas in Rajasthan, India, have unique architectural styles due to cultural influences. Land Ownership Patterns: The distribution of land ownership can affect the settlement pattern. Areas with fragmented landholdings may have dispersed settlements. Example: The zamindari system in India historically influenced the pattern of rural settlements. Political Factors Government Policies: Policies related to land use, agriculture, infrastructure development, and rural development impact settlement patterns. Programs aimed at rural development can lead to the establishment of new settlements or the growth of existing ones. Example: The Green Revolution in India led to significant changes in rural settlement patterns in regions like Punjab and Haryana. Security and Stability: Political stability and security influence where people choose to settle. Areas prone to conflict or instability may see depopulation or fragmented settle"}, {"c": 5, "n": "Human Geography", "id": "s12", "t": "Types of Rural Settlements", "x": "Compact/Nucleated Settlements: Favourable relief + favourable Climate . Houses and buildings are closely packed . Common in fertile plains, valleys, and areas with abundant natural resources. Sometimes in locations where resources are concentrated or for security reasons. North Indian Plains, Wet points in Rajasthan, regions of Bundelkhand and Nagaland. Semi-Compact Settlements: Favourable relief + Less favourable climate Transitional form between compact and dispersed settlements. Houses are somewhat clustered but with more space between them compared to compact settlements. Found in areas with moderate agricultural productivity . Indus Basin; Gujarat Plains, parts of Rajasthan Plains. Hamleted Settlements: Fragmentation of settlements in socially/ethically motivated separate units. Often known by common names like panna, para, palli, nagla, dhani, and others. Northern India: Ganga plains, lower Himalayan valleys; Chhattisgarh Plains (tribal clustering); parts of South India Dispersed Settlements: Houses and buildings are spread out over a large area . Bad climate & Relief Himalayan Region: Uttarakhand, Himachal Pradesh, Ladakh; Meghalaya, etc."}, {"c": 5, "n": "Human Geography", "id": "s13", "t": "Patterns of Rural Settlements", "x": "Linear : Common-most pattern; Along highways, forest pathways, and rivers; at cross-sections, can make T-shaped or star-shaped patterns or Checkerboard Pattern. Oval/Circular : around a nodal point of attraction. E.g. a religious place, oasis, pond, etc. Triangular : found in the deltas and doabs Rectangular (Grid pattern) : plains Step: hilly regions"}, {"c": 5, "n": "Human Geography", "id": "s15", "t": "Terminologies associated with Urban Settlements:", "x": "City: A large and significant urban area with a high population density and infrastructure of built environment. High population density. Diverse economic activities. Advanced infrastructure and services. Example: Mumbai, Lucknow, Guwahati. Town: An urban area that is larger than a village but smaller than a city , often with local administrative and commercial functions. Megacity: An urban area with a population of more than 10 million people . Due to its population, it often has a significant economic, cultural, and political influence. Example: Tokyo, Japan; Greater Mumbai, Greater Chennai, India. Metropolis : A large and densely populated urban area that serves as a significant economic, political, and cultural center of a country or region. Major urban center. Advanced infrastructure and services. High levels of cultural and economic activities. Example: New York City, USA; Delhi, India. Conurbation: An extended urban area formed by the merging of several towns or cities and their suburbs. Large, continuous urban area. Multiple urban centers within a single metropolitan area. Integrated economic and social networks. Example: Delhi NCR Region. Megalopolis : A region in which several large cities and surrounding areas grow together, forming a massive, interconnected urban complex. Extensive urbanized region. Multiple large cities (often metropolises) in close proximity. Integrated transportation and economic systems. Labour market separation, due to different specialization and large distances (due to the large size). Example: The BoshWash corridor (Boston to Washington D.C.) in the USA. Suburb: A residential area on the outskirts of a city , typically less densely populated than the urban core. Primarily residential. Lower population density compared to the city center. Dependence on the city for employment and services. Example: earlier Gurugram was a suburb of Delhi (now a part of the conurbation). Bandra, Mumbai. Urban Sprawl : The uncontrolled expansion of urban areas into the surrounding rural land. Low-density, automobile-dependent development. Expansion into rural areas. Often leads to environmental and infrastructural challenges. Slum : A densely populated urban area characterized by substandard housing and squalor. Poor housing conditions. Inadequate access to basic services (water, sanitation, electricity). High population density and poverty levels. Example: Dharavi in Mumbai, India. Central Business District (CBD): The commercial and business center of a city , often referred to as the \"downtown\" area. High concentration of retail and office buildings. High land values and rent prices. Major transportation hubs. Example: Chandni Chowk and Connaught Place in Delhi. Edge City: A concentration of business, shopping, and entertainment outside a traditional downtown (CBD) in what had previously been a suburban residential or rural area . Significant commercial and business activity. Located on the outskirts of larger cities. Often characterized by new office buildings, shopping malls, and entertainment facilities. Example: Gurgaon for Delhi Gentrification: The process by which urban areas undergo redevelopment and revitalization, often resulting in increased property values and the displacement of lower-income residents. Upgrading of housing and infrastructure. Influx of higher-income residents. Potential displacement of long-term, lower-income residents E.g. Dharavi Re-development Satellite City: A planned city established to reduce the population pressure on a major city."}, {"c": 5, "n": "Human Geography · quick", "id": "q-1-demography-in-numbers", "t": "1 · Demography in numbers", "x": "Demography = size, structure, distribution, dynamics of population. Drivers: birth rate, death rate, migration, fertility, age structure, social-economic factors. World: UN – global population peaks at 10.3 billion in the mid-2080s. 2025 shares: Asia 62.18% · Africa 19.36% · Europe 9.3% · N. America 7.71% · S. America 5.47% · Oceania 0.58%. India: most populous country; 1.46 billion (UN); UN says it peaks in the early 2060s at 1.7 billion; latest SRS: TFR 1.9. ⚠️ Handout alert: the handout quotes \"1.31 billion according to the 2011 census\" next to UN's 1.46 billion. Check that census figure against your notes before quoting it. 👶 Replacement = 2.1 (\"two parents → two kids + a little extra\"). India's TFR: NFHS-5 = 2.0 → SRS = 1.9 → projected 1.29 by 2050. Only 5 states have TFR > 2.1: \"Big Mummy's Up-to-Juggle Mania\" = Bihar, Meghalaya, UP, Jharkhand, Manipur. Term Meaning / India number TFR average children a woman has in her reproductive years at present birth rates (PYQ: \"average live births a woman would have by end of child-bearing age\") IMR infant deaths (25.5 (2021) Sex ratio India counts females per 1,000 males · 2011: 943 · NFHS-5: 1020 Child sex ratio age 0–6 · 2011: 914 · NFHS-5: 920 Life expectancy 70.19 yrs (2022) Wasting / Stunting / Underweight low weight-for-height / low height-for-age / low weight-for-age Dependency ratio dependants (0–14 and >65) ÷ working-age (15–64) Demographic dividend working-age ≫ dependants · 56% in 2022-23 → peak 68.9% in 2030 Second dividend lower fertility + longer life → older people with few dependants and big savings fund investment 🍼🍎🍃 Stunting = short for age; Wasting = thin for height; Underweight = light for age – \"Stunt = Short, Waste = Weight-for-height, Under = Weight-for-age\". Distribution drivers: geography/climate (Indo-Gangetic plain, temperate zones), resources (river valleys – Nile, Ganga), economic opportunity (Mumbai, New York, Tokyo), political/social stability (Canada, Australia), history (coasts, trade routes). Patterns: urban > rural; Asia most populous; coast > inland."}, {"c": 5, "n": "Human Geography · quick", "id": "q-2-population-pyramids", "t": "2 · Population pyramids", "x": "🔺🏺▮ Shape = story. Expansive 🔺 (broad base, narrow top) = Nigeria, rapid growth, high dependency; India = expansive with a stabilising base. Constricted 🏺 (narrow base, bulging middle) = Japan, slowing growth, ageing. Stationary ▮ (even, narrow only at the very old) = USA, stable."}, {"c": 5, "n": "Human Geography · quick", "id": "q-3-two-theories", "t": "3 · Two theories", "x": "Malthus (1798, Essay on the Principle of Population): population grows geometrically (2-4-8-16), food arithmetically (1-2-3-4) → population outruns food. Checks: Preventive (moral restraint, delayed marriage, celibacy, contraception – under our control) vs Positive (famine, disease, war – after the catastrophe, not in our control). Critics: technology (Industrial and Green Revolution), ignores social/economic complexity; \"equated sociological and biological needs\". Modern reading: environmental sustainability and resource depletion, not just food. 🥖 Malthus = Multiply vs Add. Babies multiply (×2), bread adds (+1). Preventive = \"Pre\" = before birth; Positive checks = \"Pos-t-mortem\", death does the checking. Demographic Transition Theory (DTT): birth and death rates fall from high to low as a country industrialises. Stage Name Birth Death Growth Example (handout) 1 High stationary (pre-industrial) High High slow, fluctuating tribal societies, pre-18th c. 2 Early expanding High Falling rapid many African countries 3 Late expanding (industrial) Falling Low slowing India, Brazil 4 Low stationary (post-industrial) Low Low stable/declining USA, much of Europe 5 Decline (proposed) Very low Low declining Japan, South Korea, Germany, Italy 🎢 \"Death Drops first, Birth Boards later.\" Stage 1: both high. Stage 2: death falls → boom. Stage 3: births fall → boom slows. Stage 4: both low. Stage 5: births below deaths. ⚠️ Handout alert: the assumption line reads \"Fertility and mortality rates reduce over time. Former before latter\" – but the stage table (and every textbook-style description in the same handout) shows mortality falling first (Stage 2), fertility next (Stage 3). Exam rule: follow the stage table. Birth: highDeath falls FIRSTBirth falls next 1 High stat.2 Early exp.3 Late exp.4 Low stat.5 Decline Original sketch of the handout's stage table (not to scale): dashed = death rate, solid = birth rate. The gap between them is the population boom. India's transition: till 1921 stagnant → 1921–51 increasing → 1951–81 explosion (1921–81 = early expanding) → 1981 onwards late expanding (\"growth with stability\"). Why DTT matters: development ↔ lower birth/death; ageing and pensions; urbanisation; women's education and rights lower fertility; environmental pressure vs labour shortages."}, {"c": 5, "n": "Human Geography · quick", "id": "q-4-tribes-state-wise-table-from-the-handout", "t": "4 · Tribes (state-wise table from the handout)", "x": "Source figure: Census table printed in the handout (p. 7). Study the states in your PYQs first. PYQ Asked Answer 2013 Limboo–Sikkim ✔ · Karbi–Himachal ✘ · Dongaria–Odisha ✔ · Bonda–Tamil Nadu ✘ A (1 and 3) – Dongria Kondh of Niyamgiri, Odisha (god Niyam Raja) 2014 Changpa: live mainly in Uttarakhand ✘; rear pashmina goats ✔; Scheduled Tribe ✔ B (2 and 3) – semi-nomadic in Changtang, Ladakh; yaks, horses, sheep; pashmina/cashmere 🐐 Changpa = \"Chang-Pa-shmina\" – Ladakh's high plateau herders (Changtang). Dongria = \"Dongar\" (hill) in Niyamgiri hills."}, {"c": 5, "n": "Human Geography · quick", "id": "q-5-rural-settlements", "t": "5 · Rural settlements", "x": "What decides where villages stand? Physical (relief, climate, water, soil, resources) · Economic (farm productivity – Punjab; jobs; roads/rail) · Social-cultural (kinship, ritual, land ownership – zamindari) · Political (policies, security; Green Revolution reshaped Punjab/Haryana) · Environmental (floods, cyclones – coastal Odisha) · climate change (coastal villages shift inland; drought/flood displacement – parts of Brazil and Burkina Faso). 🏘️ Good relief + good climate → huddled together; bad → scattered. Compact 🧱 (north Indian plains, wet points of Rajasthan, Bundelkhand, Nagaland) · Semi-compact 🏠🏠 (Indus basin, Gujarat plains, parts of Rajasthan) · Hamleted 🧩 (socially separate units – panna, para, palli, nagla, dhani; Ganga plains, lower Himalayan valleys, Chhattisgarh plains (tribal), parts of south) · Dispersed 🏔️ (Uttarakhand, HP, Ladakh, Meghalaya). Patterns (shape): Linear (most common – roads, rivers; T/star/checkerboard at crossings) · Oval/circular (around temple, oasis, pond) · Triangular (deltas, doabs) · Rectangular/grid (plains) · Step (hills)."}, {"c": 5, "n": "Human Geography · quick", "id": "q-6-urban-settlements-the-size-ladder", "t": "6 · Urban settlements – the size ladder", "x": "🪜 Climb the ladder: Town → City → Metropolis → Megacity (>10 million) → Conurbation → Megalopolis. Term Meaning Handout example Town bigger than village, smaller than city – City dense, diverse economy, advanced infrastructure Mumbai, Lucknow, Guwahati Metropolis major economic/political/cultural centre New York, Delhi Megacity > 10 million Tokyo, Greater Mumbai, Greater Chennai Conurbation several towns/cities + suburbs merged Delhi NCR Megalopolis several big cities grown together; labour-market separation BosWash (Boston–Washington) Suburb residential, depends on city Bandra; Gurugram earlier Urban sprawl uncontrolled low-density, car-based spread into rural land – Slum substandard housing, no basic services Dharavi CBD commercial centre; high land values Chandni Chowk, Connaught Place Edge city business/shopping outside the CBD in former suburb/rural land Gurgaon (for Delhi) Gentrification redevelopment → higher values → lower-income residents displaced Dharavi redevelopment Satellite city planned city to relieve a major city – 🛍️ CBD = the city's wallet (downtown). Edge city = the mall that moved to the edge. Gentrification = the café that raised the rent."}, {"c": 5, "n": "Human Geography · quick", "id": "q-7-recall-sheet", "t": "7 · Recall sheet", "x": "Replacement TFR 2.1 · India NFHS-5 2.0, SRS 1.9 · only 5 states above 2.1 (Bihar, Meghalaya, UP, Jharkhand, Manipur). Sex ratio 2011: 943 · Child sex ratio 914 (NFHS-5: 1020 / 920). Working age 15–64; dependants 0–14 & >65; dividend 56% → 68.9% (2030). Pyramids: Expansive (Nigeria/India), Constricted (Japan), Stationary (USA). DTT: Stage 2 death falls first; India in stage 3. Malthus: geometric vs arithmetic; preventive vs positive. Settlements: compact → semi-compact → hamleted → dispersed. Urban ladder: town, city, metropolis, megacity (>10 m), conurbation, megalopolis."}, {"c": 5, "n": "Human Geography · quick", "id": "q-8-traps", "t": "8 · Traps", "x": "TFR ≠ birth rate (PYQ): TFR is average live births per woman over her child-bearing years. Changpa ≠ Uttarakhand – Ladakh (Changtang). Karbi ≠ Himachal; Bonda ≠ Tamil Nadu. Low-birth-rate PYQ (undated): answer A = Italy, Japan, South Korea; Nigeria and South Africa are not in it. Sex ratio in India = females per 1,000 males (the world often counts the other way). DTT \"former before latter\" wording is misleading – death rate falls first. Connects to: Indian Geography (Changpa and Ladakh, Dongria and Niyamgiri; Thar/Himalaya settlements) · Economic Geography (labour, agriculture, urban industry)."}, {"c": 6, "n": "Economic Geography", "id": "s0", "t": "AGRICULTURE", "x": "India boasts the largest area of arable land globally , at around 1.597 million square kilometers (394.6 million acres)."}, {"c": 6, "n": "Economic Geography", "id": "s1", "t": "Cropping Seasons of India:", "x": "Kharif Season Time Period : June to October . Sowing: Beginning with the onset of the southwest monsoon in June. Harvesting: September to October . Major Crops: Paddy (rice), maize, sorghum (jowar), millet (bajra), pulses (such as moong, urad, and arhar), cotton, groundnut, soybean, and sugarcane. Climatic Conditions: Requires hot and humid weather with substantial rainfall . Millets, pulses, and oilseeds can grow even in less humid areas. Rabi Season Time Period: October/November to March/April . Sowing: After the monsoon rains, from October to December. Harvesting: March to April. W inter rainfall from Western disturbances supports growth. Major Crops: Wheat, barley, oats, chickpea (gram), mustard, peas, and linseed. Climatic Conditions: Requires cool and dry weather for growth and warmer weather during the harvesting period . Zaid Season Time Period: March to June . Sowing: Between the end of the Rabi season and the beginning of the Kharif season . Harvesting: June to July . Major Crops: Watermelon, muskmelon, cucumber , vegetables, fodder crops, and some pulses (such as moong and urad). Climatic Conditions: Requires warm and dry weather with the availability of irrigation ."}, {"c": 6, "n": "Economic Geography", "id": "s2", "t": "Types of Farming in India", "x": "Irrigated: Protective: Irrigation is done to protect the crops from drying up. Productive: Irrigation is done to increase the produce harvested from the crops . Dry farming: It is done in places where rainfall is days . Focus needs to be on moisture conservation and drought-resistant crops. Dryland farming: It is done where the rainfall is 75-115 cm , and the growing season is between 75-120 days . Focus on s oil moisture retention, drought-tolerant crops, and adaptive strategies. Wetland farming: Practiced in locations where the rainfall is >115cm , and the growing season is >120 days . Focus on rainwater harvesting, moisture conservation, and suitable crop selection. In India, almost 80 percent of maize, 90 percent of Bajra, approximately 95 percent of pulses, and 75 percent of oilseeds are obtained from dry or dryland agriculture. Micro Irrigation Use of methods to improve the water use efficiency of agriculture . Includes use of Drip Irrigation, Sprinklers, Foggers, etc. Advantages: Water Conservation by increasing water use efficiency. Prevention of soil erosion as the fields are not flooded with water. No need to level the fields . Can be used in all types of soil . Uniform irrigation and reduced nutrient loss , thereby increasing crop productivity. Fertilizers/Pesticides etc can be added to the water and provided to the plants. Drip irrigation: Needs lesser pressure to operate, reducing energy costs. Disadvantages: High Investment Clogging of pipes can render certain regions devoid of water. Drip irrigation needs defined spacing between crops , so not feasible in regions where Technical installation : needs expertise, otherwise waste of resources (time, money, pipes, etc.) Important Crops across the World"}, {"c": 6, "n": "Economic Geography", "id": "s3", "t": "System of Rice Intensification", "x": "Originated in Madagascar in 1980s. Increase yields while reducing resources used. Instead of continuous flooding, used AWD (Alternate Wetting and Drying) technique for rice nurseries. Encourages use of organic manures. Known to improve yields by 30-50%. Reduces Methane emissions."}, {"c": 6, "n": "Economic Geography", "id": "s4", "t": "The shift of sugarcane industry to the South", "x": "Tropical Climate better for sugarcane yield Higher sucrose content Longer crushing season (does not get extremely hot in the summers): only Nov-Feb in North; October to May in South Cooperatives more successful in South"}, {"c": 6, "n": "Economic Geography", "id": "s5", "t": "Agriculture Revolutions in India", "x": "Green Revolution Period: Late 1960s to early 1980s . Key Figure: Dr. M.S. Swaminathan. Main Focus : Introduction of high-yielding varieties (HYVs) of seeds, increased use of fertilizers, pesticides, and irrigation. Successes: Significant increase in food grain production , particularly wheat and rice. Achieved self-sufficiency in food grains. Reduced the import dependency for grains. Drawbacks: Regional disparities , with major benefits concentrated in Punjab, Haryana, and Western Uttar Pradesh. Social disparities , as only the farmers with significant land holdings benefitted. Environmental degradation due to overuse of chemical fertilizers and pesticides. Water table depletion due to intensive irrigation. White Revolution (Operation Flood) Period: 1970s onwards . Key Figure: Dr. Verghese Kurien. Main Focus: Development of the dairy industry . Successes: India became the largest producer of milk in the world. Improved rural incomes and employment . Created a robust cooperative network (e.g., Amul). Drawbacks: Challenges in maintaining quality standards . Inadequate cold chain infrastructure in many parts of the country. Inadequate processing capabilities. Blue Revolution Period: 1980s onwards . Main Focus: Development of the fisheries sector . Successes: Increase in fish production , making India one of the top fish-producing countries. Enhanced export opportunities. Around 17% of India’s agricultural exports in 2021-22. Improved nutritional standards and employment in coastal regions. Drawbacks: Overfishing and depletion of marine resources . Environmental issues such as water pollution and habitat destruction. Yellow Revolution Period: 1980s onwards . Main Focus: Increase in oilseed production. Successes: Significant increase in the production of oilseeds like mustard, sunflower, and soybean. Reduced dependency on edible oil imports . Drawbacks: Inconsistent growth and production challenges due to climatic variability. Market fluctuations affecting farmer incomes. Evergreen Revolution Proposed by: Dr. M.S. Swaminathan . Main Focus: Sustainable agriculture through a blend of traditional and modern practices. Successes: Emphasis on ecological sustainability . Focus on genetic diversity and conservation of natural resources . Drawbacks: Implementation challenges on a large scale. Need for significant policy support and farmer education . Other Revolutions: Brown Revolution: Coffee/Leather/Cocoa Golden Revolution: Fruits/Honey/Horticulture (Nirpakh Tutaj) Golden Fibre: Jute Silver Revolution: Eggs Silver Fibre Revolution: Cotton Pink Revolution: Onion/Pharma/Prawn Red Revolution: Tomato/Meat Round Revolution: Potato Evergreen Revolution: Ecology with technology (M.S. Swaminathan) Grey Revolution: Fertilizers Protein Revolution: encourages farmers to adopt scientific agricultural techniques to boost food grain production and reduce the import of protein-rich lentils."}, {"c": 6, "n": "Economic Geography", "id": "s6", "t": "Agricultural Regions of the World", "x": "Developing World: Nomadic Herding: Mainly 4th world communities in unfavourable envt. Regions. Camels (Bedouins), Cattle (Masais), Horses (Kazaks), Reindeers (Chukchis) Livestock Ranching: Subsistence level: African Savannah Commercial level: Australia (sheep, cattle); Brazil (beef) Shifting Agriculture: Mostly by 4th world community Sedentary Agriculture: Rotation of crops instead of fields Transition between shifting & subsistence. Intensive Subsistence Small land holding; intensive use of resource; mostly for self-consumption. Multiple cropping seasons With Paddy: Wetter margins Without Paddy: drier climates Primitive type: true subsistence; absolute dependence on manual labour; no tech; no surplus Non-Primitive: Use of tech; Significant surplus Mixed Subsistence: Evolving In Savannah type climate"}, {"c": 6, "n": "Economic Geography", "id": "s7", "t": "Temperate Developed:", "x": "Extensive Commercial Grain Farming: Breadbasket of Anglo-America & Wheat Triangle of Eurasia. Temperate Grasslands Intensive commercial development in India & China Extensive Commercial Grain Farming: Dual benefit Largest geographical expanse of temperate regions Commercial Dairy Farming: Intensive Commercial: needs manual + machine labour. Wetter temperate margins India: tropical, but leading milk producer"}, {"c": 6, "n": "Economic Geography", "id": "s8", "t": "Specialized Agriculture", "x": "Plantation: o Extensive in the tropics o Same stand gives yield for years, so special care o Specialized harvesting o Coffee (Brazil); Cocoa (Ghana), Rubber (Indonesia, Malaysia), Spices (India), Tea (China) o Non-traditional plantation: 2-3 yrs; Cotton & Cane (India, Brazil, Egypt, etc) Mediterranean: o Intensive Commercial, sometimes mixed culture o Gardens & Vineyards of the world Horticulture: o Truck farming o Intensive: manual labour o Traditionally in temperate regions [Bulgaria (roses), Netherlands (tulips)], now in the tropics too [India (marigolds, roses, lilies, brinjals, etc), China (Potatoes, tulips)] o Special fertilizers and harvesting Cooperative Farming: o Farmers come together to form cooperatives through resource pooling (except land). o Cooperatives help farmers get access to farm inputs at affordable rates. o Increases the negotiating powers of the farmers. o Successful in many West European nations like Belgium, Netherlands, and especially Denmark. o Eg in India: IFFCO (Indian Farmers Fertilisers Cooperative Limited); Amul. Collective Farming: o In USSR: Kolkhoz o State ownership of land and other resources. o Farmers work together on collective lands. o Small land parcels provided to farmers only for their personal needs. o Problem: Free-riding"}, {"c": 6, "n": "Economic Geography", "id": "s9", "t": "Agricultural Terminologies", "x": "Organic Farming : Growing crops without synthetic pesticides or fertilizers. Permaculture : Designing agricultural systems that mimic natural ecosystems. Agroforestry : Integrating trees and shrubs into agricultural landscapes. Regenerative Agriculture : Focus on renewing soil health and ecosystems. Conservation Agriculture : Practices that preserve and improve soil health. Hydroponics : Growing plants in nutrient-rich water without soil. Aquaponics : Combining aquaculture (raising fish) with hydroponics. Aeroponics : Growing plants in an air or mist environment without soil. Vertical Farming : Growing crops in stacked layers, often indoors. Precision Farming : Using technology (like GPS and IoT) to optimize field-level management. Smart Farming : Incorporating modern technologies like AI, drones, and sensors to enhance productivity and efficiency. Crop Rotation : Alternating crops in the same field to maintain soil fertility. Intercropping : Growing different crops in proximity for pest control and better resource use. Cover Cropping : Growing specific crops to protect and enrich soil between periods of regular crop production. E.g. Mustard, Clover, Radish, etc. Silviculture : Managing forest plantations for timber and other forest products. Viticulture : Cultivation of grapevines for winemaking. Apiculture : Beekeeping for honey and other bee products. Sericulture : Raising silkworms for silk production. Horticulture : Cultivating fruits, vegetables, flowers, and ornamental plants. Floriculture : Growing flowers and ornamental plants for the floral industry. Climate-Smart Agriculture: Practices that increase productivity, resilience, and reduce emissions. Biopharming : Using genetically modified plants and animals to produce pharmaceuticals. Agrivoltaic Farming: Combinind solar energy production with farming, to maximize land use and rural energy access."}, {"c": 6, "n": "Economic Geography", "id": "s10", "t": "Natural Farming", "x": "Natural farming (also known as “ Fukuoka Method” ) is an agricultural philosophy and practice that emphasizes minimal human intervention and working in synergy with nature . It avoids synthetic chemicals, fertilizers, pesticides, and excessive tilling . The concept promotes biodiversity, soil health, and sustainable farming practices using locally available natural resources. It was established by Japanese farmer and philosopher Masanobu Fukuoka in his 1975 book The One-Straw. Zero Budget Natural Farming (ZBNF) is a low-cost approach to natural farming that relies on locally made preparations and avoids external inputs like pesticides and fertilizers. It does not treat weeds, insects and animals as enemies, but tries to emulate the natural conditions. Key concepts: o Minimal Human Intervention : The core idea is to let nature follow its course as closely as possible. o Use of Natural Inputs : Reliance on natural fertilizers and pest control methods, such as compost, manure, and biological pest control. o Soil Health : Maintaining healthy soil ecosystems through practices like crop rotation, cover cropping, and reduced tillage."}, {"c": 6, "n": "Economic Geography", "id": "s11", "t": "Land Use Categories of India", "x": "According to the Land Revenue records , land use in India is mainly of 9 types: o Forests: Area identified by the government as forest. o Barren & Wasteland: Area that cannot be brought under cultivation on the basis of the available technologies. o Land put to Non-Agri Use: Settlements, Commercial centres, Industries, Infrastructure etc. o Area under Permanent Pastures and Grazing Lands: Most of such land is owned by the Panchayat (Common Property Resource) or government. (Rarely Private) o Area under Miscellaneous Tree Crops and Groves: Orchards and fruit trees. (Mostly Private) o Culturable Wasteland: Land left fallow for >5yrs. Can be reclaimed. o Current Fallow: Land left without cultivation for less than or equal to 1 agricultural year. (Land resting for re-couping) o Fallow other than Current Fallow: Left fallow for less than 5 yrs but more than and year. o Net Sown Area: Land used for cultivation of crops Land Use Change: o Changes due to changes in the economic activities. o Over time, land under cultivation reduces (improvement of agricultural production, diversion of land for non-agricultural activities) o Land under forests can also reduce due to diversion. o As land is a finite resource, wastelands are also either reclaimed for agriculture or other works. Similarly Barren lands start getting used for non-agricultural activities. o In India, these land use records are maintained by Land Revenue Department (exercise by Survey of India) o Digital India Land Records Modernization Program is working to digitize land records in India. Land Degradation: Covered in Soils of India"}, {"c": 6, "n": "Economic Geography", "id": "s12", "t": "PYQ", "x": "Q.) With reference to micro-irrigation, which of the following statements is/are correct? 1. Fertiliser/nutrient loss can be reduced. 2. It is the only means of irrigation in dryland farming. 3. In some areas of farming, the receding of the groundwater table can be checked. Select the correct answer using the codes given below: (2011) (a) 1 only (b) 2 and 3 only (c) 1 and 3 only (d) 1, 2 and 3 Answer: C Micro-irrigation is a modern method of irrigation; by this method, water is irrigated through drippers, sprinklers, foggers and by other emitters on the surface or subsurface of the land. Major components of a micro irrigation system are as follows. o Water source, pumping devices (motor and pump), ball valves, fertigation equipment, filters, control valves, PVC joining accessories (Main and sub-main) and emitters. In this system, water is applied drop by drop nearer the root zone area of the crop. The drippers are fixed based on the spacing of the crop. Many different types of emitters are available in the market. They are classified as Inline drippers, online drippers, Microtubes, and Pressed compensated drippers. Drip irrigation is most suitable for wider spacing crops. The micro sprinkler irrigation system is mostly followed in sandy or loamy soils. This system is most suitable for horticultural crops and small grasses. In this method, water is sprinkled at a lower height in various directions. It is used for preparing nursery and lawns in soils with low water holding capacity. Advantages of drip irrigation system- Water saving and higher yield High quality and increased fruit size Suitable for all types of soil The easy method of fertigation and chemigation Saving in labour and field preparation cost Q.) The lower Gangetic plain is characterised by a humid climate with high temperatures throughout the year. Which one among the following pairs of crops is most suitable for this region? (2011) (a) Paddy and cotton (b) Wheat and Jute (c) Paddy and Jute (d) Wheat and cotton Answer: C The lower deltaic plains of the Ganges and Brahmaputra rivers that are Characterised by swamps and Sundarbans. 1. The suitable climate for growing jute is a warm and wet climate, which is offered by the monsoon climate during the fall season, immediately followed by summer. Temperatures ranging to more than 25 °C and relative humidity of 70%–90% are favourable for successful cultivation. 2. Rice crops need a hot and humid climate. It is best suited to regions which have high humidity, prolonged sunshine and an assured supply of water. The average temperature required throughout the life period of the crop ranges from 21 to 37º C. Maximum temp which the crop can tolerate is 400C to 42 0C. Q.) A state in India has the following characteristics: 1. Its northern part is arid and semi-arid. 2. Its central part produces cotton. 3. Cultivation of cash crops is predominant over food crops. Which one of the following states has all of the above characteristics? (2011) (a) Andhra Pradesh (b) Gujarat (c) Karnataka (d) Tamil Nadu Answer: B 1. Gujarat possesses varied landforms with the dry deciduous forests, majestic grasslands, marine ecosystems, wetlands and rich moist deciduous forests. 2. These habitats are home to rare wildlife inhabitants. 3. The three main sources of growth in Gujarat's agriculture are from cotton production, the rapid growth of high-value foods such as livestock, fruits and vegetables, and from wheat production, which saw an annual average growth rate of 28% between 2000 and 2008 (According to the International Food Policy Research Institute). Q.) Salinization occurs when the irrigation water accumulated in the soil evaporates, leaving behind salts and minerals. What are the effects of salinization on the irrigated land? (2011) (a) It greatly increases the crop production (b) It makes some soils impermeable (c) It raises the water table (d) It fills the air spaces in the soil with water Answer: B Soil salinization occurs when water-so"}, {"c": 6, "n": "Economic Geography", "id": "s13", "t": "WORLD RESOURCES", "x": "Resources are essentially anything that we can use from our environment to fulfill our needs and wants . An object/entity should fulfill these 2 criteria to be called a resource : Availability: The resource needs to be accessible somehow. This can involve technology to extract it, economic feasibility to develop it, and cultural acceptance of its use. Utility: It must be something that can be used for some kind of benefit."}, {"c": 6, "n": "Economic Geography", "id": "s14", "t": "Types of Resources:", "x": "Resources can be classified based on various parameters: Based on Origin Natural Resources: Resources that exist without human intervention. E.g. Water, minerals, forests, and air. Man-made (Human-made) Resources: Resources created by humans using natural resources. Buildings, machinery, infrastructure. Based on Exhaustibility Renewable Resources: Resources that can be replenished naturally over time. E.g. Solar energy, wind energy, biomass, hydropower. Non-renewable Resources: Resources that are finite and cannot be replaced within a human timescale once depleted. E.g. Fossil fuels (coal, oil, natural gas), minerals (gold, iron ore). Based on Origin (Biotic and Abiotic) Biotic Resources: Resources derived from living organisms. E.g.: Forests, animals, plants, and fossil fuels (originated from ancient biological matter). Abiotic Resources: Resources derived from non-living elements. E.g. Water, air, minerals, metals. Based on Ownership Individual Resources: Resources owned by private individuals or companies. E.g. Private land, personal vehicles, privately owned mines. Community Resources: Resources accessible to all members of a community. E.g. Public parks, community forests, common grazing lands. National Resources: Resources owned by the nation and managed by the government. E.g. National highways, public sector industries, forests. International Resources: Resources that are regulated by international bodies and are beyond the jurisdiction of any one country. E.g. International waters (High Seas), outer space. Mining: Extracting Resources from the ground. Condition for a mine: The cost of extraction and purification of the ore should be less than the value of the final product. Types of Mines: Open Cast: for resources near the surface Shaft: for resources at a deeper level Applications of REE: Electronics: Rare earth metals are essential components in the production of electronics, including smartphones, computers, and TVs. Magnets: Neodymium magnets, which contain rare earth elements, are crucial for various applications, such as electric motors in electric vehicles and wind turbines. Catalysis : Some rare earth metals serve as catalysts in chemical reactions, impacting processes like refining petroleum and automobile emissions control. Lighting : Phosphors containing rare earth metals are used in the production of energy-efficient lighting, including fluorescent lamps and LED lights. Medical Imaging : Gadolinium is used in contrast agents for magnetic resonance imaging (MRI) in medical diagnostics. Defense Technologies : Rare earth elements are used in the manufacturing of components for defense technologies, including guided missiles and radar systems."}, {"c": 6, "n": "Economic Geography", "id": "s15", "t": "Limestone", "x": "Limestone, a sedimentary rock composed primarily of calcium carbonate (CaCO3) , is a ubiquitous and versatile resource with immense economic and geologic significance. From building materials and cement production to agriculture, soil amendment, and environmental applications, limestone underpins numerous industries and plays a crucial role in shaping landscapes and ecosystems worldwide. Top Producers: China, India, USA, Russia, Brazil China: Hubei, Guangxi, and Shandong. India: Rajasthan, Madhya Pradesh, Andhra Pradesh, and Gujarat USA: Texas, Florida, and Kentucky Russia: Caucasus Mountains and the Ural Mountains Brazil: Minas Gerais and Bahia India: Rajasthan : Jaisalmer, Jodhpur, Nagaur, and Bikaner MP : Satna, Katni, and Damoh Andhra Pradesh : Kurnool and Anantapur Gujarat : Bhavnagar, Amreli, and Kachchh"}, {"c": 6, "n": "Economic Geography", "id": "s17", "t": "Coal", "x": "Coal, a cornerstone of the global energy sector for centuries, plays a crucial role in powering industries and generating electricity. Coal is primarily formed from the remains of plants that lived and died millions of years ago by the process called Coalification. Indian coal is of non-coking grade (non-metallurgical coal, has higher impurities, so cannot be converted into coke). Top Producers: China, India, USA, Australia, Indonesia. China: Shanxi, Inner Mongolia (mainly Anthracite) India USA: Appalachians (mainly Anthracite) Australia: Queensland, New South Wales Indonesia: Kalimantan, Sumatra India: Production less than requirement. 75% of electricity produced via coal based thermal power plants. Gondwana ( Bituminous) : River Valleys (Damodar, Mahanadi, Godavari, Son) Jharkhand-Bengal Coal Belt : Raniganj, Jharia, Bokaro, Giridih, Karanpura. Madhya Pradesh : Singrauli (part in UP, but CIL plant in MP) Korba in Chhattisgarh Talcher and Rampur in Odisha Chanda–Wardha, Kamptee and Bander in Maharashtra Singareni in Telangana and Pandur in Andhra Pradesh . Tertiary Coal (Can be Anthracite, bituminous, sub-bituminous or lignite): Anthracite : Kalakot, JnK Sub-Bituminous: Assam (Makum, Jaipur and Nazira) Arunachal Pradesh (Namchik – Namphuk) Meghalaya ( Darangiri, Cherrapunji, Mewlong and Langrin) Nagaland (minor rat-hole mining allowed despite a ban by the supreme court, under article 371A) Lignite: Tamil Nadu (Neyveli), Gujarat, Puducherry ."}, {"c": 6, "n": "Economic Geography", "id": "s18", "t": "Shale Oil And Gas", "x": "Shale oil (tight oil) and shale gas, unconventional oil and gas resources trapped within shale rock formations (less permeable and difficult to drill through), have revolutionized the energy landscape in recent decades. These resources, previously inaccessible, are now extracted through innovative technologies like hydraulic fracturing , unlocking vast new energy reserves and impacting global energy markets significantly. Top Producers : USA, China, Argentina, Canada, Russia India : Promising potential in: Cambay Basin Ganga Valley Basin Assam and Arakan Basin KG Basin Kaveri Basin Problems related to shale oil & gas mining : Shale oil and gas extraction, particularly through hydraulic fracturing (fracking), faces several environmental and public health concerns: Water Contamination : Fracking uses large volumes of water mixed with chemicals, raising concerns about potential contamination of groundwater resources through spills or improper disposal of wastewater. The underground aquifers might also get contaminated. Induced Seismicity : The process of injecting water underground during fracking can trigger earthquakes in some areas. Land Disturbance : Shale oil and gas development requires significant land use for well pads, pipelines, and infrastructure, disrupting ecosystems and impacting local communities. Air and Climate Impacts : Methane leaks during extraction and processing contribute to greenhouse gas emissions. Additionally, air pollution from drilling and associated activities can harm local air quality."}, {"c": 6, "n": "Economic Geography", "id": "s19", "t": "Non-Conventional Energy Resources", "x": "India’s total Renewable Energy Generation: 283.46 GW upto march 2026"}, {"c": 6, "n": "Economic Geography", "id": "s20", "t": "Solar Energy", "x": "Thermal & Electric Energy both can be harnessed from it. Top Producers : China, USA, India, Japan, Germany India being a tropical nation has a huge solar energy potential. India: target of 280 GW capacity by 2030 By May 2026, total installed capacity 157 GW Top Producers: Rajasthan, Gujarat, Maharashtra, Tamil Nadu, Karnataka Problems of covering sub-tropical deserts with Solar Panels: Covering just 1.2% of Sahara desert can produce enough energy to the world. But why is this not being done? Solar panels , which are darker in colour compared to the sands, may absorb more heat -> increase in temperature -> changes in rainfall and wind patterns in surrounding areas. High Logistic costs High maintenance costs (sands will cover the solar panels)"}, {"c": 6, "n": "Economic Geography", "id": "s21", "t": "Wind Energy", "x": "Onshore and Offshore In offshore locations, due to the lack of frictional forces, the speed of the winds is higher . However, the cost of these plants with the current technology nullifies the increased electricity production due to higher wind speeds. Top Producers: China, USA, India, Germany, Brazil India installed: 56 GW. Top Producers in India: Gujarat, Tamil Nadu, Karnataka, Rajasthan, Maharashtra No operational offshore wind farm in India."}, {"c": 6, "n": "Economic Geography", "id": "s22", "t": "Bio-Energy", "x": "Waste to Energy: Waste to Energy (WtE) is the process of generating energy in the form of electricity or heat from the primary treatment of waste. It typically involves incineration, where municipal solid waste is burned to produce steam that drives turbines to generate electricity. Biogas: Biogas is produced through the anaerobic digestion of organic materials such as agricultural waste, manure, and food scraps. The process results in a mixture of methane and carbon dioxide, which can be used as a renewable energy source for heating, electricity, and as a vehicle fuel. Top Producers: USA, Brazil, Indonesia, China, India In India: Maharashtra, Karnataka, Uttar Pradesh, Punjab, and Bihar India total production: 10.75 GW"}, {"c": 6, "n": "Economic Geography", "id": "s23", "t": "Geothermal Energy", "x": "USA, Indonesia, Philippines, Turkiye, New Zealand. Indian potential: 10600 MW India plans to harness 10 GW by 2030 especially at Manikaran, HP. Currently not tapped. Singareni Collieries Company Limited (SCCL) has commissioned a 20 kW pilot geothermal power plant in Manuguru area of Bhadradri Kothagudem district in Telangana."}, {"c": 6, "n": "Economic Geography", "id": "s24", "t": "Tidal Energy", "x": "Top Producers: S. Korea, France, Canada, China, Russia In India: We had started building plants in Gujarat (50MW in Kachchh) and West Bengal (3.75 MW at Durgaduani Creek). But stopped due to exorbitant prices."}, {"c": 6, "n": "Economic Geography", "id": "s25", "t": "Otec (Ocean Thermal Energy Conversion)", "x": "Only 2 global operating (pilot-sized) plants: Japan (Okinawa) & USA (Makai, Hawaii) In India, a 65-kW plant at Kavaratti, Lakshadweep , to power a desalination plant. Nuclear Energy Includes Fusion and Fission. Currently, only Fission is used for energy generation by humans. Top Producers (2021): USA, China, France, Russia, South Korea. According to Government of India, the present installed nuclear power capacity is set to increase from 8180 MW to 22480 MW by 2031-32. There has been a 70% Surge in India's Nuclear Power Capacity in the last 10 years . 3 stages of India’s Nuclear Power Program : Natural uranium fuelled Pressurized Heavy Water Reactors (PHWRs) (U235) Fast Breeder Reactors (FBRs) utilizing plutonium -based fuel. (Pu239): Kalpakkam, TN (achieved criticality) Advanced nuclear power systems for utilization of thorium . (U233 from Thorium): KAMINI-Kalpakkam Mini Reactor, Kalpakkam, TN (experimental) Map shows the locations of stage 1 reactors in India:"}, {"c": 6, "n": "Economic Geography", "id": "s26", "t": "PYQ", "x": "Q.) Despite having large reserves of coal, why does India import millions of tonnes of coal ? 1. It is the policy of India to save its own coal reserves for the future, and import it from other countries for the present use. 2. Most of the power plants in India are coal-based and they are not able to get sufficient supplies of coal from within the country. 3. Steel companies need a large quantity of coking coal which has to be imported. Which of the statements given above is/are correct? (2012) (a) 1 Only (b) 2 & 3 Only (c) 1 & 3 Only (d) 1,2, & 3 Ans. B Coal is and will continue to be the backbone of India's economic and development growth. India has the world's fifth largest coal reserves and is also the world's third largest producer and importer of coal. India's total thermal coal imports in 2021 may have edged higher from 156.09mn t in 2020. India imported 116.57mn t of thermal coal in January-September 2021, according to customs data, and going by the average fourth-quarter imports in the last five years, the receipts could have been slightly over 160mn t in 2021. The lack of coking coal reserves that are used as a raw material in steelmaking and allied industries is the main reason India imports millions of tonnes of coal. Coal in India is used either from domestic sources, mostly mined by coal India, or is imported. The issue for India is that the gap between domestic supply and demand is growing at a phenomenal rate.This gap is being filled by imported coal. Q.) Consider the following statements: 1. Natural gas occurs in the Gondwana beds. 2. Mica occurs in abundance in Kodarma. 3. Dharwars are famous for petroleum. Which of the statements given above is/are correct? (2013) (a) 1 only (b) 2 only (c) 2 and 3 only (d) None Ans. B KG basin, Assam, Gulf of Khambhat, Cuddalore district of Tamil Nadu, Barmer in Rajasthan etc. are the areas where natural gas can be found.Nearly 80% of the world's total proven natural gas reserves are located in ten countries. Russia tops the list, holding about a quarter of the world's total gas reserves, followed by Iran and Qatar in the Middle East. 4. Kodarma mines in Jharkhand are one of the important mica producing areas. Kodarma district of Jharkhand state has been famous worldwide for mica mining,especially for ruby mica. The district had the monopoly in producing mica for years and themica was exported to many countries worldwide. The main reserve of mica is found under the forest of mild life sanctuary of Kodarma. 5. The Dharwar rocks are rich in iron ore, manganese, lead, zinc, gold, silver etc. The Champions series containing gold mines lie within this system. This Champion system is named after the Champion reef in the Kolar Gold Fields. The Kolar Gold Fields contain one of the deepest gold mines of world 6. The Dharwar rocks are rich in iron ore, manganese, lead, zinc, gold, silver etc. The Champions series containing gold mines lie within this system. Q.) Which of the following is/are the characteristics/ characteristics of Indian coal? 1. High ash content 2. Low sulphur content 3. The low ash fusion temperature Select the correct answer using the codes given below. (2013) (a) 1 only (b) 1 and 2 only (c) 2 and 3 only (d) 1, 2 and 3 Ans. B Indian coals like any other Gondwana coals are of high ash content. Indian coals by their very nature are high in ash content but low in sulphur content. Indian coal has a high ash fusion temperature of about 1,500°C. India's domestic coal reserves have high ash content—up to 40 to 45 percent. As a result more coal is required to generate one kilowatt hour of electricity. This in turn means higher emissions. Sulphur content of Indian coal is, in general, around 0.5 – 1%. Studies show that the sulphur content in Indian coal is hardly 0.7%, which is not uniformly distributed in the coal but concentrated in the pyritic bands which are visible to the naked eye. The best solution to get rid of sulphur from Indian coal is to wash it Ash fusion tempe"}, {"c": 6, "n": "Economic Geography", "id": "s28", "t": "Types of Industries:", "x": "Primary Industries: These industries involve the extraction and harvesting of natural resources. Agriculture: Farming, horticulture, and animal husbandry. Fishing: Commercial fishing and aquaculture. Forestry: Logging, timber production, and forest management. Mining and Quarrying: Extraction of minerals, ores, and fossil fuels. Secondary Industries: These industries involve the processing and manufacturing of raw materials into finished goods. Manufacturing: Production of goods using raw materials. It includes: Light Industry: Consumer goods like clothing, electronics, and household items. Heavy Industry: Capital goods like machinery, steel production, and shipbuilding. Construction: Building infrastructure such as roads, bridges, buildings, and other structures. Tertiary Industries (Service Sector): These industries provide services rather than goods. Retail and Wholesale Trade: Selling goods directly to consumers and businesses. Hospitality and Tourism: Hotels, restaurants, travel agencies, and tour operators. Transport and Logistics: Transportation services (road, rail, air, sea), warehousing, and logistics management. Financial Services: Banking, insurance, investment, and real estate. Healthcare: Hospitals, clinics, pharmaceuticals, and medical services. Education: Schools, colleges, universities, and vocational training. Information Technology: Software development, IT services, and telecommunications. Professional Services: Legal, accounting, consulting, and advertising. Quaternary Industries These industries involve the intellectual activities often associated with technological innovation and knowledge-based services. Research and Development (R&D): Scientific research and technological innovation. Information Services: Data processing, information management, and media. Education and Training: Advanced education and specialized training programs. Quinary Industries These industries include the highest levels of decision-making and societal advancement . Government: Public administration and defense. Nonprofit Organizations: Charities, NGOs, and other community services. Culture and Arts: Museums, theaters, and cultural heritage management."}, {"c": 6, "n": "Economic Geography", "id": "s29", "t": "Other Classifications of Industries", "x": "o Based on Size: o Micro: Very small businesses, often family-run. Investment . o Small: Small-scale enterprises with limited employees and capital. Investment between 2.5-25 crore; turnover between 10-100 crore. o Medium: Mid-sized businesses with moderate resources. Investment between 25-125 crore; turnover between 100-500 crore. o Large: Large corporations with substantial resources and workforce . o Based on Ownership: o Public Sector: Owned and operated by the government. o Private Sector: Owned and operated by private individuals or companies. o Joint Sector: Collaboration between government and private entities. o Cooperative Sector: Owned and operated by a group of individuals for mutual benefit. o Based on Market Orientation: o Consumer Goods: Products sold directly to consumers (e.g., food, clothing, electronics). o Capital Goods: Products used in the production of other goods (e.g., machinery, tools, equipment)."}, {"c": 6, "n": "Economic Geography", "id": "s30", "t": "Factors Affecting the Location of Industries:", "x": "The location of industries depends on various factors that influence their operational efficiency, cost-effectiveness, and overall success. Raw Materials Proximity to Raw Materials: Industries that rely heavily on raw materials, such as mining and agriculture-based industries, often locate near their sources to minimize transportation costs. On this basis, industries can be called: Weight losing: Raw materials bulky, and finished product lighter Weight gaining: Raw materials lighter, and finished products bulky. Footloose: No dependency on the weight of the raw materials or the finished product. Availability and Quality of Raw material: The type, quality, and availability of raw materials can significantly impact the location decision. Labor Availability of Labor: Access to a sufficient and skilled labor force is crucial for industries requiring intensive manual or specialized labor. Labor Costs: Regions with lower labor costs may attract labor-intensive industries. Labor Laws and Conditions: Favorable labor laws and conditions can also influence industrial location. Market Access Proximity to Markets: Industries producing perishable goods or those with high transportation costs often locate near their primary markets to reduce distribution expenses. Market Size and Demand: Larger markets with higher demand can attract industries looking to maximize their sales and distribution. Transport and Infrastructure Transportation Facilities: Good connectivity through roads, railways, ports, and airports facilitates the efficient movement of raw materials and finished goods. Infrastructure Availability: Adequate infrastructure, including power supply, water supply, and communication networks, is essential for industrial operations. Energy Supply Access to Power: Reliable and affordable energy sources are crucial for energy-intensive industries like manufacturing and mining. Types of Energy: The availability of specific types of energy, such as electricity, natural gas, or renewable sources, can influence industrial location. Capital and Financial Factors Access to Capital: Proximity to financial institutions and access to credit can impact the decision on where to locate an industry. Investment Incentives: Government incentives, such as tax breaks and subsidies, can attract industries to specific regions. Government Policies and Regulations Industrial Policies: Government policies, including zoning laws, environmental regulations, and industrial promotion policies, play a significant role in industrial location decisions. Taxation: Favorable tax policies and lower tax rates can attract industries to particular areas. Climate and Environmental policies Climate Suitability: Certain industries, such as agriculture and tourism, depend on specific climatic conditions. Environmental Regulations: Stringent environmental regulations can deter industries from locating in certain regions. Circular Economy Push : The push for sustainability forces new industries to co-locate near major recycling centers to utilize secondary raw materials (urban mining). Social and Cultural Factors Community Attitudes: Local community support or opposition can influence industrial location. Quality of Life: Areas offering a higher quality of life, including good housing, education, and healthcare, may attract industries that value employee well-being. Availability of Technology and Innovation Access to Technology: Proximity to technology hubs and research institutions can benefit high-tech industries. Innovation Ecosystem: A robust ecosystem that supports innovation and research and development can attract industries looking to stay competitive. Reshoring: Advanced robotics negates the need for cheap human labor. This causes industries to \"reshore\" back to high-income countries closer to the final consumer. Global and International Factors Trade Agreements: International trade agreements and export incentives can influence the location of industries targeting glob"}, {"c": 6, "n": "Economic Geography", "id": "s31", "t": "Important Industrial Regions of the World", "x": "North America North-Eastern United States: o Regions: New York, New Jersey, Pennsylvania, Ohio, Illinois, and Michigan. o Industries: Steel, automobiles, chemicals, machinery, textiles, and electronics. o Key Cities: New York City, Chicago, Detroit, Pittsburgh, and Cleveland. West Coast of the United States: o Regions: California, Oregon, and Washington. o Industries: Technology, aerospace, entertainment, electronics, and biotechnology. o Key Cities: San Francisco, Los Angeles, Seattle, and San Diego. Southern United States: o Regions: Texas, Florida, Georgia, and North Carolina. o Industries: Oil and gas, aerospace, textiles, automobiles, and information technology. o Key Cities: Houston, Dallas, Atlanta, Miami, and Charlotte. Ontario and Quebec in Canada: o Regions: Toronto, Montreal, and Ottawa. o Industries: Automobile manufacturing, aerospace, information technology, and machinery. Europe Western Europe: Regions: Ruhr Valley (Germany), Alsace-Lorraine (France), and Benelux countries (Belgium, Netherlands, Luxembourg). Industries: Steel, automobiles, chemicals, machinery, and textiles. Key Cities: Berlin, Hamburg, Paris, Brussels, and Amsterdam. Northern Europe: Regions: United Kingdom, particularly the Midlands and Northern England. Industries: Pharmaceuticals, aerospace, chemicals, and electronics. Key Cities: London, Manchester, Birmingham, and Glasgow. Eastern Europe: Regions: Poland, Czech Republic, Slovakia, and Hungary. Industries: Heavy machinery, steel, chemicals, and automotive. Key Cities: Warsaw, Prague, Bratislava, and Budapest. Asia East Asia: Regions: Eastern China, Japan, South Korea, and Taiwan. Industries: Electronics, automobiles, shipbuilding, textiles, and heavy machinery. Key Cities: Shanghai, Beijing, Tokyo, Seoul, and Taipei. South Asia: Regions: India, particularly Maharashtra, Gujarat, Tamil Nadu, and Karnataka. Industries: Information technology, textiles, automobiles, chemicals, and pharmaceuticals. Key Cities: Mumbai, Bangalore, Chennai, Delhi, and Ahmedabad. Southeast Asia: Regions: Singapore, Malaysia, Thailand, and Indonesia. Industries: Electronics, petrochemicals, textiles, and food processing. Key Cities: Singapore, Kuala Lumpur, Bangkok, and Jakarta. Africa North Africa: Regions: Egypt, Morocco, and Tunisia. Industries: Textiles, food processing, chemicals, and petroleum refining. Key Cities: Cairo, Casablanca, and Tunis. Southern Africa: Regions: South Africa, particularly Gauteng and Western Cape. Industries: Mining, automobile manufacturing, textiles, and food processing. Key Cities: Johannesburg, Cape Town, and Durban. West Africa: Regions: Nigeria and Ghana. Industries: Oil and gas, food processing, textiles, and chemicals. Key Cities: Lagos, Accra, and Abuja. Australia Eastern Australia: Regions: New South Wales, Victoria, and Queensland. Industries: Mining, machinery, food processing, and chemicals. Key Cities: Sydney, Melbourne, Brisbane, and Adelaide. South America Brazil: Regions: São Paulo, Rio de Janeiro, and Minas Gerais. Industries: Automobiles, steel, petrochemicals, and textiles. Key Cities: São Paulo, Rio de Janeiro, and Belo Horizonte. Argentina: Regions: Buenos Aires and Córdoba. Industries: Food processing, automobiles, textiles, and chemicals. Key Cities: Buenos Aires and Córdoba. Chile: Regions: Santiago and Valparaíso. Industries: Mining, food processing, and chemicals. Key Cities: Santiago and Valparaíso."}, {"c": 6, "n": "Economic Geography", "id": "s32", "t": "Important Industrial Regions of India", "x": "Mumbai-Pune Industrial Region Industries: Textiles, automobiles, chemicals, engineering goods, pharmaceuticals, and information technology. Key Cities: Mumbai, Pune, Thane, Nashik. Kolkata-Hooghly Industrial Region Industries: Jute, textiles, chemicals, engineering, iron and steel, and paper. Key Cities: Kolkata, Howrah, Durgapur, Haldia. Delhi-NCR Industrial Region Industries: Information technology, electronics, automobiles, consumer goods, and textiles. Key Cities: Delhi, Gurugram, Noida, Faridabad. Ahmedabad-Vadodara Industrial Region Industries: Tourism, Textiles, chemicals, pharmaceuticals, petrochemicals, and engineering. Key Cities: Ahmedabad, Vadodara, Surat, Bharuch. Chennai-Bengaluru Industrial Region Industries: Automobiles, electronics, information technology, textiles, and heavy engineering. Key Cities: Chennai, Bengaluru, Hosur, Coimbatore. Kollam-Thiruvananthapuram Industrial Region Industries: Cashew processing, coir manufacturing, software development, biotechnology, and electronics. Key Cities: Kollam, Thiruvananthapuram. Chota Nagpur Industrial Region Industries: Iron and steel, coal mining, heavy engineering, and chemicals. Key Cities: Jamshedpur, Ranchi, Bokaro, Dhanbad. Visakhapatnam-Guntur Industrial Region Industries: Shipbuilding, petrochemicals, fertilizers, steel, and electronics. Key Cities: Visakhapatnam, Guntur."}, {"c": 6, "n": "Economic Geography", "id": "s36", "t": "Roadways", "x": "India's roadway network is one of the largest in the world , spanning over 63 lakh kilometers (Jan 2025). It plays a crucial role in the country's transportation system, connecting remote areas with cities, facilitating trade, and contributing to economic growth. The roadways in India can be categorized into various types based on their importance and the authority responsible for their construction and maintenance. Types of Roadways in India National Highways (NH) These are the primary roadways connecting major cities, ports, state capitals, and large industrial areas. They facilitate long-distance travel and play a vital role in the country's economic integration. Only 2% of the total road network . Authority: Constructed and maintained by the National Highways Authority of India (NHAI) , under the Ministry of Road Transport and Highways (MoRTH). Examples: NH44 (previously NH7, the longest highway running from Srinagar to Kanyakumari), NH48 (previously NH8, connecting Delhi and Mumbai). State Highways (SH) These roads connect important cities within a state and provide links to the national highways and other state highways. 4% of the total Road network. Authority: Constructed and maintained by the respective State Public Works Departments (PWDs). Examples: Maharashtra State Highway 4 (connecting Pune and Ratnagiri), Karnataka State Highway 1 (connecting Bangalore and Mysore). District Roads These roads connect district headquarters with other places in the district. They are further classified into Major District Roads (MDR) and Minor District Roads . 14% of the total road network . Authority: Constructed and maintained by the Zilla Parishads (District Councils) and the District PWDs. Examples : MDRs in Tamil Nadu and Uttar Pradesh that connect rural areas to district centers. Rural Roads These are roads connecting rural areas and villages to nearby towns or district roads. They are crucial for local connectivity and agricultural activities. Authority: Constructed and maintained by the local bodies (Gram Panchayats) and under the Pradhan Mantri Gram Sadak Yojana (PMGSY). Examples: Roads constructed under the PMGSY program in various states, improving rural connectivity. Urban Roads These roads are found within the limits of towns and cities. They include arterial roads, sub-arterial roads, and local streets. Authority: Constructed and maintained by Urban Local Bodies (Municipal Corporations or Municipalities). Examples: Major city roads like Marine Drive in Mumbai, and Rajpath in Delhi. Naming of National Highways in India: Up until 2010 , all of our National Highways were numbered on the basis of the National Highways Act of 1956. However, these numbers of National Highways did not give any indication of its location and direction. Hence, a new system was brought into place by the Ministry of Road Transport and Highways. North-South Highways: These highways have even numbers . They run primarily in a north-south direction. The numbering increases from east to west . Highways close to the eastern part of India have smaller even numbers, and the numbers increase as one moves westward. For example, NH2 is in the eastern part, while NH68 is further west. East-West Highways: These highways have odd numbers . They run primarily in an east-west direction. The numbering increases from north to south . Highways closer to the northern part of India have smaller odd numbers, and the numbers increase as one moves southward. For example, NH1 is in the northern part, while NH87 is further south. Sub-Highways: For highways that branch off from primary highways , a prefix is added to the primary highway number. For example, NH101 would be a branch of NH01. April 1, 2018: a new way to calculate roads . Lane system: each lane’s length is calculated separately."}, {"c": 6, "n": "Economic Geography", "id": "s37", "t": "Railways", "x": "India has one of the largest and most complex railway networks in the world , spanning over 68,000 km, playing a critical role in the country's transportation system. The Indian Railways network is extensive and serves both passenger and freight needs across diverse geographical regions. Types of Railways in India Broad Gauge (BG) The most widely used gauge in India, with a track width of 1,676 mm (5 ft 6 in) . Predominantly used for long-distance and heavy freight traffic, as well as passenger services. Meter Gauge (MG) A narrower gauge with a track width of 1,000 mm (3 ft 3 3⁄8 in). Mostly found in some rural and less developed areas, but is gradually being converted to broad gauge under the Unigauge project. Narrow Gauge (NG) The narrowest gauge in India, with a track width of 762 mm (2 ft 6 in) or 610 mm (2 ft). Used in hilly and mountainous regions where constructing broad gauge is difficult. Also being phased out or converted to broad gauge. Standard Guage A railway track with a gauge of 1,435 mm (4 feet 8 1/2 inches) . Primarily used for urban rail transit systems like metro, monorail, and tram . Project Unigauge , launched on April 1, 1992, is an ongoing initiative by Indian Railways aimed at converting and standardizing all rail gauges in India to the 1,676 mm (5 ft 6 in) broad gauge. Suburban Railways Serve the metropolitan and larger urban areas , facilitating daily commutes. Mumbai Suburban Railway, Delhi Suburban Railway. Metro Railways Urban transit systems operating in major cities to reduce congestion and provide efficient public transportation. Delhi Metro, Kolkata Metro, Bengaluru Metro. High-Speed Railways Proposed and under-construction projects aimed at providing high-speed travel between major cities. Mumbai-Ahmedabad High-Speed Rail Corridor. Construction and Maintenance Authorities Indian Railways (IR) A state-owned national railway company, responsible for the construction, maintenance, and operation of the majority of the rail network in India. Divided into 19 zones, each headed by a General Manager. These zones are further divided into divisions. Under the Ministry of Railways, Government of India. Dedicated Freight Corridor Corporation of India Limited (DFCCIL) A public sector unit under the Ministry of Railways, responsible for planning, construction, and operation of dedicated freight corridors to improve the efficiency of freight movement. Metro Rail Corporations Autonomous bodies or special purpose vehicles (SPVs) formed to plan, construct, and operate metro rail systems in cities. Delhi Metro Rail Corporation (DMRC), Bangalore Metro Rail Corporation Limited (BMRCL). Dedicated Freight Corridors: Dedicated freight corridors (DFCs) in India are specialized railway tracks designed exclusively for freight transportation. These corridors aim to improve the efficiency, speed, and capacity of freight movement across the country, reducing congestion on the existing railway network and facilitating economic growth. Eastern Dedicated Freight Corridor (EDFC) Route: Ludhiana in Punjab to Dankuni near Kolkata in West Bengal. Length: Approximately 1,839 kilometres. Purpose: To facilitate the movement of coal, steel, and other bulk goods from eastern India to northern India, improving the efficiency of goods transportation in the region. Status: Under construction , with several sections already operational . Western Dedicated Freight Corridor (WDFC) Route: Dadri in Uttar Pradesh to Jawaharlal Nehru Port Trust (JNPT) near Mumbai in Maharashtra. Length: Approximately 1,506 kilometres . Purpose: To enhance the movement of goods from the industrial heartland of Delhi-NCR to the major port in Mumbai, thus facilitating export-import trade and reducing logistics costs. Status: Under construction , with significant sections already operational. Future Projects: East-West Corridor : Connecting Kolkata to Mumbai. North-South Corridor : Connecting Delhi to Chennai. East Coast Corridor : Connecting Kharagpur to Vijayawad"}, {"c": 6, "n": "Economic Geography", "id": "s38", "t": "Pipelines", "x": "Pipelines in India form a crucial part of the country's infrastructure for transporting a variety of commodities, including crude oil, natural gas, petroleum products, and water. They provide a safe, efficient, and cost-effective means of transportation over long distances. Their limiting factor is that they can only transport liquids or gases , and they have less flexibility compared to railways and roadways. What They Transport Crude Oil: Transported from oil fields to refineries. Natural Gas: Transported from gas fields to processing plants and consumers. Petroleum Products: Transported from refineries to distribution points, including petrol, diesel, kerosene, and aviation fuel. Ores: Mixed with water to allow them to flow. Water: Transported from water sources to urban, rural, and industrial areas. Milk: in very local locations in the world as milk is perishable Important Examples Naharkatia-Noonmati-Barauni Pipeline Initially till Noonmati, later extended to Barauni. Crude oil Mumbai High-Mumbai-Ankaleshwar-Koyali Pipeline Crude oil & Natural Gas Salaya-Koyali-Mathura Crude oil to Koyali & Mathura. Extended from Mathura to Panipat & later Jalandhar. Hazira-Bijapur-Jagdishpur Gas Pipeline By GAIL Largest underground pipeline of world Extended to Delhi via Dadri"}, {"c": 6, "n": "Economic Geography", "id": "s39", "t": "Ropeways", "x": "Ropeways use suspended cables to transport goods and passengers, typically over difficult terrain. They are especially popular in hilly, mountainous, and remote areas where conventional transportation modes like roads and railways are challenging to construct . Ropeways in India date back to the early 20th century , with industrial applications in mining and logging. The first major passenger ropeway in India was established in 1969 in Auli , Uttarakhand, which opened the door for further developments across the country. Since then, several ropeways have been established in popular tourist destinations , such as in Darjeeling, Gulmarg, and Vaishno Devi. PARVATMALA SCHEME The Parvatmala Scheme , announced in the 2022-23 Union Budget by India's Union Finance Minister, is a National Ropeways Development Programme focused on improving connectivity in India's hilly regions. The program, launched under a Public-Private Partnership (PPP) model, offers an eco-friendly alternative to conventional roadways in difficult terrains. It aims to enhance commuter convenience, promote tourism, and potentially relieve congestion in crowded urban areas. The scheme initially targets states like Uttarakhand, Himachal Pradesh, Manipur, Jammu & Kashmir, and other Northeastern regions, with eight ropeway projects covering 60 kilometers planned for 2022-23. The Ministry of Road Transport and Highways (MORTH) oversees the program, supported by a regulatory framework to ensure standards and efficiency. The scheme is significant for its economic benefits (lower land acquisition costs due to direct routes), speed (aerial transport bypasses road obstacles), environmental friendliness (reduced dust emissions), and potential for last-mile connectivity . In January 2024 , it was announced that the number of projects under the scheme would be increased to 400 , with an expense of Rs. 1.25 lakh crore in 5 years. Ropeways under construction: Varanasi Urban Ropeway Gaurikund-Kedarnath Ropeway (9.7 km, 3,584m altitude)"}, {"c": 6, "n": "Economic Geography", "id": "s40", "t": "WATER TRANSPORT", "x": "Why is water transport cheap ? Water does not provide as much friction as land, so fuel efficiency is higher . There is no need to create separate infrastructure for sea travel except the terminals . E.g. roads, rails, and pipes are needed for land-based transportation. This adds to the savings."}, {"c": 6, "n": "Economic Geography", "id": "s41", "t": "Inland Waterways", "x": "Inland waterways in India have a long history dating back to ancient times, when rivers were utilized as crucial arteries for trade and transportation. Ancient Importance: Rivers like the Ganges, Brahmaputra, and Godavari have historically served as major trade routes, facilitating commerce and cultural exchange. Colonial Legacy: The British colonial administration developed some inland waterways for transportation of goods during the colonial period, recognizing the strategic importance of river navigation. Construction and Development Inland Waterways Authority of India (IWAI): Established in 1986, IWAI is the primary authority responsible for the regulation and development of inland waterways in India. National Waterway Act: Enacted in 1986, this legislation identified specific stretches of rivers, canals, and backwaters as national waterways for development and regulation. Modernization Efforts: Recent years have seen increased investment in the modernization and expansion of inland waterways infrastructure, including dredging, construction of terminals, and installation of navigation aids. There are 111 officially notified Inland Waterways in the country. Some Important Examples :"}, {"c": 6, "n": "Economic Geography", "id": "s42", "t": "Open Ocean Transport", "x": "India's ocean-based water transport has a rich history and plays a vital role in the country's economy and connectivity. Approximately 95 percent of India's foreign trade by volume and 70 percent by value moves through ocean routes. History: Ancient Times: India's maritime history dates back to the Indus Valley Civilization , with evidence of trade links with Mesopotamia and Egypt. Ancient ports like Lothal were significant centers of commerce. Medieval Period: During the medieval period, Indian ports facilitated trade with Africa, the Middle East, and Southeast Asia . Notable ports included Calicut, Surat, and Cochin. Colonial Era: The colonial period saw the establishment of modern ports by the British , such as Mumbai (Bombay), Kolkata (Calcutta), and Chennai (Madras), to facilitate trade and control. Post-Independence: After independence, India expanded and modernized its port infrastructure to support economic growth and international trade. India has 13 major ports (newest being Galathea Bay at Great Nicobar) and over 200 minor and intermediate ports . The 14th Port has been commissioned at Vadhavan, near Mumbai, but it is yet to be constructed. Port Management Ministry of Ports, Shipping, and Waterways: The central government body responsible for formulating policies and overseeing the development and regulation of ports in India. Port Trusts: Major ports are managed by autonomous Port Trusts established under the Major Port Trusts Act, of 1963. Each Port Trust operates under the supervision of a Board of Trustees appointed by the government. State Maritime Boards: Minor and intermediate ports are managed by State Maritime Boards or State Port Departments. These entities oversee the development, regulation, and management of ports within their respective states. Private Sector Participation: In recent years, there has been significant private sector participation in port development and operations through Public-Private Partnerships (PPPs). Private companies invest in port infrastructure, container terminals, and logistics services."}, {"c": 6, "n": "Economic Geography", "id": "s44", "t": "Airways in India", "x": "History: Early Beginnings: Air transport in India began in the early 20th century. The first commercial flight took place on February 18, 1911, from Allahabad to Naini, covering a distance of about 6 miles. Post-Independence Era: After independence, India established its own national carrier , which played a key role in developing the country’s aviation sector. In 1948, the government acquired a 49% stake in Tata-owned Air India Nationalization: Done in 1953 , when all Private airlines were merged to form a national state carrier, i.e. the Indian Airlines for all domestic flights, and Air India for international services. Liberalization and Growth: The aviation sector was liberalized in the 1990s , leading to the entry of private airlines and significant growth in the industry. This period saw the emergence of several domestic carriers, including Jet Airways, IndiGo, SpiceJet, and others. Modern Era: Today, India boasts a rapidly growing aviation market, with a large number of domestic and international flights connecting major cities and regions. The sector continues to expand with increasing passenger traffic and investment in airport infrastructure. State exit: A proposal for the sale of Air India was floated in 2017. After multiple failures and delays, it was finally sold to the Tata Group in 2021 (officially handed over in Jan 2022). >90% of Indian air traffic handled by 2 companies. Concerns of Duopoly. India has 157 operational airports of which 133 are overseen by Airports Authority of India. Airport Management in India: Airports Authority of India (AAI): AAI is the statutory body responsible for creating, upgrading, maintaining, and managing civil aviation infrastructure in India. It operates over 100 airports, includin
