g international, domestic, and civil enclaves. Private Sector Participation: In recent years, several major airports have been developed and managed through Public-Private Partnerships (PPPs). Private entities such as GMR Group, Adani Group, and GVK Group operate major airports like Indira Gandhi International Airport in Delhi, Chhatrapati Shivaji Maharaj International Airport in Mumbai, and Kempegowda International Airport in Bengaluru, in conjunction with the AAI (except Mumbai). State Governments: Some state governments also play a role in managing smaller airports within their territories, often in collaboration with AAI or private players."}, {"c": 6, "n": "Economic Geography", "id": "s45", "t": "COMMUNICATION", "x": "Prior to the introduction of the Postal System in India, communication was mostly in conjunction with transportation. Either the person who wanted to communicate travelled to the receiver, or they sent some messengers. The British colonial administration recognized the importance of an efficient communication system for governance and trade. The first organized postal system was established in the late 18th century."}, {"c": 6, "n": "Economic Geography", "id": "s46", "t": "Postal System", "x": "Indian Post Office Act of 1837: This act laid the foundation for the modern postal system in India. It standardized postal services and rates across the country. Railway Mail Service: With the expansion of the railway network in the mid-19th century , the Railway Mail Service was introduced, significantly speeding up mail delivery. Indian Post Office Act of 1854: This act reorganized the postal system, making it more efficient and widespread. It introduced uniform postage rates and established post offices in urban and rural areas. Expansion and Modernization: After independence in 1947 , the Indian postal system expanded rapidly to cover rural and remote areas. The postal network became one of the largest in the world. Introduction of Speed Post: In 1986 , India Post introduced Speed Post, a high-speed postal service, to compete with private courier services ."}, {"c": 6, "n": "Economic Geography", "id": "s47", "t": "Telegraph", "x": "Introduction of Telegraph: The telegraph was introduced to India in the mid-19th century. The first telegraph line was laid between Kolkata (then Calcutta) and Diamond Harbour in 1851. Expansion: By 1854 , telegraph lines connected major cities like Kolkata, Mumbai (then Bombay), Chennai (then Madras), and Peshawar. The telegraph network expanded rapidly , covering vast distances and enhancing communication across the British Empire in India. End of Telegraph Services: With the rise of digital communication, the use of telegraph declined. In 2013, India officially ended its telegraph services."}, {"c": 6, "n": "Economic Geography", "id": "s48", "t": "Telephones", "x": "The first telephone exchange in India was established in Kolkata in 1881 , marking the beginning of telephone services in the country. Expansion: Telephone services gradually expanded to other major cities , but their reach remained limited primarily to urban areas and government offices. Liberalization and Privatization: The liberalization of the Indian economy in the 1990s led to the entry of private telecom companies , which transformed the sector. This period saw the launch of mobile phone services and significant growth in the number of subscribers. Mobile Revolution: The early 2000s marked the mobile revolution, with affordable handsets and competitive pricing making mobile phones accessible to a large population. Currently, India has become one of the fastest countries to roll out 5G ."}, {"c": 6, "n": "Economic Geography", "id": "s49", "t": "Radio", "x": "Introduction of Radio Broadcasting: Radio broadcasting began in India with the establishment of private radio clubs in the early 1920s. The first commercial radio station, Indian Broadcasting Company, started operations in Mumbai and Kolkata in 1927. All India Radio (AIR): The British government took over radio broadcasting in 1936 , establishing All India Radio (AIR) as the national broadcaster . AIR played a key role in disseminating news and information during World War II. The Quit India Movement was also energised by the use of this mass media. All India Radio expanded its reach post-independence , with more radio stations set up across the country, broadcasting in multiple languages."}, {"c": 6, "n": "Economic Geography", "id": "s50", "t": "Television:", "x": "Introduction of Television: Doordarshan , India’s public service broadcaster, began television services in 1959 . Television rapidly gained popularity, especially with the introduction of color broadcasts in 1982. Private Channels: The 1990s liberalization policy led to the entry of private television channels, breaking the monopoly of Doordarshan and diversifying content."}, {"c": 6, "n": "Economic Geography", "id": "s51", "t": "Digital Communication", "x": "Introduction of the Internet: The Internet was introduced in India in 1995. The subsequent years saw a rapid increase in internet users, driven by affordable data plans and smartphones. Growth of Digital Services: The government launched various initiatives to promote digital communication, including e-governance services, online education, and telemedicine. Digital India Initiative: Launched in 2015, the Digital India initiative aimed to transform India into a digitally empowered society and knowledge economy. It focused on improving digital infrastructure, enhancing internet connectivity, and providing digital services to citizens."}, {"c": 6, "n": "Economic Geography", "id": "s52", "t": "Satellite Communication:", "x": "Satellite communication in India has significantly enhanced the country's capabilities in broadcasting, telecommunications, and internet services. ISRO, has been instrumental in developing and deploying a series of communication satellites that cater to various needs, including television broadcasting, telephony, data transmission, and internet services. More details in Science & Tech."}, {"c": 6, "n": "Economic Geography", "id": "s53", "t": "PYQ", "x": "Q.1) Consider the following pairs : Which of the above pairs is/are correctly matched ? (2014) (a) 1 and 2 only (b) 3 only (c) 1, 2 and 3 (d) None Answer: D National Highway 4 or NH 4, It is of 230.7 km of length. o This highway is known as Andaman Trunk Road (The Great Andaman Trunk Road). o A stretch of national highway from Mumbai to Pune to Hubli to Bangalore to Chennai was earlier called NH 4 before renumbering of national highways in the year 2010. o The former NH 4 is now renumbered as NH 48. o National Highway 6, is a national highway in India running from Jorabat in Meghalaya to Selling in Mizoram. o The highway passes through the Indian states of Meghalaya, Assam, and Mizoram. o National Highway 15 (NH 15) starts from Baihata in Assam and terminates at Wakro in Arunachal Pradesh. Q.2) In which of the following activities are Indian Remote Sensing (IRS) satellites used? 1. Assessment of crop productivity 2. Locating groundwater resources 3. Mineral exploration 4. Telecommunications 5. Traffic studies Select the correct answer using the code given below (2015) (a) 1, 2 and 3 only (b) 4 and 5 only (c) 1 and 2 only (d) 1, 2, 3, 4 and 5 Answer: A India's remote sensing programme under the Indian Space Research Organisation (ISRO) started off in 1988 with the IRS-1A, the first of the series of indigenous state-of-art operating remote sensing satellites, which was successfully launched into a polar sun-synchronous orbit on March 17, 1988, from the Soviet Cosmodrome at Baikonur. Data from Indian Remote Sensing satellites are used for various applications of resources survey and management under the National Natural Resources Management System (NNRMS). Following is the list of those applications: Space Based Inputs for Decentralised Planning (SIS-DP) National Urban Information System (NUIS) ISRO Disaster Management Support Programme (ISRO-DMSP) Biodiversity Characterization at landscape level- http://bis.iirs.gov.in Preharvest crop area and production estimation of major crops. Drought monitoring and assessment based on vegetation condition. Flood risk zone mapping and flood damage assessment. Hydro-geomorphological maps for locating underground water resources for drilling wells. Irrigation command area status monitoring Snow-melt run-off estimates for planning water use in downstream projects Land use and land cover mapping Urban planning Forest survey Wetland mapping Environmental impact analysis Mineral Prospecting Coastal studies Q.3) Consider the following pairs: How many of the above pairs are correctly matched? (2023) (a) Only one pair (b) Only two pairs (c) All three pairs (d) None of the pairs Answer: B Kamarajar port at Tuticorin is the first corporate port of India, registered under the Companies Act. It started in 2001. The Mundra Port owned by Adani Ports is the largest private port of India. It has also overtaken JNPT port to become the largest container port of India."}, {"c": 6, "n": "Economic Geography · quick", "id": "q-1-agriculture", "t": "1 · Agriculture", "x": "1.1 Seasons 🌦️ Kharif = Kar-Rain (monsoon crops). Rabi = Rest-of-winter (WDs help). Zaid = Zara-garmi (summer gap). Kharif Rabi Zaid Time Jun–Oct (sow with SW monsoon; harvest Sep–Oct) Oct/Nov–Mar/Apr (sow Oct–Dec; harvest Mar–Apr) Mar–Jun (harvest Jun–Jul) Weather hot, humid, heavy rain cool and dry growth, warm at harvest; Western Disturbance rain helps warm, dry; irrigation needed Crops paddy, maize, jowar, bajra, pulses (moong, urad, arhar), cotton, groundnut, soybean, sugarcane wheat, barley, oats, gram, mustard, peas, linseed watermelon, muskmelon, cucumber, vegetables, fodder, some moong/urad Farming by water. 💧 \"75 – 115 – 120\" ladder. Dry farming: rain , season (moisture conservation, drought-resistant crops). Dryland: 75–115 cm, 75–120 days. Wetland: > 115 cm, > 120 days (rainwater harvesting). Dry/dryland farming gives ≈ 80% of maize, 90% of bajra, ~95% of pulses, 75% of oilseeds. Irrigated: protective (saves crops from drying) vs productive (raises yield). Micro-irrigation (drip, sprinkler, foggers): saves water, stops soil erosion, no levelling, any soil, uniform watering, fertigation, drip needs low pressure. Costs: high investment, pipe clogging, spacing needed, technical installation. PYQ 2011 (ans C): reduces nutrient loss ✔; checks falling groundwater table in some areas ✔; \"the only means of irrigation in dryland farming\" ✘. 1.2 Crop table (read from the image) 🗺️ Pairing pegs: Cotton + black soil (Maharashtra, Gujarat, Telangana) · Jute + West Bengal (wet, 120–200 cm) · Tea = acidic slopes (Assam, WB, TN, Kerala) · Coffee = Karnataka (shade, Arabica & Robusta) · Rubber = Kerala · Coconut = Kalpavriksha (Kerala) · Bajra = toughest (tolerates 42 °C), Rajasthan. Crop Temp / rain Soil Top Indian states Top world Remarks Rice 20–32 °C · 150–300 cm deep clayey, alluvial UP, Telangana, WB India, China, Bangladesh, Indonesia, Vietnam staple; Aus, Aman, Boro in WB; high humidity Wheat 10–25 °C · 50–100 cm loamy, well-drained UP, MP, Punjab China, EU, India, Russia, USA winter crop; bright sun at ripening Jowar 20–27 · 50–75 light sandy–loamy Maharashtra, Karnataka, MP India, Niger, China, Mali, Nigeria Kharif & Rabi; fodder + biofuel Bajra 20–27 · 50–75 sandy loam Rajasthan, UP, Gujarat India, Niger, China, Nigeria drought-resistant, up to 42 °C Millets (general) 20–27 · 50–75 wide range Rajasthan, Karnataka, MP India, Niger, China, Mali, Nigeria antioxidants, diabetes/heart, protein; low cost; marginal farmers; jowar, bajra, ragi Maize 15–27 · 50–80 well-drained loam MP, Karnataka, Bihar USA, China, Brazil, EU, Argentina food, alcohol, feed, biofuel Cotton 21–30 · 50–100 black (regur) Maharashtra, Gujarat, Telangana China, India, Brazil, USA, Australia cash crop; ≥ 210 frost-free days Jute 24–35 · 120–200 alluvial WB, Bihar, Assam India, Bangladesh, China retting; plastic alternative Sugarcane 20–27 · 100–150 loamy UP, Maharashtra, Karnataka Brazil, India, China, Thailand, Pakistan very water-intensive; ethanol + sugar Pulses 15–27 · low rain well-drained MP, Maharashtra, UP India, Canada, Myanmar, Brazil, Ethiopia nitrogen-fixing; intercropping; India 766 kg/ha vs world 1,015 Oilseeds 15–30 · 30–75 loamy–sandy Rajasthan, MP, Maharashtra USA, China, Brazil, India soybean, mustard, groundnut Palm oil 25–28 · >200 tropical well-drained AP, Telangana, Kerala Indonesia, Malaysia, Thailand, Colombia, Nigeria deforestation concern; push in NE Tea 16–32 · 150–300 acidic, slopes Assam, WB, TN, Kerala (+ Tripura, HP) China, India, Kenya, Sri Lanka, Vietnam plantation; labour-intensive Coffee 15–28 · 150–200 acidic, fertile Karnataka, Kerala, TN Brazil, Vietnam, Colombia, Ethiopia, Indonesia shade-grown; Arabica & Robusta Cocoa 18–32 · 100–250 laterite AP, Kerala, Karnataka, TN Ivory Coast, Ghana, Indonesia, Nigeria, Ecuador shade (under coconut/areca); ~70% of world beans from W. Africa (Ivory Coast, Ghana, Nigeria, Cameroon) Rubber 25–35 · 200–450 laterite, acidic Kerala, TN Thailand, Indonesia, Vietnam, India, China latex"}, {"c": 6, "n": "Economic Geography · quick", "id": "q-2-world-resources-and-minerals", "t": "2 · World resources and minerals", "x": "Resource = availability + utility. Classes: natural / human-made · renewable / non-renewable · biotic / abiotic · individual / community / national / international (high seas, outer space). Mining: a mine pays only if extraction + purification cost Open-cast (near surface), shaft (deep). ⛏️ State-hotspot pegs: Iron = the Odisha–Jharkhand–Chhattisgarh–Karnataka–Goa belt · Copper = Rajasthan (Khetri) · Bauxite = Odisha · Gold = Kolar & Hutti (Karnataka) · Diamond = Panna (MP) only · Mica = Jharkhand · Monazite/Thorium = Kerala · Uranium = Jaduguda (Jharkhand) · Lead–zinc–silver = Rajasthan (Zawar, Rampura Agucha) · Chromite = Odisha > 96%. Mineral Where in India (handout) Hooks Iron ore Odisha (Mayurbhanj, Keonjhar, Sundargarh); Jharkhand (Singhbhum); Chhattisgarh (Durg, Dantewada, Bailadila); Karnataka (Ballari, Hospet, Kudremukh); Goa, Maharashtra, Telangana, AP, TN hematite, magnetite, limonite, siderite; steel Manganese Odisha, Karnataka, MP, Maharashtra steel, batteries Copper Rajasthan 52.25% (Jhunjhunu, Khetri, Alwar) · MP 23.28% (Balaghat) · Jharkhand 15.14% (Singhbhum) chalcopyrite; world leaders Chile, DR Congo, Peru Bauxite Odisha (Kalahandi, Koraput), Gujarat, Jharkhand (Lohardaga), Maharashtra, Chhattisgarh (Amarkantak), MP; new finds in Meghalaya aluminium smelters sit near power plants (huge electricity) Gold Karnataka (Kolar, Hutti), Jharkhand, Chhattisgarh, Rajasthan, AP (Jonnagiri); Bihar preliminary Kolar to restart 24 yrs after closure Silver by-product; Rajasthan ≈ 60% (Zawar, Rampura Agucha) lead–zinc by-product Uranium Jharkhand (UCIL Jaduguda); potential Rajasthan, Chhattisgarh, Maharashtra, HP, Andhra… natural U contains 0.72% U-235; U-235 fissile, U-238 not; enrichment raises concentration Thorium (monazite) India ≈ 25% of global deposits; Palakkad & Kollam (Kerala), Visakhapatnam, Mahanadi delta cleaner; U-233; thorium reactors can use up to 99% of fuel Tin Chhattisgarh (Dandkaranya) bronze Lead / Zinc Rajasthan largest lead and zinc state (HZL mines: Rampura Agucha, Sindesar Khurd, Rajpura Dariba, Zawar, Kayad) zinc – galvanising; Zn–S batteries as lithium alternative Nickel Odisha (Sukinda), Jharkhand, Nagaland; ~0.2% of global reserves; no active mine stainless steel, batteries Cobalt potential – Jharkhand, Odisha, Rajasthan, Nagaland, MP; no domestic production Lithium J&K, Rajasthan, Karnataka (Mandya, Yadgiri); first mine expected in Korba, Chhattisgarh; no operating mine Titanium Kerala, TN, AP, Odisha (ilmenite, rutile) 2023 PYQ Rare earths monazite, bastnäsite, xenotime; coastal placers in Kerala, TN, Odisha, AP; 13.07 million t monazite (5th largest) 17 elements = 15 lanthanides + scandium + yttrium; China's near-monopoly → Minerals Security Partnership Mica Jharkhand (Hazaribagh, Koderma), AP (Nellore), Rajasthan Feb 2025: classified Major Mineral with feldspar, barytes, quartz Tantalum, silicon no production; silicon from quartz in Haryana, Rajasthan, AP Tungsten Karnataka, Rajasthan (Degana) Madurai mining scrapped after protest Antimony, germanium, indium, helium ~100% import dependent (antimony \"complete\"; germanium 100%; indium complete; helium 100%) China limited exports (antimony – July 2024; gallium – July 2023) Gallium, tellurium, selenium by-products of bauxite/copper ALCO plans 10 tpy gallium plant at Damanjodi Diamond ~90% Panna (MP); AP (Krishna basin), Chhattisgarh production only in Panna Limestone Rajasthan, MP (Satna, Katni), AP, Gujarat world: China, India, USA, Russia, Brazil Others Chromite (> 96% Odisha) · Pyrite (no production since 2003) · Borax (small deposits, Puga valley) · Cryolite (nil) Coal and hydrocarbons Coal: from plant remains by coalification. Indian coal is non-coking, high ash (up to 40–45%), low sulphur (~0.5–1%, ~0.7%), high ash-fusion temperature (~1,500 °C). ~75% of electricity comes from coal-based thermal plants. World leaders: China (Shanxi, Inner Mongolia), India, USA, Australia, Indonesia. Gondwana (bituminous): river valleys – Damodar, Mahanadi,"}, {"c": 6, "n": "Economic Geography · quick", "id": "q-3-industries", "t": "3 · Industries", "x": "Sector What Examples Primary extraction/harvest agriculture, fishing, forestry, mining Secondary processing/manufacture light (consumer goods), heavy (capital goods – steel, ships), construction Tertiary services trade, tourism, transport, finance, health, education, IT, professional Quaternary knowledge R&D, information services, advanced training Quinary top decisions government, NGOs, culture and arts 🏭 P-S-T-Q-Q: Dig → Make → Serve → Think → Decide. By size (investment / turnover): Micro · Large above. By ownership: public, private, joint, cooperative. By use: consumer goods vs capital goods. Location factors: raw material · labour · market · transport/infrastructure · energy · capital · government policy · climate/environment (circular-economy push: co-locate near recycling centres, \"urban mining\") · social/cultural · technology (reshoring – robots replace cheap labour, plants return to high-income countries) · global factors (nearshoring, friend-shoring) · sustainability. ⚖️ Weber's weight rule: weight-losing (bulky raw material → light product, e.g., mining/ore) → sit at the raw material. Weight-gaining (product heavier/bulkier than inputs) → sit near the market. Footloose = weight does not matter. Isotim = equal transport cost line (rings round a source). Isodapane = equal total cost line (transport of inputs + outputs + labour); the best site lies on the lowest isodapane. World industrial regions (handout, one line each). N. America: NE USA (steel, autos), West Coast (tech, aerospace), South USA (oil, aerospace), Ontario–Quebec. Europe: Ruhr, Alsace-Lorraine, Benelux; UK Midlands; Poland–Czechia–Slovakia–Hungary. Asia: East Asia (China, Japan, S. Korea, Taiwan), South Asia (Maharashtra, Gujarat, TN, Karnataka), SE Asia (Singapore, Malaysia, Thailand, Indonesia). Africa: N. Africa, Gauteng & Western Cape, W. Africa (Nigeria, Ghana). Australia: east. S. America: Brazil (São Paulo–Rio–Minas Gerais), Argentina, Chile. Indian industrial regions (8). Region Industries Key cities Mumbai–Pune textiles, autos, chemicals, engineering, pharma, IT Mumbai, Pune, Thane, Nashik Kolkata–Hooghly jute, textiles, chemicals, engineering, iron & steel, paper Kolkata, Howrah, Durgapur, Haldia Delhi–NCR IT, electronics, autos, consumer goods Delhi, Gurugram, Noida, Faridabad Ahmedabad–Vadodara textiles, chemicals, pharma, petrochemicals Ahmedabad, Vadodara, Surat, Bharuch Chennai–Bengaluru autos, electronics, IT, heavy engineering Chennai, Bengaluru, Hosur, Coimbatore Kollam–Thiruvananthapuram cashew, coir, software, biotech Kollam, Thiruvananthapuram Chotanagpur iron & steel, coal, heavy engineering Jamshedpur, Ranchi, Bokaro, Dhanbad Visakhapatnam–Guntur shipbuilding, petrochemicals, fertiliser, steel Visakhapatnam, Guntur"}, {"c": 6, "n": "Economic Geography · quick", "id": "q-4-transport-and-communication", "t": "4 · Transport and communication", "x": "4.1 Roads Network > 63 lakh km (Jan 2025). NH = 2% (NHAI, MoRTH) · State highways = 4% (state PWDs) · District roads = 14% · rural roads (Gram Panchayats, PMGSY) · urban roads (municipalities). NH44 (earlier NH7) Srinagar–Kanyakumari – longest; NH48 (earlier NH8) Delhi–Mumbai. Since 1 April 2018 road length counts each lane separately. 🔢 NH numbers – start in the north-east corner and walk away. Even = North–South (numbers rise east → west: NH2 east, NH68 west). Odd = East–West (numbers rise north → south: NH1 north, NH87 south). Sub-highway = prefix: NH101 branches from NH01. (New scheme after 2010; the old 1956-Act numbers told you nothing about location.) 4.2 Railways > 68,000 km. Gauge Width Where Broad 1,676 mm most widely used; long-distance and freight Metre 1,000 mm rural; being converted (Unigauge, launched 1 April 1992) Narrow 762 mm or 610 mm hills; being phased out Standard 1,435 mm metro, monorail, tram 📏 Metre = 1,000 mm (name = number). Broad = the biggest, 1,676. Standard 1,435 = city metros. Indian Railways: state-owned, 19 zones (General Manager each), Ministry of Railways. DFCCIL runs dedicated freight corridors: Eastern DFC – Ludhiana (Punjab) → Dankuni (near Kolkata), ~1,839 km (coal, steel) · Western DFC – Dadri (UP) → JNPT (Mumbai), ~1,506 km. Future: East–West (Kolkata–Mumbai), North–South (Delhi–Chennai), East Coast (Kharagpur–Vijayawada), Southern (Chennai–Goa). Also suburban (Mumbai, Delhi), metro (DMRC, BMRCL), proposed Mumbai–Ahmedabad high-speed rail. 4.3 Pipelines, ropeways Pipelines (liquids and gases only; less flexible): Naharkatia–Noonmati–Barauni (crude) · Mumbai High–Mumbai–Ankleshwar–Koyali (crude + gas) · Salaya–Koyali–Mathura (crude; extended to Panipat, Jalandhar) · Hazira–Bijapur–Jagdishpur (GAIL) – largest underground pipeline in the world; extended to Delhi via Dadri. Also carry ores (slurry), water, local milk. Ropeways: first major passenger ropeway Auli, 1969; Parvatmala Scheme (Budget 2022-23, PPP, MoRTH; 8 projects ~60 km initially; Jan 2024: 400 projects, ₹1.25 lakh crore in 5 yrs); Varanasi urban ropeway; Gaurikund–Kedarnath (9.7 km, 3,584 m). 4.4 Water transport Why cheap? low friction → fuel efficient; no separate infrastructure except terminals. IWAI established 1986; National Waterway Act 1986; 111 notified inland waterways. Waterway Route Length NW-1 Ganga–Bhagirathi–Hooghly (Haldia–Allahabad/Prayagraj) 1,620 km NW-2 Brahmaputra (Dhubri–Sadiya) 891 km NW-3 West Coast Canal – Champakara – Udyogmandal 205 km NW-4 Krishna (Muktiyala–Vijayawada) 82 km NW-73 / NW-100 Narmada / Tapi 226 / 436 km NW-97 Sunderbans 172 km NW-10, 68, 83, 85, 91, 111 Amba 45 · Mandovi 41 · Rajpuri creek 31 · Revdanda–Kundalika 31 · Shastri–Jaigad 52 · Zuari 50 km Handout figure: the 13 national waterways in operation and their lengths. Ocean: ~95% of foreign trade by volume and 70% by value. 13 major ports + Vadhavan (14th, approved June 2024, ₹76,220 crore, Palghar). Newest major port: Galathea Bay (Great Nicobar) – transshipment. Managed by Port Trusts (Major Port Trusts Act 1963); minor ports by State Maritime Boards. ⚓ West coast, north → south: \"Kind Men Join Very Many New Clubs\" = Kandla (Deendayal) · Mumbai · JNPA (Nhava Sheva – leading container port) · Vadhavan · Mormugao (Goa, iron ore) · New Mangalore (only major port of Karnataka) · Cochin (Vallarpadam transshipment). East coast, south → north: \"Very Clever Kids Visit Pretty Kolkata\" = V.O. Chidambaranar (Tuticorin) · Chennai · Kamarajar (Ennore) · Visakhapatnam (natural harbour) · Paradip (bulk) · Kolkata–Haldia (Syama Prasad Mookerjee Port – only riverine major port, Hooghly). 4.5 Air and communication Air: first commercial flight 18 Feb 1911, Allahabad–Naini; govt took 49% of Tata-owned Air India 1948; nationalised 1953 (Indian Airlines domestic, Air India international); liberalised 1990s; Air India sold to Tata Group 2021 (handed over Jan 2022); >90% traffic with two companies (duopoly concern); 157 operational airports, 133 with AA"}, {"c": 6, "n": "Economic Geography · quick", "id": "q-5-recall-sheet", "t": "5 · Recall sheet", "x": "Kharif Jun–Oct (paddy, cotton, maize…) · Rabi Oct–Mar (wheat, gram, mustard) · Zaid Mar–Jun (melons). 75–115–120: dry 115/>120. Black soil + cotton; sugarcane = most water; bajra survives 42 °C; pulses fix nitrogen (766 vs 1,015 kg/ha). Revolutions: Green (Swaminathan), White (Kurien), Blue, Yellow; Round = potato; Silver fibre = cotton. Weber: weight-losing → raw material; weight-gaining → market. Isotim = transport cost; isodapane = total cost. Copper: Rajasthan 52.25 / MP 23.28 / Jharkhand 15.14. Diamond: Panna only. Mica: Jharkhand (Koderma). Thorium: Kerala, 25% of world. Indian coal: non-coking, high ash, low sulphur. Gondwana belts: Damodar–Mahanadi–Godavari–Son. Renewables 283.46 GW; solar 157→280 GW (2030); wind 56 GW; nuclear 8,180→22,480 MW. Gauges: 1,676 / 1,000 / 762–610 / 1,435. NH: even N–S, odd E–W. Ports: 13 major + Vadhavan; Galathea Bay newest; only riverine major port = Kolkata–Haldia (SPM)."}, {"c": 6, "n": "Economic Geography · quick", "id": "q-6-traps", "t": "6 · Traps", "x": "Wheat is Rabi (not Kharif) – 2013 PYQ. Groundnut, sesamum, bajra are rainfed. Palm oil is native to Guinea hills, not SE Asia (2021). Excess N → acidity + nitrate leaching, not more N-fixing microbes (2015). Chemical farming is hard in semi-arid regions (2020); permaculture mimics local conditions. Uranium for power needs ~5% enrichment, not 60% (2023). REE = 17 elements; China first, not India second. Mundra/JNPT, not Visakhapatnam, are container leaders; Kamarajar = Ennore (table) vs \"Tuticorin\" (PYQ text). Old NH numbers: NH4 → NH48; NH44 is the long north–south road; even = N–S, odd = E–W. Coal import reason = coking coal + short supply, not \"saving reserves\". Connects to: Indian Geography (soils/crops, Gondwana coal, rivers/waterways, ports) · Climatology (monsoon and crop seasons, Western Disturbances) · Human Geography (settlements and industrial regions)."}]</script><script>

  var ot=lsGet('nb-theme');if(ot&&!S.prefs.pt){S.prefs.theme=ot;S.prefs.pt=1}
  S.migrated=1;
}
function chap(nb,n){var b=S.nb[nb]||(S.nb[nb]={});return b[n]||(b[n]={read:{},done:0,dt:0,pos:null,t:0})}
var listeners=[],dirty=false,saveT=null,syncT=null;
function save(){
  dirty=true;clearTimeout(saveT);
  saveT=setTimeout(function(){lsSet(KEY,JSON.stringify(S));listeners.forEach(function(f){try{f()}catch(e){}});scheduleSync()},250);
}
function flush(){lsSet(KEY,JSON.stringify(S))}
function merge(a,b){ // a local, b remote; returns merged
  var o=fresh();
  o.prefs=((b.prefs&&b.prefs.pt||0)>(a.prefs&&a.prefs.pt||0))?Object.assign({},a.prefs,b.prefs):Object.assign({},b.prefs,a.prefs);
  o.last=(!a.last||(b.last&&b.last.ts>a.last.ts))?b.last:a.last;
  o.migrated=1;
  var ids={};Object.keys(a.nb||{}).concat(Object.keys(b.nb||{})).forEach(function(k){ids[k]=1});
  Object.keys(ids).forEach(function(id){
    o.nb[id]={};var ca=(a.nb||{})[id]||{},cb=(b.nb||{})[id]||{},ks={};
    Object.keys(ca).concat(Object.keys(cb)).forEach(function(k){ks[k]=1});
    Object.keys(ks).forEach(function(k){
      var x=ca[k],y=cb[k];if(!x||!y){o.nb[id][k]=x||y;return}
      var r=Object.assign({},x.read,y.read),done=(y.dt||0)>(x.dt||0)?y:x,pos=(y.t||0)>(x.t||0)?y.pos:x.pos;
      o.nb[id][k]={read:r,done:done.done,dt:done.dt||0,pos:pos,t:Math.max(x.t||0,y.t||0)};
    });
  });
  var dk={};Object.keys(a.days||{}).concat(Object.keys(b.days||{})).forEach(function(k){dk[k]=1});
  Object.keys(dk).forEach(function(k){o.days[k]=Math.max((a.days||{})[k]||0,(b.days||{})[k]||0)});
  return o;
}
var syncState='off';
function scheduleSync(){clearTimeout(syncT);syncT=setTimeout(function(){sync()},4000)}
var dbp=null;
function getRef(){
  if(dbp)return dbp;
  dbp=(async function(){
    if(!window.claude||!claude.use)return null;
    var db=await claude.use('db'),u=await claude.use('user');
    if(!db||!u||!u.id)return null;
    var id=await u.id();if(!id)return null;
    return db.doc('data/users/'+id+'/nbapp');
  })().catch(function(){return null});
  return dbp;
}
var busy=false;
async function sync(){
  if(busy)return;busy=true;
  try{
    var ref=await getRef();if(!ref){syncState='local';return}
    var snap=await ref.get(),rem=null;
    if(snap.exists){var d=snap.data();try{rem=JSON.parse(d.state)}catch(e){}}
    var m=rem?merge(S,rem):S;
    var changed=JSON.stringify(m)!==JSON.stringify(S);
    S=m;
    if(changed){flush();listeners.forEach(function(f){try{f()}catch(e){}})}
    var out=JSON.stringify(S);
    if(!rem||JSON.stringify(rem)!==out)await ref.set({v:1,updated:Date.now(),state:out});
    syncState='synced';
  }catch(e){syncState='local'}
  finally{busy=false}
}
var API={
  get:function(){return S},
  chap:chap,
  save:save,flush:flush,sync:sync,
  onChange:function(f){listeners.push(f)},
  syncState:function(){return syncState},
  setPref:function(k,v){S.prefs[k]=v;S.prefs.pt=Date.now();applyPrefs();save()},
  reset:function(){S=fresh();S.migrated=1;flush();save()},
  today:today,
  pct:function(nb,n,total){var c=(S.nb[nb]||{})[n];if(!c||!total)return 0;var r=0;Object.keys(c.read||{}).forEach(function(k){if(c.read[k])r++});return Math.min(1,r/total)},
  isDone:function(nb,n,total){var c=(S.nb[nb]||{})[n];if(!c)return false;if(c.dt)return !!c.done;return false}
};
window.NBS=API;
function applyPrefs(){
  var p=S.prefs;
  var th=p.theme;
  if(th==='auto')root.removeAttribute('data-theme');else root.setAttribute('data-theme',th);
  root.style.setProperty('--zoom',p.fs);root.style.setProperty('--lh',p.lh);root.style.setProperty('--pw',p.w+'px');
  root.setAttribute('data-font',p.font);
}
API.applyPrefs=applyPrefs;applyPrefs();
// studied time, counted while the page is visible and touched in the last minute
var lastAct=Date.now();
['scroll','pointerdown','keydown','touchstart'].forEach(function(e){addEventListener(e,function(){lastAct=Date.now()},{passive:true})});
setInterval(function(){
  if(document.hidden||Date.now()-lastAct>60000||!window.__NB)return;
  var t=today();S.days[t]=(S.days[t]||0)+15;save();
},15000);
document.addEventListener('visibilitychange',function(){if(document.hidden){flush();sync()}else{sync()}});
addEventListener('pagehide',flush);
setTimeout(sync,800);
})();
(function(){var b=document.getElementById('themebtn');if(!b)return;var o=['auto','light','sepia','dark'];b.addEventListener('click',function(){var t=NBS.get().prefs.theme,i=(o.indexOf(t)+1)%o.length;NBS.setPref('theme',o[i]);b.textContent='Theme: '+o[i]})})();
</script></body></html>
