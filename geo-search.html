aline) currents (density-driven; down-welling at poles, up-welling in tropics). Equatorial system: trade winds push water east → west (also Earth's eastward spin leaves water behind) → deflected by Coriolis into North and South Equatorial Currents → water piles up in the west → flows back east as the Equatorial Counter Current (3–10° N; between the two). PYQ 2015 (ans B): the counter-current flows east because of the convergence of the two equatorial currents (pile-up + gravity), not Earth's rotation directly. (Don't confuse with the Equatorial Undercurrent, deeper at ~200 m.) Circumpolar: Antarctic Circumpolar Current, West Wind Drift – isolate polar water. Gyre members: N. Atlantic – Gulf Stream, N. Atlantic Current, Canary, N. Equatorial; Sargasso Sea in its middle = the only sea without a coastline. S. Atlantic – Brazil, Benguela, S. Equatorial. N. Pacific – Kuroshio, N. Pacific, California. S. Pacific – East Australian, Peru, S. Equatorial. Indian – Agulhas, West Australian, S. Equatorial. PYQ 2021 (ans C, both right): in the tropics the west of an ocean is warmer (trade winds pile warm water west); in temperate zones the east is warmer (westerlies carry warm water to the east side). Factors: latitude, wind, Coriolis, gravity, temperature, salinity, continental margins. Ekman current: wind-driven; water moves ~45° to the right (N) / left (S) of the wind; layers form the Ekman spiral; causes coastal upwelling (nutrients, fisheries), heat redistribution, El Niño/La Niña links. Water masses = big bodies with distinct temperature/salinity/density from a source region → set habitat (warm clear = coral; cold nutrient-rich = kelp; deep = specialised life). AMOC (Atlantic Meridional Overturning Circulation): warm salty surface water flows north (Gulf Stream) → cools, sinks in the North Atlantic (NADW) → flows south at depth. Weaker than at any point in the past millennium (global warming; melting-ice freshwater disrupts sinking). If it weakens: cooler W. Europe, more extreme events, stronger east-coast US hurricanes, less CO₂ uptake, sea-level rise, fisheries shifts. Climate change on currents: weaker thermal and salinity gradients → thermohaline slowdown, less upwelling nutrients and less oxygen in downwelling zones, shifted winds, ice melting from below, biodiversity decline. Southern Ocean carbon anomaly: absorbs ~40% of the CO₂ taken up by oceans because glacial-melt freshwater forms a light lid that traps carbon-rich deep water below; a \"fleeting reprieve\" – if the lid weakens CO₂ could rush out. Marine heatwaves: prolonged unusually warm sea; episodes doubled since 1982; warming rate nearly doubled since 2005 (Copernicus); causes – climate change, high pressure, shifting currents, El Niño, feedback loops."}, {"c": 3, "n": "Oceanography · quick", "id": "q-4-tides-waves-tsunamis", "t": "4 · Tides, waves, tsunamis", "x": "🌗 Spring tide = SPrung Straight line (syzygy) – new & full moon, Sun-Moon-Earth aligned, highest highs and lowest lows, ~20% higher, twice a month. Neap = Nearly right-angle (quadrature) – quarter moons, forces oppose, lower highs, higher lows. Spring has nothing to do with the season. Cause (PYQ 2015, ans D): gravity of Moon (main) and Sun plus centrifugal force of Earth → bulges on the near and far sides. Most places: two highs + two lows a day (semi-diurnal); a place sees the same tide every 12 h 26 min (Moon takes 24 h 52 min to return). Diurnal tides: Gulf of Mexico, Gulf of Thailand. Tide height depends on: Sun-Moon-Earth distances, funnel-shaped bays/estuaries (amplify), local winds, pressure (low pressure raises sea level). Use: nutrient circulation, temperature moderation, flushing pollution. Tidal bore: wave moving up a narrow river on a high tide, absent at neaps; India – Hooghly; world's biggest – Qiantang (China). Climate change: higher sea level → larger areas tidal; may amplify ranges; threatens mangrove habitats. Waves carry energy, not water (particles move in circles); wind provides energy. Tsunami: very long seismic sea waves; causes – earthquakes at subduction zones (size ∝ vertical shift), volcanoes, landslides, meteorite impact, nuclear tests. 500–1,000 km/h in deep water, (invisible), slows and grows near the coast; many waves; warning – sea level change, odd ocean behaviour. Rogue waves: freak giants from constructive interference or currents/topography focusing energy (Agulhas Current). Seiche: standing wave sloshing in lake/bay (wind, pressure, quakes, resonance)."}, {"c": 3, "n": "Oceanography · quick", "id": "q-5-cryosphere-climate-change", "t": "5 · Cryosphere & climate change", "x": "Cryosphere = Earth's ice: 69% of freshwater; albedo; stores methane/CO₂; feeds rivers; affects circulation; GLOFs in Himalaya, Alps, Andes. Melting effects: thermohaline change, winds/jet streams, freshwater (short-term ↑, long-term ↓), lower albedo, GHG release, heavy elements and pathogens released, isostatic rebound and volcanic activity. Arctic: weaker polar vortex → cold spells in N. America/Europe; more temperate storms; new shipping routes (but thick ice drifting into the Northwest Passage); resource access; hundreds of Greenland lakes burst since 2008; trapped mercury leaking. Antarctica: jet-stream weakening; winter heatwaves (mid-July −25 to −30 °C instead of −50 to −60 °C); effects on wildlife and research. Oceans: acidification; SST rise 0.06 °C/decade (1980s) → 0.27 °C/decade now; circulation and nutrient changes."}, {"c": 3, "n": "Oceanography · quick", "id": "q-6-coral-reefs", "t": "6 · Coral reefs", "x": "🪸 Corals are fussy beach tourists – \"Warm, Clear, Shallow, Salt-stable, Light-snack, Mild-waves\": 20–29 °C · clear sunlit water (for zooxanthellae algae) · deep · salinity 32–40 ppt · low nutrients (oligotrophic – runoff feeds algae that choke them) · moderate waves. Reef types: Fringing = Friend hugs the shore (boat channels) · Barrier = Bodyguard stands off, lagoon between · Atoll = Wedding ring around a lagoon (sinking volcanic island/seamount). Kinds: hard (stony, reef-builders; Acropora, Porites) · soft (octocorals, sea fans) · cold-water (deep, polar/temperate) · black corals (30–300+ m; found in Gulf of Mannar). Reefs = \"rainforests of the sea\"; corals secrete calcium carbonate. Bleaching = corals expel zooxanthellae (white/pale; may recover or die). Causes: heat, acidification, pollution, UV, tectonic exposure/drowning, overfishing (fish keep reefs clean), disease, tourism. 4th mass bleaching ongoing since early 2023 (handout says Jan 2023 once and Feb 2023 once). Climate impacts: bleaching, acidification (harder to build skeletons), stronger storms. India: bleaching in Gulf of Mannar and Andamans; Lakshadweep, March 2024."}, {"c": 3, "n": "Oceanography · quick", "id": "q-7-deposits-dead-zones-resources-law", "t": "7 · Deposits, dead zones, resources, law", "x": "🔠 Four deposit types – \"Land, Life, Liquid, Cosmos\": Terrigenous (from land: rivers, glaciers, wind; on margins) · Biogenous (organisms) – calcareous ooze (CaCO₃; warmer, shallower), siliceous ooze (diatoms, radiolarians; colder, deeper) · Hydrogenous (chemical: manganese nodules, phosphorite) · Cosmogenous (meteorite dust). Dead zones (hypoxic): nutrient pollution (N, P: farm runoff, sewage, industry, even wind-blown dust – Madagascar bloom) → algal bloom → dies → bacteria use up oxygen. Effects: marine life suffocates, fisheries/tourism lose, toxins. Examples: northern Gulf of Mexico (Mississippi runoff), Baltic Sea, Black Sea (natural, poor circulation). Fix: cut nutrient pollution, treat sewage, monitor, awareness. Resources: Biotic – fish (tuna, salmon – Pacific; cod – N. Atlantic; sardines – Mediterranean, Peru), shellfish, seaweed (Japan nori), marine pharma, pearls. Abiotic – offshore oil and gas (North Sea, Gulf of Mexico, Persian Gulf), tidal/OTEC/wave/offshore wind, dissolved salts (NaCl), manganese nodules (a source of \"dark oxygen\"), phosphorite (Morocco, Peru, USA). Services: oceans absorb ~90% of excess heat and 25–30% of human CO₂ (blue carbon: mangroves, seagrass); phytoplankton make 50–60% of Earth's oxygen. ⚓ UNCLOS 1982 – \"12 – 24 – 200\": Territorial sea 12 nm (22.2 km) · Contiguous zone 24 nm (44.4 km; customs, fiscal, immigration, sanitary laws) · EEZ 200 nm (370.4 km; sovereign rights over resources) · High seas beyond (freedom of navigation, overflight, fishing, research). Think: a dozen → a day → a double century. PYQ 2013 (ans C) – fishing grounds: best where warm and cold currents meet (plankton mixing; e.g. Newfoundland banks, Sea of Japan). Other helpers: coastal upwelling, indented coasts, nearby forests for boats, rugged land that pushes people to fishing, temperate water below 20 °C."}, {"c": 3, "n": "Oceanography · quick", "id": "q-8-recall-sheet-oceanography", "t": "8 · Recall sheet – Oceanography", "x": "Q A Ocean average depth 3,800 m Shelf / slope gradient 1–2° / 3–6° Trench depth > 6,000 m (Mariana) Equatorial vs 45° mean temperature 26.7 / 12.7 °C Saltiest water bodies listed Lake Van 330 > Dead Sea 240 > Great Salt Lake 220 Ocean pH now 8.04 (2024) Warm boundary currents lie on which side? Western edges Only sea with no coastline Sargasso Sea Why counter-current flows east Convergence/pile-up of the two equatorial currents Tide repeats after 12 h 26 min Spring tide happens at New & full moon (syzygy) Tidal bore in India Hooghly Tsunami speed in deep ocean 500–1,000 km/h Coral temperature / depth / salinity 20–29 °C / UNCLOS zones 12 · 24 · 200 nm Share of Earth's oxygen from phytoplankton 50–60% Traps: \"Spring tide = in spring\" ✘ · \"Counter-current is due to Earth's rotation\" ✘ · \"Salinity is highest at the equator\" ✘ · \"Density is driven more by salinity\" ✘ (temperature) · \"Tsunamis are tall in deep ocean\" ✘ · \"Rivers/lakes hold most freshwater after ice\" ✘ (groundwater) · \"Atolls form on continents\" ✘ (sinking volcanic islands). Connects to: Trenches, guyots, hotspots → Geomorphology; Coriolis, trade winds, westerlies, cyclones, El Niño-type warming → Climatology/Indian climate; Ocean resources, ports, fisheries → Economic Geography; Palk Strait, Chilika, Gulf of Kutch, Cape Comorin → Indian Geography."}, {"c": 4, "n": "Indian Geography", "id": "s0", "t": "LOCATION OF INDIA", "x": "With an area of 32,87,263 km2 , India is the seventh largest country in the world. India accounts for about 2.4 percent of the total surface area of the world . North-south extent of the mainland, from Indira Col in Kashmir to Kanyakumari is 3,214 km . East-west width from the Rann of Kutch to Arunachal Pradesh is 2,933 km . The southernmost point of the country is the Pygmalion Point, or Indira Point is located at 6° 45' N latitude. Entirely Northern Hemisphere. 8° 4′N (6° 45′ for islands) and 37°6′N latitudes; and 68° 7′E and 97° 25′E longitudes. Standard Meridian 82° 30′ E passes through 5 states (U C My Old Aunt) UP, CG, MP, Odisha, Andhra Pradesh. East-West time difference is nearly 2 hrs . (A difference of 1° longitude will make a difference of 4 minutes in time. ~30 x 4 = ~120 minutes or ~2 hours) Chai Bagan time : Introduced by the British to increase productivity in NE India. 1 hour ahead of IST. The Tropic of Cancer passes through the middle of the country dividing it into two latitudinal halves. The area to the north of the Tropic of Cancer is nearly twice the area that lies to the south of it. Tropic of Cancer states: Gujarat, Rajasthan, M.P., CG, Jharkhand, West Bengal, Tripura, Mizoram."}, {"c": 4, "n": "Indian Geography", "id": "s1", "t": "INDIA AND ITS NEIGHBOURS", "x": "India has 15106.7 Km of land border running through 17 States. India has a coastline of 11,098 km , touching 13 States and Union Territories (UTs). Barring Telangana, Madhya Pradesh, Chhattisgarh, Jharkhand, Delhi, Chandigarh, and Haryana , all other States in the country have one or more international borders or a coastline and can be regarded as frontline States from the point of view of border management. India’s neighbours include (clockwise): Pakistan, Afghanistan, China, Nepal, Bhutan, Bangladesh, Myanmar, Sri Lanka, Maldives, and Indonesia. India's longest border is with Bangladesh while the shortest border is with Afghanistan (Wakhan Border) . States/UTs sharing a border with each land neighbor: Pakistan : Shares borders with Jammu and Kashmir, Ladakh, Punjab, Rajasthan and Gujarat. Afghanistan: Ladakh China : Shares borders with Ladakh, Himachal Pradesh, Uttarakhand, Sikkim, and Arunachal Pradesh. Nepal : Shares borders with Uttar Pradesh, Uttarakhand, Bihar, Sikkim, and West Bengal. Bhutan : Shares a border with Assam, Sikkim, Arunachal Pradesh, and West Bengal. Bangladesh : Shares borders with West Bengal, Assam, Meghalaya, Mizoram, and Tripura. Myanmar : Shares borders with Arunachal Pradesh, Nagaland, Manipur, and Mizoram."}, {"c": 4, "n": "Indian Geography", "id": "s4", "t": "The Northern and Northeastern Mountains", "x": "The Northern Plains The Indian Desert Peninsular Plateau Coastal Plains The Islands THE NORTHERN AND NORTH-EASTERN MOUNTAINS: Origin: Convergence of Indian and Eurasian Plates. The Sediments of the Tethys sea got folded, forming the Himalayas. They include the Trans-Himalayas (Karakoram, Ladakh & Zaskar ranges), Himadri, Himachal, and Shivaliks, and the Purvanchals . Created due to the convergence of the Indian and Eurasian Plates. (Closing of the Tethys Sea). Multiple episodes of upliftment have given rise to parallel ranges . About the Mountains: 2500 km spread ; Width varies , with 500 km width in Kashmir and 200 km width in Arunachal. The main Himalayas extend from Nanga Parbat peak (Indus Gorge) in Ladakh to Namche Barwa peak (Brahmaputra Gorge) in Arunachal Pradesh (syntaxial bends). Post that, the Purvanchals are present. Syntaxial Bends are knee joint bends. Spread across 13 Indian States/Union Territories (namely Jammu and Kashmir, Ladakh, Uttarakhand, Himachal Pradesh, Arunachal Pradesh, Manipur, Meghalaya, Mizoram, Nagaland, Sikkim, Tripura, Assam and West Bengal) Steep gradient to South; Gentler in North. (hogback topography) Ridge valley topography. Great Himalayas: Himadri, inner Himalayas, Central Himalayas. Avg. height: 6100 m ; Tallest peaks Middle Himalayas : Himachals, Lesser Himalayas Avg. height: 3500-4500 m Pir Panjal, Dhaula Dhar (southernmost Himachal range), Kumaon & Mussoorie, Mahabharata ranges. Karewas (present between Pir Panjal & Zaskar ): These formations consist of layers of clay, silt, sand, and gravel, deposited by ancient rivers and lakes during the Pleistocene epoch. They are famous for the growth of Zafran (the best quality saffron in the world), walnuts, and almonds. Bugyals : They are high-altitude grasslands in the Himachals , known for their lush greenery, colourful flowers, and grazing pastures. The transhumance activity takes place here , which is the seasonal movement of herders and their livestock between different elevations in search of grazing pastures. During the summer months, herders from lower valleys bring their livestock, such as sheep, goats, and cattle, to graze on the lush grasslands of bugyals situated at higher altitudes. These bugyals provide abundant fodder and grazing opportunities during the warmer months when lower elevations may experience heat and scarcity of forage. In the winter, as bugyals become snow-covered and inaccessible, herders return with their livestock to lower elevations where they can ﬁnd shelter and fodder. Important tribes involved in this: Bakarwals, Gaddis, Bhotiyas and Drokpas. Outer Himalayas: Shivaliks Almost unbroken from Himachal to Arunachal except a gap of 80-90km occupied by Teesta valley. Jammu Hills (Jammu), Dafla, Miri, Abor (Arunachal); Dhang and Dudhwa in Uttarakhand; Churia Ghat in Nepal Duars: Location: Foothills of the Eastern Himalayas (Himachals) in Northeast India (Assam, Arunachal Pradesh etc.) Floodplains in foothills (North of Brahmaputra valley) with dense vegetation and wildlife habitats. Soil: Alluvial soil, fertile and good for agriculture. Duns : (Sometimes Doons) Location: Valleys between the Shivalik Hills and the Himachals in Wastern Himalayas (Himachal Pradesh, Uttarakhand, etc.) Longitudinal valleys with rivers and fertile lands. Examples: Dehradun, Patli Dun, Kota Dun, etc. Chos: Location: Foothills of the Shivalik Hills in the north-western part of Punjab , India. Seasonal streams or rivers found primarily in the foothills of the Shivalik (Siwalik) range. Sandy riverbeds are characteristic. Alternate names: Choes/Raos. Soil: These regions are less fertile compared to Duars , may require irrigation for agriculture. Trans Himalayas: Refers to the northernmost part of the Himalayan range , located beyond the main Himalayan range. Comprises rugged and high-altitude terrain with stark landscapes, characterized by barren plateaus, deep valleys, and towering peaks. They have high altitudes with a cold, dry climate. V"}, {"c": 4, "n": "Indian Geography", "id": "s5", "t": "Regional Division of Himalayas:", "x": "Kashmir/Punjab/Himachal Himalayas (Westernmost Section): Location: Stretches from the Indus River in the west to the Sutlej River in the east . Mountain Ranges: Himadri, Himachal and Shivaliks. Also, Trans-Himalayas. Peaks: Nanga Parbat (8,126 m), K2 (8,611 m - part of the peak lies in Pakistan), Dhaulagiri I (8,167 m) Valleys: Kashmir Valley, Kullu Valley, Kangra Valley Rivers: Indus River, Jhelum River, Chenab River, Ravi River, Beas River, Sutlej River Signiﬁcance: This section is known for its scenic beauty, and diverse landscapes with valleys, meadows, and glaciers. It's also a region of cultural and historical signiﬁcance, with Kashmir Valley being a major tourist destination. Kumaon Himalayas (Central Section): Location: Lies between the Sutlej River in the west and the Kali River (eastern border with Nepal) in the east. Mountain Ranges: Himadri, Kumaon Himalayas (Himachal), Shivaliks Peaks: Nanda Devi (7,816 m - highest mountain entirely within India), Nanda Kot (7,818 m), Trishul (7,120 m) Valleys: Valley of Flowers National Park Rivers: Sutlej River, Yamuna River, Ganges River (originates from glaciers in this region) Signiﬁcance: This section is known for its high peaks, including Nanda Devi, and for housing pilgrimage sites like the source of the Ganges River. The Valley of Flowers National Park is a UNESCO World Heritage Site known for its vibrant alpine meadows. Nepal Himalayas (Eastern Section): Location: Encompasses the central part of the Himalayas, stretching from the Kali River in the west to the Teesta River (eastern border with Bhutan) in the east. Mountain Ranges: Himadri, Himachal and Shivaliks Peaks: Mount Everest (8,848 m - highest peak in the world), Kanchenjunga (8,586 m - third highest peak in the world), Lhotse (8,516 m), Annapurna I (8,091 m) Valleys: Kathmandu Valley Rivers: Karnali River, Gandaki River, Kosi River Signiﬁcance: This section boasts the highest peaks in the Himalayas, including Everest. It's a major center for mountaineering expeditions and adventure tourism. Nepal is a landlocked country, and the Himalayas play a vital role in its geography and culture. Assam Himalayas (Easternmost Section): Location: Lies east of the Teesta River and extends into Bhutan, till Arunachal Pradesh and Purvanchals in India. Mountain Ranges: Himadri, Himachal and Purvanchals. Peaks: Namche Barwa (7,756 m) Valleys: Manas National Park Rivers: Teesta River, Brahmaputra River Signiﬁcance: This section is known for its lush green valleys, diverse ecosystems, and abundant rainfall. Manas National Park is a UNESCO World Heritage Site known for its rich biodiversity."}, {"c": 4, "n": "Indian Geography", "id": "s6", "t": "NORTHERN PLAINS", "x": "Great depression to the South of the Himalayas was ﬁlled with alluvial deposits from Indus, Brahmaputra, and Ganga , leading to the creation of these plains. Expanse: 3200 km West to East. The Northern Plains are one of the most densely populated regions in the world, supporting a signiﬁcant portion of India's agriculture. The rivers provide water for irrigation, transportation, and hydropower. The region is rich in history and culture, with major cities like Delhi, Varanasi, and Patna located here. The plains are generally flat with a slight slope from north to south. The climate varies from semi-arid in the west to humid subtropical in the east. The region faces challenges like soil erosion, water pollution, and depletion of groundwater resources. Terminologies associated with these Plains : Bhabher : Alluvial cone deposits at the foothill region, where the rivers go underground, after the steep change of gradient, from the mountains to the plains. Terai : Swampy region after the Bhabher region, where the rivers re-emerge. Bhangar : Coarser, older alluvium found in the floodplain region farther away from the river channel. It is less fertile than the newer alluvium. It consists of certain congregations of grains, known as Kanker particles. Khadar : The newer alluvium, found in the nearby floodplain regions of the rivers. They are renewed almost every year. That is why, they are extremely fertile. Reh/Kallar : Barren saline drier areas found in UP, Haryana. They are extending beyond their natural zone due to bad agricultural practices, like excessive irrigation. Bhur: an elevated piece of land along the Ganga. Esp in Ganga Yamuna doab. Bagar: Semi-arid plain starting from the foothills of Aravallis, in Rajasthan. Rohi: patches of fertile land in the Bagar Doab : Land between 2 rivers. Examples: Bari, Bist, Rechna, Chaj Betlands : Khadar plains of Punjab Includes Rajasthan plains, Punjab Haryana plains, Ganga plains, Brahmaputra plains. Rajasthan Plains: Location: Westernmost part of the Northern Plains, including the Rajasthan bagar, which extends into the Thar Desert. Characteristics: Semi-arid climate, saline lakes due to high evaporation Punjab Haryana Plains: Location: West-central part, bordering the Indus River in the west and the Yamuna River in the east . Bari and Bist doab . Characteristics: Fertile land, ideal for agriculture (wheat, rice, cotton), network of canals for irrigation. Ganga Plains: Location: The most extensive part, stretching from Yamuna River eastwards to Bangladesh. Parts: Rohilkhand, Awadh, Mithila, Magadha and Bengal plains . Characteristics: Highly fertile land due to Ganga-Yamuna Doab, densely populated, diverse agriculture (wheat, rice, sugarcane, pulses), home to the Ganges River Delta. Brahmaputra Plains: Location: Easternmost part , bordering Bangladesh. Characteristics: Riverine islands (Point bars), also called chars , prone to flooding, lush green due to high rainfall, Brahmaputra River Delta Sundarbans. These plains, in the foothills, are also known for known for tea plantations."}, {"c": 4, "n": "Indian Geography", "id": "s7", "t": "THE INDIAN DESERT: THAR", "x": "The Thar Desert, also known as the Great Indian Desert, is a vast arid region straddling the northwestern part of the Indian subcontinent. Created due to a combination of the Sub-Tropical High Pressure belt, and this location being in the rainshadow zone of the Aravallis. It is often considered an extension of the Rajasthan Plains . Covers an area of approximately 200,000 square kilometers . About 85% of the desert lies in India, with the remaining 15% in Pakistan. In India, it spreads across parts of Rajasthan, Gujarat, Punjab, and Haryana . Bordered by the irrigated Indus River plain to the west. The Punjab Plain flanks it to the north and northeast. The Aravalli Range acts as a barrier to the southeast. The Rann of Kutch lies to the south. Locally, it is called Marusthali. The desert landscape is dominated by: Sand dunes : These are constantly shifting due to wind action, with some reaching heights of over 150 meters (500 ft). Sandy plains : These plains separate the dune ﬁelds. Here the Indira Gandhi Canal Project has provided the irrigational facilities, providing people with a source of employment. Low barren hills : Locally known as bhakars , these rise abruptly from the surrounding plains. The landscape is punctuated by intermittent rivers, seasonal streams (known as \"Rivulets\"), and saline lakes (such as the Sambhar Lake, Didwana, etc.). The Thar Desert acts as a natural border between India and Pakistan. It's a source of salt, limestone, and gypsum."}, {"c": 4, "n": "Indian Geography", "id": "s8", "t": "PENINSULAR PLATEAU OF INDIA", "x": "It is the oldest and the largest physiographic feature of India. It is in the shape of an irregular triangle . An ancient landmass formed by the breakup of Gondwanaland. Due to its age, it is rich in many metallic minerals . The Deccan Traps are a part of the Peninsular Plateau. The Meghalaya Plateau part of this , which was separated from it during the Indian plate’s movement North into the Eurasian plate. Separation by Rajmahal-Garo Gap/Malda Gap/Ganga Suture Zone. Divided into the Central Highlands and the Deccan Plateau , separated by the Narmada Rift."}, {"c": 4, "n": "Indian Geography", "id": "s9", "t": "Parts of the Peninsular Plateau:", "x": "Mewar/Marwar Uplands: Location: Northwestern part of the Plateau, in Rajasthan, near Aravallis. Characteristics: Arid and semi-arid climate with scarce rainfall, supports scrub vegetation and hardy desert plants. The Thar Desert borders its western flank. Malwa Plateau: Location: From Aravallis in NE, to Bundelkhand Plateau in East and Vindhyas in South. Contain Chambal Badlands. Characteristics: Known for its fertile black soil (regur), ideal for cotton cultivation. The network of rivers like Narmada and Chambal provides water resources for agriculture.vegetation. Bundelkhand Uplands: Location: Between the Vindhya Range and the Ganga Plains, East of Malwa Plateau, covering parts of Madhya Pradesh and Uttar Pradesh. Characteristics: Rugged terrain with a mix of hills, valleys, and plateaus. The climate supports mixed deciduous forests with trees like sal, teak, and kheria. Baghelkhand: Location: Northern part of the Deccan Plateau, in Madhya Pradesh and Chhattisgarh. Characteristics: Hilly terrain with dense forests of sal, teak, and bamboo. The region is rich in mineral resources, particularly coal. Eastern Highlands: Chotanagpur Plateau: (Comprises Hazaribagh Plateau, Ranchi Plateau, Rajmahal Hills) Location: Eastern India, covering parts of Jharkhand, Chhattisgarh, Odisha, and West Bengal. Characteristics: Rolling hills with a network of rivers. Dense forests with sal trees dominate the landscape. The region is known for its mineral wealth, including coal and mica. North-Eastern Tip: Meghalaya (Garo, Khasi, Jaintia, Mikir and Rengma Hills): Location: Northeastern tip of the plateau, bordering Bangladesh, in Meghalaya and Assam. Characteristics: Home to Mawsynram, the wettest place on Earth. The region receives heavy rainfall, supporting lush green forests with diverse flora and fauna. The region is known for its unique tribal cultures. Deccan Plateau: Location: Largest and central part of the Peninsular Plateau, covering Chattisgarh, Maharashtra, Karnataka, Telangana, and Andhra Pradesh. It's called Regur in Maharashtra and Malnads in Karnataka. Include the Deccan Traps. Characteristics: A vast, relatively flat tableland with an average elevation of 600 meters. The landscape varies from forests and grasslands to rocky outcrops. The Deccan Traps, lava formations from volcanic eruptions millions of years ago, are a distinctive feature. Chhattisgarh Plateau & Plains: Location: Eastern part of the Deccan Plateau, in Chhattisgarh. Includes the Dandkarnya and Bastar Plateaus. Also has fertile plains formed by the Mahanadi River and its tributaries. The fertile soil supports rice cultivation, making it a vital agricultural region. Important Hills Ranges: Aravalli (relict of world’s oldest mountains; Its northeast edge is Delhi Ridge; highest pt is Guru Shikhar). Across Gujarat, Rajasthan, Haryana, and Delhi. Vindhyas (Jobat in Gujarat to Sasaram in Bihar; eastwards extend as Bharner & Kaimur). Across Gujarat, MP, UP, Chhattisgarh, Bihar. Satpuras (higher than Vindhyas; Its sub ranges include Rajpipla, Mahadev, and Maikala Ranges; Dhupgarh is its highest peak). Across Gujarat, Maharashtra, MP, and Chhattisgarh. Western Ghats: Location: Along the western coast of India, running parallel to the Arabian Sea. Also known as Sahyadris. Its parts include Satmala, Harishchandra, Balaghat, Ajanta, Baba Budan, Nilgiri, Annamalai, Cardamom, Palani hills. Important gaps include Thalghat (aka Kasara ghat; Mumbai-Nasik Highway), Bhorghat (Mumbai-Pune highway), Chorla Ghat (Goa), Palghat (Palakkad) & Shenkotta gaps (Gateway of monsoon to Tamil Nadu). Tallest peak Anaimudi States: Gujarat, Maharashtra, Goa, Karnataka, Kerala, Tamil Nadu. Characteristics: The mountain range acts as a barrier, causing heavy rainfall on the windward side due to the southwest monsoon. The region is known for its lush green forests, rich biodiversity, and numerous waterfalls. It's a source of several major rivers flowing eastward, and many minor west flowing rivers. So"}, {"c": 4, "n": "Indian Geography", "id": "s11", "t": "Western Coastal Plains:", "x": "It is a mixed shoreline , including shorelines of emergence, submergence, and also stable shoreline. Kachchh Peninsula : shoreline of emergence due to tectonic and depositional reasons, that has led to the creation of the salty marshes i.e. the Rann of Kachchh; It has the Banas and the Luni rivers, which undergo inland drainage. Banni Grasslands , one of the largest grasslands of india are here. Kathiawar Plains : South of Kuchchh, includes Kathiawad (Saurashtra) region. It has the Deccan Trap lava black soil ; It is also known for the Gir Range which is the only existing habitat of the Asiatic Lions. Rivers Narmada and Tapi form estuaries here. Konkan Plain : From Daman to Goa ; It is a shoreline of submergence , and that is why the continental shelf here is wider, and it consists of many sea cliffs, where features of Marine Erosion are very evident. Karnataka Plain : From Goa to Mangalore ; It is also a shoreline of submergence . Malabar Coast : It is the stable part (emerging due to deposition) of the Western Coast; It goes from Mangalore to Kanyakumari; Due to Marine deposits, it has many lakes, lagoons, and backwaters called Kayals ."}, {"c": 4, "n": "Indian Geography", "id": "s12", "t": "Eastern Coastal Plains:", "x": "Extend from Subarnarekha river to Kanyakumari . They include alluvial deposits of major rivers . It is a shoreline of emergence , due to deposition by multiple long rivers that flow into the Bay of Bengal. 2 major parts include Northern Circars (Mahanadi to Krishna) & Coromandel Coast (South of Krishna) Regionally divided into: Utkal Plain : Odisha; includes the biggest lake of India Chilika Andhra Plain : located from the south of Utkal, till the Pulicat Lake; Important geographic features include the Kolleru Lake, which was once a lagoon, and is now in an inland location due to coastal deposition; the fertile Krishna Godavari delta. Tamil Nadu Plain : Extends from the Pilucat lake to Kanyakumari. Eastern and Western coastal plains meet at Kanyakumari ."}, {"c": 4, "n": "Indian Geography", "id": "s14", "t": "Andaman & Nicobar Islands", "x": "An archipelago of over 500 islands, stretching from 6° to 13° North latitude and 92° to 93° East longitude in the Bay of Bengal. Emerged due to the collision of tectonic plates millions of years ago. They are an extension of the Burmese mountain range Arakan Yoma , including a few volcanic islands as well. The highest peak is the Saddle Peak , located in the Andaman Islands. The Andaman and the Nicobar Islands are separated from each other by the 10-degree channel. Great Nicobar separated from Sumatra via 6-degree channel. Barren Island in the Andaman Islands is the only active lava volcano in South Asia , while Narcondam Island is an extinct volcano. (Indian plate under Burmese plate) Baratang Island: India’s only active mud volcano. Havelock Island, also known as Swaraj Dweep , is the largest island of this group."}, {"c": 4, "n": "Indian Geography", "id": "s15", "t": "Lakshadweep Islands:", "x": "It is a coral archipelago of 36 islands and coral reefs , situated about 400 km off the coast of Kerala in the Arabian Sea. Emerged as coral atolls on top of submerged volcanic features (Lakshdweep-Chagos Ridge) millions of years ago. The islands are low-lying and sandy, with no rivers or permanent freshwater sources. Landforms: Flat and sandy islands with surrounding coral reefs. Andrott Island is the largest one. Maliku Atoll (Minicoy Island), the Southernmost of this group, is separated from the rest of the islands of Lakshadweep by the 9-degree channel."}, {"c": 4, "n": "Indian Geography", "id": "s16", "t": "PYQ", "x": "Q1.) When you travel to the Himalayas, you will see the following : Deep gorges U-turn river courses Parallel mountain ranges Steep gradients causing land-sliding Which of the above can be said to be the evidence for the Himalayas being young fold mountains? (2012) 1. 1 and 2 only 2. 1, 2 and 4 only 3. 3 and 4 only 4. 1, 2, 3 and 4 Answer: D The Himalayas are known as the young fold mountains because they were formed only a few million years ago. They were formed because of the folding of the earth's crust due to tectonic activities. Gorge is a deep cleft resulting from weathering and the erosive activity of a river over geologic timescales. These deep gorges are irregular and don't have steep slopes which shows that these are formed recently. It shows that the Himalayas are young folded mountains. Similarly, other features like U-turn river courses, Parallel mountain ranges, Steep gradients causing landslides etc can be seen generally in young folded mountains only. These all features constitute that the Himalayas are young folded mountains. The old folded mountain is lower than a young folded mountain. The Himalayas have the highest mountain ranges in the world which show that the Himalayas are young folded mountains. Q2.) Consider these pairs - Cardamom Hills Coromandel Coast Kaimur Hills Konkan Coast Mahadeo Hills Central India Mikir Hills North-East India Which of the above pairs are correctly matched? (2014) 1. 1 and 2 only 2. 2 and 3 only 3. 3 and 4 only 4. 2 and 4 only Answer: C Kaimur Range is the eastern portion of the Vindhya Range, about 483 kilometres (300 mi) long, extending from around Katangi in Jabalpur district of Madhya Pradesh to around Sasaram in Rohtas district of Bihar. It passes through the Rewa and Mirzapur divisions. The Cardamom Hills or Yela Mala are a mountain range of southern India and part of the southern Western Ghats located in southeast Kerala and southwest Tamil Nadu in India. Their name comes from the cardamom spice grown in much of the hills' cool elevation, which also supports pepper and coffee. The Western Ghats and Periyar Sub-Cluster including the Cardamom Hills, are UNESCO World Heritage Sites. Q3.) Which one of the following pairs of islands are separated from each other by the ‘Ten Degree Channel’? (2014) (a) Andaman and Nicobar (b) Nicobar and Sumatra (c) Maldives and Lakshadweep (d) Sumatra and Java Answer: A This is a map based question, please refer to map. Q4.) Which of the following pairs of States of India indicates the easternmost and Westernmost State? (2015) (a) Assam and Rajasthan (b) Arunachal Pradesh and Rajasthan (c) Assam and Gujarat (d) Arunachal Pradesh and Gujarat Answer: D Go through the Map Q5.) Consider the following pairs: Famous place Region Bodhgaya - Baghelkhand Khajuraho - Bundelkhand Shirdi: - Vidarbha Nasik (Nashik) - Malwa Tirupati - Rayalaseema Which of the pairs given above are correctly matched? (2016) 1. 1, 2 and 4 2. 2, 3, 4 and 5 3. 2 and 5 only 4. 1, 3, 4 and 5 Answer: C Malwa region includes districts of Western Madhya Pradesh and parts of South-Eastern Rajasthan. Baghelkhand covers the North-Eastern regions of Madhya Pradesh and a small area of Western Uttar Pradesh. Vidarbha is the Eastern region of the Indian State of Maharashtra, comprising Nagpur division and Amravati division. Q6.) If you travel by road from Kohima to Kottayam, what is the minimum number of States within India through which you can travel, including the origin and the destination? (2017) 6 7 8 9 Answer: B States – Kerala, Tamil Nadu, Andhra Pradesh, Odisha, West Bengal, Assam, Nagaland Q7.) Consider the following statements: 1. In India, the Himalayas are spread over ﬁve States only. 2. The Western Ghats are spread over ﬁve States only. 3. Pulicat Lake is spread over two States only. Which of the statements given above is/are correct? (2017) (a) 1 and 2 only (b) 3 only (c) 2 and 3 only (d) 1 and 3 only Answer: B In India, the Himalayas are spread over more than 5 states. Th"}, {"c": 4, "n": "Indian Geography", "id": "s18", "t": "Factors Governing Drainage Of A Location", "x": "Topography: Slope and Relief: Steeper slopes and higher relief lead to faster drainage. Water flows rapidly downhill, creating well-deﬁned channels and rivers. (Example: The Himalayas with their steep slopes have fast-flowing rivers like the Indus and Brahmaputra) Nature of Rocks: Permeability : Permeable rocks like sandstone allow water to seep through, reducing surface runoff and contributing to groundwater recharge. (Example: The Deccan Plateau with its basalt rocks has low permeability, leading to seasonal streams and some areas with poor drainage). Impermeable rocks like granite don't allow water to pass through, resulting in higher surface runoff and potentially flash floods. (Example: The Aravalli Range with its granitic rocks has a limited capacity for water inﬁltration, leading to seasonal rivers) Amount of Water: Rainfall : Areas with high rainfall will naturally have more water to drain. Heavy precipitation can overwhelm drainage systems, leading to flooding. (Example: The Western Ghats receive heavy rainfall, leading to numerous perennial rivers) Snowfall: Melting snow in mountainous regions contributes signiﬁcantly to river flow, impacting seasonal drainage patterns. (Example: The Himalayan rivers like the Ganga and Yamuna experience increased flow during the spring thaw) Periodicity of Flow: Perennial Rivers: These rivers flow continuously throughout the year, fed by constant sources like glaciers, springs, or consistent rainfall. (Example: The major rivers of India like the Ganga, Brahmaputra, and Indus are perennial) Seasonal Rivers: These rivers flow only during speciﬁc seasons, typically during the rainy season. (Example: Many rivers in the Deccan Plateau are seasonal, flowing only during the monsoon months) Geological Time: Long-term processes like tectonic activity, erosion, and deposition can shape the landscape and influence drainage patterns. (Example: The uplift of the Himalayas millions of years ago created the current drainage pattern of major rivers flowing southwards) Anthropogenic Activities: Deforestation : Cutting down trees reduces water inﬁltration and increases surface runoff, leading to flash floods and soil erosion. Urbanization : Paving over land with concrete reduces natural drainage and increases the burden on storm drains. (Example: Rapid urbanization in Indian cities like Delhi and Mumbai has placed stress on drainage systems during heavy rainfall) Dams and Reservoirs : These structures can regulate water flow, reduce flooding, and provide irrigation water, but can also disrupt natural drainage patterns and ecosystems downstream. (Example: The Bhakra Nangal Dam on the Sutlej River in Punjab helps control floods and provides water for irrigation)"}, {"c": 4, "n": "Indian Geography", "id": "s19", "t": "Terminologies Related To Drainage:", "x": "A catchment region (also called a drainage basin or watershed) is the entire land area that drains water to a single point , like a river mouth or lake. A drainage divide (also called a water divide or watershed divide) is the elevated landform that separates different catchment regions , determining which direction water flows. (Drainage patterns already covered in Geomorphology). Drainage Types: Sequent/Concordant Drainage: A concordant drainage system exhibits a harmonious relationship with the underlying geological structure . The streams and rivers flow in a way that reflects the topography and rock formations. Consequent Drainage : Streams flow directly down the steepest slopes , creating a dendritic (branch-like) pattern. This is common in mountainous areas with young landscapes. (Example: Streams flowing down the slopes of the Himalayas) Subsequent Drainage: These are usually the tributaries of consequent streams, created at the locations of softer rocks. (Example: Drainage patterns in the Appalachian Mountains of the US). Insequent/Discordant: A discordant drainage system exhibits a dissonance with the underlying geological structure. The streams and rivers flow in a way that does not reflect the current topography or rock formations. Antecedent Drainage: An established drainage system persists even after the underlying rock formations have been uplifted or eroded. The river cuts through the new landscape, creating waterfalls or gorges. (Example: The antecedent drainage of the Indus and Brahmaputra River through the Himalayas) Superimposed Drainage: This occurs when a drainage system developed on a different landscape (e.g., older, eroded mountains) is superimposed on a new, uplifted landscape. The rivers maintain their original course, creating a mismatch with the current topography. (Example: Subarnarekha River). Concordant drainage systems suggest a long-term evolution where the rivers have carved their paths in harmony with the landscape. It is found in regions with tectonic stability. Discordant drainage systems often indicate geological changes like uplift, erosion, or past landscapes that have been superimposed upon them."}, {"c": 4, "n": "Indian Geography", "id": "s20", "t": "River Systems In India", "x": "77% of drainage is towards the Bay of Bengal; 23% is towards the Arabian Sea. Delhi Ridge-Aravallis-Vindhyas-Satpuras-Western Ghats form the Drainage Divide of India. Himalayan rivers are younger (40-60mn yrs) than peninsular (200mn yrs). Inland drainage is very commonly seen in the Kachchh region, due to a shoreline of emergence. River basins are divided based on their size into: Major River basins: >20,000 sq. km; Medium: 2000-20000 sq. km; Minor: <2000 sq. km."}, {"c": 4, "n": "Indian Geography", "id": "s21", "t": "Himalayan River System:", "x": "Origin: The Shiwalik river got divided into Indus and Brahmaputra rivers. Youthful perennial rivers, that cause flooding and experience shifting of river channels (Avulsions) in their mid to lower courses (Kosi) due to the deposition of the sediments brought about by them from their upper courses. Important River Systems: Indus : origin at Bokhar Chu in Kailash Mts. In India, it moves through Ladakh only. In India, riparian states/UTs include: Ladakh, Jammu & Kashmir, Himachal Pradesh, and Punjab. Makes a gorge near Nanga Parbat. Important Left tributaries include: Panjnad (IJKRBS), which are all left bank tributaries. Jhelum : Origin at Verinag; Meanders; Wular lake; joins Chenab in Pak Chenab : origin near Baralacha la pass, Lahaul-Spiti; Joins Sutlej in Pak Ravi: West of Rohtang, Kullu Hills; Joins Chenab in Pak Beas: Beas Kund near Rohtang; Gorges at Kati & Largi in Dhauladhar; entirely in India; Meets Sutlej in Punjab Sutlej: Rakshasthal near Mansarovar, Kailash Range; enters India through Shipki La; Joins Indus in Pak as Panjnad . Others: Zanskar, Suru Important Right bank tributary: Shyok River which originates from the Rimo Glacier, one of the tongues of the Siachen Glacier, and joins the Indus River at Keris, in India (POK). Another one is Gilgit river. Ganga System: Origin: Gangotri (Bhagirath) & Satopanth (Alaknanda) glaciers. It is known for the Panch Prayags , located in Uttarakhand (see the image). National Waterway 1 is on the Ganga River (from Haldia in West Bengal to Prayagraj in U.P.) Known as Padma in Bangladesh In India moves through: Uttarakhand, UP, Bihar, Jharkhand, and West Bengal. Riparian states also include H.P., Delhi, Haryana, Rajasthan, M.P., and Chhattisgarh. MNEMONIC: Vasudev Ne Karna ko Rasta Dikhaya MNEMONIC FOR RIVERS: Dhul Nandakini ke Pair Mein Bikhri Its important left bank tributaries include: Ramganga: Origin at Chamoli District; Meets Ganga at Kannauj; Gomti: Originates at Pilibhit; meets Ganga at Ghazipur Ghaghara: Originates in Tibet; It is an antecedent river; joins Ganga in Bihar; Major Tributaries: Sarda; Saryu; Rapti, Choti Gandak Gandak: Originates near Tibet-Nepal border; Kali Gandak, Mayangadi, and Trishuli are its major tributaries; joins the Ganga near Patna. Burhi Gandak: Originates in Bihar (West Champaram). It flows almost parallel to Gandak. Makes one of India’s biggest oxbow lake i.e. Kanwar Tal. Kosi River: also called Sapt Kosi due to its 7 tributaries; important tributaries being Arun, Tumar, and Sun Kosi; It has a shifting course, giving it the title of Sorrow of Bihar; Originates in Nepal; Joins Ganga near Kursela. Mahananda: Originates Near Tiger Hill. Last major right bank tributary to join Ganga in India. MNEMONIC: Rama Ghoomte hue Ghaghara Ganda Kar Mat. Important right bank tributaries: Yamuna: Yamunotri Glacier ; joins the Ganga at Prayagraj; Important tributaries include Chambal, Sind, Ken, Betwa. Tons: also called Tamsa and joins Ganga in UP. Son : Originates as a part of radial drainage (Narmada, Son, Johila) from the Amarkantak plateau in M.P. and joins the Ganga River near Patna. Phalgu: Passes through Gayaji. Important Distributary: Hooghly River : starts near Giria, West Bengal, and flows into the Bay of Bengal near Sagar Island. Makes an Estuary. Damodar : It is a tributary of the Hooghly River, which is a distributary of the Ganga. It starts in Chotanagpur Plateau and joins Hooghly near Kolkata. Others: Mayurakshi, Ajay Brahmaputra system: Origin : Chemayungdung & Angsi glaciers , Kailash Range, very near to the origin point of Sutlej River. It enters India after taking a U-turn from Namcha Barwa. Enters India as Dihang (Siang/Siyom), into which Lohit and Dibang meet. Becomes Brahmputra, from Sadiya to Dhubri (Assam) , before entering Bangladesh. Has multiple names throughout its course: Tsangpo - Dihang - Brahmaputra - Jamuna- Padma - Meghana States it moves through: Arunachal Pradesh, Assam Riparian states: Above + Manipur, Nagaland, Meghalaya, Sikk"}, {"c": 4, "n": "Indian Geography", "id": "s22", "t": "Peninsular Drainage", "x": "The peninsular drainage is approximately 200 million years old, and is in the mature stage Because of that broad, Shallow, Largely Graded Valleys . Classiﬁcation based on the direction of flow: South-eastward flowing (e.g.: Mahanadi Godavari, Krishna, Kaveri). Westward flowing (e.g.: Narmada, Tapi). North-eastward flowing : (e.g.: Tributaries of Ganga and Yamuna- Chambal, Ken, etc.)."}, {"c": 4, "n": "Indian Geography", "id": "s23", "t": "South-Eastward flowing rivers:", "x": "Mahanadi River: Origin: near Sihawa in Raipur district of Chhattisgarh. Runs through Odisha and drains into the Bay of Bengal. The river moves through CG and Odisha. Riparian States: MP and Chhattisgarh (53%), and Odisha (47%). Important Tributaries: Left Bank: Ib, Mand, Hasdo, Sheonath Right Bank: Ong, Jonk, Tel MNEMONIC: Seonath Man Hasdo On the Joke I Told. Hirakud Dam is built on it. It creates a gorge near Tikkarpara in Odisha. It makes a delta as it joins the Bay of Bengal. Godavari River: Longest peninsular river , and the largest river system of Peninsular India Also called Vridha Ganga and Dakshin Ganga Origin: Trimbakeshwar, near Nasik in Maharashtra. States it moves through: Maharashtra, Telangana, Chhattisgarh, Andhra Pradesh, and Yanam (Puducherry). Riparian states include Odisha and Karnataka apart from the above. Major Tributaries: Right bank: Manjara, Pravara. Left Bank: Purna, Pranhita (Wainganga+Penganga), Indravati, Sabari. Below Rajahmundry , 2 distributaries: Gautami Godavari and Vashishtha Godavari . Makes a delta at its mouth (KG delta) Krishna River: Originates in Mahabaleshwar . Makes a delta near its mouth. (KG delta) Moves through: Maharashtra, Karnataka, Telangana, and Andhra Pradesh. Riparian states also same. Important Tributaries: Kaveri River: Origin: Brahmagiri Hills, Kodagu, Karnataka. Perennial river which gets fed by both southwest monsoon (in its upper course) and the northeast retreating monsoons (the lower course). Moves through Karnataka and Tamil Nadi. Riparian States: Kerala (3%), (41%) Karnataka and 56% Tamil Nadu and Puducherry. Makes a delta. Divides into 2 at Tiruchirapalli district: Kollidam & Kaveri (both rejoin later at Srirangam, a riverine island) Important Tributaries: Other East flowing Peninsular rivers: Brahmani: Formed by the confluence of S. Koel and Sankh rivers near Rourkela. Flows into the Bay of Bengal. The Eastern Ghats start from its South . Subarnarekha: Originates at the Ranchi plateau ; forms the boundary between Odisha and WB; creates an estuary between Ganga and Mahanadi delta. Penneru: Originates from Nandi Durg in Karnataka ; Initially flows to the north, then attains an eastward course; forms an estuary before joining the Bay of Bengal. It makes a canyon at Gandikota. Ponniyar (Karnataka & Tamil Nadu) & Vaigai (Tamil Nadu) : Have a short course with a near coast existence only. Others Vamsdhara, Nagavali."}, {"c": 4, "n": "Indian Geography", "id": "s24", "t": "West Flowing Rivers:", "x": "Narmada: Originates at the Amarkantak Plateau , M.P. forming a radial drainage pattern with the river Son. Makes an estuary. Mouth at Gulf of Khambhat . Flows in Rift Valley between Vindhyas and Satpuras, so not many tributaries . Has short tributaries, that make a trellis pattern of drainage. Major tributaries include Hiran, Kolar, Hatni; Choti Tawa , etc. Riparian states: M.P., Maharashtra & Gujarat Experiences a slight meandering near Bharuch. Tapi: Often called Narmada’s twin Bounded by the Satpura range on the north, Mahadev Hills in the east, Ajanta range , and the Satmala Hills on the south. Riparian states MP, Maharashtra, Gujarat. Origin: Multai in M.P . Main Tributary: Purna, Girna and Panjara . Luni River: Also known as Salt (Lun) River Source: West of Ajmer Biggest river system of Rajasthan Called Sagarmati initially; and then Luni after river Sarsuti joins it . Ephemeral river , i.e. it flows only when there is rain. Best example of an inland drainage system in the world. Drains into the Rann of Kachchh which is a shoreline of emergence. Sabarmati: Culturally important river of India. Origin is Aravallis and its mouth is the Gulf of Khambat. It forms a Gorge in Dharoi Mahi: Origin: Vindhyas , M.P. Ends at the Gulf of Khambat. Only river to cross the tropic of Cancer Twice. Other short West flowing rivers: Very short rivers, which do not make any deltas. They are a prime example of parallel drainage , where these short channels originate in the Western Ghats and end in the Arabian Sea, while moving parallel to each other from West to East. Gujarat: Auranga, Par, Daman Ganga Goa: Mandovi Zuari, Rachol Maharashtra: Ulhas, Kalindi Karnataka: Kalinadi, Sharavati (Jog Falls), Tadri, Netravathi Kerala: Bharathapuzha, Periyar, Pamba"}, {"c": 4, "n": "Indian Geography", "id": "s25", "t": "Inland Drainage In India", "x": "Refers to the drainage systems that do not drain into seas/oceans. Ghaggar-Hakra river system : It is situated in North-Western India and Eastern Pakistan. The river is known as Ghaggar in India, and as the Hakra in Pakistan, post the Ottu barrage. It ends its journey in the Thar desert. Luni and West Banas rivers originate in Rajasthan, enter Gujarat, and end their journeys in the Rann of Kachchh. Important Dams of India"}, {"c": 4, "n": "Indian Geography", "id": "s27", "t": "Indian River Linking Project", "x": "History of the Project: The concept originated in the 19th century by British engineer Sir Arthur Cotton . Post-independence, the idea was revisited in the 1960s and gained momentum in the 1980s due to concerns about water scarcity and floods. The National Water Development Agency (NWDA) was established in 1982 to study the project's feasibility . The Supreme Court of India has intervened multiple times, directing the government to ﬁnalize plans and initiate implementation. About the Project: The project aims to link numerous Indian rivers through a network of reservoirs and canals. Two main components are envisaged: Himalayan Rivers Development : Interlinking rivers in the northern part of the country, like the Ganga and Yamuna. (14 potential links identiﬁed) Peninsular Rivers Development : Connecting rivers in peninsular India, like the Godavari, Krishna, Kaveri, and Mahanadi. (16 potential links identiﬁed) Some states have also proposed intra-state river-linking projects. Current Status: The project remains under debate . The Ken-Betwa River linking project, considered a pilot project, received cabinet approval in 2014, but faces hurdles related to environmental clearances and inter-state agreements. Pattiseema Lift Irrigation Project aims to connect the Godavari and Krishna Rivers . It was inaugurated in 2016 . It brings water from Godavari to Krishna , from Godavari’s Polavaram Project. The NWDA continues to study the feasibility of other potential links."}, {"c": 4, "n": "Indian Geography", "id": "s29", "t": "PYQs:", "x": "Q.) The Brahmaputra, Irrawaddy and Mekong rivers originate in Tibet and flow through narrow and parallel mountain ranges in their upper reaches. Of these rivers, Brahmaputra makes a “U” turn in its course to flow into India. This “U” turn is due to - (2011) (a) Uplift of folded Himalayan series (b) Syntaxial bending of geologically young Himalayas (c) Geo-tectonic disturbance in the tertiary folded mountain chains (d) Both (a) and (b) above Ans: B About 70 million years ago, there was a sea called Tethys sea where the Himalayas stand today. The sea started to recede during the early Eocene which was marked by the coming together of Indian and Asian plates. This trend of marine regression continued until the ﬁnal emergence of the Himalayan Mountains by the end of the Tertiary Period. The collision of the Indian Plate with the Asian Plate retarded the pace of northerly drift of the Indian Plate. During the upliftment of the Himalayas, the maximum push was offered by the Aravalli mountains in the West and Shillong Plateau in the East. Arakanyoma and Sulaiman ranges are regarded as an offshoot of Himalaya, Arakanyoma bends near Namcha Barwa (Arunachal Pradesh East), while Sulaiman bends near Nanga Parbat. Both these mountains/offshoots give the appearance of a hairpin. Due to this structure Brahmaputra river makes U turn into the Indian subcontinent. Q.) The Narmada river flows to the west, while most other large peninsular rivers flow to the east. Why? (2013) 1. It occupies a linear rift valley. 2. It flows between the Vindhyas and the Satpuras. 3. The land slopes to the west from Central India. Select the correct answer using the codes given below. (a) 1 only (b) 1 and 3 only (c) 2 and 3 only (d) None Answer: A Narmada and Tapi flow through rift valleys caused due to the upheaval of the Himalayas. The Narmada rises at an elevation of about 3,500 feet (1,080 metres) in the Maikala Range in eastern Madhya Pradesh state on the border with Chhattisgarh state. It ﬁrst follows a tortuous course through the hills near Mandla and then turns northwest to pass the city of Jabalpur. There it turns southwest and then enters the structural trough between the Vindhya and Satpura ranges at Marble Rocks Gorge. Turning more westward, the river continues across Madhya Pradesh until it passes into Gujarat state. The Narmada enters the Gulf of Khambhat through an estuary 13 miles (21 km) wide, just below Bharuch. The Narmada is flowing through the area where the land is not sloping towards the west from central India, but it is flowing west because of the rift valleys only. Q.) Consider the following rivers: 1. Barak 2. Lohit 3. Subansiri Which of the above flows / flow through Arunachal Pradesh? (2014) (a) 1 only (b) 2 and 3 only (c) 1 and 3 only (d) 1, 2 and 3 Answer: B The Barak is a 900 km river flowing through the states of Nagaland, Manipur and Assam in India and into the Bay of Bengal via Bangladesh. The Barak River flows 900 kilometres through the states of Manipur, Nagaland, Mizoram and Assam in India. Further it enters Bangladesh where it is known by the name of the Surma and the Kushiyara and later called the Meghna before receiving the combined flow of the Ganga and the Brahmaputra. Barak rises in the Manipur hills and enters the plains near Lakhipur. The river enters Bangladesh as Surma and Kushiyara. Later, the river is called the Meghna and receives the combined flow of the Ganga and Brahmaputra. It is being developed as one of the Inland waterways of India. The environment of Barak's basin hosts a wide variety of flora and fauna. Q.) Consider the following rivers : 1. Vamsadhara 2. Indravati 3. Pranahita 4. Pennar Which of the above are tributaries of Godavari? (2015) (a) 1,2 and 3 (b) 2,3 and 4 (c) 1,2 and 4 (d) 2 and 3 only Answer: D The Godavari is India's second longest river after the Ganga. Its source is in Trimbakeshwar, Maharashtra The major tributaries of the river can be classiﬁed as the left bank tributaries which include"}, {"c": 4, "n": "Indian Geography", "id": "s31", "t": "INDIAN CLIMATE:", "x": "Tropical conditions along the Southern coastal regions to the very cold conditions in the North, from dry desert-like conditions in the West to abundant rainfall in the East. Considered Monsoonal climate (75% rainfall in monsoon months)"}, {"c": 4, "n": "Indian Geography", "id": "s32", "t": "Factors affecting Indian Climate:", "x": "Latitude : India's latitudinal extent stretches from roughly 6°N to 35°N , placing it primarily in the tropical zone. This means it receives a high amount of solar radiation throughout the year, contributing to generally warm temperatures. However, there are variations. As you move north towards higher latitudes, temperatures tend to decrease as the climate gets more temperate in nature. Himalayas : This mighty mountain range acts as a giant barrier, separating the subcontinent from the cold, dry winds blowing from Central Asia. The Himalayas play a crucial role in influencing the climate: a. Blocking Cold Winds : They prevent the harsh winters of Central Asia from reaching most of India. b. Monsoons : The Himalayas influence the formation of monsoon winds, which bring vital rainfall to the subcontinent during the summer months. Pressure and Wind Systems : The pressure and wind systems over the Indian subcontinent vary seasonally. These variations signiﬁcantly impact the weather patterns: a. Monsoon : During summer, low pressure over the Indian landmass attracts moisture-laden winds from the southwest (Indian Ocean), bringing the monsoon season with its characteristic heavy rainfall. b. Upper air circulation : In winter, high pressure over the landmass leads to dry, northeasterly winds blowing from land to sea, resulting in a dry season for much of the country. But the Sub Tropical Westerly jet streams bring in the Western Disturbances, causing winter rains. Ocean Currents : India is surrounded by water bodies on three sides: the Arabian Sea to the west, the Bay of Bengal to the east, and the Indian Ocean to the south. The warm currents like the Indian Ocean Equatorial Current contribute to generally warm and humid conditions along the coastal regions. Distance from the Sea (Continentality) : As we move inland from the coast, the influence of the sea on the climate diminishes. Locations further away from the sea experience more extreme temperatures, with hotter summers and colder winters compared to coastal areas. Relief Features : India's diverse topography, including mountains, plateaus, and plains, also plays a role. Mountain ranges like the Western Ghats can act as barriers, influencing rainfall patterns and creating rain shadows in certain areas. The high altitude of the Himalayas contributes to a colder climate in the northern mountain regions."}, {"c": 4, "n": "Indian Geography", "id": "s33", "t": "Seasons Of India: Winter Season", "x": "From mid-Nov till Feb Fog formation in Northern parts , especially in the Indo-Gangetic Region, which can even turn into smog . Temperature inversion can also lead to the rise of Pollution Domes . Frost is common in Northern parts. Offshore Northeast trade winds prevail. Rains due to Western Disturbances (Subtropical Westerly Jet) Winter rain “ Mewat”/ “Mahawat ” is important for Rabi crops. Season of least tropical cyclones as the land and the oceans experience high pressure due to the shift of ITCZ. Cold waves are common in the Northern parts of the country."}, {"c": 4, "n": "Indian Geography", "id": "s34", "t": "Western Disturbances", "x": "Western disturbances are extratropical storms originating in the Mediterranean region . These low-pressure systems travel eastwards towards India, influenced by the Sub-Tropical Westerly jet stream . As these disturbances move towards the Indian subcontinent, they encounter the Himalayas, which cause them to lose moisture, resulting in precipitation over northern India. Impact: Winter Rainfall : Western disturbances are a major source of winter and pre-monsoon rainfall in the northwestern parts of India, including Punjab, Haryana, Uttar Pradesh, and Delhi. Sometimes they might also bring rainfall to Peninsular and North Eastern states. They also bring snowfall to the Himalayan regions. Temperature Regulation : These disturbances help regulate winter temperatures, preventing extreme cold conditions by bringing cloud cover and moisture. Water Resources : The snowfall in the Himalayas contributes to the perennial flow of rivers such as the Ganges and Indus, which are vital for irrigation and drinking water supply. Important for Rabi crops. Weather Events : These disturbances can also lead to extreme weather events like heavy rainfall, hailstorms, and thunderstorms, which can cause damage to crops, infrastructure, and even loss of life. Possible Impact of Climate Change: Frequency and Intensity : Climate change may alter the frequency and intensity of western disturbances. Some studies suggest that there could be an increase in the intensity of these disturbances due to warmer air holding more moisture. Increased intensity could lead to more severe weather events, including heavier rainfall and more extensive snowfall. Shift in Patterns : There is a possibility of a shift in the typical pathways and timing of western disturbances due to changes in global atmospheric circulation patterns. Changes in the timing and pathway can affect the predictability and reliability of rainfall and snowfall during the winter months, impacting agriculture and water resources. Climatological Disasters: Over the past few years, the WDs are being seen frequently in summers as well. They can interact with the summer cyclones in Arabian Sea and Bay of Bengal, and cause severe weather events. They can also interact with Monsoons, causing extreme precipitation."}, {"c": 4, "n": "Indian Geography", "id": "s35", "t": "Seasons Of India: Summer Season", "x": "Northward shift of sun , causing the shift of ITCZ too (around 25 degree North). Loo winds and Dust storms (Aandhi); can cause showers (assisted by Western Disturbances). Heat waves are a common feature of the season. Pre-monsoon showers: (Caused by meeting of warm continental and maritime air masses) Norwester/ Kaal baisakhi : WB, Bihar, Jharkhand, Odisha (Rice, tea, jute) Bardoli Chheerha/Bordoisila/tea showers : Assam Mango Showers : Karnataka/Kerala Coffee/ Cherry Blossom Showers : Karnataka & Kerala 1% of India’s annual rainfall in this season. There is a lot of cyclonic activity during this season."}, {"c": 4, "n": "Indian Geography", "id": "s36", "t": "Cyclones In India", "x": "India has a tropical location, with a vast coastline of over 7500 km, making it susceptible to Tropical Cyclones. The period between April and December experiences the most signiﬁcant cyclone activity in India, with the peak months being May-June and October-November . Favorable Conditions : This period coincides with: Warm Sea Surface Temperatures : The Bay of Bengal and the Arabian Sea reach their warmest temperatures during these months, providing the energy needed for cyclone formation. Monsoon Winds and Moisture : The southwest monsoon brings in signiﬁcant moisture, which is another crucial ingredient for cyclone formation. Bay of Bengal v/s Arabian Sea: The Bay of Bengal witnesses a higher frequency of cyclones compared to the Arabian Sea, with a ratio of approximately 4:1 . This is due to favorable conditions like larger warm water areas (due to continentality) and lower wind shear prevailing in the Bay of Bengal. On average, 5-6 tropical cyclones form annually in the North Indian Ocean (Bay of Bengal and Arabian Sea), with 2-3 being severe. Impact of Climate Change: Warmer Seas, Stronger Storms: A key factor in cyclone formation is warm sea surface temperatures. As the climate warms, both the Arabian Sea and the Bay of Bengal are experiencing rising sea surface temperatures. Warmer water acts as fuel for cyclones, providing the energy they need to form, intensify, and sustain themselves. This can lead to cyclones reaching higher wind speeds and causing more extensive damage. Increased Intensity, Not Necessarily Frequency: While the overall number of cyclones might not signiﬁcantly increase, climate change is projected to make existing cyclones more severe . Stronger winds, heavier rainfall, and higher storm surges are all potential consequences of climate change-induced intensiﬁcation. Impact on the Arabian Sea: Historically, the Arabian Sea has been less prone to cyclones compared to the Bay of Bengal. However, recent studies suggest an increase in cyclone activity in the Arabian Sea, which some experts attribute to climate change. Warmer Arabian Sea waters could lead to more frequent and intense cyclones striking the western coast of India, posing a new threat to previously less vulnerable regions. Impact on the Bay of Bengal: The Bay of Bengal is already a hotspot for cyclones. With rising sea surface temperatures, cyclones here could become even more powerful . Increased storm surges due to rising sea levels can cause greater coastal inundation, displacing communities and damaging infrastructure. Heavy rainfall associated with intensiﬁed cyclones can lead to flash floods and landslides, further exacerbating the impact on coastal populations and inland areas. According to a 2022 study, numbers might decrease and intensities will increase here. Adaptation and Mitigation: Adaptation : Building seawalls, improving early warning systems , and promoting disaster preparedness measures are crucial for adapting to the changing cyclone landscape. Mitigation : Addressing climate change at its source by reducing greenhouse gas emissions is essential for long-term mitigation of cyclone intensity. Colour-Coded warnings: The Indian government uses a well-deﬁned color-coded cyclone warning system to disseminate information and prepare communities: Pre-cyclone watch (No colour): issued 72 hours in advance and contains an early warning about the development of a cyclonic disturbance in the north Indian Ocean. Cyclone Alert (Yellow): issued at least 48 hrs in advance of the expected commencement of adverse weather over the coastal areas. It contains information on the location and intensity of the storm likely direction of its movement, intensiﬁcation, coastal districts likely to experience adverse weather, and advice to ﬁshermen, the general public, media, and disaster managers. Cyclone Warning (Orange): issued at least 24 hours in advance of the expected commencement of adverse weather over the coastal areas. The landfall point is "}, {"c": 4, "n": "Indian Geography", "id": "s37", "t": "Urban Heat Island Effect", "x": "The Urban Heat Island (UHI) effect refers to the phenomenon where urban areas experience signiﬁcantly higher temperatures than their rural surroundings. Causes: Concrete and Asphalt Surfaces : Buildings, roads, and other infrastructure absorb and retain heat, leading to higher temperatures. Reduced Vegetation : Urban areas often have less vegetation, which would otherwise provide cooling through shading and evapotranspiration. Heat Emissions : Vehicles, industrial activities, air conditioners, and other sources emit heat, further warming urban areas. Anthropogenic Heat : Energy consumption for heating, cooling, and other urban needs generates additional heat. Urban Geometry : The conﬁguration of buildings and streets can trap heat and restrict airflow, creating \"heat canyons.\""}, {"c": 4, "n": "Indian Geography", "id": "s38", "t": "Seasons Of India: Advancing Monsoon", "x": "75% rainfall. Arabic word “mausim”; seasonal reversal of winds. June-September Factors affecting Indian Monsoons: Differential Heating of Land and Water: This is the primary driver of the monsoon . During summer, the Indian landmass heats up rapidly due to the high solar radiation. Conversely, the surrounding oceans (the Arabian Sea and Bay of Bengal) retain their cooler temperatures. This creates a pressure difference: hot air over land rises (low pressure), while cooler air over the oceans remains denser (high pressure). This sets up a pressure gradient that draws moisture-laden winds from the seas towards the landmass, bringing the monsoon rains. Shift of the Intertropical Convergence Zone (ITCZ): The ITCZ is a belt of low pressure encircling the Earth near the equator, where warm, humid air rises and condenses to form rain. During summer, the ITCZ migrates northward , positioning itself over the Indian subcontinent. This shift brings the zone of heavy rainfall closer to India, contributing signiﬁcantly to the monsoon season. Subtropical Westerly Jet Stream: High up in the atmosphere, the Subtropical Westerly Jet Stream is a fast-moving band of westerly winds. While its direct influence on monsoon rainfall is minimal, its position plays a role. A weaker or northward-shifted jet stream can allow more moisture-laden southerly winds to reach India , strengthening the monsoon. Conversely, a stronger or southward-shifted jet stream can act as a barrier, hindering the monsoon winds. Tibetan Plateau and Tropical Easterly Jet Stream (TEJ): The massive Tibetan Plateau acts like a giant elevated heat source during summer. This heating strengthens the TEJ , an easterly jet stream blowing over the subcontinent. A strong TEJ helps pull in moisture-laden winds , enhancing the monsoon. Conversely, a weak TEJ can lead to a weaker monsoon. Somali Jet Stream: This low-level jet stream blows from the southwest across the Arabian Sea during summer. It plays a crucial role in transporting moisture from the Arabian Sea towards India , contributing to the overall monsoon rainfall. El Niño Southern Oscillation (ENSO): This large-scale climate-ocean phenomenon occurring in the Paciﬁc Ocean has a signiﬁcant impact on the Indian monsoon. During El Niño events (warmer than average sea surface temperatures in the eastern Paciﬁc compared to Western Paciﬁc), monsoon rainfall over India tends to be weaker. Conversely, La Niña events (cooler than average sea surface temperatures in the Eastern Paciﬁc) are often associated with stronger monsoons. Indian Ocean Dipole (IOD): This climate pattern refers to the difference in sea surface temperatures between the western and eastern Indian Oceans. A positive IOD event (warmer waters in the west, cooler in the east) can lead to stronger monsoon rainfall over India. Conversely, a negative IOD event (cooler waters in the west, warmer in the east) is often associated with weaker monsoon activity. Madden-Julian Oscillation (MJO): This atmospheric phenomenon involves eastward movement of a band of low pressure and enhanced convection (rising air) around the tropics . The MJO can influence the intensity of the Indian monsoon rainfall on a timescale of weeks to months. A f avorable phase of the MJO can enhance monsoon rainfall , while an unfavorable phase can suppress it. Arctic Sea Ice: According to a study by the National Centre for Polar and Ocean Research , Goa, Arctic sea ice also affects the indian monsoon. What is the exact mechanism, is yet to be identiﬁed , but as of now, we know that reduced sea ice in the Arctic causes increased rain in central and Northeast india, and decreased rainfall in Western and southern peninsular India. Monsoonal Trough: A low pressure region created over India due to the above factors, that attracts the SouthWest Monsoonal winds. Monsoon Burst : Monsoon advance with startling suddenness accompanied by Thunder, Lightning, and heavy downpour. 1st June (Kerala). 2 branches : Arabian Sea"}, {"c": 4, "n": "Indian Geography", "id": "s39", "t": "Urban Flooding In India", "x": "Urban flooding is a phenomenon where heavy rainfall overwhelms the drainage capacity of urban areas , leading to water accumulation on streets, homes, and infrastructure. Unlike rural flooding, urban flooding is primarily due to the high density of impervious surfaces such as concrete and asphalt, which prevent water from being absorbed into the ground. Causes: Heavy Rainfall : Intense and prolonged rainfall can exceed the capacity of urban drainage systems, leading to flooding. E.g. The Mumbai floods of July 2005 were caused by a record-breaking 944 mm of rainfall in a single day. Poor Drainage Systems : Inadequate, poorly designed, or poorly maintained drainage infrastructure can lead to blockages and insufﬁcient water flow. E.g. Chennai floods of 2015 highlighted the city's inadequate drainage systems and encroachments on water bodies. Unplanned Urbanization : Rapid and unplanned urban growth reduces the amount of open land that can absorb rainwater, increasing surface runoff. E.g. Bengaluru has seen signiﬁcant urban flooding due to rapid, unplanned urbanization and reduced green spaces. Improper Waste management can choke the natural and artiﬁcial drains, exacerbating the problem. Encroachment on Natural Water Bodies : Construction and encroachment on lakes, wetlands, and rivers disrupt natural drainage and water absorption. E.g. Hyderabad's flooding issues are partly due to encroachment on lakes and water bodies. Climate Change : Increasing frequency and intensity of extreme weather events, such as heavy rainfall, due to climate change exacerbate urban flooding. E.g. Climate change has been linked to the increased frequency of heavy rain events in cities like Mumbai and Kolkata. Deforestation : Reduction of green cover in and around cities decreases natural absorption of rainwater, leading to increased runoff. E.g. The loss of mangroves in coastal cities like Mumbai reduces natural flood buffers."}, {"c": 4, "n": "Indian Geography", "id": "s40", "t": "El Nino Southern Oscillations", "x": "El Niño Southern Oscillation (ENSO) is a coupled ocean-atmosphere phenomenon that disrupts typical weather patterns across the globe. It's essentially a large-scale climate dance between the Paciﬁc Ocean and the atmosphere above it, with two distinct phases: El Niño and La Niña. Climatological and Oceanographic Impacts: El Niño: During El Niño events, trade winds weaken in the tropical Paciﬁc . Warm surface water typically conﬁned to the western Paciﬁc sloshes eastward , leading to: Warmer sea surface temperatures in the eastern Paciﬁc. The cold Peruvian (Humboldt) current gets replaced by warm water . Reduced upwelling of cold, nutrient-rich water from the deep ocean. Changes in atmospheric circulation patterns, impacting global rainfall. La Niña : La Niña represents the opposite phase. Trade winds intensify, pushing warm surface water westward. This results in: Cooler sea surface temperatures in the eastern Paciﬁc. Enhanced upwelling of cold, nutrient-rich water. Altered atmospheric circulation patterns with a different global rainfall signature. Global Climate Impacts of El Niño: Warmer and Drier Conditions : El Niño is often associated with drier-than-average conditions in many parts of the world, including: India and East Africa : Reduced rainfall can lead to droughts and food insecurity. Australia : Drier conditions can contribute to wildﬁres and heatwaves. Southeast Asia : El Niño can suppress monsoon rainfall, impacting agriculture. Increased Rainfall and Flooding : Conversely, El Niño can bring wetter-than-average conditions to other regions: California (USA): Increased storminess and precipitation are common during El Niño events. Peru : El Niño can lead to heavy rainfall and flooding along the normally dry coastal regions. Global Climate Impacts of La Niña: Cooler and Wetter Conditions : La Niña often brings: Colder-than-average temperatures in parts of North America and Europe. Increased precipitation in India, East Africa, Australia and Southeast Asia, potentially leading to floods. Droughts : Conversely, La Niña can cause drier conditions in some regions: Peruvian Coast : La Niña can contribute to drier-than-average conditions and more supressed rainfall. ELLA What Are ELLA Years? 5. ELLA refers to phases when the Paciﬁc Ocean moves between El Niño and La Niña conditions, neither fully active. 6. These transitional periods have distinct ocean-atmosphere characteristics, different from ENSO or El Niño Modoki. Based on the IMD-IITM Pune study, ELLA years bring: Severe and prolonged summer heat : with extremely high daytime and nighttime temperatures. More frequent heatwaves , particularly across northwest and central India. Extended duration of extreme heat , making summers notably harsher. Early identiﬁcation of ELLA years could improve heatwave forecasting and preparedness in India. Recognizing this pattern adds nuance beyond standard ENSO impacts, highlighting critical transitional phases that affect summer temperatures profoundly."}, {"c": 4, "n": "Indian Geography", "id": "s41", "t": "El Nino Modoki", "x": "El Niño Modoki, also known as \"Central Paciﬁc El Niño\" or \"dateline El Niño,\" is a variation of the traditional El Niño phenomenon. The term \"Modoki\" comes from a Japanese word meaning \"similar but different.\" Unlike the conventional El Niño, where the warmest sea surface temperatures (SSTs) are found in the eastern Paciﬁc Ocean, El Niño Modoki features warm SST anomalies centered in the central Paciﬁc, with cooler temperatures in both the eastern and western Paciﬁc. Characteristics of El Nino Modoki: Location of Warm SSTs : In El Niño Modoki events, the central Paciﬁc (around the dateline) experiences signiﬁcant warming, while the eastern Paciﬁc may not see as much warming and can even experience cooling. Atmospheric Patterns : The atmospheric convection and related weather patterns shift from the eastern to the central Paciﬁc, influencing global climate differently compared to the traditional El Niño."}, {"c": 4, "n": "Indian Geography", "id": "s42", "t": "Paciﬁc Decadal Oscillation (PDO)", "x": "The Paciﬁc Decadal Oscillation (PDO) is a long-term fluctuation in sea surface temperatures (SSTs) and atmospheric circulation over the North Paciﬁc Ocean , with each phase typically lasting 20–30 years . It has two phases: positive (warm) , when the eastern Paciﬁc is warmer and the western Paciﬁc cooler than average, and negative (cool) , with the opposite pattern. Unlike ENSO , which operates on a 2–7 year timescale, the PDO influences climate over decadal scales and can amplify or weaken El Niño and La Niña impacts. It affects temperature, rainfall,
