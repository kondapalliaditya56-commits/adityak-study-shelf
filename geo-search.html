.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.btn{font:600 14px var(--sans);padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:40px 0 20px}.pager a{display:block;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;text-decoration:none;color:var(--ink);font:600 15px var(--sans)}.pager a.nx{text-align:right}.pager small{display:block;color:var(--muted);font-weight:500;font-size:12px}

/* ---- reader app ---- */
:root{--zoom:1;--lh:1.65;--pw:780px}
:root[data-theme="sepia"]{--bg:#F4ECD8;--surface:#FBF5E6;--surface2:#EADFC4;--ink:#3B3022;--muted:#7A6A52;--line:#D8C9A6;--acc:#7A4A12;--acc-ink:#fff;--acc-soft:#EFDDB8;--saf:#A4470A;--saf-soft:#F6E2BE;--red:#9C2A1C;--red-soft:#F3D9CB;--blue:#2F5C8A;--blue-soft:#DDE6E4;--good:#3E6B2A;--good-soft:#DDE8C8;--hl:#F2D98A;color-scheme:light}
:root[data-font="sans"] body{font-family:var(--sans)}
:root[data-font="sans"] .notes p,:root[data-font="sans"] .notes li{font-family:var(--sans)}
.page{zoom:var(--zoom);max-width:var(--pw)}
.notes p,.notes li{line-height:var(--lh)}
.rbar{position:fixed;left:0;top:0;height:3px;width:0;background:var(--acc);z-index:40;transition:width .15s}
.aabtn{color:var(--ink);border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:5px 12px;font:700 14px var(--serif);cursor:pointer;flex:none}
.h2read{float:right;margin:2px 0 0 10px;font:600 12px var(--sans);border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer;min-height:30px}
.h2read[aria-pressed="true"]{background:var(--acc-soft);color:var(--acc);border-color:var(--acc)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;justify-content:center}
.dock button{font:600 14px var(--sans);min-height:44px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;padding:0 14px;cursor:pointer}
.dock .mid{flex:1;max-width:520px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock .mid b{color:var(--acc)}
body.has-dock .page{padding-bottom:110px}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheetin{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:82vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));font:15px/1.4 var(--sans)}
.sheetin h3{margin:0 0 10px;font:700 17px var(--sans)}
.srow{display:flex;align-items:center;gap:10px;margin:12px 0;flex-wrap:wrap}
.srow label{flex:0 0 92px;color:var(--muted);font-weight:600}
.srow .grp{display:flex;gap:6px;flex-wrap:wrap}
.srow button{font:600 14px var(--sans);min-height:42px;min-width:48px;padding:0 12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;cursor:pointer}
.srow button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.secl a{display:flex;gap:10px;align-items:center;padding:12px 6px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;min-height:44px}
.secl a .tk{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--acc-ink)}
.secl a.rd .tk{background:var(--acc);border-color:var(--acc)}
.secl a.cur{background:var(--acc-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:50;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;font:600 14px var(--sans);max-width:92vw;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.toast button{font:700 14px var(--sans);background:transparent;border:0;color:var(--bg);text-decoration:underline;cursor:pointer;min-height:36px}
body.focus .bar{display:none}body.focus .sidetoc{display:none}
figcaption.clamp{max-height:3.3em;overflow:hidden;position:relative;cursor:pointer}

</style></head><body><header class="bar"><div class="barin"><a class="home" href="index.html">Library</a><a class="home" href="geo-home.html">Contents</a><span class="bartitle"><b></b> Search Geography</span><button class="themebtn" id="themebtn" type="button" aria-label="Change theme">Theme</button></div></header><main class="page home-page"><div class="chead"><div class="eyebrow">Find anything</div><h1>Search</h1></div><input class="sbox" id="q" type="search" placeholder="Type a word, e.g. Coriolis, Kolleru, Gondwana" autofocus><p class="prog" id="cnt"></p><div class="results" id="res"></div></main><script type="application/json" id="sdata">[{"c": 1, "n": "Geomorphology", "id": "s0", "t": "UNIVERSE", "x": "THEORIES OF ORIGIN OF THE SOLAR SYSTEM"}, {"c": 1, "n": "Geomorphology", "id": "s1", "t": "Gaseous Hypothesis:", "x": "Given by Kant Large particles of primordial matter were scattered in the universe. They started colliding against each other . Collision resulted in the generation of heat. Heat changed the primordial matter from solid to liquid and from liquid to gaseous state, creating a nebula . Nebula started rotating around its axis, creating a bulge in the center of the gaseous mass. When this bulge increased in size, the rings started forming one by one and were separated from the middle part of the nebula. Residual central mass became the sun and the rest of the rings became the planets . How did the moons form? Repetition of the same process at the planet level. Rings were separated from the newly formed planets. Material of each ring condensed to form satellites of the concerned planets. Drawback: Not explained the source of the primordial matter . According to the science of the law of motion, the collision of particles doesn’t generate rotatory motion ."}, {"c": 1, "n": "Geomorphology", "id": "s2", "t": "Nebular Hypothesis:", "x": "1796. By Laplace Modified version of Kant’s theory Postulates: o A huge and hot gaseous nebula is present in the space. Thus, he solved the problem of heat of the nebula through this assumption. o From the very beginning, a huge and hot nebula was rotating (spinning) on its axis. o A huge and hot gaseous matter called a nebula existed in space which was continuously rotating on its axis. o Nebula was losing heat from its outer surface due to the process of radiation and was thus reducing in size and volume due to contraction. o As its size reduced, its velocity of rotatory motion began to increase . With increased velocity, the rings started detaching . Each ring condensed at a point in the form of a gaseous mass which started rotating around the nebula . Gaseous mass later cooled and formed the planets . The remaining part of the nebula thus became the sun . Limitations: o Did not explain the source of origin of the nebula . o If the planets have been formed from the rotating nebula, then the residual part of the nebula i.e., the Sun should rotate at the highest speed due to the decrease in its size, but it is not so ."}, {"c": 1, "n": "Geomorphology", "id": "s3", "t": "Chamberlin–Moulton planetesimal hypothesis", "x": "According to this hypothesis, a star passed close to the young Sun, causing tidal bulges and solar prominences that led to repeated ejections of material from the Sun. Gravitational effects from the passing star created spiral arms of ejected material, with some of it remaining in orbit . This material cooled and condensed into small bodies called planetesimals and larger protoplanets . Over time , collisions among these objects formed the planets and their moons, with comets and asteroids as leftover debris."}, {"c": 1, "n": "Geomorphology", "id": "s4", "t": "Accretion Model", "x": "By Otto Schmidt (1944) and Viktor Safronov (1969). Constant accretion of particles convert them from a nebula to planets eventually. Nebula → Dust grains → Boulders → Planetesimals → Planets"}, {"c": 1, "n": "Geomorphology", "id": "s5", "t": "Big Bang Hypothesis:", "x": "Georges Lemaitre proposed in 1920s. He theorized that the universe began from a single primordial atom. The idea received major boosts from Edwin Hubble's observations that galaxies are speeding away from us in all directions, as well as from the 1960s discovery of cosmic microwave radiation—interpreted as echoes of the big bang—by Arno Penzias and Robert Wilson. Theory was finally validated in 1972. All matter in the universe existed in the form of dense and huge primordial matter. A violent explosion took place in this primordial matter. Due to this, the dust particles present in this matter were scattered in the universe. Over several million years, slightly denser regions become gravitationally attracted to each other. They grew even denser, forming gas clouds, stars, galaxies , and other astronomical structures."}, {"c": 1, "n": "Geomorphology", "id": "s6", "t": "PROOF:", "x": "(Hotter the body, shorter the wavelength. Why? More energy = faster particle motion → higher frequency waves = shorter wavelength) Hubble’s Law (Hubble-Lemaitre law): galaxies farther away from us are moving away at faster speeds, indicating the expansion of the universe. Basis of Hubble’s law is redshift , which is the elongation of light waves to longer wavelengths, often toward the red end of the spectrum, caused by an object moving away from the observer , commonly observed in distant galaxies due to the expansion of the universe. Cosmic Microwave Background Emissions: Discovered by American physicists Arno Penzias and Robert Wilson, who detected it in 1965 . It is the faint glow of electromagnetic radiation that fills the universe. It is the oldest light in the universe, dating back to about 380,000 years after the Big Bang. In the early universe, it was so hot that matter and radiation were constantly interacting — a plasma of electrons and nuclei. There were no atoms due t the heat. When the universe cooled enough (~3000 K), electrons combined with protons to form neutral atoms — a process called recombination. At that point, photons could travel freely — this is the moment the CMB was released. CMB is like a baby photo of the universe , showing us how it looked just after birth. Its existence, temperature, uniformity, and small irregularities are exactly what the Big Bang Theory predicts , and no other theory explains it so well."}, {"c": 1, "n": "Geomorphology", "id": "s7", "t": "DARK ENERGY & DARK MATTER", "x": "Dark energy and dark matter are two mysterious components that together make up about 95% of the universe , yet they remain largely unexplained. Dark matter , which accounts for roughly 27% , does not emit, absorb, or reflect light, but its presence is inferred from its gravitational effects , such as the rotation of galaxies and gravitational lensing (bending of light as it passes from near a massive celestial object). It acts as an invisible scaffold, holding galaxies together. On the other hand, dark energy , making up about 68% , is thought to be responsible for the accelerating expansion of the universe . Unlike dark matter, dark energy is not associated with matter or gravity pulling things together, but rather with a repulsive force that pushes space itself apart. Though both are invisible and not directly detectable, their effects are crucial in explaining the structure, behavior, and fate of the cosmos."}, {"c": 1, "n": "Geomorphology", "id": "s8", "t": "GALAXIES", "x": "Formation After the Big Bang (13.8 billion years ago): Initial fluctuations in the density of matter led to the congregation of material at those places. The role of Dark matter’s gravity is considered here. First Galaxies (about 1 billion years post-Big Bang) : Gas clouds collapse under gravity, forming the first stars and galaxies. Galaxy Evolution (1 billion years to present): Galaxies grow and evolve through mergers and interactions. Types of Galaxies Spiral Galaxies: These galaxies feature a flat, rotating disk with spiral arms winding outward from a central bulge . The Milky Way is a prime example of a spiral galaxy. They are rich in gas and dust, facilitating active star formation, particularly in the spiral arms. Elliptical Galaxies: Ranging from nearly spherical to elongated shapes, elliptical galaxies have a smooth, featureless light profile . They contain older, cooler stars and possess minimal gas and dust , resulting in low rates of new star formation. Lenticular Galaxies : These are intermediate between spiral and elliptical galaxies, characterized by a central bulge and a disk but lacking prominent spiral arms . They have little interstellar matter, leading to minimal star formation activity. Irregular Galaxies: Lacking a distinct shape, irregular galaxies often appear chaotic , possibly due to gravitational interactions or collisions with other galaxies. They typically contain abundant gas and dust, with active regions of star formation. Active Galactic Nuclei: highly energetic regions at the centers of some galaxies , powered by supermassive black holes accreting matter. These regions emit enormous amounts of radiation across the electromagnetic spectrum and are categorized based on their observational characteristics. Active galaxies make up about 10% of known galaxies and have centers that are over 100 times brighter than the combined light of their stars. This intense energy is powered by supermassive black holes surrounded by accretion disks of infalling gas and dust, which emit radiation from infrared to X-rays. Some of this material is also ejected as jets near the speed of light. Milky way is not active. Types of galaxies on basis of activity: Seyfert Galaxies Most common and lowest energy active galaxies. Appear normal in visible light but emit strongly in infrared and sometimes X-rays. Usually radio-quiet, though some produce jets . Quasars Brightest and most energetic type of active galaxy. Can outshine entire galaxies and are visible across great cosmic distances. Powered by massive accretion activity ; may be episodic, lasting ~10 million years. Useful for studying the early universe and black hole growth. Blazars A type of active galaxy whose jets point almost directly at Earth . Appear extremely bright and are sources of high-energy particles like neutrinos. Give insight into the extreme environments near black holes."}, {"c": 1, "n": "Geomorphology", "id": "s9", "t": "STARS", "x": "Their formation after the Big Bang within the galaxies. Approximately 380,000 years post-Big Bang, the universe cools enough for electrons to combine with protons and form neutral atoms, releasing the CMB. Formation of Gas Clouds (100 million to 200 million years post-Big Bang) : Gravity causes hydrogen and helium gas to clump together, forming large clouds. Protostar Formation (200 million to 400 million years post-Big Bang): These gas clouds collapse under gravity, increasing temperature and pressure, forming protostars. Nuclear Fusion Ignition (200 million to 400 million years post-Big Bang): When core temperatures are high enough, nuclear fusion ignites, and stars are born. Lifecycle of stars: Stellar Nebula : Stars form from collapsing clouds of gas and dust. Protostar: As the nebula collapses, a protostar forms and heats up. Groups of stars that have newly formed from molecular clouds are commonly referred to as stellar clusters . Molecular clouds that contain many of these clusters are known as stellar nurseries . Main Sequence: Star enters a stable phase, fusing hydrogen into helium. Low-Mass Stars (mass Red Giant: Exhausts hydrogen, expands, and cools. Planetary Nebula: Outer layers shed. White Dwarf: Core remains, cools over time. It may convert into a black dwarf over time, but we do not have any solid proof of this as of now. High-Mass Stars (mass > 8 times that of the sun): Red Supergiant: Similar process but on a larger scale. Supernova: Catastrophic explosion after iron buildup in core. Neutron Star/Black Hole: The remnant core collapses into a neutron star or black hole, depending on mass. If it's between 8-20/25 times the mass of the sun, we get Neutron stars. If it's more, we get Black Holes. Chandrashekhar Limit: If after the shedding of the outer layers, due to supernova, or without it, the mass of the remaining core is less than 1.44 times the mass of the sun , we get a white dwarf. Otherwise, we get a neutron star (1.44-3) or a black hole (>3)."}, {"c": 1, "n": "Geomorphology", "id": "s10", "t": "Population 3, 2 and 1 stars", "x": "Stars are classified into populations based on their metallicity, which refers to the abundance of elements heavier than hydrogen and helium. Population III Stars (Hypothetical): These are theorized to be the very first stars born in the universe, hundreds of millions of years after the Big Bang. Extremely Metal-Poor: They are believed to have been almost entirely composed of hydrogen and helium, with virtually no heavier elements because those elements hadn't been forged in abundance yet. Massive and Short-Lived: Due to their large size, they are thought to have been incredibly massive and short-lived, burning out rapidly in a few million years. Direct evidence for their existence has not yet been found. Do not have a planetary system. Population II Stars (Oldest Observed; 5-10 bya): These are the oldest stars still observable in the Milky Way galaxy. Metal-Poor: They contain very little of the heavier elements compared to younger stars. Location: Population II stars are typically found in the galactic halo (spherical region surrounding the disk) and globular clusters (dense collections of millions of old stars). Slower Evolution: Due to their lower metallicity, they evolve more slowly and have longer lifespans than stars with higher metal content. Population I Stars (Younger and Richer in Metals; 4-5 bya) : These are the younger stars, including our Sun. Metal-Rich: They contain a higher proportion of heavier elements compared to Population II stars. This enrichment is due to previous generations of stars that lived, died, and scattered these elements into the interstellar medium. Location: Population I stars are found in the galactic disk (flattened disc where most stars and gas reside) and spiral arms of the Milky Way. Faster Evolution: Their higher metallicity can lead to faster stellar evolution and shorter lifespans compared to Population II stars."}, {"c": 1, "n": "Geomorphology", "id": "s11", "t": "Neutron Stars", "x": "Neutron stars are extremely dense stellar remnants formed from the collapsed core of massive stars (about 8-25 times the mass of the Sun) after a supernova explosion. They are composed almost entirely of neutrons and have incredibly strong gravitational and magnetic fields. Sometimes they can accrete mass from their surroundings to collapse into black holes. Pulsars: Rapidly rotating neutron stars that emit beams of electromagnetic radiation from their magnetic poles, observed as regular pulses."}, {"c": 1, "n": "Geomorphology", "id": "s12", "t": "Black Holes", "x": "Black holes are regions of spacetime with gravitational pull so strong that nothing, not even light, can escape from them. (For reference, Earth’s escape velocity is 11.8 m/s.) They form from the remnants of massive stars (more than 25 times the mass of the Sun) after they undergo a supernova explosion and collapse under their own gravity. Event Horizon: The boundary around a black hole beyond which nothing can escape. Accretion Disks: Disks of gas and dust spiraling into black holes , emitting intense radiation due to friction and heating. Accretion Disk, then event horizon, then the void. Gravitational Waves: Ripples in spacetime produced by the acceleration of massive objects like merging black holes, detectable by observatories like LIGO (Laser Interferometer Gravitational-Wave Observatory; Nobel prize in 2017) and Virgo . Spaghettification: Spaghettification is the process where objects are stretched and torn apart by intense tidal forces as they approach a black hole. Hawking Radiation: Hawking radiation is the theoretical emission of particles from black holes due to quantum effects near the event horizon, leading to gradual black hole evaporation ."}, {"c": 1, "n": "Geomorphology", "id": "s14", "t": "Components of the Solar System", "x": "The Sun: The central star of the solar system, a massive ball of hydrogen and helium undergoing nuclear fusion. Planets: Major celestial bodies orbiting the Sun , classified as terrestrial (Mercury, Venus, Earth, Mars) and gas giants (Jupiter, Saturn) or ice giants (Uranus, Neptune). In recent years, astronomers have proposed the existence of a ninth planet, nicknamed \" Planet Nine ,\" or “ Planet X, ” to explain the unusual orbital patterns of some objects in the Kuiper Belt , a region beyond Neptune. If Planet Nine exists, it is hypothesized to be a gas or ice giant , potentially 5-7 times Earth's mass , and located very far from the Sun , possibly 200 times farther than Earth. Dwarf Planets: Celestial bodies orbiting the Sun that are spherical but have not cleared their orbital path. The solar system has 5 known dwarf planets: Pluto (the biggest), Ceres (the biggest object in the asteroid belt), Eris, Haumea, and Makemake (the newest). What are the criteria for calling a body a dwarf planet? o In orbit around the Sun : The object must be gravitationally bound to the Sun and travel in an orbit around it. o Massive enough for hydrostatic equilibrium (nearly round shape) : The object's own gravity must be strong enough to pull it into a roughly round shape, overcoming the forces of its rigid body. This is in contrast to asteroids, which are irregularly shaped due to their weaker gravity. o Not a satellite (moon) of another object: The object cannot be gravitationally bound to another planet or large object and act as its moon. o Has not cleared the neighborhood around its orbit: This is the key distinction between a dwarf planet and a full-fledged planet. The object's gravity must not be strong enough to have cleared the path around its orbit of other objects of comparable size. (Orbit of Pluto and Neptune intersects.) Moons: Natural satellites orbiting planets and dwarf planets. Moons in our Solar system: 0 for Mercury & Venus (has a Quasi-satellite called Zoozve), 1 for Earth; 2 for Mars; 101 at Jupiter; 274 at Saturn; 28 at Uranus; 16 at Neptune; and five for dwarf planet Pluto. Jupiter has the biggest moon in our solar system, Ganymede. Quasi-Moons: Quasi-moons are asteroids that orbit the Sun while staying close to a planet . A quasi-satellite’s orbit is usually more oblong and less stable than the planet's orbit. In time, the shape of a quasi-satellite’s orbit may change, and it may move away from the planet. Kuiper Belt: A region beyond Neptune filled with icy bodies and dwarf planets. In addition to rock and water ice, objects in the Kuiper Belt also contain a variety of other frozen compounds like ammonia and methane. Distance from the sun is about 30-50 AU (1 Astronomical Unit = 149.6 million km). o The Kuiper Belt is gradually wearing down as objects within it occasionally collide, breaking into smaller fragments, which can include comets and dust that gets carried out of the solar system by solar wind. Oort Cloud: A distant spherical shell of icy objects surrounding the solar system , believed to be the source of long-period comets. o The Oort Cloud is believed to begin around 2,000 to 5,000 AU from the Sun, while its outer boundary is estimated to lie between 10,000 and 100,000 AU away. Asteroids: Small rocky bodies , primarily found in the asteroid belt between Mars and Jupiter . Asteroids vary in size, from Vesta , the largest at approximately 329 miles (530 kilometers) wide, to much smaller objects measuring under 33 feet (10 meters) . Altogether, the combined mass of all asteroids is still less than the mass of Earth’s Moon . o Trojans: These asteroids share an orbit with a larger planet, but do not collide with it because they gather around two special places in the orbit (called the L4 and L5 Lagrangian points ). o Lagrangian points are positions in space where the gravitational forces of two large bodies , like the Earth and Sun, balance the centripetal force felt by a smaller object . These points allow the"}, {"c": 1, "n": "Geomorphology", "id": "s15", "t": "PYQ", "x": "Q.1) The term 'Goldilocks Zone' is often seen in the news in the context of (2015) (a) the limits of habitable zone above the surface of the Earth (b) regions inside the Earth where shale gas is available (c) search for the Earth-like planets in outer space (d) search for meteorites containing precious metals Answer - C Explanation: Goldilocks zone is the distance from the star, where the temperature is such that water can stay in Liquid form. Earth lies in the Goldilocks Zone of the Sun. If we wish to find life form similar to that found on the Earth, then we need to search for the planets lying in the Goldilocks zone of their respective stars. Q.2) What is the difference between asteroids and comets? (2011) 1. Asteroids are small rocky planetoids, while comets are formed of frozen gases held together by a rocky and metallic material. 2. Asteroids are found mostly between the orbits of Jupiter and Mars, while comets are found mostly between Venus and mercury. 3. Comets show a perceptible glowing tail, while asteroids do not. Which of the statements given above is/are correct ? 1 and 2 only 1 and 3 only 3 only 1, 2 and 3 Answer. B Explanation The main difference between asteroids and comets is their composition, as in, what they are made of Asteroids are made up of metals and rocky material, while comets are made up of ice, dust and rocky material. Both asteroids and comets were formed early in the history of the solar system about 4.5 billion years ago. Asteroids formed much closer to the Sun, where it was too warm for ice to remain solid. Comets formed farther from the Sun where ice would not melt. Comets which approach the Sun lose material with each orbit because some of their ice melts and evaporates to form a tail. Asteroids are a series of very small planets or fragments of planets lying between the orbits of Mars and Jupiter. They revolve around the Sun in the same way as planets, unlike comets."}, {"c": 1, "n": "Geomorphology", "id": "s16", "t": "PLANETS", "x": "Venus and Uranus rotate from East to West. The Axis of Uranus is parallel to its orbit. The Giant and the Little red spots are a defining feature of Jupiter. They are huge storms. The former is 16000 km in diameter while the latter is 3500 km in diameter. Atmosphere of different Planets: o Mercury: Very thin, most of it is lost due to solar storms o Venus : thick atmosphere, mainly made of CO2, making the planet super-hot due to the greenhouse effect. o Mars: Very thin, rich in CO2 o Jupiter and Saturn: Hydrogen and Helium with the addition of some sulphurous and carbon gases. o Uranus and Neptune : Mainly Methane and Ammonia"}, {"c": 1, "n": "Geomorphology", "id": "s17", "t": "THE SUN", "x": "Composition: 71% Hydrogen; 27.1% Helium; 0.97% Oxygen; 0.4% Carbon, trace amount of other elements. Interior: o Core: Nuclear fusion takes place here. The temperature here is over 15 million degrees C. o Radiative Zone : Region in which energy transfer is through thermal radiation instead of convection. (Radiation: emission or transmission of energy in the form of electromagnetic waves or particles.) o Convective Zone: The convection cells move in this zone for energy transportation. (Convection: transfer of heat through the movement of a fluid (such as air or water) caused by differences in temperature and density.) The Sun is made up of hot gases, so it lacks any \"surface\" like earth. Instead, as we move from the Sun’s outer atmosphere toward the Sun's core, the gas gets denser and denser. Atmosphere: Photosphere: Sun’s outer atmosphere is transparent, but when we try to look through the atmosphere deeper into the Sun, our view is blocked. The photosphere is the layer that begins where the Sun starts to look opaque Chromosphere: layer above the photosphere. Outer chromosphere is about 10,000 degrees C. Corona: Layer of hot plasma which extends millions of kilometers into the space from the surface of the chromosphere and has an irregular shape. Coronal Mass Ejection: Large expulsions of plasma and magnetic field from the Sun’s corona . 15-18 hours to reach Earth. Can be slower. Expand as they move away from the sun. Solar Winds: Solar wind is a stream of charged particles released from the upper atmosphere of the Sun (Corona). Solar wind is created by the outward expansion of plasma. Plasma is continually heated to the point that the Sun's gravity can't hold it down. Solar flares: Tremendous explosions due to the release of energy in twisted magnetic fields (Like when rubber bands come back to their original size.) It causes a sudden flash of increased brightness on the Sun. Can be, but not always, associated with CMEs . Release X-rays & UV radiations . Flares are categorized according to their strength (energy output). The smallest ones are A-class, followed by B, C, M and X, the largest. Geomagnetic Storms: When Earth is in the path of CME. Impacts: Technological Systems: Satellite malfunction: In 2022, a minor geomagnetic storm caused the failure of 40 Starlink satellites. Navigation errors: GPS signal degradation affects civil aviation and defence navigation. Power Infrastructure: Grid failure risks: The 1989 Quebec blackout exemplifies how CMEs induce geomagnetically induced currents (GICs), damaging transformers. Aviation and Space: Polar flights face increased radiation exposure, forcing rerouting. Astronauts aboard the ISS require radiation shielding during intense solar events. Military and Strategic Systems: Ballistic missile early warning systems and radar operations can be temporarily disabled. Auroras Auroras: Aurora (polar light) is a natural phenomenon which is characterised by a display of lights in the Polar region skies. Solar wind has charged protons and electrons that excite atmospheric Oxygen and Nitrogen. When Oxygen and Nitrogen return from excited states to the ground state, they release Photons, which are displayed as the Aurora lights. Northern Hemisphere: Aurora Borealis Southern Hemisphere: Aurora Australis Why are auroras only on the poles? Earth is a magnet. Currently, the North and the South Poles of this magnet are near our geographical North and South Poles. The charged particles get attracted towards the magnetic Poles. This causes auroras at the geographical north and south poles. Van Allen Radiation Belt: The Van Allen radiation belts consist of charged particles trapped by Earth's magnetic field , forming doughnut-shaped regions around the planet. They protect Earth from solar radiation but can pose risks to spacecraft passing through them. The inner and outer radiation belts are two distinct regions within the Van Allen radiation belts surrounding Earth. The inner belt is composed mainly"}, {"c": 1, "n": "Geomorphology", "id": "s19", "t": "Phases:", "x": "Crust formation: Light substances floated up from deep inside , and then they changed into hard rocks after cooling. As the earth’s interior continued to cool, it contracted, and the outer crust wrinkled forming ridges and basins. Atmosphere Formation: Degassing: lighter substances swarmed up above the earth’s surface forming an atmosphere of gases. Happened in 3 phases: Early Atmosphere was rich in Hydrogen and Helium . These gases were eventually stripped away by solar wind. Stage 2: The volcanic activities on partially solidified Earth, led to the release of gases like Co2, Nitrogen Oxides, Sulphur Oxides and water vapour . The water vapour released formed clouds and led to the formation of oceans through rainfall. Stage 3: As life evolved on Earth, the configuration of the atmosphere changed, and the concentration of Oxygen started to increase. Ocean Formation: o Atmospheric Gases formed the Clouds, which cause heavy rains for thousands of year o This water was collected in basins, forming oceans. o Then life started in the ocean . Life on Earth: o 4.5 Billion Years Ago: Earth forms, hot and bombarded by asteroids. o Over the next billion years: As Earth cools, conditions become favorable for complex molecules to form in the oceans. o Around 3.8 Billion Years Ago: Simple life emerges , possibly near deep-sea vents, utilizing chemicals for energy (not sunlight). These were likely single-celled organisms (blue-green algae) with basic building blocks of life. o Proof: Chemical Biogenesis or the Miller-Urey experiment, conducted in 1953 by Stanley Miller and Harold Urey. It proved that in plausible early Earth conditions, organic molecules important for life could arise naturally. Inorganic molecules could convert to organic ones. This can lead to the creation of necessary amino acids, essential for the creation of single-celled organisms that could divide. o LUCA: Last Universal Common Ancestor. Might have existed about 4.2 billion years ago."}, {"c": 1, "n": "Geomorphology", "id": "s20", "t": "EARTH FACTS:", "x": "Titled on Axis : 23.5 degrees from the vertical. ( towards Pole/North Star ) According to a study, between 1993 and 2010, excessive groundwater extraction, particularly in regions like northwestern India and western North America, caused Earth's rotational pole to drift approximately 80 centimeters eastward (0.00000719 degrees). Melting of ice caps in higher latitudes, and migration of water to lower latitudes, is also causing changes in Earth’s axis. 1 rotation: 23 hrs 56 mins 4.1 seconds (sidereal day). Speed of rotation is reducing due to: Wind and wave friction. Movement of moon away from us. Slowdown of the Core, and its movement in opposite direction. Looking down at the North Pole from space, Earth is rotating in a counterclockwise direction. Revolution in elliptical orbit. 365 days, 5 hours and 48 minutes (sidereal year) . Aphelion: Point of the Earth’s orbit that is farthest away from the Sun . Perihelion: Point of the Earth’s orbit that is nearest to the Sun ."}, {"c": 1, "n": "Geomorphology", "id": "s21", "t": "Geomagnetism", "x": "Paleomagnetic studies of rocks and ocean sediment have demonstrated that the orientation of the earth's magnetic field has frequently alternated over geologic time . Flips every 2-3 lakh years. Periods of \"normal\" polarity (i.e., when the north-seeking end of the compass needle points toward the present north magnetic pole, as it does today) have alternated with periods of \"reversed\" polarity (when the north-seeking end of the compass needle points southward). Currently, there has been an accelerated movement of Earth's magnetic North Pole towards Russia. The magnetic North Pole has been drifting from northern Canada into the Arctic Ocean and towards Siberia since the 1990s, with its speed varying over time Importance of Earth’s magnetic Field: Protects Earth from harmful solar wind and charged particles. Prevents excessive atmospheric loss into space. Creates the magnetosphere around Earth, which contains the Van Allen Belts. (Magnetic field = force; magnetosphere = zone of influence of that force) Causes auroras (Northern and Southern Lights) near polar regions. Helps in navigation using magnetic compasses. Important for migratory animals and birds for orientation. Protects satellites, communication systems, and power grids from solar storms. Maintains conditions suitable for life on Earth."}, {"c": 1, "n": "Geomorphology", "id": "s22", "t": "MOON", "x": "The moon is Earth's only natural satellite. It orbits the Earth at an average distance of 384,400 km. The moon is a bit more than one-fourth (27%) the size of Earth. Its gravity influences Earth's tides. Size : 27% of the Earth. Perigee : The point on the Moon's orbit closest to the Earth . Apogee: The point on the Moon's orbit farthest away from the Earth . Tidally locked to the Earth: This means that the moon always shows one face to the Earth . Earth’s gravitational interaction slowed down the moon’s rotation until it became tidally locked. Phases of the Moon Creation: Fission Theory, George Darwin (1838): The Moon once formed part of the rapidly spinning Earth , which flung off a large chunk due to the centrifugal force, creating the Moon. This explains the Moon's receding path from Earth and Earth's slightly bulging equatorial region. Not accepted anymore. Giant Impact Hypothesis (Big Splash): collision between the proto-Earth and a Mars-sized planet (called Theia) , around 4.5 bn years ago created the Moon. Binary Exchange Capture Theory (Proposed): The moon was not born out of Earth, but was infact part of a binary system of celestial objects. When they came close to the Earth, earth captured one and expelled away the other part of the binary system."}, {"c": 1, "n": "Geomorphology", "id": "s23", "t": "ECLIPSES:", "x": "Lunar Eclipse: Earth between the Sun and the Moon Umbra: darkest region of a shadow Penumbra: region in which only a portion of the light source is blocked by the occluding body. Blood Moon: When the whole of the lunar disc enters the Earthʼs umbra , the Moon appears reddish. Blue Moon: Not related to the eclipses. When we get 2 full moons in a month, the 2 nd one is called Blue Moon. Solar Eclipse: Moon Between Earth and the Sun. The moon blocks the light of the sun from reaching the Earth’s surface and casts a shadow (Umbra) on the Earth. Annular Solar Eclipse: When the Moon passes directly between the Earth and the Sun but does not completely cover the Sun's disk , as the Moon is farther away from Earth, making its shadow on Earth smaller. Total Solar Eclipse: When the moon completely covers the sun , as it is closer to the Earth. It also leads to the Diamond ring effect (As the Moon moves across the face of the Sun, a point comes when only a single bright spot of sunlight remains visible, looking much like a shining diamond.) Partial Solar eclipse can be due to 2 reasons: When sun, moon and the earth are not in a straight line , only a penumbra region is formed, causing partial eclipse. When they are in a straight line, some regions see a full solar eclipse (umbra) while some see a partial one (penumbra). All Lunar eclipses are Full Moon days but not all Full Moon days are Lunar Eclipses. All Solar Eclipses are New Moon days but not all New moon days are solar eclipse days. This is because the moon’s orbital plane is titled at 5 degrees compared to Earth-Sun orbital plane."}, {"c": 1, "n": "Geomorphology", "id": "s24", "t": "Latitudes and Longitudes:", "x": "Imaginary lines created to make it easy to locate places on the Earth. Latitudes: Parallel lines running in east-west directions are latitudes. Longitudes: Lines running North to South and meeting each other at the poles are the longitudes. Climatic Zones Time Zones Earth takes 4 minutes to rotate by 1 degree longitude Earth rotates from West to East, that’s why Eastern locations experience the sun before west , and are thus ahead in time compared to western locations. The International Date Line exists to maintain a standard calendar day globally by marking the point where the date changes by one day when crossing time zones."}, {"c": 1, "n": "Geomorphology", "id": "s26", "t": "PYQ", "x": "Q.1) If a major solar storm (solar flare) reaches the Earth, which of the following are the possible effects on the Earth ? (2022) 2. GPS and navigation systems could fail. 3. Tsunamis could occur at equatorial regions. 4. Power grids could be damaged. 5. Intense auroras could occur over much of the Earth. 6. Forest fires could take place over much of the planet. 7. Orbits of the satellites could be disturbed. 8. Shortwave radio communication of the aircraft flying over polar regions could be interrupted. Select the correct answer using the code given below: (a) 1, 2, 4 and 5 only (b) 2, 3, 5, 6 and 7 only (c) 1, 3, 4, 6 and 7 only (d) 1, 2, 3, 4, 5, 6 and 7 Answer - C Explanation: (e) Solar storms can play a havoc on the electrical and electronic systems of the Earth, affecting power systems, satellite communication, nd can cause intense auroras. In May 2024 one such intense solar storm caused the auroras to be seen as far away from the pole as Leh in India. (f) Tsunamis require vertical shift of water which is not caused by the flares. These flare are not related to increased temperature on earth, so they do not cause forest fires. Q.2) Which one of the following sets of elements was primarily responsible for the origin of life on the Earth? (2012) Hydrogen, Oxygen, Sodium Carbon, Hydrogen, Nitrogen Oxygen, Calcium, Phosphorus Carbon, Hydrogen, Potassium Answer. B Explanation The correct answer to this question, as most of you know, is Carbon, Hydrogen and Nitrogen. In fact, the early biochemistry was not simply the reactions of Carbon, Hydrogen, Nitrogen and Oxygen was a bit far from it, was CO2, N and water resulting in the organic acids such as oxalic acid. The infrared part of solar radiation. The increasing amount of carbon dioxide in the air is slowly raising the temperature of the atmosphere because it absorbs the infrared part of the solar radiation. Only water vapour has the ability to absorb both incoming UV and outgoing infrared radiation. Q.3) A person stood alone in a desert on a dark night and wanted to reach his village which was situated 5 km east of the point where he was standing. He had no instruments to find the direction but he located the polestar. The most convenient way now to reach his village is to walk in the: (2012) direction facing the polestar a direction opposite to the polestar direction keeping the polestar to his left direction keeping the polestar to his right Answer. C Explanation The correct answer is direction, keeping the pole star to his left. In ancient times, people used to determine directions during the night with the help of stars. The North star indicates the north direction. It is also called the Pole Star. Q.4) Variations in the length of daytime and nighttime from season to season are due to - (2013) 4. The earth’s rotation on its axis 5. Revolution of the earth on a tilted axis 6. Latitudinal position of the place 7. The earth’s revolution around the sun in an elliptical manner Answer. B Explanation Had the axis of the Earth been perfectly perpendicular to the plane of the ecliptic, the sun rays would have been vertical over the equator all year round and the amount of energy received at any place would have remained constant throughout the year; hence no change of seasons. Also in that situation, the days and nights all over the earth would have been exactly equal throughout the year as it happens at the time of equinoxes. The change between day and night is caused by the rotation of the Earth on its axis. ... The changing length of days and nights depends on where you are on Earth and the time of year. Also, daylight hours are affected by the tilt of the Earth's axis and its path around the sun. As the Earth moves around the Sun, the length of the day changes. ... This is all caused by the 23.5-degree tilt of the Earth's axis as it travels around the sun. In the Northern Hemisphere, days are longest at the time of the summer solstice in June, and the shortest days are at th"}, {"c": 1, "n": "Geomorphology", "id": "s27", "t": "INTERIOR OF THE EARTH", "x": "Why do we need to know about this? Understanding the earth's interior is essential to understanding the nature of changes that take place over and below the earth's surface. To understand geophysical phenomena like volcanism, earthquakes, etc. To understand the internal structure of various objects of the solar system. To understand the evolution and present composition of the atmosphere. Future deep-sea mineral exploration etc."}, {"c": 1, "n": "Geomorphology", "id": "s28", "t": "Sources:", "x": "Direct Sources: Facilitate direct observation of what’s under the surface. Deep Earth mining and Drilling (deepest mine: Mponeng gold mine and TauTona gold mine in South Africa at 3.6km; deepest drilling 12km in Kola peninsula, Russia). Volcanic Eruptions : Bring the material inside the Earth to the surface, giving us an insight into what is present under the Earth. Indirect Sources : Help us statistically extrapolate what’s inside the Earth. Meteors and other celestial bodies (other planets, moons, etc): Similar formation Process as Earth. So, the internal structure of these bodies will be similar to that of the Earth. Helps in expanding our imagination as to how Earth would look from the inside. Gravitation : Gravity value is not the same everywhere, and this is known as a gravitational anomaly, helps us identify material distribution inside the earth. Wherever heavier materials have accumulated, gravitational force will be higher as it is directly proportional to the mass of the bodies in question. Shifts in our magnetic fields: Our magnetic field constantly keeps moving. It reverses in approximately 200000 to 300000 years. It is the material inside the earth that is responsible for the magnetic field. This reversal gives us the idea that the material inside the earth can move. Earthquake waves: Body waves that are generated during earthquakes are by far the best indirect source of information. (Details in the earthquake section.) Other minor sources and observations: Volcanic eruptions and existence of hot springs, geysers etc. point to an interior which is very hot. The high temperatures are attributed to automatic disintegration of the radioactive substances. Gravitation and the diameter of the earth helps in estimating pressures deep inside"}, {"c": 1, "n": "Geomorphology", "id": "s29", "t": "LAYERS OF EARTH", "x": "Earth’s layers are identified by studying various direct and indirect sources. The structure of the earth's interior is made up of several concentric layers. Broadly based on chemical properties, three layers of earth can be identified— crust, mantle, and core."}, {"c": 1, "n": "Geomorphology", "id": "s30", "t": "Crust: 30-50 km", "x": "The outer thin layer of the Earth. It has 2 parts: the denser oceanic (basaltic) and the lighter continental (granitic) crust. The outer covering of the crust is of sedimentary material (granitic rocks) and below that lie crystalline, igneous and metamorphic rocks which are acidic in nature. The lower layer of the crust consists of basaltic and ultra-basic rocks. Oceanic crust (SiMa) denser and thinner (5-30km) Continental Crust (SiAl) lighter and thicker (50-70km). The continental crust is thicker in the areas of major mountain systems . It is as much as 70 -100 km thick in the Himalayan region. The continental and the oceanic crusts are separated by the Conrad discontinuity. It forms 0.5-1.0 per cent of the earth’s volume."}, {"c": 1, "n": "Geomorphology", "id": "s31", "t": "Mantle:", "x": "Mohorovicic Discontinuity to 2900km (Gutenberg Discontinuity) . It forms 83% of Earth’s volume . Denser than crust (upper is 2.9-3.3g/cm3; lower is 3.3-5.7g/cm3; average density 4.5g/cm3). The crust and the uppermost part of the mantle are called LITHOSPHERE . Its thickness ranges from 10-200 km . It is Brittle in nature. Below the Lithosphere lies the ASTHENOSPHERE, till 400 km depth . It is a semi-solid molten layer, entirely within the mantle. This layer is the source of Magma. The lower mantle extends beyond the asthenosphere. It is in solid state. The upper and the lower mantle are separated by Repetti Discontinuity. The mantle and the core are separated by Gutenberg Discontinuity."}, {"c": 1, "n": "Geomorphology", "id": "s32", "t": "Core: 2900-6400km", "x": "Lies between 2900 km and 6400 km below the earth's surface. It accounts for 16 per cent of the earth's volume . Core has the heaviest mineral materials of the highest density. It is composed of nickel and iron [NiFe] . The outer core is liquid while the inner core is solid . They are separated by Lehman’s Discontinuity. Discontinuities : the places inside the Earth’s crust where the seismic waves experience an abrupt change in their velocities and/or direction."}, {"c": 1, "n": "Geomorphology", "id": "s33", "t": "PYQ", "x": "Q.1) How does the Juno Mission of NASA help to understand the origin and evolution of the Earth? (2017, 10m)"}, {"c": 1, "n": "Geomorphology", "id": "s34", "t": "EARTHQUAKES", "x": "Abrupt release of energy along a fault causes earthquake waves. A fault is a sharp break in the crustal rock layer. Rocks along a fault tend to move in opposite directions. But the friction exerted by the overlying rock strata prevents the movement of the rock layer. With time pressure builds up. Under intense pressure, the rock layer, at a certain point, overcomes the friction offered by the overlying layer and undergoes an abrupt movement generating shockwaves. This causes a release of energy , and the energy waves travel in all directions . The point where the energy is released is called the focus of an earthquake, alternatively, it is called the hypocentre. The point on the surface, nearest to the focus , is called the epicentre ."}, {"c": 1, "n": "Geomorphology", "id": "s35", "t": "Seismic waves", "x": "Recorded by Seismographs installed across the world in Seismic stations. Body Waves: Generated due to the release of energy at the focus and move in all directions travelling through the body of the earth. P-waves & S-waves are the 2 body waves. The velocity of the Body waves changes as they travel through materials with different elasticity (stiffness) (Generally density with few exceptions). The more elastic the material is, the higher the velocity . Their direction also changes as they reflect or refract when coming across materials with different densities. When an earthquake or underground nuclear test sends shock waves through the Earth, the cooler areas, which generally are rigid, transmit these waves at a higher velocity than the hotter areas. The body waves interact with the surface rocks and generate new sets of waves called surface waves. P-waves : o Longitudinal or Compressional Waves o Particles of the medium vibrate along the direction of propagation of the wave . o Fastest, first to arrive ; Primary Waves o Their velocity depends on the shear strength or elasticity of the material. o Can travel in all mediums: Velocity in Solids > Liquids > Gases. o Shadow zone: 103-143 degrees on both sides . o This gives clues about Solid inner core S-waves: o Transverse or distortional waves. o Analogous to water ripples or light waves. o Arrive at the surface with some time lag. Secondary waves . o Travel at varying velocities (proportional to shear strength) through the solid part of the Earth's crust, mantle. o Cannot pass through gases or liquids. o Particles move perpendicular to the direction of propagation of the wave. o Shadow zone: between 103 degrees and 180 degrees . o This observation led to the discovery of a liquid outer core . Since S waves cannot travel through liquid, they do not pass through the liquid outer core. L-Waves: o Love waves. o Shear surface waves (transverse like the S-waves) o Have the highest velocity of all surface waves and can cause significant horizontal shaking of the ground. o 3rd to reach the seismograph. o Cause displacement of rocks , and hence, the collapse of structures occurs. R-Waves: o Rayleigh Waves. o They are characterized by an elliptical or rolling motion that combines both vertical and horizontal particle motion. This motion is similar to the motion of ocean waves. o Slowest surface waves o Responsible for Tsunamis due to the vertical shift. 8. Shadow Zones: (i) The Body waves get recorded in seismographs located at far-off locations. However, there exist some specific areas where the waves are not reported. Such a zone is called the ‘shadow zone’. (ii) The study of different events reveals that an altogether different shadow zone exists for each earthquake. (iii) It was observed that seismographs located at any distance within 103° from the epicentre, recorded the arrival of both P and S-waves. (iv) However, the seismographs located beyond 143 ° from the epicentre, record the arrival of P-waves, but not that of S-waves. (v) Thus, a zone between 103° and 143° from the epicentre was identified as the shadow zone for both types of waves. The entire zone beyond 103 ° does not receive S-waves. (vi) The shadow zone of the S-wave is much larger than that of the P-wave. The shadow zone of P-waves appears as a band around the earth between 103 ° and 143 ° away from the epicentre. (vii) The shadow zone of S-waves is not only larger in extent, but it is also a little over 40 per cent of the earth's surface. How does this help us determine Earth’s interior ? o Reflection causes waves to rebound whereas refraction makes waves move in different directions. o The variations in the direction of waves are inferred with the help of their record on seismographs. o Change in densities greatly varies the wave velocity. By observing the changes in velocity, the density of the earth can be estimated. o By observing the changes in the direction of the waves (emergence of shadow zones), different l"}, {"c": 1, "n": "Geomorphology", "id": "s37", "t": "Endogenic Forces:", "x": "Caused due to the internal energy of the Earth . This energy is mostly generated by radioactivity, rotational and tidal friction and primordial heat from the origin of the earth. This energy due to geothermal gradients and heat flow from within induces diastrophism and volcanism in the lithosphere. Can be of 2 types: Diastrophic and Sudden movements. Diastrophism: bending, folding, warping (bending and twisting of a large area) and fracturing . Orogenic processes involving mountain building through severe folding and affecting long and narrow belts of the earth’s crust. Tension and Compression . Horizontal forces and vertical effects. Epeirogenic processes involving uplift/subsidence or warping of large parts of the earth’s crust. Vertical forces and horizontal effects. Epeirogenic or continent-forming movements act along the radius of the earth ; therefore, they are also called radial movements . Their direction may be towards (subsidence) or away (uplift) from the centre. The results of such movements may be clearly defined in the relief. Upliftment examples: Colorado Plateau, Brazilian Highlands, Australian Shield, Siberian Platform. Subsidence examples: Siberian Basin, Konkan region. Orogeny is a mountain-building process whereas epeirogeny is a continent-building process. Sudden Movements: Include earthquakes and volcanism involving local relatively minor movements. Due to their sudden-ness, cause a large amount of destruction , and are included under natural disasters. Can also cause upliftment or submergence . The 2004 Indian Ocean earthquake caused Indira Point to submerge. An earthquake in New Zealand (1885) caused an upliftment of up to 3 metres in some areas while some areas in Japan (1891) subsided by 6 metres after an earthquake. Through the processes of orogeny, epeirogeny, earthquakes and plate tectonics, there can be faulting and fracturing of the crust."}, {"c": 1, "n": "Geomorphology", "id": "s38", "t": "Exogenic Forces:", "x": "A direct result of stress induced in earth materials due to various forces that come into existence due to the sun's heat . Temperature and precipitation are the two important climatic elements that control various processes by inducing stress in earth materials. Weathering, Erosion, Deposition & Mass Movement."}, {"c": 1, "n": "Geomorphology", "id": "s39", "t": "Denudation", "x": "All the exogenic geomorphic processes are covered under a general term, denudation."}, {"c": 1, "n": "Geomorphology", "id": "s40", "t": "Types of Weathering:", "x": "Chemical: Change in chemical composition Solution/Hydration: Rocks formed of water-soluble minerals. Soluble rock-forming minerals like nitrates, sulphates, potassium, etc. are affected. Carbonation : CO2 and water form Carbonic acid , which reacts with rocks. Oxidation: combination of a mineral with oxygen to form oxides . Iron, Manganese, Sulphur rich rocks experience this. Reduction : When oxidized minerals are placed in an environment where oxygen is absent . E.g. Red iron oxides turn greenish or bluish grey. Physical: Due to gravity, temperature and moisture changes, agents of erosion, and biological activity. Unloading and Expansion: Removal of load from above the rocks, and resultant expansion of rocks, cracking and weathering. Granular Disintegration ( sedimentary rocks ): Rocks composed of coarse mineral grains commonly fall apart grain by grain or undergo granular disintegration. Exfoliation (diurnal temperature changes): Onion Peeling With rise in temperature, every mineral expands and pushes against its neighbor and as temperature falls, a corresponding contraction takes place. Because of diurnal changes in the temperatures , this internal movement among the mineral grains takes place regularly. This process is most effective in dry climates and high elevations where diurnal temperature changes are drastic. The surface layers of the rocks tend to expand more than the rock at depth and this leads to the formation of stress within the rock resulting in heaving and fracturing parallel to the surface. Exfoliation results in smooth rounded surfaces in rocks. Block separation: This type of disintegration takes place in rocks with numerous joints acquired by mountain-making pressures or by shrinkage due to cooling. This type of disintegration in rocks can be achieved by comparatively weaker forces. Shattering (angular pieces): A huge rock may undergo disintegration along weak zones to produce highly angular pieces with sharp corners and edges through the process of shattering. This occurs when there is a temperature change ; when the rock is exposed to the effects of wind, rain and waves also contributes to disintegration. Frost wedging: During the warm season, the water penetrates the pore spaces or fractures in rocks. During the cold season, the water freezes into ice and its volume expands as a result. This exerts tremendous pressure on rock walls to tear apart even where the rocks are massive. Frost weathering occurs due to the growth of ice within pores and cracks of rocks during repeated cycles of freezing and thawing (melting) . Salt weathering (crystallization): Salts in rocks expand due to thermal action, hydration, and crystallisation . Many salts like calcium, sodium, magnesium, potassium, and barium tend to expand. High-temperature ranges in deserts favour such salt expansion. Salt crystals in near-surface pores cause the splitting of individual grains within rocks, which eventually fall off. This process of falling off of individual grains may result in granular disintegration or granular foliation. Biological: Burrowing and wedging exposes more surface for physical or chemical weathering Physical weathering by plant roots and human actions Chemical weathering by: Decaying plant and animal matter help in the production of humic, carbonic, and other acids which enhance decay and solubility of some elements. Removal of minerals by algae and plants . MASS MOVEMENTS: Movement of material ONLY under the impact of gravity. Significance of Denudation: Soil formation and enrichment Helps in the enrichment and concentrations of certain valuable ores of iron, manganese, aluminium, copper etc. Landform Creation"}, {"c": 1, "n": "Geomorphology", "id": "s41", "t": "PYQ", "x": "Q1.) Consider the following statements : In a seismograph, P waves are recorded earlier than S waves. In P waves, the individual particles vibrate to and fro in the direction of Wave propagation whereas. in S waves, the particles vibrate up and down at right angles to the direction of wave propagation. Which of the statements given above is/are correct? (2023) 1 only 2 only Both 1 & 2 Neither 1 nor 2 Ans: C Explanation: P or Primary waves are the fastest seismic waves, thats why they are the first to be received. P waves are longitudinal, i.e. direction of propagation of waves and the direction of movement of particles is the same. S waves are transverse i.e. particles move perpendicular to the movement of the wave."}, {"c": 1, "n": "Geomorphology", "id": "s43", "t": "Earlier Theories:", "x": "Permanency Theory Works of Antonio Pellegrini (1858) : identical fossil plants in North American and European coal deposits could be explained if the two continents had formerly been connected. Edward Suess (late 19th century) : large ancient continents had been composed of several of the present-day smaller ones Continental Drift Theory by F. B. Taylor : arcuate (bow-shaped) mountain belts of Asia and Europe resulted from the creep of the continents toward the Equator ."}, {"c": 1, "n": "Geomorphology", "id": "s44", "t": "Continental Drift Theory", "x": "By Alfred Wegener in 1912 . There existed one big landmass which he called Pangaea which was covered by one big ocean called Panthalassa . Later , a sea called Tethys Sea divided the Pangaea into two huge landmasses: Laurentia (Laurasia) to the north and Gondwanaland to the south of Tethys. Assumptions: o Free Float of SiAl over SiMa . o Oceanic Crust was passive . o Forces responsible: Tidal force (caused the Westward Movement) & Gravity + Polar Fleeing Force (caused the Equator-ward Movement ). Tidal forces played a bigger role . o Disintegration of Pangea in the Triassic Period (251-199.6 mya; Mesozoic Era). Arguments supporting the theory: o Jigsaw fit of shape: South America and Africa seem to fit in with each other, especially, the bulge of Brazil fits into the Gulf of Guinea. Greenland seems to fit in well with Ellesmere and Baffin islands . The east coast of India, Madagascar and Africa seem to have been joined. o Jigsaw fit of structure (rocks, minerals and fossil deposits): Rich placer deposits of gold are found on the Ghana coast (West Africa), but the source (gold-bearing veins) is in Brazil and it is obvious that the gold deposits of Ghana are derived from the Brazil plateau when the two continents lay side by side. Mesosaurus was a small reptile adapted to shallow brackish water . The fossils of these are found only in South Africa and Iraver formations of Brazil . The two localities presently are 4,800 km apart with an ocean in between them. o Paleoclimatic Evidence: Tillite sedimentary rock formed out of deposits of glaciers. The Gondwana system of sediments from India is known to have its counterparts in six different landmasses of the Southern Hemisphere. The glacial Tillite provides unambiguous evidence of paleoclimates and of the drifting of continents. o Paleomagnetic evidence (not given by Wegener) : The Caledonian and Hercynian mountains of Europe and the Appalachians of the USA seem to be one continuous series. Radiometric Dating has confirmed the presence of similar rocks, 2 billion years old, on both the Brazilian coast as well as West African Coast. Drawbacks: o No free float of SiAl over SiMa . It is the lithosphere that moves over the Asthenosphere. o Ocean Floor is not passive : Hess’s Sea Floor Spread Theory. o Tidal and Gravitational Forces are not enough to cause such massive land masses to move. Convective Currents cause this movement. o He talked about the movement of landmasses only towards the Equator, and the West direction, when the movement was seen in all directions . E.g. Antarctica moved away from the Equator, and Australia moved East. Moreover, India moved in the Northeast direction, initially towards the equator, and later passing it altogether. o Did not mention why the Pangea suddenly broke only precisely in the Triassic period. Why did nothing happen before it?"}, {"c": 1, "n": "Geomorphology", "id": "s45", "t": "Seafloor Spread Theory:", "x": "By Harry Hess in 1960 . Detailed research during World Wars revealed that the ocean floor is not just a vast plain but it is full of relief with mountain ranges, deep trenches, etc. The mid-oceanic ridges were found to be most active in terms of volcanic eruptions. Mid-oceanic ridges prove that ocean floors are not static. Rocks on either side of the crest of oceanic ridges and having equidistant locations from the crest were found to have remarkable similarities both in terms of their constituents and their age. Shallow focus earthquakes at mid-oceanic ridge areas. (Deep focus EQs at the Himalayan belt) Oceanic rocks are much younger than continental , as former subduct."}, {"c": 1, "n": "Geomorphology", "id": "s46", "t": "Convectional Current Theory", "x": "Arthur Holmes in the 1930s According to this theory, the intense heat generated by radioactive substances in the mantle (100-2900 km below the earth's surface) seeks a path to escape and gives rise to the formation of convection currents in the mantle. Rising limbs → divergence; falling limbs → convergence"}, {"c": 1, "n": "Geomorphology", "id": "s47", "t": "Paleomagnetism", "x": "Certain minerals in rocks lock in a record of the direction and intensity of the magnetic field when they form. Give details of both age and the location of formation of the rocks. Basaltic rocks formed in the sea floor spread regions contain magnetic material that locks in the information. Continental drift could be tested by ascertaining the magnetic characteristics of ancient rocks. When paleomagnetists [scientists who study past magnetic fields], took a look at the ocean floor going out away from oceanic ridges (either side of the oceanic ridges), they found magnetic stripes that were flipped so that one stripe would be normal polarity and the next reversed . As the new rock is formed near the ridge, older rock, which formed millions of years ago when the magnetic field was reversed, got pushed farther away, resulting in this magnetic striping. When Earth’s geomagnetic field undergoes a reversal, the change in polarity is recorded in the magma, which contributes to the alternating pattern of magnetic striping in the rocks on the seafloor."}, {"c": 1, "n": "Geomorphology", "id": "s48", "t": "PYQ", "x": "Q.1) Which of the following phenomena might have influenced the evolution of organisms ? Continental drift Glacial cycles Select the correct answer using the code given below. (2014) 1 only 2 only Both 1 and 2 Neither 1 nor 2. Answer: (c) Both 1 and 2 9. About 200 million years ago, all the continents on Earth were actually one huge \"supercontinent\" surrounded by one enormous ocean. This gigantic continent, called Pangaea , slowly broke apart and spread out to form the continents we know today. All Earth's continents were once combined in one supercontinent, Pangaea. One of the most prominent examples of the effect of continental drift on the evolution of organisms is the unique primates found in Australia and South America. The final stages of evolution of Genus Homo occur in the last 3 glacial cycles. Q.2) Which of the following are the evidences of the phenomenon of continental drift? The belt of ancient rocks from Brazil coast matches with those from Western Africa. The gold deposits of Ghana are derived from the Brazil plateau when the two continents lay side by side. The Gondwana system of sediments from India is known to have its counterparts in six different landmasses of the Southern Hemisphere. Select the correct answer using the code given below: I and III only I and II only I, II and III II and III only Answer: (c) I, II and III Statement I: Ancient rock belt from Brazil matches with Western Africa Correct. Geological studies show a remarkable similarity between the Precambrian rock formations on the coasts of Brazil and Western Africa. Statement II: Gold deposits of Ghana derived from Brazil plateau Correct. Certain mineral deposits such as gold and diamonds found in Ghana and Brazil match in age and type, indicating they were formed in the same geological settings when South America and Africa were joined. Statement III: Gondwana sediments in India match those in other Southern Hemisphere landmasses Correct. The Gondwana sedimentary sequences in India show close similarity with those in Africa, South America, Australia, Antarctica, Madagascar, and New Zealand."}, {"c": 1, "n": "Geomorphology", "id": "s49", "t": "PLATE TECTONICS THEORY", "x": "First suggested by McKenzie and Parker in 1967 First outlined by Morgan in 1968 . Both ‘convectional current theory’ and ‘seafloor spreading’ paved the way for the Theory of Plate Tectonics. Theory: Lithosphere is broken into multiple plates (7 major, numerous minor) It floats on the Asthenosphere under the impact of Convectional Currents . Lithospheric plates (sometimes called crustal plates, or tectonic plates) vary from minor plates to major plates, continental plates (Arabian plate) to oceanic plates (Pacific plate), and sometimes a combination of both continental and oceanic plates (Indo-Australian plate). The oceanic plates contain mainly the Simatic crust and are relatively thinner , while the continental plates contain Sialic material and are relatively thicker . Major Plates: Antarctica and the surrounding oceanic plate North American plate South American plate Pacific plate India-Australia-New Zealand plate Africa with the eastern Atlantic floor plate Eurasia and the adjacent oceanic plate Minor Plates: There are many more minor plates other than the above-mentioned (in the image) plates. Most of these minor plates were formed due to stress created by converging major plates . For example: the Mediterranean Sea is divided into numerous minor plates due to the compressive force exerted by the Eurasian and African plates. Forces for plate movement: the convectional currents . Arthur Holmes gave the idea about these in 1930s. Explains Earthquakes, Volcanoes, Fold and Block Mountains 70% earthquakes; 90% of volcanoes (75% active) in the Circum-Pacific Ring of Fire. Circum-Pacific Ring of Fire: The boundary of the Pacific plate , where it is s ubducting beneath the Indo-Australian, Eurasian, and American plates . From New Zealand to Chile. 20% earthquakes in Mid-Continental region . The Arctic Ridge has the slowest rate (less than 2.5 cm/yr), and the East Pacific Rise in the South Pacific [about 3,400 km west of Chile], has the fastest rate (more than 15 cm/yr)."}, {"c": 1, "n": "Geomorphology", "id": "s50", "t": "Plate Boundaries:", "x": "Major geomorphological features such as fold and block mountains, mid-oceanic ridges, trenches, volcanism, earthquakes etc. are a direct consequence of interaction between various lithospheric plates. Diverging/Constructive Boundaries: The sites where the plates move away from each other are called spreading sites . Such edges are sites of earth crust formation (hence constructive) and volcanic landforms are common along such edges. Earthquakes (shallow focus) are common along divergent edges. Examples: Mid-oceanic ridges (some of the longest mountain ranges of the world); On land, most prominent: Great African Rift Valley (divergence of African and Somali Plate; Lebanon in North to Mozambique in South.) Leads to the formation of Volcanoes, Block Mountains and in case of Oceanic ridges, volcanic Islands , like the Chagos in the Indian Ocean. Converging/Destructive Boundaries: 2 types: C-C Convergence: When it's Continent-Continent Convergence, it's called a colliding boundary . E.g., Indian and the Eurasian Plates O-C Convergence (aka Cordilleran convergence , as leads to formation of fold mountains on the continental plate): When its Ocean-Continent Convergence, it’s called a subducting boundary. E.g. Pacific Ocean and South American Plate. The zone of collision may undergo crumpling and folding, and folded mountains may emerge. When one of the plates is an oceanic plate, it gets embedded in the softer asthenosphere of the continental plate and as a result, trenches are formed at the zone of subduction. The subducted material gets heated up and is thrown out forming volcanic islands and dynamic equilibrium is achieved. Destructive: Subduction of the denser plate under the less dense one. Colliding: E.g. Himalayas Lead to the formation of Fold mountains, and in case of O-C convergence, formation of Oceanic Trenches and Volcanoes too. Why are there no volcanoes in colliding boundaries? Since no subduction, no molten material is available to burst out from the volcanoes. That is why the Himalayas do not have any volcanoes, while the Andes and the Alps do! Transforms/Conservative: Formed when two plates move past each other . In this kind of interaction, two plates grind against each other and there is no creation or destruction of landform but only deformation of the existing landform. [Crust is neither produced nor destroyed as the plates slide horizontally past each other]. No creation or destruction. Only deformation. Generally perpendicular to oceanic ridges . The San Andreas Fault along the western coast of the USA is the best example. Indian Plate: Indo-Australian Plate. East Margin: through Rakin Yoma Mountains (Arakan Yoma) of Myanmar towards the island arc along the Java Trench. West Margin: Kirthar mountains of Pakistan Northern Margin: Himalayas Eurasia plate on its northern and eastern boundary; Arabian plate on its, western boundary; Somalia, Capricorn, and Australia plates to the south Movement of Indian Plate: India was a large island situated off the Australian coast, in a vast ocean. The Tethys Sea separated it from the Asian continent till about 225 million years ago. India is supposed to have started her northward journey about 200 million years ago at the time when Pangaea broke. India collided with Asia about 40-50 million years ago causing rapid uplift of the Himalayas. About 140 million years before the present, the subcontinent was located as south as 50◦ S. latitude. The two major plates were separated by the Tethys Sea and the Tibetan block was closer to the Asiatic landmass. During the movement of the Indian plate towards the Asiatic plate, a major event that occurred was the outpouring of lava and formation of the Deccan Traps. This started somewhere around 65 million years ago and continued for a long period. Note that the subcontinent was still close to the equator. From 40-50 million years ago (disputed by some experts who say it started around 60 million years ago) and thereafter, the event of for"}, {"c": 1, "n": "Geomorphology", "id": "s51", "t": "PYQ", "x": "Q.1) Consider the following: Electromagnetic radiation Geothermal energy Gravitational force Plate Movements Rotation of the earth Revolution of the earth Which of the above are responsible for bringing dynamic changes on the surface of the earth? (2013) 1, 2, 3 and 4 only 1, 3, 5 and 6 only 2, 4, 5 and 6 only 1, 2, 3, 4, 5 and 6 Ans. D All the factors are responsible for bringing dynamic changes on the surface of the earth. Wind, water, and ice erode and shape the land. Volcanic activity and earthquakes alter the landscape in a dramatic and often violent manner. And on a much longer timescale, the movement of earth's plates slowly reconfigures oceans and continents. Each one of these processes plays a role in the Arctic and Antarctica. Electro-magnetic radiation causes temperature change which induces metamorphism of rocks. Gravity besides being a directional force activating all down slope movements of matter also causes stresses on the earth’s materials. Plate movement results into continent building. The energy emanating from within the earth is the main force behind endo-genic geomorphic processes. This energy is mostly generated by radioactivity, rotational and tidal friction and primordial heat from the origin of the earth. This energy due to geothermal gradients and heat flow from within induces diastrophism and volcanism in the lithosphere. Due to variations in geothermal gradients and heat flow from within, crustal thickness and strength, the action of endo-genic forces are not uniform and hence the tectonically controlled original crustal surface is uneven."}, {"c": 1, "n": "Geomorphology", "id": "s52", "t": "VOLCANISM", "x": "Volcanism: The process by which molten rock material from the asthenosphere finds a way to enter the lithosphere , where it may or may not reach the surface of the Earth. A volcano is a vent in the earth's crust from which molten rock material (magma), explosive bursts of gases and volcanic ashes erupt , or A mountain or hill having a crater or vent through which lava, rock fragments, hot vapour, and gas are or have been erupted from the earth's crust."}, {"c": 1, "n": "Geomorphology", "id": "s53", "t": "Types of Magmas:", "x": "Under Earth: Magma; After eruption: Lava Acidic Lava: 1. Light-coloured, of low density , and have a high percentage of silica . 2. Highly Viscous ; flow slowly; do not spread much. 3. Get solidifies in the vent, causing explosive eruptions and release of Pyroclastic material. Basic Lava: 1. Dark, high density, less percentage of silica 2. Highly fluid ; flow readily; spread to large areas 3. Lava plateaus ; gently sloping volcanic mountains Fumaroles: openings in the earth's surface that emit steam and volcanic gases , such as sulphur dioxide and carbon dioxide. 1. A fumarole rich in sulphur gases is called a solfatara ; a fumarole rich in carbon dioxide is called a mofette . Volcanoes often release large amount of gases like Carbon, Sulphur and Nitrogen Oxides, Water Vapour, hydrogen sulphide, trace amounts of Chlorine."}, {"c": 1, "n": "Geomorphology", "id": "s54", "t": "Geysers and Hot Springs", "x": "Almost all the world’s geysers are confined to three major areas: Iceland, New Zealand and Yellowstone Park of U.S.A."}, {"c": 1, "n": "Geomorphology", "id": "s55", "t": "Distribution of Volcanoes in the World:", "x": "Only 10 to 20 per cent of all volcanic activity is above sea Pacific Ring of fire: 75% active volcanoe
