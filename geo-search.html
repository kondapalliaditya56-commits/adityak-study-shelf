d from cosmic rays, the atoms in this area have been stripped of one or more of their electrons, or “ionized,” and are therefore positively charged. The ionized electrons behave as free particles. The Sun's upper atmosphere, the corona, is very hot and produces a constant stream of plasma and UV and X-rays that flow out from the Sun and affect or ionize the Earth's ionosphere. Only half the Earth’s ionosphere is being ionized by the Sun at any time. The ionosphere has major importance to us because, among other functions, it influences radio propagation to distant places on the Earth, and between satellites and Earth. For the very low frequency (VLF) waves that the space weather monitors track, the ionosphere and the ground produce a “waveguide” through which radio signals can bounce and make their way around the curved Earth The ionosphere is composed of three main parts, named for obscure historical reasons: the D, E, and F regions. The electron density is highest in the upper, or F region. The F region exists during both daytime and nighttime. During the day it is ionized by solar radiation, during the night by cosmic rays. The D region disappears during the night compared to the daytime, and the E region becomes weakened. Wavelength of radio waves can be 1 milimeter to 100 km, so they are not “very long wavelength waves. Q.2) Normally, the temperature decreases with the increase in height from the Earth’s surface, because 1. the atmosphere can be heated upwards only from the Earth’s surface 2. there is more moisture in the upper atmosphere 3. the air is less dense in the upper atmosphere Select the correct answer using the codes given below : (2012) (a) 1 only (b) 2 and 3 only (c) 1 and 3 only (d) 1, 2 and 3 Answer: C The ﬁrst statement given in this question is correct. Temperature falls off with height at a predictable rate because the air near the surface is heated and becomes light, and the air higher up cools to space and becomes heavy. The second statement is obviously incorrect. This is because the water vapour, which accounts for around 1% of air, varies greatly in the troposphere and decreases rapidly with altitude. As we increase elevation, there is less air above us thus the pressure decreases. As the pressure decreases, air molecules spread out further (i.e. air expands), and the temperature decreases and the atmosphere can be heated upwards only from the Earth's surface. Near the Earth's surface, air gets cooler the higher you climb. As you climb a mountain, you can expect the air temperature to decrease by 6.5 degrees C for every 1000 meters you gain. This is called the standard (average) lapse rate. The basic answer is that the farther away you get from the earth, the thinner the atmosphere gets. The total heat content of a system is directly related to the amount of matter present, so it is cooler at higher elevations Q.3) The increasing amount of carbon dioxide in the air is slowly raising the temperature of the atmosphere because it absorbs - (2012) (a) the water vapour of the air and retains its heat (b) the ultraviolet part of the solar radiation (c) all the solar radiations (d) Infrared part of solar radiation Answer: D Carbon dioxide is meteorologically a very important gas as it is transparent to the incoming solar radiation but opaque to the outgoing ter"}, {"c": 2, "n": "Climatology", "id": "s6", "t": "Temperature Inversion:", "x": "Inversion of the normal lapse rate , such that as the altitude increases, the temperature starts to increase too. Conditions for Temperature Inversion: Clear, Calm Conditions: Clear skies and calm winds allow for efﬁcient radiative cooling of the Earth's surface during the night. Long Nights or Extended Darkness: Longer nights or periods of extended darkness allow for more signiﬁcant radiative cooling of the surface air. Absence of Atmospheric Mixing: A lack of vertical mixing, such as from strong winds or convective activity, prevents the mixing of warmer air aloft with cooler air near the surface, allowing the inversion layer to form and persist. Geographic Features : Certain geographic features, such as valleys or basins, can enhance the likelihood of temperature inversion by trapping cold air near the surface, especially during calm, clear nights. Most commonly seen at: Fronts Winter season Mountains & Valleys"}, {"c": 2, "n": "Climatology", "id": "s7", "t": "Positive and Negative Impacts", "x": "Positive: Frost Protection for Plants: The warmer air above the inversion layer can prevent ground temperatures from dropping too low, protecting crops from frost damage. Negative: Pollution Dome Effect Reduced Visibility due to fog formation, affects transportation. Can create conditions where pests and diseases thrive , potentially harming crops if not managed properly. Pollution Dome Effect: The pollution dome effect refers to the phenomenon where pollutants become trapped beneath a layer of warm air during temperature inversion events. During a temperature inversion, a layer of warm air traps cooler air beneath it, along with any pollutants present in the lower atmosphere. This creates a \"dome\" or \"cap\" of stagnant air that prevents the vertical dispersion of pollutants. This usually happens during cold weather, when the air in contact with the cold ground becomes cool, resulting in temperature inversion. Temperature Inversion's Role: Temperature inversion exacerbates the pollution dome effect by preventing vertical mixing of the atmosphere . Normally, warmer air rises and cooler air sinks, facilitating the dispersal of pollutants. However, during inversion, this vertical movement is suppressed, leading to the accumulation of pollutants near the surface. Consequences: The pollution dome effect can lead to increased concentrations of pollutants in affected areas , resulting in poor air quality and health hazards for residents. In severe cases, prolonged exposure to high levels of pollutants trapped within the dome can lead to respiratory problems, cardiovascular issues, and other health complications . Mitigation : Strategies to mitigate the pollution dome effect include reducing emissions of pollutants at their sources, implementing air quality monitoring and forecasting systems , and promoting public awareness and behaviour change to reduce individual contributions to air pollution. In 2013, China launched a $100-billion initiative to combat air pollution in Beijing, implementing strict regulations on vehicle emissions, relocating polluting industries, and promoting cleaner energy sources. As a result, Beijing's air quality improved substantially, with PM2.5 levels decreasing by 35% between 2013 and 2017."}, {"c": 2, "n": "Climatology", "id": "s8", "t": "AIR PRESSURE & PRESSURE BELTS", "x": "Total weight of a mass of column of air above per unit area at sea level. Maximum at sea level High-temperature results in Low Pressure and vice versa. When the air gets heated it expands, becomes light and rises vertically. As air rises, the pressure it exerts on the Earth’s surface is reduced, causing a low-pressure area. On the other hand, cool air is dense and heavy. As a result, it sinks vertically. It results in additional weight and pressure which causes a high pressure on the ground. Lines joining places with equal pressure are called Isobars. Based on temperature distribution, 7 pressure belts are present on the Earth. 3 of these are thermally induced , created due to the temperature. 4 are dynamically induced due to the movement of the winds from the thermally induced pressure belts. The Equatorial Low-Pressure belt (10 degrees north and south) is also known as the ITCZ (Inter-Tropical Convergence Zone) or the “Doldrums” (calms), as this region experiences monotonous windless weather , due to the convergence of the trade winds around it. Pressure belts are not homogenous , due to uneven distribution of land and water. Pressure belts shift due to the revolution of Earth because of Earth’s 23.5-degree tilt , depending upon where the sunlight falls directly. In the Northern Hemisphere, January denotes winter, and July denotes summer. In the Southern Hemisphere, the opposite is true. The pressure belts shift approx 5°- 10° northward (can be as high as 25° over India) when the sun shines vertically overhead on the Tropic of Cancer (21 June), and approx 5°- 10° southward when the sun shines vertically overhead on the Tropic of Capricorn (22 December) from their initial position. Seasonal climate fluctuations are caused by the movement of the pressure belts , especially between the latitudes of 30° and 40° (Mediterranean Climate) in both hemispheres. During winter, Westerlies prevail, resulting in rain. During the summer, dry Trade Winds blow offshore, preventing rain from falling in certain areas. The pressure belts in both hemispheres stay balanced when the sun shines vertically over the Equator on March 21st and September 23rd (the Equinoxes)."}, {"c": 2, "n": "Climatology", "id": "s9", "t": "WINDS: FACTORS AFFECTING THEIR MOVEMENT", "x": "Pressure Gradient (Direction and Speed) : It denotes the pressure difference between two locations. The winds always move from the High to the Low-pressure region. This determines the direction of the winds. The steep Pressure Gradient is denoted on the maps via closely spaced isobars. The steeper the gradient is, the higher the speed of movement of the winds. So overall, this force determines both the speed and the direction of the wind movement i.e. it helps determine the overall velocity of the Winds. Coriolis Force (Only Direction) This force is generated by virtue of the movement of the Earth and affects only the objects or entities moving on the surface of the Earth , like winds and ocean currents. That is why it is an apparent and not a real force. It affects only the direction of movement of the winds. The magnitude of deflection depends upon the speed of the wind . Higher speed means higher deflection. Deflects the winds to the Right in the Northern Hemisphere. Deflects the winds to the Left in the Southern Hemisphere. 0 at the equator, maximum at the poles. Frictional Force (Direction and Speed): It is the force experienced by the winds in the direction opposite to its movement. It can affect both the direction and the speed of wind movement. It is effective only up to a few thousand meters above the Earth’s surface. The oceans provide much less frictional force than land, as the latter is covered with vegetation, infrastructure, landforms, etc. That is why the wind speeds are higher over water bodies than on the land."}, {"c": 2, "n": "Climatology", "id": "s10", "t": "TYPES OF WINDS", "x": "Prevailing/Primary/Planetary/Permanent winds: These winds get affected by all the abovementioned forces and affect the Earth’s surface throughout the year. E.g. Trade winds, westerlies, polar easterlies. Geostrophic Winds: They move at tropopause-ic level, and therefore are not affected by the frictional force . As a result, they travel parallel to the isobars. E.g. Jet streams. Seasonal Winds: They are experienced only during a particular season. E.g. Monsoonal winds. Diurnal winds: change direction between day and night. E.g. in coastal regions, the sea breeze blows during the day and the land breeze blows during the night. Another example is the mountain valley breeze. Local Winds: Winds that affect only a speciﬁc location. May be all year round, or during a particular season."}, {"c": 2, "n": "Climatology", "id": "s11", "t": "NOMENCLATURE OF WINDS", "x": "Winds are named after the direction from which they seem to be coming . E.g. Polar easterlies are named so as they come from the eastern direction. They have an east-to-west movement."}, {"c": 2, "n": "Climatology", "id": "s12", "t": "PLANETARY WINDS AND TRI-CELLULAR MERIDIONAL CIRCULATION:", "x": "Planetary winds are large-scale wind patterns that circulate the Earth , driven by differences in temperature and pressure between regions. They are present throughout the Year . These winds play a crucial role in redistributing heat and moisture across the planet , influencing weather patterns and climate. There are several key types of planetary winds: Trade Winds : Trade winds are persistent easterly winds that blow from the subtropical high-pressure belts towards the equator in both hemispheres. They are named \"trade winds\" because they historically facilitated trade routes across the world's oceans. Trade winds play a signiﬁcant role in the movement of ocean currents and are important for sailors and aviation routes. Westerlies : Westerlies are prevailing winds that blow from the subtropical high-pressure belts towards the sub-polar low-pressure region in both hemispheres. They are characterized by their westerly direction (from west to east) and play a crucial role in the movement of weather systems across mid-latitudes. The westerlies are particularly strong and well-deﬁned in the Southern Hemisphere and flow at extremely high speeds. This has given them the names like roaring fourties, furious ﬁfties, and shrieking sixties. Polar Easterlies : Polar easterlies are cold winds that blow from the polar high-pressure belts towards the mid-latitudes in both hemispheres . They are characterized by their easterly direction (from east to west) and are influenced by the temperature gradient between the polar regions and the mid-latitudes. Polar easterlies are weaker and less consistent than the trade winds and westerlies. Tricellular Meridional Circulation: Tricellular meridional circulation refers to the three-cell circulation pattern in each hemisphere of the Earth's atmosphere, characterized by the movement of air from the equator towards the poles and back again. Hadley Cell : The Hadley cell is the largest and most prominent cell in the tricellular circulation, extending from the equator to about 30 degrees latitude . Warm, moist air rises at the equator, forming low-pressure zones and generating trade winds. As the air cools and descends around 30 degrees latitude, it creates high-pressure belts and generates the trade winds. Ferrel Cell : The Ferrel cell is a mid-latitude cell that lies between the Hadley and polar cells. It operates in the opposite direction to the Hadley cell, with air rising at around 60 degrees latitude and descending at around 30 degrees latitude. The Ferrel cell is driven by the interaction between the Hadley and polar cells. Polar Cell : The polar cell is the smallest and weakest in the tricellular circulation, extending from around 60 degrees latitude to the poles. Cold, dense air sinks at the poles, creating high-pressure zones and generating the polar easterlies. As the air warms and rises around 60 degrees latitude, it creates low-pressure belts and generates westerly winds. Importance : Tricellular meridional circulation plays a crucial role in regulating global climate and weather patterns by transporting heat, moisture, and energy around the planet. It helps to redistribute heat from the equator towards the poles and vice versa, influencing temperature gradients, atmospheric pressure systems, and wind patterns."}, {"c": 2, "n": "Climatology", "id": "s13", "t": "PYQ", "x": "Q.1) Westerlies in the southern hemisphere are stronger and persistent than in the northern hemisphere. Why? 1. The Southern hemisphere has less landmass as compared to the Northern hemisphere. 2. Coriolis force is higher in Southern hemisphere as compared to the Northern hemisphere Which of the statements given above is/are correct? (2011) (a) 1 only (b) 2 only (c) Both 1 and 2 (d) Neither 1 nor 2 Answer: A The Westerlies are strongest in the Southern hemisphere and at times when the pressure is lower over the poles, while they are weakest in the Southern hemisphere and when pressures are higher over the poles. The Westerlies are particularly strong in areas where land is absent because land mass obstructs the movement of westerlies. Westerlies wind of the Southern hemisphere are known by different names like at 40 degrees South latitude they are called the Roaring forties, at 50 degrees latitude, they are called Furious ﬁfties. The Westerlies play an important role in carrying the warm, equatorial waters and winds to the western coasts of continents, especially in the southern hemisphere because of its vast oceanic expanse. Wind never proceeds or moves in a straight line manner, during the movement of the wind deflection is caused due to Coriolis Force. Coriolis Force is highest at the Poles and zero at Equator. Q.2) The jet aircraft fly very easily and smoothly in the lower stratosphere. What could be the appropriate explanation? 1. There are no clouds or water vapour in the lower stratosphere. 2. There are no vertical winds in the lower stratosphere. Which of the statements given above is/are correct in this context? (2011) (a) 1 only (b) 2 only (c) Both 1 and 2 (d) Neither 1 nor 2 Answer: C Commercial jet aircraft fly in the lower stratosphere to avoid the turbulence. The Stratosphere is very dry; air there contains very little water vapour. Because of this, few clouds are found in this layer. Vertical wind shear is a change in wind speed or direction with change in altitude. Wind shear has signiﬁcant effects on control of an aircraft, and it has been a sole or contributing cause of many aircraft accidents. There is no vertical wind shear in the lower stratosphere. That’s plane fly in that region to avoid turbulence or an accident Q.3) With reference to “Coriolis force”, which of the following statements is/are correct? (2024) 1. It increases with increase in wind velocity. 2. It is maximum at the poles and is absent at the equator. Select the answer using the code given below: (a) 1 only (b) 2 only (c) Both 1 and 2 (d) Neither 1 nor 2 Answer: (c) Both 1 and 2"}, {"c": 2, "n": "Climatology", "id": "s14", "t": "GEOSTROPHIC WINDS:", "x": "Geostrophic winds are large-scale winds that blow parallel to isobars (lines of constant pressure) in the atmosphere. They are the result of a balance between the pressure gradient force and the Coriolis force , acting perpendicular to the pressure gradient. Formation : Geostrophic winds form when the pressure gradient force , which drives air from areas of high pressure to areas of low pressure, is balanced by the Coriolis force , which deflects moving air to the right in the Northern Hemisphere and the left in the Southern Hemisphere due to the Earth's rotation."}, {"c": 2, "n": "Climatology", "id": "s15", "t": "JET STREAMS", "x": "Jet streams are narrow bands of fast-flowing, high-altitude winds found in the upper atmosphere, typically at altitudes of 8 to 15 kilometres. They are characterized by their high wind speeds and meandering, ribbon-like appearance. Formation : Jet streams are primarily formed by the interaction between the temperature gradients of different air masses. The largest and most well-known jet streams are the polar jet stream and the subtropical jet stream, which are located near the boundaries of the polar and tropical air masses, respectively. Wavy Jet Streams are said to have “ Rossby Wave ” characteristics. Coriolis force and reduction in temperature contrast, can lead to the Rossby wave characteristic. Due to climate change, the Jet streams are weakening and becoming more meandering. Types : They can be permanent or seasonal. Permanent: Polar Jet Streams, Sub-tropical Jet streams Temporary : Tropical Easterly Jet, Somali Jet Stream. Polar Jet Stream : The polar jet stream is located at high latitudes, typically between 50 and 60 degrees north and south of the equator. It forms along the boundary between cold polar air to the north and warmer subtropical air to the south. The polar jet stream is strongest in winter and weaker in summer , and it plays a crucial role in steering weather systems and influencing storm tracks. Subtropical Jet Stream : The subtropical jet stream is located at lower latitudes , typically between 20 and 30 degrees north and south of the equator . It forms along the boundary between warm tropical air to the south and cooler mid-latitude air to the north. The subtropical jet stream is weaker and less consistent than the polar jet stream but still influences weather patterns and atmospheric circulation. Impact on Weather & Economy : Jet streams play a signiﬁcant role in shaping weather patterns by steering the movement of weather systems and influencing the development of storms and precipitation. They move air masses from one place to another, leading to the development of fronts and extratropical cyclones. They can also affect aviation routes , with aircraft often taking advantage of the strong tailwinds associated with jet streams to reduce flight times and fuel consumption. Jet Stream may transport ozone-depleting substances higher up in the stratosphere. This vertical air circulation causes a rapid rate of mixing of air between the Troposphere & Stratosphere. The Monsoon of South Asia is largely controlled & affected by Jet Streams. In India, they bring Western disturbances which are extra-tropical cyclones of the Mediterranean, dragged into India by the subtropical westerly jet streams. Jet Streams and Climate Change: One potential consequence of climate change on jet streams is their potential weakening in strength. As the Arctic region experiences accelerated warming compared to other parts of the globe, the temperature contrast between the Arctic and lower latitudes diminishes. Since the movement of jet streams is driven by these temperature variations, a less pronounced gradient can lead to jet streams that are weaker and exhibit more meandering paths. This phenomenon can result in prolonged periods of certain weather conditions, such as heatwaves, coldwaves, droughts, or heavy rainfall. Furthermore, the altered temperature differentials may induce shifts in the positioning of jet streams. As they migrate closer to the poles or display more erratic trajectories, they can exert influence on the trajectories of storms and weather systems. Consequently, this can bring about alterations in precipitation distribution, storm intensity, and the frequency of extreme weather occurrences. Heat Dome Effect: A heat dome refers to a weather phenomenon characterized by the trapping of hot air beneath a dome of high pressure in the atmosphere. This leads to prolonged periods of extremely hot temperatures and stifling conditions, particularly during the summer months. Formation: Heat domes typically form when a "}, {"c": 2, "n": "Climatology", "id": "s16", "t": "LOCAL WINDS", "x": "They affect only a certain speciﬁc part of the world . These winds can be both warm and cold . Here is a list of the major local winds of the world:"}, {"c": 2, "n": "Climatology", "id": "s17", "t": "MONSOONAL WINDS:", "x": "These are seasonal winds that are experienced in the tropical regions of the world . The most peculiar part about these winds is the reversal they experience with the switch in the apparent positioning of the sun. This portion will be covered in more detail in the Indian Physical Geography section, as India is highly dependent on these monsoonal winds for its climate, vegetation, economy, as well as society."}, {"c": 2, "n": "Climatology", "id": "s18", "t": "HUMIDITY & CONDENSATION", "x": "Humidity refers to the amount of water vapor present in the air. It is a measure of the moisture content of the atmosphere and plays a signiﬁcant role in determining weather and climate conditions. There are several different types of humidity: Absolute Humidity : Absolute humidity is the actual amount of water vapor present in a unit volume of air , typically expressed in grams per cubic meter (g/m³). It provides a direct measure of the moisture content of the air. Relative Humidity : Relative humidity is the ratio of the amount of water vapor present in the air to the maximum amount of water vapor that the air can hold at a given temperature , expressed as a percentage . It indicates how close the air is to saturation and is commonly used to describe how \"humid\" or \"muggy\" the air feels. Speciﬁc Humidity : Speciﬁc humidity is the ratio of the mass of water vapor to the total mass of air (including dry air and water vapor) in a sample of air. It is expressed in grams of water vapor per kilogram of air and provides a measure of the actual moisture content of the air without regard to temperature. Condensation is the process by which water vapor in the air transforms into liquid water . There are several types of condensation, including: Dew : Dew forms when the surface temperature of an object, such as grass or car windows, falls below the dew point temperature of the surrounding air. Water vapor in the air condenses onto the cooler surface, forming small droplets of liquid water . Dew Point: Dew point is the temperature at which air becomes saturated with water vapor and condensation begins to form. It is a measure of how much moisture is present in the air and is often used as an indicator of comfort level, with lower dew points indicating drier air and higher dew points indicating more humid air. Fog : Fog is a type of condensation that occurs when moist air cools and reaches its dew point, causing water vapor to condense into tiny water droplets suspended in the air near the ground. Fog reduces visibility and is commonly observed in low-lying areas, near bodies of water, or during temperature inversions. Fogs are near-surface clouds. Clouds : Clouds are large masses of water droplets or ice crystals suspended in the atmosphere. They form when moist air rises, cools, and reaches its dew point, causing water vapor to condense onto tiny particles called condensation nuclei. Clouds play a crucial role in the Earth's climate system and weather patterns. Frost : Frost forms when water vapor in the air undergoes deposition, transitioning directly from a gas to a solid without passing through the liquid phase. Frost forms on surfaces such as grass, leaves, or windows when the surface temperature falls below the frost point temperature of the surrounding air. Smog : Smog = smoke + fog (smoky fog) caused by the burning of large amounts of coal, vehicular emission, and industrial fumes (Primary pollutants). Smog contains soot particulates like smoke, sulphur dioxide, nitrogen dioxide, and other components. At least two distinct types of smog are recognized: sulphurous smog and photochemical smog. Haze: An atmospheric phenomenon where dust, smoke, and other dry particles obscure the clarity of the sky. ATMOSPHERIC RIVERS Atmospheric Rivers are long, narrow corridors of concentrated moisture (water vapour) in the atmosphere. Sometimes they can carry more water than the Amazon River. They are responsible for transporting vast amounts of water vapor from tropical regions to mid-latitudes (under the impact of Westerlies), often leading to heavy rainfall and flooding. Creation of Atmospheric Rivers: Evaporation: Warm ocean waters, particularly in tropical regions, cause large-scale evaporation, adding signiﬁcant moisture to the atmosphere. Transport by Wind: Strong winds in the atmosphere, especially within the jet streams, transport this moisture in narrow bands. These winds can extend over thousands of kilometers. Convergence and Condens"}, {"c": 2, "n": "Climatology", "id": "s19", "t": "TYPES OF CLOUDS", "x": "Clouds are categorized into different types based on their altitude, appearance, and the processes that form them. Based on altitude, clouds are generally classiﬁed into three main categories: High-Level Clouds (Cirrus Clouds) : These clouds typically form at altitudes above 6,000 meters. They are composed of ice crystals and appear thin, wispy, and feathery. Examples include cirrus, cirrostratus, and cirrocumulus clouds. Mid-Level Clouds (Alto Clouds) : Mid-level clouds typically form between 2,000 to 6,000 meters above the ground. They are composed of water droplets and sometimes ice crystals . Examples include altocumulus and altostratus clouds. Low-Level Clouds : These clouds form at altitudes below 2,000 meters . They are composed of water droplets and are often associated with weather phenomena such as rain or drizzle. Examples include stratus, stratocumulus, and nimbostratus clouds. Additionally, some clouds form vertically through the troposphere , extending through multiple altitude levels: Cumulonimbus Clouds : These towering clouds extend vertically through the troposphere and are associated with thunderstorms, heavy rain, lightning, and sometimes hail and tornadoes."}, {"c": 2, "n": "Climatology", "id": "s20", "t": "Polar Stratospheric Clouds", "x": "Polar stratospheric clouds (PSCs) form in the stratosphere at altitudes of 15-25 kilometers in polar regions during the winter months , where temperatures drop below -78°C . Typically, clouds do not form in the stratosphere because it is usually too dry and stable; however, the extreme cold in polar regions during winter allows PSCs to form. Often called nacreous or mother-of-pearl clouds due to their iridescent colors, PSCs appear bright and colorful during twilight. PSCs play a critical role in ozone depletion by providing surfaces for chemical reactions that release ozone-depleting chlorine and bromine, signiﬁcantly contributing to the formation of the ozone hole over Antarctica. Cloud Seeding Cloud seeding is a type of weather modiﬁcation technique where certain substances are introduced into clouds to stimulate rainfall or snowfall. Process Substances like Silver Iodide (AgI), Potassium Iodide, Sodium Chloride (common salt), or Dry Ice (solid CO₂) are dispersed into clouds. These act as Hygroscopic Nuclei . Water vapor condenses/freezes around them, forming larger droplets or ice crystals. These eventually grow heavy enough to fall as rain or snow. Methods of Delivery Aircrafts : release particles directly into target clouds. Ground-based generators : shoot particles upward using rockets or flares. Applications Enhancing rainfall in drought-prone regions. Increasing snowpack for water supply in mountains. Dispersing fog at airports for visibility. Hail suppression in agriculture by reducing hailstone size. Pollution Control Limitations & Concerns Works only if there is moisture in the air . Effectiveness is variable and debated. Environmental concerns over silver iodide accumulation . Expensive and logistically complex."}, {"c": 2, "n": "Climatology", "id": "s21", "t": "TYPES OF PRECIPITATION", "x": "Precipitation occurs when water droplets in clouds coalesce and grow large enough to overcome air resistance and fall to the ground . Raindrops form through the process of collision and coalescence or the freezing of supercooled water droplets at high altitudes. Convective (Convectional) Precipitation: Occurs when the air near the Earth's surface is heated, becomes buoyant, and rises rapidly, forming cumulus clouds that grow into towering cumulonimbus clouds. Intense and localized, often resulting in heavy showers, thunderstorms, and short-lived periods of rainfall. Latitudes: Primarily found in tropical regions near the equator (0° to 30° latitude). Precipitation: Rainfall is the most common type of precipitation associated with convective rainfall. It is these clouds that produce thunderstorms and can also produce hail in some cases. Orographic Precipitation : Forms when moist air is forced to rise over elevated terrain such as mountains or hills. As the air rises , it cools and condenses , leading to the formation of clouds and precipitation on the windward side of the mountain. The leeward side of the mountain may experience a rain shadow effect , with drier conditions and less precipitation. Latitudes: Orographic rainfall can occur at various latitudes but is most common in regions with mountainous terrain. Precipitation: Rainfall is the typical outcome of orographic lifting. However, at higher elevations and colder temperatures, precipitation can fall as snow . In some cases it can also fall as hail . Frontal (Cyclonic) Precipitation: Occurs along the leading edge of a frontal boundary between two contrasting air masses , such as a cold front or warm front. Warm air is lifted over denser, cooler air, leading to the formation of clouds and precipitation. Can result in prolonged periods of rainfall over a large area in case of warm front, and short periods of intense rainfall in case of cold fronts. Often associated with mid-latitude cyclones and frontal systems. Latitudes: Frontal rainfall is common in mid-latitude regions (30° to 60° latitude), where contrasting air masses meet. Precipitation: Rainfall is the primary type of precipitation associated with frontal systems. However, in colder regions or during transitional seasons, precipitation can fall as snow or sleet . Cyclonic Precipitation: This is convectional/frontal rainfall on a large scale. Associated with the circulation of air around a low-pressure system, such as a tropical cyclone or extratropical cyclone. Intense and widespread, with heavy rainfall occurring over large areas for an extended period. Can result in flooding, landslides, and other severe weather impacts. Precipitation: Tropical cyclones typically produce heavy rainfall , sometimes accompanied by thunderstorms and hail . In colder regions, extratropical cyclones can result in snowfall."}, {"c": 2, "n": "Climatology", "id": "s22", "t": "THUNDERSTORMS:", "x": "Thunderstorms are atmospheric disturbances characterized by the presence of thunder and lightning, often accompanied by heavy rain, strong winds, and sometimes hail. Formation: Thunderstorms typically form in warm, moist air masses where there is instability and upward vertical motion, of air. This upward motion, i.e. convection (updraft) leads to the development of towering cumulonimbus clouds. Stages: Thunderstorms go through three main stages: the cumulus stage, the mature stage, and the dissipating stage. During the cumulus stage , warm, moist air rises and forms cumulus clouds . In the mature stage , updrafts and downdrafts within the cumulonimbus cloud lead to the development of lightning, thunder, heavy rain, and sometimes hail . Finally, in the dissipating stage, the storm weakens as downdrafts dominate and the supply of warm, moist air diminishes. The cumulo nimbus clouds have a large amount of rain drops and ice crystals these particles constantly collide with each other and get charged the lighter positive charges accumulated at the top of clouds while heavier negative charges accumulate at the cloud bottom due to the accumulation of charges at cloud bottom a potential difference (voltage) appears to get created between the ground and the cloud bottom. Initially the air between the cloud and the ground act as an insulator, preventing the passage of any current. However as the potential difference between the cloud and the grounds keeps on increasing the current starts to move through the air exciting the nitrogen and oxygen molecules thus creating a bluish/ purpulish glow called lightning full stop the sound associated with this lightning discharge is called as thunder. Apart from ground and clouds the lightning discharge can also occur: Within a cloud (top and bottom) Between the clouds The taller objects on the ground (building/trees etc) have a high probability of experiencing a lightning event, as they are closer to the cloud bottom. To prevent lightning from destroying the electrical system of a building and endangering the life of the people inside, electric conductors are installed at the top of buildings. Clouds in Thunderstorms: The main cloud type associated with thunderstorms is the cumulonimbus cloud, which is tall and vertically developed. These clouds can reach heights of up to 10 miles (16 kilometers) or more and are characterized by their anvil-shaped tops. Other cloud types, such as cumulus clouds and stratocumulus clouds, may also be present during the early stages of thunderstorm development. Hazards: Thunderstorms can pose various hazards, including lightning strikes , which can cause ﬁres and electrical damage, heavy rainfall leading to flash flooding, strong winds capable of causing property damage and power outages, and hail , which can damage crops, vehicles, and buildings."}, {"c": 2, "n": "Climatology", "id": "s23", "t": "TORNADO", "x": "A tornado is a violently rotating column of air that extends from a thunderstorm to the ground . It's formed when warm, moist air rises rapidly and meets cooler air, creating a strong updraft. This updraft causes the air to spin, and as it spins faster, it becomes more focused and descends towards the ground. If the rotating air column touches the ground, a tornado is formed. Formation: Thunderstorm Development: Tornadoes form within powerful thunderstorms, often associated with strong updrafts of warm, moist air. Wind Shear: As the warm air rises, it encounters cooler air at higher altitudes. This creates wind shear, a difference in wind speed and direction at different levels in the atmosphere. Rotation: The wind shear causes the rising air column to begin rotating . This rotation can be further intensiﬁed by the Coriolis force . Condensation Funnel: As the air column rotates faster and becomes more focused, it cools and condenses, forming a visible funnel cloud. This funnel can be various colors, including white, gray, or even black depending on the amount of debris it picks up. Tornado Characteristics: Size: Tornadoes can vary greatly in size, ranging from a few feet wide to over a mile. Windspeed: Wind speeds in tornadoes can reach incredible speeds, exceeding 300 kmph in the strongest ones. Duration: Most tornadoes are short-lived , lasting only minutes to tens of minutes. However, some can persist for longer periods. Damage: Tornadoes can cause signiﬁcant damage due to their high wind speeds , lifting and throwing debris, and even causing structural damage to buildings. Tornadoes can be incredibly destructive, with wind speeds reaching over 300 miles per hour. They are most common in the central United States , particularly in an area known as Tornado Alley, which stretches from Texas to Oklahoma, Kansas, and Nebraska. However, they can occur in many parts of the world, including Europe, Asia, Africa, and Australia. Why the majority in “Tornado Alley”? The majority of tornadoes occur in Tornado Alley in the USA due to the unique convergence of different air masses. Warm, moist air from the Gulf of Mexico meets cold, dry air from Canada (Rockies) and warm, dry air from the southwestern deserts . This convergence creates instability, which, combined with strong wind shear (changes in wind speed and direction with height), leads to the formation of powerful thunderstorms called supercells . These supercells are the primary drivers for the high frequency of tornadoes in Tornado Alley. The geography and flat terrain of the region also help funnel and intensify these weather patterns, making conditions ideal for tornado formation."}, {"c": 2, "n": "Climatology", "id": "s24", "t": "WATER SPOUTS", "x": "A swirling column of air and water droplets that forms over a body of water , typically resembling a tornado. It occurs when warm, moist air rises rapidly and meets cooler air above , causing the air to spin and create a vortex. Usually less intense than tornadoes and are most commonly seen over warm ocean or lake waters. There are two types: fair-weather waterspouts, which form in calm conditions and don't usually cause much damage, and tornadic waterspouts , which are more intense and can be dangerous."}, {"c": 2, "n": "Climatology", "id": "s25", "t": "PYQ", "x": "Q.1) The seasonal reversal of winds is the typical characteristic of - (2014) (a) Equatorial climate (b) Mediterranean climate (c) Monsoon climate (d) All of the above climates Answer: C Monsoon is traditionally deﬁned as a seasonal reversing wind accompanied by corresponding changes in precipitation but is now used to describe seasonal changes in atmospheric circulation and precipitation associated with the asymmetric heating of land and sea. A monsoon is a seasonal reversal in wind patterns over a region. The word “monsoon” comes from the Arabic word mausim, meaning “season.” The seasonal wind shift is usually accompanied by a dramatic change in precipitation. Winds that blow for approximately six months from the northeast and six months from the southwest. The most prominent monsoons occur in South Asia, Africa, Australia, and the Paciﬁc coast of Central America. Q.2) Consider the following statements 1. The winds that blow between 30 degrees N and 60 degrees S latitudes throughout the year are known as westerlies. 2. The moist air masses that cause winter rains in the North-Western region of India are part of westerlies. Which of the statements given above is/are correct? (2015) (a) 1 only (b) 2 only (c) Both 1 and 2 (d) Neither 1 nor 2 Answer: B The westerlies, anti-trades, or prevailing westerlies, are prevailing winds from the west toward the east in the middle latitudes between 30 and 60 degrees latitude. They originate from the high-pressure areas in the horse latitudes and trend towards the poles and steer extratropical cyclones in this general manner. Tropical cyclones which cross the subtropical ridge axis into the westerlies recurve due to the increased westerly flow. Westerly disturbances originate in the Mediterranean sea, this sea is surrounded on all sides by high mountains and plateau, as the result high pressure is developed there in the month of September- October, while low pressure still developed over the Mediterranean water body. This disturbance is dragged to India or brought to India by the Jet stream (westerly winds (flowing west to east)). This is the reason that J&K and NW part of India receives highest rainfall from westerly disturbances. Q.3) In the context of which of the following do some scientists suggest the use of cirrus cloud thinning technique and the injection of sulphate aerosols into the stratosphere? (2019) (a) Creating the artiﬁcial rains in some regions (b) Reducing the frequency and intensity of tropical cyclones (c) Reducing the adverse effects of solar wind on the Earth (d) Reducing global warming Answer: D Cirrus clouds do not reflect a lot of solar radiation back into space, but because they form at high altitudes and cold temperatures, they trap long-wave radiation and have a climate impact similar to greenhouse gases. Thus Thinning cirrus clouds would reduce the absorption of infrared radiation and proposed a form of climate engineering to reduce global warming. Another proposed Geo-engineering technique involves injecting reflective sulphate aerosol particles into Earth’s lower stratosphere to cast a small proportion of the inbound sunlight back into space and cool the planet off. Thus both are climate engineering/ Geo-engineering techniques to reduce global warming. Q.4) Why are dewdrops not formed on a cloudy night? (2019) (a) Clouds absorb the radiation released from the Earth’s surface. (b) Clouds reflect back the Earth’s radiation. (c) The Earth’s surface would have low temperature on cloudy nights. (d) Clouds deflect the blowing wind to ground level. Answer: B Less dew is formed on cloudy nights because radiation during cloudy nights occurs at a very slow pace. The radiation occurs very slowly because the clouds are thick during cloudy nights and trap the heat and water vapour inside the clouds. All this indicates why the level of dew is reduced during nights that are heavy with clouds. Dew is a natural form of water, formed as water vapour condenses. Dew, like the gli"}, {"c": 2, "n": "Climatology", "id": "s26", "t": "AIR MASSES", "x": "When the air remains over a homogenous area for a sufﬁciently longer time, it acquires the characteristics of the area. This air parcel with distinctive homogeneous characteristics in terms of temperature and humidity is called an air mass. Due to these homogenous conditions, they lack any vertical movement of winds within themselves. The homogenous regions can be the vast ocean surface or vast plains and plateaus. Air masses form an integral part of the global planetary wind system. Therefore, they are associated with one or other wind belts. They extend from the surface to the lower stratosphere and are across thousands of kilometers. This is why the Jet streams can carry them from their source location to other places. Source Region: They are often the places where the wind movement is absent so that the air can stay at the same place for a longer period of time, resulting in the uniform transfer of the land characteristics to the air. That is why the source regions are High-Pressure regions that experience atmospheric stability. The main source regions are the high-pressure belts in the subtropics (giving rise to tropical air masses) and around the poles (the source for polar air masses): Warm tropical and subtropical oceans The subtropical hot deserts The relatively cold high-latitude oceans The very cold snow-covered continents in high latitudes Permanently ice-covered continents in the Arctic and Antarctica Tropical air masses are warm, while polar air masses are cold. Continental Air masses are dry while maritime ones are with moisture. When an air mass moves away from a source region, the upper level maintains the physical characteristics for a longer period. This is possible because air masses are stable with stagnant air which does not facilitate convection. Conduction and radiation in such stagnant air are not effective. Major Air Masses: Maritime tropical (mT) Continental tropical (cT) Maritime polar (mP) Continental polar (cP) Continental Arctic (cA) Climatic Impact of Air Masses: Tropical (T): Warm temperatures. Maritime Tropical (mT): Warm, moist air from tropical oceans. Brings heavy rainfall and thunderstorms to coastal regions and mid-latitudes , and contributes to tropical cyclones and hurricanes. Southeast Asia: The maritime tropical air masses from the South China Sea cause signiﬁcant rainfall during the wet season, contributing to the region's lush tropical climate. Amazon Basin: The mT air mass from the Atlantic Ocean brings abundant rainfall, supporting the Amazon rainforest ecosystem. Continental Tropical (cT): Hot, dry air from desert regions. Impact: Causes heatwaves and dry conditions in continental interiors , influences summer climates in regions like the southwestern USA. Sahara Desert: The hot, dry cT air mass dominates, leading to extremely high temperatures and arid conditions. Central Australia: The interior experiences hot, dry conditions due to the influence of cT air masses, resulting in arid and semi-arid climates. Polar (P): Cold temperatures, can vary in humidity. Maritime Polar (mP): Cool, moist air from high-latitude oceans. Brings cool, damp, and cloudy weather with precipitation to coastal and inland regions , particularly in the winter. Western Europe: The mP air mass from the North Atlantic Ocean brings cool, moist conditions, resulting in frequent rain and cloudy weather, especially in the UK and Ireland. Japan: The Sea of Japan coast experiences cold, snowy winters due to mP air masses from the Sea of Okhotsk. Continental Polar (cP): Cold, dry air from high-latitude land areas. Causes cold, dry conditions in winter , can lead to clear, cold weather and influence winter storm tracks in mid-latitudes . Russia (Siberia): cP air masses from the interior lead to extremely cold, dry winters with clear skies and very low temperatures. Canada (Prairies): The influence of cP air masses results in cold, dry winters with clear skies, contributing to the region's continental climate. Arcti"}, {"c": 2, "n": "Climatology", "id": "s27", "t": "FRONTS", "x": "These are the 3-dimensional boundary zones , between 2 air masses of contrasting characteristics . They are typically found in the mid-latitudinal regions , and are uncommon in tropics and the polar regions. The process of formation of a front is known as Frontogenesis (the war/face-off begins), and the dissipation of a front is known as Frontolysis (one of the air masses wins, and the war is now over). The temperate cyclone owe their genesis to the process of frontogenesis. Characteristics of Fronts: The more the temperature contrast between the 2 air masses, the lesser the thickness of the front formed. With a sudden change in temperature through the front, there is a change in pressure also. Sudden wind shifts too. The zone experiences precipitation due to the upliftment (gradual or forced) of the warm air. The cold air masses and fronts moves faster than the warm front as the compact and denser cold air can push the boundaries with more force. Types of Fronts: Stationary Front: Forms when two air masses meet but neither advances signiﬁcantly. Clouds: A mix of stratocumulus, nimbostratus, and altostratus. Clouds and light precipitation can persist along a stationary front for an extended period. Warm Front: Forms when a warm air mass advancesinto the region of a cold air mass. Clouds: Stratus, altostratus, cirrostratus. These clouds often produce steady rain or drizzle and can lead to overcast skies and fog. Cold Front: Forms when a cold air mass advances and displaces a warm air mass. Clouds: Cumulus, towering cumulonimbus. These clouds often produce thunderstorms, heavy rain, hail, and tornadoes. Occluded Front: Forms when a fast-moving cold front overtakes a slower-moving warm front. Clouds: A mix of cumulus, stratocumulus, and nimbostratus. Can produce a variety of weather conditions , including thunderstorms, rain, and cooler temperatures as warm air is lifted off the surface. Warm Occlusion: Forms when a fast-moving cold front overtakes a slower-moving warm front, and the air ahead of the warm front is cooler than the air behind the cold front. Warm air is lifted off the surface, creating a mix of clouds, including cumulus, stratocumulus, and nimbostratus. Typically associated with moderate to heavy precipitation, including rain and sometimes thunderstorms. The warm sector ahead of the occluded front may experience warmer temperatures compared to the cold sector behind it. Cold Occlusion: Forms when a fast-moving cold front overtakes a slower-moving warm front, but the air behind the cold front is colder than the air ahead of the warm front. Cold air wedges underneath the warm air, lifting it off the surface. Clouds: A mix of stratocumulus, nimbostratus, and altostratus. Typically associated with widespread precipitation, including rain or snow, and cooler temperatures. A mix of cold & warm front weathers. The resulting weather can be like that of a warm occlusion but with colder temperatures and a greater likelihood of snow in the colder air mass."}, {"c": 2, "n": "Climatology", "id": "s28", "t": "CYCLONES", "x": "Cyclones are large-scale atmospheric systems characterized by low-pressure centers and circulating winds that rotate counterclockwise in the Northern Hemisphere and clockwise in the Southern Hemisphere. There are different types of cyclones, including tropical cyclones, extratropical cyclones, and subtropical cyclones. Tropical cyclones, also known as hurricanes or typhoons depending on the region, form over tropical or subtropical waters and are characterized by intense thunderstorms and strong winds. Extratropical cyclones form outside the tropics and are associated with frontal systems and changes in temperature gradients."}, {"c": 2, "n": "Climatology", "id": "s29", "t": "TROPICAL CYCLONES:", "x": "Location: Tropical cyclones primarily occur in tropical and subtropical regions over warm ocean waters, typically between 10° and 30° latitude in both hemispheres. They are known as Cyclones in the Indian Ocean, Hurricanes in the Atlantic, Typhoons in the Western Paciﬁc and South China Sea, and Willy-willies in Western Australia. Necessary Conditions: Warm Ocean Waters: Sea surface temperatures of at least 26.5°C (80°F) are necessary to fuel tropical cyclone development. Moisture: High levels of atmospheric moisture are essential for sustaining convective activity and cloud formation. Low Vertical Wind Shear: Minimal change in wind speed and direction with height allows for vertical development of the storm. Formation: A disturbance , such as a low pressure centre like monsoon trough, serves as the initial seed for tropical cyclone development. If the atmospheric and oceanic conditions are favourable, the disturbance may undergo cyclogenesis , the process by which a tropical cyclone forms. Warm, moist air rises rapidly, creating an area of low pressure at the surface. As the air converges and rises, it cools and condenses, releasing latent heat and further fuelling the convective activity. As the disturbance intensiﬁes and becomes better organized, it may develop into a tropical depression, characterized by a closed circulation and maximum sustained winds of up to 38 miles per hour (62 kilometres per hour). If the conditions persist, the depression continues to strengthen into a cyclone. Once formed, tropical cyclones can track across the ocean and intensify, fuelled by warm ocean waters and favourable atmospheric conditions. They may reach their peak intensity at some point before eventually weakening as they move over cooler waters or make landfall. Structure: Eye: A well-deﬁned center of low pressure characterized by calm winds and clear skies. Eyewall: A ring of intense thunderstorms surrounding the eye, where the strongest winds and heaviest rainfall occur. Rainbands: Bands of clouds and thunderstorms extending outward from the center, bringing additional rainfall and gusty winds. Types of Clouds Associated: Cumulonimbus Clouds: Towering clouds with strong updrafts and potential for severe weather, including heavy rainfall, lightning, and hail. Cirrus Clouds: High-altitude clouds that may indicate the presence of upper-level outflow associated with the storm. Impact: Strong Winds: Tropical cyclones can produce sustained winds of 64 knots (74 mph) or greater, capable of causing widespread damage to structures, vegetation, and infrastructure. Heavy Rainfall: Intense rainfall can lead to flooding, landslides, and mudslides, especially in areas with poor drainage or in mountainous terrain. Storm Surge: The onshore flow of water driven by strong winds can result in storm surges, causing coastal flooding and inundation of low-lying areas. Tornadoes: Embedded within rainbands, tornadoes can form and cause additional localized damage. Economic and Humanitarian Impacts: Tropical cyclones can result in loss of life, displacement of populations, disruption of essential services, and signiﬁcant economic losses."}, {"c": 2, "n": "Climatology", "id": "s30", "t": "TEMPERATE CYCLONES", "x": "Location: Temperate cyclones, also known as extratropical cyclones, occur in the mid-latitudes, typically between 30° and 60° latitude in both hemispheres. They are most common in regions with a strong temperature contrast between polar and tropical air masses , such as North America, Europe, and Asia. Necessary Conditions: Temperature Contrast: A signiﬁcant temperature difference between polar and tropical air masses is essential for the development of temperate cyclones. Baroclinic Instability: The interaction between warm and cold air masses along a frontal boundary creates instability, leading to the formation of cyclones. Formation: Temperate cyclones form along frontal boundaries, where warm and cold air masses meet and create a zone of instability. The process begins with the development of a stationary front, where warm air rises over denser, cooler air. As the temperature gradient steepens and instability increases, a low-pressure system forms and begins to intensify. Structure: Warm and Cold Fronts: Temperate cyclones are associated with both warm and cold fronts, which mark the leading edges of advancing air masses. Cyclonic Rotation: In the Northern Hemisphere , temperate cyclones rotate counterclockwise around their centers, while in the Southern Hemisphere , they rotate clockwise. Occluded Front: As the cyclone matures, the cold front catches up to the warm front, resulting in an occluded front and the eventual dissipation of the cyclone. Types of Clouds Associated: Cumulonimbus Clouds: Towering clouds associated with thunderstorms and heavy rainfall, especially along the cold front. Nimbostratus Clouds: Layered clouds that produce steady rain or snow, often associated with the warm sector of the cyclone. Altostratus Clouds: Mid-level clouds that may precede the warm front and bring overcast conditions and light precipitation. Impact: Precipitation: Temperate cyclones can produce a variety of precipitation types, including rain, snow, sleet, and freezing rain, depending on temperature and atmospheric conditions. Strong Winds: Gusty winds associated with the cyclone can cause damage to structures, trees, and power lines. Flooding: Heavy rainfall from temperate cyclones can lead to flash flooding, river flooding, and landslides. Storm Surge: Along coastal areas, the onshore flow of water driven by strong winds can result in storm surges and coastal flooding."}, {"c": 2, "n": "Climatology", "id": "s31", "t": "IMPACT OF CLIMATE CHANGE", "x": "Tropical Cyclones: Rising ocean temperatures due to climate change provide more energy for tropical cyclones, leading to more intense storms with higher wind speeds and heavier rainfall. There has been an increase in the proportion of severe (Category 4 & 5) cyclones, especially in regions like the Arabian Sea and the North Atlantic. Climate models show a decreased overall frequency of tropical cyclones globally, with some regions like the North Atlantic bucking the trend by becoming slightly more active. The cyclones are encroaching even higher latitudes (poleward shift), and their forward motion has slowed down, which can prolong rainfall and increase flood risks. Climate change leads to an increase in rapid intensiﬁcation events (storms that quickly strengthen), making forecasts and disaster responses more difﬁcult. Sea level rise exacerbates storm surges from cyclones, increasing coastal flooding hazards. Temperate Cyclones: Temperate cyclones (also called extratropical cyclones or mid-latitude storms) may experience shifts in their tracks due to climate change, often moving poleward (lack of availability of cold air masses at lower latitudes), which could alter weather patterns in affected regions. Warming impacts the temperature gradients and jet stream patterns that drive temperate cyclones, potentially modifying their intensity, frequency, and seasonal behavior. Increased atmospheric moisture from climate change can lead to more intense precipitation events associated with these cyclones, enhancing the risks of flooding, landslides, and transport disruption. There is evidence of excess rainfall and unseasonal weather in areas affected by temperate cyclones, which can impact crops and infrastructure."}, {"c": 2, "n": "Climatology", "id": "s33", "t": "PYQ", "x": "Q.1) In the South Atlantic and South Eastern Paciﬁc regions in tropical latitudes, cyclones do not originate. What is the reason? (2015) (a) Sea Surface temperature are low (b) Inter-Tropical Convergence Zone seldom occurs (c) Coriolis force is too weak (d) The absence of land in those regions Answer: B The most proximate reasons for the lack of cyclone formation in the South Atlantic are sea surface temperatures that tend to run a shade cooler than ideal for tropical cyclone formation even in the southern summer, climatologically high values of vertical wind shear across that basin throughout the year, and a lack of pre-existing centres of rotation (vorticity) in that area. Tropical cyclones are the zones of low pressure systems around which there is closed air circulation in counterclockwise direction(Northern hemisphere) and circular direction(Southern hemisphere). Important condition for the origin of tropical cyclones: Sea Surface temperature should be greater than 27 degree C. Pre existing weak tropical disturbances Continuous supply of energy. Coriolis force. Weak wind shear Strong Wind shear present at South Atlantic removes the heat and moisture from the place where it is required to drive the heat engine of cyclone i.e near the centre. Without an Inter-tropical Convergence Zone (ITCZ) to provide synoptic vorticity and convergence (i.e large scale spin and thunderstorm activity) as well as having strong wind shear, it becomes very difﬁcult to nearly impossible to have genesis of tropical cyclones."}, {"c": 2, "n": "Climatology", "id": "s36", "t": "PYQs", "x": "Q.1) If a tropical rainforest is removed, it does not regenerate quickly as compared to a tropical deciduous forest. This is because - (2011) (a) the soil of rainforest is deﬁcient in nutrients (b) propagules of the trees in a rainforest have poor viability (c) the rain forest species are slow-growing (d) exotic species invade the fertile soil of rainforest Answer: A Due to heavy rainfall and weathering, most of the nutrients have been washed out of the soil. Only a thin layer of decaying organic matter is found, unlike in temperate deciduous forests.That’s why the soil of most of the tropical rainforest is poor in nutrients. The high temperature and moisture of tropical rainforests cause dead organic matter in the soil to decompose more quickly than in other climates, thus releasing and losing its nutrients rapidly. The high volume of rain in tropical rainforests washes nutrients out of the soil more quickly than in other climates. Why are rainforest soils low in nutrients? One reason the rain forest soil is so poor is that most of the nutrients are stored in the plants themselves. In any forest, dead organic matter falls to the ground, providing valuable nutrients for new growth. In cooler or drier climates, the nutrients build up in the soil. Q.2) What could be the main reason/reasons for the formation of the African and Eurasian desert belt? 1. It is located in the sub-tropical high-pressure cells. 2. It is under the influence of warm ocean currents. Which of the statements given above is/are correct in this context? (2011) (a) 1 only (b) 2 only (c) Both 1 and 2 (d) Neither 1 nor 2 Answer: A Hot deserts are located between 20°30° latitude in both the hemisphere on the western coast of the continents. They are also called Tropical Deserts. They are different from the midlatitude deserts and cold deserts, hot deserts are found in High-pressure belts along the Tropics in the trade winds region. Distribution Of Hot Deserts: Asia Thar desert and the Arabian Desert; Africa The Sahara and the Kalahari; N. America Lower California and Arizona states of the USA; S. AmericaAtacama desert; Australia The Great Australian desert. The Sahara desert of Africa is the biggest hot desert in the world. The Hot desert regions are located in the subtropical high-pressure belts, which are not favourable regions for rainfall. There are three main causes of deserts: Most of the world's deserts are made by the equatorial wind belts. At the equator, warm air is always rising. This creates wind belts that blow north and south away from the equator. When air descends at the tropics of cancer and Capricorn it is too dry for clouds to form. No clouds mean no rain producing Deserts. E.g. the Sahara desert Rainshadow also produces Deserts. Any moisture in the air will fall as air passes high mountain ranges, so land beyond the mountains receives little or no rain. The Gobi desert is produced by Rainshadow. Cold Currents also produce deserts. The southwestern coast of Africa and South America are swept by cold currents upwelling from the ocean floor. These currents cool the air that passes over them, causing the water in the air to fall as rain before it reaches the land. The Namib and Atacama desert have formed because of these cold currents. The Eurasian Belt is related to cold currents NOT warm current, so statement 2 is incorrect. Q.3) Which one of the following is the characteristic climate of the Tropical Savannah Region? (2012) (a) Rainfall throughout the year (b) Rainfall in winter only (c) An extremely short dry season (d) A deﬁnite dry and wet season Answer: D The tropical savanna climate is also called the tropical wet and dry climate. It is the climate experienced in savanna or tropical grassland regions of the world. These places are located near the equator, and they lie between the Southern and the Northern Tropics. The climate dominates many parts of the African continent, the northern region of South America, and parts of Asia such as Ind"}, {"c": 2, "n": "Climatology · quick", "id": "q-1-atmosphere-heat", "t": "1 · Atmosphere & heat", "x": "🏢 The atmosphere is a 5-floor building (bottom → top) Floor Height What happens there 5 Exosphere – open terrace > 400 km Particles can reach 1,000 °C yet it feels cold (too thin to pass heat) 4 Thermosphere – rooftop antenna 80–400 km Temperature rises again (UV, X-ray). ISS & satellites; Kármán line 100 km; ionosphere bounces radio waves 3 Mesosphere – freezer 50–80 km Coldest; meteors burn; noctilucent clouds 2 Stratosphere – AC floor to 50 km Ozone (lower part) → temperature rises with height; almost cloud-free = jets fly here 1 Troposphere – kitchen 8–18 km (avg 13) All weather, clouds, jet streams. 18 km at equator (strong convection), 8 km at poles. Cools ~1 °C per 165 m Gases: N₂ 78% · O₂ 21% (≈99%) · Argon 0.93% · CO₂ ~0.04% · water vapour 0–5% (>90% below 5 km; falls from equator to poles) · CO₂ and water vapour only up to 90 km · ozone layer 20–25 km. By composition: homosphere (heterosphere (>80 km, layered by molecular mass). Aerosols/salt act as hygroscopic nuclei; microplastics can seed ice 5–10 °C warmer than usual. Why cooler with height (PYQ 2012, ans C): air is heated from the ground up and thinner air holds less heat. Not because of \"more moisture\" (vapour falls with height). Handout also quotes 6.5 °C per 1,000 m (≈ the 1 °C/165 m above). Troposphere – PYQ 2024 (ans a): thicker at the equator because strong convection carries heat high. (Mains 2022, 15m: \"troposphere determines weather processes – how?\" → clouds, air masses, jet streams all sit here; prime heat source is terrestrial radiation.) CO₂ warms (PYQ 2012, ans D): it absorbs infrared; transparent to incoming sunlight, opaque to outgoing earth radiation. Water vapour also absorbs infrared (2023 ans C). Ionosphere (PYQ 2011, ans D): radio works because charged particles reflect waves – not ozone, and radio waves are not \"very long\" (1 mm–100 km). Heat budget (PYQ 2024, ans d): the atmosphere is heated more by terrestrial (long-wave) than by incoming (short-wave) radiation, and greenhouse gases absorb long-wave well → only Statement II correct. 🔥 4 ways heat moves: Conduction = Contact (spoon in hot chai) · Convection = Currents (boiling milk rises/sinks) · Advection = Aside, sideways (Loo carrying heat in) · Radiation = Rays, no medium (Sun → Earth). 👕 Albedo: snow/ice = white shirt (reflects, cools) · ocean, forest, city = black shirt (absorbs, warms). Hotter body → shorter wavelength: Sun = short-wave, Earth = long-wave. What controls temperature: latitude (slant rays) · duration of daylight · sunspot cycle · transparency (cloudy day cooler, cloudy night warmer) · altitude · mountain orientation · vegetation (transpiration cools) · distance from sea · ocean currents · local winds/urban. Energy: 0–40° N/S = surplus; beyond 40° = deficit; winds and currents carry heat poleward, mostly across 30°–50° (hence storms there). Isotherm bending (PYQs 2024, 2025): January, Northern Hemisphere – isotherms bend poleward over oceans (oceans stay warmer) and equatorward over continents (land cools fast). July is the reverse. Reason: water has high specific heat (2023: Statement I wrong – contrast is greater in winter; Statement II right). Continental interiors have a bigger annual range because of land–water thermal difference only (2013, ans A). Handout alert: the isotherm section first says \"in July isotherms shift towards the equator on land\" and then summarises \"in July, north over land, south over oceans\". Trust the summary (and the Jan rule above). Temperature inversion: temperature rises with height. Needs clear, calm, long nights, no mixing, valleys/basins; common at fronts, in winter, in mountains and valleys. Good: frost protection. Bad: pollution dome, fog, pests. (Beijing's 2013 US$100-bn drive cut PM2.5 by 35% by 2017.)"}, {"c": 2, "n": "Climatology · quick", "id": "q-2-pressure-winds-circulation", "t": "2 · Pressure, winds & circulation", "x": "🪜 Pressure ladder – \"Lazy Hens Lay Happily\": Equator Low (ITCZ / Doldrums, 10°N–S) → High at ~30° → Low at ~60° → High at poles. 7 belts = 3 thermal + 4 dynamic. Belts shift 5–10° (up to 25° over India) with the overhead Sun; balanced at the equinoxes (21 Mar, 23 Sep). At 30–40° this shift gives the Mediterranean pattern: winter westerlies = rain; summer dry trades. Three forces on wind: Pressure gradient (speed + direction; close isobars = fast) · Coriolis (direction only; deflects right in N, left in S; 0 at equator, max at poles; bigger for faster winds – PYQ 2024, ans c) · Friction (both; only a few thousand metres up; less over sea so winds are faster there). Winds are named for where they come from. Types: planetary · geostrophic (above friction, parallel to isobars, e.g. jet streams) · seasonal (monsoon) · diurnal (sea/land breeze, mountain-valley) · local. Planetary wind From → to Notes Trade winds subtropical high → equator, easterly helped trade routes; push ocean currents Westerlies subtropical high → sub-polar low, W→E strongest in S. Hemisphere (little land): Roaring 40s, Furious 50s, Shrieking 60s Polar easterlies polar high → mid-latitudes cold, weaker 🌀 Three cells: Hadley (equator–30°, biggest, trades) · Ferrel (30–60°, middle, runs opposite) · Polar (60°–pole, smallest, polar easterlies). Hadley Hot, Ferrel Fill-in, Polar Puny. PYQ 2011 (ans A): Southern westerlies are stronger because the southern hemisphere has less land – not because Coriolis is higher there. PYQ 2015 (ans B): westerlies blow between 30° and 60° (not \"30°N to 60°S\") and bring NW India's winter rain (western disturbances). Jet streams & friends Jet streams: narrow fast bands at 8–15 km. Permanent: Polar (50–60°, strongest in winter) and Subtropical (20–30°). Temporary: Tropical Easterly, Somali. Occur in both hemispheres (PYQ 2020: \"Northern only\" is wrong). Wavy = Rossby waves. They steer storms, carry western disturbances (Mediterranean extra-tropical cyclones, dragged in by the subtropical westerly jet), control the South Asian monsoon, mix troposphere and stratosphere (ozone-depleting substances). Climate change: Arctic warms faster → smaller temperature contrast → weaker, more meandering jets → long heatwaves, coldwaves, droughts or floods. Heat dome: stagnant high pressure; sinking air compresses and warms; mid/high latitudes, continental climates. Polar vortex: cold air held by the polar jet; meanders let it spill south. DANA: isolated depression at high levels (cut-off low). Stratospheric cooling: CO₂ in thin stratosphere radiates heat to space; ozone loss = less UV heating. Effects: slower ozone recovery, more PSCs, stronger polar vortex, disrupted jets. \"Warm troposphere + cooling stratosphere\" is the fingerprint of human-caused change (GHGs affected it by ~1885). Local winds (name → hook) Wind Where Hook Chinook E. Rockies (USA, Canada) warm dry, \"snow eater\" Foehn Alps (leeward) warm dry descending Sirocco (Ghibli, Chili, Khamsin) Sahara → Mediterranean hot, dry; rainy in S. Europe Harmattan W. Africa (Sahara → Guinea) dry, dusty NE trade; \"Doctor\" wind Loo N. India, Pakistan, May–June furious, hot, heatstroke Bora Adriatic (Italy, Slovenia, Croatia) extremely cold dry NE, katabatic Mistral Rhône valley (France) cold NW Santa Ana S. California hot dry; worsens wildfires Khamsin Egypt dusty spring wind, up to 50 days Purga Siberia, Russian steppes icy NE blizzard wind Pamperos Pampas (Argentina, Uruguay, Brazil) violent cold SW 🧣 Hot vs cold: Chinook, Foehn, Sirocco, Harmattan, Loo, Santa Ana = hot/warm · Bora, Mistral, Purga, Pamperos = cold. Mistral & Bora = \"Brrr\" winds. Monsoon (PYQ 2014, ans C): seasonal reversal of winds is typical of the monsoon climate."}, {"c": 2, "n": "Climatology · quick", "id": "q-3-moisture-clouds-precipitation-storms", "t": "3 · Moisture, clouds, precipitation, storms", "x": "Humidity: absolute (g/m³) · relative (% of what air can hold) · specific (g per kg). Dew point = saturation temperature. Dew forms when a surface falls below dew point; no dew on cloudy nights because clouds send the Earth's radiation back (PYQ 2019, ans B). Frost = deposition (vapour → ice). Fog = near-surface cloud. Smog = smoke + fog (sulphurous and photochemical). Haze = dry particles. Atmospheric rivers: narrow moisture corridors (can carry more water than the Amazon) pushed by westerlies/jet streams to mid-latitudes → heavy rain, floods. ☁️ Clouds by height: High (>6,000 m) = Cirrus – wispy ice \"chicken feathers\" · Mid (2,000–6,000 m) = Alto- · Low ( · Cumulonimbus = vertical tower (thunder, hail, tornado). Clouds & climate (PYQ 2022, ans D): high thin clouds trap heat; low thick clouds reflect – so both statements (high cool, low warm) are wrong. PYQ 2019 (ans D): cirrus thinning and sulphate aerosols in the stratosphere are geo-engineering to reduce global warming. Polar stratospheric clouds: 15–25 km, polar winter, below −78 °C; \"nacreous / mother-of-pearl\"; surfaces for ozone destruction (Antarctic ozone hole). Cloud seeding: silver iodide, potassium iodide, salt, dry ice → hygroscopic nuclei; by aircraft or ground generators; for rain, snowpack, fog clearing, hail suppression; works only if moisture exists. Precipitation How Where Convectional heated air rises → cumulonimbus; short, intense, thunder tropics 0–30° Orographic air forced up mountains; rain shadow on lee side mountains Frontal warm air over cooler (warm front = long steady; cold front = short intense) mid-latitudes 30–60° Cyclonic convection/frontal on a large scale around a low cyclones Thunderstorm: 3 stages – cumulus → mature → dissipating. Ice/water collisions give lighter + charge at the top, heavier − charge at the bottom → lightning (air excited N₂/O₂), thunder; lightning conductors on tall buildings. Tornado: rotating funnel from a thunderstorm; >300 km/h; Tornado Alley (Texas → Nebraska) where warm moist Gulf air meets cold dry Canadian air and warm dry desert air → supercells. Waterspouts: over water; fair-weather vs tornadic. Water vapour (PYQ 2024, ans a): amount decreases with altitude; it is not maximum at the poles."}, {"c": 2, "n": "Climatology · quick", "id": "q-4-air-masses-fronts-cyclones", "t": "4 · Air masses, fronts, cyclones", "x": "Air mass: big air body that took on the character of its source (high-pressure, calm regions). Types: mT, cT, mP, cP, cA (+ equatorial). Tropical = warm, polar = cold, continental = dry, maritime = moist. Examples: mT → Amazon, SE Asia rain; cT → Sahara, central Australia; mP → UK, Ireland, Japan Sea coast snow; cP → Siberia, Canadian prairies; cA → N. Canada, Scandinavia cold spells. Fronts: boundary of two air masses; frontogenesis (formation) / frontolysis (death); mid-latitudes; bigger contrast = thinner front; cold fronts move faster. ⚔️ Cold front = Crash (cumulonimbus, thunder, hail) · Warm front = Wet blanket (stratus/cirrostratus, steady drizzle, fog) · Stationary = stalemate (light rain for days) · Occluded = cold overtakes warm (warm or cold occlusion). Tropical vs temperate cyclones Tropical Temperate (extra-tropical) Origin Thermal Dynamic (frontal) Latitude 10–30° 35–65° (more pronounced in N. Hemisphere – bigger temperature contrast) Forms over warm seas only land and sea Size 100–500 km 300–2,000 km Rain heavy, but not beyond a few hours slow, for many days, even weeks Wind 100–250 km/h; more damage from wind, surge, torrential rain 30–150 km/h; more damage from flooding Life not more than a week 2–3 weeks Fronts absent created by fronts India both coasts hit, east coast hot-spot Western Disturbances Names: Cyclone (Indian Ocean) · Hurricane (Atlantic) · Typhoon (W. Pacific, S. China Sea) · Willy-willy (W. Australia). Needs: sea-surface ≥ 26.5 °C (the PYQ note says >27 °C), moisture, low wind shear, a pre-existing disturbance, Coriolis. Depression ≤ 62 km/h → cyclone ≥ 64 knots (74 mph). Structure: eye (calm, clear), eyewall (worst winds/rain), rainbands. Impacts: wind, rain, storm surge, tornadoes. PYQ 2015 (ans B): no cyclones in the S. Atlantic / SE Pacific because the ITCZ seldom occurs there (also strong wind shear, cooler SST, no spin to start). PYQ 2020 (ans C): only some cyclones develop an eye; the eye is not 10 °C cooler. Climate change: warmer seas → more intense storms, more Cat 4–5 (Arabian Sea, N. Atlantic), fewer overall, poleward shift, slower movement, rapid intensification, sea-level rise worsens surge. Temperate cyclones also shift poleward and bring heavier rain."}, {"c": 2, "n": "Climatology · quick", "id": "q-5-climatic-regions-koppen", "t": "5 · Climatic regions (Köppen)", "x": "🔤 Köppen letters: A–tropical humid · B–dry · C–warm temperate · D–cold snow-forest · E–polar · H–highland. Second letters: f no dry season · w winter dry · s dry summer · m monsoon. \"All Big Cities Deserve Extra Halwa.\" Climate (code) Where Look-for hooks (as printed) Equatorial (Af) 10°N–S: Amazon, Congo, Indonesia, PNG 24–27 °C, tiny annual range; convectional 4 pm rain, no dry month; evergreen selvas, hardwoods (mahogany, rosewood, ebony), almost no undergrowth, leached soil; hunters-gatherers, slash-and-burn Savannah (Aw) 10–30°, continental interiors: Sudan, Venezuela, Brazil, N. Australia hot rainy summer, dry winter; tall grass (elephant grass), baobab; Masai pastoralism; \"Big Game country\" Tropical monsoon (Am) 10–30°, E. continental margins: India, Vietnam 3 seasons; 200–250 cm; teak, sal; intensive paddy Hot desert (BWh) W. margins of tropical land, subtropical high, cold currents: Sahara, Kalahari, Mojave, Atacama xerophytes (waxy/thorny leaves, deep roots, succulent stems), date palms at oases; Bedouin, Tuareg, Bushmen Cold desert (BWk) continental interiors: Gobi, Patagonia wide annual range, cold winters; bunchgrasses Steppe (BS) 45–60°, mid-continental: Prairies, Steppes, Downs warm summers, cold winters; Chernozem; wheat/maize, ranching Mediterranean (Cs) 30–45°, west margins: California, Chile, SW S. Africa, SW Australia hot dry summer, winter rain (westerlies); orchards (citrus, olives), vineyards; cork oak, eucalyptus Marine West Coast (Cfb, \"British type\") 45–60°, west margins: NW Europe, SW S. America, NZ mild, rain all year, small annual range; temperate deciduous forest; dairy China type (Cw / Cfa; Gulf & Natal types) 30–45°, east margins: SE China, Japan warm moist summer, cool dry winter; typhoons; most productive mid-latitude farming Taiga / Siberian (Df) 50/60–70°: N. Canada, Eurasia −30 to −40 °C winters; evergreen conifers (softwood, pure stands); fur farms, lumbering Manchurian / Laurentian (Dw) E. margins, N. Hemisphere only: Manchuria, Japan, NE America cold dry winters, wet warm summers; cool temperate forest Polar (ET, EF) Greenland, N. Canada, Alaska, Antarctica summer Handout alert: the Köppen group table labels Df = humid continental and Dw = subarctic, but the regional table labels Taiga = Df and Manchurian = Dw. Remember the names and places, not the D-codes. Numbers in the regional table (e.g. \"150–1000 cm\" for Af) are printed as-is and look scrambled – don't memorise them. Climate PYQs in one glance | Year | Asked | Answer / rule | |---|---|---| | 20
