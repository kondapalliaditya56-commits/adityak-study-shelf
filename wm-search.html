.mm-link.c0,.mm-leaf.c0{stroke:var(--c0)}.mm-link.c1,.mm-leaf.c1{stroke:var(--c1)}.mm-link.c2,.mm-leaf.c2{stroke:var(--c2)}.mm-link.c3,.mm-leaf.c3{stroke:var(--c3)}.mm-link.c4,.mm-leaf.c4{stroke:var(--c4)}.mm-link.c5,.mm-leaf.c5{stroke:var(--c5)}.mm-link.c6,.mm-leaf.c6{stroke:var(--c6)}.mm-link.c7,.mm-leaf.c7{stroke:var(--c7)}
:root:not([data-theme="dark"]) .mm-branch-t{fill:#fff}
.outline,.outline ul{list-style:none;padding-left:18px;margin:4px 0}.outline>li{padding-left:0}.outline summary{cursor:pointer;font:700 15px var(--sans)}
.outline li.c0>details>summary{color:var(--c0)}.outline li.c1>details>summary{color:var(--c1)}.outline li.c2>details>summary{color:var(--c2)}.outline li.c3>details>summary{color:var(--c3)}.outline li.c4>details>summary{color:var(--c4)}.outline li.c5>details>summary{color:var(--c5)}.outline li.c6>details>summary{color:var(--c6)}.outline li.c7>details>summary{color:var(--c7)}
.ol-note{color:var(--muted);font-size:.9em}

.timeline:before{content:"";position:absolute;left:94px;top:0;bottom:0;border-left:2px solid var(--line)}
.tl{display:grid;grid-template-columns:86px 18px 1fr;gap:0 6px;margin:0 0 12px;align-items:start}

.tl.high .tlbody{border-color:var(--saf)}.star{color:var(--saf);margin-left:6px}.sref{float:right;margin-left:10px;font:600 12px var(--sans);text-decoration:none}
.lkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.link{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:15px/1.45 var(--sans)}.link p{margin:4px 0 0;color:var(--muted)}.lk-line{font-weight:700}
.recall{font:16px/1.55 var(--sans);padding-left:24px}.recall li{margin:6px 0}

.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0;font:16px/1.5 var(--sans)}

.q .ex{margin-top:8px;color:var(--muted)}
.deck{margin:10px 0}
.fc{min-height:150px;background:var(--surface);border:2px solid var(--acc);border-radius:14px;padding:22px;display:flex;align-items:center;justify-content:center;text-align:center;font:18px/1.5 var(--serif);cursor:pointer;user-select:none}
.fc.back{background:var(--acc-soft)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.btn{font:600 14px var(--sans);padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:40px 0 20px}.pager a{display:block;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;text-decoration:none;color:var(--ink);font:600 15px var(--sans)}.pager a.nx{text-align:right}.pager small{display:block;color:var(--muted);font-weight:500;font-size:12px}

a.chcard:hover{border-color:var(--acc)}.chcard.pending{opacity:.5}
.chn{font:700 18px var(--mono);color:var(--acc);text-align:center}.cht b{font:700 16px var(--serif);display:block}.cht small{font:13px/1.4 var(--sans);color:var(--muted);display:block;margin-top:2px}

code{font:.88em var(--mono);background:var(--surface2);padding:1px 5px;border-radius:4px}

/* ---- reader app ---- */
:root{--zoom:1;--lh:1.65;--pw:780px}
:root[data-theme="sepia"]{--bg:#F4ECD8;--surface:#FBF5E6;--surface2:#EADFC4;--ink:#3B3022;--muted:#7A6A52;--line:#D8C9A6;--acc:#7A4A12;--acc-ink:#fff;--acc-soft:#EFDDB8;--saf:#A4470A;--saf-soft:#F6E2BE;--red:#9C2A1C;--red-soft:#F3D9CB;--blue:#2F5C8A;--blue-soft:#DDE6E4;--good:#3E6B2A;--good-soft:#DDE8C8;--hl:#F2D98A;color-scheme:light}
:root[data-font="sans"] body{font-family:var(--sans)}
:root[data-font="sans"] .notes p,:root[data-font="sans"] .notes li{font-family:var(--sans)}
.page{zoom:var(--zoom);max-width:var(--pw)}
.notes p,.notes li{line-height:var(--lh)}
.rbar{position:fixed;left:0;top:0;height:3px;width:0;background:var(--acc);z-index:40;transition:width .15s}
.aabtn{color:var(--ink);border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:5px 12px;font:700 14px var(--serif);cursor:pointer;flex:none}
.h2read{float:right;margin:2px 0 0 10px;font:600 12px var(--sans);border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer;min-height:30px}
.h2read[aria-pressed="true"]{background:var(--acc-soft);color:var(--acc);border-color:var(--acc)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;justify-content:center}
.dock button{font:600 14px var(--sans);min-height:44px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;padding:0 14px;cursor:pointer}
.dock .mid{flex:1;max-width:520px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock .mid b{color:var(--acc)}
body.has-dock .page{padding-bottom:110px}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheetin{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:82vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));font:15px/1.4 var(--sans)}
.sheetin h3{margin:0 0 10px;font:700 17px var(--sans)}
.srow{display:flex;align-items:center;gap:10px;margin:12px 0;flex-wrap:wrap}
.srow label{flex:0 0 92px;color:var(--muted);font-weight:600}
.srow .grp{display:flex;gap:6px;flex-wrap:wrap}
.srow button{font:600 14px var(--sans);min-height:42px;min-width:48px;padding:0 12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;cursor:pointer}
.srow button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.secl a{display:flex;gap:10px;align-items:center;padding:12px 6px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;min-height:44px}
.secl a .tk{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--acc-ink)}
.secl a.rd .tk{background:var(--acc);border-color:var(--acc)}
.secl a.cur{background:var(--acc-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:50;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;font:600 14px var(--sans);max-width:92vw;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.toast button{font:700 14px var(--sans);background:transparent;border:0;color:var(--bg);text-decoration:underline;cursor:pointer;min-height:36px}
body.focus .bar{display:none}body.focus .sidetoc{display:none}
figcaption.clamp{max-height:3.3em;overflow:hidden;position:relative;cursor:pointer}

ana, Africa) Antarctica Oceans: Arctic, Atlantic (including Mediterranean Sea & Gulf of Guinea), Southern Major Rivers: Thames (UK, Europe) S.No Line Countries (Mnemonics) 3. Tropic of Cancer North America: Bahamas, Mexico Africa: Libya, Algeria, Western Sahara, Mauritania, Egypt, Niger, Mali ( LAW MEN of Mali ) Asia: Saudi Arabia, United Arab Emirates, Oman, India, Bangladesh, Myanmar, China, Taiwan ( OM BUS TICket ) Oceans: Atlantic (including Gulf of Mexico), Indian (including Red Sea), Pacific The Mahi River (India) is the only river to cross the Tropic of Cancer twice. 4. Tropic of Capricorn South America: Brazil, Chile, Argentina, Paraguay ( Brazilian CAP ) Africa: Mozambique, Madagascar, South Africa, Botswana, Namibia ( MMS BiN ) Australia Oceans: Atlantic, Indian, Pacific The Limpopo River (Africa) is the only river to cross the Tropic of Capricorn twice. Teacher’s map · slide 8 All the countries that lie along the Equator Teacher’s map · slide 9 Countries located on the Prime Meridian Important Latitudes and Longitudes S.No Line Countries (Mnemonics) 5. Arctic Circle North America, Europe and Asia: Denmark (Greenland), Iceland, Sweden, Canada, Russia, Finland, USA (Alaska), Norway ( DISC R FUN ) Oceans: Arctic Ocean 6. Antarctic Circle No Countries. Entirely through the Southern Ocean 7. Internation al Date Line To ensure the entire country stays on the same date, the IDL bends along countries like Kiribati, the Aleutian Islands (Alaska), and Eastern Russia. Ocean: Pacific"}, {"c": "1", "n": "World Basics: Countries, Latitudes and Longitudes", "id": "mnemonics", "t": "Teacher’s mnemonics", "x": "Teacher’s mnemonics # The teacher’s own words for each list, kept exactly. Each shows the countries from the slide row. Teacher’s mnemonic · slide 6 B E C BEC → Brazil, Ecuador, Columbia (BEC) Teacher’s mnemonic · slide 6 C G i D U K S S CGi DUKSS → Congo (Republic of Congo), Gabon, Democratic Republic of Congo, Uganda, Kenya, Sao Tome and Principe, Somalia (CGi DU wing countries of South-West Asia does not open out to the Mediterranean Sea? Jorda… B Handout Q6 2017 The Mediterranean Sea is a border of which of the following countries? 1. Jordan 2. Iraq 3. Lebanon 4. Sy… C Handout Q7 2017 Which of the following is geographically closest to Great Nicobar? The distance between the Great Nicobar… A Handout Q8 2019 Pairs/list: Sea Bordering country 1. Adriatic Sea : Albania 2. Black Sea : Croatia 3. Caspian Sea : Kazak… B Handout Q9 2020 Pairs/list: River - Flows into 1. Mekong- Andaman Sea 2. Thames - Irish Sea 3. Volga - Caspian Sea 4. Zam… C Handout Q10 2022 The term \"Levant\" often heard in the news roughly corresponds to which of the following regions? A Handout Q11 n/a Pairs/list: 1. Azerbaijan 2. Kyrgyzstan 3. Tajikistan 4. Turkmenistan 5. Uzbekistan Which of the above ha… C Handout Q12 2024 Pairs/list: 1. The Red Sea receives very little precipitation in any form. 2. No water enters the Red Sea… C Handout Q17 2025 Pairs/list: I. Lake Tanganyika II. Lake Tonlé Sap III. Patos Lagoon Through how many of them does the equ… D Handout Q21 2026 Ships from which of the following countries have to cross the Strait of Hormuz to reach out to the Indian… B Handout Q24 Prelims hooks Location pairs dominate: Turkey between Black Sea and Mediterranean (2014), Golan Heights (2015), Levant (2022), Strait of Hormuz and who must cross it (2026). Border and coast questions: which West Asian country has no Mediterranean coast (Jordan, 2015), which countries touch Afghanistan, the Kra isthmus versus Malacca (2011). Sequence and distance questions: south-to-north order of South-East Asian cities (2014), nearest island to Great Nicobar (2017), rivers and the sea they enter (2020). Map drill: the teacher’s annotated maps are the exam tool here. Every map slide of this chapter sits beside its tables."}, {"c": "2", "n": "Asia", "id": "terms", "t": "In simple words", "x": "In simple words # Asia is the biggest continent; most questions ask where a feature lies, which countries border a sea or river, or which strait links which waters."}, {"c": "2", "n": "Asia", "id": "1-regions-of-asia-and-the-continent-at-a-g", "t": "1 · Regions of Asia and the continent at a glance", "x": "1 · Regions of Asia and the continent at a glance # Class slides 11–15 Teacher’s map · slide 11 Political map of Asia The different regions of Asia include: West Asia (South-West Asia): Turkey, Iran, Iraq, Syria, Lebanon, Israel, Jordan, Afghanistan, and Arabian Peninsula & Gulf states (Saudi Arabia, Yemen, Oman, UAE, Qatar, Bahrain, Kuwait). (Palestine is often shown separately.) South Asia: Bangladesh, Bhutan, India, Maldives, Nepal, Pakistan, Sri Lanka. South-East Asia: Brunei, Cambodia, Indonesia, Laos, Malaysia, Myanmar, Philippines, Singapore, Thailand, Vietnam, Timor-Leste. East Asia: China, Mongolia, North Korea, South Korea, Japan (Taiwan considers itself independent but is not recognised by the UN and almost 75% of the countries). Central Asia: Kazakhstan, Kyrgyzstan, Tajikistan, Turkmenistan, Uzbekistan. North Asia: Asiatic Russia (Siberia). S.No. Particulars Facts 1. Continent Size 44.61 million sq. km 2. Highest Point Mt. Everest – 8848 m (Fig. 7.4) 3. Lowest Point 430-440m – Dead Sea, Israel 4. Longest Range Himalayas (2,400 km) 5. Largest Island Borneo (743,330 sq. km) (as New Guinea is split between Asia and Oceania) 6. Largest Lake Caspian Sea (371,000 sq. km) 7. Deepest Lake Lake Baikal: 1620 m (31,499 sq. km) 8. Longest River Chang Jiang (Yangtze Kiang) (6,300 km) 9. Second Longest River Yellow (Huang He) (5,464 km) 10. Wettest Place Mawsynram – 1,080 cm of rain in a year (Meghalaya, India) 11. Northernmost Point Cape Chelyuskin (Russia) 12. Southernmost Point Pamana Island (Indonesia) For the mainland Asia, it is Tanjung Piai, Malaysia 13. Westernmost Point Cape Baba (Anatolian, Turkey) 14. Easternmost Point Big Diomede (Diomede Islands, Russia) For the mainland Asia, it is Cape Dezhnev (Russia) 15. Largest Delta The Sundarban delta (in India and Bangladesh) 16. Highest Plateau Tibet (the highest plateau in the world, often called the ‘Roof of the World’) Teacher’s map · slide 15 Important features of Asia"}, {"c": "2", "n": "Asia", "id": "2-mountain-ranges-and-volcanoes", "t": "2 · Mountain ranges and volcanoes", "x": "2 · Mountain ranges and volcanoes # Class slides 16–20 Important Mountain Ranges S.No Mountain Range Characteristics Countries 1 Pamir Knot Point from where major ranges (Hindukush, Kunlun Shan, Tian Shan, Karakoram and Himalayas) radiate outwards; convergence of Eurasian & Indian plates Tajikistan, Afghanistan, China, Pakistan ( PACT ) 2 Himalayas Young Fold Mountains; high seismicity; the tallest range of the world; includes the world’s highest peak: Mt. Everest (8848 m) India, Pakistan, Nepal, China (Tibet), Bhutan 3 Trans- Himalayas Karakoram, Ladakh, Zaskar, Kailash; Fold mountains created due to the convergence of Eurasian and Indian plates; Contain the 2nd highest peak of the world: Mt. Godwin Austin (K2) India, China primarily, with small extensions of the Karakoram in Pakistan. S.No Mountain Range Characteristics Countries 4 Kunlun Shan Northern border of the Tibetan Plateau China 5 Tien Shan (also called Celestial Mountains) A combination of fold and fault mountains, created by reactivation of local faults due to convergence of the Indian & Eurasian Plates; it is earthquake-prone. Kazakhstan, Kyrgyzstan, Uzbekistan, China 6 Hindukush Extends from Pamir Knot, acting as a natural boundary between Iranian Plateau and Indian Plate. Its southern extension is called the Sulaiman mountains Pakistan, Afghanistan, Tajikistan ( PAT ) 7 Kirthar Western edge of the Indian plate; arid rocky terrain Pakistan 8 Altai Origin of Ob & Irtysh rivers Russia, Mongolia, China, Kazakhstan S.No Mountain Range Characteristics Countries 9 Zagros Western boundary of the Iranian Plateau; created due to Arabian and Eurasian plate convergence; oil & gas rich Iran, Iraq, Turkey 10 Elbu esund, Svalbard, Norway, about 1,200 km from the North Pole. It was inaugurated on 1 July 2008 and serves as the hub of India’s Arctic scientific studies. Teacher’s map · slide 172 Indian research stations in Antarctica ANTARCTICA Mountain Ranges of Antarctica The important mountain ranges of Antarctica include: Trans-Antarctic Mountains: One of the world’s longest mountain chains, stretching about 3,400 km; they separate East and West Antarctica. They are fault mountains associated with the West Antarctic Rift System created during the Gondwana Rift. Ellsworth Mountains: This is a major mountain system of West Antarctica. It includes the Sentinel Range and Vinson Massif / Vinson, the highest point in Antarctica at about 4,892 m. Important Glaciers of Antarctica Glacier Location Key features/significance Lambert Glacier East Antarctica One of the largest glacier systems in the world Pine Island Glacier West Antarctica One of Antarctica’s most rapidly changing glaciers; a major source of present Antarctic ice loss. Thwaites Glacier West Antarctica Often nicknamed the “Doomsday Glacier”, because it is holding back vast amounts of inland ice, but it is now retreating at an accelerated pace. Beardmore Glacier Transantarctic Mountains One of the world’s largest valley glaciers; historically famous as a major route used in early Antarctic exploration toward the polar plateau. Totten Glacier East Antarctica One of the most important East Antarctic outlet glaciers"}, {"c": "8", "n": "Antarctica and the Polar Waters", "id": "2-water-bodies-around-antarctica", "t": "2 · Water bodies around Antarctica", "x": "2 · Water bodies around Antarctica # Class slides 175–176 Teacher’s map · slide 175 Important features of Antarctica Important Water Bodies around Antarctica The Southern Ocean and its marginal water bodies surround the continent of Antarctica. Let us take a look at these in Table 7.73 and Fig 7.39. Name Type Location Important features Ross Sea Marginal sea South of New of the Pacific Ocean include Bering Sea, Sea of Okhotsk, Sea of Japan (East Sea), Yellow Sea, East China Sea, South China Sea, Philippine Sea, Coral Sea, Tasman Sea, Sulu Sea, and Celebs Sea (Sulawesi Sea) Feature Details East Pacific Rise Divergent boundary; Pacific Plate moving apart from Nazca, Cocos, and Antarctic Plates; very fast spreading Clarion–Clipperton Zone Lies between the Clarion and Clipperton fracture zones. The most vast abyssal Pacific region; rich in polymetallic nodules consisting of Mn, Ni, Cu, Co Great Barrier Reef World’s largest coral reef system; about 2,900 reefs; Coral Sea; UNESCO site Great Pacific Garbage Patch Major debris accumulation zone in North Pacific; main patch is between Hawaii and California; the western patch lies to the east of Japan"}, {"c": "9", "n": "Oceans of the World", "id": "2-atlantic-ocean", "t": "2 · Atlantic Ocean", "x": "2 · Atlantic Ocean # Class slides 181–183 Atlantic Ocean This is the ocean that lies between the Americas to the West and Europe and Africa to the East and is often considered the busiest ocean in the world. Feature Details Mid-Atlantic Ridge The longest mountain chain on Earth and the major seafloor-spreading ridge of the Atlantic. It runs roughly down the middle of the ocean and includes sections such as the North Atlantic Ridge and South Atlantic Ridge. Puerto Rico Trench The deepest part of the Atlantic Ocean, reaching about 8.3–8.4 km. It marks a complex boundary between the North American Plate and the Caribbean Plate, with oblique subduction / strike-slip boundary. South Sandwich Trench Major trench in the South Atlantic / Scotia Arc region. It is associated with subduction involving the South America Plate and the Sandwich microplate / South Sandwich Plate. Georges Bank A submerged bank east of Massachusetts, USA, long known as an important fishing ground due to the meeting of Gulf Stream and Labrador Current. Grand Banks Off Newfoundland, Canada; one of the world’s most famous fishing grounds due to the meeting of Gulf Stream and Labrador Current. Atlantic Ocean The important marginal water bodies of the Atlantic Ocean include the Mediterranean Sea, North Sea, Baltic Sea, Black Sea, Caribbean Sea, Gulf of Mexico, Gulf of St. Lawrence, Hudson Bay, Baffin Bay, Labrador Sea, Norwegian Sea, Irish Sea, English Channel, and Sargasso Sea. Feature Details Romanche Fracture Zone / Romanche Trench Important equatorial Atlantic fracture zone cutting across the Mid-Atlantic Ridge. It is a major transform feature and one of the deepest parts of the equatorial Atlantic basin. Walvis Ridge A major submarine ridge in the South Atlantic, extending from the African margin toward the Mid-Atlantic Ridge. Teacher’s map · slide 183 Atlantic Ocean: ridge, fracture zone, trenches and banks"}, {"c": "9", "n": "Oceans of the World", "id": "3-indian-ocean", "t": "3 · Indian Ocean", "x": "3 · Indian Ocean # Class slides 184–186 Indian Ocean It is to the south of Asia, East of Africa, and West of Australia. It is the warmest of all the oceans. It is often called the “half-ocean”, as unlike the Pacific and Atlantic Oceans, it is landlocked in the North. Feature Details Carlsberg Ridge Northern segment of the Indian Ocean ridge system in the Arabian Sea; extends toward the Gulf of Aden. Central Indian Ridge (CIR) Major seafloor-spreading ridge in the central Indian Ocean; part of the inverted-Y ridge system of Indian Ocean. Southwest Indian Ridge Ridge branch between Africa and Antarctica; spreading boundary between African and Antarctic plates. Southeast Indian Ridge Ridge branch between Australia and Antarctica; spreading boundary with the Antarctic Plate. Rodrigues Triple Junction Junction where major branches of the Indian Ocean ridge system diverge. Ninetyeast Ridge Long volcanic ridge near 90°E; interpreted as the trace of the Kerguelen/Ninetyeast hotspot. Indian Ocean Feature Details Chagos–Lakshadweep Ridge / Plateau Major volcanic-tectonic ridge/plateau feature in the northern-central Indian Ocean. Created by the Reunion hotspot. Kerguelen Plateau Huge submarine plateau; among the most important igneous/oceanic features of the Indian Ocean. Réunion hotspot Active hotspot expressed by Piton de la Fournaise volcano Sunda / Java Trench Major subduction trench south of Sumatra-Java; deepest point of the Indian Ocean is the Sunda Deep at about 7,450 m. Makran Subduction Zone Off Iran-Pakistan coast; Arabian Plate subducts beneath Eurasia; important seismic and tsunami hazard zone. Teacher’s map · slide 186 Indian Ocean: ridges, plateaus, trenches and hotspot"}, {"c": "9", "n": "Oceans of the World", "id": "4-arctic-ocean", "t": "4 · Arctic Ocean", "x": "4 · Arctic Ocean # Class slide 187 Arctic Ocean It is the smallest, shallowest, and coldest ocean in the world. It surrounds the North Pole. It is connected to the Pacific Ocean via the Bering Strait. It is also connected to the Atlantic Ocean via the Fram Strait (between Greenland and Svalbard), the Denmark Strait (between Greenland and Iceland), and the Norwegian Sea. The deepest point of the Arctic Ocean is the Molloy Deep (or Molloy Hole), located in the Fram Strait between Greenland and Svalbard. Its important marginal water bodies include Barents Sea, Beaufort Sea, Chukchi Sea, East Siberian Sea, Greenland Sea, Kara Sea, Laptev Sea, and White Sea. Teacher’s map · slide 187 The Arctic Ocean"}, {"c": "9", "n": "Oceans of the World", "id": "5-southern-ocean", "t": "5 · Southern Ocean", "x": "5 · Southern Ocean # Class slide 188 Southern Ocean It is the fourth largest and the newest ocean of the world. It was proposed by the International Hydrographic Organisation in the year 2000 to include the waters south of 60 degrees South latitude. Not all countries recognise it, but India does. The deepest point of the Southern Ocean is the Factorian Deep within the South Sandwich Trench. The important marginal water bodies of the Southern Ocean include Weddell Sea, Ross Sea, Amundsen Sea, Bellingshausen Sea, Davis Sea, Lazarev Sea, and Somov Sea. Teacher’s map · slide 188 The Southern Ocean"}, {"c": "9", "n": "Oceans of the World", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Mariana Trench (Oceans of the World) → Location: Western Pacific, near Guam | Plates involved / Key features: Pacific Plate under Philippine Sea Plate; Challenger Deep Tonga Trench (Oceans of the World) → Location: South Pacific, near Tonga | Plates involved / Key features: Pacific Plate subduction; one of the deepest trenches Kuril–Kamchatka Trench (Oceans of the World) → Location: NW Pacific, off Russia–Japan | Plates involved / Key features: Pacific Plate under Okhotsk microplate Peru–Chile Trench (Oceans of the World) → Location: Eastern Pacific, off South America | Plates involved / Key features: Nazca Plate under South American Plate Philippine Trench (Oceans of the World) → Location: West Pacific, near Philippines | Plates involved / Key features: Philippine Sea Plate under Philippine Mobile Belt Japan Trench (Oceans of the World) → Location: NW Pacific, off Japan | Plates involved / Key features: Pacific Plate under Okhotsk / North American side Kermadec Trench (Oceans of the World) → Location: South Pacific, near New Zealand | Plates involved / Key features: Pacific Plate subduction; part of Tonga–Kermadec arc Aleutian Trench (Oceans of the World) → Location: North Pacific, near Alaska | Plates involved / Key features: Pacific Plate under North American Plate Middle America Trench (Oceans of the World) → Location: Eastern Pacific, off Central America | Plates involved / Key features: Cocos Plate under North American and Caribbean Plates East Pacific Rise (Oceans of the World) → Details: Divergent boundary; Pacific Plate moving apart from Nazca, Cocos, and Antarctic Plates; very fast spreading Clarion–Clipperton Zone (Oceans of the World) → Details: Lies between the Clarion and Clipperton fracture zones. The most vast abyssal Pacific region; rich in polymetallic nodules consisting of Mn, Ni, Cu, Co Great Barrier Reef (Oceans of the World) → Details: World’s largest coral reef system; about 2,900 reefs; Coral Sea; UNESCO site Great Pacific Garbage Patch (Oceans of the World) → Details: Major debris accumulation zone in North Pacific; main patch is between Hawaii and California; the western patch lies to the east of Japan Mid-Atlantic Ridge (Oceans of the World) → Details: The longest mountain chain on Earth and the major seafloor-spreading ridge of the Atlantic. It runs roughly down the middle of the ocean and includes sections such as the North Atlantic Ridge and South Atlantic Ridge."}, {"c": "9", "n": "Oceans of the World", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Redraw every map below from memory Day +45 Blank-page test: maps and mnemonics only Blank-map drills (redraw the teacher’s maps) Redraw \"Important trenches and features of the Pacific Ocean\" (slide 179) on a blank outline and mark at least: Mariana Trench; Tonga Trench; Kuril–Kamchatka Trench; Peru–Chile Trench; Philippine Trench; Japan Trench; Kermadec Trench; Aleutian Trench. Redraw \"Atlantic Ocean: ridge, fracture zone, trenches and banks\" (slide 183) on a blank outline and mark at least: Mid-Atlantic Ridge; Puerto Rico Trench; South Sandwich Trench; Georges Bank; Grand Banks; Romanche Fracture Zone / Romanche Trench; Walvis Ridge. Redraw \"Indian Ocean: ridges, plateaus, trenches and hotspot\" (slide 186) on a blank outline and mark at least: Carlsberg Ridge; Central Indian Ridge (CIR); Southwest Indian Ridge; Southeast Indian Ridge; Rodrigues Triple Junction; Ninetyeast Ridge; Chagos–Lakshadweep Ridge / Plateau; Kerguelen Plateau. Redraw \"The Arctic Ocean\" (slide 187) on a blank outline and mark at least: every feature the teacher marked. Redraw \"The Southern Ocean\" (slide 188) on a blank outline and mark at least: every feature the teacher marked."}, {"c": "9", "n": "Oceans of the World", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Every card is a row of the slide tables. Back Shuffle Next"}, {"c": "10", "n": "World Mapping PYQ Bank (handout)", "id": "about", "t": "About this bank", "x": "About this bank # Questions, options, answers and explanations are exactly as the handout prints them, with the handout maps. Where the handout contradicts itself it is flagged in a check box."}, {"c": "10", "n": "World Mapping PYQ Bank (handout)", "id": "pyq-1", "t": "Q1 · 2011 · Between India and East Asia, the navigation-time and distanc", "x": "Q1 · 2011 · Between India and East Asia, the navigation-time and distanc # Handout Q1 Between India and East Asia, the navigation-time and distance can be greatly reduced by which of the following? 1. Deepening the Malacca Straits between Malaysia and Indonesia. 2. Opening a new canal across the Kra isthmus between the Gulf of Siam and Andaman sea. Which of the statements given above is/are correct? (2011) a) 1 only. b) 2 only. c) Both 1 and 2 d) Neither 1 nor 2 Answer B Opening a new canal in Kra Isthmus can reduce the navigation time and distance. Malacca Strait is the main shipping channel between the Indian Ocean and the Pacific Ocean and links India, China, Japan and South Korea.The Strait of Malacca or Straits of Malacca is a narrow stretch of water, 580 mi in length, between the Malay Peninsula and the Indonesian island of Sumatra. As the main shipping channel between the Indian and Pacific oceans, it is one of the most important shipping lanes in the world. The issue of deepening of the Malacca Strait is “linked” to its economic importance rather than “time of navigation and distance”. Handout map Map printed in the handout beside this question"}, {"c": "10", "n": "World Mapping PYQ Bank (handout)", "id": "pyq-2", "t": "Q2 · 2013 · Which one of the following pairs is correctly matched? Geogr", "x": "Q2 · 2013 · Which one of the following pairs is correctly matched? Geogr # Handout Q2 Which one of the following pairs is correctly matched? (2013) Geographical Feature Region a) Abyssinian Plateau Arabia b) The Atlas Mountains North-Western Africa c) Guiana Highlands South-Western Africa d) Okavango Basin Patagonia Answer B The Atlas Mountains are a mountain range in the Maghreb. It stretches around 2,500 km (1,600 mi) through Morocco, Algeria and Tunisia. The range's highest peak is Toubkal, with an elevation of 4,167 metres (13,671 ft) in southwestern Morocco. It separates the Mediterranean and Atlantic coastlines from the Sahara Desert. The Abyssinian plateau is in Ethiopia (in Africa). Guiana Highland is in South America. Okavango basin/swamp in the Southern part of Africa."}, {"c": "10", "n": "World Mapping PYQ Bank (handout)", "id": "pyq-3", "t": "Q3 · 2014 · Turkey is located between This is map based question, please", "x": "Q3 · 2014 · Turkey is located between This is map based question, please # Handout Q3 Turkey is located between (2014) a) Black Sea and the Caspian Sea b) Black Sea and the Mediterranean Sea c) Gulf of Suez and the Mediterranean Sea d) Gulf of Aqaba and the Dead Sea Answer B This is map based question, please refer map Handout map Map printed in the handout beside this question"}, {"c": "10", "n": "World Mapping PYQ Bank (handout)", "id": "pyq-4", "t": "Q4 · 2014 · What is the correct sequence of occurrences of the following", "x": "Q4 · 2014 · What is the correct sequence of occurrences of the following # Handout Q4 What is the correct sequence of occurrences of the following cities in South-East Asia as one proceeds from south to north? 1. Bangkok 2. Hanoi 3. Jakarta 4. Singapore Select the correct answer using the code given below. (2014) a) 4-2-1-3 b) 3-2-4-1 c) 3-4-1-2 d) 4-3-2-1 Answer C This is map based question, please refer map Handout map Map printed in the handout beside this question"}, {"c": "10", "n": "World Mapping PYQ Bank (handout)", "id": "pyq-5", "t": "Q5 · 2015 · The area known as ‘Golan Heights’ sometimes appears in the n", "x": "Q5 · 2015 · The area known as ‘Golan Heights’ sometimes appears in the n # Handout Q5 The area known as ‘Golan Heights’ sometimes appears in the news in the context of the events related to (2015) a) Central Asia b) Middle East c) South-East Asia d) Central Africa Answer B The Golan Heights or simply the Golan is a region in the Levant, spanning about 1,800 square kilometres (690 sq mi). The region defined as the Golan Heights differs between disciplines: as a geological and biogeographical region, the Golan Heights is a basaltic plateau bordered by the Yarmouk River in the south, the Sea of Galilee and Hula Valley in the west, the Anti-Lebanon with Mount Hermon in the north and Wadi Raqqad in the east; and as a geopolitical region, the Golan Heights is the area captured from Syria and occupied by Israel during the Six-Day War, territory which Israel effectively annexed in 1981. This region includes the western two-thirds of the geological Golan Heights, as well as the Israeli-occupied part of Mount Hermon."}, {"c": "10", "n": "World Mapping PYQ Bank (handout)", "id": "pyq-6", "t": "Q6 · 2015 · Which one of the following countries of South-West Asia does", "x": "Q6 · 2015 · Which one of the following countries of South-West Asia does # Handout Q6 Which one of the following countries of South-West Asia does not open out to the Mediterranean Sea? (2015) a) Syria b) Jordan c) Lebanon d) Israel Answer B Jordan officially the Hashemite Kingdom of Jordan is an Arab country in Western Asia, on the East Bank of the Jordan River. Jordan is bordered by Saudi Arabia to the south, Iraq to the north-east, Syria to the north and Israel and Palestine (West Bank) to the west. The Dead Sea is located along its western borders and the country has a small coastline to the Red Sea in its extreme south-west but is otherwise landlocked. Jordan is strategically located at the crossroads of Asia, Africa and Europe. The capital, Amman, is Jordan's most populous city as well as the country's economic, political and cultural centre"}, {"c": "10", "n": "World Mapping PYQ Bank (handout)", "id": "pyq-7", "t": "Q7 · 2017 · The Mediterranean Sea is a border of which of the following", "x": "Q7 · 2017 · The Mediterranean Sea is a border of which of the following # Handout Q7 The Mediterranean Sea is a border of which of the following countries? 1. Jordan 2. Iraq 3. Lebanon 4. Syria Select the correct answer using the code given below: (2017) a) 1, 2 and 3 only b) 2 and 3 only c) 3 and 4 only d) 1, 3 and 4 only Answer C Map based question At present , 21 countries, with surface areas from 2 km2 to 2.4 million km2, have coastlines on the Mediterranean Sea. They are Albania, Algeria, Bosnia and Herzegovina, Croatia, Cyprus, Egypt, France, Greece, Israel, Italy, Lebanon, Libya, Malta, Monaco, Montenegro, Morocco, Slovenia, Spain, Syria, Tunisia, and Turkey. Handout map Map printed in the handout beside this question"}, {"c": "10", "n": "World Mapping PYQ Bank (handout)", "id": "pyq-8", "t": "Q8 · 2017 · Which of the following is geographically closest to Great Ni", "x": "Q8 · 2017 · Which of the following is geographically closest to Great Ni # Handout Q8 Which of the following is geographically closest to Great Nicobar? (2017) a) Sumatra b) Borneo c) Java d) Sri Lanka Answer A The distance between the Great Nicobar and Sumatra – 1192 km The distance between the Great Nicobar and Borneo – 2398 km The distance between the Great Nicobar and Java – 2484 km The distance between the Great Nicobar and Sri Lanka – 1437 km"}, {"c": "10", "n": "World Mapping PYQ Bank (handout)", "id": "pyq-9", "t": "Q9 · 2019 · Pairs/list: Sea Bordering country 1. Adriatic Sea : Albania", "x": "Q9 · 2019 · Pairs/list: Sea Bordering country 1. Adriatic Sea : Albania # Handout Q9 Consider the following pairs: Sea Bordering country 1. Adriatic Sea : Albania 2. Black Sea : Croatia 3. Caspian Sea : Kazakhstan 4. Mediterranean Sea : Morocco 5. Red Sea : Syria Which of the pairs given above are correctly matched? (2019) a) 1, 2 and 4 only b) 1, 3 and 4 only c) 2 and 5 only d) 1, 2, 3, 4 and 5 Answer B The countries with coasts on the Adriatic are Albania, Bosnia and Herzegovina, Croatia, Italy, Montenegro and Slovenia. Croatia does not border with the Black Sea Kazakhstan shares a border with the Caspian Sea Handout map Map printed in the handout beside this question"}, {"c": "10", "n": "World Mapping PYQ Bank (handout)", "id": "pyq-10", "t": "Q10 · 2020 · Pairs/list: River - Flows into 1. Mekong- Andaman Sea 2. Tha", "x": "Q10 · 2020 · Pairs/list: River - Flows into 1. Mekong- Andaman Sea 2. Tha # Handout Q10 Consider the following pairs: River - Flows into 1. Mekong- Andaman Sea 2. Thames - Irish Sea 3. Volga - Caspian Sea 4. Zambezi - Indian Ocean Which of the pairs given above is/are correctly matched? (2020) a) 1 and 2 only b) 3 only c) 3 and 4 only d) 1, 2 and 4 only Answer C Mekong empties into the South China Sea at the Mekong Delta in Vietnam. Statement 1 is incorrect. Thames rives lows into the North Sea via the Thames Estuary. Statement 2 is incorrect. The Volga is the longest river in Europe. Situated in Russia, it flows through Central Russia to Southern Russia and into the Caspian Sea. The Volga has a length of 3,531 km, and a catchment area of 1,360,000 km2. It is also Europe's largest river in terms of discharge and of drainage basin. The Zambezi River is the fourth-longest river in Africa, the longest east-flowing river in Africa and the largest flowing into the Indian Ocean from Africa. The area of its basin is 1,390,000 square kilometres, slightly less than half of the Nile's."}, {"c": "10", "n": "World Mapping PYQ Bank (handout)", "id": "pyq-11", "t": "Q11 · 2022 · The term \"Levant\" often heard in the news roughly correspond", "x": "Q11 · 2022 · The term \"Levant\" often heard in the news roughly correspond # Handout Q11 The term \"Levant\" often heard in the news roughly corresponds to which of the following regions? (2022) (a) Region along the eastern Mediterranean shores (b) Region along North African shores stretching from Egypt to Morocco (c) Region along Persian Gulf and Horn of Africa (d) The entire coastal areas of Mediterranean Sea Answer A Levant, the region along the eastern Mediterranean shores, roughly corresponding to modern-day Israel, Jordan, Lebanon, Syria, and certain adjacent areas."}, {"c": "10", "n": "World Mapping PYQ Bank (handout)", "id": "pyq-12", "t": "Q12 · year not printed · Pairs/list: 1. Azerbaijan 2. Kyrgyzstan 3. Tajikistan 4. Tur", "x": "Q12 · year not printed · Pairs/list: 1. Azerbaijan 2. Kyrgyzstan 3. Tajikistan 4. Tur # Handout Q12 Consider the following countries: 1. Azerbaijan 2. Kyrgyzstan 3. Tajikistan 4. Turkmenistan 5. Uzbekistan Which of the above have borders with Afghanistan? (a) 1, 2 and 5 only (b) 1, 2, 3 and 4 only (c) 3, 4 and 5 only (d) 1, 2, 3, 4 and 5 Answer (c) Handout map Map printed in the handout beside this question"}, {"c": "10", "n": "World Mapping PYQ Bank (handout)", "id": "pyq-14", "t": "Q14 · 2023 · Pairs/list: 1. Bulgaria 2. Czech Republic 3. Hungary 4. Latv", "x": "Q14 · 2023 · Pairs/list: 1. Bulgaria 2. Czech Republic 3. Hungary 4. Latv # Handout Q14 Consider the following countries: 1. Bulgaria 2. Czech Republic 3. Hungary 4. Latvia 5. Lithuania 6. Romania How many of the above-mentioned countries share a land border with Ukraine? (2023) (a) Only two (b) Only three (c) Only four (d) Only five Answer (b) Only three Country Shares land border with Notes Ukraine? Bulgaria No Separated by Romania and the Black Sea Czech Republic No Located west of Ukraine, does not touch it Hungary Yes Shares a southwestern border with Ukraine Latvia No Located north of Lithuania, doesn't border Ukraine Lithuania No Borders Belarus, but not Ukraine Romania Yes Shares a southern border with Ukraine Additionally, Ukraine also borders: Poland Slovakia Moldova Russia Belarus"}, {"c": "10", "n": "World Mapping PYQ Bank (handout)", "id": "pyq-15", "t": "Q15 · 2023 · Pairs/list: Regions often mentioned in news Reason for being", "x": "Q15 · 2023 · Pairs/list: Regions often mentioned in news Reason for being # Handout Q15 Consider the following pairs: Regions often mentioned in news Reason for being in news 1. North Kivu and Ituri War between Armenia and Azerbaijan 2. Nagorno-Karabakh Insurgency in Mozambique 3. Kherson and Zaporizhzhia Dispute between Israel and Lebanon How many of the above pairs are correctly matched? (2023) (a) Only one (b) Only two (c) All three (d) None Answer (a) Only one Explanation: 1. North Kivu and Ituri ○ Location: Eastern Democratic Republic of the Congo (DRC) ○ In News Because Of: Armed conflict involving rebel groups (like M23), ethnic violence, and presence of militias such as the Allied Democratic Forces (ADF) ○ Incorrect match: NOT related to Armenia-Azerbaijan war 2. Nagorno-Karabakh ○ Location: Disputed territory between Armenia and Azerbaijan ○ In News Because Of: Armed conflict and territorial dispute between Armenia and Azerbaijan , including a recent Azerbaijani offensive in 2023 ○ Incorrect match: NOT related to insurgency in Mozambique 3. Kherson and Zaporizhzhia ○ Location: Southern Ukraine ○ In News Because Of: Russian invasion of Ukraine; these regions are part of occupied or contested areas in the Russia–Ukraine war ○ Incorrect match: NOT related to Israel–Lebanon dispute Which one is correctly matched? None of the reasons listed are correctly matched to the region."}, {"c": "10", "n": "World Mapping PYQ Bank (handout)", "id": "pyq-16", "t": "Q16 · 2024 · The longest border between any two countries in the world is", "x": "Q16 · 2024 · The longest border between any two countries in the world is # Handout Q16 The longest border between any two countries in the world is between (2024): (a) Canada and the United States of America (b) Chile and Argentina (c) China and India (d) Kazakhstan and Russian Federation Answer (a)"}, {"c": "10", "n": "World Mapping PYQ Bank (handout)", "id": "pyq-17", "t": "Q17 · 2024 · Pairs/list: 1. The Red Sea receives very little precipitatio", "x": "Q17 · 2024 · Pairs/list: 1. The Red Sea receives very little precipitatio # Handout Q17 Consider the following statements: 1. The Red Sea receives very little precipitation in any form. 2. No water enters the Red Sea from rivers. Which of the statements given above is/are correct? (2024) (a) 1 only (b) 2 only (c) Both 1 and 2 (d) Neither 1 nor 2 Answer (c)"}, {"c": "10", "n": "World Mapping PYQ Bank (handout)", "id": "pyq-18", "t": "Q18 · 2024 · Pairs/list: 1. Finland 2. Germany 3. Norway 4. Russia How ma", "x": "Q18 · 2024 · Pairs/list: 1. Finland 2. Germany 3. Norway 4. Russia How ma # Handout Q18 Consider the following countries : 1. Finland 2. Germany 3. Norway 4. Russia How many of the above countries have a border with the North Sea? (2024) (a) Only one (b) Only two (c) Only three (d) All four Answer (b) Handout map Map printed in the handout beside this question For U, Burgers are Neither Good Nor So Disgusting"}, {"c": "10", "n": "World Mapping PYQ Bank (handout)", "id": "pyq-19", "t": "Q19 · 2024 · Pairs/list: Region Name of the mountain Type of range mounta", "x": "Q19 · 2024 · Pairs/list: Region Name of the mountain Type of range mounta # Handout Q19 Consider the following information: Region Name of the mountain Type of range mountain 1. Central Asia Vosges Fold mountain 2. Europe Alps Block mountain 3. North Appalachians Fold mountain America 4. South Andes Fold mountain America In how many of the above rows is the given information correctly matched? (2024) (a) Only one (b) Only two (c) Only three (d) All four Answer (b)"}, {"c": "10", "n": "World Mapping PYQ Bank (handout)", "id": "pyq-20", "t": "Q20 · 2025 · Pairs/list: I. Bolivia II. Brazil III. Colombia IV. Ecuador", "x": "Q20 · 2025 · Pairs/list: I. Bolivia II. Brazil III. Colombia IV. Ecuador # Handout Q20 Consider the following countries: I. Bolivia II. Brazil III. Colombia IV. Ecuador V. Paraguay VI. Venezuela Andes mountains pass through how many of the above countries? (2025) (a) Only two (b) Only three (c) Only four (d) Only five Answer c 1. Bolivia: The Andes traverse western Bolivia, including cities like La Paz and Sucre. 2. Brazil lies east of the Andes and does not contain any part of the mountain range. 3. Columbia: The Andes split into three branches (Cordillera Occidental, Central, and Oriental) in Colombia. 4. Ecuador: The Andes bisect Ecuador from north to south, including the Avenue of the Volcanoes. 5. Paraguay: Paraguay is located east of the Andes and lies in a mostly flat region. 6. Venezuela: The northernmost extension of the Andes enters Venezuela (Cordillera de Mérida)."}, {"c": "10", "n": "World Mapping PYQ Bank (handout)", "id": "pyq-21", "t": "Q21 · 2025 · Pairs/list: I. Lake Tanganyika II. Lake Tonlé Sap III. Patos", "x": "Q21 · 2025 · Pairs/list: I. Lake Tanganyika II. Lake Tonlé Sap III. Patos # Handout Q21 Consider the following water bodies: I. Lake Tanganyika II. Lake Tonlé Sap III. Patos Lagoon Through how many of them does the equator pass? (2025) (a) Only one (b) Only two (c) All the three (d) None Answer d I. Lake Tanganyika : NO Location: Between 3° to 9° South latitude in East Africa Although it is close to the Equator, it lies entirely south of it. II. Lake Tonlé Sap : NO Location: Cambodia (Southeast Asia) III. Patos Lagoon : NO Location: Southern Brazil (State of Rio Grande do Sul) Latitude: Around 30° S, far south of the Equator"}, {"c": "10", "n": "World Mapping PYQ Bank (handout)", "id": "pyq-22", "t": "Q22 · 2025 · Pairs/list: Region Country I. Mallorca Italy II.Normandy Spa", "x": "Q22 · 2025 · Pairs/list: Region Country I. Mallorca Italy II.Normandy Spa # Handout Q22 Consider the following pairs: Region Country I. Mallorca Italy II.Normandy Spain III. Sardinia France In how many of the above rows is the given information correctly matched? (2025) (a) Only one (b) Only two (c) All the three (d) None Answer d I. Mallorca : Italy Incorrect Mallorca (or Majorca) is the largest island in the Balearic Islands, which belong to Spain, not Italy. II. Normandy : Spain Incorrect Normandy is a region in northern France, famous for the D-Day landings during WWII. It is not located in Spain. III. Sardinia : France Incorrect Sardinia is the second-largest island in the Mediterranean and belongs to Italy, not France. It is an autonomous region of Italy."}, {"c": "10", "n": "World Mapping PYQ Bank (handout)", "id": "pyq-23", "t": "Q23 · 2026 · Which of the following statements with reference to Lake Tur", "x": "Q23 · 2026 · Which of the following statements with reference to Lake Tur # Handout Q23 Which of the following statements with reference to Lake Turkana is/are correct? 1. It is the largest desert lake in the world. 2. The lake is situated in South Sudan along the eastern fringe of the Sahara desert. 3. The lake is listed as a UNESCO World Heritage Site and is also referred to as the ‘Jade Sea’. Select the answer using the code given below: (2026) (a) 1 only (b) 1 and 3 only (c) 2 and 3 only (d) 1, 2 and 3 Answer (b) Explanation: Situated in Kenya with small extension in Ethiopia."}, {"c": "10", "n": "World Mapping PYQ Bank (handout)", "id": "pyq-24", "t": "Q24 · 2026 · Ships from which of the following countries have to cross th", "x": "Q24 · 2026 · Ships from which of the following countries have to cross th # Handout Q24 Ships from which of the following countries have to cross the Strait of Hormuz to reach out to the Indian Ocean? 1. Bahrain 2. Syria 3. Qatar 4. Egypt Select the answer using the code given below: (2026) (a) 1 and 2 (b) 1 and 3 (c) 2 and 3 (d) 3 and 4 Answer (b) Explanation: Egypt and Syria use Suez Canal/Red Sea"}, {"c": "10", "n": "World Mapping PYQ Bank (handout)", "id": "pyq-25", "t": "Q25 · 2026 · Tungurahua Volcano, which was declared a Global Geopark by U", "x": "Q25 · 2026 · Tungurahua Volcano, which was declared a Global Geopark by U # Handout Q25 Tungurahua Volcano, which was declared a Global Geopark by UNESCO in 2025, is situated in which one among the following countries? (2026) (a) Ecuador (b) Peru (c) Bolivia (d) Colombia Answer (a) Explanation: In the Andes. The region is part of the Tungurahua Volcano UNESCO Global Geopark, recognized for its geological significance, volcanic landforms, biodiversity, and local cultural heritage."}, {"c": "11", "n": "India Mapping PYQ Bank (handout)", "id": "about", "t": "About this bank", "x": "About this bank # Questions, options, answers and explanations are exactly as the handout prints them, with the handout maps. Where the handout contradicts itself it is flagged in a check box. India mapping has no slides in this deck; these questions and their maps come from the handout alone. Check Handout conflict: statement 2 says \"about 140 km east of Great Nicobar\" (marked wrong), but the explanation places it \"140-km north-east of Port Blair in Great Nicobar Island\". The answer is (d) 1 only either way; check the location line in class."}, {"c": "11", "n": "India Mapping PYQ Bank (handout)", "id": "pyq-26", "t": "Q26 · 2014 · Consider these pairs - 1. Cardamom Hills Coromandel Coast 2.", "x": "Q26 · 2014 · Consider these pairs - 1. Cardamom Hills Coromandel Coast 2. # Handout Q26 Consider these pairs - 1. Cardamom Hills Coromandel Coast 2. Kaimur Hills Konkan Coast 3. Mahadeo Hills Central India 4. Mikir Hills North-East India Which of the above pairs are correctly matched? (2014) (a) 1 and 2 only (b) 2 and 3 only (c) 3 and 4 only (d) 2 and 4 only Answer C Kaimur Range is the eastern portion of the Vindhya Range, about 483 kilometres (300 mi) long, extending from around Katangi in Jabalpur district of Madhya Pradesh to around Sasaram in Rohtas district of Bihar. It passes through the Rewa and Mirzapur divisions. The Cardamom Hills or Yela Mala are a mountain range of southern India and part of the southern Western Ghats located in southeast Kerala and southwest Tamil Nadu in India. Their name comes from the cardamom spice grown in much of the hills' cool elevation, which also supports pepper and coffee. The Western Ghats and Periyar Sub-Cluster including the Cardamom Hills, are UNESCO World Heritage Sites."}, {"c": "11", "n": "India Mapping PYQ Bank (handout)", "id": "pyq-27", "t": "Q27 · 2014 · Which one of the following pairs of islands are separated fr", "x": "Q27 · 2014 · Which one of the following pairs of islands are separated fr # Handout Q27 Which one of the following pairs of islands are separated from each other by the ‘Ten Degree Channel’? (2014) (a) Andaman and Nicobar (b) Nicobar and Sumatra (c) Maldives and Lakshadweep (d) Sumatra and Java Handout map Map printed in the handout beside this question Answer A This is a map based question, please refer to map."}, {"c": "11", "n": "India Mapping PYQ Bank (handout)", "id": "pyq-28", "t": "Q28 · 2015 · Which of the following pairs of States of India indicates th", "x": "Q28 · 2015 · Which of the following pairs of States of India indicates th # Handout Q28 Which of the following pairs of States of India indicates the easternmost and Westernmost State? (2015) (a) Assam and Rajasthan (b) Arunachal Pradesh and Rajasthan (c) Assam and Gujarat (d) Arunachal Pradesh and Gujarat Answer D Go through the Map"}, {"c": "11", "n": "India Mapping PYQ Bank (handout)", "id": "pyq-29", "t": "Q29 · 2016 · Pairs/list: Famous place Region 1. Bodhgaya - Baghelkhand 2.", "x": "Q29 · 2016 · Pairs/list: Famous place Region 1. Bodhgaya - Baghelkhand 2. # Handout Q29 Consider the following pairs: Famous place Region 1. Bodhgaya - Baghelkhand 2. Khajuraho - Bundelkhand 3. Shirdi: - Vidarbha 4. Nasik (Nashik) - Malwa 5. Tirupati - Rayalaseema Which of the pairs given above are correctly matched? (2016) (a) 1, 2 and 4 (b) 2, 3, 4 and 5 (c) 2 and 5 only (d) 1, 3, 4 and 5 Answer C Malwa region includes districts of Western Madhya Pradesh and parts of South-Eastern Rajasthan. Baghelkhand covers the North-Eastern regions of Madhya Pradesh and a small area of Western Uttar Pradesh. Vidarbha is the Eastern region of the Indian State of Maharashtra, comprising Nagpur division and Amravati division."}, {"c": "11", "n": "India Mapping PYQ Bank (handout)", "id": "pyq-30", "t": "Q30 · 2017 · If you travel by road from Kohima to Kottayam, what is the m", "x": "Q30 · 2017 · If you travel by road from Kohima to Kottayam, what is the m # Handout Q30 If you travel by road from Kohima to Kottayam, what is the minimum number of States within India through which you can travel, including the origin and the destination? (2017) (a) 6 (b) 7 (c) 8 (d) 9 Answer B States – Kerala, Tamil Nadu, Andhra Pradesh, Odisha, West Bengal, Assam, Nagaland Handout map Map printed in the handout beside this question"}, {"c": "11", "n": "India Mapping PYQ Bank (handout)", "id": "pyq-31", "t": "Q31 · 2017 · Pairs/list: 1. In India, the Himalayas are spread over five", "x": "Q31 · 2017 · Pairs/list: 1. In India, the Himalayas are spread over five # Handout Q31 Consider the following statements: 1. In India, the Himalayas are spread over five States only. 2. The Western Ghats are spread over five States only. 3. Pulicat Lake is spread over two States only. Which of the statements given above is/are correct? (2017) (a) 1 and 2 only (b) 3 only (c) 2 and 3 only (d) 1 and 3 only Answer B In India, the Himalayas are spread over more than 5 states. The Western Ghats are spread over 6 states, including Gujarat. Pulicat Lake is spread over Andhra Pradesh and Tamil Nadu. The Indian Himalayan Region (IHR) is the section of the Himalayas within India, spanning the states of Jammu & Kashmir, Himachal Pradesh, Uttarakhand, Sikkim, Arunachal Pradesh, as well as the hill regions of two states - Assam and West Bengal. Western Ghats are a chain of mountains running parallel to India's western coast, approximately 30-50 km inland. The Western Ghats traverse the States of Kerala, Tamil Nadu, Karnataka, Goa, Maharashtra and Gujarat. Pulicat Lake formerly PralayaKaveri is the second largest brackish water lake or lagoon in India, after Chilika Lake. It straddles the border of Andhra Pradesh and Tamil Nadu states with over 40% of it in Andhra Pradesh and 60% in Tamil Nadu situated on the Coromandel Coast in South India. The lake encompasses the Pulicat Lake Bird Sanctuary. The barrier island of Sriharikota separates the lake from the Bay of Bengal and is home to the SatishDhawan Space Centre."}, {"c": "11", "n": "India Mapping PYQ Bank (handout)", "id": "pyq-32", "t": "Q32 · 2018 · Pairs/list: 1. The Barren Island volcano is an active volcan", "x": "Q32 · 2018 · Pairs/list: 1. The Barren Island volcano is an active volcan # Handout Q32 Consider the following statements: 1. The Barren Island volcano is an active volcano located in Indian territory. 2. Barren Island lies about 140 km east of Great Nicobar. 3. The last time the Barren Island volcano erupted was in 1991 and it has remained inactive since then. Which of the statements given above is/are correct? (2018) (a) 1 and 3 only (b) 2 and 3 (c) 3 only (d) 1 only Answer D According to the researchers at Goa-based National Institute of Oceanography (NIO), the Barren Island volcano, India’s only live volcano in the Andaman and Nicobar islands. The only live volcano in the Andaman and Nicobar islands is erupting once again. The Barren Island volcano, located 140-km north-east of Port Blair in Great Nicobar Island, dormant for more than 150 years, started erupting in 1991 and has since then shown intermittent activity. Last eruption was as recent as 2022."}, {"c": "11", "n": "India Mapping PYQ Bank (handout)", "id": "pyq-33", "t": "Q33 · 2018 · Among the following cities, which one lies on a longitude cl", "x": "Q33 · 2018 · Among the following cities, which one lies on a longitude cl # Handout Q33 Among the following cities, which one lies on a longitude closest to that of Delhi? (2018) (a) Bengaluru (b) Hyderabad (c) Nagpur (d) Pune Answer A Both Delhi and Bangalore fall on the 77° E longitude."}, {"c": "11", "n": "India Mapping PYQ Bank (handout)", "id": "pyq-34", "t": "Q34 · 2020 · Siachen Glacier is situated to the:", "x": "Q34 · 2020 · Siachen Glacier is situated to the: # Handout Q34 Siachen Glacier is situated to the: (2020) (a) East of Aksai Chin (b) East of Leh (c) North of Gilgit (d) North of Nubra Valley Answer D Siachen Glacier, one of the world's longest mountain glaciers, lying in the Karakoram Range system of Kashmir near the India–Pakistan border, extending for 44 mi (70 km) from north-northwest to south-southeast. The Siachen Glacier is a glacier located in the eastern Karakoram Range in the Himalayas."}, {"c": "11", "n": "India Mapping PYQ Bank (handout)", "id": "pyq-35", "t": "Q35 · 2022 · Pairs/list: Peak Mountains 1. Namcha Barwa — Garhwal Himalay", "x": "Q35 · 2022 · Pairs/list: Peak Mountains 1. Namcha Barwa — Garhwal Himalay # Handout Q35 Consider the following pairs: Peak Mountains 1. Namcha Barwa — Garhwal Himalaya 2. Nanda Devi — Kumaon Himalaya 3. Nokrek — Sikkim Himalaya Which of the pairs given above is/are correctly matched? (2022) (a) 1 and 2 (b) 2 only (c) 1 and 3 (d) 3 only Answer B Namcha Barwa is in an isolated part of southeastern Tibet. It stands inside the Great Bend of the Yarlung Tsangpo River. On other hand the Garhwal Himalayas are mountain ranges located in the Indian state of Uttarakhand Kumaun Himalayas rise to 7,817 metres at Nanda Devi, the range’s highest peak. The Nokrek Biosphere Reserve is located in the northeast of India on the Tura Range, which forms part of the Meghalaya Plateau"}, {"c": "11", "n": "India Mapping PYQ Bank (handout)", "id": "pyq-36", "t": "Q36 · 2023 · Pairs/list: 1. Amarkantak Hills are at the confluence of Vin", "x": "Q36 · 2023 · Pairs/list: 1. Amarkantak Hills are at the confluence of Vin # Handout Q36 Consider the following statements: 1. Amarkantak Hills are at the confluence of Vindhya and the Sahyadri Ranges. 2. Biligirirangan Hills constitute the easternmost part of Satpura Range. 3. Seshachalam Hills constitute the southernmost part of Western Ghats. How many of the statements given above are correct? (2023) (a) Only one (b) Only two (c) All three (d) None Answer D Amarkantak is at the confluence of Vindhyas and Satpuras. Biligiriranjan hills are in South East Karnataka. Seshachalam Hills are a part of the Eastern Ghats. Handout map Map printed in the handout beside this question"}, {"c": "11", "n": "India Mapping PYQ Bank (handout)", "id": "pyq-37", "t": "Q37 · 2014 · Pairs/list: 1. Barak 2. Lohit 3. Subansiri Which of the abov", "x": "Q37 · 2014 · Pairs/list: 1. Barak 2. Lohit 3. Subansiri Which of the abov # Handout Q37 Consider the following rivers: 1. Barak 2. Lohit 3. Subansiri Which of the above flows / flow through Arunachal Pradesh? (2014) (a) 1 only (b) 2 and 3 only (c) 1 and 3 only (d) 1, 2 and 3 Answer B The Barak is a 900 km river flowing through the states of Nagaland, Manipur and Assam in India and into the Bay of Bengal via Bangladesh. The Barak River flows 900 kilometres through the states of Manipur, Nagaland, Mizoram and Assam in India. Further it enters Bangladesh where it is known by the name of the Surma and the Kushiyara and later called the Meghna before receiving the combined flow of the Ganga and the Brahmaputra. Barak rises in the Manipur hills and enters the plains near Lakhipur. The river enters Bangladesh as Surma and Kushiyara. Later, the river is called the Meghna and receives the combined flow of the Ganga and Brahmaputra. It is being developed as one of the Inland waterways of India. The environment of Barak's basin hosts a wide variety of flora and fauna."}, {"c": "11", "n": "India Mapping PYQ Bank (handout)", "id": "pyq-38", "t": "Q38 · 2015 · Pairs/list: 1. Vamsadhara 2. Indravati 3. Pranahita 4. Penna", "x": "Q38 · 2015 · Pairs/list: 1. Vamsadhara 2. Indravati 3. Pranahita 4. Penna # Handout Q38 Consider the following rivers : 1. Vamsadhara 2. Indravati 3. Pranahita 4. Pennar Which of the above are tributaries of Godavari? (2015) (a) 1,2 and 3 (b) 2,3 and 4 (c) 1,2 and 4 (d) 2 and 3 only Answer D The Godavari is India's second longest river after the Ganga. Its source is in Trimbakeshwar, Maharashtra The major tributaries of the river can be classified as the left bank tributaries which include the Purna, Pranhita, Indravati and Sabari River covering nearly 59.7% of the total catchment area of the basin and the right bank tributaries Pravara, Manjira, Manair together contributing 16.1% of the basin. River Vamsadhara or River Vamsadhara is an important east flowing river between Rushikulya and Godavari, in Odisha and Andhra Pradesh states in India. The Penna (also known as Pennar, Penner, Penneru or North Pinākinī) is a river of southern India. The Penna rises in Nandi Hills in Chikballapur District of Karnataka state and runs north and east through the states of Karnataka and Andhra Pradesh to empty into the Bay of Bengal."}, {"c": "11", "n": "India Mapping PYQ Bank (handout)", "id": "pyq-39", "t": "Q39 · 2016 · Which of the following is/are tributary/tributaries of Brahm", "x": "Q39 · 2016 · Which of the following is/are tributary/tributaries of Brahm # Handout Q39 Which of the following is/are tributary/tributaries of Brahmaputra? 1. Dibang 2. Kameng 3. Lohit Select the correct answer using the code given below: (2016) (a) 1 only (b) 2 and 3 only (c) 1 and 3 only (d) 1, 2 and 3 Answer D The Brahmaputra (meaning the son of Brahma): The Brahmaputra’s source is the Chemayungdung glacier in southwestern Tibet. It’s source is very close to the sources of Indus and Satluj. Mariam La separates the source of the Brahmaputra from the Manasarovar Lake. In Tibet, it passes through the depression formed by the Indus-Tsangpo Structure Zone between the Great Himalayas in the south and the Kailas Range in the north. Brahmaputra Luit, Dilao(Basin features): Tributaries Left - Lhasa River, Nyang River, Parlung Zangbo, Lohit River, Dhansiri River, Kolong River Right - Kameng River, Manas River, Beki River, Raidak River, Jaldhaka River, Teesta River, Subansiri River"}, {"c": "11", "n": "India Mapping PYQ Bank (handout)", "id": "pyq-40", "t": "Q40 · 2015 · Pairs/list: Place of Pilgrimage Location 1. Srisailam : Nall", "x": "Q40 · 2015 · Pairs/list: Place of Pilgrimage Location 1. Srisailam : Nall # Handout Q40 Consider the following pairs: Place of Pilgrimage Location 1. Srisailam : Nallamala Hills 2. Omkareshwar : Satmala Hills 3. Pushkar : Mahadeo Hill Which of the above pairs is/are correctly matched? (2015) a) 1 only b) 2 and 3 only c) 1 and 3 only d) 1,2 and 3 Answer A Omkareshwar is a Hindu temple dedicated to the God Shiva. It is one of the 12 revered Jyotirlinga shrines of Shiva. It is on an island called Mandhata or Shivapuri in the Narmada river; the shape of the island is said to be like the Hindu ॐ symbol. It is situated in the Khandwa district of Madhya Pradesh state in India. Satmala is a mountain range which runs across Nashik District, Maharashtra. They are an integral part of the Sahyadris range within Nashik. Pushkar is a town in the Ajmer district in the Indian state of Rajasthan. It is situated about 10 km (6.2 mi) northwest of Ajmer and about 150 kilometres (93 mi) southwest of Jaipur. The Mahadeo Hills are a range of hills in Madhya Pradesh state of central India. The hills are situated in the northern section of the Satpura Range."}, {"c": "11", "n": "India Mapping PYQ Bank (handout)", "id": "pyq-41", "t": "Q41 · 2018 · Which one of the following is an artificial lake? Kodaikanal", "x": "Q41 · 2018 · Which one of the following is an artificial lake? Kodaikanal # Handout Q41 Which one of the following is an artificial lake? (2018) a) Kodaikanal (Tamil Nadu) b) Kolleru (Andhra Pradesh) c) Nainital (Uttarakhand) d) Renuka (Himachal Pradesh) Answer A Kodaikanal Lake, also known as Kodai Lake is a manmade lake located in the Kodaikanal city in Dindigul district in Tamil Nadu, India. Sir Vere Henry Levinge, the then Collector of Madurai, was instrumental in creating the lake in 1863, amidst the Kodaikanal town which was developed by the British and early missionaries from the USA. The lake is said to be Kodaikanal's most popular geographic landmark and tourist attraction."}, {"c": "11", "n": "India Mapping PYQ Bank (handout)", "id": "pyq-42", "t": "Q42 · 2019 · Pairs/list: Glacier River 1. Bandarpunch : Yamuna 2. Bara Sh", "x": "Q42 · 2019 · Pairs/list: Glacier River 1. Bandarpunch : Yamuna 2. Bara Sh # Handout Q42 Consider the following pairs : Glacier River 1. Bandarpunch : Yamuna 2. Bara Shigri : Chenab 3. Milam : Mandakini 4. Siachen : Nubra 5. Zemu : Manas Which of the pairs given above are correctly matched? (2019) (a) 1, 2 and 4 (b) 1, 3 and 4 (c) 2 and 5 (d) 3 and 5 Answer A Bandarpunch is strategically located at the western edge of the High Himalayan Range where it turns the corner to the northwest. It is part of the Sankari Range and lies within the Govind Pashu Vihar National Park and Sanctuary. It is a major watershed for the headwaters of the Yamuna River, whose source lies above Yamunotri, on the west end. Bara Shigri is the largest glacier located in the state of Himachal Pradesh, India, Bara-Sigri glacier which is the second longest glacier in the Himalaya (Indian side) after Gangotri, both are around 30 km long. The glacier is located in the Chandra Valley of Lahaul. The glacier feeds the Chenab River. The Siachen glacier's melting waters are the main source of the Nubra River in the Indian region of Ladakh, which drains into the Shyok River."}, {"c":
