1st 1967-72 Naxalbari (WB) 1967, also Bihar, Srikakulam (AP) → CPI (ML) 1969, Charu Majumdar . Crushed by 1972 (United Front govt + Indira Gandhi's govt). 2nd 1975-2004 Factionalised in Emergency . Four groups: MCC, PWG, PU, CPI-ML (Liberation) (Liberation contested elections). 1998: PU + PWG → CPI-ML (People's War). Bihar caste war: Dalits (MCC) vs Ranvir Sena, Sunlight Sena. 3rd 2004-12 2004: PU + MCC + PWG → CPI-Maoist , unified command. Salwa Judum 2005-09; Operation Green Hunt 2009-12. 2010 Dantewada: 76 killed (75 CRPF), Green Hunt stalled. 4th 2013- Violence below 1990s average. Reasons: Integrated Action Plan , roads, police stations, NREGA; Maoist tactical retreat ."}, {"c": "21", "n": "Left Wing Extremism (LWE)", "id": "5-drivers-of-naxalism-expert-group-plannin", "t": "5 · Drivers of Naxalism (Expert Group, Planning Commission and ARC II)", "x": "5 · Drivers of Naxalism (Expert Group, Planning Commission and ARC II) # PYQs PYQ 2020 · determinants · PYQ 2022 · social-economic-developmental Memory aid · Drivers (7 groups) P L E D G E S Unkept state PLEDGES (land, forests, governance) gave Maoists their opening. P Police and state repression L Land and agrarian E Economic and social D Displacement G Governance E Empowerment (psychological) S Social exclusion, alienation Group Key points Social-economic Land rights, no jobs, discrimination; cash-credit shortage → moneylenders ; Dalit-tribal exploitation, forced labour, untouchability. Livelihood: PDS corruption , lost traditional occupations and common-property rights, Minimum Wages Act not applied (Naxals enforce wages). Land and agrarian Land reforms failed (ceilings evaded, special tenures exempt). Encroached government/community land (even water bodies); no title for landless; tribal-to-non-tribal transfer in Fifth Schedule areas; LARR 2013 not implemented. Bihar: Naxals helped Musahars take land. Displacement PYQ 2015 FCA 1980 kept forest dwellers near eviction. 40% of displaced are tribal evictees; irrigation and power projects without rehabilitation; acquisition for ‘public purpose’ without compensation. Governance 73rd Amendment unfulfilled; absent staff, poor health and schools; police misuse; circular governance trap (forest security → less local connect → more insecurity). No rural dispute resolution → Naxal People's Courts . Police and state repression Arbitrary police action, forest-staff harassment, brutal suppression; TADA/POTA on tribals leave land fallow, Naxals encroach. Social exclusion and cultural alienation Denial of dignity; atrocities, civil-rights and bonded-labour laws poorly enforced ( Karimnagar 1980 forced-labour violence); alienation from land and culture. Psychological empowerment Youth gain power and identity by challenging traditional power holders. Teacher stressed (slide 12) Governance deficit → Naxals gain legitimacy → vicious cycle. Keywords: Xaxa (40% tribal victims), land to the tiller, CFR lacking, SC/ST Act not enforced, judicial alienation."}, {"c": "21", "n": "Left Wing Extremism (LWE)", "id": "6-counter-lwe-schemes", "t": "6 · Counter-LWE schemes", "x": "6 · Counter-LWE schemes # PYQs PYQ 2018 · GoI approach · PYQ 2025 · measures Category Schemes Physical infrastructure Special Infrastructure Scheme (fortified police stations, to 2026); LWE Mobile Tower Project and USOF; NETRA micro-UAVs (CRPF); GIS mapping; rail in Bastar; 15,189 km roads (Road Requirement Plan / Road Connectivity Project; teacher: RRP-II). Institutional SRE Scheme ; Unified Command (Chhattisgarh, Jharkhand, Odisha, West Bengal); SCA for 30 most-affected districts; Civic Action Programme ; Multi Agency Centre (State MACs: Jagdalpur, Gaya); India Reserve Battalions. Social NYKS tribal youth exchange; Roshni ; Livelihood Colleges; 179 Eklavya schools ; PM Janjatiya Unnat Gram Yojana; PM PVTG Mission ; GOAL; ABP Sampoornata Abhiyan. Financial Financial inclusion: 6,000+ post offices with banking (slide 13). Other Aspirational Districts (35 LWE districts, MHA monitors); Rubber cultivation (AP); Godavarman case (no dereservation without SC); National Policy and Action Plan 2015 . Current affairs Post-Naxalism governance (slide 17): Shaheed Veer Gunda Dhur Seva Dera (70 ex-CAPF camps → Jan Seva Kendras); Education Cities (₹100 cr each); 3 medical colleges (₹50 cr); Bastar Olympics, Bastar Pandum; PM-JANMAN, DAJGUA; 46 ITIs, 49 skill centres. Forces and operations (slide 14): COBRA, Black Panther, Bastariya Battalion, C-60 (Gadchiroli), Greyhounds (AP) ; STRACO (WB); Op Octopus (Bihar-Jharkhand), Op Double Bull and Op Anaconda (Jharkhand), Op Black Forest (Chhattisgarh-Telangana). Balaghat: State police + CRPF + Hawk Force. NSG first deployed in Gadchiroli. Case studies: Niyad Nellanar Yojana (Chhattisgarh, ‘your good village’: amenities to Bastar villages); Mission Gramodaya (Odisha, 453 villages); Elwad Panchayat Abhiyan (incentives for ‘Maoism-free’ panchayats; rupee figure unclear on slide). SAMADHAN (slide 13) Eight pillars: S mart leadership, A ggressive strategy, M otivation and training, A ctionable intelligence, D ashboard KPIs, H arness technology, A ction plan per theatre, N o access to financing."}, {"c": "21", "n": "Left Wing Extremism (LWE)", "id": "7-surrender-policy", "t": "7 · Surrender policy", "x": "7 · Surrender policy # PYQs PYQ 2015 · mainstream Part of multi-pronged strategy; paired with firm police action. Aim: gainful employment so cadres do not return. Benefits: ₹5 lakh (higher cadres), ₹2.5 lakh (others), weapon incentives, ₹10,000/month for 3 years training. Data: 2,337 (2025); 3,927 (2024-Mar 2026)."}, {"c": "21", "n": "Left Wing Extremism (LWE)", "id": "8-government-approach-and-arc-ii-strategy", "t": "8 · Government approach and ARC II strategy", "x": "8 · Government approach and ARC II strategy # PYQs PYQ 2018 · approach · PYQ 2020 · GoI, administration, forces · PYQ 2022 · multilayered strategy Seventh Schedule: Police and Public order = State subjects ; Centre supplements. National Policy and Action Plan : security + development + rights and entitlements. Security front: CAPF battalions, training, State police modernisation, intelligence, fortified police stations. Development front: roads, telecom, skill, financial inclusion. Three-pronged: (1) necessary force, (2) address grievances via infrastructure, (3) political demands with fixed timelines. Low-key (North-East) over Sri Lanka's ‘hammer and tongs’ vs LTTE. Clear, hold and develop. ARC II capacity building Key points Security forces Temporary development role where agencies cannot work (WB: police kept schools running); SOPs within constitutional bounds; special task forces like Greyhounds . Administration Strengthen field formations; Oversight Committee for FRA 2006 (tribals, conservationists, committed individuals). Personnel Train at LBS National Academy ; reimburse States for incentives to serve in difficult areas; revive inspections . Local bodies Implement PESA 1996 to close governance deficit. Civil society Bridge between extremists and government; educate on futility of violence; ventilate grievances legally. Cut finances BRO or government agencies build roads directly; anti-extortion and economic offences wing. Way forward (ARC II and MHA) Handout's own mnemonic · Way forward (ARC II) N A X A L I S M Eight fixes. N Negotiations for conflict resolution A Administrative monitoring (revive inspections, secure officers on tour) X eXtend legal frameworks (FRA oversight committees) A Augment security forces (SOPs) L Learning and sensitisation of police I Implementation monitoring (PESA, MoPR) S Strengthen local police (local recruits) M Maximise infrastructure security (BRO) Keyword: NAXALISM . Add teacher's keywords: ✎ tactical → structural from tactical containment to structural disintegration (leadership, cadre, support); 3C = road, mobile, financial connectivity; dual approach = peace through inclusion plus no-holds-barred against violence. Conclusion (Expert Group): the State owed these rights even if Naxalites did not exist."}, {"c": "21", "n": "Left Wing Extremism (LWE)", "id": "9-case-study-salwa-judum-2005-chhattisgarh", "t": "9 · Case study: Salwa Judum (2005, Chhattisgarh)", "x": "9 · Case study: Salwa Judum (2005, Chhattisgarh) # ‘Peace March / Purification Hunt’ (Gondi); state-backed vigilantes, successor to Jan Jagran Abhiyan (1991) ; mining ties (Tata, Essar). SPOs / Koya Commandos by 2008; many ex-Maoists. Impact: 600+ villages burned, ~ 300,000 displaced, 98 SPOs and up to 800 killed; Darbha Ghat massacre. Nandini Sundar v. State of Chhattisgarh: (1) excessive delegation in Chhattisgarh Police Act 2007; (2) SPOs in combat roles with 25 h law + 12 h Constitution training; (3) honorarium only → Article 14 ; endangered lives → Article 21 . Alert Naxalbari and Pavagada case study is images only in the handout, to be explained in class; no class notes provided. Check your notebook."}, {"c": "21", "n": "Left Wing Extremism (LWE)", "id": "10-fifth-schedule-non-implementation", "t": "10 · Fifth Schedule: non-implementation", "x": "10 · Fifth Schedule: non-implementation # PYQs PYQ 2013 · Art. 244, Fifth Schedule PESA is ‘indicative’ (ARC II): works only if States amend Panchayati Raj Acts; implementation unsatisfactory . Dimension Provision Administration of Scheduled Areas President declares area after consulting Governor; Governor regulates land transfer, land allotment, money-lending for STs. Tribes Advisory Council Up to 20 members, three-fourths ST ; advises on welfare. Special provisions Governor can bar or modify any Act in Scheduled Areas; repeal or amend laws. Reports to the President Governor reports annually; Union ensures implementation. Memory aid · Fifth Schedule dimensions S T A R The guiding STAR of tribal governance. S Special provisions T Tribes Advisory Council A Administration of Scheduled Areas R Reports to the President Failures: some tribal-majority areas lack Fifth Schedule status; laws extended in routine, community governance lost legitimacy; Governor's office lacks capacity. Land alienation: MP Land Regulation rules 1959 allow transfer to non-tribals; Chhattisgarh permits acquisition on small loan default; Rajasthan: district administration can overturn Gram Sabha. Reports to President: casual and irregular (Mungekar); AP and MP sent none from 1999-2000, Maharashtra and Orissa from 2000-01 (Bhuria, 2002-04). TAC: tokenistic; no TAC discussed land alienation 2005-2011. Mungekar: ‘particularisation, not generalisation; discretion, not rule by rote’. Samatha: Schedules exist to stop exploitation; land stays with tribals. Failure creates a governance vacuum the Maoists fill. Current affairs PESA status (Mar 2026): Fifth Schedule areas in 10 States; 9 have framed PESA Rules, Odisha only draft; MoPR has 10 PESA indicators; Jharkhand PESA Rules 2025 listed. Teacher stressed (slide 15) Quote Mungekar and Xaxa reports (boxed in red). Governor: lack of capacity; TAC: tokenistic; laws: routine application; reports: casual."}, {"c": "21", "n": "Left Wing Extremism (LWE)", "id": "11-women-in-the-red-corridor", "t": "11 · Women in the Red Corridor", "x": "11 · Women in the Red Corridor # Appeal: large share of cadres, all-women squads ( KAMS ) fighting forced marriage, abduction, bigamy, domestic violence, police brutality. NCRB 2019: 84,938 crimes in AP, Chhattisgarh, Jharkhand, MP, Odisha. SC/ST women bear gender-caste-class burden. Problems: 35-40% of members but 1 of 20 in central committee; no menstrual leave or hygiene; anaemia; forced vasectomy and abortions; sexual exploitation. Way forward: gender-sensitive alternatives to cadre life; rework hard-power responses; diminish motivations, don't demean them ."}, {"c": "21", "n": "Left Wing Extremism (LWE)", "id": "12-forest-policy-and-the-forest-rights-act", "t": "12 · Forest policy and the Forest Rights Act", "x": "12 · Forest policy and the Forest Rights Act # PYQs PYQ 2015 · displacement of tribals Memory aid · Four FRA rights T U R F Who holds the TURF. T Title (max 4 ha) U Use (MFP, grazing) R Relief and development F Forest management Teacher: historical injustice (British 1865-1894, IFA 1927, FCA 1980) → course correction (BK Roy Burman, FRA). FRA 2006 (FDST + OTFD): 4 rights : title (max 4 ha , land already cultivated), use (MFP, grazing, routes), relief and development, forest management. OTFD: 3 generations (75 yrs) before 13 Dec 2005 . Gram Sabha initiates; Gram Sabha → SDM Committee → District Committee . Free informed consent for National Parks and Sanctuaries. FRA issues Detail Policy gaps Vague terms (‘primarily resides’, ‘bonafide livelihood’); PVTG position; FCR 2022 need no Gram Sabha consent at preliminary approval; 2,400 sq km diverted under FCA. Implementation Forest Dept resists CFR (Sarguja: 27 CFR titles not recognised); only 40% claims accepted (MoTA, teacher). Rejections Wrong OTFD reading, no GPS proof, disputed ‘orange areas’ (Chhattisgarh); Xaxa: not communicated, no appeal explained, documents demanded despite oral evidence. Violations Eviction before verification (Thane); flawed Forest Rights Committees; women named in <10% documents (UN Women 2012). Teacher's Gadchiroli triangle: infrastructure development vs recognition of CFR vs rehabilitation of surrendered Naxals."}, {"c": "21", "n": "Left Wing Extremism (LWE)", "id": "13-2026-framework-emerging-issues-and-value", "t": "13 · 2026 framework, emerging issues and value addition", "x": "13 · 2026 framework, emerging issues and value addition # PYQs PYQ 2022 · emerging issues · PYQ 2025 · eliminate by 2026 Two-tier policy: Legacy & Thrust (insurgency ended, consolidate) and District of Concern (network dismantled, targeted work). Emerging challenges: Adivasi Paradox (between Maoists and police raids); Urban Naxalism ; dissent vs terrorism (UAPA vs Jal-Jangal-Zameen activists); development trap in mineral lands; weak grassroots institutions. Way forward (slide): conflict transformation ( PMRDF , fast-track undertrials); Gram Sabha controls MFP via Van Dhan Vikas Kendras; Odisha SETU model (Malkangiri) PYQ 2015 · Malkangiri; local police replace CAPF (like Greyhounds ). Keywords: ✎ slide 18 soft-power approach; Maoism survives in security vacuums; political legitimacy deficit ; radicalisation pathways; insurgency as development failure; ideological anachronism (1920s Marxism); penetration-integration gap . Current affairs Urban Naxalism and law: PM: ‘vanishing from jungles but taking roots in urban centres’. 4 LWE special courts in Chhattisgarh. Maharashtra Special Public Security Bill 2024: vague ‘unlawful activity’, no legal vetting, no due process on seizure. Bastar: most developed tribal division by Dec 2030 (Kanker, Kondagaon, Bastar, Sukma, Bijapur, Dantewada, Narayanpur)."}, {"c": "21", "n": "Left Wing Extremism (LWE)", "id": "14-pyq-skeletons-mains-six-asked", "t": "14 · PYQ skeletons (Mains, six asked)", "x": "14 · PYQ skeletons (Mains, six asked) # Year · marks Skeleton: intro → body → close 2013 · 10 Fifth Schedule non-implementation Art. 244 + PESA ‘indicative’ → land alienation, tokenistic TAC, casual Governor reports, governance vacuum → Samatha . 2015 · 12.5 displacement, corrective strategy Eviction = 40% of displaced → FRA/CFR, PESA, clear-hold-develop , roads-mobile-finance, surrender policy, SETU → State owes rights. 2018 · 10 GoI approach Police and public order are State subjects → National Policy 2015 , security + development + rights, schemes → three-pronged. 2020 · 15 determinants and strategy Drivers (PLEDGES) → roles of GoI, administration, forces (SOPs, Greyhounds, FRA committee) → legitimacy. 2022 · 15 emerging issues, multilayered strategy Not merely law and order → urban Naxalism, Adivasi paradox, dissent vs terror → ARC II six layers + NAXALISM. 2025 · 10 LWE, affected people, measures Definition → displacement, forest rights, women, Salwa Judum → Naxal Mukt Bharat measures, surrender, SAMADHAN, 2026 status."}, {"c": "21", "n": "Left Wing Extremism (LWE)" inister Emerging issues, 2022 Sashakt, Surakshit, Samriddh Bharat with a ruthless approach to Naxalism and relentless efforts for all pervasive development. Home Minister Dual approach, 2025 measures Movement is on its last legs. K. Vijay, MHA Security Advisor Status, 2018 and 2025 Tactical containment → structural disintegration 3C: road, mobile, financial connectivity Dual approach No-holds-barred strategy Vicious cycle Political legitimacy deficit Maoism survives in security vacuums Insurgency as development failure Ideological anachronism Penetration-integration gap Radicalisation pathways Soft-power approach Circular governance trap Adivasi paradox Development trap Relapse prevention Clear, hold and develop WHAM (hearts and minds) Jal, Jangal, Zameen Indicative legislation Governance vacuum Diminish motivations, don't demean them Case studies Salwa Judum / Nandini Sundar Niyad Nellanar Yojana (Chhattisgarh) Mission Gramodaya (Odisha, 453 villages) Elwad Panchayat Abhiyan Odisha SETU model (Malkangiri) Greyhounds (AP) Balaghat coordination (State police + CRPF + Hawk Force) Operation Black Forest Bastar Olympics, Bastar Pandum Shaheed Veer Gunda Dhur Seva Dera Karimnagar 1980 Bihar Musahars Sarguja CFR titles Thane evictions NSG in Gadchiroli Reports and judgments Expert Group, Planning Commission Second ARC Xaxa Committee Mungekar Committee Bhuria Commission (2002-04) BK Roy Burman Committee Samatha (SC) Nandini Sundar v. Chhattisgarh (SC) T.N. Godavarman (SC) National Policy and Action Plan 2015 NCST report to President Intro and conclusion lines Intro: LWE shrank from 126 affected districts (2014) to none (Mar-Apr 2026), yet the land, forest and governance gaps that fed it persist. Intro: Dr. Manmohan Singh called naxalism ‘not merely a law and order issue’; it is a legitimacy gap that grew where State promises were unkept. Conclusion: The State owes these rights even without Naxalites (Expert Group); relapse prevention needs Gram Sabha power, FRA, PESA and local policing. Conclusion: From tactical containment to structural disintegration: lock in security gains with legitimacy, rights and development."}, {"c": "21", "n": "Left Wing Extremism (LWE)", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. 1969 CPI (ML) leader? Charu Majumdar. 2004 merger? PU + MCC + PWG → CPI-Maoist. Dantewada 2010? 76 killed: 75 CRPF + 1 State police. Salwa Judum ban ground? Nandini Sundar: excessive delegation; SPOs in combat; Arts 14, 21. FRA title rights cap? 4 hectares of land already cultivated. TAC strength? Up to 20; three-fourths ST. Surrender grants? ₹5 lakh, ₹2.5 lakh, ₹10,000/month for 3 years. Who holds Police and Public order? States (Seventh Schedule)."}, {"c": "22", "n": "Urban Naxals and MSPC Act 2024", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words MSPC targets urban front organisations with a broader definition than UAPA. Critique: vague terms, weaker review, dissent risk . Key term In plain words Front organisation Group that appears legal but supports an unlawful organisation."}, {"c": "22", "n": "Urban Naxals and MSPC Act 2024", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Urban Naxals (as alleged) Ideological support to urban middle class, students Logistical support : funds, shelter, communication Recruitment of urban youth and intellectuals MSPC Bill 2024 Why: Naxalism spreading to cities via front organisations ; existing laws inadequate; similar Acts in Chhattisgarh, Telangana, AP, Odisha ( 48 front organisations banned ) Powers: declare organisation unlawful ; 4 offences — membership, raising funds, managing/assisting, committing unlawful activity Penalties: 2-7 years, fine ₹2-5 lakh; cognizable and non-bailable \"Unlawful activity\" : threat to public order; interfering with administration of law; overawing public -24 rise Due to ethnic strife in Manipur Typology of conflict Asymmetrical , ambiguous (friend vs enemy unclear), unconventional (political + psychological means), tends to wars of attrition Where State fails to give security → private ethnic militia ; Army seen as partisan"}, {"c": "23", "n": "North East Insurgency", "id": "3-causes-of-insurgency-pyq-2017", "t": "3 · Causes of Insurgency (PYQ 2017)", "x": "3 · Causes of Insurgency (PYQ 2017) # Secession & statehood Naga insurgency (peak 1956): NNC sought secession; radicals formed Federal Government of Nagaland + Naga Army Manipur merger seen as involuntary; Nagaland statehood 1963 by violence; foreign support from East Pakistan and China Cultural & development Assamese made official language 1960 ignoring Mizo → MNF (Laldenga, 1966) Refinery Movement 1956-57 (Barauni, not Assam) Uneven industrialisation, limited private investment, poor market access Demography & migration Tripura 1980s : migrants from East Bengal/Bangladesh pushed Tripuris to hills Assam Movement 1979-85 (AASU, AAGSP) → Assam Accord 1985 Governance & neglect Mizoram: Mautam famine — Centre failed to help → militancy; statehood 1987 Nido Tania 2014 death → feeling of neglect → Bezbaruah Committee Ethnic & external Manipur: Kuki vs Meitei ULFA, NDFB camps in Bhutan → Royal Bhutan Army Operation All Clear"}, {"c": "23", "n": "North East Insurgency", "id": "4-initiatives-pyq-2025", "t": "4 · Initiatives (PYQ 2025)", "x": "4 · Initiatives (PYQ 2025) # Security CAPFs deployed · SRE reimbursement · state police modernisation · India Reserve Battalions UAPA 1967 : 16 NE groups unlawful/terrorist SoO/MoS : tripartite SoO with UPF + KNO (Manipur) , 4 Sep 2025, valid to 3 Sep 2026 Op All Clear (Bhutan) · Op Sunrise (Myanmar) · border fencing and regulation Rehabilitation Surrender-cum-Rehabilitation Scheme ; Civic Action Programme ; Helicopter Subsidy Scheme Special packages Amount Bodo Accord 2020 ₹1,500 cr Karbi Anglong 2021 ₹1,000 cr / 5 yrs Adivasi groups 2022 ₹1,000 cr / 5 yrs DNLA/DPSC 2023 ₹1,000 cr / 5 yrs (NC Hills + Dimasa areas) Infrastructure & development NLCPR (10% of GBS to NER) · NESIDS · HADP (Tamenglong) · NERSDS roads PM-DevINE ₹6,600 cr (48 projects sanctioned) · SIDF · Aspirational Districts Vibrant Villages I (northern border) and II (other land borders, ₹6,839 cr to 2028-29)"}, {"c": "23", "n": "North East Insurgency", "id": "5-arc-ii-solutions", "t": "5 · ARC II Solutions", "x": "5 · ARC II Solutions # Area Key recommendations Administration Officers serve outside NE; more incentives; regional training via NEC; regional cadres for technical posts Police Upgrade NEPA ; exchange NE police ↔ CAPFs Local governance Sixth Schedule : State Finance + Election Commissions for councils; review Meghalaya; amend Para 14; village bodies; codify customary law; Sixth Schedule hills of Manipur Regional (NEC) Amend NEC Act 1971 (conflict resolution); link with MHA; 10-year perspective plan ; NEHU, NEIGRIHMS Misc Act East through NE : Kaladan Multi-Modal, India-Myanmar-Thailand Highway; rail, banks, land records"}, {"c": "23", "n": "North East Insurgency", "id": "6-recent-peace-accords-pyq-2025-map-them", "t": "6 · Recent Peace Accords (PYQ 2025: Map Them)", "x": "6 · Recent Peace Accords (PYQ 2025: Map Them) # Year Accord Key point 2019 NLFT-SD (Tripura) ₹100 cr package 2020 Bru 6,935 families (37,584 persons) rehabilitated in Tripura, ₹793.65 cr 2020 Bodo ₹1,500 cr; 1,615 NDFB cadres surrendered 2021 Karbi 1,926 cadres; Assam integrity 2022 Tribal Peace (8 groups) 1,182 surrendered (tea-garden workers) 2022 Assam-Meghalaya boundary 6 of 12 areas resolved 2023 Assam-Arunachal boundary 123 villages, final 2023 DNLA 181 cadres; ₹1,000 cr 2023 UNLF (Manipur) First valley-based group to renounce violence 2023 ULFA ₹5,000 cr package 2024 TIPRA Land, political rights; Joint Working Group 2024 NLFT-ATTF 4 Sep 2024; ₹250 cr 2026 Eastern Nagaland 5 Feb 2026; Frontier Nagaland Territorial Authority, 6 districts, 46 subjects Memory aid R E S O L V E D (handout's own) R esolution via negotiations · E conomic development & empowerment · S ecuring international collaboration · O pening institutional structure (NE councils) · L aw and order (CAPFs, AFSPA) · V aluing administrative efficiency · E volving strategies for all stakeholders · D evelopment-oriented security forces (Civic Action)"}, {"c": "23", "n": "North East Insurgency", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. % of NE borders that are international? 98% Incidents 2014 → 2024? 824 → 294 Operation by Royal Bhutan Army? All Clear Bodo Accord year and package? 2020 · ₹1,500 cr First valley-based group to renounce violence? UNLF 2023 RESOLVED — what is \"L\"? Law and order"}, {"c": "24", "n": "Manipur Conflict", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words Manipur: Meiteis (valley) vs Kuki-Zo (hills) over ST status, land and territory. Peace needs dialogue + disarmament + decentralisation . Key term In plain words Article 342 Procedure by which a community is listed as Scheduled Tribe. ADC Autonomous District Council: hill bodies with limited powers."}, {"c": "24", "n": "Manipur Conflict", "id": "2-recent-context", "t": "2 · Recent Context", "x": "2 · Recent Context # Where things stand Free movement: Sept 2025, Kuki-Zo Council agreed to reopen NH-02 President's Rule imposed 13 Feb 2025 (CM resigned); government restored 4 Feb 2026 — Yumnam Khemchand Singh CM with two Deputy CMs Weapons: looted from State armouries; disarmament central to response SoO renewed 4 Sep 2025 (KNO + UPF): territorial integrity reaffirmed, camps relocated and reduced, weapons nearer CAPF camps, stricter verification 21 Jul 2026: 46 cadres of KCP (People's War Group) surrendered Data source Number MHA, Apr 2025 260 killed ; no fresh deaths in 4 months IDMC 2024 ~ 67,000 displaced in 2023 (almost all in South Asia) MHA relief ₹247.26 cr (2023-24), ₹349.48 cr (2024-25) Parliamentary Committee 2026 Women and children long in relief camps; needs nutrition, shelter, psychosocial support Value addition Background: since the 1960s militant groups claim to represent ethnic communities; Kukis and Nagas seek separate homelands vs Meiteis defending territorial integrity . Long Myanmar border (ungoverned) and cross-border ethnic ties compound it."}, {"c": "24", "n": "Manipur Conflict", "id": "3-causes-of-the-conflict", "t": "3 · Causes of the Conflict", "x": "3 · Causes of the Conflict # Trigger 27 Mar 2023 Manipur HC directed State to act on Meitei ST inclusion ; Tribal Solidarity March 3 May 2023 → violence Feb 2024 HC deleted para 17(iii): ST inclusion must follow Article 342 procedure Contestation over indigeneity Competing narratives (Meitei, Naga, Kuki-Zo) on settlement, homeland Migration anxiety : Chin migration after 2021 Myanmar coup ; Kuki-Zo reject \"outsider\" label Result: migration, land, citizenship become existential ethnic-security issues Territory & land Kuki-Zo demand separate administration ; SoO 2025 reiterates integrity Land: Meiteis cannot buy land in Kuki/Naga areas; ST status would give access → Nagas, Kukis fear Meitei monopoly Hill-valley divide Status Development Valley-centric, benefits Meiteis Representation Hills ~40% population but 19 seats ; Meiteis 50% hold 40 seats Governance deficit Insurgents run parallel governance; weak decentralisation ADCs Art. 371C + District Council Act 1971 : six councils with limited powers Autonomy Demand Sixth Schedule for hills; recommended by NCRWC (Mar 2002) Illegal immigration, drugs, economy Meitei view: Chin migration threatens demographic balance Kuki view: accusations are majoritarian marginalisation Economic: dumping of Chinese goods; poppy cultivation and drug trade (linked by some to Kukis) Memory aid M A N I P U R (handout's own way forward) M eaningful dialogue · A ddressing violence (disarm) · N ew political representation · I nterrogate land ownership · P olitical will · U niform governance (decentralise) · R einforce fraternity Note Conclusion: meaningful dialogue must precede confidence-building; State government's political will is key."}, {"c": "24", "n": "Manipur Conflict", "id": "4-new-ulfa-peace-accord-29-dec-2023", "t": "4 · New Ulfa Peace Accord (29 Dec 2023)", "x": "4 · New Ulfa Peace Accord (29 Dec 2023) # ULFA accord Signed in New Delhi: pro-talks faction (Arabinda Rajkhowa) + Centre + Assam; 852 cadres surrendered; disbanded 23 Jan 2024 ₹5,000 cr package (₹3,000 cr Centre + ₹2,000 cr Assam); 97 of 126 seats reserved for indigenous people at delimitation; AFSPA lifted from 85% of Assam Unresolved ULFA (Independent) under Paresh Baruah outside; UAPA Tribunal 2025 recognised two factions Myanmar bases enable infiltration, extortion"}, {"c": "24", "n": "Manipur Conflict", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Date of ST order and violence? 27 Mar 2023; 3 May 2023 President's Rule imposed? 13 Feb 2025 Hill vs valley seats? 19 vs 40 MANIPUR \"I\"? Interrogate land ownership ULFA package? ₹5,000 cr"}, {"c": "25", "n": "Jammu and Kashmir", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words J&K militancy now mostly externally driven ; local recruitment and stone-pelting are near zero. Strategy: security + development + hearts-and-minds + rehabilitation . Key term In plain words OGW Over-ground worker: civilian who gives terrorists logistics, shelter, information. Zia doctrine Pakistan's asymmetric/proxy approach after 1971."}, {"c": "25", "n": "Jammu and Kashmir", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Note Intro: J&K security evolved from cross-border terrorism + indigenous militancy + political "Azadi\" sentiment receding; AFSPA/PSA remain until full normalisation Value addition Slide keywords: Insaniyat, Jamhooriyat, Kashmiriyat (Atal ji); \"from disillusionment, disappointment, despondency to development, democracy, dignity \". PYQ Skeleton 2019 · 10 · OGWs Define OGW (over-ground workers: logistics, shelter, intel, funds) → Jamaat-e-Islami ban → measures: UAPA, PSA, financial action, counter-radicalisation, community policing 2023 · 10 · Hearts and minds Back to Village, Sadbhavana, Awaam Ki Awaz, youth schemes, PMDP, rehabilitation → trust through development + civil primacy"}, {"c": "25", "n": "Jammu and Kashmir", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Pahalgam attack date/toll? 22 Apr 2025; 26 killed Terror incidents 2018 → 2025? 228 → 12 J&K reorganisation → UTs? J&K (Assembly) and Ladakh (no Assembly) KASHMIR \"S\"? Sufism and Kashmiriyat PMDP outlay? ~₹80,000 cr"}, {"c": "26", "n": "AFSPA", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words AFSPA gives forces special powers in notified disturbed areas, with immunity. SC (1998): valid, but review every six months . Key term In plain words Disturbed area Area notified where armed forces are needed to aid civil power. Immunity Section 6: no prosecution without Centre's prior sanction."}, {"c": "26", "n": "AFSPA", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Note AFSPA 1958 : Act of Parliament giving armed forces special powers to maintain public order in \"disturbed areas\" . History 1942 Ordinance to suppress Quit India 1947 Bill by Baldev Singh (called \"black bill\") 1958 Act first for Naga Hills (Assam); 1972 amendment : Centre also may declare disturbed area Section Provision 3 Governor or Centre declares disturbed area 4(a) Use force, even lethal, against law-breakers 4(b) Destroy arms dumps, fortified positions 4(c) Arrest without warrant 4(d) Search without warrant 5 Hand arrested persons to nearest police station with least delay 6 Immunity : prosecution needs Centre's sanction Disturbed area Declared by notification under S.3 for disputes between religious, racial, language, regional groups, castes or communities No automatic 3-month duration; Naga People's Movement : must be reviewed within six months Current affairs AFSPA footprint 2026: Assam Tinsukia, Charaideo, Sivasagar (from 1 Apr 2026, 6 months) · Arunachal Tirap, Changlang, Longding + parts of Namsai · Nagaland 9 districts + 5 districts partly · Manipur whole State except 13 police-station areas. Case Principle Inderjit Barua (Delhi HC 1983) Governor's power not arbitrary; needs guidelines Naga People's Movement (SC 1998) Upheld constitutionality; S.4, 5 not arbitrary; periodic review within 6 months Luithukia v. Rishang Keishing (1988) Forces act with district administration , not independently Horendi Gogoi (1991) Hand over arrested persons to police without delay"}, {"c": "26", "n": "AFSPA", "id": "3-analysis", "t": "3 · Analysis", "x": "3 · Analysis # Centre-State Governor or Centre declares → friction; Nagaland says not disturbed, Centre overrides J&K 2009-15 : tried to withdraw from Srinagar, Budgam etc.; Army opposed Operational Operational autonomy bypasses state police No mandated periodic review → prolonged application Immunity → accountability and human-rights concerns (Manipur, J&K) Utility Army manages SoO camps (prevents extortion, clashes) Operation Sadbhavana (J&K civic programme) Maintains public order; empowers forces; upheld by SC Value addition Answer line (2015 PYQ): oppose S.4 and S.6 (immunity) → SC in Naga People's Movement upheld but asked review every 6 months ; balance security with rights."}, {"c": "26", "n": "AFSPA", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Which sections do activists oppose? S.4 (lethal force, arrest/search) and S.6 (immunity) SC case 1998? Naga People's Movement of Human Rights Review period? Six months 1972 amendment? Centre can also declare disturbed area"}, {"c": "27", "n": "Central Armed Police Forces (CAPF)", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words Seven CAPFs under MHA: AR, BSF, CRPF, CISF, ITBP, NSG, SSB . Issues: funds, stress, diversion to law and order, no judicial oversight . Key term In plain words RAF Rapid Action Force: CRPF wing for communal disturbances. COBRA CRPF commando unit for anti-Maoist operations."}, {"c": "27", "n": "Central Armed Police Forces (CAPF)", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Note CAPFs = uniformed forces under the Ministry of Home Affairs for internal security, law and order, counter-insurgency, disaster relief and protecting vital installations. Strength ~ 9,64,000 (≈80% of Army). Memory aid C A B I N S Force list: C RPF · A ssam Rifles · B SF · I TBP · N SG · S SB (+ C ISF) — \" CABINS \" for the cabins of internal security Force Key facts Assam Rifles 1835 Cachar Levy → AR 1917; Indo-Myanmar border (1,643 km) + NE counter-insurgency; Army officers lead CRPF Crown Representative Force 1939 → CRPF 1949; largest (~3.13 lakh, 246 bn); RAF , COBRA ITBP 1962; ~89,000, 60 bn; 3,488 km Karakoram Pass to Jachep La; 9,000-18,700 ft; Water Wing BSF 1965; 2.5 lakh, 186 bn; Indo-Pak and Indo-Bangladesh ( 6,386 km ) + parts of LoC; world's largest border guard CISF ~1.45 lakh; industrial units, Delhi Metro, VIP security, Fire Wing NSG 1984 ; ~7,000; counter-hijack, bomb disposal, hostage rescue; hubs Mumbai, Kolkata, Chennai, Hyderabad; modelled on GSG 9 and SAS SSB Special Service Bureau until 2001; border force post-Kargil; Indo-Nepal 1,751 km and Indo-Bhutan 699 km"}, {"c": "27", "n": "Central Armed Police Forces (CAPF)", "id": "3-issues-with-capf", "t": "3 · Issues With CAPF", "x": "3 · Issues With CAPF # Resources & welfare ~ 98% of allocation is revenue expenditure (salaries etc.) ~ 9,000 leave yearly (housing, stress, leave); ~98% of training companies diverted 700 suicides (2000-18) ; 2021: 48 suicides, 13 fratricides; heart ailments Duties & mandate Diversion from border/CI to law and order (Kargil Review Committee); States prefer CAPFs (cheaper) Role confusion : BSF used for law and order unarmed Strain on COBRA, RAF ; remote terrain (ITBP cold) Legal & coordination CAPF Acts: no external judicial oversight ; need security force courts Lack of integration with military and state police"}, {"c": "27", "n": "Central Armed Police Forces (CAPF)", "id": "4-role-of-capf-way-forward", "t": "4 · Role of CAPF & Way Forward", "x": "4 · Role of CAPF & Way Forward # Role AR Myanmar border; BSF : Punjab 2,086 kg heroin = 58% of India's 3,567 kg (NCB), anti-narcotics with ANTF NSG quick response; CRPF camps in Sukma, Bijapur; 241 Bastariya Battalion ; ITBP mountain rescue; CISF infrastructure UN missions ; IPS leadership (Punjab, Greyhounds) Modernisation & welfare Modernisation Plan IV (1 Feb 2022-31 Mar 2026): ₹1,523 cr — firearms, UAVs, mine-protected vehicles, comms PM scholarship, medical-college reservation; leave policy; Chaupal meetings; yoga; Phalnikar 2016 study Way forward Tech for riverine belt in Punjab (UAV, thermal imagers); shorter modernisation cycles; local-context equipment; AR withdrawal from Myanmar border and CAPF redeployment; community engagement (Bastariya model) Current affairs CISF took over Parliament security (May 2024) after the Dec 2023 breach , replacing Delhi Police outer access control; Parliament Security Service (since 1929 , after Bhagat Singh-Dutt bomb) remains; Art. 98 — each House has own secretariat; P.D.T. Achary objects; 13 Dec 2001 martyrs Matbar Singh Negi, Jagdish Prasad Yadav ."}, {"c": "27", "n": "Central Armed Police Forces (CAPF)", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Largest CAPF? CRPF Border length guarded by BSF? 6,386 km NSG founded? 1984 Modernisation Plan IV outlay? ₹1,523 cr"}, {"c": "28", "n": "Border Management: Challenges, Bangladesh, Myanmar, Nepal", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words Every border has a different crime and a different force — know the table. FMR scrapping and fencing need ethnic sensitivity. Key term In plain words FMR Free Movement Regime: visa-free 16 km movement across India-Myanmar border. BOLD-QIT Border Electronically Dominated QRT Interception Technique: sensor/radar grid on riverine gaps."}, {"c": "28", "n": "Border Management: Challenges, Bangladesh, Myanmar, Nepal", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Current affairs Data (Dec 2025): Bangladesh border 4,096.7 km , fenced 3,239.92 km = 79.08% . Pakistan IB 2,289.66 km under fencing programme, fenced 2,135.136 km = 93.25% . 2024 infiltration attempts: Bangladesh 977 · Pakistan 41 · Myanmar 37 · Nepal-Bhutan 23. (Note: handout also quotes sanctioned length 4,223.04 km and 3,232.218 km fenced as of Feb 2025 — different dates.) Note Border management = securing borders against hostile interests while facilitating legitimate trade ; integrates administrative, diplomatic, security, intelligence, legal, regulatory and economic agencies, and builds border infrastructure. Land neighbours: Pakistan, China, Nepal, Bhutan, Bangladesh, Myanmar, Afghanistan . Value addition National Border Policy needed — treat border as national security , not law and order. BSF jurisdiction raised 15 km → 50 km . \"What enters through the border permeates the hinterland like a virus through the bloodstream.\""}, {"c": "28", "n": "Border Management: Challenges, Bangladesh, Myanmar, Nepal", "id": "3-broad-challenges", "t": "3 · Broad Challenges", "x": "3 · Broad Challenges # Border challenges Terrain: Rajasthan desert · Gujarat swamp (Rann) · Ladakh cold desert · J&K snow mountains Porosity: ethnic communities straddle the border; infiltration; inadequate fencing Under-resourced forces: weak training/equipment, bureaucratisation, manpower shortage, dual-force dilemma (army + police) Poor infrastructure: BOPs without electricity Weak intelligence sharing; many agencies , different reporting lines Border Guarding force Bangladesh BSF China ITBP (LAC: Army ) Myanmar Assam Rifles Nepal and Bhutan SSB Pakistan (IB) BSF Pakistan (LoC) Army"}, {"c": "28", "n": "Border Management: Challenges, Bangladesh, Myanmar, Nepal", "id": "4-india-bangladesh-border", "t": "4 · India-Bangladesh Border", "x": "4 · India-Bangladesh Border # Profile 4,096.7 km , 5 States (WB, Assam, Meghalaya, Tripura, Mizoram); plains, rivers, hills, jungle; dense population and cultivation up to the line Challenges: FICN, arms, narcotics; human trafficking; radicalism; cattle smuggling (>20 lakh/yr) ; engineered demographic change; WB 2,216.7 km, 1,647.696 fenced, 569.004 unfenced Measures Non-lethal weapons (rubber bullets) for zero border killings 162 enclaves exchanged (2015) — residents chose citizenship 1,096 BOPs ; fencing + floodlights; BOLD-QIT (sensors, radars, automation); July 2026 MHA reviewed radio fence-breach detection and infrared alarms for rivers/gaps (smart border); LCTS 281 km"}, {"c": "28", "n": "Border Management: Challenges, Bangladesh, Myanmar, Nepal", "id": "5-india-myanmar-border", "t": "5 · India-Myanmar Border", "x": "5 · India-Myanmar Border # Profile and fencing 1,643 km : Arunachal, Nagaland, Manipur, Mizoram; 1,472 km demarcated ; ~186 pillars; Parva Salient (Mizoram) difficult Fencing: BRO at Moreh; Dec 2025: 9.214 km done; July 2026: programme for ~1,610 km, ~₹31,000 cr ; smart fence 100 km; critics: fencing even if only 70% effective = success Manpower: Assam Rifles do border + counter-insurgency — should it only guard? Note Free Movement Regime (FMR) — 2018 (Act East): 16 km visa-free, border pass 1 yr for 2-week stays; British demarcation of 1826 split Naga/Mizo/Chin people. Government decided to fence entire border and scrap FMR. Why scrap FMR Challenges in scrapping Insurgents cross easily Nagaland/Mizoram ethnic and topographic ties Golden Triangle drugs (opium) Nagalim aspirations; colonial borders Refugees : Manipur conflict, Tatmadaw vs rebels; Mizo acceptance Trade, healthcare, education access; Aadhaar issues Assam, Arunachal, Manipur support scrapping A 10-km Manipur fence took a decade; NER alienation; Act East harmed Value addition Value addition: balance security with ethnic realities — fence + regulated border passes + development, not blanket closure."}, {"c": "28", "n": "Border Management: Challenges, Bangladesh, Myanmar, Nepal", "id": "6-india-nepal-border", "t": "6 · India-Nepal Border", "x": "6 · India-Nepal Border # Profile and issues 1,751 km : Uttarakhand, UP, Bihar, WB, Sikkim; open border; 539 BOPs ; 1,299 km roads sanctioned; JWG on border management LeT, IM, NE insurgents use it: cadres, FICN , terror financing via Nepali banks, arms, narcotics; Maoist links; land grabbing Map dispute 2020 Nepal map claims Kalapani, Lipulekh, Limpiyadhura (after India's road); constitutional amendment June 2020; India: unilateral, integral part of India; dialogue via diplomatic platform China angle: 2015 134-day blockade → Oli signs trade and transit agreement with China ; leftist parties near CCP; Chinese disinformation (Prachanda's visit 2023)"}, {"c": "28", "n": "Border Management: Challenges, Bangladesh, Myanmar, Nepal", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. SSB guards which borders? Nepal and Bhutan FMR range? 16 km Enclaves exchanged? 162 (2015) Nepal map dispute areas? Kalapani, Lipulekh, Limpiyadhura"}, {"c": "29", "n": "Smart Border and Border Area Development (BADP, VVP, BIM)", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words Technology + development + trust = border management. BADP, VVP, BIM answer the 2024 PYQ directly. Key term In plain words CIBMS Sensors, networks and command-control integrated over manpower for border domination. BISAG-N Bhaskaracharya Institute for Space Applications and Geoinformatics: GIS monitoring."}, {"c": "29", "n": "Smart Border and Border Area Development (BADP, VVP, BIM)", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Multi-pronged approach Surveillance: BOP, ICP , thermal imagers, night vision, CCTV/PTZ, infrared sensors, UAVs, radars Intelligence: upgrade; joint border management Security: fencing; floating BOPs in rivers; CIBMS (integrates manpower, sensors, networks, command-control) Development of border areas BADP · BIM scheme · NERIDS (NE infrastructure) · Project Vartak (Arunachal roads) · Arunank (4 roads, 255 km) Community-led: Vibrant Villages ; climate of trust; local employment; civic action — Operation Sadbhavana , Army Goodwill Schools"}, {"c": "29", "n": "Smart Border and Border Area Development (BADP, VVP, BIM)", "id": "3-badp", "t": "3 · BADP", "x": "3 · BADP # Current affairs BADP — Core Centrally Sponsored Scheme of Dept of Border Management, MHA ; 460 border blocks, 117 districts, 16 States + 2 UTs ; applies to habitations 0-10 km (aerial) from IB; works: roads, bridges, drinking water, health, agriculture, social infrastructure. Region Centre : State 8 NE States + HP + Uttarakhand 90:10 Bihar, Gujarat, Punjab, Rajasthan, UP, WB 60:40 UT of J&K 90:10 UT of Ladakh (no legislature) 100% Centre"}, {"c": "29", "n": "Smart Border and Border Area Development (BADP, VVP, BIM)", "id": "4-vibrant-villages-programme", "t": "4 · Vibrant Villages Programme", "x": "4 · Vibrant Villages Programme # Why Counter China's dual-use \"xiaokang\" villages : 624 built in TAR 2018-22; Land Borders Law (1 Jan 2022) ; Xinjiang-Tibet railway near Aksai Chin Indian border villages: illiteracy, poor facilities, out-migration (2018 Parliamentary Committee) Features VVP-I : 662 northern-border villages (10 km); roads, housing, renewable energy VVP-II (Apr 2025): Central Sector, 100% central funds, ₹6,839 cr to 2028-29 , 1,954 villages on other land borders Hub-and-spoke growth centres; One Village-One Product ; tourism, cooperatives; BISAG-N GIS monitoring; integrated with PM Gati Shakti Current affairs BRO budget 2026-27: capital ₹7,394 cr (vs ₹7,146.5 cr 2025-26). Infrastructure: 118 projects dedicated (90 in Sept across 11 States/UTs); Shinku La tunnel (4.1 km, Dec 2025 target); Sela twin-tube tunnel to Tawang; DSDBO road; Nyoma airfield upgrade; Shyok bridge."}, {"c": "29", "n": "Smart Border and Border Area Development (BADP, VVP, BIM)", "id": "5-community-in-border-management", "t": "5 · Community in Border Management", "x": "5 · Community in Border Management # Why community matters Mutual trust · surveillance gaps filled (fishermen guide Navy/ICG) · CIPs · rights protected · community policing · early detection · local terrain knowledge Challenges Weak state capacity; poor infrastructure; low pay/training; alienation ; anti-smuggling seen as interference; fencing blocks farmland ; criminals provoke confrontations; ad hoc cooperation Way forward Trust frameworks; treat understanding the community as a management function; code of conduct ; replace \"border guarding\" with \"border management\" ; learn local languages; civic action (sports, grants) Value addition 2020 PYQ line: to deny local support to militants — development + dignity + grievance redress + local intelligence networks (not just force)."}, {"c": "29", "n": "Smart Border and Border Area Development (BADP, VVP, BIM)", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. BADP funding for NE? 90:10 VVP-II villages and outlay? 1,954; ₹6,839 cr Border blocks in BADP? 460 blocks, 117 districts CIBMS stands for? Comprehensive Integrated Border Management System"}, {"c": "30", "n": "Smart Border Technology: CIBMS, BOLD-QIT, Anti-Drone Grid", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words Smart border = sensors + drones + AI + one command grid. Add community and oversight to make it work. Key term In plain words CIBMS Sensor-based integrated border surveillance framework. Virtual fencing Electronic sensors that alert without a physical fence."}, {"c": "30", "n": "Smart Border Technology: CIBMS, BOLD-QIT, Anti-Drone Grid", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Note Smart Border Management = advanced surveillance, sensors, data networks, AI, drones, anti-drone systems and integrated command platforms to secure borders in real time. Slogan on slides: One Border, One Guarding Force ."}, {"c": "30", "n": "Smart Border Technology: CIBMS, BOLD-QIT, Anti-Drone Grid", "id": "3-why-it-matters", "t": "3 · Why It Matters", "x": "3 · Why It Matters # Reasons Terrain : mountains, deserts, swamps, rivers make fencing and patrol hard Real-time infiltration alerts Anti-smuggling : narcotics, arms, cattle, gold, fake currency, trafficking Counter-drone need Riverine stretches cannot be fenced (Brahmaputra) Force multiplier for BSF and others Single command platform across agencies Hybrid-war readiness"}, {"c": "30", "n": "Smart Border Technology: CIBMS, BOLD-QIT, Anti-Drone Grid", "id": "4-steps-taken", "t": "4 · Steps Taken", "x": "4 · Steps Taken # Initiative Detail CIBMS (Comprehensive Integrated Border Management System) Sensors, cameras, radars, command centres. Pilots ~ 71 km : 10 km Pakistan border, 61 km Bangladesh border Smart fencing Virtual sensor layer; pilot in Jammu sector (Pakistan border) BOLD-QIT Border Electronically Dominated QRT Interception Technique; cameras, sensors, optical fibre, microwave; unfenced Brahmaputra (Dhubri) Smart Border Project 2026 Proposed: radars, cameras, drones; pilots at BSF and SSB locations LPMS VINIMAY Digital land-port management for cargo, passengers, vehicles Integrated Check Posts Customs, immigration, security under one roof (Bangladesh, Nepal borders) AI surveillance Pattern recognition, fewer false alarms, face recognition, predictive alerts"}, {"c": "30", "n": "Smart Border Technology: CIBMS, BOLD-QIT, Anti-Drone Grid", "id": "5-anti-drone-measures", "t": "5 · Anti-Drone Measures", "x": "5 · Anti-Drone Measures # Response Counter-drone systems : detect, track, identify, jam, neutralise (Pakistan border) SAKSHAM : Army CUAS grid Drones for patrol in deserts, rivers, marshes, mountains Layered response : BSF, Army, intelligence, police; after recovery do payload analysis, route mapping, forensics"}, {"c": "30", "n": "Smart Border Technology: CIBMS, BOLD-QIT, Anti-Drone Grid", "id": "6-challenges-and-way-forward", "t": "6 · Challenges and Way Forward", "x": "6 · Challenges and Way Forward # Challenges Terrain; high cost; power and connectivity gaps False alarms (animals, fog) Cyber risk : hacking, jamming, spoofing Agency silos; harsh weather Community livelihood worries; privacy and rights Way forward Terrain-specific models AI data fusion of drones, sensors, satellites, patrols, humint Drone Wall on the EU model (radar, RF sensors, EO cameras, jammers, response teams) Cyber-secure systems; unified command centre Village Defence Guards and informants Indigenous technology; smart crossing points Border Security Technology Oversight Authority to audit surveillance Value addition Balanced answer: technology + manpower + community + rights safeguards. Development side (BADP, Vibrant Villages, community) is in the Smart Border and Border Area Development chapter."}, {"c": "30", "n": "Smart Border Technology: CIBMS, BOLD-QIT, Anti-Drone Grid", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. CIBMS pilot length? ~71 km (10 km Pak + 61 km Bangladesh) BOLD-QIT used where? Unfenced Brahmaputra border, Dhubri VINIMAY? Land Port Management System Drone Wall model from? European Union"}, {"c": "31", "n": "Drones and UAVs in Security; Anti-Drone Systems", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words Drones help surveillance and strikes ; they also carry drugs and bombs . Defence = detect, identify, jam, destroy . Key term In plain words Loitering munition Drone that waits over an area then dives onto target. Soft kill Disable by jamming or spoofing without destroying."}, {"c": "31", "n": "Drones and UAVs in Security; Anti-Drone Systems", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Role of drones in security Surveillance and reconnaissance (Heron, Switch drones of Army and BSF) Disaster response (Kerala floods 2019, Joshimath subsidence) Crowd management (Kumbh Mela) Maritime security (Navy Sea Guardian) Psychological warfare Precision targeting ; cost-efficient Threats Cross-border terrorism and narcotics/arms drops Attack on critical infrastructure : IAF station, Jammu (2021) Espionage Drone swarms Drug trafficking"}, {"c": "31", "n": "Drones and UAVs in Security; Anti-Drone Systems", "id": "3-types-in-use", "t": "3 · Types in Use", "x": "3 · Types in Use # Type Notes and examples ISR drones TAPAS-BH-201, Rustom (DRDO), Heron Mk-II (Israel) Commercial / modified Off-the-shelf drones modified for illegal cross-border use Swarm Many drones coordinate to overwhelm defences; DRDO and private firms developing Loitering munitions Loiter, then strike: HAROP, Mini Harpy, SkyStriker and others Armed / combat Ghatak (DRDO, under development), Heron TP (Israel) Target drones ABHYAS, Lakshya Civil / governance SVAMITVA drones, Kisan drones, Namo Drone Didi"}, {"c": "31", "n": "Drones and UAVs in Security; Anti-Drone Systems", "id": "4-counter-drone-systems", "t": "4 · Counter-Drone Systems", "x": "4 · Counter-Drone Systems # Counter-drone chain Detect: RF sensors, radar, acoustic, electro-optical → Identify and track: AI and ML algorithms → Soft kill: RF/GPS jamming, spoofing → Hard kill: laser (directed energy), kinetic interceptor, small-calibre gun turrets System Detail Drone Rules, 2021 Legal framework Anti-Rogue Drone Technology Committee Under MHA D4 System Drone Detect, Deter, Destroy Indrajaal Integrated drone interdiction DRDO Anti-Drone System Includes laser systems SAKSHAM Army CUAS grid: modular C2 on Army Data Network; detects, tracks, identifies and neutralises hostile drones up to 3,000 m Value addition Way forward: comprehensive National Counter Rogue Drone guidelines , vulnerability assessments of installations, strengthen operational frameworks, layered coordination, indigenous technology."}, {"c": "31", "n": "Drones and UAVs in Security; Anti-Drone Systems", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Soft versus hard kill? Soft = jam/spoof; Hard = laser or kinetic destroy Drone attack of 2021? IAF station, Jammu SAKSHAM range? Up to 3,000 m"}, {"c": "32", "n": "India-Pakistan Border", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words Indo-Pak border mixes terror, drones and narcotics . Trade is suspended since 2019. Key term In plain words Sir Creek Marshy tidal estuary in Rann of Kachchh: maritime boundary dispute with Pakistan."}, {"c": "32", "n": "India-Pakistan Border", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Note 3,323 km border: Gujarat, Rajasthan, Punjab, J&K, Ladakh. Terrain: desert, marsh, snow mountains, plains. Frequent infiltration, arms and contraband smuggling. Challenges Terrorism and infiltration · ceasefire violations · arms smuggling · border disputes ( Sir Creek ) · drones · Indus water sharing · diverse terrain · time and cost overruns · drugs, FICN, arms Measures 736 BOPs ; floodlights approved over 2,078 km Fencing 93.25% of 2,289.66 km (Dec 2025) CIBMS ; BSF vulnerability mapping; pilot : two 5-km stretches in Jammu; low-cost tech project 484 km (Pak + Bangladesh)"}, {"c": "32", "n": "India-Pakistan Border", "id": "3-trade-a", "t": "3 · Trade (a", "x": "3 · Trade (a # PYQs PYQ HOOK) Point Detail MFN India gave Pakistan MFN in 1996; Pakistan negative list 1,209 , only 138 allowed via Wagah-Attari Volume $2.29 bn (0.35% of India's trade); India surplus Suspension Pakistan suspended trade Aug 2019 after Art. 370 abrogation; India had imposed 200% tariff and revoked MFN 2021 ECC allowed cotton, yarn; Imran Khan reversed Context Pakistan's crises: 2022 floods, inflation, IMF; trade via Iran/Dubai; Attari ICP would open Central Asia Value addition Answer line: border is a hybrid battle-line — fence + tech + intelligence + diplomacy; use BSF + ANTF + drone countermeasures against narco-drones in Punjab."}, {"c": "32", "n": "India-Pakistan Border", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Fencing % at Pak IB? 93.25% Trade suspended when? Aug 2019 BOPs at Indo-Pak? 736"}, {"c": "33", "n": "India-China Border (LAC)", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words Disengagement done, de-escalation pending . India: military dialogue + reduced dependence + infrastructure . Key term In plain words Disengagement Pulling back troops from face-off; not same as de-escalation or boundary settlement. Xiaokang village China's dual-use border defence village."}, {"c": "33", "n": "India-China Border (LAC)", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Quote \"Stable but sensitive\" — Gen Manoj Pande . EAM Jaishankar: unless the border is resolved \"you cannot expect the rest of relations to go on normally\" . Timeline 1947-56 hope, India recognises PRC, accepts Tibet annexation → 1962 war → 1988 Rajiv Gandhi visit → 2017 Doklam → Jun 2020 Galwan → 9 Dec 2022 Yangtse (Tawang) → 21 Oct 2024 Depsang-Demchok patrolling deal Current dynamics No-guns within 2 km of LAC agreement holds Talks: blockades removed at three places → no-patrol zones ; Depsang Bulge and Charding Nala (Demchok) were pending India lost access to 30 of 65 patrolling points (handout; other line says China blocks 26 — conflict, verify) Disengaged at Galwan, Pangong Tso, Gogra, PP15 ; 21 Oct 2024 deal on Depsang and Demchok — disengagement is not a boundary settlement Why it matters \" No war, no peace \" limbo; trade deficit ~$100 bn finances PLA; China blocks India at UNSC, props Pakistan; India's hedging: economic engagement + military confrontation + diplomatic assertion — unsustainable"}, {"c": "33", "n": "India-China Border (LAC)", "id": "3-buildup", "t": "3 · Buildup", "x": "3 · Buildup # China India TAR roads, rail, oil and logistic depots; defence budget $225 bn (2023) ; Xinjiang-Tibet railway via Aksai Chin Poorer infrastructure; topographic advantage for air ops; since 2020 more mechanised/armoured units, ISR; CDS + DMA ; theatre command; indigenisation Land Borders Law 2022 ; 624 xiaokang villages VVP ; 118 BRO projects, 601 km roads/yr; Sela, Shinku La ; Project Arunank 255 km"}, {"c": "33", "n": "India-China Border (LAC)", "id": "4-encirclement", "t": "4 · Encirclement", "x": "4 · Encirclement # China's moves Myanmar: mediates ceasefire yet arms ethnic groups (dual approach) Nepal: transit transport agreement; disinformation vs India Pakistan (CPEC), Sri Lanka, Bangladesh, IOR presence"}, {"c": "33", "n": "India-China Border (LAC)", "id": "5-way-forward", "t": "5 · Way Forward", "x": "5 · Way Forward # India's approach Three-fold: continual military dialogue · reduce economic interdependence · hold political engagement Revive Special Representatives (not met for four years); hotlines; convert LAC to a demarcated LoC (jointly monitored) Strategic autonomy : Quad but no freedom-of-navigation ops in W. Pacific; avoid US-China rivalry; non-alignment; balanced public discourse C. Raja Mohan: limit economic exposure and suspend political dialogue as leverage. Chinese aphorism: \"he who tied the knot must untie it\" Value addition Value addition: \"A state of relations depends on the state of the border.\" Competing with China should not distract from development; no permanent adversaries or allies — prioritise peaceful progress without neglecting defence."}, {"c": "33", "n": "India-China Border (LAC)", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Disengagement points? Galwan, Pangong, Gogra, PP15 Date of 2024 deal? 21 Oct 2024 No-guns zone? 2 km of LAC Land Borders Law? 1 Jan 2022"}, {"c": "34", "n": "Illegal Migration", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words Migration is both a humanitarian and a security issue. Rohingya case is the legal flashpoint. Key term In plain words Non-refoulement Not sending a refugee to a country where they face persecution. NRC National Register of Citizens."}, {"c": "34", "n": "Illegal Migration", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Current affairs Data: Census 2011 — 5.5 m with last residence abroad (0.44%); 2.3 m (42%) Bangladesh, 0.7 m (12.7%) Pakistan. UNHCR: >2.4 lakh refugees/asylum seekers; 86,100 from Myanmar incl. Rohingya; ORF 2025 estimate 12-20 m illegal Bangladeshis (estimate, treat with caution). History 1950 Nehru-Liaquat → Partition migration → 1971 war influx → 1985 Assam Accord (cut-off 24 Mar 1971) → NRC Assam 3.1 cr eligible, 19.06 lakh excluded → 2015 exemption to persecuted minorities (before 31 Dec 2014) → CAA 2019 → Immigration and Foreigners Act 2025 Challenges in curbing Terrain : 174.5 km non-feasible to fence Land acquisition (WB) Vote-bank politics ; NRC/CAA resistance and litigation Manpower and equipment; coordination (BSF, AR, DRDO, CPWD) Steps taken Fence with floodlights (4,223.04 km sanctioned); LCTS 281 km; CIBMS ; vulnerability mapping; patrols, nakas, anti-tunnelling; advisories to BSF and AR Immigration and Foreigners Act 2025 repeals four colonial laws (Passport (Entry into India) 1920, Registration of Foreigners 1939, Foreigners Act 1946, Immigration (Carriers' Liability) 2000) S.6A Citizenship Act : entrants to Assam 1 Jan 1966-25 Mar 1971 could register Myanmar-side causes 1 Feb 2021 coup , Chin refugees to Mizoram and Manipur; ethnic ties (Chin-Mizo); Rohingya persecution since 2017; porous terrain; economic distress Memory aid M I G R A N T M onitoring · I nternational cooperation · G overnance/legislation · R ehabilitation and reintegration · A wareness · N ational security · T echnology (the faculty's MIGRANT)"}, {"c": "34", "n": "Illegal Migration", "id": "3-rohingya-case-priyali-sur-v-union-of-ind", "t": "3 · Rohingya Case (priyali Sur V Union of India)", "x": "3 · Rohingya Case (priyali Sur V Union of India) # Petitioners Union of India (affidavit) Deportation violates Art. 14, 21, 51(c) ; non-refoulement (customary law) Mostly illegal entrants; Foreigners Act 1946 applies; Art. 19 only for citizens Detention is arbitrary National security threat; porous borders; limited resources Seek release from detention centres Refugee status is for legislature/executive , not judicial overreach Value addition Value addition: balance humanitarian obligations (Art. 21, non-refoulement) with security; push for a national refugee framework and graded screening."}, {"c": "34", "n": "Illegal Migration", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Assam NRC excluded? 19.06 lakh Cut-off date in Assam Accord? 24 March 1971 Which Act repealed 4 laws? Immigration and Foreigners Act 2025 Myanmar coup date? 1 Feb 2021"}, {"c": "35", "n": "Maritime and Coastal Security", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words Problem is many agencies, no single command . Fix: tech, tracking, trained marine police, community . Key term In plain words IMSS 2015 Ensuring Secure Seas: Indian Maritime Security Strategy. NC3I National Command Control Communication and Intelligence network."}, {"c": "35", "n": "Maritime and Coastal Security", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Current affairs Data: Coastline 11,098.81 km (mainland 7,870.51; islands 3,228.30). Maritime boundary with 7 countries. 12 major + 205 minor ports handle ~ 95% trade volume / 70% value . EEZ ~23 lakh km² (200 nm). ICG 2025: 103 SAR missions, 76 lives, 18,613 boardings, 1,594 CIPs. IB audit: 187 of 200+ minor ports lack adequate security. Concerns (IDSA) Fragmented approach ; no unity of command; land borders fenceable but sea sliding jurisdiction Policing vs border guarding : policing (State List) conflated with maritime security (Union) ICG's primary duty is maritime zones, not border guarding; unclear statutory definitions ; Navy covers 12-200 nm Sub-20 m boats : costly to track; risk of 26/11-type attack Why coastal security matters Creeks, estuaries, mudflats; Sir Creek, Palk Strait unsettled; terrorism ( 26/11 , MV Nalini 2019, 2011 naval vessel attack); weak minor ports; illegal fishing; drugs/arms; sea trade, submarine cables ; piracy; neighbours (Maldives, Sri Lanka, Pakistan); Bombay High, Kalpakkam, SEZs; fishermen straying"}, {"c": "35", "n": "Maritime and Coastal Security", "id": "3-initiatives", "t": "3 · Initiatives", "x": "3 · Initiatives # Type What Infrastructure JOCs, Coastal Surveillance Network, VTMS radars ; minor-port guidelines (ISPS); SPM SOP; transponders on small boats / ISRO trackers; coastal mapping by BISAG-N; Coastal Security Scheme Policy IMSS 2015 \"Ensuring Secure Seas\"; SAGAR; HADR Exercises Sagar Kavach, CORPATs, Sea Vigil Community CIPs; fishermen biometric ID cards Institutions National Committee for Strengthening Maritime and Coastal Security ; NC3I ; IMAC; IFC-IOR ; Marine Police; 10 coastal police stations; National Academy of Coastal Policing (Dwarka); Joint Coastal Patrolling (15 Aug 2020) Memory aid M A R I T I M E Faculty's \" MARITIME \" way forward: M odernisation · A dvanced tech · R egulation · I ntegration of agencies · T raining · I nfrastructure · M ulti-agency exercises · E ngagement of community Current affairs Current affairs: India began cooperation with Combined Maritime Forces (CMF) , Bahrain (counter-narcotics, anti-piracy); Navy opened MARCOS to women (Agniveers from 2023)."}, {"c": "35", "n": "Maritime and Coastal Security", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. India coastline? 11,098.81 km IMSS year? 2015 Joint Coastal Patrolling start? 15 Aug 2020 Minor ports lacking security? 187 of 200+"}, {"c": "36", "n": "Piracy and Maritime Anti-Piracy Act 2022", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words Piracy is back; India has law + Navy + partnerships . Key term In plain words HRA High Risk Area for piracy declared by IMO/industry."}, {"c": "36", "n": "Piracy and Maritime Anti-Piracy Act 2022", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Current affairs Data: piracy up ~ 20% (Navy); war-risk premium 0.05% → 1% of ship value ($2 m on a $200 m ship); Cape route adds ~10 days; Suez ~12-15% of world trade, traffic -42% (Dec 2023-Jan 2024). IMO HRA moved 65°E to 78°E (2010 per handout; the 2014 question says 2012); industry rescinded HRA from 1 Jan 2023 , situation deteriorated again. Recent incidents Drone attack on Gabon-flagged tanker (25 Indian crew); MV Chem Pluto (21 Indian crew); MV Ruen seized by Somali pirates → Navy rescued 17; Operation Sankalp : 18 incidents in 100 days; INS Sumitra, INS Visakhapatnam Implications Economic: freight, insurance, supply chain, crude/LNG via Bab-el-Mandeb Security: drones and pirates, Houthi attacks, Chinese presence Initiative Role UNCLOS Legal framework CMF (CTF-151) Multinational anti-piracy EU NAVFOR Atalanta (2008) Somalia IORA, Djibouti Code Regional cooperation MSCHOA Public-private coordination BMP Industry best practices Memory aid P I R A C Y P revention · I nternational cooperation · R egulation/law enforcement · A wareness and training · C apacity building · Y outh and economic development (faculty)"}, {"c": "36", "n": "Piracy and Maritime Anti-Piracy Act 2022", "id": "3-maritime-anti-piracy-act-2022", "t": "3 · Maritime Anti-Piracy Act 2022", "x": "3 · Maritime Anti-Piracy Act 2022 # Note Implements UNCLOS ; gives Navy and Coast Guard power to intercept, board, seize and arrest on the high seas; designated Indian courts try pirates irrespective of nationality ; punishes organising/facilitating; death or life imprisonment if piracy causes death. Value addition Alondra Rainbow (1999): ICG caught pirates, but Mumbai High Court acquitted them for lack of jurisdiction and domestic law — the gap the 2022 Act filled. India's evolution Blue-water navy since mid-1990s; maritime doctrine 2004/2007 ; IMSS 2015 ; Gulf of Aden deployment 2008 ; 26/11 reset coastal security; net security provider ; shift to Indo-Pacific"}, {"c": "36", "n": "Piracy and Maritime Anti-Piracy Act 2022", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Anti-Piracy Act year? 2022 Which case exposed legal gap? Alondra Rainbow 1999 HRA moved to? 78° East"}, {"c": "37", "n": "Terrorism: Concept, Types, India and Counter-Measures", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words No universal definition; India has faced all types . Fight with intelligence + law + technology + diplomacy . Key term In plain words Lone wolf Individual acting alone, self-radicalised. State-sponsored terror Non-state actors backed by a state."}, {"c": "37", "n": "Terrorism: Concept, Types, India and Counter-Measures", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Note Why undefined? Agreeing when violence is legitimate (by whom, against whom, for what ends) is contested; many definitions are made by governments and omit state acts . UN strategy: criminal acts to provoke terror for political purposes are unjustifiable whatever the justification . GCTF: intentional use or threat of violence for political, religious or ideological aims. Common elements of an attack Meaning Propaganda / branding Justify ideology; build brand Claim of responsibility Fear + attention Modus operandi, targets Symbolic, crowded places Motivation Revenge, jihad, self-righteousness Planning Recon, logistics, coordination Current affairs Data: Global Terrorism Index 2026 — deaths -28% to 5,582 (2025), incidents -22% to 2,944 , lowest since 2007; Pakistan most affected ; India 13th (score 6.428). MHA 2020-21: 222 incidents in 2020 vs 317 in 2019; J&K, NE, LWE areas worst; Chhattisgarh 2nd. (2019: India 3rd by number of attacks.)"}, {"c": "37", "n": "Terrorism: Concept, Types, India and Counter-Measures", "id": "3-india-s-timeline", "t": "3 · India's Timeline", "x": "3 · India's Timeline # Timeline 1984 Indira Gandhi assassinated; Punjab militancy → 1990s J&K insurgency; \"bleed India with a thousand cuts\" → 2001 Parliament attack → 2006 Mumbai trains → 2008 Mumbai 26/11 (LeT) → 2010s IM, ISIS; lone wolf; right-wing blasts (Malegaon, Ajmer, Samjhauta) → Today: cross-border + homegrown + online radicalisation + cyber"}, {"c": "37", "n": "Terrorism: Concept, Types, India and Counter-Measures", "id": "4-types-of-terrorism", "t": "4 · Types of Terrorism", "x": "4 · Types of Terrorism # Type Features and examples Ideology: right / left Christchurch 2019; Red Brigades, FARC Religious Taliban, Al-Qaeda, ISIS Ethno-nationalist NE insurgency, IRA Narco-terrorism Taliban + opium; Zetas Bio / nuclear / cyber Aum Shinrikyo 1995; anthrax 2001; dirty bomb; SolarWinds 2020 Environmental Earth Liberation Front Lone wolf Brenton Tarrant State terrorism State force on own citizens State-sponsored Funding, arms, training, safe havens to non-state actors"}, {"c": "37", "n": "Terrorism: Concept, Types, India and Counter-Measures", "id": "5-india-s-counter-terror-architecture", "t": "5 · India's Counter-Terror Architecture", "x": "5 · India's Counter-Terror Architecture # Category Institutions Intelligence IB, RAW, MAC , CyMAC (22 Jan 2025) , NTRO, NIA's NTDFAC , FCORD (fake notes) Operations NCTC coordinates but no central command; NSG Investigation NIA, FSLs, FIUs, state ATS Prosecution NIA special courts, UAPA, SPPs Laws NIA (Amendment) Act 2019 , UAPA (Amendment) Act 2019 Memory aid T E R R O R I S M Faculty's way forward: T echnology regulation · E liminate funding · R einforce treaties · R eaffirm multilateralism · O rganise civil society · R ebuild trust · I ntelligence · S trengthen laws · M obilise awareness Value addition 2021 PYQ link: UAPA/NIA amendments — see UAPA and NIA chapter. 2024 PYQ: narco-terrorism — see Drug Trafficking chapter."}, {"c": "37", "n": "Terrorism: Concept, Types, India and Counter-Measures", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. GTI 2026 India rank? 13th MAC cyber wing? CyMAC, 22 Jan 2025 2019 amendments? UAPA and NIA Acts"}, {"c": "38", "n": "Terrorism and Technology: Dark Web, Crypto, Drones", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words Terror groups use the same tools we do . Fix: AI, regulation, crypto tracking, global cooperation . Key term In plain words Stealth address New address per crypto transaction to hide the receiver. FTF Foreign Terrorist Fighter."}, {"c": "38", "n": "Terrorism and Technology: Dark Web, Crypto, Drones", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Problem Planning blind spots; tech outpaces regulation ; obsolete counter-strategies; \"technology fatigue\" (Berlin Memorandum 2019); dual use (AI recruit and radicalise) Stage Use of technology (examples) Propaganda Telegram; deepfake (2021 Khalistan video); games (Hezbollah Special Force, Huroof); live-streams (Christchurch, Halle) Recruitment Global pool; Aug 2021 pro-IS Telegram group recruiting in India Training Inspire (Al-Qaeda), manuals; IS 2015 app security ranking Planning Encrypted comms, UAV, GPS, 3-D printing; 2021 drone attack on IAF Jammu Fundraising Bitcoin, Monero, zakat misuse (IS-K Voice of Khorasan; PFI via crypto and Gulf money) Execution Houthi drones; swarming attack on Russian bases Current affairs Crypto: stealth addresses and ring signatures (Monero), zk-SNARKs (Zcash). Hamas raised >$130 m in crypto (Aug 2021-Jun 2023) [handout also: $41 m 2020-23; PIJ $93 m]. Bengaluru Café blast: crypto funded the IS module in Karnataka. INCB 2023: South Asia holds 39% of global opiate consumers."}, {"c": "38", "n": "Terrorism and Technology: Dark Web, Crypto, Drones", "id": "3-dark-web", "t": "3 · Dark Web", "x": "3 · Dark Web # Uses Internal comms · propaganda · recruitment/training · fundraising · weapons procurement (EuroGuns, AlphaBay) · drugs · AI/deepfakes Counter Technology: DARPA Memex; UK NCA decoy sites Enforcement: NTRO and NSA monitor Tor; regulator for platforms Cooperation: Tallinn Manual update, Five Eyes ; digital literacy; Tech Against Terrorism Counter-terror with technology Counter-narratives (US CSCC 2012); UN Travel Programme (2019) vs FTFs; AI border (EU ETIAS ); predictive models (RED-Alert, Moonshot); digital evidence; NATO DEXTER; national cyber agencies (NIS) Financial institutions Blockchain tracking; audit NGO accounts ; crypto exchange regulation; KYC / KYT Measure Who Christchurch Call 2019 France + New Zealand + firms GIFCT 2017 Facebook, Microsoft, Twitter, YouTube GCTF Forum (29/30 countries) Tech Against Terrorism UN CTED Aqaba Process Jordan Delhi Declaration (UNSC CTC) Guiding principles on drones, social media, crowdfunding Value addition Value addition: balance security with privacy and speech ; a global treaty on tech misuse; capacity in South Asian languages."}, {"c": "38", "n": "Terrorism and Technology: Dark Web, Crypto, Drones", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Al-Qaeda magazine? Inspire UN programme vs FTFs? Terrorist Travel Programme (2019) GIFCT founded? 2017"}, {"c": "39", "n": "Global Counter-Terror Architecture and India's Diplomacy", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words India wants a comprehensive convention (CCIT) ; talks stuck on definition . Key term In plain words CCIT Comprehensive Convention on International Terrorism, stalled over definition."}, {"c": "39", "n": "Global Counter-Terror Architecture and India's Diplomacy", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Body / resolution What it does UNSC 1267 (1999) Sanctions on Taliban, Al-Qaeda UNSC 1373 (2001) Post 9/11: criminalise financing; CTC 1540 (2004) No WMD to non-state actors 1624 (2005) Incitement, internet 2178 (2014) Foreign terrorist fighters 2462 (2019) Countering financing UN CT Strategy 2006 ; UNOCT 2017 Coordination FATF 1989 Standards on ML/TF GCTF 2011 ; GICNT 2006 Forum; nuclear terrorism (88 states) Regional frameworks SAARC conventions (1987, 2008) · ASEAN ARF (1994) · AU convention · EU strategy (2005), ECTC 2016 · SCO RATS (2004)"}, {"c": "39", "n": "Global Counter-Terror Architecture and India's Diplomacy", "id": "3-india-s-diplomacy", "t": "3 · India's Diplomacy", "x": "3 · India's Diplomacy # Evolution De-legitimisation of terrorism Root-cause approach (1970s-80s): 1976 NAM draft passed 86-8-24; A/RES/40/61 (1985) Comprehensive vs sectoral : Third World wanted comprehensive; US/EU sectoral Note CCIT — India has pushed since 1996 . Four tenets: universal definition · ban groups and shut camps · special laws for prosecution · extradition of cross-border terrorism . Stalled over definition (OIC: liberation movements; US: acts of state forces) and scope (state terrorism). Other steps FATF: India re-elected co-chair of Asia-Pacific Joint Group (2022) 2021 UNGA co-sponsorship of GCTS resolution; 2022 India-Russia Joint Action Plan; push to reform UN CTC ; capacity building (Afghanistan, Iraq, Syria) Quote \"Nathi Santi Paran Sukham\" and \"Ekam Sad Viprah Bahudha Vadanti\" — PM Modi on universal peace. Terrorism as an \"industry\" Hierarchy + franchise (AQAP, AQIM) · alliances (Boko Haram-ISIS) · recruitment · diversified funds (Hezbollah: Iran, drugs; Taliban: opium) · tech (drones, 2014 Sony hack) · branding ( Dabiq ) · impact (9/11, 26/11) · counter: USA PATRIOT Act, Global Coalition vs ISIS (80+)"}, {"c": "39", "n": "Global Counter-Terror Architecture and India's Diplomacy", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. CCIT pushed since? 1996 UNSC 1373 about? Financing; post 9/11 SCO RATS year? 2004"}, {"c": "40", "n": "Interpol, BharatPol, MLATs and International Policing", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words
