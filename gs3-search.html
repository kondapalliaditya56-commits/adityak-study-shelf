:root[data-theme="dark"]{--bg:#121816;--surface:#1A2320;--surface2:#212C29;--ink:#E6ECEA;--muted:#9CAAA6;--line:#34423E;--acc:#4FC3AE;--acc-ink:#0B1F1B;--acc-soft:#173A33;--saf:#F2A54E;--saf-soft:#3A2B14;--red:#F28B82;--red-soft:#3D1F1D;--blue:#7DB3F0;--blue-soft:#182B42;--good:#7FD08A;--good-soft:#1B3320;--hl:#5B4B12;--c0:#4FC3AE;--c1:#F2A54E;--c2:#7DB3F0;--c3:#D79AD7;--c4:#F28B82;--c5:#A9CF62;--c6:#E0C24D;--c7:#8DB8D4;color-scheme:dark}

.arr{height:20px;position:relative;flex:none}.arr:before{content:"";position:absolute;left:50%;top:0;bottom:6px;border-left:2px solid var(--muted)}.arr:after{content:"";position:absolute;left:calc(50% - 5px);bottom:0;border:5px solid transparent;border-top:7px solid var(--muted);border-bottom:0}

.mm-root{fill:var(--acc)}.mm-root-t{fill:var(--acc-ink);font:700 14px var(--sans)}

.mm-link.c0,.mm-leaf.c0{stroke:var(--c0)}.mm-link.c1,.mm-leaf.c1{stroke:var(--c1)}.mm-link.c2,.mm-leaf.c2{stroke:var(--c2)}.mm-link.c3,.mm-leaf.c3{stroke:var(--c3)}.mm-link.c4,.mm-leaf.c4{stroke:var(--c4)}.mm-link.c5,.mm-leaf.c5{stroke:var(--c5)}.mm-link.c6,.mm-leaf.c6{stroke:var(--c6)}.mm-link.c7,.mm-leaf.c7{stroke:var(--c7)}
:root:not([data-theme="dark"]) .mm-branch-t{fill:#fff}
.outline,.outline ul{list-style:none;padding-left:18px;margin:4px 0}.outline>li{padding-left:0}.outline summary{cursor:pointer;font:700 15px var(--sans)}

.ol-note{color:var(--muted);font-size:.9em}

.timeline:before{content:"";position:absolute;left:94px;top:0;bottom:0;border-left:2px solid var(--line)}
.tl{display:grid;grid-template-columns:86px 18px 1fr;gap:0 6px;margin:0 0 12px;align-items:start}

.lkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.link{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:15px/1.45 var(--sans)}.link p{margin:4px 0 0;color:var(--muted)}.lk-line{font-weight:700}
.recall{font:16px/1.55 var(--sans);padding-left:24px}.recall li{margin:6px 0}

.q .ex{margin-top:8px;color:var(--muted)}
.deck{margin:10px 0}
.fc{min-height:150px;background:var(--surface);border:2px solid var(--acc);border-radius:14px;padding:22px;display:flex;align-items:center;justify-content:center;text-align:center;font:18px/1.5 var(--serif);cursor:pointer;user-select:none}
.fc.back{background:var(--acc-soft)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.btn{font:600 14px var(--sans);padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:40px 0 20px}.pager a{display:block;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;text-decoration:none;color:var(--ink);font:600 15px var(--sans)}.pager a.nx{text-align:right}.pager small{display:block;color:var(--muted);font-weight:500;font-size:12px}

a.chcard:hover{border-color:var(--acc)}.chcard.pending{opacity:.5}
.chn{font:700 18px var(--mono);color:var(--acc);text-align:center}.cht b{font:700 16px var(--serif);display:block}.cht small{font:13px/1.4 var(--sans);color:var(--muted);display:block;margin-top:2px}

/* ---- reader app ---- */
:root{--zoom:1;--lh:1.65;--pw:780px}
:root[data-theme="sepia"]{--bg:#F4ECD8;--surface:#FBF5E6;--surface2:#EADFC4;--ink:#3B3022;--muted:#7A6A52;--line:#D8C9A6;--acc:#7A4A12;--acc-ink:#fff;--acc-soft:#EFDDB8;--saf:#A4470A;--saf-soft:#F6E2BE;--red:#9C2A1C;--red-soft:#F3D9CB;--blue:#2F5C8A;--blue-soft:#DDE6E4;--good:#3E6B2A;--good-soft:#DDE8C8;--hl:#F2D98A;color-scheme:light}
:root[data-font="sans"] body{font-family:var(--sans)}
:root[data-font="sans"] .notes p,:root[data-font="sans"] .notes li{font-family:var(--sans)}
.page{zoom:var(--zoom);max-width:var(--pw)}
.notes p,.notes li{line-height:var(--lh)}
.rbar{position:fixed;left:0;top:0;height:3px;width:0;background:var(--acc);z-index:40;transition:width .15s}
.aabtn{color:var(--ink);border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:5px 12px;font:700 14px var(--serif);cursor:pointer;flex:none}
.h2read{float:right;margin:2px 0 0 10px;font:600 12px var(--sans);border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer;min-height:30px}
.h2read[aria-pressed="true"]{background:var(--acc-soft);color:var(--acc);border-color:var(--acc)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;justify-content:center}
.dock button{font:600 14px var(--sans);min-height:44px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;padding:0 14px;cursor:pointer}
.dock .mid{flex:1;max-width:520px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock .mid b{color:var(--acc)}
body.has-dock .page{padding-bottom:110px}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheetin{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:82vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));font:15px/1.4 var(--sans)}
.sheetin h3{margin:0 0 10px;font:700 17px var(--sans)}
.srow{display:flex;align-items:center;gap:10px;margin:12px 0;flex-wrap:wrap}
.srow label{flex:0 0 92px;color:var(--muted);font-weight:600}
.srow .grp{display:flex;gap:6px;flex-wrap:wrap}
.srow button{font:600 14px var(--sans);min-height:42px;min-width:48px;padding:0 12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;cursor:pointer}
.srow button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.secl a{display:flex;gap:10px;align-items:center;padding:12px 6px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;min-height:44px}
.secl a .tk{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--acc-ink)}
.secl a.rd .tk{background:var(--acc);border-color:var(--acc)}
.secl a.cur{background:var(--acc-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:50;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;font:600 14px var(--sans);max-width:92vw;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.toast button{font:700 14px var(--sans);background:transparent;border:0;color:var(--bg);text-decoration:underline;cursor:pointer;min-height:36px}
body.focus .bar{display:none}body.focus .sidetoc{display:none}
figcaption.clamp{max-height:3.3em;overflow:hidden;position:relative;cursor:pointer}

gration (own mnemonic) SEEPS Money Laundering and Black Money Dirty money seeps everywhere: S ocial · E conomic · E nvironmental · P olitical · S ecurity (own mnemonic; headings in facult STAMP + CBT Money Laundering and Black Money S muggling · T ech evolution · A wareness lacking · M ultiple agencies · P redicate-offence law; then C onviction low · ** MONEY LAUNDER Money Laundering and Black Money (faculty) M onitoring transactions · O rganisational acceptance policy · N otifying suspicious transactions · E nforcement of KY VBFCU Money Laundering and Black Money \" V ery B ig F ish C atch U nwary\": Vienna and Basel (1988) → FATF (1989) → CoE (1990) → UN-GPML (1997) (own mnemonic) PEN-D Money Laundering and Black Money 2023 amendment: P EPs covered · b E neficial owner threshold 25% → 10% · N GOs/NPOs brought in (NGO Darpan) · D ue dilige P·M·L·A Money Laundering and Black Money (faculty) PMLA way forward: P rocedural reforms · M aintaining operational efficiency · L ist of scheduled offences (review) · **A* UNFAIR + CCW Money Laundering and Black Money Terror-finance special recs (9): U N instruments · N PO · F reeze assets · A lternative remittance · I nternational co-op · * SLIPS Money Laundering and Black Money Concerns in India's MER: S upervision gaps (DNFBPs, dealers in precious metals) · L egal/operational (28 convictions in 5 years; backl NOMS Terror Financing and Black Money Methods: N ew technology (crypto: IS-K asked Monero donations via Voice of Khorasan; digital assets, gaming, prepaid cards, dark web) · * BLACK Terror Financing and Black Money Way forward: B etter regulatory framework · L everage technology · A wareness · C ooperation among agencies · K YC enforcemen FAKE NEWS Social Media, Radicalisation and Fake News Faculty: F ormal definitions · A wareness (#SayNoToFakeNews) · K nowledge (Alt News, Boom) · E nhanced legal framework · N ew"}, {"c": "1", "n": "Cropping Patterns, Irrigation and Water-Use Efficiency", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words Wheat-paddy monoculture hurts soil and water. Fix with diversification, millets/pulses, micro-irrigation . Key term In plain words Monoculture One crop repeated on the same land. SRR Seed Replacement Rate."}, {"c": "1", "n": "Cropping Patterns, Irrigation and Water-Use Efficiency", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Note Monoculture = only one crop on a piece of land. Punjab case: wheat and paddy cover 84.6% of cropped area, crowding out pulses, maize, bajra, oilseeds, cotton. Issues with the system Pests and disease rise with repeated crops (less genetic diversity) Wheat and paddy do not fix nitrogen → soil nutrient depletion, more chemical fertiliser and pesticide Aquifer depletion: CGWB 2024 Punjab — 153 blocks: 115 over-exploited, 4 critical, 12 semi-critical, 22 safe Biodiversity loss; climate stress; paddy gives fewer man-days Why cropping patterns change Five factor groups: resource · technology · household · price · institutional/infrastructure Small farms: food/fodder self-sufficiency, size, investment limits; large farms: relative prices; better irrigated areas more market-driven Economic factors dominate with irrigation, infrastructure, rural markets, short-duration and drought-tolerant varieties Current affairs Economic Survey data: agri and allied ≈ 20% of national income, 46.1% of workforce. FY16-25 growth: fishing 8.8% > livestock 7.1% > crops 3.5% . Horticulture 362.08 MT > foodgrain 329.68 MT . Foodgrain 3,577.3 LMT (AY 2024-25, +254.3 LMT). India: largest dry-onion producer (~25%), 2nd in vegetables, fruits, potatoes. Yields below world in cereals, maize, soybean, pulses (groundnut exception). El Nino and La Nina (PYQ 2014) El Nino: 15 of 27 years hurt pulses; area -2 to -9%, output -6 to -30%; 2023-24 pulse imports +84% to 4.739 MT La Nina: 13 of 25 years gained; 8 still lost (excess/ill-timed rain) MP and Gujarat lead pulses (black soil rotations; short-duration varieties; high SRR) — NITI Aayog 2025"}, {"c": "1", "n": "Cropping Patterns, Irrigation and Water-Use Efficiency", "id": "3-irrigation", "t": "3 · Irrigation", "x": "3 · Irrigation # Why irrigation Water certainty, nutrient uptake, resilience, diversification, multiple cropping Steps PMKSY: coordinated farm-level investment, assured irrigation, on-farm efficiency, precision irrigation, aquifer recharge, private investment Per Drop More Crop: 55% aid to small/marginal, 45% others Gross irrigated share 41.7% (2001-02) → 55.8% (2022-23) Challenges and way forward Disparity: < 15% millets, ~ 26% pulses, ~ 67% rice Priority: lagging states and crops; rejuvenate water bodies and surface storage (best returns); reuse treated wastewater peri-urban Value addition PYQ hook (WUE 2016): water-use efficiency = crop per drop; micro-irrigation (drip, sprinkler) raises it by cutting evaporation and conveyance losses; link to PMKSY-PDMC and 2021 water crisis answer."}, {"c": "1", "n": "Cropping Patterns, Irrigation and Water-Use Efficiency", "id": "4-diversification-success", "t": "4 · Diversification Success", "x": "4 · Diversification Success # Current affairs Beed (Maharashtra) experiment: Krishikul / Global Vikas Trust — farmers moved from soybean/cotton to fruit (papaya, custard apple, sweet lime, guava, pomegranate, mulberry, banana). TISS 2024: per-acre income ~₹38,700 → ~₹3.93 lakh (10X). Value addition Crop Diversification Programme (RKVY) promotes alternate crops and legumes to restore fertility."}, {"c": "1", "n": "Cropping Patterns, Irrigation and Water-Use Efficiency", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Punjab wheat+paddy share? 84.6% Per Drop More Crop aid? 55% small/marginal, 45% others Irrigated share 2022-23? 55.8% N:P:K recommended? ~4:2:1"}, {"c": "2", "n": "Pulses, Edible Oils, NFSNM and Krishonnati", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words Missions target pulses and oilseeds to cut imports. NFSNM = food + nutrition. Key term In plain words Hidden hunger Micronutrient deficiency despite adequate calories."}, {"c": "2", "n": "Pulses, Edible Oils, NFSNM and Krishonnati", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Note Krishonnati Yojana = umbrella of 8 schemes: MIDH · NFSNM · SAME · ISAM · Digital Agriculture Mission · NMEO-OS · NMEO-OP · MOVCDNER . NFSNM (renamed FY25 from NFSM) Shift from calorie to food + nutrition security ; crop diversification; pulses and millets ( Shree Anna ) tackle hidden hunger ; climate-resilient dryland crops Edible oils Import dependence 63.2% (2015-16) → 56.25% (2023-24) ; import 15.66 MT NMEO-OP: 6.5 lakh ha by 2025-26 (NE focus); Viability Price for FFB; planting aid ₹12,000 → ₹29,000/ha NMEO-OS: 600+ value-chain clusters; +40 lakh ha on rice/potato fallows; SATHI 5-year seed plan; 65 seed hubs; 432 ICAR varieties; Krishi Mapper; Krishi Sakhis Import duty on crude oil raised 5.5% → 16.5%; PM-AASHA procurement; target 70 MT by 2030-31 Mission for Atmanirbharta in Pulses Interventions Productivity HYV, pest-resistant, climate-resilient varieties; multi-location trials Seed system 5-year plans; ICAR breeder seed; SATHI traceability; free seed kits Area expansion Rice fallows; intercropping Procurement Assured MSP purchase of tur, urad, masoor via NAFED/NCCF (PSS/PM-AASHA) Value chain Storage, grading, processing Convergence Soil health, mechanisation, plant protection Value addition Target: self-sufficiency in pulses by Dec 2027 ; ≥ 20% of mission funds for women farmers. Current affairs PM Dhan-Dhaanya Krishi Yojana: 100 low-productivity districts; ₹24,000 cr by convergence of 36 schemes ; modelled on Aspirational Districts; 117 indicators tracked monthly; Agri universities as technical partners. Horticulture MIDH · Clean Plant Programme · Horticulture Cluster Development Programme"}, {"c": "2", "n": "Pulses, Edible Oils, NFSNM and Krishonnati", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Edible oil import dependence 2023-24? 56.25% PMDDKY outlay? ₹24,000 cr Pulses self-sufficiency target? Dec 2027"}, {"c": "3", "n": "Inputs and Support: Seeds, Soil, Pesticides, Credit, Machines, Extension", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words Good yields need seeds, soil balance, credit, machines, advice . Key term In plain words AgriStack Digital public infrastructure for farmers. FPO Farmer Producer Organisation."}, {"c": "3", "n": "Inputs and Support: Seeds, Soil, Pesticides, Credit, Machines, Extension", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Seeds 6.85 lakh Seed Villages (SMSP); National Mission on High-Yielding Seeds (Budget 2025-26, 100+ varieties); MGR 100 (CO 52) rice success Challenge: research needs; monoculture risk; farmers use old/saved seeds Value addition Draft Seeds Bill 2025 replaces Seeds Act 1966: quality, curbs spurious seeds, liberalises imports, decriminalises minor offences; farmers may grow, save, exchange, sell farm seeds (restriction only on branded sale); minimum germination, genetic/physical purity, seed health; registration of processing units; Registrar and National Register; Central Accreditation; testing labs; inspectors under BNSS . Align with PPV&FR Act 2001, CBD, ITPGRFA . Soil health Falling organic carbon; N:P:K ratio far from 4:2:1 because urea is cheap Tools: Soil Health Card ( 25.55 crore ), NSMP, NOSUIS, nutrient-based pricing, neem-coated urea, Aadhaar-linked PoS, iFMS — all supply-side Economic Survey proposal: raise urea price modestly, give per-acre income support (zone/crop indexed) via PM-KISAN ; pilot first (tenancy issue) Value addition Draft Pesticides Management Bill 2025 replaces Insecticides Act 1968: broad pesticide definition (incl. growth regulators, defoliants), mandatory lab accreditation, digital registration, higher penalties on spurious pesticides, Central Pesticides Board , promotion of biological pesticides. Credit Non-institutional credit 90% (1950) → 23.4% (2021-22) ; Lead Bank Scheme, PSL KCC + MISS: 7% loan, 3% prompt-repayment incentive; Kisan Rin Portal Disparity: Central region 35.4% of PM-KISAN but 14.7% of MISS Mechanisation SMAM ; 25,689 Custom Hiring Centres (2014-15 to 2025-26) Barriers: fragmented holdings, labour shortage; fix via FPOs, PACS, SHGs Extension SMAE , ATMA , DAESI (48-week dealer course; 1.07 lakh dealers), Kisan Call Centres (22 languages), KVKs as district knowledge centres; digital advisories; FPOs Infrastructure and marketing AMI (74,000+ projects) · AIF ₹1 lakh cr · e-NAM 1,522 mandis, 1.79 cr farmers · 10,000 FPOs · AHIDF, PMMSY, FIDF · Digital Agriculture Mission / AgriStack Gaps: cold chains, post-harvest logistics, narrow export basket"}, {"c": "3", "n": "Inputs and Support: Seeds, Soil, Pesticides, Credit, Machines, Extension", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Seeds Act replaced? 1966 KCC loan rate? 7% with 3% incentive CHCs created? 25,689"}, {"c": "4", "n": "Storage, Transport and Marketing of Agro-Produce", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words Reform = e-markets + FPOs + storage + cold chain . Key term In plain words e-NWR Electronic negotiable warehouse receipt."}, {"c": "4", "n": "Storage, Transport and Marketing of Agro-Produce", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Need Crowd in private investment · price discovery · competitive buyers · value addition · cut post-harvest losses (crops, livestock, fish) Steps AMI credit-linked subsidy (74,000+ projects) · AIF ₹1 lakh cr · e-NAM · 10,000 FPOs · AHIDF, PMMSY, FIDF · ISRO Vessel Communication and Support System · AgriStack Challenges Processing must grow faster to widen export basket; cold chain and logistics gaps , esp. inland and remote regions Value addition Post-harvest distress sale eased by Credit Guarantee Scheme for Electronic Negotiable Warehouse Receipt (e-NWR) pledge finance . Value addition PYQ lens: APMC reform, e-commerce in supply chain, small processing units, supermarkets and intermediaries, upstream/downstream bottlenecks, contract farming and land leasing (2015), land reforms (2016-24)."}, {"c": "4", "n": "Storage, Transport and Marketing of Agro-Produce", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. AIF size? ₹1 lakh cr e-NAM mandis? 1,522"}, {"c": "5", "n": "Economics of Animal Rearing, Fisheries and Fodder", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words Allied sectors lead growth ; fodder is the bottleneck. Key term In plain words Pink revolution Meat/prawn production growth (PYQ 2013)."}, {"c": "5", "n": "Economics of Animal Rearing, Fisheries and Fodder", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Current affairs Fodder gap: feed and fodder > 70% of milk production cost; fodder only 4.61% of gross cropped area; gaps: green fodder 11-32%, dry 23%, concentrates 28-40%. Steps FMD control: ~125 crore vaccinations since 2020; digital animal ID AI: 76.23 m (2017-18) → 88.32 m (2024-25); 126 districts at 50% coverage PM-MKSSY fisheries; Nucleus Breeding Centres (shrimp); 28 lakh on National Fisheries Digital Platform; PMMSY, FIDF, AHIDF Way forward Feed-fodder security; better aquaculture genetics; formalise fisheries; aquatic health, biosecurity, quality standards"}, {"c": "5", "n": "Economics of Animal Rearing, Fisheries and Fodder", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Fodder share of cost? >70% of milk cost AI inseminations 2024-25? 88.32 m"}, {"c": "6", "n": "MSP, Crop Insurance, Procurement and Food Management", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words MSP works where procurement works. Reform: diversify, income support, parametric insurance, market development . Key term In plain words Parametric insurance Payout triggered by a weather index rather than farm-level loss. PSS Price Support Scheme."}, {"c": "6", "n": "MSP, Crop Insurance, Procurement and Food Management", "id": "2-before-production-price", "t": "2 · Before Production: Price", "x": "2 · Before Production: Price # Current affairs MSP: 22 mandated crops; since Budget 2018-19 at least 50% over weighted average cost (A2+FL). Wheat MSP ₹2,585/qtl ≈ 109% above A2+FL. PM-KISAN: ₹4.09 lakh cr over 21 instalments; PM-Kisan Maandhan 24.92 lakh enrolled (Dec 2025). Problems Cost data lag 2-3 years (input shocks, e.g. Hormuz 2026) Wheat gets stronger support than other rabi crops MSP works only where procurement works (wheat, paddy); weak for pulses, oilseeds, millets Measures Update cost data (index fuel, fertiliser, labour) · align MSP with diversification · income support (PM-KISAN, per-hectare) · link price to procurement, offtake, processing"}, {"c": "6", "n": "MSP, Crop Insurance, Procurement and Food Management", "id": "3-during-production-pmfby", "t": "3 · During Production: Pmfby", "x": "3 · During Production: Pmfby # Current affairs PMFBY: 4.19 crore farmers insured (2024-25, +32% over 2022-23); 86 crore applications; ₹1.90 lakh cr claims since 2016-17. Tools: DigiClaim, NCIP, YES-TECH, WINDS . From Kharif 2025 States must open escrow for premium share; from Kharif 2024 delayed claims attract 12% penalty . Problems Farm-level loss missed (Palghar farmer ₹2.30) · trust deficit · voluntary enrolment → adverse selection · fiscal stress (Bihar, Jharkhand, WB opted out) · tenants excluded Measures Farmer-sensitive tech + local verification · timely settlement · link insurer pay to claim performance · parametric insurance · keep insurance as real risk cover"}, {"c": "6", "n": "MSP, Crop Insurance, Procurement and Food Management", "id": "4-after-production-procurement", "t": "4 · After Production: Procurement", "x": "4 · After Production: Procurement # Problems High buffer stock and carrying cost; public money locked; imports of edible oil (56%) and pulses persist; rice-wheat bias Measures Crop-shift incentives (per-acre/quintal) starting in eastern and central India · link with national priorities (maize, oilseeds for ethanol/feed) · Centre-State partnership · price-deficiency payments , bonuses, assured offtake · phased, flexible buffer norms"}, {"c": "6", "n": "MSP, Crop Insurance, Procurement and Food Management", "id": "5-food-management-pds", "t": "5 · Food Management (PDS)", "x": "5 · Food Management (PDS) # Problem Measure Basic security NFSA 2013 : ~67% of population Crisis PMGKAY free grain (Centre funded) Migrants ONORC : all 36 States/UTs, ~80 crore Ghost beneficiaries Aadhaar seeding: 99.8% cards, 98.9% beneficiaries Leakage ePoS at 99.6% of 5.43 lakh FPSs; >98% digital Targeting Inter-database checks (CBDT, GSTN, PM-KISAN) flagged 8.51 crore; 2.12 crore removed Choice DBT pilots: ₹267.6 cr (FY24) Logistics Anna Chakra ; VLTS GPS tracking Nutrition Fortified food Distress sale e-NWR pledge finance Value addition PYQ lens: subsidies and WTO distortions (2013, 2023, 2026), DBT (2015), buffer stocks (2024), NFSA (2013, 2021), PDS reforms (2019, 2022). For WTO subsidy parts add static material (not in the handout)."}, {"c": "6", "n": "MSP, Crop Insurance, Procurement and Food Management", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. MSP formula? ≥50% over cost ONORC reach? All 36 States/UTs PMFBY late claim penalty? 12% (from Kharif 2024)"}, {"c": "7", "n": "Genome-Edited Rice, Swaminathan and Seed Sovereignty", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words Genome-edited ≠ GM ( no foreign DNA ). Key term In plain words SDN Site-Directed Nuclease type of genome editing."}, {"c": "7", "n": "Genome-Edited Rice, Swaminathan and Seed Sovereignty", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Current affairs Genome-edited rice (ICAR): DRR Dhan 100 Kamala (from Samba Mahsuri; CKX2 gene → more grains/panicle; ~20 days earlier; +19% yield; less water and methane) and Pusa DST Rice 1 (from MTU 1010; drought, salinity, alkalinity tolerance; +9.66-30.4% in saline/alkaline soils). Made with CRISPR-Cas SDN-1/SDN-2 ; no foreign DNA, so not GM (SDN-3 not used). Significance Concerns Yield without more area Biosafety: Coalition for a GM-Free India says edits not always precise; SDN-1/2 deregulation challenged Climate resilience, water, methane IPR ownership and seed sovereignty Biotech leadership Labelling; loss of rice genetic diversity Way forward Transparent trials and post-release monitoring · crop-specific guidelines · affordable public seed · conserve indigenous varieties (e.g. Pokkali saline-tolerant paddy) · local training"}, {"c": "7", "n": "Genome-Edited Rice, Swaminathan and Seed Sovereignty", "id": "3-m-s-swaminathan", "t": "3 · M.s. Swaminathan", "x": "3 · M.s. Swaminathan # Contributions Green Revolution: mid-1960s import of 18,000 t Mexican dwarf wheat seed; with Borlaug : Kalyan Sona, Sonalika; wheat 12 MT (1965) → 55+ MT (1970s) Farmer-first science ; institutions (CRRI, IARI, IRRI), MSSRF Chennai National Commission on Farmers : MSP = cost + 50% Legacy Food → nutrition security · Evergreen Revolution (no cost to soil, water, biodiversity) · farmer income debate · mangroves and coastal protection · pro-poor, pro-women, pro-nature Value addition Book: The Man Who Fed India by Priyambada Jayakumar."}, {"c": "7", "n": "Genome-Edited Rice, Swaminathan and Seed Sovereignty", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. SDN-3 used? No — so not GM Kamala yield gain? 19%"}, {"c": "8", "n": "Role of Women in Agriculture", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words Women farm, but do not own land ; fix with titles, tools and collectives. Key term In plain words Krishi Sakhi Trained women para-extension worker."}, {"c": "8", "n": "Role of Women in Agriculture", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Current affairs UNGA declared 2026 International Year of the Woman Farmer . ~80% of rural women in agri/allied; women's share 57% (2017-18) → 64.4% (2023-24) ; but own only 13-14% of holdings (NFHS 8.3%); ~half are unpaid family workers; earn 20-30% less. Programmes MKSP · DAY-NRLM · Krishi Sakhis · Namo Drone Didi · SMAM · AIF · ISAM/AMI (higher subsidy) · PM-KISAN (~25% women) · women-led FPOs · ICAR-CIWA · pulses mission (≥20%) · NBHM Roles Production · allied sectors · nutrition (kitchen gardens; Odisha Shree Anna) · seed conservation (Ao and Angami women millet festivals) · climate resilience (WCRF model) · rural enterprise (Kudumbashree, SEWA) Challenges No land titles/recognition · unpaid and low pay · weak decision power · tools not designed for women · market barriers · climate burden Way forward Recognise women as farmers (records, IDs) · joint titles · drudgery-reducing tech and CHCs · women-led FPOs · BHASHINI voice advisory · climate-smart training · more Krishi/Pashu Sakhis"}, {"c": "8", "n": "Role of Women in Agriculture", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Women own holdings? 13-14% Women share of agri workforce 2023-24? 64.4%"}, {"c": "9", "n": "Cotton: Productivity Crisis and Policy Dilemma", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words Cotton problem = productivity, technology, policy . Key term In plain words CCI Cotton Corporation of India."}, {"c": "9", "n": "Cotton: Productivity Crisis and Policy Dilemma", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Current affairs 2nd-largest producer (after China); ~ 60 lakh farmers; value chain employs 4.5 crore . Production 13.6 m bales (2002-03) → 39.8 m (2013-14) with Bt cotton, then stagnated; yield ~ 441-448 kg/ha (20+ countries higher). Arrivals ~292 lakh bales vs need ~337 lakh. 11% import duty temporarily removed. Issues Old Bt technology, pink bollworm · policy uncertainty (price controls, royalty caps; Bollgard II RRF and Bollgard III not released) · farmer distress · industry pressure Stakeholder Impact of duty removal Textiles Cheaper, available cotton Farmers Lower prices; may quit cotton Economy Risk of import dependence Way forward Flexible duty · CCI procurement on price fall · revive seed innovation with stable approvals · Cotton Productivity Mission · balance value chain · rainfed varieties"}, {"c": "9", "n": "Cotton: Productivity Crisis and Policy Dilemma", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Cotton yield? 441-448 kg/ha Import duty removed? 11%"}, {"c": "10", "n": "Biofuels and Ethanol Blending (E20 and beyond)", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words Biofuels: energy security + farm income , but watch food vs fuel . Key term In plain words Drop-in fuel Biofuel usable in existing engines without modification."}, {"c": "10", "n": "Biofuels and Ethanol Blending (E20 and beyond)", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Current affairs E20 achieved five years early (target 2030, advanced to ESY 2025-26 by 2022 amendment). E85 launched at 48 outlets on World Environment Day 2026 (500 by Dec 2026; ~5,000 by Dec 2027); E100 rules drafted. BIS IS 19850:2026 for E22/E25/E27/E30. SAF targets: 1% (2027), 2% (2028), 5% (2030) for international flights. Generations 1G: food crops (sugar, wheat); fuel vs food → 2G: waste, residues, non-food biomass → 3G: engineered crops, algae → 4G: biomass + carbon capture → carbon negative Benefits Economic: import substitution, rural value chains, farmer income, residue use Social: jobs; less stubble burning Environment: E20 cuts CO ~50% (2-wheelers), ~30% (4-wheelers); HC ~20%; circular economy Strategic: energy security, oil-shock resilience, Global Biofuels Alliance, bridge to EV and hydrogen Challenges Food vs fuel: maize ethanol price grew 11.7% CAGR (FY22-25); maize area +6.68%, pulses fell, oilseeds +1.7% — energy vs food Atmanirbharta trade-off Water: sugarcane + paddy ≈ 70% of irrigation; sugar price rise NOx not uniformly lower; carbonyls; mileage loss; older vehicles; engine tuning and ethanol-resistant parts; storage/blending logistics; 2G scaling; chokepoints (Hormuz) Steps National Policy on Biofuels 2018 (replaced 2009; 20% ethanol, 5% biodiesel); Ethanol Blending Programme 2003 ; feedstock diversification; GST 5%; PM JI-VAN (2G); SATAT (CBG); National Bioenergy Programme ; RUCO ; SAF push; Global Biofuels Alliance Value addition Brazil: Proalcool (1975) → E27 via R&D, subsidies, tax breaks and flex-fuel vehicles. New fuels: SAF (CORSIA needs ≥10% lifecycle cut), iso-butanol (higher energy, less water absorption; Tata 2% diesel trial), drop-in fuels, biohydrogen. Way forward Shift to 2G · lifecycle assessment · keep E10 protection-grade · uniform quality and labelling · recalibrate targets/feedstock incentives · use biofuels as strategic buffer"}, {"c": "10", "n": "Biofuels and Ethanol Blending (E20 and beyond)", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. E20 target year (original)? 2030 Biofuel policy year? 2018 SAF 2030 target? 5%"}, {"c": "11", "n": "Disaster Management: Concepts, Institutions and DM Act 2005", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words Disaster = hazard + vulnerability − coping capacity . India: reactive → proactive ; DM Act 2005, NDMA, NDRF . Key term In plain words Hazard Potential source of harm. Resilience Ability to absorb, adapt and recover from a disaster."}, {"c": "11", "n": "Disaster Management: Concepts, Institutions and DM Act 2005", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Note Disaster = serious disruption of a community causing widespread human, material, economic or environmental loss that exceeds its own coping capacity . Hazard = potential source of harm (not certain). Vulnerability = conditions that raise susceptibility to harm. Exposure = assets in hazard-prone areas. Note Disaster = Hazard × Vulnerability ÷ Capacity to cope · Risk = Hazard × Exposure × Vulnerability · Hazard groups: geophysical, hydrological, climatological, meteorological, biological. Types of vulnerability (PYQ 2019) Physical (wooden houses) Economic (low ability to cope) Social (vulnerable sections) Environmental (loss of wetlands) Attitudinal (community attitudes) DM and its goals UN: systematic use of administrative decisions, organisation and skills to lessen hazard impact — before, during, after Goals: reduce losses , ensure prompt assistance , achieve rapid and effective recovery Disaster cycle Mitigation / prevention → Preparedness: prediction and early warning → DISASTER IMPACT → Response: impact assessment, relief → Recovery: reconstruct Value addition DM Act 2005 covers: prevention; mitigation; capacity-building; preparedness; prompt response; severity assessment; evacuation, rescue, relief; rehabilitation and reconstruction."}, {"c": "11", "n": "Disaster Management: Concepts, Institutions and DM Act 2005", "id": "3-india-s-evolution", "t": "3 · India's Evolution", "x": "3 · India's Evolution # Shift Pre-independence: relief, reactive → Post-1947: relief commissioners → 1990s: DM cell in Agriculture Ministry; IDNDR → 2000s: High Powered Committee after Odisha cyclone, Bhuj, etc. → DM Act 2005: proactive, multi-hazard Institutions CCS → NCMC (national crisis management; command, control, coordination; CBRN emergencies) NDMA — policies, plans, guidelines; chaired by PM NEC — assists NDMA (Home Secretary leads) NDRF — assists states; NIDM — training, capacity building State: SDMA → DDMA → local bodies NDRF record Successes: Nepal earthquake 2015 , Chennai floods 2015 , Cyclone Fani 2019 — \"golden hours\", advanced preparedness Challenge: CBRN emergencies Issues with the Act Financial devolution to State authorities weak Centralisation Definition of disaster not expanded (no objective severity threshold) Response funds do not cover prevention, mitigation, risk reduction \"Visible goals\" (relief) outrank \"foundational goals\" (prevention, training, awareness) Plans and policy NDM Policy 2009 (framework for all phases) · NDMP 2019 (dynamic document, aligned to Sendai, aims at risk understanding, DRR investment, governance, Build Back Better )"}, {"c": "11", "n": "Disaster Management: Concepts, Institutions and DM Act 2005", "id": "4-pris-and-community-2026", "t": "4 · PRIs AND COMMUNITY (2026", "x": "4 · PRIs AND COMMUNITY (2026 # PYQs Current affairs National Project for Strengthening Community-Based DRR in PRIs (MoPR + NDMA): ₹507.37 cr ; 20 States, 81 hazard-prone districts, 20 GPs per district in clusters; 20 Model GPs (₹5 cr per State = ₹100 cr) for flash floods, landslides, coastal erosion, cyclones, drought, earthquakes. Village DM plans integrated into GPDPs ; builds on DMP-MoPR 2022. Value addition Community participation answer: first responders; local knowledge; cyclone shelters and early warning dissemination; challenges — low awareness, resource gap, top-down plans, gender and equity gaps; measures — training, village plans in GPDP, SHGs, volunteers (Aapda Mitra), local-language alerts. Value addition PYQ map: 2013 vulnerability/risk assessment · 2014 drought, El Niño/La Niña · 2015 earthquake · 2016 urban floods, cloudburst · 2017 tsunami · 2018, 2024 Sendai/DRR · 2019, 2021 landslides · 2020 proactive measures · 2022 cloudburst, coastal erosion · 2023 dam failure · 2024 urban floods · 2025 seawater intrusion · 2026 infrastructure vs DRR; community participation."}, {"c": "11", "n": "Disaster Management: Concepts, Institutions and DM Act 2005", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Risk formula? Hazard × Exposure × Vulnerability NDMA chair? Prime Minister NDM Plan year? 2019 PRI project outlay? ₹507.37 cr"}, {"c": "12", "n": "Global Frameworks and DRR Financing", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words Yokohama → Hyogo → Sendai moved from relief to risk reduction . India funds through SDRMF/NDRMF 80:20 . Key term In plain words PDNA Post-Disaster Needs Assessment. IMCT Inter-Ministerial Central Team."}, {"c": "12", "n": "Global Frameworks and DRR Financing", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Evolution 1972 UN disaster relief office → 1990 IDNDR → 1994 Yokohama Strategy → 2005 Hyogo Framework (Kobe) → 2015 Sendai Framework (2015-30) Hyogo → Sendai Hyogo successes: reduced mortality, cost-effectiveness of DRR, a global platform, first plan from all sectors Challenges: disasters still take a heavy toll; economic losses; need for a more comprehensive framework → Sendai Sendai shift: from managing disasters to managing risk (general knowledge: 4 priorities, 7 targets — verify) Note Three post-2015 frameworks are coherent: Sendai · Paris Agreement · SDGs . India's 10-Point Agenda : mainstream DRR in development; risk coverage for all; women's leadership ; global risk mapping; technology ; university network; social media and mobiles ; local capacity; learn after every disaster; coherent international response. Other mechanisms CDRI (India-led, now ~40 countries) · Suva Expert Dialogue on Loss and Damage · Loss and Damage Fund · Global Platform for DRR reviews Sendai · EW4All (WMO + UNDRR, universal early warning by end-2027) · ARISE India (CII, FICCI) · Nature-based solutions (Mula-Mutha Pune)"}, {"c": "12", "n": "Global Frameworks and DRR Financing", "id": "3-financing-in-india", "t": "3 · Financing in India", "x": "3 · Financing in India # Current affairs 15th FC: created SDRMF and NDRMF ; split 80% response funds (SDRF/NDRF) and 20% mitigation funds . Within 80%: 40% response and relief · 30% recovery and reconstruction (₹20,539 cr NDRF; ₹48,046 cr SDRF; needs PDNA) · 10% preparedness . SDRF contribution 75:25 , 90:10 for NE and Himalayan States. Challenges Outdated relief norms (₹4 lakh for life; ₹1.2 lakh full house loss) Rigid spending (relief only) No objective classification of severe disaster Procedural delays : State memorandum → IMCT → HLC Way forward Update norms · Disaster Risk / Vulnerability Index triggers · drone surveys, digital assessment, PFMS tracking · PPPs, targeted funds, tax incentives Current affairs UNDRR GAR 2025 \"Resilience Pays\": DRR is investment; disaster costs > $2.3 trn/yr including cascading; direct costs rose from ~$70-80 bn/yr (1970-2000) to ~$180-200 bn/yr (2001-20)."}, {"c": "12", "n": "Global Frameworks and DRR Financing", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Sendai period? 2015-2030 Response vs mitigation split? 80:20 CDRI launched by? India"}, {"c": "13", "n": "Space Technology and Cell Broadcast Alerts in DM", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words Space gives data, CBS gives last-mile alerts. Key term In plain words CAP Common Alerting Protocol recommended by ITU."}, {"c": "13", "n": "Space Technology and Cell Broadcast Alerts in DM", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Component Use and example Risk mapping Hazard zonation; NRSC Landslide Atlas 2023 ; Flood Hazard Atlas (Assam, Bihar) Early warning INSAT-3D / 3DR for IMD forecasting Monitoring Cyclone Dana 2024 tracking; forest fire alerts (FSI, MODIS/VIIRS) Response planning Bhuvan portal Communication Satellite links; National Cyclone Risk Mitigation Project dissemination Navigation / SAR Track relief teams and fishing boats Damage assessment RISAT for Wayanad landslide extent; insurance and compensation International NISAR maps land and ice every 12 days Value addition Conclusion line: space technology moves DM from relief-centric to risk-informed, anticipatory governance ; integrate with community action."}, {"c": "13", "n": "Space Technology and Cell Broadcast Alerts in DM", "id": "3-cell-broadcast-system", "t": "3 · Cell Broadcast System", "x": "3 · Cell Broadcast System # Note CBS — DoT + NDMA; indigenous, built by C-DOT . Sends alerts to all mobile devices in a defined area at once , without straining networks (unlike SMS). Upgrades SACHET (CAP standard, SMS, also C-DOT). Why useful Near real-time · works on almost all handsets · no personal data · no app or subscription · multilingual · distinct tone even on silent · message stays until acknowledged"}, {"c": "13", "n": "Space Technology and Cell Broadcast Alerts in DM", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. CBS built by? C-DOT Alert standard in SACHET? Common Alerting Protocol"}, {"c": "14", "n": "Elements of National Security", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words National security covers 13 elements , not only the army. Economic, energy, cyber, health, food, water and disaster security are part of it. Key term In plain words Strategic autonomy Freedom to take defence and foreign-policy decisions without dependence on another power. Economic coercion Using trade, sanctions or supply cut-offs to pressure a country."}, {"c": "14", "n": "Elements of National Security", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # The big picture (my grouping to remember 13 elements) NATIONAL SECURITY : Military · Economic & Energy · Human (health, food, disaster) · Digital (cyber, information) · Political & ethnic · Resource & environment Element What it means Detail to quote Military Protect from external military threats; manage physical threats Invasion, terrorism, cyber attacks · border and coastal security Economic National wealth, economic freedom of state and citizens Supply-chain resilience · critical infrastructure · financial stability · critical minerals · resilience vs economic coercion Energy Uninterrupted supply of energy Security of international and energy assets Environmental Climate change; pollution Internal displacement, warming war, migration · pollution is transnational Ethnic Avoid sectional conflict Maintain national integration , promote harmony Cyber Protect digital infrastructure Develop cyber offence and defence capacity Health Disease surveillance, early warning Rapid response and emergency preparedness Information Citizen's right to privacy; data as public good DPDP Act 2023 and DPDP Rules 2025 ; protect information that affects national security Resource Water conflicts Internal: Cauvery · External: Indus water dispute Political Sovereignty, stability of government Honour human rights of citizens by the state Geostrategic Military co-operation; strategic autonomy Defence purchase · training Food Address nutritional poverty Measures to avoid starvation Disaster Mitigation and quick response Value addition Answer hook: \"Security is multi-dimensional — a failure in food, water or data can become a failure of the state.\" Use this opener for any internal-security question."}, {"c": "14", "n": "Elements of National Security", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Name 5 non-military elements Economic, energy, environmental, cyber, health, information, resource, food... Internal vs external water dispute? Cauvery vs Indus Data laws under information security? DPDP Act 2023 + Rules 2025"}, {"c": "15", "n": "National Security Doctrine", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words India has a security strategy in practice but no public National Security Strategy . The case for one: new domains, proxy wars, blurred internal-external threats, and theaterisation. Key term In plain words Grey-zone warfare Hostile actions short of open war, e.g. cyber, proxies, disinformation. Theaterisation Merging army, navy, air force into joint regional commands."}, {"c": "15", "n": "National Security Doctrine", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Note National Security Doctrine = a set of basic principles , based on the core interests of the State, shaping how different elements of national power protect and further the Republic's interests; a concise summary of strategic vision and objectives. It identifies missions and principles for the armed forces, diplomatic and intelligence communities . Quote \"The new frontiers of war — fourth-generation warfare — is civil society .\" — Ajit Doval Quote \"Half-done reforms create new vulnerabilities without solving old ones. You cannot cross a chasm in two leaps.\" — Shivshankar Menon (Bipin Rawat's reforms incomplete) Current affairs In the news: India still debates a public, comprehensive National Security Strategy ; meanwhile elements are codified through domain-specific doctrines (counter-terrorism, cyberspace, multi-domain operations)."}, {"c": "15", "n": "National Security Doctrine", "id": "3-need-for-a-doctrine", "t": "3 · Need for a Doctrine", "x": "3 · Need for a Doctrine # New domains of warfare Complex threats — traditional + non-traditional (cyber, narco-terror, eco-terror) Technology expands the battlefield and nullifies traditional advantage Grey-zone warfare — ambiguous space between peace and war Digital age reshapes battlespace; proxy wars rise Recommended by committees Kargil Review Committee — integrate security; GoM + 4 task forces, recommendations not implemented Naresh Chandra Task Force 2011 — doctrine-level national security strategy Before theaterisation Gen. M.M. Naravane : theaterisation without an NSS is putting the cart before the horse Clarity and integration Efforts on military, paramilitary, intelligence are scattered — a document gives foresight Internal and external threats blur : 2.5-front war (China + Pakistan + internal) — Gen. Bipin Rawat Galwan 2020 : a failure in managing intelligence, not only in gathering it Practised response Doctrine = algorithm for policymakers, not ad hoc; e.g. IC-814 hijack confusion Enhances Comprehensive National Power Changing world US-China/Russia rivalry and proxy wars Afghanistan again epicentre of terror after US exit; China keeps links with jihadi elements Pak-China axis ; Hamas-Israel war energises jihadi groups"}, {"c": "15", "n": "National Security Doctrine", "id": "4-global-examples", "t": "4 · Global Examples", "x": "4 · Global Examples # Country Document USA, UK, Russia Regularly updated National Security Strategy China Comprehensive National Security strategy tied to governance Pakistan National Security Policy 2022-2026"}, {"c": "15", "n": "National Security Doctrine", "id": "5-what-will-it-contain", "t": "5 · What Will It Contain?", "x": "5 · What Will It Contain? # Contents National interests and values → translated into goals Strategic culture and diplomacy : amicable solutions first, right to use force; expand diplomatic cadre Communicate objectives and redlines (deterrence). E.g. if Pakistan had known Kashmir attack = riposte to Lahore, 1965 avoided Periodic updates"}, {"c": "15", "n": "National Security Doctrine", "id": "6-why-not-yet-challenges", "t": "6 · Why Not Yet? — Challenges", "x": "6 · Why Not Yet? — Challenges # What has not been done Only political direction: Raksha Mantri's Operational Directive 2009 (Gen. N.C. Vij) — dated Political hesitation — Menon: 3 attempts, accountability fear No whole-of-government effort Deliberate non-disclosure — strategic ambiguity Challenges in framing Poor civil-military relations : no joint leadership; chiefs have operational autonomy but little policy say Strategic restraint — Cohen & Das Gupta: India rejected colonisers' instruments Divergent goals (Walter Ladwig): Army short wars with tech; Navy blue water + nuclear subs; Air Force reach Gulf to Malacca → need joint war-fighting doctrine Note Counter-view: CDS Gen. Anil Chauhan — no written NSS ≠ no strategy; Art. 370 revocation, Uri and Balakot show it exists. Doval Doctrine (2014) = \"double squeeze\" strategy. Note Conclusion: Competition + tech domains + grey-zone tempo make threats lethal; a vigilant, adaptive national security craft is essential."}, {"c": "15", "n": "National Security Doctrine", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Who proposed an NSS before theaterisation? Gen. M.M. Naravane Which 2009 document is the only political direction? Raksha Mantri's Operational Directive Doval Doctrine? Double squeeze 3 committees that urged a doctrine? Kargil Review, GoM task forces, Naresh Chandra 2011"}, {"c": "16", "n": "National Security Council and Indian Coast Guard", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words NSC = PM-led advisory body; NSA runs the secretariat. Three tiers: SPG, NSAB, JIC . Key term In plain words NSCS Secretariat that supports the NSC. JIC Committee that assesses intelligence inputs."}, {"c": "16", "n": "National Security Council and Indian Coast Guard", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Note Source note: this chapter comes from handwritten class slides read by OCR; confirm details against the Cabinet Secretariat site before quoting. Note NSC was constituted on the recommendation of the K C Pant Task Force . Prime Minister is chairman; it is the apex inter-ministerial mechanism for integrated thinking and coordinated application of resources on national security. Three tiers Strategic Policy Group (SPG) : headed by Cabinet Secretary ; Defence, Foreign, Home Secretaries, Service Chiefs and others National Security Advisory Board (NSAB) : long-term analysis and perspective Joint Intelligence Committee (JIC) : assesses inputs from various intelligence agencies Members (as per slide) Prime Minister (chair) Home, Defence, Finance, External Affairs Ministers NSA (Secretary to the Council); permanent invitees"}, {"c": "16", "n": "National Security Council and Indian Coast Guard", "id": "3-nscs-and-nsa", "t": "3 · Nscs and NSA", "x": "3 · Nscs and NSA # NSC Secretariat (NSCS) Provides analysis and coordination ; follows up decisions Headed by NSA Interface with R&AW, IB, NTRO No decision-making authority Functions of NSA Principal adviser to the PM on national security Leads national response to a security crisis Inter-ministerial coordination Supervises nuclear command and control architecture (slide) Supported by Deputy NSAs , Military Adviser, National Maritime Security Coordinator Current affairs Recent context (slide): Government appointed an Additional NSA to the NSCS. Verify the name and date before using."}, {"c": "16", "n": "National Security Council and Indian Coast Guard", "id": "4-indian-coast-guard", "t": "4 · Indian Coast Guard", "x": "4 · Indian Coast Guard # ICG Coast Guard Act, 1978 Coastal surveillance and patrol ; anti-poaching; anti-smuggling Search and rescue (Maritime Rescue Coordination Centres); Operation Sajag (coastal security drill with stakeholders) Pollution response Fleet modernisation; Coastal Surveillance Network and interagency coordination (see Maritime Security chapter) Value addition Key weakness to write: NSC advises only; no statutory basis; coordination depends on the PM and NSA. General knowledge, verify before using."}, {"c": "16", "n": "National Security Council and Indian Coast Guard", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. NSC set up on whose recommendation? K C Pant Task Force Chair? Prime Minister Three tiers? SPG, NSAB, JIC Coast Guard Act year? 1978"}, {"c": "17", "n": "Defence Reforms: Modernisation, Agnipath, Navy, Exports", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words Reforms push jointness, indigenisation and younger, skilled forces . Agnipath and defence exports are the headline changes. Key term In plain words Monopsony Market with a single buyer (here the armed forces). IDDM Indigenously Designed, Developed and Manufactured: top procurement category."}, {"c": "17", "n": "Defence Reforms: Modernisation, Agnipath, Navy, Exports", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Note Defence modernisation = upgrading military capability through new weapons (imported or indigenous), new doctrines, organisational structures, manpower management and training regimes . Areas: combat capabilities; procedures, structures and systems (arms acquisition: speed, transparency; higher defence structure; ITC; Agnipath)."}, {"c": "17", "n": "Defence Reforms: Modernisation, Agnipath, Navy, Exports", "id": "3-agnipath-scheme-2022", "t": "3 · Agnipath Scheme (2022)", "x": "3 · Agnipath Scheme (2022) # Quote \"Agnipath is also a potential game-changer because it will help collapse the walls of granite between… the civil and military domains.\" — Lt Gen Raj Shukla Feature Detail Model 4-year recruitment (incl. 6 months training), below officer rank; 17.5-21 years After 4 years 25% absorbed for 15 more years; 75% leave with Seva Nidhi (30% of salary) ≈ ₹11.71 lakh ; no pension or gratuity Certification AICTE, NSDC, NCVET; CAPF/Assam Rifles pathways Ex-Agniveer 2026 50% reservation in CAPF/AR constables; 3 yr age relaxation (5 for first batch); exempt from PST, PET, written; dedicated MHA wing Objectives Financial efficiency : pay + pension take 50-55% of defence budget, modernisation only 3-4% Youthful forces : lower average age from 32 Tech-skilled : AR/VR, simulation, AI training Nation-building : discipline, patriotism Positives Younger, future-ready force; saves pension; youth employment; skilled workforce; border-area workforce Inspired by 1960s-70s colour service; parallels USA, Israel, South Korea; shift from \"womb to tomb\" model Concerns No pilot testing; dilution of military ethos; morale; PTSD and reintegration; unclear re-enlistment; no pension, no CSD canteen; 60,000 PBOR retire yearly (vacancies) Way ahead Holistic skill empowerment (corporates, startups, NITI Aayog); inter-ministerial effort (Skill, Education, Labour); talent pipeline; combat effectiveness balance; absorb in civil/administrative roles; continuous evaluation"}, {"c": "17", "n": "Defence Reforms: Modernisation, Agnipath, Navy, Exports", "id": "4-indian-navy-modernisation", "t": "4 · Indian Navy Modernisation", "x": "4 · Indian Navy Modernisation # Navy Atmanirbhar by 2047 (Adm. R. Hari Kumar); greater jointness New ensign (INS Vikrant, Kochi) based on Shivaji's octagonal seal ; INS Shivaji (Lonavla); INS Angre (Kanhoji Angre, Mumbai) Shivaji: \"Jalameva yasya, balameva tasya\" ; Marathas strong in littoral waters"}, {"c": "17", "n": "Defence Reforms: Modernisation, Agnipath, Navy, Exports", "id": "5-defence-exports-indigenisation", "t": "5 · Defence Exports & Indigenisation", "x": "5 · Defence Exports & Indigenisation # Current affairs Data: defence production FY2025-26 ₹1.78 lakh cr (+15.6%; PSU 76%, private 24%). Exports ₹38,424 cr (+62.66% from ₹23,622 cr). 2015-19 India 2nd largest importer; now top-25 exporter. Exports to US >50% (>$2.8 bn in 5 years). iDEX: 676 startups/MSMEs, 551 contracts; ADITI ₹750 cr. FDI: 74% automatic, 100% government route; ₹6,670.59 cr cumulative. Efforts Positive Indigenisation Lists (411 items services; 10 lists, 5,521 items DPSUs) 75% of capital acquisition budget for Indian firms; IDDM priority (DAP 2020) Simplified licensing; SRIJAN portal; Defence Industrial Corridors (UP, TN); Mission DefSpace Lines of credit, Exim, offset; MEA and embassies promote Challenges Distorted market : monopsony (armed forces sole buyer), DPSU supply monopoly, orders in dozens-hundreds Lack of cohesion among stakeholders; no single-point agency Ad-hoc policy (DPEPP 2020 needs sustained focus) DPSU-private asymmetry Recommendations Widen whole-of-government approach; Defence Export Promotion Agency (DEPA) under PMO Focus on high-value platforms : Tejas, BrahMos, Pinaka, Akash Use export revenue for DPSU R&D; avoid autarkic production"}, {"c": "17", "n": "Defence Reforms: Modernisation, Agnipath, Navy, Exports", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Agnipath age and tenure? 17.5-21; 4 years Seva Nidhi comes from? 30% of salary Defence exports FY26? ₹38,424 cr Ex-Agniveer CAPF reservation? 50%"}, {"c": "18", "n": "Integrated Theatre Command and CDS", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words CDS and DMA (2020) started jointness; theatre commands still pending. Critics: build jointness and doctrine first , pilot one theatre. Key term In plain words Theatre command Single commander controls army, navy, air assets for one geographic region. Purple officer Officer with experience across all three services."}, {"c": "18", "n": "Integrated Theatre Command and CDS", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Road to jointness 1949 Joint Services Wing / NDA (1955) → Kargil 1999: poor coordination → 2000 GoM / 2001 report: CDS → 2011-12 Naresh Chandra: permanent chairman COSC → 2016 Shekatkar: 3 theatre commands → 2020 first CDS + DMA → 2023 Inter-Services Organisations Act Early tri-service institutions Joint Services Wing (Dehradun 1949); NDA (inaugurated 1955); DSSC Wellington; NDC Delhi — but operational jointness limited Commands today Unified: Andaman & Nicobar Command (2001, theatre) · Strategic Forces Command (2003, functional) 17 single-service commands: Army 7 · Air Force 7 · Navy 3 Air Defence Command (2020 idea) — not operationalised (June 2023): IAF says air defence and offence are interdependent Specialised: Defence Cyber Agency (could become Information Warfare Command), AFSOD , Defence Space Agency; proposed Logistics, Training and Doctrinal commands Current affairs Inter-Services Organisations (Command, Control and Discipline) Act 2023: enabling law; Centre can constitute inter-service organisations; Commander-in-Chief / Officer-in-Command has disciplinary powers over all personnel irrespective of service; existing Service Acts unchanged; Centre can issue directions."}, {"c": "18", "n": "Integrated Theatre Command and CDS", "id": "3-chief-of-defence-staff", "t": "3 · Chief of Defence Staff", "x": "3 · Chief of Defence Staff # Evolution Post-1947: Chiefs of Staff Committee (triumvirate, Chairman-COSC = title only) Kargil 1999 → GoM 2000 → 2001 report : CDS (deferred); Naresh Chandra 2011-12 : CDS as permanent chairman COSC compromise; both urged integrating HQs with MoD, cross-staffing About CDS Four-star , pay equal to service chiefs; no command over chiefs; primus inter pares ; precedence 12th Permanent Chairman COSC · Principal Military Adviser to Defence Minister · Secretary, Department of Military Affairs (DMA) Command over DCyA, DSA, AFSOD via Integrated Defence Staff; promotes jointness in procurement, training, staffing Equivalents: Pakistan CJCSC · UK CDS · US CJCS Issues No operational command; limited political involvement in planning; DMA reduced civilian oversight (promotions, postings); Defence Secretary role diluted Way forward Define CDS operational role vs chiefs' administrative duties; Vice CDS ; empower command over theatres; professional independence; continuous evaluation"}, {"c": "18", "n": "Integrated Theatre Command and CDS", "id": "4-issues-with-theatre-commands", "t": "4 · Issues With Theatre Commands", "x": "4 · Issues With Theatre Commands # Issues Lack of true jointness (training, operations, planning); successes by good fortune Premature push ; separate land/maritime/air-defence proposal makes one service dominant Service-specific war plans; air power contested (IAF proprietary view); rotational leadership debate Need National Security Doctrine before theatrisation Way forward Jointness first ; pilot one theatre (northern: Kargil, Ladakh) Develop \"purple\" personnel with multi-service experience Joint war-fighting doctrine ; learn from global examples Value addition Shekatkar Committee (Dec 2016) under Manohar Parrikar's MoD recommended three integrated theatre commands."}, {"c": "18", "n": "Integrated Theatre Command and CDS", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. First CDS year? 2020 Which committee proposed 3 theatre commands? Shekatkar 2016 Air Defence Command status? Not operationalised (June 2023) CDS ranks? 12th in precedence; four-star; primus inter pares"}, {"c": "19", "n": "Mission Sudarshan Chakra", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words Sudarshan Chakra = indigenous layered air-defence shield by 2035 . Defends and can retaliate . Key term In plain words IACCS Integrated Air Command and Control System of the IAF. BMD Ballistic Missile Defence."}, {"c": "19", "n": "Mission Sudarshan Chakra", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Note Announced in the PM's Independence Day 2025 address: 10-year mission, shield by 2035 . Name from Krishna's Sudarshan Chakra: protection and precise retaliation . Core objective Indigenous multi-level air and missile defence Neutralise attacks and counter-punch Protect military, strategic and civilian assets and public places Work across air, land and sea"}, {"c": "19", "n": "Mission Sudarshan Chakra", "id": "3-key-features", "t": "3 · Key Features", "x": "3 · Key Features # Features Indigenous R&D and manufacture (Aug 2025 DRDO integrated air-defence test hit 3 targets together , called first step by Raksha Mantri) Multi-layered : different ranges and altitudes Defence and offence Networked architecture (sensors, radars, command centres, weapons) Foundation: IACCS, Akashteer, BMD, S-400, Akash, BrahMos Cyber and space layer , EW, AI decision support Adds maritime and land layers to air defence"}, {"c": "19", "n": "Mission Sudarshan Chakra", "id": "4-why-it-matters", "t": "4 · Why It Matters", "x": "4 · Why It Matters # Reasons Changing warfare : drones, missiles, hypersonics, cyber, EW Operation Sindoor showed strength and need for wider shield Two-front challenge (China, Pakistan) Civilian security : cities, hospitals, railways Strategic autonomy ; deterrence Challenges Meeting the 2035 deadline Integrating Army, Navy, Air Force, space, cyber, civil networks Production at scale , not just tests Cyber and data-manipulation risk Enough indigenous sensors, interceptors, radars, directed-energy systems Balance automation and human decision Current affairs Link: Defence Reforms (jointness), Atmanirbhar Bharat, Grey Zone (drones and missiles), Smart Border (counter-drone)."}, {"c": "19", "n": "Mission Sudarshan Chakra", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Announced when and by whom? PM, Independence Day 2025 Target year? 2035 Existing systems it builds on? IACCS, Akashteer, BMD, S-400, Akash, BrahMos"}, {"c": "20", "n": "Grey Zone and Hybrid Warfare", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words Grey zone = hostility below the threshold of war; hybrid = conventional + irregular. India needs a whole-of-nation response to China and Pakistan. Key term In plain words Salami slicing Taking small steps that individually do not trigger war but add up to big territorial change. Lawfare Using legal claims as a weapon (China's Three Warfares)."}, {"c": "20", "n": "Grey Zone and Hybrid Warfare", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Note Grey Zone (US DoD) = strategic space between peace and total war ; actors use all authority to reach politico-military goals beyond peaceful limits while staying below all-out overt confrontation . Tools: nefarious economic practices, influence operations, cyberattacks, mercenaries, assassinations, disinformation, debt traps, sanctions . Why it happens Technology + high cost and risk of conventional conflict in nuclear era → covert aggression with obfuscated attribution Strategic advantage over conventionally stronger adversary Perpetual conflict wears down adversary; boundaries of acceptable action expand → risk of inadvertent escalation"}, {"c": "20", "n": "Grey Zone and Hybrid Warfare", "id": "3-six-generations-of-warfare", "t": "3 · Six Generations of Warfare", "x": "3 · Six Generations of Warfare # Generations 1G Direct, personal weapons → 2G Massed firepower, trenches (WWI) → 3G Speed and manoeuvre, tanks → 4G Blurred war/politics, asymmetric, terror, cyber → 5G Non-kinetic: misinformation, AI, perception → 6G Cognitive: minds, ideology, proxies Memory aid D F M A N C \" D on't F ight M en — A ttack N arratives, C ontrol minds\": Direct · Firepower · Manoeuvre · Asymmetric · Non-kinetic · Cognitive (in order)"}, {"c": "20", "n": "Grey Zone and Hybrid Warfare", "id": "4-grey-zone-vs-conventional-vs-hybrid", "t": "4 · GREY ZONE vs CONVENTIONAL vs HYBRID", "x": "4 · GREY ZONE vs CONVENTIONAL vs HYBRID # Aspect Grey zone Conventional / Hybrid Provocation Baits other side to escalate; then claims self-defence Conventional: declared hostilities Territory Normalises claims by repeated presence ( salami slicing ) Clear military victory and occupation Escalation Escalates in many dimensions Usually one dimension Operations Covert , non-military pressure Overt combat Level Tactical, operational, strategic ; protracted Hybrid: tactical + operational; with conventional ops Aim Global/regional revisionist Concept is operational/tactical Symmetry Symmetric and asymmetric Mainly asymmetric Grey zone during conventional war DIME (diplomacy, information, military, economy) over protracted period May spiral into full war — e.g. 2001 standoff, Operation Parakram after Parliament attack Extension of non-contact warfare (cyber, space, information, diplomatic, economic) India: \"two and a half front\" — half front fought in grey zone"}, {"c": "20", "n": "Grey Zone and Hybrid Warfare", "id": "5-characteristics-of-grey-zone", "t": "5 · Characteristics of Grey Zone", "x": "5 · Characteristics of Grey Zone # Seven features Level of aggression : just short of triggers Protracted : gradual (Chinese salami slicing ; Pakistan's terror in the valley) Non-attributability : deniability via cyber, disinformation, non-state actors Historical and legal claims : China in South China Sea, Indo-China border; Pakistan in Kashmir Policy of denial : stop short of vital concerns (China's fishing boats) Remain below threshold : Pakistan's TNW threat, China in Galwan All-out non-military efforts and target fault lines (polarisation, ethnic and communal divides) Do autocracies fare better? Centralised whole-of-state marshalling Democracies vulnerable : fragmented, slow Doctrine integration (Russia, China) Not bound by rules-based order"}, {"c": "20", "n": "Grey Zone and Hybrid Warfare", "id": "6-countering-grey-zone", "t": "6 · Countering Grey Zone", "x": "6 · Countering Grey Zone # Value addition \"No proxy war or insurgency has been defeated by military force alone\" — French in Algeria : tactical wins, strategic loss. India has fought a hybrid war in J&K for decades. Government & society Whole-of-government approach (common language, interagency options) Remove vulnerabilities (root causes, grievance redress) Free and open press (calls out secrecy-based activities) Partnerships with like-minded states Military & technology Bridge technology gap : AI, drones, big data, space, EW, autonomous, swarm, cyber, bio, quantum Conventional deterrence ; doctrine and training ; combined arms → joint theatre command to brigade level Information operations (cyber, strategic communication); hybrid capabilities (Special Forces, agile units, long-range artillery, drones); military reforms Note First-mover advantage: grey-zone gains go to who moves first — Chinese artificial islands would have been easier to contest at the start."}, {"c": "20", "n": "Grey Zone and Hybrid Warfare", "id": "7-hybrid-warfare", "t": "7 · Hybrid Warfare", "x": "7 · Hybrid Warfare # Note Hybrid warfare = conflict combining conventional forces and irregulars (guerrillas, insurgents, terrorists), state and non-state, for a common political purpose. Features: asymmetry · military + non-military mix · weaponised information · psychological and cyber · coercion and intimidation · subversion and espionage · integrated campaigns for surprise · psychological dominance . Example Technique China \"Unrestricted warfare\" (late 1990s) Hacking, viruses, banking subversion, market/currency manipulation, urban terror, media disinformation; Three Warfares (psychological, media, legal / lawfare) Hezbollah 2006 (Israel) Guerrilla + conventional + strategic communication Russia, Crimea 2014 Conventional + political protests, economic coercion, cyber, disinformation"}, {"c": "20", "n": "Grey Zone and Hybrid Warfare", "id": "8-india-s-case-china", "t": "8 · India's Case: China", "x": "8 · India's Case: China # China's hybrid war Territorial aggression at LAC (coercive gradualism) Economic colonisation : BRI, debt traps in IOR Cyber and information (Three Warfares) Economic-diplomatic pressure; collusion with Pakistan Maritime : Malacca vulnerability vs India's ability to block sea lanes Resource security drives expansion India's way forward Economic resilience : reduce import dependence (electronics, pharma, rare earths); Atmanirbhar; ASEAN, EU, US; Blue Dot Network, B3W Military modernisation : joint cyber/EW; air and naval strength; deep-strike specialised units Border infrastructure : all-weather roads, tunnels, airfields Strategic partnerships with US, Japan, Israel (AI, quantum, cyber) Maritime security vs string of pearls; connectivity : India-Myanmar-Thailand Highway, BBIN Diplomacy : CBMs, BRICS, SCO; soft power : ISA"}, {"c": "20", "n": "Grey Zone and Hybrid Warfare", "id": "9-india-s-case-pakistan", "t": "9 · India's Case: Pakistan", "x": "9 · India's Case: Pakistan # Pakistan's hybrid war Proxy : LeT, JeM, Hizbul Narco-terror and counterfeit currency Separatism : Khalistan; Indian Mujahideen Cyber and economic sabotage Intifada-style protests Strategic depth ; Indus water security India's way forward Joint military planning : covert ops, drone strikes, limited wars Politico-military diplomacy : isolate; aid conditional on terror crackdown; CBMs suspended Economic measures; National Strategic Communications Advisory Committee Escalation control : proportionate response under nuclear backdrop Note Conclusion: unrestricted grey-zone wars are the commonest form of conflict (India-Pakistan); India needs a proactive, institutionalised whole-of-nation strategy with synergy of political, military, economic and information infrastructure."}, {"c": "20", "n": "Grey Zone and Hybrid Warfare", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Define grey zone (one line) Space between peace and total war; hostile acts below war threshold 6 generations in order? Direct, Firepower, Manoeuvre, Asymmetric, Non-kinetic, Cognitive DIME? Diplomacy, Information, Military, Economy Example of salami slicing? China at LAC / South China Sea India's \"2.5 front\"? China + Pakistan + half front in grey zone"}, {"c": "21", "n": "Left Wing Extremism (LWE)", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words LWE began at Naxalbari (1967) and thrived where land, forest and governance promises failed. The state answered with force + development + rights . Police and public order stay with States. Violence is down 88-90% since 2010; handout says zero affected districts by Mar-Apr 2026. Key term In plain words Political legitimacy deficit Governance deficit → Naxals gain legitimacy → vicious cycle. Use as the core cause in any ‘why’ answer. Circular governance trap Forest security measures cut local connect, weakening governance, which keeps security risk alive. Indicative legislation (PESA) Lays guidelines; works only after State amendments. Clear, hold, develop Force wins an area, then development wins the tribal population. Legacy & Thrust district No longer affected; support continues to stop relapse. Adivasi paradox Tribals trapped between Maoist threats and police raids. Structural disintegration Teacher: from tactical containment to breaking leadership, cadre and support."}, {"c": "21", "n": "Left Wing Extremism (LWE)", "id": "2-mains-pyqs", "t": "2 · Mains PYQs", "x": "2 · Mains PYQs # Mains PYQs and where the answer lives Year · marks Question Use 2013 · 10 Analyse: impact of non-implementation of the Fifth Schedule (Art. 244) Fifth Schedule section; Samatha 2015 · 12.5 Discuss: corrective strategies for tribals and farmers facing multiple displacements (Malkangiri, Naxalbari foci) Drivers: displacement; FRA; SETU model; surrender 2018 · 10 Briefly explain: GoI approach as LWE shows a downward trend Data; Government approach 2020 · 15 Determinants in Eastern India + strategy for GoI, civil administration, security forces Drivers; ARC II table 2022 · 15 Naxalism as social, economic, developmental issue: emerging issues + multilayered strategy 2026 framework; ARC II; NAXALISM 2025 · 10 What is LWE, how people are affected, measures to eliminate by 2026 Definition; drivers; schemes; Naxal Mukt Bharat Trend 5 of 6 questions ask for a strategy or measures; causes appear in 2013 and 2020 and are always paired with solutions. Every answer needs a multi-pronged way forward (security + development + rights + governance), and 2025 now asks for status."}, {"c": "21", "n": "Left Wing Extremism (LWE)", "id": "3-overview", "t": "3 · Overview", "x": "3 · Overview # What is LWE? Radical political ideology : abolish capitalism, build a socialist or communist order, dismantle existing power structures; uses bombings, assassinations, armed insurrection . Teacher's keywords: ✎ write this in every intro fed by disaffection, disinformation, displacement → aims at a protracted people's war , radical political-economic-social change, overthrow of government. Quote By “Naxalism is not merely a law and order issue… directly related to underdevelopment… tribal areas are the main battleground.” Dr. Manmohan Singh “The Constitution intends that the land always should remain with the Tribals.” Samatha judgement “Naxalism didn't spread because of poverty; poverty spread because of Naxalism.” Home Minister (slide 18) “Movement is on its last legs.” K. Vijay, MHA Security Advisor Current affairs Naxal Mukt Bharat: target 31 Mar 2026 (Centre-State strategy of 24 Aug 2024); declared fulfilled on the date. Handout: no district LWE-affected; 2026 so far: 33 incidents, 11 deaths (to 29 Jul)."}, {"c": "21", "n": "Left Wing Extremism (LWE)", "id": "4-data-peak-to-present", "t": "4 · Data: peak to present", "x": "4 · Data: peak to present # PYQs PYQ 2018 · downward trend Districts: 126 (2014) → 0 (Mar-Apr 2026). 38 Legacy & Thrust districts (13 in Chhattisgarh) kept under support to prevent relapse. Violent incidents: 1,936 (2010) → 234 (2025), −88%; 870 in 2014. Deaths (civilians + SF): 1,005 (2010) → 100 (2025), −90%; 310 in 2014. Police stations reporting violence: 465 (2010) → 119 (2025). 2025: 364 neutralised, 1,022 arrested, 2,337 surrendered. 3,927 surrendered 2024-Mar 2026. Shift: from expanding “Red Corridor” to consolidating LWE-free areas and relapse prevention . Alert Handout map and slide 11 show 2 affected districts (Bijapur, Sukma) on 30 Mar 2026; handout text says zero. Legacy & Thrust: 38 (handout) vs 37 + 1 District of Concern, West Singhbhum (slide 17). Women in cadre: 35-40% (handout) vs 60% (board). Phase years: handout 1967-72 / 1975-2004 / 2004-12 / 2013-; board 69-73 / 75-04 / 04-13 / 14-. Book uses the handout; check which version your notebook carries. Evolution: four phases Four phases Phase Key points
