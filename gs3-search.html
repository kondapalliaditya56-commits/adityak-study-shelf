 and key terms # In simple words Interpol colour notices + BharatPol + MLATs = global policing tools. Key term In plain words Extradition Handing over an accused or convict to another country under treaty. MLAT Treaty for legal assistance in criminal matters."}, {"c": "40", "n": "Interpol, BharatPol, MLATs and International Policing", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Note Source note: built from OCR of handwritten slides; items marked (verify) must be checked before use. Note Interpol: founded 1923 , HQ Lyon, France ; 195 member countries; each has a National Central Bureau as point of access (India: CBI). Why international policing Transnational nature of crime (drugs, wildlife and timber, organised networks) Extradition is slow; bureaucratic and sovereignty concerns Disparities in laws, jurisdictions and technology Interpol notice Purpose Red Fugitive charged with or convicted of serious crime (locate and arrest) Blue Additional information on identity or location Green Warning about habitual offenders Orange Warn of imminent threat (hidden weapons, bomb threat) Black Information about unidentified bodies Purple Modus operandi, objects or cybercrime tools Silver Trace assets linked to crime (pilot project; India part of it, verify)"}, {"c": "40", "n": "Interpol, BharatPol, MLATs and International Policing", "id": "3-bharatpol-and-mlats", "t": "3 · BHARATPOL AND MLATs", "x": "3 · BHARATPOL AND MLATs # BharatPol Launched by CBI ; digital platform to connect Indian law-enforcement agencies with Interpol Replaces letters and emails with a faster integrated system 5 modules (verify): connect, broadcast, references, notices, resources MLATs Mutual Legal Assistance Treaties : formal treaties between 2+ countries for legal assistance in criminal matters India has MLATs with 40+ countries Issue: slow, via judicial, diplomatic channels; BharatPol is faster and flexible Current affairs Recent (verify): BNSS S.356 allows trial in absentia of proclaimed offenders. India chosen to chair UN Commission on Narcotic Drugs session; Interpol and UNODC asked to target profits of organised crime."}, {"c": "40", "n": "Interpol, BharatPol, MLATs and International Policing", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Interpol HQ and year? Lyon, 1923 Red notice? Fugitive to be located and arrested BharatPol launched by? CBI BNSS S.356? Trial in absentia of proclaimed offenders"}, {"c": "41", "n": "UAPA and NIA", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words UAPA now allows designating individuals ; NIA can probe across States and abroad. Concerns: due process, federalism, low UAPA conviction rate . Key term In plain words Fourth Schedule (UAPA) List of individuals designated as terrorists. Superintendence Control over an agency; the NIA Act does not define it."}, {"c": "41", "n": "UAPA and NIA", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Current affairs July 2026: MHA designated 23 more individuals as terrorists under S.35 UAPA (Fourth Schedule): 17 Pakistani, 6 Indian, all operating from Pakistan or PoJK; earlier 57 → total 80 . NIA (29 Jul 2026): 690 cases, 169 judgments, 156 convictions = 92.31% ."}, {"c": "41", "n": "UAPA and NIA", "id": "3-uapa-amendment-2019", "t": "3 · UAPA Amendment 2019", "x": "3 · UAPA Amendment 2019 # Provision What it does S.35 designation Centre can designate organisations ; 2019 extends to individuals (Fourth Schedule) Property seizure Needs DGP approval; if NIA investigates, DG NIA approval Investigation DSP/ACP or above; NIA Inspectors and above can investigate Schedule of treaties Adds International Convention for Suppression of Acts of Nuclear Terrorism (2005) to nine treaties Criticism Arbitrary labelling : no FIR, chargesheet or conviction needed; fails \"just, fair, reasonable\" Fundamental rights : Art. 19 speech, assembly, association; dissent criminalised No safeguards : no judicial review/appeal for designation; burden shifts; Watali (2019) limits bail scrutiny; Thwaha Fasal (2021) slightly easier bail Federal encroachment ; low conviction — 2.2% of UAPA cases 2016-19; erodes judicial role Way forward Use as last resort ; narrow definitions of \"unlawful activity/terrorist act\" (protect protest, per Art. 19(1)(a) , Maqbool Fida Hussain v. Rajkumar Pandey 2008 ) Independent review mechanism; amend S.43D(5) (presumption of innocence); clear bail-denial grounds"}, {"c": "41", "n": "UAPA and NIA", "id": "4-nia-act-2008", "t": "4 · NIA Act 2008", "x": "4 · NIA Act 2008 # About NIA Central counter-terror agency , HQ New Delhi; formed after 26/11 ; Bill by P. Chidambaram Dec 2008; came into existence 31 Dec 2008 , functioning 2009 Investigates offences against sovereignty/security: friendly relations with states, atomic facilities, arms-drug-FICN smuggling , infiltration, treaty offences — across States on MHA order 2019 Amendment : adds human trafficking, counterfeit currency, prohibited arms, cyber-terrorism, Explosive Substances Act ; investigate offences outside India ; Special Court in New Delhi Analysis Constitutional validity : police/public order = State subjects; Soli Sorabjee Committee and Law Ministry: Arts. 249 / 252 or amendment; Entry 93, List I gives some basis Functioning : investigation but not prevention (no intelligence role); superintendence undefined (politicisation); executive decides scheduled offence; S.6(3) gives Centre 15 days to decide Way forward International cooperation (information sharing, extradition, joint ops) · coordination with State agencies (joint task forces, shared databases) · judicial oversight"}, {"c": "41", "n": "UAPA and NIA", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. S.35 UAPA? Designation of terrorist organisations; individuals after 2019 Total individuals designated by July 2026? 80 NIA conviction rate (Jul 2026)? 92.31% Conviction of UAPA cases 2016-19? 2.2%"}, {"c": "42", "n": "Organised Crime and its Links with Terrorism", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words Crime and terror converge on money, arms, routes and corruption. India: BNS 111-112 , MCOCA, MAC/JOCs. Key term In plain words IFF Illicit financial flows. Syndicate Organised crime group in BNS terms."}, {"c": "42", "n": "Organised Crime and its Links with Terrorism", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Current affairs Recent: NIA Operation Dhvast (129 locations, terror-gangster-drug network, with Punjab and Haryana police); MCOCA invoked against Lawrence Bishnoi in Salman Khan firing case; FICCI Hidden Streams report across 122 nations. Note UNODC: continuing criminal enterprise that works rationally to profit from illicit activities in public demand, protected by corruption and intimidation . UNTOC: structured group of 3 or more persons, over time, acting to commit serious crime for material benefit. India ratified UNTOC in 2011 . International 1988 UN Narcotics Convention → 1994 Naples Conference → 2000 UNTOC adopted → 2011 India ratifies UNTOC Commercial smuggling Soviet-style controls and high barriers → 1980s underworld (film finance until industry status 1998); Mumbai hub; methods: contraband, relabelling, under-reporting, falsified certification; goods: gold, gems, cigarettes, electronics, phones Gun running FICCI: each 1-point rise in arms-trafficking score ≈ 0.69-point rise in GTI; Kashmir: none before mid-1980s, by 1989 seizures of 98 AK rifles ; cross-border tribes as guides; Area Commanders distribute"}, {"c": "42", "n": "Organised Crime and its Links with Terrorism", "id": "3-linkages", "t": "3 · Linkages", "x": "3 · Linkages # Link Example Funding Taliban heroin Logistics Al-Qaeda N. African routes; 26/11 logistics Arms Hezbollah traffickers Human trafficking ISIS and Yazidi women Drugs FARC cocaine Money laundering Hawala in South Asia Extortion / kidnap Boko Haram schoolgirls Corruption Mexican cartels bribe officials Territory ISIS in Syria and Iraq Convergence Mafia tactics India region Organised crime Terror type NER Extortion, trafficking, gun running Insurgency, ethno-nationalist J&K Funding, counterfeit, ML, opium State-sponsored LWE Extortion, bank robbery Ideological Aspect Terrorism Organised crime Motive Political, ideological Money, control Style Overt, spread fear Covert, bribery Structure Tight hierarchy Loose affiliates Legitimacy Does not seek Needs social support Civilians Mass killing Limited Longevity Long-term Sporadic bursts State Opposes Manipulates"}, {"c": "42", "n": "Organised Crime and its Links with Terrorism", "id": "4-countering", "t": "4 · Countering", "x": "4 · Countering # Initiatives OCCUs ; MCOCA, KCOCA, NDPS, Customs Act, ITPA, NSA; FIUs; MAC / JOCs ; Kimberley Process, FATF, UNODC, SCO-RATS, MLATs; UNTOC, UNCAC ; ICSFT; CBN portal Value addition BNS S.111 organised crime: continuing unlawful activity by a syndicate using violence/coercion for material benefit; punishment death or life where death results, fine ≥ ₹10 lakh . S.112 petty organised crime: gang theft, snatching, betting, paper leak etc.; 1-7 years and fine. Memory aid 6 C C ontinuous IFF evaluation (SDG 16.4) · C entral nodal agency (like I4C) · C onsumer awareness · C ombat TBML (WCO AEO, blockchain) · C ooperation internationally (G20 New Delhi 2023) — the faculty's \"6C approach\" (five items listed in source) Value addition Sahel case: terror deaths up >2000% (2007-22); firearms in 70% of 84 attacks; >9,300 deaths in 2022 — illicit arms feed terrorism."}, {"c": "42", "n": "Organised Crime and its Links with Terrorism", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. BNS S.111 fine? ≥ ₹10 lakh UNTOC members of group? 3 or more India UNTOC ratification? 2011"}, {"c": "43", "n": "Drug Trafficking and Narco-Terrorism", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words Drugs enter via Punjab, Gujarat, North-East, ports and drones . Answer = NDPS + NCORD + border tech + demand reduction . Key term In plain words Narco-terrorism Terror or violence financed or run through the drug trade. Yaba Methamphetamine tablets from Myanmar. NCORD Narco-Coordination Centre mechanism."}, {"c": "43", "n": "Drug Trafficking and Narco-Terrorism", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Note Narco-terrorism = intersection of drug trafficking and terrorism, where violent acts by traffickers aim to influence officials by intimidation and violence . Drugs harm individuals, break families, weaken communities."}, {"c": "43", "n": "Drug Trafficking and Narco-Terrorism", "id": "3-recent-context-verify-dates", "t": "3 · Recent Context (verify Dates)", "x": "3 · Recent Context (verify Dates) # Operation Detail Crystal Fortress (Nov 2025) NCB + Delhi Police Special Cell; transnational methamphetamine cartel using Delhi as hub Ragepill NCB busts network; India's first seizure of Captagon (psychotropic used in Middle East) White Strike NCB dismantles cocaine syndicate in Mumbai-Thane Global-Hunt NCB + Interpol to trace international networks run by Indian fugitives"}, {"c": "43", "n": "Drug Trafficking and Narco-Terrorism", "id": "4-the-landscape", "t": "4 · The Landscape", "x": "4 · The Landscape # Location Golden Crescent : Afghanistan, Pakistan, Iran Golden Triangle : Myanmar, Laos, Thailand Government proposes calling them Death Crescent and Death Triangle Drugs: cocaine, pseudoephedrine, heroin, alprazolam, methamphetamine, mephedrone, cannabis, hashish Entry points Punjab and Gujarat : Golden Crescent; Punjab sees drone drops North-East (Myanmar border): heroin and Yaba (methamphetamine) tablets Networks in South America, Africa, Middle East target India as transit and destination Sea ports : Kolkata, Chennai, Mumbai, Tamil Nadu (Terrorism handout) Current affairs Data (CAPF handout): Punjab seized 2,086 kg heroin = 58% of 3,567 kg nationwide. INCB 2023: South Asia has 39% of opiate consumers. Drone-enabled trafficking Drops of narcotics, arms, ammunition, explosives across India-Pakistan border without infiltration GPS-guided flights, fixed drop points, local receivers, encrypted communication Links foreign handlers, smugglers, terror modules and narco-finance"}, {"c": "43", "n": "Drug Trafficking and Narco-Terrorism", "id": "5-measures", "t": "5 · Measures", "x": "5 · Measures # Level Measures Global UNODC (est. 1997); World Drug Report 2025; Global Maritime Crime Programme (Southern Route); 26 June = International Day against Drug Abuse (declared 1987) Law NDPS Act 1985 (amended 1988, 2001, 2014, 2021): prohibition, punishment, asset forfeiture Coordination NCORD : Apex, Executive, State, District levels; ANTF in all States/UTs; JCC at Centre and States; NCB with Navy, Coast Guard, BSF Technology Darknet and Crypto Task Force (under MAC); anti-drone systems and SOPs; NIDAAN database of arrested offenders; FSL upgrades Agencies NCB zonal units at Srinagar, Siliguri, Agartala, Itanagar; new units approved (Ferozepur, Port Blair, Dimapur, Aizawl, Sriganganagar, Mangalore); BGFs and RPF empowered under NDPS Demand side MANAS helpline 1933 ; Nasha Mukt Bharat Abhiyaan ; NAPDDR ; Mission SPANDAN (awareness) Value addition Approach: whole-of-government = ruthless on supply chain, strategic demand reduction, humane treatment of victims . Current affairs World Drug Day 2025 theme: \"Break the Cycle. #StopOrganizedCrime\". Move from seizures to network dismantling : border security, financial tracking, rehab, international cooperation, community resilience."}, {"c": "43", "n": "Drug Trafficking and Narco-Terrorism", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Golden Crescent? Afghanistan, Pakistan, Iran Golden Triangle? Myanmar, Laos, Thailand MANAS helpline? 1933 NDPS amended in? 1988, 2001, 2014, 2021 NIDAAN stands for? National Integrated Database on Arrested Narco-Offenders"}, {"c": "44", "n": "Gun Running (Illicit Arms Trafficking)", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words Illegal arms power crime, LWE and terror . Fix: anti-drone, tracing, local livelihoods, UN tracing norms . Key term In plain words SALW Small Arms and Light Weapons. ITI International Tracing Instrument for marking and tracing arms."}, {"c": "44", "n": "Gun Running (Illicit Arms Trafficking)", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Note Gun running = illicit trafficking, manufacture and distribution of Small Arms and Light Weapons (SALW) . Small Arms Survey: millions of illicit firearms in India. NCRB: over 90% of gun-related homicides involve illegal, unregistered weapons. Security linkages Narco-terror nexus : same routes and hawala as drugs (Golden Crescent and Triangle) LWE : looted security-force weapons plus grey-market arms (West Bengal, Bihar, Telangana) Organised crime : gangs upgraded from zip guns to smuggled automatic weapons Hurdles Drones : low radar signature, night drops Porous borders : Indus riverine (Punjab), shifting chars of Brahmaputra, Myanmar hills Darknet and crypto payments Grey market : blank-firing or deactivated weapons converted to lethal Way forward Anti-drone (kinetic and jamming) on western frontier; ballistic fingerprint database of seized arms Local ecosystem: livelihood rehabilitation in clusters like Munger ; tighter scrap/chemical sourcing rules; grassroots intelligence Align with UN Programme of Action (UNPoA) and International Tracing Instrument (ITI)"}, {"c": "44", "n": "Gun Running (Illicit Arms Trafficking)", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Share of gun homicides with illegal arms? Over 90% (NCRB) Famous illicit manufacturing cluster? Munger Two UN instruments? UNPoA and ITI"}, {"c": "45", "n": "Human Trafficking and Child Trafficking", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words BNS 143 defines trafficking; most victims face forced labour . Gaps: weak AHTUs, 10.5% trial conviction, slow rehab . Key term In plain words AHTU Anti-Human Trafficking Unit of police. Palermo Protocol UN protocol against trafficking in persons, esp. women and children."}, {"c": "45", "n": "Human Trafficking and Child Trafficking", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Note BNS S.143 : recruiting, transporting, harbouring, transferring or receiving a person for exploitation through threats, force, coercion, abduction, fraud or deception. S.144 : exploitation of a trafficked person (Terrorism handout). Forms: forced labour, domestic servitude, forced marriage, beggary, pornography, illegal organ removal. Current affairs NCRB 2023: 2,183 cases (-3%); 6,288 victims , ~ 43% below 18 . More females overall; among minors boys outnumber girls. Over 2015-23 forced labour is the largest category, then sexual exploitation. Punjab and Haryana report most cases (EAM, Rajya Sabha, Dec 2025). Earlier handout: ~90% of trafficking is domestic."}, {"c": "45", "n": "Human Trafficking and Child Trafficking", "id": "3-child-trafficking", "t": "3 · Child Trafficking", "x": "3 · Child Trafficking # Note Data: 98,375 children missing in 2024 (+7.8%). 53,000+ rescued Apr 2024-Mar 2025. Conviction rate 2018-22 only 4.8% . Definition and causes Palermo Protocol (2000) : recruitment, transport, transfer, harbouring or receipt of a child for exploitation Push factors: poverty, unemployment, migration, disasters, family breakdown Social media recruitment (fake jobs, modelling) ART and IVF frameworks misused to legitimise kidnapped or bought children Legal and judicial Arts 23, 24 : no trafficking, forced labour, hazardous child work Art 39(e),(f) : protect children from exploitation BNS 98, 99 : selling and buying minors Vishal Jeet : child prostitution and trafficking need preventive, humane approach M C Mehta : hazardous child labour; Bachpan Bachao Andolan : directions on exploitation"}, {"c": "45", "n": "Human Trafficking and Child Trafficking", "id": "4-challenges", "t": "4 · Challenges", "x": "4 · Challenges # Challenges Hollow AHTUs (Sanjog Watch): staff do general policing; no autonomy or budget Conviction only 10.5% of trials; 95%+ cases pending Rehab tied to conviction : compensation delayed New methods : social media, fake jobs, migration packages, word of mouth"}, {"c": "45", "n": "Human Trafficking and Child Trafficking", "id": "5-government-measures", "t": "5 · Government Measures", "x": "5 · Government Measures # Area Measure Police Funds for Anti-Human Trafficking Units ; MHA conferences and judicial colloquiums; NIA can investigate inter-state/international cases Databases Crime Multi Agency Centre; ITSSO ; NDSO (18 lakh+ offenders); NDHTO (1.20 lakh+ offenders) Victim support Women Help Desks; Shakti Sadan (Mission Shakti); Child Care Institutions under Mission Vatsalya International UNCTOC and its trafficking Protocol ratified; SAARC Convention on trafficking of women and children (Regional Task Force); MoUs with Bangladesh, UAE, Cambodia, Myanmar Value addition Conclusion: move from rescue to victim-centred system: stronger AHTUs, faster trials, rehab, border coordination, safe migration; a uniform SOP (as directed by the Supreme Court) so every missing-person complaint triggers immediate action."}, {"c": "45", "n": "Human Trafficking and Child Trafficking", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. BNS section for trafficking? 143 Missing children 2024? 98,375 Child conviction rate 2018-22? 4.8% NDHTO holds? 1.20 lakh+ offender records Palermo Protocol year? 2000"}, {"c": "46", "n": "Money Laundering and Black Money", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words ML = hiding the source of crime money; stages PLI ; PMLA 2002 is the law, ED and FIU-IND act. FATF sets global standards; India is in regular follow-up . Key term In plain words Predicate offence The original crime that produced the money. Smurfing Splitting cash into small deposits. Chain-hopping Moving crypto across blockchains to hide the trail. ECIR ED's internal case report; not an FIR."}, {"c": "46", "n": "Money Laundering and Black Money", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Note Money laundering (PMLA 2002, S.3): concealing or disguising the true nature, source, location, disposition, movement, rights or ownership of proceeds of crime , and includes acquiring, possessing or using such proceeds, directly or indirectly and knowingly. UNODC: 2-5% of global GDP ($800 bn-2 tn) is laundered every year. Memory aid C I T E Why it is done: C oncealment of illegal activity · I ntegration into legitimate economy · T error and organised-crime financing · E vasion of tax (own mnemonic)"}, {"c": "46", "n": "Money Laundering and Black Money", "id": "3-stages", "t": "3 · Stages", "x": "3 · Stages # Memory aid P L I P lacement → L ayering → I ntegration (own mnemonic) Stage Meaning Placement Cash first enters banks; riskiest stage; smurfing = splitting cash into small deposits Layering Many transfers to lose the trail (shell firms, offshore accounts) Integration Money re-enters as legitimate wealth (real estate, business) Note Keywords: smurfing · shell company · offshore account · predicate offence (the original crime) · proceeds of crime. \"Money laundering is the oxygen of organised crime and terrorism.\""}, {"c": "46", "n": "Money Laundering and Black Money", "id": "4-techniques", "t": "4 · Techniques", "x": "4 · Techniques # Oldest → Older → Latest Oldest: hawala, physical smuggling and cash couriers Older: shell companies; over/under-invoicing ( TBML ) Latest: cyber-crime and identity theft, hedge funds, cryptocurrency, NFTs , insurance (buy, surrender, \"clean\" refund), white hawala Hawala Money transfer without movement of money ; no RBI oversight; instant; runs on trust and code words; no paper trail White hawala: legal purpose (family remittance) but outside banking channel Black hawala: funds crime, terror, tax evasion FATF Special Recommendation on Alternative Remittance targets it Over and under-invoicing Over-invoicing: importer pays more than goods are worth; extra money leaves India legally Under-invoicing: goods declared cheaper; difference settled in black money abroad; duty evaded"}, {"c": "46", "n": "Money Laundering and Black Money", "id": "5-cryptocurrencies-in-ml", "t": "5 · Cryptocurrencies in ML", "x": "5 · Cryptocurrencies in ML # Why launderers like crypto Decentralised ledger : no central authority No intermediaries : less detection Beyond traditional regulation Pseudonymous : harder to trace Mechanisms Crypto-mixers: mix identifiable tokens with others to hide origin Chain-hopping: move between blockchains (Bitcoin → Monero → other chain → cash out at weak-KYC exchange) Prevention Regulate crypto services; exchange KYC and STRs; blockchain analytics use the public ledger Global: UNGPML standards; pressure on tax havens Current affairs India: VDA tax 30% on gains + 1% TDS ; PMLA 2023 brought VDA service providers in as reporting entities; FATF travel rule . FATF June 2026: seventh targeted update on virtual assets/VASPs and a report on DeFi risks (verify dates)."}, {"c": "46", "n": "Money Laundering and Black Money", "id": "6-impact", "t": "6 · Impact", "x": "6 · Impact # Memory aid S E E P S Dirty money seeps everywhere: S ocial · E conomic · E nvironmental · P olitical · S ecurity (own mnemonic; headings in faculty order Social, Economic, Political, Security, Environmental) Impacts Social: illegal businesses strengthened, loss of social capital, power moves to criminals Economic (micro): institutions' reputation, higher business cost, organised crime up, policy distortion; (macro): tax evasion, EoDB, volatile exchange rates, market confidence, insurance premiums Political: state loses taxes, spends more on crime Security: terror funding, more crime Environmental: illegal wildlife trade, zoonotic disease risk (FATF 2020 report; trade $7-23 bn a year; India source of rhino horn, pangolin, tusks)"}, {"c": "46", "n": "Money Laundering and Black Money", "id": "7-challenges-and-way-forward", "t": "7 · Challenges and Way Forward", "x": "7 · Challenges and Way Forward # Memory aid S T A M P C B T S muggling · T ech evolution · A wareness lacking · M ultiple agencies · P redicate-offence law; then C onviction low · B anks skip KYC · T ax havens (own mnemonic) Current affairs Data: ED had 5,892 cases since 2015 but only 15 convictions (RS 2025; ≈4.6%). ED claims 93.33% on cases tried (56 of 60): \"high success on a tiny base\". The 2019 amendment made ML an independent offence (fixes predicate-offence challenge). Memory aid M O N E Y L A U N D E R (faculty) M onitoring transactions · O rganisational acceptance policy · N otifying suspicious transactions · E nforcement of KYC · Y ielding to compliance · L egalising and regulating crypto · A dvanced e-AML tools · U nified agency coordination · N PA management · D ue diligence · E nhanced information sharing · R egulation of international wires"}, {"c": "46", "n": "Money Laundering and Black Money", "id": "8-initiatives", "t": "8 · Initiatives", "x": "8 · Initiatives # Level Measures India: law PMLA 2002; FEMA 1999; Benami Transactions Act 1988 (amended 2016) India: regulators FATF compliance; RBI, SEBI, IRDAI India: agencies ED investigates and prosecutes; FIU-IND receives STRs; CBDT India: tech Project Insight; Central KYC Registry Global Vienna Convention 1988; Basel Statement 1988; FATF 1989 ; Council of Europe 1990; UN GPML 1997 (UNTOC, UNCAC); APG (41 members, India member); Wolfsberg Principles (11); IMoLIN; Egmont Group Memory aid V B F C U \" V ery B ig F ish C atch U nwary\": Vienna and Basel (1988) → FATF (1989) → CoE (1990) → UN-GPML (1997) (own mnemonic)"}, {"c": "46", "n": "Money Laundering and Black Money", "id": "9-pmla-2002", "t": "9 · PMLA 2002", "x": "9 · PMLA 2002 # Features Attachment and confiscation of proceeds of crime Schedule Part A and B list predicate crimes Criminal conspiracy; standalone offence Covers PEPs, VDAs, NPOs ; international jurisdiction for ED Issues Low conviction; ED outside CrPC; statements to ED admissible; S.45 twin bail ; reverse burden on accused; dilution of laws Memory aid P E N D 2023 amendment: P EPs covered · b E neficial owner threshold 25% → 10% · N GOs/NPOs brought in (NGO Darpan) · D ue diligence extended (records 5 years), VDAs covered (own mnemonic) Vijay Madanlal Choudhary (2022) Amendments valid as Money Bill S.3 read broadly: directly or indirectly, actually involved, connected with proceeds, untainted property Continuous crime (covers earlier offences) ECIR is not FIR ; ED need not share copy Twin bail: prosecutor heard; court must believe accused not guilty and unlikely to reoffend Memory aid P M L A (faculty) PMLA way forward: P rocedural reforms · M aintaining operational efficiency · L ist of scheduled offences (review) · A dding clarification on terms Current affairs Current affairs (verify): ED v. Bhupesh Arora (SC, 29 Sep 2026): quashing predicate FIR by compromise does not wipe out proceeds of crime; ED told to finish probe in 5 months. Sanjay Sureka v. ED (2026 INSC 1124, Oct 2026): S.19 arrest material to Adjudicating Authority \"immediately\" = expeditiously; 5-day delay held fine."}, {"c": "46", "n": "Money Laundering and Black Money", "id": "10-fatf", "t": "10 · FATF", "x": "10 · FATF # Note FATF : set up by G7 in 1989 ; issues 40 Recommendations ; Mutual Evaluation (effectiveness + technical compliance); poor performers on grey list (increased monitoring) or black list (call for action). Rec. no. Subject 1 Risk assessment, risk-based approach 3-4 ML offence; confiscation 10-12 Customer due diligence; record keeping; specific customers 14-15 PEPs; correspondent banking 24 Beneficial ownership of legal persons 29, 39 FIUs; extradition Memory aid U N F A I R C C W Terror-finance special recs (9): U N instruments · N PO · F reeze assets · A lternative remittance · I nternational co-op · R eport STRs; then C riminalise · C ash couriers · W ire transfers (own mnemonic). Handout says 8 (2001); 9th (cash couriers) added 2004. Current affairs FATF on India: on-site Nov 2023 → adopted June 2024 (Singapore) → report released 19 Sep 2024; \" regular follow-up \" (only 4 other G20: UK, Italy, France...); JAM trinity praised; previous review 2010, next 2031. Asked for stronger prosecution and NPO protection. June 2026 plenary: grey list + Bosnia & Herzegovina, Iraq; - Algeria, Namibia; black list unchanged (N Korea, Iran, Myanmar); UK presidency from 1 Jul 2026; India's Vivek Aggarwal incoming Vice-President (verify). Memory aid S L I P S Concerns in India's MER: S upervision gaps (DNFBPs, dealers in precious metals) · L egal/operational (28 convictions in 5 years; backlog) · I llegal activities (cyber fraud, corruption, drugs) · P EPs (no clear provisions) · S ecurity threats (ISIL, Al-Qaeda in J&K, LWE) (own mnemonic) Criticism of FATF process No formal rules; weak listing regime (wilful/non-wilful); absentees (Pakistan); low Global South representation; emerging tech not covered"}, {"c": "46", "n": "Money Laundering and Black Money", "id": "11-answer-frame-15-marks", "t": "11 · Answer Frame (15 Marks)", "x": "11 · Answer Frame (15 Marks) # Value addition Intro: definition + UNODC 2-5% GDP → Body: stages → techniques (old to latest) → impact (SEEPS) → legal framework (PMLA, FEMA, FIU, ED) → challenges → Way forward: MONEY LAUNDER + FATF + \"Beyond-Border Cooperation\" → Conclusion: balance enforcement with technology and international cooperation. Keep three layers: legal, institutional, technological."}, {"c": "46", "n": "Money Laundering and Black Money", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. PMLA S.3 defines? Money laundering Riskiest stage? Placement Beneficial owner threshold after 2023? 10% (from 25%) FATF set up by, when? G7, 1989 India FATF category? Regular follow-up Twin bail test limbs? Court believes not guilty and unlikely to reoffend ED conviction data? 15 of 5,892 (RS 2025) vs 93.33% of cases tried"}, {"c": "47", "n": "Foreign Contribution Regulation Act (FCRA)", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words FCRA 2010 : MHA regulates foreign money to NGOs and associations. Bill 2026 : handles assets after registration ends; lighter jail term; JPC reviewing. Courts: regulation valid but must be proportionate . Key term In plain words Vesting Transfer of foreign-funded assets to a government authority. Cessation Registration ending by non-renewal or rejected renewal (new in Bill). Key functionary Person who manages the organisation (director, trustee, office-bearer)."}, {"c": "47", "n": "Foreign Contribution Regulation Act (FCRA)", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Note FCRA 2010 regulates acceptance and use of foreign contribution and foreign hospitality by individuals, associations and companies. Administered by the Ministry of Home Affairs . Aim: stop foreign funds being used for activities detrimental to national interest (political mobilisation, religious activity, civil-society funding, money laundering, terror financing)."}, {"c": "47", "n": "Foreign Contribution Regulation Act (FCRA)", "id": "3-meaning-and-eligibility", "t": "3 · Meaning and Eligibility", "x": "3 · Meaning and Eligibility # Foreign contribution = donation by a foreign source of Article (except personal gifts within limit) Currency (Indian or foreign) Security (incl. foreign security) Interest or income earned on it is also foreign contribution NRI money from personal savings through normal banking is not foreign contribution (NRIs are Indian citizens) Who can receive? Person with a definite cultural, economic, educational, religious or social programme Includes individual, HUF, association, Section 8 company (only if registered non-profit with 3-year track record or explicit prior permission of MHA) Must hold FCRA registration or prior permission of the Centre"}, {"c": "47", "n": "Foreign Contribution Regulation Act (FCRA)", "id": "4-courts-on-fcra", "t": "4 · Courts on FCRA", "x": "4 · Courts on FCRA # Case Held Noel Harper v UoI (2022) SC upheld the main 2020 amendment provisions. Receiving foreign contribution is not an absolute right ; can be regulated for sovereignty, integrity and public order UoI v Sharma Centre for Heritage Education (2025) Madras HC: denial of renewal disproportionate where no misuse; SC declined to interfere Value addition Balance: strict regulation is constitutionally valid, but action must be evidence-based, fair and proportionate . Use this line in any NGO-regulation answer."}, {"c": "47", "n": "Foreign Contribution Regulation Act (FCRA)", "id": "5-the-fcra-amendment-bill-2026", "t": "5 · The FCRA Amendment Bill, 2026", "x": "5 · The FCRA Amendment Bill, 2026 # Why proposed Asset-management vacuum : vesting existed but no custody or disposal mechanism Expired registrations : unclear what happens to assets Suspension : no clarity on assets during suspension Multiple investigations by different agencies Disproportionate penalty : 5-year jail for general breach seen as excessive Prior permission : no time limits for receiving and using funds Existing Act Bill 2026 Certificate renewed every 5 years ; cancel or surrender only New concept of cessation : not renewed in time, no application, or renewal rejected Assets vest in prescribed authority on cancel/surrender Vesting extended to cessation; a Designated Authority covers assets made fully or partly from foreign money; provisional until renewal or restoration, else permanent No post-vesting framework Permanent assets: public use, transfer to government bodies, or disposal; sale proceeds and unused funds go to Consolidated Fund Nothing on places of worship Vested place of worship managed appropriately, religious character preserved Prior-permission funds: no time limit Must be received and used within the prescribed period Loose terms for office bearers Key functionary defined widely (Rule 2(1)(ca)): directors, partners, trustees, Karta, office-bearers, governing body No duty if body becomes defunct Last key functionaries must inform the Centre ; failure → permanent vesting General breach up to 5 years Max 1 year ; prior Central approval before investigating an offence Ban covers associations and companies making news/current affairs Widened to any person engaged in such activity"}, {"c": "47", "n": "Foreign Contribution Regulation Act (FCRA)", "id": "6-fcra-amendment-rules-2026", "t": "6 · FCRA Amendment Rules, 2026", "x": "6 · FCRA Amendment Rules, 2026 # Rules Activity and State-specific registration (purposes and States/UTs named) More reporting : project-wise and activity-wise use, website and social media, ultimate foreign donor Renewal : reasonable activity = at least ₹10 lakh used in previous 2 years Religious purposes more specifically defined Next instalment : activity-wise disclosure and 75% use of previous instalment, subject to field inquiry Current affairs Current affairs (verify dates): Bill referred to a 31-member Joint Parliamentary Committee after opposition and public pushback. FCRA 2.0 portal launched 30 June 2026 (revamp, cloud migration, process re-engineering)."}, {"c": "47", "n": "Foreign Contribution Regulation Act (FCRA)", "id": "7-significance-concerns-way-forward", "t": "7 · Significance, Concerns, Way Forward", "x": "7 · Significance, Concerns, Way Forward # Significance Clear management of foreign-funded assets (hospitals, schools, buildings) Traceability protects sovereignty and national security Accountability of assets , not only money flow Stops misuse by defunct entities Single Designated Authority ; digital governance (FCRA 2.0) Concerns Non-renewal may lose assets even if NGO simply stops foreign funding Mixed-funded assets : whole asset vests first (a hospital wing built with domestic plus foreign money is hard to split) Due-process gap : no prior hearing or statutory appeal if Centre refuses renewal Small NGOs burdened by ₹10 lakh test Way forward Proportionality : vest only the foreign-funded share Orderly exit route for NGOs that stop foreign funds Natural justice : reasoned order, hearing, appeal Risk-based regulation: serious diversion versus minor procedural lapse"}, {"c": "47", "n": "Foreign Contribution Regulation Act (FCRA)", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Who administers FCRA? Ministry of Home Affairs Section 8 company condition? 3-year track record or prior permission Noel Harper (2022)? SC upheld 2020 amendments; no absolute right to foreign funds 2026 Bill: jail for general breach? Cut from 5 years to 1 year Renewal minimum use (2026 Rules)? ₹10 lakh in preceding 2 years"}, {"c": "48", "n": "Trade-Based Money Laundering (TBML)", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words TBML hides dirty money in trade documents. Fix = share data across customs, banks and FIU. Key term In plain words Phantom shipment Paper trade with no goods moved. Hawala Informal value transfer outside banks. Egmont Group Network of FIUs that shares financial intelligence."}, {"c": "48", "n": "Trade-Based Money Laundering (TBML)", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Note FATF: misuse of trade transactions to disguise criminal proceeds and move value through the formal trade system, by misrepresenting price, quantity, quality, shipment or documents ."}, {"c": "48", "n": "Trade-Based Money Laundering (TBML)", "id": "3-methods-of-tbml", "t": "3 · Methods of TBML", "x": "3 · Methods of TBML # Method How it works Over / under-invoicing Inflate or deflate invoice value to shift value between importer and exporter Multiple invoicing Same shipment invoiced many times to justify repeated bank payments Phantom shipment Fake documents for goods that never move Misclassification Goods wrongly described to alter price, duty or scrutiny False description Quality, weight or quantity misstated Shell companies Front firms route funds and hide beneficial owners Why it is a serious threat (not just a customs offence) TBML : Organised crime · Drug trafficking · Terror financing · Capital flight · Customs duty evasion · Distorted trade data Note India angle: large trade volumes, high-value goods ( gold, gems, jewellery, electronics, machinery ), and informal channels like hawala ."}, {"c": "48", "n": "Trade-Based Money Laundering (TBML)", "id": "4-india-s-framework", "t": "4 · India's Framework", "x": "4 · India's Framework # Laws and bodies Laws: PMLA 2002, FEMA 1999, Customs Act 1962, RBI directions Agencies: ED, DRI, Customs, FIU-IND, RBI, DGFT, CBIC Authorised Dealer banks process trade payments; must spot suspicious patterns, not just check papers Value addition Core problem: banks see the money trail , customs sees the goods trail , enforcement sees the criminal trail . If they do not talk, TBML stays hidden. Challenges Valuation difficulty Shell-company networks; beneficial ownership opacity Jurisdictional barriers; fake documents Balance with ease of doing business Way forward: \"follow the goods, follow the money\" Integrate Customs, banking, GST, DGFT, FIU and company-ownership data for risk-based detection Use AI, price benchmarking, network analytics, anomaly detection"}, {"c": "48", "n": "Trade-Based Money Laundering (TBML)", "id": "5-fatf-best-practices", "t": "5 · FATF Best Practices", "x": "5 · FATF Best Practices # Practice Meaning Risk-based national assessment Include TBML in National Risk Assessment (sectors, commodities, routes) Data integration Cross-match STRs, customs, shipping, invoices, ownership data Public-private partnership Trade data is scattered across banks, shippers, traders, government Red flags FATF-Egmont indicators: business structure, trade activity, documents and commodities, account activity Customs-FIU cooperation Goods intelligence plus money intelligence; e.g. FIU-IND and SEBI MoU for database sharing Note Conclusion: legitimate commerce is being used for illicit finance; protecting financial integrity, revenue and internal security needs law, technology, customs intelligence, bank vigilance and international cooperation together."}, {"c": "48", "n": "Trade-Based Money Laundering (TBML)", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Six TBML methods? Over/under-invoicing, multiple invoicing, phantom shipment, misclassification, false description, shell companies Core detection gap? Money, goods and criminal trails sit in different agencies Approach? Follow the goods, follow the money"}, {"c": "49", "n": "Terror Financing and Black Money", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words Terror gets money from new tech, crime, laundering and sponsors (NOMS) . Answer = network approach + FATF + tech + KYC . Key term In plain words IS-K Islamic State Khorasan Province. TIEA Tax Information Exchange Agreement."}, {"c": "49", "n": "Terror Financing and Black Money", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Note Terror financing (UN Convention): any person who provides or collects funds, directly or indirectly, unlawfully and wilfully, intending or knowing they will be used for a terror offence. Money is used to recruit and support members, maintain logistics hubs, conduct operations . Memory aid N O M S Methods: N ew technology (crypto: IS-K asked Monero donations via Voice of Khorasan; digital assets, gaming, prepaid cards, dark web) · O rganised crime (kidnapping, narcotics, illicit oil, charcoal, diamonds, gold, organ and human trafficking) · M oney laundering (banks, SWIFT, hawala) · S ponsors (state sponsorship, crowdfunding, misuse of Zakat and NPOs, e.g. Global Relief Foundation) (own mnemonic; also \"No Money for Terror\")"}, {"c": "49", "n": "Terror Financing and Black Money", "id": "3-no-money-for-terror-conference-new-delhi", "t": "3 · \"no Money for Terror\" Conference, New Delhi 2022", "x": "3 · \"no Money for Terror\" Conference, New Delhi 2022 # Takeaways ~ 450 delegates ; reviewed global counter-terror-finance regime No \"good\" and \"bad\" terrorism: zero tolerance Fight terrorism as a network , not just a terrorist Impose costs on state sponsors ; isolate sympathisers Crime-terror links: global collaboration (UNSC, FATF, FIUs, Egmont) Technology: involve the private sector; do not demonise tech Delhi Declaration (UNSC CTC) on countering new tech for terror"}, {"c": "49", "n": "Terror Financing and Black Money", "id": "4-black-money", "t": "4 · Black Money", "x": "4 · Black Money # Quick map Sources: tax evasion, IPO/insider trading, shell companies, gold, corruption, tax havens, cash economy, hawala, illegal gambling Effects: lower FDI, parallel economy, policy distortion, inequality, security risk, inflated real estate, vicious cycle Government steps: Black Money Act 2015, Benami Act 2016, TIEAs, GST, IDS and PMGKY 2016, RERA, PAN, UPI, demonetisation Current affairs Data (from handout): ₹9.41-14.71 lakh crore (2015) · GFI: $38.7 bn/yr outflow (2002-11) · Swiss deposits CHF 3.83 bn (2021) · ~90% of black money lies inside India. Memory aid B L A C K Way forward: B etter regulatory framework · L everage technology · A wareness · C ooperation among agencies · K YC enforcement (faculty)"}, {"c": "49", "n": "Terror Financing and Black Money", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. NOMS expand? New tech, Organised crime, Money laundering, Sponsors Conference year and place? 2022, New Delhi BLACK expand? Better framework, Leverage tech, Awareness, Cooperation, KYC"}, {"c": "50", "n": "Cyber Security: Framework, Policy and Institutions", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words India has laws and bodies , but a fragmented framework and a skills gap. 2020 strategy: Secure, Strengthen, Synergise . Key term In plain words Zero trust No user or device trusted by default: authenticate and authorise every access. CII Critical Information Infrastructure."}, {"c": "50", "n": "Cyber Security: Framework, Policy and Institutions", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Current affairs Data: internet subscribers 1,092.79 m (Mar 2026; 1,028.61 m Dec 2025; wireless 1,046.26 m). Resecurity: data of 800 m+ Indians on dark web (Aadhaar-passport at $80,000 claim). 77 ransomware attacks in H1 2026 (2nd in APAC, 9th globally). 71% Indian firms saw AI-driven phishing/deepfakes. Cisco 2025: only 7% of Indian organisations \"Mature\". PwC: need ~ 1 million more professionals. 60% of power-sector equipment is Chinese. Note Cybersecurity (UN GGE 2015) = tools, policies, safeguards, risk management, training and technologies that protect the cyber environment and users' assets. CIA + N: C onfidentiality (eavesdropping) · I ntegrity (man-in-the-middle) · A vailability (DDoS) · N on-repudiation (digital signature). Elements Confidentiality (encryption, access control) · Integrity (hashing, signatures) · Availability (redundancy, DR) · Risk management · Network (firewall, IDS, VPN) · Endpoint (EDR) · Data (DLP) · IAM (RBAC, SSO) · Cryptography (PKI) · Incident response · Governance Why vulnerable Budget limits · imported equipment · complex networks · evolving threats (AI, social engineering, state-sponsored)"}, {"c": "50", "n": "Cyber Security: Framework, Policy and Institutions", "id": "3-issues-in-the-framework", "t": "3 · Issues in the Framework", "x": "3 · Issues in the Framework # Four categories Federal: police/public order = State List; cybersecurity not in Seventh Schedule; multi-statute; no integrated national security strategy Administrative: no procedural code for e-evidence; IT Act offences need Inspector+ ; vacancies; no cyber labs Technical: workforce, borderless and faceless , low cost-high return, weak telecom security Social: >80% use public Wi-Fi, 47% use VPN; weak PPP; SME costs"}, {"c": "50", "n": "Cyber Security: Framework, Policy and Institutions", "id": "4-initiatives", "t": "4 · Initiatives", "x": "4 · Initiatives # Evolution 2000 IT Act → 2004 NTRO (post-Kargil) → 2008 IT Act amended (cyber-terror) → 2013 NCSP → 2020 National Cyber Security Strategy → 2025 DPDP Rules, audit guidelines Type Items Legal IT Act 2000; NCSP 2013; NDCP 2018; NCSS 2020; Comprehensive Cyber Security Audit Policy Guidelines 2025 ; DPDP Rules 2025; National Cyber Security Coordinator Institutions CERT-In , NTRO , NCIIPC , I4C , NCCC , TDSAT, Cyber Swachhta Kendra ( M-Kavach, USB Pratirodh, AppSamvid, Browser JSGuard ) States Kerala, Cyberabad, Maharashtra, Karnataka, TN; Cyberdome (2019 PYQ) Other Cyber Surakshit Bharat, Cyber Warrior Police, Digital India Value addition NCRF (NCIIPC): non-binding; ≥ 10% of IT budget on cyber; board oversight; ISMS; CBDR ; regulator powers. DIP (DoT) real-time intelligence sharing; Chakshu on Sanchar Saathi to report fraud calls/SMS. NCSP 2013 vs NCSS 2020 NCSP 2013: secure ecosystem, assurance framework, 24x7 mechanisms, NCIIPC, indigenous tech, 5 lakh professionals in 5 years, fiscal benefits. Issues: poor implementation, weak critical-infrastructure focus, funding, coordination, civil liberties, only defensive NCSS 2020 (DSCI, Lt Gen Rajesh Pant): 21 areas; Secure (digitisation, supply chain, CII, payments, states, SMEs) · Strengthen (0.25-1% of budget; 15-20% of IT spend; R&D, drills) · Synergise (cyber insurance, cyber envoys , courts)"}, {"c": "50", "n": "Cyber Security: Framework, Policy and Institutions", "id": "5-international-and-way-forward", "t": "5 · International and Way Forward", "x": "5 · International and Way Forward # International UN Convention against Cybercrime adopted 24 Dec 2024 (first binding treaty); Budapest Convention (India, Russia, China critical); AU Convention (2014, in force 2023); Digital Geneva Convention (Brad Smith); Tallinn Manual (non-binding) Legal issues: silence of states, disagreements (IHL, self-defence, due diligence, countermeasures), attribution , accountability Way forward Resilience: response plans, roadmap, detection (IDS, SIEM), user education Institutions: ISOs/CSOs, real-life drills, relay CERT-In advisories, cyber minister (Australia) Innovation: cyber insurance, zero-trust ; mindset: \"not if but when\""}, {"c": "50", "n": "Cyber Security: Framework, Policy and Institutions", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. CIA+N? Confidentiality, Integrity, Availability, Non-repudiation NCIIPC protects? Critical information infrastructure UN Cybercrime Convention date? 24 Dec 2024 NCSS 2020 author? DSCI under Lt Gen Rajesh Pant"}, {"c": "51", "n": "Cyber Crime and Data Breaches", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words Cybercrime hits systems, data, people, networks . Reforms: CPA, negative registry, BNSS e-evidence, I4C . Key term In plain words Digital arrest Scam where fraudsters impersonate officials and \"arrest\" victims online. Ransomware Malware locking data until ransom is paid."}, {"c": "51", "n": "Cyber Crime and Data Breaches", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Note FBI: any illegal activity using a computer or networked device to access, transmit or store data or to damage it. Class Types (example) Software and system Hacking (SolarWinds 2020); malware (WannaCry 2017, 150 countries); SQL injection; XSS; drive-by Data compromise Identity theft; breaches (Capital One 2019) Social engineering Phishing (COVID lures); Twitter hack 2020 Harassment Cyberbullying, stalking, revenge porn/deepfakes Hardware and network DoS/DDoS (Mumbai grid 2020 per handout); MitM; bluebugging; IP spoofing; sniffing Southeast Asia scam hubs Cambodia, Myanmar, Laos; fake jobs and trading tips; ~ 500 Indians repatriated from KK Park (Myawaddy) late 2025; I4C: trading, digital arrest , investment, dating scams; Mandarin apps suggest Chinese link; inter-ministerial committee Current affairs IBM 2026: average breach cost $4.99 m (+12%); ransomware breach ~$5.13 m. Indian breaches: Aadhaar claims (2018, Oct 2023: 815 m), SBI 2019, Air India 2021 (4.5 m), RBI 2022, Zomato 2022 (17 m), HDFC 2023 (3 m), Flipkart 2023 (20 m), AIIMS (ransomware) Nov 2023, Angel One early 2025 (~8 m users), Tata Electronics June 2026 (630 GB claimed). Breach types Stolen credentials · social engineering (phishing most common) · ransomware · system vulnerabilities · SQL injection · human error/IT failure (~quarter) · physical compromise (skimmers)"}, {"c": "51", "n": "Cyber Crime and Data Breaches", "id": "3-standing-committee-on-finance-jayant-sin", "t": "3 · Standing Committee on Finance (jayant Sinha) 2023", "x": "3 · Standing Committee on Finance (jayant Sinha) 2023 # Recommendations Regulate third-party providers and big tech · secure payment systems · comprehensive legal framework · Cyber Protection Authority · help small banks/NBFCs · app stores share metadata · Central Negative Registry of fraud accounts · banks compensate fraud victims · stricter IT Act penalties and bail Way forward (handout) Institutions: MeitY + MHA; full I4C Law: BNSS, BNS, BSA — e-FIR, electronic records as primary evidence Technology: digital trials; DRDO National Malware Repository ; AI for defence/offence; 25 hubs under National Mission on Cyber Physical Systems People: education and campaigns; cyber diplomacy (Bletchley Declaration)"}, {"c": "51", "n": "Cyber Crime and Data Breaches", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Scam hub town 2025? KK Park, Myawaddy Cost of breach 2026? $4.99 m Finance committee chair? Jayant Sinha"}, {"c": "52", "n": "Cyber Warfare and Cyber Doctrine", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words Cyber = new domain of conflict ; India has DCA + joint doctrines . Gap: offensive doctrine and integration . Key term In plain words Cybered conflict Conflict short of war using cyber as a domain. APT Advanced Persistent Threat: long-term state-grade intrusion."}, {"c": "52", "n": "Cyber Warfare and Cyber Doctrine", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Note Cyber warfare (UNODC) = cyber acts that compromise critical infrastructure at the level of an armed attack; digital attacks on adversary networks to gain advantage. Low kinetic (weak parties: scanning, intrusion, malware) vs high kinetic (advanced powers: APTs, sabotage, DDoS). Incident Fact Estonia 2007 Bronze Soldier → banks, media offline Stuxnet 2010 Iran SCADA via USB Ukraine 2014 DDoS before Crimea Sony 2014 North Korea linked US OPM 2015 22 m records; China US election 2016 Russian information warfare India 2020 Mumbai grid outage (China-linked, per handout); Pakistan RATs 2021 Russia-Ukraine 2022 Wipers, DDoS; APT28/29 Stryker 2026 Wiper across 80,000 systems, 79 countries IP cameras 2026 14,000 cameras Ukraine/Russia Cyber arms race USA Cyber Command · S. Korea Cyber Warfare Command · UK, France Cyberforce · China unified units under CMC · India Defence Cyber Agency Evolution Estonia, Georgia, Stuxnet show state sponsorship; >60 states by 2015; US, China, Israel, Russia lead offence; none alone was an act of war → \"cybered conflict\" ; cyber = new domain"}, {"c": "52", "n": "Cyber Warfare and Cyber Doctrine", "id": "3-threats-to-india", "t": "3 · Threats to India", "x": "3 · Threats to India # China Espionage, Titan Rain, Ghostnet; unified CMC units; hacker recruitment Pakistan: low-level defacements; Pakistan Cyber Army breached CBI 2010 Global: Stuxnet hit 8% of Indian computers; 2012 attack on 10,000 officials; attacks +100% (2017-21) Way forward Traffic analysis · private/5G networks for C2 · train civilian hackers (MCTE, Signals) · integrate NTRO, DCA, DIA, DSRA for offensive ops · leverage IT industry"}, {"c": "52", "n": "Cyber Warfare and Cyber Doctrine", "id": "4-doctrine-and-dca", "t": "4 · Doctrine and Dca", "x": "4 · Doctrine and Dca # Current affairs Doctrines: IAF Basic Doctrine (cyber as cost-effective); 2017 Joint Doctrine ; 2018 Land Warfare Doctrine; Navy 2014 vision. CDS Gen Anil Chauhan released declassified Joint Doctrines for Cyberspace Operations on 7 Aug 2025. India still has no declared doctrine for international cyber operations (Arvind Gupta, 2016). Value addition Defence Cyber Agency: announced 2018 (Combined Commanders Conference) with space and special ops agencies; two-star head reporting to CDS via IDS; ~ 1,000 personnel from three services; joint cyber operations."}, {"c": "52", "n": "Cyber Warfare and Cyber Doctrine", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. DCA head rank? Two-star Joint cyber doctrine release? 7 Aug 2025 Stuxnet target? Iran nuclear SCADA"}, {"c": "53", "n": "DPDP Act 2023 and Digital Sovereignty", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words Consent-based , children protected, but state exemptions are wide and the Board is weak . Key term In plain words Data fiduciary Entity deciding purpose and means of processing. Data principal Person to whom the data relates."}, {"c": "53", "n": "DPDP Act 2023 and Digital Sovereignty", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Note Context: passed Aug 2023 after 5+ years of debate; first cross-sectoral personal data law. Applies to residents and businesses handling Indian residents' data; also abroad when offering goods/services to people in India. Feature Detail Consent Free, specific, informed, unconditional, unambiguous ; legitimate uses (state service, security, legal duty, medical emergency, disasters) Rights Summary; correction, completion, updating, erasure; grievance redress; nominate a person Fiduciary duties Safeguards; accuracy; breach notice to DPB ; erase on withdrawal; DPO; grievance system Children Parental consent under 18 ; no tracking or targeted ads SDFs Significant Data Fiduciaries: India DPO, impact assessments, audits Localisation Government may restrict transfers to notified countries; sector rules remain Penalty Up to ₹250 cr ; appeals to TDSAT ; S.37 blocking power Regulator Data Protection Board (no rule-making) instead of an independent authority"}, {"c": "53", "n": "DPDP Act 2023 and Digital Sovereignty", "id": "3-critical-analysis", "t": "3 · Critical Analysis", "x": "3 · Critical Analysis # Concerns State exemptions: S.7(b) consented-benefit data reuse; S.17(1)(c) law enforcement; S.17(2)(a) blanket for security, public order Discretion: S.17(5) exempt businesses (5 years); S.9(4) children's-data exemption without criteria DPB weak: only one legal expert; chairperson delegates; can't frame regulations Value addition Verdict (handout): modest and pragmatic but too discretionary; privacy depends on the government's commitment. Compare with the Srikrishna Committee 2018 draft (independent authority) — general knowledge, verify."}, {"c": "53", "n": "DPDP Act 2023 and Digital Sovereignty", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Max penalty? ₹250 cr Appeal body? TDSAT Age for parental consent? Under 18"}, {"c": "54", "n": "Social Media, Radicalisation and Fake News", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words Social media recruits, polarises and mobilises . Answer: IT Rules + NETRA + definitions + literacy . Key term In plain words Socmint Social media intelligence: AI to find hotspots. Echo chamber Group where only like-minded views circulate."}, {"c": "54", "n": "Social Media, Radicalisation and Fake News", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # Threats to internal security Misinformation (COVID) · recruitment (ISIS) · communal hatred (Delhi riots 2020) · cyberbullying · organised crime · espionage · protest mobilisation (Hong Kong, anti-CAA) · data breaches (Facebook 500 m, 2021) · insider threats (Twitter 2020) Radicalisation ladder Content creation (Dabiq, Rumiyah, Inspire) → Dissemination (YouTube, algorithms) → Targeting vulnerable (Twitter) → Grooming (WhatsApp, Telegram) → Echo chambers (Gab, Reddit) → Activation (lone-wolf calls) → Offline transition (Charlottesville) → Propagation and recruitment Current affairs India's measures: IT (Intermediary Guidelines and Digital Media Ethics Code) Rules 2021 (grievance, compliance, nodal officers; 24-hour takedown of certain content) · CCPWC portal · PIB Fake News/Fact Check · internet shutdowns (121 in 2019, highest in world) · NETRA (DRDO 2014, keyword detection used by IB and RAW) · social media labs. Global EU cooperation mechanism; AI filtering and Trusted Flagger (YouTube); Sri Lanka 2019 blocks; Europol IRU 86% removal; German NetzDG (up to €50 m); EU Internet Forum; Tech Against Terrorism ; Socmint; UK Prevent ; See Something Say Something"}, {"c": "54", "n": "Social Media, Radicalisation and Fake News", "id": "3-fake-news", "t": "3 · Fake News", "x": "3 · Fake News # Note Misinformation = inadvertent; disinformation = deliberate. Types: misleading, imposter, fabricated, false connection, false context, manipulated, satire (Claire Wardle). Blackbird.AI: 99.4% of 927,908 tweets in 47 languages were inorganic (#NoMeat_NoCoronavirus). Models: surplus information (validation by numbers) vs deficit information (lack of correct info). Law MeitY defines disinformation broadly but IT Act/penal code do not formally; S.505(1)(b) IPC and S.54 DM Act 2005 (used in COVID) are inadequate Memory aid F A K E N E W S Faculty: F ormal definitions · A wareness (#SayNoToFakeNews) · K nowledge (Alt News, Boom) · E nhanced legal framework · N ew tech (AI) · E ngagement with tech firms · W atchdogs (Press Council) · S wift response (MyGov, PIB Fact Check)"}, {"c": "54", "n": "Social Media, Radicalisation and Fake News", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. NETRA by? DRDO (2014) Shutdowns in 2019? 121 IT Rules year? 2021"}, {"c": "55", "n": "Role of External State and Non-State Actors", "id": "1-start-here-simple-words-and-key-terms", "t": "1 · Start here: simple words and key terms", "x": "1 · Start here: simple words and key terms # In simple words State + non-state actors combine; answer with multi-layer measures . Key term In plain words Proxy Non-state group armed and directed by a state."}, {"c": "55", "n": "Role of External State and Non-State Actors", "id": "2-overview", "t": "2 · Overview", "x": "2 · Overview # External state actors Non-state actors Military aggression: Galwan 2020 Drugs: Golden Triangle/Crescent syndicates Border disputes: Sir Creek, Kashmir, Arunachal Piracy: IOR Cross-border terror: 26/11, Pulwama 2019 Terror: ISIS in Kerala Cyber: 2020 grid; espionage (2 Chinese embassy staff expelled 2020) Human trafficking: 8 m Indians in modern slavery (GSI 2021) Propaganda by Pakistan MNCs: economic espionage, lobbying Insurgency: ISI support to ULFA etc. NGOs: foreign funding (Zakat Foundation 2019), extremism LWE, ethnic violence, hackers Value addition Answer line: the state/non-state boundary is blurred (proxies, front NGOs, mercenary hackers). Measures: border management, intelligence, UAPA/FCRA/FEMA, cyber defence, diplomacy (FATF, UN listing), community resilience."}, {"c": "55", "n": "Role of External State and Non-State Actors", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Two Chinese embassy staff expelled? 2020, espionage"}]</script><script>
(function(){var D=JSON.parse(document.getElementById('sdata').textContent),q=document.getElementById('q'),res=document.getElementById('res'),cnt=document.getElementById('cnt');
cnt.textContent=D.length+' sections indexed. Tables and diagrams are included as text where possible.';
function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function run(){var v=q.value.trim().toLowerCase();res.innerHTML='';if(v.length<2)return;var ts=v.split(/\s+/),n=0,h='';
for(var i=0;i<D.length&&n<40;i++){var d=D[i],tx=(d.t+' '+d.x).toLowerCase(),ok=ts.every(function(t){return tx.indexOf(t)>=0});if(!ok)continue;n++;
var p=tx.indexOf(ts[0]),s=Math.max(0,p-60),sn=d.x.substr(s,180);
h+='<div class="hit"><a href="geo-ch'+('0'+d.c).slice(-2)+'.html#'+d.id+'"><b>'+esc(d.t)+'</b></a><br><small>'+esc(d.n)+'</small><br>…'+esc(sn)+'…</div>'}
res.innerHTML=h||'<p class="prog">No matches.</p>'}
q.addEventListener('input',run)})();</script><script>/* Shared store: reading progress, preferences, optional cross-device sync. */
(function(){
var KEY='nbapp:v1',root=document.documentElement;
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function fresh(){return{v:1,prefs:{fs:1,lh:1.65,w:780,font:'serif',theme:'auto',pt:0},last:null,nb:{},days:{}}}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var S;
try{S=JSON.parse(lsGet(KEY))}catch(e){S=null}
if(!S||!S.v)S=fresh();
S.prefs=Object.assign(fresh().prefs,S.prefs||{});
// one-time import of the older done list and theme
if(!S.migrated){
  try{var od=JSON.parse(lsGet('nb-done')||'[]');od.forEach(function(n){var c=chap('modern-india',n);c.done=1;c.dt=1})}catch(e){}
  var ot=lsGet('nb-theme');if(ot&&!S.prefs.pt){S.prefs.theme=ot;S.prefs.pt=1}
  S.migrated=1;
}
function chap(nb,n){var b=S.nb[nb]||(S.nb[nb]={});return b[n]||(b[n]={read:{},done:0,dt:0,pos:null,t:0})}
var listeners=[],dirty=false,saveT=null,syncT=null;
function save(){
  dirty=true;clearTimeout(saveT);
  saveT=setTimeout(function(){lsSet(KEY,JSON.stringify(S));listeners.forEach(function(f){try{f()}catch(e){}});scheduleSync()},250);
}
function flush(){lsSet(KEY,JSON.stringify(S))}
function merge(a,b){ // a local, b remote; returns merged
  var o=fresh();
  o.prefs=((b.prefs&&b.prefs.pt||0)>(a.prefs&&a.prefs.pt||0))?Object.assign({},a.prefs,b.prefs):Object.assign({},b.prefs,a.prefs);
  o.last=(!a.last||(b.last&&b.last.ts>a.last.ts))?b.last:a.last;
  o.migrated=1;
  var ids={};Object.keys(a.nb||{}).concat(Object.keys(b.nb||{})).forEach(function(k){ids[k]=1});
  Object.keys(ids).forEach(function(id){
    o.nb[id]={};var ca=(a.nb||{})[id]||{},cb=(b.nb||{})[id]||{},ks={};
    Object.keys(ca).concat(Object.keys(cb)).forEach(function(k){ks[k]=1});
    Object.keys(ks).forEach(function(k){
      var x=ca[k],y=cb[k];if(!x||!y){o.nb[id][k]=x||y;return}
      var r=Object.assign({},x.read,y.read),done=(y.dt||0)>(x.dt||0)?y:x,pos=(y.t||0)>(x.t||0)?y.pos:x.pos;
      o.nb[id][k]={read:r,done:done.done,dt:done.dt||0,pos:pos,t:Math.max(x.t||0,y.t||0)};
    });
  });
  var dk={};Object.keys(a.days||{}).concat(Object.keys(b.days||{})).forEach(function(k){dk[k]=1});
  Object.keys(dk).forEach(function(k){o.days[k]=Math.max((a.days||{})[k]||0,(b.days||{})[k]||0)});
  return o;
}
var syncState='off';
function scheduleSync(){clearTimeout(syncT);syncT=setTimeout(function(){sync()},4000)}
var dbp=null;
function getRef(){
  if(dbp)return dbp;
  dbp=(async function(){
    if(!window.claude||!claude.use)return null;
    var db=await claude.use('db'),u=await claude.use('user');
    if(!db||!u||!u.id)return null;
    var id=await u.id();if(!id)return null;
    return db.doc('data/users/'+id+'/nbapp');
  })().catch(function(){return null});
  return dbp;
}
var busy=false;
async function sync(){
  if(busy)return;busy=true;
  try{
    var ref=await getRef();if(!ref){syncState='local';return}
    var snap=await ref.get(),rem=null;
    if(snap.exists){var d=snap.data();try{rem=JSON.parse(d.state)}catch(e){}}
    var m=rem?merge(S,rem):S;
    var changed=JSON.stringify(m)!==JSON.stringify(S);
    S=m;
    if(changed){flush();listeners.forEach(function(f){try{f()}catch(e){}})}
    var out=JSON.stringify(S);
    if(!rem||JSON.stringify(rem)!==out)await ref.set({v:1,updated:Date.now(),state:out});
    syncState='synced';
  }catch(e){syncState='local'}
  finally{busy=false}
}
var API={
  get:function(){return S},
  chap:chap,
  save:save,flush:flush,sync:sync,
  onChange:function(f){listeners.push(f)},
  syncState:function(){return syncState},
  setPref:function(k,v){S.prefs[k]=v;S.prefs.pt=Date.now();applyPrefs();save()},
  reset:function(){S=fresh();S.migrated=1;flush();save()},
  today:today,
  pct:function(nb,n,total){var c=(S.nb[nb]||{})[n];if(!c||!total)return 0;var r=0;Object.keys(c.read||{}).forEach(function(k){if(c.read[k])r++});return Math.min(1,r/total)},
  isDone:function(nb,n,total){var c=(S.nb[nb]||{})[n];if(!c)return false;if(c.dt)return !!c.done;return false}
};
window.NBS=API;
function applyPrefs(){
  var p=S.prefs;
  var th=p.theme;
  if(th==='auto')root.removeAttribute('data-theme');else root.setAttribute('data-theme',th);
  root.style.setProperty('--zoom',p.fs);root.style.setProperty('--lh',p.lh);root.style.setProperty('--pw',p.w+'px');
  root.setAttribute('data-font',p.font);
}
API.applyPrefs=applyPrefs;applyPrefs();
// studied time, counted while the page is visible and touched in the last minute
var lastAct=Date.now();
['scroll','pointerdown','keydown','touchstart'].forEach(function(e){addEventListener(e,function(){lastAct=Date.now()},{passive:true})});
setInterval(function(){
  if(document.hidden||Date.now()-lastAct>60000||!window.__NB)return;
  var t=today();S.days[t]=(S.days[t]||0)+15;save();
},15000);
document.addEventListener('visibilitychange',function(){if(document.hidden){flush();sync()}else{sync()}});
addEventListener('pagehide',flush);
setTimeout(sync,800);
})();
(function(){var b=document.getElementById('themebtn');if(!b)return;var o=['auto','light','sepia','dark'];b.addEventListener('click',function(){var t=NBS.get().prefs.theme,i=(o.indexOf(t)+1)%o.length;NBS.setPref('theme',o[i]);b.textContent='Theme: '+o[i]})})();
