. Govt servants must work in the public interest and answer for what they do or fail to do. Needs acceptance of responsibility (others may evaluate performance) and openness (transparent working, ways to hold officers accountable). Value addition Bureaucratic accountability has two aspects: Answerability = giving an account of actions taken or not taken; Enforceability = penalties or corrective measures for illegal, inadequate or improper performance. Values and objectives integrity: Values match actions Do not trade personal integrity for short-term gain impartiality and non-partisanship: Neutral in implementing policy Resist political pressure objectivity: Decisions on evidence Remove bias empathy and compassion: sensitivity to weaker and vulnerable sections objectives: Control abuse of power and discretion Ensure performance meets standards and quality Continuous learning and improvement Bring administration closer to democratic principles Institutional introspection (review internally, accept external scrutiny) Types OF Accountability Type Meaning Managerial within the administrative hierarchy, between superiors and subordinates Political civil servants answer to political executives, who answer to Parliament or legislature Judicial for unconstitutional or illegal actions Institutional / Horizontal enforced through external institutions such as CAG, CBI, CVC Professional through professional codes of ethics enforced by bodies such as the Bar Council or ICAI Social citizens directly hold civil servants accountable through RTI, Citizens' Charters, social audits and institutions such as Lokpal Key point Accountability requires administration to: make laws work as intended with minimum waste and delay · use discretion lawfully and sensibly · recommend new policies and changes in programmes when needed · raise citizen confidence in administrative institutions. To whom? internal hierarchy · legislature · judiciary · citizens and civil society · media. Intra-organisational hierarchy gives a superior-subordinate link Subordinates answer to superiors Senior officers to ministers, who answer to the legislature also called organisational accountability Inter / extra-organisational operates outside the department officials can face legal action for lapses or unlawful conduct executive is constitutionally accountable to the legislature citizens and media can question injustice, inaction, improper conduct Three Directions Horizontal : institutions within the State with power to seek explanations and impose penalties on other state actors (CAG, Election Commission, CVC, CIC, ombudsman) Vertical : citizens and civil society: elections, lobbying, participation in budgeting and policymaking, Citizen Report Cards, social audits Diagonal : citizens directly engage with horizontal-accountability institutions, e.g. PIL Other classifications Financial/fiscal: One of the oldest Scrutiny of financial records so spending is authorised and lawful Legislature exercises its power over the public purse May reveal corruption, kickbacks, misuse of welfare funds. World Bank says it needs: a working govt accounting system (expenditure control, cash management), an external audit system, and mechanisms to review audit findings and ensure corrective action Process: How agencies do their tasks Detects procedural irregularities (improper tenders, contracts, construction procedures) Programme: Results and effectiveness Spending is not enough, objectives must be met (poverty programmes: were beneficiaries correctly identified? did living standards improve?) Looks beyond efficiency to effective implementation Legal: Actions must comply with laws and judicial processes Court action and judicial review Professional: doctors, engineers etc. follow professional codes while protecting the larger public interest Political: Concerns legitimacy of programmes Administrators must recognise the authority of elected representatives to set priorities, allocate resources, ensure compliance with lawful decisions Social: citizens and civil society hold public institutions accountable, directly or indirectly (civic engagement) Moral: Core of public administration Goes beyond obeying laws and rules A moral official strives for moral government Rising administrative and political corruption raises demand for it World Bank: Micro -accountability = govt responsiveness to citizens receiving services Macro = financial accountability and accountability for overall economic performance Horizontal, vertical, diagonal Value addition Need for transparency and accountability: expanding govt role (growing, overlapping departments) · delegated legislation (more executive power) · politics-bureaucracy nexus (bureaucrats may become committed to a ruling party's agenda, not settled policy) · corruption (black money, opportunistic politics, scams) · limited popular participation (illiteracy, poverty, unemployment; benefits may not reach the needy; transparency lets citizens question misuse of money and power). How: several mechanisms together: traditional (ministerial control, debates, legislative committees, media, ombudsman) + New Public Management (efficiency, outcomes, competition, value for money, autonomy, partnerships, citizen orientation), which raise three questions: accountability for what (standards), to whom (agents), through what (means) . Mechanisms Institutions CVC: Set up Feb 1964 on Santhanam Committee advice Statutory status by CVC Act 2003 Independent vigilance body Monitors vigilance in the Central govt Advises organisations on planning, executing, reviewing, reforming vigilance Lokpal and Lokayuktas Act 2013: Lokpal at the Centre, Lokayuktas in states, to examine corruption allegations against specified public servants Lokpal selection committee = PM, Speaker of Lok Sabha, LoP in Lok Sabha, CJI or nominated SC judge, eminent jurist Whistle Blowers Protection Act 2014: Mechanism for complaints on corruption, wilful misuse of power or discretion Inquiry Safeguards against victimisation Public-interest disclosures to the competent authority (public servants included) Anonymous complaints not entertained CAG: Guardian of the public purse Checks expenditure was authorised and used for its purpose Independent of the executive Reports laid before Parliament, examined by committees incl. PAC Audits exposed irregularities in big spending and procurement social audit (examination of programmes with participation of citizens, esp. beneficiaries), RTI Act 2005, Citizens' Charters Modern performance audits and outcome budgeting: from input-output accountability to measuring real governance impact Social Audit 2.0: digital dashboards for real-time public participation in auditing programmes ethics committees: institutionalise ethical accountability in legislatures and ministries beyond financial audit data-driven vigilance cells: predictive analytics to spot anomalous transactions in public procurement e-governance platforms: CPGRAMS, PRAGATI improve accountability via digital grievance tracking and monitoring Issues unclear relationships: accountable for what, to whom, through which mechanism? size of govt: Distance between citizens and officials World Bank: expanding state functions make broad political accountability harder administrative secrecy behind complex rules excess focus on inputs (spending) over outputs and outcomes top-down enforcement through political leaders, institutions, superiors rather than directly by citizens bureaucratic power: need to control, supervise it, create institutional constraints new-age: Algorithmic/AI bias in welfare and policing (opaque algorithms) Platform governance (data privacy, misinformation, monopoly) Decentralised social media (propaganda, hate speech, unclear responsibility) PPPs may diffuse blame between agencies and contractors Solutions decentralisation (World Bank): stronger local govt improves responsiveness for infrastructure and services resilient mechanisms for complex settings with competing interests and limited resources compliance with rules, laws, professional codes bottom-up accountability: social audits and participation complement top-down adapt to digitalisation value-driven responsibility: beyond procedural oversight to a culture based on public values ethical capacity building: ethical literacy, adaptive governance, citizen-centric evaluation institutionalise ethical governance: internalise accountability beyond fear of sanctions technology with human oversight to prevent algorithmic opacity Note Handout flag: the CVC and Lokpal selection committees are different. CVC: PM, Home Minister, LoP . Lokpal: PM, Speaker, LoP, CJI/nominee, jurist . Memory visuals for this section Mnemonic · Dimensions of accountability C H A I Debate accountability over CHAI. C Controlling political power H Human A Argumentative I Informational"}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "12-citizen-s-charter-and-sevottam", "t": "12 · Citizen's Charter and Sevottam", "x": "12 · Citizen's Charter and Sevottam # Handout only · M1 p.28-31 Exam lens Priority: High. Mains PYQs quoted: 2024, 2018, 2013. Prelims PYQs quoted: none quoted in the material. Prelims hooks Launched 1991 by John Major government (UK); creates no new rights Seven elements of an Indian charter By end 2011: 131 central, 729 state charters; goicharters.nic.in Sevottam: 2nd ARC, launched 2006; pilots 2009-10; IS 15700:2005 (BIS); three modules; seven steps UK Charter Mark scheme Mains hooks Problems with the Indian programme and suggestions ARC-II recommendations Sevottam: significance, challenges, way forward Commit only to what you can deliver, say who is accountable, and measure it through someone outside. In simple words A Citizen's Charter is an organisation's public promise on quality and time of service. It started in 1991 under the John Major government (UK). It creates no new rights ; it enforces existing ones. The Indian charter lists vision, services, clients, grievance machinery, what clients must bring and compensation. By 2011 there were 131 central and 729 state charters. Problems: bureaucratic mindset, little consultation, no penalties, low awareness, jargon, same format for all. Fixes: separate charters per service, wide consultation, outside monitoring, incentives, simple language. Sevottam (Seva + Uttam) is the quality framework from the 2nd ARC (2006), certified by IS 15700:2005. Three modules: charter implementation, grievance redress, service-delivery capability. Seven steps: define services and clients; set standards; build capability; perform; monitor; evaluate impact; improve continuously. Term In plain words DARPG Department that hand-holds departments in making their first charters. IS 15700:2005 BIS standard that certifies the Sevottam symbol. A Charter promises quality and time for existing rights. India's charters fail because of limited consultation, no penalties, low awareness, over- or under-tight standards and jargon. ARC-II and Sevottam (2006) supply the fix: separate charters, realistic commitments, redressal, feedback, outside review. Value addition Launched 1991 by John Major (UK). Declaration of commitment on qualitative and temporal entitlements ; creates no new rights , seeks to enforce existing ones; includes grievance redress. Purposes Clarifies what to expect from govt Makes govt more responsive Creates a service orientation instead of a master mindset people's participation: a good charter is built on consultation with client groups and citizens: a key element of democracy strengthens accountability: Without timelines and standards it is hard to hold anyone accountable With quality standards and a quantifiable timeline, performance can be measured and performers told from non-performers pro-active approach to good governance (a govt-side initiative) image and credibility: if commitments are met, citizens are satisfied and trust is restored empowerment and democracy: people participate and can hold govt accountable for services development instrument if charters cover every entitlement-based scheme with timelines civil servants must follow Elements (India) vision and mission statement (deliver services on time and with quality) details of business transacted (all services listed so citizens get clarity) details of clients served services given to each client group , with timeline procedure grievance redressal machinery and how to access it if service is not delivered as promised expectations from clients: produce documents, pay fees on time Compensation , if any, when service is not delivered as promised Consumer organisations, citizen groups, stakeholders involved in drafting Regular internal and external monitoring, evaluation, review mandated Key point By 2011-end: 131 central and 729 state charters · site goicharters.nic.in . Problems PYQ 2024PYQ 2018PYQ 2013 Why charters fail bureaucratic mindset limited consultation: Should consult stakeholders, client groups and street-level staff Else it degenerates into a manager's or secretary's charter no penal provisions: If commitments go unmet there should be penalties Without them staff are not pushed and departments get overburdened citizens are hardly aware of it Standards too lax or too strict become unrealistic and erode confidence Timelines should be stepwise for each service (too long or impossible-short both erode trust) some charters too detailed, some too brief: long enough to inform, short enough to be read names and addresses of grievance redressal officers missing in many charters (found by external agencies or NGOs) no incentives at individual or organisational level (UK Charter Mark fosters inter-department competition; DARPG hired an outside professional agency for this) delays: Senior officials took existing brochures and manuals to be charters DARPG then directed departments to draft separate charter commitments needs of senior citizens, disabled, others ignored (charters treat all alike; sub-categories needed for quicker service) poor review and updating (should draw on complaints and suggestions at the grievance desk) inadequate devolution to street-level staff: check workload and workforce, give powers and resources to deliver without countersignature from above technical jargon , not in vernacular languages same format used for all services of a ministry, hurting timelines and quality Way forward / key point Suggestions: DARPG hand-holding for first charters (officials posted in each department; start ad hoc, learn, update) · more spending on awareness; fund credible NGOs · persistent effort for attitudinal change · user groups and staff mandatory in drafting · built-in monitoring and review, preferably by an outside agency · prioritise services, not all at once · incentives at organisation and individual level (UK Charter Mark) · showcase and replicate best practices · simple language, not too detailed · 5-year master plan with budget . Sevottam = SEVA + Uttam Sevottam IN FOUR Steps Seva + Uttam (service + excellence); conceived by 2nd ARC , launched 2006 Piloted in 10 key departments (2009-10) Evolved into IS 15700:2005 (BIS): certifies organisations with the Sevottam symbol if they show robust service management systems Three core modules: Charter · Grievances · Service delivery capability Core module Focus Citizen Charter implementation mechanism to implement charters; public feedback shapes service delivery norms and expectations Public grievance redressal responsive, empathetic system that builds public trust regardless of the outcome Service delivery capability build internal capacity (processes, resources, workforce) for consistent, efficient delivery Step Meaning (handout) Define services, identify clients state range of services; map diverse needs of citizen groups Set standards and norms measurable benchmarks on quality, accessibility, timeliness Develop organisational capability strengthen HR, infrastructure, technology to empower frontline staff Perform to achieve standards institutionalise adherence at every operational level Monitor performance real-time tracking to catch gaps early Evaluate impact independent evaluation of effectiveness and citizen satisfaction; feeds policy refinement Continuous improvement feedback-driven innovation and upgrading of delivery Way forward / key point Significance: structured quality management : self-assessment and performance improvement (e.g. 2025 DARPG national workshop, Bhopal, on quality benchmarking) · citizen-centric culture (expectations, grievances, feedback built into workflows) · sustainable reform through continuous improvement · credible self-assessment : ministries use its tools to align internal accountability with citizen satisfaction. Note Challenges: officials see it as procedural compliance , not reform (low sensitisation, capacity-building) · fragmented, inconsistent rollout across ministries · weak digital integration (no real-time feedback, timeline tracking, dynamic self-assessment). Way: mandatory training and embed in strategy, not just certification; link with CPGRAMS, MyGov , dashboards; periodic third-party audits and structured citizen feedback. Memory visuals for this section Mnemonic · Sevottam: seven steps in order D S D P M E I Do Something Daily; People Must Expect Improvement. D Define services, identify clients S Set standards and norms D Develop capability P Perform to standards M Monitor performance E Evaluate impact I Improve continuously A sequence, so the order is kept. Mnemonic · ARC-II recommendations on charters W H O C A R E Citizens ask \"WHO CARE(s)?\" ARC-II answers with seven fixes. W Widest consultation H Hold officers accountable (penal provisions) O One size does not fit all C Commit to what you can deliver A Appropriate redressal R Reform internal processes E Evaluate periodically with end-user feedback Charter to Sevottam"}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "13-rti-act-2005-and-the-2019-amendment", "t": "13 · RTI Act 2005 and the 2019 Amendment", "x": "13 · RTI Act 2005 and the 2019 Amendment # Handout only · M1 p.31-35 Exam lens Priority: Medium. Mains PYQs quoted: 2020. Prelims PYQs quoted: none quoted in the material. Prelims hooks Sweden first RTI (1766); USA second (1966); Shourie Group 1997; FOI Bill 2002 passed (Act) but never notified; Tamil Nadu first state 1997 Penalty Rs 250/day up to Rs 25,000 16 types of information within 120 days; PIOs within 100 days; transfer in 5 days; third party notice 10 days; 30 days to respond Copyright is the only absolute exemption; Act is retrospective; exempt categories released after 20 years CIC (2013) on political parties; BCCI public authority (CIC, 2018); judiciary covered (SC, 2019) Mains hooks RTI 2019 amendment: autonomy of Information Commissions (negative and positive) Public authority disputes: judiciary, political parties, PPP, BCCI Rights conferred on citizens Maximum disclosure, minimal exemption: the amendment tests whether independence survives executive control. In simple words Sweden had the first RTI law (1766), the USA second (1966). In India the right is read into Articles 19(1)(a), 21, 39(b) and 39(c) ; cases: Rajnarain 1975, S.P. Gupta 1982. Demand grew from advocacy and from the MKSS in Janawad, Rajasthan ('Humara Paisa, Humara Hisab'). Formula: Monopoly + Discretion - Transparency = Corruption. Path: Tamil Nadu 1997 -> Freedom of Information Bill 2002, passed but never notified (feeble) -> RTI Bill drafted by the National Advisory Council, passed as the RTI Act 2005. Mechanics: anyone can ask, no reason needed; public authorities publish 16 types of information within 120 days and appoint PIOs within 100 days; misdirected requests transfer within 5 days. Section 8 lists exemptions (security, foreign relations, trade secrets, Cabinet papers and so on) but a public-interest override applies. Copyright of a person other than the State is the only absolute exemption. 2019 Amendment : the Centre now decides tenure and pay of information commissioners; they are statutory, not constitutional. Term In plain words PIO Public Information Officer, who receives and answers requests. Suo motu disclosure Information a public authority must publish on its own. Second Schedule Agencies outside RTI, though corruption and human-rights information must be given. Number card · RTI numbers 1 6 · 1 2 0 · 1 0 0 · 5 · 1 0 · 2 0 Disclose 16 items in 120 days; PIOs in 100; transfer in 5; third party 10; release after 20 years. 16 Types of suo motu information 120 Days to publish them 100 Days to designate PIOs 5 Days to transfer a misdirected request 10 Days for third-party notice 20 Years before exempt records are released Penalty: Rs 250 a day up to Rs 25,000. Reply within 30 days. RTI is not codified but read into Arts 19(1)(a), 21, 39(b), 39(c). The MKSS movement (Janawad, 'Humara Paisa, Humara Hisab') fed the NAC-drafted 2005 Act: maximum disclosure, minimal exemption, appeals, penalties, proactive disclosure. Section 8 exemptions, public authority disputes and the 2019 amendment are the live questions. 1766 Sweden: first RTI law 1966 USA second Note Ombudsman: the institution behind Lokpal and Lokayukta began in Sweden , first ombudsman 1809 . India: Lokpal Bill passed 2013 (became an Act); Lokpal body constituted 2019. Value addition Constitutional locus: not categorically codified ; Preamble ideals (liberty, justice, democracy) amply support it; SC read it into Art 19(1)(a), Art 21, Art 39(b), 39(c) . Cases: Rajnarain 1975 , S.P. Gupta 1982 . \"Data is the new oil\": Art 39 (equitable distribution of resources: material resources of the community distributed to serve the common good; no concentration of wealth) can support RTI because resources and wealth today must be seen as data and information , not only material resources. Madison (4th US President): popular government without popular information, or the means of acquiring it, is but \"a Prologue to a Farce or a Tragedy; or, perhaps, both\". Why demand grew growing democratisation: Far more democracies than 3-4 decades ago Many ex-colonies adopted democracy in the 20th century advocacy: international (World Bank, IMF, Transparency International , a Berlin-based NGO with the annual Corruption Index) and domestic ( NCPRI 1996 led by Aruna Roy , PUCL, ADR) MKSS brought transparency to grassroots panchayats Famous event at Janawad village, Rajasthan Slogan \" Humara Paisa, Humara Hisab \" Memory aid · MONOPOLY Monopoly + Discretion − Transparency = Corruption. Adding transparency through RTI checks corruption. Benefit of RTI How (handout) Corrects power asymmetry huge gap between govt power and citizen power leaves citizens helpless; RTI is the key tool to know the status of developments Realises other rights a citizen must know the benefits to claim them (e.g. entitlements under the Food Security Act) Citizen participation awareness of govt work lets citizens comment, give feedback, suggest improvements Corrects trust deficit perception that all civil servants are corrupt; RTI gives status of development work within 30 days Better, faster decisions departments must keep records properly or face monetary or departmental action; easier retrieval, timely decisions Shields civil servants from unwarranted pressure of seniors or ministers to act illegally: orders must be documented and answerable with proof 1997 first time: Centre sets up working group under H.D. Shourie ; states went ahead: Tamil Nadu first state (1997) 2002 Freedom of Information Bill, 2002 (Shourie group draft) enacted but never notified or implemented ; critics: feeble 2005 RTI Act 2005 : bill prepared not by bureaucrats but by the National Advisory Council Key point Philosophy (Preamble of RTI Act): RTI supports transparency, checks corruption, enforces accountability, empowers citizens and promotes democracy, balancing this with genuine concerns of govt confidentiality , without seriously compromising govt efficiency . MAIN Features Right and scope all citizens have the right information defined very broadly: any material in any form: records, documents, memos, e-mail, opinions, advice, press releases, circulars, orders, logbooks, contracts, reports, papers, samples, models, electronic data, and info on any private body held by a public authority under any other law Right covers info held by or under control of a public authority, incl. right to inspect work, documents, records Take notes, extracts, certified copies Take certified samples Get info in electronic form or printouts public authority: Body or institution of self-government set up by/under the Constitution, by Parliament or state-legislature law, or by govt notification/order Includes bodies owned, controlled or substantially financed and NGOs substantially financed (directly or indirectly) by govt funds \" substantially \" not defined in the Act (ARC made recommendations) Contested body Handout position President / Governors long-pending question: are they part of the definition of public authority? State federations (BCCI) substantially financed by govt; they resisted; many came under the definition through judicial pronouncements; Law Commission recommended BCCI be a public authority, CIC affirmed 2018 PPP projects DoPT circular 2013: info to be public even though many PPPs are substantially financed by private firms; DIAL 2010: CIC held it a public authority (typical PPP); Delhi HC stayed the order Judiciary Subhash Agrawal (2009) asked about the 1997 judges' resolution to declare assets; SC said it was not covered; CIC ruled against SC (2019); SC went to Delhi HC, which sided with CIC; SC in 2019: judiciary by and large covered Political parties CIC 2013: recognised parties meet the substantial-financing test (IT exemptions, free airtime on state media, land at subsidised prices); not stayed or nullified by courts, yet parties still do not comply, citing sub judice Note Problematic SC observations (handout): info held by RBI about scheduled commercial banks is open to disclosure, yet in 2019 the court said RBI need not disclose banks' risk-evaluation and inspection reports (despite bank scams); extensive RTI use has created \" fear psychosis and paralysis \" in govt; civil servants' personal status (name, address, physical and mental status), professional records, assets and liabilities are beyond RTI; names of recruitment interviewers need not be disclosed. Objections to covering parties: free associations of people; do not use tax money directly; lack infrastructure for RTI; parties would use it against each other. Electoral bonds money is not subject to disclosure; money above that through proper channels goes to the EC and is public. Procedure: THE Numbers PATH OF A Request Apply: any citizen, no reason ; fee waived for BPL and when time is missed PIO replies in 30 days; transfers a wrong request in 5 Refusal or delay → complaint to CIC/SIC Penalty and disciplinary action Exemptions (Sec 8) AND Override Exempt info prejudicial to sovereignty and integrity , security, strategic, scientific, economic interests of the State, relations with a foreign state, or inciting an offence Expressly forbidden by a court or tribunal Contempt of court breach of privilege of Parliament and state legislatures commercial confidence, trade secrets, IP that would harm a third party's competitive position, unless a competent authority finds larger public interest info held in a fiduciary relationship (same larger-public-interest test) info received in confidence from a foreign government would endanger physical safety or reveal a confidential source for law enforcement or security would impede investigation, apprehension or prosecution Cabinet papers incl. deliberations of CoM, Secretaries, officers But decisions of the CoM, reasons and material become public after the matter is complete (exempt matters stay exempt) personal information with no link to public activity or interest, or an unwarranted invasion of privacy, unless larger public interest justifies it Value addition Public-interest override: despite the Official Secrets Act 1923 and the Sec 8(1) exemptions, access may be allowed if the disclosure outweighs the harm to protected interests. Only absolute exemption: copyright held by a person other than the State. Parliament test: what cannot be denied to Parliament cannot be denied to citizens. Second Schedule: Act does not apply to listed intelligence and security agencies, but info on allegations of corruption and human-rights violations must still be given (human-rights info only after the Information Commission's approval); investigating agencies were not listed, but CBI and NIA were added by executive order . Third-party info: notice and hearing first ( 10 days ). Act prevails over the OSA 1923 and any other inconsistent law; no court can entertain a suit about an order under the Act except by appeal under the Act; wholly retrospective (covers info held before the Act too). Exempt info is released after 20 years , except Cabinet decisions, legislature-privilege matters, and info affecting sovereignty and integrity, security, strategic, scientific, economic interests, foreign relations or inciting an offence. Rights AND THE 2019 Amendment PYQ 2020 Key point Rights of citizens: right to information · choose the medium of request · choose the language (English, Hindi or local language of the application) · help in writing the request · no reason or personal details beyond contact details · told immediately if the request is transferred to another authority · help in accessing records if disabled · all fees waived for BPL · all fees waived if the authority misses the time limit · reasons for rejection, appeal period, appellate authority details · complaint to CIC/SIC if: cannot submit to PIO/APIO, refused access, no response in time, unreasonable fee, incomplete, misleading or false info, or any matter on accessing records. 2019 change Effect Tenure and appointment Central Govt decides tenure of CIC and ICs; five-year term removed Salary and service Govt empowered to fix salaries, allowances, service terms; delinked from CEC and ECs Autonomy concern excess central control seen as weakening Commissions' independence Status CIC is statutory, not constitutional Value addition Negative: executive overreach (control of tenure and salary reduces independence) · public distrust (citizens may hesitate to file RTIs, fearing bias) · federal dilution (SICs lose autonomy under central oversight). Way forward / key point Positive: administrative flexibility (adjust tenure, salary) · fiscal discipline (cost-effective pay, free of EC benchmarks) · policy alignment (central oversight may streamline RTI nationwide). Reflect: balances efficiency with independence but risks overreach; impact depends on how responsibly the government uses these powers. In the news (Saarthi IAS CA; verify dates) NSE and RTI: SC stayed a Delhi HC order that held NSE a public authority. Hook: \"substantially financed\" is undefined (BCCI, parties, DIAL). Memory visuals for this section Mnemonic · Criteria for a sound RTI regime P A I D Citizens have PAID for the information (\"Humara Paisa, Humara Hisab\"). P Penalties: Rs 250 a day up to Rs 25,000 A Access wide: minimal fees, free for BPL I Independent appeal: CIC and SICs D Disclosure maximum, exemption minimal How an RTI request travels"}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "14-cic-rti-issues-impact-and-2nd-arc", "t": "14 · CIC, RTI Issues, Impact and 2nd ARC", "x": "14 · CIC, RTI Issues, Impact and 2nd ARC # Handout only · M1 p.36-38 Exam lens Priority: Medium. Mains PYQs quoted: 2020. Prelims PYQs quoted: none quoted in the material. Prelims hooks CIC + up to 10 ICs; selection: PM, LoP (LS), Union Cabinet Minister nominated by PM Notified tenure: 3 years or age 65, no reappointment; IC-to-CIC total max 5 years Salary: CIC Rs 2,50,000, IC Rs 2,25,000 per month 95% penalty gap (Satark Nagrik Sangathan); 2.55 lakh pendency in 26 ICs; avg disposal 1 year 11 months; 21 of 29 ICs filed no report 2019-20 2nd ARC: 1% of flagship funds; 4 regional CIC offices; 50% operating cost for 3 yrs or Rs 1 crore = substantially financed Mains hooks Issues and challenges in RTI implementation Impact of RTI 2nd ARC recommendations: OSA repeal, classification, selection of ICs RTI is a means; access is the end, and the gap between them is capacity, will and records. In simple words The Central Information Commission has one Chief Information Commissioner and up to ten Information Commissioners, appointed by the President on a committee of the PM, the Leader of Opposition and a Union Cabinet Minister. Under the 2019 Rules: tenure 3 years or age 65, no reappointment; CIC Rs 2,50,000, IC Rs 2,25,000 a month; salary delinked from CEC/EC. Problems: no specific budget, low awareness, penalties rarely used (not imposed in 95% of due cases), pendency (2.55 lakh in 26 ICs; average disposal 1 year 11 months), missing annual reports, vacancies. Impact: grievance redressal, exposure of corruption and wasteful spending, a national movement behind Right to Food and Education. 2nd ARC fixes: repeal the Official Secrets Act, oath of transparency, CJI on the selection committee, regional CIC offices, 1% of flagship funds for RTI, awareness through NGOs. Term In plain words Pendency Cases or requests waiting for disposal. Classification of secrets Top Secret, Secret, Confidential, Restricted by damage on exposure. Number card · CIC numbers 1 + 1 0 · 3 / 6 5 · 5 One chief plus up to ten; 3 years or 65; never past 5 years in all. 1+10 Chief IC and up to 10 ICs 3 / 65 Years or age, whichever is earlier 5 Years total if an IC becomes CIC 2.5 L CIC pay a month (IC 2.25 L) RTI Rules 2019. No reappointment. RTI: problems and cures CIC composition, selection and removal are spelled out, with the 2019 Rules making tenure 3 years or age 65 and salary Rs 2.5 lakh. The weakness is delivery: pendency, penalty gaps, vacancies, awareness and record keeping. 2nd ARC prescribes structure, funding and secrecy reform. Central Information Commission Appointment appointed by the President on the recommendation of a committee: PM (Chair), Leader of Opposition (Lok Sabha), a Union Cabinet Minister nominated by the PM eminent persons with knowledge or experience in law, science, social service, journalism, mass media, public administration, etc. during tenure: no office of profit, no link with a political party, no business Value addition Tenure and pay (RTI Rules 2019): Centre decides tenure by notification; currently 3 years or age 65, whichever is earlier ; Centre prescribes pay and service conditions by rules, delinked from CEC/EC parity · CIC Rs 2,50,000, IC Rs 2,25,000 a month; allowances and conditions are set by the Centre, not embedded in the parent RTI Act . After 2019: tenure and service conditions are no longer codified in the Act but set by executive rules ; CIC remains statutory, not constitutional , limiting safeguards. Removal Mnemonic · Removal without a Supreme Court inquiry B I C E P The President can remove on BICEP grounds without an SC inquiry. B Bankrupt: adjudged insolvent I Infirmity of body or mind C Conviction involving moral turpitude E Employment: paid work outside duties P Prejudicial financial interest Same five for the CVC; the Lokpal list has four (no conviction). CIC: appointment and removal The President removes CIC or an IC on proved misbehaviour or incapacity after a Supreme Court inquiry (on the President's reference) This SC safeguard is retained without SC inquiry the President may remove if: Declared insolvent Convicted of an offence involving moral turpitude In paid employment during tenure Physically or mentally unfit Holds a financial or other interest likely to affect duties prejudicially Issues AND Challenges Gaps means vs end: RTI Act is a means to information There is a gap between the right to information and actual access bureaucratic mindset: RTI is an accountability tool, so bureaucracy resists it no specific budget: no separate funds (2nd ARC: 1% of flagship scheme funds to upgrade RTI infrastructure) absence of political will: bill well drafted and globally appreciated, but hesitancy in bureaucracy and later politicians weakened will to empower it (many exposed scams hurt the govt of the day) limited awareness (APWC study: only 12% of women, 26% of men, 13% rural, 33% urban aware) vague terms and phrases in the law hamper implementation ICs dominated by retired bureaucrats : impartiality affected Enforcement penal provisions rarely applied: Satark Nagrik Sangathan found no penalty in 95% of cases where one was due Retired bureaucrats allegedly have a soft corner for the govt machinery no organic CIC-SIC relationship: a national collaboration platform is needed PIO duty added without incentive: no separate person hired, an officer with other principal duties gets extra burden, so low motivation juniors appointed PIOs to interpret the law: officers of sufficient seniority needed poor record keeping causes delay (suggested: specialised record-keeping agency to advise and train) abuse of Schedule II: many bodies listed against the spirit of the law IC orders not implemented: ICs have no contempt powers Pendency An estimated 40-60 lakh RTI requests are filed a year Delay defeats the spirit of the law because RTIs serve contemporary needs 2.55 lakh cases pending in 26 ICs Vacancies in IC posts add delay Average disposal about 1 year 11 months COVID worsened it annual reports (to be laid before the legislature): 21 of 29 ICs did not submit for 2019-20 SICs of AP and Telangana have not published since 2017 and Odisha since 2015-16 waning interest : media, activists, civil society must keep generating awareness but interest is fading Way forward / key point Impact: besides transparency it became a grievance-redressal tool · exposed corruption, wasteful expenditure, scams, junkets, false narratives, recruitment results and marks · rural sections gained access, largely through NGO help · became a national movement aiding Right to Food, Right to Education movements · more successful for personally relevant information; falls short where controversial info of large public interest is involved. 2nd ARC Recommendations Secrecy repeal the Official Secrets Act replace oath of secrecy with oath of transparency Periodically review Second Schedule to stop list inflation Drop bodies not needed Classification norms are laid down by MHA and not public Public Records Act 1993 mandates a 5-year review of top secret, secret, confidential files for declassification or downgrade, but procedure and norms are also not public, so govt discretion must be checked Classification Damage Top Secret exceptionally grave Secret serious Confidential simple Restricted official use only Structure and access selection of ICs: Selection committee to include the CJI instead of the Union Cabinet Minister At least half of IC members from non-civil-service background access: 4 regional CIC offices Organisations with more than 1 PIO to name a nodal PIO PIOs in the Central Secretariat at least Deputy Secretary or Director Payment by stamps or postal orders Single-window agency in each district to receive requests for all PIOs Suo motu disclosure in print, free for reference records and funds: Independent public records office (Centre and states) as technical repository One-time 1% of all flagship programme funds for 5 years for RTI infrastructure and manuals Training for civil servants, not just PIOs Awareness campaigns through credible NGOs CIC and SIC to issue ready reckoners National Coordination Committee chaired by the CIC for an organic CIC-SIC link \"substantially financed\" = receiving 50% of operating costs for 3 years or at least Rs 1 crore of govt funding Bring such bodies under RTI Steps to check frivolous complaints"}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "chapter-timeline", "t": "Timeline", "x": "Timeline # 1765 East India Company coins 'Civil Services' (combatant vs non-combatant) (M1 p.5) 1766 Sweden: first country to provide a right to information (M1 p.31) 1809 Sweden appoints the first ombudsman (M1 p.31; M2 p.15) 1909 Nine All India Services (M1 p.7) 1919 GoI Act 1919 provides for a Federal PSC (provincial PSCs not mandatory) (M1 p.3) 1924 Lee Commission; AIS reduced to four (M1 p.3, 7) 1926 FPSC established; Sir Ross Barker first Chairman (M1 p.3) 1928 Nehru Committee Report not keen on AIS (M1 p.7) 1929 Madras: first Provincial PSC (M1 p.3) 1935 GoI Act 1935: FPSC, PPSC, JPSC (M1 p.3) 1947 AIS reduced to two (M1 p.7) 1957 Mundhra scandal: Finance Minister and Finance Secretary resign (M1 p.14) 1964 CVC set up as an executive body (Feb 1964) (M1 p.26; M2 p.13) 1966 First ARC opposes strikes by civil servants; wants unlawful strikes a penal offence (M1 p.17) 1973 Hanumanthaiah-Ganguli conflict (Railway Minister vs Railway Board Chairman) (M1 p.14) 1987 Rajiv Gandhi vs Foreign Secretary A.P. Venkateswaran (Sri Lanka policy) (M1 p.14) 1991 Citizen's Charter launched by the John Major government (UK) (M1 p.28) 1993 Public Records Act: 5-year review of classified records (M1 p.37) 1995 Nolan Committee principles; TI Corruption Perception Index begins (M1 p.18; M2 p.7) 1996 National Campaign for People's Right to Information (Aruna Roy) (M1 p.32) 2001 Civil Services Examination Review Committee (M1 p.6) 2002 Freedom of Information Bill enacted but not implemented (M1 p.32) 2003 CVC Act (statutory CVC); UNCAC; PMLA (M1 p.26; M2 p.9, 11) 2005 RTI Act (drafted by the National Advisory Council); IS 15700:2005 standard (M1 p.30-32) 2006 Sevottam launched (conceptualised by the 2nd ARC) (M1 p.30) 2009-10 Sevottam piloted in ten departments (M1 p.30) 2012 NDSAP; Magnitsky Act (US) (M1 p.22; M2 p.4) 2013 Lokpal Bill passed (Lokpal and Lokayuktas Act, 2013); T.S.R. Subramanian case; CIC: political parties under RTI; DoPT PPP circular (M1 p.9, 22, 26, 33; M2 p.15) 2014 Whistle Blowers Protection Act; DSPE Sec 6A struck down (M1 p.27; M2 p.6) 2015 UPSC Chairman seniority convention violated; Whistleblower amendment bill (lapsed) (M1 p.3; M2 p.19) 2019 RTI Amendment Act; Lokpal constituted (Justice P.C. Ghose); SC: judiciary by and large under RTI (M1 p.33, 35; M2 p.15) 2020 Mission Karmayogi (NPCSCB); SC brings deemed universities under PCA (M1 p.19; M2 p.20) 2021 31 lateral entry posts advertised; Essential Defence Services Bill (M1 p.7, 17) 2024 Aug: UPSC advertises 45 lateral posts; 20 Aug: DoPT asks UPSC to cancel, drive cancelled (M1 p.7) 2025 DARPG National Workshop in Bhopal on Sevottam (M1 p.31) 2026 8th CPC reference date 1 January 2026 (M1 p.16)"}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "side-by-side", "t": "Side by side", "x": "Side by side # Public servants vs civil servants (M1 p.5) Civil servants Public servants Meaning Government staff in the civil services; term coined by the East India Company around 1765 Broader category Includes All India, Central, State and Municipal services Also political executives, judiciary, defence forces, PSU employees Accountability: direction of pressure (M1 p.24-26) Form Who acts Examples Horizontal State institutions on other state actors CAG, EC, CVC, CIC, ombudsman Vertical Citizens and civil society Elections, lobbying, budget participation, report cards, social audits Diagonal Citizens directly engage horizontal bodies PIL Intra-organisational Subordinate to superior to minister to legislature Hierarchy Micro vs macro (World Bank) Micro: responsiveness to service users. Macro: financial and economic performance Pre-2019 vs post-2019 Information Commissions (M1 p.35-36) Feature Before the 2019 Amendment After Tenure Five-year term in the Act Centre notifies; now 3 years or 65 Salary Linked to CEC and ECs Fixed by the Centre (CIC Rs 2.5 lakh, IC Rs 2.25 lakh) Conditions In the parent Act Executive rules Status Statutory Statutory; clarified as not constitutional"}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "flows", "t": "Flow charts", "x": "Flow charts # Why Indian civil services resist change (Section 2) Aristocratic personnel system: sharp grade divide, narrow age band, general-ability exams, cadre-based Closed career: conservative, status quoist, rule fetishism, rank over competence Elitist mindset: obstacles to change Plus: traditional education, limited mobility, political failure, poverty Result: slow pace of social change Fix: lateral entry, specialisation after 10-12 years An RTI request, step by step (Section 13) Citizen files a request in English, Hindi or local language; no reason needed; BPL free Received by the PIO/APIO (designated within 100 days of the Act) Misdirected request transferred within 5 days; applicant told immediately Third-party information: notice and hearing, 10 days Information due in 30 days; fees waived if time limits are missed Refusal needs reasons, appeal period and appellate authority Complaint to CIC/SIC; penalty Rs 250 a day up to Rs 25,000 Sevottam: seven steps (Section 12) Define services and identify clients Set standards and norms Develop organisational capability Perform to achieve standards Monitor performance Evaluate impact Continuous improvement How corruption is produced and checked (Sections 13, 15, 16) Monopoly + Discretion - Transparency = Corruption Add transparency: RTI (information in 30 days), proactive disclosure, NDSAP Add participation: social audit, Citizen Report Cards, jan sunwai Add enforcement: CBI, CVC, Lokpal, PCA 1988 (2018) Add protection: Whistleblower Act 2014 Result: corruption is controlled, not eliminated ('wicked problem') Who can use which accountability tool (Section 11) Within the hierarchy: managerial and intra-organisational accountability Between state institutions: horizontal (CAG, EC, CVC, CIC, ombudsman) Citizens and civil society: vertical (elections, report cards, social audits) Citizens engaging institutions directly: diagonal (PIL) Beyond the state: global standards (TI, HDI, SDGs, Ease of Doing Business)"}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "traps", "t": "Traps", "x": "Traps # Common mix-ups and the rule for the exam hall Trap What goes wrong, and the rule FPSC: Act year is not set-up year The 1919 Act provided for a Federal PSC; it was set up in 1926 on the Lee Commission (1924). Madras (1929) was the first provincial PSC. Rule: when asked 'set up', use the establishment date, not the Act date. UPSC is constitutional but not equal UPSC is listed among four important constitutional bodies yet has no separate oath and an easier removal process. Convention on the Chairman broken in 2015. Rule: independence is protected by pay and removal rules, not by status. AIS counts by date Nine AIS in 1909, four in 1924, two in 1947, three today (IAS, IPS, IFoS). Rule: pin the number to its year before choosing. Which article is which Art 312 creates AIS; 315-323 cover PSCs; 309-311 service conditions, tenure, dismissal; 323A administrative tribunals; Art 16 equality in public employment. Rule: Arts 309-311 = the servant, 315-323 = the Commission, 312 = the All India Service. Steel Frame and Father of AIS Lloyd George used 'Steel Frame' for the Imperial Civil Service. Patel is the Father of All India Services. Rule: the phrase and the person are different people. Political vs policy neutrality Political neutrality does not mean policy neutrality. Officers advise intellectually, not emotionally. Rule: understand politics, do not play politics. Horizontal accountability lists differ Module 1 names CAG, CBI and CVC in one table and CAG, EC, CVC, CIC, ombudsman in another. Rule: name CAG and CVC always; add the rest as asked. Citizen's Charter and rights A Charter creates no new rights; it enforces existing ones. Launched in the UK in 1991. Sevottam: 2nd ARC concept, launched 2006, IS 15700:2005, pilots 2009-10. Rule: Charter = promise; right = already existing. RTI numbers 5 days: transfer; 10 days: third-party notice; 30 days: reply; 100 days: designate PIOs; 120 days: publish 16 types; 20 years: release exempted records; Rs 250 a day up to Rs 25,000. Rule: write the unit with each number. The only absolute RTI exemption Copyright held by a person other than the State is the only absolute exemption. Sec 8(2) lets public interest override the rest; the Second Schedule agencies still owe information on corruption and human rights. Rule: 'absolute' appears only with copyright. First country and first state Sweden 1766 (RTI) and 1809 (ombudsman); USA second (1966); Tamil Nadu first state RTI law (1997); Maharashtra first Lokayukta (1971). Rule: Sweden twice, USA second."}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "connects", "t": "Connects to", "x": "Connects to # §3 All India Services → §15 The Problem of Corruption Article 311 and the Doctrine of Pleasure resurface as a legal factor behind corruption: protection that makes dismissal hard. §3 All India Services → §5 Working and Performance of Civil Services T.S.R. Subramanian (2013) answers the 'arbitrary transfers and short tenures' problem. §1 Civil Services: UPSC and SPSC → §17 CBI and CVC UPSC's conflict with the CVC is listed as an issue; CVC's selection, term and pay mirror UPSC's. §2 Civil Services: Meaning and Lateral Entry → §6 Bureaucracy and Development Lateral entry and the generalist-specialist debate return as 'greater importance to generalists' among the paradoxes. §4 Role of Civil Services in Democracy → §11 Accountability The anonymity role is eroded by social audits, RTI and Citizens' Charters, which are the social accountability tools. §4 Role of Civil Services in Democracy → §16 Tackling Corruption and Social Audit Policy evaluation by the implementer is a conflict of interest, which is why social audits matter. §5 Working and Performance of Civil Services → §16 Tackling Corruption and Social Audit Corruption in street-level bureaucracy is tackled by digitisation, CCTV and social audit. §6 Bureaucracy and Development → §15 The Problem of Corruption Red tape, secrecy and file fetishism (Babu culture) reappear as administrative factors behind corruption. §8 Civil Services Reforms and Nolan Principles → §9 Challenges to Reform; Mission Karmayogi; Aarambh The reform list (training, appraisal, domainisation) is what Mission Karmayogi tries to institutionalise. §8 Civil Services Reforms and Nolan Principles → §2 Civil Services: Meaning and Lateral Entry Mainstreaming lateral entry is a reform item; the 2018, 2021 and 2024 episodes show the difficulty. §9 Challenges to Reform; Mission Karmayogi; Aarambh → §12 Citizen's Charter and Sevottam Both are capacity-building responses: Karmayogi for the officer, Sevottam for the office. §10 Transparency and NDSAP → §13 RTI Act 2005 and the 2019 Amendment NDSAP's negative list is built on RTI Sections 8 and 9; transparency tools meet at the RTI Act. §10 Transparency and NDSAP → §14 CIC, RTI Issues, Impact and 2nd ARC 2nd ARC wants the Official Secrets Act repealed, which links transparency to secrecy law. §11 Accountability → §12 Citizen's Charter and Sevottam Citizen's Charter is a social accountability mechanism. §11 Accountability → §17 CBI and CVC Accountability section lists CVC, Lokpal, Whistle Blowers Act, CAG; Module 2 gives their detail. §12 Citizen's Charter and Sevottam → §16 Tackling Corruption and Social Audit Charter, social audit and report cards all strengthen the demand side of governance. §13 RTI Act 2005 and the 2019 Amendment → §16 Tackling Corruption and Social Audit MKSS jan sunwais at Janawad led to the RTI Act 2005. §13 RTI Act 2005 and the 2019 Amendment → §18 Lokpal in India Sweden is the root of both RTI (1766) and the ombudsman (1809), which became Lokpal. §13 RTI Act 2005 and the 2019 Amendment → §19 Whistleblower Protection and the PCA 1988 RTI Act overrides the Official Secrets Act; the 2015 whistleblower amendment bill proposed the opposite. §14 CIC, RTI Issues, Impact and 2nd ARC → §13 RTI Act 2005 and the 2019 Amendment 2019 amendment details (tenure, pay) reappear in the CIC section; same facts, different angles."}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Constitutional part dealing with civil services Part XIV, Articles 308 to 323. When was the FPSC set up, and who was the first Chairman? 1926, on Lee Commission (1924) advice; Sir Ross Barker. Two ARC models to shorten the exam cycle I: Prelims and Mains together over 2-3 days. II: shortlist 2-3 times vacancies; Mains within two months. Why is the UPSC not on an equal footing with EC, CAG, SC? No separate oath; easier removal. Type I and Type II error in recruitment Type I: wrong person recruited. Type II: right person rejected. Who coined 'Civil Services', when, and why? The East India Company, around 1765, to separate combatant from non-combatant personnel. Who is a public servant but not a civil servant? Political executives, the judiciary, defence forces and PSU employees. What did the Third Pay Commission rename? Class 1, 2, 3, 4 became Group A, B, C, D. Aug 2024 lateral entry advertisement UPSC advertised 45 posts: 10 Joint Secretaries and 35 Directors/Deputy Secretaries. What is provincialisation of an All India Service? Abolition of the service; states become responsible for recruiting personnel for that part of administration. Who used 'Steel Frame', and for which service? David Lloyd George, for the Imperial Civil Service. AIS were later called the Steel Frame of India. Father of All India Services Sardar Patel; AIS got constitutional status under Article 312. Number of AIS over time 9 (1909), 4 (1924), 2 (1947), 3 today: IAS, IPS, IFoS. Which commission asked to disband the AIS? The Rajamannar Commission. The Sarkaria Commission called disbanding a retrograde step. T.S.R. Subramanian case (2013): headline asks Minimum guaranteed tenure in key posts; Civil Services Boards for postings and transfers; avoid verbal orders; a comprehensive Civil Services Law. Three forms of confidence in political neutrality Confidence of people, of ministers, of civil servants. Bhaskar Ghose's three bureaucrats Neither Wilt nor Tilt; Incorrigibly Corrupt; Weather Report Readers. Lakhina Experiment Dr. Lakhina (Ahmednagar, 1980s) colour-coded files by year; grassroots activism. The 3Ms of global monoculture MTV (fast music), Macintosh (fast computers), McDonald's (fast food). Four functions of the civil services in the handout Policy formulation, policy implementation, policy evaluation, administrative adjudication (plus continuity in administration). Why does policy evaluation by civil servants raise concern? Conflict of interest: officers evaluate programmes they implemented. Hence the weight on social audits. Street-level bureaucracy Lower-level officials who deal directly with citizens; corruption here is a cause of poor performance. Rajiv Gandhi's leakage figure 16 paise of every rupee reaches the people. Fitment factor formula Revised Basic Pay = Existing Basic Pay x Fitment Factor. Seven Nolan Principles Selflessness, integrity, objectivity, accountability, openness, honesty, leadership. Mission Karmayogi in one line 2020 NPCSCB: rules-based to roles-based; iGOT, competency frameworks, performance management, Karmayogi Bharat, Capacity Building Commission. Aarambh Initiative Common Foundation Course; Commitment, Character and Conduct. OECD vs UNESCAP idea of transparency OECD: objectives, decisions and rationale given in a comprehensible, accessible, timely way. UNESCAP: decisions follow rules; information freely and directly accessible to those affected. Three metaphors of transparency Public value (counter corruption); open decision-making (secrecy vs privacy); tool of good governance. NDSAP 2012: nodal department and purpose Department of Science and Technology; shares non-sensitive government data in machine-readable form on the OGD Platform. Social accountability tools named Social audits (MGNREGA), public expenditure tracking, Citizen Report Cards, public hearings. Three components of accountability Answerability, enforcement, responsiveness. Horizontal vs vertical vs diagonal accountability Horizontal: state institutions (CAG, EC, CVC, CIC). Vertical: citizens. Diagonal: citizens engage institutions directly (PIL). Who launched Citizen's Charter and when? John Major government (UK), 1991. It creates no new rights. Sevottam: three modules Citizen Charter implementation; public grievance redressal; service delivery capabilities. First country with RTI Sweden, 1766 (USA second, 1966). RTI read into which articles? 19(1)(a), 21, 39(b), 39(c). Cases: Rajnarain 1975; S.P. Gupta 1982. MKSS slogan and place 'Humara Paisa, Humara Hisab'; Janawad, Rajasthan. Corruption formula in RTI section Monopoly + Discretion - Transparency = Corruption. Penalty for denying information Rs 250 a day up to Rs 25,000, plus disciplinary action. When do exempted records become releasable? After 20 years, except Cabinet, legislative privilege and sovereignty/security-type categories. CIC composition and appointing committee One Chief Information Commissioner and up to ten ICs; committee: PM (Chair), Leader of Opposition (LS), a Union Cabinet Minister nominated by the PM. CIC tenure and salary under RTI Rules 2019 3 years or age 65, whichever is earlier; no reappointment. CIC Rs 2,50,000 and IC Rs 2,25,000 per month. RTI pendency figures 2.55 lakh pending in 26 ICs; average disposal 1 year 11 months; 21 of 29 ICs had not filed the 2019-20 report. Classification of secret documents Top Secret (exceptionally grave), Secret (serious), Confidential (simple), Restricted (official use only). Public Records Act 1993: 5-year declassification review."}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts in Start Here)"}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards Mains answer skeletons One for each Mains PYQ quoted in the material that the notes can support, then practice questions. Tap to open; try the answer first. 2024 · 15 marks · The Citizens' charter has been a land mark initiative in ensuring citizen-centric administration. But it is ye… Question. The Citizens' charter has been a land mark initiative in ensuring citizen-centric administration. But it is yet to reach its full potential. Identify the factors hindering the realisation of its promise and suggest measures to overcome them. A Charter commits an organisation to quality and time standards for existing rights (UK, 1991); it creates no new rights. Factors: limited consultation (manager's charter), no penal provisions, low awareness, standards too lax or strict, no names of redressal functionaries, no incentives, weak review, no devolution to street-level staff, jargon and no vernacular Measures: separate charter per unit and service, widest consultation, commit only to what can be delivered, redressal mechanism, periodic evaluation with end-user feedback, penal provisions Institutional: outside-agency review, Charter Mark-type incentives, Sevottam (IS 15700:2005), digital link with CPGRAMS Close. A charter works when promises are realistic, owned by frontline staff and measured by someone outside. 2020 · 150 words marks · \"Institutional quality is a crucial driver of economic performance\". In this context suggest reforms in Civil … Question. \"Institutional quality is a crucial driver of economic performance\". In this context suggest reforms in Civil Service for strengthening democracy. Quality civil services (a key institution) support performance and democracy. Recruitment: lateral entry, psycho-social profile, probation Training and competency: mid-career training, Mission Karmayogi (rules to roles) Appraisal and tenure: outcome-based, 360-degree, stable tenure Openness: RTI, Citizens' Charters, social audit; Nolan Principles Close. A competent, neutral and accountable service is the institution that carries democracy to citizens. 2020 · 10 marks · \"Recent amendments to the Right to Information Act will have profound impact on the autonomy and independence … Question. \"Recent amendments to the Right to Information Act will have profound impact on the autonomy and independence of the Information Commission\". Discuss. The RTI Amendment Act 2019 moved tenure, salary and service conditions of the CIC and ICs from the Act to executive rules. What changed: Centre decides tenure (five-year term removed); fixes salary and conditions, delinked from CEC and ECs; CIC clarified as statutory Negative: executive overreach, public distrust, federal dilution of SICs Positive: administrative flexibility, fiscal discipline, policy alignment Now: tenure 3 years or age 65; CIC Rs 2.5 lakh, IC Rs 2.25 lakh; removal still needs SC inquiry Close. The impact turns on how responsibly the government uses its new powers. 2018 · 15 marks · Citizens' Charter is an ideal instrument of organizational transparency and accountability, but it has its own… Question. Citizens' Charter is an ideal instrument of organizational transparency and accountability, but it has its own limitations. Identify the limitations and suggest measures for greater effectiveness of the Citizens Charter. A Charter makes standards and timelines public, so performers can be told from non-performers. Limitations: no penal provisions, limited consultation, unrealistic standards, awareness gap, no incentives, brochures taken as charters, poor review Measures: hand-holding by DARPG for first charters, mandatory user and staff involvement, outside monitoring, simplified language, 5-year master plan with budget Sevottam adds three modules (charter, grievance redress, service capability) Close. Transparency of promise must be matched by consequence for failure. 2017 · 250 words marks · Initially Civil Services in India were designed to achieve the goals of neutrality and effectiveness, which se… Question. Initially Civil Services in India were designed to achieve the goals of neutrality and effectiveness, which seems to be lacking in the present context. Do you agree with the view that drastic reforms are required in Civil Services? Comment. Neutrality (class, cultural, political) and effectiveness are both strained. Neutrality: middle-class mindset, political pressure, Ghose's 'weather report readers', politicised transfers Effectiveness: average DC tenure about one year, poor training (one in five trained), no quantifiable appraisal, 'hire, but no fire' Reform: tenure security and Civil Services Boards (T.S.R. Subramanian 2013); comprehensive Civil Services Law; 360-degree appraisal; domainisation; lateral entry Mission Karmayogi: roles-based competency, iGOT, outcome-based appraisal Close. Reform needs to be continuous and structural, not drastic: protect neutrality, reward results. 2016 · 12.5 marks · Effectiveness of the government system at various levels and people's participation in the governance system a… Question. Effectiveness of the government system at various levels and people's participation in the governance system are inter-dependent. Discuss their relationship with each other in context of India. Participation tools turn citizens into monitors of government performance. Social audit, Citizen Report Cards, public hearings, public expenditure tracking improve service quality and deter corruption Charters and RTI give citizens the information to participate; MKSS jan sunwais led to RTI AP SSAAT and Bengaluru report cards show effectiveness gains; participation in Charter design is a 'key element of democracy' Limits: low awareness (RTI), no trained auditors, digital divide Close. Effective government invites participation, and participation keeps government effective. (Partial fit: notes cover participation tools, not a theory of the relationship.) 2014 · not printed marks · Has the cadre-based Civil Services organization been the cause of slow change in India? Critically examine. Question. Has the cadre-based Civil Services organization been the cause of slow change in India? Critically examine. Cadre-based, closed career services are part of what the handout calls an aristocratic personnel system. Features: sharp grade divide, narrow age band, general-ability exams, class preference, cadre-based services Consequences: conservative, status quoist, non-responsive, rule fetishism, rank over competence, elitist, obstacles to change Other causes listed: traditional education, conservative attitudes to women, limited mobility, failure of the political system, poverty Fixes: lateral entry, specialisation after 10-12 years, domainisation Close. The cadre system is a major brake on change, but not the only one; reform of services must go with political and social reform. 2013 · 10 marks · Though Citizen's charters have been formulated by many public service delivery organizations, there is no corr… Question. Though Citizen's charters have been formulated by many public service delivery organizations, there is no corresponding improvement in the level of citizens' satisfaction and quality of services being provided. Analyze. By end 2011 there were 131 central and 729 state charters, but numbers are not outcomes. Charters without penalties or incentives do not change behaviour Standards set without checking resources and workload lose public confidence Charters not known to citizens; jargon; same format for all services Weak review and updating; grievance functionaries not named Fix: ARC-II 'commit to what you can deliver', reform internal processes, hold officers accountable Close. Satisfaction follows delivery capacity, not the number of charters issued. Practice · Evaluate Mission Karmayogi as a shift from rules-based to roles-based civil services management. Launched in 2020 as the National Programme for Civil Services Capacity Building. Components: iGOT Karmayogi, competency frameworks, outcome-based performance management, SPV Karmayogi Bharat, Capacity Building Commission Gains: competency over tenure, real-time feedback beyond ACRs, on-demand training Challenges: lateral-entrant integration, mindset shift, Centre-State coordination, digital access Link to Aarambh: Commitment, Character, Conduct Close. Success depends on continuous implementation, not a one-time launch. Practice · Should civil servants have the right to strike? Discuss with reference to the Essential Defence Services Bill 2021. The Bill barred strikes in essential defence services including 41 ordnance factories. For: collective protest, protection from exploitation, last resort Against: public interest (loaded gun), model citizens, government as fair employer First ARC (1966): penal offence; SC: no fundamental, statutory or equitable right Close. Distinguish essential from non-essential services rather than ban or permit across the board. Practice · Sevottam is more than a certification. Discuss its significance and the challenges in implementation. 2nd ARC concept, launched 2006; BIS standard IS 15700:2005. Three modules and seven steps Significance: structured quality management, citizen-centric culture, continuous improvement, self-assessment Challenges: seen as compliance, fragmented adoption, weak digital integration Way forward: training, link to CPGRAMS and MyGov, third-party audits Close. Sevottam works when it is a management system, not a badge."}, {"c": "2", "n": "Corruption, Social Audit, CBI, CVC, Lokpal, Whistleblowers and PCA", "id": "1-the-problem-of-corruption", "t": "1 · The Problem of Corruption", "x": "1 · The Problem of Corruption # Handout only · M2 p.3-8 Exam lens Priority: High. Mains PYQs quoted: 2016, 2019, 2014. Prelims PYQs quoted: none quoted in the material. Prelims hooks TI definition; Elephant Test; CPI since 1995 (0 most corrupt, 100 least) Black, white, grey; grass-eating vs meat-eating; coercive vs collusive; retail vs policy Legal factors: Art 311, PCA Sec 19, CrPC Sec 197, DSPE Sec 6A (Vineet Narain 1997; struck down 2014), PCA Sec 17A (2018) 2020 CPI: New Zealand, Denmark least corrupt; Somalia, South Sudan last; Bhutan 24th, USA 25th, Botswana 35th, China 78th, Pakistan 124th Global Corruption Barometer; PETS (World Bank); Paulo Mauro: investment differential up to 12% Mains hooks Behaviour that harms public interest (non-performance of duty as corruption) Factors behind corruption: psycho-social, economic, legal, administrative, political Implications: social, economic, political, security, international Why poverty is not the only cause; powerful and affluent also corrupt Corruption is an elephant: recognised by society even when it cannot be defined, and fed by opportunity and discretion. In simple words Corruption is old: Kautilya's Arthashastra lists ways civil servants can be corrupt and how to contain it. Defining it is hard: is a gift a bribe? Culture matters (UK school ties, US lobbying, Russia's Blat, China's Guanxi). TI: 'private abuse of public office'; the Elephant Test : hard to define, easy to recognise. Types: black, white and grey; grass eating and meat eating; coercive and collusive; retail (petty) and policy (grand). Costs: social divisions and insecurity, lower investment (Mauro: up to 12%), diverted spending, brain drain, security risks, mass unrest. Causes: psycho-social (THYMOS, Squirrel Nuts Syndrome), economic (poor pay, licence-permit raj), legal (Article 311, PCA Sec 19, CrPC Sec 197), administrative (red tape), political (no will, money power). Measuring it: TI's Corruption Perception Index (0 = most corrupt, 100 = least corrupt, annual since 1995), the Global Corruption Barometer and the World Bank's PETS. Term In plain words Speed money White corruption: recognised as corrupt but tolerated. Squirrel Nuts Syndrome Corruption by officials close to retirement. THYMOS Need for respect and recognition. Mnemonic · Factors behind corruption A P P L E Corruption is the rotten APPLE; five kinds of factors rot it. A Administrative P Psycho-social P Political L Legal E Economic Corruption is hard to define (TI: private abuse of public office; the Elephant Test), comes in many types, and harms society, economy, politics, security and foreign standing. Its causes are psycho-social, economic, legal, administrative and political, and measuring it is imperfect. Value addition As old as civilisation: Kautilya's Arthashastra lists many ways a civil servant can be corrupt and specific measures to contain it. Present everywhere, only in varying degree; almost no human activity is untouched; it has contributed to the decline of empires and to reforms in religion . TI definition: private abuse of public office . Elephant Test: corruption may be hard to define or describe, but when a civil servant does something unethical, society knows it: easier to point out than to define. Defining issues Is a gift a bribe? consider the donor's intent , the recipient's expectation , timing , value , the country's legal framework , and social acceptability Culture varies: Old school ties (UK: used to leverage favours, culturally accepted) Lobbying and networking (USA: regulated by law, legal, not seen as corrupt) Blat (Russia: Soviet-era system of favours and reciprocal favours, culturally accepted) Guanxi (China: a favour done must be returned) Public bodies only, or private sector too? Many say both, but casting the net too wide dilutes focus and makes corruption unmanageable Counter-view: if government is incorruptible, private-sector corruption will fall naturally Types Pair Meaning Black every section of society unanimously feels the behaviour is corrupt and must not be tolerated White society recognises it as corrupt but tolerates it (common: speed money) Grey wide differences between sections of the population on whether the behaviour is corrupt Grass eating public servant who does not seek bribes but does not refuse one if offered Meat eating public servant who actively seeks opportunities to benefit through corrupt means Coercive (extortive) faced widely by the common man: must bribe an official just to get his due ; the official extorts Collusive (transactive) official and bribe-giver collude for gain at the cost of public interest; both gain illegally Retail (petty) small corruption at street-level bureaucracy that the common man meets regularly (e.g. speed money) Policy (grand) crony capitalism : business houses practise state capture , influencing government to frame policies that illegally benefit them; at the highest levels Key point Corruption in the wider sense goes beyond giving and taking bribes; it includes any behaviour that harms public interest: lethargy in assigned duties · dereliction or negligence of duty · repeated carelessness · non-punctuality · subjective interpretation of public interest · favouritism and nepotism · communalism, casteism, lynching , regional bias. Implications PYQ 2016PYQ 2019 FIVE Fallouts CORRUPTION : Social: divisions, unsafe lives Economic: extra tax, low investment Political: money power, unrest Security: laundering, poor defence International: aid cut, Magnitsky Mnemonic · Implications of corruption S P I E S Corruption SPIES on every sphere of life. S Social P Political and legal I International E Economic S Security Implication Detail (handout) Social divides society vertically (rich or well-connected get their due, the poor do not) and horizontally (favouring one caste or class, neglecting others) · insecurity: people stop reporting crime and cooperating with police, boosting criminals' morale and criminalisation · endangers lives: building collapses, fires from substandard material, false certificates · erodes the social fabric: general distrust Economic aid reduced: in African countries aid went to dictators, warlords, corrupt officials, so donors changed stance, even for poor countries · lower investment: investors wary; Paulo Mauro: differential between less and more corrupt countries can be as high as 12% · acts as an additional tax on investment (bribes, extortion) · lower government revenue (officials collude or extort in collection) · diverts spending to non-priority sectors to ease corruption · lowers govt efficiency · distorts fair competition (collusion, crony capitalism) · brain drain and capital flight · hard to join international clubs (Eastern Europe vs EU) · environmental damage via collusion with officials Political and legal raises officials' power: in a fair system discretion is limited; in a corrupt one officials use it for gain · more money power · pork-barreling: a project shown as public interest but actually serving corporates, officials and politicians · citizens' despair raises appeal of extremist politicians (xenophobia, radical solutions, populism) · mass unrest (India Against Corruption) · radical tendencies: left extremism and North-East insurgency fed by corruption, poor development, a cycle of violence Security security forces' corruption aids money laundering, drug and human trafficking, arms smuggling ; defence procurement corruption hurts contract quality International Magnitsky Act 2012: Magnitsky, a Russian lawyer prosecuted for exposing corruption; US Congress passed an anti-corruption law in his name, souring ties with Russia · German car insurance (1990s): high-end cars stolen and smuggled to Central Europe with corrupt officials' help; premiums skyrocketed; diplomatic row Note Revisionism: a school of thought with not many takers : some corruption in civil services is not bad. Hypothesis: civil servants are largely lethargic, less motivated, prone to red tape and poorly paid, so efficiency is low; corruption increases bureaucratic efficiency in public work. WHY IT Happens Psycho-social factor Meaning (handout) Basis behaviour = attitudes/predispositions inside the person + the environment around THYMOS (Greek: respect, recognition) high corruption correlates with low self-worth; people turn to materialism to raise it; low self-esteem puts the locus of control outside, so worth depends on how society values them Societal attitude society sees govt as highly corrupt; persistent labelling and shaming; even honest employees are seen through a corrupt lens, a disincentive to be honest Squirrel Nuts Syndrome bureaucrats near retirement turn more corrupt to keep the benefits they enjoyed Opportunity theory most civil servants do not seek opportunities, only a few do; but when opportunities come they commit corruption; so reduce opportunities Religious context European studies: areas with more Protestants less corrupt, since Protestantism was born as a reaction to corruption in the Catholic Church History long history of corruption (lower bureaucracy corrupt since ancient times, as in Kautilya) makes society tolerant Popular sanction no popular sanction against corruption; honest people are victimised Social evils excess spending on marriages, dowry provoke officials to corruption Mnemonic · Psycho-social factors H O R N E T S The psycho-social roots are a nest of HORNETS. H History: corruption has a long history O Opportunity theory: cut opportunities R Religious context (Protestant areas less corrupt) N No popular sanction against it E Evils: dowry, lavish weddings T THYMOS: need for respect; low self-worth, shaming S Squirrel Nuts Syndrome (close to retirement) Economic poor salary at upper levels is blamed, but raising pay alone may not dent corruption much consumerism feeds low self-esteem and so corruption licence-permit-quota raj → clearance raj: So many clearances and NOCs before starting a venture Red tape gives incentive to be corrupt willingness and ability: big MNCs have the clout to bribe their way to favourable policy business houses do not cooperate: if all refused to pay bribes corruption would fall sharply, but they try to outbid and outdo each other for government favours Legal excessive legal protection for public servants against prosecution for corruption Art 311: Reasonable opportunity before action, so it is very hard to dismiss corrupt servants A source of excessive protection PCA 1988, Sec 19: sanction of the appointing authority before prosecution CrPC Sec 197 (as in the handout): permission of the appointing authority to prosecute for any offence other than corruption linked to official duty. Sec 19 and Sec 197 were meant to protect honest servants from spurious allegations but are misused to protect the corrupt delay in prosecution (inadequate judicial process) no effective whistleblower law to protect honest officials inadequate autonomy of CBI and CVC, which have become politicised THE Sanction Chain DSPE Act 1946: preliminary inquiry first, then full investigation; prior sanction needed for investigation, not for preliminary inquiry. Single Directive: for Joint Secretary rank and above, sanction neede
