a SICs none since 2017; Odisha since 2015-16. Waning interest of media and activists. Impact A grievance redressal tool as well; exposed corruption, wasteful expenditure, scams, false narratives, recruitment results and marks; rural access largely through NGOs; became a national movement aiding the Right to Food and Education; more successful for personally relevant information than for controversial public-interest information. 2nd ARC recommendations Repeal the Official Secrets Act ; replace oath of secrecy with oath of transparency ; periodic review of the Second Schedule. Classification Damage on exposure Top Secret Exceptionally grave Secret Serious Confidential Simple Restricted Official use only Norms set by the Ministry of Home and not public. Public Records Act 1993: 5-year review of Top Secret, Secret, Confidential items for declassification. Selection: committee to include the CJI instead of the Union Cabinet Minister ; at least half of ICs from non-civil-service background. Access: 4 regional CIC offices; nodal PIO where more than one PIO; PIOs at least Deputy Secretary or Director level in the central secretariat; flexible payment (stamps, postal orders); district single-window agency; free print suo motu disclosure; independent public records office; 1% of flagship fund for 5 years ; training beyond PIOs; awareness through credible NGOs; National Coordination Committee chaired by the CIC; 'substantially financed' = 50% of operating costs for 3 years or at least Rs 1 crore ; check frivolous complaints."}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "chapter-timeline", "t": "Timeline", "x": "Timeline # 1765 East India Company coins 'Civil Services' (combatant vs non-combatant) (M1 p.5) 1766 Sweden: first country to provide a right to information (M1 p.31) 1809 Sweden appoints the first ombudsman (M1 p.31; M2 p.15) 1909 Nine All India Services (M1 p.7) 1919 GoI Act 1919 provides for a Federal PSC (provincial PSCs not mandatory) (M1 p.3) 1924 Lee Commission; AIS reduced to four (M1 p.3, 7) 1926 FPSC established; Sir Ross Barker first Chairman (M1 p.3) 1928 Nehru Committee Report not keen on AIS (M1 p.7) 1929 Madras: first Provincial PSC (M1 p.3) 1935 GoI Act 1935: FPSC, PPSC, JPSC (M1 p.3) 1947 AIS reduced to two (M1 p.7) 1957 Mundhra scandal: Finance Minister and Finance Secretary resign (M1 p.14) 1964 CVC set up as an executive body (Feb 1964) (M1 p.26; M2 p.13) 1966 First ARC opposes strikes by civil servants; wants unlawful strikes a penal offence (M1 p.17) 1973 Hanumanthaiah-Ganguli conflict (Railway Minister vs Railway Board Chairman) (M1 p.14) 1987 Rajiv Gandhi vs Foreign Secretary A.P. Venkateswaran (Sri Lanka policy) (M1 p.14) 1991 Citizen's Charter launched by the John Major government (UK) (M1 p.28) 1993 Public Records Act: 5-year review of classified records (M1 p.37) 1995 Nolan Committee principles; TI Corruption Perception Index begins (M1 p.18; M2 p.7) 1996 National Campaign for People's Right to Information (Aruna Roy) (M1 p.32) 2001 Civil Services Examination Review Committee (M1 p.6) 2002 Freedom of Information Bill enacted but not implemented (M1 p.32) 2003 CVC Act (statutory CVC); UNCAC; PMLA (M1 p.26; M2 p.9, 11) 2005 RTI Act (drafted by the National Advisory Council); IS 15700:2005 standard (M1 p.30-32) 2006 Sevottam launched (conceptualised by the 2nd ARC) (M1 p.30) 2009-10 Sevottam piloted in ten departments (M1 p.30) 2012 NDSAP; Magnitsky Act (US) (M1 p.22; M2 p.4) 2013 Lokpal and Lokayuktas Act; T.S.R. Subramanian case; CIC: political parties under RTI; DoPT PPP circular (M1 p.9, 22, 26, 33; M2 p.15) 2014 Whistle Blowers Protection Act; DSPE Sec 6A struck down (M1 p.27; M2 p.6) 2015 UPSC Chairman seniority convention violated; Whistleblower amendment bill (lapsed) (M1 p.3; M2 p.19) 2019 RTI Amendment Act; Lokpal constituted (Justice P.C. Ghose); SC: judiciary by and large under RTI (M1 p.33, 35; M2 p.15) 2020 Mission Karmayogi (NPCSCB); SC brings deemed universities under PCA (M1 p.19; M2 p.20) 2021 31 lateral entry posts advertised; Essential Defence Services Bill (M1 p.7, 17) 2024 Aug: UPSC advertises 45 lateral posts; 20 Aug: DoPT asks UPSC to cancel, drive cancelled (M1 p.7) 2025 DARPG National Workshop in Bhopal on Sevottam (M1 p.31) 2026 8th CPC reference date 1 January 2026 (M1 p.16)"}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "side-by-side", "t": "Side by side", "x": "Side by side # Public servants vs civil servants (M1 p.5) Civil servants Public servants Meaning Government staff in the civil services; term coined by the East India Company around 1765 Broader category Includes All India, Central, State and Municipal services Also political executives, judiciary, defence forces, PSU employees Accountability: direction of pressure (M1 p.24-26) Form Who acts Examples Horizontal State institutions on other state actors CAG, EC, CVC, CIC, ombudsman Vertical Citizens and civil society Elections, lobbying, budget participation, report cards, social audits Diagonal Citizens directly engage horizontal bodies PIL Intra-organisational Subordinate to superior to minister to legislature Hierarchy Micro vs macro (World Bank) Micro: responsiveness to service users. Macro: financial and economic performance Pre-2019 vs post-2019 Information Commissions (M1 p.35-36) Feature Before the 2019 Amendment After Tenure Five-year term in the Act Centre notifies; now 3 years or 65 Salary Linked to CEC and ECs Fixed by the Centre (CIC Rs 2.5 lakh, IC Rs 2.25 lakh) Conditions In the parent Act Executive rules Status Statutory Statutory; clarified as not constitutional"}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "flows", "t": "Flow charts", "x": "Flow charts # Why Indian civil services resist change (Section 2) Aristocratic personnel system: sharp grade divide, narrow age band, general-ability exams, cadre-based Closed career: conservative, status quoist, rule fetishism, rank over competence Elitist mindset: obstacles to change Plus: traditional education, limited mobility, political failure, poverty Result: slow pace of social change Fix: lateral entry, specialisation after 10-12 years An RTI request, step by step (Section 13) Citizen files a request in English, Hindi or local language; no reason needed; BPL free Received by the PIO/APIO (designated within 100 days of the Act) Misdirected request transferred within 5 days; applicant told immediately Third-party information: notice and hearing, 10 days Information due in 30 days; fees waived if time limits are missed Refusal needs reasons, appeal period and appellate authority Complaint to CIC/SIC; penalty Rs 250 a day up to Rs 25,000 Sevottam: seven steps (Section 12) Define services and identify clients Set standards and norms Develop organisational capability Perform to achieve standards Monitor performance Evaluate impact Continuous improvement How corruption is produced and checked (Sections 13, 15, 16) Monopoly + Discretion - Transparency = Corruption Add transparency: RTI (information in 30 days), proactive disclosure, NDSAP Add participation: social audit, Citizen Report Cards, jan sunwai Add enforcement: CBI, CVC, Lokpal, PCA 1988 (2018) Add protection: Whistleblower Act 2014 Result: corruption is controlled, not eliminated ('wicked problem') Who can use which accountability tool (Section 11) Within the hierarchy: managerial and intra-organisational accountability Between state institutions: horizontal (CAG, EC, CVC, CIC, ombudsman) Citizens and civil society: vertical (elections, report cards, social audits) Citizens engaging institutions directly: diagonal (PIL) Beyond the state: global standards (TI, HDI, SDGs, Ease of Doing Business)"}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "traps", "t": "Traps", "x": "Traps # Common mix-ups and the rule for the exam hall Trap What goes wrong, and the rule FPSC: Act year is not set-up year The 1919 Act provided for a Federal PSC; it was set up in 1926 on the Lee Commission (1924). Madras (1929) was the first provincial PSC. Rule: when asked 'set up', use the establishment date, not the Act date. UPSC is constitutional but not equal UPSC is listed among four important constitutional bodies yet has no separate oath and an easier removal process. Convention on the Chairman broken in 2015. Rule: independence is protected by pay and removal rules, not by status. AIS counts by date Nine AIS in 1909, four in 1924, two in 1947, three today (IAS, IPS, IFoS). Rule: pin the number to its year before choosing. Which article is which Art 312 creates AIS; 315-323 cover PSCs; 309-311 service conditions, tenure, dismissal; 323A administrative tribunals; Art 16 equality in public employment. Rule: Arts 309-311 = the servant, 315-323 = the Commission, 312 = the All India Service. Steel Frame and Father of AIS Lloyd George used 'Steel Frame' for the Imperial Civil Service. Patel is the Father of All India Services. Rule: the phrase and the person are different people. Political vs policy neutrality Political neutrality does not mean policy neutrality. Officers advise intellectually, not emotionally. Rule: understand politics, do not play politics. Horizontal accountability lists differ Module 1 names CAG, CBI and CVC in one table and CAG, EC, CVC, CIC, ombudsman in another. Rule: name CAG and CVC always; add the rest as asked. Citizen's Charter and rights A Charter creates no new rights; it enforces existing ones. Launched in the UK in 1991. Sevottam: 2nd ARC concept, launched 2006, IS 15700:2005, pilots 2009-10. Rule: Charter = promise; right = already existing. RTI numbers 5 days: transfer; 10 days: third-party notice; 30 days: reply; 100 days: designate PIOs; 120 days: publish 16 types; 20 years: release exempted records; Rs 250 a day up to Rs 25,000. Rule: write the unit with each number. The only absolute RTI exemption Copyright held by a person other than the State is the only absolute exemption. Sec 8(2) lets public interest override the rest; the Second Schedule agencies still owe information on corruption and human rights. Rule: 'absolute' appears only with copyright. First country and first state Sweden 1766 (RTI) and 1809 (ombudsman); USA second (1966); Tamil Nadu first state RTI law (1997); Maharashtra first Lokayukta (1971). Rule: Sweden twice, USA second."}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "connects", "t": "Connects to", "x": "Connects to # §3 All India Services → §15 The Problem of Corruption Article 311 and the Doctrine of Pleasure resurface as a legal factor behind corruption: protection that makes dismissal hard. §3 All India Services → §5 Working and Performance of Civil Services T.S.R. Subramanian (2013) answers the 'arbitrary transfers and short tenures' problem. §1 Civil Services: UPSC and SPSC → §17 CBI and CVC UPSC's conflict with the CVC is listed as an issue; CVC's selection, term and pay mirror UPSC's. §2 Civil Services: Meaning and Lateral Entry → §6 Bureaucracy and Development Lateral entry and the generalist-specialist debate return as 'greater importance to generalists' among the paradoxes. §4 Role of Civil Services in Democracy → §11 Accountability The anonymity role is eroded by social audits, RTI and Citizens' Charters, which are the social accountability tools. §4 Role of Civil Services in Democracy → §16 Tackling Corruption and Social Audit Policy evaluation by the implementer is a conflict of interest, which is why social audits matter. §5 Working and Performance of Civil Services → §16 Tackling Corruption and Social Audit Corruption in street-level bureaucracy is tackled by digitisation, CCTV and social audit. §6 Bureaucracy and Development → §15 The Problem of Corruption Red tape, secrecy and file fetishism (Babu culture) reappear as administrative factors behind corruption. §8 Civil Services Reforms and Nolan Principles → §9 Challenges to Reform; Mission Karmayogi; Aarambh The reform list (training, appraisal, domainisation) is what Mission Karmayogi tries to institutionalise. §8 Civil Services Reforms and Nolan Principles → §2 Civil Services: Meaning and Lateral Entry Mainstreaming lateral entry is a reform item; the 2018, 2021 and 2024 episodes show the difficulty. §9 Challenges to Reform; Mission Karmayogi; Aarambh → §12 Citizen's Charter and Sevottam Both are capacity-building responses: Karmayogi for the officer, Sevottam for the office. §10 Transparency and NDSAP → §13 RTI Act 2005 and the 2019 Amendment NDSAP's negative list is built on RTI Sections 8 and 9; transparency tools meet at the RTI Act. §10 Transparency and NDSAP → §14 CIC, RTI Issues, Impact and 2nd ARC 2nd ARC wants the Official Secrets Act repealed, which links transparency to secrecy law. §11 Accountability → §12 Citizen's Charter and Sevottam Citizen's Charter is a social accountability mechanism. §11 Accountability → §17 CBI and CVC Accountability section lists CVC, Lokpal, Whistle Blowers Act, CAG; Module 2 gives their detail. §12 Citizen's Charter and Sevottam → §16 Tackling Corruption and Social Audit Charter, social audit and report cards all strengthen the demand side of governance. §13 RTI Act 2005 and the 2019 Amendment → §16 Tackling Corruption and Social Audit MKSS jan sunwais at Janawad led to the RTI Act 2005. §13 RTI Act 2005 and the 2019 Amendment → §18 Lokpal in India Sweden is the root of both RTI (1766) and the ombudsman (1809), which became Lokpal. §13 RTI Act 2005 and the 2019 Amendment → §19 Whistleblower Protection and the PCA 1988 RTI Act overrides the Official Secrets Act; the 2015 whistleblower amendment bill proposed the opposite. §14 CIC, RTI Issues, Impact and 2nd ARC → §13 RTI Act 2005 and the 2019 Amendment 2019 amendment details (tenure, pay) reappear in the CIC section; same facts, different angles."}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Constitutional part dealing with civil services Part XIV, Articles 308 to 323. When was the FPSC set up, and who was the first Chairman? 1926, on Lee Commission (1924) advice; Sir Ross Barker. Two ARC models to shorten the exam cycle I: Prelims and Mains together over 2-3 days. II: shortlist 2-3 times vacancies; Mains within two months. Why is the UPSC not on an equal footing with EC, CAG, SC? No separate oath; easier removal. Type I and Type II error in recruitment Type I: wrong person recruited. Type II: right person rejected. Who coined 'Civil Services', when, and why? The East India Company, around 1765, to separate combatant from non-combatant personnel. Who is a public servant but not a civil servant? Political executives, the judiciary, defence forces and PSU employees. What did the Third Pay Commission rename? Class 1, 2, 3, 4 became Group A, B, C, D. Aug 2024 lateral entry advertisement UPSC advertised 45 posts: 10 Joint Secretaries and 35 Directors/Deputy Secretaries. What is provincialisation of an All India Service? Abolition of the service; states become responsible for recruiting personnel for that part of administration. Who used 'Steel Frame', and for which service? David Lloyd George, for the Imperial Civil Service. AIS were later called the Steel Frame of India. Father of All India Services Sardar Patel; AIS got constitutional status under Article 312. Number of AIS over time 9 (1909), 4 (1924), 2 (1947), 3 today: IAS, IPS, IFoS. Which commission asked to disband the AIS? The Rajamannar Commission. The Sarkaria Commission called disbanding a retrograde step. T.S.R. Subramanian case (2013): headline asks Minimum guaranteed tenure in key posts; Civil Services Boards for postings and transfers; avoid verbal orders; a comprehensive Civil Services Law. Three forms of confidence in political neutrality Confidence of people, of ministers, of civil servants. Bhaskar Ghose's three bureaucrats Neither Wilt nor Tilt; Incorrigibly Corrupt; Weather Report Readers. Lakhina Experiment Dr. Lakhina (Ahmednagar, 1980s) colour-coded files by year; grassroots activism. The 3Ms of global monoculture MTV (fast music), Macintosh (fast computers), McDonald's (fast food). Four functions of the civil services in the handout Policy formulation, policy implementation, policy evaluation, administrative adjudication (plus continuity in administration). Why does policy evaluation by civil servants raise concern? Conflict of interest: officers evaluate programmes they implemented. Hence the weight on social audits. Street-level bureaucracy Lower-level officials who deal directly with citizens; corruption here is a cause of poor performance. Rajiv Gandhi's leakage figure 16 paise of every rupee reaches the people. Fitment factor formula Revised Basic Pay = Existing Basic Pay x Fitment Factor. Seven Nolan Principles Selflessness, integrity, objectivity, accountability, openness, honesty, leadership. Mission Karmayogi in one line 2020 NPCSCB: rules-based to roles-based; iGOT, competency frameworks, performance management, Karmayogi Bharat, Capacity Building Commission. Aarambh Initiative Common Foundation Course; Commitment, Character and Conduct. OECD vs UNESCAP idea of transparency OECD: objectives, decisions and rationale given in a comprehensible, accessible, timely way. UNESCAP: decisions follow rules; information freely and directly accessible to those affected. Three metaphors of transparency Public value (counter corruption); open decision-making (secrecy vs privacy); tool of good governance. NDSAP 2012: nodal department and purpose Department of Science and Technology; shares non-sensitive government data in machine-readable form on the OGD Platform. Social accountability tools named Social audits (MGNREGA), public expenditure tracking, Citizen Report Cards, public hearings. Three components of accountability Answerability, enforcement, responsiveness. Horizontal vs vertical vs diagonal accountability Horizontal: state institutions (CAG, EC, CVC, CIC). Vertical: citizens. Diagonal: citizens engage institutions directly (PIL). Who launched Citizen's Charter and when? John Major government (UK), 1991. It creates no new rights. Sevottam: three modules Citizen Charter implementation; public grievance redressal; service delivery capabilities. First country with RTI Sweden, 1766 (USA second, 1966). RTI read into which articles? 19(1)(a), 21, 39(b), 39(c). Cases: Rajnarain 1975; S.P. Gupta 1982. MKSS slogan and place 'Humara Paisa, Humara Hisab'; Janawad, Rajasthan. Corruption formula in RTI section Monopoly + Discretion - Transparency = Corruption. Penalty for denying information Rs 250 a day up to Rs 25,000, plus disciplinary action. When do exempted records become releasable? After 20 years, except Cabinet, legislative privilege and sovereignty/security-type categories. CIC composition and appointing committee One Chief Information Commissioner and up to ten ICs; committee: PM (Chair), Leader of Opposition (LS), a Union Cabinet Minister nominated by the PM. CIC tenure and salary under RTI Rules 2019 3 years or age 65, whichever is earlier; no reappointment. CIC Rs 2,50,000 and IC Rs 2,25,000 per month. RTI pendency figures 2.55 lakh pending in 26 ICs; average disposal 1 year 11 months; 21 of 29 ICs had not filed the 2019-20 report. Classification of secret documents Top Secret (exceptionally grave), Secret (serious), Confidential (simple), Restricted (official use only). Public Records Act 1993: 5-year declassification review."}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts in Start Here)"}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards Mains answer skeletons One for each Mains PYQ quoted in the material that the notes can support, then practice questions. Tap to open; try the answer first. 2024 · 15 marks · The Citizens' charter has been a land mark initiative in ensuring citizen-centric administration. But it is ye… Question. The Citizens' charter has been a land mark initiative in ensuring citizen-centric administration. But it is yet to reach its full potential. Identify the factors hindering the realisation of its promise and suggest measures to overcome them. A Charter commits an organisation to quality and time standards for existing rights (UK, 1991); it creates no new rights. Factors: limited consultation (manager's charter), no penal provisions, low awareness, standards too lax or strict, no names of redressal functionaries, no incentives, weak review, no devolution to street-level staff, jargon and no vernacular Measures: separate charter per unit and service, widest consultation, commit only to what can be delivered, redressal mechanism, periodic evaluation with end-user feedback, penal provisions Institutional: outside-agency review, Charter Mark-type incentives, Sevottam (IS 15700:2005), digital link with CPGRAMS Close. A charter works when promises are realistic, owned by frontline staff and measured by someone outside. 2020 · 150 words marks · \"Institutional quality is a crucial driver of economic performance\". In this context suggest reforms in Civil … Question. \"Institutional quality is a crucial driver of economic performance\". In this context suggest reforms in Civil Service for strengthening democracy. Quality civil services (a key institution) support performance and democracy. Recruitment: lateral entry, psycho-social profile, probation Training and competency: mid-career training, Mission Karmayogi (rules to roles) Appraisal and tenure: outcome-based, 360-degree, stable tenure Openness: RTI, Citizens' Charters, social audit; Nolan Principles Close. A competent, neutral and accountable service is the institution that carries democracy to citizens. 2020 · 10 marks · \"Recent amendments to the Right to Information Act will have profound impact on the autonomy and independence … Question. \"Recent amendments to the Right to Information Act will have profound impact on the autonomy and independence of the Information Commission\". Discuss. The RTI Amendment Act 2019 moved tenure, salary and service conditions of the CIC and ICs from the Act to executive rules. What changed: Centre decides tenure (five-year term removed); fixes salary and conditions, delinked from CEC and ECs; CIC clarified as statutory Negative: executive overreach, public distrust, federal dilution of SICs Positive: administrative flexibility, fiscal discipline, policy alignment Now: tenure 3 years or age 65; CIC Rs 2.5 lakh, IC Rs 2.25 lakh; removal still needs SC inquiry Close. The impact turns on how responsibly the government uses its new powers. 2018 · 15 marks · Citizens' Charter is an ideal instrument of organizational transparency and accountability, but it has its own… Question. Citizens' Charter is an ideal instrument of organizational transparency and accountability, but it has its own limitations. Identify the limitations and suggest measures for greater effectiveness of the Citizens Charter. A Charter makes standards and timelines public, so performers can be told from non-performers. Limitations: no penal provisions, limited consultation, unrealistic standards, awareness gap, no incentives, brochures taken as charters, poor review Measures: hand-holding by DARPG for first charters, mandatory user and staff involvement, outside monitoring, simplified language, 5-year master plan with budget Sevottam adds three modules (charter, grievance redress, service capability) Close. Transparency of promise must be matched by consequence for failure. 2017 · 250 words marks · Initially Civil Services in India were designed to achieve the goals of neutrality and effectiveness, which se… Question. Initially Civil Services in India were designed to achieve the goals of neutrality and effectiveness, which seems to be lacking in the present context. Do you agree with the view that drastic reforms are required in Civil Services? Comment. Neutrality (class, cultural, political) and effectiveness are both strained. Neutrality: middle-class mindset, political pressure, Ghose's 'weather report readers', politicised transfers Effectiveness: average DC tenure about one year, poor training (one in five trained), no quantifiable appraisal, 'hire, but no fire' Reform: tenure security and Civil Services Boards (T.S.R. Subramanian 2013); comprehensive Civil Services Law; 360-degree appraisal; domainisation; lateral entry Mission Karmayogi: roles-based competency, iGOT, outcome-based appraisal Close. Reform needs to be continuous and structural, not drastic: protect neutrality, reward results. 2016 · 12.5 marks · Effectiveness of the government system at various levels and people's participation in the governance system a… Question. Effectiveness of the government system at various levels and people's participation in the governance system are inter-dependent. Discuss their relationship with each other in context of India. Participation tools turn citizens into monitors of government performance. Social audit, Citizen Report Cards, public hearings, public expenditure tracking improve service quality and deter corruption Charters and RTI give citizens the information to participate; MKSS jan sunwais led to RTI AP SSAAT and Bengaluru report cards show effectiveness gains; participation in Charter design is a 'key element of democracy' Limits: low awareness (RTI), no trained auditors, digital divide Close. Effective government invites participation, and participation keeps government effective. (Partial fit: notes cover participation tools, not a theory of the relationship.) 2014 · not printed marks · Has the cadre-based Civil Services organization been the cause of slow change in India? Critically examine. Question. Has the cadre-based Civil Services organization been the cause of slow change in India? Critically examine. Cadre-based, closed career services are part of what the handout calls an aristocratic personnel system. Features: sharp grade divide, narrow age band, general-ability exams, class preference, cadre-based services Consequences: conservative, status quoist, non-responsive, rule fetishism, rank over competence, elitist, obstacles to change Other causes listed: traditional education, conservative attitudes to women, limited mobility, failure of the political system, poverty Fixes: lateral entry, specialisation after 10-12 years, domainisation Close. The cadre system is a major brake on change, but not the only one; reform of services must go with political and social reform. 2013 · 10 marks · Though Citizen's charters have been formulated by many public service delivery organizations, there is no corr… Question. Though Citizen's charters have been formulated by many public service delivery organizations, there is no corresponding improvement in the level of citizens' satisfaction and quality of services being provided. Analyze. By end 2011 there were 131 central and 729 state charters, but numbers are not outcomes. Charters without penalties or incentives do not change behaviour Standards set without checking resources and workload lose public confidence Charters not known to citizens; jargon; same format for all services Weak review and updating; grievance functionaries not named Fix: ARC-II 'commit to what you can deliver', reform internal processes, hold officers accountable Close. Satisfaction follows delivery capacity, not the number of charters issued. Practice · Evaluate Mission Karmayogi as a shift from rules-based to roles-based civil services management. Launched in 2020 as the National Programme for Civil Services Capacity Building. Components: iGOT Karmayogi, competency frameworks, outcome-based performance management, SPV Karmayogi Bharat, Capacity Building Commission Gains: competency over tenure, real-time feedback beyond ACRs, on-demand training Challenges: lateral-entrant integration, mindset shift, Centre-State coordination, digital access Link to Aarambh: Commitment, Character, Conduct Close. Success depends on continuous implementation, not a one-time launch. Practice · Should civil servants have the right to strike? Discuss with reference to the Essential Defence Services Bill 2021. The Bill barred strikes in essential defence services including 41 ordnance factories. For: collective protest, protection from exploitation, last resort Against: public interest (loaded gun), model citizens, government as fair employer First ARC (1966): penal offence; SC: no fundamental, statutory or equitable right Close. Distinguish essential from non-essential services rather than ban or permit across the board. Practice · Sevottam is more than a certification. Discuss its significance and the challenges in implementation. 2nd ARC concept, launched 2006; BIS standard IS 15700:2005. Three modules and seven steps Significance: structured quality management, citizen-centric culture, continuous improvement, self-assessment Challenges: seen as compliance, fragmented adoption, weak digital integration Way forward: training, link to CPGRAMS and MyGov, third-party audits Close. Sevottam works when it is a management system, not a badge."}, {"c": "2", "n": "Corruption, Social Audit, CBI, CVC, Lokpal, Whistleblowers and PCA", "id": "1-the-problem-of-corruption", "t": "1 · The Problem of Corruption", "x": "1 · The Problem of Corruption # Handout only · M2 p.3-8 Exam lens Priority: High. Mains PYQs quoted: 2016, 2019, 2014. Prelims PYQs quoted: none quoted in the material. Prelims hooks TI definition; Elephant Test; CPI since 1995 (0 most corrupt, 100 least) Black, white, grey; grass-eating vs meat-eating; coercive vs collusive; retail vs policy Legal factors: Art 311, PCA Sec 19, CrPC Sec 197, DSPE Sec 6A (Vineet Narain 1997; struck down 2014), PCA Sec 17A (2018) 2020 CPI: New Zealand, Denmark least corrupt; Somalia, South Sudan last; Bhutan 24th, USA 25th, Botswana 35th, China 78th, Pakistan 124th Global Corruption Barometer; PETS (World Bank); Paulo Mauro: investment differential up to 12% Mains hooks Behaviour that harms public interest (non-performance of duty as corruption) Factors behind corruption: psycho-social, economic, legal, administrative, political Implications: social, economic, political, security, international Why poverty is not the only cause; powerful and affluent also corrupt Corruption is an elephant: recognised by society even when it cannot be defined, and fed by opportunity and discretion. In simple words Corruption is old: Kautilya's Arthashastra lists ways civil servants can be corrupt and how to contain it. Defining it is hard: is a gift a bribe? Culture matters (UK school ties, US lobbying, Russia's Blat, China's Guanxi). TI: 'private abuse of public office'; the Elephant Test : hard to define, easy to recognise. Types: black, white and grey; grass eating and meat eating; coercive and collusive; retail (petty) and policy (grand). Costs: social divisions and insecurity, lower investment (Mauro: up to 12%), diverted spending, brain drain, security risks, mass unrest. Causes: psycho-social (THYMOS, Squirrel Nuts Syndrome), economic (poor pay, licence-permit raj), legal (Article 311, PCA Sec 19, CrPC Sec 197), administrative (red tape), political (no will, money power). Measuring it: TI's Corruption Perception Index (0 = most corrupt, 100 = least corrupt, annual since 1995), the Global Corruption Barometer and the World Bank's PETS. Term In plain words Speed money White corruption: recognised as corrupt but tolerated. Squirrel Nuts Syndrome Corruption by officials close to retirement. THYMOS Need for respect and recognition. Remember it as Black - white - grey (society's view); grass - meat (official's role). Corruption is hard to define (TI: private abuse of public office; the Elephant Test), comes in many types, and harms society, economy, politics, security and foreign standing. Its causes are psycho-social, economic, legal, administrative and political, and measuring it is imperfect. Corruption is as old as civilisation; Kautilya's Arthashastra lists ways a civil servant can be corrupt and the measures to contain it. Defining corruption: issues Is a gift a bribe? Consider intent of the donor, expectation of the recipient, timing, value, the legal framework, and social acceptability. Cultural differences: old school ties (UK); regulated lobbying (USA); Blat (Russia, from the Soviet Union); Guanxi (China). Public only, or private sector too? Too wide a net dilutes focus; if government is incorruptible, private corruption falls. Transparency International: 'private abuse of public office'; the Elephant Test : hard to define, but society knows it when it sees it. Types Pair Meaning Black corruption Whole society agrees it is corrupt and intolerable White corruption Recognised as corrupt but tolerated (speed money) Grey corruption Sections of society differ on whether it is corrupt Grass eating Does not seek bribes but will not refuse one Meat eating Actively seeks opportunities to benefit Coercive (extortive) Citizen must bribe to get his due; official extorts Collusive (transactive) Official and bribe-giver collude against public interest Retail (petty) Street-level, e.g. speed money Policy (grand) Crony capitalism and state capture; shaping policy for illegal benefit Behaviour that harms public interest: lethargy; dereliction or negligence of duty; repeated carelessness; non-punctuality; subjective interpretation of public interest; favouritism and nepotism; communalism, casteism, lynching, regional bias. Implications Social: vertical and horizontal divisions; insecurity (people stop reporting crime); endangers lives (building collapse, fires, false certificates); erodes social fabric. Economic: reduced aid (African examples); less investment ( Paulo Mauro: up to 12% differential ); acts as an extra tax; lower revenue; diverted expenditure; poorer efficiency; distorted competition and crony capitalism; brain drain and capital flight; harder entry into international clubs (Eastern Europe and the EU); environmental damage. Political and legal: raises officials' discretion; money power; pork-barreling ; despair favours extremist politicians; mass unrest (India Against Corruption); radical tendencies (Left extremism, North-East insurgency fed by corruption and poor development). Security: security forces aiding laundering, drugs, trafficking, arms; poor defence procurement quality. International: Magnitsky Act, 2012 (US law, soured ties with Russia); German car insurance (1990s) thefts and smuggling with corrupt officials, premium spike, diplomatic row. Revisionism: a minority school holding some corruption is not bad because it speeds a lethargic, low-paid bureaucracy. Factors behind corruption Psycho-social: need for THYMOS (respect/recognition) and low self-worth; societal shaming of government employees; Squirrel Nuts Syndrome (close to retirement); Opportunity theory (reduce opportunities); religious context (Protestant areas less corrupt); long history; no popular sanction against it; social evils (dowry, lavish weddings). Economic: poor pay at upper levels (raising pay alone may not dent it); consumerism; licence-permit-quota raj to clearance raj ; MNCs' willingness and ability to bribe; business houses outbidding each other. Legal: Article 311 makes dismissal hard; PCA Sec 19 needs appointing authority's sanction before prosecution; CrPC Sec 197 sanction for non-corruption offences in discharge of duty. Both protect honest officers but are misused. DSPE Act Sec 6A chain: a single directive required sanction for preliminary inquiry and investigation against Joint Secretary and above; struck down in Vineet Narain (1997) ; DSPE Act amended to make it law as Sec 6A; Sec 6A struck down in 2014 (equality); PCA amended 2018, Sec 17A : permission needed for preliminary inquiry for all public servants except when caught red-handed. Also: delayed prosecution; no effective whistleblower law; inadequate autonomy of CBI and CVC. Administrative: procedural complexity creates middlemen; red tape; weak internal grievance machinery; peer pressure; resistance to reform; politicised transfers and plum postings; culture of secrecy. Political: absence of political will (repeated Lokpal delay); criminalisation of politics; no neutrality; low voter maturity and the TINA factor; money power in elections and weak disclosure norms for party funding. Measuring corruption Official statistics (weak where prosecution is weak). Perception surveys: TI's Corruption Perception Index , annual since 1995 , 0 = most corrupt, 100 = least ; 2020 CPI (released 2021): New Zealand and Denmark least corrupt, Somalia and South Sudan last; Bhutan 24th, USA 25th, Botswana 35th, China 78th, Pakistan 124th. Critiques: based on experts and business leaders; perception, not objective; sources change; country count varies so ranks are not comparable. Experiential: TI's Global Corruption Barometer (not annual, regional); in Asia Japan least corrupt and India most corrupt among 17 countries . Tracking: World Bank's PETS . Content analysis of media (crude)."}, {"c": "2", "n": "Corruption, Social Audit, CBI, CVC, Lokpal, Whistleblowers and PCA", "id": "2-tackling-corruption-and-social-audit", "t": "2 · Tackling Corruption and Social Audit", "x": "2 · Tackling Corruption and Social Audit # Handout only · M2 p.8-11 Exam lens Priority: Medium. Mains PYQs quoted: 2021, 2016*. Prelims PYQs quoted: none quoted in the material. Prelims hooks Stick/carrot/admin/radical measures with country examples (Botswana, Singapore CPIB, Hong Kong ICAC, South Africa, Georgia, Peru, Romania) CAG covers only 25% of auditable units yearly; procurement 30% of GDP; 2012 bill lapsed International: FCPA 1977, UK Bribery Act 2010, OECD 1997, UNCAC 2003, FATF 1989 Social audit: Meghalaya 2017 Act; AP SSAAT; Karnataka rotation after 3 cycles; Chhattisgarh wall writing; Swaraj Abhiyan 2016; MKSS jan sunwai Mains hooks Stick vs carrot measures; why fragmented agencies fail Features, significance and issues of social audit; how to strengthen Success stories: AP, Jharkhand, MKSS, Bengaluru CRCs, benchmarking Make demand-side pressure real: audits only work when information flows freely. In simple words The handout calls corruption a wicked problem : more laws signal inefficiency, and it can only be controlled, not removed. Stick measures: prosecution, stings, tighter laws, asset declaration, effective single agency (Singapore CPIB, Hong Kong ICAC). Carrot : pay rise with enforcement, citizen helplines. Administrative : job rotation, auditing, public procurement law, digitisation, CCTV. Radical ideas: disband departments (Georgia's Traffic Police, 2004), gender balance (Peru), monetising bribes (Romania), amnesty. International: FCPA, UK Bribery Act, OECD Convention, UNCAC, FATF. Social audit : scheme details are shared with beneficiaries on public platforms (Jan Sunwai, Gram Sabha) so people hold officials accountable. It needs a sound access-to-information regime. Success stories: Andhra Pradesh SSAAT (MGNREGA), Jharkhand, Rajasthan MKSS (led to RTI Act 2005), Bengaluru Citizen Report Cards. Strengthen with a national law, trained auditors and rotating teams (Karnataka). Term In plain words Social audit Public verification of scheme work and money with the people it is meant for. SSAAT Andhra Pradesh's independent social audit society. Remember it as Stick - Carrot - Administrative - Radical - International. Corruption is a wicked problem: it can be controlled, not eliminated. The toolkit spans stick, carrot, administrative, radical and international measures. Social audit is the participatory tool: public hearings that need a sound RTI regime, with AP's SSAAT as the model. 'Wicked problem': despite PCA, Lokpal, CVC Act, corruption persists; more laws signal systemic inefficiency; it can only be controlled. Stick measures Prosecution: higher conviction deters (Botswana); India's delays and lenient punishment weaken deterrence; harsh penalties (China) unsuitable without rule of law. Stings and entrapment: admissibility unclear; natural stings (citizen recordings) should be admissible; Sweden restrictive. Tighten laws: 2018 amendments diluted PCA. Asset declaration with lifestyle monitoring. Effective agencies: India is fragmented (CVC, CBI, Lokpal, ED); Singapore CPIB and Hong Kong ICAC succeed with one agency. Shaming and blacklisting (South Africa); forfeiture of pensions . Carrot measures Substantial pay increase paired with enforcement; citizen helplines ( Delhi anti-corruption hotline ) needing whistleblower and witness protection. Administrative and technical Job rotation (Kautilya); stronger auditing ( CAG covers 25% of auditable units yearly ); procurement norms and a Public Procurement Law ( procurement 30% of GDP ; 2012 bill lapsed ); digitisation; CCTV in high-risk zones. Radical approaches Disband departments ( Georgia's Traffic Police, 2004 ); gender balance (Peru); monetising bribes (Romania's conscription policy; controversial); general amnesty (50% surrender of black money; debated). International measures US Foreign Corrupt Practices Act (1977) , UK Bribery Act (2010) ; OECD Anti-Bribery Convention (1997) ; UNCAC (2003) ; FATF (1989) ; Interpol IGEC; WTO inaction; global financial transparency against banking havens. Critique of the global industry: West ignored corruption until the 1990s; anti-corruption became a geopolitical tool; NGO vested interests, data over impact; cultural imperialism concerns. Alternatives: spiritual education; Integrity Recognition Certificates for honest officers (must be insulated from politicisation). Social audit Scheme details (financial and non-financial) shared with beneficiaries on a public platform ( Jan Sunwai , public hearing, Gram Sabha), so people can hold bureaucracy and Panchayat leaders accountable. Key: a sound access-to-information regime . Features: multi-perspective; regular; comparative (time and space); strengthens the demand side and indirectly targets supply-side weakness. Significance: participation; benefits reach the target; social capital; identifies civil servants' HR and training needs; highlights development concerns; transparency and anti-corruption; better future programmes. Issues: not in mainstream policy discourse; statutory in very few programmes ( NREGA is one); lack of trained auditors; opposition from vested interests. Symptom-cause point: audit across cause-effect layers, not surface symptoms alone (e.g. plague awareness drive without fixing sanitation). Strengthening social audit Legal and institutional: national law inspired by Meghalaya's 2017 Act ; independent units like Andhra Pradesh's SSAAT ; support CAG and PRIs. Stakeholders: Gram Sabha awareness; auditor training; NGO and media; recognition for participants. Digital: portals; proactive disclosure; unified guidelines. Best practices: Chhattisgarh links audits to grievance redress and uses wall writing; Karnataka rotates audit teams after every three audit cycles . Success story Detail AP MGNREGA (SSAAT) Autonomous society; village resource persons; crores of wage misappropriation recovered; World Bank called it a global best practice Jharkhand SAU MGNREGA, PDS, pensions; ghost beneficiaries, delays, ration diversion exposed; SC in Swaraj Abhiyan (2016) appreciated social audits Rajasthan MKSS 1990s jan sunwais revealed leakages; led to the RTI Act 2005 Bengaluru CRCs Civil society report cards on water, hospitals, transport; bribery fell, satisfaction rose; 2003 study Municipal benchmarking Compare service costs (e.g. cost per km of road); disclosure pressures inefficient bodies"}, {"c": "2", "n": "Corruption, Social Audit, CBI, CVC, Lokpal, Whistleblowers and PCA", "id": "3-cbi-and-cvc", "t": "3 · CBI and CVC", "x": "3 · CBI and CVC # Handout only · M2 p.11-15 Exam lens Priority: Medium. Mains PYQs quoted: 2021*. Prelims PYQs quoted: none quoted in the material. Prelims hooks CBI: SPE 1941; DSPE Act 1946; name 1963; four divisions; conviction rate 67% vs 30-40%; no suo motu jurisdiction Vineet Narain 1997: CVC supervises CBI; Director's min. tenure 2 years; committee (PM, LoP, CJI); single directive struck down; DoPT policy only CVC: 1964 executive; statutory 2003; CVC + max 2 VCs; term 4 years or 65; pay = UPSC Chair/members PJ Thomas 2011: consensus not majority in selection committee CVC Chair heads committee for ED Director and CBI officers SP and above Mains hooks Issues in CBI functioning and Vineet Narain directions CVC powers, issues and suggestions Institutional framework against corruption Autonomy of anti-graft agencies is the weak link: independence of selection, tenure, prosecution and staff. In simple words The CBI began as the Special Police Establishment (1941), got statutory backing from the DSPE Act 1946 and was named CBI in 1963. Issues: political control ('caged parrot'), vacancies, sanction delays, no suo motu jurisdiction. Vineet Narain (1997) : the Supreme Court gave the CVC superintendence of CBI in PCA cases, fixed the Director's tenure, set a selection committee (PM, LoP, CJI) and struck down the Single Directive. The CVC was set up in 1964 on the Santhanam Committee and made statutory in 2003: one Central Vigilance Commissioner and up to two Vigilance Commissioners, 4-year term, retirement at 65, no reappointment. P.J. Thomas (2011) : selection must follow the consensus of the committee, not a majority. Fix list: independent investigation and prosecution powers, statutory sanction timelines, more staff, binding recommendations and a wider selection panel. Term In plain words Single Directive Rule requiring sanction before even a preliminary inquiry against senior officers. Caged parrot A former SC judge's description of the CBI's lack of independence. Remember it as CVC: 1964 Santhanam; Act 2003; term 4 years or 65. The CBI (SPE 1941, DSPE Act 1946, named 1963) is politicised ('caged parrot') despite Vineet Narain (1997). The CVC (Santhanam, 1964; statutory 2003) superintends CBI on PCA cases but depends on it and cannot prosecute. Legal and institutional framework Sec 203 BNS (Sec 169 IPC): civil servant illegally acquiring property; Sec 316 BNS (Sec 409 IPC): criminal breach of trust by a public servant (as printed). DSPE Act 1946 (CBI); RPA 1951 Sec 123; PCA 1988 ; Benami Properties Act 1988; PMLA 2003; CVC Act; RTI 2005; Lokayukta Acts; Lokpal Act 2013; Whistleblower Act 2014; time-bound service delivery laws. Institutions: CBI, CVC, state ACBs and vigilance wings, CAG, Lokayuktas, Lokpal, ED (PMLA and FEMA) , banking ombudsman, consumer courts, three-tier judiciary. Central Bureau of Investigation Special Police Establishment 1941 ; statutory backing by DSPE Act 1946 ; named CBI in 1963 . Divisions: Anti-Corruption; Special Crimes; Economic Offences; Banking and Security Frauds. Issues: politicisation (' caged parrot ', a former SC judge); about one-third posts vacant; conviction rate 67% vs 30-40% for other agencies, but low in high-profile cases; sanction delays (Sec 19 PCA, Sec 197 CrPC); no suo motu jurisdiction (cases transferred to it). Vineet Narain case, 1997 CVC to superintend CBI on PCA cases; minimum guaranteed tenure for the Director ( 2 years under DSPE Act; later extendable up to 5 in yearly steps by ordinance); Director chosen by a committee: PM, Leader of Opposition (or largest opposition party leader), CJI ; Single Directive struck down ; DoPT sets only overall policy, not day-to-day investigations; Director's transfer by the same committee. Central Vigilance Commission Set up in 1964 as an executive body on the K. Santhanam Committee (1962); statutory in 2003 under the CVC Act. Apex vigilance institution free of executive control; advises on planning, reviewing, reforming vigilance. Central Vigilance Commissioner + not more than two Vigilance Commissioners. Selection: from All India or Central Services, and from CPSU officers (not more than two from the two categories, so at least one from each). Committee: PM, Home Minister, Leader of Opposition (government has the final say). P.J. Thomas case (2011): government majority made the LoP's role pointless; selection must follow consensus of all members, not majority (only for this appointment). Term: 4 years for CVC and VCs; retirement age 65 ; no reappointment; a VC can become CVC but total stay not above 4 years; barred from UT administrator, diplomatic and other presidential-warrant posts; no office of profit. Pay: CVC equals UPSC Chairperson, VCs equal UPSC members; charged to the Consolidated Fund; cannot be altered to disadvantage. Removal: proved misbehaviour or incapacity on SC reference ; plus insolvency, moral turpitude, private employment, infirmity, prejudicial financial interest. Functions and powers: superintend CBI on corruption cases (Vineet Narain) and give directions; inquire on Central Government reference or on complaints against Group A, All India Service officers and equivalent CPSU officials ; review DSPE investigations and pending sanction applications; tender advice; superintend vigilance in ministries; powers of a civil court ; mandatory consultation on vigilance and disciplinary rules; CVC chairs the committee recommending the ED Director (and Deputy Director and above); chairs the committee recommending CBI officers of SP level and above (not Director). Annual report to the President, laid before Parliament. Issues: dependence on a politicised CBI; no independent prosecution powers and sanction delays; non-cooperative government; poor engagement with civil society. Suggestions: independent investigative and prosecution powers (2nd ARC: functional autonomy); 3-6 month statutory timeline for sanction (TI India: over 70% of sanctions pending beyond 6 months in 2023); binding oversight over vigilance administration; manpower ( less than 50% of sanctioned staff , over 1,500 organisations per CVC 2023 report); civil society participation (South Korea ACRC); binding recommendations ; wider selection panel (judiciary or experts)."}, {"c": "2", "n": "Corruption, Social Audit, CBI, CVC, Lokpal, Whistleblowers and PCA", "id": "4-lokpal-in-india", "t": "4 · Lokpal in India", "x": "4 · Lokpal in India # Handout only · M2 p.15-19 Exam lens Priority: Medium. Mains PYQs quoted: 2013. Prelims PYQs quoted: none quoted in the material. Prelims hooks 9-member body; 50% judicial; 50% affirmative action; age 45+; 5 years or 70; salary CJI/SC judge Selection committee: PM, Speaker, LoP, CJI/nominee, eminent jurist; search committee of 7 PM covered partially (not public order, security, atomic energy, space; full bench two-thirds) Removal reference signed by 100 MPs; 60 days preliminary inquiry; 7-year limitation Maharashtra first Lokayukta (1971); Odisha 1992, Haryana 1999 abolished Mains hooks Should the PM be covered? 2nd ARC arguments and counter-arguments Issues with Lokpal; functioning since 2019 Lokpal is not a panacea No single body can cure a hydra: Lokpal works only inside a multi-pronged strategy. In simple words The ombudsman idea: Sweden 1809, UK 1967. In India the first bill came in 1968, the Act in 2013 , and the Lokpal was constituted in 2019 with Justice P.C. Ghose as Chairperson. Maharashtra had the first Lokayukta (1971). State Lokayuktas often became 'paper tigers': recommendatory, misused, and some were abolished (Odisha 1992, Haryana 1999). The Lokpal has nine members including the Chairperson; half judicial, half non-judicial; 50% reserved. Selection committee: PM, Lok Sabha Speaker, Leader of Opposition, CJI or nominee and an eminent jurist. It covers PM (partly), ministers, MPs and Groups A-D, plus bodies funded above Rs 10 lakh. A preliminary inquiry runs within 60 days; a 7-year limit applies to complaints. The PM is covered only partly: no inquiry into decisions on public order, security, atomic energy and space, and a full-bench two-thirds majority is needed. The record is thin: complaints fell from 1,427 (2019-20) to 110 (2020-21) to 12 till August 2021-22. Term In plain words Ombudsman The office for complaints against public servants; Sweden appointed the first in 1809. Lokayukta The state-level counterpart; Maharashtra had the first (1971). Remember it as Lokpal: Act 2013, constituted 2019. The Ombudsman began in Sweden (1809). India's First ARC proposed a two-tier model; the bill was first introduced in 1968, passed in 2013, and the Lokpal constituted in 2019. States' Lokayuktas show the weaknesses: no standard design, 'paper tigers', abolition by governments. Ombudsman: Sweden 1809 ; UK Parliamentary Commissioner 1967 ; USA in some states (Hawaii, Oregon, Nebraska), not federal. First ARC: two-tier: Lokpal for Secretary-rank and above at Union and State levels; Union Lokayukta for lower officials; State Lokayuktas in states. India: first bill 1968 ; Act 2013 ; Lokpal constituted 2019 with Justice P.C. Ghose as Chairperson of the nine-member body. Maharashtra first state Lokayukta ( 1971 ). State experience Flooded with complaints; poor effectiveness; inter-state differences (qualifications, tenure, powers, suo motu, no separate agency); survival depends on state government ( Odisha abolished it by ordinance in 1992; Haryana in 1999 ); recommendatory 'paper tigers' ; corruption within; misused against political opponents. Lokpal Act 2013 Composition: nine members including the Chairperson. Chairperson: a present or former CJI or SC judge, or an eminent person with 25 years' experience in vigilance, anti-corruption, law, finance, administration, management. Eight members: half judicial (SC judge or High Court Chief Justice), half non-judicial (eminent, 25 years). 50% affirmative action: SC, ST, OBC, minorities, women. Conditions: not an MP, MLA, MLC; no local body membership; minimum age 45 ; not removed or dismissed from government service; no office of profit, business or profession; no party affiliation. Appointment by the President on a committee: PM (Chair), Lok Sabha Speaker, Leader of Opposition (LS) (silent on a missing LoP), CJI or nominated SC judge , eminent jurist chosen by the four. A search committee of 7 shortlists, with 50% reservation; the selection committee may go beyond its names. Tenure: 5 years or age 70 ; no reappointment, except a member elevated to Chairperson within the 5-year limit. Salary: Chairperson equals CJI; members equal SC judge. Disabilities: like the CVC plus ineligible for any election for 5 years . Structure: Inquiry Wing (Director of Inquiry), Prosecution Wing (Director of Prosecution), Secretary. Should the Prime Minister be covered? 2nd ARC opposed: would cripple administration during investigation; foreign powers might exploit it; PM already covered by the PCA 1988. Counter: CBI works under DoPT, hence the PM, which would hamper probes; PM should lead by example (some Lokayuktas cover Chief Ministers); Article 361 exempts only President and Governors. Act covers PM partially: no inquiry into PM decisions on public order, internal and external security, atomic energy, space ; the full bench by two-thirds majority must approve initiating an inquiry or investigation. Jurisdiction and functions PM, Union Ministers, MPs, Group A-D officials , and bodies funded by government above Rs 10 lakh a year . Any individual may complain for PCA offences. Preliminary inquiry via the Inquiry Wing, CVC or agencies like CBI; explanation sought from the public servant; complaints against Groups C and D referred to the CVC ; preliminary inquiry within 60 days . After the report and hearing: full investigation, departmental proceedings, close the case, or proceed against a false complainant. A bench of at least 3 members decides on sanction. Lokpal replaces the appointing authority in sanctions under CrPC Sec 197 and PCA Sec 19 . Powers of search, seizure, attachment , and civil court powers; superintendence over CBI for cases it refers. Removal: on misbehaviour by SC reference signed by at least 100 MPs ; President on other grounds (insolvency, private employment, infirmity, prejudicial financial interest). Annual asset declarations; annual report with a memorandum explaining rejected recommendations; 7-year limitation for complaints. Issues Too wide jurisdiction; convoluted appointment; PM only partly covered; 7-year limit; scope may intimidate NGOs; delays in appointment. Functioning since 2019: allegations of emasculation by legislation; delayed complaint-form rules, asset disclosure rules, preliminary inquiry and investigation rules; wings not set up by 2020; by Sept 2019 disposed of 1,000 of 1,065 complaints ; complaints fell from 1,427 (2019-20) to 110 (2020-21) to 12 till August 2021-22 . 2nd ARC: give Lokpal and Lokayuktas constitutional status ; Rashtriya Lok Ayukta for Union Ministers, MPs and State Chief Ministers; State Lokayukta for state ministers and legislators; CVC for civil servants ; a Local Bodies Ombudsman . Not a panacea: hydra-headed corruption needs multi-pronged strategy; huge bureaucracy; petty complaints need departmental handling; inadequate judicial process; lacking citizen empowerment and willingness to complain."}, {"c": "2", "n": "Corruption, Social Audit, CBI, CVC, Lokpal, Whistleblowers and PCA", "id": "5-whistleblower-protection-and-the-pca-198", "t": "5 · Whistleblower Protection and the PCA 1988", "x": "5 · Whistleblower Protection and the PCA 1988 # Handout only · M2 p.19-20 Exam lens Priority: High. Mains PYQs quoted: 2015, 2022. Prelims PYQs quoted: none quoted in the material. Prelims hooks Competent authority: PM (Union Ministers), CM (state ministers), Presiding Officer (legislators), CVC (civil servants) No anonymous complaints; frivolous complaint penalised with 2-year jail 2015 amendment bill lapsed: OSA to override the Act SEBI tipping mechanism: reward up to Rs 1 crore PCA 2018: bribe-giving an offence; 7-day complaint defence; jail 3 to 7 years; trial in 2 years, max 4; Sec 17A extends to retired servants Mains hooks Challenges with the Whistleblower Act and measures to strengthen it 2nd ARC and Law Commission framework Why the 2018 PCA amendment is both strengthening and diluting A whistleblower law without anonymity protects the disclosure but not the discloser. In simple words The Whistle Blowers Protection Act 2014 lets anyone disclose corruption or wilful misuse of power by a public body. Disclosures go to the competent authority (PM for Union Ministers, CM for state ministers, Presiding Officer for legislators, CVC for civil servants). Anonymous complaints are not entertained ; frivolous ones can earn 2 years' jail. Challenges: no anonymity (Satyendra Dubey), weak implementation and awareness, little protection from victimisation. Needs: wider coverage including the private sector; SEBI's tipping reward up to Rs 1 crore. The Prevention of Corruption Act 1988 covers every public servant: government staff, PSU employees, local body functionaries, judges, PSC members, university employees, MPs and MLAs. The 2018 Amendment : giving a bribe is an offence (with a 7-day complaint exemption in coercive cases); Sec 17A extends protection to retired servants; jail raised from 3 to 7 years; trial in 2 years (up to 4); commercial organisations can be prosecuted. Term In plain words PIDPI The short name the handout gives for the 2014 Whistle Blowers Protection Act. Sec 17A PCA 2018: permission needed for preliminary inquiry, except when caught red-handed. Remember it as PCA 2018 cuts both ways: it penalises the bribe-giver and shields the officer. The 2014 Act has no anonymity, narrow safeguards and a lapsed 2015 amendment bill that would have let the Official Secrets Act override it. The PCA 1988 covers all public servants; the 2018 amendment criminalised bribe-giving, raised penalties and added Sec 17A. Whistleblower Protection Act, 2014 (PIDPI) Anyone can be a whistleblower regarding any public body. Disclosure to the competent authority : PM for Union Ministers, Chief Minister for state ministers, Presiding Officer for legislators, CVC for civil servants. No anonymous complaints. CVC can issue directions for protection. Frivolous complaints: 2-year jail. 2015 amendment bill (lapsed): proposed that the Official Secrets Act 1923 would override the Act. Challenges No anonymity (murder of Satyendra Dubey , who reported corruption in the NHAI); weak organisational implementation and awareness; inadequate protection against victimisation; yet complaints rise ( 2018: over 3,500 complaints to NSE-listed companies ). Measures needed 2nd ARC: stronger law covering public and private sectors. Law Commission framework: confidentiality and anonymity; protection against victimisation and bodily harm; coverage of corporate whistleblowers. SEBI's tipping mechanism: rewards up to Rs 1 crore for actionable information on insider trading, with confidentiality. Prevention of Corruption Act, 1988 Covers all public servants : anyone in government pay or service; PSU employees; local body functionaries; judges; office-bearers of government-funded cooperatives; PSC members; employees of central and state universities; deemed university employees (SC, 2020) ; anyone performing a public duty by virtue of office, including MPs and MLAs. PCA Amendment Act, 2018 Giving a bribe is explicitly an offence; in coercive corruption , a complaint within 7 days frees the giver from guilt. Sec 17A extended to retired civil servants . Original Sec 13(1)(d) (decision benefiting a commercial organisation against public interest) diluted . Jail from 3 to 7 years. Trial in 2 years, up to 4 . Provisions for prosecuting commercial organisations and for attachment or confiscation of property."}, {"c": "2", "n": "Corruption, Social Audit, CBI, CVC, Lokpal, Whistleblowers and PCA", "id": "chapter-timeline", "t": "Timeline", "x": "Timeline # 1941 Special Police Establishment set up (M2 p.12) 1946 DSPE Act gives CBI statutory backing (M2 p.12) 1962 K. Santhanam Committee on Prevention of Corruption (M2 p.13) 1963 SPE gets the name CBI (M2 p.12) 1967 UK Parliamentary Commissioner (ombudsman) (M2 p.15) 1968 First Lokpal bill introduced in India (M2 p.15) 1971 Maharashtra: first state Lokayukta (M2 p.15) 1977 US Foreign Corrupt Practices Act (M2 p.9) 1988 Prevention of Corruption Act; Benami Properties Act (M2 p.11) 1989 FATF formed (M2 p.9) 1992 Odisha abolishes its Lokayukta by ordinance (M2 p.16) 1997 Vineet Narain judgment; Tamil Nadu first state RTI law; Shourie working group; OECD Anti-Bribery Convention; judges' assets resolution (M2 p.12; M1 p.32-33) 1999 Haryana abolishes its Lokayukta (M2 p.16) 2010 UK Bribery Act; CIC holds DIAL a public authority (Delhi HC stays) (M2 p.9; M1 p.33) 2011 P.J. Thomas case: CVC selection must be by consensus (M2 p.13) 2017 Meghalaya Social Audit Act; NITI Aayog Three-Year Action Agenda 2017-20 (M2 p.10; M1 p.6) 2018 PCA Amendment (Sec 17A, bribe-giving an offence); 10 lateral entry JS posts; CIC affirms BCCI a public authority (M2 p.6, 20; M1 p.6, 33)"}, {"c": "2", "n": "Corruption, Social Audit, CBI, CVC, Lokpal, Whistleblowers and PCA", "id": "side-by-side", "t": "Side by side", "x": "Side by side # Who selects whom (M1 p.26, 36;
