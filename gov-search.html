.recall{font:16px/1.55 var(--sans);padding-left:24px}.recall li{margin:6px 0}

.fc.back{background:var(--acc-soft)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.btn{font:600 14px var(--sans);padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:40px 0 20px}.pager a{display:block;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;text-decoration:none;color:var(--ink);font:600 15px var(--sans)}.pager a.nx{text-align:right}.pager small{display:block;color:var(--muted);font-weight:500;font-size:12px}

/* ---- reader app ---- */
:root{--zoom:1;--lh:1.65;--pw:780px}
:root[data-theme="sepia"]{--bg:#F4ECD8;--surface:#FBF5E6;--surface2:#EADFC4;--ink:#3B3022;--muted:#7A6A52;--line:#D8C9A6;--acc:#7A4A12;--acc-ink:#fff;--acc-soft:#EFDDB8;--saf:#A4470A;--saf-soft:#F6E2BE;--red:#9C2A1C;--red-soft:#F3D9CB;--blue:#2F5C8A;--blue-soft:#DDE6E4;--good:#3E6B2A;--good-soft:#DDE8C8;--hl:#F2D98A;color-scheme:light}
:root[data-font="sans"] body{font-family:var(--sans)}
:root[data-font="sans"] .notes p,:root[data-font="sans"] .notes li{font-family:var(--sans)}
.page{zoom:var(--zoom);max-width:var(--pw)}
.notes p,.notes li{line-height:var(--lh)}
.rbar{position:fixed;left:0;top:0;height:3px;width:0;background:var(--acc);z-index:40;transition:width .15s}
.aabtn{color:var(--ink);border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:5px 12px;font:700 14px var(--serif);cursor:pointer;flex:none}
.h2read{float:right;margin:2px 0 0 10px;font:600 12px var(--sans);border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer;min-height:30px}
.h2read[aria-pressed="true"]{background:var(--acc-soft);color:var(--acc);border-color:var(--acc)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;justify-content:center}
.dock button{font:600 14px var(--sans);min-height:44px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;padding:0 14px;cursor:pointer}
.dock .mid{flex:1;max-width:520px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock .mid b{color:var(--acc)}
body.has-dock .page{padding-bottom:110px}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheetin{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:82vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));font:15px/1.4 var(--sans)}
.sheetin h3{margin:0 0 10px;font:700 17px var(--sans)}
.srow{display:flex;align-items:center;gap:10px;margin:12px 0;flex-wrap:wrap}
.srow label{flex:0 0 92px;color:var(--muted);font-weight:600}
.srow .grp{display:flex;gap:6px;flex-wrap:wrap}
.srow button{font:600 14px var(--sans);min-height:42px;min-width:48px;padding:0 12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;cursor:pointer}
.srow button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.secl a{display:flex;gap:10px;align-items:center;padding:12px 6px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;min-height:44px}
.secl a .tk{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--acc-ink)}
.secl a.rd .tk{background:var(--acc);border-color:var(--acc)}
.secl a.cur{background:var(--acc-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:50;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;font:600 14px var(--sans);max-width:92vw;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.toast button{font:700 14px var(--sans);background:transparent;border:0;color:var(--bg);text-decoration:underline;cursor:pointer;min-height:36px}
body.focus .bar{display:none}body.focus .sidetoc{display:none}
figcaption.clamp{max-height:3.3em;overflow:hidden;position:relative;cursor:pointer}

t": "Limits of the material", "x": "Limits of the material # The 2014, 2017 and 2020 questions in Module 1 are printed without marks; 2017 and 2020 give word limits (250 and 150). Rule: plan the 2014-type answer at 10-15 marks from the notes, check the paper's marks on the day. Public Examination Act 2024 (M2 p.20), Satyam 2009 (p.21) and DBT 2022 (one line only) are not covered; the CBI 2021 question needs state-consent material not in the notes. Rule: cover them from other material."}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "1-civil-services-upsc-and-spsc", "t": "1 · Civil Services: UPSC and SPSC", "x": "1 · Civil Services: UPSC and SPSC # Handout only · M1 p.3-4 Exam lens Priority: Low. Mains PYQs quoted: none quoted in the material. Prelims PYQs quoted: none quoted in the material. Prelims hooks FPSC set up in 1926 (Lee Commission, 1924); Madras 1929 first provincial PSC; Sir Ross Barker first chairman Article numbers 315-323 and what each covers Seniority convention for UPSC Chairman broken in 2015 57 deviations (1950-84) vs 82 (1984-88) Mains hooks Why the UPSC does not enjoy equal status with EC, CAG and SC (no separate oath, easier removal) Negative recruitment; two 2nd ARC models for compressing the exam cycle From UPSC to a Central Personnel Agency Independent on paper, advisory in practice: the Commission needs both status and a positive recruitment mission. In simple words The Public Service Commissions are the Constitution's recruiters: the UPSC for the Centre and an SPSC for each state (Part XIV, Articles 308-323). They began under British rule. The 1919 Act provided for a Federal PSC, which came in 1926 after the Lee Commission (1924). Madras (1929) set up the first provincial commission. The 1935 Act created three kinds: Federal, Provincial and Joint. The Constitution protects their independence: service conditions cannot be cut after appointment, salaries are paid directly from the Consolidated Fund, and removal follows only the route the Constitution lays down. In practice the shield is thinner. Governments set aside the Commission's advice (57 times in 1950-84, then 82 times in 1984-88). The UPSC has no separate oath and an easier removal process than the EC, CAG or Supreme Court. Recruitment is 'negative': it screens people out instead of finding the best fit. The reform direction in the handout: turn the UPSC into a Central Personnel Agency that recruits positively and runs research on civil-service management. Term In plain words Negative recruitment Eliminating the unsuitable rather than finding the most suitable. Charged expenditure Salaries and allowances paid directly from the Consolidated Fund of India or the State. Central Personnel Agency The role the handout wants the UPSC to grow into. Remember it as Article ladder: 315 set-up, 316 appointment, 317 removal, 319 bar after office, 320 functions, 321 extension, 322 expenses, 323 reports. Part XIV (Arts 308-323) gives the country its Public Service Commissions. They began with the 1919 Act and the 1926 FPSC, and are protected by constitutional safeguards, yet governments deviate from their advice and the UPSC lacks the status of the other constitutional bodies. Civil services are dealt with in Part XIV, Articles 308 to 323 . Public Service Commissions: UPSC (Centre) and SPSCs (states). Historical context GoI Act 1919: first provided for a Federal Public Service Commission . It did not make Provincial PSCs mandatory; provinces could set up their own by law. The FPSC was delayed and set up in 1926 on the recommendation of the Lee Commission (1924) . Madras (1929): first province to set up a Provincial PSC. GoI Act 1935: three types: Federal (FPSC), Provincial (PPSC), Joint (JPSC). Carried into the Constitution under Article 315 . First Chairman: Sir Ross Barker, of the FPSC, in 1926. Article Provision 315 PSCs for the Union and the States 316 Appointment and term of office of members 317 Removal and suspension of a member 319 Prohibition on holding certain offices after ceasing to be a member 320 Functions of PSCs 321 Power to extend the functions of PSCs 322 Expenses of PSCs 323 Reports of PSCs Provisions securing independence Conditions of service cannot be reduced to a member's disadvantage after appointment. Salaries and allowances are charged expenditure on the Consolidated Fund (India or the State). Removal only on the grounds and in the manner the Constitution provides. Post-retirement disabilities bar certain later government appointments. Convention: the senior-most member is elevated as UPSC Chairman; this convention was violated in 2015 . Issues in working Deviation from recommendations without adequate reasons: 57 times between 1950 and 1984 , against 82 instances between 1984 and 1988 . One-size-fits-all recruitment does not suit different services. Article 320(3): abuse of its provisions and influence of three categories of officials: technical, managerial, political. No specific educational qualification is prescribed for members. Institutional conflict with the CVC. Unequal status: regarded as one of four important constitutional institutions (with EC, CAG, SC), yet UPSC has no separate oath and its removal process is relatively easier . Exam structure and duration; negative recruitment (eliminating the unsuitable rather than finding the most suitable); archaic philosophy of recruitment. Second ARC: two models to compress the exam cycle Model Recommendation I Prelims and Mains held together over 2-3 consecutive days. Mains papers evaluated only for those above a Prelims threshold. Personality Test follows. II Shortlist on Prelims rank, limited to about 2-3 times the vacancies. Mains within two months of Prelims, so Mains and Personality Test start almost together. Weaknesses of the interview: too short; desultory conversation; artificial atmosphere; element of luck; tendency to reproduce oneself; subjectivity and bias. State PSCs Some commissions have become centres of corruption; poor quality of members; blind imitation of UPSC; may function like subsidiaries of UPSC; no formal linkage between UPSC and SPSCs. First ARC recommendations on PSCs One SPSC member from outside the state. Members to hold a graduation degree. UPSC and SPSC Chairmen consulted in appointing SPSC members; UPSC Chairman consulted for UPSC members and successor. Two-thirds of UPSC members drawn from SPSC Chairpersons. Separate qualifications for official and non-official members. Role of UPSC today Evolve into a Central Personnel Agency ; move from negative to positive recruitment; develop the psycho-social profile of candidates; involve outside experts; be the principal R&D body in civil services management; abandon one-size-fits-all."}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "2-civil-services-meaning-and-lateral-entry", "t": "2 · Civil Services: Meaning and Lateral Entry", "x": "2 · Civil Services: Meaning and Lateral Entry # Handout only · M1 p.5-7 Exam lens Priority: Medium. Mains PYQs quoted: 2014. Prelims PYQs quoted: none quoted in the material. Prelims hooks 1765 term coined; excluded groups (political executives, judiciary, defence, PSU staff) 3 AIS; Third Pay Commission renamed Class 1-4 as Group A-D Lateral entry: 2018 (10 JS posts, 3 yrs extendable to 5), 2021 (31 posts), Aug 2024 (45 posts, cancelled 20 Aug) Type I and Type II error argument Mains hooks Aristocratic personnel system and its consequences Generalist vs specialist; need for domain expertise after 10-12 years of service Lateral entry: need, issues, the 2024 reservation controversy Lateral entry fixes a skills gap but must be built on reservation, field exposure and skilled permanent staff. In simple words 'Civil Services' was a term coined by the East India Company around 1765 to separate combatant from non-combatant staff. Civil servants sit inside the larger circle of public servants. Political Entry 70 Union List; 2:1 outsider-insider ratio Arts 309, 310, 311, 323A; T.S.R. Subramanian (2013) Mains hooks Rationale for continuing AIS vs states' concerns Committee views: Rajamannar vs Sarkaria Doctrine of Pleasure; 2nd ARC on Article 311 AIS bind the federation together, but authority and responsibility must be re-balanced between Centre and states. In simple words All India Services are recruited and trained by the Union but serve under both Centre and States. India has three today: IAS, IPS and IFoS (25 cadres, two of them joint). They shrank over time: 9 (1909), 4 (1924), 2 (1947). Abolishing one is called provincialisation . In the Constituent Assembly some doubted them, but Sardar Patel (Father of the AIS) argued for them as the 'Steel Frame' that holds the country together; Article 312 gave them constitutional status. Supporters say AIS bring the best talent, national unity and Centre-State coordination. States reply that the authority-responsibility link is broken: they have limited control over officers they must work with. The same part of the handout gives the protections of civil servants: Articles 309, 310, 311, the Doctrine of Pleasure, and the T.S.R. Subramanian (2013) call for fixed tenure and Civil Services Boards. Term In plain words Provincialisation Abolishing an All India Service. Doctrine of Pleasure Public employment is not a private contract: termination is allowed within constitutional safeguards. Steel Frame Lloyd George's phrase for the Imperial Civil Service; the AIS were later called the Steel Frame of India. Remember it as 309 = recruitment, 310 = tenure, 311 = dismissal, 312 = AIS, 16 = equal opportunity, 323A = tribunals. AIS began under British rule, survived Constituent Assembly opposition through Patel's insistence, and rest on Article 312. States now question their logic, while commissions mostly want them strengthened. AIS originated under British rule. Officers are recruited and trained by the Union but serve under both Centre and States. 1909: nine AIS; 1924: four ; 1947: two . Abolishing an AIS is called provincialisation . India has three today: IAS, IPS, IFoS. Constituent Assembly debate Opposition: Nehru Committee Report (1928) not keen; regional interests feared Centre's influence; British policy had moved to reduce their number; Nehru initially not in favour . Retained and given constitutional status under Article 312 largely through Sardar Patel ( Father of All India Services ). Arguments: states lacked capacity to recruit; AIS the Steel Frame maintaining unity. David Lloyd George used 'Steel Frame' for the Imperial Civil Service. Article 312 provides for the creation of AIS. 25 cadres , including two joint cadres: AGMUT (Arunachal Pradesh, Goa, Mizoram, Union Territories) and Assam-Meghalaya . Rationale for continuing Best talent joins; promotes national unity; wholesome effect on federalism; Union stays in touch with ground realities; wider national outlook in states; Centre can act through AIS in emergencies; less political consideration in key postings; integrated infrastructure development; Centre-State coordination on law and order; day-to-day coordination of bureaucracies. Critique (states' concerns) Changed circumstances: unity not threatened as at Independence; unity needs a stronger base than administration; authority-responsibility mismatch (states have limited control over AIS officers); demoralised state civil services (second-in-command); 2:1 outsider-insider ratio seen as central influence; 'sons of the soil' demands; federal concern: AIS is joint responsibility yet falls under Entry 70 of the Union List ; officers spend most of their careers in one cadre state. Body View on AIS Rajamannar Commission Disband the AIS Sarkaria Commission Disbanding is a retrograde step; strengthen AIS and reduce excessive generalism Sarkaria Commission Regular Centre-State consultation; Advisory Council on AIS headed by the Cabinet Secretary Sarkaria Commission Create new AIS: Indian Engineering, Medical and Health, and Education Services Other constitutional provisions Article Provision 309 Recruitment and conditions of service of persons serving the Union or a State 310 Tenure of office 311 Dismissal, removal or reduction in rank of persons in civil capacities 16 Equality of opportunity in public employment 323A Administrative tribunals (CAT, SATs) Doctrine of Pleasure: public employment cannot be equated with contract-based private employment. Civil servants must be responsive to people and responsible to the government. Termination allowed subject to constitutional safeguards. 2nd ARC on Art 311: growing procedural protection made it hard to dismiss even those who deserved it. Recommended repealing Article 311 , a comprehensive Civil Services Law , and clear definition of reasonable opportunity. Articles 309, 310, 311, 320 govern recruitment, tenure, protection and PSC consultation. Service rules (restrictions) Cannot join a political party, give to political funds or contest elections; can vote but not disclose preference; limits on family's political involvement, adverse criticism of government and media interaction; annual declaration of assets and liabilities; report gifts. T.S.R. Subramanian case (2013): SC recommended minimum guaranteed tenure in key positions; Civil Services Boards to advise on postings and transfers; avoid acting on verbal orders; enact a comprehensive Civil Services Law."}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "4-role-of-civil-services-in-democracy", "t": "4 · Role of Civil Services in Democracy", "x": "4 · Role of Civil Services in Democracy # Handout only · M1 p.9-12 Exam lens Priority: Medium. Mains PYQs quoted: 2017. Prelims PYQs quoted: none quoted in the material. Prelims hooks Neutrality = class, cultural, political; three forms of confidence Policy neutrality is not political neutrality Bhaskar Ghose's three bureaucrat types Max Weber on bureaucracy as an institution Lakhina Experiment, Ahmednagar (colour-coding of files) Mains hooks Why neutrality is hard to secure (4Cs, multi-party pressure) Anonymity vs social accountability tools Factors hindering professionalism Case for and against civil service activism Understand politics, do not play politics: neutrality in loyalty, not in intellect. In simple words The handout expects six qualities from civil servants: neutrality, commitment, anonymity, instrumentality, professionality, impersonality . Neutrality has three layers: class (officers are mostly middle class), cultural (language, caste, religion, region) and political. Political neutrality rests on three confidences: the people's, the ministers' and the civil servants' own. Political neutrality is not policy neutrality : civil servants advise on policy intellectually, never emotionally. They must understand politics, not play politics. The 4Cs (criminalisation, casteism, communalism, corruption) make this hard. Bhaskar Ghose's three types show the choices: Neither Wilt nor Tilt (firm), Incorrigibly Corrupt (find godfathers) and Weather Report Readers (shift with circumstances). Anonymity means the minister takes credit and blame, but RTI, social audits and Citizens' Charters are loosening it. Activism (media, leaks, courts, whistleblowing, the Lakhina Experiment) is a sign of the times, though the handout says it cannot be encouraged. Term In plain words Impersonality Not personalising the position held; no excess personal relations that cloud objectivity. Instrumentality Being an instrument of the people, not an independent power structure. Lakhina Experiment Dr. Lakhina's colour-coded files by year in Ahmednagar, 1980s: grassroots activism. Remember it as Wilt-Tilt = firm; Corrupt = godfathers; Weather Report = shifters. The handout lists six roles (neutrality, commitment, anonymity, instrumentality, professionality, impersonality). Each is under strain: class bias, social audits eroding anonymity, bureaucracy becoming an institution, poor training, personalised posts. Activism is a symptom of reform neglect. Six roles are envisaged: neutrality, commitment, anonymity, instrumentality, professionality, impersonality . Handout figure, M1 p.9 The six roles envisaged for civil services: neutrality, commitment, anonymity, professionality, instrumental and impersonality roles. Neutrality Class neutrality: officers come mostly from the middle class, whose mindset can dominate; elite capture of state institutions (example given: National Rifle Association, USA). Cultural neutrality: language, caste, religion, region and other identities. Political neutrality shows through three forms of confidence: Confidence of Meaning People Serve whichever party the people elect with diligence and commitment Ministers Perform duties with commitment irrespective of the minister's ideology Civil servants Postings, careers, promotions on objective merit, not political affiliation Policy vs political neutrality: ministers may lack specialised knowledge, so civil servants advise. Political neutrality is not policy neutrality. Involvement in policy must be intellectual, never emotional . Civil servants must understand politics, not play politics . Problems: a thinking person is never fully neutral; the 4Cs of the political environment ; parties may demand loyalty; no agreement on fundamentals (extreme right, extreme left, secular parties); multi-party democracy brings pressures at Centre and state. Handout figure, M1 p.10 The 4Cs of the political environment that make neutrality difficult: Criminalization, Casteism, Communalism, Corruption. Bhaskar Ghose's type Behaviour Neither Wilt nor Tilt Firm; refuse orders deviating from policy or law; may be transferred but keep honesty Incorrigibly Corrupt Find political godfathers early and align with parties Weather Report Readers Shift loyalty with political circumstances Commitment Impartial rule of law; code of ethics; settled policies and programmes; probity and transparency; sense of duty; welfare of Daridra , the poorest of the poor. Anonymity Civil servants work behind the scenes; the minister is the public face. Credit and major failure both go to the minister. Anonymity goes hand in hand with ministerial responsibility ; ministers must protect civil servants. The concept is changing with social audits, RTI, Citizens' Charters, time-bound service delivery laws . Instrumentality Civil services are an instrument of the people, but a full-fledged bureaucracy can become an independent power structure , an institution with elitist values. Max Weber: once bureaucracy becomes an institution it is one of the hardest social structures to dismantle. Professionality A professional keeps improving knowledge and skills. Hindrances: generalists in specialist services; poor training (confined to Group A and B; only one in five civil servants can expect formal training; mid-career training often absent); ineffective appraisal (no quantifiable targets); weak incentives (' hire, but no fire '); IAS dominance with limited lateral entry. Impersonality Do not personalise the position (DC, SP). Impersonal attitude to superiors, colleagues and juniors; excessive personal relations compromise objectivity (example: overlooking a friend's corrupt behaviour). Civil services activism A civil servant becomes a crusader . Forms: going to the media; calculated leaks; going to courts; whistleblowing ; grassroots activism; post-retirement activism (NGOs, YouTube channels). Case study: Dr. Lakhina, Ahmednagar (1980s): colour-coded files by year so older files could be found. Called the Lakhina Experiment ; example of grassroots activism. Issues: may violate service rules and set a bad precedent; personalises institutional issues (e.g. targeting the Chief Minister); exposes civil services to manipulation by parties and media; erodes credibility of institutions. Conclusion in handout: activism cannot be encouraged, but it is a sign of our times; civil service and electoral reforms must be implemented more effectively."}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "5-working-and-performance-of-civil-service", "t": "5 · Working and Performance of Civil Services", "x": "5 · Working and Performance of Civil Services # Handout only · M1 p.12-13 Exam lens Priority: Low. Mains PYQs quoted: none quoted in the material. Prelims PYQs quoted: none quoted in the material. Prelims hooks Average District Collector tenure about one year Street-level bureaucracy defined The 3Ms: MTV, Macintosh, McDonald's SPVs: Solar Energy Corporation, National Skill Development Corporation Mains hooks Performance table: regulatory, rule of law, developmental, facilitation Causes of poor performance 21st-century challenges for bureaucracy Doer, facilitator and regulator: the bureaucracy must now play all three roles while being held to global standards. In simple words Civil services do four jobs: formulate policy , implement it, evaluate it, and adjudicate (quasi-judicial powers, e.g. Collectors in revenue courts). They also give continuity when governments change. Evaluation has a built-in problem: officers judge programmes they themselves ran, a conflict of interest, which is why social audits matter. Report card: relatively good at preserving the constitutional order and law and order; weaker on impartial rule of law (class bias, corruption, interference); mixed on development; shifting after 1991 from direct doer to facilitator. Why performance suffers: political interference, dual control over AIS, arbitrary transfers and short tenures (a DC averages about a year), street-level corruption, weak training and appraisal, wage compression. The 21st century adds globalised problems (COVID-19, terrorism, money laundering), new roles (doer, facilitator, regulator), global yardsticks, expanding rights and a global monoculture (the 3Ms). Term In plain words Street-level bureaucracy Lower-level officials who deal directly with citizens. 3Ms of monoculture MTV (fast music), Macintosh (fast computers), McDonald's (fast food). Remember it as Formulate - Implement - Evaluate - Adjudicate. Civil servants formulate, implement and evaluate policy and adjudicate, but performance is mixed: good on regulation, weak on facilitation. Short tenures, corruption and thin training explain much of it, and 21st-century problems demand new roles. Functions Policy formulation: channel between grassroots and top; background facts, court judgments, laws; technical considerations; policy advice with value judgments; drafting legislation; balanced policies. Policy implementation: rule-making, financial management, HR management, monitoring and supervision. Policy evaluation: feedback to leadership, but a conflict of interest arises when officers evaluate programmes they implemented. This raises the importance of social audits . Administrative adjudication: quasi-judicial powers (District Collectors decide certain disputes through revenue courts). Continuity in administration despite political change. Function Performance Regulatory Relatively satisfactory in preserving constitutional order, democracy, secularism, unity and law and order Impartial rule of law Affected by class bias, corruption, political interference Developmental Mixed Facilitation (post-1991) Shift from direct doer towards facilitating private sector, civil society, NGOs, local bodies; performance particularly weak Causes of poor performance Political interference; dual control over AIS; reluctance to use constitutional protection (high personal and financial cost); arbitrary transfers and short tenures (average DC tenure about one year; T.S.R. Subramanian stressed tenure security); corruption in street-level bureaucracy (lower-level officials who deal directly with citizens); poor capacity building; wage compression ; poor performance evaluation; lack of people's participation. Challenges of the 21st century Globalisation of domestic problems (COVID-19, money laundering, terrorism, drugs) needing multilateral coordination and negotiation skills. Changing roles: doer (more cost-efficient), facilitator (local bodies, NGOs), regulator (new skills for law and order). Changing accountability: global yardsticks (Transparency International, HDI, SDGs, Ease of Doing Business) plus direct citizen tools (Citizens' Charters, social audits). Continuous (not episodic) reforms; professionalism; expanding horizon of rights (environment, consumer, disability, LGBT, privacy); global monoculture (the 3Ms : MTV fast music, Macintosh fast computers, McDonald's fast food); tailor-made institutions and SPVs (Solar Energy Corporation, National Skill Development Corporation); crisis of State credibility after LPG reforms and WTO participation. Handout alert PYQ 2014 (in the handout at this point): Has the cadre-based civil services organisation been the cause of slow change in India? Critically examine. The answer material is in Section 2 (aristocratic personnel system; reasons for slow social change)."}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "6-bureaucracy-and-development", "t": "6 · Bureaucracy and Development", "x": "6 · Bureaucracy and Development # Handout only · M1 p.13-15 Exam lens Priority: Low. Mains PYQs quoted: none quoted in the material. Prelims PYQs quoted: none quoted in the material. Prelims hooks Rajiv Gandhi: 16 paise of every rupee reaches the people Weber's four characteristics; five features of development administration Four named minister-bureaucrat conflicts (Mundhra 1957, Nanda-L.P. Singh, Hanumanthaiah-Ganguli 1973, Rajiv-Venkateswaran 1987) Terms: Hakim culture, Babu culture, goal displacement, politico-administrative no-man's land Mains hooks How bureaucracy promotes vs threatens democracy Why traditional bureaucracy suits development administration poorly Paradoxes between Indian bureaucracy and development Like fire, bureaucracy is a good servant and a bad master. In simple words Max Weber's line: democracy has a love-hate relationship with bureaucracy; it is like fire, invaluable as a servant and destructive as a master. It helps democracy by upholding rule of law, running free and fair elections and delivering socio-economic justice. It threatens democracy when the instrument becomes an institution, hoards power, hides information, shuts out NGOs and local bodies, or is misused by the state (ED, CBI examples). Power struggles create a politico-administrative no-man's land between policy making and implementation: Mundhra scandal (1957), Nanda vs L.P. Singh, Hanumanthaiah vs Ganguli, Rajiv Gandhi vs Venkateswaran. Weber's bureaucracy (specialisation, hierarchy, rules, defined roles) clashes with development administration (change, results, commitment, client orientation). Indian bureaucracy is colonial in structure and mindset (Hakim and Babu culture, red tape, secrecy). Its paradoxes: technology amid backwardness, government spending on itself (Rajiv Gandhi's 16 paise), generalists over specialists, wage compression. Term In plain words Politico-administrative no-man's land The gap left when ministers and officials struggle over power between policy making and implementation. Hakim culture Behaving as a master, not a servant. Babu culture File and rule fetishism with creative inertia. Remember it as Weber vs Development: Hierarchy/Rules vs Change/Results/Clients. Weber's bureaucracy (rules, hierarchy, role specificity) clashes with development administration (change, results, client focus). Indian bureaucracy's colonial, file-bound behaviour shows up as paradoxes such as the 16-paise leakage. Max Weber: 'Democracy has to promote what reason demands but what democratic sentiments hate.' Democracy has a love-hate relationship with bureaucracy; bureaucracy is like fire : invaluable as servant, destructive as master. How bureaucracy promotes democracy Institutionalises rule of law; conducts free and fair elections; fulfils the six role expectations; balances policymaking; implements socio-economic justice. Bureaucracy as a threat Instrument becomes institution (resists citizen-centric reform); concentrates power oligarchically; secrecy (an 'uninformed parliament'); suppresses NGOs, pressure groups, local bodies; no representative bureaucracy (mixed class, caste, religion, occupation); corruption and lack of neutrality; state oppression (agencies used against rivals; examples ED and CBI); power struggle creating a politico-administrative no-man's land . Handout figure, M1 p.14 Policy making and policy implementation overlap in a politico-administrative no man's land. Conflict Parties Mundhra Scandal (1957) LIC allegedly invested in loss-making firms of Haridas Mundhra; Finance Minister and Finance Secretary resigned Mid-1960s Home Minister Gulzarilal Nanda vs Home Secretary L.P. Singh 1973 Railway Minister K. Hanumanthaiah vs Railway Board Chairman B.C. Ganguli 1987 PM Rajiv Gandhi vs Foreign Secretary A.P. Venkateswaran (Sri Lanka policy) Weber vs development administration Handout figure, M1 p.14 Features of bureaucracy: division of labour, rule orientation, role specificity, hierarchy. Weber's bureaucracy Development administration Division of labour and specialisation Change orientation (positive change in people's conditions) Clear hierarchy Result orientation (quantified, visible results) Rule orientation (impartiality, objectivity) Commitment to change (time-bound programmes) Role specificity (accountability) Client orientation; communication and participation Bureaucracy is a form of organisation of work and can exist in private bodies too; civil service and bureaucracy are used interchangeably because the problems became pronounced in the public sector. Conflicts: goal displacement ; low adaptability (built to maintain the status quo); historical mismatch (development administration emerged after World War II); political dimension (society must be ready for development); excessive formalism, unsuitable for rural development. Features of Indian bureaucracy Structural: British pattern; long hierarchies; concentration and centralisation; cadre-based; instability of tenure (DCs 'constantly packing and unpacking'); standard departmental structure. Behavioural: colonial mindset (master, not servant); non-responsive; Hakim culture ; file and rule fetishism (Babu culture) with creative inertia; corruption; red tape; secrecy. Paradoxes Advanced technology amid backwardness; government spends more on itself (Rajiv Gandhi: only 16 paise of each rupee reaches the people); archaic values; authority-responsibility mismatch; unstable tenure; poor inter-agency coordination; centralised, non-participatory administration; learning disorders (example: repeated dengue outbreaks in Delhi); greater importance to generalists (specialists need rehabilitation); wage compression."}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "7-pay-8th-cpc-and-the-right-to-strike", "t": "7 · Pay, 8th CPC and the Right to Strike", "x": "7 · Pay, 8th CPC and the Right to Strike # Handout only · M1 p.16-17 Exam lens Priority: Low. Mains PYQs quoted: none quoted in the material. Prelims PYQs quoted: none quoted in the material. Prelims hooks 8th CPC reference date: 1 January 2026; Revised Basic Pay = Existing Basic x Fitment Factor Essential Defence Services Bill 2021: 41 ordnance factories, about 84,000 workers First ARC (1966) wanted unlawful strikes made a penal offence; ESMA mentioned Mains hooks Arguments for and against civil servants' right to strike Fiscal and state-level impact of a pay commission Way forward: regular revisions, performance-linked incentives Fair pay and a no-strike norm for essential services protect both the employee and the citizen. In simple words Government pay is often lower than the private sector, balanced by job security, fringe benefits, status and public service. The handout favours performance-linked incentives . The 8th Central Pay Commission has a reference date of 1 January 2026. Its key lever is the fitment factor : Revised Basic Pay = Existing Basic Pay x Fitment Factor. A higher factor lifts allowances and pension liabilities. Issues: the minimum-wage model, DA merger demand (DA is absorbed then reset), fiscal impact (less capex), pressure on states. Way forward: smaller regular revisions linked to inflation, revenue and fiscal capacity. Right to strike : the Essential Defence Services Bill 2021 (ordnance factories: 41 factories, about 84,000 workers) triggered the debate. For: collective protest, last resort. Against: public interest ('a loaded gun at citizens'), model-citizen expectation. Handout position: no strikes that seriously disrupt essential services; distinguish essential from non-essential. The Supreme Court observed that government employees have no fundamental, statutory or equitable right to strike. Term In plain words Fitment factor The multiplier on existing basic pay to get revised basic pay. ESMA The law under which strike misconduct can also be a disciplinary offence (as the handout notes). Remember it as Revised Basic Pay = Existing Basic Pay x Fitment Factor. Pay is lower than the private sector but offset by security and status. The 8th CPC (reference date 1 Jan 2026) raises fitment-factor, DA and fiscal questions. On strikes, the handout settles on a balance: no strikes that disrupt essential services. Bureaucrats' salaries are often lower than the private sector, but they get job security, fringe benefits, higher social status and the chance of public service. Balance: performance-linked incentives . 8th Central Pay Commission 8th CPC constituted; reference date 1 January 2026. Fitment factor is the multiplier: Revised Basic Pay = Existing Basic Pay x Fitment Factor ; higher factor raises allowances and pension liabilities. Issues: minimum-wage model (earlier three consumption units; demand to include dependent parents); DA merger demand (but DA is absorbed then reset, so part of the rise is inflation compensation); fiscal impact (committed expenditure, less capex); pressure on states to follow. Way forward: regular smaller revisions; performance orientation without hurting neutrality; workforce rationalisation; digital governance; link revisions to inflation, revenue and fiscal capacity. Right to strike Trigger: Essential Defence Services Bill, 2021 prohibiting strikes in essential defence services including ordnance factories ( 41 factories, nearly 84,000 workers ), to ensure uninterrupted supply amid a possible two-front conflict. In favour Against Citizens may use strikes as collective protest Public interest: strike threat is like a loaded gun pointed at citizens Protection against exploitation when no other remedy Civil servants are expected to be model citizens A last resort when other mechanisms fail Government is expected to treat employees fairly (preventing exploitation) Handout's balanced position: no strikes that seriously disrupt essential public services; distinguish essential from non-essential services. Strike misconduct can be a disciplinary offence under service rules and ESMA . First ARC (1966) opposed the right to strike and wanted unlawful strikes made a penal offence . The Supreme Court observed that government employees have no fundamental, statutory or equitable right to strike ."}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "8-civil-services-reforms-and-nolan-princip", "t": "8 · Civil Services Reforms and Nolan Principles", "x": "8 · Civil Services Reforms and Nolan Principles # Handout only · M1 p.17-18 Exam lens Priority: High. Mains PYQs quoted: 2017, 2020. Prelims PYQs quoted: none quoted in the material. Prelims hooks Satish Chandra Committee: separate technical exams NIPAs (2nd ARC): IIT/AIIMS-style entry, 3-4 years' training; one-year bridge course for other graduates 360-degree appraisal used for AIS empanelment for central deputation; 2nd ARC feared victimisation Nolan Committee (1995): seven principles 2nd ARC drafted a Civil Services Law Mains hooks Reforms in recruitment, training, appraisal Comprehensive Civil Services Law; domainisation Nolan Principles as an ethical foundation Reform is continuous: recruit for competence, train for roles, appraise for results, protect for neutrality. In simple words Reform in the handout runs through recruitment, training, appraisal and the legal framework . Recruitment: mainstream lateral entry, overhaul exams (Satish Chandra Committee: separate technical exams), NIPAs (2nd ARC), psycho-social profile checks and probation. Training for all, not just Groups A and B; mid-career training; better content; link training grades to career progress. Appraisal: link 0-10 grades to targets; 360-degree appraisal (superiors, colleagues, juniors, clients); stable tenure; domainisation; remove deadwood by premature retirement; a comprehensive Civil Services Law. The seven Nolan principles (1995) : Selflessness, Integrity, Objectivity, Accountability, Openness, Honesty, Leadership. Term In plain words NIPA The 2nd ARC's proposed institutes of public administration, entered after higher secondary like IITs and AIIMS. 360-degree appraisal Feedback from superiors, colleagues, juniors and clients. Domainisation Building expertise in areas such as security, infrastructure, agriculture. Remember it as Nolan: S-I-O-A-O-H-L. Reform needs to run through recruitment, training, appraisal, tenure, law, transparency, anti-corruption and the status of specialists. The Nolan Principles give the ethical frame. Recruitment Mainstream lateral entry and reduce dependence on cadre-based services. Overhaul exams: Satish Chandra Committee recommended separate exams for technical services. NIPAs (2nd ARC): after higher secondary, aspirants compete for entry like IITs and AIIMS, with 3-4 years of public administration training; other graduates could compete after a one-year bridge course . Psycho-social profile assessment, possibly an SSB-style interview. Probation to weed out unsuitable recruits. Training Training for all (not only Group A and B); mid-career training; fix content (often unsuited to field experience; treated as a paid holiday); link training grades to career progression; soft skills. Performance appraisal Link 0-10 grades to achievement of targets. 360-degree (multi-source) appraisal uses feedback from superiors, colleagues, juniors and clients; used for AIS empanelment for central deputation; 2nd ARC had reservations (victimisation of honest officers). Stability of tenure; domainisation (security, infrastructure, agriculture); performance-linked incentives; removal of deadwood by premature retirement. Comprehensive Civil Services Law (2nd ARC drafted a bill); transparency in transfers, postings, discipline; root out corruption; rehabilitate specialists who now work under generalists with inferior pay and position. Nolan principle (1995) Meaning Selflessness Act solely in public interest; no personal gain Integrity Moral uprightness; avoid conflict of interest Objectivity Merit and evidence; no bias or favouritism Accountability Answerable to the public and oversight bodies Openness Transparent, information accessible unless legally restricted Honesty Truthful in declarations and dealings Leadership Exemplify and promote these principles Handout alert PYQs printed here: UPSC 2017 (250 words): CS designed for neutrality and effectiveness, now lacking; drastic reforms? UPSC 2020 (150 words): institutional quality drives economic performance; suggest CS reforms to strengthen democracy."}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "9-challenges-to-reform-mission-karmayogi-a", "t": "9 · Challenges to Reform; Mission Karmayogi; Aarambh", "x": "9 · Challenges to Reform; Mission Karmayogi; Aarambh # Handout only · M1 p.19-20 Exam lens Priority: Medium. Mains PYQs quoted: 2020. Prelims PYQs quoted: none quoted in the material. Prelims hooks NPCSCB = Mission Karmayogi, launched 2020; rules-based to roles-based Components: iGOT Karmayogi, competency frameworks, performance management, SPV Karmayogi Bharat, Capacity Building Commission Aarambh: Common Foundation Course; Commitment, Character, Conduct Mains hooks Six challenges to civil service reform and way forward Mission Karmayogi: objectives, components, implementation challenges Karmayogi turns reform from episodic exercise into a continuous learning system. In simple words Reforms stall for reasons the handout lists: weak political will, thin management capacity, civil servants' own resistance, no safety nets, poor fit with local context and weak communication. The remedy: cross-party commitment, reform units, incentives for civil servants, safety nets, contextualising and ongoing consultation. Mission Karmayogi (2020) moves HR management from rules-based to roles-based : five parts: iGOT Karmayogi (online training), competency frameworks, outcome-based performance management, SPV Karmayogi Bharat and the Capacity Building Commission. Hurdles: integrating lateral entrants, shifting mindset from compliance to problem-solving, Centre-State coordination and digital reach in remote areas. Aarambh : a Common Foundation Course for probationers stressing Commitment, Character and Conduct. Term In plain words iGOT Karmayogi Integrated Government Online Training: on-demand, role-specific modules. SPV Karmayogi Bharat A not-for-profit company for content, partnerships and implementation support. Remember it as Karmayogi: Rules to Roles. Reforms stall for lack of sustained political will, management capacity, buy-in from civil servants, safety nets, fit with context and communication. Mission Karmayogi (2020) is the shift from rules-based to roles-based capacity building. Challenges to reform Political support and will: priorities change; leaders resist reforms that reduce influence over transfers. Management capacity: weak project management; fragmented, piecemeal efforts. Civil servants themselves: resistance (job security, uncertainty); lack of incentives. Safety nets: restructuring insecurity; need compensation, retraining, career counselling. Alignment with context: a reform successful in one state may not suit another; institutional culture resists. Communication and stakeholder engagement in design and implementation. Way forward: consistent, cross-party political commitment; implementation capacity (reform units); engage civil servants with incentives; safety nets; contextualise; institutionalise consultation and feedback. Mission Karmayogi (NPCSCB), 2020 Shift from rules-based to roles-based HR management. Objectives: future-ready workforce; competency-driven specialist governance; align with Viksit Bharat 2047 ; performance-based appraisal over tenure-based promotion. Component What it does iGOT Karmayogi Integrated Government Online Training: on-demand, role-specific modules; blended learning; AI-driven personalisation; unified across services, ministries, states Competency frameworks Competency dictionaries (behavioural, functional, domain); replace one-size-fits-all Performance management Outcome-based; beyond Annual Confidential Reports to real-time feedback; links to promotion, posting, recognition SPV: Karmayogi Bharat Not-for-profit company; content, partnerships, implementation support Capacity Building Commission Standards, alignment, monitoring, quality assurance Implementation challenges: integrating lateral entrants (culture gap, unified frameworks); mindset shift from compliance to problem-solving; Centre-State coordination (state services have distinct needs); digital infrastructure and resources, especially in remote areas. Significance: efficiency, transparency, accountability; responsive governance; rule-based, control-focused to role-based, citizen-first. Aarambh Initiative: Common Foundation Course for probationers; stresses Commitment, Character and Conduct ."}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "10-transparency-and-ndsap", "t": "10 · Transparency and NDSAP", "x": "10 · Transparency and NDSAP # Handout only · M1 p.21-23 Exam lens Priority: Low. Mains PYQs quoted: none quoted in the material. Prelims PYQs quoted: none quoted in the material. Prelims hooks OECD and UNESCAP definitions; three metaphors of transparency NDSAP 2012: DST nodal; OGD platform; negative list considers RTI Sections 8 and 9, IT Act 2000, privacy Best practices: MGNREGA social audits (Rajasthan), Citizen Report Cards (Bengaluru), PET Uganda, EDUCO El Salvador CIC (2013): political parties under RTI Mains hooks Objectives of transparency; transparency-accountability link Challenges due to transparency Transparency vs privacy; digital divide limits Transparency is the precursor to accountability; privacy and inclusion are its limits. In simple words Transparency means decisions, rules and information are open and reachable by the people affected. OECD stresses comprehensible, accessible, timely; UNESCAP stresses rule-following and free access. It acts as public value (against corruption), open decision-making and a tool of good governance. It comes before accountability, integrity and probity. Tools: RTI, e-governance, Citizens' Charters, social audits, public expenditure tracking, Citizen Report Cards and public hearings. Costs: administrative burden from non-serious applications, misuse, privacy and confidentiality worries, and digital exclusion. NDSAP 2012 shares non-sensitive government data in machine-readable form on the OGD Platform; DST is the nodal department; a negative list protects sensitive data. Term In plain words NDSAP The 2012 data-sharing policy; DST is the nodal department. Negative list Data that cannot be shared, guided by RTI Sections 8-9, the IT Act and privacy. Remember it as Transparency first, then accountability. Transparency means openly known criteria, processes and decisions. It is a precursor to accountability, fights corruption and enables entitlements, but has costs (burden, misuse, privacy). NDSAP 2012 and the OGD platform are the proactive tools. OECD: an environment where objectives, frameworks, decisions and rationale are provided in a comprehensible, accessible, timely manner. UNESCAP: decisions and enforcement follow rules; information freely and directly accessible to those affected. People have the right to know; criteria, processes and systems are openly known (example: eligibility, benefits and conditions under the Skill India Mission). Three metaphors Public value (counter corruption); open decision-making (balancing secrecy and privacy); tool of good governance (with accountability, efficiency, effectiveness). Other readings: Tandon (2002); Transparency International (the mechanisms and processes behind facts and figures); open government; public scrutiny. Objectives Accountability; combating corruption (TI Global Corruption Report 2003); access to entitlements; effective service delivery; informed citizens; democratic participation; public trust. Transparency is a precursor to accountability, integrity and probity . Mechanisms: RTI, e-governance, Citizens' Charters. Social accountability tools: social audits (MGNREGA), public expenditure tracking, Citizen Report Cards, public hearings. E-governance streamlines processes and reduces discretion but faces digital divide, privacy, cybersecurity and low literacy. Challenges due to transparency: administrative burden from non-serious applications; misuse by anti-social elements; questionable authenticity; wrong interpretation; privacy and confidentiality. Key measures: RTI Act 2005, NDSAP 2012, Citizens' Charters, e-governance, CPGRAMS. Best practice Impact Social audits in MGNREGA, Rajasthan model Villagers audited works, found ghost beneficiaries and wage leakages Citizen Report Cards, Bengaluru Feedback on services like electricity and water improved delivery Public Expenditure Tracking, Uganda Reduced diversion of education grants EDUCO, El Salvador Community participation in school management improved teacher accountability and outcomes Committee / report Recommendation 2nd ARC, 14th Report Mandatory proactive disclosure; e-governance with service delivery; public data portals Law Commission 179th and 255th Redefine RTI exemptions; clearer guidance on public interest disclosure NCRWC Replace the Official Secrets Act with more appropriate national security legislation CIC (2013) Political parties come within RTI; non-compliance persists NDSAP 2012 Promotes sharing of non-sensitive government data in machine-readable formats; Open Government Data (OGD) Platform ; covers data created or collected with public funds; DST is the nodal department. Principles: openness, flexibility, transparency, data quality, wider access. Negative list (non-shareable data): consider Sections 8 and 9 of RTI , IT Act 2000 and right to privacy. Transparency vs privacy: RTI may clash with the Official Secrets Act, Conduct Rules and privacy; Section 8(2) allows disclosure when public interest outweighs protected interests; Aadhaar and DBT need strong data protection. Marginalised groups may be excluded by digital and language barriers."}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "11-accountability", "t": "11 · Accountability", "x": "11 · Accountability # Handout only · M1 p.24-28 Exam lens Priority: Medium. Mains PYQs quoted: 2016*. Prelims PYQs quoted: none quoted in the material. Prelims hooks Answerability, enforcement, responsiveness Horizontal: CAG, EC, CVC, CIC, ombudsman; vertical: citizens; diagonal: PIL CVC: Feb 1964 on Santhanam; statutory 2003 Lokpal Act 2013 selection committee; Whistle Blowers Protection Act 2014 (no anonymous complaints) CPGRAMS, PRAGATI; Social Audit 2.0 Mains hooks Types of accountability and mechanisms Issues in accountability; new-age challenges Need for transparency and accountability Move from top-down, input-focused control to bottom-up, outcome-focused answerability. In simple words Responsibility is the duty to do assigned work; accountability is answering for it, with both answerability and enforceability (penalty). Six types: managerial (hierarchy), political (to the legislature), judicial, institutional/horizontal (CAG, CBI, CVC), professional (Bar Council, ICAI) and social (RTI, charters, social audits, Lokpal). By direction: horizontal (state bodies check each other), vertical (citizens check the state) and diagonal (citizens use horizontal bodies directly, e.g. PIL). Need arises from bigger government, delegated legislation, the politics-bureaucracy nexus and corruption. Tools range from ministerial control to New Public Management and Social Audit 2.0, CPGRAMS and PRAGATI. New challenges: algorithmic bias, platform governance, PPPs diffusing blame. Solutions: decentralisation, bottom-up accountability and technology with human oversight. Term In plain words Micro-accountability Responsiveness to citizens receiving services (World Bank). Macro-accountability Financial and economic performance (World Bank). Remember it as Accountable for what, to whom, through what? Accountability is answerability plus enforceability plus responsiveness. It is sliced many ways: intra and inter-organisational; horizontal, vertical, diagonal; financial, process, programme, legal, professional, political, social, moral. New tools and new-age problems (AI, platforms) keep expanding it. Responsibility = obligation to carry out assigned tasks. Accountability = responsibility operating hierarchically; answerability for one's actions. Two aspects: answerability (account) and enforceability (penalty). Components: answerability, enforcement, responsiveness. Values: integrity, impartiality, objectivity, empathy and compassion. Dimensions: controlling political power, informational, argumentative, human. Objectives: control abuse; performance standards; continuous improvement; link administration and democracy; institutional introspection. Type Meaning Managerial Within the hierarchy: superiors and subordinates Political Civil servants to political executive, who answer to the legislature Judicial For unconstitutional or illegal actions Institutional / Horizontal Enforced by external institutions: CAG, CBI, CVC Professional Codes enforced by bodies like the Bar Council or ICAI Social Citizens via RTI, Citizens' Charters, social audits and Lokpal Accountable to: hierarchy, legislature, judiciary, citizens and civil society, media. Intra-organisational (within) vs inter/extra-organisational (outside). Form Detail Horizontal State institutions that seek explanations and impose penalties: CAG, Election Commission, CVC, CIC, ombudsman Vertical Citizens and civil society: elections, lobbying, budgeting participation, Citizen Report Cards, social audits Diagonal Citizens engage horizontal institutions directly: PIL Financial / fiscal One of the oldest; scrutiny of accounts; legislature's power over the public purse. World Bank: accounting system, external audit, follow-up on findings Process How agencies perform tasks; tenders, contracts Programme Results and effectiveness, e.g. beneficiaries identified correctly and living standards improved Legal Judicial review and court action Professional Doctors, engineers: professional codes and public interest Moral Beyond obedience to rules; moral government World Bank: micro-accountability (responsiveness to citizens receiving services) and macro-accountability (financial and economic performance). Need: expanding government role; delegated legislation; politics-bureaucracy nexus; corruption; limited popular participation. How to ensure: traditional (ministerial control, debates, committees, media, ombudsman) and New Public Management (efficiency, outcomes, competition, value for money). Three questions: accountability for what, to whom, through what. Mechanisms CVC: set up Feb 1964 on the Santhanam Committee ; statutory under the CVC Act 2003 . Lokpal and Lokayuktas Act 2013: Selection Committee: PM, Lok Sabha Speaker, Leader of Opposition (LS), CJI or nominated SC judge, eminent jurist. Whistle Blowers Protection Act 2014: mechanism for complaints on corruption or wilful misuse of power; inquiry; safeguards against victimisation; anonymous complaints not entertained . CAG: 'guardian of the public purse'; reports go to Parliament and the PAC. Social audit , RTI, Citizens' Charters. Modern mechanisms: performance audits and outcome budgeting; Social Audit 2.0 (digital dashboards); ethics committees; data-driven vigilance cells ; CPGRAMS and PRAGATI . Issues: unclear relationships; size of government; expanded state activity; secrecy; excess focus on inputs; top-down enforcement; control of bureaucratic power. New-age challenges: algorithmic governance and AI bias; platform governance; decentralised social media; PPPs diffusing accountability (blame-shifting). Solutions: decentralisation (World Bank); resilient mechanisms; compliance; bottom-up accountability; adapt to digitalisation; value-driven responsibility; ethical capacity building; internalise accountability beyond fear of sanction; technology with human oversight."}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "12-citizen-s-charter-and-sevottam", "t": "12 · Citizen's Charter and Sevottam", "x": "12 · Citizen's Charter and Sevottam # Handout only · M1 p.28-31 Exam lens Priority: High. Mains PYQs quoted: 2024, 2018, 2013. Prelims PYQs quoted: none quoted in the material. Prelims hooks Launched 1991 by John Major government (UK); creates no new rights Seven elements of an Indian charter By end 2011: 131 central, 729 state charters; goicharters.nic.in Sevottam: 2nd ARC, launched 2006; pilots 2009-10; IS 15700:2005 (BIS); three modules; seven steps UK Charter Mark scheme Mains hooks Problems with the Indian programme and suggestions ARC-II recommendations Sevottam: significance, challenges, way forward Commit only to what you can deliver, say who is accountable, and measure it through someone outside. In simple words A Citizen's Charter is an organisation's public promise on quality and time of service. It started in 1991 under the John Major government (UK). It creates no new rights ; it enforces existing ones. The Indian charter lists vision, services, clients, grievance machinery, what clients must bring and compensation. By 2011 there were 131 central and 729 state charters. Problems: bureaucratic mindset, little consultation, no penalties, low awareness, jargon, same format for all. Fixes: separate charters per service, wide consultation, outside monitoring, incentives, simple language. Sevottam (Seva + Uttam) is the quality framework from the 2nd ARC (2006), certified by IS 15700:2005. Three modules: charter implementation, grievance redress, service-delivery capability. Seven steps: define services and clients; set standards; build capability; perform; monitor; evaluate impact; improve continuously. Term In plain words DARPG Department that hand-holds departments in making their first charters. IS 15700:2005 BIS standard that certifies the Sevottam symbol. Remember it as Charter = promise; Sevottam = quality system. A Charter promises quality and time for existing rights. India's charters fail because of limited consultation, no penalties, low awareness, over- or under-tight standards and jargon. ARC-II and Sevottam (2006) supply the fix: separate charters, realistic commitments, redressal, feedback, outside review. Launched in 1991 by the John Major government (UK). A declaration of an organisation's commitment to clients on qualitative and temporal entitlements . It does not create new rights ; it seeks enforcement of existing rights and includes grievance redress. Purposes served Clarifies expectations; makes government responsive; service orientation over master mindset; people's participation via consultation; strengthens accountability (quality standards and timelines let performers be distinguished); signals pro-active good governance; improves image and credibility; empowerment and democracy; instrument for development goals. Elements of the Indian programme Vision and mission; details of business transacted; details of clients served; services to each client group; grievance redressal machinery and how to access it ; expectations from clients (documents, fees); compensation details. Regular internal and external monitoring. By 2011 end: 131 central charters, 729 state charters . Website goicharters.nic.in . Problems Bureaucratic mindset; limited consultation (a manager's charter ); no penal provisions ; low awareness; standards too lax or too strict; too detailed or too brief; names and addresses of redressal functionaries missing; no incentives (UK Charter Mark ; DARPG hired an outside agency); brochures and manuals treated as charters (DARPG now directs separate lists); needs of senior citizens and the disabled ignored; poor review and updating; inadequate devolution to street-level staff; technical jargon, no vernacular; same format for every service. Suggestions DARPG hand-holding for first charters; awareness (credible NGOs); attitudinal change; mandatory involvement of user groups and staff; built-in monitoring, preferably by an outside agency; prioritise services; incentivise at organisation and individual level; showcase best practices; simple language; 5-year master plan with budget. ARC-II recommendations One size does not fit all (separate charter per unit and service); widest consultation; commit to what you can deliver ; reform internal processes; appropriate redressal; periodic evaluation with end-user feedback; hold officers accountable for results (penal provisions). Sevottam (Seva + Uttam) Conceptualised by the 2nd ARC , launched 2006 ; piloted in ten departments ( 2009-10 ); IS 15700:2005 by the Bureau of Indian Standards certifies the Sevottam symbol. Core module Focus Citizen Charter implementation Feedback shapes service norms Public grievance redressal Responsive, empathetic redress, regardless of outcome Service delivery capabilities Internal processes, resources, workforce Seven steps: define services and identify clients; set standards and norms; develop organisational capability; perform to achieve standards; monitor performance; evaluate impact; continuous improvement. Significance: structured quality management (example: 2025 DARPG National Workshop in Bhopal); citizen-centric culture; sustainable reform; credible self-assessment. Challenges: seen as procedural compliance; fragmented adoption; weak digital integration. Way forward: capacity building and training; link with CPGRAMS, MyGov and dashboards; third-party audits and feedback loops."}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "13-rti-act-2005-and-the-2019-amendment", "t": "13 · RTI Act 2005 and the 2019 Amendment", "x": "13 · RTI Act 2005 and the 2019 Amendment # Handout only · M1 p.31-35 Exam lens Priority: Medium. Mains PYQs quoted: 2020. Prelims PYQs quoted: none quoted in the material. Prelims hooks Sweden first RTI (1766); USA second (1966); Shourie Group 1997; FOI Bill 2002 not notified; Tamil Nadu first state 1997 Penalty Rs 250/day up to Rs 25,000 16 types of information within 120 days; PIOs within 100 days; transfer in 5 days; third party notice 10 days; 30 days to respond Copyright is the only absolute exemption; Act is retrospective; exempt categories released after 20 years CIC (2013) on political parties; BCCI public authority (CIC, 2018); judiciary covered (SC, 2019) Mains hooks RTI 2019 amendment: autonomy of Information Commissions (negative and positive) Public authority disputes: judiciary, political parties, PPP, BCCI Rights conferred on citizens Maximum disclosure, minimal exemption: the amendment tests whether independence survives executive control. In simple words Sweden had the first RTI law (1766), the USA second (1966). In India the right is read into Articles 19(1)(a), 21, 39(b) and 39(c) ; cases: Rajnarain 1975, S.P. Gupta 1982. Demand grew from advocacy and from the MKSS in Janawad, Rajasthan ('Humara Paisa, Humara Hisab'). Formula: Monopoly + Discretion - Transparency = Corruption. Path: Tamil Nadu 1997 -> Freedom of Information Bill 2002 (feeble) -> RTI Act 2005 (drafted by the National Advisory Council). Mechanics: anyone can ask, no reason needed; public authorities publish 16 types of information within 120 days and appoint PIOs within 100 days; misdirected requests transfer within 5 days. Section 8 lists exemptions (security, foreign relations, trade secrets, Cabinet papers and so on) but a public-interest override applies. Copyright of a person other than the State is the only absolute exemption. 2019 Amendment : the Centre now decides tenure and pay of information commissioners; they are statutory, not constitutional. Term In plain words PIO Public Information Officer, who receives and answers requests. Suo motu disclosure Information a public authority must publish on its own. Second Schedule Agencies outside RTI, though corruption and human-rights information must be given. Remember it as RTI numbers: 16 types, 120 days, 100 days, 5 days, 10 days (third party), 20 years (release), Rs 250/day up to Rs 25,000. RTI is not codified but read into Arts 19(1)(a), 21, 39(b), 39(c). The MKSS movement (Janawad, 'Humara Paisa, Humara Hisab') fed the NAC-drafted 2005 Act: maximum disclosure, minimal exemption, appeals, penalties, proactive disclosure. Section 8 exemptions, public authority disputes and the 2019 amendment are the live questions. Sweden: first RTI in 1766; USA second in 1966. Sweden's ombudsman: 1809; India's central ombudsman: 2013 (per this module). Constitutional locus: not categorically codified; Preamble ideals support it; SC read it into Art 19(1)(a), Art 21, Art 39(b) and 39(c) ('data is the new oil'). Reference cases: Rajnarain 1975; S.P. Gupta 1982 . James Madison quote on popular government and popular information. Why demand grew Spread of democracy; advocacy (World Bank, IMF, Transparency International, NCPRI 1996 led by Aruna Roy , PUCL, ADR). MKSS at Janawad, Rajasthan : slogan 'Humara Paisa, Humara Hisab' . Benefits: Monopoly + Discretion - Transparency = Corruption ; corrects power asymmetry; realises other rights (e.g. Food Security entitlements); citizen participation; corrects trust deficit (information within 30 days ); better record keeping and decisions; shields civil servants from unwarranted pressure (documentary proof). RTI in India 1997 working group under H.D. Shourie produced the Freedom of Information Bill, 2002 (enacted, not implemented/notified; seen as feeble). States acted first: Tamil Nadu 1997 . The 2005 bill was prepared by the National Advisory Council , not bureaucrats. Criteria for a sound regime: wide access (minimal fees, free for BPL); penalties Rs 250 a day up to Rs 25,000 plus disciplinary action; independent appeal (CIC and SICs); maximum disclosure, minimal exemption. Preamble philosophy: transparency, check corruption, accountability, empowerment, democracy, balanced with genuine confidentiality and efficiency. Main features All citizens have the right; broad definition of information (records, memos, e-mail, opinions, advice, press releases, circulars, orders, logbooks, contracts, reports, samples, models, electronic data, private-body information held by a public authority). Right includes inspecting work, notes and certified copies, samples, and electronic formats. Public authority: bodies under the Constitution, Parliament or state law, or by notification; bodies owned, controlled or substantially financed ; NGOs substantially financed (term 'substantially' not defined ). Contested body What the handout says President / Governors Long-pending issue whether covered State federations Substantially financed; many judgments brought them in. Law Commission: BCCI public authority; CIC affirmed in 2018 PPP projects DoPT circular 2013: make information public. DIAL: CIC (2010) held public authority; Delhi HC stayed Judiciary 2009 Subhash Agrawal petition on Judges' 1997 resolution; SC said apex court not covered; CIC ruled against; Delhi HC sided with CIC; SC in 2019 held the judiciary by and large covered Political parties CIC 2013: recognised parties are public authorities (IT exemptions, free airtime, subsidised land). Not stayed or nullified by courts; parties still do not comply, citing sub judice Handout flags problematic SC observations: RBI need not disclose banks' risk-evaluation or inspection reports; RTI has created 'fear psychosis and paralysis'; civil servants' personal status, professional records, assets and liabilities and interviewers' names beyond RTI. Objections to parties' coverage: free associations, no direct tax money, no infrastructure, may be used against each other. Proactive disclosure and procedure Catalogued, indexed, computerised records; publish 16 types of information within 120 days and update yearly; suo motu disclosure; designate PIOs within 100 days ; transfer misdirected requests within 5 days ; third-party information after notice and hearing ( 10 days ). Exemptions (Section 8) Sovereignty, security, strategic, scientific, economic interests, foreign relations, incitement; court-forbidden or contempt; breach of legislative privilege; commercial confidence, trade secrets, IP (unless larger public interest); fiduciary relationship; foreign government confidences; endangering safety or identifying sources; impeding investigation; Cabinet papers (decisions, reasons and material to be made public after the matter is complete); personal information unrelated to public activity. Public interest override: access allowed where disclosure outweighs the harm, notwithstanding the Official Secrets Act 1923. Copyright of a person other than the State is the only absolute exemption. Information that cannot be denied to Parliament cannot be denied to citizens. Second Schedule: intelligence and security agencies are outside the Act, but corruption and human rights violation information must be given (human rights only with the Information Commission's approval). CBI and NIA were added by executive order. Act overrides the OSA; courts barred from suits other than appeals under the Act; wholly retrospective ; exempted information released after 20 years (except Cabinet decisions, legislative privilege, and sovereignty, security, strategic, scientific, economic, foreign relations and incitement categories). Rights conferred Choose the medium and the language (English, Hindi, local); help in writing; no reason need be given ; immediate notice of transfer; assistance for disabled; fees waived for BPL and if time limits are missed ; reasons for rejection, appeal period and appellate authority; complaint to CIC/SIC for no PIO/APIO access, refusal, no response in time, unreasonable fee, incomplete, misleading or false information. RTI Amendment Act, 2019 Key amendment Effect Tenure and appointment Centre decides CIC and ICs' tenure; five-year term removed Salary and service conditions Centre fixes; delinked from CEC and ECs Status CIC clarified as statutory, not constitutional Negative: executive overreach; public distrust; federal dilution (SICs). Positive: administrative flexibility; fiscal discipline; policy alignment. Reflection: balances efficiency with independence but risks executive overreach; impact depends on how responsibly the government exercises the powers."}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "14-cic-rti-issues-impact-and-2nd-arc", "t": "14 · CIC, RTI Issues, Impact and 2nd ARC", "x": "14 · CIC, RTI Issues, Impact and 2nd ARC # Handout only · M1 p.36-38 Exam lens Priority: Medium. Mains PYQs quoted: 2020. Prelims PYQs quoted: none quoted in the material. Prelims hooks CIC + up to 10 ICs; selection: PM, LoP (LS), Union Cabinet Minister nominated by PM Notified tenure: 3 years or age 65, no reappointment; IC-to-CIC total max 5 years Salary: CIC Rs 2,50,000, IC Rs 2,25,000 per month 95% penalty gap (Satark Nagrik Sangathan); 2.55 lakh pendency in 26 ICs; avg disposal 1 year 11 months; 21 of 29 ICs filed no report 2019-20 2nd ARC: 1% of flagship funds; 4 regional CIC offices; 50% operating cost for 3 yrs or Rs 1 crore = substantially financed Mains hooks Issues and challenges in RTI implementation Impact of RTI 2nd ARC recommendations: OSA repeal, classification, selection of ICs RTI is a means; access is the end, and the gap between them is capacity, will and records. In simple words The Central Information Commission has one Chief Information Commissioner and up to ten Information Commissioners, appointed by the President on a committee of the PM, the Leader of Opposition and a Union Cabinet Minister. Under the 2019 Rules: tenure 3 years or age 65, no reappointment; CIC Rs 2,50,000, IC Rs 2,25,000 a month; salary delinked from CEC/EC. Problems: no specific budget, low awareness, penalties rarely used (not imposed in 95% of due cases), pendency (2.55 lakh in 26 ICs; average disposal 1 year 11 months), missing annual reports, vacancies. Impact: grievance redressal, exposure of corruption and wasteful spending, a national movement behind Right to Food and Education. 2nd ARC fixes: repeal the Official Secrets Act, oath of transparency, CJI on the selection committee, regional CIC offices, 1% of flagship funds for RTI, awareness through NGOs. Term In plain words Pendency Cases or requests waiting for disposal. Classification of secrets Top Secret, Secret, Confidential, Restricted by damage on exposure. Remember it as CIC term: 3 years or 65, whichever is earlier. CIC composition, selection and removal are spelled out, with the 2019 Rules making tenure 3 years or age 65 and salary Rs 2.5 lakh. The weakness is delivery: pendency, penalty gaps, vacancies, awareness and record keeping. 2nd ARC prescribes structure, funding and secrecy reform. Central Information Commission One Chief Information Commissioner and up to ten Information Commissioners ; appointed by the President on a committee of the PM (Chair), Leader of Opposition (LS), a Union Cabinet Minister nominated by PM . Eminent persons from law, science, social service, journalism, mass media, public administration. No office of profit, party link or business. Tenure (RTI Rules 2019): notified by the Centre: 3 years or age 65 , whichever is earlier; no reappointment ; an IC elevated as CIC cannot exceed 5 years in total . Salary (Rules 2019): delinked from CEC/EC parity. CIC Rs 2,50,000 per month; IC Rs 2,25,000. Removal: proved misbehaviour or incapacity after a Supreme Court inquiry (if referred by the President). Without SC inquiry: insolvency, conviction involving moral turpitude, paid employment, unfitness of body or mind, prejudicial financial interest. Issues and challenges Gap between RTI as a means and access as an end; bureaucratic mindset; no specific budget (2nd ARC: 1% of flagship funds); absence of political will; limited awareness (APWC study: 12% of women, 26% of men, 13% rural, 33% urban); vague terms; ICs dominated by retired bureaucrats . Penal provisions rarely applied: Satark Nagrik Sangathan: penalty not imposed in 95% of cases where due. No organic CIC-SIC relationship. PIO duties added without incentive; juniors appointed as PIOs; poor record keeping; abuse of Schedule II ; IC orders not implemented (no contempt powers). Pendency: an estimated 40-60 lakh RTI requests a year; 2.55 lakh pending in 26 ICs; vacancies; average disposal 1 year 11 months ; COVID worsened it. 21 of 29 ICs had not submitted the 2019-20 report; AP and Telangan
