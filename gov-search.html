ted 2019 Implements PMLA and FEMA Core job Investigates; no suo motu jurisdiction Advises, superintends vigilance and CBI on PCA cases Inquiry and prosecution wings; sanction Money laundering and foreign exchange Weakness Politicised ('caged parrot'), vacancies, sanction delays Depends on CBI; no prosecution power; staff shortage Wide jurisdiction, 7-year limit, PM partly covered, delayed rules Listed among agencies; no detail in the modules Reports to DoPT (policy framework only) President; annual report to Parliament President; annual report to Parliament Not stated Types of corruption (M2 p.3-4) Pair First Second By society's view Black: all agree, intolerable. White: recognised but tolerated (speed money) Grey: sections differ By appetite Grass eating: will not refuse a bribe Meat eating: actively seeks By compulsion Coercive: citizen pays to get his due Collusive: both gain against public interest By scale Retail: street-level, speed money Policy: crony capitalism, state capture Social accountability tools (M1 p.21, 24; M2 p.9-11) Tool What it does Example in the modules Social audit Beneficiaries examine scheme records at public hearings AP SSAAT; Jharkhand SAU; MKSS jan sunwai Citizen Report Cards Survey feedback on services Bengaluru Public expenditure tracking Follow funds to the user Uganda; World Bank PETS Citizen's Charter Public promise of quality and time UK 1991; India 131 central and 729 state charters by 2011 RTI Right to information from public authorities RTI Act 2005 Lokpal / Lokayukta Ombudsman for corruption complaints Lokpal Act 2013"}, {"c": "2", "n": "Corruption, Social Audit, CBI, CVC, Lokpal, Whistleblowers and PCA", "id": "flows", "t": "Flow charts", "x": "Flow charts # The sanction-to-prosecute chain (Sections 15, 17) Single Directive: sanction needed even for preliminary inquiry against Joint Secretary and above 1997 Vineet Narain: Supreme Court strikes the Single Directive DSPE Act amended: Single Directive made law as Sec 6A 2014: Sec 6A struck down (equality) 2018: PCA Sec 17A: permission for preliminary inquiry for all public servants, except if caught red-handed (extends to retired servants) Meanwhile: PCA Sec 19 and CrPC Sec 197 still need sanction to prosecute; Lokpal replaces the sanctioning authority in its cases A complaint before the Lokpal (Section 18) Any individual files a complaint for a PCA 1988 offence Lokpal orders a preliminary inquiry (Inquiry Wing, CVC or CBI) and seeks the public servant's explanation Complaints against Group C and D officials go to the CVC Preliminary inquiry finishes within 60 days Lokpal bench (min 3) hears the public servant, then: full investigation, departmental proceedings, close the case, or act against a false complainant If PM is the accused: full bench, two-thirds majority; not public order, security, atomic energy, space Prosecution wing and court; time limit for the complaint: 7 years"}, {"c": "2", "n": "Corruption, Social Audit, CBI, CVC, Lokpal, Whistleblowers and PCA", "id": "traps", "t": "Traps", "x": "Traps # Common mix-ups and the rule for the exam hall Trap What goes wrong, and the rule Measuring corruption CPI: 0 most corrupt, 100 least; perception-based; since 1995; ranks not comparable across years. Global Corruption Barometer is experiential and regional; PETS is a World Bank tracking survey. Rule: perception (CPI), experience (GCB), tracking (PETS). Three terms, three ages CIC: 3 years or 65 (2019 Rules). CVC: 4 years or 65. Lokpal: 5 years or 70. Rule: Lokpal is the longest; CIC changed in 2019. Who sits on which committee Lokpal has the Speaker and an eminent jurist; CVC has the Home Minister; CBI Director's committee has the CJI; CIC has a Union Cabinet Minister (2nd ARC wants the CJI). Rule: PM and Leader of Opposition are in all; learn the third and fourth members. Removal routes Lokpal removal reference to the SC needs signatures of at least 100 MPs. CIC/CVC go to the SC on the President's reference. Rule: '100 MPs' belongs only to Lokpal. When was the Lokpal created? Module 1 says India appointed an ombudsman in 2013 at the central level. Module 2 says the Act was passed in 2013 and the Lokpal constituted in 2019. Rule: Act 2013; Lokpal constituted 2019. Lokpal's reach over Groups C and D Module 2 lists Group A-D in Lokpal's jurisdiction but sends Group C and D complaints to the CVC. Rule: Lokpal covers them on paper; the CVC handles those complaints. Whistleblower and anonymity No anonymous complaints under the 2014 Act; frivolous complaint: 2-year jail; competent authority depends on who is accused. Rule: no anonymity is the first answer to 'what is wrong with the Act'. PCA 2018 cuts both ways Bribe-giving an offence (7-day complaint defence for coercion), jail 3 to 7 years, trial 2 years (max 4), Sec 17A covers retired servants; yet Sec 13(1)(d) was diluted and Sec 17A needs permission for inquiry. Rule: strengthened punishment, weakened investigation."}, {"c": "2", "n": "Corruption, Social Audit, CBI, CVC, Lokpal, Whistleblowers and PCA", "id": "connects", "t": "Connects to", "x": "Connects to # §15 The Problem of Corruption → §17 CBI and CVC The Sec 6A chain (Single Directive, Vineet Narain, 2014, Sec 17A) is the legal factor in corruption and the heart of the CBI case. §15 The Problem of Corruption → §18 Lokpal in India Absence of political will is shown in repeated Lokpal delays. §16 Tackling Corruption and Social Audit → §11 Accountability Social audit is bottom-up accountability, the counterpart of top-down control. §17 CBI and CVC → §18 Lokpal in India Lokpal supervises CBI for referred cases and replaces the sanction authority under Sec 197 and Sec 19; Groups C and D go to the CVC. §18 Lokpal in India → §11 Accountability The Lokpal Selection Committee is the same list as in the Accountability section. §19 Whistleblower Protection and the PCA 1988 → §17 CBI and CVC CVC is the competent authority for civil servants' disclosures and can direct whistleblower protection."}, {"c": "2", "n": "Corruption, Social Audit, CBI, CVC, Lokpal, Whistleblowers and PCA", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. TI's definition and test 'Private abuse of public office'; the Elephant Test. CPI scale and start 0 most corrupt, 100 least; annual since 1995. Sec 6A chain Single Directive -> struck 1997 (Vineet Narain) -> Sec 6A DSPE -> struck 2014 -> Sec 17A PCA 2018. Georgia, Singapore, Hong Kong examples Georgia disbanded Traffic Police (2004); Singapore CPIB and Hong Kong ICAC as single agencies. Karnataka's social audit feature Audit teams rotated after every three cycles. CBI: origin and name SPE 1941; DSPE Act 1946; named CBI 1963; no suo motu jurisdiction. CVC term, age and members 4 years, retirement at 65; CVC plus not more than two Vigilance Commissioners. P.J. Thomas case (2011) CVC selection must be by consensus of the committee, not majority. Lokpal composition Nine members: Chair + 8; half judicial; 50% affirmative action; minimum age 45. Lokpal limits Preliminary inquiry in 60 days; complaint within 7 years; Groups C and D to CVC. Whistleblower Act competent authorities PM (Union Ministers), CM (State ministers), Presiding Officer (legislators), CVC (civil servants). PCA 2018 headline changes Bribe-giving offence (7-day defence if coerced); jail 3 to 7 years; trial in 2 (max 4) years; Sec 17A. SEBI tipping mechanism Rewards up to Rs 1 crore for actionable insider-trading information, with confidentiality."}, {"c": "2", "n": "Corruption, Social Audit, CBI, CVC, Lokpal, Whistleblowers and PCA", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts in Start Here)"}, {"c": "2", "n": "Corruption, Social Audit, CBI, CVC, Lokpal, Whistleblowers and PCA", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards Mains answer skeletons One for each Mains PYQ quoted in the material that the notes can support, then practice questions. Tap to open; try the answer first. 2022 · 10 marks · Whistle blower, who reports corruption and illegal activities, wrongdoing and misconduct to the concerned auth… Question. Whistle blower, who reports corruption and illegal activities, wrongdoing and misconduct to the concerned authorities, runs the risk of being exposed to grave danger, physical harm and victimization by the vested interests, accused persons and his team. What policy measures would you suggest to strengthen protection mechanism to safeguard the whistle blower? The 2014 Act mandates disclosure of identity and offers limited protection; Satyendra Dubey's murder shows the risk. Confidentiality and anonymity (Law Commission framework) Legal protection against victimisation and administrative safeguards against harassment and bodily harm Extend coverage to corporate whistleblowers; 2nd ARC: stronger law for public and private sectors Organisational guidelines and awareness; SEBI-style rewards up to Rs 1 crore; CVC power to direct protection Close. Protect the person, not just the disclosure. 2021 · 15 marks · The jurisdiction of the Central Bureau of Investigation (CBI) regarding lodging an FIR and conducting a probe … Question. The jurisdiction of the Central Bureau of Investigation (CBI) regarding lodging an FIR and conducting a probe within a particular State is being questioned by various States. However, the power of the States to withhold consent to the CBI is not absolute. Explain with special reference to the federal character of India. CBI draws its powers from the DSPE Act 1946 and has no suo motu jurisdiction; it handles cases transferred to it. Vineet Narain 1997: CVC superintends CBI on PCA cases; DoPT sets only policy Issues: politicised 'caged parrot', one-third vacancies Federal angle: not in the modules, so add it separately Close. State consent protects federalism but cannot be used to block corruption probes. (Partial fit: no content on state consent or federal case law.) 2021 · 10 marks · An independent and empowered social audit mechanism is an absolute must in every sphere of public service, inc… Question. An independent and empowered social audit mechanism is an absolute must in every sphere of public service, including the judiciary, to ensure performance, accountability and ethical conduct. Elaborate. Social audit shares scheme details with beneficiaries at public hearings so the people can find loopholes. Independence: AP's SSAAT, Karnataka's rotation of audit teams after three cycles, Meghalaya 2017 Act as model Empowerment: statutory in very few programmes (NREGA); needs trained auditors, Gram Sabha awareness, digital portals Results: crores recovered in AP; Jharkhand SAU exposed ghost beneficiaries; SC in Swaraj Abhiyan (2016) Judiciary: RTI coverage held in 2019, but the notes give no audit model for it Close. Audit works when information is open and the auditor is independent of the audited. 2019 · 10 (150 words) marks · \"Non-performance of duty by a public servant is a form of corruption\" Do you agree with this view? Justify you… Question. \"Non-performance of duty by a public servant is a form of corruption\" Do you agree with this view? Justify your answer. Agree, in the wider sense: corruption includes any behaviour that harms public interest. Handout list: lethargy, dereliction or negligence of duty, repeated carelessness, non-punctuality, favouritism and nepotism TI's definition ('private abuse of public office') and the Elephant Test: society recognises it Non-performance harms citizens like speed money does (white corruption tolerated) Caveat: stretching the definition too wide dilutes focus Close. A public servant who does not perform abuses the office for a private ease. 2016 · 12.5 marks · In the integrity index of Transparency International, India stands very low. Discuss briefly the legal, politi… Question. In the integrity index of Transparency International, India stands very low. Discuss briefly the legal, political, economic, social and cultural factors that have caused the decline of public morality in India. TI's index is perception-based, but the handout's factor list explains a low rating. Legal: Art 311 protection, Sec 19 PCA and Sec 197 CrPC sanctions, delayed prosecution, no effective whistleblower law, weak autonomy of CBI and CVC Political: no will on Lokpal, criminalisation of politics, money power, weak party-funding disclosure, TINA Economic: licence-permit-quota to clearance raj, consumerism, poor pay, MNC willingness to bribe Social: shaming of government staff, no popular sanction, social evils like dowry, thymos (low self-worth) Cultural: long history of corruption, tolerance, culture-specific norms Close. Public morality will recover only when opportunity, impunity and tolerance fall together. 2015 · 12.5 marks · If amendment bill to the Whistleblowers Act, 2011 tabled in the Parliament is passed, there may be no one left… Question. If amendment bill to the Whistleblowers Act, 2011 tabled in the Parliament is passed, there may be no one left to protect. Critically evaluate. The 2015 amendment bill proposed that the Official Secrets Act 1923 would override the Act; it lapsed. Protection already weak: no anonymity (Satyendra Dubey murder), limited safeguards against victimisation Competent authority route: PM, CM, Presiding Officer, CVC Frivolous complaints face 2-year jail Fixes: Law Commission framework (confidentiality, anonymity, protection from bodily harm, corporate whistleblowers); SEBI tipping up to Rs 1 crore Close. A whistleblower law that yields to the Official Secrets Act protects secrecy, not the whistleblower. 2014 · 10 marks · It is often said that poverty leads to corruption. However, there is no dearth of instances where affluent and… Question. It is often said that poverty leads to corruption. However, there is no dearth of instances where affluent and powerful people indulge in corruption in a big way. What are the basic causes of corruption among people? Support your answer with examples. Poor pay is blamed, but the handout says raising salaries alone may not dent corruption. Psycho-social: thymos (low self-worth), consumerism, Squirrel Nuts Syndrome, opportunity theory Policy (grand) corruption: crony capitalism and state capture by business houses; MNCs able and willing to bribe Systemic: clearance raj, red tape, middlemen, weak sanctions (Art 311, Sec 19) Examples in the handout: Mundhra scandal, pork-barreling, German car insurance case Close. Opportunity and impunity, not poverty, are the common thread. 2013 · 10 marks · 'A national Lokpal, however strong it may be, cannot resolve the problems of immorality in public affairs'. Di… Question. 'A national Lokpal, however strong it may be, cannot resolve the problems of immorality in public affairs'. Discuss. The handout calls Lokpal 'not a panacea': corruption is a hydra-headed monster. Needs a multi-pronged strategy; huge bureaucracy; petty complaints need departmental handling Judicial process inadequate; no citizen empowerment or willingness to complain Causes of immorality are psycho-social, economic, legal, administrative and political (Sec 15) What Lokpal adds: inquiry and prosecution wings, search, seizure, attachment, sanction replaced Close. Institutions police conduct; immorality is cured by opportunity reduction, transparency and ethics. Practice · Should the Prime Minister be brought under the Lokpal? Examine in light of the Lokpal Act 2013. The Act covers the PM partially. 2nd ARC against: cripples administration, foreign exploitation, PCA already applies For: CBI works under DoPT; lead by example; Art 361 exempts only President and Governors Act: no inquiry on public order, security, atomic energy, space; full-bench two-thirds majority Close. Partial coverage balances accountability against continuity, but leaves the main objection unanswered. Practice · How can the success of Andhra Pradesh's social audit model be scaled up nationally? AP's SSAAT is an autonomous society that trained village resource persons. Result: crores of wage misappropriation recovered; World Bank global best practice Scale: national law on Meghalaya 2017 lines; independent audit units; PRI capacity Add: trained auditors, rotation of audit teams (Karnataka), wall writing and grievance link (Chhattisgarh), digital portals Close. Independence of auditors and access to information decide whether audits scale."}]</script><script>

q.addEventListener('input',run)})();</script><script>/* Shared store: reading progress, preferences, optional cross-device sync. */

function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function fresh(){return{v:1,prefs:{fs:1,lh:1.65,w:780,font:'serif',theme:'auto',pt:0},last:null,nb:{},days:{}}}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}

var S;

  var ot=lsGet('nb-theme');if(ot&&!S.prefs.pt){S.prefs.theme=ot;S.prefs.pt=1}

function merge(a,b){ // a local, b remote; returns merged
  var o=fresh();
  o.prefs=((b.prefs&&b.prefs.pt||0)>(a.prefs&&a.prefs.pt||0))?Object.assign({},a.prefs,b.prefs):Object.assign({},b.prefs,a.prefs);

  var ids={};Object.keys(a.nb||{}).concat(Object.keys(b.nb||{})).forEach(function(k){ids[k]=1});
  Object.keys(ids).forEach(function(id){
    o.nb[id]={};var ca=(a.nb||{})[id]||{},cb=(b.nb||{})[id]||{},ks={};
    Object.keys(ca).concat(Object.keys(cb)).forEach(function(k){ks[k]=1});
    Object.keys(ks).forEach(function(k){
      var x=ca[k],y=cb[k];if(!x||!y){o.nb[id][k]=x||y;return}

      o.nb[id][k]={read:r,done:done.done,dt:done.dt||0,pos:pos,t:Math.max(x.t||0,y.t||0)};

}

function applyPrefs(){
  var p=S.prefs;
  var th=p.theme;
  if(th==='auto')root.removeAttribute('data-theme');else root.setAttribute('data-theme',th);
  root.style.setProperty('--zoom',p.fs);root.style.setProperty('--lh',p.lh);root.style.setProperty('--pw',p.w+'px');

}

setInterval(function(){
  if(document.hidden||Date.now()-lastAct>60000||!window.__NB)return;
  var t=today();S.days[t]=(S.days[t]||0)+15;save();
