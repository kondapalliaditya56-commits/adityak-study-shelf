.recall{font:16px/1.55 var(--sans);padding-left:24px}.recall li{margin:6px 0}

.fc.back{background:var(--acc-soft)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.btn{font:600 14px var(--sans);padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:40px 0 20px}.pager a{display:block;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;text-decoration:none;color:var(--ink);font:600 15px var(--sans)}.pager a.nx{text-align:right}.pager small{display:block;color:var(--muted);font-weight:500;font-size:12px}

/* ---- reader app ---- */
:root{--zoom:1;--lh:1.65;--pw:780px}
:root[data-theme="sepia"]{--bg:#F4ECD8;--surface:#FBF5E6;--surface2:#EADFC4;--ink:#3B3022;--muted:#7A6A52;--line:#D8C9A6;--acc:#7A4A12;--acc-ink:#fff;--acc-soft:#EFDDB8;--saf:#A4470A;--saf-soft:#F6E2BE;--red:#9C2A1C;--red-soft:#F3D9CB;--blue:#2F5C8A;--blue-soft:#DDE6E4;--good:#3E6B2A;--good-soft:#DDE8C8;--hl:#F2D98A;color-scheme:light}
:root[data-font="sans"] body{font-family:var(--sans)}
:root[data-font="sans"] .notes p,:root[data-font="sans"] .notes li{font-family:var(--sans)}
.page{zoom:var(--zoom);max-width:var(--pw)}
.notes p,.notes li{line-height:var(--lh)}
.rbar{position:fixed;left:0;top:0;height:3px;width:0;background:var(--acc);z-index:40;transition:width .15s}
.aabtn{color:var(--ink);border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:5px 12px;font:700 14px var(--serif);cursor:pointer;flex:none}
.h2read{float:right;margin:2px 0 0 10px;font:600 12px var(--sans);border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer;min-height:30px}
.h2read[aria-pressed="true"]{background:var(--acc-soft);color:var(--acc);border-color:var(--acc)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;justify-content:center}
.dock button{font:600 14px var(--sans);min-height:44px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;padding:0 14px;cursor:pointer}
.dock .mid{flex:1;max-width:520px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock .mid b{color:var(--acc)}
body.has-dock .page{padding-bottom:110px}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheetin{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:82vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));font:15px/1.4 var(--sans)}
.sheetin h3{margin:0 0 10px;font:700 17px var(--sans)}
.srow{display:flex;align-items:center;gap:10px;margin:12px 0;flex-wrap:wrap}
.srow label{flex:0 0 92px;color:var(--muted);font-weight:600}
.srow .grp{display:flex;gap:6px;flex-wrap:wrap}
.srow button{font:600 14px var(--sans);min-height:42px;min-width:48px;padding:0 12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;cursor:pointer}
.srow button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.secl a{display:flex;gap:10px;align-items:center;padding:12px 6px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;min-height:44px}
.secl a .tk{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--acc-ink)}
.secl a.rd .tk{background:var(--acc);border-color:var(--acc)}
.secl a.cur{background:var(--acc-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:50;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;font:600 14px var(--sans);max-width:92vw;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.toast button{font:700 14px var(--sans);background:transparent;border:0;color:var(--bg);text-decoration:underline;cursor:pointer;min-height:36px}
body.focus .bar{display:none}body.focus .sidetoc{display:none}
figcaption.clamp{max-height:3.3em;overflow:hidden;position:relative;cursor:pointer}

ncy, Accountability, Citizen’s Charter and RTI", "id": "1-civil-services-upsc-and-spsc", "t": "1 · Civil Services: UPSC and SPSC", "x": "1 · Civil Services: UPSC and SPSC # Handout only · M1 p.3-4 Exam lens Priority: Low. Mains PYQs quoted: none quoted in the material. Prelims PYQs quoted: none quoted in the material. Prelims hooks FPSC set up in 1926 (Lee Commission, 1924); Madras 1929 first provincial PSC; Sir Ross Barker first chairman Article numbers 315-323 and what each covers Seniority convention for UPSC Chairman broken in 2015 57 deviations (1950-84) vs 82 (1984-88) Mains hooks Why the UPSC does not enjoy equal status with EC, CAG and SC (no separate oath, easier removal) Negative recruitment; two 2nd ARC models for compressing the exam cycle From UPSC to a Central Personnel Agency Independent on paper, advisory in practice: the Commission needs both status and a positive recruitment mission. In simple words The Public Service Commissions are the Constitution's recruiters: the UPSC for the Centre and an SPSC for each state (Part XIV, Articles 308-323). They began under British rule. The 1919 Act provided for a Federal PSC, which came in 1926 after the Lee Commission (1924). Madras (1929) set up the first provincial commission. The 1935 Act created three kinds: Federal, Provincial and Joint. The Constitution protects their independence: service conditions cannot be cut after appointment, salaries are paid directly from the Consolidated Fund, and removal follows only the route the Constitution lays down. In practice the shield is thinner. Governments set aside the Commission's advice (57 times in 1950-84, then 82 times in 1984-88). The UPSC has no separate oath and an easier removal process than the EC, CAG or Supreme Court. Recruitment is 'negative': it screens people out instead of finding the best fit. The reform direction in the handout: turn the UPSC into a Central Personnel Agency that recruits positively and runs research on civil-service management. Term In plain words Negative recruitment Eliminating the unsuitable rather than finding the most suitable. Charged expenditure Salaries and allowances paid directly from the Consolidated Fund of India or the State. Central Personnel Agency The role the handout wants the UPSC to grow into. Memory map: PSCs in India Part XIV (Arts 308-323) gives the country its Public Service Commissions. They began with the 1919 Act and the 1926 FPSC, and are protected by constitutional safeguards, yet governments deviate from their advice and the UPSC lacks the status of the other constitutional bodies. Article (Part XIV) Provision 315 PSCs for Union and States 316 appointment and term of members 317 removal and suspension 319 bar on later office 320 functions 321 extend functions 322 expenses 323 reports Memory aid · LADDER Say it as a ladder: 315 set up → 316 appoint → 317 remove → 319 bar → 320 functions → 321 extend → 322 expenses → 323 report (order kept: it is the Constitution's order). (own mnemonic) History 1919 GoI Act: for the first time a Federal PSC; provincial PSCs not mandatory (provinces could set up their own by law) 1924 Lee Commission recommends; FPSC set-up had been delayed 1926 FPSC finally set up on Lee Commission advice; Sir Ross Barker first Chairman 1929 Madras : first province to set up a Provincial PSC 1935 GoI Act: three types: Federal, Provincial, Joint → carried into Art 315 Independence Safeguards Shield service conditions cannot be cut after appointment salaries = charged expenditure on Consolidated Fund removal only as the Constitution says post-retirement bar on certain government jobs Convention: seniormost member becomes Chairman → violated in 2015 Problems UPSC Deviation from PSC recommendations without adequate reasons: 57 times (1950-84) vs 82 times (1984-88) One-size-fits-all: a common recruitment system may not suit the different needs of various services Art 320(3): its provisions are abused, and three categories of officials (technical, managerial, political) influence it no educational qualification fixed for members Unequal status: Regarded as one of the four important constitutional institutions (with EC, CAG, SC), yet UPSC lacks equal status: no separate oath Removal considered relatively easier conflict with the CVC Exam: concerns over structure and duration of exams Negative recruitment policy: Focus on eliminating unsuitable candidates rather than finding the most appropriate Archaic or obsolete philosophy of recruitment SPSCs some are centres of corruption poor quality of members blind imitation of UPSC model without considering state-specific requirements compromised independence: may function like subsidiaries of UPSC no formal linkages between UPSC and SPSCs Reform 2nd ARC: shorten the exam Model I: Prelims + Mains together over 2-3 days Mains marked only above Prelims cut-off Then Interview Model II: Shortlist 2-3 × vacancies on Prelims rank Mains within 2 months, so Mains and Interview start almost together 1st ARC on PSCs one SPSC member from outside the state members hold a degree UPSC + SPSC chairmen consulted on SPSC members UPSC Chairman consulted when appointing UPSC members and their successor 2/3 of UPSC members drawn from SPSC chairpersons separate qualifications for official and non-official members Value addition Interview weaknesses: too short · desultory chat · artificial atmosphere · element of luck · tendency to reproduce oneself · subjectivity and bias. Role of UPSC today UPSC story in four steps evolve into a Central Personnel Agency negative → positive recruitment invest more in the psycho-social profile of candidates Involve outside experts Become the principal R&D body in civil-service management drop one-size-fits-all In the news (Saarthi IAS CA; verify dates) Public Examinations (Prevention of Unfair Means) Amendment Act, 2026: amends the 2024 Act; higher penalties; probe in 2 months; trial in 3 months of chargesheet; Court of Session in every State/UT; appeals to a 2-judge HC bench. Link: recruitment integrity (2nd ARC). Memory visuals for this section Mnemonic · Issues in the working of UPSC U N D O N E · A UPSC's role is UNDONE by Abuse (of Article 320(3)). U Unequal status: no separate oath, easier removal N No educational qualification prescribed for members D Deviation from its advice (57 then 82 times) O One-size-fits-all recruitment N Negative recruitment, archaic philosophy E Exam structure and duration A Abuse of Art 320(3); three categories of officials"}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "2-civil-services-meaning-and-lateral-entry", "t": "2 · Civil Services: Meaning and Lateral Entry", "x": "2 · Civil Services: Meaning and Lateral Entry # Handout only · M1 p.5-7 Exam lens Priority: Medium. Mains PYQs quoted: 2014. Prelims PYQs quoted: none quoted in the material. Prelims hooks 1765 term coined; excluded groups (political executives, judiciary, defence, PSU staff) 3 AIS; Third Pay Commission renamed Class 1-4 as Group A-D Lateral entry: 2018 (10 JS posts, 3 yrs extendable to 5), 2021 (31 posts), Aug 2024 (45 posts, cancelled 20 Aug) Type I and Type II error argument Mains hooks Aristocratic personnel system and its consequences Generalist vs specialist; need for domain expertise after 10-12 years of service Lateral entry: need, issues, the 2024 reservation controversy Lateral entry fixes a skills gap but must be built on reservation, field exposure and skilled permanent staff. In simple words 'Civil Services' was a term coined by the East India Company around 1765 to separate combatant from non-combatant staff. Civil servants sit inside the larger circle of public servants. Political executives, the judiciary, defence forces and PSU employees are public servants but not civil servants. Groups A and B are the management cadre; Groups C and D the staff side. The Indian system has been closed and cadre-based: sharp grade divides, a narrow entry age band, exams that test general ability. The handout says this breeds conservative, status-quo, rule-bound officers and slows social change. Lateral entry is the fix on offer: bring private-sector specialists into government. It answers Type I error (hiring the wrong person) and Type II error (rejecting the right one), but raises worries about field experience, reservation and favouritism. The generalist-vs-specialist debate is the same story: holistic coordination on one side, techno-economic complexity on the other. The 2nd ARC wants broad orientation plus domain expertise. Term In plain words Aristocratic personnel system A closed career system with sharp grade divides and narrow entry. Lateral entry Inducting private-sector specialists into government departments. Type I / Type II error Recruiting the wrong person / rejecting the right person. The East India Company coined 'civil services' around 1765. India's closed, cadre-based, generalist system produced a conservative, status-quoist bureaucracy. Lateral entry is the attempt to bring in specialists, but it has hit reservation and field-experience objections. Key point Origin: the East India Company coined \"civil services\" around 1765 to distinguish combatant from non-combatant personnel; those in commercial or non-combatant roles were civil servants. State = largest employer; ~3% of GDP goes on civil servants. Civil servants EXCLUDE political executive judiciary defence forces PSU employees but these do come within the wider idea of public servants Value addition Rule: all civil servants are public servants; not all public servants are civil servants. Category Services All India IAS, IPS, IFoS Central IRS, ICAS, engineering, health, railway, para-defence (IDES, IDAS, IOFS), Secretariat State recruited by state Municipal local bodies Note Groups: the 3rd Pay Commission suggested replacing the names Class 1, 2, 3, 4 with Group A, B, C and D . Memory aid · ACSM A ll India · C entral · S tate · M unicipal (top to local) (own mnemonic) A Closed \"aristocratic\" System PYQ 2014 Features sharp divide between grades recruitment in a narrow age band tests general ability only may mirror class preference cadre-based services Consequences conservative, status quoist , non-responsive Rule fetishism Placement by rank not competence Elitist mindset Obstacles to change Why social change is slow education: society still influenced by traditional religious and social complexes conservative attitudes, esp. towards women limited social and spatial mobility failure of the political system cadre-based services + aristocratic personnel system high poverty Generalist vs Specialist Generalist Specialist holistic policy view, inter-department coordination : balances competing demands across sectors (2nd ARC: preserve broad-spectrum orientation while developing domain expertise) techno-economic complexity : AI, digital finance, climate technology, energy, specialised trade need technical knowledge (NITI Aayog 3-Year Action Agenda 2017-20: economy's complexity made policymaking a specialised activity → recommended lateral entry of specialists) grassroots experience : field postings give direct knowledge of local conditions and implementation; career combines field and policy roles at different levels of govt policy inertia, lack of domain depth : frequent moves across unrelated sectors block deep expertise (2nd ARC: assign officers to specific domains over a career to match skills with senior policy posts) permanence and institutional memory : continuity despite political change (2nd ARC linked better personnel management with professional, accountable administration) evidence-based policymaking : sector research, technical skills and professional experience (Civil Services Exam Review Committee 2001: move from purely generalist approach; develop core competencies after initial 8-10 years ) political acumen, stakeholder mediation : experience with political executives, legislatures, departments institutional specialisation : India itself has recognised the need to combine general administration with domain expertise Value addition Urgent need for specialisation in broad sectors (financial, infrastructural, social, regulatory) after officers complete 10-12 years of service. Lack of appreciation of the nuances and implications of choices limits their ability to take an informed view and give the right advice to ministers. Modern administration needs both broad coordination and domain knowledge; lateral entry tries to bridge the gap. LATERAL ENTRY (since 1st ARC) Key point Lateral entry = induction of private-sector specialists into government departments; recommended since the First ARC . Why Type I error : wrong person recruited Type II error : right person rejected career path of civil servants is largely automatic reduce conservatism in civil services IAS (esp.) designed for the pre-reform, dominant State some specialised Union departments need knowledge IAS officers may not gain in state cadre postings Issues may lack district and field experience may not see govt service as a long-term career difficulty adapting to the government work ecosystem risk: Corporates place their own representatives Ruling party places its favourites top-heavy administration: overstaffed at top, understaffed in field (fix: remove incompetent or unproductive staff) must also upgrade skills of permanent civil servants 2018 10 Joint Secretary posts advertised; min 10 yrs experience in notified fields (civil aviation, shipping, commerce, environment); age below 40 ; 3 years, extendable to 5 2021 applications for 31 posts: Joint Secretary, Director, Deputy Director Aug 2024 UPSC advertised 45 posts: 10 Joint Secretaries + 35 Directors/Deputy Secretaries Controversy criticised for no SC/ST/OBC reservation: single designated posts treated outside the reservation roster 20 Aug 2024 DoPT asked UPSC to cancel; govt stressed equity and social justice ; UPSC cancelled the drive Memory visuals for this section Mnemonic · Consequences of a closed career system C O R N E R S A closed career system CORNERS the officer. C Conservative values O Obstacles to change R Rule fetishism N Non-responsive E Elitist mindset R Rank, not competence, decides placement S Status quoist Generalist or specialist: the two cases Lateral entry at a glance"}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "3-all-india-services", "t": "3 · All India Services", "x": "3 · All India Services # Handout only · M1 p.7-9 Exam lens Priority: Low. Mains PYQs quoted: none quoted in the material. Prelims PYQs quoted: none quoted in the material. Prelims hooks 9 AIS in 1909 -> 4 in 1924 -> 2 in 1947; today 3 (IAS, IPS, IFoS) Article 312; Patel as Father of AIS; Lloyd George coined 'Steel Frame' for the ICS 25 cadres incl. 2 joint: AGMUT and Assam-Meghalaya Entry 70 Union List; 2:1 outsider-insider ratio Arts 309, 310, 311, 323A; T.S.R. Subramanian (2013) Mains hooks Rationale for continuing AIS vs states' concerns Committee views: Rajamannar vs Sarkaria Doctrine of Pleasure; 2nd ARC on Article 311 AIS bind the federation together, but authority and responsibility must be re-balanced between Centre and states. In simple words All India Services are recruited and trained by the Union but serve under both Centre and States. India has three today: IAS, IPS and IFoS (25 cadres, two of them joint). They shrank over time: 9 (1909), 4 (1924), 2 (1947). Abolishing one is called provincialisation . In the Constituent Assembly some doubted them, but Sardar Patel (Father of the AIS) argued for them as the 'Steel Frame' that holds the country together; Article 312 gave them constitutional status. Supporters say AIS bring the best talent, national unity and Centre-State coordination. States reply that the authority-responsibility link is broken: they have limited control over officers they must work with. The same part of the handout gives the protections of civil servants: Articles 309, 310, 311, the Doctrine of Pleasure, and the T.S.R. Subramanian (2013) call for fixed tenure and Civil Services Boards. Term In plain words Provincialisation Abolishing an All India Service. Doctrine of Pleasure Public employment is not a private contract: termination is allowed within constitutional safeguards. Steel Frame Lloyd George's phrase for the Imperial Civil Service; the AIS were later called the Steel Frame of India. AIS began under British rule, survived Constituent Assembly opposition through Patel's insistence, and rest on Article 312. States now question their logic, while commissions mostly want them strengthened. Key point Meaning: AIS originated under British rule. Officers are recruited and trained by the Union but must serve under both the Centre and the States . 1909 nine AIS 1924 four 1947 two Today three: IAS, IPS, IFoS Key point Provincialisation = abolishing an AIS; states then become responsible for recruiting personnel for that part of administration. 25 cadres , incl. 2 joint: AGMUT (Arunachal, Goa, Mizoram, Union Territories) and Assam-Meghalaya . Constituent Assembly Debate Against Nehru Committee Report 1928 not keen regional interests seeking more devolution opposed AIS: could extend Centre's influence British policy cut their number Nehru initially not in favour of continuing them For: Sardar Patel Retained with constitutional status (Art 312) largely due to his insistence \" Father of AIS \" states lacked adequate capacity to recruit such personnel AIS = Steel Frame of unity Note: \"Steel Frame\" was used by British PM David Lloyd George for the Imperial Civil Service (ICS) Should AIS Continue? For (rationale) Against (states' view) best talent joins; promotes national unity ; wholesome influence on the federal system changing circumstances: unity and integrity not threatened as at Independence; national unity must rest on a stronger foundation than an administrative structure Union stays in touch with ground realities ; states gain a wider national outlook ; Centre can act through AIS in emergencies authority-responsibility mismatch: states have limited control over AIS officers, weakening ministerial responsibility; demoralised state civil services (often second-in-command) fewer political considerations in recruitment and in appointments to key posts; integrated infrastructure development 2:1 outsider-to-insider ratio seen as extending central influence; sons of the soil demand for local representation Centre-State, inter-state and day-to-day central-state bureaucracy coordination (21st-century law-and-order) Federal concern: AIS is a joint Union-State responsibility, yet it falls under Entry 70, Union List ; officers spend most careers in one cadre state, weakening the \"wider outlook\" claim Value addition States concede AIS has delivered: recruiting and allocating talent proportionately among states , promoting national unity, a broad national outlook, but raise the concerns on the right. Body View Rajamannar disband AIS Sarkaria disbanding AIS is a retrograde step ; strengthen AIS while reducing excessive generalism ; regular Centre-State consultation ; Advisory Council on AIS headed by Cabinet Secretary ; create new AIS: Indian Engineering, Medical & Health, Education Dismissal AND Discipline Key point Doctrine of Pleasure: public job ≠ private contract. Responsive to people, responsible to government; termination subject to constitutional safeguards. 2nd ARC on Art 311 rising procedural protections made it hard to dismiss even those civil servants who deserved removal recommends repeal of Art 311 one comprehensive Civil Services Law define clearly the reasonable opportunities and safeguards against arbitrary dismissal Service rules No political party, funds or elections May vote, not disclose limits on interaction with the media Annual declaration of assets and liabilities Report gifts Restrictions on political involvement of immediate family No adverse criticism of govt Value addition T.S.R. Subramanian (2013): minimum tenure in key posts · Civil Services Boards for postings/transfers · avoid verbal orders · comprehensive Civil Services Law. Memory visuals for this section Mnemonic · Service articles in number order R R R R 309 to 312 run as four Rs: Recruit, Retain, Remove, Raise. 309 Recruit: recruitment and conditions of service 310 Retain: tenure at the President's or Governor's pleasure 311 Remove: dismissal only with safeguards 312 Raise: Parliament can create All India Services 16 Equal opportunity in public employment 323A Administrative tribunals (CAT, SATs) Ordered by article number, so the order is kept. 16 and 323A sit outside the run. AIS: from British era to the Constitution AIS debate: keep or disband"}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "4-role-of-civil-services-in-democracy", "t": "4 · Role of Civil Services in Democracy", "x": "4 · Role of Civil Services in Democracy # Handout only · M1 p.9-12 Exam lens Priority: Medium. Mains PYQs quoted: 2017. Prelims PYQs quoted: none quoted in the material. Prelims hooks Neutrality = class, cultural, political; three forms of confidence Policy neutrality is not political neutrality Bhaskar Ghose's three bureaucrat types Max Weber on bureaucracy as an institution Lakhina Experiment, Ahmednagar (colour-coding of files) Mains hooks Why neutrality is hard to secure (4Cs, multi-party pressure) Anonymity vs social accountability tools Factors hindering professionalism Case for and against civil service activism Understand politics, do not play politics: neutrality in loyalty, not in intellect. In simple words The handout expects six qualities from civil servants: neutrality, commitment, anonymity, instrumentality, professionality, impersonality . Neutrality has three layers: class (officers are mostly middle class), cultural (language, caste, religion, region) and political. Political neutrality rests on three confidences: the people's, the ministers' and the civil servants' own. Political neutrality is not policy neutrality : civil servants advise on policy intellectually, never emotionally. They must understand politics, not play politics. The 4Cs (criminalisation, casteism, communalism, corruption) make this hard. Bhaskar Ghose's three types show the choices: Neither Wilt nor Tilt (firm), Incorrigibly Corrupt (find godfathers) and Weather Report Readers (shift with circumstances). Anonymity means the minister takes credit and blame, but RTI, social audits and Citizens' Charters are loosening it. Activism (media, leaks, courts, whistleblowing, the Lakhina Experiment) is a sign of the times, though the handout says it cannot be encouraged. Term In plain words Impersonality Not personalising the position held; no excess personal relations that cloud objectivity. Instrumentality Being an instrument of the people, not an independent power structure. Lakhina Experiment Dr. Lakhina's colour-coded files by year in Ahmednagar, 1980s: grassroots activism. Mnemonic · Six roles of civil services I P A N I C A good civil servant never says \"I PANIC\": the six roles keep him steady under pressure. I Impersonality: do not personalise the post P Professionality: keep upgrading skills A Anonymity: the minister is the public face N Neutrality: class, cultural, political I Instrumentality: instrument of the people C Commitment: rule of law, welfare of the Daridra Handout order is N-C-A-I-P-I; the letters are rearranged into a word because the roles have no sequence. Memory map: the six roles at a glance The handout lists six roles (neutrality, commitment, anonymity, instrumentality, professionality, impersonality). Each is under strain: class bias, social audits eroding anonymity, bureaucracy becoming an institution, poor training, personalised posts. Activism is a symptom of reform neglect. Civil servant in a democracy Civil servant in a democracy : Neutrality Commitment Anonymity Instrumentality Professionality Impersonality 1 · Neutrality PYQ 2017 Three layers Class: Civil servants mostly come from the middle class, whose mindset often becomes the dominant mindset of the bureaucracy Elite capture of state institutions (example: National Rifle Association, USA) makes neutrality hard Cultural: neutrality on the basis of language, caste, religion, region and other social identities Political: neutral towards all political parties, expressed through 3 confidences ↓ Confidence of Meaning People whichever party the people elect, civil services serve the elected government with diligence, dedication and commitment Ministers irrespective of the ideology of the minister's party, civil servants perform duties with commitment Civil servants decisions on postings, careers and promotions based on objective merit and rationality , not political affiliation Value addition Policy vs political neutrality: ministers may lack specialised knowledge of policy and governance, so civil servants advise them on the right course. Political neutrality ≠ policy neutrality: an officer may prefer one policy over another while staying within legality and constitutionality . Involvement in policy = purely intellectual, never emotional . Civil servants must understand politics, not play politics , and must consider the political implications of policies they recommend. Note Problems: a thinking person can never be completely neutral · the 4Cs of the political environment (criminalisation, casteism, communalism, corruption) make neutrality difficult · parties may demand loyalty instead of encouraging neutrality · no complete agreement on fundamentals such as the country's vision and direction (extreme right, extreme left, secular parties) · rise of multi-party democracy exposes officers to pressure from different parties at Centre and state. Bhaskar Ghose's 3 types Behaviour Neither Wilt nor Tilt stand firm, refuse orders that deviate from established policy or law; may face transfers but do not compromise neutrality and honesty Incorrigibly Corrupt find political godfathers early in their careers and align with political parties Weather Report Readers shift loyalty with changing political circumstances; adjust positions to suit convenience 2-6 · THE Other FIVE Commitment commitment towards: Impartial implementation of the rule of law Established code of ethics Settled policies Probity Transparency Duty welfare of the Daridra (poorest of the poor) Anonymity Works behind the scenes Minister = public face Credit for good goes to the minister In a major failure the minister must also accept responsibility: anonymity goes hand in hand with ministerial responsibility it is the duty of ministers to protect civil servants changing with social accountability mechanisms: social audits, RTI, Citizens' Charters, time-bound public service delivery laws Instrumentality instrument of the people, but a full bureaucracy can become an independent power structure with elitist values Max Weber: once an institution, bureaucracy is among the hardest structures to dismantle Professionality A professional keeps improving knowledge and skills, stays updated, undertakes training Civil service is a profession hindrances: Generalists in specialist services Poor training (largely Group A and B; only 1 in 5 can expect formal training; mid-career training absent or inadequate) Weak appraisal (no quantifiable targets) Weak incentives and disincentives: \" hire, but no fire \" Cadre-based dominance of IAS, limited lateral entry Impersonality don't personalise the post (DC, SP): Impersonality = not personalising the position The job is to discharge its duties faithfully Impersonal attitude to superiors, colleagues and juniors Over-personal ties dull objectivity (example: overlooking a friend's corruption) Civil Services Activism Key point Activism = a civil servant takes the role of a crusader to address problems inside and outside government. Forms Going to the media Calculated leaks Going to courts whistleblowing = publicly exposing wrongdoing grassroots activism = initiatives that make people's interactions with district administration easier post-retirement : NGOs, civil society organisations, YouTube channels and similar platforms Way forward / key point Lakhina Experiment (Dr. Lakhina, IAS, Ahmednagar, 1980s): officials needed older files but finding them in heaps was hard; he colour-coded files by year , making retrieval easy. Example of grassroots activism . Issues may violate civil service rules and set a bad precedent may personalise institutional issues (e.g. targeting the CM personally over corruption) exposes civil services to manipulation by parties and media can erode credibility of public and democratic institutions Note Verdict: activism as such cannot be encouraged , but it is a sign of our times. Civil service and electoral reforms, discussed for decades, must be implemented more effectively to ensure an appropriate political class and civil services. Memory visuals for this section Bhaskar Ghose: three ways an officer meets political pressure Civil services activism: from act to verdict"}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "5-working-and-performance-of-civil-service", "t": "5 · Working and Performance of Civil Services", "x": "5 · Working and Performance of Civil Services # Handout only · M1 p.12-13 Exam lens Priority: Low. Mains PYQs quoted: none quoted in the material. Prelims PYQs quoted: none quoted in the material. Prelims hooks Average District Collector tenure about one year Street-level bureaucracy defined The 3Ms: MTV, Macintosh, McDonald's SPVs: Solar Energy Corporation, National Skill Development Corporation Mains hooks Performance table: regulatory, rule of law, developmental, facilitation Causes of poor performance 21st-century challenges for bureaucracy Doer, facilitator and regulator: the bureaucracy must now play all three roles while being held to global standards. In simple words Civil services do four jobs: formulate policy , implement it, evaluate it, and adjudicate (quasi-judicial powers, e.g. Collectors in revenue courts). They also give continuity when governments change. Evaluation has a built-in problem: officers judge programmes they themselves ran, a conflict of interest, which is why social audits matter. Report card: relatively good at preserving the constitutional order and law and order; weaker on impartial rule of law (class bias, corruption, interference); mixed on development; shifting after 1991 from direct doer to facilitator. Why performance suffers: political interference, dual control over AIS, arbitrary transfers and short tenures (a DC averages about a year), street-level corruption, weak training and appraisal, wage compression. The 21st century adds globalised problems (COVID-19, terrorism, money laundering), new roles (doer, facilitator, regulator), global yardsticks, expanding rights and a global monoculture (the 3Ms). Term In plain words Street-level bureaucracy Lower-level officials who deal directly with citizens. 3Ms of monoculture MTV (fast music), Macintosh (fast computers), McDonald's (fast food). Civil servants formulate, implement and evaluate policy and adjudicate, but performance is mixed: good on regulation, weak on facilitation. Short tenures, corruption and thin training explain much of it, and 21st-century problems demand new roles. Memory aid · FIEA Four functions: F ormulate · I mplement · E valuate · A djudicate (and keep continuity when politics changes). (own mnemonic) Functions Formulate: Principal channel between grassroots and top decision-makers Give ministers facts and figures, court judgments, laws Technical considerations Policy advice incl. value judgments Draft legislation Help shape balanced policy for overall welfare, not just some sections Implement (a principal responsibility): making rules, financial management, HR management, regular monitoring and supervision Evaluate: feedback goes to political leadership to improve, adjust or modify policy, but a conflict of interest arises (officers evaluate programmes they implemented) → rising importance of social audits Adjudicate: quasi-judicial powers (e.g. District Collectors decide certain administrative disputes through revenue courts) Continuity: administration continues through changes in political leadership or absence of the political executive Function Performance Regulatory relatively satisfactory in preserving constitutional order, democracy, secularism, national unity, and law and order against separatism, terrorism, subversion Impartial rule of law hit by class bias, corruption, political interference Developmental mixed: economic development, effective public services, implementing elected governments' policies Facilitation (post-1991) after 1991 reforms shifted from direct doer towards facilitating private sector, civil society, NGOs, local bodies; performance considered particularly weak WHY Performance Suffers Causes Political interference (cannot keep neutrality) Dual control : balance of control over AIS weakened, states exercising considerable influence reluctance to use constitutional protection : high personal and financial costs arbitrary transfers, short tenures : Average DC tenure about 1 year T.S.R. Subramanian stressed tenure security in key posts corruption , esp. in street-level bureaucracy (lower-level officials citizens meet directly) poor capacity building : training has not kept pace with a changing environment wage compression : pay not raised in proportion to changing responsibilities poor evaluation : inadequate data weakens objective assessment lack of people's participation in administration 21st-CENTURY Challenges New challenges New challenges : Globalised problems New roles New accountability Wider rights Global monoculture SPVs and credibility Challenge Meaning (as in handout) Globalisation of domestic problems domestic problems with international roots (COVID-19, money laundering, terrorism, drug trafficking) need multilateral frameworks ; officers need negotiation and diplomatic skills Changing roles Doer: remaining direct functions more effective and cost-efficient. Facilitator: of local bodies, NGOs, civil society. Regulator: law and order needs new skills Changing accountability beyond local institutions to global standards (Transparency International, HDI, SDGs, Ease of Doing Business); Citizens' Charters and social audits let citizens hold officers accountable directly Continuous reforms; professionalism continuous, not episodic; unlearn old habits, relearn new ; reforms regularly; greater professionalism Expanding rights respond to new rights-based demands: environmental, consumer, disability, LGBT, privacy Global monoculture Western consumer culture challenges traditional Indian culture; 3Ms : MTV (fast music), Macintosh (fast computers), McDonald's (fast food); manage tensions of cultural change Tailor-made institutions specialised bodies and SPVs outside ministerial hierarchies (Solar Energy Corporation, National Skill Development Corporation) Crisis of State credibility more visible after LPG reforms and India joining institutions like WTO ; policy choices more restricted; credibility pressed by forces above and below the State Value addition Reforms must be continuous, not episodic ; professionalism is the aim. PYQ printed here: 2014 cadre-based services → Ch 2. In the news (Saarthi IAS CA; verify dates) Cabinet Secretary: ACC approved a one-year extension. Link: stable tenure at the top vs arbitrary transfers lower down (T.S.R. Subramanian). Memory visuals for this section Mnemonic · Causes of poor performance W I L D S C A R E Poor performance gives citizens a WILD SCARE. W Wage compression I Interference: political L Lack of people's participation D Dual control over AIS S Street-level bureaucracy corruption C Capacity building is poor A Arbitrary transfers, short tenures (DC about one year) R Reluctance to use constitutional protection E Evaluation of performance is poor"}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "6-bureaucracy-and-development", "t": "6 · Bureaucracy and Development", "x": "6 · Bureaucracy and Development # Handout only · M1 p.13-15 Exam lens Priority: Low. Mains PYQs quoted: none quoted in the material. Prelims PYQs quoted: none quoted in the material. Prelims hooks Rajiv Gandhi: 16 paise of every rupee reaches the people Weber's four characteristics; five features of development administration Four named minister-bureaucrat conflicts (Mundhra 1957, Nanda-L.P. Singh, Hanumanthaiah-Ganguli 1973, Rajiv-Venkateswaran 1987) Terms: Hakim culture, Babu culture, goal displacement, politico-administrative no-man's land Mains hooks How bureaucracy promotes vs threatens democracy Why traditional bureaucracy suits development administration poorly Paradoxes between Indian bureaucracy and development Like fire, bureaucracy is a good servant and a bad master. In simple words Max Weber's line: democracy has a love-hate relationship with bureaucracy; it is like fire, invaluable as a servant and destructive as a master. It helps democracy by upholding rule of law, running free and fair elections and delivering socio-economic justice. It threatens democracy when the instrument becomes an institution, hoards power, hides information, shuts out NGOs and local bodies, or is misused by the state (ED, CBI examples). Power struggles create a politico-administrative no-man's land between policy making and implementation: Mundhra scandal (1957), Nanda vs L.P. Singh, Hanumanthaiah vs Ganguli, Rajiv Gandhi vs Venkateswaran. Weber's bureaucracy (specialisation, hierarchy, rules, defined roles) clashes with development administration (change, results, commitment, client orientation). Indian bureaucracy is colonial in structure and mindset (Hakim and Babu culture, red tape, secrecy). Its paradoxes: technology amid backwardness, government spending on itself (Rajiv Gandhi's 16 paise), generalists over specialists, wage compression. Term In plain words Politico-administrative no-man's land The gap left when ministers and officials struggle over power between policy making and implementation. Hakim culture Behaving as a master, not a servant. Babu culture File and rule fetishism with creative inertia. Bureaucracy: servant or master? Weber's bureaucracy (rules, hierarchy, role specificity) clashes with development administration (change, results, client focus). Indian bureaucracy's colonial, file-bound behaviour shows up as paradoxes such as the 16-paise leakage. Quote Max Weber: \"Democracy has to promote what reason demands but what democratic sentiments hate.\" A love-hate relationship: bureaucracy is like fire , invaluable servant, destructive master. Promotes democracy institutionalises rule of law helps conduct free and fair elections fulfils the six role expectations balanced policymaking : stops policy turning one-sided or giving undue benefit to some sections delivers socio-economic justice through policies Threatens it Instrument → institution with own values and privileges May resist citizen-centric reforms that challenge its authority oligarchic concentration of power secrecy : Citizens cannot know what happens inside Like an \" uninformed parliament \" with little public scrutiny suppresses roles of NGOs, pressure groups, local bodies no representative bureaucracy (classes, castes, religions, occupations): fewer perspectives on policy, weaker grassroots-based implementation corruption and lack of neutrality weaken governance state oppression: agencies used for political ends against rivals (ED, CBI) power struggle between political and permanent executive at the top → politico-administrative no-man's land (responsibilities of policymakers and implementers unclear) Political-bureaucratic conflict Parties Mundhra scandal 1957 allegation that LIC invested in loss-making firms of Haridas Mundhra; led to resignation of the Finance Minister and the Finance Secretary Mid-1960s tussle between Home Minister Gulzarilal Nanda and Home Secretary L.P. Singh 1973 Railway Minister Hanumanthaiah vs Railway Board Chairman B.C. Ganguli 1987 disagreements between PM Rajiv Gandhi and Foreign Secretary A.P. Venkateswaran over foreign policy towards Sri Lanka Weber vs Development Administration Key point Weber: bureaucracy is not simply the civil service; it is a form of organisation of work in which many people work together, so it can exist in private organisations too. Its problems became more pronounced in the public sector, so \"civil service\" and \"bureaucracy\" came to be used interchangeably. Weber's bureaucracy Development administration division of labour and specialisation change orientation: bring positive change in people's conditions clear hierarchy giving leadership at levels result orientation: change shows in quantified, visible results rule orientation: rules ensure impartiality, neutrality, objectivity commitment to change: implement time-bound programmes role specificity: defined responsibilities, so individuals can be held accountable client orientation: what suits the client, not the government; plus communication and participation inside and with citizens Memory aid · C R C C Development admin = C hange · R esults · C ommitment (time-bound) · C lients. (own mnemonic) Note Conflicts: goal displacement (excess rule orientation shifts focus from the real objective) · low adaptability (traditional bureaucracy built to maintain status quo; modern ones must lead change) · historical mismatch (bureaucracy predates development administration, which emerged largely after WW II, so adapting to a welfare role is hard) · political dimension (not merely techno-bureaucratic; society must be prepared for development) · excessive formalism , esp. unsuitable for rural development. Indian Bureaucracy Structural British pattern inherited long hierarchies: lower levels get disconnected from higher levels concentration and centralisation of power: little authority devolved to street-level bureaucracy cadre-based civil services unstable tenure: frequent transfers hamper functioning (Collectors \"packing and unpacking\") standard departmental structure for most purposes Behavioural colonial mindset: master rather than public servant Non-responsive Hakim culture: distance from the local population Babu culture: File and rule fetishism Creative inertia = look of activity without real results on the ground Corruption Red tape (slow-moving) Secrecy result: less suited to development administration Paradoxes Features and paradoxes of Indian bureaucracy advanced technology amid socio-economic backwardness govt spends more on itself: Rajiv Gandhi said only 16 paise of each rupee spent on development reaches the people Much goes to salaries, procurement, accommodation, office costs archaic and complex values and rules constrain development administration authority-responsibility mismatch: lower levels carry big responsibility with little authority, so decisions feel risky unstable tenure: short tenures stop officers improving programmes with experience poor inter-agency coordination: departmental thinking blocks integrated development centralised, non-participatory: public participation often only formal profound learning disorders: agencies should learn from mistakes, yet do not (e.g. repeated dengue outbreaks in Delhi) Generalists given more importance **** specialists need rehabilitating in the system wage compression: pay should rise with responsibility, as pay is a key determinant of motivation Memory visuals for this section Mnemonic · Bureaucracy as a threat to democracy S C O R P I O S Bureaucracy as master stings like SCORPIOS. S Secrecy: an uninformed parliament C Corruption and lack of neutrality O Oligarchic concentration of power R Representative bureaucracy absent P Politico-administrative no-man's land I Instrument becomes institution O Oppression by the State (agencies used against rivals) S Suppresses NGOs, pressure groups, local bodies"}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "7-pay-8th-cpc-and-the-right-to-strike", "t": "7 · Pay, 8th CPC and the Right to Strike", "x": "7 · Pay, 8th CPC and the Right to Strike # Handout only · M1 p.16-17 Exam lens Priority: Low. Mains PYQs quoted: none quoted in the material. Prelims PYQs quoted: none quoted in the material. Prelims hooks 8th CPC reference date: 1 January 2026; Revised Basic Pay = Existing Basic x Fitment Factor Essential Defence Services Bill 2021: 41 ordnance factories, about 84,000 workers First ARC (1966) wanted unlawful strikes made a penal offence; ESMA mentioned Mains hooks Arguments for and against civil servants' right to strike Fiscal and state-level impact of a pay commission Way forward: regular revisions, performance-linked incentives Fair pay and a no-strike norm for essential services protect both the employee and the citizen. In simple words Government pay is often lower than the private sector, balanced by job security, fringe benefits, status and public service. The handout favours performance-linked incentives . The 8th Central Pay Commission has a reference date of 1 January 2026. Its key lever is the fitment factor : Revised Basic Pay = Existing Basic Pay x Fitment Factor. A higher factor lifts allowances and pension liabilities. Issues: the minimum-wage model, DA merger demand (DA is absorbed then reset), fiscal impact (less capex), pressure on states. Way forward: smaller regular revisions linked to inflation, revenue and fiscal capacity. Right to strike : the Essential Defence Services Bill 2021 (ordnance factories: 41 factories, about 84,000 workers) triggered the debate. For: collective protest, last resort. Against: public interest ('a loaded gun at citizens'), model-citizen expectation. Handout position: no strikes that seriously disrupt essential services; distinguish essential from non-essential. The Supreme Court observed that government employees have no fundamental, statutory or equitable right to strike. Term In plain words Fitment factor The multiplier on existing basic pay to get revised basic pay. ESMA The law under which strike misconduct can also be a disciplinary offence (as the handout notes). Remember it as Revised Basic Pay = Existing Basic Pay x Fitment Factor. Pay is lower than the private sector but offset by security and status. The 8th CPC (reference date 1 Jan 2026) raises fitment-factor, DA and fiscal questions. On strikes, the handout settles on a balance: no strikes that disrupt essential services. Key point Salaries are often lower than the private sector, but with job security, fringe benefits, higher social status and opportunities for public service (salary should not be the only motivation). A balance can be struck with performance-linked incentives . 8th Central PAY Commission Memory aid · FORMULA Revised Basic Pay = Existing Basic Pay × Fitment Factor · reference date 1 Jan 2026 · higher factor → higher allowances and pension liability. Issues minimum-wage calculation: Earlier CPCs used a 3-consumption-unit family model Groups want dependent parents included, raising the question of how far pay should cover rising healthcare, eldercare, family support costs Dearness Allowance: Employees want DA merged with basic pay before the new structure Usually DA is absorbed into revised pay and then reset , so part of the apparent rise is inflation compensation already given , not a big real-income gain fiscal impact: higher pay and pensions raise committed expenditure, make fiscal consolidation harder, shrink space for capex, infrastructure, development states: CPC applies to Central staff but states face pressure to follow Heavier salary and pension burden May cut health, education, local development spending Way forward 8th CPC in three steps regular pay revision: smaller, more predictable revisions, not big decadal shocks performance orientation without weakening administrative neutrality workforce rationalisation: better deployment, fewer unnecessary posts digital governance to raise productivity fiscal balance: link revisions to inflation, revenue growth, overall fiscal capacity Way forward / key point Why fair pay matters: attract and retain competent civil servants · protect against inflation · maintain morale and integrity · reasonable social security. But revisions must stay consistent with fiscal sustainability and administrative efficiency : fair pay with an efficient, accountable, fiscally sustainable administration. Right TO Strike Value addition Trigger: Essential Defence Services Bill, 2021 (the handout calls it a Bill; it became law later: Ordinance June 2021, Act Aug 2021, general knowledge, verify). It was meant to prohibit strikes in specified essential defence services, incl. ordnance factories ( 41 factories, nearly 84,000 workers ), to keep defence supply uninterrupted given India's security challenges and a possible two-front conflict . This raised the question: should civil servants have a right to strike? In favour Against right of citizens: strike as collective protest public interest: strikes by civil servants may harm it; threat of a strike is like a loaded gun pointed at citizens protection against exploitation: denial leaves them without effective remedy against extreme service conditions model citizens: extreme protest may clash with public responsibilities last resort when other mechanisms fail government responsibility: govt should treat employees fairly, as its wider aim includes preventing exploitation in public and private employment Way forward / key point Balanced position (handout): no strikes that seriously disrupt essential public services; distinguish essential from non-essential services. Legal position strike-related misconduct can be a disciplinary offence under service rules and the Essential Services Maintenance Act (ESMA) 1st ARC (1966): Opposed a right to strike Recommended making unlawful strikes a penal offence , not merely a disciplinary one Supreme Court: government employees have no fundamental, statutory or equitable right to strike balanced solution: distinguish essential vs non-essential services with different restrictions Memory visuals for this section Right to strike: the two sides"}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "8-civil-services-reforms-and-nolan-princip", "t": "8 · Civil Services Reforms and Nolan Principles", "x": "8 · Civil Services Reforms and Nolan Principles # Handout only · M1 p.17-18 Exam lens Priority: High. Mains PYQs quoted: 2017, 2020. Prelims PYQs quoted: none quoted in the material. Prelims hooks Satish Chandra Committee: separate technical exams NIPAs (2nd ARC): IIT/AIIMS-style entry, 3-4 years' training; one-year bridge course for other graduates 360-degree appraisal used for AIS empanelment for central deputation; 2nd ARC feared victimisation Nolan Committee (1995): seven principles 2nd ARC drafted a Civil Services Law Mains hooks Reforms in recruitment, training, appraisal Comprehensive Civil Services Law; domainisation Nolan Principles as an ethical foundation Reform is continuous: recruit for competence, train for roles, appraise for results, protect for neutrality. In simple words Reform in the handout runs through recruitment, training, appraisal and the legal framework . Recruitment: mainstream lateral entry, overhaul exams (Satish Chandra Committee: separate technical exams), NIPAs (2nd ARC), psycho-social profile checks and probation. Training for all, not just Groups A and B; mid-career training; better content; link training grades to career progress. Appraisal: link 0-10 grades to targets; 360-degree appraisal (superiors, colleagues, juniors, clients); stable tenure; domainisation; remove deadwood by premature retirement; a comprehensive Civil Services Law. The seven Nolan principles (1995) : Selflessness, Integrity, Objectivity, Accountability, Openness, Honesty, Leadership. Term In plain words NIPA The 2nd ARC's proposed institutes of public administration, entered after higher secondary like IITs and AIIMS. 360-degree appraisal Feedback from superiors, colleagues, juniors and clients. Domainisation Building expertise in areas such as security, infrastructure, agriculture. Reform map Reform needs to run through recruitment, training, appraisal, tenure, law, transparency, anti-corruption and the status of specialists. The Nolan Principles give the ethical frame. Civil service reform PYQ 2017PYQ 2020 Civil service reform (PYQ 2017) (PYQ 2020) : Recruitment Training Performance appraisal Tenure and domains Civil Services Law Ethics: Nolan Recruitment Mainstream lateral entry Less dependence on cadre services Satish Chandra Committee: separate exams for technical services NIPAs (2nd ARC proposal): Specialised public administration institutes Students finishing higher secondary compete for admission like IITs and AIIMS , then 3-4 years of training in public administration Graduates of other universities may compete after a 1-year bridge course in management or public administration psycho-social profile: Recruit by identifying candidates' psycho-social traits An SSB-type interview may be considered probation rules: use probation to identify and remove unsuitable recruits Training training for all , not largely confined to Group A and B mid-career training regularly, as 21st-century challenges change fast modify content: Often unsuited to on-ground experience Mid-career courses similar for officers in different fields Training treated as a paid holiday link training to career: completion and grades should affect advancement soft skills: communication, interpersonal and others Appraisal Performance Appraisal Reports: Periodic evaluation by superiors Numerical grades (commonly 0-10 ) linked to actual achievement of assigned targets 360-degree (multi-source feedback): From superiors, colleagues, juniors and clients Used to assess AIS officers for empanelment for central deputation 2nd ARC had reservations: could lead to victimisation of honest officers Tenure, law, specialists stability of tenure: adequate security of tenure domainisation: senior officers, esp. IAS, build expertise in fields like security, infrastructure, agriculture performance-linked incentives can foster competition and raise efficiency remove deadwood: incompetent, lazy, lethargic civil servants retired prematurely under applicable rules Comprehensive Civil Services Law covering all aspects of functioning 2nd ARC prepared a draft bill transparency in personnel management: Transfers, postings, disciplinary action Stronger action to root out corruption rehabilitate specialists: They often work under generalists, with salaries and positions inferior to IAS This demoralises them Give them a proper place, esp. at the highest levels Nolan Principles (1995) Principle Meaning S elflessness act solely in the public interest; avoid personal gain from official positions I ntegrity maintain moral uprightness; avoid conflicts between personal and professional obligations O bjectivity decisions on merit and evidence, free from bias, favouritism or external influence A ccountability answerable for decisions and actions to the public and oversight bodies O penness government operations transparent; information accessible unless legally restricted H onesty truthful in declarations, statements and dealings with citizens and colleagues L eadership exemplify ethical behaviour; promote these principles through personal conduct Value addition PYQs printed: 2017 (250 w) CS designed for neutrality and effectiveness, now lacking; drastic reforms? · 2020 (150 w) institutional quality drives economic performance; suggest CS reforms to strengthen democracy. In the news (Saarthi IAS CA; verify dates) Conflict of interest: National Horticulture Board bars public functionaries from commercial horticulture subsidies; SEBI rules (Sinha Committee): life-cycle disclosure, 2-year cooling-off , recusal, Office of Ethics and Compliance. Quote: Caesar's wife, trusteeship. Memory visuals for this section Mnemonic · Nolan principles (1995) H A L O i O S Nolan's seven are the civil servant's operating system: HALO + iOS. H Honesty A Accountability L Leadership O Openness I Integrity O Objectivity S Selflessness"}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "9-challenges-to-reform-mission-karmayogi-a", "t": "9 · Challenges to Reform; Mission Karmayogi; Aarambh", "x": "9 · Challenges to Reform; Mission Karmayogi; Aarambh # Handout only · M1 p.19-20 Exam lens Priority: Medium. Mains PYQs quoted: 2020. Prelims PYQs quoted: none quoted in the material. Prelims hooks NPCSCB = Mission Karmayogi, launched 2020; rules-based to roles-based Components: iGOT Karmayogi, competency frameworks, performance management, SPV Karmayogi Bharat, Capacity Building Commission Aarambh: Common Foundation Course; Commitment, Character, Conduct Mains hooks Six challenges to civil service reform and way forward Mission Karmayogi: objectives, components, implementation challenges Karmayogi turns reform from episodic exercise into a continuous learning system. In simple words Reforms stall for reasons the handout lists: weak political will, thin management capacity, civil servants' own resistance, no safety nets, poor fit with local context and weak communication. The remedy: cross-party commitment, reform units, incentives for civil servants, safety nets, contextualising and ongoing consultation. Mission Karmayogi (2020) moves HR management from rules-based to roles-based : five parts: iGOT Karmayogi (online training), competency frameworks, outcome-based performance management, SPV Karmayogi Bharat and the Capacity Building Commission. Hurdles: integrating lateral entrants, shifting mindset from compliance to problem-solving, Centre-State coordination and digital reach in remote areas. Aarambh : a Common Foundation Course for probationers stressing Commitment, Character and Conduct. Term In plain words iGOT Karmayogi Integrated Government Online Training: on-demand, role-specific modules. SPV Karmayogi Bharat A not-for-profit company for content, partnerships and implementation support. Mnemonic · Challenges to civil service reform C R A M P S Reforms stall when the system gets CRAMPS. C Communication and stakeholder engagement R Resistance of civil servants (security, no incentive) A Alignment with context (one state's success may not travel) M Management capacity: fragmented, piecemeal P Political support and will S Safety nets: compensation, retraining, counselling Reforms stall for lack of sustained political will, management capacity, buy-in from civil servants, safety nets, fit with context and communication. Mission Karmayogi (2020) is the shift from rules-based to roles-based capacity building. Why reforms stall political support and will: Priorities change and reforms get deprioritised Inconsistent support can stall or reverse them Leaders resist reforms that cut their influence over the bureaucracy (e.g. less political interference in appointments, transfers) management capacity: Institutions may lack project management, coordination, accountability mechanisms Fragmented, piecemeal efforts without an overall strategy civil servants themselves: Resist (job security, uncertainty, old habits) Lack of incentives Inadequate rewards for reformers breed apathy or resistance safety nets: Restructuring and downsizing create insecurity Without retraining or compensation, staff resist Reforms should give compensation, retraining, career counselling alignment with environment: Reforms must fit political and institutional conditions Diverse federal India means what works in one state may not suit another Long-established norms resist change communication: Clear communication among political leaders, civil servants, citizens Weak channels breed misunderstanding Stakeholders should join design and implementation to build trust Way forward / key point Way forward: consistent political support with broad cross-party consensus · build capacity via targeted training, dedicated reform units , clear accountability frameworks · involve civil servants in design and delivery, with incentives incl. career advancement · safety nets (retraining, compensation, institutional support) · tailor reforms to states and regions · institutionalise regular consultation, transparent decisions, feedback. Aim: a more responsive, efficient, accountable bureaucracy. Mission Karmayogi (npcscb), 2020 PYQ 2020 Value addition Core shift: rules-based → roles-based HR (launched by GoI in 2020 as the National Programme for Civil Services Capacity Building; seen as one of the most comprehensive, institutionalised civil-service reforms since Independence; aim: dynamic, agile, citizen-centric bureaucracy). Aims: future-ready workforce · shift from rule-bound generalist administration to competency-driven, specialist governance · align with Viksit Bharat 2047 · performance-based appraisal over tenure-based promotion. Component What it does iGOT Karmayogi Integrated Government Online Training: digital learning ecosystem for officials at all levels ; on-demand, need-based, role-specific modules; continuous and blended learning; AI-driven personalisation ; unified resource across services, ministries, states Competency frameworks competency dictionaries defining behavioural, functional, domain competencies; assess and train for the competencies each role needs; map individual training needs to roles; replace one-size-fits-all Performance management robust, transparent, outcome-based system; move beyond Annual Confidential Reports to real-time feedback and tracking ; link performance with promotions, postings, recognition for a merit-based culture SPV: Karmayogi Bharat not-for-profit company to oversee content, manage partnerships, support implementation; enables tie-ups with public, private, global institutions for content, research, evaluation Capacity Building Commission oversees capacity-building standards ; aligns ministries, services, states with Karmayogi principles; gives strategic direction , monitors implementation, ensures quality assurance Memory aid · I C P S Karmayogi: i GOT · C ompetency · P erformance · S PV (+ the Commission). (own mnemonic) Implementation problems lateral entrants: Bridge the culture gap with career civil servants Unified competency and performance frameworks for both Coordination between domain specialists and generalists mindset: Compliance-oriented → problem-solving, citizen-centric Beat bureaucratic inertia Ownership and motivation for digital learning Centre-State: State needs are diverse Collaborate for uniform standards without hurting federal diversity States and local bodies need capacity resources: Digital infrastructure in remote areas Funds for content, training partnerships, scaling up Significance raises efficiency, transparency, accountability of civil services responsive governance : modern tools and competencies aligns civil services with India's changing aspirations and a dynamic democracy shift from rule-based, control-focused to role-based, citizen-first delivery In the news (Saarthi IAS CA; verify dates) DAKSH Leadership Programme (3rd batch): senior PSE executives; run by the Capacity Building Commission and SCOPE with ISB. Memory visuals for this section Mnemonic · Aarambh foundation course C C C Aarambh builds three Cs. C Commitment C Character C Conduct Reform challenges and the way out"}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "10-transparency-and-ndsap", "t": "10 · Transparency and NDSAP", "x": "10 · Transparency and NDSAP # Handout only · M1 p.21-23 Exam lens Priority: Low. Mains PYQs quoted: none quoted in the material. Prelims PYQs quoted: none quoted in the material. Prelims hooks OECD and UNESCAP definitions; three metaphors of transparency NDSAP 2012: DST nodal; OGD platform; negative list considers RTI Sections 8 and 9, IT Act 2000, privacy Best practices: MGNREGA social audits (Rajasthan), Citizen Report Cards (Bengaluru), PET Uganda, EDUCO El Salvador CIC (2013): political parties under RTI Mains hooks Objectives of transparency; transparency-accountability link Challenges due to transparency Transparency vs privacy; digital divide limits Transparency is the precursor to accountability; privacy and inclusion are its limits. In simple words Transparency means decisions, rules and information are open and reachable by the people affected. OECD stresses comprehensible, accessible, timely; UNESCAP stresses rule-following and free access. It acts as public value (against corruption), open decision-making and a tool of good governance. It comes before accountability, integrity and probity. Tools: RTI, e-governance, Citizens' Charters, social audits, public expenditure tracking, Citizen Report Cards and public hearings. Costs: administrative burden from non-serious applications, misuse, privacy and confidentiality worries, and digital exclusion. NDSAP 2012 shares non-sensitive government data in machine-readable form on the OGD Platform; DST is the nodal department; a negative list protects sensitive data. Term In plain words NDSAP The 2012 data-sharing policy; DST is the nodal department. Negative list Data that cannot be shared, guided by RTI Sections 8-9, the IT Act and privacy. Transparency map Transparency means openly known criteria, processes and decisions. It is a precursor to accountability, fights corruption and enables entitlements, but has costs (burden, misuse, privacy). NDSAP 2012 and the OGD platform are the proactive tools. Key point OECD: an environment where policy objectives, legal and institutional frameworks, decisions, their rationale and relevant information reach the public in a comprehensible, accessible, timely way. Key point UNESCAP: decisions and their enforcement follow rules and regulations; information is freely available and directly accessible to those affected by decisions. Way forward / key point In governance: people have the right to know what government is doing and government has an obligation to tell; criteria, processes and systems of decision-making are openly known to all ( Tandon, 2002 ). Example: under Skill India Mission, citizens should know eligibility criteria, who applies them, benefits and conditions. TI: those affected should know the mechanisms and processes behind decisions, not just facts and figures. Open government: run openly so citizens can trust elected representatives and institutions. Public scrutiny: actions must withstand scrutiny, with information in an understandable form. Value addition Objectives in detail: transparency makes govt accountable ; raises chances of detecting corruption and deters it (TI Global Corruption Report 2003 stressed information); lets citizens access entitlements ; improves service delivery ; informed citizens understand decisions and reasons; participation in democracy needs access to information; lack of information breeds disempowerment, mistrust, frustration . Value addition Transparency is the precursor of accountability, integrity and probity. Ethical governance needs not only rule of law but fairness, equality and justice. Mechanisms: RTI, e-governance, Citizens' Charters. Key measures: RTI 2005, NDSAP 2012, Charters, e-governance, CPGRAMS . Social Accountability Tools Key point Social accountability stresses civic engagement : citizens help monitor govt performance. Tools: social audits (e.g. MGNREGA), public expenditure tracking , Citizen Report Cards , public hearings . They raise service quality and deter corruption by making governance participatory. Tool / practice Impact Social audits, MGNREGA, Rajasthan model villagers audited public works and found ghost beneficiaries and wage leakages Citizen Report Cards, Bengaluru survey-based feedback on services like electricity and water improved delivery Public Expenditure Tracking, Uganda greater transparency in fund flows reduced diversion of education grants EDUCO, El Salvador community participation in school management improved teacher accountability and student outcomes E-governance digital platforms streamline processes, reduce discretion, speed up grievance redressal but digital divide, privacy concerns, cybersecurity threats, low digital literacy can undermine transparency Challenges of transparency administrative burden: non-serious applications pressure already understaffed bureaucracies misuse: anti-social elements may use information to create disharmony or threaten national security questionable authenticity of disclosed information wrong interpretation can hurt an organisation privacy and confidentiality conflict Committee / report Recommendation 2nd ARC, 14th Report mandatory proactive disclosure; integrate e-governance with service delivery; public data portals Law Commission 179th and 255th redefine RTI exemptions; clearer guidelines on public-interest disclosure NCRWC (Constitution review commission) replace the Official Secrets Act with more appropriate national-security legislation CIC (2013) held that political parties come within the ambit of RTI; non-compliance has persisted Ndsap 2012 Key point NDSAP: promotes sharing of and access to government-owned data for national planning and development; non-sensitive information of public authorities is made accessible in machine-readable (and human-readable) open formats. Applies to data created, generated, collected or archived with public funds by ministries, departments, organisations, agencies, autonomous bodies. Objective: proactive, periodically updated access to shareable data within applicable laws. Ndsap Machinery OGD Platform gives access to datasets of ministries and agencies DST is the nodal department: coordination, formulation, implementation, monitoring Principles: openness, flexibility, transparency, data quality, wider access Negative list = data that cannot be shared; consider RTI Sec 8 and 9, IT Act 2000, Right to Privacy Note Transparency vs privacy: RTI may clash with the Official Secrets Act, Conduct Rules, privacy. Sec 8(2) : disclose when public interest outweighs protected interest. Aadhaar and DBT need strong data protection. Digital and language barriers may exclude marginalised communities ; data-sharing should prioritise inclusivity, citizen-centric interfaces, feedback mechanisms . Memory visuals for this section Mnemonic · Three metaphors of transparency T O P Transparency comes from the TOP. T Tool of good governance O Open decision-making (secrecy vs privacy) P Public value (counter corruption) Mnemonic · Objectives of transparency A C E T I P S Transparency gives governance its ACE TIPS. A Accountability C Combating corruption E Entitlements: access to them T Trust of the public I Informed citizens P Participation in democracy S Service delivery that works NDSAP 2012 in three steps"}, {"c": "1", "n": "Civil Services, Transparency, Accountability, Citizen’s Charter and RTI", "id": "11-accountability", "t": "11 · Accountability", "x": "11 · Accountability # Handout only · M1 p.24-28 Exam lens Priority: Medium. Mains PYQs quoted: 2016*. Prelims PYQs quoted: none quoted in the material. Prelims hooks Answerability, enforcement, responsiveness Horizontal: CAG, EC, CVC, CIC, ombudsman; vertical: citizens; diagonal: PIL CVC: Feb 1964 on Santhanam; statutory 2003 Lokpal Act 2013 selection committee; Whistle Blowers Protection Act 2014 (no anonymous complaints) CPGRAMS, PRAGATI; Social Audit 2.0 Mains hooks Types of accountability and mechanisms Issues in accountability; new-age challenges Need for transparency and accountability Move from top-down, input-focused control to bottom-up, outcome-focused answerability. In simple words Responsibility is the duty to do assigned work; accountability is answering for it, with both answerability and enforceability (penalty). Six types: managerial (hierarchy), political (to the legislature), judicial, institutional/horizontal (CAG, CBI, CVC), professional (Bar Council, ICAI) and social (RTI, charters, social audits, Lokpal). By direction: horizontal (state bodies check each other), vertical (citizens check the state) and diagonal (citizens use horizontal bodies directly, e.g. PIL). Need arises from bigger government, delegated legislation, the politics-bureaucracy nexus and corruption. Tools range from ministerial control to New Public Management and Social Audit 2.0, CPGRAMS and PRAGATI. New challenges: algorithmic bias, platform governance, PPPs diffusing blame. Solutions: decentralisation, bottom-up accountability and technology with human oversight. Term In plain words Micro-accountability Responsiveness to citizens receiving services (World Bank). Macro-accountability Financial and economic performance (World Bank). Mnemonic · Components of accountability E A R Accountability lends the citizen an EAR. E Enforcement (penalty) A Answerability (give an account) R Responsiveness Types of accountability Accountability is answerability plus enforceability plus responsiveness. It is sliced many ways: intra and inter-organisational; horizontal, vertical, diagonal; financial, process, programme, legal, professional, political, social, moral. New tools and new-age problems (AI, platforms) keep expanding it. Key point Responsibility = obligation to carry out assigned tasks at any level of the hierarchy. Accountability = responsibility operating hierarchically (the \"hierarchical locus of responsibility\"); simply, answerability for one's actions or behaviour. Public service accountability = how an agency or official fulfils duties and how they must account for it
