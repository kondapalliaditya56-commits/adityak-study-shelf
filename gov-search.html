d for both Vineet Narain 1997: apex court struck the Single Directive down DSPE Act amended: made law as Sec 6A 2014: SC struck down Sec 6A: violated equality (special protection to JS and above) PCA amended 2018, Sec 17A: permission needed for preliminary inquiry into all public servants except those caught red-handed Administrative + Political administrative: Procedural complexity breeds middlemen who carry the corrupt money Red tape Weak internal grievance machinery Peer pressure and indoctrination make honest officials afraid to pursue anti-graft action Bureaucratic resistance to reform Politicised management through transfers and plum postings General culture of secrecy political: No political will (repeated attempts to pass the Lokpal Bill, delay in appointing Lokpal) Criminalisation of politics (criminals inside the system protect themselves) System does not encourage neutrality: officials take sides when a dispensation is in power Lack of voter maturity (ousted parties re-elected; TINA : There Is No Alternative) Money power in elections Weak disclosure norms on functioning and funding of parties Measuring Corruption Key point Official statistics: usable, but if prosecution and investigation are ineffective, they give an incomplete picture. Perceptual and attitudinal surveys: especially by international NGOs. Memory aid · CPI CPI by Transparency International · annual since 1995 · 0 = most corrupt, 100 = least corrupt . 2020 CPI (released 2021): New Zealand and Denmark least corrupt; Somalia, South Sudan last; South Asia: Bhutan 24th; USA 25th, Botswana 35th, China 78th, Pakistan 124th (as printed). Value addition CPI critique: based on questionnaires to country experts and business leaders , not the common man · scores rest on perception , not objective assessment · sources change year to year · number of countries surveyed varies, so comparing ranks over years is inappropriate . Way forward / key point Other tools: Experiential surveys: TI's Global Corruption Barometer (actual experience; not annual, regional; in Asia, Japan least corrupt and India most corrupt among 17 countries) · Tracking surveys: World Bank PETS (tracks funds and flows at different levels when donor funds are spent) · content analysis of media (crude but interesting). Memory visuals for this section Sanction chain in four steps"}, {"c": "2", "n": "Corruption, Social Audit, CBI, CVC, Lokpal, Whistleblowers and PCA", "id": "2-tackling-corruption-and-social-audit", "t": "2 · Tackling Corruption and Social Audit", "x": "2 · Tackling Corruption and Social Audit # Handout only · M2 p.8-11 Exam lens Priority: Medium. Mains PYQs quoted: 2021, 2016*. Prelims PYQs quoted: none quoted in the material. Prelims hooks Stick/carrot/admin/radical measures with country examples (Botswana, Singapore CPIB, Hong Kong ICAC, South Africa, Georgia, Peru, Romania) CAG covers only 25% of auditable units yearly; procurement 30% of GDP; 2012 bill lapsed International: FCPA 1977, UK Bribery Act 2010, OECD 1997, UNCAC 2003, FATF 1989 Social audit: Meghalaya 2017 Act; AP SSAAT; Karnataka rotation after 3 cycles; Chhattisgarh wall writing; Swaraj Abhiyan 2016; MKSS jan sunwai Mains hooks Stick vs carrot measures; why fragmented agencies fail Features, significance and issues of social audit; how to strengthen Success stories: AP, Jharkhand, MKSS, Bengaluru CRCs, benchmarking Make demand-side pressure real: audits only work when information flows freely. In simple words The handout calls corruption a wicked problem : more laws signal inefficiency, and it can only be controlled, not removed. Stick measures: prosecution, stings, tighter laws, asset declaration, effective single agency (Singapore CPIB, Hong Kong ICAC). Carrot : pay rise with enforcement, citizen helplines. Administrative : job rotation, auditing, public procurement law, digitisation, CCTV. Radical ideas: disband departments (Georgia's Traffic Police, 2004), gender balance (Peru), monetising bribes (Romania), amnesty. International: FCPA, UK Bribery Act, OECD Convention, UNCAC, FATF. Social audit : scheme details are shared with beneficiaries on public platforms (Jan Sunwai, Gram Sabha) so people hold officials accountable. It needs a sound access-to-information regime. Success stories: Andhra Pradesh SSAAT (MGNREGA), Jharkhand, Rajasthan MKSS (led to RTI Act 2005), Bengaluru Citizen Report Cards. Strengthen with a national law, trained auditors and rotating teams (Karnataka). Term In plain words Social audit Public verification of scheme work and money with the people it is meant for. SSAAT Andhra Pradesh's independent social audit society. Mnemonic · Anti-corruption toolbox S C A R - I Leave a SCAR on corruption, then go International. S Stick: prosecution, stings, asset declaration C Carrot: pay rise with enforcement, helplines A Administrative and technical: rotation, audit, procurement R Radical: disband, gender balance, amnesty I International: FCPA, UK Bribery Act, OECD, UNCAC, FATF Corruption is a wicked problem: it can be controlled, not eliminated. The toolkit spans stick, carrot, administrative, radical and international measures. Social audit is the participatory tool: public hearings that need a sound RTI regime, with AP's SSAAT as the model. Value addition Wicked problem: despite multiple laws (PCA, Lokpal, CVC Act) corruption persists; a proliferation of laws often signals systemic inefficiency . Corruption can only be controlled, not eliminated . Toolkit TACKLING : Stick: prosecute, one agency Carrot: pay, helplines Admin: rotation, audit, e-gov Radical: disband, amnesty International: FCPA, UNCAC Stick Legal system and prosecution: Higher conviction rates deter (e.g. Botswana) In India delayed trials and lenient punishment cut deterrence Harsh penalties like China's are unsuitable because of rule-of-law gaps and risk of victimisation Stings and entrapment: Admissibility of sting evidence is ambiguous Natural stings (citizen recordings) should be admissible Legal clarity needed to avoid misuse, as Sweden's restrictive stance shows Tighten anti-corruption laws: 2018 amendments diluted the PCA Political will lacking to plug loopholes in whistleblower law, CVC Act, Lokpal Act Declaration of assets: monitor disproportionate lifestyle indicators and run rigorous audits Effective agencies: India's fragmented set (CVC, CBI, Lokpal, ED) lacks focus Singapore ( CPIB ) and Hong Kong ( ICAC ) succeed with a single dedicated agency Public shaming and blacklisting: naming corrupt officials (South Africa), blacklisting firms from public contracts: soft deterrents Penalties on financial security: forfeiting pensions and future benefits creates fear of long-term loss Carrot substantial pay increase , if paired with strict enforcement, can improve integrity at entry level citizen-centric helplines: Delhi's anti-corruption hotline lets citizens report bribe demands without fear Replication needs effective whistleblower and witness protection laws Admin/tech job rotation: frequent transfers in sensitive posts break entrenched networks (Kautilya supports) auditing: CAG's limited coverage ( 25% of auditable units a year) hampers oversight More manpower, IT tools, random audits procurement: Internal bid norms and a comprehensive Public Procurement Law Procurement is 30% of GDP and corruption-prone 2012 bill lapsed , revival urgent digitisation: online delivery cuts physical interface, curbing petty corruption CCTV in high-risk zones (police stations, borders, vulnerable departments), high-risk first Radical Departmental disbanding (Georgia): Non-reformable departments (Traffic Police, 2004) disbanded Fresh recruitment under stricter norms Gender balance (Peru): More women in bureaucracy showed less corruption Could be piloted in India Monetising bribes (Romania): Allowing official payments to avoid petty bribes (as in its conscription policy) Controversial on equity grounds General amnesty: To disclose black money (with 50% surrender ) Debated Stricter enforcement essential after it Key point International: US FCPA 1977 and UK Bribery Act 2010 penalise MNCs' offshore corrupt practices · OECD Anti-Bribery Convention 1997 and UNCAC 2003 promote global norms · FATF 1989 fights money laundering · Interpol IGEC sets corruption standards for police · WTO's inaction on corruption as a non-tariff barrier is a missed chance · push for global financial transparency against banking havens. Critique: Western countries ignored corruption until the 1990s; post-globalisation it became a geopolitical tool ; the \"anti-corruption industry\" with vested NGO interests often prioritises data production over ground impact ; cultural imperialism concerns. Alternatives: spiritual education (ethics and meditation in curricula for internal integrity); Integrity Recognition Certificates (officially recognise honest officers to build peer-pressure networks; must be insulated from politicisation). Social Audit PYQ 2021 Value addition Definition: details of how a scheme is implemented and its resources, financial and non-financial , are shared with beneficiaries on a public platform ( Jan Sunwai, public hearing, Gram Sabha ); people can hold the local bureaucracy and Panchayat leaders accountable and judge the real impact. With local people involved, funds, resources, beneficiaries and records are laid bare ; people spot loopholes, which checks corruption, raises transparency, fixes accountability and strengthens democracy. Unless public agencies must fully reveal scheme details, social audit is a lost cause: key = sound access to information. Features multi-perspective: helps beneficiaries and local leaders and civil servants, who can present their side when loopholes are found regular: periodic, so issues are re-evaluated continuously comparative: compares over time and across villages to show weaknesses and good practice strengthens demand side: Builds pressure on local bureaucracy to implement honestly Directly targets demand-side weaknesses, indirectly supply-side ones Significance more people's participation benefits reach the targeted persons social capital: Community-building People come together to bring change identifies human-resource and training needs of civil servants highlights development concerns promotes transparency, checks corruption helps frame better programmes later Issues not part of mainstream policy discourse statutory in very few programmes ( NREGA is one) lack of trained social auditors opposition from vested interests symptom-cause relationship: Fixing only surface symptoms (awareness drives for plague without tackling poor sanitation, congested housing) gives minimal impact A scheme's failure at a remote symptom level should not justify dropping it unless all causal layers are examined Audits must assess multiple cause-effect layers , so trained auditors are essential Strengthening Legal and institutional: Model national social audit law inspired by Meghalaya's 2017 Act for all public service schemes (community ownership, accountability) Independent audit units : autonomous, well-resourced, professionally staffed ( AP SSAAT ) Strengthen CAG oversight and build PRIs' technical and human-resource capacity Stakeholders: Grassroots campaigns for Gram Sabha members Structured auditor training in standards and ethics Partner NGOs and media to amplify findings Recognition for active Gram Sabha participants Standardise and digitise: Online portals with real-time audit reports, scheme spending, PRI records Proactive disclosure of project data Unified audit guidelines and checklists for uniformity and comparability Best practices: Chhattisgarh: link audits with grievance redressal Wall writing for community transparency Karnataka: rotate audit teams after every 3 audit cycles to prevent familiarity and collusion Success story Detail AP MGNREGA (SSAAT) autonomous Society for Social Audit, Accountability and Transparency ; trained village-level resource persons; crores misappropriated in wages recovered; World Bank lauded it as a global best practice in participatory accountability Jharkhand SAU (MGNREGA, PDS, pensions) independent audits exposed ghost beneficiaries, wage delays, PDS ration diversion ; SC in Swaraj Abhiyan (2016) appreciated social audits; built local capacity, empowered Gram Sabhas Rajasthan MKSS jan sunwais in the 1990s revealed massive leakages; movement led to RTI Act 2005 Bengaluru Citizen Report Cards a civil society organisation pioneered CRCs; surveys on water supply, public hospitals, transport; bribery fell, satisfaction rose ; endorsed in a 2003 study; globally recognised Municipal benchmarking local bodies compared service delivery costs (e.g. cost per km of road ); public disclosure built citizen pressure on inefficient bodies, cutting urban corruption In the news (Saarthi IAS CA; verify dates) Low Gram Sabha participation (NIRDPR study): barriers: livelihood and time (55.5%), exclusion of migrants, women, youth, elderly; trust fatigue. Impact: elite capture; social audits become a formality; Niyamgiri 2013 (12 Gram Sabhas rejected mining). Way: Action Taken Reports; off-peak meetings; Kudumbashree; ARC-II statutory powers. Memory visuals for this section Mnemonic · Issues with social audit M O S T MOST schemes still escape social audit. M Mainstream policy discourse ignores it O Opposition from vested interests S Statutory in very few programmes (NREGA) T Trained auditors are lacking"}, {"c": "2", "n": "Corruption, Social Audit, CBI, CVC, Lokpal, Whistleblowers and PCA", "id": "3-cbi-and-cvc", "t": "3 · CBI and CVC", "x": "3 · CBI and CVC # Handout only · M2 p.11-15 Exam lens Priority: Medium. Mains PYQs quoted: 2021*. Prelims PYQs quoted: none quoted in the material. Prelims hooks CBI: SPE 1941; DSPE Act 1946; name 1963; four divisions; conviction rate 67% vs 30-40%; no suo motu jurisdiction Vineet Narain 1997: CVC supervises CBI; Director's min. tenure 2 years; committee (PM, LoP, CJI); single directive struck down; DoPT policy only CVC: 1964 executive; statutory 2003; CVC + max 2 VCs; term 4 years or 65; pay = UPSC Chair/members PJ Thomas 2011: consensus not majority in selection committee CVC Chair heads committee for ED Director and CBI officers SP and above Mains hooks Issues in CBI functioning and Vineet Narain directions CVC powers, issues and suggestions Institutional framework against corruption Autonomy of anti-graft agencies is the weak link: independence of selection, tenure, prosecution and staff. In simple words The CBI began as the Special Police Establishment (1941), got statutory backing from the DSPE Act 1946 and was named CBI in 1963. Issues: political control ('caged parrot'), vacancies, sanction delays, no suo motu jurisdiction. Vineet Narain (1997) : the Supreme Court gave the CVC superintendence of CBI in PCA cases, fixed the Director's tenure, set a selection committee (PM, LoP, CJI) and struck down the Single Directive. The CVC was set up in 1964 on the Santhanam Committee and made statutory in 2003: one Central Vigilance Commissioner and up to two Vigilance Commissioners, 4-year term, retirement at 65, no reappointment. P.J. Thomas (2011) : selection must follow the consensus of the committee, not a majority. Fix list: independent investigation and prosecution powers, statutory sanction timelines, more staff, binding recommendations and a wider selection panel. Term In plain words Single Directive Rule requiring sanction before even a preliminary inquiry against senior officers. Caged parrot A former SC judge's description of the CBI's lack of independence. Remember it as CVC: 1964 Santhanam; Act 2003; term 4 years or 65. CBI and CVC in date order Vineet Narain (1997) and CVC powers The CBI (SPE 1941, DSPE Act 1946, named 1963) is politicised ('caged parrot') despite Vineet Narain (1997). The CVC (Santhanam, 1964; statutory 2003) superintends CBI on PCA cases but depends on it and cannot prosecute. Legal framework BNS Sec 203 (IPC 169): Civil servants illegally acquiring property is an offence BNS Sec 316 (IPC 409): criminal breach of trust by a public servant DSPE Act 1946 sets up CBI for anti-corruption investigation RPA 1951 Sec 123 : corrupt practices in elections PCA 1988 : general anti-corruption law Benami Properties Act 1988 PMLA 2003 : nodal law on money laundering CVC Act RTI 2005 (transparency, accountability) State Lokayuktas Acts Lokpal Act 2013 Whistleblower Act 2014 Time-bound service delivery laws (to tackle speed money) Institutions: CBI, CVC, state anti-corruption bureaus and vigilance wings, CAG , Lokayuktas, Lokpal, ED (principally PMLA and FEMA), Banking Sector Ombudsman, Consumer Courts, the 3-tier judiciary CBI HOW CBI GREW Special Police Establishment, 1941 DSPE Act 1946 : statutory backing Popular name CBI, 1963 CBI division Handles Anti-Corruption corruption cases Special Crimes serious, sensational, organised crimes Economic Offences cheating, Ponzi schemes, counterfeit currency Banking and Security Frauds economic offences in banking and securities markets Issues politicisation: A former SC judge called CBI a \" caged parrot \" Every ruling party at the Centre has used such bodies against political opponents, so it is not impartial or autonomous staff shortage: about one-third of posts vacant conviction rate 67% is high vs 30-40% for other agencies, but low in high-profile cases sanction for prosecution: Long delays in disposal (partly staff shortage) After investigation comes prosecution, but PCA Sec 19 and CrPC Sec 197 give civil servants undue protection and sanction must come from the government (state govt, per handout) Delay in sanction means delay in prosecution no suo motu jurisdiction: CBI handles only cases transferred to it Vineet Narain 1997 Memory aid · SCATTER S ingle Directive struck down · C VC superintends CBI on PCA cases · A ppointment of Director by a committee · T enure minimum 2 years · T ransfer by the same committee · E xecutive (DoPT) sets only the policy framework · R eproach remains: still called a \"caged parrot\". (own mnemonic) Directions in detail CVC supervises CBI: CVC deals largely with anti-corruption cases and civil-service discipline violations The CVC Act gives it general superintendence over CBI in PCA cases Minimum guaranteed tenure for the Director and other key CBI posts Under the DSPE Act, 2 years for the Director An ordinance allows extension up to 5 years , after the 2 years, in tranches of 1 year Director's appointment not left to the govt's sole discretion: Committee of the PM, Leader of Opposition in Lok Sabha (or leader of the largest opposition party if there is no recognised LoP) and the CJI The transfer of the Director also needs the same committee Single Directive struck down DoPT: CBI is under its broad direction and control, but only for the overall policy framework , not day-to-day work or investigations CVC CVC Timeline 1962 Santhanam Committee 1964 executive body 2003 CVC Act: statutory Memory aid · 1+2 · 4 · 65 1 Commissioner + up to 2 Vigilance Commissioners · term 4 years · age 65 · no reappointment. Selection chosen from two categories: Persons who are or were in All India or Central Services , and officers of CPSUs Selecting from both ensures at least one from each committee: PM, Home Minister, Leader of Opposition (or leader of the largest opposition party) The govt effectively has the final say through its two representatives P.J. Thomas case 2011: SC held that the govt's majority made the LoP's membership pointless, so selection must rest on consensus, not majority (the ruling applied to this appointment, not all committee appointments) Terms term: 4 years, retirement age 65 No reappointment to the same post, but a Vigilance Commissioner can be elevated to CVC if total stay stays within 4 years pay and conditions: CVC = UPSC Chairperson VCs = UPSC members Cannot be altered to their disadvantage Paid from the Consolidated Fund of India Barred from appointment as UT administrator, diplomatic assignments or any post made under the President's warrant and seal No office of profit under Centre or states removal: Proven misbehaviour or incapacity through a reference to the Supreme Court Other grounds: insolvency, moral turpitude, private employment, infirmity of body and mind, prejudicial financial interests Functions superintend and give directions to CBI in PCA 1988 corruption cases (as directed in Vineet Narain) inquire or cause inquiry on a Central Government reference, or on complaints against Group A officials, AIS officers and equivalent CPSU officials (Sec 8(2) CVC Act 2003) review progress of DSPE investigations under PCA and of pending applications for sanction of prosecution Advice to Central Govt and organisations on referred matters Superintendence over vigilance administrations of ministries and organisations Civil-court powers in inquiries mandatory consultation before the Centre makes rules on vigilance or disciplinary matters of Union services and AIS members CVC is chair (Vigilance Commissioners members) of the committee recommending the Director of Enforcement (and ED officers at Deputy Director level and above, after consulting the Director) and of the committee recommending CBI officers of SP rank and above except the Director , incl. extension or curtailment of their tenure annual report to the President , who places it before Parliament Value addition Issues: overwhelming dependence on CBI for investigation, and CBI is politicised and government-controlled · no independent prosecution power ; sanction needs government permission, often delayed · cases of non-cooperative attitude of government · poor engagement with civil society, citizens, NGOs in the same field. Way forward / key point Suggestions (handout, with examples): give CVC independent investigative and prosecution powers like Lokpal (2nd ARC Ethics report: functional autonomy for vigilance agencies, less reliance on politicised CBI) · statutory 3-6 month timelines for prosecution sanction (Vineet Narain fixed timelines, but TI India 2023: over 70% pending beyond 6 months) · make CVC advice a binding oversight over vigilance in ministries and PSUs (Sarkaria) · more manpower and technology : dedicated vigilance cadre, digital monitoring (CVC annual report 2023: under 50% of sanctioned staff, over 1500 organisations) · civil society participation , public grievance dashboard (2nd ARC; South Korea's ACRC ) · binding recommendations via amending CVC Act (Punchhi Commission) · transparent selection : add judiciary members or eminent anti-corruption experts (P.J. Thomas 2011). Note Flag: CVC Selection Committee (PM, HM, LoP) differs from Lokpal (PM, Speaker, LoP, CJI, jurist). Memory visuals for this section CBI and CVC compared"}, {"c": "2", "n": "Corruption, Social Audit, CBI, CVC, Lokpal, Whistleblowers and PCA", "id": "4-lokpal-in-india", "t": "4 · Lokpal in India", "x": "4 · Lokpal in India # Handout only · M2 p.15-19 Exam lens Priority: Medium. Mains PYQs quoted: 2013. Prelims PYQs quoted: none quoted in the material. Prelims hooks 9-member body; 50% judicial; 50% affirmative action; age 45+; 5 years or 70; salary CJI/SC judge Selection committee: PM, Speaker, LoP, CJI/nominee, eminent jurist; search committee of 7 PM covered partially (not public order, security, international relations, atomic energy, space; full bench two-thirds) Removal reference signed by 100 MPs; 60 days preliminary inquiry; 7-year limitation Maharashtra first Lokayukta (1971); Odisha 1992, Haryana 1999 abolished Mains hooks Should the PM be covered? 2nd ARC arguments and counter-arguments Issues with Lokpal; functioning since 2019 Lokpal is not a panacea No single body can cure a hydra: Lokpal works only inside a multi-pronged strategy. In simple words The ombudsman idea: Sweden 1809, UK 1967. In India the first Bill was introduced in 1968; the present Lokpal Bill was passed in 2013 (becoming the Lokpal and Lokayuktas Act, 2013); the Lokpal was constituted in 2019 with Justice P.C. Ghose as Chairperson. Maharashtra had the first Lokayukta (1971). State Lokayuktas often became 'paper tigers': recommendatory, misused, and some were abolished (Odisha 1992, Haryana 1999). The Lokpal has nine members including the Chairperson; half judicial, half non-judicial; 50% reserved. Selection committee: PM, Lok Sabha Speaker, Leader of Opposition, CJI or nominee and an eminent jurist. It covers PM (partly), ministers, MPs and Groups A-D, plus bodies funded above Rs 10 lakh. A preliminary inquiry runs within 60 days; a 7-year limit applies to complaints. The PM is covered only partly: no inquiry into decisions on public order, security, international relations, atomic energy and space, and a full-bench two-thirds majority is needed. The record is thin: complaints fell from 1,427 (2019-20) to 110 (2020-21) to 12 till August 2021-22. Term In plain words Ombudsman The office for complaints against public servants; Sweden appointed the first in 1809. Lokayukta The state-level counterpart; Maharashtra had the first (1971). Lokpal at a glance The Ombudsman began in Sweden (1809). India's First ARC proposed a two-tier model; the bill was first introduced in 1968, passed in 2013, and the Lokpal constituted in 2019. States' Lokayuktas show the weaknesses: no standard design, 'paper tigers', abolition by governments. 1809 Sweden ombudsman 1967 UK Parliamentary Commissioner 1968 India's first Lokpal Bill introduced 1971 Maharashtra Lokayukta 2013 Bill passed = Lokpal and Lokayuktas Act 2019 Lokpal constituted: Justice P.C. Ghose Key point Lokpal = ombudsman or watchdog of administration; first came into existence in Sweden, 1809 . UK: designated Parliamentary Commissioner, set up 1967 . USA: ombudsman only in some states (Hawaii, Oregon, Nebraska), not federal. First ARC: two-tier set-up: Lokpal to probe officials of Secretary rank and above at Union and State levels; a Union Lokayukta for officials below Secretary rank at the Union level; State Lokayuktas for similar cases in states. India: first Bill introduced 1968 ; present Bill passed 2013 (became the Act); Lokpal constituted 2019 , Justice P.C. Ghose Chairperson of the nine-member body. Maharashtra first state to appoint a Lokayukta ( 1971 ). State experience flooded with complaints: an apex body's efficiency depends on lower departments handling petty complaints well poor effectiveness: powers inadequate to investigate and prosecute properly Inter-state differences in qualifications, tenure, functions, powers, suo motu powers No separate investigation agency survival at the state government's sweet will: Created and abolished by states Odisha abolished it by ordinance in 1992 Haryana, 1999 paper tigers: mostly recommendatory corruption within Lokayuktas (allegations of extortion) misused to intimidate political opponents Lokpal ACT 2013 PYQ 2013 Memory aid · 9 · 25 · 45 · 5/70 9 members · 25 years' experience · min age 45 · term 5 years or 70 . Composition nine-member body including the Chairperson Chairperson: is or has been a CJI or SC judge , or an eminent person with 25 years' experience in vigilance, anti-corruption, law, finance, administration, management 8 members: half judicial (SC judge or High Court Chief Justice), half non-judicial (eminent person with 25 years' experience in the same fields) 50% affirmative action: opportunity for SC, ST, OBC, minorities, women Conditions Not an MP, MLA or MLC Not a member of any local body minimum age 45 not removed or dismissed from government service no other office of profit , no business activity or profession no affiliation with any political party Appointment Selection committee may appoint a 7-member search committee to shortlist (also with 50% affirmative action) but may go beyond its names Selection committee: PM (Chair), Speaker, LoP in Lok Sabha, CJI or SC judge nominated by him, eminent jurist chosen by those four Appointed under the name and seal of the President on its recommendation Tenure 5 years or age 70 ; no reappointment, except a member elevated to Chairperson within a total of 5 years Note Gap: the Act does not say who replaces the Leader of Opposition if there is no recognised LoP in Lok Sabha. Value addition Pay: Chairperson = CJI; member = SC judge; terms cannot be altered to their disadvantage in office. Disabilities after retirement: like CVC, plus cannot contest any election in India for 5 years . Wings: Inquiry wing (Director of Inquiry), Prosecution wing (Director of Prosecution), Secretary of Lokpal, appointed from a panel recommended by the Government of India. Prime Minister: IN OR OUT? Value addition 2nd ARC opposed covering the PM: it would cripple administration while an investigation runs · foreign powers may exploit it to malign the PM · the PM is already covered by the PCA 1988 . Way forward / key point Arguments for covering the PM: CBI works under DoPT, i.e. the PM's direct control , which would hamper investigation · the PM should lead by example ; some states' Lokayuktas already cover the CM · Art 361 exempts only the President and Governors ; no legal or constitutional exemption for the PM. Jurisdiction AND Powers Covers PM (partially), Union Ministers, MPs, Group A-D officials, and functionaries of boards, corporations, societies, trusts funded by govt (receiving above Rs 10 lakh a year) any individual may complain for offences under the PCA 1988 FLOW OF A Complaint Complaint → Lokpal may order a preliminary inquiry by its Inquiry Wing, CVC or agencies like CBI ; first seeks the public servant's explanation to find a prima facie case; Group C and D complaints go to the CVC ; inquiry ends in 60 days After the inquiry report and a hearing of the public servant , Lokpal can: order full investigation , start departmental proceedings , close the case, or proceed against the complainant if allegations are false Investigating agencies report to Lokpal and the court; a Lokpal Bench (min 3 members) decides on sanction to prosecute, departmental action, or closure Lokpal replaces the appointing/dismissing authority in granting prosecution sanction under CrPC 218 and PCA 19 Key point Powers: search, seizure, asset attachment , Civil Procedure Code powers for inquiries, superintendence over CBI for cases Lokpal refers. Removal: on grounds of misbehaviour, through a reference to the Supreme Court , but only if signed by at least 100 MPs ; on other grounds (insolvency, private employment, infirmity of body or mind, prejudicial financial interest) the President may dismiss on the advice of the Council of Ministers . Also: annual declaration of assets and liabilities by public servants · annual report to the President, tabled in Parliament, with a memorandum explaining why recommendations were rejected · 7-year limitation period for filing complaints. Issues AND WAY Forward Issues jurisdiction too wide very convoluted appointment process PM only partially covered 7-year limitation period is a limit wide scope can lead to intimidation of NGOs delays in appointments Functioning since 2019: Allegations of emasculating the body through legislation Govt delayed rules on the complaint form , asset disclosure , and Lokpal's rules for preliminary inquiry and investigation Prosecution and investigation wings not set up by 2020 Yet by Sept 2019 it had disposed of 1,000 of 1,065 complaints Complaints keep falling: 1,427 (2019-20) → 110 (2020-21) → 12 till August of 2021-22 2nd ARC give constitutional status (now only statutory) to both the Union and State bodies, for independence and respect Rashtriya Lok Ayukta (Union level): Union Ministers, MPs, State Chief Ministers State Lokayukta: State Ministers and state legislatures CVC should handle civil servants Local Bodies Ombudsman for political and administrative officials of local bodies Note Not a panacea: corruption is a hydra-headed monster , needing a multi-pronged strategy · the bureaucracy is huge, so Lokpal cannot handle all complaints · how well govt bodies deal with petty complaints should be examined, since Lokpal gets them too · inadequate judicial process · developed nations have an ombudsman, empowered citizens and willingness to complain; India lacks these. Memory visuals for this section Mnemonic · Lokpal selection committee C O P E S The selection panel COPES with corruption. C CJI or a nominated SC judge O Opposition leader (Lok Sabha) P PM (Chair) E Eminent jurist chosen by the four S Speaker of the Lok Sabha Mnemonic · PM decisions the Lokpal cannot probe P A I S E The Lokpal cannot count the PM's PAISE. P Public order A Atomic energy I Internal security S Space E External security and international relations Should the Prime Minister be covered?"}, {"c": "2", "n": "Corruption, Social Audit, CBI, CVC, Lokpal, Whistleblowers and PCA", "id": "5-whistleblower-protection-and-the-pca-198", "t": "5 · Whistleblower Protection and the PCA 1988", "x": "5 · Whistleblower Protection and the PCA 1988 # Handout only · M2 p.19-20 Exam lens Priority: High. Mains PYQs quoted: 2015, 2022. Prelims PYQs quoted: none quoted in the material. Prelims hooks Competent authority: PM (Union Ministers), CM (state ministers), Presiding Officer (legislators), CVC (civil servants) No anonymous complaints; frivolous complaint penalised with 2-year jail 2015 amendment Bill introduced, then lapsed (never became law): OSA to override the Act SEBI tipping mechanism: reward up to Rs 1 crore PCA 2018: bribe-giving an offence; 7-day complaint defence; jail 3 to 7 years; trial in 2 years, max 4; Sec 17A extends to retired servants Mains hooks Challenges with the Whistleblower Act and measures to strengthen it 2nd ARC and Law Commission framework Why the 2018 PCA amendment is both strengthening and diluting A whistleblower law without anonymity protects the disclosure but not the discloser. In simple words The Whistle Blowers Protection Act 2014 lets anyone disclose corruption or wilful misuse of power by a public body. Disclosures go to the competent authority (PM for Union Ministers, CM for state ministers, Presiding Officer for legislators, CVC for civil servants). Anonymous complaints are not entertained ; frivolous ones can earn 2 years' jail. Challenges: no anonymity (Satyendra Dubey), weak implementation and awareness, little protection from victimisation. Needs: wider coverage including the private sector; SEBI's tipping reward up to Rs 1 crore. The Prevention of Corruption Act 1988 covers every public servant: government staff, PSU employees, local body functionaries, judges, PSC members, university employees, MPs and MLAs. The 2018 Amendment : giving a bribe is an offence (with a 7-day complaint exemption in coercive cases); Sec 17A extends protection to retired servants; jail raised from 3 to 7 years; trial in 2 years (up to 4); commercial organisations can be prosecuted. Term In plain words PIDPI The short name the handout gives for the 2014 Whistle Blowers Protection Act. Sec 17A PCA 2018: permission needed for preliminary inquiry, except when caught red-handed. Remember it as PCA 2018 cuts both ways: it penalises the bribe-giver and shields the officer. Whistleblower protection map The 2014 Act has no anonymity, narrow safeguards and a lapsed 2015 amendment bill that would have let the Official Secrets Act override it. The PCA 1988 covers all public servants; the 2018 amendment criminalised bribe-giving, raised penalties and added Sec 17A. Whistle Blowers Protection ACT 2014 Value addition PIDPI Act 2014 (Public Interest Disclosure and Protection of Individuals making Disclosure): anyone can be a whistleblower about any public body or agency. Disclosure goes to the competent authority . No anonymous complaints. The CVC can issue directions for protection . Frivolous complaints: 2 years' jail. A 2015 amendment bill (introduced, later lapsed) proposed that the Official Secrets Act 1923 should override the Whistleblowers Act. (Handout also describes it as a mechanism to receive complaints on corruption or wilful misuse of power or discretion, with inquiry and safeguards against victimisation.) Complaint about Goes to Union ministers Prime Minister State ministers Chief Minister Legislators Presiding Officer Civil servants CVC Challenges lack of anonymity: The Act mandates disclosing the whistleblower's identity , exposing them to retaliation The murder of Satyendra Dubey , who reported corruption in the NHAI , shows the danger and discourages whistleblowers weak organisational implementation: no clear guidelines or awareness, so employees hesitate to use official channels inadequate legal safeguards: limited protection against victimisation, career setbacks, harassment, even physical harm rising complaints show latent potential: in 2018 , NSE-listed companies got over 3,500 complaints Memory aid · SAFE Law Commission + 2nd ARC: S trong law protecting genuine whistleblowers in public and private sectors (extend to corporate whistleblowers exposing fraud or serious harm to public interest) · A nonymity and confidentiality · F ear removed: legal protection against victimisation, administrative safeguards against harassment and bodily harm · E ncouragement: SEBI's tipping mechanism pays up to Rs 1 crore for actionable information on insider trading and assures cooperation and confidentiality. (own mnemonic) Prevention OF Corruption ACT 1988 PYQ 2015PYQ 2022 \"Public servant\" Anyone in the pay or service of govt PSU employees Local body functionaries Judges Office bearers of govt-funded cooperatives Members of the Public Service Commission Employees of central and state universities Deemed universities via an Apex Court decision of 2020 anyone holding an office that requires a public duty , which includes MPs and MLAs PCA Amendment 2018 Memory aid · BRIBE B ribe-giving an offence · R eport within 7 days (coercive) · I ncludes retired servants (17A) · B usiness activities covered · E xpedited trial: 2 years, up to 4 · jail term raised from 3 to 7 years . (own mnemonic) Change Detail Giving a bribe categorically an offence ; in coercive corruption , a person who complains within 7 days of the offence is not considered guilty Sec 17A extended to retired civil servants: sanction of the appropriate authority is needed to act against them too Sec 13(1)(d) originally a public servant could be prosecuted for a decision that benefits a commercial organisation and violates public interest; this was diluted Jail; trial jail time increased from 3 years to 7 years (handout wording); trial to finish in 2 years, up to a maximum of 4 Commercial activity; property provisions for prosecution of commercial activities and for attachment or confiscation of property PYQs Printed IN THE Handout (module 2 END) Year Question (gist) 2024 · 15m Citizens' Charter: landmark but short of potential; hindering factors and remedies (Ch 12) 2024 · 15m Public Examination (Prevention of Unfair Means) Act 2024: aims and objects; are University/State Board exams covered? 2022 · 10m DBT scheme: progressive step but with limitations 2022 · 10m Whistleblower at risk of danger and victimisation: policy measures to strengthen protection 2021 · 15m States withholding consent to CBI is not absolute: federal character 2021 · 10m Independent, empowered social audit in every sphere of public service, incl. judiciary 2020 · 10m RTI amendments: impact on autonomy of Information Commission (Ch 13) 2019 · 10m \"Non-performance of duty by a public servant is a form of corruption\": agree? (150 words) 2018 · 15m Citizens' Charter: limitations and measures 2016 · 12.5m Effectiveness of government and people's participation are inter-dependent (India) 2016 · 12.5m India low in TI integrity index: legal, political, economic, social, cultural causes of decline in public morality 2015 · 12.5m If the Whistleblowers Act amendment bill is passed, there may be no one left to protect: evaluate 2015 · 12.5m Satyam scandal (2009): changes in corporate governance for transparency and accountability 2014 · 10m Poverty leads to corruption, yet the affluent corrupt too: basic causes, with examples 2013 · 10m Charters formulated but no improvement in satisfaction: analyse (10m); \"A national Lokpal, however strong, cannot resolve immorality in public affairs\": discuss (10m) Memory visuals for this section Where a whistleblower complaint goes PCA 2018: both sides of a bribe"}, {"c": "2", "n": "Corruption, Social Audit, CBI, CVC, Lokpal, Whistleblowers and PCA", "id": "chapter-timeline", "t": "Timeline", "x": "Timeline # 1941 Special Police Establishment set up (M2 p.12) 1946 DSPE Act gives CBI statutory backing (M2 p.12) 1962 K. Santhanam Committee on Prevention of Corruption (M2 p.13) 1963 SPE gets the name CBI (M2 p.12) 1967 UK Parliamentary Commissioner (ombudsman) (M2 p.15) 1968 First Lokpal bill introduced in India (M2 p.15) 1971 Maharashtra: first state Lokayukta (M2 p.15) 1977 US Foreign Corrupt Practices Act (M2 p.9) 1988 Prevention of Corruption Act; Benami Properties Act (M2 p.11) 1989 FATF formed (M2 p.9) 1992 Odisha abolishes its Lokayukta by ordinance (M2 p.16) 1997 Vineet Narain judgment; Tamil Nadu first state RTI law; Shourie working group; OECD Anti-Bribery Convention; judges' assets resolution (M2 p.12; M1 p.32-33) 1999 Haryana abolishes its Lokayukta (M2 p.16) 2010 UK Bribery Act; CIC holds DIAL a public authority (Delhi HC stays) (M2 p.9; M1 p.33) 2011 P.J. Thomas case: CVC selection must be by consensus (M2 p.13) 2017 Meghalaya Social Audit Act; NITI Aayog Three-Year Action Agenda 2017-20 (M2 p.10; M1 p.6) 2018 PCA Amendment (Sec 17A, bribe-giving an offence); 10 lateral entry JS posts; CIC affirms BCCI a public authority (M2 p.6, 20; M1 p.6, 33)"}, {"c": "2", "n": "Corruption, Social Audit, CBI, CVC, Lokpal, Whistleblowers and PCA", "id": "side-by-side", "t": "Side by side", "x": "Side by side # Who selects whom (M1 p.26, 36; M2 p.12-14, 16) Post Selection committee Note Lokpal Chair and members PM (Chair inary inquiry for all public servants, except if caught red-handed (extends to retired servants) Meanwhile: PCA Sec 19 and CrPC Sec 197 still need sanction to prosecute; Lokpal replaces the sanctioning authority in its cases A complaint before the Lokpal (Section 18) Any individual files a complaint for a PCA 1988 offence Lokpal orders a preliminary inquiry (Inquiry Wing, CVC or CBI) and seeks the public servant's explanation Complaints against Group C and D officials go to the CVC Preliminary inquiry finishes within 60 days Lokpal bench (min 3) hears the public servant, then: full investigation, departmental proceedings, close the case, or act against a false complainant If PM is the accused: full bench, two-thirds majority; not public order, security, international relations, atomic energy, space Prosecution wing and court; time limit for the complaint: 7 years"}, {"c": "2", "n": "Corruption, Social Audit, CBI, CVC, Lokpal, Whistleblowers and PCA", "id": "traps", "t": "Traps", "x": "Traps # Common mix-ups and the rule for the exam hall Trap What goes wrong, and the rule Measuring corruption CPI: 0 most corrupt, 100 least; perception-based; since 1995; ranks not comparable across years. Global Corruption Barometer is experiential and regional; PETS is a World Bank tracking survey. Rule: perception (CPI), experience (GCB), tracking (PETS). Three terms, three ages CIC: 3 years or 65 (2019 Rules). CVC: 4 years or 65. Lokpal: 5 years or 70. Rule: Lokpal is the longest; CIC changed in 2019. Who sits on which committee Lokpal has the Speaker and an eminent jurist; CVC has the Home Minister; CBI Director's committee has the CJI; CIC has a Union Cabinet Minister (2nd ARC wants the CJI). Rule: PM and Leader of Opposition are in all; learn the third and fourth members. Removal routes Lokpal removal reference to the SC needs signatures of at least 100 MPs. CIC/CVC go to the SC on the President's reference. Rule: '100 MPs' belongs only to Lokpal. When was the Lokpal created? First Lokpal Bill introduced 1968. The present Lokpal Bill was passed in 2013 and so became the Lokpal and Lokayuktas Act, 2013. The Lokpal (the body) was constituted only in 2019 under Justice P.C. Ghose. Rule: Bill introduced 1968; Bill passed 2013 = Act; Lokpal constituted 2019. Lokpal's reach over Groups C and D Module 2 lists Group A-D in Lokpal's jurisdiction but sends Group C and D complaints to the CVC. Rule: Lokpal covers them on paper; the CVC handles those complaints. Whistleblower and anonymity No anonymous complaints under the 2014 Act; frivolous complaint: 2-year jail; competent authority depends on who is accused. Rule: no anonymity is the first answer to 'what is wrong with the Act'. PCA 2018 cuts both ways Bribe-giving an offence (7-day complaint defence for coercion), jail 3 to 7 years, trial 2 years (max 4), Sec 17A covers retired servants; yet Sec 13(1)(d) was diluted and Sec 17A needs permission for inquiry. Rule: strengthened punishment, weakened investigation."}, {"c": "2", "n": "Corruption, Social Audit, CBI, CVC, Lokpal, Whistleblowers and PCA", "id": "connects", "t": "Connects to", "x": "Connects to # §15 The Problem of Corruption → §17 CBI and CVC The Sec 6A chain (Single Directive, Vineet Narain, 2014, Sec 17A) is the legal factor in corruption and the heart of the CBI case. §15 The Problem of Corruption → §18 Lokpal in India Absence of political will is shown in repeated Lokpal delays. §16 Tackling Corruption and Social Audit → §11 Accountability Social audit is bottom-up accountability, the counterpart of top-down control. §17 CBI and CVC → §18 Lokpal in India Lokpal supervises CBI for referred cases and replaces the sanction authority under Sec 218 and Sec 19; Groups C and D go to the CVC. §18 Lokpal in India → §11 Accountability The Lokpal Selection Committee is the same list as in the Accountability section. §19 Whistleblower Protection and the PCA 1988 → §17 CBI and CVC CVC is the competent authority for civil servants' disclosures and can direct whistleblower protection."}, {"c": "2", "n": "Corruption, Social Audit, CBI, CVC, Lokpal, Whistleblowers and PCA", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. TI's definition and test 'Private abuse of public office'; the Elephant Test. CPI scale and start 0 most corrupt, 100 least; annual since 1995. Sec 6A chain Single Directive -> struck 1997 (Vineet Narain) -> Sec 6A DSPE -> struck 2014 -> Sec 17A PCA 2018. Georgia, Singapore, Hong Kong examples Georgia disbanded Traffic Police (2004); Singapore CPIB and Hong Kong ICAC as single agencies. Karnataka's social audit feature Audit teams rotated after every three cycles. CBI: origin and name SPE 1941; DSPE Act 1946; named CBI 1963; no suo motu jurisdiction. CVC term, age and members 4 years, retirement at 65; CVC plus not more than two Vigilance Commissioners. P.J. Thomas case (2011) CVC selection must be by consensus of the committee, not majority. Lokpal composition Nine members: Chair + 8; half judicial; 50% affirmative action; minimum age 45. Lokpal limits Preliminary inquiry in 60 days; complaint within 7 years; Groups C and D to CVC. Whistleblower Act competent authorities PM (Union Ministers), CM (State ministers), Presiding Officer (legislators), CVC (civil servants). PCA 2018 headline changes Bribe-giving offence (7-day defence if coerced); jail 3 to 7 years; trial in 2 (max 4) years; Sec 17A. SEBI tipping mechanism Rewards up to Rs 1 crore for actionable insider-trading information, with confidentiality."}, {"c": "2", "n": "Corruption, Social Audit, CBI, CVC, Lokpal, Whistleblowers and PCA", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts in Start Here)"}, {"c": "2", "n": "Corruption, Social Audit, CBI, CVC, Lokpal, Whistleblowers and PCA", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards Mains answer skeletons One for each Mains PYQ quoted in the material that the notes can support, then practice questions. Tap to open; try the answer first. 2022 · 10 marks · Whistle blower, who reports corruption and illegal activities, wrongdoing and misconduct to the concerned auth… Question. Whistle blower, who reports corruption and illegal activities, wrongdoing and misconduct to the concerned authorities, runs the risk of being exposed to grave danger, physical harm and victimization by the vested interests, accused persons and his team. What policy measures would you suggest to strengthen protection mechanism to safeguard the whistle blower? The 2014 Act mandates disclosure of identity and offers limited protection; Satyendra Dubey's murder shows the risk. Confidentiality and anonymity (Law Commission framework) Legal protection against victimisation and administrative safeguards against harassment and bodily harm Extend coverage to corporate whistleblowers; 2nd ARC: stronger law for public and private sectors Organisational guidelines and awareness; SEBI-style rewards up to Rs 1 crore; CVC power to direct protection Close. Protect the person, not just the disclosure. 2021 · 15 marks · The jurisdiction of the Central Bureau of Investigation (CBI) regarding lodging an FIR and conducting a probe … Question. The jurisdiction of the Central Bureau of Investigation (CBI) regarding lodging an FIR and conducting a probe within a particular State is being questioned by various States. However, the power of the States to withhold consent to the CBI is not absolute. Explain with special reference to the federal character of India. CBI draws its powers from the DSPE Act 1946 and has no suo motu jurisdiction; it handles cases transferred to it. Vineet Narain 1997: CVC superintends CBI on PCA cases; DoPT sets only policy Issues: politicised 'caged parrot', one-third vacancies Federal angle: not in the modules, so add it separately Close. State consent protects federalism but cannot be used to block corruption probes. (Partial fit: no content on state consent or federal case law.) 2021 · 10 marks · An independent and empowered social audit mechanism is an absolute must in every sphere of public service, inc… Question. An independent and empowered social audit mechanism is an absolute must in every sphere of public service, including the judiciary, to ensure performance, accountability and ethical conduct. Elaborate. Social audit shares scheme details with beneficiaries at public hearings so the people can find loopholes. Independence: AP's SSAAT, Karnataka's rotation of audit teams after three cycles, Meghalaya 2017 Act as model Empowerment: statutory in very few programmes (NREGA); needs trained auditors, Gram Sabha awareness, digital portals Results: crores recovered in AP; Jharkhand SAU exposed ghost beneficiaries; SC in Swaraj Abhiyan (2016) Judiciary: RTI coverage held in 2019, but the notes give no audit model for it Close. Audit works when information is open and the auditor is independent of the audited. 2019 · 10 (150 words) marks · \"Non-performance of duty by a public servant is a form of corruption\" Do you agree with this view? Justify you… Question. \"Non-performance of duty by a public servant is a form of corruption\" Do you agree with this view? Justify your answer. Agree, in the wider sense: corruption includes any behaviour that harms public interest. Handout list: lethargy, dereliction or negligence of duty, repeated carelessness, non-punctuality, favouritism and nepotism TI's definition ('private abuse of public office') and the Elephant Test: society recognises it Non-performance harms citizens like speed money does (white corruption tolerated) Caveat: stretching the definition too wide dilutes focus Close. A public servant who does not perform abuses the office for a private ease. 2016 · 12.5 marks · In the integrity index of Transparency International, India stands very low. Discuss briefly the legal, politi… Question. In the integrity index of Transparency International, India stands very low. Discuss briefly the legal, political, economic, social and cultural factors that have caused the decline of public morality in India. TI's index is perception-based, but the handout's factor list explains a low rating. Legal: Art 311 protection, Sec 19 PCA and Sec 197 CrPC sanctions, delayed prosecution, no effective whistleblower law, weak autonomy of CBI and CVC Political: no will on Lokpal, criminalisation of politics, money power, weak party-funding disclosure, TINA Economic: licence-permit-quota to clearance raj, consumerism, poor pay, MNC willingness to bribe Social: shaming of government staff, no popular sanction, social evils like dowry, thymos (low self-worth) Cultural: long history of corruption, tolerance, culture-specific norms Close. Public morality will recover only when opportunity, impunity and tolerance fall together. 2015 · 12.5 marks · If amendment bill to the Whistleblowers Act, 2011 tabled in the Parliament is passed, there may be no one left… Question. If amendment bill to the Whistleblowers Act, 2011 tabled in the Parliament is passed, there may be no one left to protect. Critically evaluate. The 2015 amendment bill proposed that the Official Secrets Act 1923 would override the Act; it lapsed. Protection already weak: no anonymity (Satyendra Dubey murder), limited safeguards against victimisation Competent authority route: PM, CM, Presiding Officer, CVC Frivolous complaints face 2-year jail Fixes: Law Commission framework (confidentiality, anonymity, protection from bodily harm, corporate whistleblowers); SEBI tipping up to Rs 1 crore Close. A whistleblower law that yields to the Official Secrets Act protects secrecy, not the whistleblower. 2014 · 10 marks · It is often said that poverty leads to corruption. However, there is no dearth of instances where affluent and… Question. It is often said that poverty leads to corruption. However, there is no dearth of instances where affluent and powerful people indulge in corruption in a big way. What are the basic causes of corruption among people? Support your answer with examples. Poor pay is blamed, but the handout says raising salaries alone may not dent corruption. Psycho-social: thymos (low self-worth), consumerism, Squirrel Nuts Syndrome, opportunity theory Policy (grand) corruption: crony capitalism and state capture by business houses; MNCs able and willing to bribe Systemic: clearance raj, red tape, middlemen, weak sanctions (Art 311, Sec 19) Examples in the handout: Mundhra scandal, pork-barreling, German car insurance case Close. Opportunity and impunity, not poverty, are the common thread. 2013 · 10 marks · 'A national Lokpal, however strong it may be, cannot resolve the problems of immorality in public affairs'. Di… Question. 'A national Lokpal, however strong it may be, cannot resolve the problems of immorality in public affairs'. Discuss. The handout calls Lokpal 'not a panacea': corruption is a hydra-headed monster. Needs a multi-pronged strategy; huge bureaucracy; petty complaints need departmental handling Judicial process inadequate; no citizen empowerment or willingness to complain Causes of immorality are psycho-social, economic, legal, administrative and political (Sec 15) What Lokpal adds: inquiry and prosecution wings, search, seizure, attachment, sanction replaced Close. Institutions police conduct; immorality is cured by opportunity reduction, transparency and ethics. Practice · Should the Prime Minister be brought under the Lokpal? Examine in light of the Lokpal Act 2013. The Act covers the PM partially. 2nd ARC against: cripples administration, foreign exploitation, PCA already applies For: CBI works under DoPT; lead by example; Art 361 exempts only President and Governors Act: no inquiry on public order, security, international relations, atomic energy, space; full-bench two-thirds majority Close. Partial coverage balances accountability against continuity, but leaves the main objection unanswered. Practice · How can the success of Andhra Pradesh's social audit model be scaled up nationally? AP's SSAAT is an autonomous society that trained village resource persons. Result: crores of wage misappropriation recovered; World Bank global best practice Scale: national law on Meghalaya 2017 lines; independent audit units; PRI capacity Add: trained auditors, rotation of audit teams (Karnataka), wall writing and grievance link (Chhattisgarh), digital portals Close. Independence of auditors and access to information decide whether audits scale."}, {"c": "3", "n": "Governance, E-Governance, Data Protection and Emerging Technology", "id": "1-governance-good-governance", "t": "1 · Governance & GOOD Governance", "x": "1 · Governance & GOOD Governance # Handout only · GEG pp. 3-6 Exam lens Priority: Low. Mains PYQs quoted: none quoted in the handout (2016 PYQ on effectiveness and participation sits with Ch 11). Prelims PYQs quoted: none quoted in the material. In simple words Governance = delivery of goods and services by state, market and civil society together. Good governance adds a purpose: fair, accountable, inclusive, sustainable. Know the three models and the frameworks (UNDP, DARPG, 4Es, WGI, GGI). Key point Governance = comprehensive delivery of goods and services. It has an inverse relationship with research : the more research on it, the more ambiguous it gets; so our understanding of governance and good governance has become more confused instead of more refined . Researchers agree on three basic meanings/models . Three Models OF Governance 3 MODELS : Triangulation: state, market, civil society World Bank: market first (1989) Good governance: growth with human development Triangulation (network / third-party governance) governance as a process is untied from the apron strings of government and placed in the middle of society : market and civil society also contribute, not only the State State = 1st party, market = 2nd, civil society = 3rd not in isolation but in combinations: State + market, market + civil society, or all three E.g. State makes policy, market implements, credible NGO evaluates, feedback improves policy World Bank model Based on market ascendancy First elaborated in a World Bank paper on Sub-Saharan Africa, 1989 premise: Market plays the dominant role, government a facilitatory or peripheral one, civil society is marginalised Market is the key entity around which world societies should be organised good governance = exercise of political power to manage a country's resources efficiently features: Accountability to market (predictable policy, lower deficit) Transparency for business (ease of doing business) Empowerment by e-gov and m-gov, not rights Participation as producer and consumer, not citizen Value addition Critique: such a perspective would substitute politics with management : \"a democracy without politics and citizenship without rights\" = a kind of soft authoritarianism . State vs Market Market problems consumers vs citizens: Market responds to those able to pay (user-pays principle) Government always responds to citizens Market avoids loss-making ventures Government sees them as part of socio-economic justice (train to a remote area, bank branches in remote areas) market failure: 2008 financial crisis caused by unregulated markets, esp. financial institutions crony capitalism: business houses bribe their way into favourable policy and distort the level playing field environment: profit-oriented, degrades if not regulated not all State activity can be outsourced: external affairs, defence management, law and order Strong market needs strong state manage public order manage social conflict level playing field sanctity of contract Note Decentring the State and replacing it with the market: the real issue is replacing the \"bourgeoisie-feudal-bureaucratic\" state with a genuine democratic state . GOOD Governance Model Key point Good governance model = an environment that enables all to live fulfilling, healthy, innovative and productive lives , i.e. democratic growth with human development. Memory aid · SMART Teacher's: S imple · M oral · A ccountable · R esponsive · T ransparent government. Value addition Features: social justice · rule of law with equitable access to justice · SMART government · space for community organisations · empowered local bodies · sustainable development · socially responsible market economy · popular participation. UNDP characteristic (8) Meaning Indian example Participation citizens take part in decision-making and monitoring MyGov, Gram Sabha, social audits Consensus orientation different interests reconciled for collective welfare Inter-State Council, NITI Aayog Governing Council Rule of law fair, impartial enforcement of laws IBC 2016; Fugitive Economic Offenders Act 2018 Transparency open decision-making, access to information RTI Act 2005; Sec 4 proactive disclosure Responsiveness institutions respond to public needs within reasonable time PRAGATI, CPGRAMS Accountability decision-makers answer for their actions CAG audits, Lokpal, social audits Effectiveness and efficiency optimal use of resources and time DBT, ONDC Equity and inclusiveness opportunities and benefits reach marginalised groups Nari Shakti Vandan Adhiniyam 2023; Aspirational Districts Memory aid · PCR TARE UNDP eight: P articipation · C onsensus · R ule of law · T ransparency · A ccountability · R esponsiveness · E ffectiveness-efficiency · E quity-inclusiveness. (own mnemonic) Key point DARPG (Dept of Administrative Reforms and Public Grievances) categorises Indian governance into five working dimensions : a basis for understanding governance performance. DARPG dimension (5) Focus and example Political public participation, conduct of political actors, citizen trust; devolution under 73rd and 74th Amendments Legal and Judicial rule of law, access to justice, human rights; fast-track courts, e-Courts Mission Mode Project Administrative efficient, transparent service delivery; RTI Act 2005, e-governance Economic macroeconomic stability, regulation, ease of doing business; IBC 2016 Social and Environmental welfare of vulnerable groups, sustainability; POSHAN, Ecologically Sensitive Zones Memory aid · PLAES DARPG five: P olitical · L egal-judicial · A dministrative · E conomic · S ocial-environmental. (own mnemonic) Way forward / key point 4Es (teacher's): Ethics (honesty, integrity) · Efficiency (results, least waste) · Equity (fair opportunities) · Ethos (public-service values, citizen-centric). Constitutional Vision No phrase \"good governance\", but the base is there Preamble: justice, liberty, equality, fraternity as guiding values of governance DPSP: Arts 38, 39, 41, 47 promote social welfare, reduction of inequalities, better living standards FRs: Arts 14, 19, 21 protect equality, freedom of expression, life and personal liberty Art 50: separation of judiciary from executive strengthens judicial independence Parts IX and IXA: constitutional status to Panchayats and Municipalities: democratic decentralisation Key point Judicial contributions: Vineet Narain v UoI 1997 (strengthened institutional accountability and independence of investigative agencies) · Anjali Bhardwaj v UoI 2019 (timely appointments to Information Commissions, to protect effective functioning of the RTI framework). Indices OF Governance Index By Handout position WGI World Bank six governance dimensions across countries; India relatively better in Government Effectiveness than Voice and Accountability CPI Transparency International perceived public-sector corruption; 96th of 180 (2024), score 38 GGI DARPG State and UT performance across 10 sectors, 58 indicators; GGI 2020-21 (Group A) led by Gujarat, Maharashtra, Goa SDG India Index NITI Aayog State/UT performance on SDGs; 2023-24: Kerala and Uttarakhand joint top Value addition WGI six: Voice and Accountability · Political Stability and Absence of Violence · Government Effectiveness · Regulatory Quality · Rule of Law · Control of Corruption. GGI: launched by DARPG on 25 Dec 2019 . Objective: assess governance across States and UTs and promote competitive improvement; 10 sectors , measurable indicators; encourages evidence-based policymaking, administrative reforms, transparency, outcome-oriented governance. Note Check: the CPI rank \"96th\" was split across a line break in the handout (reads \"9 … 6th\"). I read it as 96th; please confirm."}, {"c": "3", "n": "Governance, E-Governance, Data Protection and Emerging Technology", "id": "2-people-s-participation-local-self-govern", "t": "2 · People's Participation & Local Self-government", "x": "2 · People's Participation & Local Self-government # Handout only · GEG pp. 7-9 Exam lens Priority: Low. Mains PYQs quoted: none quoted in the handout. Prelims PYQs quoted: none quoted in the material. In simple words Participation goes beyond voting: people shape and watch the work. It needs social capital, equality and strong local bodies, and it is blocked by caste, class, gender and powerlessness. Value addition Participation goes beyond voting. A person feels liberated when his issues truly get addressed by the authorities responsible: he then truly participates (e.g. Mohalla committees ), and people's participation becomes the mainstream paradigm of governance, \"almost a re-birth of society\". The right to participate should be a fundamental right , especially in aspects of governance affecting citizens' daily lives. Benefits More information Check fit with ground reality Less policy failure Social acceptance and ownership Sustainable projects two-way learning : Government learns from people, people learn technical aspects from government With time government's responsibility for the project falls and people's involvement rises Capacity building Vigilance, less pilferage and corruption Community feeling, social capital Volunteer resources Pre-requisites a basic, rudimentary level of social capital before participation can even start equality of wealth and power widens the social base of participation institutional environment: local self-government procedural reforms to involve people Barriers caste: upper castes dominate class: landed control gender: male-dominated Gram Sabhas powerlessness: people must be prepared to participate, not just asked low capacity: basic education, awareness of rights and legal framework political: lack of decentralisation Memory aid · CCG LPC Barriers: C aste · C lass · G ender · L ack of motivation · P olitical constraints · C apacity gap. (own mnemonic) Urban Local Bodies Key point 74th Amendment ULBs: critical to democratic decentralisation, but constrained by inadequate devolution of 3Fs: functions, finances, functionaries . Municipal own revenue below 1% of GDP (RBI 2024) vs South Africa ~6%. State dependence: States retain control over municipal finances and functionaries, diluting autonomy. Capacity deficit: administrative, technological and human-resource. Reforms Empower State Finance Commissions: constitutional mandate for timely reports, transparent devolution formula, monitoring (2nd ARC, 13th FC) Functional autonomy: Model Municipal Law for urban planning, water supply, sanitation, public health E-municipality GIS revenue mapping (BBMP Bengaluru) fiscal powers: municipal bonds, user fees, property-tax reform (geo-spatial mapping in Pune, Hyderabad raised tax base by 40%) institutionalise Ward Committees and Area Sabhas as mandated under 74th Amendment for participatory planning integrated urban data platforms Best practice Detail Ahmedabad Municipal Corporation pioneered India's first municipal bonds, 1998 : model for infrastructure financing Pune Smart Governance GIS-enabled property tax: 35% increase in revenue Delhi Mohalla Sabhas pilot ward participatory budgeting; needs scale and legal backing GRAM Sabhas Value addition 73rd Amendment: Gram Sabhas are the foundation of grassroots democracy but under-used: poor attendance ( often below 15% in many states, MoPR survey 2023), bureaucratic dominance , resolutions seen as recommendatory, not binding (no statutory enforcement); PRIs lack training in participatory planning, budgeting and social auditing. Way forward statutory backing to Gram Sabha resolutions, esp. in planning and social audits of schemes like MGNREGA e-GramSwaraj to track attendance, decisions and follow-up reserved discussion slots for women, SC/ST, SHG members in every meeting (Kerala People's Plan Campaign) mandate Gram Sabha-led social audits: downward accountability Panchayat Resource Centres to train PRI functionaries on participatory tools Practice / report Detail Jharkhand Social Audit Unit institutionalised Gram Sabha-led MGNREGA audits; exposed over Rs 18 crore irregularities Kerala People's Plan Campaign Gram Sabhas formulated local development plans (rural development index recognition) Chhattisgarh Jan-Choupal Gram Sabha-level grievance redressal and planning forums; better local responsiveness 13th Finance Commission performance-linked grants for PRIs, linking funds to Gram Sabha functionality Bhuria Committee 1995 recommended Gram Sabha's pivotal role in tribal self-governance MoPR 2024 flagged irregular Gram Sabha functioning in 60% of surveyed villages Minimum Government, Maximum Governance Note Not essentially less bureaucracy but a better bureaucracy. Components: do away with crippling regulations · reduce bureaucrats' discretionary powers · goals over rules · effective facilitation of business and civil society organisations · effective accountability mechanism. Steps: self-certification in place of gazetted-officer certification · drive to identify obsolete rules · labour-law amendments to reduce inspector raj, benchmarking best practices for industrial clearances · single window (ends inter-departmental wrangling) · introduction of e-governance. In the news (Saarthi IAS CA; verify dates) Low Gram Sabha participation (NIRDPR study) is covered in Chapter 16: barriers, elite capture and ARC-II suggestions."}, {"c": "3", "n": "Governance, E-Governance, Data Protection and Emerging Technology", "id": "3-e-governance", "t": "3 · E-governance", "x": "3 · E-governance # Handout only · GEG pp. 9-14 Exam lens Priority: High. Mains PYQs quoted: Mains 2025 · 2024 · 2023 · 2021 · 2020* · 2019 · 2018 · 2013. Prelims PYQs quoted: none quoted in the material. In simple words E-government digitises the government's own work. E-governance uses ICT to deliver services through state, market and civil society together. Learn stages, four models, ten benefits, and the issues (divide, trust, no re-engineering). E-Government E-Governance a more efficient form of government made possible by increasing, extensive use of ICT to manage its own internal processes based on the triangulation model (state-market-civil society): comprehensive delivery of public goods and services exploiting the synergies between the three, with ICT as the platform FIVE STAGES (in order) One-way information (website) Two-way communication (queries) Services and payments (bills, returns, GST) Integration (same server, LAN/WAN) Participation (e.g. mygov.in) Stages in detail 1 Simple information dissemination: Website reaches people about programmes One-way data transfer Most basic form 2 Two-way communication: Demand-driven data transfer Extra pages of information A user unable to find information can put a query on the site 3 Services and financial transactions: things people did physically (services, transactions with governmental and non-governmental entities) become digital: bill payment, filing returns, GST or income tax payment 4 Integration: Same server or database connects every employee vertically and horizontally in a department Extended to other departments, ministries and national-state-local governments by LAN and WAN 5 Popular participation: sites designed for flow from people to government too: opinions on proposed legislation or policy (mygov.in) FOUR Models PYQ 2024 Model Idea Broadcasting without internet, information was limited; e-governance gives an exponential rise in flow of information; earlier less access meant less informed decisions, now more informed and empowered citizens Critical Information Flow critical information needed for a person's growth; farmer needs weather forecast, pesticide use, prevailing price of his produce; earlier cost money, time and energy, now one click, no travel to mandi E-Mobilisation enforces democratic rights by mobilising people virtually : physical space for assembling is limited; protest in the virtual world and pressure government; democracy-enhancing, citizen-to-citizen engagement Interactive Service improves pace and quality of services: earlier visit offices and queue for utility bills, now at the push of a button; private sector e-commerce (Amazon, Flipkart); improves B2C, B2B, G2B interactions Memory aid · BCEI Four models in handout order: B roadcasting · C ritical information flow · E -mobilisation · I nteractive service. (own mnemonic) BENEFITS (ten) Benefits 1 Administration (overcomes historic disabilities): E-files cut delay (seconds/minutes between departments) Team work (copy sent to all, immediate comments) Central storage with multiple backups (Adarsh Society scam: documents destroyed) Less paperwork, carbon footprint (fewer trees cut), manpower and space So better intended finance 2 Sound data management for planning and decisions: Manual processing limited, computer analytics better Vikas Darpan (Rajasthan GIS-based decision support) CPGRAMS: aggregated complaints show which departments or procedures need amendment 3 Service delivery: E-FIR (Delhi) Rural: land records, agriculture information (seeds, pests, weather, crop disease, prices) Utility bills Policing (lost and found, e-FIR) Licences, passport, ration card Where is My Train, RailYatri E-filing of returns Single-window ME-SEVA (Andhra), FRIENDS (Kerala: Fast, Reliable, Instant, Effective Network for Disbursement of Services) 4 Lower transaction cost and end-to-end time: simultaneous processing, no department-by-department trail 5 Process re-engineering: NIC support Digitisation delayed by complex procedures Rules must be simplified before digitising Status checkable even on off days 6 Anytime-anywhere (24x7): status and new applications 7 Transparency: Corruption-prone areas lose the physical interface Transparency, accountability up, corruption down 8 Democracy: Democratic deficit in physical space organised digitally Communities, propaganda or protest on Twitter/Facebook Citizen-to-citizen mobilisation, G2C interface, EVM 9 Judicial administration: video-conferencing, judicial data grid 10 Government revenue: Digital payments reflect white money in banks, so taxes cannot be avoided Black money falls Issues PYQ 2023PYQ 2021PYQ 2019 WHAT Holds E-governance BACK E-GOV ISSUES : Digital divide Digital trust gap No re-engineering No consultation Transparency only incidental Not a panacea Value addition Digital divide: 75% of net users are in urban India ; digital illiteracy in rural India (an illiterate person cannot use online services even with a smartphone); mirrors the urban-rural divide (COVID: urban middle-class students on Zoom, rural students excluded; imbalance in education); rural people miss income opportunities, telemedicine; elderly more vulnerable; inadequate vernacular content; last-mile connectivity still a problem. Note Digital trust: entering personal information for transactions or fee payment makes people insecure about misuse of data . Memory aid · 6 C's Teacher's 6 C's of work plan: C ontent development (revise regularly, relevant to the zone) · C ompetence building (e.g. bank staff blame \"server fault\" and wait for an expert: give basic ICT training) · C onnectivity, esp. rural (else only the integrated part benefits, majority left on margins) · C itizen's interface (needs phone and internet; internet costly for rural people; awareness; accessible and affordable) · C yber laws (data protection and security; technology-agnostic ; balance privacy so that productive use of technology is not compromised) · C apital (sites need revenue streams; reasonable charges, self-sustaining). Note Inadequate re-engineering: e-governance lets government restructure and simplify procedure; if not done, procedure never gets digitised. Delay is not because of support agencies but sometimes govt lacks interest in simplifying, as the corruption point barricades digitisation. Note Narrow vision, no consultation: services shifted from physical to digital without asking stakeholders whether it fits their needs; if consulted first and physical-world problems resolved, e-governance matches needs. Check on corruption and transparency only incidental: dip is automatic from removing human interface; design intervention for the twin goals of accountability and transparency. E-governance helps But it cannot smart classes, presentations, online assignments, parents' access to progress build adequate schools with adequate teachers manage traffic: GPS load analysis, signals, CCTV challans care about congestion, deficit of flyovers/underpasses, road quality judicial data, case status, next hearing, lawyer allotment, bench give speedy justice delivery easy tax payment ensure government accountability for development works and use of taxes Way forward / key point Big data (\"Data is the new oil\"): with increasing data, problems arise: data security, privacy, unethical usage. Year PYQ (handout, with marks) 2025 (10) E-governance projects have a built-in bias towards technology and back-end integration than user-centric designs. Examine. 2024 (15) E-governance is not just routine digital technology in service delivery but multifarious interactions for transparency and accountability: evaluate the role of the 'Interactive Service Model'. 2023 (10) E-governance has ushered in effectiveness, transparency, accountability. What inadequacies hamper enhancement of these features? 2021 (15) Has digital illiteracy, particularly in rural areas, coupled with lack of ICT accessibility hindered socio-economic development? Examine with justification. 2020 (10) Fourth Industrial Revolution (Digital Revolution) has initiated e-Governance as an integral part of government. Discuss. 2019 (10) ICT-based projects usually suffer in vital factors. Identify these and suggest measures for effective implementation. 2018 (10) E-Governance is not only about new technology but the critical importance of the 'use value' of information. Explain. 2013 (10) Electronic cash transfer for welfare schemes: an ambitious project to minimise corruption, eliminate wastage and facilitate reforms. Comment."}, {"c": "3", "n": "Governance, E-Governance, Data Protection and Emerging Technology", "id": "4-data-protection-privacy-cybersecurity", "t": "4 · DATA Protection, Privacy & Cybersecurity", "x": "4 · DATA Protection, Privacy & Cybersecurity # Handout only · GEG pp. 15-20 Exam lens Priority: Low. Mains PYQs quoted: none quoted in the handout. Prelims PYQs quoted: none quoted in the material. In simple words Data is the new oil, and also a liability. India moved from IT Rules 2011 → Puttaswamy 2017 → Srikrishna Committee → PDP Bill 2019 (a Bill) → Digital Personal Data Protection Act 2023 (an Act). Keep Bill and Act apart. Value addition India: about 800 million internet users, 400 million smartphone users, 150 exabytes of data a year (handout). Strategic asset and liability. 132 of 194 countries have data-protection frameworks. Rise of big data
