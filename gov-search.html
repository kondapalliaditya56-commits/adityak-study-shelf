, tech giants and data aggregation raises privacy-breach and profiling concerns: even India's poorest are integrated through Aadhaar-linked services. The Parliamentary Committee on the PDP Bill noted data volumes expanding exponentially: opportunities and governance challenges. Way forward / key point Need for protective data usage: harness data for growth, better public services and Atmanirbhar Bharat ; cross-sectoral data convergence (Aadhaar, GSTN, UPI, BHUVAN) can improve policy through predictive analytics ; but privacy and security are imperative to keep public trust while maximising economic benefit. Issues IN THE DATA Ecosystem Issues data security and privacy: Prevent misuse for commercial gain Over-regulation stifles innovation, lax control erodes public confidence Privacy by design while enabling economic use cross-border compatibility: Align with global norms so firms operating internationally face no conflict Debate: uniform across private and public sectors or sector-specific Extent of government exemptions medico-legal: Leaks cause not just financial loss but emotional and psychological harm: stress, depression, PTSD (Identity Theft Resource Center study) Law must integrate medico-legal safeguards fake accounts and bots: mimic humans, spread propaganda and misinformation (NYT: 48 million Twitter accounts fake: malicious campaigns, scams) social media abuse by anti-social elements: Extremist and terror outfits (ISIS recruitment) Tension between privacy and national security: needs government-platform cooperation DATA Localisation Key point Data localisation = restrictions on cross-border data flow: local storage with regulated external access. Hard: absolute restriction on data leaving national borders. Soft: stored locally with conditional cross-border sharing. Key challenge: defining clear purpose-specific conditions for permissible transfers. Benefits (detail) national security: hostile nations cannot access information on our population to manipulate it law enforcement: Easier access for investigation Abroad it is difficult and impedes investigation privacy: Government can impose its own privacy rules Otherwise data flows where regulation may be lenient grievance redressal: Breach can be pursued in an Indian court Not feasible if breach occurs abroad bargaining power: local data is an asset in deals with countries and multilateral institutions (market access, bilateral, technical and economic cooperation) Memory aid · SLIPB Benefits: S ecurity (national) · L aw enforcement access · I ndia's own privacy rules apply · P rivacy grievance in Indian courts · B argaining power. (own mnemonic) LEGAL PATH (in order) 2000 / 2011 IT Rules 2011 under IT Act 2000 defined Reasonable Security Practices and Sensitive Personal Data Rules; inadequate against rising privacy concerns, so a comprehensive PDP Bill was needed 2017 Puttaswamy: Right to Privacy a Fundamental Right, so government must build a robust legal framework; Justice B.N. Srikrishna Committee formed to draft the law 2018 Srikrishna report laid the foundation for India's first PDP Bill 2019 PDP Bill 2019 (a Bill); several progressive recommendations were omitted or diluted in the final draft, leaving gaps 2023 DPDP Act, 2023 (an Act) Note Bill vs Act: PDP Bill 2019 was only a Bill (handout: Departmental Standing Committee; a JPC examined it and it was withdrawn in 2022: general knowledge, verify). Law in force: DPDP Act 2023 . GDPR (EU, 2018): \"EU avatar\" of the Indian PDP Bill informed consent: Lengthy complex online consent causes consent fatigue Terms should be simplified, shortened, understandable breach notification: the moment data is breached, the individual must be informed immediately automated decision-making: AI recommendation algorithms build profiles Right to opt out to prevent profiling citizen awareness: mass citizen-engagement programme Principles of data protection (7) technology agnosticism: Adaptive, future-proof Avoids frequent overhauls holistic application: Private entities and government Narrow, well-defined exemptions (national security, public order, investigation) to prevent misuse of discretion informed consent: genuine choice, not procedural formality from consent fatigue data minimisation: Collect only what is strictly necessary Purpose-limited use controlled accountability: Fiduciaries proactively use advanced security Accountable for breach under a defined framework structured enforcement: multi-tier: company, independent regulator, tribunals, judiciary (HC, SC) deterrent penalties as envisaged in the PDP Bill, to ensure compliance and trust Memory aid · SHARP-DD Principles: S tructured enforcement · H olistic cover (private + govt) · A gnostic technology · R esponsible fiduciary · P urpose-limited minimisation · D eterrent penalties · D ata consent (informed). (own mnemonic) PDP BILL 2019 (provisions of the Bill) Bill provisions preamble: Right to privacy is a fundamental right Protect personal data as a facet of privacy Collective culture for a free and fair digital economy applies to: government, companies incorporated in India, foreign companies dealing with personal data of individuals in India personal data: Traits or attributes of identity that identify an individual Sensitive: financial, biometric, caste, religious or political belief, or other category the government specifies with the Authority and sectoral regulator data fiduciary: Entity or individual deciding means and purpose of processing Only for specific, clear, lawful purposes, within collection and storage limits Security safeguards (encryption, preventing misuse), grievance redress, age verification and parental consent for sensitive data of children rights of data principal: confirmation of processing, correction of inaccurate/incomplete/out-of-date data, portability to another fiduciary, restrict continuing disclosure when no longer necessary or consent withdrawn Consent is the basis **** no consent needed for: benefits by the State, legal proceedings, medical emergency social media intermediaries: Enable user interaction Above a notified threshold and able to affect electoral democracy or public order: voluntary user verification Authority: Protects individuals' interests, prevents misuse, ensures compliance Chair + 6 members with at least 10 years in data protection and IT Appeal to Appellate Tribunal, then Supreme Court transfer abroad: Sensitive data only with explicit consent plus conditions, and must still be stored in India Critical personal data (notified) processed only in India exemptions: Centre can exempt its agencies (security of state, public order, sovereignty and integrity, friendly relations, preventing incitement to cognizable offences) Also prevention/investigation/prosecution of offences, personal or domestic, journalistic purposes (still specific, clear, lawful, with safeguards) penalty: Violation Rs 15 crore or 4% of annual turnover, whichever higher Failure of data audit Rs 5 crore or 2% Re-identification without consent: up to 3 years, fine or both DPDP ACT 2023 Provision Detail Scope digital personal data in India and extraterritorial for goods/services offered in India Consent informed and explicit Children government can lower age of consent Cross-border \"blacklisting\" approach, not blanket bar Social media Significant Data Fiduciaries must enable user verification Exemptions selective, for security and law enforcement Enforcement Data Protection Board of India Value addition Challenges: vague exemptions for State use: overbroad clauses may dilute privacy and encourage misuse by agencies · weak enforcement: Board's effectiveness hinges on autonomy, resources, capacity · compliance burden on innovation: small businesses and start-ups may struggle, stifling digital innovation · international data-sharing frictions: divergence from global data standards could hinder India's global digital integration. Cybersecurity Key point Incidents: UIDAI Aadhaar data leak 2018 (alarm over citizen data privacy) · Kudankulam nuclear plant breach 2019 (Lazarus Group-led; escalated national-security concerns) · AIIMS Delhi ransomware 2022 (fragility of healthcare cybersecurity). Value addition Role of cybersecurity: the backbone of India's digital economy; trust in digital governance rests on safeguarding critical infrastructure, preventing intrusions, ensuring data confidentiality: from citizen data in welfare programmes to national security. Threats: ransomware, data breaches, espionage. Initiatives CERT-In: nodal agency for cyber-threat response, under MeitY National Cyber Security Policy 2013: strategies for securing national digital assets Cyber Swachhta Kendra: botnet cleaning, malware mitigation ISEA programme: cyber awareness among students and government officials Cyber Surakshit Bharat: public-private collaboration for cyber resilience in government institutions Way forward / key point Way forward: expand operational capacity of CERT-In and I4C; consider a dedicated Cybersecurity Authority for critical sectors · enforce DPDPA 2023 (robust data governance to uphold privacy) · PPP innovation hubs (e.g. Infosys Cyber Defense Center for capacity building) · cyber education in curricula (Cyber Surakshit Bharat) · home-grown R&D (DRDO secure communication systems set precedent)."}, {"c": "3", "n": "Governance, E-Governance, Data Protection and Emerging Technology", "id": "5-emerging-tech-in-governance-blockchain-a", "t": "5 · Emerging TECH IN Governance: Blockchain · AI · DPI", "x": "5 · Emerging TECH IN Governance: Blockchain · AI · DPI # Handout only · GEG pp. 20-24 Exam lens Priority: Medium. Mains PYQs quoted: Mains 2020* (Fourth Industrial Revolution and e-governance). Prelims PYQs quoted: none quoted in the material. In simple words New tools (blockchain, AI, DPI) widen what government can do, and bring risks (deepfakes, content regulation, privacy). For each: what, example, challenge, way forward. Blockchain Key point Promise: transparency, immutability, decentralised trust: transforming public service delivery from land records to grievance redressal. CBDC (Digital Rupee): RBI initiative to modernise digital payments and reduce cash dependency. Telangana and Maharashtra pilot blockchain for property registration and digital academic records; regulators TRAI and SEBI exploring it for transparency and efficiency. Case Impact NFTs for land mutation (West Bengal) streamlined land ownership records; eliminated manual processes Tamil Nadu Blockchain Backbone consolidates citizen documents into a secure digital wallet for easy access and sharing Firozabad grievance system (UP) transparent complaint redressal using blockchain verification protocols Value addition Challenges: scalability and energy use (high computational demand slows scaling) · legal ambiguity: no robust legal recognition of blockchain records · data privacy: public chains risk exposing sensitive citizen data. Way forward / key point Way: comprehensive regulatory framework akin to Estonia's blockchain legal infrastructure · prioritise permissioned blockchains for government use · capacity building and sandbox projects like Dubai's Blockchain Strategy. AI AND Governance (4IR) PYQ 2020* Key point AI is reshaping public administration through automation, predictive analytics and efficient service delivery . Uses AI-led service delivery: Automation reduces administrative burden E.g. Indian Railways' \"Ideal Train Profile\" optimises revenue via AI analysis healthcare and education: Telemedicine, personalised learning E.g. NITI Aayog cancer image databases agriculture and inclusivity: AI-based pest control Bhashini project enables language inclusivity National initiatives IndiaAI Mission: build indigenous AI infrastructure, including 10,000 GPUs BharatGen Project: multilingual AI models for India's linguistic diversity global collaborations: GPAI Bilateral projects like US-India AI partnership AI challenge Solution fragmented data governance implement National Data Governance Policy; open, interoperable datasets lack of AI-specific legislation draft AI-specific regulations ensuring ethical oversight and transparency skill deficits in AI workforce expand AI training, especially in rural and underserved regions privacy and data security concerns enforce DPDPA effectively, focusing on data localisation and protection of sensitive information Deepfakes Value addition Deepfakes blur the line between reality and fabrication: a challenge to governance (elections, national security, public trust). Current law: IT Act 2000 Secs 66C, 66E, 67, 67A + IPC provisions on defamation, obscenity, forgery. IT Rules 2021: flagged deepfake content to be taken down within 36 hours . Key point Government response and advisory (2023): directives to intermediaries for timely takedown and user education · engagement with stakeholders for compliance · future IT Rules amendments to enhance platform accountability. Impact on governance election misinformation: manipulates voter perception national security threats: fabricated military or government communications cybercrime and fraud: scams impersonating officials erosion of public trust: citizens cannot tell genuine from manipulated content Way forward / key point Way: platform accountability: detection tools like Microsoft's Video Authenticator · blockchain-based verification to trace media authenticity · comprehensive legislation: frame a Digital India Act addressing deepfakes, learning from international frameworks · public awareness: responsible content sharing, media literacy. OTT AND Content Regulation Why and how need: Explosive growth ( 424 million users in 2022) Obscenity, lack of censorship, minors exposed to inappropriate material Cybersecurity risks: data breaches, fraud Digital Media Ethics Code: mandatory content classification: ratings U, UA 7+, 13+, 16+, A and parental controls three-tier grievance mechanism: publisher-level redressal, self-regulatory bodies, government oversight norm compliance: align digital news with Press Council and Cable TV Programme Codes way forward: Fast-track DPDPA to safeguard OTT user privacy Common regulator for digital, print and broadcast (Singapore model) Age ratings and content tags in regional languages alongside English Independent audit body for content compliance and data security Digital Public Infrastructure (DPI) Key point DPI: open-source, interoperable tech platforms underpinning mass delivery of public services, designed to be scalable, inclusive and secure . India Stack: Aadhaar, UPI, DigiLocker. Also ONDC, Open Health Stack, NDEAR (education; DIKSHA). Platform Purpose Aadhaar digital identity, presenceless authentication UPI real-time interoperable payments DigiLocker paperless documents ONDC open digital commerce Open Health Stack secure health-data sharing NDEAR national digital education architecture (DIKSHA) Significance digital inclusion and financial access: ~ 80% financial inclusion in 6 years vs expected 46-year trajectory UPI brought digital payments to rural India, widening formal credit and savings access economic gain: DPI could add 2.9-4.2% of GDP by 2030, pivotal to the $8 trillion economy ambition govt efficiency and innovation: CSCs extend Digital India to remote areas through local entrepreneurs AP ICJS 2.0 (Interoperable Criminal Justice System): police, forensics, courts, prisons digitised with AI-powered coordination: transparency and efficiency Challenges digital divide: Disparity across regions, castes, socio-economic groups 70% of rural population lacks reliable connectivity Limited devices and training privacy and trust deficit: Broad digital identity raises surveillance and misuse concerns Unclear redress mechanisms and absent robust legal framework erode trust state capacity and institutional gaps: need strong frameworks and \"intelligent customers\" (state actors knowledgeable in risk and data governance) implementation disparity across states: Madhya Pradesh only 0.9% schools with digital libraries vs national 6.1% Way forward bridge connectivity and literacy gap: National Broadband Mission 2.0 (universal rural broadband) Digital literacy via CSCs and PMGDISHA-like schemes institutionalise data trust: Embed privacy, contestability, grievance redress from inception Procedural fairness, not just compliance state capacity and hybrid institutions: Become intelligent DPI customers State-civil society collaboration scale through PPP and innovation: Open-source interoperable platforms E.g. Google's investment in Indian data centres DPI for new sectors: power (India Stack-like for utilities), education (DIKSHA-based NDEAR), health (Open Health Stack)"}, {"c": "3", "n": "Governance, E-Governance, Data Protection and Emerging Technology", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Three models triangulation, World Bank, good governance Triangulation parties state 1st, market 2nd, civil society 3rd World Bank model paper Sub-Saharan Africa, 1989 SMART Simple, Moral, Accountable, Responsive, Transparent GGI launch 25 Dec 2019 by DARPG; 10 sectors Beyond voting example Mohalla committees 3Fs of ULBs functions, finances, functionaries Municipal revenue below 1% of GDP (RBI 2024) First municipal bond Ahmedabad, 1998 Gram Sabha attendance below 15% in many states (MoPR 2023) E-government vs e-governance internal efficiency vs state-market-civil society delivery Five stages info, two-way, transactions, integration, participation Four models broadcasting, critical info flow, e-mobilisation, interactive service Digital divide statistic 75% of net users urban Six C's content, competence, connectivity, citizen interface, cyber laws, capital Right to privacy case Puttaswamy 2017: Fundamental Right Srikrishna report; first Bill 2018; PDP Bill 2019 Law now in force DPDP Act, 2023 Hard vs soft localisation never leaves vs conditional sharing CERT-In falls under MeitY IT Rules 2021 takedown time 36 hours IndiaAI Mission GPUs 10,000 Media rating labels U, UA 7+, 13+, 16+, A India Stack Aadhaar, UPI, DigiLocker DPI GDP estimate 2.9-4.2% by 2030"}, {"c": "3", "n": "Governance, E-Governance, Data Protection and Emerging Technology", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts in Start Here)"}, {"c": "3", "n": "Governance, E-Governance, Data Protection and Emerging Technology", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards"}, {"c": "4", "n": "Civil Society, NGOs, FCRA, SHGs, Pressure Groups and the CAG", "id": "1-civil-society-ngos", "t": "1 · Civil Society & NGOs", "x": "1 · Civil Society & NGOs # Handout only · CS pp. 3-9 Exam lens Priority: High. Mains PYQs quoted: Mains 2025 (anti-State?) · 2023 · 2021 · 2016 · 2015 (NGOs and environment). Prelims PYQs quoted: none quoted in the material. In simple words When the state and the market both fail, people organise on their own: civil society, the third sector. NGOs are its main face. Know the features, the four generations, the roles and the problems. Key point Governance has two aspects: process/institutions (state, market, NGOs, legal frameworks) and substantive content (how it addresses health, education etc.). In a welfare state like India the state is the principal problem-solving forum and its legitimacy lay in its capacity to address public issues, defining India's model until the 1991 reforms. Over time structural inefficiencies showed it could not tackle complex challenges single-handedly; post-1990s reforms shifted to market delivery; three decades on the market's exploitative tendencies and limits are evident: so civil society emerged as the third forum (inclusivity, transparency, participatory decisions). Why the State falls short (1st sector) overcapitalisation: too much money and reliance on the state yet inadequate benefit to people good politics, bad economics: decisions not matched to actual needs nanny state: over-dependence on the state too much money to one forum: corruption, embezzlement, stiffening of funds, linkages rule-driven bureaucracy: Adherence to rules became the goal Whether ultimate goals are met was a limited concern Forum Strength Weakness State (1st sector) welfare, policy, legitimacy till 1991 overcapitalised; nanny state; rule-driven; corruption Market (2nd) alternative delivery of goods and services profit-driven; user-pay ; exclusionary; merit goods (health, education) neglected for those who cannot pay Civil society (3rd) voluntary, collective, autonomous no universal definition Value addition Civil society = people organising themselves outside state and market (NGOs may get donations from state or market but are created by people and largely outside them): an intermediate space ; the \"fifth estate\" (after legislature, executive, judiciary and media). Voluntary (organised on the principle of voluntarism) · collective interest · autonomous · largely self-supporting · bound by shared values · citizens acting collectively in the public sphere · does not seek formal power . Political parties and media are kept out. No universally accepted definition: a mafia satisfies all the characteristics yet is not civil society. It is not society in general but organised social life: people organising around common beliefs, values, interests (NGOs, interest, advocacy, philanthropic, social-activism groups). Why civil society grew developmental failure of state and market societal learning (skill, will to organise) rise of the governance paradigm societal learning: people acquire skill, will and ability to organise outside state and market rejection of the instrumentalist state: State not at the centre of everything or of public-goods delivery Move from state-centric to people-centric development globalisation and information age colour revolutions (democratic revolutions of the 1990s in many ex-Soviet republics to topple dictators and restore democracy), Arab Spring Components AND Significance Components people-serving (general interest: Human Rights Watch, ADR) vs member-serving (pressure groups focus on their own members) traditional associations: Caste, religion, ethnicity, language Representative: trade, student, peasant unions interest groups: SHGs, pressure groups Philanthropic (Ramakrishna Mission), advocacy (PETA) Socio-cultural (sports, recreational clubs) Professional, typically member-serving (BCI, IMA) Social movements (India Against Corruption) NGOs: Private, not-for-profit, voluntary, self-governing entities CBOs: voluntary grassroots entities serving local community need Significance supplements, complements, questions, confronts, substitutes (where government is not active) the state/market Advocates social change Pro-active defence of civil liberties : HRW, Amnesty, PUCL strengthens transparency and accountability : ADR, Transparency International A vigilant civil society ensures government does not deviate from its promise makes de-administered, decentralised development workable Evaluates impact of government policies (social audits) Training ground for future political leaders technical support to government: CPR, IDSA, FICCI Memory aid · SAFE-SCAN Own anchor for significance: S upplement · A dvocacy · F reedoms defended · E valuate (audit) · S upport (technical) · C ontrol of state power · A ccountability · N ew leaders. (own mnemonic) Anti-state OR Non-state? PYQ 2025 Way forward / key point Non-State, not anti-State: they operate outside the government machinery, which does not make them anti-State. Criticism is not opposition: in a functioning democracy dissent and watchdog activity strengthen the State by improving accountability. Treating all civil society as suspect weakens democracy: blanket suspicion silences the legitimately voiceless alongside the genuinely problematic actor. Note The concern is not baseless, only overextended: a small number may misuse funds or work against public interest, so proportionate, transparent regulation , the kind the 2nd ARC envisaged for FCRA, is legitimate. The failure is using that concern to justify blanket restriction. Key point Way forward: treat non-state actors as governance partners, not adversaries (service delivery, advocacy, innovation) · reform FCRA toward proportionality, decentralising administration as 2nd ARC suggested , distinguishing genuine financial misconduct from politically inconvenient advocacy · deepen SHG 2.0 , addressing rising NPAs and credit weaknesses so SHGs evolve from a subsistence tool into economic empowerment infrastructure · modernise cooperative governance (PACS computerisation, Model Cooperative Societies Act, Ministry of Cooperation) · formal consultative mechanisms for pressure groups, not street mobilisation and informal lobbying alone · calibrate regulation to risk: target genuine wrongdoing without a chilling effect on legitimate civic work. Social Capital AND Legal BASE Value addition Social capital = power of the collective. Two pillars: trust and reciprocity . vs financial capital: both are productive; social capital is everywhere whereas financial capital is confined to financial institutions; social capital is unlimited and infinite , financial is finite. Basis Provision Art 19(1)(c) right to form associations, unions, cooperatives Art 43B promote cooperatives Part IX-B cooperatives Art 43B State to promote voluntary formation, democratic and effective functioning of cooperatives State List 32 cooperatives; multistate cooperatives governed by central laws Concurrent List 10, 28 Entry 10 trusts; Entry 28 charities, charitable and religious endowments NGO features Voluntary Initiated and governed by own members, ideally on democratic principles Autonomous from state and market legal entities: trusts, cooperatives, charities, trade unions, not-for-profit companies Own written constitution Definite aims and objectives Proper organisational structure Ability to mobilise resources locally or outside Well-organised accounting/auditing Continuous evaluation of performance government funding: Certainty of finance Saves time and energy spent raising funds Expands scope and outreach Regular state-NGO interaction is mutually beneficial Roles AND Generations Role of NGOs in development mediatory: Link between citizens and government Brings to government circles people's problems that escaped notice mobilising: Organise Gram Sabha meetings Many SHGs sponsored and developed by NGOs consultative: Think-tanks give technical inputs Leaders consulted, put on ad-hoc advisory bodies educational: Vocational training for poor to create self-employment E.g. SEWA (early 1970s, Ela Bhatt: poor women) supplementary/complementary: Core developmental areas Last-mile connectivity Address people's trust deficit with the state through a sensitive approach leadership: principal change agents in certain areas, eyes and ears of government (e.g. issues of sex workers) innovation: Imaginative interpretation of rules to serve public welfare Experiment until best practice, then replicated across departments efficiency: Bureaucracy is rule-driven, NGOs are goal-driven Adequate funding raises efficiency of government spending also: Highlight loopholes in legislative and institutional framework Enforce standards of accountability and transparency Voice of informed dissent through research and surveys Memory aid · MM CESIE Roles: M ediatory · M obilising · C onsultative · E ducational · S upplementary · I nnovation · E fficiency (plus leadership, loopholes, accountability, informed dissent). (own mnemonic) Generation Problem seen Scope 1st relief and welfare defined problems as shortage of something bring relief and welfare to individuals or families 2nd community development (began 1970s) local inertia : role became mobilising and organising rather than momentary benefits whole village or larger area, the district 3rd sustainable system development defined problems as institutional and policy constraints ; element of activism : regular interaction with government, agitation, newspaper articles, media debates region or nation as a whole 4th (present) hybrid: organisations and movements people not given an adequate mobilising vision for the future; doer (relief, studies, policy constraints) and on-ground activists; alternative mobilising vision for the world national and international Memory aid · RCDM Generations in order: R elief · C ommunity · D evelopment-system · M ovement. (sequence kept) (own mnemonic) Problems OF NGOs PYQ 2021PYQ 2015 Eight Frictions NGO PROBLEMS : Few resources Uneven presence No coordination Few trained staff State interference Corruption (Jholawalas) Elite, donor control Weak accountability Problems in detail deficiency of resources: Pre-1991 closed economy and public-sector dominance limited private donations NGOs with radical agendas became dependent on government funds, so bureaucratic interference Post-liberalisation corporate donations rose but scarcity persists uneven presence: Limited networks, absent in large parts of rural India Certain regions attract excess attention (Niyamgiri-Vedanta agitation), others neglected lack of coordination: NGOs in similar sectors (health, education, skills) compete for donor recognition Reluctance to pool resources for fear of losing credit: duplication and wastage Limited outreach/networks reinforce uneven presence Shortage of trained and dedicated workers (technical and managerial expertise) hurts field effectiveness state interference: Government-funded NGOs face bureaucratic oversight Internal operations become bureaucratised and rule-driven, undermining independence corruption: Some misuse funds, money laundering, misappropriation Ex-CVC N. Vittal named \"Jholawalas\" (corrupt NGOs) alongside Netas, Babus, Lalas and Dadas elite domination: reliance on corporate donors, rich elites, landlords gives donor-driven agendas, compromising grassroots autonomy accountability: Government-funded NGOs submit progress reports and audits Those raising funds from public donations or informal channels lack structured accountability, so monitoring is difficult no common governance norms: Registered under Trusts, Societies, Charitable Institutions, Not-for-Profit Companies: fragmented oversight RWAs and SHGs not formally registered government crackdown: In democracies with weak institutions governments see NGOs as threats for dissent and activism Regulatory scrutiny and funding restrictions on those advocating public causes Year PYQ (handout, marks) 2025 (10) Civil Society Organisations are often perceived as anti-State actors rather than non-State actors. Do you agree? Justify. 2023 (15) Contribution of civil society groups for women's effective and meaningful participation and representation in state legislatures. 2021 (15) Can civil society and NGOs present an alternative model of public service delivery to benefit the common citizen? Discuss the challenges of this alternative model. 2016 (12.5) In the Indian governance system the role of non-state actors has been only marginal. Critically examine. 2015 (12.5) How can the role of NGOs be strengthened in India for development works relating to protection of the environment? Discuss the major constraints."}, {"c": "4", "n": "Civil Society, NGOs, FCRA, SHGs, Pressure Groups and the CAG", "id": "2-fcra-regulating-ngos-donor-agencies", "t": "2 · FCRA · Regulating NGOs · Donor Agencies", "x": "2 · FCRA · Regulating NGOs · Donor Agencies # Handout only · CS pp. 9-12 Exam lens Priority: High. Mains PYQs quoted: Mains 2015 (FCRA) · 2024 (charitable trusts) · 2022 (donor agencies). Prelims PYQs quoted: none quoted in the material. In simple words The state has tightened control of foreign funding step by step: FCRA 1976 → FCRA 2010 → Amendment Act 2020 → an Amendment Bill 2026 that is still only a Bill. Know which are Acts and which is a Bill. 1976 FCRA 1976 enacted by Indira Gandhi amid declared suspicion that foreign interests were trying to influence or destabilise India 1982 Kudal Commission appointed to investigate activities and foreign funding of certain voluntary organisations; report not placed in public domain 2010 FCRA, 2010 main framework (MHA) 2013 Lokpal Act 2013: NGOs receiving substantial foreign contributions fall within Lokpal's jurisdiction, strengthening accountability over foreign funds 2014 media reports cited a leaked Intelligence Bureau report alleging some foreign-funded NGOs mobilised opposition to projects on nuclear energy, mining, GM crops and industrial development: Kudankulam, uranium mining, POSCO, Vedanta 2020 FCRA (Amendment) Act, 2020 2022 Noel Harper v UoI upholds 2020 provisions 2026 FCRA Amendment Bill, 2026 : still a Bill, with a JPC Note Act vs Bill: FCRA 1976, 2010 and the 2020 Amendment are Acts . The 2026 measure is a Bill referred to a Joint Parliamentary Committee , so it is not law yet (handout wording). FCRA, 2010 FCRA 2010 (MHA) Regulates receipt and utilisation of foreign contribution by individuals, associations, NGOs, trusts and other entities Administered by MHA two routes: Registration (fixed period, subject to renewal) and Prior Permission (specific purpose and specific foreign source, generally for organisations without regular FCRA registration) allowed fields: cultural, economic, educational, religious, social barred recipients: political parties, election candidates, public servants, organisations of a political nature MHA can suspend or cancel Annual returns and accounts Value addition Concerns: complex registration and renewal · vague \"political nature\" · suspension and cancellation · compliance load · admin spend cut by 2020. FCRA Rules: office-bearers declare on religious conversion, sedition, violence; foreign hospitality covered. FCRA (Amendment) Act, 2020 Change Public servants cannot receive foreign contribution Transfer cannot pass it to another person or entity Administrative expenditure 50% → 20% Suspension maximum 180 → 360 days Aadhaar mandatory for key office-bearers Account first into designated FCRA account, SBI New Delhi Main Branch Memory aid · PTAS-AD 2020 changes: P ublic servants barred · T ransfer barred · A dmin cap 20% · S uspension 360 days · A adhaar · D esignated SBI account. (own mnemonic) Way forward / key point Noel Harper v Union of India (2022): SC upheld the major 2020 provisions; receiving foreign contribution is not an absolute right . FCRA AMENDMENT BILL, 2026 (referred to JPC) What the Bill proposes certificate ceases if not renewed, no application made, or renewal rejected Designated Authority for vesting, supervision, management and disposal of foreign contributions and assets created from them after registration ends provisional vesting: Assets temporarily in custody, restored if registration revived Permanent vesting: if not restored, assets may vest permanently in the Authority, be used for public purposes, disposal proceeds credited to Consolidated Fund of India Prior-permission funds must be received and utilised within the prescribed period Designated Authority must preserve religious character of places of worship, cannot convert or repurpose them Maximum imprisonment for specified offences reduced to one year from five Prior approval of the Central Government before initiating investigation for offences under the Act Way forward / key point Significance: closes a legal gap (framework for assets when certificate expires or is not renewed) · prevents regulatory avoidance (cannot escape scrutiny by letting registration lapse) · protects foreign-funded assets for public purpose · transparency and anti-money-laundering compliance · decriminalisation (reduced imprisonment shows a trust-based regulatory approach). Value addition Concerns: disproportionate consequence: even procedural lapses may cost assets · retrospective impact: earlier assets may stay subject to vesting even if the organisation now functions on domestic funds · differential treatment of registered vs prior-permission organisations · due process: no clear hearing or appeal against denial of renewal, more executive discretion · centralisation: prior Central approval for investigation raises institutional-independence concerns. Key point Balance and way forward: regulate to stop laundering, foreign political influence, diversion and security threats, but keep space for health, education, environment, relief. Give a statutory appeal · judicial safeguards before permanent vesting · clean exit from FCRA without forfeiture of legitimate assets · real-time digital disclosure on the FCRA portal · proportionate treatment of technical lapses. Conclusion: stronger executive power needs due process, proportionality and transparency. CAN Civil Society Replace THE State? PYQ 2016 State functions not to outsource Defence Public order External affairs larger societal problems neither civil society nor market can handle: population-control policy, comprehensive national policies, broad problems like communalism and casteism symbolic functions (regularly celebrating Republic Day, Independence Day) framing monetary, fiscal, EXIM, industrial policies Verdict: civil society can be one alternative problem-solving forum , but not a complete substitute for the state or the market Donor Agencies PYQ 2022 Key point Donor agencies are now significant players in financing India's development projects; resources and expertise are valuable, but excessive reliance may undermine community ownership and grassroots participation in setting priorities. Against dependence reduced community ownership: projects look externally driven, alienate locals (Narmada Dam protests) top-down imposition: global narratives over local realities (World Bank ICDS support faced local adaptability challenges) bureaucratic complications: donor procedural norms, audits, reporting burden local agencies (MNREGA reporting delays from donor-linked processes) weakened accountability: external steering bypasses national oversight, less transparency to locals and democratic institutions For involvement capacity building: training and technical inputs (UNDP water management, rural India) participatory planning: community engagement in design and monitoring (ADB Urban Climate Fund) local knowledge: partnerships amplify indigenous experience (Sweden-SEWA boosted women's livelihoods) global best practice: benchmarks in transparency, gender inclusivity, environmental safeguards Year PYQ (handout, marks) 2015 (12.5) Examine critically the recent changes in the rules governing foreign funding of NGOs under the FCRA, 1976. 2024 (10) Public charitable trusts have the potential to make India's development more inclusive as they relate to certain vital public issues. Comment. 2022 (15) Do you agree that increasing dependence on donor agencies for development reduces the importance of community participation in the development process? Justify."}, {"c": "4", "n": "Civil Society, NGOs, FCRA, SHGs, Pressure Groups and the CAG", "id": "3-self-help-groups-shgs", "t": "3 · Self-help Groups (SHGs)", "x": "3 · Self-help Groups (SHGs) # Handout only · CS pp. 12-17 Exam lens Priority: High. Mains PYQs quoted: Mains 2021 · 2020 · 2017 · 2015 · 2014 · 2013. Prelims PYQs quoted: none quoted in the material. In simple words An SHG is a small informal savings group, mostly rural women, that lends from its own corpus and later links to a bank. Social capital replaces collateral. NABARD started the bank-linkage programme in 1992. Value addition SHG: principally a rural women's movement (not only women-specific; some include men); small, informal associations, not legally registered, not legal entities ; largely poor women, preferably of similar socio-economic background; ideal size 10-20 . Each must save regularly (weekly); a weekly loan corpus is created and lent to members for income-generating ventures, vulnerabilities, productive needs. A savings-led microfinance model to improve earnings and savings and build an economic base to escape poverty, on self-help and collective responsibility : loans carry no security (poor rural women lack the collateral financial institutions demand); repaid because of collective responsibility and peer pressure . Key point Bank link: when an SHG matures it is linked to a bank: it deposits its collective corpus, earns interest, and can avail a larger loan. Banks normally follow a 1:4 deposit-to-credit ratio (SHG depositing Rs 10,000 a month as corpus is eligible for four times that as loan). Type How it works ROSCA (Rotating Savings and Credit Association) like the urban kitty/committee: each month or week savings pooled; corpus given to one member (name picked by draw of lots ); rotates till the last member is selected, then the cycle repeats ASCA (Accumulated Savings and Credit Association) no rotation; accumulated corpus from regular periodic savings; loans to those who need, on collective decision and joint approval Shg-bank Linkage (shg-blp) Shg-blp NABARD, 1992 started the SHG Bank Linkage Programme Principal self-help promoting agency in the country Mature SHGs get linked to banks Microfinance SHGs: set up by financial institutions Microfinance Plus SHGs: set up by government agencies and NGOs, with wider development aims SHPIs: NABARD, RRBs, SCBs, NGOs, government agencies 100+ million households covered 84%+ SHGs are women's: movement largely driven by rural poor women Key point Panchsutras (Panchsheel): if SHGs follow these they are of very good quality and banks are willing to lend: regular savings · regular internal lending · regular repayment of loans · regular meetings · regular books of accounts. Memory aid · S-I-R-M-B Teacher's Panchsutra (five regulars): S avings · I nternal lending · R epayment · M eetings · B ooks of account. (initials are my aid; the five points are the handout's) (own mnemonic) NABARD tools Joint Liability Group: The whole group collectively takes responsibility for repaying the loan even if only a small part was lent to one member Introduced by NABARD 2005-06 Best done by organising women of similar skills into affinity SHGs and developing enterprises for all (each like a shareholder; bank loan goes to the whole enterprise) NABFINS (NABARD Financial Services Ltd): to evolve into an ideal MFI, setting governance standards among MFIs, a model for how to approach SHGs especially loaning microfinance development programmes: Skill development if members lack skills Improve skills or optimise production if they have them Livelihood and Enterprise Development: Livelihood promotion in clusters of 15-30 SHGs in contiguous villages (one SHG's product can be input for another) Handholding 3-6 months (representatives explain the value chain) Affinity groups End-to-end support DAY-NRLM: Mission aims to bring at least one woman from each identified poor rural household into SHGs Special emphasis on the most vulnerable: manual scavengers, disabled, PVTGs, bonded labour, victims of sexual offences Benefits AND Impact PYQ 2021PYQ 2020 Benefits financial inclusion: perhaps the best model for extending microfinance: savings, credit, insurance physical capital replaced by social capital: Poor lack physical collateral SHGs need none capability approach (not dole, due or rights): strengthens capacity and autonomy to make the choices people want in life social and economic transformation of women: Income meets life-cycle and production needs of family Social status rises Gives economic reforms a human face Declared component of GoI poverty-alleviation strategy Positive effect on demographic and social indicators political empowerment: Community platform Rural women attend Gram Sabha regularly, take part in panchayat elections Note Dole vs Due: dole = something government gives out of generosity or political will; addresses a shortage of goods at a point in time, never on a sustaining basis. Due = government converts benefits (employment, food security: RTS, FSA) into legally enforceable rights , the Rights-Based Approach . SHG is neither: it strengthens people's capacity and so their autonomy of choice, the capability approach . Impact Fact Number over 10 million SHGs Credit collateral-free loans of Rs 87,098 crore to 5 million SHGs (by March 2019) Poverty inculcates habit of thrift; less dependence on moneylenders; economic base to escape poverty; other studies: impact more protectional than promotional Women stronger and more empowered in mature SHGs; but patriarchy leaves women little decision-making control and many studies see limited effect on economic activity, skills; some SHGs organise community action on child marriage, child labour, liquor ban Issues PYQ 2014PYQ 2013 Issues outreach: More successful in South India (undivided Andhra led SHG formation; Kerala got lots of government support; maybe linked to higher education) Poorest of the poor left out restrictive policies of FIs and banks: Banks compel SHGs to work as suits the banks SHGs wound up, members return to moneylenders (NABARD now gives 100% refinancing against SHG loans) quality of management and governance: Weekly meetings not held, poor attendance Book-keeping weak Membership too large, unmanageable Only leaders benefit more from loans Leadership should change periodically but does not Securing autonomy from government interference Inability to take up new productive ventures Unhealthy competition among states Inadequate micro and macro studies Capacity and skill development rising NPAs (new concern): Outstanding SHG loans Rs 423 crore (2007-08), Rs 452 crore (2018-19) Expected to rise due to COVID inequality: reduces inequality based on social gaps but may create inequality by education: better-educated women benefit more Way forward / key point Measures: government as facilitator, not controller (Grameen Bank) · targeted expansion in credit-deficient regions (MP, Rajasthan, North-East, to bridge regional disparity; Kenya's rural SHGs, Chamas, cut financial exclusion among women) · financial infrastructure and digital connectivity: integrate with banking networks, ICT, capacity building (AP SERP model: dedicated monitoring cells and ICT tracking performance, credit linkages, transaction histories) · urban and peri-urban SHGs for slum dwellers and urban micro-entrepreneurship (Brazil's Bolsa Familia included urban SHGs). Government role example: Bangladesh's Grameen Bank showed proactive government support fosters a microfinance ecosystem. Success Stories SHG story Detail Kudumbashree (Kerala, 1997) very successful Kerala Government SHG programme, started 1997; literally \"Prosperity of Family\": neighbourhood groups of women → Area Development Society (ADS) at ward level → federated into Community Development Societies (CDS) at gram panchayat or block panchayat; ~3 lakh neighbourhood groups, ~19,500 ADS, ~1,064 CDS, ~46 lakh women Grihalakshmi SHG West Singhbhum, Jharkhand; national award for best-performing SHG 2018; notable efforts to eradicate child labour locally Didi ki Rasoi Bihar; community-based canteen with quality, hygienic food; a group of women can affiliate and start their own; began with food for hospitals, now other institutions too Pangi Hills brand remote tribal area of Himachal; exotic forest products: honey, black cumin, walnuts; members earn up to Rs 2-2.5 lakh a year COVID masks, sanitisers, protective gear; instrumental in social distancing, masks, quarantine facilities, elderly care; Kudumbashree network dispelled Covid fake news on WhatsApp groups; COVID an opportunity to push digitisation as physical activity stopped Year PYQ (handout, marks) 2021 (10) Can the vicious cycle of gender inequality, poverty and malnutrition be broken through microfinancing of women SHGs? Explain with examples. 2020 (15) Micro-finance as an anti-poverty vaccine aimed at asset creation and income security of the rural poor: evaluate the role of SHGs in achieving the twin objectives along with empowering women in rural India. 2017 (15) Emergence of SHGs points to slow but steady withdrawal of the state from developmental activities: examine the role of SHGs and measures taken by GoI to promote them. 2015 (12.5) The SHG Bank Linkage Programme (SBLP), India's own innovation, has proved one of the most effective poverty alleviation and women empowerment programmes. Elucidate."}, {"c": "4", "n": "Civil Society, NGOs, FCRA, SHGs, Pressure Groups and the CAG", "id": "4-pressure-groups-lobbying", "t": "4 · Pressure Groups & Lobbying", "x": "4 · Pressure Groups & Lobbying # Handout only · CS pp. 17-26 Exam lens Priority: High. Mains PYQs quoted: Mains 2026 · 2025 · 2021 · 2019 · 2017 · 2013. Prelims PYQs quoted: none quoted in the material. In simple words A pressure group influences government policy without trying to become the government. India has many types: social, professional, institutional, ad hoc and anomie. Learn techniques, problems and a few recent examples. Value addition Pressure group: hard to define (parties are sometimes included, sometimes excluded); the common definition excludes political parties and covers groups wishing to influence government policies and activities while remaining apart from government. An association of people with common interests who try to achieve them by influencing government; helps social integration, political articulation and acts as a catalyst for change . Definition: \"an organised aggregate which seeks to influence the context of governmental decisions without attempting to place its members in formal governmental capacities\". Alan R. Ball: firmly part of the political process; reinforce or change the direction of policy but do not wish to become the government. Henry Turner: non-partisan; do not draft party programmes or nominate candidates. Finer: \"anonymous empire\". R.D. Lambert: \"unofficial government\". Truman (group theory): a group, on the basis of shared attitudes (the interest), makes claims on other groups for the establishment, maintenance or enhancement of behaviour implied in those attitudes. Genesis In existence ever since governmental machinery could deliver benefits to individuals or groups Took concrete form after the industrial revolution and rise of market economies trusts and monopolies, struggle over tariffs technology and agricultural skills: new problems, desires, needs, new groups state took on welfare functions besides regulation: more power and discretion in state apparatus, so need to pressure it grew Dominant sections need State help for economic activity Weak and deprived need it for basic requirements freedom of association in democracies: the basic factor welfare state, socialism, positivism: pressure groups as a shield against misuse of government power consequence of inadequacies of political parties in articulating demands of deprived and dominant interests Features AND Interest Groups Features Organised on social, political, economic, religious, vocational interests Try to dominate political structure and suppress clashing groups Represent interests of different parts of society Vary in size and structure Vitality = ability to influence policy makers, law makers, implementers Influence varies (trade unions, business, professionals strong; a small ad hoc local committee can force quick policy change by mass marches) modern means without renouncing old: financing parties, sponsoring close-associate candidates, getting friendly persons into executive jobs Change allegiance quickly Appear and disappear with conditions individuals have lobbying rights but a collective approach exerts stronger pressure and consolidates similar ideas Pressure vs interest group interest group: formed by people with shared interests, no interest in pressurising government for favourable decisions pressure group: organised interest group with regular interface with government, questions or connects with it to win favourable policy A group may start as an interest group and morph into a pressure group as it grows with wider objectives Terms often used interchangeably Inevitable in a democracy Their study is intrinsic to understanding dynamics of politics and of policy making Note Pressure groups vs political parties: pressure groups do not participate in elections, parties do; pressure groups have a smaller social base , parties a larger one. Types PYQ 2013 Type Example Social or identity-based two kinds: community service (Singh Sabha movement); mobilisation for political ends (RSS, VHP, All India Sikh Students Federation) Associational / professional peasants, trade unions, business associations; professionals: Bar Association, Indian Medical Association Institutional (operate within government) use the government machinery to pressurise government: IAS lobby, IPS lobby Ad hoc created for a specific purpose or issue; dissolve when resolved: India Against Corruption (Lokpal movement) Anomie from despair and frustration when regular grievance methods fail: spontaneous outbursts that can turn violent, destroy public property, use extra-legal means: RRB exam protests (Gaya, Patna), MAGA movement, anti-vaxxers (USA) Memory aid · SAIAA Five types: S ocial · A ssociational · I nstitutional · A d hoc · A nomie. (own mnemonic) RECENT EXAMPLES (as given in the handout; verify dates) Group Role and example Farmers role: MSP guarantees, fair prices, subsidies, debt relief, land rights via mass mobilisation and negotiation. Samyukt Kisan Morcha 2020-21 against three farm laws, repealed in 2021 ; SKM (Non-Political) and KMM Dilli Chalo 2024 : legal MSP guarantee on C2+50% formula, debt waivers, pensions Youth / Gen Z role: unemployment, paper leaks, corruption, institutional accountability via social media and mass protests. Handout: Cockroach Janta Party (CJP) Jantar Mantar protests 2026 against exam irregularities; CJP activists in October 2026 on alleged electoral-roll irregularities, demanding the Chief Election Commissioner's resignation Trade unions role: wages, job security, conditions, pensions, collective bargaining. Central unions' nationwide strike 2025 (higher minimum wages, social security, changes to Four Labour Codes); Noida factory workers April 2026: UP raised minimum wage ~21% for unskilled workers in Noida and Ghaziabad Environment role: biodiversity, pollution control, forest rights, sustainable development. Save Aarey 2019-22 (tree-felling for Mumbai Metro car shed); Hasdeo Arand Bachao 2024 (tribals vs coal mining and forest clearance, Chhattisgarh) Professional role: professional autonomy, fair pay, ethical standards, workplace safety. IMA nationwide protests 2024 after RG Kar Medical College incident: Central Protection Act, stronger hospital security Gig workers role: fair wages, algorithmic transparency, social security, protection from arbitrary deactivation. December 2025 strikes (IFAT and others) against unsafe 10-minute delivery targets, low earnings, poor social security In the news (Saarthi IAS CA; verify dates) The handout says sustained CJP protests contributed to the resignation of Union Education Minister Dharmendra Pradhan in July 2026. Unverified by me. Western vs Indian Differences Western groups regarded as the \" fourth organ \" of government Indian groups not yet able to play a significant role in politics India and Britain: Main lobbying targets are the cabinet and civil service , not Parliament USA: Congress and its committees , rather than the President Indian groups based on caste, religion, region are more powerful than business organisations American groups take interest in foreign policy Indian groups do not Significance Significance channel of communication between citizens and government broaden political participation: people join because of deep distrust between people and political parties political socialisation: process by which people become politically active and acquire political vision, approach, values data, inputs, information for policy (FICCI, ASSOCHAM, CII) prevent a dominant force: countervailing groups demand opposite things informal face of politics: mobilise and shape public opinion, question and confront government, agitation and propaganda: keep democracy alive between elections support parties and candidates, give donations \"legislatures behind legislatures\": legislators get cues on what to discuss from groups that raise issues reservoirs of political leadership (Kejriwal from the Lokpal movement) Check arbitrary use of state power (farmers vs three farm laws) Improve governance (human-rights groups) educate people by campaigns, propaganda, reports, media debates (environmentalists against growth harmful to environment) safety valve for grievances, preventing spontaneous outbursts consensus building to present a united face to government (FICCI; Samyukt Kisan Morcha) Techniques, Lobbying, BEST Practices Eight WAYS TO Pressure TECHNIQUES : Lobbying (CII, FICCI) PILs (CSE) Media, digital drives Mass protests Report cards, social audit Research, coalitions Satyagraha, fasts RTI exposés (MPLADS) Techniques in detail (with handout examples) lobbying and direct negotiation with policymakers, bureaucrats, legislators (CII, FICCI on tax reforms and industrial policy) PILs for judicial intervention (CSE for air-pollution control) media campaigns and opinion building (RTI activists exposing administrative opacity) mass mobilisation: rallies, dharnas, petitions, signature drives (farmers' protests 2020-21) social audits and citizen report cards (PAC report card reduced bribery in service delivery in Bangalore) expert inputs and research-based advocacy: white papers, data to committees and ministries (PRS Legislative Research) coalition building (NCPRI united civil society for the RTI Act) strategic legal interventions: court cases, stay orders, amicus curiae symbolic protests: satyagraha, padayatras, hunger strikes (Anna Hazare's Lokpal movement) digital campaigns: hashtags, viral videos, petitions (#SaveAarey mobilised urban youth) RTI-based exposes (MPLADS fund misuse) international advocacy and moral pressure: global bodies and indices for reputational pressure Key point Best practices: PAC report card (Bangalore: citizen audits cut corruption in municipal services) · NCPRI RTI campaign (coalition success, led to the RTI Act) · #SaveAarey (Mumbai, 2019: digital activism led to policy reversal on urban deforestation) · CEHAT (research-based lobbying shaped national policy on patient rights) · Anna Hazare's Jan Lokpal movement (2011: Gandhian methods put anti-corruption on the national agenda). Value addition Lobbying: so called as big business leaders roamed the lobbies of the US Congress to influence policy. Today: formally connecting with government, regular meetings with officials and ministers, presenting the interests of the section one represents to get a favourable policy outcome; used principally by organised corporate groups, business houses, business associations. Not bad per se; in India neither legal nor illegal. Problems: (a) paid lobbyists: Nira Radia and Vaishnavi Corporate Communications (getting specific leaders placed in specific ministries); Deepak Talwar Associates (accused of bribing civil servants); (b) legislators as lobbyists: H.G. Mudgal disqualified from the provisional Parliament after Independence for lobbying for a private organisation (Bombay Bullion Organisation); (c) bureaucrats, serving or retired: advising the Minister to tweak rules for certain organisations, pushing files to accommodate a private player. Santhanam Committee 1962: proper system of accreditation of lobbyists; no civil servant should interact with a representative of a business organisation or group unless fully accredited. Way forward / key point Business associations (FICCI, ASSOCHAM, CII) methods: lobbying · political donations via electoral bonds · critical assessment of government economic policies/legislation · commissioning studies · workshops and conferences · technical inputs · appointment to advisory/ad hoc panels · consensus building · interaction with analogous institutions abroad, like WTO. Problems AND Effectiveness Problems disproportionate influence of some: caste and community groups, trade and peasant unions, business associations like FICCI, CII after 1991 subversion of democratic institutions: legislators and parties heavily influenced lose independent thinking unorganised interests neglected (e.g. educational development) extra-legal methods: bandhs, hartals, rail roko, chakka jam, destruction of public property divisive: prevent emergence of a true national identity block progressive initiatives: some Khap Panchayats sanction honour killings in inter-caste marriages many lack transparency in internal functioning (e.g. RSS) Note Khap Panchayats: SC 2011 : a Khap advocating or sanctioning honour killing should be banned altogether under the Unlawful Activities (Prevention) Act; an officer who does not check its illegal decisions would also be penalised. As victims are generally SC/ST, the accused can also be prosecuted under the SC/ST (Prevention of Atrocities) Act, 1989 . Some states like Rajasthan proposed laws against honour killing, but regular IPC provisions (e.g. Sec 302) suffice if rationally enforced. Khaps thrive on weak local bodies, judicial inadequacies, political patronage. But some Khaps have done consensus building and socially oriented community service. Key point Effectiveness depends on: sectional (RSS, Khap Panchayats, caste associations: more effective in India) vs promotional (human rights organisations, PETA) · funding (lobbying needs a lot of money) · political branding (linked to certain parties, so effectiveness depends on that party's role in government) · membership (quantity and quality) · government reliance on them (Make in India needs business associations). Way forward / key point Way forward: legal recognition and regulatory framework: absence of formal status limits legitimacy and accountability; registration and regulation akin to US and UK lobbying laws · code of conduct and financial transparency: mandatory ethics, disclose funding sources and lobbying (vital in telecom, pharma where opaque lobbying undermines trust) · consultative role in legislative committees and policy dialogues (e.g. farmers' associations in agricultural reforms and MSP) · digital platforms like MyGov to gather feedback systematically. Year PYQ (handout, marks) 2026 (15) To what extent do pressure groups, social movements and corporate lobbies deepen pluralistic democracy in India by representing excluded interests? Analyse whether the growing convergence of corporate wealth and political power threatens the autonomy of formal democratic institutions. 2025 (15) What are environmental pressure groups? Discuss their role in raising awareness, influencing policies and advocating environmental protection in India. 2021 (10) Pressure groups play a vital role in influencing public policy making in India. Explain how the business associations contribute to public policies. 2019 (10) Methods used by farmers' organisations to influence policymakers in India and how effective are they? 2017 (10) How do pressure groups influence the Indian political process? Do you agree that informal pressure groups have emerged as more powerful than formal ones in recent years? 2013 (10) Pressure group politics is sometimes seen as the informal face of politics. Assess the structure and functioning of pressure groups in India."}, {"c": "4", "n": "Civil Society, NGOs, FCRA, SHGs, Pressure Groups and the CAG", "id": "5-comptroller-auditor-general-cag", "t": "5 · Comptroller & Auditor General (CAG)", "x": "5 · Comptroller & Auditor General (CAG) # Handout only · CAG pp. 2-7 Exam lens Priority: High. Mains PYQs quoted: Mains 2018 (appointment, terms, powers) · 2016 (Art 149; policy audit). Prelims PYQs quoted: none quoted in the material. In simple words The CAG audits the spending of Union, States and bodies funded by the government, and reports to Parliament. India's CAG audits after the money is spent; the UK CAG also controls release of funds. Value addition Ambedkar in the Constituent Assembly: \"the most important office under the Constitution\"; one of the 4 pillars with SC, UPSC and Election Commission. Art 148 creates the office. Principal responsibility: audit accounts of State and Central governments spending taxpayers' money; so significant for financial accountability that it must have independence like the judiciary. Status: service conditions broadly equivalent to a Supreme Court judge , including salary and removal safeguards. Point Fact Tenure 6 years or until age 65 , whichever is earlier, under the CAG (Duties, Powers and Conditions of Service) Act, 1971 ; changes require amending the Act, not the Constitution Post-retirement restriction Art 148(4): CAG ineligible for further government office under the Union or any State Duties prescribed under Art 149 ; laid down in the CAG (Duties, Powers and Conditions of Service) Act, 1971 , enacted by Parliament Accounts form advises President ( Art 150 ) Net proceeds certifies shared Union-State proceeds ( Art 279 ) Functions Audit and report on all expenditure from Consolidated Fund, Public Account, Contingency Fund of India / States / UTs with legislative assembly trading, manufacturing accounts and profit and loss statements kept by any department of Centre, States, UTs with legislature (e.g. Railways, Posts) receipts of Union and States: rules designed to secure an effective check on assessment and collection of revenue stocks and stores and government inventory: ensure no pilferage Receipts and expenditure of bodies substantially financed by government And of bodies not substantially financed when requested by the President or Governor Public Sector Undertakings Advises the President on the form of accounts of Union and States ( Art 150 ) Certifies net proceeds shared by Union with States ( Art 279 ) assists the Finance Commission in a fair understanding of states' actual financial position audits accounts of Autonomous District Councils under Schedule VI Memory aid · CARSE Audit-on: C onsolidated and other funds · A ccounts (trading, P&L) · R eceipts · S tores · E ntities financed (bodies, PSUs). (own mnemonic) PSU Audit AND Accounts PSU type CAG audit Statutory corporations (special law, governed by own statute, generally government-owned; LIC, FCI, RBI) CAG may conduct full, partial or no audit , depending on the law Government companies (registered under Companies Act / joint stock; at least 51% government ownership) audited by private auditors appointed in consultation with CAG ; CAG can also do a supplementary audit over and above it Key point PSUs = government-owned enterprises for commercial and economic activity outside the regular departmental structure; some set up as State monopolies in strategic sectors. Performance audit: both categories may face comprehensive performance audit through the Audit Board (introduced 1968) , where applicable. Key point Separation of accounting and auditing: accounts are prepared by the department or undertaking; audit is by an external authority for independence and no conflict of interest. Departmentalisation of Accounts (1976): before 1976 CAG did both compilation of accounts and audit; the scheme transferred preparation and compilation of Union accounts to ministries and departments, leading to the Indian Civil Accounts Service (ICAS) and the Controller General of Accounts (CGA) under the Finance Ministry. Now: CAG primarily audits Union accounts, continuing both accounting and auditing for most States, subject to arrangements. Significance: clearer separation, stronger financial accountability and independent oversight. Issues IN Working PYQ 2018 Mode of appointment No role of a broad-based committee as in NHRC, CVC, Information Commissioners Entirely at the discretion of the central government UK: CAG heading the National Audit Office appointed by House of Commons resolution after agreement between PM and chair of PAC (generally an opposition member) USA: Comptroller General heading GAO appointed by the President, ratified by the Senate Australia: ratification and confirmation by the whole Public Accounts Committee India is a member of ASOSAI and INTOSAI and should abide by their mission statement and charter so that complete independence is guaranteed Experts recommend a broad-based committee of PM, LoP in Lok Sabha and CJI for appointments like CAG, UPSC, Election Commission Who should be appointed experts: career auditors and accountants of the Indian Audit and Accounts Service (IAAS) Till date among 14 CAGs only the first three came from IAAS Of the remaining 11, 10 were retired IAS officers adverse effect on morale and motivation of IAAS officers conflict of interest: an IAS officer who served a department is asked to audit the same department as CAG post-retirement incentive for IAS officers may lead to politicisation of civil services so: encadre the post, earmarked only for IAAS members Narhari Rao first CAG K. Sanjay Murthy present (as per handout, verify) Note Single vs multi-member body: experts debate making CAG multi-member like UPSC and Election Commission. But the real problem is understaffed IAAS , not single-member form: of about 250,000 auditable entities CAG effectively audits only about 60,000 a year, so more IAAS officers, ground staff and junior officers are needed. In the USA and UK too the CAG is a single-member body, with a heavier caseload than India's; no study shows a multi-member institution performs better. Types OF Audit Audit Question it asks Compliance (legality / statutory / transactions audit) was money spent according to the financial law of the country? legal availability of money spent; was the mandated activity authorised by Parliament? Financial are proper books of accounts maintained; are recorded transactions a faithful representation of what actually took place? Performance (includes efficiency audit) e.g. number of schools set up under an amount, and their standards and facilities: efficiency of money spent. CAG does only performance audit/ reporting, not performance evaluation ; reasons for inefficiency are outside CAG's domain Propriety (from \"proper\") questions the wisdom and faithfulness of government spending; e.g. 2G spectrum on first-come-first-served, audited by then CAG Vinod Rai: Rs 1.76 lakh crore revenue loss. Need: it is taxpayers' money, not officials' own, so officials cannot be expected to show the caution they would with their own; major frauds and scams come to light only through propriety audit Memory aid · CFPP Four audits: C ompliance · F inancial · P erformance · P ropriety. The 1971 Act does not clearly state the types of audit; Sec 23 authorises CAG to define the scope of audit. (own mnemonic) Value addition Against propriety audit: benefit of hindsight: a decision may look unwise without the context in which it was made · auditors know little of administration: seasoned auditors lack experience of decisions under administrative circumstances · red tapism: fear of CAG, CVC, CBI makes officials keep files undecided · slows development . Paul Appleby (1950s, American public-administration expert): CAG oversight created fear among civil servants and delayed decisions; he even recommended abolishing the office. Way forward / key point For: CAG's role is more than tallying accounts, \"which any B.Com. graduate can do\" · supreme audit institutions worldwide do propriety audit · CAG should not be nit-picking, but if a prima facie case of fraud, impropriety, irregularity comes up, exposing it is not just his right but his duty · purpose is not fault-finding but better financial governance · instead of questioning it, streamline internal audits and respond proactively to audit queries · best potential to expose irregularities, embezzlement, bribery, fraud. Key point 2G case: 2008 licences allocated on First-Come-First-Served instead of auctions; CAG estimated a presumptive loss of up to Rs 1.76 lakh crore ; government defended low spectrum prices as promoting affordable telecom; SC 2012 quashed 122 licences and directed fresh allocation by auction; the auction raised about Rs 9,400 crore , below expectations, partly due to changing market conditions and limited bidders. CAG's jurisdiction: normally examines policy implementation, but may question policy decisions where they involve financial irregularities, wasteful expenditure or loss to the exchequer (PYQ 2016) Comptroller vs Auditor; PPPs; Local Bodies Key point Comptroller function: before public money is released, verify that the expenditure has been authorised by Parliament and approve release of funds. Key difference: UK CAG exercises pre-expenditure control; Indian CAG audits after the money has been spent. UK India Comptroller (pre-expenditure control over release of funds) performed not performed Auditor (post-expenditure) yes yes (primary role) Should CAG audit PPPs? PPP: Government-private collaboration for infrastructure (highways, airports, ports) Government gives approvals, land, support as agreed Private gives investment and expertise, develops and operates BOT: private builds and operates for a concession period, recovers investment through tolls or user fees, then transfers to government VGF: One-time or deferred government grant for economically justified but financially unviable PPP projects 2020 VGF Scheme extended to social infrastructure (health, education, water supply, waste management) question: PPPs may be largely privately financed, so what is CAG's jurisdiction? Public interest: public assets, natural resources, concessions, revenue sharing Irregularities in concession period, toll collection, revenue sharing harm public interest So PPPs may fall in CAG purview , depending on applicable law and contract, even with private financing Telecom revenue sharing: Operators pay licence fees as a percentage of Adjusted Gross Revenue (AGR) Underreporting or inadmissible deductions cut the government's share AUSPI v Union of India (2014): SC upheld CAG's authority to examine private telecom operators' accounts to verify revenue-sharing payments Note Local bodies (ULBs, PRIs): in some states CAG provides broad supervision and guidelines for local-body accounts and audit; it does not conduct audits as such ; the broad overview is accepted by state governments principally to get the conditional grants recommended by the Finance Commission . WHY CAG IS WEAK: THE Famous Quote \"CAG is a ...\" Meaning prosecutor with a law that hobbles his functioning law does not clearly indicate the audits he is to perform; does not give adequate powers to obtain documents from government; audit queries are not answered properly, yet law gives no power to act against departmental officials who refuse; so the law itself makes him shaky judge without the power to sentence can clearly indicate a case of financial fraud but cannot punish; can only make allegations in the report to Parliament; action stays at the government's discretion ; can establish guilt but not pass punishment litigant without the right to appeal after his report goes to Parliament and then the PAC, he has no power to question or appeal on action taken; if Parliament and government pay no heed to his report he has no power to challenge it Way forward / key point Effectiveness of an audit depends on (1) system for evaluating CAG reports: by Parliament and PAC: adequate discussion time, members present. In the USA and UK the CAG is part of the legislative branch ; in India independent of both legislature and executive; a long-pending reform is to make CAG part of the legislature so Parliament debates reports more seriously, holding government accountable and improving financial governance. Way forward / key point (2) Quality of audit reports: under INTOSAI guidelines senior auditors from other countries review India's audit process and make recommendations (and Indian auditors go abroad): the peer review mechanism . First peer review of India's CAG in 2012 found around 50% of CAG's irregularity allegations were not backed by concrete evidence . Year PYQ (handout, marks) 2018 (10) The CAG has a very vital role to play. Explain how this is reflected in the method and terms of his appointment as well as the range of powers he can exercise. 2016 (12.5) Exercise of CAG's powers in relation to accounts of the Union and States is derived from Art 149. Discuss whether audit of the Government's policy implementation could amount to overstepping CAG's jurisdiction."}, {"c": "4", "n": "Civil Society, NGOs, FCRA, SHGs, Pressure Groups and the CAG", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Civil society is the third sector, \"fifth estate\" Excluded from civil society political parties and media Two pillars of social capital trust and reciprocity Four NGO generations relief, community, system, hybrid movement Art 19(1)(c) form associations, unions, cooperatives FCRA 1976 enacted by Indira Gandhi government Admin expenditure cap (2020) 50% → 20% Max suspension (2020) 180 → 360 days FCRA 2026 status Bill with a JPC, not yet an Act Noel Harper (2022) foreign contribution not an absolute right SHG ideal size 10-20 women SHG-BLP started NABARD, 1992 Deposit-to-credit ratio 1:4 JLG introduced NABARD, 2005-06 Kudumbashree started Kerala, 1997 Five types social, associational, institutional, ad hoc, anomie Groups vs parties groups do not contest elections Lobbying in India neither legal nor illegal Santhanam 1962 on lobbyists accredit them Khap ruling SC 2011: ban honour-killing sanction CAG article; tenure Art 148; 6 years or 65 Governing Act CAG (DPC) Act, 1971 Comptroller function UK yes; India no CAGs from IAAS first 3 of 14 Peer review 2012 finding ~50% allegations lacked evidence"}, {"c": "4", "n": "Civil Society, NGOs, FCRA, SHGs, Pressure Groups and the CAG", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts in Start Here)"}, {"c": "4", "n": "Civil Society, NGOs, FCRA, SHGs, Pressure Groups and the CAG", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards"}]</script><script>
(function(){var D=JSON.parse(document.getElementById('sdata').textContent),q=document.getElementById('q'),res=document.getElementById('res'),cnt=document.getElementById('cnt');
cnt.textContent=D.length+' sections indexed. Tables and diagrams are included as text where possible.';

function run(){var v=q.value.trim().toLowerCase();res.innerHTML='';if(v.length<2)return;var ts=v.split(/\s+/),n=0,h='';
for(var i=0;i<D.length&&n<40;i++){var d=D[i],tx=(d.t+' '+d.x).toLowerCase(),ok=ts.every(function(t){return tx.indexOf(t)>=0});if(!ok)continue;n++;
var p=tx.indexOf(ts[0]),s=Math.max(0,p-60),sn=d.x.substr(s,180);
