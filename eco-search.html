.mm-link.c0,.mm-leaf.c0{stroke:var(--c0)}.mm-link.c1,.mm-leaf.c1{stroke:var(--c1)}.mm-link.c2,.mm-leaf.c2{stroke:var(--c2)}.mm-link.c3,.mm-leaf.c3{stroke:var(--c3)}.mm-link.c4,.mm-leaf.c4{stroke:var(--c4)}.mm-link.c5,.mm-leaf.c5{stroke:var(--c5)}.mm-link.c6,.mm-leaf.c6{stroke:var(--c6)}.mm-link.c7,.mm-leaf.c7{stroke:var(--c7)}
:root:not([data-theme="dark"]) .mm-branch-t{fill:#fff}
.outline,.outline ul{list-style:none;padding-left:18px;margin:4px 0}.outline>li{padding-left:0}.outline summary{cursor:pointer;font:700 15px var(--sans)}

.ol-note{color:var(--muted);font-size:.9em}

.timeline:before{content:"";position:absolute;left:94px;top:0;bottom:0;border-left:2px solid var(--line)}
.tl{display:grid;grid-template-columns:86px 18px 1fr;gap:0 6px;margin:0 0 12px;align-items:start}

.lkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.link{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:15px/1.45 var(--sans)}.link p{margin:4px 0 0;color:var(--muted)}.lk-line{font-weight:700}
.recall{font:16px/1.55 var(--sans);padding-left:24px}.recall li{margin:6px 0}

.deck{margin:10px 0}
.fc{min-height:150px;background:var(--surface);border:2px solid var(--acc);border-radius:14px;padding:22px;display:flex;align-items:center;justify-content:center;text-align:center;font:18px/1.5 var(--serif);cursor:pointer;user-select:none}
.fc.back{background:var(--acc-soft)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.btn{font:600 14px var(--sans);padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:40px 0 20px}.pager a{display:block;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;text-decoration:none;color:var(--ink);font:600 15px var(--sans)}.pager a.nx{text-align:right}.pager small{display:block;color:var(--muted);font-weight:500;font-size:12px}

.chn{font:700 18px var(--mono);color:var(--acc);text-align:center}.cht b{font:700 16px var(--serif);display:block}.cht small{font:13px/1.4 var(--sans);color:var(--muted);display:block;margin-top:2px}

code{font:.88em var(--mono);background:var(--surface2);padding:1px 5px;border-radius:4px}

/* ---- reader app ---- */
:root{--zoom:1;--lh:1.65;--pw:780px}
:root[data-theme="sepia"]{--bg:#F4ECD8;--surface:#FBF5E6;--surface2:#EADFC4;--ink:#3B3022;--muted:#7A6A52;--line:#D8C9A6;--acc:#7A4A12;--acc-ink:#fff;--acc-soft:#EFDDB8;--saf:#A4470A;--saf-soft:#F6E2BE;--red:#9C2A1C;--red-soft:#F3D9CB;--blue:#2F5C8A;--blue-soft:#DDE6E4;--good:#3E6B2A;--good-soft:#DDE8C8;--hl:#F2D98A;color-scheme:light}
:root[data-font="sans"] body{font-family:var(--sans)}
:root[data-font="sans"] .notes p,:root[data-font="sans"] .notes li{font-family:var(--sans)}
.page{zoom:var(--zoom);max-width:var(--pw)}
.notes p,.notes li{line-height:var(--lh)}
.rbar{position:fixed;left:0;top:0;height:3px;width:0;background:var(--acc);z-index:40;transition:width .15s}
.aabtn{color:var(--ink);border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:5px 12px;font:700 14px var(--serif);cursor:pointer;flex:none}
.h2read{float:right;margin:2px 0 0 10px;font:600 12px var(--sans);border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer;min-height:30px}
.h2read[aria-pressed="true"]{background:var(--acc-soft);color:var(--acc);border-color:var(--acc)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;justify-content:center}
.dock button{font:600 14px var(--sans);min-height:44px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;padding:0 14px;cursor:pointer}
.dock .mid{flex:1;max-width:520px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock .mid b{color:var(--acc)}
body.has-dock .page{padding-bottom:110px}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheetin{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:82vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));font:15px/1.4 var(--sans)}
.sheetin h3{margin:0 0 10px;font:700 17px var(--sans)}
.srow{display:flex;align-items:center;gap:10px;margin:12px 0;flex-wrap:wrap}
.srow label{flex:0 0 92px;color:var(--muted);font-weight:600}
.srow .grp{display:flex;gap:6px;flex-wrap:wrap}
.srow button{font:600 14px var(--sans);min-height:42px;min-width:48px;padding:0 12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;cursor:pointer}
.srow button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.secl a{display:flex;gap:10px;align-items:center;padding:12px 6px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;min-height:44px}
.secl a .tk{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--acc-ink)}
.secl a.rd .tk{background:var(--acc);border-color:var(--acc)}
.secl a.cur{background:var(--acc-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:50;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;font:600 14px var(--sans);max-width:92vw;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.toast button{font:700 14px var(--sans);background:transparent;border:0;color:var(--bg);text-decoration:underline;cursor:pointer;min-height:36px}
body.focus .bar{display:none}body.focus .sidetoc{display:none}
figcaption.clamp{max-height:3.3em;overflow:hidden;position:relative;cursor:pointer}

</style></head><body><header class="bar"><div class="barin"><a class="home" href="index.html">Library</a><a class="home" href="eco-home.html">Contents</a><span class="bartitle"><b></b> Search</span><a class="home" href="eco-search.html">Search</a><a class="home" href="eco-timeline.html">Timeline</a><button class="themebtn" id="themebtn" type="button" aria-label="Change theme">Theme</button></div></header><main class="page"><div class="chead"><div class="eyebrow">Economy notebook</div><h1>Search</h1><p class="lede">Search every section of the written chapters.</p></div><input class="sbox" id="q" type="search" placeholder="Try: Tendulkar, Gini, PPP, MPI, trickle-down" autocomplete="off"><div class="count" id="cnt"></div><div class="results" id="res"></div></main><script type="application/json" id="idx">[{"ch": 0, "cht": "Start Here: How to Use This Notebook", "id": "1-what-this-notebook-is", "t": "1 · What this notebook is", "x": "This is your Economy notebook, built the same way as Modern Indian History. Each chapter keeps the handout facts, rewritten clearly, and adds an **exam lens,** tables, redrawn flows, a timeline, traps, a recall sheet, a quiz, mains skeletons and flashcards. Everything comes **only from your merged Economy PDF** (Sarrthi IAS, GS Foundation, material by Aditya Kalia). Your merged PDF (415 pages, 14 files) holds **handouts and two class slide decks.** I looked at every slide image. The **External Sector slides (Chapter 10)** carry one piece of ink: **pink ovals and a star around 2020-21 Q1 and Q2** on the BoP chart (the reason is not written). The **Budget slides (Chapter 12)** are typed with **no handwriting.** The handouts carry no teacher ink. The GST handout (Chapter 11) has the teacher's **handwritten worked examples** inside the handout. So the orange \"Teacher's board\" boxes in most chapters quote the **handout's own emphasis** (asterisks, repeated points, \"Crucial Trap\" boxes), and the PYQ table says \"none quoted in the material\" wherever the file has none. Nothing is guessed from outside."}, {"ch": 0, "cht": "Start Here: How to Use This Notebook", "id": "2-the-box-colours", "t": "2 · The box colours", "x": "In Modern India this is the teacher's handwriting. Here it marks a point the handout itself stresses (asterisks, \"important note\", formulas). A conflict, a trap or a garbled place in the source, with a rule for the exam hall. Examples: $4.20 versus $3.65 for the lower-middle-income line. A definition or a pointer the handout gives. A worked example from the handout (PPP factor, MPI). What to prepare for Prelims and Mains."}, {"ch": 0, "cht": "Start Here: How to Use This Notebook", "id": "3-how-to-study-a-chapter", "t": "3 · How to study a chapter", "x": "Read the **Exam lens** first (two minutes). It tells you what the handout stresses and what to prepare. Skim the **Chapter map,** then read the sections. Tap **Mark read** or just scroll; the shelf tracks progress. Read the **red alerts** twice. They are where marks are lost. Do the **Quick quiz,** then the **mains skeletons** on a blank page, then **flashcards** on your phone. Revise with the **recall sheet** at +1, +3, +7, +21 and +45 days."}, {"ch": 0, "cht": "Start Here: How to Use This Notebook", "id": "4-your-merged-pdf-which-file-feeds-which-chapter", "t": "4 · Your merged PDF: which file feeds which chapter", "x": "The 14 files in Merged_Economy_14_PDFs.pdf (page numbers are PDF pages) # File PDF pages Type PYQs in the file Status 1 Poverty & Inequality (Ch 1 Poverty, Ch 2 Inequality) 1-36 Handout None **Written: Chapters 1 and 2** 2 Unemployment 37-71 Handout **Yes: 10 Prelims PYQs** (years quoted 2011, 2012, 2013, 2017, 2018, 2020, 2021, 2022) **Written: Chapter 3** 3 Basic Concepts of Economics 73-92 Handout 1 Prelims PYQ (2021) **Written: Chapter 4** 4 National Income Accounting 93-129 Handout 3 Prelims PYQs (2018, 2015, 2015) **Written: Chapter 5** 5 Inflation 131-146 Handout None quoted **Written: Chapter 6** 6 Banking and g, compensation, RNR none quoted in the material none quoted in the material **High:** definition, Articles, Council, outside GST, compensation 12 · Budget and Fiscal Policy Handout “Ultimate Prelims Trap” (PMFBY) and “Crucial Trap” (external debt); slides typed none quoted in the material none quoted in the material **Highest by volume:** deficits, FRBM, debt, Finance Commission, tax types, buoyancy 13 · NABARD, NBFCs, chit funds Handout emphasis on dates, thresholds and regulators none quoted in the material none quoted in the material **Medium:** NABARD facts, NBFC types, who regulates what Only Chapters 3, 4 and 5 quote any PYQ. For the other ten chapters, priority comes from the handout’s own emphasis, not from exam history. The rating in the last column is my reading of how much of each handout is numbers, definitions and flagged traps; it is a guide, not an exam forecast. **NBFC size:** Chapter 13 says systemically important = ₹500 crore (older RBI FAQ); Chapter 7 uses the 2022 scale-based layers (Base Layer below ₹1,000 crore). **GST rates and RNR:** Chapter 11 lists the five slabs (0, 5, 12, 18, 28) and a 30% pre-GST illustration; Chapter 12 says GST 2.0 (August-September 2025) rationalised rates and uses 33% in its illustration. The new slabs are not in the material. **Composition scheme limit:** ₹100 lakh versus ₹75 lakh inside Chapter 11."}, {"ch": 0, "cht": "Start Here: How to Use This Notebook", "id": "6-tools-inside-the-notebook", "t": "6 · Tools inside the notebook", "x": "**Aa:** text size, width, sepia or dark theme, focus mode, keep-screen-on. **Search** and **Timeline** in the top bar. **Done** box per chapter; read marks per section; a resume prompt when you return. Offline reading: an Artifact cannot be installed for offline use. Ask for the PDF edition if you need offline or A4 print."}, {"ch": 1, "cht": "Poverty: Meaning, Measurement and India's Progress", "id": "exam-lens-priority-and-pyqs", "t": "Exam lens: priority and PYQs", "x": "**This chapter comes from the handout only.** No class slides, no teacher ink and no PYQ section came with it, so nothing here is marked by a teacher and no past-year question is quoted. PYQs quoted in the material: **none quoted in the material.** The priority below is built only from what the handout itself stresses. What the handout itself stresses Signal in the handout Where Why it matters \"Rangarajan's PL was not accepted & **Tendulkar continued to be our official PL**\" Section 4 (handout p6) The handout flags this with asterisks. A classic one-line Prelims fact. \"Understand the 'why' to know the 'how'\": poverty estimation is **for assessing progress, not for picking beneficiaries** Section 3 (p3-4) The handout repeats this twice. Mains-style reasoning. SDG 1.1 (end extreme poverty by 2030) and SDG 1.2 (halve poverty in all dimensions by 2030) Sections 6 and 9 Both targets are named with their wording. World Bank lines: $3.00, $4.20 and $8.30 a day (2021 PPP, June 2025) Sections 6 and 7 Three lines, three economic groups, three very different Indian poverty rates. National MPI: 12 indicators, 33% cut-off, MPI = H x A, NFHS-4 versus NFHS-5 Sections 9 and 10 The handout spends the most space here, with a worked example and state data. **Prelims hooks:** committee, year and what each one added (table in section 4); the World Bank line names and values; PPP versus market exchange rate; HCR versus PGI versus SPG; the 12 indicators and their dimensions; MPI = H x A; the states with the highest MPI and the biggest falls. **Mains hooks:** why measure poverty at all; absolute versus relative; why consumption not income; why a money line misses deprivation and how MPI fixes it; why the headcount ratio hides depth; why India's fast fall still leaves a \"dignity deficit\". **Closing idea:** poverty is deprivation in well-being; every measure (line, index, gap) is a normative yardstick used to judge progress, so always say which yardstick a number comes from."}, {"ch": 1, "cht": "Poverty: Meaning, Measurement and India's Progress", "id": "1-what-is-poverty-well-being-and-deprivation", "t": "1 · What is poverty? Well-being and deprivation", "x": "Everyone knows what poverty is, but defining it is harder. Is it too little income? Not reaching basic necessities? Poor health and education? Missing opportunities? The **World Bank** gives the broad answer: poverty is **inadequacy of well-being**. So the first question is what well-being is. Dimensions of well-being (the handout says the list is not exhaustive) Dimension Focus Key elements Physical Caring for your body so it works well Regular activity, balanced nutrition, sleep, proactive healthcare Emotional Understanding and managing feelings Healthy coping, managing stress, emotional intelligence Social A healthy support network Meaningful relationships, community participation, belonging Financial Stability and peace of mind about material resources Income balanced with spending, assets and savings, planning. Financial stress ranks as a top source of anxiety Intellectual Creative and mentally stimulating activity Continuous learning, new hobbies, problem-solving Spiritual Meaning and purpose Living by core values, purpose, mindfulness (religion, meditation or nature) Environmental The effect of your surroundings on health Safe, organised spaces, time in nature, sustainable living **Poverty is pronounced deprivation in well-being, and comprises many dimensions.** It includes low incomes and the inability to acquire the basic goods and services needed for survival with dignity. It also covers low levels of health and education, poor access to clean water and sanitation, inadequate physical security, lack of voice, and insufficient capacity and opportunity to better one's life. In general, poverty is the state of not having enough material possessions or income for basic needs. It can have **social, economic and political** elements. It includes lack of income for basic facilities, lack of healthcare, education, drinking water and sanitation, lack of physical and social security, and lack of opportunities to improve one's life."}, {"ch": 1, "cht": "Poverty: Meaning, Measurement and India's Progress", "id": "2-two-ways-to-assess-poverty-absolute-and-relati", "t": "2 · Two ways to assess poverty: absolute and relative", "x": " Absolute poverty Relative poverty Basis A standard criterion used to separate poor from non-poor Comparison with others Who decides Experts suggest a **normative** criterion (their opinion), so it is also called **normative poverty** Mean or median income of the population, or another person or group Example Cannot afford the expert's basket of goods A person is relatively poor if income is below the population average Link A person who is not poor by the absolute standard may still be poor relative to others **Relative poverty is a reflection of inequality**"}, {"ch": 1, "cht": "Poverty: Meaning, Measurement and India's Progress", "id": "3-why-measure-poverty-understand-the-why-to-know", "t": "3 · Why measure poverty? Understand the \"why\" to know the \"how\"", "x": "The poor must be identified so that they can get benefits from anti-poverty programmes. Each scheme has its own beneficiary criteria, and the aim is to minimise two errors: **Exclusion error:** a deserving person is left out of the list. **Inclusion error:** an undeserving person is put on the list. There is a **trade-off** between the two, so governments try to **minimise exclusion errors first.** Technology helps: the **JAM trinity** (Jan Dhan accounts, Aadhaar-based identification, Mobile for instant communication). The trade-off will always remain. Counting everyone on all beneficiary lists does not give the number of poor. At best it is an estimate of **beneficiaries.** The lists are hard to revise and only grow, since few people give up benefits when they become better off. **So we do not, cannot and should not estimate poverty by counting unique beneficiaries.** The real purpose of poverty measurement is **not** identification for benefits. It is to **assess the progress of the country**: is the money spent on schemes improving people's standard of living and well-being? For that we need a normative standard, a milestone, and we ask how many were below it then and how many are below it now. It also allows a fair comparison across regions, for example across states. 1 · Lay down a standard This is the poverty line (PL) 2 · Build a representative sample It must have the diversity of the population in similar proportions 3 · Collect information relevant to the standard From the sample 4 · Apply the standard Find the share below it. If the sample is representative, extrapolate to the population Result: poverty ratio = head count ratio (HCR) The proportion below the line in the whole population Example: if 20% of a representative sample is below the PL, the population is assumed to have around 20% below the line. **This is an estimate, not a count.** The handout calls poverty estimation \"a purely academic exercise\". The poor have nothing to do with it and may not even know the criteria, since it has no bearing on their well-being. It is a tool to judge success in improving well-being. Standard estimates come from **NSSO** through the **Household Consumption Expenditure Survey (HCES).** Poverty is assessed on **consumption expenditure (CE), not income,** because income is less truthfully revealed and more volatile."}, {"ch": 1, "cht": "Poverty: Meaning, Measurement and India's Progress", "id": "4-the-poverty-line-basket-and-the-committees", "t": "4 · The poverty line basket and the committees", "x": "An expert builds a poverty line by constructing a **poverty line basket (PLB):** the goods and services the expert thinks must be consumed to live a life of basic dignity. Not being able to afford the basket means pronounced deprivation. The PLB is **normative:** experts differ, and an expert's view can change as living standards improve. The idea stays the same: everybody should be able to afford some basket of goods and services (G&S) for a life of basic dignity. The price of the basket is collected from the relevant market, and its total value becomes a **consumption-based poverty line.** **Before independence,** scientific efforts to measure poverty were made by **Dadabhai Naoroji** (\"Poverty & Un-British Rule in India\", 1906), the **National Planning Committee (1938)** and the **Bombay Plan (1944)**, among others. **After independence** the Planning Commission was given the job and, from the 1970s, set up expert committees. Evolution of the poverty line in India Committee What it added Detail **Dandekar and Rath (1971)** Laid the foundation of a **calorie-based** PL Poverty = inability to get a minimum of **2250 calories** per person per day. The PLB had food and non-food parts. **YK Alagh (1979)** Split the PL into **rural and urban** Minimum energy **2400 (rural) versus 2100 (urban)** calories. Baskets reflected different consumption patterns, with prices from relevant markets. **Lakdawala (1993)** **State-specific** PLs Reflected differences in consumption pattern and prices across states. Calorie requirement kept the same. Suggested updating the PL with a relevant **inflation index.** **Tendulkar (2009)** Added **health, education, drinking water and sanitation** Earlier committees assumed the government paid for these on behalf of the poor, so they had minimal or no value in the PL. Tendulkar observed HCES data and added normative expenses on them. Still calorie-based, but the non-food part grew, so **the PL rose.** **Rangarajan (2014)** Added a **behavioural** component Counted actual spending on items like alcohol, tobacco, entertainment, behavioural health and education, since the poor do spend on them. Rangarajan's basket in three parts Part Contents Normative: food Based on **ICMRguidelines** (calories, fat, protein) for the age-sex mix of an average household of **5** (for example grandmother, parents, 2 children) Normative: non-food Housing, clothing, transport, health, education and so on Behavioural Alcohol, tobacco, behavioural health and education and so on **Rangarajan's PL was not accepted and Tendulkar continued to be our official PL.** To improve data accuracy, Tendulkar and then Rangarajan suggested that NSSO use **multiple recall periods** for items with different frequencies of consumption. URP · uniform recall period MRP · mixed recall period MMRP · modified mixed recall period Today's method: 7-day or 30-day recall for frequently consumed items, 365 days for less frequent items"}, {"ch": 1, "cht": "Poverty: Meaning, Measurement and India's Progress", "id": "5-india-s-progress-on-reducing-poverty", "t": "5 · India's progress on reducing poverty", "x": "The handout uses the Tendulkar line to compare progress since Independence and splits the period into two phases. Phase What happened The arithmetic in the handout **Slow reduction (before 2000s)** HCR fell from about **65% in 1951** to about **45% in 1993** About 20 percentage points (pp) in about 45 years = **0.44 pp a year.** The number of poor still rose because population grew faster. Compare China. **Fast reduction (after 2000s)** Growth almost doubled, from **3.5% to 6.5%.** HCR was about **22% in 2012** A fall of about 23 pp (45 to 22) in 20 years = **1.15 pp a year, thrice the earlier pace.** **Latest (HCES 2023-24)** HCR about **1%** Almost **2 pp a year** over the last decade, so the pace has been exceptionally rapid. The handout quotes several poverty rates for the same years because each uses a different yardstick. **Always name the yardstick.** Yardstick Year Figure Where Tendulkar line (HCR) 2012 Around **22%** Section 5 India's latest national line (announced 2014) 2011-12 Nearly **30%** (the handout adds \"or at least a third\": the wording is loose) Section 6 World Bank extreme poverty line ($3, 2021 PPP) 2011-12 **27.1%** Summary, section 11 World Bank extreme poverty line ($3, 2021 PPP) 2022-23 **5.3%** Sections 7 and 11 HCES latest (Tendulkar-based comparison) 2023-24 Around **1%** Section 5 Because of population growth, the **absolute number** of poor in India rose until the 2000s to around **530 million** and then fell sharply. The handout explains that the 1970s saw the fastest population growth since Independence, with low economic growth at the same time."}, {"ch": 1, "cht": "Poverty: Meaning, Measurement and India's Progress", "id": "6-world-bank-poverty-lines-ppp-and-how-india-s-r", "t": "6 · World Bank poverty lines, PPP and how India's rate is computed", "x": "The World Bank uses **group-specific** poverty lines based on **GNI per capita.** The line for **low-income countries (LIC)** is the **Extreme** or **International Poverty Line (EPL or IPL).** A person in a non-LIC who spends below the line would be poor not only at home but in an LIC as well. So the IPL is the basis of development goals: under **SDG 1.1** countries must **eliminate extreme poverty by 2030.** The three lines (June 2025, 2021 PPP) Line How it is set Value per person per day In rupees (handout) **International Poverty Line (extreme)** Median of national lines of **low-income** countries **$3.00** About **₹60** (₹62 in the summary, at PPP 20.6) **LMIC line** Median of national lines of **lower-middle-income** countries. India is in this group **$4.20** About **₹84** **UMIC line** Median of national lines of **upper-middle-income** countries (for example China, Mexico, Indonesia, South Africa) **$8.30** Not given Purchasing power parity (PPP) PPP is a theory that tries to equate the purchasing power of a sum of money at one place with the amount needed to buy the same goods elsewhere. **Example in the handout:** apples at ₹100/kg in India and $5/kg in the US mean ₹100 has the same purchasing power as $5. PPPs are **rates of currency conversion** that equalise purchasing power by removing price-level differences between countries. Why it is needed: in 2023 GDP per capita was about **205,000 rupees** in India, **89,000 yuan** in China and **83,000 dollars** in the US. In local currency these say nothing about how they compare. PPP adjusts for the higher cost of living in some countries. Market exchange rates do not help: US$1 may convert to Rs 90 in the market, but something costing $1 in the US cannot be bought at Rs 90 in India. A basket of daily needs costs **$100 in the US** and **Rs 2000 in India.** With the dollar as benchmark ($1 PPP = US$1), what $1 buys in the US can be bought for **Rs 20** in India. So the **PPP conversion factor for India is 20**, different from the market exchange rate. How the World Bank estimates poverty ICP builds PPPs The International Comparison Programme prices a pre-defined basket in each country, with the US dollar as base currency. Latest PPPs: **2021** Draw the global lines Median of national poverty lines, converted into PPP terms. The Bank began measuring in the 1980s; first global line: **$1 a day in 1990** Take a household survey near the PPP base year Income or consumption survey of the country Deflate or inflate to 2021 prices Use each country's consumer price index, so surveys done in different years are comparable Convert to PPP dollars and apply the line Share below the line = poverty rate (headcount ratio) How India's rate is calculated India built national lines several times from the 1970s to the 2010s. The latest was announced in **2014** and applied to **2011-12** data: nearly 30% poor. **Since 2014 India has had no poverty line,** so the World Bank's current global lines are computed without an Indian line. The Bank still estimates India's rate with its international lines. NSO ran a nationally representative **HCES in 2022-23 after an 11-year gap.** It records all monetary spending on domestic consumption and values the **subsidised goods** consumed. The Bank converted the cost of the pre-defined basket (the \"welfare aggregate\") from survey-time prices to **2021 prices** using India's CPI, expressed it in a common currency with **2021 PPPs**, got the distribution of households by PPP-adjusted real consumption, and applied the global lines."}, {"ch": 1, "cht": "Poverty: Meaning, Measurement and India's Progress", "id": "7-what-the-world-bank-says-about-india-latest-es", "t": "7 · What the World Bank says about India (latest estimates)", "x": "The Bank estimates India's poverty fell from **one in two people in the 1970s to one in twenty by 2022.** (The handout heads this part \"Dec 2025 estimates\"; the lines themselves are the June 2025 ones.) India at each line Line Share of India poor Number Remark **$3.00 (extreme)** **5.3%** (one in twenty) About **75 million** in 2022 More than a quarter were in extreme poverty in 2011; the majority in 1977. Fastest fall after 2004. **$4.20 (LMIC)** **24%** in 2022 (nearly one in four) Close to **350 million** Seen as the more appropriate line for India, a lower-middle-income country. **$8.30 (UMIC)** More than **80%** (four in five) A little over **1.15 billion** Only about one in five in China and Viet Nam. India compared with others Extreme poverty: **world 10.8%, India 5.3%.** This is the **first time India is below the global average.** Bangladesh is similar (5.9%). **China and Viet Nam have eradicated extreme poverty.** At the LMIC line, India's rate is **still higher than the world average.** India's fall in extreme poverty was **slower than China and Viet Nam, faster than Nigeria and Kenya.** China's rates were higher than India's until the 2000s. By **2020** it had ended extreme poverty and lifted the whole country above the LMIC line. Global extreme poverty is concentrated in **Sub-Saharan Africa;** South Asia holds a large share of the poor when measured at middle-income lines. India's share of the world's extreme poor fell from **27% in the 2000s to about 9% in 2022.** Before the 2000s India had more poor than Sub-Saharan Africa. The message: few Indians are in extreme poverty now, but most of the rest are **not very rich either** and live in conditions that would count as poverty in middle-income countries. **LMIC line:** section 7 says **$4.20** (2021 PPP, about ₹84), but the summary at the end says \"lower-middle-income benchmark **$3.65**/day\". Use **$4.20**: it is stated with the date, PPP year and rupee value. Check your notebook for $3.65. **IPL in rupees:** about **₹60** in section 7 and about **₹62** in the summary (PPP 20.6 x $3). Say \"about ₹60-62 a day\". **Rule for the exam hall:** quote the dollar value and PPP year, and avoid committing to a rupee figure unless asked."}, {"ch": 1, "cht": "Poverty: Meaning, Measurement and India's Progress", "id": "8-why-a-money-line-is-not-enough-multidimensiona", "t": "8 · Why a money line is not enough: multidimensional poverty", "x": "The conventional approach (consumption-based lines) does include deprivation, but it checks it through the **ability to spend** a normative amount. So deprivation is judged in money terms. A person may be able to spend on necessities and still be deprived because those necessities are **not regularly available or accessible.** Such deprivation is assessed **directly and explicitly** through **multidimensional poverty.** The **standard (global) MPI** was proposed by **OPHI (Oxford Poverty & Human Development Initiative)** to **UNDP**, which publishes the global MPI report. It looks at **three dimensions: health, education and standard of living,** using **10 indicators,** each with a deprivation criterion (malnourishment, mortality, attendance, drinking water, cooking fuel and so on). Each criterion links to an SDG. Example: a household is deprived of cooking fuel if it uses solid fuel such as tree bark or cow dung and has no modern fuel such as LPG or kerosene. A household deprived on **3 or more of the 10 indicators** is multidimensionally poor (as the handout states for the global version). The **MPI was developed by Sabina Alkire and James Foster** and adopted by UNDP in its Human Development Report in **2010.** It captures overlapping deprivations in health, education and living standards."}, {"ch": 1, "cht": "Poverty: Meaning, Measurement and India's Progress", "id": "9-india-s-national-mpi-method-indicators-and-the", "t": "9 · India's National MPI: method, indicators and the worked example", "x": "NITI Aayog, with **UNDP and OPHI,** developed the **National MPI.** It complements income poverty by measuring deprivations directly, and can monitor poverty at **national, state and district** levels. It contributes to **SDG target 1.2:** reduce **at least by half** the proportion of men, women and children of all ages living in poverty in all its dimensions according to national definitions, **by 2030.** The **Progress Review 2023** gives estimates for **36 States and UTs and 707 administrative districts** on **12 indicators,** from **NFHS-5 (2019-21),** and changes since **NFHS-4 (2015-16).** It gives both **how many are poor (headcount)** and **how poor the poor are (intensity).** **Method:** the **dual-cutoff approach of Alkire-Foster (AF)**, as in the Global MPI. India kept the **10** global indicators and added **2:** **Maternal Health** (in Health) and **Bank Account** (in Standard of Living). Indicators and their weights: Health 1/3 (Nutrition 1/6, Child and Adolescent Mortality 1/12, Maternal Health 1/12); Education 1/3 (Years of Schooling 1/6, School Attendance 1/6); Standard of Living 1/3 (Cooking Fuel, Sanitation, Drinking Water, Housing, Electricity, Assets, Bank Account, 1/21 each). 1 · Deprivation profile Each household gets a deprivation score from its deprivations in the 12 indicators 2 · Identify the poor If the household's deprivation score is **above 33%,** it is multidimensionally poor 3a · Headcount ratio (H): how many are poor? Multidimensionally poor persons divided by total population 3b · Intensity (A): how poor are the poor? Sum of weighted deprivation scores of all the poor divided by the number of poor people MPI = H x A Headcount ratio multiplied by intensity of poverty Worked example from the handout: three households (HH1 with 7 members and deprivation score 72.8%, HH2 with 5 members and 52.6%, HH3 with 4 members and 21.4%). HH3 is not poor (score below 33%). H = (7+5)/(7+5+4) = 12/16 = 0.75. A = (7 x 0.728 + 5 x 0.526)/12 = 0.64. MPI = 0.75 x 0.64 = 0.48. Only **persons in poor households** count in H, so HH3's 4 members stay out. **A** averages the scores of the poor only (12 people), weighted by household size. So **75% of individuals are MPI poor and, on average, each is deprived in 64% of the weighted indicators.** The 12 indicators and their deprivation definitions Dimension Indicator A household is deprived if... Health 1 · Nutrition any child (0-59 months), woman (15-49 years) or man (15-54 years) with nutrition information is undernourished Health 2 · Child-adolescent mortality any child or adolescent under 18 died in the household in the five years before the survey Health 3 · Maternal health any woman who gave birth in the last 5 years did not get at least **4 antenatal visits** for the latest birth, or no trained skilled help at the latest childbirth Education 4 · Years of schooling no member aged **10 or above** has completed **six years** of schooling Education 5 · School attendance any school-aged child is not attending school up to the age at which he or she would complete class (the handout text is cut off here) Standard of living 6 · Cooking fuel cooks with dung, agricultural crops, shrubs, wood, charcoal or coal Standard of living 7 · Sanitation unimproved or no sanitation facility, or improved but **shared** with other households Standard of living 8 · Drinking water no improved or safe drinking water, or safe water is at least a **30-minute walk** (round trip) Standard of living 9 · Housing floor of natural materials, or roof or wall of rudimentary materials Standard of living 10 · Electricity no electricity Standard of living 11 · Assets does not own more than one of radio, TV, telephone, computer, animal cart, bicycle, motorbike, refrigerator, and does not own a car or truck Standard of living 12 · Bank account no household member has a bank or post office account The handout says the **global** MPI treats a household as poor if deprived on **3 or more of 10 indicators,** and the **national** MPI uses a deprivation score **above 33%** on **12 indicators.** Do not mix them up. **Rule for the exam hall:** \"33%, 12 indicators\" means India's National MPI; \"10 indicators\" means the global MPI. Both have 3 dimensions. Why MPI helps (handout conclusion) Benefit Meaning Complements money statistics Shows non-monetary deprivation directly Monitors single indicators and dimensions Overlaps with several SDGs Breaks down by state and district Better policy focus Enables integrated policy Cross-sectoral action"}, {"ch": 1, "cht": "Poverty: Meaning, Measurement and India's Progress", "id": "10-india-s-progress-on-multidimensional-poverty", "t": "10 · India's progress on multidimensional poverty (NFHS-4 to NFHS-5)", "x": "Handout infographic: poverty headcount ratio fell from 24.85% (2015-16) to 14.96% (2019-21); 135 million (13.5 crore) escaped multidimensional poverty; India on track for SDG target 1.2; all 12 indicators improved; fastest fall in rural areas (32.59% to 19.28%); urban 8.65% to 5.27%; intensity 47.14% to 44.39%; UP, Bihar, MP, Odisha and Rajasthan had the steepest fall in number of MPI poor. National figures Survey MPI Headcount ratio (H) Intensity (A) **NFHS-5 (2019-21)** **0.066** **14.96%** **44.39%** **NFHS-4 (2015-16)** **0.117** **24.85%** **47.14%** Rural and urban Survey Rural MPI Rural H Rural A Urban MPI Urban H Urban A **NFHS-5 (2019-21)** 0.085 19.28% 44.55% 0.023 5.27% 43.10% **NFHS-4 (2015-16)** 0.154 32.59% 47.38% 0.039 8.65% 45.27% **135 million** people escaped multidimensional poverty in the five years. India is on track for **SDG 1.2** (halve poverty in all forms by 2030). The **MPI value nearly halved** (0.117 to 0.066). Intensity fell from about 47.14% to 44.39%. Rural-urban gap remains (**19.28% rural versus 5.27% urban in 2021**), but the fall was **pro-poor in absolute terms:** rural areas saw the fastest fall. All **12 indicators** improved, with statistically significant reductions. **Biggest falls: sanitation (21.8 pp) and cooking fuel (14.6 pp).** Highest headcount: **Bihar 33.76%, then Jharkhand 28.81%.** Biggest fall in incidence: **Bihar (18.13 pp), Madhya Pradesh (15.94 pp), Uttar Pradesh (14.75 pp).** District-level estimates let governments and organisations see specific challenges and target interventions. Percentage of India's population deprived in each of the 12 indicators, NFHS-4 (2015-16) versus NFHS-5 (2019-21). Lower is better. Cooking fuel and sanitation show the biggest drops. State and UT maps of the MPI score for NFHS-4 and NFHS-5: green is a low score (less poverty), red is a high score. The colours move from red towards green between the two rounds. Headcount ratio by state and UT, NFHS-5 versus NFHS-4. Bihar and Jharkhand are highest; Kerala, Goa and Sikkim are among the lowest. Policy push behind the fall The handout credits investment in education, nutrition, water, sanitation, cooking fuel, electricity and housing. Schemes named: **Swachh Bharat Mission (SBM), Jal Jeevan Mission (JJM), Poshan Abhiyan, Samagra Shiksha, Saubhagya (PM Sahaj Bijli Har Ghar Yojana), PM Ujjwala Yojana (PMUY), PM Jan Dhan Yojana (PMJDY), PM Awas Yojana (PMAY).** Several **MPICC meetings** were held after the baseline report to prepare **Reform Action Plans.** **More than 50 reform actions in 16 reform areas** (nutrition, financial inclusion, education, rural development, housing and more) were identified. The second edition of the National MPI helps states track hotspots down to the district level. NITI Aayog supports states in making reform plans."}, {"ch": 1, "cht": "Poverty: Meaning, Measurement and India's Progress", "id": "11-summary-of-india-s-progress-and-what-is-still", "t": "11 · Summary of India's progress and what is still missing", "x": "This part of the handout restates the lines: IPL raised **from $2.15 a day (2017 PPP) to $3.00 (2021 PPP);** a lower-middle-income benchmark of **$3.65** (conflicts with the $4.20 above, see section 7); PPP about **20.6** in 2025 so $3 is about **₹62.** It also says much of the **upward revision is due to changes in the underlying national poverty lines,** not just price inflation. Key triumphs: a decade of decline Measure Then Now Extreme poverty rate (national) **27.1%** (2011-12) **5.3%** (2022-23) Rural extreme poverty 18.4% 2.8% Urban extreme poverty 10.7% 1.1% Rural-urban gap 7.7 pp **1.7 pp** Multidimensional poverty (12-indicator NITI index) **55.34%** (2005-06) **14.96%** (2019-21) Consumption-based Gini **28.8** (2011-12) **25.5** (2022-23) **Five populous states** (UP, Maharashtra, Bihar, West Bengal, MP) held **65%** of India's extreme poor in 2011-12 and drove **two-thirds** of the national fall. **Drivers:** Jan Dhan, PM Kisan Samman Nidhi, and foodgrain distribution to **80 crore** people. Methodology also changed with the 2022-23 consumption survey (better tracking of food and non-food spending). Persistent challenges (the \"dignity deficit\" and more) Challenge Figure in the handout Dignity deficit ₹62 ($3) a day is widely seen as too little for a life with dignity. One litre of Amul milk cost **₹63 in 2022.** Income inequality (2023-24) Median earnings of the **top 10% are 13 times** those of the bottom 10% Gender gap in jobs **234 million more men** than women in paid jobs Youth unemployment **13.3%,** rising to **29%** for graduates with tertiary education Global Hunger Index Rank **105**, with **35.5% stunting** and **18.7% child wasting** World Happiness Report Rank **118** Inequality and human development India loses **over 30%** of its HDI score to inequality"}, {"ch": 1, "cht": "Poverty: Meaning, Measurement and India's Progress", "id": "12-depth-and-severity-of-poverty-hcr-pgi-and-spg", "t": "12 · Depth and severity of poverty: HCR, PGI and SPG", "x": "The headcount ratio counts the share below the line, but it has a flaw: **it treats all poor people equally.** It cannot tell someone ₹1 below the line from someone with zero income. To see how poor the poor are, economists use **depth and severity.** These were developed in **1984** by **James Foster, Joel Greer and Erik Thorbecke,** so they are called the **FGT class** of poverty measures (specifically **FGT1 and FGT2**). The World Bank and the UN adopted them as standard tools. Governments use them to work out how much cash transfer programmes need and to check whether growth reaches the poorest. Poverty Gap Index (PGI): depth Squared Poverty Gap (SPG): severity What it measures The **average shortfall** of the population from the poverty line Severity of poverty, and **inequality among the poor** How it works Distance between a poor person's income and the line, as a **percentage of the line.** Non-poor count as gap **zero** Take each person's poverty gap, **square it,** then average across the population Why it is useful Gives the **minimum cost of eliminating poverty:** PGI x poverty line x total population = money to lift every poor person exactly to the line (with perfectly targeted transfers) Squaring puts **more weight on larger gaps,** so society is penalised for people far below the line. It forces focus on the **\"poorest of the poor\"** Limit Ignores inequality among the poor. Two districts can have the same PGI, one with extreme destitutes and the other with people just below the line Drops sharply only when programmes reach the most deeply destitute. Helping only those near the line improves the HCR but barely moves the SPG The handout calls the SPG \"**the Sen index,** named after Prof. Amartya Sen\" in the same passage that labels it **FGT2.** If a question asks for \"Sen index\", link it to the squared poverty gap as the handout does, and check your class notes for any difference. Next, the handout turns to **inequality** to understand the relative side of poverty. See [Chapter 2](eco-ch02.html)."}, {"ch": 2, "cht": "Inequality: Measures, Causes and Growth Models", "id": "exam-lens-priority-and-pyqs", "t": "Exam lens: priority and PYQs", "x": "**This chapter comes from the handout only.** No class slides, no teacher ink and no PYQ section came with it. PYQs quoted in the material: **none quoted in the material.** What the handout itself stresses Signal in the handout Where Why it matters Kuznets curve is \"**not a data-based curve,** merely a theoretical expectation\"; Lorenz curve **is** data-based Section 2 A clean statement trap: theory versus data. Gini ranges 0 (perfect equality) to 1 (perfect inequality); a higher Gini means more inequality. **Four shortcomings** listed Section 4 The handout gives each with \"The Concept\" and \"The Explanation\". Modern reasoning: it is about the **nature** of inequality, and the **rule of law** decides it Section 5 A Mains theme. The handout stresses that rule of law is more than a law. **Trickle-down works only if four conditions hold;** inclusive growth rests on **capability and opportunity** Sections 7-8 A compare-and-contrast Mains question. The handout says the two are \"essentially the same\" with different emphasis. Skill and inclusion readings named: National Skill Development Programme, PMKVY, Jan Dhan, Mudra, Economic Survey 2025-26 Section 8 The handout points to these for further reading. **Prelims hooks:** Kuznets versus Lorenz; the Lorenz plotting steps and what the equality line OP and the line QP mean; the Gini formula and range; the four Gini shortcomings; the four conditions for trickle-down; the two pillars of inclusive growth. **Mains hooks:** causes of inequality (natural, Marxist, modern); why growth causes inequality; why trickle-down fails; why inclusive growth is about claim, not charity; the rule-of-law argument. **Closing idea:** some inequality comes with growth, but its kind decides the outcome. Good inequality (earned by fair means under rule of law) is tolerable; bad inequality (from connections and weak law) hurts everyone."}, {"ch": 2, "cht": "Inequality: Measures, Causes and Growth Models", "id": "1-what-is-inequality", "t": "1 · What is inequality?", "x": "**Inequality is differences in the degree of attainment on various aspects of well-being.** Example: one person lives where there is one hospital per 5 km² and another where there are two. Neither is probably facing pronounced deprivation, but the second's attainment is better than the first's. That is inequality. (Poverty is about a floor; inequality is about differences above it.) It can be economic, social or political, but it is generally **measured through economic differences:** income, expenditure and wealth. Like poverty, the preferred method is **consumption expenditure (CE).** Inequality measured through **wealth** is generally higher. But wealth and income are less truthfully revealed and highly volatile, so **CE-based inequality, even though lower, is generally the most objective.** The government generally measures **consumption inequality** because it lacks verifiable, regularly collected data on other measures."}, {"ch": 2, "cht": "Inequality: Measures, Causes and Growth Models", "id": "2-kuznets-curve-a-theory", "t": "2 · Kuznets curve: a theory", "x": "The Kuznets curve is a **theoretical prediction** about how inequality relates to incomes in a society over time. Kuznets predicts that **as incomes rise, inequality first rises** (incomes of some grow faster than others), then **stabilises,** and eventually **corrects.** Hand-drawn Kuznets curve: inequality on the vertical axis, income on the horizontal axis. An inverted U with three phases marked A, B and C. It is **not a data-based curve,** only a theoretical expectation. The phases **A, B, C are not necessarily of equal or proportional lengths.** The handout gives the shape as rise, stabilise, correct. It labels the phases A, B, C on the sketch but does not define each one separately. **Rule for the exam hall:** call it a theoretical, inverted-U expectation, never a measured curve."}, {"ch": 2, "cht": "Inequality: Measures, Causes and Growth Models", "id": "3-lorenz-curve-a-data-based-picture", "t": "3 · Lorenz curve: a data-based picture", "x": "The Lorenz curve (LC) is a **data-based representation** of existing inequality in income, CE or wealth. 1 · Collect data Income, CE or wealth, from the population or a sample 2 · Sort it Generally in descending order (the handout's wording) 3 · Divide into equal-sized groups For example 5 groups of 20% of the population 4 · Find each group's share Total income of the group, hence its share in total income 5 · Plot cumulative shares Example: bottom 20% have 3%, next 20% have 7%, so bottom 40% have a cumulative 10%. Join the points Lorenz curve of income distribution. The diagonal is the line of perfect equality. Points: bottom 20% earn 3% cumulative, bottom 40% earn 10%, bottom 60% earn 25%, bottom 80% earn 50% (in this chart the last point shown is 50%). Hand-drawn sketch from the handout: the equality line OP, the Lorenz curve, and the right-angle line OQP for perfect inequality. Example: the bottom 80% have a share of 40% of total income. The text example says bottom 20% have 3%, bottom 40% have 10%. The chart printed beside it labels bottom 80% as 50% cumulative, while the written example beneath the sketch says bottom 80% have **40%.** They are two different illustrations. **Rule for the exam hall:** do not quote a number from these pictures; explain the method and the two extreme lines. Reading the curve Case What the LC looks like **Perfect equality** Every group has the same share as any other group of the same size. The LC is the **x = y line, OP:** the **line of perfect equality** **Perfect inequality** One person has all the income, so the rest have zero. The LC runs along the **x-axis** until the very last point, then rises vertically: **OQP, or simply QP** **A real country** Lies between the two. **The closer to the equality line, the more equal;** the farther away, the less equal"}, {"ch": 2, "cht": "Inequality: Measures, Causes and Growth Models", "id": "4-gini-coefficient-and-its-four-shortcomings", "t": "4 · Gini coefficient and its four shortcomings", "x": "The Gini coefficient is a statistical measure of inequality calculated using the Lorenz curve. Let **A** be the area between the line of equality and the Lorenz curve, and **B** the area below the Lorenz curve. Lorenz curve with areas A (between the equality line and the curve) and B (below the curve). Gini = A / (A + B). **Gini (GC) = Area between equality line and Lorenz curve / Area between equality line and inequality line = A / (A + B).** **Range:** 0 when A = 0 (perfect equality) to 1 when B = 0 (perfect inequality). **An increase in Gini means an increase in inequality.** Shortcomings of the Gini (the handout's four) Shortcoming The concept The handout's explanation **1 · Not easily decomposable or additive** You cannot do simple maths with Ginis to see the bigger picture Average incomes of two states combine easily into one average. Ginis do not: State A at 0.3 and State B at 0.4 do **not** combine to 0.35. The maths is complex, so policymakers cannot easily say which region or sector drives overall inequality **2 · Different distributions can give the same Gini** One number hides the **shape** of society Society A: starving lower class, wealthy middle class, no billionaires. Society B: comfortable lower and middle class, but a few trillionaires hoarding half the wealth. Both could score **0.40,** yet feel completely different **3 · Reacts differently to transfers at the tails than in the middle** Over-sensitive to the middle class, somewhat **blind to the extremes** A ₹10,000 gift between two middle-class people visibly improves the Gini. A multi-billionaire taking ₹10,000 from a destitute beggar (a transfer at the tails) barely moves it. It misses rising concentration at the very top **4 · Hides demographic variation among subgroups** Blind to **who** the rich and poor are A \"low\" Gini cannot show whether the old hold 90% of the wealth while youth face poverty, or whether one racial group or caste earns far less. It throws everyone into one pot"}, {"ch": 2, "cht": "Inequality: Measures, Causes and Growth Models", "id": "5-why-does-inequality-exist", "t": "5 · Why does inequality exist?", "x": "(1) Natural advantages These are **accidents of birth or location** that give some people a better chance at well-being: birth in a family of means or higher social status, better networks, inherited wealth. A place with better geography and fewer adverse events has better access to health, education and livelihood. **Most inequalities can be explained by natural advantages or disadvantages,** and they cannot be wished away. But they cannot explain everything. Siblings in the same household can have very different outcomes. That is explained by **comparative advantages and disadvantages:** also natural, but not apparent at first. Example: an elder sibling is given responsibility earlier and is better prepared for such roles; a younger sibling may lean toward artistic or talent-based pursuits. (2) Economic reasons: the Marxist view Marx: inequality results from **differences in the ability of different groups to enforce their interests.** The groups are those with **capital** and those with **labour,** and the interest is to take a larger share of revenue as **profits versus wages.** A firm gets factors of production as capital (entrepreneurship, capital, land) and labour. Revenue is split into wages and the retained profit. Both sides want a larger share. **Capital is scarce and labour abundant,** so labour's ability to bargain is low. Capital is concentrated in few hands, so providers keep a larger share as profit. To some extent this is fair: capital takes greater risk and deserves higher reward. But as revenue rises, **profit's share keeps increasing while wages rise slowly,** so initial inequalities **compound** over time. That growing inequality is the problem, according to Marx. (3) Modern reasoning **a. A critique of the Marxist view.** The handout says Marxist reasoning has **survivorship bias:** it uses only the information that is visible. Profits do rise faster than wages at a broad level. But adjust profits for the **losses of firms that shut down** and the growth rate is not very different. **Most firms that start today shut down within 10 years.** Marxist reasoning considers only profit, which belongs to the firm that survives. There are periods when profits decline but wages do not. Over a longer term, **profits and wages grow at a similar rate.** Why do profits still rise quickly? Surviving firms grow because of market growth **and** because of **larger market share after other firms close.** Wages grow only with market size, since the number of workers stays mostly stable. Marxism is \"obviously not wrong\" (it rightly points to unequal ability to enforce interests) but it underplays the **low survival rate of firms** versus a stable worker count. So firms see that the key to exceptional profit is **survival and market share.** The **means** they choose decide the kind of inequality a society has. **b. The political-legal system: the rule of law.** Every firm wants to survive and to monopolise; when market share rises, profits rise sharply. There are two routes to more share: Fair means Unfair means What firms do Better goods and services through **R&D,** risk-taking, innovation, hiring skilled workers and paying them well Exploit position and **connections with lawmakers and enforcers,** making it hard for others to compete Under a **strong** rule of law Firms are pushed to this route, since connections are not exploited and violators are punished Strong disincentive Under a **weak** rule of law Fair players fall; wrongdoers get away Firms lack integrity and ignore workers, consumers, minority shareholders and society Outcome They still monopolise and inequalities emerge, but society benefits. Such inequality is tolerable and \"**good**\" Everyone loses except the owners (and only briefly). Inequality gives **bad** outcomes **Modern reasoning is less about why inequality exists anywhere and more about why a certain kind of inequality exists in some places that gives the worst outcomes for everyone. It is about its nature.** It is **not merely a law or some laws.** It is a **collective environment of institutions** that frame, execute and adjudicate the laws. The people and institutions must be competent **and** act fairly and without bias. Example: the **Competition Act, 2002** aims to prevent monopolies through unfair practices. But many entities decide what a monopoly is, what is fair, and what to do about it. The Act is **one aspect** of the rule of law; how it is applied decides whether the rule of law exists."}, {"ch": 2, "cht": "Inequality: Measures, Causes and Growth Models", "id": "6-growth-and-inequality", "t": "6 · Growth and inequality", "x": "**Growth, by its design, is inequality-causing.** Faster growth happens when limited resources go where growth potential is higher, in sectors or places that can use them more efficiently. Faster growth means **more employment and a faster fall in poverty,** which is desirable. But if resources are focused on certain sectors, regions or industries, the incomes of those grow faster, so **inequality rises.** Growth is \"not without its costs\". To correct this, governments have tried models of growth that aim for **faster growth with less inequality.** The handout stresses these are **not mathematical models** but **general policy approaches,** and by the end you see both are **essentially the same,** differing in emphasis."}, {"ch": 2, "cht": "Inequality: Measures, Causes and Growth Models", "id": "7-trickle-down-approach", "t": "7 · Trickle-down approach", "x": "The intent is **focus:** maximum output in least time. The government focuses scarce economic, technological, human and natural resources, through policy, on sectors or regions with potential for faster growth. The expectation is a **multiplier effect:** one sector grows and pulls the whole economy up, while evenly spread resources would give only an average rate. Benefits **can trickle down** naturally to nearby areas, sectors and people, but it may take a long time, and those left out just keep waiting. So the government **accelerates** it by **redistributing** benefits to those at the bottom. Four conditions for trickle-down to work # Condition 1 **The chosen sector grows** 2 The government is able to collect more **taxes** from that growth (**high taxation efficiency**) 3 The government **decides to redistribute,** i.e. spends on those left out instead of reinvesting in the same or a related sector 4 **Efficiency of redistribution is high:** benefits reach the intended beneficiaries If any condition fails, trickle-down does not happen and the inequalities created **become permanent.** More often than not these assumptions fail, so inequalities persist and are even **created by the approach.** It is **not an anti-poor model,** but a well-meant pursuit of growth ends up creating more inequality. This leads to the inclusive approach."}, {"ch": 2, "cht": "Inequality: Measures, Causes and Growth Models", "id": "8-inclusive-growth", "t": "8 · Inclusive growth", "x": "The handout calls trickle-down a **pro-poor** model that relies on the government moving the benefits of growth to the bottom. Being \"brutally honest\": the benefits do not **rightfully** belong to the bottom, since they did not contribute to growth, which is driven largely by those at the top. The top contributes and so **keeps most of the benefits.** The bottom's only \"sacrifice\" was not getting special policy focus, and schemes for the poor are a payment for it. So the poor get benefits only at the **government's discretion,** transfers often fail and inequality stays. **Inclusive growth** is based on the premise that growth should be **broad-based:** it must include as many sections of society and the economy as possible, driven not only by the top but also by the bottom. The aim is to move those at the bottom from **passive recipients** of growth's benefits to **active contributors,** with a rightful claim on its fruits. It has **two pillars:** Identify the poor and vulnerable Identify backward regions Find key reasons for backwardness or vulnerability Disasters, poor health and nutrition, weak institutions including economic ones like agricultural markets, youth migration Focused interventions based on those reasons Skills, basic healthcare, quality education for all Skills are dynamic, so link them to evolving industry needs, with incentives and hand-holding Job creation through industrial development Especially labour-intensive industry Shift from job-seeking to job-creating An entrepreneurship culture Improve ease of doing business (EoDB) Contract enforcement (judicial reforms), easier registration, land acquisition Reduce or share entrepreneurial risk Access to capital For example guarantees to banks on the borrower's behalf; this needs **financial inclusion** Interventions must recognise **behaviour.** \"The government should build more schools\" is not enough. Ask why children are not going to school. Are teachers skilled and qualified? Are there separate girls' washrooms? Can poor families afford the incidental costs? Skills are dynamic, so link them to evolving industry requirements and recognise the need for **incentives and hand-holding.** Trickle-down versus inclusive growth Trickle-down Inclusive growth Idea Focus resources on high-growth sectors; let benefits reach the bottom Broad-based growth that includes the bottom as **contributors** Bottom's position Passive recipient of benefits Active contributor with a rightful claim Role of government Redistributes benefits (at its discretion) Builds **capability** and provides **opportunity** Weakness Fails if any of four conditions fails; inequality becomes permanent Takes effort on skills, institutions, credit and enterprise Students may refer to the **National Skill Development Programme, PMKVY** and the **Economic Survey 2025-26** discussion on skill development, health and education. For opportunities, refer to **Jan Dhan Yojana, Mudra Yojana** and Economic Survey 2025-26 on support to industry. **Important note:** the handout says it will return to inequality when it turns to different kinds of economies, and will discuss inclusive growth much more in later chapters. \"This is just the beginning.\""}, {"ch": 3, "cht": "Unemployment: Measures, Types, Causes and Labour Market", "id": "exam-lens-priority-and-pyqs", "t": "Exam lens: priority and PYQs", "x": "**This chapter comes from the handout only.** No class slides and no teacher ink came with it. The handout ends with a **UPSC Prelims PYQs** section of **10 questions** (years quoted: 2011, 2012, 2013 twice, 2017, 2018 twice, 2020, 2021, 2022). **Mains PYQs: none quoted in the material.** Priority here comes from the handout’s own signals: the 10 PYQs, the “Crucial Prelims Fact” on gratuity, and the “do not memorise, just understand” note on NSSO definitions. Prelims PYQs quoted in the handout (answers as printed in the handout) Year What was asked Answer in handout Trap / where covered 2022 Which body compiles information on industrial disputes, closures, retrenchments and layoffs in factories? (c) Labour Bureau Handout gives only the answer. The body is not discussed in the chapter text 2021 Casual workers: EPF for all, regular hours and overtime for all, wages through bank account by notification (b) 2 and 3 only Word “all” in statements 1 and 2. Handout gives only the answer. Related: Section 8 (labour laws, Code on Wages) 2020 Post-1991: worker productivity, rural share of workforce, non-farm economy, rural employment growth (b) 3 and 4 only Handout gives only the answer. Related: Section 6 (employment share of agriculture) 2018 Rise in real GNP does not mean higher development if… (c) poverty and unemployment increase Links Chapter 1 and this chapter 2018 PM Kaushal Vikas Yojana: flagship of Ministry of Labour and Employment? soft skills, entrepreneurship, digital literacy? align the unregulated workforce to the NSQF? (c) 2 and 3 only Statement 1 is the trap. Related: Section 9 (PMKVY) 2017 National Career Services: initiative of DoPT? launched in mission mode for uneducated youth? (d) Neither 1 nor 2 Handout gives only the answer. Not in the chapter text 2013 Disguised unemployment generally means… (c) marginal productivity of labour is zero **Direct hit:** Section 4, disguised UE 2013 Economic growth in country X will necessarily occur if… (c) there is capital formation in X Handout gives only the answer. Not discussed in the chapter text 2012 How does the National Rural Livelihood Mission seek to improve livelihoods of the rural poor? (b) 2 only (strengthening SHGs and skill development) Not in the chapter text. Statement 3 (free inputs) is the trap 2011 Who is eligible for MGNREGA? (d) Adult members of any household Section 9 says it guarantees 100 days to rural households that demand unskilled manual work The list above is the ten questions printed in the handout. The years are “years quoted”: 2013 and 2018 each appear twice. Only 2013 (disguised UE), 2018 (PMKVY) and the schemes sit squarely inside the chapter text. Several PYQs (Labour Bureau, NCS, NRLM, capital formation) are quoted **without any explanation** in this handout, so their answers are carried from the handout and not explained. **Prelims hooks:** the definition set (WAP, dependents, dependency ratio, labour force, LFPR, UR, WPR); working age 15-64 versus 15+; US (PS+SS) versus CWS and which gives the higher rate; PS 183 days, SS 30 days, CWS 1 hour in 7 days; the types of unemployment (above all disguised UE with MPL zero); floor, minimum, fair and living wage order; NRU and NAIRU; employment elasticity; organised versus unorganised and formal versus informal; the four Labour Codes; fixed-term employment and gratuity after 1 year; the schemes and their problems. **Mains hooks:** why UR is falling but not for the right reasons; jobless growth versus the numbers; skill mismatch and the youth-education paradox; informalisation and the compliance burden; productivity versus employment as a false choice; gig workers and the new codes. **Closing idea:** India’s problem is not too little growth or too few jobs. It is a mismatch between aspirations and skills, and a labour market split between protected and unprotected workers."}, {"ch": 3, "cht": "Unemployment: Measures, Types, Causes and Labour Market", "id": "1-who-is-unemployed-the-demographic-divisions", "t": "1 · Who is unemployed? The demographic divisions", "x": "The standard definition: **unemployment is “a situation where someone who is able as well as willing to work, is unable to find work”.** The handout quotes Mankiw, Samuelson-Nordhaus and Blanchard: the unemployed have no job, are available for work and have actively looked for work in the previous four weeks. “Not working” is a large set; “unemployed” is a **subset** of it, because the grandparent, the young child or the homemaker who is not looking is not unemployed. The main source for Indian definitions is the **Periodic Labour Force Survey (PLFS)** of the NSSO. The RBI and the Ministry of Labour generally align with it; the **ILO** sets the global standard. The building blocks Term Meaning in the handout **Working Age Population (WAP)** People in the age group considered fit for economic activity. In India (NSSO/PLFS) this is typically **15 years and above**. The ILO often uses **15-64** **Dependents** Those not in the WAP: **children (0-14)** and, in many contexts, **senior citizens (65+)**. The word is reserved for the non-working-age population **Dependency Ratio (DR)** Dependents ÷ people of working age × 100. DR = [Population (0-14) + Population (65+)] ÷ Population (15-64) × 100 **Labour Force (LF)** People who are **working or looking for work**: both able and willing. Splits into the employed and the unemployed **Not in Labour Force** Unable or unwilling to work: students, rentiers, the disabled, those in domestic duties **Able to work** Physical and mental capacity. Age is only a filter applied later **Willing to work** A genuine effort: the **active search** criterion (applying for jobs, registering at exchanges) in the reference period **LFPR** Labour force in a cohort ÷ total population of the cohort × 100. Can be crude (whole population), 15+ (the commonly reported one) or for a specific group such as married women aged 21-30 **Unemployment rate (UR)** **n(UE) ÷ n(LF)**, and n(LF) = n(Emp) + n(UE). So UR = UE ÷ (Emp + UE). It is a share of the labour force, **not** of the population **Worker Population Ratio (WPR)** Employed persons ÷ total population. Expressed per 1000 persons The handout spends a page on one exam trap: the **working age.** If the question is about **demographics** (demographic dividend, population pyramids, dependency ratio) the answer is **15-64**, because at 65 people are globally classified as elderly dependents. If the question is about **India’s NSSO/PLFS metrics** (LFPR, UR, WPR) the answer is **15 years and above**, because India’s informal sector lacks universal social security and a 70-year-old farmer cannot afford to retire. The handout says the first reading is “not wrong”; the second “becomes more right” in this context. The handout writes the dependency ratio’s denominator as “people in the working age” and then as 15-64 in the formula, while its PLFS tables use 15+. **Rule for the exam hall:** DR uses 15-64; LFPR, UR and WPR as reported by the PLFS use 15+."}, {"ch": 3, "cht": "Unemployment: Measures, Types, Causes and Labour Market", "id": "2-what-counts-as-employment", "t": "2 · What counts as employment", "x": "Employment is **not just a 9-to-5 job.** The NSSO defines it through **economic activities**, using the System of National Accounts (SNA) boundary (SNA is covered in the National Income Accounting handout). A salary is not mandatory. **Self-employment:** own-account workers (a street vendor, a consultant) and employers. **Unpaid family helpers:** a child helping in a parent’s kirana store counts as employed even without cash. **Casual labour:** daily-wage work in construction or agriculture. **Regular salaried:** employees with a contract and monthly pay. **Remuneration can be in kind** (food, clothing, a place to stay), **in assets** (shares or equity), or **exchange labour** (two farmers working each other’s fields). Economic or not? Activity Employed? Why Running a business for profit Yes Economic activity for profit Working in a family shop (unpaid) Yes Contributing to a family economic enterprise Farming for own consumption Yes Production of goods for self-consumption (inside the SNA boundary) Domestic work for own family No Non-economic, non-market activity Paid domestic work for others Yes Market activity for remuneration Volunteer work for an NGO No Usually excluded: no remuneration or profit intent **NSSO wording (the handout says understand, do not memorise).** Workers: persons engaged in any economic activity, or who despite attachment to it abstained for illness, injury, disability, bad weather, festivals or other contingencies. Unemployed: persons who, owing to lack of work, had not worked but sought work (exchanges, intermediaries, friends or relatives, applications) or expressed willingness or availability for work. “Able to work” is purely physical and mental capacity: the NSSO has a code (**Code 95**) for those not able to work owing to disability and does not use age. A 13-year-old working at a tea stall is counted as employed in the raw data."}, {"ch": 3, "cht": "Unemployment: Measures, Types, Causes and Labour Market", "id": "3-measuring-unemployment-plfs-us-and-cws", "t": "3 · Measuring unemployment: PLFS, US and CWS", "x": "The NSSO measures unemployment through the **PLFS.** Earlier it used the **EUS** (Employment-Unemployment Survey), carried out about once in 5 years. The PLFS has a larger sample, higher frequency and better technology: an **annual** survey where sampled households are **visited once every month**. Field investigators ask how household members spent their time over set reference periods, and each person is classified into one of three statuses: **Working, Seeking/Available for work, Not in labour force.** 1 · Lay down two standards One to decide whether a person is in the LF; one to decide, if in LF, whether working 2 · Take a representative sample Collect data relevant to the standards 3 · Apply the standards Status A: neither working nor looking (not in LF). Status B: working (employed). Status C: not working (unemployed) 4 · Compute UR n(status = UE) ÷ [n(status = Emp) + n(status = UE)] An “approach” is simply a standard. As with poverty, a person can be “working” on one approach and not even in the LF on the other. The PLFS uses two. Usual Status (US) versus Current Weekly Status (CWS) Point Usual Status (US) Current Weekly Status (CWS) **Reference period** One year (365 days) The 7 days before the survey **Criterion** **Majority time**: what was the person doing for most of the period **Priority**: Working beats Unemployed beats Not in LF **In LF if** Working or seeking work for the majority of the year (**≥ 183 days**) = Principal Status (PS) Worked or was available for work at any point in the 7 days **Working if** PS: worked the majority of the days in the LF. SS: worked at least **30 days** in the year Worked for **at least 1 hour on any 1 day** in the week **Unemployed if** In LF but did not work for the majority of LF days (PS); and on SS, did not work even 30 days Did not work even an hour but was seeking or available for work for at least 1 hour on any day **What it captures** Chronic or long-term (structural) picture; smooths seasonal bumps Short-term fluctuations and underemployment; closer to ILO standards; reacts quickly to shocks **Which UR is higher?** Generally lower **Generally higher.** Short recall makes answers accurate and captures seasonality Principal and Subsidiary status in detail **PS (Principal Status):** in the LF if working or seeking for ≥ 183 days. Then “employed” if work was found for the majority of the days in the LF. Example: LF for 200 days and work for 120 days gives employed. **SS (Subsidiary Status):** a person who is principally unemployed but found work for at least 30 days is **employed on SS.** Anyone with work for at least 30 days in the year is employed on SS basis. Unemployed on both PS and SS means not even 30 days of work. **UPSS** (Usual Principal and Subsidiary Status) merges both: a person is employed if a worker in either capacity. This deliberately captures invisible labour, for example millions of women whose principal status is domestic duties but who spend about 40 harvest days in farm labour. The handout’s four-person example Person Days working Days looking Total LF days In LF (≥ 183) PS employed SS employed A 150 0 150 No (not in LF) - Yes (≥ 30 days) B 110 90 200 Yes Yes (110 ≥ 100) Yes C 140 160 300 Yes No (140 < 150) Yes D 25 275 300 Yes No No (25 < 30) Not in LF = 200; LF = 800. Principal status: employed 600, unemployed 200. Of the 200 principally unemployed, subsidiary status: employed 150, unemployed 50. **UR (PS) = 200 ÷ 800 = 25%** and **UR (PS+SS) = 50 ÷ 800 = 6.25%.** The handout calls **UR (PS+SS) the headline rate**: the one the government uses and quotes without naming the approach, because those with no work even for 30 days are the chronically unemployed and the priority. Person A (150 working days, none spent looking) is **not in the LF** on the principal-status test (150 < 183) but is still counted as **employed on subsidiary status**, because the work was at least 30 days. This is exactly why UPSS merges the two. **Rule for the exam hall:** first the LF test (≥ 183 days), then PS, then SS. Up to 2012 the EUS also used the **Current Daily Status (CDS)** approach, which measured underemployment by the time worked on each day of the last week. It was dropped in the PLFS because the data now come far more frequently, from a larger sample and with monthly visits."}, {"ch": 3, "cht": "Unemployment: Measures, Types, Causes and Labour Market", "id": "4-types-of-unemployment", "t": "4 · Types of unemployment", "x": "The types at a glance Type What it is Handout’s example or cause **Structural** Joblessness from a fundamental **mismatch** between skills workers have and skills employers demand, or between worker and job location. Long-term and dangerous: workers are “immobile” from the old structure to the new Agriculture to industry; new technology; automation displaces low-skilled factory labour while AI developers are scarce **Seasonal** Predictable drops in labour demand at specific times of year Agriculture outside harvest; tourism off-season; construction in the rains **Frictional** The “search time” to match worker and job under imperfect information. A certain level is healthy. Job portals have reduced it Quitting one job and not yet finding another; fresh graduates entering the workforce **Voluntary** In the LF, offered a job, but chooses not to accept it, and so counted as unemployed Below one’s dignity; skills higher than required; unacceptable terms (timing, location, wages); lucrative unemployment benefits **Underemployment** (*employment*, not unemployment) Officially employed but the job does not use skills, education or hours on offer. **Invisible:** over-qualified, over-skilled. **Visible:** wants longer hours PhD
