holders applying for peon or sweeper posts; 3 hours of work in an 8-hour day (the old CDS test) **Disguised** More workers than needed; the extra workers add **no output.** Their **marginal product of labour (MPL) is zero** (or negative). Recorded as employed, so the reality is hidden A 2-acre family farm that needs 2 people but has 5 brothers: output stays 100 quintals, so the 3rd, 4th and 5th brother have MPL zero. A hallmark of Indian agriculture **Wage-rate (classical)** Wages stay **above equilibrium** and cannot fall, so labour supply exceeds demand permanently Minimum wages fixed above equilibrium by law; strong unions bargaining wages up **Cyclical (Keynesian)** Extra unemployment above the natural rate because growth is slower than expected (a downturn in the business cycle) Falls when aggregate demand grows fast; rises when it slows Marginal product of the (n+1)th worker = output with n+1 workers minus output with n workers. If n workers produce x and n+1 produce x + y, the marginal output is y. Disguised unemployment is where y = 0. This is the 2013 PYQ. The handout flags the word: it is **employment**, not unemployment. An underemployed person’s working status remains **employed.** **Rule for the exam hall:** underemployment and disguised unemployment both sit inside “employed” in the statistics."}, {"ch": 3, "cht": "Unemployment: Measures, Types, Causes and Labour Market", "id": "5-demand-supply-and-the-market-needed-for-wage-r", "t": "5 · Demand, supply and the market (needed for wage-rate unemployment)", "x": "The handout inserts the basics of markets here so that wage-rate unemployment can be understood. **Demand** exists only when there is both **ability** and **willingness.** Quantity demanded (QD) is what is actually asked for. Factors: price, income, taste, culture, geography (season), population size, substitutes. **Law of demand** (ceteris paribus): QD varies **inversely** with price. If another factor changes, the curve **shifts**. **Supply** needs both ability and willingness. Quantity supplied is what **is being** produced. Factors: price, profitability, raw materials, labour, capital, ease of doing business and policy, investment (especially R&D), infrastructure. **Law of supply** (ceteris paribus): quantity supplied varies **directly** with price. **Price takers.** Producers and consumers take the price the market offers. Under perfect competition (identical goods, no entry or exit barriers) no one can set a price. In real markets competition is imperfect and producers have limited pricing power. **Only in a monopoly are producers price setters.** **A market is a place of exchange of information** and so of rationalising expectations, not merely a place. Start: some random price P1 At P1, quantity supplied is greater than quantity demanded: **excess supply** Sellers fear unsold stock They cut prices: downward pressure. New buyers enter (QD rises), some sellers exit (QS falls) Price adjusts to P0 QS = QD. No excess supply, no downward pressure If the start price was P2 (below P0) QD > QS: **excess demand.** Buyers bid prices up until QS = QD at P0 Equilibrium price and market clearance At P0 everyone who came to sell has sold and everyone who came to buy has bought. Equilibrium is rarely seen because factors keep changing; the price is always adjusting towards it **The labour market works the same way.** Firms demand labour; the labour force supplies it. **Demand for labour (DL) ∝ 1 ÷ wages** (high wages, fewer workers wanted); **supply of labour (SL) ∝ wages** (high wages, more people willing to work). Factors for DL: wages, price of substitutes such as machines, skill, number of firms, willingness to hire given complex laws. Factors for SL: wages, terms and conditions, education and skill level of the population. If wages above equilibrium cannot adjust downwards, there is permanent excess supply: **wage-rate unemployment.**"}, {"ch": 3, "cht": "Unemployment: Measures, Types, Causes and Labour Market", "id": "6-four-kinds-of-wage-and-cyclical-unemployment", "t": "6 · Four kinds of wage, and cyclical unemployment", "x": "Types of wages Wage What it is Focus **Floor wage** A **central baseline** set by the Union Government (Code on Wages, 2019). States cannot set minimum wages lower than it, which prevents a race to the bottom Absolute national bottom **Minimum wage** The lowest legal pay for a category of work. **State governments** primarily set it, so a factory worker in Haryana may have a different one from Bihar. Designed to prevent extreme exploitation Survival **Fair wage** Between the minimum and the living wage; capped by what the industry can afford. Formalised by the **Committee on Fair Wages (1948).** Depends on prevailing area rates, productivity and profitability Industry capacity to pay and worker’s willingness **Living wage** A **normative** wage for a decent standard of living: nutrition, housing, healthcare, children’s education, transport, savings. Ignores whether the employer can afford it. Almost always above the statutory minimum Decent life and dignity **Floor wage ≤ Minimum wage ≤ Fair wage ≤ Living wage.** Cyclical (Keynesian) unemployment A firm hires because it **needs** workers, and that depends on the demand for the goods it expects to sell. At the economy level, demand for workers is **derived from aggregate demand (AD).** **UR falls only when employment growth is faster than labour-force growth.** Example: LF 100 (80 employed, 20 unemployed, UR 20%). LF rises 10% to 110 and employment rises 5% to 84. Unemployed = 26 and UR = 26 ÷ 110 = 23.6%, higher than 20%, even though jobs rose. Growth is **cyclical** (booms and recessions) and unemployment moves inversely. If growth is slower than an economist expected, the extra UR is **cyclical.** Natural rate of unemployment (NRU) and NAIRU **NRU:** the UR when wages are at equilibrium (zero wage-rate UE) and the cycle is neutral (zero cyclical UE). **NRU = frictional + structural + seasonal + voluntary UE.** At the NRU the economy is at **full employment** (which is **not** zero unemployment) and producing at **potential GDP.** **NAIRU** (Non-Accelerating Inflation Rate of Unemployment): comes from the Phillips Curve (covered in the Inflation chapter). If UR is pushed below it by printing money or heavy deficit spending, the labour market tightens, wages are bid up, a **wage-price spiral** starts and inflation accelerates. The actual UR can be counted. **NRU and potential GDP cannot be measured; they are estimated** and depend on the model. Example: UR is 8%. Economist A says NRU is 5% so cyclical UE is 3%; Economist B says NRU is 7% so cyclical UE is 1%."}, {"ch": 3, "cht": "Unemployment: Measures, Types, Causes and Labour Market", "id": "7-unemployment-in-india-the-plfs-numbers", "t": "7 · Unemployment in India: the PLFS numbers", "x": "India’s UR is measured by the PLFS, carried out every year since **2017.** It gives both US (PS+SS) and CWS rates; the CWS numbers are now released **monthly** for rural and urban areas. The survey period was July-June and has now changed to the **calendar year (Jan-Dec).** PLFS (usual status, age 15+) Survey (July-June) UR LFPR (overall) Female LFPR 2017-18 6.0% 49.8% 23.3% 2018-19 5.8% 50.2% 24.5% 2019-20 4.8% 53.5% 30.0% 2020-21 4.2% 54.9% 32.5% 2021-22 4.1% 55.2% 32.8% 2022-23 3.2% 57.9% 37.0% 2023-24 3.2% 60.1% 41.7% Then and now Indicator 2017-18 2023-24 Trend LFPR 49.8% 60.1% Rising WPR 46.8% 58.2% Rising UR 6.0% 3.2% Falling The handout calls this “outstanding”: a falling UR **with** a rising LFPR. Then it asks what is behind the numbers. Critical analysis of the trends **LFPR is still low.** Handout comparators: Vietnam ~68.5%, China ~66.5%, South Korea ~63.5%, Japan ~63.2%, United States ~62.5%, Bangladesh ~61.9%. India crossed 60% for the first time in 2023-24. **The UR decline is not entirely desirable.** Between PLFS rounds 2 to 3 and 3 to 4 almost the whole fall came from (a) more **agricultural jobs** and (b) more **self-employment.** **Agriculture** already has disguised UE and underemployment and the lowest productivity, so a net rise in agricultural jobs is undesirable for a country wanting the demographic dividend. **Self-employment** is generally more productive and remunerative, but leaves workers vulnerable to shocks without safety nets, and much of it is **distress employment.** Sector productivity (the handout’s table) Sector Share in GDP (₹) Share in employment (workers) Relative productivity (GDP ÷ employment) Agriculture 18 46 ₹0.39 per worker Industry 28 25 ₹1.12 per worker Services 54 29 ₹1.86 per worker **Context.** Agriculture’s employment share was about **75% at independence,** fell below 50% around **2012,** reached about **44% before Covid,** and rose to about **46% by PLFS round 5** because only agriculture could absorb the laid-off. The last two surveys show it declining again. Self-employment has risen continuously and Covid only accelerated it. Firms prefer contractual workers (no compliance burden, flexible size), and a growing proportion of workers prefer self-employment for quicker earnings. The handout calls it “a low-income country with first world problems” and says the focus should be on reducing vulnerability and building skills. Unemployment rate by education level (2024): illiterate close to nil, primary 1.1%, secondary 3.5%, higher education 12.9%. Among graduates in the labour force one in eight is unemployed. Source printed: PLFS 2023-24. Unemployment rate among graduates by age group (2024): 20-24 years 37%, 25-29 years 19%, 30-34 years 8%, 35-39 years 2%, 40-44 years under 1%. Highest among recent graduates. Graduates outside the labour force, by reason, gender and age (2024). Women: care and home commitments dominate (about 58% in the twenties, 91% in the thirties, 88% in the forties). Men in their twenties: education (96%). India’s unemployment situation (all-India, age 15+ and youth 15-29), Apr-Jun and Jul-Sep: all-India 5.4% and 5.2%; rural 4.8% and 4.4%; urban 6.8% and 6.9%; youth 14.6% and 14.8%; rural youth 13.1% and 13.1%; urban youth 17.9% and 18.4%. Source printed: MoSPI. The last figure is a newspaper-style graphic reproduced in the handout with small print. The quarter labels (Apr-Jun, Jul-Sep) and the values above are read from the picture. **Rule for the exam hall:** use the trend (youth and urban youth are far higher than the all-India rate), not the decimal points."}, {"ch": 3, "cht": "Unemployment: Measures, Types, Causes and Labour Market", "id": "8-why-is-there-unemployment-in-india-low-growth", "t": "8 · Why is there unemployment in India? Low growth, jobless growth, or skills?", "x": "1 · Is our growth “low”? Post-1990s average growth is about **6.5%**, faster than the world average (**3.5%**) and the developing-country average (**~4.5%**). A plain “low growth” argument does not hold for most of the post-2000s. 2 · Jobless growth? **Employment elasticity (ε) = % change in employment ÷ % change in output.** If output grows 10% and employment 6%, ε = 0.6: **60% of growth comes from more workers and 40% from higher productivity.** Falling ε means growth is attributed more to productivity. Between **2004-09,** the fastest-growth period, ε fell to **about 0.01**; economists called this “jobless growth.” A falling elasticity should push UR up, but long-term UR (ILO data) has not risen. The reason: **employment growth, though falling, is still faster than labour-force growth.** So “jobless” is “misleading or at least too harsh”. Three periods (handout figures) Period Labour force growth Employment growth Reading **Sluggish decade** 2000-01 to 2011-12 ~1.8% ~1.5-1.6% LF faster than jobs: rising UE. 2004-2010 employment growth near 0% **Lost and found** 2011-12 to 2020-21 ~1.3% (volatile) ~1.2% Workforce stagnated or shrank to 2017 as women left the LF (female LFPR ~23%); 2017-21 distress pulled women back as unpaid agricultural helpers **Surge** 2017-18 to 2023-24 ~4.5% ~5.0% WPR 46.8% to 58.2%; workforce up ~36%, about **170 million jobs** in 7 years; UR falls to 3.2% The handout says the surge appears “as soon as we start collecting data in a better manner” (the PLFS captures the informal sector better). Part of the surge is therefore better counting and, as Section 7 shows, much of it is agriculture and self-employment. **Rule for the exam hall:** quote the surge together with its quality caveat. Productivity versus employment: a false choice **Cannot be inefficient:** if Indian firms avoid technology to save jobs, China or Vietnam will undercut them, the firm may go bankrupt and everyone loses their job. **The goal is decent jobs, not just more jobs.** (Hire a million people to dig holes with spoons and another million to fill them in: 0% UE, but poor.) A high wage needs a highly productive worker. **Falling elasticity is not always bad:** one skilled worker may produce what ten once did. It is bad only if total jobs do not absorb new entrants. The answer is “to skill our youth so they can run the machines”, not to break them. 3 · The key reason: aspirations and skills do not match The handout’s conclusion: not lack of growth or jobs, but a mismatch between **aspirations and skills** versus the jobs. That is **voluntary and structural unemployment.** **Voluntary:** the job matching the worker’s skill exists but fails the worker’s aspiration. **Structural:** the aspired job exists but the worker lacks the skill; the job stays vacant. **Youth-education paradox:** as education rises, wage and status expectations rise. The young, educated and non-poor can afford the “luxury of unemployment”. **Unemployment is a luxury only the non-poor can afford; the poor are too poor to be unemployed.** With age the buffer runs out: they accept lower-skilled work or drop out of the LF (**hidden unemployment**). **India Skills Report** (Wheebox with CII, AICTE and AIU; the WNET test): graduate employability hovers around **50% to 55%** (ISR 2024/2025). Graduate UR is estimated at **13%**, close to nil for those with no education. The LFPR of women with diplomas/certificates is about **55%** versus about **89%** for men. Youth (15-29) urban UR stays high while older groups collapse to near zero. The remedy: **skills and vocational training,** plus better wages in lower-skilled jobs. The text says graduate UR is “estimated at 13 percent”; the chart in Section 7 prints **12.9%** for higher education (2024). They are the same estimate, rounded. **Rule for the exam hall:** write “about 13%”."}, {"ch": 3, "cht": "Unemployment: Measures, Types, Causes and Labour Market", "id": "9-nature-of-employment-labour-laws-formal-and-in", "t": "9 · Nature of employment: labour laws, formal and informal work", "x": "**Labour laws** govern the employer-employee relationship (who is a worker, leave, safety, misconduct, night shifts for women). The pre-2020 laws the handout lists: Key pre-2020 labour laws Year Act What it does 1926 Trade Unions Act Registration, rights and regulation of trade unions for collective bargaining 1936 Payment of Wages Act Wages on time; no arbitrary deductions 1947 Industrial Disputes Act Employer-union relations: strikes, lockouts, layoffs, retrenchment 1948 Minimum Wages Act Government fixes minimum wages for scheduled occupations 1948 Factories Act Safety, health and welfare in factories (hours, ventilation, hazardous work) 1952 Employees’ Provident Funds and Miscellaneous Provisions Act Compulsory employer and employee contributions: retirement corpus, pension, insurance 1961 Maternity Benefit Act Paid maternity leave (currently 26 weeks); no firing for pregnancy 1970 Contract Labour (Regulation and Abolition) Act Conditions of contract labour; can abolish it in certain core industries Till 2019 India had **over 40 central and over 100 state labour laws.** Compliance was costly (“Inspector Raj”). A small firm stays off the radar and risks non-compliance; as it grows, its compliance cost rises exponentially. So it hires **indirectly** (for example security guards through a contractor). Law makes no distinction between workers: **the formal/informal split is an artificial distinction created by firms** to cut compliance cost. Ways to formalise: PF contributions, tax deducted at source, a formal contract. Two different classifications (NCEUS or Arjun Sengupta Committee) Organised vs unorganised Formal vs informal **Looks at** The **enterprise** (ignores the workers) The **worker’s** contract and benefits (ignores firm size) **Organised / formal** Registered, incorporated, bound by formal accounting and labour laws; government, registered bodies, private firms with 10+ workers (with power) or 20+ (without) Written contract, paid leave and above all **social security** (PF, ESIC, pension, maternity) paid by the employer **Unorganised / informal** “All unincorporated private enterprises owned by individuals or households…on a proprietary or partnership basis and with **less than ten** total workers” Workers in unorganised enterprises or households, excluding regular workers with social security, **and** workers in the formal sector without employment and social security benefits from employers Four boxes Formal worker Informal worker **Organised enterprise** Software engineer at Infosys; government bank manager **Informalisation of the formal sector:** a contract guard or cleaner at a big IT park or factory, hired through a contractor (no PF, leave or job security) **Unorganised enterprise** Statistically almost non-existent Farm labourer, street vendor, assistant at a tiny bakery. About **80%+** of India’s workforce **Gig and platform workers** (defined in the NITI Aayog report “India’s Booming Gig and Platform Economy”): treated as “independent contractors” or “partners” by platforms (Uber, Swiggy, Urban Company), outside the employer-employee relationship, with no social security. **Contractual employment** is the bridge between the organised sector and informal labour: hired for a period or task, often through a third-party agency. NITI Aayog points out that rigid laws (hard to fire permanent staff) pushed the organised sector towards contract workers. The solution: four Labour Codes (2019-2020) The government amalgamated **29 central labour laws into four codes:** The four Labour Codes Code Main point in the handout **Code on Wages, 2019** Universalises minimum wages and timely payment, including the unorganised sector **Code on Social Security, 2020** First legal framework for social security funds for gig, platform and unorganised workers. Gratuity after **1 year** for fixed-term employees **Occupational Safety, Health and Working Conditions Code, 2020** Streamlines safety rules; heavily regulates the use of contract labour **Industrial Relations Code, 2020** Simplifies dispute resolution and gives firms somewhat more hiring and firing flexibility Fixed-term employment (FTE) Direct hiring for a **pre-determined period** on a written contract; it ends automatically unless renewed. Introduced across all sectors to fix the exploitation of contract workers hired through agencies. **Parity with permanent workers:** same working hours, wages, allowances and statutory benefits (EPF, ESIC). **Gratuity (crucial Prelims fact):** a permanent employee needs **5 years** of continuous service, a fixed-term employee becomes eligible after **1 year** under the Code on Social Security, 2020. **What they lack:** long-term job security. Expiry is **not retrenchment,** so no notice and no retrenchment compensation. **Superior to contract workers:** on the principal employer’s direct payroll, no middleman cut, social security guaranteed, cannot be paid less for the same work. In the handout’s words, FTE gives the worker the **social security of a formal job** and the employer the **hiring flexibility of an informal job.**"}, {"ch": 3, "cht": "Unemployment: Measures, Types, Causes and Labour Market", "id": "10-schemes-the-problem-each-one-fixes", "t": "10 · Schemes: the problem each one fixes", "x": "Problem and fix (the handout’s summary) Problem Fix Employer compliance burden Shram Suvidha Unorganised worker vulnerability e-Shram and PM-SYM Structural skill mismatch PMKVY (Skill India) Lack of formal jobs (jobless growth) PLI and ELI schemes Rural distress and cyclical shocks MGNREGA The schemes in detail Scheme What the handout says **e-Shram portal** (2021) First **National Database of Unorganised Workers.** Gives a **Universal Account Number (UAN)**. Lets the government transfer cash or food to vulnerable workers in a shock **PM Shram Yogi Maan-dhan (PM-SYM)** Voluntary, contributory **pension** for unorganised workers earning **under ₹15,000 a month.** Worker pays e.g. ₹55-200 a month, the government **matches** it, pension **₹3,000 a month after age 60** **Shram Suvidha portal** Employer side: a **Labour Identification Number (LIN),** single consolidated online returns, **randomly assigned inspectors** by computer (removes bribery and bias). Cuts compliance cost so firms hire formally **PMKVY / Skill India** Flagship for the skill mismatch: short-term, industry-relevant training for dropouts and unemployed youth. **Recognition of Prior Learning (RPL)** certifies existing skills (a traditional carpenter) so workers can bargain for better wages **PLI scheme** Subsidies to companies **only if** they meet domestic production targets. Drives derived demand for semi-skilled and skilled labour **ELI scheme** (Budget 2024-25) Subsidises **job creation:** the government pays a portion of **EPFO contributions for first-time employees** entering the formal workforce, lowering the employer’s cost of hiring **MGNREGA / VB-GRAM(G)** Guarantees **100 days** of wage employment to rural households demanding unskilled manual work. Acts as a shock absorber and a legal floor for rural wages The handout writes “MGNREGA/VB-GRAM(G)” for the rural job guarantee and does not explain the second name. **Rule for the exam hall:** the 2011 PYQ uses “Mahatma Gandhi National Rural Employment Guarantee Act”; write that."}, {"ch": 4, "cht": "Basic Concepts of Economics: PPF, Goods and Capital", "id": "exam-lens-priority-and-pyqs", "t": "Exam lens: priority and PYQs", "x": "**Handout only.** No class slides and no teacher ink. The handout ends with **one** Prelims PYQ (2021). **Mains PYQs: none quoted in the material.** The chapter is the foundation for National Income Accounting (the handout ends with “Now we are ready to formally begin: National Income Accounting”). Prelims PYQ quoted in the handout Year What was asked Answer in handout Where covered 2021 Other things unchanged, market demand for a good might increase if: 1) price of its substitute increases 2) price of its complement increases 3) it is an inferior good and income rises 4) its price falls (a) 1 and 4 only Section 4: substitutes (positive cross-price effect), complements (negative), inferior goods (demand falls as income rises), law of demand What the handout stresses Signal in the handout Where Why it matters Production boundary: a good is final or intermediate by **economic modification,** not by its physical form. Salt for a household is final; salt for a hotel is intermediate Section 6 A classic Prelims trap; the base of GDP counting “Investment” in economics is **spending on capital goods** (a flow), not buying shares or gold. Capital is a stock Section 8 Asterisked statement; flow versus stock Depreciation (historical cost) versus CFC (current replacement cost) versus CCA (tax rule) Section 9 Three similar terms with three different owners Giffen goods are inferior goods under special circumstances; Veblen goods are ultra-luxury Section 4 Both break the law of demand Public goods: non-excludable and non-rival, so free-rider problem and market failure Section 5 Marked with a star in the handout **Prelims hooks:** PPF is normative and dynamic; MC versus OC; elasticity-based and income-based classes of goods; cross-price sign for substitutes and complements; merit versus demerit (externalities); Giffen versus Veblen; excludability and rivalry grid; intermediate versus final; capital versus working capital; GFCF, change in inventory and valuables; net investment; depreciation, CFC, CCA. **Mains hooks:** why decentralised and command systems both fail in some way (inequality, information problem, rent-seeking); why governments provide public goods; opportunity cost in public spending. **Closing idea:** economics does not say what to choose; it shows what you give up by choosing."}, {"ch": 4, "cht": "Basic Concepts of Economics: PPF, Goods and Capital", "id": "1-the-economist-s-task-budget-technology-and-the", "t": "1 · The economist’s task: budget, technology and the PPF", "x": "The economic problem is **limited resources and unlimited wants.** The economist cannot create more resources or reduce desires, and is not the decision-maker. The **decision-maker** (a person, family, firm, community or government) chooses; the economist’s main task is to **advise** whether the current use of resources is optimal. He first assesses two things: **(a) Budget constraints:** the resources that actually **limit** output. All resources are limited, but only some are limiting (for a farmer it may be water or fertiliser, not seeds). **(b) The prevailing technology:** the current manner of using resources (stone tools, iron tools, tractors and harvesters). Given these, the decision-maker has many options (chairs or tables, tobacco or mango or wheat). The economist estimates the **maximum sustainable output** for each possibility. That is the **Production Possibilities Frontier (PPF).** The handout’s hunter-gatherer PPF (8 hours of daylight) Scenario Deer hunted Berries gathered A 10 0 B 8 200 C 6 380 D 4 530 E 2 630 F 0 700 Reading the table (simple arithmetic on the handout’s figures): every 2 fewer deer buys 200, 180, 150, 100 and then 70 more berries. Each sacrifice buys less than the one before. The **PPF is a normative concept:** every economist has an assessment. Actual output is a **fact;** the PPF is a “sustainable-potential” benchmark. **Below the PPF:** possible but not desirable. **Beyond the PPF:** desirable but not sustainably possible (working 15 hours a day). It is **not cast in stone:** better technology pushes it out. Today there are “less deer but more bullets”: time is no longer the constraint, the number of deer is. The economist’s key role: help society reach the PPF, an output both **desirable and sustainably possible.**"}, {"ch": 4, "cht": "Basic Concepts of Economics: PPF, Goods and Capital", "id": "2-the-two-tools-marginal-cost-and-opportunity-co", "t": "2 · The two tools: marginal cost and opportunity cost", "x": "Marginal cost versus opportunity cost Marginal cost (MC) Opportunity cost (OC) **Meaning** The actual, tangible cost of producing **one more unit** at the current level of output The **benefit foregone** when a choice is made: the value of the **next best alternative** given up **Nature** Resources actually spent A **conceptual** cost, not necessarily financial **Use** Prevents overreach: the best resources are used first, so more output becomes harder and dearer. A high MC is justified only if the marginal benefit is equally high Forces the decision-maker to look past visible results to what was sacrificed **Handout example** Stadium: cement, steel and labour bought Stadium: the rural hospital or school that the same resources could have built The handout calls opportunity cost “arguably the most powerful concept in all of economics” and “the ultimate reality check on human intentions.” Economics “has no morals”: it does not say hospitals are better than stadiums, only that choosing the stadium means choosing **not** to have the hospital."}, {"ch": 4, "cht": "Basic Concepts of Economics: PPF, Goods and Capital", "id": "3-systems-of-resource-allocation-decentralised-v", "t": "3 · Systems of resource allocation: decentralised versus centralised", "x": "Two extremes (seen as systems of information and incentives) Decentralised (libertarian, free market) Centralised (authoritarian, command) **Core mechanism** Individuals have liberty to own, trade and allocate. Millions of consumers and producers use **prices** as signals An **authority** (king, dictator, politburo, feudal lord, even an elected government with such powers) directs the use of resources. Central planning replaces the market **Role of the state** **Laissez-faire.** Only the “invisible infrastructure”: rule of law, private property, contract enforcement, truthful information, preventing fraud and violence, minimal regulation (car safety standards) Controls or directs resources; intent is “deeply moral”: equitable, socialist distribution and protecting the vulnerable **Incentive** Self-interest (Adam Smith): to profit, a producer must offer what society values. Self-interest gives collective well-being: the **invisible hand.** Market punishes waste and rewards competence The state cannot meet all demands, so it appoints private entities as **state-created monopolies** (licences, quotas). The incentive shifts from serving consumers to **being connected:** **rent-seeking** (cronyism) **Critique** People differ in capabilities, capital and luck, so the capitalists come to dominate. Raises absolute wealth but produces **high inequality** from natural advantages **Information problem:** no planner can know the subjective wants and opportunity costs of millions. Designed to reduce inequality, it creates a **rigid, worse kind** (wealth goes to the politically connected, and even a more competent producer is denied) A state that enforces equality must use authoritarian force to confiscate and redistribute, crushing incentives. The handout quotes Milton Friedman: “A society that puts equality before freedom will get neither. A society that puts freedom before equality will get a high degree of both.” And George Bernard Shaw on communism at 20 and capitalism at 30. **None of the systems is perfect.**"}, {"ch": 4, "cht": "Basic Concepts of Economics: PPF, Goods and Capital", "id": "4-types-of-goods-applying-demand-and-supply", "t": "4 · Types of goods: applying demand and supply", "x": "Goods classified by how demand behaves Pair Defining behaviour Curve Examples **Necessary** vs **Luxury** (price elasticity) Necessary: high utility, **inelastic**; a big price change barely moves Qd. Luxury: lower utility, **elastic**; demand rises a lot when price falls slightly Necessary: steep (near vertical). Luxury: flat (near horizontal) Staples, life-saving drugs, salt vs high-end home décor, premium electronics, vacation packages **Normal** vs **Inferior** (income elasticity) Normal: demand rises with income, curve shifts **right.** Inferior: demand actively **falls** as income rises, curve shifts **left** Shift right / shift left Cars instead of bicycles, nutritious food vs coarse grains, public transport, second-hand clothing **Substitute** vs **Complementary** (cross-price) Substitutes: demand for A **rises** when price of B rises (positive cross-price elasticity). Complements: demand for A **falls** when price of B rises (negative cross-price elasticity). In complements one good leads and the other complements it - Coffee and tea; cars and petrol, bread and butter, printers and ink cartridges **Merit** vs **Demerit** (effect on society) Merit: positive externalities, **under-consumed** by the free market. Demerit: negative externalities, **over-consumed** - Education, healthcare, vaccines, libraries vs alcohol, tobacco, recreational drugs Very few goods are universally normal or inferior. A basic motorcycle is a **normal** good in a low-income nation (richer people buy more bikes) but **inferior** in a high-income one (they buy cars instead). It depends on the society’s baseline income. Exceptions to the law of demand: Veblen and Giffen Upward-sloping demand Veblen goods Giffen goods **What they are** Ultra-luxury goods; almost nil marginal utility over cheaper luxury versions; they give **social status** **Inferior** goods that, in special circumstances, show demand rising with price **Why price up means demand up** Status comes at a price. If the price falls, those who could afford it no longer find the unique status, so demand falls (and those who could not afford it still cannot) Must take a **massive share of a poor consumer’s income** and have **no cheaper substitutes.** A price rise makes him so much poorer he drops the costlier normal good and buys even more of the staple **Handout example** Luxury sports cars, designer jewellery, heritage items, rare animal breeds Worker spends 90% of income on coarse grain and 10% on meat. Grain price rises, meat becomes unaffordable, the worker buys more grain. The negative **income effect** overpowers the **substitution effect** **Reality** - Mostly **theoretical**, rarely observed"}, {"ch": 4, "cht": "Basic Concepts of Economics: PPF, Goods and Capital", "id": "5-private-goods-versus-public-goods", "t": "5 · Private goods versus public goods", "x": "The classification uses two characteristics: **excludability** (can you stop someone using it if they do not pay?) and **rivalry** (does one person’s use reduce what is left for others?). Classification of goods by consumption mechanics. Rows: excludable yes or no. Columns: rivalrous yes or no. Private goods (food, clothing, cars, electronics): the market works, non-payers are denied. Club goods (cable TV, private parks). Common resources (ocean fisheries, public roads). Public goods (national defence, law and order, clean air): market failure, the free-rider problem, no one pays voluntarily, so government and taxes are needed. Private versus public Private goods Public goods **Characteristics** Excludable **and** rivalrous. Consumers bid through prices for limited supply: “market efficiency” **Non-excludable** and **non-rival** **Result** Provided by the market **Free Rider Problem (FRP):** everyone expects someone else to pay, so no private business will produce it. A permanent unmet desire: **market failure** **Who provides** Producers Government: society gives someone authority to collect taxes and the responsibility to provide. “This is how a government comes into existence” **Examples** Food, clothing, cars, electronics Law and order (police), defence, administration, licensing and regulatory services, streetlights and lighthouses Because government resources are limited, it provides only the most vital ones, prioritised by necessity (police presence may be higher in one area than another). Because there is no rivalry, one person’s use does not reduce availability to others."}, {"ch": 4, "cht": "Basic Concepts of Economics: PPF, Goods and Capital", "id": "6-intermediate-versus-final-goods-the-production", "t": "6 · Intermediate versus final goods: the production boundary", "x": "This classification is crucial for calculating **National Income (GDP).** A good is not inherently intermediate or final; it depends on **end-use.** The production boundary. Scenario A: a household buys salt to cook dinner; economic identity retained, result is a final good. Scenario B: a hotel buys salt as an ingredient of a meal for sale; economic identity modified, salt becomes an intermediate good and the meal the final good. **Intermediate goods (IG):** used as inputs for other goods **for resale;** their economic identity is **lost** (modified into a new good meant for sale). **Final goods (FG):** economic identity **retained;** no further **economic** modification, even if physically or chemically changed. **Crucial:** the new good may or may not be physically or chemically different. What matters is only whether it was **economically** modified. The handout’s examples Case Classification Reason Salt bought by a household (cooked at home) **Final** Home-cooked food is not sold; no new commercial identity Salt bought by a hotel **Intermediate** The meal is sold; the salt’s value merges into the price of the dish Mobile phone, screen guard and cover used together All **final** Physical assembly by the consumer is only a way of using final goods; no commercial value added for resale Phone sold second-hand after 3 years Still **final** Identity was finalised at first purchase; resale is only a transfer of ownership of an existing final good, no new production"}, {"ch": 4, "cht": "Basic Concepts of Economics: PPF, Goods and Capital", "id": "7-consumer-goods-versus-capital-goods-fixed-vers", "t": "7 · Consumer goods versus capital goods; fixed versus working capital", "x": "Both consumer goods and capital goods are **sub-categories of final goods:** neither is transformed and resold. **Consumer goods:** final goods for household consumption (non-producers). By replacement frequency: **durables** and **non-durables.** **Capital goods:** machines and tools that **assist** production; bought by **producers.** Unlike raw materials (used up in one cycle) they last for **many** production cycles. They are still **final goods.** In the System of National Accounts (SNA) capital goods are **produced assets** “used repeatedly or continuously in production processes for **more than one year**”: factory buildings, heavy machinery, blast furnaces, delivery trucks, tractors, and intangibles such as commercial software and R&D. Fixed capital versus working capital Fixed capital Working (circulating) capital **What** Assets retained and used repeatedly over **more than one accounting year** Capital used up in day-to-day operations; identity modified or liquidated within a production cycle or **under a year** **Role** The rigid “infrastructure” of capacity; not for immediate resale The “blood” through the infrastructure **Examples** Plants, machinery, equipment, buildings Raw-material inventory, work-in-progress, cash for wages and utilities **Financial capital (money, stocks, bonds) is NOT economic capital in this context,** because a stock certificate cannot manufacture a product. The handout says: “Do not make this mistake in the exam.”"}, {"ch": 4, "cht": "Basic Concepts of Economics: PPF, Goods and Capital", "id": "8-investment-and-gross-capital-formation", "t": "8 · Investment and gross capital formation", "x": "In everyday language investment means mutual funds or gold. In macroeconomics that is merely a **transfer of financial assets: not investment.** **Investment is the expenditure by firms on capital goods in a period (usually a year).** Stock versus flow Capital Investment **Type** **Stock** variable **Flow** variable **Meaning** Total value of machines a firm currently owns Money spent buying **new** capital goods over a period Institutions such as the IMF, OECD and India’s National Accounts Statistics call it **Gross Capital Formation (GCF):** “the total value of the gross fixed capital formation, changes in inventories, and acquisitions less disposals of valuables for a unit or sector.” Total investment (GCF) = GFCF + Δ Inventory + Valuables 1 · GFCF (Gross Fixed Capital Formation) Addition to the stock of fixed capital before depreciation: machines, tools, software, buildings, new roads, factories, intellectual property. The **most important** component. A high GFCF share of GDP signals a rapidly industrialising, future-focused economy GFCF has three parts a) business fixed investment (machinery), b) public investment (roads, bridges), c) residential construction investment (houses) 2 · Δ Inventory Unsold or unused stock, treated by convention as capital. A factory makes 100 cars and sells 90: the 10 unsold are added to inventory, as if the firm invested in its own unsold goods 3 · Acquisition of valuables Non-financial assets held as a store of value, not for production or consumption: monetary gold, diamonds, antiques Households “produce” labour services, and dwelling units are the infrastructure that sustains that. So an addition to the number of dwellings in a year is **investment,** not consumption."}, {"ch": 4, "cht": "Basic Concepts of Economics: PPF, Goods and Capital", "id": "9-depreciation-cfc-cca-and-maintenance", "t": "9 · Depreciation, CFC, CCA and maintenance", "x": "**Depreciation** is the loss in value of capital goods from an actual or perceived loss of ability to assist production, commonly wear and tear. It is **neither an actual loss nor an actual expenditure.** Gross spending on capital goods is partly only replacement, so: **Net Investment = Gross Investment − Depreciation.** Three scenarios Case Meaning Effect Net investment > 0 More new machines than worn-out ones Productive capacity expands (PPF shifts outward) Net investment = 0 Just enough to replace the broken ones Economy is stagnant Net investment < 0 Not enough even to cover depreciation Capital stock shrinks; capacity collapses Depreciation versus CFC versus CCA Term Whose tool Basis Handout example (machine bought for ₹10 lakh in 2015) **Depreciation** Corporate accountant (financial accounting) **Historical cost** (original price) Lasts 10 years, so ₹1 lakh deducted each year, even if a new machine now costs ₹25 lakh **Consumption of Fixed Capital (CFC)** National statistician and the RBI (SNA); used for **NDP and NNP** **Current replacement cost** (today’s market price) Replacing 10% of its capacity costs ₹2.5 lakh today, so CFC is recorded as ₹2.5 lakh, not ₹1 lakh **Capital Consumption Allowance (CCA)** Income Tax Department (tax lawyer’s tool) **Statutory rate** set by the government; a “legal fiction”; applied on historical cost Accelerated depreciation: writing off 40% of a solar plant in year one to encourage green energy, though it did not lose 40% of capacity **Maintenance** is routine expenditure to keep an asset working (oiling a machine, fixing a belt). It is an **intermediate cost.** It does **not** stop depreciation: a perfectly oiled 1990s loom still becomes useless because a 2024 automated loom is 10 times faster (obsolescence)."}, {"ch": 5, "cht": "National Income Accounting: GDP, GVA, GNP and Alternatives", "id": "exam-lens-priority-and-pyqs", "t": "Exam lens: priority and PYQs", "x": "**Handout only.** No class slides and no teacher ink. The handout ends with **3 Prelims PYQs** (2018, 2015, 2015). **Mains PYQs: none quoted in the material.** This is the longest conceptual chapter so far and the formula chapter of the book. Prelims PYQs quoted in the handout Year What was asked Answer in handout Where covered / trap 2018 Increase in absolute and per capita real GNP do not connote a higher level of development, if… (c) poverty and unemployment increase Section 11 (limitations of GDP: inequality, well-being) and Chapters 1 and 3 2015 A decrease in the tax-to-GDP ratio indicates: 1. slowing economic growth rates 2. less equitable distribution of national income (a) 1 only Handout gives only the answer. Statement 2 is the trap 2015 Real GDP growth has steadily increased in the last decade? GDP at market prices (in rupees) has steadily increased in the last decade? (b) 2 only Section 8: nominal GDP rises with prices; real growth does not rise steadily What the handout stresses Signal in the handout Where Why it matters A = B = C: income, production and expenditure are equal over a year (dynamic equilibrium) Sections 2-3 The base of all three approaches **GDP = GVA + net product taxes;** GVA is at basic price Sections 7 and 9 Appears again as a “headline” formula MP, BP and FC: product taxes versus production taxes Section 9 The handout builds this carefully: volume-based versus lump-sum Production approach is given primacy; “discrepancy” balances the expenditure side Section 10 Statement-type question **2022-23 new base year; double deflation; SUT** (early 2026 changes) Section 10 Current-affairs hook inside the handout Eight alternatives to GDP, each with one defining feature Section 12 Match-the-pair questions **Prelims hooks:** the A-B-C identity; injections (I, X, G) and leakages (S, T, M); AD = C + G + I + X − M; GDP terms (total, value, final, produced, territory, time); GNP = GDP + NFIA; GVA; nominal versus real; base-year properties; MP = BP + product taxes − product subsidies; FC = BP − production taxes + production subsidies; the eight GVA sectors; MCA-21; labour input method; HDI components; the eight alternatives; NI = NNP at factor cost; PI and PDI. **Mains hooks:** why GDP is still king despite its limits; limitations (merit versus demerit, inequality, unpriced work, externalities, informality, inflation); how the informal sector is estimated; why the base year matters; what the 2022-23 revision changes. **Closing idea:** GDP is a good thermometer of income and a poor judge of well-being, which is why we pair it with other indices."}, {"ch": 5, "cht": "National Income Accounting: GDP, GVA, GNP and Alternatives", "id": "1-what-national-income-accounting-is-for", "t": "1 · What national income accounting is for", "x": "**Accounting** is the systematic recording, classification and summarising of incomes. **National** sets the boundary: either the income earned **in** the nation (irrespective of who earns it) or the income earned **by** the nationals (irrespective of where). **Income** is strictly the reward paid for the **Factors of Production:** rent for land, wages for labour, interest for capital, profit for entrepreneurship. Without national accounts the government, the central bank and citizens are “driving blind”: NIA is the economy’s **dashboard.** It cannot be measured by asking 1.4 billion people what they earn (people lie, forget, and much of the economy is informal), so the handout builds the idea in three steps: a **basic model** (the “tree’s shadow”), an **advanced model** (dropping unrealistic assumptions) and the **real world** (the methods used in India today)."}, {"ch": 5, "cht": "National Income Accounting: GDP, GVA, GNP and Alternatives", "id": "2-circular-flow-of-income-model-cfim", "t": "2 · Circular flow of income model (CFIM)", "x": "Two entities only: **households** (own all factors of production and supply them) and **firms** (use them to produce and sell goods back). The Circular Flow of Income Model. Assumptions: no savings, no government, no foreign trade. Households give factors of production (land, labour, capital, enterprise) to firms (real flow); firms pay incomes (A); households spend (C) to buy goods (B). A = B = C. The three flows Label Meaning **A** · total incomes Total payments by firms to households for factors: wages + rent + interest + profit **B** · total production Total value of all goods and services produced by firms **C** · total expenditure Total money spent by households on those goods **CFIM states A = B = C.** Households spend all they earn (A = C); firms keep no inventory (B = C); firms pay out all expenditure received as factor incomes (whatever is left is profit for the entrepreneurial households)."}, {"ch": 5, "cht": "National Income Accounting: GDP, GVA, GNP and Alternatives", "id": "3-multi-sectoral-model-msm-injections-and-leakag", "t": "3 · Multi-sectoral model (MSM): injections and leakages", "x": "CFIM assumes no saving, no inventory, no government, no foreign trade and no spending on capital goods. The MSM drops all of these and still arrives at **A = B = C**, but as a **dynamic equilibrium:** the three are always changing, may not be equal at a point in time, but readjust towards each other. “**A will always chase C, and B will always chase A.**” They are **flow variables** measured over a period (usually a year). The Multi-Sectoral Model (open economy). Households, firms, government, banks and foreigners. Leakages (dotted): savings, taxes, imports. Injections (solid): investment, government expenditure, exports. Leakages and injections Items Effect **Leakages** (pull money out) Savings (S), taxes (T), imports (M) A, B or C shrinks **Injections** (pump money in) Investment (I), exports (X), government expenditure (G) A, B or C expands **Saving example:** households save, spend less; firms build inventory, produce less next cycle, use fewer factors, pay less income: C falls, then B, then A. **Government** is both a special household and a special firm. Spending on goods raises C, then B, then A. Hiring teachers and soldiers raises A, then C, then B. Savings go through banks to firms as investment, again lifting B, C and A. Export demand does the same. **The economy grows only if injections exceed leakages.** Over an accounting year the adjustments settle and A = B = C."}, {"ch": 5, "cht": "National Income Accounting: GDP, GVA, GNP and Alternatives", "id": "4-the-three-approaches-to-measuring-national-inc", "t": "4 · The three approaches to measuring national income", "x": "Three ways to measure the same total Approach Formula What it counts **Income (A)** TI = R + P + W + Int All payments to factors of production in the domestic territory **Expenditure (C)** TI = AD = C + G + I + X − M Expenditure **received by domestic firms.** Total spending is C + G + I + X, but each of C, G and I has a domestic and a foreign part; subtract the foreign parts (total imports M) to get what domestic firms received **Production (B)** TI = GDP = Σ VAᵢ = GVA Total value of final goods and services produced in a year GDP word by word Total value of all final goods and services produced in an economy over a given time Word Meaning in the handout **Total** GDP is an aggregate: indifferent to merit versus demerit goods and to who owns the factors **Value** Not “worth” (which varies by person) but the objectively assessed **price** (transaction value). So only goods and services that have a price count: a parent cooking dinner for a child is excluded **Final** Only final goods. Their value already includes intermediates, so counting both is **double counting** **Produced** Counted in the year of **production,** not when or how often sold. Second-hand sales are not counted again, but new services (brokerage, registration, repair) are **Economic territory** Production inside the territory, **irrespective of who produces** (residents or foreigners) **Given period** A flow variable: a quarter or a year The handout asks: if you buy land worth ₹10 crore in Delhi, what is the effect on GDP? It leaves the question open. By its own rules (“production matters, not the sale”) the purchase itself adds nothing; services such as brokerage and registration would."}, {"ch": 5, "cht": "National Income Accounting: GDP, GVA, GNP and Alternatives", "id": "5-economic-territory-and-gnp", "t": "5 · Economic territory and GNP", "x": "The economic territory (ET) mostly coincides with the political territory, **except:** Where economic territory differs from the map Counts as India’s ET Does NOT count as India’s ET **Enclaves abroad:** Indian embassy in Washington, consulate in Dubai, research bases in Antarctica (Bharati, Maitri). Salaries of Indian staff are Indian GDP **Foreign enclaves in India:** the American embassy in Chanakyapuri, a Japanese consulate in Mumbai: part of that country’s GDP **Ships and aircraft in international transit:** an Air India flight over the Atlantic, a Shipping Corporation of India vessel in the Mediterranean **International organisations in India:** UN, WHO, IMF offices are “extraterritorial”; their core production is excluded **Fishing vessels and oil rigs in international waters** where India has exclusive exploitation rights (the EEZ) **GNP** is the total value of final goods and services produced by the **nationals** of a country (residents), wherever they are. The handout writes **GNP = GDP + C − B** where C is output by Indians abroad and B is output by foreigners in India, i.e. **GNP = GDP + NFIA** (net factor income from abroad). If nationals produce more outside than foreigners produce inside, GNP exceeds GDP. In this section the handout reuses the letters B and C for “output by foreigners in India” and “output by Indians abroad”, while elsewhere B and C are the production and expenditure flows. **Rule for the exam hall:** write it as **GNP = GDP + NFIA = GDP + (income earned by Indians abroad − income earned by foreigners in India).**"}, {"ch": 5, "cht": "National Income Accounting: GDP, GVA, GNP and Alternatives", "id": "6-the-gva-method-why-gdp-is-counted-by-value-add", "t": "6 · The GVA method: why GDP is counted by value added", "x": "Using GDP = Σ Pᵢ·Qᵢ over final goods needs final goods to be separated from intermediates, which is nearly impossible: every producer sees their output as final. Instead, **each producer’s value added** is summed: **VAᵢ = output value − input value.** The total is **GVA, which equals GDP.** The handout’s wheat-atta-bread-sandwich economy (all in rupees) Producer Output Inputs bought Value added Farmers (wheat) 1,00,000 0 1,00,000 Atta makers 1,00,000 60,000 wheat 40,000 Bread makers 1,00,000 60,000 atta 40,000 Sandwich makers 1,00,000 60,000 bread 40,000 **GDP = GVA** **2,20,000** Final goods check: wheat 40k + atta 40k + bread 40k + sandwiches 1L = **₹2.2 lakh.** The two methods agree. The proof: the value of any final good equals the total value added by all producers with respect to that good; summing over all final goods gives the total value added by all producers."}, {"ch": 5, "cht": "National Income Accounting: GDP, GVA, GNP and Alternatives", "id": "7-nominal-and-real-gdp-the-base-year", "t": "7 · Nominal and real GDP; the base year", "x": "Valuing output at different prices Nominal GDP Real GDP **Formula** P(current year) · Q(current year) Q(current year) · P(constant base-year price) **Prices** Current prices Constant (e.g. previous year or a base year) **Use** Size of the economy at today’s prices Fair comparison of output across years, removing price changes. **Economic growth = % change in real GDP** A **base year** provides the constant prices. The handout says the choice dictates the officially measured growth rate. A good base year has two properties: **Structurally similar** to the present (the “time machine” problem): the basket produced and consumed should resemble today’s. Using 1980 would make telecom impossible to price (no smartphones or 5G then). So it should be as recent as possible, usually updated every **5 to 10 years.** **Stable** (avoiding the **base effect**): if 2020, a Covid year, were the base, 2021’s recovery would look like 20-25% growth. A base year must be free of droughts, floods, pandemics, wars and policy shocks such as demonetisation. “It should be a boring year.”"}, {"ch": 5, "cht": "National Income Accounting: GDP, GVA, GNP and Alternatives", "id": "8-market-price-basic-price-and-factor-cost", "t": "8 · Market price, basic price and factor cost", "x": "Because of government taxes and subsidies, what the buyer pays differs from what the seller receives. Output can be valued at three prices: Three prices Price Meaning Relation **Market price (MP)** What the **buyer pays:** the sticker price. Closer to the consumer MP = BP + product taxes − product subsidies **Basic price (BP)** What the seller actually wants to receive and keep: the “factory gate price” BP = MP − product taxes + product subsidies **Factor cost (FC)** The cost attributable to the factors of production: what workers, landowners and capitalists take home. Closer to the producer FC = BP − production taxes + production subsidies Product versus production taxes and subsidies Product T and S Production T and S **Basis** Levied or given on a **quantity** basis (per unit, per kg, per litre) Independent of the volume of production: **lump sum** **Examples** GST (₹100 good + 18% GST = ₹118 market price, seller keeps ₹100); subsidies on LPG and fertilisers Land revenue, stamp duties, a municipal factory licence fee; help for setting up in a backward region or for small-scale industry **GDP(BP) = GDP(MP) − product taxes + product subsidies,** so **GDP(MP) = GDP(BP) + product taxes − product subsidies.** **GDP(FC) = GDP(BP) − production taxes + production subsidies.** Headline form: **GDP = GVA + net product taxes** (GDP at market prices = GVA at basic prices + product taxes − product subsidies). The handout first introduces GDP(MP) = GDP(FC) + total indirect taxes − subsidies and says this was “nothing wrong” but incomplete: factor cost needs the production-level taxes and subsidies removed as well. **Rule for the exam hall:** use the BP step."}, {"ch": 5, "cht": "National Income Accounting: GDP, GVA, GNP and Alternatives", "id": "9-how-india-estimates-gdp", "t": "9 · How India estimates GDP", "x": "Step 1 · The global rulebook: SNA 2008 UN System of National Accounts. India overhauled its GDP methodology in **2015** to align with it, so that numbers are comparable across years and countries Step 2 · Slice the economy NSO under MoSPI defines the economic territory and splits the economy into agriculture, industry and services, then **8 official GVA sectors** Step 3 · Choose the tool for each sector Different methods for agriculture, organised corporate and unorganised sectors (below) Step 4 · Extrapolate Scale the sample up to the sub-sector using secondary data and assumptions that are reasonable, standardised and replicable Step 5 · From GVA to headline GDP Add the 8 sectors to get **GVA at basic prices,** then **GDP(MP) = GVA(BP) + product taxes − product subsidies** Step 6 · Reality check Production-method GDP and expenditure-method AD rarely match (different data sources). The NSO gives **primacy to the production method** and adds a balancing **“discrepancy”** to the expenditure side The eight GVA sectors # Sector 1 Agriculture, forestry and fishing 2 Mining and quarrying 3 Manufacturing 4 Electricity, gas, water supply and other utility services 5 Construction 6 Trade, hotels, transport, communication and broadcasting 7 Financial, real estate and professional services 8 Public administration, defence and other services Method by sector Sector Method Detail **Agriculture** Production method Satellite data give **total sown area;** multiply by **yield per hectare;** multiply by mandi prices to get gross value **Organised corporate** Value added method using **MCA-21** (Ministry of Corporate Affairs database) Every registered company uploads audited balance sheets and P&L; value added = revenue − intermediate expenses. The shift to MCA-21 in **2015** replaced the old **Annual Survey of Industries (ASI) establishment approach** (counting factory output) with an **enterprise approach** that also captures R&D labs, marketing and headquarters **Unorganised** **Labour input method** (Effective Labour Input) Employment surveys (e.g. PLFS) give the **headcount;** a smaller survey gives **value added per worker;** multiply. Example: 10 lakh e-rickshaw drivers × ₹1.8 lakh a year = ₹18,000 crore The informal sector is estimated at **60-90%** of the economy (the handout’s range). Two sample firms have a combined value added of ₹100 crore (from MCA-21). The NSO needs their share of the market. A survey of 1,000 students finds 400 study at the two firms, so they are 40% of the market. **Total output = 100 crore ÷ 40% = ₹250 crore.** If they held 10% it would be ₹1,000 crore; at 50%, ₹200 crore. The same issue arises with Airtel, Jio and Vodafone: Airtel’s rent and financial income must not be counted as telecom value added. This is why SNA 2008 rules are needed. **New base year 2022-23,** seen as a “normal” post-Covid, post-GST stabilisation year reflecting a service-heavy, digital economy. The older 2011-12 had become distant. **Double deflation** adopted for manufacturing and agriculture: inflation stripped separately from inputs and outputs (earlier: single deflation of output only). **High-frequency data** directly integrated: GST collections, e-Vahan vehicle registrations, digital transactions. **Supply and Use Tables (SUT)** reconcile the production and expenditure methods, reducing discrepancies."}, {"ch": 5, "cht": "National Income Accounting: GDP, GVA, GNP and Alternatives", "id": "10-limitations-of-gdp", "t": "10 · Limitations of GDP", "x": "Why GDP only approximates well-being Limitation Handout’s illustration **Aggregate: ignores composition** Country A produces ₹1,000 crore of schools, hospitals and clean energy; Country B ₹1,000 crore of assault weapons, cigarettes and casinos. Same GDP, very different well-being (merit versus demerit) **Ignores inequality** 10 people, GDP ₹100, per capita ₹10 looks fine, but one holds ₹99 and nine share ₹1 **Counts only priced goods and services** Hire a maid and GDP rises; the family does it and it does not. India has large non-monetised sectors (subsistence farming, household care), so well-being is understated **Externalities** Cutting a forest raises GDP; a polluting factory raises GDP; the inhalers bought for the resulting asthma raise GDP too **Hard to estimate with a large informal sector and black money** Estimates less accurate; comparison unfair **Valued at price** Prices can rise from inflation, higher taxes or lower subsidies, which do not improve well-being"}, {"ch": 5, "cht": "National Income Accounting: GDP, GVA, GNP and Alternatives", "id": "11-alternatives-to-gdp", "t": "11 · Alternatives to GDP", "x": "The eight alternatives Index What it is **1 · HDI** Proposed by Amartya Sen and Mahbub-ul-Haq to UNDP (the handout says **1980**), reported in the Human Development Reports. **Composite of three dimensions:** a long and healthy life (**life expectancy at birth**), knowledge (**expected years of schooling** and **mean years of schooling** for ages 25+), decent standard of living (**GNI per capita** in PPP international dollars). Groups: low, medium, high, very high. **India is in the medium category** **2 · IHDI** (Inequality-adjusted HDI) HDI “discounted” for inequality in health, education and income. If perfectly equal, HDI = IHDI **3 · GDI** (Gender Development Index) Gender gap in HDI: HDI of women compared with that of men **4 · GII** (Gender Inequality Index) Loss of achievement from gender inequality: reproductive health (maternal mortality), empowerment (women in parliament), labour-market participation **5 · GPI** (Genuine Progress Indicator) GDP **plus** unpaid volunteer and household work, **minus** costs of pollution, crime and resource depletion **6 · GNH** (Gross National Happiness) Pioneered by **Bhutan;** rejects pure materialism; **nine domains** including psychological well-being, cultural resilience, community vitality, ecological diversity **7 · Green GDP** GDP minus the monetary value of environmental degradation and depletion of natural capital **8 · GHI** (Global Hunger Index) 100-point severity scale (**0 best, 100 worst**). Four indicators under three dimensions: **inadequate food supply; child undernutrition** (wasting and stunting in under-fives); **child mortality** **(i) Standardisation and objectivity:** built on UN SNA 2008, calculated the same way everywhere; alternatives rely on subjective assumptions (how do you value “happiness”?). **(ii) Data availability:** GDP is calculated regularly by almost every country, and can be done **quarterly,** a “real-time heartbeat monitor”. The handout says Sen and Mahbub-ul-Haq proposed the HDI to UNDP in **1980.** The handout also says the HDR has measured it “since then”. **Rule for the exam hall:** treat the year as a detail to verify against your standard reference before quoting; the question is more likely to test the three dimensions."}, {"ch": 5, "cht": "National Income Accounting: GDP, GVA, GNP and Alternatives", "id": "12-the-family-of-national-income-measures", "t": "12 · The family of national income measures", "x": "Aggregate measures Measure Formula Income approach TI = R + P + W + Int Expenditure approach TI = AD = C + G + I + X − M Production approach TI = GDP = Σ VAᵢ = GVA GNP (income of nationals) GNP = GDP + NFIA Income from the use side TI = C + S + T (consumption, savings, taxes) Average, headline and special measures Group Measure Meaning **Average** **Per capita income (PCI)** GDP ÷ mid-year population **GNI per capita** GNP ÷ population, with NFIA = income earned by Indians outside India − income earned by foreigners in India **Headline** **GDP** GDP(MP), i.e. nominal GDP **GVA** GVA(BP); GDP(MP) = GDP(BP) + product taxes − product subsidies; **GDP = GVA + net indirect taxes** **Economic growth** % change in **real** GDP **National Income (NI)** **NI = NNP at factor cost = GNP(MP) − indirect taxes + subsidies − depreciation** **Special** **Personal income (PI)** Household income. **PI = NI − incomes not paid to households + other transfers to households.** Subtract corporate taxes (CT), undistributed profits (UP) and net interest paid by households; add transfers by firms or government to households (bonuses, welfare transfers, scholarships) **Personal disposable income (PDI)** **PDI = PI − personal taxes** (income, property, professional). PDI = consumption + savings Transfers (for example money from a brother in Dubai) are **not income;** they are only a transfer of the right to spend income earned by someone else. Counting them in GDP would double count. But when the money is spent, it becomes consumption (C), and the circular flow lifts B and A."}, {"ch": 6, "cht": "Inflation: Causes, Measurement, Effects and Control", "id": "exam-lens-priority-and-pyqs", "t": "Exam lens: priority and PYQs", "x": "**Handout only.** No class slides and no teacher ink. **No Prelims or Mains PYQ is quoted** in this handout: none quoted in the material. The priority below is the handout’s own emphasis (definitions, worked examples, and the recent changes in measurement). What the handout stresses Signal in the handout Where Why it matters Inflation is a rise in the **price level,** not in one price. Prices rise when **AD exceeds AS** Sections 1-2 The base of every cause and every cure Index = (100 ÷ base-year basket price) × current basket price. Inflation = % change over the **same month** of the previous year Section 4 Worked numbers (₹10,000 → ₹15,000 → ₹16,500) The new **2024 = 100** CPI series (released Feb 2026): 12 divisions, COICOP 2018, food weight 36.75%, 358 items, e-commerce data Section 5 Recent changes; a likely current-affairs hook **Headline = CPI-C,** target **4% ± 2%,** adopted for inflation targeting in **2015;** Urjit Patel Committee **2014** Section 6 Facts and dates Core inflation: headline minus **food and fuel;** petrol and diesel stay **inside** core Section 6 A classic trap Stagflation breaks the **Phillips Curve** (A.W. Phillips, UK 1861-1957) Section 7 Concept plus author Fiscal drag: inflation pushes workers into higher tax brackets; an **automatic stabiliser** Section 9 Worked table (₹9 L → ₹10.8 L) Real interest = nominal interest − inflation (RIR = NIR − Inflation) Section 8 Borrowers gain, lenders and depositors lose **Prelims hooks:** price versus prices; AD and AS factors; demand-pull versus cost-push; CPI versus WPI (who releases which); the 2024 base and 12 divisions; headline, core, super core, skewflation, structural inflation; deflation versus disinflation; recession versus depression; shrinkflation; stagflation and the Phillips Curve; Engel’s Law; fiscal drag. **Mains hooks:** why inflation hurts the poor most (Engel’s Law); who gains and loses; why a cause-agnostic cure is needed; why cheaper-money policy fuels demand-pull; fiscal drag as an automatic cooling effect; why a lower food weight changes how the RBI reads inflation. **Closing idea:** inflation is AD chasing AS; since you cannot fix every cause in time, make money expensive and AD falls."}, {"ch": 6, "cht": "Inflation: Causes, Measurement, Effects and Control", "id": "1-what-inflation-is-and-what-it-is-not", "t": "1 · What inflation is, and what it is not", "x": "**Inflation is a general rise in prices or the price level.** A rise in the price of one good may cause inflation but is **not** inflation by itself. People feel inflation when the **overall value of the basket** they buy goes up. Each person has a different basket, so the experience differs (the handout asks how an agricultural labourer in Odisha feels it versus a new joiner in a Bengaluru startup). **Price** is the value at which a single good is exchanged, set by that good’s demand and supply. **Prices (the price level)** are set by **Aggregate Demand (AD)** and **Aggregate Supply (AS).** We cannot measure inflation for each person. We track a **normative basket** reflecting the consumption pattern of a specific group."}, {"ch": 6, "cht": "Inflation: Causes, Measurement, Effects and Control", "id": "2-ad-as-and-the-price-level", "t": "2 · AD, AS and the price level", "x": "Aggregate Demand versus Aggregate Supply Aggregate Demand (AD) Aggregate Supply (AS) **Meaning** Total demand for all goods and services in the economy, which domestic producers are required to meet Total supply of all goods and services, what all producers produce combined **Depends on** General price level; incomes; spending habits (culture of spending); availability of money (easy loans); size of population General price level; availability of basic raw materials (coal, iron, oil); skill level of the population; investment in infrastructure, capital goods and R&D **Link to price level** Inversely related: if things become expensive, people demand less Rises with price level: producers have an incentive to produce more (but inputs eventually run out) The teacher’s sketches in the handout. Top left: equilibrium price level at a given level of GDP (AD meets AS). Top right: increase in price due to AD up, so higher price and higher demand (AD0 to AD1, Y0 to Y1). Bottom: prices rise due to a fall in AS, so higher price and lower production (AS0 to AS1, Y1 below Y0). Demand-side inflation: AD shifts right (demand-pull). Supply-side inflation: AS shifts left (cost-push). **Prices rise when AD exceeds AS:** either AD rises for some reason, or AS falls for some reason."}, {"ch": 6, "cht": "Inflation: Causes, Measurement, Effects and Control", "id": "3-causes-of-inflation", "t": "3 · Causes of inflation", "x": "Demand and supply factors of any good split into **specific** factors (taste for ice cream) and **general** factors (size of population, income levels, availability of money). Causes of inflation are the **general** factors that shift AD or AS, not the factors of one good. Demand-side versus supply-side inflation Demand-pull (AD shifts right) Cost-push (AS shifts left) **Trigger** Anything that raises AD Anything that lowers AS or restricts production **Examples** Rising income levels; easy money (lower interest rates, cheaper credit); more government spending; rising population; changing spending habits (less saving, more consumption, usually a secondary effect of higher incomes) Rising cost or non-availability of basic raw materials (crude, metals, coal); higher cost of factors of production (wages, interest on capital); low investment (poor infrastructure, no capital goods, poor R&D); falling productivity or failure to adopt new skills; poor Ease of Doing Business (compliance, contract enforcement, weak entrepreneurship culture); frequent disasters disrupting supply chains **Other factors** named in the handout: **Legal and market distortions:** cartelisation (producers collude to act as a monopoly), hoarding (artificial scarcity), widespread black money (untracked cash). **International shocks:** geopolitical tension, war, trade sanctions, disasters, especially in countries we import heavily from (oil producers)."}, {"ch": 6, "cht": "Inflation: Causes, Measurement, Effects and Control", "id": "4-measuring-inflation-and-the-idea-of-an-index", "t": "4 · Measuring inflation and the idea of an index", "x": "Inflation is the **percentage change in prices** in the current period over the previous period. It is usually reported **year-on-year (Y-o-Y):** the current month against the **same month** of the previous year. Identify the **target group.** Construct a **normative basket** of goods and services for an average person in that group. Choose a **base year.** The basket is built separately for each month to account for seasonality. The importance of each item is its **weight** (% of total expenditure). Most items stay, some enter and exit, and some weights change. Collect the prices of the items for each month of the base year to get the basket’s total price. Collect the prices for the corresponding months of later years to get the new basket price. Inflation = **% change** in the basket price in a month of this year over the same month of last year. Communicate the **index value** along with the % change over the year."}, {"ch": 6, "cht": "Inflation: Causes, Measurement, Effects and Control", "id": "5-indexing-why-and-a-worked-example", "t": "5 · Indexing: why, and a worked example", "x": "If the government only said “prices are 4.3% higher than last year”, last year would become a moving benchmark. People need a **fixed** base. Also, the raw basket price (like ₹11,345 and ₹18,967) is a meaningless number for a normative basket. So the base-year basket price is set to a clean value, **usually 100.** The handout’s example Period Basket price Index value Base year (March 2015) ₹10,000 100 March 2025 ₹15,000 (100 ÷ 10,000) × 15,000 = **150** March 2026 ₹16,500 (100 ÷ 10,000) × 16,500 = **165** **Inflation (March 2026 over March 2025)** = (16,500 − 15,000) ÷ 15,000 × 100 = **10%.** An index of **165** means prices are **65% higher** than in the 2015 base year. The base year here gives a **constant basket** to compare the cost of living; in Real GDP the base year gives **constant prices** to value output."}, {"ch": 6, "cht": "Inflation: Causes, Measurement, Effects and Control", "id": "6-indices-in-india-and-the-2024-base-year-cpi", "t": "6 · Indices in India and the 2024 base-year CPI", "x": "Common inflation indices Index Variants Released by **CPI** CPI-Rural, CPI-Urban, CPI-Combined (CPI-C) National Statistical Office (NSO) under MoSPI **CPI-AL and CPI-IW** Agricultural Labourers; Industrial Workers Labour Bureau (Ministry of Labour and Employment) **WPI** Wholesale Price Index Office of the Economic Adviser (OEA), Department for Promotion of Industry and Internal Trade (DPIIT), Ministry of Commerce and Industry A working group chaired by **Prof. Ramesh Chand** was constituted to revise the **WPI base year from 2011-12 to 2022-23,** and to recommend a roadmap to switch from **WPI to a Producer Price Index (PPI).** India has **no official PPI.** So in **2017** WPI was adjusted to sit closer to **basic prices / factor cost** by **removing indirect taxes,** bringing it nearer to producers’ realised prices. **In Feb 2026 MoSPI released the new 2024 = 100 base-year series,** a structural overhaul, not a routine weight change: 2012 series versus 2024 series (as given in the handout) Change 2012 series 2024 series **Breakup of “Miscellaneous”** 6 groups; a giant “Miscellaneous” bucket (doctor visits, bus fares, school fees) with **28.32%** weight **12 divisions** under the UN **COICOP 2018** framework; Transport, Health, Education and Communications tracked separately **Engel’s Law (food loses its crown)** Food and Beverages weight **45.86%** **36.75%.** Food is volatile (onion, tomato spikes), so headline inflation should be less volatile and give the RBI a clearer demand signal **Digital and service economy** **299** items **358** items. Removed: VCRs, tape recorders, CDs. Added: OTT subscriptions, pen drives, attendant/babysitter services, pet products. For the first time, prices scraped from **12 major e-commerce platforms;** **Rural House Rent** introduced"}, {"ch": 6, "cht": "Inflation: Causes, Measurement, Effects and Control", "id": "7-key-terminology", "t": "7 · Key terminology", "x": "Headline, skewflation, core, structural Types of inflation measure Term Meaning in the handout Notes and trap **Headline inflation** Overall inflation = **CPI-C.** What the news reports Adopted as the **primary anchor of Inflation Targeting in 2015.** Shift from WPI to CPI-C recommended by the **Urjit Patel Committee, 2014.** Target set by the **Monetary Policy Framework Agreement at 4%, tolerance ±2%** **Skewflation** Inflation driven by a few items rising fast while most stay stable. “Skew” means bent or asymmetrical Gained prominence in India around **2009-2010** (Economic Survey): onions and pulses spiked while manufactured goods stayed cheap **Core inflation** Headline minus highly volatile items (**food and fuel**) that authorities cannot immediately control. Also **non-food, non-fuel** inflation NSO calculates headline; food and fuel are removed to reach core; **RBI calculates the value.** **Petrol and diesel for vehicles are inside core** (under Transport and Communication within Miscellaneous), not in “Fuel and Light”; their prices are controlled through taxation **Super core / refined core** Headline minus food, fuel, petrol, diesel and precious metals Truest picture of underlying demand **Structural inflation** Caused by structural features (poor infrastructure, bad EODB, skill deficits, supply-chain bottlenecks) that take long to fix Handout example: political complexity blocks agriculture supply-chain reform, so the current system stays inherently inflationary Many people assume petrol and diesel are in “Fuel and Light”. **The handout puts vehicle petrol and diesel under Transport and Communication, so they are inside core.** Exam-hall rule: core = headline minus food and fuel (Fuel and Light) only; petrol and diesel come out only in **super core.** Hyperinflation, deflation, disinflation **Hyperinflation:** runaway, exceptionally high inflation (galloping, trotting). Costs: **shoe-leather costs** (running to the bank before money loses value) and **menu costs** (constantly updating prices). > There is **no consensus** on the criteria separating high from hyper. **Phillip Cagan:** more than **50% per month.** Examples: **Weimar Germany (1923), Zimbabwe (2008).** It is commonly understood as the rate beyond people’s normal capacity to bear: the US normal is 1-2%, so 6% looks “hyper” there; India’s normal over two decades is 5-6%, so even 9% is “high”, not “hyper”; Turkey has had 80-100%. **Deflation:** a fall in prices (negative inflation). **Disinflation:** a fall in the **rate** of inflation; prices still rise, but slower, largely a result of **base effect.** Continued disinflation may become deflation. **Japan** is the famous modern deflation example: “Lost Decades” since the 1990s; consumers delayed purchases expecting cheaper goods tomorrow. Recession, depression, shrinkflation Contraction terms Term Meaning Note **Recession** Contraction in output for **two consecutive quarters** A rule of thumb. The US **NBER** looks at broader metrics (employment, industrial production, wholesale-retail sales) to declare one **Depression** Severe, prolonged contraction; the economy cannot get back to its original output No objective criterion. **Great Depression (1929):** US GDP fell by nearly **30%,** unemployment hit **25%.** “A recession is a speed bump; a depression is a crater” **Shrinkflation** Size or quantity of a good shrinks while the packet price stays the same Rampant in FMCG. Handout examples: **Parle-G, Maggi** cutting grammage to hold the ₹5 or ₹10 price point"}, {"ch": 6, "cht": "Inflation: Causes, Measurement, Effects and Control", "id": "8-spirals-stagflation-and-the-phillips-curve", "t": "8 · Spirals, stagflation and the Phillips Curve", "x": "**Price-wage spiral:** prices rise, workers demand higher wages, firms pass the wage cost to consumers, a continuous positive feedback loop. **Inflation expectations:** a **self-fulfilling prophecy.** If people expect prices to rise, panic-buying today creates shortages and prices actually rise. **Reflation:** the government induces inflation (stimulus cheques, tax cuts, lower interest rates) to boost AD and reduce unemployment after a recession or deflation. **Stagflation = stagnation of ou
