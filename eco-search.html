tput (low growth, high unemployment) + high inflation, together.** Merely a contraction is recession; merely high inflation is hyperinflation. Stagflation needs **both** to be adverse at once. Normally there is a **trade-off:** fast growth (low unemployment) comes with high inflation, and slow growth (high unemployment) comes with low inflation. This comes from the **Phillips Curve:** **A.W. Phillips** studied the **UK from 1861 to 1957** and found an **inverse relation between inflation (wage growth) and unemployment.** Points where both were low, or both high, were outliers; the both-high points are the periods of stagflation. If inflation is very high, unemployment is probably low, so the policy maker will pay the price of a slight rise in UE to cut inflation. If UE is very high, prices are probably low, so a rise in prices is a bearable cost to cut UE. **Stagflation breaks the Phillips Curve:** pursuing either goal worsens the other, which creates **policy uncertainty and paralysis.**"}, {"ch": 6, "cht": "Inflation: Causes, Measurement, Effects and Control", "id": "9-effects-of-inflation", "t": "9 · Effects of inflation", "x": "Time value of money and real return Inflation erodes money’s value. If ₹100 bought 1 kg of apples and apples now cost ₹110, ₹1 has gone from 1/100 kg to 1/110 kg. With 10% inflation, **₹110 this year buys what ₹100 bought last year.** Someone with ₹105 is nominally richer but **poorer in real terms.** You need **exactly inflation% extra** to keep your worth. **Real Interest Rate (RIR) = Nominal Interest Rate (NIR) − Inflation.** Handout example: lent at 10% with 7% inflation, the lender is richer by only **10% − 7% = 3%** in real terms. Who gains and who loses Group Effect Why **Borrowers** Benefit Inflation eats into the lender’s return and helps shoulder the borrower’s burden **Lenders (banks)** Lose, unless protected Banks protect themselves by (a) charging a high NIR that stays above inflation, or (b) using a **floating rate:** RIR fixed, NIR = RIR + inflation **Depositors** Lose They are lenders to banks with no bargaining power. Deposit rates (the handout says a meagre 2-3%) do not beat inflation, so the real return is generally **negative.** Even fixed deposits hardly beat inflation. This does **not** mean keep cash at home: cash loses value at the rate of inflation **Consumers** Lose Money loses purchasing power **Producers** Generally benefit Depends on pricing power: necessities have inelastic demand but more competition; luxuries have elastic demand but less competition. Most producers can pass on the rise, so profit margins expand"}, {"ch": 6, "cht": "Inflation: Causes, Measurement, Effects and Control", "id": "10-is-inflation-desirable-engel-s-law-and-the-po", "t": "10 · Is inflation desirable? Engel’s Law and the poor", "x": "As a consumer you might prefer deflation, but a healthy economy needs **low and stable** inflation. Low inflation within people’s tolerance **keeps producers profitable** so they invest, expand capacity, pay higher wages and create jobs. Stability brings predictability and stops people **delaying** decisions. **Ernst Engel:** as family income rises, the **% of income spent on food falls,** even if absolute spending on food rises. Corollary: a poor household spends most of its money on necessities like food, whose prices are volatile and whose producers can pass on price rises. So **the poor are disproportionately hit by inflation:** no buffer or luxury spending to cut."}, {"ch": 6, "cht": "Inflation: Causes, Measurement, Effects and Control", "id": "11-fiscal-drag-how-inflation-cools-itself", "t": "11 · Fiscal drag: how inflation cools itself", "x": "In inflation the government collects more **direct and indirect** taxes. Indirect taxes are mostly **ad valorem** (on the value of goods), so the same rate collects more. Direct taxes: a worker who negotiates a raise equal to inflation is pushed into a **higher bracket** under progressive taxation. The handout’s hypothetical (inflation 20%) Income ₹9 L Income ₹10.8 L (+20%) Slabs (hypothetical) 0-5 L at 10%; 5-10 L at 15%; 10-30 L at 20%; 30 L+ at 25% Same slabs Tax ₹50,000 on first 5 L + ₹60,000 on next 4 L = **₹1.1 L** ₹50,000 + ₹75,000 on next 5 L + ₹16,000 on next 80k = **₹1.41 L** Disposable income 9 − 1.1 = **₹7.9 L** 10.8 − 1.41 = **₹9.39 L** Change Post-tax income up **18.8%** Tax outgo up **28.2%** Nominal income rose by the full inflation rate (20%), but real disposable income rose only about 18-19%. People pay a larger share of their **increment** as tax. No new tax was imposed; the system does it automatically. People realise they are poorer, cut spending, **AD falls** and prices cool without the government acting. This automatic cooling is **fiscal drag,** acting as an **automatic stabiliser.** The table gives **18.8%** for the rise in post-tax income, but the text beneath says “grew by a lesser rate (18%)”. Use **about 18.8%** if asked for a number; the point (smaller than 20%) is what the exam wants."}, {"ch": 6, "cht": "Inflation: Causes, Measurement, Effects and Control", "id": "12-controlling-inflation-why-make-money-expensiv", "t": "12 · Controlling inflation: why “make money expensive”", "x": "**Two problems:** (1) identifying the cause (price is the collective outcome of many intertwined factors); (2) the ability to fix it (you cannot build roads and ports, or attract capital, in a year). Structural fixes (infrastructure, import resilience, EODB) are necessary but come too late. The solution must be **effective and agnostic of the cause.** Inflation is a consequence of **AD exceeding AS.** Bring down AD and prices cool. AD is expenditure using **money.** If money becomes **expensive,** people hold on to it and spend less. **The cost of money is the interest rate** (a loan of ₹1 lakh at 8%). Raise it from 8% to 10%: those with money save it for the higher interest, those without cannot afford to borrow. **Both reduce demand,** AD cools and prices fall. The price of money, like any price, depends on its **demand and supply.** Reduce the supply of money and its cost rises. **Who does this and how** is the next chapter: money, its demand and supply, and monetary policy. AD exceeds AS Prices rise Raise the cost of money Interest rate up (8% → 10%) Savers save, borrowers borrow less Spending falls AD falls Prices cool"}, {"ch": 7, "cht": "Banking and NBFCs: Regulation, NPAs, IBC and Financial Inclusion", "id": "exam-lens-priority-and-pyqs", "t": "Exam lens: priority and PYQs", "x": "**Handout only.** No class slides, no teacher ink. **No Prelims or Mains PYQ is quoted** in this handout: none quoted in the material. Priority below is the handout’s own emphasis (worked examples, asterisks, “Quick Reference of timelines”). What the handout stresses Signal in the handout Where Why it matters Banks are **decision-taking** intermediaries; regulation makes the **bank, not the depositor,** bear lending risk. RBI is the key regulator (SEBI for decision-facilitating ones) Sections 1-2 The logic of the whole chapter **CRAR ≥ 9%** (Basel 8%), **CCB 2.5%,** Tier 1 versus Tier 2, three risks (credit, operational, market) Section 3 Numbers and a worked example **SMA-0/1/2** (introduced **2014**), **NPA** at 90+ days, sub-standard, doubtful, loss; provisioning ~15%, 25-100%, 100% Section 4 Classification ladder **4R:** Recognise, Recover, Recapitalise, Reform. AQR 2013 proposed, from 2015; **₹2.11 lakh crore** recap bonds in **Oct 2017** Section 6 Dates and amounts **SARFAESI 2002** exclusions; **IBC 2016** creditor-in-control; CoC, 2/3 vote, 180 + 90 days (330 now) Section 6 Statutory detail Financial inclusion timeline: 1955, 1969, 1975, 1980, 1992, 2005, 2006, 2011, **Aug 2014 PMJDY,** 2015 Section 7 The handout’s own “Quick Reference” PSL: **40%** of ANBC; **75%** for RRBs, co-operative banks, SFBs Section 8 Number trap Payments bank cannot lend; SFB 75% PSL; NBFC 4-layer SBR (2022) Section 9 Differentiated entities **Prelims hooks:** CRAR, CCB, Tier 1 and 2, risk-weighted assets; SMA versus NPA; Net NPA and PCR; AQR; CRILC (₹5 crore); DRT, SARFAESI (what it excludes), IBC bodies (IBBI, NCLT, NCLAT, IU, CoC, IRP); recap bonds 2017; P.J. Nayak and BBB, FSIB; PMJDY; RRB 50:15:35; PSL targets; SFB and payments bank limits; NBFC layers; Nidhi and chit funds. **Mains hooks:** why regulate banks; how capital norms transfer risk; reasons for NPAs and why PSBs had more; twin balance sheet problem; evaluate the 4R strategy; IBC achievements and challenges; why PSB governance failed (the “Three Cs”); financial inclusion strategies and their limits. **Closing idea:** regulation does not stop banks taking risk; it makes them carry it with their own money."}, {"ch": 7, "cht": "Banking and NBFCs: Regulation, NPAs, IBC and Financial Inclusion", "id": "1-capital-markets-and-intermediaries", "t": "1 · Capital markets and intermediaries", "x": "Capital markets are the **markets of money.** Money is exchanged for a **promise,** a **contract** (Indian Contracts Act, 1872: an agreement enforceable in a court of law). Two broad types: Debt versus equity contracts Debt Equity **Meaning** Money given is to be **repaid,** generally with interest in a promised period Money is **not paid back;** the supplier gets **rights** (decisions, appointments, partial ownership of assets and incomes) **Examples** Bank loans, bonds Shares Intermediaries collect and spread information, improve trust and give convenience (creating, standardising and registering contracts), for a fee. Two kinds of intermediary Decision-making Decision-facilitating **Examples** Banks and NBFCs Brokers, stock exchanges **Who decides about the money** The intermediary, not the supplier The decision-makers (demander and supplier) themselves **Risk** The intermediary bears (or should bear) the risk, so it takes most of the reward Borne by the decision-makers **Regulation aims at** Making sure the supplier’s money is not put at risk; **RBI** is the key regulator Being truthful, transparent and non-partisan; **SEBI** is the key regulator This unit therefore has two parts: **banks and NBFCs,** and **capital (stock) markets** (the next chapter)."}, {"ch": 7, "cht": "Banking and NBFCs: Regulation, NPAs, IBC and Financial Inclusion", "id": "2-banking-and-its-regulation", "t": "2 · Banking and its regulation", "x": "A bank’s business is “**heads I win, tails you lose**”: the bank keeps the interest while the **depositor’s** money is at risk. That violates a fair transaction, so the bank must have **skin in the game.** A healthy banking system attracts deposits and keeps **credit** (“the lifeline of any economy”) flowing. **Key laws:** Indian Contracts Act 1872; Negotiable Instruments Act 1881; **RBI Act 1934;** **Banking Regulation (BR) Act 1949** (the key act, makes RBI the regulator); Companies Act 1956/2013. **BR Act, section 5:** “banking” = accepting deposits from the public for lending or investment, repayable on demand or otherwise, **withdrawable by cheque, draft, order or otherwise.** A banking company needs an **RBI licence;** only licensed entities may use the word “bank”. **Regulations cover:** depositor protection; reserve ratios; declarations on loans, stress and capital; senior appointments; Board independence from shareholders; promoters’ minimum capital; regular RBI audits. CRR and SLR are **deposit-side** regulations. Lending-side rules are also needed, in two forms: **recognition of risks** and **preparation for them.** The bank itself will not recognise risk honestly, so the **central bank** must do it."}, {"ch": 7, "cht": "Banking and NBFCs: Regulation, NPAs, IBC and Financial Inclusion", "id": "3-basel-norms-capital-provisioning-and-crar", "t": "3 · Basel norms, capital, provisioning and CRAR", "x": "To avoid compliance burden and **regulatory arbitrage** (registering where rules are weakest), central banks coordinate through the **BIS** (Bank of International Settlements, Basel, Switzerland) and its **BCBS** (Basel Committee on Banking Supervision), which issues **prudential (Basel) norms.** The current norms are **Basel III (2008)** per the handout. The three risks Basel III recognises Risk Meaning Affects **Credit risk** Risk of a particular loan: borrower’s or sector’s One loan **Operational risk** IT hacking, key employees resigning, a strike All loans equally **Market risk** External factors: wars, oil spikes, disasters, failure of other banks The entire balance sheet Basel I and II **failed spectacularly in the 2008 Global Financial Crisis** because they grossly underestimated **market and operational risk.** Basel III was designed to ensure banks have enough capital to survive a 2008-level panic. What “capital” means for a bank Capital is the business’s **own money,** over which it has a high degree of control. A firm raises it through **equity and debt** (both are **liabilities** for the firm and assets for the holder). **Deposits are not capital:** the depositor gives money for safety, with limited consent to lend it. Deposits are **pure liabilities.** Tier 1 versus Tier 2 capital (Basel III) Tier 1 (core capital) Tier 2 (supplemental) **Made of** Equity, founders’ money, retained profits Subordinated debt that must eventually be repaid **Control** Highest, permanent Lesser Preparation is in two parts: **(a)** against individual loans by **provisioning** (credit risk); **(b)** for the bank overall by the **minimum capital requirement** (operational and market risks). **Provisioning:** RBI sets a default risk by sector (from historical default data) and a **provisioning ratio.** The bank sets aside that % of the loan value from its capital. **Minimum capital:** the **Capital Adequacy Ratio (CAR),** measured as **CRAR = Capital ÷ Risk Weighted Assets ≥ 9%.** **RBI asks 9%; Basel requires 8%.** RWA = Risk × loan value. So **Capital ≥ 9% of RWA,** or RWA ≤ Capital ÷ 9%. A bank has capital and gives loans: **capital limits how much it can lend.** **Capital Conservation Buffer (CCB): 2.5% of RWA,** to protect the 9% line in times of stress. A loan can worsen (risk and provisioning rise), so a bank well capitalised at lending may not stay so. The handout’s farmer example (₹10 L agriculture loan; risk 20%, provisioning 3%) Step Calculation Amount Provisioning 3% × ₹10 L ₹30,000 RWA 20% × ₹10 L ₹2 L Minimum capital 9% × ₹2 L ₹18,000 **Total capital needed** 30,000 + 18,000 **₹48,000** to put ₹10 L of depositors’ money at risk **The hypothetical bank:** lendable deposits ₹5 Cr, available capital ₹10 L, CRAR 9%. Required capital builds up loan by loan: Capital used loan by loan (from the handout’s table) Borrower (sector) Loan Risk Provisioning Cumulative capital required Adequate (₹10 L)? P1 (Agri) ₹20 L 20% 4% ₹1,16,000 Yes P2 (MSME) ₹30 L 30% 6% ₹3,77,000 Yes P3 (Home loan) ₹30 L 10% 2% ₹4,64,000 Yes P4 (Car loan) ₹15 L 15% 3% ₹5,29,250 Yes P5 (Credit card) ₹12 L 90% 25% ₹9,26,450 Yes P6 (Agri) ₹20 L 20% 4% ₹10,42,450 No, cannot lend P7 (Car) ₹20 L 15% 3% ₹11,29,450 No, cannot lend Risky lending eats capital quickly: the **₹12 L credit-card loan (P5) takes ₹3,97,200** of capital, while the safer **P6 + P7 (₹42 L of loans) needs only ₹1.16 L + ₹0.87 L = ₹2.03 L.** **RBI does not ban risky lending.** It says: you have your own money, take all the risk you want. Regulation makes sense for banks to **prefer many low-risk loans,** so capital lasts and most lendable deposits are used. **Dynamism:** as borrowers repay, the asset value falls and required capital falls, freeing capital to lend more. When some borrowers default, their risk is reassessed upwards and provisioning rises. The farmer example uses provisioning of **3%** for a 20% risk, while the table row P1 (also agri, also 20% risk) uses **4%.** The handout never reconciles them. Exam-hall rule: use the numbers **given in the question;** remember only the method: provisioning + 9% × (risk × loan)."}, {"ch": 7, "cht": "Banking and NBFCs: Regulation, NPAs, IBC and Financial Inclusion", "id": "4-bad-loans-sma-npa-classes-and-ratios", "t": "4 · Bad loans: SMA, NPA classes and ratios", "x": "A loan is **overdue** when principal or interest or both are not repaid by the due date. The longer the overdue period, the worse the loan and the more capital it needs. The ladder of bad loans Class Overdue period Notes **SMA-0** 1 to 30 days Special Mention Account: technically not a bad loan, a **red flag.** Introduced **2014** **SMA-1** More than 30 up to 60 days RBI’s central database **CRILC** is alerted at SMA-1 or SMA-2 **SMA-2** More than 60 up to 90 days Early Warning System **NPA (more than 90 days)** Principal or interest or both overdue more than 90 days Before 2014 a loan was either “Standard” (0-89 days) or NPA (90+). Banks exploited it: default 88 days, pay one EMI on day 89, clock resets **NPA 1: Sub-standard** NPA for **less than or equal to 12 months** (from 31 Mar 2005) Well defined credit weaknesses; possible loss. Provision **~15%** **NPA 2: Doubtful** NPA for **more than 12 months** Collection in full highly questionable. Provision **25% to 100%** **NPA 3: Loss asset** No time criterion Considered uncollectible, not written off. Generally classed so about **two years** after doubtful. Provision **100%.** Threatened security can be classed doubtful or loss at once **Restructured loans:** renegotiated terms (lower interest, longer tenure, more security, lower or paused EMI). Standard practice for genuine difficulty, but they must be recognised separately. **Stressed assets = GNPAs + restructured assets.** **GNPA** = total loans classified NPA (as % of total loans). **Net NPA = GNPA − provisioning.** **PCR (Provisioning Coverage Ratio)** = capital as a proportion of GNPAs. **Evergreening:** restructuring abused to avoid recognising NPAs and keep capital free. Hence RBI’s transparency rules (AQR). **Haircuts and write-offs:** the bank first reduces asset value (haircut) and then to zero (write-off) to free capital. **Not a waiver:** the right to recover stays; it is an accounting step to remain in business."}, {"ch": 7, "cht": "Banking and NBFCs: Regulation, NPAs, IBC and Financial Inclusion", "id": "5-why-npas-arise-and-what-they-do", "t": "5 · Why NPAs arise, and what they do", "x": "Reasons for NPAs Type Details **A. Wilful default** (able to repay but does not) a) diverting the loan to another purpose; b) diverting it to another entity (company or person); c) fraudulently disposing of pledged securities **B. Economic reasons** General slowdown; sectoral slowdown (structural, industry or technology change); geopolitical (sanctions, tariffs, war, blocked trade routes, export-market recession); acts of God (floods, droughts, pandemics); government policy changes (withdrawn incentives, incentives to a competitor sector) **C. Poor risk assessment** Economic reasons hit all banks equally, so similar NPAs are expected. If some banks (PSBs, historically, versus private banks) have much higher NPAs, the reason is **poor risk assessment** Consequences Term Meaning **Double Financial Repression (DFR)** Problem in the **bank’s** balance sheet: assets become NPAs and yield nothing, while liabilities (deposits) stay unrelenting; more provisioning cuts its ability to turn liabilities into assets **Twin Balance Sheet Problem (TBP)** Borrower’s balance sheet is stressed, so the bank faces DFR; the bank’s stress then deepens the borrower’s problem (selling pledged assets at a haircut, higher interest on other borrowers), spreading to others **Loss of trust** Bank runs, bank collapse, ultimately collapse of the financial system"}, {"ch": 7, "cht": "Banking and NBFCs: Regulation, NPAs, IBC and Financial Inclusion", "id": "6-the-4r-strategy-recognise-recover-recapitalise", "t": "6 · The 4R strategy: Recognise, Recover, Recapitalise, Reform", "x": "India went through, in the handout’s words, “amongst the most severe banking crisis in its post independence period.” The government and RBI used the **4R framework:** **1. Recognise** the true extent; **2. Recover** as much as possible; **3. Recapitalise** the banks; **4. Reform** the banking system. R1 · Recognition NPAs fell from **2002 to about 2008** on rapid growth. After 2008 stress rose but was shown as **restructured loans,** not NPAs (evergreening). **AQR (Asset Quality Review)** proposed by RBI in **2013,** implemented from **2015:** banks had to recognise stressed assets in the right category and stop unnecessary restructuring. NPAs reached **18% in PSBs** and overall about **12% until 2017** (as the handout words it). **CRILC** (Central Repository of Information on Large Credits) tracks exposures above **₹5 Crore.** The “Statistical Illusion” and recovery (numbers in the handout) Date Number By 2014 PSB advances had nearly tripled after the 2008 crisis March 2015 Official **GNPA 4.6%** for the system, but **Stressed Assets 11.1%** (PSBs **13.2%**) 2015 → March 2018 PSB GNPA ratio spiked from roughly 5% to a peak of **14.58%** March 2021 GNPA **7.3%** March 2024 GNPA **2.8%** September 2024 GNPA of scheduled commercial banks a **12-year low of 2.6%;** Net NPAs **0.6%** The “Extend and Pretend” Illusion (2008-2024), from the handout: Gross NPAs against Total Stressed Assets for all scheduled commercial banks and for public sector banks, with the 2015 AQR marked. The gap before 2015 (“hidden NPAs”) closes after the AQR. Source named in the figure: RBI Annual Reports. The text says NPAs reached “18% in PSBs” and the next paragraph says the PSB GNPA peaked at **14.58%** (March 2018). It also says “current NPAs at less than 2%” (recapitalisation section) while the latest figure given is **2.6% (Sept 2024).** Exam-hall rule: quote **14.58%** (PSB peak) and **2.6%** (Sept 2024) with the month; treat 18% and “below 2%” as loose figures. R2 · Recovery: RDDB, SARFAESI, IBC Banks have contractual rights under the Contracts Act, but courts are slow; low recovery cuts lending and trust. Three laws tried to raise recovery: Three recovery laws RDDB Act, 1993 SARFAESI Act, 2002 IBC, 2016 **Full name** Recovery of Debt due to Banks Securitization and Reconstruction of Financial Assets and Enforcement of Security Interest Insolvency and Bankruptcy Code **What it did** Set up **DRT** and **DRAT** for expert, quick resolution Explicitly recognised lenders’ rights on **secured loans:** securitisation, asset reconstruction, enforcement of security Time-bound resolution; **creditor-in-control** model: creditors get control of the borrower’s assets immediately **Limit** Conflict with the regular courts: defaulters got **stay orders;** recovery stayed low (~10%) Only secured loans; **not agricultural loans** (farm land cannot be seized); not small remaining dues (**under ₹1 lakh**); not if **80% or more** of the principal is repaid Only the **corporate** process (CIRP) is notified and operational **SARFAESI secured creditors:** scheduled commercial banks (PSBs, private, foreign); co-operative banks; notified **NBFCs with asset size of ₹100 Crore or more;** Asset Reconstruction Companies (ARCs); debenture trustees for secured bonds. **Securitisation (SARFAESI sense):** a bank sells its bad loans to an **ARC;** the ARC pays by issuing **Security Receipts (SRs)** to Qualified Institutional Buyers or gives SRs to the bank. The bank’s books are cleaned and the ARC takes the right to seize the collateral. (In general: turning illiquid assets into tradable securities, e.g. pooling 10,000 home loans into a mortgage-backed security.) **Asset reconstruction:** restructuring; **converting debt into equity;** splitting debt into sustainable and unsustainable parts; selling debt to ARCs. Post-SARFAESI recovery rose to around **10-14%** per the handout’s narrative; still too slow, which led to IBC. The IBC process (CIRP) The handout’s IBC / CIRP chart: Default; NCLT admission (verified default via Information Utility, admission within 14 days, moratorium imposed); IRP takeover (appointed by NCLT, takes control of management and assets, IBBI oversight); CoC formation within 30 days (only financial creditors vote); Resolution (approved plan: new investor or management, company revived) or Liquidation (assets sold, waterfall distribution). A debtor defaults on some or all creditors (financial or operational). Creditors approach the **adjudicating authority:** **NCLT** for a corporate defaulter, **DRT** for a non-corporate one. Appeals go to **NCLAT.** Only the corporate process (**CIRP**) is operational. The AA gives **14 days’ notice,** then CIRP starts. If the debtor fails to pay in 14 days, NCLT appoints an **IRP (Interim Resolution Professional),** who takes over management; the existing management (owner) is removed. **IBBI** regulates IRPs, IPs and CIRPs. The IRP consults **Information Utilities (IUs)** and forms the **Committee of Creditors (CoC)** within **30 days.** CoC has financial and operational creditors, but **only financial creditors vote.** The CoC appoints an **Insolvency Professional (IP)** who proposes plans (haircuts, debt-to-equity, new management, changing the business, monetising assets). A plan needs **2/3 of creditors by credit value** and must be agreed within **180 days.** A special extension of at most **90 more days** can be granted: **30 + 180 + 90 = 300 days** (**revised to 330 days** now). An agreed plan goes to **NCLT** for legal validity, and the IRP executes it. If no plan is agreed, the default is **liquidation** of assets equal to the admitted claims. The IBC ecosystem Entity Function **IBBI** (regulator) Regulates the ecosystem, licenses professionals, drafts operational regulations **NCLT / DRT** (adjudicating authority) Legal umpires; ensure the process follows the law, do not make business decisions. NCLT: corporates; DRT: individuals and partnerships **IP / IRP / RP** Licensed turnaround experts (CAs, CSs, ex-bankers); take control of daily operations and assets **Information Utility (IU)** Digital databases (e.g. **NeSL,** National E-Governance Services Ltd) with verified records of debts and defaults **CoC** Supreme decision-making body: financial creditors vote on sale, restructuring or liquidation Recovery rates quoted in the handout Period Rate as given Pre-1993 (civil courts) Below 10%; litigation 15 to 20 years; most of the time only about 1% Post-1993 (RDDBFI Act, DRTs) Historically 20-25%, then 4-5% by 2018 as backlogs grew Post-2002 (SARFAESI) Historically 25-30% Post-2016 (IBC) Early years above 45%; some cases up to 85-90%; post-covid around 32%; “currently around 40%”; later “stabilised around 31-32%”. **Bhushan Steel:** acquired by Tata Steel in 2018, about **₹35,200 Cr of ₹56,000 Cr** claims (**63%**) The handout gives **three different sets of figures.** RDDB recovery is “~10%” in one place and “20-25%” in another; SARFAESI is “10-14%” in one place and “25-30%” in another; IBC is “around 45%”, “around 40%” and “31-32%”. Exam-hall rule: quote the **order** (civil courts < DRT < SARFAESI < IBC) and use the exact figure only if the question gives its source. IBC challenges and recent developments Recent issues and changes Issue Detail **Liquidation, large haircuts** More liquidation than restructuring; haircuts sometimes 95%; CoCs accepting 80-90% (₹10 recovered per ₹100 lent). RBI urged maximising value rather than fire-sale liquidation **Real estate** **2018:** homebuyers classed as **financial creditors** with a CoC vote. Then a threshold: at least **100 homebuyers or 10% of allottees (whichever is lower)** must jointly file. **Reverse CIRP / project-wise resolution** isolates a failed project **MSMEs: PPIRP (2021)** **Pre-Packaged Insolvency Resolution Process** only for MSMEs: **debtor-in-possession** (the promoter keeps control while negotiating) **Cross-border insolvency** India has not fully adopted the **UNCITRAL Model Law;** a draft amendment is in progress **CIRP for MSMEs** Creditors may not find enough buyers The handout adds a note on a 2025 Supreme Court reversion regarding operational creditor dues and says insolvency jurisprudence continues to evolve. No details are given, so none are added here. R3 · Recapitalisation A bank in crisis cannot easily raise debt or equity. For PSBs the **owner is the government,** which itself had expenses above revenue and borrowings at the limit. After the AQR, severe undercapitalisation followed, and large NBFCs to which many PSBs had lent began to default. **October 2017:** a **₹2.11 Lakh Crore** recapitalisation package, mainly **Recapitalisation Bonds** issued to PSBs. The government issued bonds, the banks lent to it (a **zero-risk** loan needing no capital), and the government returned the money as **equity capital.** So deposits (pure liabilities) were converted to capital through the government. The handout calls it “extremely risky”, one that **private banks cannot copy.** In hindsight it worked: banks reformed, IBC gave incentives to recover, PSBs turned profitable and pay dividends to the government, which repays the bonds. R4 · Reforms: governance of PSBs Recapitalisation is “a financial bandage”. A **reform** is a shift from patronage and bureaucratic control to **objective, independent, accountable** decision-making. **The problem:** the owner (government) exercises ownership rights, especially **appointments,** through Finance Ministry bureaucrats who bear **no personal financial harm** if the bank fails. This creates **moral hazard:** connected people occupy decision posts, loans go to connected entities (“**Telephone Banking**”), competence is punished and a culture of inefficiency spreads. **The solution (distance):** the **P.J. Nayak Committee** recommended a **Bank Investment Company / Bank Holding Company (BHC)** to hold the government’s bank shares and appoint CEOs on merit, as **Tata Sons** does for the Tata group. The BHC has **not yet been set up.** **Bank Board Bureau (BBB)** was constituted in **February 2016** as a compromise. In **2022/2023** the **Delhi High Court** struck down the BBB’s mandate (the owner’s appointment power could not be delegated). The government **dissolved it and set up the Financial Services Institutions Bureau (FSIB)** (the handout also spells it “Financial Services Intermediary Bureau” once). The handout says the High Court struck down the BBB “in 2023” in one place and “2022/2023” in another, and expands FSIB as “Financial Services Intermediary Bureau” once and “Financial Services Institutions Bureau” elsewhere. Exam-hall rule: write **FSIB (Financial Services Institutions Bureau)** and say “BBB replaced by FSIB”; give a year only if forced, as 2023. Why PSB risk assessment is poor: the “Three Cs of Fear” (P.J. Nayak 2014 and Raghuram Rajan’s 2018 note) **Accountability is not low in PSBs; it is criminal.** The “Three Cs”: **CBI, CVC, CAG.** A PSB manager’s bad commercial decision can bring a criminal inquiry that outlasts their career; this creates **risk aversion** and defensive banking. **Payoff matrix:** PVB: high risk + good assessment = high profit, so bonus and promotion. PSB: the manager gets **nothing** (fixed salary) if it goes well, but **jail** if the outcome is bad. Infinite downside, zero upside. **Telephone banking:** if a Joint Secretary or politician calls for a ₹5,000 Cr loan, saying no brings a remote posting; saying yes brings political cover. Risk assessment becomes paperwork."}, {"ch": 7, "cht": "Banking and NBFCs: Regulation, NPAs, IBC and Financial Inclusion", "id": "7-financial-inclusion", "t": "7 · Financial inclusion", "x": "**Financial inclusion** is making the formal financial system accessible to more people. Strict licensing under the BR Act (1949) built trust but made banking an elite club, leaving mass **financial exclusion.** The **Committee on Financial Inclusion (2008)** defined it as ensuring access to financial services and timely, adequate credit for vulnerable groups at an affordable cost. Four pillars Pillar Meaning **Association** Bringing the citizen into the formal system, mainly a bank account **Accessibility** A variety of products (pensions, insurance, micro-credit) easily available **Affordability** Cost-effective: not exorbitant loans or heavy withdrawal fees **Capability** Financial literacy for rational choices Steps taken: five phases The 70-year push Phase What happened **1 · State intervention (mass expansion)** **1955 SBI Act:** Imperial Bank nationalised into SBI to push branches into the hinterland. **1969 and 1980** nationalisation: the largest private banks were taken over to compel expansion **2 · Specialised architecture** **Co-operative banks** (mutual cooperation, not profit). **RRBs (1975 Act):** Centre 50%, State 15%, sponsor bank 35%. **DFIs (1980s):** NABARD (agriculture), SIDBI (MSMEs), NHB (housing), EXIM; they **refinance** retail banks rather than lend directly **3 · Liberalisation (1990s)** RBI issued new private bank licences in **1993** (HDFC, ICICI, later Axis and Yes). Tools: **Lead Bank Scheme** (a captain bank per district); **branch licensing policy** (urban branch only if you open in unbanked areas; focus on unbanked areas since 2005, a branch per defined area, e.g. 5,000 people, or **2,000 adults in hilly areas**); **BSBDA / zero-balance accounts;** **Business Correspondents / Bank Mitras** (mobile branches; deposit and withdraw only, cannot lend) **4 · Structural innovation (2013-2014)** By 2013 only **~15% of individuals** and **~40% of households** had accounts. After the Nachiket Mor and Raghuram Rajan committees RBI moved to **differentiated licences:** Small Finance Banks and Payments Banks. Also **on tap licensing** (window permanently open) **5 · PM Jan Dhan Yojana (Aug 2014)** Shifted strategy from **area-focused** (open branches and hope) to **person-focused** (find each unbanked person and open an account). Phase 1: association; phase 2: keep accounts live and financial education. Result per handout: **over 70% of adults and 99%+ of households** banked Quick reference of timelines (the handout’s list) Year Event 1955 Imperial Bank nationalised into SBI 1969 Lead Bank Scheme introduced, alongside first wave of nationalisation (14 banks) 1975 Regional Rural Banks Ordinance 1980 Second wave of nationalisation (6 banks) 1992 SHG-Bank Linkage Programme launched by NABARD 2005 No-Frills Accounts (renamed BSBDAs in 2012) 2006 Business Correspondent / Bank Mitra model 2011 Swabhimaan Campaign for villages with population above 2,000 Aug 2014 PMJDY launched 2015 Differentiated licences granted to SFBs and Payments Banks The handout says private licences were issued **“for the first time since 1949”** in **1993,** and also says **differentiated licences and on tap licensing** came from **2013,** with licences granted in **2015.** Exam-hall rule: **2013-14** is the policy and recommendation period; **2015** is when licences were granted."}, {"ch": 7, "cht": "Banking and NBFCs: Regulation, NPAs, IBC and Financial Inclusion", "id": "8-priority-sector-lending-psl", "t": "8 · Priority Sector Lending (PSL)", "x": "RBI designates certain sectors as priority and makes **all banks** (domestic or foreign, RRB or co-operative, rural or urban, small banks) lend a share of credit to them. Sectors: **agriculture** (sub-targets for small and marginal farmers), **MSMEs and exports, education, housing and social infrastructure, renewable energy,** and **start-ups (status given in 2020).** PSL targets and tools Item Detail **Base** **ANBC** (Adjusted Net Bank Credit) **Scheduled commercial banks and foreign private banks** (sizeable presence) **40% of ANBC** **RRBs, co-operative banks, Small Finance Banks** **75% of ANBC** **Price** PSL fixes the **allocation, not the price.** Loans carry market rates. Cheaper farm loans come through an **Interest Subvention Scheme (ISS)** **Shortfall** Invest the shortfall in **NABARD’s RIDF** (Rural Infrastructure Development Fund) at a low return, or buy **PSLCs** (Priority Sector Lending Certificates) from banks that overshoot"}, {"ch": 7, "cht": "Banking and NBFCs: Regulation, NPAs, IBC and Financial Inclusion", "id": "9-types-of-banks-and-financial-entities", "t": "9 · Types of banks and financial entities", "x": "Types of banks and entities Type Key features (from the handout) **Commercial banks** (PSB, private, foreign) Regulated solely by **RBI** under the BR Act 1949; companies under the Companies Act; profit motive **Co-operative banks** Formed under State Cooperative Societies Acts or the Multi-State Cooperative Societies Act. **Dual regulation:** State Government/Registrar for incorporation and management, RBI for core banking functions (capital, liquidity). Motive: mutual assistance **Scheduled banks** In the **Second Schedule of the RBI Act, 1934;** minimum paid-up capital; eligible for **LAF** window loans (Repo/MSF) and automatic clearing-house membership **Non-scheduled banks** Not in the Second Schedule; subject to statutory reserves but no automatic RBI borrowing **RRBs (1975)** Local feel of a co-operative plus professionalism of a commercial bank; **50:15:35** (Centre, State, sponsor bank) **DFIs** Statutory bodies (NABARD, SIDBI, EXIM): long-term patient capital; **refinance** rather than retail lend **Small Finance Banks** Micro-credit for inclusion. **75% of loans to PSL;** at least **50% of portfolio in loans under ₹25 Lakh** (also “majority of loans under ₹25 Lakh” elsewhere in the handout). Can accept all deposits and issue all loans; cannot set up subsidiaries for insurance or pensions **Payments Banks** Remittances and digital payments. Deposits (**demand deposits up to ₹2 Lakh** per customer); **no loans or credit cards;** must hold **75% of deposits in Government Securities** **NBFCs** Companies under the Companies Act in lending, investment or leasing that **cannot accept demand deposits (CASA)** and **cannot issue cheques** **Nidhi companies** Mutual benefit societies lending and borrowing only among members; MCA regulates operations, RBI only deposit-acceptance rules **Chit funds** Traditional savings and borrowing schemes; State Governments under the **Chit Funds Act, 1982;** RBI advisory only NBFC regulation: who regulates whom, and the Scale-Based Regulation (SBR) layers (effective 2022) Layer / entity Meaning **Regulators** RBI regulates core lending NBFCs. **Merchant bankers and venture capital funds: SEBI. Housing finance companies: RBI (formerly NHB). Insurance companies: IRDAI** **Base Layer (NBFC-BL)** Non-deposit-taking, asset size **below ₹1,000 Crore;** light regulation **Middle Layer (NBFC-ML)** All deposit-taking NBFCs and non-deposit-taking ones **above ₹1,000 Crore** **Upper Layer (NBFC-UL)** Identified by RBI as systemically critical; bank-like scrutiny **Top Layer (NBFC-TL)** Ideally **empty;** for extreme systemic risk needing bespoke regulation Small Finance Bank ticket-size rule is worded **“majority”** in one place and **“at least 50%”** in another. The SARFAESI NBFC threshold is **₹100 Crore** while the SBR base layer limit is **₹1,000 Crore:** two different rules for two different purposes. Exam-hall rule: SFB = “50%+ of loans under ₹25 L, 75% PSL”; do not mix ₹100 Cr (SARFAESI) with ₹1,000 Cr (SBR)."}, {"ch": 8, "cht": "Money and Monetary Policy: Supply, Demand, Cost and Tools", "id": "exam-lens-priority-and-pyqs", "t": "Exam lens: priority and PYQs", "x": "**Handout only.** No class slides and no teacher ink. **No Prelims or Mains PYQ is quoted** in this handout: none quoted in the material. Priority below is the handout’s own emphasis (starred “**” statements, worked examples, bonus boxes). What the handout stresses Signal in the handout Where Why it matters Money = **Generally Acceptable Medium of Exchange (GA-MOE);** legal tender; **trust overrides law** Sections 1-2 The idea behind the rest of the chapter RBI balance sheet: zero-cost liabilities, **seigniorage,** buy only safe assets; surplus to government (**Bimal Jalan** committee) Section 3 Starred statement **M0, M1-M4,** and the new **NM1, NM2, NM3** (Y.V. Reddy Committee, 1998) Section 4 Definitions and what is excluded **MS = m × M0;** m falls with higher **cdr** and **rdr** Section 5 Formulas **MD = MDT + MDS;** MS is vertical; **liquidity trap** at r-min Section 6 Concept plus graphs Tools: **OMO, CRR, SLR, Repo, Reverse repo, MSF, Bank Rate, SDF;** corridor MSF-Repo-SDF Section 8 Statements and ceiling/floor **FIT 2015:** 4% ± 2%; **6-member MPC** (3 RBI + 3 external); Governor’s casting vote Section 9 Facts Loan pricing: **PLR → Base Rate (2010) → MCLR (2016) → EBLR (2019)** Section 10 Chronology Recent tools: **RDS 2021, LTRO 2020, VRRR, SDF Apr 2022, MSS 2004** Section 11 Current-affairs hooks **Prelims hooks:** properties of money; legal tender in India (notes, coins, CBDC); representative versus fiat money; seigniorage; what M1-M4 include and exclude (vault cash, government deposits, post office deposits); NM1-NM3; money multiplier factors; CRR versus SLR; repo versus reverse repo versus MSF; the corridor; MPC composition; MCLR versus EBLR; MSS, SDF, VRRR, LTRO, RDS. **Mains hooks:** why trust matters; why RBI buys only safe assets; the growth-inflation trade-off and why central banks are better at fighting inflation; the case for FIT and the MPC; monetary transmission and why it was weak; liquidity trap; sterilisation and the impossible trinity. **Closing idea:** money is a promise; the RBI’s job is to keep that promise adequate and trustworthy."}, {"ch": 8, "cht": "Money and Monetary Policy: Supply, Demand, Cost and Tools", "id": "1-what-money-is-and-its-four-properties", "t": "1 · What money is, and its four properties", "x": "**Money** is a **generally acceptable medium of exchange (GA-MOE).** Barter needs a **Double Coincidence of Wants (DCW):** you must find someone who has what you want and wants what you have. As societies grow, DCW becomes “mathematically impossible”. Almost anything can be a medium of exchange in an isolated barter; to be **money,** most sellers in the economy must be willing to part with real goods for it. Properties of money (what makes something generally acceptable) Property Meaning **Value** It must have value itself: **intrinsic** (gold) or **fiat** (determined and enforced by a sovereign). It needs general demand **and limited supply** (you cannot offer 10 L of water for 1 kg of wheat all the time) **Preservation of value** The acceptor must trust it will keep its purchasing power. It should not rot (like an apple) and storing it should not be costly **Authenticity of value** The quality and quantity must be easy to verify; otherwise a trusted entity must assure it. That entity must be the **only** producer and be able to stop counterfeiting: the sovereign or **central bank** **Denomination of values** Divisible into small units (tea) and aggregable into large ones (a house). Not too rare, not infinitely abundant. This makes money a **unit of account**"}, {"ch": 8, "cht": "Money and Monetary Policy: Supply, Demand, Cost and Tools", "id": "2-evolution-of-money-from-gold-to-fiat", "t": "2 · Evolution of money: from gold to fiat", "x": "**Modern money** is currency notes: **promises issued by the central bank,** accepted because of **(1) trust** in the issuer and **(2) legal necessity** (legal tender). **Legal tender:** a legally mandated way of discharging debt that a creditor **cannot lawfully refuse.** In India, only **currency notes, coins and CBDC** have this status. Legal tender laws do not create value; they enforce acceptance for settling a debt. **“Trust always overrides Law in the long run.”** Gold and silver coins Minted by kings or trustworthy goldsmiths, with a mark of purity Problem: demand for transactions outgrew the supply of gold Gold became too valuable for everyday goods; copper coins failed Representative money A trusted goldsmith or banker buys gold and issues promises (“I promise to pay the bearer 0.1 g of gold”): a 1:1 claim on gold in a vault. Trust enters Central banks evolve The trustworthy issuers survive; wars and their financing triggered formal structures Problem: money limited by gold held More money needs more gold Fiat money Central banks add **government bonds** (safe, liquid, replicable) to their assets and issue more promises. The rupee is **not** a claim on gold: a ₹500 note is exchanged for five ₹100 notes Why government bonds can stand in for gold Criterion Meaning Examples **Safe** Retains value over the long term, not volatile Gold; sovereign bonds (the government is the least-risk entity in its own country as it can tax) **Liquid** Many buyers and sellers, so no distress sale or large premium. Needs **replicability** Gold (one gram is like another); shares of one company (each share is identical) **Not replicable** Each unit unique, thin market Land, diamonds A **bond** is a debt instrument. For the issuer it is a **liability;** for the buyer an **asset** paying a **coupon** on the **face value** until **maturity.** When the central bank buys government bonds it **creates new money** (digitally today). So **modern money is a promise issued by the central bank, backed by a promise issued by the government,** which in turn rests on its future ability to collect taxes."}, {"ch": 8, "cht": "Money and Monetary Policy: Supply, Demand, Cost and Tools", "id": "3-the-rbi-s-balance-sheet-seigniorage-and-the-so", "t": "3 · The RBI’s balance sheet, seigniorage and the social contract", "x": "RBI’s balance sheet (as the handout sets it out) Assets (what RBI owns) Liabilities (what RBI owes) **1 · Appreciating assets (no interest, capital gains):** physical gold; foreign currency assets (FCA) **1 · Zero-cost liabilities:** Currency in Circulation (CiC), cost only printing and logistics, interest 0% **2 · Interest-bearing assets:** rupee securities (domestic government bonds); foreign government bonds; loans and advances to commercial banks (LAF/repo) **2 · Low or zero-cost:** bank deposits (CRR balances, interest 0%); government deposits (Centre and States) **3 · Accounting provisions and buffers:** CGRA (Currency and Gold Revaluation Account: unrealised gains on gold and forex); Contingency Fund (CRB) **Total assets** **Total liabilities = Base Money (M0)** RBI creates money by **buying assets** and printing promises. Its assets appreciate or earn interest, and its liabilities cost almost nothing, so it earns large profits. **Seigniorage** is the **net interest income** earned on assets backing the currency. Example: RBI earns **7%** on government bonds but pays **0%** on a ₹500 note. The spread minus printing costs is true seigniorage. (Printing costs about ₹1.2-1.3 per note.) **Profit is incidental, not intentional.** RBI must buy only the **highest-quality, least-risk** assets so it can always discharge its liabilities. If it bought a volatile asset (the handout’s bitcoin example: bought for ₹10 L, value falls to ₹5 L, liabilities stay ₹10 L) liabilities exceed assets, trust is lost and society looks for another GA-MOE. That is the **social contract of modern money.** After costs, RBI transfers the surplus to the government under the **Economic Capital framework recommended by the Bimal Jalan committee,** setting aside some profits for potential losses."}, {"ch": 8, "cht": "Money and Monetary Policy: Supply, Demand, Cost and Tools", "id": "4-money-supply-and-its-measures", "t": "4 · Money supply and its measures", "x": "Modern money has two forms: **(i) currency notes** created by the central bank (**high-powered money**) and **(ii) deposits** created by the banking system. RBI controls both and is a **monopolistic producer.** Why the money supply curve is vertical For an ordinary good supply rises with price because **(a)** new producers enter and **(b)** existing producers earn more. For money: **(1)** RBI is a monopoly, so no one else can enter; **(2)** RBI’s objective is **adequacy and trustworthiness,** not profit, so higher interest earnings do not make it print more. So **MS is independent of its price (the interest rate):** the curve is a **perfectly vertical line,** perfectly inelastic to the interest rate. The handout’s ladder of money measures. M0 = high-powered money (RBI-created). M1 = CC + DD with banks + “Other” deposits with RBI. M2 = M1 + post-office demand deposits (P.O.–DD). M3 = M1 + time deposits (TD) with banks. M4 = M3 + post-office deposits (DD, TD, other deposits). M1 and M2 are narrow money; M3 and M4 broad money. Liquidity decreases and the scope of “what is money” increases going down. Terms in the measures Term Meaning and what is excluded **CC** Currency in circulation **with the public.** **Vault cash with banks is excluded** **DD** Demand deposits of the public with the banking system, as liquid as cash. **Inter-bank deposits are not counted** **“Other” deposits with RBI** A tiny fraction: foreign central banks, the IMF, quasi-government institutions (like NABARD). **Strictly excludes the Government of India’s deposits** because the government is the producer/manager of money; MS measures what the public holds **TD** Time deposits: available at specific points of time, less liquid than DD. The handout calls it the **most important metric for RBI** (stable capital base for long-term loans) **PO deposits** Deposits with post offices. Not part of the banking payment and settlement system. Long-term products (e.g. National Savings Certificate) are not redeemable before maturity, so they lose the character of money and are not in M1-M3 **Why:** after 1991 banks innovated; **post offices lost relevance** as banks spread to rural areas; and the **time maturity blur:** a 14-day FD and a 10-year FD were both “time deposits” in M3, though the first is nearly cash. RBI moved from **who holds money** to **time (liquidity).** The new monetary aggregates Aggregate Definition **NM1** (new narrow money) Currency with the public + demand deposits + other deposits with RBI (practically identical to old M1) **NM2** NM1 + **short-term** time deposits of residents (**up to and including 1 year**) **NM3** (new broad money) NM2 + **long-term** time deposits of residents (**over 1 year**) + call/term funding from financial institutions"}, {"ch": 8, "cht": "Money and Monetary Policy: Supply, Demand, Cost and Tools", "id": "5-money-creation-by-banks-the-multiplier", "t": "5 · Money creation by banks: the multiplier", "x": "RBI injects **M0** by buying assets from primary dealers. The seller keeps part as cash (**cash preference**) and deposits the rest. The bank keeps a **reserve** and lends the rest. The borrower spends it, the receiver again keeps some cash and deposits the rest, and so on. Each round creates less than the last (cash preference and reserves), so the cycle halts. The handout points to **NCERT Macroeconomics** for the full explanation. **MS = m · M0** where M0 is high-powered money, m the money multiplier, MS total money supply. The two factors behind the multiplier Ratio Meaning Effect on m and MS **cdr** (currency-deposit ratio) = cash ÷ deposit People’s preference for cash over deposits. Depends on culture (saving versus spending), access to banking, season (more cash in festivals), black money and tax laws More cash preference, less deposited and lent: **m, MS ∝ 1/cdr** **rdr** (reserve-deposit ratio) = reserves ÷ deposits Proportion of deposits banks set aside and cannot lend Higher rdr, fewer cycles: **m, MS ∝ 1/rdr** **Reserves and trust:** depositors have a right to withdraw everything, but banks can assess “normal” demand and reserve for it. Reserves are costly (**liquidity versus profitability:** reserves give 100% liquidity and 0% profit), so banks left alone push rdr towards zero, risking **bank runs.** Without trust no one deposits and no multiplication happens; the banking system also **amplifies the reach** of money. So RBI sets a minimum: the **legal reserve ratio (LRR)** in general, the **CRR** in India. MS is therefore seen as depending mainly on the reserve ratio. **“The CRR is the legal enforcement of trust.”** A free market cannot self-regulate bank reserves."}, {"ch": 8, "cht": "Money and Monetary Policy: Supply, Demand, Cost and Tools", "id": "6-demand-for-money", "t": "6 · Demand for money", "x": "Money is demanded for three purposes: **transaction** (now), **precautionary** (emergencies, potential future transactions) and **speculative** (to preserve the value of wealth). The handout combines the first two as **transaction demand (MDT).** **MDT ∝ VT** (total value of transactions). **VT ∝ P · Q,** so **VT ∝ nominal GDP.** **Velocity (v)** is how many times money changes hands in a period. A ₹100 note changing hands 10 times a month carries ₹1,000 of transactions, so v = 10 per month; with v = 5, ₹200 is needed for the same ₹1,000. So **MDT ∝ 1/v,** and **MDT ∝ P·Q ÷ v** (with v constant, MDT ∝ P·Q). Velocity depends on spending habits, culture, season (festivals), and the payments system. Speculative demand (MDS) If people expect asset prices to fall, they keep money; if to rise, they hold assets. Expectations depend on the expected move in the **interest rate (r).** Interest rate, expectations and speculative demand Current r What people expect Asset prices expected Rational action MDS **High** r will fall (money cheaper, more borrowing and spending) Rise Buy assets (use money) **Falls** **Low** r will rise (money dearer, less demand) Fall Keep money; sell assets **Rises** The handout’s example: hold a bond paying 5%, RBI raises market rates to 8%, nobody wants the 5% bond, so you must cut its price. **Rising interest rates crush the value of existing assets.** The two extremes of r Point Meaning Result **r-max** The rate at which no one expects it to rise any further, so everyone expects assets to rise and wants to buy No one sells; money stays in money form but is **not speculative.** Speculative demand is **zero.** So as r rises, MDS keeps falling **r-min** The rate at which no one expects it to fall further, so everyone expects assets to fall and wants to sell All money beyond transaction needs is speculative. **MDS is infinitely elastic at r = r-min** So **MDS ∝ 1/r,** and **MD = MDT + MDS** (total demand is transaction plus speculative). MD is directly proportional to **nominal GDP (P·Q)** and inversely to **r:** the **money demand curve slopes downward.** At **r = r-min** everyone holds wealth in cash (MDS = ∞). People prefer cash to investing or spending because they expect interest rates to rise. **An increase in money supply does not lower interest rates or raise spending, so monetary policy loses its power.**"}, {"ch": 8, "cht": "Money and Monetary Policy: Supply, Demand, Cost and Tools", "id": "7-the-cost-of-money-and-the-dual-mandate", "t": "7 · The cost of money and the dual mandate", "x": "Interest rate set by demand and supply of money: a vertical money supply curve (set by the central bank) meets the downward-sloping money demand curve MD at the interest rate r0. The central bank sets supply (independent of cost); demand varies inversely with cost. Together they set the **interest rate.** Monetary policy aims at the twin objectives of **adequacy and trustworthiness.** **Inadequate money** (growth falls): increase supply, r falls, spending and AD rise, growth revives. **Too much money:** people doubt the quality of RBI’s assets, and money loses purchasing power (a sign of lost trust). Cut supply, r rises, AD falls, prices cool. **Dual mandate:** each action has one good and one bad effect. This is the **growth-inflation trade-off** in monetary policy."}, {"ch": 8, "cht": "Money and Monetary Policy: Supply, Demand, Cost and Tools", "id": "8-tools-of-monetary-policy", "t": "8 · Tools of monetary policy", "x": "Qualitative versus quantitative tools Qualitative Quantitative **Nature** Influence the **direction** of money supply; exact outcome hard to predict. Work on behaviour, nudging the **multiplier (m)** without changing the monetary base Precise levers; RBI can calculate the liquidity injected or drained **Tools** Moral suasion; rationing of credit (PSL); regulation of consumer credit; margin requirements (LTV); direct action OMOs; reserve ratios (CRR, SLR); LAF (repo and reverse repo); MSF; Bank Rate; SDF A · Qualitative tools **Moral suasion:** persuading banks to adopt certain lending behaviour (e.g. voluntarily restrict lending to speculative stock-market activity in a bubble). **Rationing of credit (PSL):** a mandated percentage of lending to vital sectors (agriculture, MSMEs, education). **Regulation of consumer credit:** higher down payments or shorter repayment tenures to cool consumer demand without changing the cost of money. **Margin requirements (LTV, Loan to Value):** e.g. ₹100 of gold for a ₹60 loan instead of ₹80. **Direct action:** penal interest rates or refusal to extend credit to violators. B · Quantitative tools Quantitative tools Tool What it is Effect **Open Market Operations (OMO)** RBI buys or sells **G-Secs** in the market. **Controls the base (M0)** Buying: pays with new currency, injects M0 (expansionary). Selling: buyers pay RBI with existing currency, the liability is discharged, M0 falls (contractionary) **CRR** (Cash Reserve Ratio) Share of **NDTL** (Net Demand and Time Liabilities = demand and time deposits less inter-bank deposits) kept **with RBI, in cash, earning no interest** A pure cost to banks. **The RBI Amendment Act of 2006 removed the 3% floor and 40% ceiling,** so RBI can set CRR anywhere from 0% to 100% **SLR** (Statutory Liquidity Ratio) Share of NDTL banks must hold in **gold and government bonds** (safe, liquid) A compromise because high CRR kills profits: bonds pay interest or appreciate; they can be sold in a run **Raising CRR or SLR** Less deposit available to lend Multiplier m shrinks, MS contracts **Repo (LAF)** RBI **lends** to banks for a short time (**usually one day, maximum 14 days**) against assets; **Repurchase Agreement.** Bank sells assets, RBI creates money (M0 up), bank repurchases later (M0 restored) Higher repo makes borrowing costlier and is passed on to borrowers **Reverse repo (LAF)** RBI **borrows** from banks when liquidity is in surplus Higher reverse repo rate: banks park more with RBI, money supply in the economy falls **MSF** (Marginal Standing Facility) When banks run out of G-secs for LAF, they may **dip below the SLR** in a limited way and borrow against the freed securities At a **penal rate (MSF rate):** it reduces the safety of the system, so RBI “punishes your balance sheet so you don’t make a habit of breaching statutory trust” **Bank Rate** Historically RBI’s long-term lending rate to banks **Operationally dormant;** now aligned with the MSF rate and used mainly as the baseline for statutory penalties To fill a liquidity gap banks can also solicit deposits, borrow in the **call money** market, issue bonds, raise capital, or issue **certificates of deposit.** LAF is the RBI window for the mismatch between loan demand and deposits (liquidity surplus or deficit). **Ceiling: MSF rate** (the most a bank will pay for overnight funds). **Benchmark: Repo rate** (the anchor, signals stance). **Floor: SDF rate** (earlier the reverse repo; **in 2022 the SDF** replaced it as the hard floor, set just below the repo). RBI guides the market cost of money without dictating it by decree."}, {"ch": 8, "cht": "Money and Monetary Policy: Supply, Demand, Cost and Tools", "id": "9-conduct-of-policy-resolving-the-growth-inflati", "t": "9 · Conduct of policy: resolving the growth-inflation trade-off", "x": "**Problem:** policy depended on the **Governor’s preference** (subjectivity) and on **time inconsistency:** governments facing elections press for cheap money to create a temporary boom, which later brings long-term inflation. **Limits of fostering growth:** growth needs infrastructure, taxation, EODB, export competitiveness and raw materials. If taxes are oppressive and infrastructure is poor, no one borrows even at 0%. RBI can supply money but cannot force the economy to use it. **Dominance in crushing inflation:** structural fixes take years, but raising the cost of money cuts spending whatever the cause. Monetary policy beats fiscal policy for rapid inflation control. So **central banks are more effective against high inflation than at raising growth.** **Monetary Policy Framework Agreement, 2015:** RBI’s primary legal responsibility is **CPI inflation of 4% with a ±2% band (2% to 6%).** Within the band, RBI may cut rates to help growth; above 6%, it must hike. A statutory **6-member Monetary Policy Committee (MPC)** sets rates: **3 internal RBI officials (including the Governor)** and **3 external experts nominated by the Government.** Decisions by **majority vote;** the **Governor has a casting vote only in a tie.**"}, {"ch": 8, "cht": "Money and Monetary Policy: Supply, Demand, Cost and Tools", "id": "10-transmission-and-the-evolution-of-loan-pricin", "t": "10 · Transmission and the evolution of loan pricing", "x": "RBI lends only to banks, not to citizens. So effectiveness is judged by **transmission:** whether banks pass RBI’s decisions on to the economy. If banks do not lower lending rates when RBI cuts, the policy “signal” never reaches the real economy: the **Monetary Transmission Mechanism.** Four phases of loan pricing Phase Rate What it did Weakness **1** **PLR** (Prime Lending Rate), after 1993 deregulation The lowest rate, charged to the least-risk customer Not transparently declared: those who could negotiate paid less than the risk-appropriate rate; others paid more. Inequitable **2 (2010)** **Base Rate** A **declared PLR:** the minimum any customer pays; no one lends below it. Ended cross-subsidisation Transmission **poor:** a bank’s average cost includes millions of old 5-year FDs, so a repo cut barely moved it **3 (2016)** **MCLR** (Marginal Cost of Funds based Lending Rate) Linked lending rate to the dynamic **marginal** cost: interest on deposits, operating costs, maintenance, and the market cost of marginal funds Still an **internal** benchmark: banks tweaked variables (inflating operating costs) to keep MCLR high **4 (2019 to present)** **EBLR** (External Benchmark Lending Rate) All new floating-rate **retail (home, auto) and MSME loans** must link to an external benchmark: **repo rate, 91-day or 182-day T-bill yield, MIBOR** Near-perfect transmission **EBLR example:** home loan = repo (6.5%) + 3% spread = **9.5%.** If repo is cut by 50 basis points to 6.0%, the EMI resets to **9.0%** at the next reset date; the bank cannot block it. **MIBOR** (Mumbai Inter-bank Offered Rate) is the standard call rate in the inter-bank market. The handout writes “**EBLR = MCLR = BR = f(marginal cost of funds)**” as a way to remember that all three express the bank’s lending rate. They are **not** the same rule: the Base Rate and MCLR are **internal,** EBLR is **external.** Exam-hall rule: Base Rate 2010 → MCLR 2016 → EBLR 2019; only EBLR is linked to an outside rate."}, {"ch": 8, "cht": "Money and Monetary Policy: Supply, Demand, Cost and Tools", "id": "11-some-recent-tools-the-modern-arsenal", "t": "11 · Some recent tools: the modern arsenal", "x": "Recent tools Tool What Why **Retail Direct Scheme (RDS), 2021** Individuals open a **Retail Direct Gilt (RDG)** account directly with RBI to buy and sell G-Secs, T-Bills and Sovereign Gold Bonds, **free of charge** Broaden the investor base so government borrows from the public, not only banks; a safe alternative to stocks and low-yield FDs **LTRO and TLTRO (2020)** RBI lent to banks at the short-term **repo rate for 1 to 3 years** (normal LAF is overnight to 14 days). **Targeted** version: banks had to buy **corporate bonds of stressed sectors** (NBFCs, microfinance) COVID liquidity freeze: banks hoarded cash; long cheap funding forced transmission **Variable Rate Reverse Repo (VRRR)** Auction-based absorption: RBI announces an amount (e.g. ₹2 Lakh Crore) and banks **bid** the rate Post-COVID surplus: banks parked trillions at the fixed reverse repo; VRRR pushed short rates towards repo, **tightening without hiking the repo rate** **Standing Deposit Facility (SDF), April 2022** Overnight absorption of funds **without giving any G-Sec collateral;** **replaced the fixed reverse repo as the floor** Reverse repo needs collateral; selling G-Secs would crash prices and raise government borrowing costs **Sterilisation and MSS (2004)** Government issues special **MSS bonds;** the money is kept in a locked account with RBI and cannot be spent Heavy foreign inflows: RBI buys dollars (to protect exporters) and prints rupees (M0), causing inflation; MSS absorbs those rupees. The handout links this to the **Impossible Trinity**"}, {"ch": 9, "cht": "Capital Markets: Money Market, Stock Market, Derivatives and Funds", "id": "exam-lens-priority-and-pyqs", "t": "Exam lens: priority and PYQs", "x": "**Handout only.** No class slides, no teacher ink. **No Prelims or Mains PYQ is quoted** in this handout: none quoted in the material. Priority below is the handout’s own emphasis (explicit numbers, definitions and its “starred” points). What the handout stresses Signal in the handout Where Why it matters Money market = under **1 year,** debt only, “near money”; capital market = long term (fixed capital formation) Section 1 Basic classification **T-bills 91, 182, 364 days; CMBs 7-15 days;** only the Centre issues them; zero-coupon, sold at a discount Section 2 Numbers **CP:** investment-grade rating (SEBI); **5 AIFIs** can issue (NABARD, NHB, SIDBI, EXIM, NaBFID). **CoD** tradable Section 2 Lists **Primary versus secondary;** IPO/FPO versus **OFS** (company gets zero); **DRHP → RHP; ASBA; green shoe** Sections 3-4 Process terms **Clearing house:** pre-funding and **novation;** **Depositories Act 1996:** NSDL, CDSL; **T+1,** moving to T+0 Section 5 Institutions and dates **Alpha and beta;** **Sensex 30 companies, base 100, 1979;** **Nifty 50, base 1000, 1995;** rebalanced about every 6 months Sections 6-7 Numbers Futures (obligation) versus options (right); **strike, expiry, premium** Section 8 Highway-and-land example **Mutual fund as a Trust (Indian Trusts Act 1882);** AMC; NAV; TER; ETF; **ADR, GDR, IDR;** **P-Notes (ODIs),** UBO rules 2016-2017 Sections 9-10 Definitions **Prelims hooks:** T-bill and CMB maturities; who can issue CP and CoD; primary versus secondary market; IPO versus OFS; DRHP/RHP; ASBA; green shoe; novation; NSDL and CDSL; Sensex and Nifty facts; alpha and beta; futures versus options; NAV and TER; ETF; ADR, GDR, IDR; P-Notes. **Mains hooks:** what stock exchanges, clearing houses and depositories do for trust; why the stock market is not the economy and why it can rise when the economy falls; why derivatives are risk-management tools; why retail investors lose; regulation of P-Notes. **Closing idea:** a market works because strangers can trust each other; every institution in it exists to manufacture that trust."}, {"ch": 9, "cht": "Capital Markets: Money Market, Stock Market, Derivatives and Funds", "id": "1-capital-markets-the-four-ways-to-classify-cont", "t": "1 · Capital markets: the four ways to classify contracts", "x": "In capital markets the **demanders and suppliers themselves decide,** so they **bear the risks** and enjoy most of the reward. Intermediaries give information, build trust and do back-end work. (In banking, by contrast, the bank decides: see Chapter 7.) Contracts are classified by: **Rights and obligations:** debt versus equity. **Maturity:** less than 1 year is **short term;** more than 1 year is **long term.** **Terms and conditions:** standardised versus customised. **Settlement:** spot versus futures (derivatives). Money market versus capital market Money market Capital market **Contracts** Short-term (**below 1 year**) **debt** contracts (equity gives rights in perpetuity, so it is long term) Equity, and debt of **more than 1 year** (loans, bonds) **Purpose** Manage **working capital** and short-term liquidity mismatches **Fixed capital formation** (factories, expansion) **Features** Less risky, usually **unsecured,** low interest, extremely liquid: **“near money”** Money turns into an asset for long: money loses liquidity (the asset itself may be liquid)"}, {"ch": 9, "cht": "Capital Markets: Money Market, Stock Market, Derivatives and Funds", "id": "2-money-market-instruments", "t": "2 · Money market instruments", "x": "T-bills, CMBs, CP and CoD Instrument Issuer Key facts (from the handout) **Treasury Bills (T-bills)** **Only the Centre** Unsecured short-term government debt; maturity **91, 182, 364 days;** **zero coupon:** sold by **auction at a discount** and redeemed at par (face value) **Cash Management Bills (CMBs)** **Only the Centre** Maturity **7 to 15 days.** **State governments** manage short-term mismatches through **Ways and Means Advances (WMA) from RBI,** not T-bills **Commercial Paper (CP)** Corporations, several NBFCs, **InvITs, DFIs** Unsecured; issuer needs a rating **above a SEBI-prescribed minimum investment grade.** Five **AIFIs** (All India Financial Institutions) can issue: **NABARD, NHB, SIDBI, EXIM Bank, NaBFID** (National Bank for Financing Infrastructure Development) **Certificate of Deposit (CoD)** Banks Short-term deposits raised by issuing certificates, used when banks face a liquidity crunch. Unlike FDs, **CoDs are tradable**"}, {"ch": 9, "cht": "Capital Markets: Money Market, Stock Market, Derivatives and Funds", "id": "3-customised-versus-standardised-spot-versus-fut", "t": "3 · Customised versus standardised, spot versus futures", "x": "Two more splits Customised (OTC) Standardised **Liquidity** Market not well developed, not easily tradable except via specific counters: **Over The Counter (OTC)** Many buyers and sellers, easily tradable on markets **Examples** Loans, debentures, preference shares Bonds, common equity **Spot contracts:** settled on the spot (buyer pays, seller delivers); also called **CNC (Cash and Carry).** **Futures (standardised) / Forwards (OTC):** signed today, exchange at a **future date** at a **predetermined price.** The **underlying** is the commodity or contract; the agreed price is the **strike price** (the biggest factor is the **current market price, CMP**); the time limit is **maturity.** **Derivatives:** contracts with no value of their own; they **derive** value from the underlying (futures, options, swaps, securitised loans). The handout likens one to a **betting slip** on rain."}, {"ch": 9, "cht": "Capital Markets: Money Market, Stock Market, Derivatives and Funds", "id": "4-from-a-business-idea-to-a-public-company", "t": "4 · From a business idea to a public company", "x": "A **company** exists independently of the entrepreneur, so it can enter enforceable contracts, sue and be sued. **Authorised capital** is the total shares of some face value it may issue; the part issued is **paid-up capital.** Promoters bring the initial capital. Shares can be given without money, e.g. **sweat equity** for employees. Growth stages: **angel investors** (money plus experience, network, mentoring; a valuation is negotiated and equity given); then **venture capital funds, private equity funds, investment banks** (who raise from firms and HNIs); finally the **public.** **Primary market:** the company issues **new shares** from its authorised capital. **Secondary market:** an existing investor sells to a new one; **the company is nowhere involved.** **Preference shares:** customised shares with **priority rights** (fixed dividend first and capital back first on bankruptcy). Only beyond a point are standardised shares issued for liquidity. Public issue Term Meaning **IPO / FPO** Initial / Follow-on Public Offer: the company issues shares and **raises capital** **OFS (Offer for Sale)** Existing owners sell to the public: a **secondary market** sale. **The company receives ZERO.** Example in the handout: a ₹10,000 Cr IPO with ₹9,000 Cr as OFS means the company raises only ₹1,000 Cr The IPO process (SEBI-prescribed) The company decides the amount (e.g. ₹10,000 Cr) and manner (fresh issue or OFS, capital structure, valuation) with advisors: **investment banks (lead manager, underwriter).** An **underwriter** promises to buy all unsold shares. **Application to SEBI:** documents (balance sheet, promoter records, risks). The **DRHP (Draft Red Herring Prospectus)** has **no valuation;** after approval and once the price band is final it becomes the **RHP.** (“Red herring”: intentionally lacks final price and quantity.) **Revealing to the public** by advertisement. **Application and allotment** through **ASBA (Application Supported by Blocked Amount):** the money is **blocked, not debited,** so you keep earning savings interest and refunds are not delayed. **Cut-off price.** **Over-subscription:** demand exceeds supply (fair allocation); **under-subscription:** demand below supply (the underwriter steps in). The **green shoe option** is an over-allotment option for price stabilisation: the underwriter borrows extra shares from promoters and sells them; if the price crashes on listing, the cash is used to buy back shares from the market. Successful applicants get shares in their **demat** accounts; others get funds unblocked. Public issues and trading both take place on **NSE and BSE;** exchanges serve the **primary** as well as the secondary market (commonly forgotten)."}, {"ch": 9, "cht": "Capital Markets: Money Market, Stock Market, Derivatives and Funds", "id": "5-stock-market-intermediaries", "t": "5 · Stock market intermediaries", "x": "Five main intermediaries Intermediary Role (from the handout) **Stock exchanges (NSE, BSE)** Background tasks, **trust** between strangers, information on demand, supply and price, for **rational price discovery.** Brokers first met under a **Banyan tree in Mumbai in 1875** (today’s BSE). Three functions: **trust** (the market is the guarantor; the “Amazon” function), **convenience** (transfer of title via the Registrar), **rationality / price discovery** (participation gives depth, so no one can manipulate the price) **Clearing house (CH)** The **trust architect.** **Pre-funding:** buyer’s money is blocked in the trading account and the seller’s shares are blocked in the demat account before the order. **Novation:** the CH becomes buyer to every seller and seller to every buyer, so **counterparty risk is annihilated** **Depositories and DPs** Safe storage of digital assets (shares, bonds, MF units, T-bills). The **Depositories Act, 1996** created **NSDL and CDSL** and mandated **dematerialisation.** Before, shares were paper, settlement took **14 days,** and brokers misused client assets, culminating in the **1992 stock market scam** **Brokers** The gateway: citizens cannot trade directly. A **SEBI-registered broker** opens a **trading account** (holds funds); a **demat** account is opened with NSDL or CDSL **Banks** Provide money to investors, own or borrowed **The flow:** open trading and demat accounts, place a buy order via the broker, the CH makes sure obligations are met first, orders form **bids and asks,** a matched order is **executed.** The time from execution to credit of shares and money is the **settlement cycle.** Settlement is now **T+1** (T = transaction day) with a **migration to same-day (T+0)** started. The handout says the **Depositories Act was passed in 1996** and, later, that SEBI required **dematerialisation in 1995.** The 1996 Act is the statutory date; **1995** is given for the SEBI requirement. Also, settlement was **14 days** earlier and is **T+1** now. Exam-hall rule: quote **Depositories Act 1996 (NSDL, CDSL)**; mention 1995 only if a question uses it."}, {"ch": 9, "cht": "Capital Markets: Money Market, Stock Market, Derivatives and Funds", "id": "6-returns-absolute-irr-alpha-and-beta", "t": "6 · Returns: absolute, IRR, alpha and beta", "x": "Ways to look at returns Kind Meaning **Absolute returns** Point to point over a period **Average returns** Per year, as a **compounded** average **IRR / XIRR** Internal rate of return on **cash flows** (regular or irregular investments, dividends, rent, maintenance). The handout’s house example: bought at ₹2 Cr, worth ₹5 Cr in 5 years, but rent and maintenance cash flows change the real return **Comparative returns** Against a **benchmark** (Nifty 50, Sensex or a relevant index) **Alpha** The **additional** return a portfolio earns over the benchmark **Beta** The portfolio’s **volatility relative to the benchmark.** Beta 1 moves exactly with the Nifty; **beta 1.5 is 50% more volatile (riskier).** High beta with no alpha means more risk without better returns"}, {"ch": 9, "cht": "Capital Markets: Money Market, Stock Market, Derivatives and Funds", "id": "7-benchmarks-and-indices-nifty-sensex-and-market", "t": "7 · Benchmarks and indices: Nifty, Sensex and market versus economy", "x": "A **benchmark** is a basket of listed companies with **weights** by relative importance (assessed mainly by **free-float market capitalisation**). Its **weighted average price (WAP)** at the base date is **indexed** to 100 or 1000. If WAP goes from 10,000 (index 100) to 100,000 the index is **1000:** the sector gave **10 times** over 10 years. A relevant benchmark for an IT-heavy portfolio is an IT index. Indices are **rebalanced about every 6 months** (firms exit and enter, weights change). Sensex versus Nifty BSE Sensex Nifty 50 **Companies** 30 50 **Base value** 100 1000 **Base year** 1979 1995 Market versus economy Broad indices are used as a **proxy** for economic health, which can mislead. They reflect only the WAP of **50 largest, most formal, cash-rich corporations,** not unorganised MSMEs, agricultural distress, poverty, unemployment, inflation or trade. In **systemic shocks (COVID-19)** the market can hit **record highs** while GDP falls and unemployment rises, because large firms survive and capture the share of dying small businesses. **Forward-discounting mechanism:** the economy is a mirror of the past and present, but the stock market **discounts the future** (about 18 months ahead in the handout’s words). A stock price is the aggregate of what millions expect a company to earn."}, {"ch": 9, "cht": "Capital Markets: Money Market, Stock Market, Derivatives and Funds", "id": "8-derivatives-the-highway-and-land-example", "t": "8 · Derivatives: the highway-and-land example", "x": "The handout uses land worth ₹10 L that could be worth ₹50 L if a highway is approved or ₹5 L if cancelled, with the decision in one year. Spot versus futures versus option Contract What you do If approved (₹50 L) If cancelled (₹5 L) Risk **Spot (cash and carry)** Pay ₹10 L now, take the papers You own it You own it 100% risk, all capital tied up **Futures / forward** Agree to buy for **₹11 L** in one year; no money now Profit **₹39 L** Loss **₹6 L** (bound to buy a worthless plot) **Symmetrical,** an obligation for both **Option** Pay a non-refundable **₹1 L premium** for the **right, not the obligation,** to buy at ₹11 L Net profit **₹38 L** (cost ₹12 L) Loss **only ₹1 L:** tear up the contract **Asymmetrical:** upside large, downside capped at the premium Mapping to market terms In the example Term The barren land **Underlying asset** (shares, gold, wheat) The 1-year deadline **Expiry date** The agreed ₹11 L **Strike price** The ₹1 L token **Option premium** The option itself becomes tradable and valuable (others may offer ₹15 L for it): that is why derivatives are traded. **Philosophy:** derivatives are **risk-management (hedging)** vehicles; institutions buy options as insurance. Retail traders use the **leverage** (₹1 L premium controls ₹50 L of exposure) for gambling; the handout says **99% of retail derivative traders lose money.** **The ticking clock:** in spot markets you need to be right on **direction;** in derivatives you must be right on **direction AND time.** A call option expiring March 31 is worthless if the highway is announced April
