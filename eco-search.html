1."}, {"ch": 9, "cht": "Capital Markets: Money Market, Stock Market, Derivatives and Funds", "id": "9-expert-handling-of-money-mutual-funds-and-etfs", "t": "9 · Expert handling of money: mutual funds and ETFs", "x": "**Retail trap:** slogans like “Yeh market sabka hai” and FOMO; by the time news reaches retail traders, institutions have known for months. The handout says **9 out of 10 retail traders lose money** and advises handing capital to experts, i.e. **mutual funds.** Every “fund” has: an **owner,** a **designated objective,** a **fund manager,** **voluntary contributors** and a **corpus.** Mutual fund versus ETF Mutual fund ETF (Exchange Traded Fund) **Structure** A **Trust** under the **Indian Trusts Act, 1882;** investors are beneficiaries; a board of **Trustees** oversees. An **AMC** (Asset Management Company) launches schemes and hires fund managers Passively managed: e.g. a Nifty 50 ETF holds the exact 50 stocks in index weights **Unit value** Investors get **Units;** value of one unit is **NAV = (assets − liabilities and expenses) ÷ units.** **TER (Total Expense Ratio)** is capped by SEBI Value computable every second **Trading** NAV computed **once a day (EOD);** buy and sell **with the AMC,** not on the exchange Units **listed on the stock exchange** and traded live like shares"}, {"ch": 9, "cht": "Capital Markets: Money Market, Stock Market, Derivatives and Funds", "id": "10-crossing-borders-depository-receipts-and-p-no", "t": "10 · Crossing borders: depository receipts and P-Notes", "x": "Depository receipts Instrument Meaning **Mechanism** An Indian company (the handout uses Infosys) deposits shares with a **local custodian bank** in Mumbai; an **overseas depository bank** issues **receipts** against them, traded in dollars abroad. Avoids conforming the whole accounting system to US standards **ADR** American Depository Receipt: traded in the US **GDR** Global Depository Receipt: Europe or other global markets **IDR** Indian Depository Receipt: the reverse; a **foreign** company raises rupees from Indian investors by issuing IDRs on BSE/NSE (the handout’s example: Standard Chartered) **Participatory Notes (P-Notes)** are officially **Offshore Derivative Instruments (ODIs).** They were used as a “washing mechanism” (round-tripping) for black money: illegal wealth goes to a tax haven (Mauritius), is handed to a SEBI-registered **FII** which invests in its own name; the FII issues a P-Note to the owner, passing on the profits. SEBI could not see the real owner. In **2016-2017** SEBI required FIIs to disclose the **Ultimate Beneficial Owner (UBO)** of every P-Note on request; issuance then fell sharply."}, {"ch": 10, "cht": "External Sector: BoP, Foreign Investment, Exchange Rates, CAD and IMF/World Bank", "id": "exam-lens-priority-and-pyqs", "t": "Exam lens: priority and PYQs", "x": "**Class slides plus handout.** The 19 slides are mostly typed text and Economic Survey charts, not handwritten board work. **The only teacher marks** are **pink ovals and a star** around **2020-21 Q1 and Q2** on the slide “India’s BoP: Overall” (slide 13), on both Figure 16 (CAB) and Figure 17a (BoP balance). The slide does not write the reason; the charts show the current account in **surplus** in those two quarters (Figure 17a: blue current-account bars above zero). **No PYQ is quoted** in the slides or the handout: none quoted in the material. What the class and the handout stress Signal Where Why it matters **Teacher’s pink oval and star** on 2020-21 Q1-Q2 of the BoP charts Slide 13 The only marked data point in the deck: a **current-account surplus** quarter pair BoP = record of **flows** between **residents and non-residents;** **double entry;** credits and debits Handout 1-2 Core accounting rules **Autonomous (above the line)** versus **accommodative (below the line):** Δ reserves and **errors and omissions** Handout 2 The “balance” in BoP **FDI: 10% or more** equity (unlisted: always FDI); **FPI: below 10%;** **Arvind Mayaram Committee,** 2013-14; **9 prohibited sectors;** over **90%** via automatic route Slide 4, handout 3 Numbers and lists **Managed float;** current-account convertibility full, capital account partial; **Tarapore Committees 1997 and 2006** Slides 5-6, handout 3 Classic Prelims **NEER and REER:** RBI uses **indirect quotes,** base **2015-16 = 100;** a **rising** index means a **stronger rupee** Handout 3 Marked as a **“key UPSC trap”** **J-curve** and currency wars Slide 16, handout 4 Worked numbers (VI up 1.5×, VE down to 0.75×) **IMF: 191 members, quota, 85% decisions, US over 16%;** **SDR** is not a currency; **RTP;** lending windows; **World Bank Group: IBRD, IDA, IFC, MIGA, ICSID** Handout 5 Institution facts **Prelims hooks:** components of current and capital accounts; invisibles; where reserves sit; FDI versus FPI and the 10% rule; FDI caps (insurance 74%, defence 74% automatic, print media 26%); FIPB abolished; managed float and VERS 1993; Tarapore committees; Masala bonds; NEER/REER index reading; J-curve; Bretton Woods; IBRD versus IDA versus IFC versus MIGA versus ICSID; IMF quota, SDR, RTP, SBA versus EFF. **Mains hooks:** causes and cures of CAD with side effects (the slides’ cause-policy-consequence frame); why devaluation can worsen CAD; currency wars; why FDI is better than FPI to finance CAD; reserve adequacy; why rupee convertibility on capital account is partial; IMF governance and voting-power criticism; India and ICSID. **Closing idea:** a deficit is not evil; what matters is how it is financed and whether the economy can sustain it."}, {"ch": 10, "cht": "External Sector: BoP, Foreign Investment, Exchange Rates, CAD and IMF/World Bank", "id": "1-how-a-payment-crosses-a-border-and-how-the-bop", "t": "1 · How a payment crosses a border, and how the BoP gets built", "x": "The **Balance of Payments (BoP)** is the ledger of all economic transactions between **residents and non-residents** over a period (the handout calls it “the ultimate macroeconomic ledger of a nation”). Millions transact for selfish motives and do not report to the Commerce Ministry, but every one needs rupees converted into foreign currency or back, and that happens through **Authorized Dealer (AD) banks** who must report the value and **purpose** of every conversion to the RBI daily. The handout’s mobile-cover example (₹20 Cr to China) Step What happens **Order** A Delhi vendor buys 10 lakh covers at 20 Yuan each = **2 Crore Yuan.** The buyer has rupees; the seller needs yuan **Step 1: vehicle currency** The buyer pays SBI about ₹20 Cr. The direct INR-yuan market is not deep, so SBI buys **20 lakh US dollars** (assumed ₹100 per dollar). The **US dollar is the universal bridge (vehicle currency)** **Step 2: global banking network** SBI’s dollar account is with Bank of America (New York). SBI messages: transfer $20 lakh to the Chinese bank’s (SBS) account at Wells Fargo. SBS sells the dollars in the Chinese forex market (assumed 10 yuan per dollar) and credits 2 Cr yuan to the seller **Step 3: Nostro, Vostro, Loro** **Nostro** (“ours”): SBI’s view of its account in New York. **Vostro** (“yours”): Bank of America’s view of the same account. **Loro** (“theirs”): a third bank (PNB) referring to SBI’s New York account **Step 4: the gatekeeper** RBI regulates forex under **FEMA, 1999.** Only licensed **ADs** convert. They ask for a **purpose code** and upload daily to RBI through **FETERS** (Foreign Exchange Transactions Electronic Reporting System). RBI aggregates this into the BoP RBI compiles the BoP on **IMF standards:** the current standard is **BPM6;** **BPM7 was released in 2025** and is expected to be adopted by **2029.** The BoP is a record of **flows.** The record of **stocks** is the **International Investment Position (IIP),** published along with it. Valuation changes appear in the IIP, not the BoP. **Double entry:** every transaction has two entries of equal value, a **credit (+)** and a **debit (−);** all entries sum to zero. **Credit** = export of real resources or reduction of foreign assets / increase of foreign liabilities (money entering). **Debit** = imports, or increase of assets / decrease of liabilities (money leaving). One-sided items (gifts) get offsetting **transfer** entries. **Residents and non-residents** are defined as in national accounts: by **centre of economic interest,** not nationality or legal criteria."}, {"ch": 10, "cht": "External Sector: BoP, Foreign Investment, Exchange Rates, CAD and IMF/World Bank", "id": "2-structure-of-the-bop-autonomous-and-accommodat", "t": "2 · Structure of the BoP: autonomous and accommodative", "x": "Slide 2: Balance of Payments splits into the Current Account (Merchandise, Services, Earnings, Transfers) and the Financial/Capital Account (Loans and Borrowings, Investments). Reserves sit below, balancing the two. The side panel shows a current-account deficit of −50 bn against a capital and financial account surplus of +50 bn, netting to zero. Autonomous versus accommodative transactions Autonomous (“above the line”) Accommodative (“below the line”) **Motive** Self-interest choices of residents and non-residents; nobody controls them Not self-interested; **necessitated** by the net balance above **Items** Current account; capital and financial account **Change in reserves (Δ Reserves)** and **Errors and Omissions (E&O)** **Who acts** Individuals and firms The central bank (**RBI**) A · The current account (settled transactions) The current account tracks **settled** transactions that do **not** change assets or liabilities between residents and non-residents. Current account components Part Contents **1.A.a Goods** Merchandise: textiles, electronics, intermediate goods, metals, coal, jewellery, **non-monetary gold** (not held as reserve) **1.A.b Services** Transport, travel, communication, financial, IT, insurance, royalties and licence fees **1.B Incomes** Compensation of employees; investment income (interest, dividends, profits): earned (+), paid (−) **1.C Current transfers** Remittances into India (+), transfers from India (−); no quid pro quo **Invisibles** **Services + incomes + transfers** B · The capital (and financial) account: old classification **2.A Debt:** borrowings (+), lendings (−), including principal repayments. Classified by **interest rate** (concessional versus commercial), **currency** (domestic versus foreign) and **place** (onshore versus offshore). Governments borrow **concessionally** from agencies like the World Bank; private firms at **commercial** rates. Total commercial debt owed by residents to non-residents is **ECB (External Commercial Borrowing).** **Currency of denomination decides who bears exchange rate risk.** The handout’s example: borrow in dollars when $1 = ₹90; if the dollar rises to ₹100, every ₹90 borrowed needs ₹100 to repay (before interest). Borrowing in rupees shifts the risk to the lender. **Masala bonds:** **offshore rupee-denominated bonds** an Indian entity issues in (for example) American markets; the exchange rate risk shifts to the buyer; they help global recognition and the **internationalisation of the rupee.** An FII buying Indian government bonds is debt taken onshore in rupees. **2.B Investments:** by Indians abroad (−), by foreigners in India (+); withdrawal by foreigners is (−). Split into **FDI** and **FPI.** **2.C Others:** banking capital, trade credits, **NRI deposits.** **2.D Reserves:** under BPM6 reserve assets sit in the **financial account,** but because FEMA works on a current/capital binary, RBI’s standard presentation shows the change in reserves in the capital account. The old “capital account” has moved almost wholly to the **financial account** (external debt and investments). The new **capital account** is narrow: **(a)** acquisition or disposal of non-produced, non-financial assets (e.g. a foreign government buying land in Chanakyapuri for an embassy; outright transfer of a brand name or trademark) and **(b)** **capital transfers** (debt forgiveness between governments, large investment grants, cross-border inheritances). **The Economic Survey still uses the old Current versus Capital classification.** The handout says there is no need to memorise the RBI tables on pages 12-13. C · Accommodative transactions: reserves and E&O If the net autonomous balance is a **surplus** (example: CAD $10 B but capital surplus $25 B = net surplus **$15 B**) RBI **absorbs** the excess foreign currency into **reserves.** In a net deficit RBI **sells dollars** from reserves. These are **accommodating transactions.** Why RBI cannot sit out: if an importer’s bank cannot find dollars it goes to RBI; if an exporter’s bank cannot find a buyer it sells to RBI. Without RBI the dollar could crash or spike. In an **open economy the central bank is less autonomous.** **Mundell-Fleming trilemma (impossible trinity):** a country cannot have all three of **free capital flow, a fixed/managed exchange rate and independent monetary policy.** **Worked example:** reserves $500 B; inflows $100 B and outflows $80 B on autonomous items, so reserves should rise by **$20 B to $520 B.** That is the “balance” in the BoP. **Errors and Omissions:** if the observed reserve change is $20.4 B against an expected $20 B, **E&O = +$0.4 B** balances it. Causes: timing mismatches, exchange rate moves in transit, unrecorded illegal capital flight. The handout writes the closing equation as **“Current Account + Capital Account − Financial Account (which includes Reserves) + Net Errors & Omissions = 0”.** Elsewhere it treats reserves as a part of the capital account (old classification) and says autonomous items are balanced by Δ reserves. The signs are not explained. Exam-hall rule: remember the **idea** (autonomous + Δ reserves + E&O = 0) and the **old classification** unless the question uses BPM6. Slide 13: “India’s BoP: Overall” (RBI figures 16 and 17). Teacher’s marks: pink ovals and a star around 2020-21 Q1 and Q2 on Figure 16 (CAB as % of GDP is positive) and on Figure 17a (BoP balance, where the current account bars are above zero). Figure 17b shows augmented forex reserves rising to about US$634 billion by 2021-22 Q3. **What is marked:** 2020-21 **Q1 and Q2,** circled in pink with a star, on both overall-BoP charts. **Reading from the charts:** the current account swung to **surplus** in those two quarters while capital inflows continued, so the BoP surplus and forex reserves jumped. The slide gives **no written reason.** Check the notebook for the spoken explanation."}, {"ch": 10, "cht": "External Sector: BoP, Foreign Investment, Exchange Rates, CAD and IMF/World Bank", "id": "3-slide-data-on-india-s-bop-economic-survey-char", "t": "3 · Slide data on India’s BoP (Economic Survey charts)", "x": "The slide deck then shows RBI/Economic Survey charts for 2019-20 to 2021-22. They are charts, not text, so only the headline readings that the slides state are listed: **Slide 3 (Table 6):** major components of India’s BoP, 2019-20 to 2021-22, US$ billion (current account, merchandise trade balance, invisibles, capital account, FDI, FPI, loans, banking capital, errors and omissions, overall balance, forex reserves change). **Slides 7-9 (trade balance):** growth in exports and imports; the **top 10 export commodities** pie; the top 10 import sources and export destinations. Slide 19 gives **India’s top 5 trading partners** (share of foreign trade): **USA 11.3%, China 10.9%, UAE 7.3%, Saudi Arabia 4.1%, Hong Kong 3.7%.** **Slide 10 (invisibles):** services exports and imports; remittances; composition of net invisibles (services, transfers, income). **Slides 11-12:** current account balance and its composition; FDI and FPI trends (FPI **remained volatile**); capital account composition. **Slide 18:** sources of forex reserves (FCA, gold, RTP, SDR) and **import cover** (months). Slide 19 (PIB graphic): India’s top 5 trading partners by share of foreign trade, and the top 5 imports (crude petroleum, gold, petroleum products, coal, coke and briquettes) and top 5 exports (petroleum products, precious stones, drug formulations and biologicals, gold and precious metals, iron and steel). Slide 18: Figure 19 from the RBI: sources of foreign exchange reserves (FCA, gold, RTP, SDR) and import cover (right axis, months), 2018-19 to 2020-21."}, {"ch": 10, "cht": "External Sector: BoP, Foreign Investment, Exchange Rates, CAD and IMF/World Bank", "id": "4-foreign-investment-from-poverty-of-capital-to", "t": "4 · Foreign investment: from poverty of capital to the control test", "x": "The history (handout) **1950s-80s:** absolute poverty; near-zero domestic savings made domestic investment impossible; food dependence on the US **PL-480;** the 1962 war, and Shastri’s 1965 **“Jai Jawan, Jai Kisan”** call to skip a meal. Foreign capital was needed but offered on draconian terms: partner with an Indian firm, source **60% locally,** no repatriation of profits. The **LPQ (License, Permit, Quota) Raj** made allocation depend on connections. Suzuki’s entry for Maruti in the 1980s needed political manoeuvring. **1991:** the **BoP crisis** (threat of sovereign default, IMF pressure) led to the **LPG reforms.** The mindset shift stayed slow: as late as **2012** the government demanded **30%** local sourcing from Apple, and Apple walked away. Reforms listed: **1991** opening, **2000** FDI liberalisation, **2013** new policy, **2016** liberalisation, **2020** foreign investment conditions; the handout ties them to **post-nuclear-test isolation, the 2013 US Fed tapering, demonetisation’s bad press, and the 2020 supply-chain shock.** FDI versus FPI (slide 4 and handout) FDI (Foreign Direct Investment) FPI (Foreign Portfolio Investment, formerly FII) **Control** Intention to exercise control: **10% or more** equity No intention to exercise significant control: **less than 10%** **Nature** Long term, stays through downturns; brings money **and technology** **“Hot money”:** cashes out when targets are met or losses mount; money only **Exchange rate** Stable Large inflow or outflow may cause **sharp appreciation or depreciation** **Regulation** Sectoral limits (mostly liberalised); **multiple approvals** (sectoral regulator, Home, Defence, Environment); earlier **FIPB** and **CCEA;** now mostly **automatic** Instrumental limits (mostly liberalised); regulators **RBI and SEBI;** less cumbersome **Example** Honda building cars; Budget 2021: insurance FDI limit **74% from 49%** FIIs buying Indian stocks and government bonds **Why the old test failed:** earlier the split was by **perceived intent** (the old term was **FII**), which was subjective: some “FDI” investors left like hot money and some “FII” funds stayed for decades. In **2013-14,** on the **Arvind Mayaram Committee,** India adopted an **objective “significant control” test** (IMF/OECD). The 10% rule (handout) Case Classification Foreign owner holds **10% or more** of equity in a **listed** Indian company **FDI** Foreign owner holds **less than 10%** of a listed company **FPI** Any foreign investment in an **unlisted** private company or startup **Always FDI,** whatever the percentage Equity only counts: 5% equity + 20% of debt **FPI** (equity below 10%); the debt follows **ECB / FPI-debt** rules Compulsorily convertible instruments (CCPs, CCDs) Treated as equity today: the 10% is on **“post-issue paid-up equity capital on a fully diluted basis”** An FPI like BlackRock crosses 10% in a listed company That investment is **reclassified as FDI;** BlackRock itself stays registered as an FPI The term **FII** now only describes a **class of investors** (large funds like BlackRock, Vanguard, KKR). In **2014 SEBI legally erased the term:** FIIs, sub-accounts and **Qualified Foreign Investors** merged into **Foreign Portfolio Investors (FPIs).** FDI is subject to **sectoral regulation** (Defence, Insurance, Telecom limits), apart from SEBI and RBI financial-market rules. The **slide** says FDI is **“More than 10% ownership”** and FPI **“Less than 10% holding”.** The **handout** says FDI is **“10% or more”** and FPI **“less than 10%”.** Exactly 10% is the only case that differs. Exam-hall rule: use **“10% or more = FDI”** (handout and teacher’s handout text win); be careful if an option says “more than 10%”. FDI reforms and the present regime Almost every sector open to the Indian private sector is open to foreigners **except 9 prohibited sectors:** 1 lottery, 2 gambling and betting (including casinos), 3 chit funds, 4 Nidhi companies, 5 trading in Transferable Development Rights (TDRs), 6 real estate business (pure buying and selling of land for profit), 7 manufacture of tobacco products, 8 atomic energy, 9 railway operations (except certain infrastructure). Limits go up to **100%** in several sectors. **Budget 2021: insurance FDI raised to 74% from 49%.** **Automatic route:** **over 90% of FDI** comes this way. No prior approval; inform RBI within **30 days** of bringing the money. A foreigner faces the same regulations as an Indian. **Government (approval) route:** sensitive sectors need the Ministry’s prior approval through the **Foreign Investment Facilitation Portal (FIFP).** Any foreign investment above **₹5,000 Crore** needs **CCEA** approval. The **FIPB has been abolished.** **Defence example:** up to **74%** in a joint venture is automatic (the JV applies to the Ministry of Defence); **100%** needs **CCEA** approval, given on bringing **state-of-the-art technology.** **Print media:** FDI capped at **26%** (the Ministry of Information and Broadcasting steps in at the control line). **Greenfield** = investment in a **new** entity (e.g. Kia building a new factory in Andhra Pradesh). **Brownfield** = investment in an **existing** entity (e.g. Walmart acquiring Flipkart). **FPI is money; FDI is marriage:** the entity is regulated, not the investor. **Fit and proper:** when a Japanese bank like Mitsui wanted a **20%** stake in an Indian bank, it crossed the 10% line and RBI would test its track record, **ultimate beneficial owners** and financial stability. A 6% FPI holding (the handout’s Vanguard in Yes Bank example) barely registers."}, {"ch": 10, "cht": "External Sector: BoP, Foreign Investment, Exchange Rates, CAD and IMF/World Bank", "id": "5-exchange-rates-demand-supply-and-quotes", "t": "5 · Exchange rates: demand, supply and quotes", "x": "An **exchange rate (ER)** is the price of one currency in terms of another. Neither the US Fed nor the RBI dictates it in India; millions of buyers and sellers do. **Direct quote:** $1 = ₹90 (price of foreign currency in domestic units). **Indirect quote:** ₹1 = $(1/90) ≈ $0.011. **Demand for dollars (a minus on the autonomous BoP):** importers; income outflows (interest and dividends abroad); **capital flight** (FPIs selling stocks); citizens abroad (tourists, students). **Supply of dollars (a plus on the autonomous BoP):** exporters; foreign investors (FDI, FPI); borrowings (ECBs); remittances and tourism. The ER is where **D$ meets S$.** A crude oil price surge raises demand for dollars and the dollar becomes costlier (₹90 to ₹95); a flood of foreign investment raises supply and the dollar becomes cheaper. Exchange rate systems The four systems (handout; slide 5 for the first three) System What it is Terms and examples **Floating (market based)** The ER is set by demand and supply; no intervention; free movement of foreign currency; needs a deep forex market **Appreciation / depreciation** (automatic) **Fixed** An authority sets a rigid rate and **enforces** it. A cheap fixed dollar (₹40 against a market ₹90) would explode demand, so the central bank must sell reserves (finite) or **restrict demand** (import bans, limits on profit repatriation and remittances). This breeds **illegal channels and black markets (Hawala)** and shields inefficient domestic producers **Devaluation / revaluation.** Slide 5: ways to fix: control demand or supply of foreign currency; peg to a stable commodity (**gold standard** pre-World War); peg to another currency through **currency boards** **Pegged (a variant of fixed)** A country without a deep forex market pegs to a large trading partner’s or neighbour’s currency Bhutan’s ngultrum and Nepal’s rupee pegged to the INR (Bhutan 1:1); UAE dirham and Hong Kong dollar pegged to the US dollar **Managed float (dirty float, mixed)** Largely floating, but the central bank **intervenes** on certain objectives (e.g. volatility) **India follows a managed float.** RBI does **not** target a specific value (₹82 or ₹85); its sole aim is to **curb excessive volatility** by selling or buying dollars. The handout objects to the term **“dirty float”** as pejorative Evolution of India’s exchange rate system (handout) Period System 1947 - 1971 **Par Value System:** rigidly pegged to the US dollar 1971 - 1975 Pegged to the **UK pound sterling** 1975 - 1992 Pegged to a **basket of currencies** 1992 - 1993 **LERMS** (Liberalized Exchange Rate Management System): dual-rate transition 1993 - present **VERS** (Voluntary Exchange Rate System) / managed float; rupee fully convertible on the current account Convertibility of the rupee **Convertibility** is the legal ease of swapping domestic and foreign currency. **Non/partially convertible** (restrictions on amount or purpose) is a hallmark of fixed regimes; **fully convertible** needs no RBI permission. **Before 1993** the rupee was rigidly fixed and restricted. Today it is **100% convertible on the current account.** On the **capital account** it is **partially convertible:** FDI and FPI are free, but there are limits on corporate **ECBs** and on resident Indians sending capital abroad (**LRS limits**). So the rupee is “partly convertible (or almost fully convertible)”. **Tarapore Committees (1997 and 2006)** on full capital account convertibility concluded it is too dangerous until India fixes its **fiscal deficit** and **bank NPAs.** **Slide 6:** the Tarapore recommendation is a **graded move** towards full convertibility: control of **fiscal deficit,** control over **inflation,** shoring up the government’s ability to repay debts, controlling **gross NPAs** of banks. The **2nd Tarapore Committee** further recommended: raising **ECB limits,** relaxations for **NRIs,** **abolition of Participatory Notes.** The **slide** lists the first committee’s four conditions and a **second** committee’s three recommendations without years; the **handout** gives the years **1997 and 2006** and only the conclusion (fiscal deficit and NPAs). Exam-hall rule: **Tarapore I = 1997, Tarapore II = 2006;** link the four preconditions to the first and ECB/NRI/P-Note changes to the second, as the slides do. External debt (slide 8) External debt includes: **sovereign debt, ECBs, FII debt, multilateral debt, Masala bonds,** and (proposed) **sovereign debt bonds.** Most foreign debt is **denominated in US dollars,** followed by **INR-denominated debt;** most is of **long-term maturity** (the slide points to an article for detail)."}, {"ch": 10, "cht": "External Sector: BoP, Foreign Investment, Exchange Rates, CAD and IMF/World Bank", "id": "6-nominal-real-and-effective-exchange-rates", "t": "6 · Nominal, real and effective exchange rates", "x": "The **absolute** level (₹80 or ₹150 per dollar) is “largely irrelevant”; the **movement** decides **trade competitiveness.** Depreciation versus appreciation (direct quote) Depreciation Appreciation **Rupee** Loses value; $1 moves from ₹80 to ₹90 Gains value; $1 moves from ₹90 to ₹80 **Imports** Costlier, discouraged Cheaper **Exports** Cheaper for foreigners, encouraged Costlier, uncompetitive **The dollar falling from ₹90 to ₹80 is a rupee APPRECIATION.** The handout warns “this complication may cost dearly in exams”. In a **floating** system the terms are appreciation/depreciation; in a **fixed** system they are **revaluation/devaluation.** Nominal versus real exchange rate Nominal ER (NER) Real ER (RER) **Meaning** Market price: what exporters actually receive, importers actually pay (e.g. $1 = ₹80) Inflation-adjusted ER: **RER = NER × (PF ÷ PD)** **Why it matters** Its movement affects trade Inflation also moves competitiveness: with NER fixed at ₹80, India’s 10% inflation against the US 5% raises the price of Indian exports **Handout numbers** NER ₹80; PF = 105; PD = 110 RER = 80 × 105 ÷ 110 ≈ **₹76** (below NER: the rupee is “actually stronger”, imports rise, exports fall) **The fix** Let NER depreciate to ₹85 RER = 85 × 105 ÷ 110: the handout says **“~₹80”** (the arithmetic gives about ₹81), restoring competitiveness **Effective Exchange Rate (EER):** the weighted average of an ER over a basket of partner currencies, with weights from **each partner’s share of India’s trade.** **NEER** = weighted average of bilateral **nominal** rates. **REER** = NEER **adjusted for inflation differentials.** **1.** RBI uses **indirect quotes** (it computes the **value of the rupee**), so a **rising EER means a stronger rupee.** **2.** RBI publishes an **index** (**base year 2015-16 = 100**). Above 100 means the rupee is **over-valued** against the base; a rising value over time means the rupee is becoming **expensive and losing trade competitiveness.** **3.** RBI uses **two baskets:** a quick one with the **6 major trading partners** and a complex one with the **40 largest;** weights follow trade shares and are revised regularly."}, {"ch": 10, "cht": "External Sector: BoP, Foreign Investment, Exchange Rates, CAD and IMF/World Bank", "id": "7-current-account-deficit-causes-cures-and-side", "t": "7 · Current Account Deficit: causes, cures and side effects", "x": "**CAD** arises when outgo on the current account exceeds inflow, mostly **imports above exports.** **CAD = VI − VE.** A deficit is **not inherently evil:** for a developing country needing capital machinery it is often unavoidable. The test is **sustainability:** **quality of financing** (stable **FDI** is sustainable; volatile **FPI** or expensive ECB is not) and **reserve adequacy** (the handout says **6 to 8 months of import bill**). Reasons for high imports and low exports High imports Low exports High domestic income growth; dependency on natural resources (crude, APIs); low import tariffs; insufficient domestic production capacity; high inflation (domestic goods dear, imports cheap); strong exchange rate Poor manufacturing base (EODB, taxes, infrastructure, investment); recession abroad; depletion of natural resources; poor quality; high inflation; strong exchange rate **Slide 14 (causes of deficits):** **demand side:** strong domestic growth, weak foreign growth or recession abroad, strong exchange rate. **Supply side:** low investment, low productivity, high relative inflation, high labour costs, poor quality of exports, depletion of resources. The slide also flags **“*Dutch Disease?”** with no explanation in the slides or the handout, so none is given here. Four groups of reasons, the policy and its trade-off (handout table and slides 15-17) Reason Policy Consequence or trade-off **1 · Demand side:** high incomes; inelastic necessities (crude, APIs); the **“gold sinkhole”** (gold imports lock wealth in vaults, drain forex without productive use); growth itself raises luxury imports **Demand reduction:** contractionary fiscal or monetary policy; **import restrictions** (tariffs, bans) The “**sledgehammer**”: lower growth, higher unemployment and poverty, loss of business confidence. Restrictions breed **illegal channels;** imports continue and government loses tax revenue **2 · Policy side (tariffs):** cheap imports; high taxes on domestic goods. **Inverted Duty Structure (IDS):** tax on finished goods is below tax on intermediates, so importing the finished good is cheaper than assembling **Impose tariffs, quotas;** raise import taxes, cut taxes on domestic goods, subsidise producers **Retaliation,** costly, **inflationary,** **WTO violation,** higher prices for consumers; exports in pharma, petroleum, electronics, gems become uncompetitive because they use imported intermediates **3 · Supply side:** poor infrastructure, EODB, low R&D, disasters **Supply-side policy:** invest in infrastructure; improve EODB, contract enforcement, compliance, land acquisition; skilling; quality checks (**Zero Defect, Zero Effect**); **Production Linked Incentive (PLI) schemes** **Long term, costly,** no guarantee; all must be achieved together. “Easier said, impossible to do” **4 · Strong exchange rate:** makes imports cheap and exports dear **Devaluation** of the currency; **domestic subsidies to exports** **Currency wars,** imports costlier, the **J-curve effect** (below) The investment paradox and the opportunity cost trap To fix the supply side a country must invest (ports, highways, power), sacrificing present welfare (healthcare, education, subsidies) for future returns. **The “China illusion”:** a highway generates exceptional returns **only if** synchronised with the “software”: **EODB, contract enforcement, land, flexible workforce, talent.** Without them the nation suffers the opportunity cost but gets mediocre gains. **Winner-takes-all race:** India, Vietnam, Sri Lanka and Egypt compete for factories leaving China or the US; global firms (Apple, Foxconn) choose a **single** destination. Losers are left with debt and empty industrial parks. **Reality check:** Southeast Asian nations opened earlier and have superior infrastructure, so India “is desperately racing to catch up”. It is a case that **investment alone is not enough.**"}, {"ch": 10, "cht": "External Sector: BoP, Foreign Investment, Exchange Rates, CAD and IMF/World Bank", "id": "8-the-j-curve-and-currency-wars", "t": "8 · The J-curve and currency wars", "x": "Slide 16: the J-curve (devaluation occurs; the current account first worsens, then improves). Where PED 1 it improves it. The slide’s text: cause, strong currency; policy, devaluation of the exchange rate and domestic subsidies to exports; consequence, currency wars, imports costlier, elasticity of imports and exports changes with currency (J-curve effect). Devaluation is expected to cut imports and raise exports. But **CAD = VI − VE** where **VI = PI·QI** and **VE = PE·QE.** Upon devaluation PI rises (so QI falls) and PE falls (so QE rises). The net effect depends on **elasticities.** The handout’s worked numbers (inelastic imports and exports) Imports Exports **Price** PI doubles: PI′ = 2 PI PE halves: PE′ = PE / 2 **Quantity** QI falls to 0.75 QI (falls, but less) QE rises to 1.5 QE (rises, but less) **Value** VI′ = 2 × 0.75 = **1.5 VI** (import bill rises) VE′ = 0.5 × 1.5 = **0.75 VE** (export revenue falls) So **VI up and VE down: CAD worsens first.** The inelasticity assumption is generally true for India: imports are **necessities** (crude, pulses, APIs) and exports are inelastic in the short term (foreign buyers weigh convenience, trust, quality, payment terms, shipping, and competitors cut prices too). Countries still devalue hoping that in the **medium to long term** imports fall and exports rise enough to correct the CAD: the **J-curve effect.** Currency wars (competitive devaluation) India devalues; CAD worsens immediately (the downward stroke of the J). Just as exports become competitive, **China devalues the yuan** and the advantage is wiped out. India devalues again from a deeper deficit; then **Vietnam devalues;** India drops again: a series of cascading drops. Result: CAD worsens perpetually, capital flees, reserves are bled dry, inflation crushes the population; the country becomes indebted on terms that may undermine **sovereignty.** A “**beggar thy neighbour**” policy leaves everyone a beggar. Under a **floating** system the CAD causes **depreciation** automatically; no one sees it as an unfair advantage, so there is no retaliation: **floating acts as an automatic stabiliser of CAD.**"}, {"ch": 10, "cht": "External Sector: BoP, Foreign Investment, Exchange Rates, CAD and IMF/World Bank", "id": "9-international-institutions-cooperation-and-bre", "t": "9 · International institutions: cooperation and Bretton Woods", "x": "International institutions facilitate **cooperation** among countries that compete for national interest (tariffs, retaliation, devaluation, war). **Game theory** (John von Neumann, then John Nash): when each player acts aggressively for its own maximum payoff, all can end worse off (“race to the bottom”); the **Nash Equilibrium** needs mutually acceptable rules. The handout uses the Iran-Israel-US matrix as a modern illustration. **Bretton Woods Conference, 1944** (44 countries): after two World Wars, which the handout says were fundamentally caused by economic desperation, **competitive devaluations** and colonial **debt traps** (underlying cause: the BoP). The handout’s example: the East India Company did not conquer Bengal with an army; the Nawabs defaulted and signed over the **Diwani;** British goods paid zero duty in India while Indian goods faced around **200%** in Britain. **Keynes (UK)** wanted a neutral global central bank and a stateless currency, the **“Bancor”.** **Harry Dexter White (USA)** demanded a **US dollar (gold-backed) anchor** and voting power proportional to contributions (the US held about **80% of central-bank gold**). White’s vision prevailed. Three questions, three pillars Problem Answer BoP crisis manager: stop a country going bankrupt and being conquered **International Monetary Fund (IMF)** Rules of the game: stop tariff wars The **International Trade Organization (ITO)** was proposed and failed; it became the **WTO in 1995** The builder: rebuild war-torn Europe and finance newly independent colonies **World Bank (IBRD)** The IMF and the World Bank, born together, are the **“Bretton Woods Twins”.**"}, {"ch": 10, "cht": "External Sector: BoP, Foreign Investment, Exchange Rates, CAD and IMF/World Bank", "id": "10-the-world-bank-group", "t": "10 · The World Bank Group", "x": "“World Bank” strictly means **IBRD + IDA;** the **World Bank Group (WBG)** has **five** institutions. **Goals by 2030:** end extreme poverty (people living on less than **$2.15 a day** to no more than **3%** of the world’s population) and promote **shared prosperity** (income growth of the **bottom 40%** in every country). **Governance:** voting by shares, not one country one vote; the **USA** is the largest shareholder with large veto power over major changes. **Board of Governors** (usually finance ministers, meets annually); **25 Executive Directors** in Washington D.C. approve loans; the **President is always an American** nominated by the US (the IMF head is always a European). Five pillars of the World Bank Group Institution Function Funding and borrowers **IBRD** (International Bank for Reconstruction and Development) The original; long-term, favourable-commercial loans to **middle-income and creditworthy low-income** countries for infrastructure Issues **World Bank bonds** (AAA rating) in global markets; major borrowers: **India, Indonesia, Brazil, Turkey** **IDA** (International Development Association), **1960** **Concessionary** window: zero to very low interest **“credits”** and grants to the **poorest;** repayment **30 to 40 years** Funded by **donor contributions,** **replenished every three years;** beneficiaries: Sub-Saharan Africa (Nigeria, Ethiopia), Bangladesh. **India graduated from IDA in 2014** and is now only an IBRD borrower (formerly a “Blend” nation) **IFC** (International Finance Corporation) **Private sector arm:** lends directly to private corporations. Most transformative role: **credit guarantee** (credit enhancement) because a firm’s rating is capped by its **sovereign rating** (the **“sovereign ceiling trap”**: an Indian corporate pays say 7% instead of 4% in the US) AAA-rated; also pioneers **local currency financing** (e.g. rupee **Masala bonds**) to reduce exchange rate risk **MIGA** (Multilateral Investment Guarantee Agency) **Insurance arm:** **Political Risk Insurance** for foreign investors against **expropriation, breach of contract, war and civil disturbance, currency inconvertibility** Reduces fear of policy instability **ICSID** (International Centre for Settlement of Investment Disputes) International arbitration of disputes between foreign investors and host states **India is NOT a member:** it sees bypassing the domestic judicial system as infringing sovereignty and insists on exhausting domestic remedies first **Flagship publications:** **World Development Report (WDR);** **Global Economic Prospects** (bi-annual); **Logistics Performance Index (LPI);** the **Ease of Doing Business** index was discontinued and is being replaced by **B-READY.**"}, {"ch": 10, "cht": "External Sector: BoP, Foreign Investment, Exchange Rates, CAD and IMF/World Bank", "id": "11-the-imf-functions-quota-sdr-and-lending", "t": "11 · The IMF: functions, quota, SDR and lending", "x": "The IMF (conceived July 1944 at Bretton Woods) works for **sustainable growth and prosperity of its 191 members** through three missions: **international monetary cooperation, expansion of trade and growth, discouraging harmful policies.** It monitors global financial flows and puts out **BoP crises** before they cause a global meltdown. Core functions Function Details **Surveillance** Monitors exchange rates, capital flows, reserve adequacy. **Article IV** consultations: mandatory annual health-checks on every member; publications: **World Economic Outlook (WEO), Fiscal Monitor, Global Financial Stability Report (GFSR)** and country reports **Capacity building** Technical assistance to central banks on inflation and tax policy **Lending** **Lender of last resort** when a country runs out of foreign currency **Structure like a fund:** owner = 191 member countries; objective = stability of the global financial system; **fund manager** = **Executive Board of 25 Executive Directors + 1 Managing Director (26 since 2024);** contributors = members by **quota;** corpus = total contributions. **Quota** is set by size of economy, forex reserves, openness to trade. It fixes **(1) subscription,** **(2) voting power** (not one country one vote; proportional to quota; major decisions need an **85% supermajority,** which gives the **United States (over 16%)** a veto), and **(3) borrowing limits** (a multiple of quota). **Votes:** **Fixed Votes** are shared equally among members (to protect small countries); **Quota-Based Votes** follow each country’s share of total quota (if India’s quota is 4 of 100, it gets 4% of QBV). Executive Directors represent groups: the **Indian Executive Director represents India, Bhutan, Bangladesh and Sri Lanka** with combined voting power of about **3.5%.** Most decisions are by simple majority; quota reforms need 85%. Quota reforms are due every 5 years but are slow; the handout says India now **contributes more than its quota requires** as a signal. How subscriptions work, SDR and RTP The subscription (numerically equal to the quota) is counted in **SDRs,** which the country buys from the IMF. **75% is paid in domestic currency (rupees); 25% in freely usable foreign currency or gold** (USD, JPY, RMB, EUR, GBP). SDR holdings count as **forex reserves.** The **25% foreign-currency part** can be withdrawn **unconditionally,** also counted in reserves: the **Reserve Tranche Position (RTP),** “kind of an interest free loan”. **Forex reserves = gold + foreign currency assets (cash and foreign government bonds) + SDR holdings + RTP.** What an SDR is SDR (Special Drawing Rights) Meaning **Not a currency** Not a medium of exchange: a country cannot buy goods with SDRs **Not a claim on the IMF** A country cannot sell SDRs back to the IMF for currency **Definition** A **potential claim on freely usable currencies** with other IMF members; a **reserve asset** created to supplement reserves **Who can hold** Member countries and prescribed holders (IMF, World Bank, European Central Bank) **Position on joining** **Holdings (asset)** = IMF’s liability to the country; **allocations (liability)** = what the country owes. They are equal at the start, so no net interest; the IMF sets the **interest rate weekly** **How it works in a crisis:** country X (Sri Lanka in the handout’s example) sells its holdings to a surplus country Y (Germany) at the SDR price and gets the currency it needs. X’s holdings fall below its allocations and it pays **net interest** to the IMF; Y’s rise above and it earns interest **from the IMF.** Y is willing to lend because the **IMF** pays and guarantees repayment: the IMF is a **risk management entity** spreading risk across all members. When X exhausts its SDRs it can ask for more: the IMF can **create SDRs out of thin air,** raising holdings and allocations equally. **Until this point the IMF has not lent a rupee from its corpus.** Direct IMF lending windows (after SDRs and RTP are exhausted) Facility For Terms **Extended Credit Facility (ECF)** Low-income nations; funded by the **Poverty Reduction and Growth Trust (PRGT)** Zero-interest; long-term support for deep structural BoP problems **Rapid Credit Facility (RCF)** Low-income nations Emergency, fast, limited conditions (natural disasters, COVID-19) **Stand-By Arrangement (SBA)** Middle and high-income nations; market-related interest Short-term (**1-2 years**) for cyclical BoP crises; **most loans lie here** **Extended Fund Facility (EFF)** Middle and high-income nations Longer (**3-4 years**) for deep structural weaknesses (the handout cites Pakistan’s repeated bailouts) **Conditionalities / Structural Adjustment Programs (SAPs)** on SBA and EFF, released in tranches: fiscal austerity, higher taxes, slashed subsidies, privatisation of PSUs, removal of price controls. Seen as a **gross infringement on sovereignty;** the handout also notes allegations of **bias** (EU defaulters get fewer conditions than South Asian countries). Before lending, the IMF often consults the **FATF** to check the borrower is not a hub for money laundering or terror financing."}, {"ch": 11, "cht": "Goods and Services Tax (GST)", "id": "exam-lens-priority-and-pyqs", "t": "Exam lens: priority and PYQs", "x": "**Handout only.** No class slides and no teacher ink. The handout carries the teacher’s **handwritten worked examples** (the shirt example in pink); those are part of the handout, not a forecast. **No Prelims or Mains PYQ is quoted** in this handout: none quoted in the material. Priority below is the handout’s own emphasis. What the handout stresses Signal in the handout Where Why it matters **Cascading** = tax on tax and tax on value already taxed. Of ₹32 tax, only **₹5.8** was on fresh value Section 2 Core concept; the shirt example **ITC** works only **tax against the same tax**. Tax is always charged on the entire value; ITC makes it effectively a tax on value added Section 3 Two “very important points” in the handout GST = tax on supply of goods and services **other than alcohol for human consumption;** **one nation-one tax, destination-based, VAT-like** Section 4 Statutory definition **CGST, SGST, IGST;** SGST goes to the destination state; customs is not part of GST Section 4 Statement traps **GST Council (Art. 279A):** chair Union FM; quorum 50%; decision by **75%**; States **2/3** weight, Centre **1/3** Section 5 Numbers **101st Amendment Act, 2016 (08.09.2016);** Art. **246A, 269A, 279A;** 5 petroleum products outside GST for now Sections 5-6 Provisions **Compensation:** base on pre-2017 revenue, **14%** assumed growth, **5 years (till 2022);** only for shortfall caused by GST Section 7 Number and condition **Revenue neutral rate;** **anti-profiteering;** **exports zero-rated** Section 7 Concept questions **Registration ₹20 lakh** (₹10 lakh special category), **composition,** **GSTN** (2013, Section 25 company, Infosys), **e-way bill 01.04.2018** Section 8 Numbers and dates; conflicts flagged **Prelims hooks:** the three properties of GST; GST on what (not alcohol for human consumption); CGST, SGST, IGST; ITC rule; what is outside GST; GST Council composition and voting; Articles 246A, 269A, 279A; 101st Amendment; compensation (14%, 5 years); zero-rated versus exempt; RNR; anti-profiteering; GSTN; composition and registration limits. **Mains hooks:** how GST ends cascading and why compliance rose; GST and cooperative federalism (pooled sovereignty versus loss of State autonomy); challenges (multiple slabs, lobbying, petroleum outside); why compensation became a conflict; why a single flat rate would be regressive. **Closing idea:** GST is the 2005 VAT idea taken to its end: one event, one tax chain, one credit system."}, {"ch": 11, "cht": "Goods and Services Tax (GST)", "id": "1-the-old-system-taxes-are-levied-on-events", "t": "1 · The old system: taxes are levied on events", "x": "**Taxes are levied on events:** sale of a good or service, generation of income, change of international boundary (customs), profit of a company. The person on whom tax is levied deposits it with the government. **Indirect tax:** the tax is levied on A and A pays the government, but A **collects it from B,** who bears the burden. Centre, States and local bodies all levied such taxes. **Old regime flow:** every producer pays **excise duty** to the Centre on production. On every sale the State levies **sales tax** (later VAT). Wholesaler and retailer add margins; sales tax applies at every sale. The consumer bears it all. **Central Sales Tax (CST):** a State cannot tax an inter-State sale because that would distort free movement of goods (**Art. 301-307**). The Centre levies CST and **transfers the entire amount to the selling State.** Handout page 2 (teacher’s drawing): the old regime. Cloth and thread producers pay excise duty to the Centre and sales tax to the State; the shirt producer pays excise (C) and sales tax (S) at each stage; the note says sales tax is levied on the value of sales and excise duty on the value of production (or at a fixed rate, i.e. a specific duty)."}, {"ch": 11, "cht": "Goods and Services Tax (GST)", "id": "2-the-problem-cascading-of-taxes", "t": "2 · The problem: cascading of taxes", "x": "The shirt example: value added at each stage is **₹366** (cloth 100, thread 100, shirt producer 58, wholesaler 48, retailer 60). The consumer pays **₹550,** so the effective tax is **₹184 on ₹550 = 33.5%.** The handout’s conclusion: with that burden nobody would ask for a bill. The problem is **compounding: double taxation of the same value and a tax on tax.** This is **cascading.** Handout page 3 (teacher’s drawing): the shirt example with numbers. Cloth and thread ₹100 each with excise ₹10 and sales tax ₹11; shirt producer value added ₹58 and excise ₹20; wholesaler margin ₹48; retailer margin ₹60; final price paid ₹550. Take the sale from producer to wholesaler: sales value **₹320,** sales tax at **10% = ₹32,** so the wholesaler pays **₹352.** The ₹32 breaks down as: Where the ₹32 comes from Part Amount What it is Tax on the value added by the shirt producer **₹5.8** Fresh value: the only legitimate part Tax on the producer’s own excise duty (₹20) ₹2 Tax on tax Tax on value added by cloth producer and by thread producer (₹10 each) ₹20 (10 + 10) Tax on value already taxed Tax on the excise paid by cloth and thread producers (₹1 each) ₹2 Tax on tax Tax on the sales tax between cloth/thread and the shirt producer (₹1.1 each) ₹2.2 Tax on tax Out of ₹32 levied at this stage, only **₹5.8** was on value not yet taxed. The remaining **₹26.2** was tax on tax or tax on value already taxed. In the handout’s algebra line, “121 (cost paid to cloth producer)” is written twice; the second should be the thread producer. The totals are unaffected. **Exam-hall rule:** learn the five-part split above, not the algebra."}, {"ch": 11, "cht": "Goods and Services Tax (GST)", "id": "3-the-correction-vat-2005-and-input-tax-credit", "t": "3 · The correction: VAT (2005) and Input Tax Credit", "x": "**From 2005, State sales tax is levied on value added,** not the whole transaction; this was itself called **VAT.** For Central excise, the VATting system was already used in the **1980s** and was called **CENVAT / MODVAT.** **Aim:** reduce the burden by making taxation fair and so raise **compliance.** In the example, the producer-to-wholesaler tax falls to a tax on ₹58 only (₹5.8). **Input Tax Credit (ITC):** the tax already paid on inputs (the previous stage) with proof, the bill, is **offset** against the tax payable on the output. The producer had paid ₹11 each on cloth and thread, so **₹22** of ITC sits in his account. **1. Tax is always charged on the entire value of the transaction.** The government cannot see your value added. Taxing value added is the **objective;** ITC is how it is **achieved.** The seller’s bill shows only inputs plus value added, so the customer is charged accordingly. **2. ITC and offsetting work only for a tax against the same tax.** VAT against VAT, not against excise (a Central tax) or State taxes such as entertainment, luxury and octroi. Handout page 5 (teacher’s drawing): bills of transaction between producer and wholesaler. Old regime (pre-2005): value of sale 320, sales tax @10% 32, total paid 352. New regime (2005-2017): value of input 110 + 110 = 220, tax already paid 22, value added 58, excise paid 20, value of sale 220 + 58 + 20 = 298, sales tax 29.8, total paid 327.8; tax paid by the producer = 29.8 − 22 = 7.8 = 5.8 + 2. Old regime versus VAT: producer to wholesaler Old regime (pre-2005) VAT (2005-2017) **Tax base** ₹320 (everything) ₹298 (input 220 + value added 58 + excise 20) **Tax** ₹32 ₹29.8, less ITC ₹22 = **₹7.8 payable** **Total paid by wholesaler** ₹352 ₹327.8 **What is left of cascading** All of it The **₹2 tax on excise** (VAT is still levied on excise duty) **Benefit of VAT:** the tax burden falls because the taxable value is far smaller. **Shortcoming:** cascading is **not eliminated,** because VAT is still levied on excise. **GST removes it completely** by removing every other event of taxation except sale, so that all taxes can be offset against each other."}, {"ch": 11, "cht": "Goods and Services Tax (GST)", "id": "4-what-gst-is", "t": "4 · What GST is", "x": "**GST is the wider application of the VAT system.** It removes all other events of indirect tax **(except Customs)** and combines them into one event: **the sale of a good or a service.** There is no excise, CST or entry tax/octroi any more. A produces and sells to B: only GST. B sells to C and charges tax on the value added. Handout page 6 (teacher’s drawing): the GST chain. Cloth and thread producers, shirt producer, wholesaler and retailer each charge GST (Centre + State); the consumer pays at the end. Small note: “Let GST be @ 20%”. The same shirt under GST at an assumed 20% Stage Value added GST on the sale Net tax paid after ITC **Cloth and thread producers** ₹100 each ₹20 each (on ₹100) ₹20 − 0 = **₹20** each (20% of 100) **Shirt producer** ₹58 ₹51.6 (on 258) 51.6 − 40 = **₹11.6** (20% of 58) **Wholesaler** ₹48 ₹61.2 (on 306) 61.2 − 51.6 = **₹9.6** (20% of 48) **Retailer** ₹60 ₹73.2 (on 366) 73.2 − 61.2 = **₹12** (20% of 60) **Consumer pays** ₹366 in total **₹73.2** = 20% of 366 **Final price ₹439.2** (against ₹550 earlier) Handout page 7 (teacher’s drawing): “Net tax paid” at each stage, ending with the customer paying 73.2 = 20% of the entire value added (100 + 100 + 58 + 48 + 60). A tiny bracket note at the bottom of the numbers diagram (page 6) is handwritten and hard to read; it appears to compare ₹439.2 with ₹550 under the earlier tax regime. **Check your notebook.** The 20% is the teacher’s assumed rate for the example, **not** an actual GST slab (the handout’s slabs are 0, 5, 12, 18 and 28). Handout page 12: the pre-GST structure (Central taxes with their administrations, Acts and procedures; multiple State taxes, administrations, Acts and procedures; Customs, Excise, Electricity duty, Entertainment tax, Luxury tax, VAT, Entry tax and Octroi layered above State levies) giving way to GST: a single tax, single administration, uniform law and computerised uniform procedures, split into CGST, SGST/UTGST and IGST. Statutory definition and three properties GST is **any tax on supply of goods and services other than on alcohol for human consumption.** Three properties Property Meaning **One nation-one tax** Subsumes many indirect taxes: **VAT, CST, Excise, Service tax,** etc. **Destination-based** The taxing authority is the place where goods are **supplied to,** not where the sale originates **VAT-like structure** Taxes paid at previous stages are available as **set-off** at the next stage CGST, SGST and IGST Tax When Who gets the revenue **CGST + SGST** Sale **within a State** (the consumer sees two components) CGST: the Centre. SGST: the **destination** State **IGST (Integrated GST)** Sale **across two States** Levied by the Centre on inter-State supplies and imports (Art. 269A) The goods and services to be taxed and the other essential design features must be **common** between the Centre and the States. **International trade:** GST is destination-based, so **exports are zero-rated.** **Zero-rated does not mean exempt:** exporters are eligible for **full duty drawback.** **Customs duty is not part of GST.** **Imports** are taxed like domestic goods: **basic customs duty** on entry, then **IGST.**"}, {"ch": 11, "cht": "Goods and Services Tax (GST)", "id": "5-gst-council-and-the-constitution", "t": "5 · GST Council and the Constitution", "x": "**Constitution (101st Amendment) Act, 2016,** notified on **08.09.2016.** **Art. 246A:** concurrent jurisdiction for levy and collection of GST by the Centre and the States. **Art. 269A:** the Centre levies and collects **IGST** on inter-State supplies, including imports. **Compensation** to States for loss of revenue for **five years** on the recommendation of the GST Council (the handout cites “Clause 19”). **Petroleum:** crude, high speed diesel, motor spirit (petrol), natural gas and aviation turbine fuel to be brought under GST **from a later date** on the Council’s recommendation. GST Council (Article 279A) Feature Provision **Chairperson** Union Finance Minister **Vice Chairperson** Chosen from the Ministers of State Governments **Members** Minister of State (Finance) and all Finance/Taxation Ministers of each State **Quorum** **50%** of total members **Decision** **75% majority** **Weightage** **States 2/3, Centre 1/3** **Role** Apex policy-making body: recommends on model GST laws, rates, place of supply rules and everything related to GST Some commentators say GST made States **surrender financial sovereignty** (visible during Covid when States could not raise indirect tax rates). The handout rejects this: the Centre and States have **“pooled their sovereign rights”** through the Council to streamline taxation. Use both sides in Mains."}, {"ch": 11, "cht": "Goods and Services Tax (GST)", "id": "6-outside-gst-and-what-gst-changed-in-administra", "t": "6 · Outside GST, and what GST changed in administration", "x": "Handout page 11: “Outside GST!” Alcohol for human consumption: power to tax remains with the State. Five petroleum products (crude oil, diesel, petrol, natural gas, ATF): GST Council to decide the date from which GST will be applicable. Tobacco: part of GST but the Central Government has power to levy additional excise duty. Entertainment tax levied by local bodies: power to tax remains with local bodies. **As of March 2022 (handout):** petroleum and petroleum products are **not** subject to GST; they stay under the earlier system. **VAT and other input taxes paid on them cannot be offset against GST.** **12 nautical miles:** the area up to 12 nautical miles is under **Central administration,** but States can collect tax on economic activities carried out there. **Stamp duties** on legal agreements continue to be levied separately by States. The handout’s text says GST excludes “alcohol for human consumption”, and the infographic adds that **tobacco is inside GST** with an extra Central excise power. **Exam-hall rule:** alcohol, five petroleum products and local entertainment tax are outside GST; tobacco is inside."}, {"ch": 11, "cht": "Goods and Services Tax (GST)", "id": "7-benefits-challenges-compensation-rnr-and-anti", "t": "7 · Benefits, challenges, compensation, RNR and anti-profiteering", "x": "Benefits **Simple to administer and efficient.** A wider and growing tax base (registered users) shows higher compliance. In the old system the honest taxpayer paid his own share and the evader’s. **ITC across Centre and State taxes** is called the biggest reform: earlier Central and State taxes were isolated and administered separately, so there was no offsetting. Harmonised administration cuts duplication and red tape; automated GSTN reduces errors and eases filing. **Compliance logic:** a good tax law has **low cost of compliance and high cost of non-compliance.** Earlier, multiple events and authorities made compliance costly, and catching an evader depended on a tax officer, so the penalty was usually a bribe. Under GST the **system** catches the evader and the cost reaches the legal penalty. Handout page 13: Benefits of GST (12 items in two groups). Group one: reduction in cascading of taxes and overall price reduction (decrease in inflation); common national market and benefits to small taxpayers (ease of doing business); self-regulating and non-intrusive electronic tax system (decrease in “black” transactions). Group two: simplified tax regime and reduction in multiplicity of taxes (more informed consumer); consumption-based tax and abolition of CST (poorer States to gain); exports zero-rated and protection of domestic industry through IGST (Make in India). Challenges **Multiple slabs:** **0%, 5%, 12%, 18% and 28%** (handout, 2022); raw agricultural produce is **zero-rated;** luxury goods and goods with negative externalities attract a **cess** above 28%. This is the most important challenge. Filings fell drastically (e.g. **GSTR-3B**) but are still more than the “zero” that businesses practically filed earlier. **Lobbying and politicisation:** producers (especially food processing) seek zero rating; the Centre, with its majority in the Council, is accused of cutting rates with an eye on elections. **One flat rate** may be ideal, but it would be **regressive.** The multiple rates add a **progressive** element: 0 or 5% for necessities, 18% and 28% plus cess for luxury and demerit goods. A reform of slabs is still desirable. Compensation to States States demanded compensation before pooling their rights. Each State’s **pre-2017 indirect tax revenue** was taken and an **average nominal growth of 14% a year for five years** (till **2022**) was assumed. If actual revenue under GST falls short of this path, the **Centre compensates the shortfall.** The handout stresses: only for a shortfall **on account of GST implementation.** Not for the State’s own failure or a pandemic. The **GST compensation cess** on luxury and demerit goods funds this. It was meant to end in 2022; the handout says it is not yet going away “thanks to Covid”. Revenue Neutral Rate (RNR) **RNR** is the average GST rate at which the government receives **the same revenue** despite the change in tax law, input credits and exemptions. Pre-GST incidence in most States was about **30%** (12% excise, 14% VAT and others). Example: at 30% effective rate, ₹10 of tax means only **₹33** of the ₹100 of output was taxed (one-third of GDP). If GST taxes **double** the value (two-thirds of GDP), a **15%** rate still gives ₹10. That 15% is the RNR. Anti-profiteering With a lower RNR, goods should be cheaper. But the seller may keep the **tax reduction as extra profit** instead of passing it on. That is **profiteering,** and GST law makes it **illegal.** Institutions: **National Anti-Profiteering Authority,** a **Standing Committee** and **State-level Screening Committees** (all “already set up” per the handout)."}, {"ch": 11, "cht": "Goods and Services Tax (GST)", "id": "8-features-of-the-act-registration-composition-e", "t": "8 · Features of the Act: registration, composition, e-way bill and GSTN", "x": "Main features Feature Provision (handout) **Jurisdiction** Concurrent: Centre levies **CGST,** States levy **SGST;** Centre levies **IGST** on inter-State supplies and imports **Mode** All transactions and processes **electronic:** non-intrusive administration **Registration** **PAN-based;** only if turnover is **above ₹20 lakh** (**₹10 lakh** for special category States except J&K); **voluntary registration** allowed **Deemed registration** In **three working days** **Input Tax Credit** On taxes paid on all procurements, except a few specified items **E-way bill** For all inter-State movement of goods from **01.04.2018;** by **16.06.2018** all States and UTs had introduced it for intra-State movement Composition levy An **alternative, optional** levy for small taxpayers to bring simplicity and cut compliance cost: tax at a **prescribed percentage of turnover** every quarter instead of the normal rate. **Not available** to inter-State suppliers, service providers (**except restaurant service**) and specified manufacturers. **Quarterly return in Form GSTR-4** on the GSTN portal by the **18th of the month** after the quarter (July-September 2017 return due **18 October 2017**). **Composition threshold conflict:** the “Main Features” list says **₹100 lakh;** the composition-levy paragraph says turnover up to **₹75 lakh (₹50 lakh in a few States).** The handout does not reconcile them. **Exam-hall rule:** if the options carry both, pick the one matching the wording (₹75 lakh with the composition levy paragraph); if only one is present, use it. Goods and Services Tax Network (GSTN) Incorporated in **March 2013** as a **Section 25** private limited company with paid-up capital of **₹10 crore.** **Equity holders:** earlier Centre, States **and private sector;** **now completely government owned.** A **common pass-through portal** for taxpayers to submit registration applications, file returns and pay tax. **Infosys** is the Managed Service Provider (MSP); **73 GST Suvidha Providers (GSPs)** appointed."}, {"ch": 12, "cht": "Government Budget and Fiscal Policy", "id": "exam-lens-priority-and-pyqs", "t": "Exam lens: priority and PYQs", "x": "**No teacher ink.** I checked all 29 slides: they are typed text, tables and charts with no handwriting. The handout has none either. **No Prelims or Mains PYQ is quoted** in the slides or the handout: none quoted in the material. Priority below is the handout’s own emphasis: its “Crucial Trap” and “Ultimate Prelims Trap” boxes, its explicit tables, and its remark that the debt-dynamics proof “will not be asked in the exam”. What the handout stresses Signal in the handout Where Why it matters **“The Ultimate Prelims Trap”:** PMFBY is a **Central Sector** scheme although the States pay 50% of the premium subsidy Section 7 Explicit trap **“Crucial Trap”:** External **Public** Debt versus External Debt of the **Nation** Section 6 Explicit trap **Asset-liability test** decides revenue versus capital; grants to States are Revenue Expenditure Section 3 Classification rule **BD → 0 after WMA (1997);** **FD = TE − NDR = borrowing;** PD = FD − interest; RD = RE − RR; ERD Sections 4-5 Definitions and formulas **FRBM 2003:** FD 3%, eliminate RD, three statements; amendments **2004, 2012, 2015, 2018** Section 5 Dates **N.K. Singh:** debt anchor **60%** (Centre 40, States 20); five escape clauses; counter-cyclical policy Section 5 Committee **IR < GR;** five principles of debt management; Δd ≈ (i − g)·d + p Section 6 Concept (proof not examined) **Art. 280 and 275;** **14th FC 32% → 42%,** **15th 41%;** horizontal criteria table; **Art. 282** Section 7 Numbers and weights **CSS reform:** 147 → 59 (Chaturvedi) → **30** (Sub-Group of CMs); 6 **core of the core;** **25% flexi-fund;** portability Section 7 Numbers **Direct versus indirect (impact and incidence);** progressive, proportional, regressive; ad valorem versus specific; **MAT 2005** Section 9 Classification **RNR;** **Laffer curve;** **elasticity;** **buoyancy (0.72 → 1.22)** Section 11 Concepts and numbers **Prelims hooks:** Art. 112, 113, 265, 280, 275, 282, 279A; revenue versus capital classification of any item; definitions and relationships of RD, FD, PD, ERD; BD and monetised deficit; WMA (Normal, Special); FRBM dates and escape clauses; public debt versus other liabilities versus external debt; Finance Commission criteria; CS versus CSS; PMFBY trap; types of tax (progressive, direct, ad valorem, specific); MAT; RNR; elasticity versus buoyancy. **Mains hooks:** why the budget is the annual renewal of the social contract; why deficits and debt are not bad by themselves but need rules; why FRBM lost credibility and what N.K. Singh fixed; counter-cyclical policy; intergenerational equity (oil bonds); fiscal federalism (devolution versus schemes); the narrow income-tax base and the complexity-evasion link; Laffer curve and the 2019 corporate tax cut; buoyancy as the test of GST. **Closing idea:** a budget is accounting for the future, and every rule in this chapter exists because governments cannot be trusted to restrain themselves."}, {"ch": 12, "cht": "Government Budget and Fiscal Policy", "id": "1-why-the-state-exists-and-why-it-must-present-a", "t": "1 · Why the State exists, and why it must present a budget", "x": "**The State** is an artificial entity created by the people to provide goods the market cannot (defence, legal systems, clean air). Its **authority** is the right to collect taxes; its **responsibility** is to spend for the people. **Accounting** records the past; **budgeting is accounting for the future.** A government cannot be “shocked” or “unprepared”, so it must account and budget. **Article 112 (Annual Financial Statement, AFS):** the President causes a statement of **estimated** receipts and expenditure to be laid before both Houses every financial year. It must show separately the expenditure **charged on the Consolidated Fund** and other expenditure, and **distinguish revenue-account expenditure from other expenditure.** **Doctrine of Public Trust:** the government exists only as long as it has legitimacy. Two building blocks of trust: **transparency** (Art. 112) and **permission** (Art. 113). **Article 113(2):** the Lok Sabha may assent, refuse, or assent subject to a **reduction** of any demand for grants. This is “no taxation without representation”, which is why only the directly elected House votes on the budget. The budget “is not just a spreadsheet; it is the annual renewal of the social contract and the ultimate document of public trust.”"}, {"ch": 12, "cht": "Government Budget and Fiscal Policy", "id": "2-budget-functions-and-objectives", "t": "2 · Budget functions and objectives", "x": "The **Budget Division (Department of Economic Affairs, Ministry of Finance)** prepares the documents. The slides and handout agree on three functions: Three functions Function Objective Meaning **Taxation** (distribution) **Equity** Collect more from those who can give more; the budget is the tool of redistribution **Expenditure** (allocation) **Efficiency** Provide public goods (non-rivalrous consumption); prioritise defence, infrastructure and health over populist freebies **Stabilisation** (macro steering) Balance Maximising tax discourages growth; maximising spending causes inflation. Aim: desirable inflation, growth, lower unemployment, balanced regional development, exports, technology The slides add: “these objectives themselves are not as important as the ways to achieve them. Budget is an exercise in which every government presents its vision and strategy.” Total Receipts (TR) include even the money **borrowed** that year. **TR = RR + CR,** where CR is debt and non-debt capital receipts."}, {"ch": 12, "cht": "Government Budget and Fiscal Policy", "id": "3-accounting-in-the-budget-revenue-and-capital-a", "t": "3 · Accounting in the budget: revenue and capital accounts", "x": "**Slides:** Revenue Account Budget and Capital Account Budget. **Plan and Non-Plan budget abolished since 2017** after the **Rangarajan committee (2012)** (slide only). **Railway budget merged** with the general budget. Date of presentation **preponed to 1 February.** The Constitution only says to distinguish revenue expenditure from “other”. Over time “other” became the **Capital Account,** and receipts are classified the same way. **Why separate revenue?** To test whether the government is **viable day to day:** do its rightful receipts cover its core running costs? **The problem:** “core” is subjective (defence yes; free grain for 75% or 30% of people debatable; running an airline or steel plant?). The Supreme Court is quoted: the capital-revenue distinction is **“describable but not strictly definable.”** Define **Capital** strictly; whatever does not fit is Revenue. If a transaction **changes the government’s assets or liabilities,** it is **Capital Account.** If it leaves them untouched, it is **Revenue Account.** The handout compares this with the BoP, where the capital account was defined and the rest became current. Ledger effects Entry Assets Liabilities **Capital Expenditure** ↑ ↓ (or no rise) **Capital Receipts** ↓ ↑ The four entries Entry Meaning Examples (handout) **Revenue Receipts (RR)** “Rightful” receipts, **non-redeemable;** no liability, no asset sold **Tax:** Income tax, corporate tax, GST, customs. **Non-tax:** fines, fees, **PSU dividends,** **interest received on loans** previously given, **grants from foreign nations** **Revenue Expenditure (RE)** **Maintenance** expenses; creates no asset and reduces no liability Salaries, pensions, office expenses, **subsidies,** **interest payments** **Capital Receipts (CR)** Money that **creates a liability or reduces an asset** **Debt-creating:** G-Secs, T-Bills, sovereign bonds, foreign loans. **Non-debt:** **disinvestment** (e.g. Air India, LIC), **recovery of loans** advanced to States **Capital Expenditure (CE)** Creates an asset or reduces a liability **Physical:** highways, ports, hospitals, fighter jets. **Financial:** loans to States or foreign nations, equity into a PSU. **Liability-reducing:** repayment of **principal** **Interest is Revenue Expenditure; repaying principal is Capital Expenditure.** **The Defence rule:** routine defence maintenance (salaries, rations, ammunition) is Revenue Expenditure; purchase of fighter jets and carriers is Capital. **Any transfer by the Centre to a State (except a loan) is Revenue Expenditure,** even if the State builds a highway with it, because no asset is created for the Centre. This leads to the **Effective Revenue Deficit** (section 5). Slide 13: “Types of deficits.” On the basis of financing: Budget Deficit and Monetized Deficit. On the basis of the type of transactions: Fiscal Deficit (Gross and Net), Primary Deficit (Gross and Net), Revenue Deficit and Effective Revenue Deficit."}, {"ch": 12, "cht": "Government Budget and Fiscal Policy", "id": "4-deficit-versus-debt-budget-deficit-monetisatio", "t": "4 · Deficit versus debt, budget deficit, monetisation and WMA", "x": "**Deficit** is a **flow:** excess of expenses over receipts in a year. **Debt** is a **stock:** the accumulation of all unpaid past deficits. **Budget Deficit (BD) = Total Expenditure − Total Receipts.** TE is the government’s **intentions;** TR its **capabilities.** A habitual BD admits it cannot keep its promises: the budget becomes “political theatricality” and public trust is shattered. **CADP / AIBP paradox:** the **Command Area Development Programme (1974)** announced canals the budget could not fund, so in **1996** the **Accelerated Irrigation Benefit Programme (AIBP)** was launched to complete the old scheme. **Monetised Deficit:** the part of BD financed directly by **RBI printing money** against government bonds. Why monetisation is catastrophic Consequence Explanation **Loss of central bank independence** RBI becomes the government’s printing press and cannot control money supply **Destruction of currency integrity** RBI’s balance sheet fills with bonds of a heavily indebted government; trust in the note collapses; run-away inflation **Inflation** Excess money. **Excess-money inflation is controllable; inflation from permanent loss of trust is structural** WMA (1997): ending the deficit habit In **1997** RBI and the government entered agreements that effectively **abolished BD and monetisation;** the most important was the **Ways and Means Advances (WMA) Agreement.** The government **promised not to present a BD.** RBI in return helps with **temporary liquidity mismatch** (expenses are daily, receipts periodic). Two loans, to the Centre and States: WMA Type Feature **Normal WMA** Short-term, **unsecured overdraft** based on the government’s minimum balance **Special WMA** Beyond the Normal limit; needs **collateral** (G-Secs or T-Bills) RBI and governments (Centre and States) meet **before each budget** to decide the amount and manner of WMA. These loans are strictly **short term.** Market discipline fails After WMA the logic was that the market would punish indiscipline by refusing to lend or charging high rates. **It failed:** the government that borrows is not the one that repays. Milton Friedman’s image: spending is like alcohol, the good effects come immediately and the hangover (inflation) later; discipline is withdrawal. **Inter-generational inequity:** the present generation enjoys the benefit, the **children repay,** and the future loses the ability to borrow in need. **Example: Oil Bonds (2005-2012):** with crude prices high, the government issued bonds to oil marketing companies instead of raising petrol prices; today’s taxpayers pay the interest and were told lower oil prices could not be passed on because of the old debt. **Intra-generational inequity:** heavy borrowing causes **crowding out** (less money for the private sector, higher interest rates for everyone), and the resulting **inflation hurts the poor** (Engel’s law, Chapter 6). **Debt is not bad by itself:** government spending has a **multiplier** (AD = C + G + I + X − M; a rise in G raises C and then I, so AD rises by more). But borrowing must stay within sustainable limits or the result is **recession with very high inflation.**"}, {"ch": 12, "cht": "Government Budget and Fiscal Policy", "id": "5-the-frbm-act-and-the-family-of-deficits", "t": "5 · The FRBM Act and the family of deficits", "x": "FRBM Act, 2003 Parliament legally bound its own hands. Original requirements: **(1) keep Fiscal Deficit within 3% of GDP, within 5 years; (2) eliminate Revenue Deficit, within 5 years; (3) present three statements** with the budget: > **Macro-Economic Framework Statement:** growth prospects, GDP estimates, external sector balance. > **Medium-Term Fiscal Policy (MTFP) Statement:** **three-year rolling targets** for Fiscal Deficit, Revenue Deficit and Debt. > **Fiscal Policy Strategy Statement:** strategic priorities, taxation and expenditure policy, justification for major deviations. Together these are the **“fiscal consolidation roadmap”.** The deadlines were missed, the Act was amended repeatedly, and its credibility fell. The deficits Definitions Deficit Formula or meaning Handout point **Fiscal Deficit (FD)** **TE − Non-Debt Receipts (NDR)** = Debt CR = **borrowing in the year** Derivation: since BD = 0 after WMA, TR = TE, so RR + Debt CR + Non-Debt CR = TE, hence Debt CR = TE − (RR + NDCR) **Gross FD (GFD)** TE − NDR: actual borrowing **Net FD (NFD)** GFD less the government’s **lending** to States and PSUs Shows how much the government borrows for **its own use** **Primary Deficit (PD)** **FD − interest payments** Interest is the largest, non-discretionary item (all past debt); removing it shows the current government’s ow
