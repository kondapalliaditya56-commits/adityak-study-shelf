n shortfall. Gross and Net versions exist **Revenue Deficit (RD)** **RE − RR** Government is borrowing just to run itself: “the hallmark of an unsustainable State”; FRBM targeted its elimination **Effective Revenue Deficit (ERD)** RD − grants for creation of capital assets (A) Transfers to States are RE of the Centre but may build assets (CSS: village roads, hospitals, irrigation, power). Add A to CE for **Effective Capital Expenditure;** deduct A from RE for **Effective RE** The glide path and the amendments FRBM glide path (handout table) Year FRBM FD target Actual FD Reason 2003-04 Baseline 4.5% Pre-FRBM baseline 2004-05 ~4.2% 4.0% Strong tax buoyancy 2005-06 ~3.9% 4.1% Slight slip 2006-07 ~3.6% 3.5% GDP growth above 9% 2007-08 3.0% **2.5%** Overachieved; corporate tax collections 2008-09 2.5% (budgeted) **6.0%** Global Financial Crisis, 6th Pay Commission, ₹71,000 crore farm loan waiver, oil bonds 2009-10 3.0% **6.5%** Stimulus: excise cuts, high expenditure Amendments Year Change **2004** Sunset date for targets pushed from **2008 to 2009** **2012** **ERD introduced;** deadline pushed to **2015** **2015** Deadlines pushed again to **2018** **2018** Act **overhauled** on N.K. Singh Committee lines. **RD and ERD targets scrapped;** FD target pushed to **3% by 2021** The glide-path table lists a **2008-09 FRBM target of “2.5% (budgeted)”** next to a 2007-08 target of 3.0%, and the amendment list says targets were suspended in 2009. The handout does not explain the 2.5% figure. **Exam-hall rule:** remember the story (3% target, 2.5% in 2007-08, 6.0% and 6.5% after the crisis), not the intermediate targets. N.K. Singh Committee (2016) The original escape clause (“extraordinary circumstances”) was vague; the government suspended the Act in 2009. The Committee recommended: **Debt as the primary anchor,** deficit as the operational target. A ceiling for **General Government Debt at 60% of GDP (Centre 40%, States 20%).** **Objective escape clauses:** (a) national security or act of war; (b) national calamity; (c) collapse of agriculture severely affecting farm output and incomes; (d) structural reforms with unanticipated fiscal implications; (e) a quarterly **fall in real output growth of at least three percentage points below its average of the previous four quarters.** **Counter-cyclical fiscal policy:** save in booms to have room to borrow and spend in recessions. Pro-cyclical reality versus counter-cyclical policy Parameter High growth phase Low growth phase **Ability to borrow and resources (taxes)** High Low **Need to spend** Low (economy doing well) High (e.g. high unemployment) **Actual spending (pro-cyclical reality)** High, because ability is high High but relatively less, through unsustainable borrowing; expenditure is rigid downwards Counter-cyclical policy is contractionary in good times and expansionary in bad times; pro-cyclical policy reinforces the cycle. “Indian Kings used to build palaces during famines and droughts to provide employment.” Slide 14: deficit trends (% of GDP) for Fiscal, Revenue, Effective Revenue and Primary Deficit, with the sources of financing the deficit (market borrowings, securities against small savings, State Provident Fund, draw-down of cash balance and others)."}, {"ch": 12, "cht": "Government Budget and Fiscal Policy", "id": "6-public-debt-other-liabilities-and-debt-sustain", "t": "6 · Public debt, other liabilities and debt sustainability", "x": "Total liabilities of the Government of India Part Where it sits What it is **Public Debt** Consolidated Fund of India Borrowed from the market to finance the Fiscal Deficit via **G-Secs and T-Bills;** a direct contractual obligation. **Sovereign debt** is the international term for this. Slides: **Internal Debt** (owed to residents) and **External Public Debt** (owed to non-residents: FIIs, foreign governments) **Other Liabilities** Public Account of India Money held in the government’s custody as banker or trustee, with interest and principal owed: **NSSF, Provident Funds, Pension Funds (NPS), Judicial Deposits.** Slides name the Public Provident Fund and NPS **Total Liabilities = Public Debt + Other Liabilities.** **Internal Public Debt:** government borrowing within the country (banks, RBI, citizens). **External Public Debt:** the government’s borrowing from foreign entities (e.g. the World Bank). **External Debt of the Nation:** much larger; **External Public Debt plus private-sector borrowing abroad** (e.g. **ECBs by corporates, NRI deposits**). “Do not confuse the debt of the Sovereign with the debt of the Nation.” (Slides: ECBs are one large component.) Who manages the debt: RBI, PDMA and PDMC RBI is the government’s **debt manager** and also the **monetary authority.** The conflict: as monetary authority it fights inflation (raises the cost of money); as debt manager it wants the **cheapest loans.** The government has several times proposed an independent **Public Debt Management Agency (PDMA).** At present an interim **Public Debt Management Cell (PDMC)** exists within the Ministry of Finance for internal debt; the transition is incomplete and RBI still plays a major role. Five principles of debt management **Minimise the cost of borrowing.** **Prefer domestic over external sources:** owed in rupees; avoids geopolitical pressure. **External debt in domestic currency** (FII purchase of rupee G-Secs, **Masala Bonds**). Dollar debt plus rupee depreciation can explode the burden (Sri Lanka, Latin America). **Elongate maturity** (10, 20 or 40 years), because short-term debt such as 91-day T-Bills creates **rollover risk.** **IR < GR:** the interest rate must stay below the growth rate of the economy. Low cost; longer maturity; financed locally; external debt in domestic currency; ability to pay (relationship with growth: the **interest rate-growth rate differential**). N.K. Singh: **Debt:GDP 60% (40% Centre, 20% States).** Why IR < GR: the debt dynamics Let **d** = debt/GDP, **i** = nominal interest rate, **g** = nominal GDP growth, **p** = primary deficit as % of GDP. Starting from FD = PD + interest and interest = i × last year’s debt, the handout derives: **Δd ≈ (i − g) × d(t−1) + p.** Two pillars: the **policy pillar (p)** and the **snowball effect (i − g)·d.** Two scenarios Scenario Example Result **A: i g** (debt trap) g = 4%, i = 7%, so (i − g) = +3% Even with **zero primary deficit** the ratio rises; only a **primary surplus** stops it, which is “political suicide” The handout says the full mathematical proof (Economic Survey, chapter 2) “is never going to be asked in an exam”. Keep the final relation and the two scenarios. **Slide 15** adds the definition of **External debt of a country:** the external debt of the government plus citizens towards the rest of the world; ECBs are a large component."}, {"ch": 12, "cht": "Government Budget and Fiscal Policy", "id": "7-expenditure-and-fiscal-federalism", "t": "7 · Expenditure and fiscal federalism", "x": "**Unitary bias:** the Centre has more and richer tax powers and fewer direct responsibilities than States. Corporate taxes are recorded where a firm is headquartered but earned across the country, so “it is **India’s** wealth”. Rich States can spend on infrastructure and tax breaks; poor States (Meghalaya, Bihar) cannot even pay salaries without the Centre as equaliser. Two channels: **(a) Finance Commission devolution and grants,** **(b) scheme-based transfers.** Finance Commission (Articles 280 and 275) **Art. 280:** the President constitutes a Finance Commission **every five years;** it is a neutral umpire dividing the net proceeds of taxes: **vertical devolution** (Centre versus all States) and **horizontal devolution** (among States). **Art. 275 (safety net):** statutory **grants-in-aid** from the Consolidated Fund of India for structurally weak States with a revenue deficit; **legal, unconditional rights.** **Art. 282:** the Centre (or States) may make grants for any “public purpose”, even outside legislative competence. This is the route of discretionary scheme transfers. **Vertical:** the **14th FC (Y.V. Reddy, 2015-20)** raised the States’ share of central taxes from **32% to 42%.** The **15th FC (N.K. Singh, 2021-26)** recommended **41%;** the 1% fall is because J&K became a Union territory (adding J&K and Ladakh, the share slightly increased). The **16th FC** has been set up. Horizontal devolution: weights Criterion 14th FC (2015-20) 15th FC (2021-26) Rationale **Income distance** 50.0% 45.0% Core equity metric: per-capita income against the richest State; poorer States get more **Population (1971)** 17.5% 0.0% Dropped; protected States that controlled population **Population (2011)** 10.0% 15.0% Absolute administrative need; angered Southern States **Demographic performance** 0.0% **12.5%** New; rewards lower Total Fertility Rates (to pacify Southern States) **Area** 15.0% 15.0% Larger States cost more to administer **Forest cover / ecology** 7.5% 10.0% Rewards preserving forests **Tax and fiscal efforts** 0.0% **2.5%** New; rewards tax-collection efficiency **Total** 100% 100% The handout says India’s TFR “has now reached 2.0 (**NFHS-2**), which is below the replacement level of 2.1.” NFHS-2 is an old survey round, so this is probably a slip for a recent round. **Exam-hall rule:** use only the idea (TFR below replacement level 2.1); check the survey name in your notebook before quoting it. **Demographic argument:** the Southern States did not use coercive laws; they went through an **earlier demographic transition** driven by industrialisation, female literacy and maternal healthcare. As Northern States urbanise, their TFR is falling too. Central Sector Schemes versus Centrally Sponsored Schemes CS versus CSS Central Sector (CS) Centrally Sponsored (CSS) **Subjects** Union List or direct central intervention State or Concurrent List (health, education, agriculture) **Execution** Entirely by Central machinery By the State government **Funding** Typically **100% Centre** (PM-KISAN, BharatNet, defence procurement) Centre gives a **grant-in-aid** to the State; State adds its **matching share (usually 40%)** **Friction** Low Primary source of friction in federalism: ties up State treasury funds **Pradhan Mantri Fasal Bima Yojana is officially a Central Sector Scheme** (Statement 4B of the Union Budget) even though the premium subsidy is shared **50:50 by Centre and State** after the farmer pays 1-5% of the premium. Reason: the Centre pays its share **directly to the insurance companies,** bypassing the **State Treasury (State Consolidated Fund).** So “CS = always 100% Centre-funded” is **false.** **Slide 11** lists the examples: Central Sector: **MIS and Price Support, PM-KISAN, Crop Insurance Scheme, Interest Subvention Scheme, NBC, BARC, Ayushman Bharat, FAME India, Khelo India** and more. Centrally Sponsored Schemes are shown as a table of core-of-the-core and core schemes. From command and control to cooperative federalism **Planning Commission era:** the Centre used Art. 282 to make State-subject schemes with **tied grants.** A State with its own working scheme (the handout names Tamil Nadu’s Mid-day Meal) had to drop it, adopt the Centre’s and obey its conditions. Pre-election schemes overlapped (Sabla and Indira Gandhi Matritva Sahyog Yojana). **2011:** CSS had grown to **147 schemes.** The **B.K. Chaturvedi Committee** recommended pruning to **59.** **2014 shift:** (1) the **14th FC** raised devolution from 32% to 42%, leaving less money for conditional CSS; (2) market orientation made top-down planning obsolete; (3) regional parties demanded cooperative federalism. The **Planning Commission was abolished in 2014 and replaced by NITI Aayog.** NITI Aayog’s first Governing Council set up a **Sub-Group of Chief Ministers** (headed by Shivraj Singh Chouhan, then CM of Madhya Pradesh). It **capped CSS at 30** in three buckets: The three buckets Bucket Features Examples **Core of the Core (6)** Social protection umbrellas for the most vulnerable; **first charge** on the budget (funding cannot be cut) MGNREGA, NSAP, umbrella schemes for SCs, STs and Minorities **Core (~22-24)** Shared **usually 60:40.** **25% Flexi-Fund:** States may use 25% of the allocation to tweak components Jal Jeevan Mission, PM Awas Yojana, National Health Mission **Optional** States may adopt, ignore or replace. **Portability clause:** an unused lump sum can be moved into a Core scheme Border Area Development Programme **Outcome (handout):** the Optional category “withered away”: States did not tie up their own funds for optional schemes and used portability to boost Core schemes. Major expenses of the Centre **A. Centre’s Expenditure:** (a) Establishment expenditure; (b) Central Sector Schemes; (c) other expenses such as **interest payment.** **B. Central Transfers:** (a) **Finance Commission grants** (revenue-filling or sector-specific); (b) **CSS;** (c) grants or loans to States. **Composition of transfers (handout chart):** a large share is Finance Commission transfers (devolution under Art. 280 and grants under Art. 275); schemes and other transfers under Art. 282 are the rest. Devolution is **untied** and rising: “this is **fiscal federalism**.”"}, {"ch": 12, "cht": "Government Budget and Fiscal Policy", "id": "8-receipts-and-the-budget-at-a-glance-2026-27", "t": "8 · Receipts and the Budget at a Glance (2026-27)", "x": "Handout page 39: “Budget at a Glance” (₹ crore), Actuals 2024-25, BE 2025-26, RE 2025-26 and BE 2026-27. For 2026-27 BE: revenue receipts 35,33,150; capital receipts 18,14,165 (recovery of loans 38,397; other receipts 80,000; borrowings and other liabilities 16,95,768); total expenditure 53,47,315; interest payments 14,03,972; effective capital expenditure 17,14,523; revenue deficit 5,92,344 (1.5% of GDP); effective revenue deficit 99,642 (0.3%); fiscal deficit 16,95,768 (4.3%); primary deficit 2,91,796 (0.7%). Footnote: GDP for 2026-27 is estimated at ₹393,00,393 crore. Budget 2026-27 BE: how the identities work Item Figure (₹ crore) % of GDP Check **Fiscal Deficit** 16,95,768 **4.3%** = Borrowings and other liabilities = TE − (RR + recovery of loans + other receipts) **Revenue Deficit** 5,92,344 **1.5%** = Revenue expenditure 41,25,494 − Revenue receipts 35,33,150 **Effective Revenue Deficit** 99,642 **0.3%** = RD − grants for capital assets 4,92,702 **Primary Deficit** 2,91,796 **0.7%** = FD − interest payments 14,03,972 Handout page 37: trend in tax receipts (% of GDP). Gross tax revenue stays about 10-11.5% of GDP (11.2% in 2026-27 BE); direct tax rises from 5.9% (2017-18) to 6.9% (2026-27 BE) while indirect tax falls from 5.4% to 4.3%. **Tax:GDP is stable** (the handout says it was the same 20 years ago). The key change is the **rising share of direct taxes.** Net receipts have risen, but as a share of GDP they are almost the same. **Receipts pie (handout):** the share of **Income tax on individuals is greater than any other tax, including corporation tax.** “Do not jump to conclusions so quickly” (see section 9). **Slide 12 (Budget Profile)** draws the receipts and expenditure of the Centre as one picture (budget size ₹39.45 lakh crore in the slide; gross tax revenue, net tax receipts, non-debt capital receipts, debt receipts on one side; scheme expenditure, transfers and establishment, interest payment on the other)."}, {"ch": 12, "cht": "Government Budget and Fiscal Policy", "id": "9-taxation-law-classification-and-the-direct-tax", "t": "9 · Taxation: law, classification and the direct tax picture", "x": "Taxation is the financial execution of the **social contract** for goods that are **non-rivalrous and non-excludable.** It is “forceful extraction”, so **Article 265:** **“No tax shall be levied or collected except by authority of law.”** **Structure of a tax law:** (1) **taxable event;** (2) **taxable value** (deductions, exemptions); (3) **rate;** (4) **responsible entity;** (5) **manner of payment and collection** (TDS, advance tax; designated department). Classification of taxes Basis Types Handout examples and notes **Distributive features** (slide 18, handout) **Progressive:** rate rises with taxable amount. **Proportional:** flat rate. **Regressive:** the rate falls as income rises (the poor pay a larger share) Progressive: **income tax** (5% to 30%). Proportional: **corporate tax** (~25% small, 30% larger; flat within each tier). Regressive: **indirect taxes on goods** (same tax on a biscuit packet; the government uses luxury and necessity slabs to make it progressive). Direct tax can turn regressive when the rich evade and the salaried middle class bears the burden **Bearer of burden** **Direct:** **impact** (initial liability) and **incidence** (final burden) on the **same person.** **Indirect:** impact on one, incidence on another Direct: income tax, corporate tax. Indirect: GST on the seller (impact), shifted to the consumer (incidence). The seller must still **deposit** the tax. **Exceptions:** GST **Reverse Charge Mechanism** (buyer deposits); **TDS** (payer deposits) **Method of levying** **Ad valorem:** a percentage of value. **Specific:** based on a physical characteristic regardless of price Ad valorem: 18% GST on a phone, 7% stamp duty, 10% customs. A higher rate for luxuries (28%) does not change its nature. Specific: excise on volume of fuel, carbon tax on coal (e.g. ₹400 per tonne), professional tax (₹2,500 a year). **Compound duty:** both together, e.g. **cigarettes** (ad valorem on MRP plus specific on filter length) Taxes by event (handout and slide 19) Tax Event Levying entity Pays government Bears burden **Income tax** Earning income (IT Act 1961, now **2025 Act**) Centre Earner Earner **Corporate income tax** Profits of a company Centre Company Company **Minimum Alternate Tax (MAT)** If tax paid is less than the threshold (slide: only if CIT is **below 18%** of profits under the Companies Act) Centre Company Company **Professional tax** Being a professional State Professional Professional **Excise duty** Production Centre Producer Buyer **Customs duty** Entry into a country Centre The importer (changer of boundary) Buyer **Entry tax / Octroi** Entry into a State / local body State / Local body The importer Buyer **Service tax** Sale of service Centre Seller Consumer **Central Sales Tax** Inter-State sale of goods Centre, **given entirely to the selling State** Seller Buyer **Sales tax / VAT** Intra-State sale State Seller Buyer **GST** Sale of goods and services Centre + State Seller Buyer Other direct taxes: **Wealth tax (Centre; now abolished),** **Professional tax (States),** **capital gains tax (part of IT).** In the narrative on indirect tax events, the **labels are swapped:** “Intra-State sale” describes a Delhi buyer ordering from a Maharashtra seller (that is **inter-State**, which attracted CST), and “Inter-State sale” describes buyer and seller in the same State (that is **intra-State**, taxed by sales tax or VAT). The handout’s own table has them right. **Exam-hall rule:** CST = inter-State; sales tax/VAT = intra-State. Income tax in the handout The **IT Act, 1961** (replaced by the **2025 Act**) recognises **five heads of income:** Salaries, House Property, Business/Profession, Capital Gains, Other Sources. **Agriculture** is a source of income but the Centre cannot tax it; only States can, and **no State does.** A tax law must: recognise income (borrowing is a liability, not income; only the ₹2,000 profit on a ₹8,000 saree sold for ₹10,000 is income), determine taxable value (flat **30% standard deduction** on rent; earlier **indexation** on real-estate capital gains), apply rates by asset class and holding period, and collect (**TDS**). Exemptions are a **nudge** towards “good” expenses (health and life insurance, housing, capital goods, charity). To stop firms avoiding a fair minimum, **MAT was introduced in 2005** (tax on profits declared under the **Companies Act, 2013**); for individuals the equivalent is the **AMT (Alternate Minimum Tax).** Complexity feeds evasion Law works only if the **cost of compliance is low and the cost of non-compliance is high,** both together (speed-limit example). A **700-page** Act amended yearly to stop evasion has become the **facilitator** of evasion: honest taxpayers need chartered accountants (high compliance cost) and the State cannot track every creative scheme (low non-compliance cost). The rich exploit it (trusts, shell companies, “agricultural” farmhouses). A simpler **Direct Tax Code (DTC)** makes evasion harder. Corporate versus personal tax: busting the myth In **2019** the base corporate rate was cut from about **30% to 22%** (15% for new manufacturing). From **2021 onwards PIT collections surpassed CIT.** The handout argues this is **not inherently anti-poor:** companies do not consume; profits reach individuals as dividends and salaries, which are then taxed as personal income. In most G7 economies **corporate tax is below 10%** of tax revenue; India’s CIT share is about **22-26%.** The narrow tax base Of **140 crore** people only **8-9 crore** file returns; about **7 crore** are zero-tax filers; the effective taxpaying base is **under 2 crore (about 1.5%).** The **top 1% of taxpayers bear nearly 90%** of direct tax, mostly the salaried middle class under **TDS.** The handout calls the new Direct Tax Code “a moral imperative” to widen the net. Slide 22: “Unshackled but undertaxed” (MOSPI, RBI, UN, ministries; National Income Committee 1951). Gross domestic savings 9.5, 14.1, 24.2, 31.4 (% of GDP); Tax/GDP 2.8, 5.1, 6.8, 7.1; Direct tax/total tax revenues 52.8, 17.5, 35.2, 50; Fiscal deficit 0, 2.53, 5.66, 6.8; Population (million) 361, 548, 990, 1,380; Foodgrains 50, 97, 193, 308 million tonnes; Import cover (months) NA, 2.9, 6.5, 17.8; Agriculture/GDP 54.7, 41.2, 24.3, 16.7 for 1948, 1972, 1997 and 2022."}, {"ch": 12, "cht": "Government Budget and Fiscal Policy", "id": "10-from-vat-to-gst-the-recap-in-this-handout", "t": "10 · From VAT to GST: the recap in this handout", "x": "The handout says you should not proceed unless you have read the separate GST handout (Chapter 11). This section repeats the core and adds the later developments. VAT: achieved and not solved What VAT achieved What VAT could not solve Reduced cascading within State taxes; tax effectively on value addition **No ITC across different taxes:** VAT could not be offset against **excise** (Central) or **service tax;** excise could not be offset against VAT, so cascading continued **Self-policing:** the buyer wants an invoice to claim ITC **No ITC across States:** VAT paid in Maharashtra not offset-able in Gujarat; inter-State trade still bore **CST** (non-creditable) Lower effective burden and better compliance **Fragmented rates:** each State had its own rates, exemptions and procedures: **29 VAT laws** **GST** (101st Amendment Act, 2016; effective **1 July 2017**): tax on supply of goods and services other than alcohol for human consumption. Three properties: **one nation-one tax** (subsumes excise, service tax, VAT, CST, entry tax, octroi, luxury tax), **destination-based** (a shirt made in Tamil Nadu and sold in Delhi gives the State component to **Delhi**), and **seamless ITC** (across goods and services, across CGST and SGST and IGST, and across all stages). **Example:** a ₹1,000 intra-State sale at 18% gives **CGST ₹90 to the Centre and SGST ₹90 to the State;** an inter-State sale gives **IGST ₹180 collected by the Centre** (half shared with the destination State later). **GST Council (Art. 279A):** Union FM chair; **Vice-Chairperson a State Finance Minister elected by State members;** members: Union MoS (Finance) and Finance/Taxation Ministers of **all States and UTs;** quorum **50%;** weights **Centre 1/3, States 2/3;** majority **75%**, so the Centre cannot decide alone. Recommendations are **not constitutionally binding,** but in practice both sides implement them. Federalism debate States’ argument Counter-argument (handout) GST **destroyed fiscal autonomy:** earlier a State could raise VAT overnight for drought relief. **Kerala floods (2018)** and **COVID (2020)** are cited: States could not raise indirect taxes unilaterally Old autonomy meant barriers to trade, octroi and check-post harassment, and **29 different VAT rates.** A unified market gave the consumer and honest businessman more. **Ease of Doing Business rank: 130 (2017), 77 (2019), 63 (2020).** Gains for States: higher revenue, Centre borrowing on their behalf in COVID, a national common market (Art. 301-307), end of check-post raj **Two things changed after the GST handout (Chapter 11).** (1) This handout says **GST 2.0 in August-September 2025 rationalised the tax rates** and refers to an “updated GST document” that is **not in the material.** Chapter 11 still lists the old five slabs (0, 5, 12, 18, 28). I have not written the new slabs. **Exam-hall rule:** for current rates use the latest Council notification, not this chapter. (2) This handout puts the pre-GST effective indirect-tax rate at **about 33%** and the RNR examples at 25% and 20%; Chapter 11 says **about 30%** and a 15% example. They are different illustrations of the same idea. Inverted duty structure (GST 1.0) When the **input tax rate is higher than the output rate,** ITC piles up and the firm depends on refunds. The handout’s examples: **textiles** (input 12-18% against 5% on fabric), **pharmaceuticals** (12-18% on APIs and packaging, against 5-12% on medicines), **fertilisers** (5-18% inputs, 5% or exempt output) and **export-oriented units** (0% on exports). FY 2025-26: **₹1.5 lakh crore+** refunds pending (all categories). The simple fix is aligning rates; it was not done because of political sensitivity, revenue loss and lobbying. **GST 2.0 (August-September 2025) addressed it by rationalising rates.** **Final assessment:** a unified market, irreversible formalisation (**1.44 crore businesses** in the formal system), check-posts gone, and, in the handout’s words, “cascading is 70% eliminated, the remaining is only and only because of petroleum.” Gaps: refunds, litigation, rates, petroleum, federalism tensions. For consumers, goods cheaper but **services costlier;** SMEs mixed; large enterprises clear winners."}, {"ch": 12, "cht": "Government Budget and Fiscal Policy", "id": "11-revenue-neutral-rate-and-the-three-pillars-of", "t": "11 · Revenue Neutral Rate and the three pillars of tax analytics", "x": "Revenue Neutral Rate (this handout) The **RNR** is the rate that gives the government **the same revenue** as under the old laws. The handout’s reasoning: pre-GST effective indirect-tax incidence was about **33%** of a good’s value. India’s **Tax:GDP is about 15-17%** (Centre 11-12%, States about 5%); of the Centre’s ~11%, about 6% direct and 5% indirect; States’ VAT about 5%. So indirect taxes were about **10% of GDP.** If 33% × X% of GDP = 10% of GDP, **X ≈ 30%:** only about **30% of GDP was actually being taxed.** If GST widens the base Share of GDP taxed RNR needed to still collect 10% of GDP ~30% (pre-GST) 33% **40%** **25%** (a quarter) **50%** **20%** (a fifth) Because how much more would be taxed was unknown, rates had to be set up front, hence **multiple slabs at the start** (goods placed in the nearest slab to protect revenue). The government set up the **Arvind Subramanian (ex-CEA) committee** to recommend the RNR. 1 · The Laffer Curve An **inverted U:** tax rate (0-100%) on the X-axis and revenue on the Y-axis. At **0%** revenue is zero; at **100%** nobody works, so revenue is again zero; somewhere between lies an **optimal rate (t*).** Beyond it, higher rates encourage evasion and reduce economic activity, so revenue falls. Since t* is unknown, governments experiment. 2 · Tax elasticity (responsiveness to policy) Holding GDP and other factors constant: **Tax Elasticity = % change in tax revenue ÷ % change in tax rates.** If a 10% rate rise raises revenue only 2% (evasion), the tax is highly inelastic. The 2019 corporate tax cut: Laffer curve in action Category Old rate New rate **Existing domestic companies** 30% + surcharge (~35% effective) **22%** + surcharge (~25.17% effective), about 10 percentage points lower **New manufacturing companies (post Oct 2019)** 25% **15%** + surcharge (~17.01%), about 8 percentage points lower **Revenue cost estimate** **₹1.45 lakh crore a year** Corporate tax collections (₹ crore) Year Collection YoY growth Note 2018-19 6,63,572 17.1% Pre-cut baseline 2019-20 5,56,876 −16.1% Cut announced Sept 2019; COVID approaching 2020-21 4,57,719 −17.8% Full COVID year 2021-22 7,12,037 +55.6% Recovery and base effect 2022-23 8,25,834 +15.9% Strong recovery 2023-24 9,11,735 +10.4% Settled growth 2024-25 10,22,000 +12.1% Continued buoyancy **The government’s Laffer argument:** at about 35% India was in the “prohibitive zone”, near or beyond t*; a cut to about 25% would attract FDI, reduce profit shifting to tax havens, encourage reinvestment and bring more companies into the formal system. **Verdict (handout):** revenue fell first (FY20, FY21), then surged (FY22: ₹7.12 lakh crore; FY23: ₹8.25 lakh crore). Lower rates plus a digitised compliance net generated more revenue. The handout itself warns that such analysis is “inherently difficult” because **100 other factors changed** (COVID, tariffs, schemes, slowdown, recovery). It also gives “30%” for the old rate and “~34.9% to ~25.17% inclusive of surcharges”, while the table says “~35%”. **Exam-hall rule:** quote the direction (30 → 22, and 25 → 15), not the effective figures. 3 · Tax buoyancy (responsiveness to growth) Holding tax rates and policy constant: **Tax Buoyancy = % change in tax revenue ÷ % change in nominal GDP.** **Greater than 1** means collections grow faster than GDP without tax hikes; the tax net is capturing new wealth efficiently. Pre-GST versus post-GST buoyancy Period Buoyancy Reading **Pre-GST (2012-13 to 2015-16)** **0.72** (States’ subsumed taxes, Interim Budget 2024 data) For every 1% GDP growth, collections grew only 0.72% **Post-GST (2017-18 to 2022-23)** **1.22** (SGST revenues) GST fundamentally expanded the formal sector, even through COVID **Elasticity:** tax revenue response to a **change in the tax rate** (GDP held constant). **Buoyancy:** tax revenue response to **GDP growth** (rates held constant). Handout verdict: GST was a “monumental success” in buoyancy because E-way bills and automated ITC matching capture growth more efficiently than VAT-era inspector raj."}, {"ch": 12, "cht": "Government Budget and Fiscal Policy", "id": "slide-only-topics", "t": "12 · Slide-only topics (no handout text): growth models, tax evasion and PPP", "x": "These topics appear only on the slides, with no handout paragraph. They are reproduced exactly as the slides state them; nothing is added. Growth and investment models (slides 24-28) **Objectives of the budget: growth.** **Trickle-down approach:** the top grows and benefits are redistributed through government policy; “the bottom is passive beneficiary.” **Inclusive growth** (slide diagram): reduction of poverty, job creation, enhancement of skills, reduction of regional disparities, access to essential services like health and education, special focus on vulnerable groups, industrial development. **Sustainable Development Goals** (slide 25): the 17 goals, from No Poverty to Partnerships for the Goals. **Investment models:** **import substitution;** **Harrod-Domar model** (savings, investment and ICOR); **heavy-industry led growth: the Mahalanobis model:** increasing investments; directing public investment towards industry (predominance of the **public sector in capital goods**); import substitution for self-reliance; an elaborate system of controls and industrial licensing. **Export-led growth;** **Aatmnirbhar Bharat.** **Schumpeter’s three stages:** (1) growth from more factors of production (transition from primary sector to industry: agrarian China to industrial China); (2) growth from higher productivity of factors (investment raises productivity); (3) growth from inventing new ways to raise productivity (research and innovation: “modern America”). **Public-Private Partnership:** the need arises from the thin spread of government resources and the wish to include the private sector in public goods that can be monetised. **The 4 Rs** to decide in any agreement: **Resources, Risks, Responsibilities, Rewards.** Standard contracts: **BOT, EPC, HAM** (hybrid annuity model), **Swiss Challenge** model, **Viability Gap Funding.** Tax planning, avoidance and evasion (slide 23) Three terms Term Slide definition **Tax planning** Legal, legitimate way to reduce taxable income through acceptable expenses and investments **Tax avoidance** “May not be illegal, but certainly illegitimate” **Tax evasion** **Illegal** The slide also lists: **BEPS** (Base Erosion and Profit Shifting); **related-party transactions, the arm’s length principle, advance pricing agreements;** **DTAA** (double taxation avoidance agreements); **GAAR** (General Anti-Avoidance Rules); and **money laundering and round tripping** (referred to the Security classes). Slide 20: destination-based; value added; **collect tax on the entire value, let the depositor declare value added by showing the value of inputs on which tax was paid, refund the difference through ITC.** Slide 21: features of a good tax system: **incentive to comply** (less costly for the compliant) and **disincentive to not comply** (costly for the non-compliant, measured by the **system’s** ability, not the individual tax officer’s, to catch offenders); one channel for reporting, collecting and verifying; “now the system catches an offender, not an individual (at least theoretically!)”."}, {"ch": 13, "cht": "NABARD, NBFCs, Chit Funds and Ponzi Schemes", "id": "exam-lens-priority-and-pyqs", "t": "Exam lens: priority and PYQs", "x": "**Handout only.** No class slides, no teacher ink. **No Prelims or Mains PYQ is quoted:** none quoted in the material. Priority below is the handout’s own emphasis (its numbered facts and question-and-answer boxes). Several figures here come from an older RBI FAQ and are **dated** (see the alerts); Chapter 7 carries the newer NBFC scale-based regulation. What the handout stresses Signal in the handout Where Why it matters **CRAFICARD** (30 March 1979, B. Sivaraman) → **NABARD Act 61 of 1981** → NABARD on **12 July 1982;** now fully owned by the Government of India Section 1 Origin and dates NABARD’s **three function heads:** financial, developmental, supervision Section 2 Classification **SHG Bank Linkage 1992;** **KCC;** **LTIF 2016, ₹20,000 crore;** **PMAY-G** Sections 2-3 Schemes **NABARD = National Implementing Entity** for the Adaptation Fund (**July 2012,** only NIE for India) and NAFCC Section 5 Climate finance **Section 35(6) Banking Regulation Act 1949:** inspection of StCBs, DCCBs, RRBs Section 6 Provision **NBFC versus bank:** no demand deposits, no cheques, no DICGC cover Section 7 Three differences **Systemically important NBFC:** ₹500 crore; registration **Sec. 45-IA RBI Act 1934,** NOF **₹2 crore** since 1999 Section 7 Numbers (dated) NBFC categories: **AFC, IC, IFC, IDF-NBFC, CIC, MFI, Factors, MGC, NOFHC** Section 8 List with numbers **Chit Funds Act 1982;** **Prize Chits and Money Circulation Schemes (Banning) Act 1978;** CIS regulated by **SEBI** Sections 10-11 Regulators **Prelims hooks:** NABARD’s origin and committee; SHG-BLP, KCC, LTIF, RIDF, PMAY-G funding; Adaptation Fund versus Green Climate Fund (founding, HQ); NAFCC; NABARD’s supervisory powers; NBFC versus bank; which NBFCs RBI does not regulate and who does; NBFC categories and their thresholds; deposit rules; chit funds versus deposits; CIS regulator; Ponzi and MLM legality. **Mains hooks:** why a separate rural credit institution was needed; NABARD’s role in microfinance and climate adaptation; why NBFCs are important but regulated differently; why RBI restricts NBFC deposits (depositor protection); the fraud pattern of Ponzi schemes and the multiple-regulator gap. **Closing idea:** rural credit needs an institution with an unfair focus on the village, and depositor money needs a regulator with an unfair suspicion of everyone else."}, {"ch": 13, "cht": "NABARD, NBFCs, Chit Funds and Ponzi Schemes", "id": "1-how-nabard-came-to-be", "t": "1 · How NABARD came to be", "x": "The importance of **institutional credit for the rural economy** was clear early in planning. At the Government’s insistence RBI constituted the **Committee to Review the Arrangements for Institutional Credit for Agriculture and Rural Development (CRAFICARD)** on **30 March 1979,** chaired by **B. Sivaraman,** former member of the Planning Commission. Its **interim report (28 November 1979)** asked for a new organisational device giving “undivided attention, forceful direction and pointed focus” to rural credit: a unique **development financial institution.** **NABARD** was approved by Parliament through **Act 61 of 1981** and came into existence on **12 July 1982,** by **transferring RBI’s agricultural credit functions** and the refinance functions of the **Agricultural Refinance and Development Corporation (ARDC).** After the share capital of the Government and RBI was revised, **NABARD is today fully owned by the Government of India.** “Promote sustainable and equitable agriculture and rural development through participative financial and non-financial interventions, innovations, technology and institutional development for securing prosperity.”"}, {"ch": 13, "cht": "NABARD, NBFCs, Chit Funds and Ponzi Schemes", "id": "2-functions-at-a-glance", "t": "2 · Functions at a glance", "x": "Three heads, touching almost every aspect of the rural economy: **Financial, Developmental, Supervision.** Refinance support and rural infrastructure; **district-level credit plans** and guiding banks to meet targets. **Supervising Cooperative Banks and Regional Rural Banks (RRBs),** helping them adopt sound practices and the **CBS** (core banking) platform. Designing new development schemes and implementing the Government of India’s schemes; **training handicraft artisans** and giving them a marketing platform. The **SHG Bank Linkage Project (1992)** “has blossomed into the **world’s largest microfinance project**”. **Kisan Credit Card** was designed by NABARD. It has **financed one-fifth of India’s total rural infrastructure** and was a **pioneer in watershed development** as a tool for climate proofing."}, {"ch": 13, "cht": "NABARD, NBFCs, Chit Funds and Ponzi Schemes", "id": "3-financial-functions", "t": "3 · Financial functions", "x": "Direct and indirect finance Type What it covers **Direct finance** Loans for **food parks, warehouses, cold storage and cold chain;** credit to **marketing federations;** **Rural Infrastructure Development Fund (RIDF)** and **NABARD Infrastructure Development Assistance;** direct refinance to **cooperative banks;** support to **Producer Organisations** **Indirect finance** Contributions to **Alternative Investment Funds** invested in rural sectors; **Long Term Irrigation Fund;** **PMAY-G** funding Long Term Irrigation Fund (LTIF) Set up in **2016** within NABARD with an initial corpus of **₹20,000 crore** to fund and fast-track **incomplete major and medium irrigation projects.** A Mission was set up in the Ministry of Water Resources, River Development and Ganga Rejuvenation. Aim: bridge the resource gap and finish the projects during **2016-2020.** Priority I: **23 projects by 2016-17;** Priority II: **31 projects by 2017-18;** Priority III: **balance 45 projects by 2019-20.** PMAY-Grameen (PMAY-G) A **pucca house with basic amenities** for all houseless households and those in kutcha or dilapidated houses **by 2022;** implemented by the **Ministry of Rural Development.** About **2.95 crore** houses by 2022; **one crore by March 2019.** For one crore houses over 3 years (2016-17 to 2018-19) the requirement was **₹81,975 crore:** **₹60,000 crore** from budgetary sources and **₹21,975 crore** through **borrowings from NABARD.** In **2017-18** NABARD sanctioned **₹9,000 crore** to NRIDA for the central share. Refinance Refinance types Type Features (handout) **Off-farm refinance** E.g. rural housing, renewable energy, rural MSMEs **Short-term refinance** Linked to production and productivity, marketing, and raising surplus and savings **Long-term refinance (LTF)** Investment credit that creates **assets and capital formation,** induces technological upgradation. **Long and medium term refinance to banks;** loan period **up to a maximum of 15 years.** For agriculture and allied activities (minor irrigation, farm mechanisation, land development, soil conservation, dairy, sheep/goat), artisans, SSI, non-farm sector, handicrafts, handlooms, powerlooms, and voluntary agencies and **self-help groups** Eligible to access refinance: **State Cooperative Agricultural and Rural Development Banks, RRBs, commercial banks, NBFCs** and others. The LTIF, PMAY-G and refinance figures are from **2016-2019** and use targets that have now passed (2020, 2022, March 2019). Treat them as **history of the scheme design,** not as current status. **Exam-hall rule:** a question on “current” status needs the latest budget or ministry data, which is not in this material."}, {"ch": 13, "cht": "NABARD, NBFCs, Chit Funds and Ponzi Schemes", "id": "4-developmental-functions", "t": "4 · Developmental functions", "x": "**More than 50% of rural credit** is disbursed by **cooperative banks and RRBs,** and NABARD regulates and supervises them. Under **Institutional Development (ID)** it supports: **Rural Credit Cooperatives; State Cooperative Banks (StCBs); Central Cooperative Banks (CCBs); Primary Agricultural Credit Societies (PACS); State Cooperative Agriculture and Rural Development Banks (SCARDBs); Primary Cooperative Agriculture and Rural Development Banks (PCARDBs).** **Farm sector:** Farm Sector Development Department (FSDD) and Farm Sector Policy Department (FSPD). **Off-farm sector:** financial inclusion; micro credit innovation; **women Self-Help Groups, Joint Liability Groups and the SHG-Bank Linkage programme;** microfinance to various bodies. **RUDSETI / RUDSETI-type institutions / RSETIs:** specialised institutions giving entrepreneurship and skill training to rural youth and women; NABARD assists those meeting its criteria."}, {"ch": 13, "cht": "NABARD, NBFCs, Chit Funds and Ponzi Schemes", "id": "5-climate-finance-the-funds-nabard-works-with", "t": "5 · Climate finance: the funds NABARD works with", "x": "Four climate funds Fund Set up Key facts (handout) **Adaptation Fund (AF)** Under the **Kyoto Protocol** of the **UNFCCC;** established **2001,** officially launched **2007 at CoP 7, Marrakech** Finances **concrete adaptation projects** for vulnerable communities in developing countries that are Kyoto Parties. Funded by government and private donors **and a 2% share of proceeds of Certified Emission Reductions (CERs)** under the **CDM.** **HQ Washington, USA.** Managed by the **Adaptation Fund Board** (16 members, 16 alternates); **World Bank is interim trustee** **Green Climate Fund (GCF)** Decision at **COP 16, Cancun (December 2010);** operationalised at **COP 17, Durban (2011)** An **operating entity of the financial mechanism of the UNFCCC.** **HQ Songdo, Incheon City, Republic of Korea.** Aims at a **paradigm shift to low-emission, climate-resilient development** by helping developing countries limit emissions and adapt **National Adaptation Fund for Climate Change (NAFCC)** **August 2015** Meets adaptation costs for **vulnerable States and UTs.** Budget provision **₹350 crore** for 2015-16 and 2016-17; estimated need **₹181.5 crore** for 2017-18. Prioritises needs under the **State Action Plan on Climate Change (SAPCC)** and missions under the **National Action Plan on Climate Change (NAPCC)** **NABARD Climate Change Fund** Created from NABARD’s profit in **2016-17** NABARD contributes **annually from its profit.** For climate impacts, adaptation and mitigation, awareness, knowledge sharing and sustainable development. A “unique initiative” by a DFI **National Designated Authority (NDA)** for the Adaptation Fund: the **Ministry of Environment, Forest and Climate Change;** proposals go with the NDA’s endorsement. **NABARD is accredited as National Implementing Entity (NIE)** for the Adaptation Fund in **July 2012** and is **the only NIE for India.** An NIE is a national legal entity nominated by a Party and recognised by the Board as meeting its **fiduciary standards;** it bears **full responsibility** for management, finance, monitoring and reporting. NABARD is also designated **NIE for NAFCC** by the Government of India: it facilitates identification of project ideas from SAPCCs, formulation, appraisal, sanction, disbursement, monitoring and evaluation, and capacity building. Under the GCF heading the handout also notes **“NABARD is accredited as National Implementing Entity.”** The Adaptation Fund line says it was “officially launched in **2007** at **CoP 7** in Marrakech”, and the Green Climate Fund line numbers its COPs (16 in Cancun, 17 in Durban). The year and the COP number for the launch **do not obviously match.** **Exam-hall rule:** remember “established 2001, launched 2007, Marrakech” only if an option uses the same wording; check the COP numbering in your notebook."}, {"ch": 13, "cht": "NABARD, NBFCs, Chit Funds and Ponzi Schemes", "id": "6-supervision-functions", "t": "6 · Supervision functions", "x": "**Section 35(6) of the Banking Regulation Act, 1949** empowers NABARD to inspect **State Cooperative Banks, Central Cooperative Banks (DCCBs) and Regional Rural Banks.** NABARD also inspects, **on a voluntary basis,** state-level cooperative institutions such as **SCARDBs, Apex Weavers Societies and Marketing Federations.** Objectives of supervision # Objective 1 Protect the interest of **present and future depositors** 2 Ensure business conforms to the relevant **Acts, rules, regulations and bye-laws** 3 Ensure observance of rules and guidelines of **NABARD, RBI and the Government** 4 Examine the **financial soundness** of the banks 5 Suggest ways to strengthen institutions so they can **purvey rural credit** more efficiently"}, {"ch": 13, "cht": "NABARD, NBFCs, Chit Funds and Ponzi Schemes", "id": "7-nbfcs-what-they-are-and-how-they-differ-from-b", "t": "7 · NBFCs: what they are and how they differ from banks", "x": "A **Non-Banking Financial Company (NBFC)** is a company registered under the **Companies Act, 1956** engaged in **loans and advances; acquisition of shares, stocks, bonds, debentures, securities; leasing; hire-purchase; insurance business; chit business.** It excludes institutions whose **principal business** is agriculture, industry, trading in goods (other than securities), providing services, or buying, selling or constructing immovable property. A company whose principal business is **receiving deposits** under any scheme, lump sum or instalments, is also an NBFC: the **Residuary Non-Banking Company (RNBC).** NBFC versus bank (the three differences) Bank NBFC **Demand deposits** Can accept **Cannot** accept demand deposits **Payment and settlement system** Part of it; issues cheques drawn on itself **Not part of it;** cannot issue cheques drawn on itself **Deposit insurance (DICGC)** Available **Not available** to NBFC depositors **Systemically important NBFCs:** asset size of **₹500 crore or more** (last audited balance sheet), because their activities bear on the financial stability of the economy. **Registration:** under **Section 45-IA of the RBI Act, 1934,** no NBFC may carry on business without a **Certificate of Registration** and **Net Owned Funds (NOF) of ₹25 lakh (₹2 crore since April 1999).** **Exempt from RBI registration** (to avoid dual regulation), subject to conditions: **Venture Capital Fund, Merchant Banking and Stock-broking companies** (SEBI); **insurance companies** (IRDA); **Nidhi companies** (Ministry of Corporate Affairs; Section 620A Companies Act 1956); **Chit companies** (Chit Funds Act 1982; State Governments); **Housing Finance Companies** (**National Housing Bank**); **Stock Exchanges; Mutual Benefit companies.** **Mortgage Guarantee Companies** are notified as NBFCs (Section 45-I(f)(iii)); **Core Investment Companies** under ₹100 crore, or ₹100 crore and above but not accessing public funds, are exempt. Who regulates what (handout) Entity Regulator Housing Finance Companies National Housing Bank Merchant bankers, VCFs, stock exchanges, stock brokers and sub-brokers SEBI Insurance companies IRDA Chit fund companies State Governments (under the Chit Funds Act 1982) Nidhi companies Ministry of Corporate Affairs Deposit acceptance of banks, co-operative banks and NBFCs RBI This handout classifies systemically important NBFCs at **₹500 crore;** **Chapter 7** (the newer scale-based regulation, 2022) uses layers with the Base Layer at **non-deposit NBFCs below ₹1,000 crore.** They are different regimes. **Exam-hall rule:** pick the figure that matches the wording of the question (older “NBFC-ND-SI” language: ₹500 crore; scale-based layers: ₹1,000 crore base). The handout also quotes the **DICGC cover as ₹1 lakh,** which may be dated; check the current limit."}, {"ch": 13, "cht": "NABARD, NBFCs, Chit Funds and Ponzi Schemes", "id": "8-categories-of-nbfcs", "t": "8 · Categories of NBFCs", "x": "NBFCs are classified by **liabilities** (deposit-accepting and non-deposit-accepting), by **size** (non-deposit taking: **systemically important, NBFC-ND-SI,** and others, **NBFC-ND**), and by **activity.** Types by activity Type Definition (handout) **Asset Finance Company (AFC)** Principal business is **financing physical assets** supporting productive activity, e.g. automobiles, tractors **Investment Company (IC)** Principal business is the **acquisition of securities** **Infrastructure Finance Company (IFC)** At least **75% of total assets in infrastructure loans;** minimum **NOF ₹300 crore;** minimum rating **“A”;** **CRAR 15%** **Infrastructure Debt Fund NBFC (IDF-NBFC)** Facilitates **long-term debt into infrastructure;** raises rupee or dollar bonds of **minimum 5-year maturity;** **only IFCs can sponsor** IDF-NBFCs **Systemically Important Core Investment Company (CIC-ND-SI)** NBFC acquiring shares and securities, meeting conditions **NBFC-Micro Finance Institution (NBFC-MFI)** Non-deposit taking; **not less than 85% of assets** in qualifying assets **NBFC-Factors** Non-deposit taking; principal business **factoring;** financial assets in factoring **at least 50% of total assets** and income from it **not less than 50% of gross income** **Mortgage Guarantee Company (MGC)** **At least 90%** of turnover or gross income from mortgage guarantee; **NOF ₹100 crore** **NBFC-NOFHC (Non-Operative Financial Holding Company)** Wholly owned vehicle through which a promoter group sets up a **new bank,** holding the bank and other financial services companies"}, {"ch": 13, "cht": "NABARD, NBFCs, Chit Funds and Ponzi Schemes", "id": "9-residuary-nbfcs-prudential-norms-interest-and", "t": "9 · Residuary NBFCs, prudential norms, interest and deposits", "x": "**RNBC:** principal business is **receiving deposits** under any scheme, and it is **not** an Investment, Asset Financing or Loan company. It must maintain **investments as per RBI directions,** in addition to liquid assets, and prudential norms apply. **No ceiling** on deposits, but **100% of deposit liability** must be invested in highly liquid, secure instruments: **Central/State government securities, fixed deposits with scheduled commercial banks, CoDs of SCBs/FIs, units of mutual funds.** **Prudential norms:** NBFC (Deposit Accepting or Holding) Prudential Norms **Directions 2007;** Non-SI Non-Deposit NBFCs **Directions 2015;** SI Non-Deposit NBFCs **Directions 2015.** They cover income recognition, asset classification, provisioning, exposure norms, disclosures, capital adequacy, limits on investment in land and building and unquoted shares, and **LTV for gold-loan NBFCs.** Deposit-accepting NBFCs also meet **statutory liquidity** requirements. **Interest rates:** RBI has **deregulated** interest on loans by financial institutions (**except NBFC-MFIs**). The rate depends on the loan agreement but must be **transparent and disclosed** in the application form and sanction letter. Who may accept public deposits Entity Rule **Banks, including co-operative banks** May accept deposits **NBFCs with a deposit-accepting CoR** Only those with a **specific authorisation** and an **investment-grade rating,** to a limit of **1.5 times NOF** **Housing Finance Companies;** companies under the **Companies (Acceptance of Deposits) Rules** Up to a certain limit **Co-operative credit societies** From **members** only, not the general public **Unincorporated bodies** (individuals, partnerships, associations) **Prohibited** from deposit-taking as principal business; prohibited from even accepting deposits if they carry on financial business **Since 1997 RBI has issued no new CoR for deposit acceptance** to NBFCs; as a matter of policy only **banks** should accept public deposits. **Deposit terms (handout):** maximum interest **12.5%;** paid or compounded at rests not shorter than monthly; **minimum 12 months, maximum 60 months;** **no deposits repayable on demand.** Unrated AFCs had to be rated by **31 March 2016** or could not renew or accept deposits. **Why so restrictive:** depositors place money **on trust,** unlike an investor who shares risk and return; **protection of depositors’ interest is supreme.** Banks are the most regulated; **DICGC** pays insurance on deposits up to **₹1 lakh** if a bank fails (handout figure)."}, {"ch": 13, "cht": "NABARD, NBFCs, Chit Funds and Ponzi Schemes", "id": "10-chit-funds", "t": "10 · Chit funds", "x": "**Chit funds / chitty / kuri** are **saving institutions** with no standard form: members make **periodic subscriptions;** each period’s collection goes to one member chosen by **bid, lot, auction or tender;** every member gets a turn before a second round. They are the Indian version of **Rotating Savings and Credit Associations (ROSCAs).** **Chit Funds Act, 1982, Section 2(b):** a “chit” is a transaction where a person agrees with a specified number of persons that each subscribes a sum (or grain) in instalments over a definite period, and **each subscriber in turn** gets the **prize amount** by lot, auction or tender. **It is not a chit** if some, but not all, subscribers get the prize without liability to pay future subscriptions, or if all get it by turns **with** a liability to pay future subscriptions. **Regulation:** the **Chit Funds Act 1982** is a **Central Act administered by State Governments;** the Centre has framed **no rules,** so **registration and regulation are by States** under their own rules. RBI counts them as NBFCs under **Miscellaneous Non-Banking Company (MNBC)** but has laid down **no separate framework.** **Fraud:** cheating by a chit company through fraudulent schemes is an offence under the **Prize Chits and Money Circulation Schemes (Banning) Act, 1978;** State Governments investigate and prosecute. **Name rule:** under **Rule 8(2)(b)(iii) of the Companies (Incorporation) Rules, 2014** a company whose main business is a chit fund cannot be incorporated unless its name indicates it (“Chit Fund”). Chit subscription versus deposit Deposit (RBI Act 1934) Chit **Definition** Acceptance of money **other than** share capital, money from banks and FIs, security deposits, earnest money and advances against goods or services, and **subscriptions to chits.** All other amounts received as loan or in any form are deposits Instalment subscriptions with a rotating prize; **specifically excluded** from “deposit” **RBI position** Regulated Chit funds **prohibited by RBI from accepting deposits from August 2009;** RBI can prosecute a chit fund that accepts public deposits The handout gives the date of the RBI prohibition on chit funds accepting deposits as **“August 2009”** in one place and **“2009”** in another. They agree on the year. Another small point: the section on “regulation” says RBI has **no** framework for chit funds, yet it also says RBI **can prosecute** a chit fund that takes deposits. **Exam-hall rule:** chit funds are regulated by **State Governments;** RBI’s only hook is the deposit ban."}, {"ch": 13, "cht": "NABARD, NBFCs, Chit Funds and Ponzi Schemes", "id": "11-collective-investment-schemes-mlm-and-ponzi-s", "t": "11 · Collective investment schemes, MLM and Ponzi schemes", "x": "Who regulates what Activity Regulator or law **Multi-Level Marketing, direct selling, online selling companies** **Not RBI.** The respective **State Government** **Collective Investment Schemes (CIS)** (money for units: time-share in resorts, profit from sale of wood, developed commercial plots) **SEBI.** Complaints go to SEBI and to the **EOW/Police of the State Government** **Money circulation, MLM / pyramid and Ponzi schemes** Banned under the **Prize Chits and Money Circulation Schemes (Banning) Act, 1978;** acceptance of money is a **cognizable offence;** monitored and dealt with by **State Governments.** RBI’s role: only advising and assisting the Centre in framing rules **Pyramid / MLM:** income comes **not from selling a product** but from enrolling more members who pay hefty fees; a portion goes up the pyramid. **Any break in the chain collapses it,** and the lowest members suffer most. **Ponzi scheme:** collects money on promises of **high returns;** with **no asset creation,** one depositor’s money is paid as another’s return. The scheme becomes unviable, cannot return even the principal, and the perpetrators disappear. The 1978 Act prohibits any person to **promote or conduct** a prize chit or money circulation scheme, **enrol** as a member, or participate by **receiving or remitting money.**"}]</script><script>/* Shared store: reading progress, preferences, optional cross-device sync. */
(function(){
var KEY='nbapp:v1',root=document.documentElement;
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function fresh(){return{v:1,prefs:{fs:1,lh:1.65,w:780,font:'serif',theme:'auto',pt:0},last:null,nb:{},days:{}}}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var S;
try{S=JSON.parse(lsGet(KEY))}catch(e){S=null}
if(!S||!S.v)S=fresh();
S.prefs=Object.assign(fresh().prefs,S.prefs||{});
// one-time import of the older done list and theme
if(!S.migrated){
  try{var od=JSON.parse(lsGet('nb-done')||'[]');od.forEach(function(n){var c=chap('modern-india',n);c.done=1;c.dt=1})}catch(e){}
  var ot=lsGet('nb-theme');if(ot&&!S.prefs.pt){S.prefs.theme=ot;S.prefs.pt=1}
  S.migrated=1;
}
function chap(nb,n){var b=S.nb[nb]||(S.nb[nb]={});return b[n]||(b[n]={read:{},done:0,dt:0,pos:null,t:0})}
var listeners=[],dirty=false,saveT=null,syncT=null;
function save(){
  dirty=true;clearTimeout(saveT);
  saveT=setTimeout(function(){lsSet(KEY,JSON.stringify(S));listeners.forEach(function(f){try{f()}catch(e){}});scheduleSync()},250);
}
function flush(){lsSet(KEY,JSON.stringify(S))}
function merge(a,b){ // a local, b remote; returns merged
  var o=fresh();
  o.prefs=((b.prefs&&b.prefs.pt||0)>(a.prefs&&a.prefs.pt||0))?Object.assign({},a.prefs,b.prefs):Object.assign({},b.prefs,a.prefs);
  o.last=(!a.last||(b.last&&b.last.ts>a.last.ts))?b.last:a.last;
  o.migrated=1;
  var ids={};Object.keys(a.nb||{}).concat(Object.keys(b.nb||{})).forEach(function(k){ids[k]=1});
  Object.keys(ids).forEach(function(id){
    o.nb[id]={};var ca=(a.nb||{})[id]||{},cb=(b.nb||{})[id]||{},ks={};
    Object.keys(ca).concat(Object.keys(cb)).forEach(function(k){ks[k]=1});
    Object.keys(ks).forEach(function(k){
      var x=ca[k],y=cb[k];if(!x||!y){o.nb[id][k]=x||y;return}
      var r=Object.assign({},x.read,y.read),done=(y.dt||0)>(x.dt||0)?y:x,pos=(y.t||0)>(x.t||0)?y.pos:x.pos;
      o.nb[id][k]={read:r,done:done.done,dt:done.dt||0,pos:pos,t:Math.max(x.t||0,y.t||0)};
    });
  });
  var dk={};Object.keys(a.days||{}).concat(Object.keys(b.days||{})).forEach(function(k){dk[k]=1});
  Object.keys(dk).forEach(function(k){o.days[k]=Math.max((a.days||{})[k]||0,(b.days||{})[k]||0)});
  return o;
}
var syncState='off';
function scheduleSync(){clearTimeout(syncT);syncT=setTimeout(function(){sync()},4000)}
var dbp=null;
function getRef(){
  if(dbp)return dbp;
  dbp=(async function(){
    if(!window.claude||!claude.use)return null;
    var db=await claude.use('db'),u=await claude.use('user');
    if(!db||!u||!u.id)return null;
    var id=await u.id();if(!id)return null;
    return db.doc('data/users/'+id+'/nbapp');
  })().catch(function(){return null});
  return dbp;
}
var busy=false;
async function sync(){
  if(busy)return;busy=true;
  try{
    var ref=await getRef();if(!ref){syncState='local';return}
    var snap=await ref.get(),rem=null;
    if(snap.exists){var d=snap.data();try{rem=JSON.parse(d.state)}catch(e){}}
    var m=rem?merge(S,rem):S;
    var changed=JSON.stringify(m)!==JSON.stringify(S);
    S=m;
    if(changed){flush();listeners.forEach(function(f){try{f()}catch(e){}})}
    var out=JSON.stringify(S);
    if(!rem||JSON.stringify(rem)!==out)await ref.set({v:1,updated:Date.now(),state:out});
    syncState='synced';
  }catch(e){syncState='local'}
  finally{busy=false}
}
var API={
  get:function(){return S},
  chap:chap,
  save:save,flush:flush,sync:sync,
  onChange:function(f){listeners.push(f)},
  syncState:function(){return syncState},
  setPref:function(k,v){S.prefs[k]=v;S.prefs.pt=Date.now();applyPrefs();save()},
  reset:function(){S=fresh();S.migrated=1;flush();save()},
  today:today,
  pct:function(nb,n,total){var c=(S.nb[nb]||{})[n];if(!c||!total)return 0;var r=0;Object.keys(c.read||{}).forEach(function(k){if(c.read[k])r++});return Math.min(1,r/total)},
  isDone:function(nb,n,total){var c=(S.nb[nb]||{})[n];if(!c)return false;if(c.dt)return !!c.done;return false}
};
window.NBS=API;
function applyPrefs(){
  var p=S.prefs;
  var th=p.theme;
  if(th==='auto')root.removeAttribute('data-theme');else root.setAttribute('data-theme',th);
  root.style.setProperty('--zoom',p.fs);root.style.setProperty('--lh',p.lh);root.style.setProperty('--pw',p.w+'px');
  root.setAttribute('data-font',p.font);
}
API.applyPrefs=applyPrefs;applyPrefs();
// studied time, counted while the page is visible and touched in the last minute
var lastAct=Date.now();
['scroll','pointerdown','keydown','touchstart'].forEach(function(e){addEventListener(e,function(){lastAct=Date.now()},{passive:true})});
setInterval(function(){
  if(document.hidden||Date.now()-lastAct>60000||!window.__NB)return;
  var t=today();S.days[t]=(S.days[t]||0)+15;save();
},15000);
document.addEventListener('visibilitychange',function(){if(document.hidden){flush();sync()}else{sync()}});
addEventListener('pagehide',flush);
setTimeout(sync,800);
})();
(function(){var b=document.getElementById('themebtn');if(!b)return;var o=['auto','light','sepia','dark'];b.addEventListener('click',function(){var t=NBS.get().prefs.theme,i=(o.indexOf(t)+1)%o.length;NBS.setPref('theme',o[i]);b.textContent='Theme: '+o[i]})})();

(function(){var D=JSON.parse(document.getElementById('idx').textContent),q=document.getElementById('q'),res=document.getElementById('res'),cnt=document.getElementById('cnt');
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function run(){var v=q.value.trim().toLowerCase();res.innerHTML='';if(v.length<2){cnt.textContent='';return}
var ws=v.split(/\s+/),out=[];D.forEach(function(d){var t=(d.t+' '+d.x).toLowerCase(),ok=ws.every(function(w){return t.indexOf(w)>=0});if(!ok)return;var i=t.indexOf(ws[0]),sn=(d.t+'. '+d.x),j=Math.max(0,sn.toLowerCase().indexOf(ws[0])-60);out.push({d:d,sn:sn.substr(j,200)})});
cnt.textContent=out.length+' section'+(out.length===1?'':'s');
out.slice(0,40).forEach(function(o){var h=document.createElement('div');h.className='hit';var s=esc(o.sn);ws.forEach(function(w){s=s.replace(new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>')});h.innerHTML='<a href="eco-ch'+(o.d.ch<10?'0':'')+o.d.ch+'.html#'+o.d.id+'">Ch '+o.d.ch+' · '+esc(o.d.t)+'</a><br><small>'+esc(o.d.cht)+'</small><br>'+s+'…';res.appendChild(h)})}
q.addEventListener('input',run);var p=new URLSearchParams(location.search).get('q');if(p){q.value=p;run()}})();
</script></body></html>
