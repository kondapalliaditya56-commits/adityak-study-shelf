cide attempt decriminalised in effect, advance directive, nominated representative, review boards, insurance parity). NIMHANS 2 and regional apex institutes decentralise expertise; Tele MANAS (14416) gives free 24x7 help. Status OF Mental Health IN India Key point Mental health has emerged as one of the most pressing yet neglected areas of public health. WHO defines mental health as a state of wellbeing where an individual realises their abilities, can cope with normal life stresses, can work productively and contribute to their community. Scale of the problem 10.6% of adults in India suffer from mental disorders with a 70 to 92% treatment gap (National Mental Health Survey 2015-16). Globally 1 in 8 people (970 million) live with a mental disorder (WHO). The 25 to 44 age group is most affected. One third of mental health conditions emerge before age 14 and half before 18 (WHO UNICEF 2023). Suicide is the fourth leading cause of death among 15 to 19 year olds globally. 23% of Indian school children suffer from mental health problems (NIMHANS). 27.8% undergraduate and 31.3% postgraduate medical students report mental health issues including suicidal thoughts. Reasons for the mental health crisis Academic pressure especially in competitive exam centres like Kota. Social media impact including cyberbullying and addiction. Family dysfunction and breakdown of joint family support. Urban isolation and the \"alone together\" paradox. Substance abuse and addiction. Economic stress including unemployment and debt. Stigma and lack of help seeking behaviour. Gender vulnerabilities as girls face higher anxiety and depression. Memory aid · SAFE-SUES Eight reasons (order free). Sentence: S chool pressure, S ocial media, F amily breakdown, U rban isolation, S ubstance abuse, E conomic stress, S tigma, G ender: \"Students Seek Friends, Understanding, Support, Empathy, Safety, Girls.\" Use whichever form you can recall; the list itself is from the handout. (own mnemonic) Systemic challenges Fragmented approach with no integration with primary care. Geographical disparities with services concentrated in urban areas. Shortage of professionals with only 0.75 psychiatrists per lakh (Economic Survey 2023-24). Awareness deficit and stigma. Underfunding: the National Mental Health Programme receives just 0.06% of health expenditure. Mental Healthcare ACT 2017 Key point A landmark law that adopted a rights based approach . Key features Decriminalises suicide attempt by presuming mental stress in such cases. Bans use of electroconvulsive therapy without anaesthesia . Recognises right to access mental healthcare as a legal entitlement. Advance Directives allowing a person to specify treatment in advance. Nominated Representative as authorised decision maker. Mental Health Review Boards at State level. Insurance coverage at par with physical illness . 6.5 times return on investment in mental health interventions (WHO). Memory aid · SAD-BRIEF Sentence for the features: S uicide attempt decriminalised, A dvance directive, D irection on ECT (no ECT without anaesthesia), B oards (review), R ight to access care, I nsurance parity, E ntitlement-based, F or the nominated representative. Order is free. (own mnemonic) Challenges in implementation Lack of trained workforce. Slow framing of State rules. Poor enforcement of insurance parity. Inadequate community based services. Nimhans AND Nimhans 2 NIMHANS, Bengaluru National Institute of Mental Health and Neurosciences is India's apex centre for mental health, neuroscience and clinical psychology. Deemed university under the Ministry of Health and Family Welfare. Recognised as WHO Collaborating Centre for Mental Health. Houses around 1000 beds with multi specialty wings. Pioneer in Tele MANAS , which has provided over 15 lakh calls since 2022. Leads District Mental Health Programme (DMHP) training and research. Anchored the National Mental Health Survey 2015-16 which found 10.6% adults with mental disorders. NIMHANS 2 (announced in Budget 2026-27) A new NIMHANS 2 to be established as a second apex institute . National Mental Health Institutes at Ranchi and Tezpur to be upgraded to Regional Apex Institutions . Aims to decentralise mental health expertise beyond Bengaluru. Will strengthen training, research and clinical services in central and eastern India . Supports expansion of Tele MANAS to every district . Addresses the shortage of only 0.75 psychiatrists per lakh population. Significance of the expansion Builds regional centres of excellence in mental health. Reduces patient travel to Bengaluru for specialised care. Provides training and capacity building hubs for State mental health programmes. Supports rollout of the Mental Healthcare Act 2017 at scale. Integrates mental health with AAMs and PM-JAY by feeding the system with trained professionals. Aligns with WHO Guidance 2025 , which calls for strengthened leadership and community based mental health services. Way forward / key point NIMHANS 2 marks a recognition that India's mental health crisis cannot be solved by one apex institute. A federal network of regional NIMHANS-like institutions is essential to make mental healthcare accessible, affordable and dignified for every Indian. Other Major Initiatives Initiative Focus National Mental Health Programme (NMHP) District level mental health services District Mental Health Programme Service delivery at district hospitals Tele MANAS Free 24x7 tele mental health on toll free 14416 Manodarpan Psychosocial support for students, launched during COVID KIRAN Helpline Distress management and counselling UMMEED Draft Guidelines Suicide prevention in schools SAATHI Programme (CBSE) Student wellbeing workshops WAY Forward Seven steps Integrate mental health into primary care like Nigeria's model of psychiatric nurses in PHCs. Community based mental health services through schools and youth centres. Early detection and intervention through teacher and frontline worker training. Tele MANAS expansion to every district. Digital detox campaigns to address screen time addiction. Mental health insurance parity enforcement. Increased budget allocation from current 0.06% to at least 1% of health budget. Way forward / key point Mental health is no longer a niche concern. It is the silent crisis behind the headlines of suicide, addiction and social breakdown. India needs a national mental health movement that goes beyond schemes."}, {"c": "6", "n": "Maternal, Geriatric and Mental Health, WASH, NCDs and the Future of Health", "id": "3-wash-programme-beneficiary-identificatio", "t": "3 · WASH Programme · Beneficiary Identification · Pandemic Preparedness · ONE Health · WHO Pandemic Treaty · IHR 2005", "x": "3 · WASH Programme · Beneficiary Identification · Pandemic Preparedness · ONE Health · WHO Pandemic Treaty · IHR 2005 # Handout only · Saarthi IAS Exam lens Priority: High. Mains PYQs quoted: Mains 2017 (WASH: beneficiary segments synchronised with anticipated outcomes) · Health chapter pp. 47-50. Prelims PYQs quoted: none quoted in the material. In simple words WASH links water, sanitation and hygiene to health: about 6 lakh deaths and 1 lakh child deaths a year. The 2017 question wants outcomes matched to beneficiary segments: tribals need community-led sanitation, slums community toilets with maintenance, schools separate girls' toilets, riverside communities waste segregation. After COVID, One Health, the WHO Pandemic Treaty (20 May 2025) and the 2024 IHR amendments shape preparedness. Water, Sanitation AND Hygiene (WASH) Programme PYQ 2017 Quote PYQ 2017 (10 marks): To ensure effective implementation of policies addressing water, sanitation and hygiene needs, the identification of beneficiary segments is to be synchronized with the anticipated outcomes. Examine the statement in the context of the WASH scheme. Key point The WASH Programme covers Water, Sanitation and Hygiene as integrated determinants of health. Importance of WASH WASH related diseases cause around 6 lakh deaths annually in India. Diarrhoea kills around 1 lakh children under 5 annually. Open defecation contributed to high stunting before SBM. Anaemia and worm infections linked to poor sanitation. WASH affects women's safety, dignity and economic productivity . NFHS 6 indicators on WASH 96.5% households have an improved drinking water source. 98.3% households have electricity. A wide rural urban gap in sanitation persists. Programme Focus Swachh Bharat Mission (Urban and Rural) Toilet construction and ODF status Jal Jeevan Mission Tap water to every rural household by 2024 (target extended) AMRUT 2.0 Urban water supply and sewage Namami Gange Programme River cleaning and sewage treatment Swachh Survekshan Annual sanitation rankings Swachh Vidyalaya Mission School sanitation Beneficiary identification and outcome challenges (PYQ 2017) Targeting tribals and slum dwellers requires special focus as they were left out initially. Sustainability of behaviour change beyond toilet construction. Quality of water in pipes as Jal Jeevan focus has been on connections. Solid and liquid waste management in rural and small town areas. Greywater and sewage treatment remains weak. Beneficiary segment What the outcome needs Tribal areas Community led total sanitation rather than individual toilets Urban slums Community toilets with maintenance support Schools Separate girls' toilets for retention Riverside communities Waste segregation Way forward / key point Answer line for PYQ 2017: the statement is correct: counting toilets or connections (outputs) does not deliver health outcomes unless each segment (tribal, slum, school, riverside) gets the design and support that fits it. Pandemic Preparedness AND ONE Health Approach Key point The COVID 19 pandemic exposed weaknesses in global health systems and vaccine inequities . India learnt hard lessons that shape current pandemic preparedness policy. One Health approach Connects human health, animal health and environmental health . Many diseases like COVID 19, Nipah, Zika and Ebola start in animals (zoonotic spillover). Aims to prevent zoonotic diseases and antibiotic resistance through cross sectoral collaboration. Doctors, veterinarians, ecologists and public health experts work together. India has launched the National One Health Mission under the Principal Scientific Adviser (PSA). Kerala's KARMIBot , developed during COVID, showed how technology can support frontline healthcare. WHO Pandemic Treaty Adopted on 20 May 2025 at the 78th World Health Assembly . First legally binding global agreement on pandemic preparedness. Emphasises equitable access to vaccines and treatments. Requires 60 country ratification and adoption of the Pathogen Access and Benefit Sharing (PABS) annex . Concerns include lack of enforcement and deferred issues like vaccine inequity. Recent Amendments TO International Health Regulations 2005 Key point The 77th World Health Assembly in 2024 adopted critical amendments to IHR 2005. About IHR 2005 Successor to the International Sanitary Regulations 1951 . Legally binding on 194 WHO Member States including India. Aim is to prevent and control international spread of diseases without unnecessary interference with travel and trade. Key amendments adopted Definition of Pandemic Emergency clarified as a communicable disease with wide geographical spread or capacity to overwhelm health systems. Coordinating Financial Mechanism to support developing countries during health crises. States Parties Committee to oversee implementation and resolve disputes. National IHR Authorities designated as focal points in each country. Way forward / key point These amendments are India's chance to strengthen its National Centre for Disease Control (NCDC) and integrate the One Health approach into mainstream policy."}, {"c": "6", "n": "Maternal, Geriatric and Mental Health, WASH, NCDs and the Future of Health", "id": "4-rising-public-health-challenges-obesity", "t": "4 · Rising Public Health Challenges · Obesity · NON Communicable Diseases · Double Burden OF Disease", "x": "4 · Rising Public Health Challenges · Obesity · NON Communicable Diseases · Double Burden OF Disease # Handout only · Saarthi IAS Exam lens Priority: Medium. Mains PYQs quoted: None quoted in the handout · Health chapter pp. 50-53. Prelims PYQs quoted: none quoted in the material. In simple words NFHS 6 confirms a double burden of disease: communicable diseases fall while NCDs rise, now over 57% of deaths. Obesity is spreading (women 30.7%, men 27.3%; urban women 42.8%) driven by ultra processed foods and sedentary life. Responses: POSHAN, Fit India, Eat Right India, NP-NCD, IHCI, population screening of 30 plus adults; reforms: front-of-pack labels, UPF taxes, Jan Aushadhi, AI early detection. Rising Public Health Challenges Key point NFHS 6 has confirmed that India faces a double burden of disease , with communicable diseases declining and non communicable diseases (NCDs) rising sharply . Obesity IN India Key point Obesity is no longer a Western problem. NFHS 6 reveals an alarming surge. Scale of the crisis Women overweight or obese surged to 30.7% from 24% in NFHS 5. Men overweight or obese rose to 27.3% from 22.9%. Urban women obesity at 42.8% is sharply higher than rural at 25.5% . Childhood obesity also rising: overweight children under 5 at 1.3% . Over 3.3 crore obese children in 2020 projected to 8.3 crore by 2035 (Economic Survey 2025-26). India is one of the fastest growing markets for Ultra Processed Foods (UPFs) , with sales growing 150% from 2009 to 2023. Causes Sedentary lifestyles with reduced physical activity. Ultra processed foods with high sugar, salt and fat. Aggressive marketing of unhealthy foods. Urbanisation and screen time . Insufficient sleep and stress . Government initiatives POSHAN Abhiyaan and POSHAN 2.0 for nutrition. Fit India Movement for physical activity. Khelo India for sports culture. Eat Right India by FSSAI. PM's Mann ki Baat call to reduce edible oil consumption by 10% . National Programme for Prevention and Control of NCDs (NP NCD) . FSSAI Stop Obesity awareness campaign. Way forward Multi sectoral policy integrating health, education, urban planning and food regulation. Front of Pack Nutrition Labelling with warning labels. Nutrient based tax on UPFs at the highest GST slab. Bariatric surgery under CGHS and public insurance. Mandatory physical activity in schools and workplaces. Sugar tax like Mexico and the UK. Urban planning for active transport and recreation. NON Communicable Diseases Burden Key point NCDs are now India's biggest killer , accounting for over 57% of all deaths (Economic Survey 2025-26). Major NCDs and burden Cardiovascular diseases as the leading cause of death. Diabetes affects around 10 crore Indians, India being the \"diabetes capital\". Cancer with around 14 lakh new cases annually. Chronic respiratory diseases linked to air pollution. Hypertension as the silent killer. NFHS 6 NCD indicators Women with high blood sugar surged to 17.8% from 13.5%. Men with high blood sugar at 20.9% from 15.6%. Women with elevated BP at 19.4% . Men with elevated BP at 22.1% . Economic impact NCDs projected to cost India USD 6 trillion by 2030 . Cancer treatment alone can push families into debt. Productivity losses reduce GDP. Government interventions NP NCD . India Hypertension Control Initiative (IHCI) with WHO support. WHO SHAKE the Salt Habit programme. Population based screening of 30 plus adults for hypertension, diabetes and common cancers. CHARAK Initiative in coal bearing regions. Centres of Excellence for AI driven reform at AIIMS Delhi, PGIMER Chandigarh, AIIMS Rishikesh. Way forward Lifestyle interventions through behaviour change campaigns. Affordable medicines through Jan Aushadhi. Primary care screening at AAMs. AI based early detection of common cancers. Air pollution control to reduce respiratory diseases. Workplace wellness programmes. Way forward / key point The NCD challenge is India's biggest health challenge of this decade. Without urgent action it will overwhelm the health system and derail the demographic dividend."}, {"c": "6", "n": "Maternal, Geriatric and Mental Health, WASH, NCDs and the Future of Health", "id": "5-future-of-health-digital-health-esanjeev", "t": "5 · Future OF Health · Digital Health · eSANJEEVANI · AI · Medical Value Tourism · Ayush · WAY Ahead", "x": "5 · Future OF Health · Digital Health · eSANJEEVANI · AI · Medical Value Tourism · Ayush · WAY Ahead # Handout only · Saarthi IAS Exam lens Priority: Medium. Mains PYQs quoted: None quoted in the handout · Health chapter pp. 53-58. Prelims PYQs quoted: none quoted in the material. In simple words Digital health (telemedicine, EHRs, AI, e-pharmacy, wearables) is India's main tool to bridge access, cost and quality gaps; eSanjeevani has crossed 22 crore consultations. Medical value tourism (USD 9 billion in 2023) and AYUSH are the global-hub plank of Budget 2026-27. The way ahead is four reforms: investment, equity, quality and accountability, innovation. Digital Health Ecosystem AND Telemedicine Key point India aims for Universal Health Coverage by 2030 . Digital health is the most powerful tool to bridge access, cost and quality gaps. Digital health components Telemedicine for remote consultations. Electronic Health Records for longitudinal care. AI and Robotics for diagnostics. E pharmacies for medicine delivery. Health information exchanges for data sharing. Wearables and mobile health for self monitoring. Way forward / key point NFHS 6 revealed that female internet use jumped to 64.3% from 33.3%, which creates an unprecedented opportunity for digital health to reach women. ESANJEEVANI Key point India's national telemedicine platform offering both doctor to doctor and patient to doctor services. Key features Launched in 2019 and scaled rapidly during COVID. eSanjeevani AB HWC variant connects over 1 lakh AAMs with district hospitals. eSanjeevani OPD for direct patient consultations. Hub and spoke model for rural care. Multilingual support. Achievements Facilitated over 22 crore consultations (one of the world's largest telemedicine programmes). Reaches remote and tribal areas previously without doctors. Free of cost for patients. Hurdles Digital divide in remote areas. Poor internet connectivity in PHCs. Privacy concerns about health data. Lack of computerisation in many public health centres. Resistance from traditional providers . AI AND Robotics IN Healthcare Key point AI is transforming healthcare delivery and diagnosis. Applications AI in diagnostics for early cancer, diabetic retinopathy and TB detection. Drug discovery with reduced timelines. Clinical Decision Support Systems integrated with eSanjeevani. Robot assisted surgeries for precision. Predictive analytics for outbreak forecasting. Centres of Excellence for AI driven reform at AIIMS Delhi, PGIMER Chandigarh and AIIMS Rishikesh (Economic Survey 2025-26). Ethical concerns Black box problem of opaque AI decisions. Data privacy without a comprehensive data protection law. Algorithmic bias against underrepresented groups. Liability questions in AI errors. Need for a regulatory framework for AI in healthcare. Other digital health initiative Focus Ayushman Bharat Digital Mission (ABDM) Unified digital health infrastructure CoWIN COVID vaccine distribution platform U WIN Portal Universal Immunisation digitisation with 4.44 crore beneficiaries (as printed in the handout) Nikshay 2.0 TB patient community support Poshan Didi Chatbot for nutrition counselling Tele MANAS Tele mental health eHospital Hospital management system Key point Global Initiative on Digital Health (GIDH) by WHO supports countries in standardising digital health solutions. Medical Value Tourism AND Ayush Key point Medical Value Tourism (MVT) combines high quality healthcare with affordable cost, making India a global destination. Scale MVT contributed USD 9 billion to the Indian economy in 2023. Projected to grow at over 20% annually. India ranks among the top 10 medical tourism destinations globally. Budget 2026-27 push for MVT Schemes to support States in setting up Five Hubs for Medical Value Tourism. Partnership with the private sector. Allied Health Professionals (AHPs) to be trained, adding 1 lakh AHPs in 5 years in 10 disciplines including optometry, radiology and anaesthesia. AYUSH (Ayurveda, Yoga, Unani, Siddha, Sowa Rigpa, Homoeopathy) Ministry of AYUSH since 2014 . National Health Policy 2017 mainstreamed AYUSH. AYUSH integrated into AAMs . Global recognition of yoga through International Day of Yoga (21 June) . Budget 2026-27 announcements on AYUSH 3 new All India Institutes of Ayurveda . Upgrading AYUSH pharmacies and Drug Testing Labs . Upgrading the WHO Global Traditional Medicine Centre at Jamnagar . Targeting global demand for traditional medicine. Challenges Lack of evidence based protocols for many AYUSH treatments. Quality control of medicines and practitioners. Mixopathy debates between AYUSH and modern medicine. Integration with mainstream healthcare remains uneven. Way forward / key point The AYUSH and MVT push is part of India's positioning as a global health hub and the inclusion of orange economy and care economy in the Budget 2026-27 vision. WAY Ahead FOR Health IN India Key point India's health journey is at a turning point. NFHS 6 confirms historic gains in maternal and child health, immunisation, household insurance coverage and women's empowerment. India has made progress on MDGs and is on track for several SDG 3 targets. MMR has fallen by 86% since 1990 and TFR has stabilised below replacement level. Value addition Yet the same data reveals a worrying transition: adult obesity, diabetes and hypertension are surging, especially in urban India; anaemia and exclusive breastfeeding show worrying trends; mental health remains a silent crisis; NCDs account for over 57% of all deaths. Four parallel reforms Investment: raise public health spending from 1.8% to the promised 2.5% of GDP . Equity: close rural urban, gender, caste and tribal gaps in access. Quality and accountability: enforce patient rights, regulate the private sector and protect healthcare workers. Innovation: through ABDM, eSanjeevani, AI and AYUSH integration. Memory aid · I-E-Q-I Four reforms, order free: I nvest, E qualise, Q uality-check, I nnovate. Sentence: \"Invest Early; Quality Improves.\" (own mnemonic) Three shifts From a disease centric to a wellness centric model. From urban tertiary care focus to grassroots primary care strength . From market driven inequity to state led equity . Way forward / key point Health is not just a sector. It is the foundation of demographic dividend, economic growth and social justice. As Amartya Sen reminds us, the test of any society's progress is how it treats its most vulnerable. India's health system, with its strengths and gaps, is the most important measure of that test. (Closing quote for the conclusion of answers.)"}, {"c": "6", "n": "Maternal, Geriatric and Mental Health, WASH, NCDs and the Future of Health", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. MMR now vs SDG target? 97 vs below 70 by 2030 States with MMR below 50 and above 150? Kerala, Maharashtra, Tamil Nadu; Assam, MP, UP, Rajasthan Anaemia and adolescent pregnancy figures? 57%; 6.7% JSY, JSSK, PMSMA? Cash for institutional delivery; free delivery and treatment; free ANC on 9th of every month SUMAN, LaQshya, Midwifery Initiative? Zero denial of service; labour-room quality; 90000 midwives PMMVY amount? Rs 5000 for first child Modern contraceptive use trend? 52.7%, down from 56.4%; female sterilisation 36.5%, male 0.5% MTP Amendment Act 2021? Abortion up to 24 weeks for special categories K. Umadevi v. Tamil Nadu? Maternity leave is core of reproductive rights RKSK and Mission Parivar Vikas? Adolescent health; high TFR districts PM-JAY amnagar upgraded AYUSH challenges? No evidence-based protocols; quality control; mixopathy debate; uneven integration Four reforms? Investment (1.8% to 2.5% GDP); equity; quality and accountability; innovation Three shifts? Disease to wellness; urban tertiary to grassroots primary; market inequity to state-led equity Closing quote? Amartya Sen: test of progress is how a society treats its most vulnerable"}, {"c": "6", "n": "Maternal, Geriatric and Mental Health, WASH, NCDs and the Future of Health", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts in Start Here)"}, {"c": "6", "n": "Maternal, Geriatric and Mental Health, WASH, NCDs and the Future of Health", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards"}]</script><script>

q.addEventListener('input',run)})();</script><script>/* Shared store: reading progress, preferences, optional cross-device sync. */
(function(){
var KEY='nbapp:v1',root=document.documentElement;
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function fresh(){return{v:1,prefs:{fs:1,lh:1.65,w:780,font:'serif',theme:'auto',pt:0},last:null,nb:{},days:{}}}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var S;
try{S=JSON.parse(lsGet(KEY))}catch(e){S=null}
if(!S||!S.v)S=fresh();
S.prefs=Object.assign(fresh().prefs,S.prefs||{});
// one-time import of the older done list and theme
if(!S.migrated){
  try{var od=JSON.parse(lsGet('nb-done')||'[]');od.forEach(function(n){var c=chap('modern-india',n);c.done=1;c.dt=1})}catch(e){}
  var ot=lsGet('nb-theme');if(ot&&!S.prefs.pt){S.prefs.theme=ot;S.prefs.pt=1}
  S.migrated=1;
}
function chap(nb,n){var b=S.nb[nb]||(S.nb[nb]={});return b[n]||(b[n]={read:{},done:0,dt:0,pos:null,t:0})}
var listeners=[],dirty=false,saveT=null,syncT=null;
function save(){
  dirty=true;clearTimeout(saveT);
  saveT=setTimeout(function(){lsSet(KEY,JSON.stringify(S));listeners.forEach(function(f){try{f()}catch(e){}});scheduleSync()},250);
}
function flush(){lsSet(KEY,JSON.stringify(S))}
function merge(a,b){ // a local, b remote; returns merged
  var o=fresh();
  o.prefs=((b.prefs&&b.prefs.pt||0)>(a.prefs&&a.prefs.pt||0))?Object.assign({},a.prefs,b.prefs):Object.assign({},b.prefs,a.prefs);
  o.last=(!a.last||(b.last&&b.last.ts>a.last.ts))?b.last:a.last;
  o.migrated=1;
  var ids={};Object.keys(a.nb||{}).concat(Object.keys(b.nb||{})).forEach(function(k){ids[k]=1});
  Object.keys(ids).forEach(function(id){
    o.nb[id]={};var ca=(a.nb||{})[id]||{},cb=(b.nb||{})[id]||{},ks={};
    Object.keys(ca).concat(Object.keys(cb)).forEach(function(k){ks[k]=1});
    Object.keys(ks).forEach(function(k){
      var x=ca[k],y=cb[k];if(!x||!y){o.nb[id][k]=x||y;return}
      var r=Object.assign({},x.read,y.read),done=(y.dt||0)>(x.dt||0)?y:x,pos=(y.t||0)>(x.t||0)?y.pos:x.pos;
      o.nb[id][k]={read:r,done:done.done,dt:done.dt||0,pos:pos,t:Math.max(x.t||0,y.t||0)};
    });
  });
  var dk={};Object.keys(a.days||{}).concat(Object.keys(b.days||{})).forEach(function(k){dk[k]=1});
  Object.keys(dk).forEach(function(k){o.days[k]=Math.max((a.days||{})[k]||0,(b.days||{})[k]||0)});
  return o;
}
var syncState='off';
function scheduleSync(){clearTimeout(syncT);syncT=setTimeout(function(){sync()},4000)}
var dbp=null;
function getRef(){
  if(dbp)return dbp;
  dbp=(async function(){
    if(!window.claude||!claude.use)return null;
    var db=await claude.use('db'),u=await claude.use('user');
    if(!db||!u||!u.id)return null;
    var id=await u.id();if(!id)return null;
    return db.doc('data/users/'+id+'/nbapp');
  })().catch(function(){return null});
  return dbp;
}
var busy=false;
async function sync(){
  if(busy)return;busy=true;
  try{
    var ref=await getRef();if(!ref){syncState='local';return}
    var snap=await ref.get(),rem=null;
    if(snap.exists){var d=snap.data();try{rem=JSON.parse(d.state)}catch(e){}}
    var m=rem?merge(S,rem):S;
    var changed=JSON.stringify(m)!==JSON.stringify(S);
    S=m;
    if(changed){flush();listeners.forEach(function(f){try{f()}catch(e){}})}
    var out=JSON.stringify(S);
    if(!rem||JSON.stringify(rem)!==out)await ref.set({v:1,updated:Date.now(),state:out});
    syncState='synced';
  }catch(e){syncState='local'}
  finally{busy=false}
}
var API={
  get:function(){return S},
  chap:chap,
  save:save,flush:flush,sync:sync,
  onChange:function(f){listeners.push(f)},
  syncState:function(){return syncState},
  setPref:function(k,v){S.prefs[k]=v;S.prefs.pt=Date.now();applyPrefs();save()},
  reset:function(){S=fresh();S.migrated=1;flush();save()},
  today:today,
  pct:function(nb,n,total){var c=(S.nb[nb]||{})[n];if(!c||!total)return 0;var r=0;Object.keys(c.read||{}).forEach(function(k){if(c.read[k])r++});return Math.min(1,r/total)},
  isDone:function(nb,n,total){var c=(S.nb[nb]||{})[n];if(!c)return false;if(c.dt)return !!c.done;return false}
};
window.NBS=API;
function applyPrefs(){
  var p=S.prefs;
  var th=p.theme;
  if(th==='auto')root.removeAttribute('data-theme');else root.setAttribute('data-theme',th);
  root.style.setProperty('--zoom',p.fs);root.style.setProperty('--lh',p.lh);root.style.setProperty('--pw',p.w+'px');
  root.setAttribute('data-font',p.font);
}
API.applyPrefs=applyPrefs;applyPrefs();
// studied time, counted while the page is visible and touched in the last minute
var lastAct=Date.now();
['scroll','pointerdown','keydown','touchstart'].forEach(function(e){addEventListener(e,function(){lastAct=Date.now()},{passive:true})});
setInterval(function(){
  if(document.hidden||Date.now()-lastAct>60000||!window.__NB)return;
  var t=today();S.days[t]=(S.days[t]||0)+15;save();
},15000);
document.addEventListener('visibilitychange',function(){if(document.hidden){flush();sync()}else{sync()}});
addEventListener('pagehide',flush);
setTimeout(sync,800);
})();
