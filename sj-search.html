.mm-link.c0,.mm-leaf.c0{stroke:var(--c0)}.mm-link.c1,.mm-leaf.c1{stroke:var(--c1)}.mm-link.c2,.mm-leaf.c2{stroke:var(--c2)}.mm-link.c3,.mm-leaf.c3{stroke:var(--c3)}.mm-link.c4,.mm-leaf.c4{stroke:var(--c4)}.mm-link.c5,.mm-leaf.c5{stroke:var(--c5)}.mm-link.c6,.mm-leaf.c6{stroke:var(--c6)}.mm-link.c7,.mm-leaf.c7{stroke:var(--c7)}
:root:not([data-theme="dark"]) .mm-branch-t{fill:#fff}
.outline,.outline ul{list-style:none;padding-left:18px;margin:4px 0}.outline>li{padding-left:0}.outline summary{cursor:pointer;font:700 15px var(--sans)}

.deck{margin:10px 0}

.fc.back{background:var(--acc-soft)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.btn{font:600 14px var(--sans);padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:40px 0 20px}.pager a{display:block;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;text-decoration:none;color:var(--ink);font:600 15px var(--sans)}.pager a.nx{text-align:right}.pager small{display:block;color:var(--muted);font-weight:500;font-size:12px}

/* ---- reader app ---- */
:root{--zoom:1;--lh:1.65;--pw:780px}
:root[data-theme="sepia"]{--bg:#F4ECD8;--surface:#FBF5E6;--surface2:#EADFC4;--ink:#3B3022;--muted:#7A6A52;--line:#D8C9A6;--acc:#7A4A12;--acc-ink:#fff;--acc-soft:#EFDDB8;--saf:#A4470A;--saf-soft:#F6E2BE;--red:#9C2A1C;--red-soft:#F3D9CB;--blue:#2F5C8A;--blue-soft:#DDE6E4;--good:#3E6B2A;--good-soft:#DDE8C8;--hl:#F2D98A;color-scheme:light}
:root[data-font="sans"] body{font-family:var(--sans)}
:root[data-font="sans"] .notes p,:root[data-font="sans"] .notes li{font-family:var(--sans)}
.page{zoom:var(--zoom);max-width:var(--pw)}
.notes p,.notes li{line-height:var(--lh)}
.rbar{position:fixed;left:0;top:0;height:3px;width:0;background:var(--acc);z-index:40;transition:width .15s}
.aabtn{color:var(--ink);border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:5px 12px;font:700 14px var(--serif);cursor:pointer;flex:none}
.h2read{float:right;margin:2px 0 0 10px;font:600 12px var(--sans);border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer;min-height:30px}
.h2read[aria-pressed="true"]{background:var(--acc-soft);color:var(--acc);border-color:var(--acc)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;justify-content:center}
.dock button{font:600 14px var(--sans);min-height:44px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;padding:0 14px;cursor:pointer}
.dock .mid{flex:1;max-width:520px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock .mid b{color:var(--acc)}
body.has-dock .page{padding-bottom:110px}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheetin{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:82vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));font:15px/1.4 var(--sans)}
.sheetin h3{margin:0 0 10px;font:700 17px var(--sans)}
.srow{display:flex;align-items:center;gap:10px;margin:12px 0;flex-wrap:wrap}
.srow label{flex:0 0 92px;color:var(--muted);font-weight:600}
.srow .grp{display:flex;gap:6px;flex-wrap:wrap}
.srow button{font:600 14px var(--sans);min-height:42px;min-width:48px;padding:0 12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;cursor:pointer}
.srow button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.secl a{display:flex;gap:10px;align-items:center;padding:12px 6px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;min-height:44px}
.secl a .tk{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--acc-ink)}
.secl a.rd .tk{background:var(--acc);border-color:var(--acc)}
.secl a.cur{background:var(--acc-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:50;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;font:600 14px var(--sans);max-width:92vw;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.toast button{font:700 14px var(--sans);background:transparent;border:0;color:var(--bg);text-decoration:underline;cursor:pointer;min-height:36px}
body.focus .bar{display:none}body.focus .sidetoc{display:none}
figcaption.clamp{max-height:3.3em;overflow:hidden;position:relative;cursor:pointer}

D Semi-nomadic Tribes · PVTGs · Tribal Schemes · Nehru's Panchsheel High None quoted in the handout · Social Justice handout pp. 26-28 213 · Other Backward Classes · Article 340 · NCBC · 102ND AND 105TH Amendments · Challenges · Schemes High Mains 2024 (affirmative action benefits not fully reaching underprivileged) · Social Justi 214 · Minorities · Constitutional Safeguards · Sachar Committee · Ranganath Mishra Commission · Schemes High Mains 2024 (affirmative action benefits not fully reaching underprivileged) · Social Justi 215 · Lgbtqia+ Community · Nalsa · Navtej Johar · Supriyo · Transgender Persons ACT 2019 · State BEST Practices High None quoted in the handout · Social Justice handout pp. 31-32 216 · WAY Ahead FOR Vulnerable Sections IN India · FOUR Parallel Reforms High Mains 2019, 2013, 2023, 2024 (conclusion for any welfare or vulnerable-section answer) · S 217 · Health: Structure AND Status · Constitutional Basis · Three-tier System · NFHS 6 · NHA · Insurance High Handout lists 7 Mains PYQs (2013-2024) for the Health chapter; placed beside their topics 218 · Public Health System AND THE State · Marketisation · Missing Middle · Inter-state Variations · Safety OF Doctors · Patient Rights High Mains 2024 (State role against marketisation), 2015 (can private sector bridge UHC gap) · 219 · Primary Healthcare · ASHA · Ayushman Arogya Mandirs · SDG 3 · National Health Policy 2017 High Mains 2021 (primary health as precondition for sustainable development), 2018 (community l 220 · Flagship Schemes · Ayushman Bharat Pm-jay · ABDM · Health Equity · Tribal Health High None quoted in the handout · Health chapter pp. 39-41 221 · Maternal, Reproductive AND Geriatric Health · MMR · Schemes · MTP ACT · Pm-jay 70 PLUS High Mains 2020 (geriatric and maternal healthcare policies) · Health chapter pp. 41-44 222 · Mental Health · Status · Mental Healthcare ACT 2017 · Nimhans AND Nimhans 2 · TELE Manas · WAY Forward Medium None quoted in the handout · Health chapter pp. 44-47 223 · WASH Programme · Beneficiary Identification · Pandemic Preparedness · ONE Health · WHO Pandemic Treaty · IHR 2005 High Mains 2017 (WASH: beneficiary segments synchronised with anticipated outcomes) · Health ch 224 · Rising Public Health Challenges · Obesity · NON Communicable Diseases · Double Burden OF Disease Medium None quoted in the handout · Health chapter pp. 50-53 225 · Future OF Health · Digital Health · eSANJEEVANI · AI · Medical Value Tourism · Ayush · WAY Ahead Medium None quoted in the handout · Health chapter pp. 53-58"}, {"c": "1", "n": "Social Justice Foundations, Welfare Design and Women", "id": "1-social-justice-conceptual-foundations-vu", "t": "1 · Social Justice: Conceptual Foundations · Vulnerability · Intersectionality · Inclusive Growth · Social Infrastructure", "x": "1 · Social Justice: Conceptual Foundations · Vulnerability · Intersectionality · Inclusive Growth · Social Infrastructure # Handout only · lists 10 Mains PYQs (2013-2025) for this chapter; each is placed beside its topic · Social Justice handout pp. 3-6 Exam lens Priority: High. Mains PYQs quoted: Handout lists 10 Mains PYQs (2013-2025) for this chapter; each is placed beside its topic · Social Justice handout pp. 3-6. Prelims PYQs quoted: none quoted in the material. In simple words Vulnerability is a condition produced by society, not a personal failing. It is collective, structural, multidimensional and self-reinforcing. One person can sit in several vulnerable categories at once (intersectionality). The Constitution builds social justice in three layers: Preamble, Fundamental Rights, Directive Principles. Growth without inclusion deepens inequality, and weak social infrastructure makes even good schemes fail at the last mile. Previous YEAR Questions (mains) IN THIS Chapter Year, marks Question as printed in the handout 2025, 10 Women's social capital complements in advancing empowerment and gender equity. Explain. 2024, 15 Despite comprehensive policies for equity and social justice, underprivileged sections are not yet getting the full benefits of affirmative action envisaged by the Constitution. Comment. 2023, 15 Development and welfare schemes for the vulnerable, by its nature, are discriminatory in approach. Do you agree? Give reasons for your answer. 2022, 10 The Rights of Persons with Disabilities Act, 2016 remains only a legal document without intense sensitisation of government functionaries and citizens regarding disability. Comment. 2021, 15 Though women in post Independent India have excelled in various fields, the social attitude towards women and feminist movement has been patriarchial. Apart from women education and women empowerment schemes, what interventions can help change this milieu. 2019, 15 Performance of welfare schemes that are implemented for vulnerable sections is not so effective due to absence of their awareness and active involvement at all stages of policy process. Discuss. 2017, 10 Does the Rights of Persons with Disabilities Act, 2016 ensure effective mechanism for empowerment and inclusion of the intended beneficiaries in the society. Discuss. 2016, 12.5 Examine the main provisions of the National Child Policy and throw light on the status of its implementation. 2014, 12.5 Do government's schemes for up lifting vulnerable and backward communities by protecting required social resources for them, lead to their exclusion in establishing businesses in urban economies. 2013, 10 The Central Government frequently complains on the poor performance of the State Governments in eradicating suffering of the vulnerable sections of the society. Restructuring of Centrally sponsored schemes across the sectors for ameliorating the cause of vulnerable sections of population aims at providing flexibility to the States in better implementation. Critically evaluate. Way forward / key point Where each PYQ is answered: 2023 and 2013 and 2019 and 2014 in the welfare-design chapter; 2021 and 2025 in the Women chapters; 2016 in the Children chapter; 2017 and 2022 in the Disability chapter; 2024 in the SC/ST/OBC chapters. KEY DATA Points (handout Table) Indicator Value Source or year Share of welfare and social services in Union Budget ₹62,362 crore for Budget 2026-27 Social Welfare Gender Budget allocation in Union Budget 9.37% of total Union Budget 2026-27 Budget Female Labour Force Participation Rate (15 plus) 41.7% PLFS 2023-24 Maternal Mortality Ratio 97 per 1 lakh live births SRS 2018-20 Persons with Disabilities in India 2.21% of total population (2.68 crore) Census 2011 Elderly population (60 plus) 10.4% (10.4 crore) UNFPA 2023 PVTGs recognised in India 75 groups across 18 States and UTs Ministry of Tribal Affairs Religious minorities share in population 19.3% Census 2011 MGNREGA beneficiaries Over 11 crore rural households Ministry of Rural Development 2024 Value addition Handout figures dated 2023-2026: verify the latest values before using them in an answer. Meaning AND Dimensions OF Vulnerability Key point Vulnerability is the proneness of an individual or group to harm, exploitation or deprivation arising from external social, economic or structural forces. It is not a personal failing but a condition produced by society . Four features Group nature: vulnerability is collective and not individual. Structural roots: embedded in caste hierarchies, patriarchy and economic inequality. Multidimensional impact: social, economic, political, physical and psychological domains. Self-reinforcing cycle: poverty leads to poor health and education, which in turn deepens poverty. Classification of disadvantaged groups The Government of India Act, 1935 classified disadvantaged groups into Scheduled Castes, Scheduled Tribes and Other Backward Classes . Over the years the list has expanded to include women, children, the elderly, persons with disabilities, sexual minorities, denotified tribes and religious minorities . The Ministry of Social Justice and Empowerment is the nodal ministry for the empowerment of these groups. Intersectionality OF Caste, Gender, Disability AND Location Key point A single person may belong to multiple vulnerable categories at once. A Dalit woman with disability living in a remote tribal area faces compounded disadvantages that go far beyond what any one category captures. Identity Layer of disadvantage Caste Social exclusion, denial of dignity, occupational segregation Gender Patriarchy, unpaid care work, violence, low wages Disability Inaccessible infrastructure, stigma, employment barriers Location Rural backwardness, poor service delivery, geographical isolation Religion Identity-based discrimination, communal tensions Way forward / key point This intersectional reality is why welfare schemes that treat each category in isolation often miss the most marginalised within marginalised groups . Concept OF Social Justice AND Social Empowerment Key point Social justice means fair distribution of resources, opportunities and dignity across all sections of society. It seeks to correct historical wrongs and create substantive equality , not merely formal equality before law. Constitutional vision of social justice (three layers) Preamble: secures justice (social, economic and political), equality of status and dignity for all citizens. Fundamental Rights: Article 14 (equality before law), Article 15 (prohibition of discrimination), Article 17 (abolition of untouchability), Article 21 (right to life with dignity) and Article 23 (prohibition of forced labour). Directive Principles: Articles 38, 39, 41, 46 and 47, which guide the State towards becoming a welfare State. Note Number card: FR articles 14, 15, 17, 21, 23 · DPSP articles 38, 39, 41, 46, 47 . Key point Social empowerment is the practical expression of this vision. It means helping disadvantaged groups gain control over their lives through education, economic opportunity, political voice and barrier-free participation as equal citizens. Inclusive Growth, Income Inequality AND Social Justice Growth without inclusion Economic growth without inclusion deepens inequality and weakens social justice. India has shown high growth but still has poor human development indicators, which makes the inclusive growth agenda central to social justice. India's top 10% holds more than 57% of national income while the bottom 50% holds around 13% (World Inequality Report 2022). Inclusive growth widens demand, builds human capital and reduces social tensions. It requires investment in health, education, skill development and social safety nets. Way forward / key point The relationship between growth and justice is mutual : growth provides resources for welfare, while welfare ensures growth reaches everyone. Social Infrastructure IN India Key point Social infrastructure is the network of public services and institutions that enable human development. It includes schools, hospitals, anganwadis, sanitation facilities, drinking water systems, social security networks and public housing. Spending gaps India spends only 1.8% of GDP on public health against the recommended 2.5% (Economic Survey 2025-26). Combined Centre and State spending on education is around 4.6% of GDP , below the 6% target of NEP 2020. Wide interstate variations remain, with Kerala and Tamil Nadu doing far better than Bihar, UP and Jharkhand . Way forward / key point Strong social infrastructure is the precondition for any welfare scheme to succeed. Without good schools, functioning health centres and accessible institutions even the best-designed schemes fail at the last mile."}, {"c": "1", "n": "Social Justice Foundations, Welfare Design and Women", "id": "2-design-of-welfare-schemes-discrimination", "t": "2 · Design OF Welfare Schemes · Discrimination Debate · Centre-state · Last-mile GAPS · Social Exclusion", "x": "2 · Design OF Welfare Schemes · Discrimination Debate · Centre-state · Last-mile GAPS · Social Exclusion # Handout only · Saarthi IAS Exam lens Priority: High. Mains PYQs quoted: Mains 2023 (welfare schemes discriminatory?), 2019 (awareness and involvement), 2014 (exclusion in urban business), 2013 (CSS restructuring) · Social Justice handout pp. 5-8. Prelims PYQs quoted: none quoted in the material. In simple words Welfare schemes rest on the idea of a welfare State (Articles 38, 39, 46, 47). They are differential by design but not discriminatory in intent. Delivery is shared: the Centre designs and funds, States implement; CSS were consolidated into about 28 umbrella schemes. The biggest gap is the last mile: awareness deficit, leakages, ghost cards, digital exclusion. Protection must be balanced with promotion or it can exclude beneficiaries from urban business. Conceptual AND Philosophical Basis OF Welfare Schemes Key point Welfare schemes flow from the idea of a welfare State where the government takes responsibility for the well-being of its citizens, especially those who cannot protect themselves through the market. Constitutional basis Article 38: State shall promote welfare of the people. Article 39: equitable distribution of resources. Article 46: special care of weaker sections. Article 47: raising the standard of living and public health. Multiple goals of welfare schemes Reduction of poverty and inequality: MGNREGA provided employment to over 11 crore rural households. Building human capital: PM-JAY offers health insurance to over 55 crore beneficiaries. Provision of public goods: Samagra Shiksha expands school education. Crisis resilience: PMGKAY and MGNREGA cushioned the poor during the COVID-19 pandemic. Promoting equity: gives the disadvantaged a fair starting line. Discriminatory Nature Debate OF Welfare Design PYQ 2023 Quote PYQ 2023 (15 marks): Development and welfare schemes for the vulnerable, by its nature, are discriminatory in approach. Do you agree? Give reasons for your answer. Arguments that welfare schemes are discriminatory Arguments that they are not discriminatory but corrective They single out specific groups based on caste, gender or religion and may reinforce these identities rather than dissolve them. The Constitution itself permits positive discrimination under Articles 15(4), 15(5) and 16(4) to remedy historical injustices. General category groups in genuine economic distress are often excluded. Equal treatment of unequals is itself unequal, as Aristotle and the Supreme Court have repeatedly held. Scheme design can stigmatise beneficiaries, making them feel like permanent recipients of charity. Welfare schemes try to create a level playing field rather than tilt it against anyone. Targeted schemes may create dependency rather than self-reliance. Indra Sawhney judgment (1992) upheld that affirmative action is a constitutional mandate, not discrimination. Way forward / key point The honest position: welfare schemes are differential by design but not discriminatory in intent . The challenge lies in ensuring they reach the most deprived within deprived groups, do not stigmatise beneficiaries and gradually build self-reliance. Centre-state Dynamics IN Welfare Delivery Key point Welfare delivery in India is a shared responsibility : the Centre designs and funds while the States implement on the ground. This sharing is both a strength and a source of friction. Centrally Sponsored Schemes AND State Flexibility PYQ 2013 Quote PYQ 2013 (10 marks): The Central Government frequently complains on the poor performance of the State Governments in eradicating suffering of the vulnerable sections of the society. Restructuring of Centrally sponsored schemes across the sectors for ameliorating the cause of vulnerable sections of population aims at providing flexibility to the States in better implementation. Critically evaluate. Key point Centrally Sponsored Schemes (CSS) are funded jointly by the Centre and States in agreed ratios. Major examples: MGNREGA, PM Awas Yojana, Samagra Shiksha, NHM, ICDS and POSHAN Abhiyaan. Feature Earlier pattern Restructured pattern Number of schemes Over 200 fragmented schemes Consolidated into around 28 umbrella schemes Funding share Centre had higher and rigid share Centre-State share varies (60:40, 75:25, 90:10 for special category States) State flexibility Limited freedom in design Greater flexibility within broad guidelines Monitoring Centralised Performance-based Restructuring of welfare schemes The B. K. Chaturvedi Committee (2011) and the NITI Aayog Sub-Group of Chief Ministers (2015) recommended rationalisation of CSS, to give States more flexibility, reduce overlaps and improve outcomes. Strengths of restructuring States can adapt schemes to local needs. Reduced fragmentation makes delivery sharper. States have skin in the game through cost sharing. Limitations and tensions States complain of inadequate central funding when their share rises. Vertical devolution by the 15th Finance Commission at 41% is welcome but States still depend heavily on tied transfers. Differential capacity across States means rich States gain more flexibility than poor ones. Centre often blames States for poor outcomes while not increasing untied funds. Way forward / key point Cooperative federalism through forums like the NITI Aayog Governing Council and the Inter-State Council is essential to bridge these tensions. Implementation AND Performance GAPS Key point The biggest gap in Indian welfare is not in design but in delivery . India spends large sums on welfare yet outcomes lag because schemes fail at the last mile. ROLE OF Awareness AND Beneficiary Involvement PYQ 2019 Quote PYQ 2019 (15 marks): Performance of welfare schemes that are implemented for vulnerable sections is not so effective due to absence of their awareness and active involvement at all stages of policy process. Discuss. Welfare performance suffers when beneficiaries are kept passive Awareness deficit: many genuine beneficiaries do not know which schemes apply to them. Information asymmetry: lets middlemen exploit beneficiaries through fake fees and false promises. Lack of voice in scheme design: programmes do not match real needs on the ground. Weak grievance redressal: discourages people from reporting failures. Low ownership: beneficiaries treat schemes as charity rather than rights. Way forward / key point Active involvement of communities through Gram Sabhas, Self Help Groups, ward sabhas and social audits transforms passive recipients into active stakeholders. MGNREGA social audits in Andhra Pradesh have shown how community involvement plugs leakages. Last-mile Delivery Challenges Structural problems that block the last mile Inclusion and exclusion errors: India still has around 4.4 crore ghost ration cards even after Aadhaar seeding. Leakages and corruption: a CAG report on Bihar PDS found 30 to 40% of foodgrains lost to leakage. Bureaucratic apathy and frequent transfers of frontline staff. Digital exclusion of the elderly, rural poor and those without smartphones. Inter-state variations in administrative capacity. Convergence failure between line departments. Way forward / key point Reforms such as Direct Benefit Transfer (DBT), JAM Trinity (Jan Dhan, Aadhaar, Mobile), One Nation One Ration Card and PM GatiShakti (for logistics) are improving delivery, but the human element of motivated frontline workers remains the weakest link . Welfare Schemes AND Social Exclusion PYQ 2014 Quote PYQ 2014 (12.5 marks): Do government's schemes for up lifting vulnerable and backward communities by protecting required social resources for them, lead to their exclusion in establishing businesses in urban economies. Key point Welfare schemes are meant to include the excluded, but sometimes their design or implementation produces fresh exclusion . The 2014 question asked whether protective measures for vulnerable groups may end up excluding them from urban business opportunities. Exclusion in urban economic opportunities Protective ring effect: reservation in jobs and education builds a comfort zone but does not push beneficiaries into competitive entrepreneurship. Urban informal economy is largely outside the protective scope of caste-based schemes. Capital and network barriers keep SC, ST and OBC entrepreneurs out of mainstream business. Stand Up India, the Venture Capital Fund for SCs and PM Vishwakarma are steps to close this gap, yet only a small fraction of MSME credit reaches Dalit and Tribal entrepreneurs. Way forward / key point The lesson: protection must be balanced with promotion. Reservation alone does not create an entrepreneurial class. It must be combined with credit access, market linkages, mentorship and skill upgradation ."}, {"c": "1", "n": "Social Justice Foundations, Welfare Design and Women", "id": "3-women-as-a-vulnerable-section-status-pat", "t": "3 · Women AS A Vulnerable Section · Status · Patriarchy · Constitutional Safeguards · LAWS", "x": "3 · Women AS A Vulnerable Section · Status · Patriarchy · Constitutional Safeguards · LAWS # Handout only · Saarthi IAS Exam lens Priority: High. Mains PYQs quoted: Mains 2021 (patriarchal social attitude, interventions beyond education and schemes) · Social Justice handout pp. 9-11. Prelims PYQs quoted: none quoted in the material. In simple words Women have made strides yet remain vulnerable because of structural patriarchy, not nature. The numbers show it: MMR 97, sex ratio at birth 907, FLFPR 41.7%, 330 minutes of unpaid work a day. Schemes improve material conditions but attitudes need other tools (engaging men, media, curriculum, leaders, workplaces, laws, recognising unpaid work). The legal scaffolding is strong (Articles 14-16, 23, 39, 42, 51A(e), 243D, 243T; Dowry, PCPNDT, POSH, DV, Surrogacy Acts); implementation is the problem. Status OF Women IN India Key point Women in India have made remarkable strides in education, politics and the workplace , yet they remain a vulnerable section due to deep-rooted patriarchy, unequal access to resources and persistent violence . The vulnerability is structural, not natural . Key challenges faced by women (overlapping disadvantages across the life cycle, from birth to old age) Health vulnerabilities: Maternal Mortality Ratio 97 per 1 lakh live births against SDG target of 70 (SRS 2018-20). Son preference: Sex Ratio at Birth 907 girls per 1000 boys (CRS 2018-20). Child marriage: 20.1% of women aged 20 to 24 were married before 18 (NFHS 6). Economic exclusion: Female Labour Force Participation only 41.7% (PLFS 2023-24). Wage gap: rural casual women earn Rs 286 per day against men's Rs 407 (PLFS 2024). Violence: NCRB 2022 reported 4.45 lakh cases of crimes against women. Unpaid care burden: women spend 330 minutes daily on unpaid domestic work against men's 101 minutes (Time Use Survey 2024). Digital divide: only 1 in 3 women have ever used the internet against 57% of men (NFHS 5). Note Cross-check (from the Health chapter, NFHS 6): women aged 20-24 married before 18 fell to 20.1% (NFHS 6) from 23.3% (NFHS 5) . The Children chapter quotes the NFHS 5 figure, so the two numbers are consecutive survey rounds, not a conflict. Quote the survey name with the figure. Patriarchy AND Social Attitudes PYQ 2021 Quote PYQ 2021 (15 marks): Though women in post Independent India have excelled in various fields, the social attitude towards women and feminist movement has been patriarchial. Apart from women education and women empowerment schemes, what interventions can help change this milieu. Key point Patriarchy operates through silent codes that no law can directly touch . It shapes who eats first at home, who inherits land, who steps outside and who carries the family honour. Schemes can improve material conditions but attitudes need different tools . Interventions to change patriarchal attitudes Engaging men and boys through programmes like HeForShe and the MARD initiative by Farhan Akhtar to shift masculinity norms. Media and popular culture can break stereotypes through films, advertisements and digital content with positive women role models. School curriculum reforms to integrate gender sensitivity, consent education and equal sharing of housework. Religious and community leaders who can challenge patriarchal customs from within tradition. Workplace cultural change through paternity leave, flexible hours and zero tolerance to harassment. Legal reforms in personal laws and uniform inheritance rights to remove hidden discrimination. Recognition of unpaid work in national income accounts to make women's contribution visible. Memory aid · M-M-S-R-W-L-U Sentence (order is free): M any M edia S tudies R aise W omen's L egal U nderstanding = M en and boys, M edia, S chool curriculum, R eligious leaders, W orkplace, L aw reform, U npaid-work recognition. (own mnemonic) In the news (Saarthi IAS CA; verify dates) The 2025 PYQ on women's social capital deepens this debate by asking how networks, trust and collective action through SHGs strengthen gender equity. Social capital is the missing link between schemes and attitudes. Constitutional AND Legislative Framework Key point The Constitution and Parliament have built a strong legal scaffolding for women's rights. The challenge lies in implementation and societal acceptance. Provision Protection granted Article 14 Equality before law Article 15(1) Prohibition of discrimination on grounds of sex Article 15(3) Special provisions for women and children Article 16 Equality of opportunity in public employment Article 23 Prohibition of trafficking and forced labour Article 39(a) and (d) Equal means of livelihood and equal pay for equal work Article 42 Just and humane conditions of work and maternity relief Article 51A(e) Fundamental duty to renounce practices derogatory to women Articles 243D and 243T Reservation of one third seats for women in PRIs and ULBs KEY LAWS Protecting Women Dowry Prohibition Act, 1961 Prohibits giving, taking or demanding dowry directly or indirectly. Punishment includes imprisonment up to 5 years and fine. Section 498A of IPC (now BNS) deals with cruelty by husband or relatives for dowry. Challenge: low conviction rates and social acceptance of dowry as gifts. Pre-Conception and Pre-Natal Diagnostic Techniques Act, 1994 (PCPNDT) Prohibits sex-selective abortion and pre-natal sex determination. Bans advertisements relating to sex determination. Mandates registration of all ultrasound clinics and genetic counselling centres. Implementation suffers from low conviction rates and clandestine clinics. Sexual Harassment of Women at Workplace (Prevention, Prohibition and Redressal) Act, 2013 (POSH Act) Based on the Vishaka Guidelines of the Supreme Court in 1997 . Mandates an Internal Complaints Committee in every workplace with 10 or more employees . Local Complaints Committees for informal sector workers. NCRB 2022 recorded only 419 cases of workplace sexual harassment, indicating heavy under-reporting. Justice Hema Committee Report on the Malayalam film industry exposed deep structural harassment. Surrogacy (Regulation) Act, 2021 Allows only altruistic surrogacy and prohibits commercial surrogacy. Eligibility limited to married Indian couples with infertility . Establishes National and State Surrogacy Boards . Concerns: exclusion of single, LGBTQIA+ and live-in couples, and the burden placed on surrogate mothers. Domestic Violence Act, 2005 Provides civil remedies including protection orders, residence orders and monetary relief. Recognises physical, emotional, sexual and economic abuse . Implementation suffers from shortage of Protection Officers. Other key laws Maternity Benefit (Amendment) Act, 2017: extending paid leave to 26 weeks . Equal Remuneration Act, 1976. Prohibition of Child Marriage Act, 2006. Indecent Representation of Women (Prohibition) Act, 1986."}, {"c": "1", "n": "Social Justice Foundations, Welfare Design and Women", "id": "4-women-schemes-lakhpati-didi-violence-mar", "t": "4 · Women: Schemes · Lakhpati DIDI · Violence · Marital RAPE · CARE Economy · Flfpr · Manosphere · SHGs AND Social Capital", "x": "4 · Women: Schemes · Lakhpati DIDI · Violence · Marital RAPE · CARE Economy · Flfpr · Manosphere · SHGs AND Social Capital # Handout only · Saarthi IAS Exam lens Priority: High. Mains PYQs quoted: Mains 2025 (women's social capital) · Social Justice handout pp. 11-12. Prelims PYQs quoted: none quoted in the material. In simple words Schemes now treat women as drivers, not only beneficiaries (Lakhpati Didi, 3 crore target). New-age issues: violence and cybercrime, marital rape, harassment, women in STEM, the care economy, low FLFPR, the manosphere. SHGs (9 crore members under DAY-NRLM) build social capital: bargaining power, information, support, political voice. Equality is the destination, equity is the path, empowerment is the goal. Women Empowerment Schemes AND Initiatives Key point The Indian State has launched a vast architecture of schemes to translate constitutional promises into reality. Women-led Development AND Lakhpati DIDI Key point Women-led development marks a shift from women as beneficiaries to women as drivers of change . The PM addressed this concept at the G20 Delhi Declaration, 2023 . Lakhpati Didi Initiative Launched in 2023 under DAY-NRLM of the Ministry of Rural Development. A Lakhpati Didi is an SHG member earning annual household income of Rs 1 lakh or more . Target of 3 crore Lakhpati Didis, with 11 lakh felicitated by the PM at Jalgaon . Builds on the SHG ecosystem of DAY-NRLM. Major women empowerment scheme Focus area Beti Bachao Beti Padhao Sex ratio, education, survival of girl child Pradhan Mantri Matru Vandana Yojana Maternity benefit of Rs 5000 for first child One Stop Centres (Sakhi) Integrated support to women victims of violence Mahila Shakti Kendras Skill, employment and digital literacy at block level PM Ujjwala Yojana Free LPG to BPL women Pradhan Mantri Awas Yojana Gramin 72% houses with women ownership or co-ownership Stand Up India Bank loans to SC, ST and women entrepreneurs Mudra Yojana (Mahila Udhyami) Collateral-free loans up to Rs 10 lakh Nari Shakti Vandan Adhiniyam 2023 33% reservation for women in Lok Sabha and State Assemblies Mission Shakti Umbrella scheme covering Sambal (safety) and Samarthya (empowerment) Mission Vatsalya Family-based care for children with women as guardians Contemporary Issues Concerning Women Key point Beyond traditional welfare, women face new-age challenges that demand fresh policy responses. Violence against women and cybercrime Violence is the most visible expression of patriarchy and the most persistent failure of Indian society. NCRB 2022 recorded 4.45 lakh cases of crimes against women Domestic violence accounts for over 30% of these Cybercrime against women is rising fast: online stalking, deepfakes, image abuse and trolling. Digital Shakti initiative by NCW spreads awareness on online safety. IT Act 2000 and Bharatiya Nyaya Sanhita sections 75 to 79 cover online harassment. Marital rape debate India is one of the few countries where marital rape is not a criminal offence. Exception 2 to Section 375 of IPC (now Section 63 of BNS) exempts husbands from rape charges. Arguments for criminalisation Bodily autonomy is a constitutional right under Article 21 , affirmed in Justice K. S. Puttaswamy v. Union of India . International obligations under CEDAW . Delhi HC delivered a split verdict in 2022 and the matter is pending in the Supreme Court. Arguments against Misuse against husbands. Risk to the institution of marriage. Issue should be left to the legislature. Sexual harassment at workplace Despite the POSH Act 2013, workplace harassment remains widespread. Only 419 cases formally reported in 2022 (NCRB) against an iceberg of unreported incidents. Local Complaints Committees for informal sector workers exist only on paper in most districts. Justice Hema Committee Report revealed systemic abuse in the Malayalam film industry. Need for stronger ICCs, awareness drives and protection of complainants. Women in STEM and green jobs Women form only 27% of the STEM workforce in India (AISHE 2021-22). Gender gap in green jobs is significant despite climate jobs growing fast. WISE-KIRAN (Women in Science and Engineering) scheme by DST supports women scientists. GATI programme promotes gender equity in research institutions. Care economy and purple economy The care economy is the paid and unpaid work of caring for children, the elderly, the sick and the disabled. It is also called the Purple Economy . Women perform over 75% of total unpaid care work globally (ILO). If valued at minimum wage, women's unpaid work would add 15 to 17% to India's GDP (Oxfam India). Budget 2026-27 announced training of 1.5 lakh multi-skilled caregivers under NSQF. Need to invest in childcare, paid family leave and elderly care infrastructure. Low female labour force participation India has one of the lowest FLFPR in the world despite rising female education. Marriage and motherhood penalty: women are 55.2% more likely than men to take career breaks (Global Gender Gap Report 2025). Lack of safe transport and workplaces. Unpaid care burden at home. Workplace discrimination and gender pay gap. Withdrawal of educated women from the workforce, known as the U-shaped curve . Way forward Affordable childcare, safe transport, flexible work. Skill training aligned with market demand. Workplace inclusion and pay parity. Recognition and redistribution of unpaid care work. Rising manosphere and gender equality The manosphere refers to online communities promoting aggressive masculinity and anti-feminist content. UN Women has warned it is a serious threat to gender equality. Promotes ideologies such as AWALT (All Women Are Like That) . Spreads through algorithm-driven social media platforms. Normalises violence and misogyny among young men. Need for legal action, media literacy and positive male role models. EU's Digital Services Act prohibits misogynistic content. India can learn from the UK Online Safety Act to regulate digital platforms. SELF HELP Groups AND Economic Empowerment PYQ 2025 Quote PYQ 2025 (10 marks): Women's social capital complements in advancing empowerment and gender equity. Explain. Significance of women-led SHGs SHGs have mobilised over 9 crore rural poor women under DAY-NRLM. 65% of rural SHG members improved their incomes between FY19 and FY24 (SBI Report). SHG members as Banking Correspondent Sakhis helped lower gross NPAs to 1.6% . SHGs build pressure groups that highlight alcoholism, open defecation and women's health. Project eShakti by NABARD digitises SHG records. Challenges Socio-cultural rigidities of caste, patriarchy and illiteracy. Regional disparity: 68.56% of SHGs are concentrated in South India (NABARD). Elite capture by better-off members. Lack of digital skills and access to markets. Social Capital AND Gender Equity PYQ 2025 Key point Social capital refers to networks, trust and norms that enable collective action. Women's social capital includes SHGs, mahila mandals, neighbourhood groups and online sisterhoods. How social capital advances empowerment Builds collective bargaining power as SHGs negotiate better prices and rights. Creates information networks that spread awareness of schemes and rights. Provides emotional and economic support in crises. Enables political voice , as seen in women panchayat leaders. Breaks isolation that traps women within four walls. Way forward / key point The Kudumbashree movement in Kerala is a global model of how women's social capital transforms lives. Such social capital complements formal schemes by ensuring last-mile reach and dignity. Gender Equality, Gender Equity AND Women Empowerment: Concepts Concept Meaning Gender Equality Same rights, opportunities and treatment for all genders Gender Equity Fairness through different treatment based on different needs to achieve equal outcomes Women Empowerment Process of gaining power, agency and control over one's own life Way forward / key point Equity recognises that giving the same to unequally placed people will reproduce inequality. Maternity leave for women is gender equity, not inequality. Empowerment is the goal , equality is the destination and equity is the path ."}, {"c": "1", "n": "Social Justice Foundations, Welfare Design and Women", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Define vulnerability. Proneness to harm, exploitation or deprivation from external social, economic or structural forces; a condition produced by society, not a personal failing Four features of vulnerability? Group nature; structural roots; multidimensional impact; self-reinforcing cycle Which Act first classified SC, ST, OBC? Government of India Act, 1935 Nodal ministry? Ministry of Social Justice and Empowerment What is intersectionality? One person belongs to several vulnerable categories at once, so disadvantages compound Three layers of constitutional social justice? Preamble; Fundamental Rights (14, 15, 17, 21, 23); DPSP (38, 39, 41, 46, 47) Formal vs substantive equality? Formal = equality before law; substantive = correcting historical wrongs in outcomes Top 10% and bottom 50% income share? More than 57% and around 13% (WIR 2022) Public health spend vs recommended? 1.8% of GDP vs 2.5% Education spend vs NEP target? About 4.6% vs 6% of GDP Gender Budget share 2026-27? 9.37% of Union Budget Constitutional basis of welfare schemes? Articles 38, 39, 46, 47 Five goals of welfare schemes (name three). Poverty and inequality reduction; human capital; public goods; crisis resilience; equity Constitutional permission for positive discrimination? Articles 15(4), 15(5), 16(4); Indra Sawhney (1992) Honest position on discrimination debate? Differential by design, not discriminatory in intent CSS restructuring: committees? B. K. Chaturvedi Committee 2011; NITI Aayog Sub-Group of CMs 2015 CSS consolidated from over 200 to about? 28 umbrella schemes Funding ratios? 60:40, 75:25, 90:10 (special category States) 15th Finance Commission vertical devolution? 41% Five causes of poor beneficiary awareness/involvement? Awareness deficit; information asymmetry; no voice; weak grievance redressal; low ownership Ghost ration cards and Bihar PDS leakage? About 4.4 crore; 30 to 40% foodgrains (CAG) What is the JAM Trinity? Jan Dhan, Aadhaar, Mobile Protective ring effect? Reservation builds a comfort zone but does not push beneficiaries into entrepreneurship MMR and SDG target? 97 per 1 lakh live births (SRS 2018-20); SDG target 70 Sex ratio at birth? 907 girls per 1000 boys (CRS 2018-20) FLFPR? 41.7% (PLFS 2023-24) Rural casual wage gap? Women Rs 286/day vs men Rs 407 (PLFS 2024) Unpaid domestic work, women vs men? 330 vs 101 minutes a day (Time Use Survey 2024) Seven ways to change patriarchal attitudes (name four). Engage men and boys; media; curriculum; religious leaders; workplace; legal reform; recognise unpaid work Article 42 and Article 51A(e)? Humane work and maternity relief; duty to renounce practices derogatory to women Articles 243D and 243T? One third reservation for women in PRIs and ULBs POSH Act basis and ICC threshold? Vishaka Guidelines 1997; ICC where 10 or more employees; Local Complaints Committees for informal sector Surrogacy Act 2021? Altruistic only; married Indian couples with infertility; National and State Boards Maternity leave since 2017? 26 weeks (Maternity Benefit Amendment Act) Domestic Violence Act 2005 remedies? Protection, residence and monetary relief; recognises physical, emotional, sexual, economic abuse Lakhpati Didi: year, ministry scheme, income, target? 2023; DAY-NRLM; Rs 1 lakh or more annual household income; 3 crore target (11 lakh felicitated at Jalgaon) PMMVY benefit? Rs 5000 for the first child Mudra Mahila Udhyami limit? Collateral-free up to Rs 10 lakh Nari Shakti Vandan Adhiniyam 2023? 33% reservation in Lok Sabha and State Assemblies Mission Shakti has which two arms? Sambal (safety) and Samarthya (empowerment) Marital rape exemption? Exception 2 to IPC s.375 (now BNS s.63); Delhi HC split verdict 2022; pending in SC Women in STEM? 27% (AISHE 2021-22) What is the purple economy? Care economy, paid and unpaid care work Women in global unpaid care work? Over 75% (ILO); would add 15 to 17% to India GDP (Oxfam India) U-shaped curve? Withdrawal of educated women from the workforce SHG reach under DAY-NRLM? Over 9 crore rural poor women South India share of SHGs? 68.56% (NABARD) How does social capital help women? (four) Collective bargaining; information networks; crisis support; political voice; breaks isolation Equality vs equity vs empowerment? Same treatment; fair different treatment; gaining power and agency"}, {"c": "1", "n": "Social Justice Foundations, Welfare Design and Women", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts in Start Here)"}, {"c": "1", "n": "Social Justice Foundations, Welfare Design and Women", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards"}, {"c": "2", "n": "Children, Youth, Elderly and Persons with Disabilities", "id": "1-children-as-a-vulnerable-section-status", "t": "1 · Children AS A Vulnerable Section · Status · National Policy 2013 · Juvenile Justice · Pocso", "x": "1 · Children AS A Vulnerable Section · Status · National Policy 2013 · Juvenile Justice · Pocso # Handout only · Saarthi IAS Exam lens Priority: High. Mains PYQs quoted: Mains 2016 (National Child Policy provisions and implementation) · Social Justice handout pp. 12-15. Prelims PYQs quoted: none quoted in the material. In simple words Children are 39% of the population and the largest vulnerable group because they depend entirely on adults. The framework is layered: Articles 21A, 24, 39(e)-(f), 45, 51A(k); National Policy on Children 2013 (below 18, four priorities); JJ Act 2015; POCSO 2012 with the 2019 and 2020 additions; and the 2024 Supreme Court ruling that possessing CSEAM is itself an offence. Status AND Challenges OF Children IN India Key point Children form 39% of India's population, making them the largest vulnerable group . Their vulnerability is amplified by complete dependence on adults and inability to advocate for themselves. Key challenges Malnutrition: 29.3% of children under 5 are stunted (NFHS 6). Out of school children: estimated at over 60 lakh (UDISE). Child labour: 1.01 crore children aged 5 to 14 are working (Census 2011). Child marriage continues despite legal prohibition. Sexual abuse: POCSO cases keep rising. Mental health crisis: 23% of Indian school children face mental health issues (NIMHANS). Digital harms: 60% of children at risk of digital addiction. Climate vulnerability: 24.1 million children affected annually by climate disasters (UNICEF). Constitutional Safeguards FOR Children Key point India has a layered framework of constitutional, statutory and policy instruments for child protection. Provision Protection Articles 14, 15, 15(3) Equality and special provisions Article 21A Free and compulsory education for children aged 6 to 14 Article 23 Prohibits trafficking and forced labour Article 24 Prohibits employment of children below 14 in hazardous work Article 39(e) and (f) Ensures healthy development Article 45 Early childhood care and education Article 51A(k) Parents' duty to provide education National Policy ON Children, 2013 PYQ 2016 Quote PYQ 2016 (12.5 marks): Examine the main provisions of the National Child Policy and throw light on the status of its implementation. Key point The 2013 policy replaced the 1974 policy and recognises every person below 18 as a child. Key provisions Defines children as assets and citizens with rights, not as property . Lists survival, health, nutrition, education, development, protection and participation as the key priorities (the handout says four key priorities and lists these). Mandates a National Plan of Action for Children . Establishes a National Coordination and Action Group for monitoring. Calls for inter-sectoral coordination across health, education and social welfare. Status of implementation National Plan of Action for Children 2016 operationalised the policy. ICDS, POSHAN Abhiyaan, Samagra Shiksha, Mission Vatsalya, Mission Saksham Anganwadi form the delivery network. Implementation gaps remain in convergence between line departments. Budgetary allocation for children remains below the recommended 5% of Union Budget . NCPCR and SCPCRs are statutory bodies for monitoring but suffer from understaffing . Value addition Handout inconsistency: it says the policy lists \"four key priorities\" but names seven items. Reproduce the seven named items in an answer. Juvenile Justice System Key point The Juvenile Justice (Care and Protection of Children) Act, 2015 governs children in conflict with law and children in need of care and protection. Key provisions Defines child as anyone below 18 years . Allows trial of 16 to 18 year olds as adults in heinous offences after Juvenile Justice Board assessment (post-Nirbhaya amendment). Establishes JJBs, Child Welfare Committees, Special Juvenile Police Units . Provides for adoption through CARA . 2021 Amendment gave CWCs stronger oversight on Child Care Institutions. Concerns Adult-like trial of 16 to 18 year olds raises ethical questions. Many CCIs are unregistered and unsafe. Shortage of trained personnel and infrastructure. Pocso ACT AND Rules 2020 Key point The Protection of Children from Sexual Offences (POCSO) Act, 2012 is India's primary law against child sexual abuse. Key features Gender-neutral definition of child as anyone below 18. Three categories of offences: sexual assault, sexual harassment, child pornography . Special Courts for speedy trial. 2019 Amendment introduced the death penalty for aggravated penetrative sexual assault. Mandates child-friendly procedures for recording statements. POCSO Rules 2020 Mandatory police verification of school and care home staff. Procedures for reporting child sexual abuse material . State governments to formulate a child protection policy of zero tolerance . Periodic training and sensitisation for all persons in contact with children. Age-appropriate educational material on personal safety. In the news (Saarthi IAS CA; verify dates) Supreme Court 2024 on CSEAM: overturned a Madras HC ruling and held that possession and storage of Child Sexual Exploitative and Abuse Material (CSEAM) is itself an offence under POCSO . The Court recommended changing terminology from \"child pornography\" to CSEAM."}, {"c": "2", "n": "Children, Youth, Elderly and Persons with Disabilities", "id": "2-children-schemes-child-labour-child-marr", "t": "2 · Children: Schemes · Child Labour · Child Marriage · Cseam · Street Situations · Student Mental Health", "x": "2 · Children: Schemes · Child Labour · Child Marriage · Cseam · Street Situations · Student Mental Health # Handout only · Saarthi IAS Exam lens Priority: High. Mains PYQs quoted: None quoted in the handout · Social Justice handout pp. 14-16. Prelims PYQs quoted: none quoted in the material. In simple words Delivery runs on ICDS, Mission Saksham Anganwadi and POSHAN 2.0, Samagra Shiksha, PM POSHAN, Mission Vatsalya and Childline 1098. Contemporary issues: child labour (Act of 2016, ILO 138 and 182), child marriage, CSEAM, children in street situations and student mental health (UMMEED, Manodarpan). Welfare Schemes AND Initiatives FOR Children Scheme Focus Integrated Child Development Services (ICDS) Nutrition, immunisation, pre-school education for under 6 Mission Saksham Anganwadi and POSHAN 2.0 Upgraded anganwadis with focus on nutrition POSHAN Abhiyaan Tackling stunting, wasting and anaemia Samagra Shiksha Abhiyan School education from pre-school to senior secondary Mid Day Meal (PM POSHAN) Nutrition in schools Mission Vatsalya Family-based care, adoption, foster care Childline 1098 24x7 emergency helpline Beti Bachao Beti Padhao Sex ratio and girl child education Khoya Paya Portal Missing and found children registry Baal Swaraj Portal (CiSS Application) Children in Street Situations UMMEED Guidelines Suicide prevention in schools Contemporary Issues Concerning Children Child labour 1.01 crore working children aged 5 to 14 (Census 2011) and approximately 10.1 million as per ILO-UNICEF estimates. India ratified ILO Conventions 138 and 182 in 2017 . Child Labour (Prohibition and Regulation) Amendment Act, 2016 bans all child labour below 14 and hazardous work for 14 to 18. PENCIL portal for online complaints and rehabilitation. National Child Labour Project for rehabilitation through bridge schools. Child marriage 23.3% of women aged 20 to 24 married before 18 (NFHS 5). Prohibition of Child Marriage Act, 2006 declares such marriages voidable . Prohibition of Child Marriage (Amendment) Bill, 2021 proposes raising women's marriage age from 18 to 21. Districts in Bihar, Jharkhand, West Bengal and Rajasthan show highest prevalence. Note Cross-check: NFHS 6 (Health chapter) shows the share fell to 20.1% from 23.3% (NFHS 5) , which is the figure the Women chapter uses. Always quote the survey round with the number. Child Sexual Exploitative and Abuse Material (CSEAM) The Supreme Court's 2024 verdict criminalising mere possession of CSEAM is a major step. SC recommendations: Comprehensive sex education in schools Expert committee for POCSO awareness Victim rehabilitation and offender treatment Jharkhand's Udaan initiative cited as a model Other legal measures: IT Act 2000 with stringent penalties Intermediary Guidelines 2021 mandating tech platforms to detect CSEAM Digital Personal Data Protection Act 2023 Children in street situations NCPCR's CiSS Application under the Baal Swaraj Portal helps in identification and rehabilitation. Bal Mitra initiatives in cities like Bhubaneswar and Indore. Need for shelter, education and family reunification. Children with disabilities in anganwadis New programme to integrate children with disabilities in anganwadis launched in 2024 . Aims for early identification and intervention. Requires special training of anganwadi workers and accessibility upgrades. Mental health of students and adolescents National Mental Health Survey 2015-16 found 7.3% prevalence of psychiatric disorders among 13 to 17 year olds. NIMHANS study found 23% Indian school children with mental health problems. 27.8% undergraduate and 31.3% postgraduate medical students suffer from mental health issues. UMMEED Draft Guidelines for schools to prevent student suicides. Manodarpan initiative for psychological support. National Task Force on Mental Health and Wellbeing of Medical Students submitted its report in 2024."}, {"c": "2", "n": "Children, Youth, Elderly and Persons with Disabilities", "id": "3-youth-and-adolescents-national-youth-pol", "t": "3 · Youth AND Adolescents · National Youth Policy 2014 · Challenges · Schemes", "x": "3 · Youth AND Adolescents · National Youth Policy 2014 · Challenges · Schemes # Handout only · Saarthi IAS Exam lens Priority: Medium. Mains PYQs quoted: None quoted in the handout · Social Justice handout p. 16. Prelims PYQs quoted: none quoted in the material. In simple words Youth are those aged 15 to 29, nearly 27% of the population. The demographic gift is also a policy challenge: unemployment above 17%, a skill gap (2-4% formal training against 52% in the USA), mental health, substance abuse and migration stress. Schemes: RYSK, NYKS, NSS, MY Bharat, Skill India, Khelo India, Nasha Mukt Bharat, Yuva Sangam. Challenges Faced BY Young Adults Key point The National Youth Policy 2014 defines youth as those between 15 and 29 years . Youth comprise nearly 27% of India's population, making the country one of the youngest in the world. This demographic gift is also a policy challenge. Key challenges Unemployment and underemployment: youth unemployment is over 17% (PLFS 2023-24). Skill gap: only around 2 to 4% of workforce has formal skill training against 52% in the USA. Mental health crisis with rising anxiety, depression and suicides. Substance abuse: National Drug Survey found 3.1 crore Indians use cannabis and 2.26 crore opioids. Digital addiction and social media harms. Identity and radicalisation risks. Marriage and family pressures , especially on young women. Migration stress as youth move to cities for jobs without social support. Schemes AND Policies FOR Youth Welfare Scheme Focus National Youth Policy 2014 Defines youth and lays vision Rashtriya Yuva Sashaktikaran Karyakram (RYSK) Youth leadership and personality development Nehru Yuva Kendra Sangathan Grassroots youth clubs National Service Scheme (NSS) Volunteering in colleges MY Bharat Portal Youth volunteering and engagement Skill India Mission and PMKVY Skill training for employability Khelo India Sports and fitness ecosystem Nasha Mukt Bharat Abhiyaan De-addiction, sensitised 25.53 crore people since launch Yuva Sangam Cultural exchange under Ek Bharat Shreshtha Bharat In the news (Saarthi IAS CA; verify dates) Budget 2026-27 announced an Education to Employment and Enterprise High Powered Standing Committee to address youth employability and skill gaps in the services sector. (verify)"}, {"c": "2", "n": "Children, Youth, Elderly and Persons with Disabilities", "id": "4-elderly-and-senior-citizens-status-inter", "t": "4 · Elderly AND Senior Citizens · Status · Inter-generational GAP · Maintenance ACT 2007 · Schemes", "x": "4 · Elderly AND Senior Citizens · Status · Inter-generational GAP · Maintenance ACT 2007 · Schemes # Handout only · Saarthi IAS Exam lens Priority: Medium. Mains PYQs quoted: None quoted in the handout · Social Justice handout pp. 16-18. Prelims PYQs quoted: none quoted in the material. In simple words India is ageing fast: 10.4% are 60 plus and will exceed 20% by 2050. The elderly face economic dependence, 78% with no pension, health gaps, digital illiteracy and isolation as nuclear families replace joint ones. The framework: Articles 41 and 47, the Maintenance and Welfare of Parents and Senior Citizens Act 2007, policies of 1999 and 2011; Budget 2026-27 expands PM-JAY to 70 plus. Status AND KEY Challenges OF THE Elderly Key point India is ageing fast. Senior citizens (60 plus) comprise around 10.4% of population and will exceed 20% by 2050 (UNFPA 2023). The 70 plus population has doubled from 2.8% in 2001 to 4.3% in 2021 and is expected to double again by 2031. Key challenges Economic dependency: 70% of elderly depend on family or relatives (NITI Aayog). Pension exclusion: nearly 78% remain without any pension coverage. Health vulnerabilities including non-communicable diseases, dementia and depression. Lack of geriatric care infrastructure with very few trained geriatricians. Digital illiteracy: only 1 in 5 elderly are digitally literate. Rural-urban disparity in care access. Gender inequality: elderly women face higher widowhood, poverty and isolation. Health insurance gap: only one-fifth of 60 plus covered by insurance before PM-JAY expansion. Inter-generational Communication GAP Modern life has created a widening communication gap between elderly and younger generations Nuclear families replace joint families leaving the elderly isolated. Digital divide: elderly cannot use smartphones to connect. Different value systems lead to mutual frustration. Migration of working-age children to cities and abroad. Cultural shift from elder reverence to individualism. Way forward / key point Intergenerational programmes such as adopt-a-grandparent initiatives, school visits to old age homes and digital literacy camps by youth volunteers help bridge this gap. Senior CARE Reforms AND Schemes Constitutional and legal framework Article 41 directs the State to provide public assistance in old age. Article 47 for raising standard of living and health. Maintenance and Welfare of Parents and Senior Citizens Act, 2007 mandates children to maintain parents. National Policy on Older Persons 1999 and National Policy for Senior Citizens 2011 . Geriatric care ecosystem and caregiver training (Budget 2026-27) Building a Care Ecosystem covering geriatric and allied care services. Training of 1.5 lakh multi-skilled caregivers under NSQF. Expansion of PM-JAY for 70 plus senior citizens, offering Rs 5 lakh cover. New NIMHANS 2 and upgrading mental health institutes at Ranchi and Tezpur . Emergency and trauma care centres at district hospitals. Major scheme for elderly Focus Atal Vayo Abhyuday Yojana (AVYAY) Umbrella scheme with Rs 287.81 crore utilised (ES 2025-26) Integrated Programme for Senior Citizens Old age homes, day care centres Rashtriya Vayoshri Yojana Free assistive devices for BPL elderly National Programme for Health Care of Elderly (NPHCE) Dedicated geriatric units at district hospitals Indira Gandhi National Old Age Pension Scheme Monthly pension under NSAP SACRED Portal Employment opportunities for senior citizens Elderline 14567 National helpline for elderly SAGE Initiative Startup ecosystem for elderly care Way forward / key point The path forward requires shifting from welfare to wellbeing , building a robust care economy, integrating the elderly into productive roles and ensuring dignity in ageing."}, {"c": "2", "n": "Children, Youth, Elderly and Persons with Disabilities", "id": "5-persons-with-disabilities-rpwd-act-2016", "t": "5 · Persons WITH Disabilities · RPWD ACT 2016 · Empowerment AND Sensitisation GAPS · Supreme Court · Schemes", "x": "5 · Persons WITH Disabilities · RPWD ACT 2016 · Empowerment AND Sensitisation GAPS · Supreme Court · Schemes # Handout only · Saarthi IAS Exam lens Priority: High. Mains PYQs quoted: Mains 2017 (RPwD Act and empowerment), 2022 (Act as only a legal document without sensitisation) · Social Justice handout pp. 18-21. Prelims PYQs quoted: none quoted in the material. In simple words PwDs are 2.21% (2.68 crore) per Census 2011, though advocates say 5-8%. The RPwD Act 2016 (UNCRPD-aligned) raised recognised disabilities from 7 to 21, set 4% job and 5% higher-education reservation and made accessibility and reasonable accommodation legal duties. It is strong on rights but weak on implementation and sensitisation; the Supreme Court has pushed accessibility rules and the social model. Persons WITH Disabilities: Status Key point PwDs comprise around 2.21% of population, approximately 2.68 crore (Census 2011). Disability rights advocates argue the real figure is far higher and may reach 5 to 8% if global standards of measurement are used. Profile 69% of PwDs live in rural areas. 55% are illiterate. 44% are women. Only 34% are workers. Employment in the private sector remains less than 1% despite quotas. WHO estimates 1 billion people globally experience some form of disability. Rights OF Persons WITH Disabilities ACT, 2016 Key point The RPwD Act 2016 replaced the older 1995 Act and brought Indian law in line with the UN Convention on Rights of Persons with Disabilities (UNCRPD) , ratified by India in 2007 . Key provisions Expanded recognised disabilities from 7 to 21 types , including acid attack survivors, mental illness, learning disabilities, dwarfism and Parkinson's disease. Defines Person with Benchmark Disability as those with 40% or more disability. Reservation of 4% in government jobs and 5% in higher education. Right to free education for every child with benchmark disability aged 6 to 18 . Mandates accessibility in public buildings, transport and ICT. Chief Commissioner for PwDs at the Centre and State Commissioners as monitoring bodies. National Fund and State Funds for financial support. Special Courts and Special Public Prosecutors for offences. Number card 7 to 21 disabilities 40% benchmark 4% jobs 5% higher education ages 6-18 free education UNCRPD ratified 2007 replaced 1995 Act. Empowerment AND Inclusion Mechanisms PYQ 2017 Quote PYQ 2017 (10 marks): Does the Rights of Persons with Disabilities Act, 2016 ensure effective mechanism for empowerment and inclusion of the intended beneficiaries in the society. Discuss. Strengths Rights-based approach moving from charity to entitlement. Wider recognition of disabilities. Reasonable accommodation as a legal duty. Reservation in jobs and education. Inclusive education mandate. Accessibility standards for buildings and ICT. Implementation gaps Sugamya Bharat Abhiyan missed several deadlines for accessible buildings. Backlog of vacancies in PwD-reserved posts in central ministries. Lack of trained special educators in schools. Most courts and police stations remain inaccessible. Slow pace in framing accessibility standards under Section 40 . Sensitisation GAPS PYQ 2022 Quote PYQ 2022 (10 marks): The Rights of Persons with Disabilities Act, 2016 remains only a legal document without intense sensitisation of government functionaries and citizens regarding disability. Comment. Where sensitisation fails Government functionaries including police, judges and frontline staff lack disability awareness training. Citizens continue to use derogatory terms like \"handicapped\" and view PwDs through pity. Schools and teachers are not equipped for inclusive education. Employers see PwDs as liabilities rather than talent. Media portrays PwDs through stereotypes. Supreme Court interventions Rajive Raturi v. Union of India (2024): directed the Centre to frame mandatory rules under Section 40 for accessibility. Madhya Pradesh Judicial Services case: struck down Rule 6A disqualifying visually impaired candidates. Nipun Malhotra v. Sony Pictures (Aankh Micholi case): issued a seven-point media framework against derogatory portrayal of PwDs. The SC emphasised the principle of \"Nothing About Us Without Us\" . Way forward / key point The Court has affirmed the social model of disability , which places the burden of change on society, not on the individual with disability . Schemes AND Initiatives FOR Divyangjan Key point The term Divyangjan itself is a sensitivity reform aimed at removing stigma and recognising the divine abilities within. Budget 2026-27: two flagship schemes Divyangjan Kaushal Yojana: Dignified livelihood opportunities through industry-relevant and customised training specific to disability groups Skills aligned with each disability type to ensure employability Divyang Sahara Yojana: Timely access to high-quality assistive devices for all eligible PwDs Supports the Artificial Limbs Manufacturing Corporation of India (ALIMCO) to scale up production Integration of AI and R&D in assistive technology PM Divyasha Kendras and assistive devices PM Divyasha Kendras to be strengthened as modern retail-style centres for assistive devices. ADIP Scheme (Assistance to Disabled Persons for Purchase of Aids and Appliances) provides financial support. Sugamya Bharat App allows users to report inaccessible spaces. Other major scheme Focus Deendayal Disabled Rehabilitation Scheme (DDRS) Voluntary action for rehabilitation National Fellowship for PwDs Higher studies, M.Phil and PhD SMILE 75 Initiative Rehabilitation of persons engaged in begging Accessible India Campaign (Sugamya Bharat) Barrier-free public spaces, transport and ICT Unique Disability Identity (UDID) Single document for all benefits with colour-coded bands National Trust Act 1999 Welfare of persons with autism, cerebral palsy, mental retardation Mental Healthcare Act 2017 Rights-based mental healthcare Marrakesh Treaty Accessible books for visually impaired Recent amendments (RPwD Rules 2024) Colour-coded UDID cards with white (below 40%), yellow (40 to 80%) and blue (above 80%) bands. Processing time of 3 months for disability certificates. Online application through the UDID portal with Aadhaar. Accessibility standards extended to police stations, prisons and disaster mitigation centres . Way forward / key point The path forward requires moving from legal recognition to lived dignity through sensitisation, accessibility audits, mainstreaming PwDs in workplaces and respecting the Nothing About Us Without Us principle: no policy, law or programme should be created or decided for a marginalised group without the full and direct participation of its members."}, {"c": "2", "n": "Children, Youth, Elderly and Persons with Disabilities", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Children share of population? 39% Stunting under 5? 29.3% (NFHS 6) Child labour count? 1.01 crore aged 5 to 14 (Census 2011) Articles 21A, 24, 45? Free education 6-14; no hazardous work below 14; early childhood care and education National Policy on Children 2013? Replaced 1974 policy; child = below 18; National Plan of Action; National Coordination and Action Group Child budget share recommended? 5% of Union Budget (actual is below) JJ Act 2015: adult trial? 16-18 year olds in heinous offences after JJB assessment Bodies under JJ Act? JJBs, CWCs, SJPUs; adoption via CARA POCSO offences? Sexual assault, sexual harassment, child pornography POCSO 2019 Amendment? Death penalty for aggravated penetrative sexual assault 2024 SC ruling on CSEAM? Possession and storage is itself an offence; replace \"child pornography\" with CSEAM Childline number? 1098 (24x7) Mission Vatsalya focus? Family-based care, adoption, foster care Khoya Paya portal? Missing and found children registry ILO conventions ratified 2017? 138 (minimum age) and 182 (worst forms) Child labour Act 2016 bans? All child labour below 14; hazardous work for 14 to 18 PENCIL portal? Online complaints and rehabilitation for child labour Child marriage Act 2006: effect? Marriages voidable 2021 Bill proposes? Women's marriage age from 18 to 21 SC ruling 2024 model initiative? Jharkhand's Udaan CiSS application sits under? Baal Swaraj Portal (NCPCR) NMHS 2015-16 for 13-17 year olds? 7.3% psychiatric disorders School suicide prevention and support? UMMEED guidelines; Manodarpan Youth age band per NYP 2014? 15 to 29 years Youth share of population? Nearly 27% Youth unemployment? Over 17% (PLFS 2023-24) Formal skill training: India vs USA? 2-4% vs 52% National Drug Survey? 3.1 crore cannabis users; 2.26 crore opioids Nasha Mukt Bharat Abhiyaan reach? 25.53 crore people sensitised Yuva Sangam? Cultural exchange under Ek Bharat Shreshtha Bharat Budget 2026-27 youth step? Education to Employment and Enterprise High Powered Standing Committee Elderly share and 2050 projection? 10.4% now; above 20% by 2050 (UNFPA 2023) 70 plus share 2001 to 2021? 2.8% to 4.3%; expected to double by 2031 Pension coverage gap? Nearly 78% without any pension Elderly digitally literate? Only 1 in 5 Articles for old age? Article 41 (public assistance), Article 47 2007 Act? Maintenance and Welfare of Parents and Senior Citizens Act: children must maintain parents Older persons policies? 1999 (older persons); 2011 (senior citizens) PM-JAY expansion Budget 2026-27? 70 plus, Rs 5 lakh cover Elderline number? 14567 RVY and NPHCE? Free assistive devices for BPL elderly; geriatric units at district hospitals PwD share and Census year? 2.21% (2.68 crore), Census 2011; advocates say 5-8% RPwD Act replaced which Act? The 1995 Act; aligned with UNCRPD (ratified 2007) Disabilities recognised? 21 types (up from 7) Benchmark disability? 40% or more Reservation under RPwD? 4% government jobs; 5% higher education Free education age? 6 to 18 for benchmark disability Monitoring bodies? Chief Commissioner (Centre) and State Commissioners Rajive Raturi (2024)? Mandatory accessibility rules under Section 40 Nipun Malhotra v Sony Pictures? Seven-point media framework against derogatory portrayal Social model of disability? Burden of change on society, not the individual UDID colour bands? White below 40%; yellow 40-80%; blue above 80% Divyangjan Kaushal vs Divyang Sahara? Skilling and livelihoods; assistive devices (ALIMCO) What is SMILE 75? Rehabilitation of persons engaged in begging"}, {"c": "2", "n": "Children, Youth, Elderly and Persons with Disabilities", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts in Start Here)"}, {"c": "2", "n": "Children, Youth, Elderly and Persons with Disabilities", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards"}, {"c": "3", "n": "Scheduled Castes, Scheduled Tribes, DNT, PVTG and OBC", "id": "1-scheduled-castes-status-atrocities-manua", "t": "1 · Scheduled Castes · Status · Atrocities · Manual Scavenging · Pemsr ACT 2013 · Namaste", "x": "1 · Scheduled Castes · Status · Atrocities · Manual Scavenging · Pemsr ACT 2013 · Namaste # Handout only · Saarthi IAS Exam lens Priority: High. Mains PYQs quoted: Mains 2024 (affirmative action benefits not reaching underprivileged) · Social Justice handout pp. 21-24. Prelims PYQs quoted: none quoted in the material. In simple words SCs are 16.6% of the population with lower literacy (66.1%), land ownership and health indicators. Atrocities persist (about 57,000 cases under the SC/ST Act in 2022; conviction about 30%). Manual scavenging is the starkest caste-based occupation: 98% Dalits, 95% women. Law: PEMSR Act 2013; programme: NAMASTE (2023) covering 4,800 ULBs with Rs 349.70 crore. Status AND KEY Challenges OF SCs Key point Scheduled Castes are communities historically subjected to untouchability, social exclusion and economic deprivation . They form 16.6% of India's population (Census 2011), with highest concentration in Uttar Pradesh, West Bengal, Bihar and Tamil Nadu . Key data on SCs Population share 16.6% (Census 2011). Literacy rate 66.1% against national 73% . 71% of SC farmers work as agricultural labourers on land they do not own. IMR among SCs is 83 per 1000 live births against national average of 61.8 . Only 28% of SCs had access to electricity in 2011 against national 48% . Key challenges Caste-based discrimination in temples, schools, public spaces and workplaces. Untouchability continues in subtle forms despite Article 17 . Landlessness: most SCs are agricultural labourers without land ownership. Educational gap due to poor school infrastructure, drop-outs and hidden discrimination. Occupational segregation: SCs concentrated in stigmatised jobs like sanitation. Internal disparities: some SC sub-groups corner most benefits while others remain excluded. Political under-representation beyond reserved seats. Atrocities Against Scheduled Castes Key point Despite constitutional protection, atrocities against SCs continue to rise. NCRB 2022 recorded around 57,000 cases under the SC/ST (Prevention of Atrocities) Act. Forms of atrocities Physical violence including lynching and rape. Social boycotts and denial of public services. Caste-based humiliation in schools and workplaces. Honour crimes against inter-caste couples. Burning of houses and crops in villages. In the news (Saarthi IAS CA; verify dates) Hathras, Una and Bhima Koregaon incidents have shown that caste violence persists. Conviction rates remain low at around 30% under the SC/ST Act, reflecting weak prosecution. Mechanisms to tackle atrocities SC/ST (Prevention of Atrocities) Act, 1989 with 2015 and 2018 amendments. Exclusive Special Courts under Section 14 of the Act. National Commission for Scheduled Castes under Article 338 . Compensation under SCSP for victims. Manual Scavenging IN India Key point Manual scavenging is the starkest symbol of caste-based occupational segregation . It is officially banned but continues in practice. Scale and impact 98% of manual scavengers are Dalits and 95% are women (UN Women 2014, Shah et al. 2015). From 1993 to 2020, 1013 sewer deaths were officially recorded with rare convictions. 40 plus deaths reported in just six months of 2024 (Safai Karmachari Andolan). Out of 775 districts, 456 are now declared manual-scavenging free (January 2025). Legal framework: Prohibition of Employment as Manual Scavengers and their Rehabilitation Act, 2013 (PEMSR) Bans manual scavenging in all forms. Mandates mechanisation of sewer cleaning. Provides for rehabilitation including cash assistance, scholarships, housing and skill training. Replaced the weaker 1993 Act. Initiatives to end manual scavenging NAMASTE Scheme (National Action for Mechanised Sanitation Ecosystem) trains sewer and septic tank workers and provides PPE kits. National Safai Karamcharis Finance and Development Corporation (NSKFDC) for livelihoods. National Commission for Safai Karamcharis (NCSK). Rashtriya Garima Abhiyan for restoring dignity. Structural reasons for persistence Entrenched caste system and social stigma. Lack of alternative livelihoods and education. Poor sanitation infrastructure and slow mechanisation. Weak enforcement and apathy from authorities. Way forward / key point The way forward demands strict enforcement, full mechanisation, robust rehabilitation including land and skill , and sustained societal change through education and media. Namaste Scheme Key point Launched in 2023 by the Ministries of Social Justice and Empowerment and Housing and Urban Affairs , it seeks to ensure the safety, dignity and livelihood security of sanitation workers. It covers over 4,800 Urban Local Bodies with an outlay of ₹349.70 crore up to 2025-26. Key objectives Achieve zero sanitation f
