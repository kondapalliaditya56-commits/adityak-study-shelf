atalities . End direct contact with human faecal matter. Replace hazardous cleaning with mechanised sanitation . Promote trained workers, self-employment and sanitation enterprises. Major components Profiling of sewer and septic tank workers. Safety training, PPE kits and mechanised equipment. Health coverage under Ayushman Bharat PM-JAY. Safety devices for Emergency Response Sanitation Units . Skill training, credit and capital subsidy under the Swachhata Udyami Yojana . Coordination among urban bodies, ministries and sanitation schemes. Inclusion of waste pickers Waste pickers were included in 2024 . The Waste Picker Enumeration App aims to profile 2.5 lakh workers and provide identity cards, health insurance, PPE kits, training and livelihood support. It also recognises their contribution to the circular economy . Way forward / key point Significance: NAMASTE shifts sanitation from unsafe manual work to a mechanised and professional system . It promotes occupational safety, social security, human dignity, environmental justice and sustainable livelihoods."}, {"c": "3", "n": "Scheduled Castes, Scheduled Tribes, DNT, PVTG and OBC", "id": "2-scheduled-castes-constitutional-safeguar", "t": "2 · Scheduled Castes · Constitutional Safeguards · PCR ACT 1955 · SC/ST Atrocities ACT · Schemes", "x": "2 · Scheduled Castes · Constitutional Safeguards · PCR ACT 1955 · SC/ST Atrocities ACT · Schemes # Handout only · Saarthi IAS Exam lens Priority: High. Mains PYQs quoted: Mains 2024 (affirmative action benefits not fully reaching underprivileged) · Social Justice handout pp. 24-25. Prelims PYQs quoted: none quoted in the material. In simple words Safeguards run through Articles 14, 15(4), 16(4), 17, 23, 46, 330, 332, 335, 338 and 341. The Protection of Civil Rights Act 1955 punishes untouchability; the 1989 Atrocities Act has Special Courts (s.14), new offences in 2015 and the 2018 restoration of immediate arrest. Schemes cover scholarships, PM-AJAY, SHRESHTA, ASIIM, the Venture Capital Fund, VISVAS and more. Constitutional Framework FOR SCs Provision Protection Article 14 Equality before law Article 15(4) Special provisions for advancement of SCs Article 16(4) Reservation in public employment Article 17 Abolition of untouchability Article 23 Prohibition of trafficking and forced labour Article 46 Promotion of educational and economic interests Article 330 Reservation in Lok Sabha Article 332 Reservation in State Legislative Assemblies Article 335 Claims of SCs and STs in services Article 338 National Commission for Scheduled Castes Article 341 Specification of Scheduled Castes KEY ACTS FOR Protection OF SCs Protection of Civil Rights Act, 1955 Made the practice of untouchability in any form a punishable offence . Covers denial of access to shops, public places of worship, hotels and educational institutions. Punishment of imprisonment and fine. Scheduled Castes and Scheduled Tribes (Prevention of Atrocities) Act, 1989 Defines specific offences as atrocities with stringent punishment. Special Courts for speedy trial under Section 14 . 2015 Amendment added new offences including social boycott, garlanding with footwear and forcing to consume inedible substances . 2018 Amendment restored the original provision of immediate arrest without preliminary inquiry after the Subhash Kashinath Mahajan judgment created concerns. Key point Prohibition of Employment as Manual Scavengers and their Rehabilitation Act, 2013: covered under manual scavenging in the previous chapter. Government Initiatives AND Schemes FOR SCs Scheme Focus Scheduled Castes Sub Plan (SCSP) Earmarked funds for SC development Post Matric Scholarships for SCs 34.42 lakh beneficiaries in FY 2026 (ES) Pre Matric Scholarships for SCs 17.14 lakh beneficiaries in FY 2026 (ES) Pradhan Mantri Anusuchit Jaati Abhyuday Yojana (PM-AJAY) Adarsh Gram, hostel and skill components; 2611 Adarsh Grams declared SHRESHTA Residential education for SC students in high schools Ambedkar Social Innovation and Incubation Mission (ASIIM) Startup support for SC entrepreneurs Venture Capital Fund for SCs Supported over 160 enterprises (ES 2025-26) VISVAS Yojana (Vanchit Ikai Samooh Aur Vargon Ko Aarthik Sahayata) Credit support and interest subvention SHREYAS for SCs Higher studies abroad and in India; 3974 beneficiaries supported Mahila Adhikarita Yojana Income generation for SC women National Safai Karamcharis Finance and Development Corporation Financial assistance for sanitation workers Stand Up India Bank loans to SC, ST and women entrepreneurs PM Mudra Yojana Collateral-free loans for micro enterprises Quote PYQ 2024 (15 marks), for this and the next two chapters: Despite comprehensive policies for equity and social justice, underprivileged sections are not yet getting the full benefits of affirmative action envisaged by the Constitution. Comment. Use the internal disparities, creamy layer, low conviction rates, land alienation and implementation gaps pointed out in the SC, ST and OBC chapters."}, {"c": "3", "n": "Scheduled Castes, Scheduled Tribes, DNT, PVTG and OBC", "id": "3-scheduled-tribes-status-constitutional-p", "t": "3 · Scheduled Tribes · Status · Constitutional Provisions · PESA · Forest Rights ACT · MSP FOR MFP", "x": "3 · Scheduled Tribes · Status · Constitutional Provisions · PESA · Forest Rights ACT · MSP FOR MFP # Handout only · Saarthi IAS Exam lens Priority: High. Mains PYQs quoted: Mains 2024 (affirmative action benefits not fully reaching underprivileged) · Social Justice handout pp. 25-28. Prelims PYQs quoted: none quoted in the material. In simple words STs (8.6%, 10.45 crore) are defined under Articles 366(25) and 342. They face land alienation, displacement, forest conflicts and health gaps. The framework: Articles 15(4), 16(4), 19(5), 244 (Schedules V and VI), 275(1), 330, 338A, 342; PESA 1996 and the FRA 2006 (51.2 lakh claims, 25.1 lakh titles); and MSP for 87 minor forest produce items through TRIFED. Status AND KEY Challenges OF Tribal Population Key point Scheduled Tribes are constitutionally defined under Article 366(25) read with Article 342 . They form 8.6% of India's population. Madhya Pradesh has the highest absolute number while Lakshadweep has the highest percentage of STs. Key data on STs Population of 10.45 crore (Census 2011). 40.6% ST population below poverty line. Literacy rate of 59% against general population's 73% . Sex ratio of 990 (better than national 940 ). IMR significantly higher than national average. Criteria for identifying STs (1965 Lokur Committee) Primitive traits. Geographical isolation. Distinct culture. Shyness of contact with the general community. Economic backwardness. Memory aid · PGDSE Five Lokur criteria: P rimitive traits, G eographical isolation, D istinct culture, S hyness of contact, E conomic backwardness. Hook: \" PGDSE \" = \" P eople G uarding D ifferent S ecluded E cosystems\" (order is free). (own mnemonic) Key challenges Land alienation: tribal lands are taken for mining, dams and industry. Displacement: STs form over 40% of development-induced displaced persons despite being only 8.6% of population. Forest conflicts between conservation laws and customary rights. Health vulnerabilities: sickle cell disease, malnutrition and high maternal mortality. Educational gaps despite EMRS and tribal hostels. Cultural erosion: forced assimilation threatens tribal languages and customs. Naxalism in tribal belts reflects governance failure. Trafficking of tribal women and children. Tribal Rights Framework: Constitutional Provisions FOR STs Provision Protection Article 15(4) Special provisions for advancement Article 16(4) Reservation in public employment Article 19(5) Restrictions in tribal areas Article 46 Promotion of educational and economic interests Article 244 Schedules V and VI for tribal areas administration Article 275(1) Grants-in-aid for ST welfare Article 330 Reservation in Lok Sabha Article 338A National Commission for STs Article 342 Notification of STs Key point Schedule V covers tribal areas in 10 States with a Tribes Advisory Council . Schedule VI covers tribal areas of Assam, Meghalaya, Tripura and Mizoram with Autonomous District Councils . KEY Legislations FOR Tribal Rights Panchayats (Extension to Scheduled Areas) Act, 1996 (PESA) Extends Panchayati Raj to Schedule V tribal areas with adaptations. Mandates that the Gram Sabha has powers over land, water, forest, minor minerals and consultation in land acquisition. Tribal customs and traditions get statutory recognition. Implementation remains weak as many States have not framed PESA rules . Scheduled Tribes and Other Traditional Forest Dwellers (Recognition of Forest Rights) Act, 2006 (FRA) A landmark law that aims to undo historical injustice against forest-dwelling communities by recognising their rights over forest land and produce. Individual rights for self-cultivation and habitation up to 4 hectares . Community rights for grazing, fishing and access to water bodies. Community Forest Resource Rights for management of forests. Habitat Rights for Particularly Vulnerable Tribal Groups. Gram Sabha as the authority to determine rights. FRA implementation status 51.2 lakh claims filed as of May 2025. 44.3 lakh (85.4%) claims processed. 25.1 lakh titles distributed including 23.9 lakh individual and 1.21 lakh community titles. 69.2 lakh acres of forest land distributed from 2023 to 2026. Challenges in FRA implementation Lack of political will: projects override community rights. Bureaucratic resistance with high rejection rates and rigid evidence demands like satellite imagery. Conflict with Indian Forest Act, 1927 creating legal ambiguity. Forest Conservation Amendment Act, 2023 raised concerns about diluting Gram Sabha consent. Greater emphasis on individual rights over community forest rights. Digital barriers like VanMitra software in low-connectivity areas. Key point The SC/ST (Prevention of Atrocities) Act, 1989 also applies to STs with the same protections discussed in the SC chapters. MSP FOR Minor Forest Produce Key point Minor Forest Produce (MFP) sustains around 100 million people, mostly tribals. The Mechanism for Marketing of MFP through MSP and Development of Value Chain was launched in 2013 . Key features MSP for 87 MFP items including tendu leaves, mahua, sal seeds, tamarind and bamboo. TRIFED as the nodal agency. Van Dhan Vikas Kendras for value addition. 15 SHGs per cluster with around 300 beneficiaries. 100% central funding with Rs 15 lakh per cluster. Bamboo was reclassified as MFP in 2017 , enabling free harvest by tribals, a major income booster. Challenges State procurement agencies under-equipped for large-scale procurement. Low awareness among tribals about MSP rates. Exploitation by middlemen. Inadequate storage and processing infrastructure."}, {"c": "3", "n": "Scheduled Castes, Scheduled Tribes, DNT, PVTG and OBC", "id": "4-denotified-nomadic-and-semi-nomadic-trib", "t": "4 · Denotified, Nomadic AND Semi-nomadic Tribes · PVTGs · Tribal Schemes · Nehru's Panchsheel", "x": "4 · Denotified, Nomadic AND Semi-nomadic Tribes · PVTGs · Tribal Schemes · Nehru's Panchsheel # Handout only · Saarthi IAS Exam lens Priority: High. Mains PYQs quoted: None quoted in the handout · Social Justice handout pp. 26-28. Prelims PYQs quoted: none quoted in the material. In simple words DNTs were branded \"born criminal\" by the Criminal Tribes Act 1871. They remain the most neglected, often outside SC/ST/OBC lists. PVTGs (75 groups across 18 States and UTs, Odisha 13) were identified by the Dhebar Commission (1973). Flagship: Dharti Aaba Janjatiya Gram Utkarsh Abhiyan (2024, Rs 79,156 crore, 63,000 villages). Nehru's Panchsheel still guides tribal policy. Denotified, Nomadic AND Semi-nomadic Tribes Key point Denotified Tribes (DNTs) are communities that were notified as \"born criminal\" under the Criminal Tribes Act, 1871 during British rule. They were denotified after Independence but the stigma continues. Key facts DNTs are the most neglected, marginalised and deprived communities. Many do not figure in SC, ST or OBC lists, creating exclusion from welfare. Idate Commission (2014) identified 1262 denotified, nomadic and semi-nomadic communities. 1949 Ayyangar Committee recommended repeal of the Criminal Tribes Act. 1953 Kalelkar Committee suggested calling them Denotified Communities. 2008 Renke Commission estimated DNT population at around 10 to 11 crore . 2014 Idate Commission prepared draft lists for inclusion in SC, ST, OBC. Government initiatives National Commission for Denotified, Nomadic and Semi-Nomadic Tribes (NCDNT). Development and Welfare Board for DNTs, NTs and SNTs. SEED (Scheme for Economic Empowerment of DNT Communities): free coaching, health insurance, livelihood support. Dr Ambedkar Pre Matric and Post Matric Scholarships. Nanaji Deshmukh Scheme for construction of hostels. Demands Constitutional recognition through a separate schedule . Separate Census column in the proposed 2027 caste enumeration. Identity documents for accessing rights and services. Particularly Vulnerable Tribal Groups (PVTGs) Key point PVTGs are a sub-category of STs identified as the most marginalised tribal communities. The Dhebar Commission (1973) first identified them as Primitive Tribal Groups ; they were renamed PVTGs in 2006 . Key facts 75 PVTGs spread across 18 States and UTs. Odisha has the highest number with 13 PVTGs. Andaman tribes like Great Andamanese, Jarawa, Onge, Sentinelese and Shompen are among the most vulnerable. Identification criteria Pre-agricultural level of technology. Low literacy levels. Economic backwardness. Declining or stagnant population. Memory aid · PLED PVTG criteria: P re-agricultural technology, L ow literacy, E conomic backwardness, D eclining population: \"a PLED for help\" (order is free). (own mnemonic) Issues concerning PVTGs Declining population: Great Andamanese declined from 3500 in 1858 to just 43 in 2001 . Poor health with high IMR and malnutrition. Low literacy ranging from 10% to 44% . Livelihood crisis due to deforestation and conservation policies. Exploitation by middlemen in MFP trade. Recent positive developments Bharia PVTG (MP), Kamar and Baiga (Chhattisgarh) received Habitat Rights under FRA. Pradhan Mantri PVTG Development Mission launched with Rs 15,000 crore allocation for 3 years. Schemes FOR Tribal Welfare Dharti Aaba Janjatiya Gram Utkarsh Abhiyan (launched 2024; flagship, focus on saturation of basic facilities) Targets 63,000 tribal villages benefiting around 5 crore tribal people. Coverage of 17 ministries for convergence. Outlay of Rs 79,156 crore over 5 years . Focus on infrastructure, social development, livelihoods and skill development. Other major tribal scheme Focus Eklavya Model Residential Schools (EMRS) Quality education for ST children in remote areas Pradhan Mantri Vanbandhu Vikas Yojana Integrated tribal development Pradhan Mantri Adi Adarsh Gram Yojana (PMAAGY) Model tribal villages Pradhan Mantri Khanij Kshetra Kalyan Yojana (PMKKKY) Development in mining-affected areas through DMF Pradhan Mantri PVTG Development Mission Saturation of PVTG habitations Scheme for Development of PVTGs Housing, agriculture, animal husbandry Tribal Sub Plan Earmarked funds in central and state budgets Vanbandhu Kalyan Yojana Skill development for tribal youth National Scheduled Tribes Finance and Development Corporation Credit support for ST enterprises Tribal Cooperative Marketing Federation (TRIFED) Marketing of tribal products and Van Dhan Yojana Panchsheel FOR Tribal Development (nehru) Five principles 1. People should develop along the lines of their own genius. 2. Tribal rights in land and forest should be respected. 3. A team of their own people should be trained for development work. 4. Tribal areas should not be over-administered. 5. Results should be judged not by statistics but by the quality of human character. Way forward / key point These principles remain remarkably relevant today."}, {"c": "3", "n": "Scheduled Castes, Scheduled Tribes, DNT, PVTG and OBC", "id": "5-other-backward-classes-article-340-ncbc", "t": "5 · Other Backward Classes · Article 340 · NCBC · 102ND AND 105TH Amendments · Challenges · Schemes", "x": "5 · Other Backward Classes · Article 340 · NCBC · 102ND AND 105TH Amendments · Challenges · Schemes # Handout only · Saarthi IAS Exam lens Priority: High. Mains PYQs quoted: Mains 2024 (affirmative action benefits not fully reaching underprivileged) · Social Justice handout pp. 28-29. Prelims PYQs quoted: none quoted in the material. In simple words OBCs are identified under Article 340; the Mandal Commission put them at 52% (the handout says current figures may be higher). The 102nd Amendment (2018) gave the NCBC constitutional status (Article 338B); the 105th (2021) restored States' power to identify SEBCs after the Maratha judgment. Problems: heterogeneity, internal disparity, no caste data since 1931, creamy layer, weak representation. Status AND Challenges OF OBCs Key point OBCs are socially and educationally backward classes identified under Article 340 . They form the largest backward group in India, with the Mandal Commission estimating their share at 52% of population, though current figures may be higher. Constitutional framework Article 15(4) for educational provisions. Article 16(4) for employment reservation. Article 340 allowing the President to appoint commissions to investigate OBC conditions. Article 338B established the NCBC with constitutional status. Key Acts and bodies 102nd Constitutional Amendment Act, 2018 granted constitutional status to the National Commission for Backward Classes (NCBC) . 105th Constitutional Amendment, 2021 restored States' power to identify SEBCs after the Maratha reservation judgment. National Backward Classes Finance and Development Corporation (NBCFDC) for credit and training. Key challenges Heterogeneity: OBCs include hundreds of castes with varying status. Internal disparity: dominant OBC groups corner most benefits. Lack of caste data: Mandal Commission used 1931 Census estimates. Creamy layer issues with criteria not uniformly applied. Educational backwardness with lower GER in higher education. Limited representation in higher bureaucracy and judiciary. Memory aid · H-I-L-C-E-L Sentence (order is free): H ard I ssues L eave C lasses E xcluded L ongest = H eterogeneity, I nternal disparity, L ack of caste data, C reamy layer, E ducational backwardness, L imited representation. (own mnemonic) Schemes FOR OBC Welfare Scheme Focus Pre and Post Matric Scholarships for OBCs Educational support National Fellowship for OBCs M.Phil and PhD support PM YASASVI Scheme Scholarships for OBC, EBC and DNT students in higher education PM DAKSH (Pradhan Mantri Dakshta Aur Kushalta Sampann Hitgrahi) Skill development through portal and mobile app Shilp Sampada Scheme Technical skills in traditional crafts Saksham Scheme for Loan to OBC Youth Concessional loans for entrepreneurship Nai Swarnima Scheme for Women Loans up to Rs 1 lakh for OBC women Stand Up India Bank loans for SC, ST, OBC women entrepreneurs NBCFDC Financial assistance and training Reservation in Education and Employment 27% reservation under Mandal framework"}, {"c": "3", "n": "Scheduled Castes, Scheduled Tribes, DNT, PVTG and OBC", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. SC population share and literacy? 16.6% (Census 2011); literacy 66.1% vs national 73% SC IMR vs national? 83 vs 61.8 per 1000 SC farmers as agricultural labourers? 71% Atrocity cases NCRB 2022? About 57,000 under SC/ST Act; conviction around 30% Special Courts under which Section? Section 14 of the SC/ST Act NCSC under which Article? Article 338 Manual scavengers: Dalit and women share? 98% and 95% Sewer deaths 1993-2020? 1013 officially recorded Districts declared manual scavenging free (Jan 2025)? 456 of 775 PEMSR Act 2013 re "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts in Start Here)"}, {"c": "3", "n": "Scheduled Castes, Scheduled Tribes, DNT, PVTG and OBC", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards"}, {"c": "4", "n": "Minorities, LGBTQIA+ and the Way Ahead for Vulnerable Sections", "id": "1-minorities-constitutional-safeguards-sac", "t": "1 · Minorities · Constitutional Safeguards · Sachar Committee · Ranganath Mishra Commission · Schemes", "x": "1 · Minorities · Constitutional Safeguards · Sachar Committee · Ranganath Mishra Commission · Schemes # Handout only · Saarthi IAS Exam lens Priority: High. Mains PYQs quoted: Mains 2024 (affirmative action benefits not fully reaching underprivileged) · Social Justice handout pp. 29-31. Prelims PYQs quoted: none quoted in the material. In simple words The Constitution uses \"minority\" without defining it; the NCM Act 1992 notifies six religious minorities (19.3% in 2011). Safeguards: Articles 14, 15, 25-30, 350A. The Sachar Committee (2006) found Muslims lag behind even SCs/STs on many indicators; the Ranganath Mishra Commission (2007) proposed 15% reservation (10% Muslims, 5% others). The Ministry of Minority Affairs (2006) runs scholarships and skill schemes. Status AND Challenges OF Minorities Key point The Constitution uses the term minority in several articles without defining it . The National Commission for Minorities Act, 1992 notifies six religious minorities: Muslims, Sikhs, Christians, Buddhists, Zoroastrians (Parsis) and Jains . Memory aid · MSCBZJ Six notified minorities: M uslims, S ikhs, C hristians, B uddhists, Z oroastrians, J ains. Sentence (order is free): M any S mall C ommunities B uild Z est J ointly. (own mnemonic) Community (Census 2011) Population (crore) Share (%) Hindu 96.63 79.8 Muslim 17.22 14.2 Christian 2.78 2.3 Sikh 2.08 1.7 Buddhist 0.84 0.7 Jain 0.45 0.4 Others 0.79 0.7 Key point Religious minorities form approximately 19.3% of the population. Constitutional safeguards Article 14: equality before law. Article 15: prohibition of religious discrimination. Article 25: freedom of religion. Article 26: freedom to manage religious affairs. Article 27: freedom from religious taxes. Article 28: freedom from religious instruction in State-funded education. Article 29: protection of cultural and educational rights of minorities. Article 30: right of minorities to establish and administer educational institutions. Article 350A: instruction in mother tongue at primary stage. Number card Articles 25-28 religion 29-30 cultural and educational 350A mother tongue 6 notified minorities 19.3% . Key challenges Socio-economic backwardness , especially among Muslims, as documented by the Sachar Committee. Communal tensions and riots. Identity preservation under cultural assimilation pressure. Under-representation in police, judiciary, civil services. Educational gaps with high dropout rates. Targeted violence including lynchings and hate crimes. Ghettoisation in urban areas. Sachar Committee Report (2006) Key point Commissioned by PM Manmohan Singh , the Justice Rajinder Sachar Committee evaluated the socio-economic and educational status of Muslims. Key findings Muslims lag behind even SCs and STs in many development indicators. Female literacy among Muslims at 51.9% , below the national female average of 65.46% . 25% of Muslim children aged 6 to 14 either never attended or dropped out of school. Only 4% undergraduate and 8% postgraduate representation in premier colleges. Female workforce participation among Muslim women at just 25% against 80% Hindu women. Only 27% urban Muslims in regular jobs against 49% upper-caste Hindus. Muslim representation in defence forces at just 4% . Value addition Verify: the 25% against 80% female workforce figure and the other Sachar numbers are reproduced exactly as the handout prints them; confirm against the report before quoting in an answer. Recommendations Equal Opportunity Commission for redressal of discrimination in jobs, education, housing. Better data collection disaggregated by religion. Inclusive policies in Muslim-concentrated districts. Increased representation in public bodies. Special development programmes in minority-dominated areas. Ranganath Mishra Commission Report (2007) Key point The National Commission for Religious and Linguistic Minorities was established in 2004 and headed by Justice Ranganath Mishra . Key recommendations 15% reservation for minorities in education and government jobs, of which 10% for Muslims and 5% for other minorities . Apply minority reservation in flagship schemes like MGNREGA. Strengthen the Commission for Minority Educational Institutions with wider powers. Set up a National Coordination Committee under RBI for credit access to minorities. Increase budgetary allocation for minority welfare. Periodic assessment of minority schemes. Way forward / key point Implementation of these reports remains partial. The 15 Point Programme for Welfare of Minorities captures some of these recommendations. Welfare Schemes FOR Minorities Key point The Ministry of Minority Affairs was created in 2006 as a dedicated administrative structure. Scheme Focus Pre Matric Scholarship Class 1 to 10 for minority students Post Matric Scholarship Class 11 and above Merit cum Means Scholarship Professional and technical courses Maulana Azad National Fellowship (discontinued 2022) M.Phil and PhD support Nai Manzil School drop-out education and skill training Nai Roshni Leadership development for minority women Seekho aur Kamao Skill development USTTAD Upgrading skills in traditional arts and crafts Hamari Dharohar Preservation of cultural heritage of minorities Jiyo Parsi Support to Parsi community for population stabilisation Pradhan Mantri Jan Vikas Karyakram (PMJVK) Infrastructure development in minority concentration areas Pradhan Mantri Virasat ka Samvardhan (PM VIKAS) Skill upgradation and entrepreneurship Maulana Azad Education Foundation (MAEF) Educational empowerment National Minorities Development and Finance Corporation (NMDFC) Concessional loans Way forward / key point The way forward: implementing Sachar Committee recommendations, strengthening data collection, ensuring inclusive growth in minority districts and protecting against communal violence through stronger laws and police reforms."}, {"c": "4", "n": "Minorities, LGBTQIA+ and the Way Ahead for Vulnerable Sections", "id": "2-lgbtqia-community-nalsa-navtej-johar-sup", "t": "2 · Lgbtqia+ Community · Nalsa · Navtej Johar · Supriyo · Transgender Persons ACT 2019 · State BEST Practices", "x": "2 · Lgbtqia+ Community · Nalsa · Navtej Johar · Supriyo · Transgender Persons ACT 2019 · State BEST Practices # Handout only · Saarthi IAS Exam lens Priority: High. Mains PYQs quoted: None quoted in the handout · Social Justice handout pp. 31-32. Prelims PYQs quoted: none quoted in the material. In simple words LGBTQIA+ identities fall under SOGIESC. The legal arc: NALSA (2014) third gender and self-determination; Naz (2009) reversed by Koushal (2013); Puttaswamy (2017) privacy; Navtej Johar (2018) read down Section 377; Supriyo (2023) no marriage equality. The Transgender Persons (Protection of Rights) Act 2019 and schemes like SMILE and Garima Grehs exist, but jobs, schooling, health and family rejection remain serious gaps. Status, Rights AND Recent Developments Key point The LGBTQIA+ community includes Lesbian, Gay, Bisexual, Transgender, Queer, Intersex, Asexual and other identities under SOGIESC (Sexual Orientation, Gender Identity, Gender Expression and Sex Characteristics). Key facts Census 2011 recorded around 4.9 lakh transgender persons, though community estimates suggest much higher. Includes hijras, kinnars, aravanis and jogtas as culturally distinct groups. India recognises transgender as the Third Gender . Legal Turning Points 2009 Naz Foundation v. NCT Delhi: decriminalised consensual homosexuality. 2013 Reversed in Suresh Kumar Koushal . 2014 NALSA v. Union of India: recognised transgender as third gender and affirmed their right to self-determination of gender identity . 2017 Puttaswamy judgment: recognised right to privacy as a fundamental right. 2018 Navtej Singh Johar v. Union of India: read down Section 377 and decriminalised consensual same-sex relations. 2023 Supriyo v. Union of India: declined to grant marriage equality but recognised the need for legal protection of queer relationships. Continuing challenges No legal recognition of same-sex marriage. Lack of inheritance, adoption and insurance rights for queer couples. Workplace discrimination and harassment. Limited healthcare access, especially mental health. Family rejection leading to homelessness. Transgender Persons Protection Framework Transgender status and challenges 92% of transgender persons denied jobs due to identity (NHRC 2018). Only 6% formally employed. Nearly 60% never attended school due to harassment. 89% face employment challenges despite qualifications. HIV prevalence at 3.1% among transgenders. Mental health issues including depression and suicidal tendencies are prevalent. High violence including rape and abuse. Lack of gender-neutral toilets and accessible facilities. Initiative Focus Transgender Persons (Protection of Rights) Act, 2019 Anti-discrimination framework National Portal for Transgender Persons Online certificate and ID card SMILE Scheme Support for marginalised individuals for livelihood and enterprise, including rehabilitation of transgender persons; 23 Garima Grehs in 17 States and UTs (ES 2025-26) National Council for Transgender Persons Policy guidance and grievance redressal Garima Grehs Shelter homes for transgender persons State best practices Odisha became the first State to provide food grains, pension, health, education and housing benefits to transgender persons under the BPL category. Karnataka became the first State to provide 1% reservation in government services. Kerala Transgender Policy 2015 is the first comprehensive State policy covering male, female and intersex. Sakaalyam Scheme (Kerala) for vocational training and employment. Tamil Nadu Welfare Board for transgender persons. Way forward / key point The path forward requires moving from protection to inclusion , addressing marriage and family rights, ensuring workplace inclusion through quotas and sensitisation, and treating LGBTQIA+ rights as a constitutional and human rights issue, not a social favour ."}, {"c": "4", "n": "Minorities, LGBTQIA+ and the Way Ahead for Vulnerable Sections", "id": "3-way-ahead-for-vulnerable-sections-in-ind", "t": "3 · WAY Ahead FOR Vulnerable Sections IN India · FOUR Parallel Reforms", "x": "3 · WAY Ahead FOR Vulnerable Sections IN India · FOUR Parallel Reforms # Handout only · Saarthi IAS Exam lens Priority: High. Mains PYQs quoted: Mains 2019, 2013, 2023, 2024 (conclusion for any welfare or vulnerable-section answer) · Social Justice handout p. 33. Prelims PYQs quoted: none quoted in the material. In simple words Welfare schemes carry India's commitment to substantive equality, but the gap between intent and outcome is the biggest challenge. Four parallel reforms: sensitisation, convergence, beneficiary voice and participation, and data-driven targeting. True social justice is when the most marginalised within marginalised groups access opportunity, dignity and voice on equal terms. WAY Ahead FOR Vulnerable Sections IN India Key point Welfare schemes for vulnerable sections represent India's constitutional commitment to substantive equality . Yet the gap between intent and outcome remains the biggest challenge. Performance suffers because of poor awareness, weak implementation, exclusion errors, social attitudes that resist change and inadequate beneficiary participation in scheme design. Four parallel reforms 1. Sensitisation: to change mindsets of functionaries and citizens beyond just legal documents. 2. Convergence: between line departments, Centre and States and the social capital of communities. 3. Voice and participation: of beneficiaries at every stage of the policy process, from design to social audit. 4. Data-driven targeting: through caste enumeration, MPI and outcome-based monitoring. Memory aid · S-C-V-D Sentence (order is free): S mart C itizens V alue D ignity = S ensitisation, C onvergence, V oice and participation, D ata-driven targeting. (own mnemonic) Way forward / key point Closing line for answers: true social justice is achieved not when the State simply runs schemes but when the most marginalised within marginalised groups can access opportunity, dignity and voice on equal terms with the rest of society. As Dr Ambedkar said, political democracy must rest on the bedrock of social and economic democracy ."}, {"c": "4", "n": "Minorities, LGBTQIA+ and the Way Ahead for Vulnerable Sections", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Notified minorities under NCM Act 1992? Muslims, Sikhs, Christians, Buddhists, Zoroastrians (Parsis), Jains Religious minorities share (2011)? About 19.3% (Muslim 14.2%, Christian 2.3%, Sikh 1.7%) Articles for minorities? 25-28 religious freedoms; 29-30 cultural and educational; 350A mother tongue primary instruction Sachar Committee year and finding? 2006; Muslims lag behind even SCs/STs on many indicators Sachar: female literacy among Muslims? 51.9% vs national female 65.46% Sachar recommends? Equal Opportunity Commission; religion-disaggregated data; inclusive policy in Muslim districts; representation; development programmes Ranganath Mishra Commission: year and set up? 2007; National Commission for Religious and Linguistic Minorities (2004) Ranganath Mishra reservation split? 15% = 10% Muslims + 5% other minorities Ministry of Minority Affairs created? 2006 Which fellowship was discontinued in 2022? Maulana Azad National Fellowship Jiyo Parsi? Support to Parsi community for population stabilisation PM VIKAS / PMJVK? Skill and entrepreneurship; infrastructure in minority concentration areas SOGIESC stands for? Sexual Orientation, Gender Identity, Gender Expression and Sex Characteristics Transgender count Census 2011? About 4.9 lakh NALSA (2014)? Third gender recognised; right to self-determination of gender identity Naz (2009) and Koushal (2013)? Decriminalised; then reversed Navtej Johar (2018)? Read down Section 377; decriminalised consensual same-sex relations Supriyo (2023)? No marriage equality; need for legal protection of queer relationships NHRC 2018 on transgender jobs? 92% denied jobs; only 6% formally employed Transgender HIV prevalence? 3.1% Transgender Act 2019, portal? Anti-discrimination framework; online certificate and ID card Garima Grehs? Shelter homes (23 in 17 States/UTs under SMILE, ES 2025-26) Odisha, Karnataka, Kerala firsts? BPL benefits; 1% reservation; first comprehensive State policy (2015) Biggest challenge of welfare schemes? Gap between intent and outcome Four parallel reforms? Sensitisation; convergence; voice and participation; data-driven targeting Data tools named? Caste enumeration, MPI, outcome-based monitoring Ambedkar line? Political democracy must rest on the bedrock of social and economic democracy"}, {"c": "4", "n": "Minorities, LGBTQIA+ and the Way Ahead for Vulnerable Sections", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts in Start Here)"}, {"c": "4", "n": "Minorities, LGBTQIA+ and the Way Ahead for Vulnerable Sections", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards"}, {"c": "5", "n": "Health: Structure, Marketisation, Primary Care and Flagship Schemes", "id": "1-health-structure-and-status-constitution", "t": "1 · Health: Structure AND Status · Constitutional Basis · Three-tier System · NFHS 6 · NHA · Insurance", "x": "1 · Health: Structure AND Status · Constitutional Basis · Three-tier System · NFHS 6 · NHA · Insurance # Handout only · lists 7 Mains PYQs (2013-2024) for the Health chapter; placed beside their topics · Health chapter pp. 32-37 Exam lens Priority: High. Mains PYQs quoted: Handout lists 7 Mains PYQs (2013-2024) for the Health chapter; placed beside their topics · Health chapter pp. 32-37. Prelims PYQs quoted: none quoted in the material. In simple words Health is the foundation of human capital. Article 21 includes the right to health (Paschim Banga Khet Mazdoor Samity) and the DPSPs 39(e), 41, 42, 47, 48A back State action. India has a Bhore-model three-tier system and a mixed public-private structure with severe gaps. NFHS 6 shows a dual transition: undernutrition and infections falling, obesity, diabetes and hypertension rising. OOPE has fallen to 39.4% but still impoverishes about 4 crore people each year. Previous YEAR Questions (mains) IN THE Health Chapter Year, marks Question as printed in the handout 2024, 15 In a crucial domain like the public healthcare system, the Indian State should play a vital role to contain the adverse impact of marketisation of the system. Suggest some measures through which the State can enhance the reach of public healthcare at the grassroots level. 2021, 10 Besides being a moral imperative of a Welfare State, primary health structure is a necessary precondition for sustainable development. Analyse. 2020, 10 In order to enhance the prospects of social development, sound and adequate health care policies are needed particularly in the fields of geriatric and maternal health care. Discuss. 2018, 10 Appropriate local community level healthcare intervention is a prerequisite to achieve Health for All in India. Explain. 2017, 10 To ensure effective implementation of policies addressing water, sanitation and hygiene needs, the identification of beneficiary segments is to be synchronized with the anticipated outcomes. Examine the statement in the context of the WASH scheme. 2015, 12.5 Public health system has limitations in providing universal health coverage. Do you think that the private sector could help in bridging the gap. What other viable alternatives would you suggest. 2013, 10 Identify the Millennium Development Goals (MDGs) that are related to health. Discuss the success of the actions taken by the Government for achieving the same. Way forward / key point Where each PYQ is answered: 2024 and 2015 in the marketisation chapter; 2021 and 2018 in the primary healthcare chapter; 2020 in the maternal and geriatric chapter; 2017 in the WASH chapter; 2013 in the SDG 3 section (MDGs are the predecessor goals). KEY DATA Points (handout Table) Indicator Value Source or year Total Fertility Rate (TFR) 2.0 (Urban 1.6, Rural 2.1) NFHS 6 (2023-24) Households with health insurance coverage 60.2% (up from 41% in NFHS 5) NFHS 6 (2023-24) Women using modern family planning methods 52.7% (down from 56.4%) NFHS 6 (2023-24) Women internet users (15-49) 64.3% (up sharply from 33.3%) NFHS 6 (2023-24) Public health expenditure 1.8% of GDP Economic Survey 2025-26 NHP 2017 target for public health spending 2.5% of GDP by 2025 National Health Policy 2017 Maternal Mortality Ratio (MMR) 97 per 1 lakh live births SRS 2018-20 Infant Mortality Rate (IMR) 25 per 1000 live births SRS 2023 Out of Pocket Expenditure 39.4% of total health expenditure NHA 2021-22 NCDs share in total deaths Over 57% Economic Survey 2025-26 Psychiatrists per lakh population 0.75 Economic Survey 2023-24 Doctor to patient ratio 1:834 NMC (National Medical Commission) 2024 Ayushman cards issued Over 35.4 crore Economic Survey 2025-26 Health Budget allocation Rs 1,04,599 crore Budget 2026-27 eSanjeevani consultations Over 22 crore MoHFW 2024 Life expectancy at birth 70.3 years (2023), up from 49.7 (1973) Economic Survey 2025-26 Value addition Handout figures dated 2023-2026 (NFHS 6 results are provisional): verify the latest values before using them in an answer. Health Structure AND Status IN India Key point Health is the foundation of human capital and economic productivity. The WHO Constitution (1946) envisages the highest attainable standard of health as a fundamental right of every human being. Constitutional foundation The Supreme Court in Paschim Banga Khet Mazdoor Samity v. State of West Bengal and other cases has affirmed the Right to Health as part of Article 21 . DPSP Article 39(e) (health of workers), Article 41 (assistance for sick and disabled), Article 42 (maternity benefits), Article 47 (nutrition and public health) and Article 48A (pollution-free environment) provide the constitutional foundation for State intervention in health. Number card Article 21 right to health DPSP 39(e), 41, 42, 47, 48A WHO Constitution 1946 Bhore Committee 1946 . Architecture OF THE Indian Healthcare System Key point The Indian healthcare system has evolved as a complex layered structure combining public, private and informal providers. India organises healthcare in three tiers based on the Bhore Committee (1946) model. Level Facilities Population coverage Primary Care Sub Centres, Primary Health Centres, Ayushman Arogya Mandirs 3000 to 30000 Secondary Care Community Health Centres, Sub District Hospitals, District Hospitals 80000 to 1.5 lakh Tertiary Care Medical Colleges, AIIMS, Specialty Hospitals State and National level What each level does Primary: First point of contact Handles preventive care, immunisation, antenatal care and minor ailments Secondary: specialised consultation and basic surgical care. Tertiary: super-specialty treatment, largely concentrated in urban areas. Major gaps in the architecture India needs 30000 PHCs but has around 31000 with severe staff shortages. CHCs face nearly 80% shortfall of specialists . District hospitals are overburdened due to weak referral systems. Tertiary care is urban-heavy: 67% doctors serve 34% urban population while 66% rural population has only 33% doctors . Mixed public-private healthcare model India follows a mixed model with both public and private providers operating in parallel. 70% rural and 80% urban population uses private facilities (World Bank). Private sector provides around 70% of outpatient and 60% of inpatient care. Public sector remains the primary provider for maternal health, immunisation and basic preventive care . Informal providers (RMPs) remain the first contact for many rural populations. Way forward / key point The mixed model creates choice but also creates inequity : the poor get pushed to overcrowded public facilities while paying out of pocket in private ones for quality care. KEY Health Indicators: NFHS 6 Findings (2023-24) Key point The handout notes this section is data: do not memorise it by heart ; get a general overview of what improved or worsened and use it to back arguments in comparison questions. NFHS 6 (released 2025) covered 6.79 lakh households, 7.16 lakh women and about 1.01 lakh men ; results are provisional . Demographic and household profile Population aged 60 plus rose to 12.9% from 11.8% in NFHS 5, confirming rapid ageing. Population below 15 years declined to 25.5% , showing demographic transition. Households with health insurance jumped to 60.2% from 41%, reflecting PM-JAY expansion. Female literacy (ever attended school) rose to 73.7% from 71.8%. Households with improved drinking water at 96.5% . Female members owning house or land at 18.8% up from 14%. Marriage, fertility and family planning TFR stable at 2.0 (Urban 1.6, Rural 2.1), confirming below-replacement fertility. Women 20-24 married before 18 dropped to 20.1% from 23.3%, which is significant progress. Adolescent pregnancy stable at 6.7% . Use of any family planning method rose to 69.1% from 66.7%. Modern method use dipped to 52.7% from 56.4% while traditional methods rose. Unmet need for family planning fell to 8.5% from 9.4%. Maternal and child health Antenatal care visits (any) at 95.9% up from 92.6%. First trimester antenatal check at 76.2% up from 70%. Four plus ANC visits at 65.2% up from 58.5%. Iron folic acid for 180 plus days rose to 37.8% from 26%. Postnatal care within 2 days at 82.8% . Full immunisation rose to 82.6% from 76.6%. Rotavirus vaccine coverage jumped to 85.4% from 36.4%, a remarkable scale-up. Nutrition status of children Stunting declined to 29.3% from 35.5% (a major improvement). Wasting at 19.0% , marginally down from 19.3%. Underweight at 31.8% , down from 32.1%. Severely wasted children dropped to 5.2% from 7.7%. Exclusive breastfeeding under 6 months fell to 55.8% from 63.7%, which is worrying. Children 6-23 months with adequate diet rose to 15.3% from 11%. Adult nutrition and NCDs (the new challenge) Women overweight or obese surged to 30.7% from 24%. Men overweight or obese rose to 27.3% from 22.9%. Women with high blood sugar at 17.8% up from 13.5%. Men with high blood sugar at 20.9% up from 15.6%. Women with elevated BP at 19.4% Men at 22.1% Women empowerment indicators Internet use by women rose to 64.3% from 33.3% in NFHS 5. Women with bank account at 89% up from 78.6%. Women with mobile phone at 63.6% up from 53.9%. Spousal violence dropped to 22.3% from 29.2%, a major improvement. Way forward / key point Key takeaway from NFHS 6: the dual transition. India is winning on undernutrition and infectious diseases but losing on lifestyle-related obesity, diabetes and hypertension. Anaemia continues to be a concern with no major improvement. Adult NCDs have emerged as the new health emergency. National Health Accounts Estimates (NHA 2021-22) Released by NHSRC; tracks total health expenditure in India Total health expenditure as share of GDP around 3.8% . Government health expenditure rose to 1.84% of GDP . OOPE share declined to 39.4% of total health expenditure from 62.6% in 2014-15 . Social security expenditure on health rose to around 8.7% . Per capita government health expenditure rose significantly. Way forward / key point The fall in OOPE share is a positive development driven by PM-JAY and CGHS expansion, but absolute OOPE in rupees continues to push nearly 4 crore Indians into poverty annually. Health Insurance Coverage AND OOPE Insurance penetration 60.2% of households have at least one member covered by health insurance (NFHS 6) compared to 41% in NFHS 5. PM-JAY covers 55 crore beneficiaries with Rs 5 lakh per family per year . Missing middle of around 40 crore Indians lacks any financial protection (NITI Aayog Report). 39.4% of health expenditure was still OOPE in 2021-22 against global average of 18% . Around 80% of population lacks formal health insurance with adequate cover (FICCI 2022). Way forward / key point The biggest gap is in outpatient care, diagnostics and medicines , which are not covered by most insurance products yet contribute the bulk of OOPE. The sharp rise in household coverage to 60.2% in NFHS 6 is a significant policy success of PM-JAY and State schemes."}, {"c": "5", "n": "Health: Structure, Marketisation, Primary Care and Flagship Schemes", "id": "2-public-health-system-and-the-state-marke", "t": "2 · Public Health System AND THE State · Marketisation · Missing Middle · Inter-state Variations · Safety OF Doctors · Patient Rights", "x": "2 · Public Health System AND THE State · Marketisation · Missing Middle · Inter-state Variations · Safety OF Doctors · Patient Rights # Handout only · Saarthi IAS Exam lens Priority: High. Mains PYQs quoted: Mains 2024 (State role against marketisation), 2015 (can private sector bridge UHC gap) · Health chapter pp. 36-38. Prelims PYQs quoted: none quoted in the material. In simple words Marketisation brings capacity and technology but also overcharging, cherry-picking, urban bias and catastrophic OOPE. The State's answer is strong primary care, mobile units, eSanjeevani, ASHAs, regulated PPPs, Clinical Establishments Act enforcement, standard treatment guidelines and 2.5% of GDP. The missing middle (about 40 crore) needs affordable insurance. Health spending varies sharply across States, and doctor safety and patient rights need balancing. Marketisation OF Healthcare Key point Marketisation refers to the increasing dominance of market-driven private providers in healthcare delivery. While it has expanded access in cities and brought technology, it has also created serious affordability and equity concerns. Public Versus Private Healthcare Debate PYQ 2024 PYQ 2015 Quote PYQ 2024 (15 marks): In a crucial domain like the public healthcare system, the Indian State should play a vital role to contain the adverse impact of marketisation of the system. Suggest some measures through which the State can enhance the reach of public healthcare at the grassroots level. Quote PYQ 2015 (12.5 marks): Public health system has limitations in providing universal health coverage. Do you think that the private sector could help in bridging the gap. What other viable alternatives would you suggest. Adverse impacts of marketisation Overcharging and unnecessary procedures to maximise profit. Unnecessary diagnostic tests and surgeries, as documented by multiple CAG reports. Cherry-picking of profitable patients and procedures. Urban bias: private hospitals concentrate where paying capacity is high. Catastrophic OOPE pushing nearly 39 million Indians into poverty annually. Brain drain of public sector doctors to private hospitals. Lack of accountability: private clinics operate with weak regulation. Strengths of private sector High capacity and technology. Specialty and super-specialty services. Faster service delivery. Innovation in delivery models. Way forward (PYQ 2024) Strengthen PHCs under NHM targeting 80% rural coverage by 2025 . Mobile health units for tribal and remote areas, as in Kerala's mobile vans. Telemedicine expansion through eSanjeevani , which has facilitated over 22 crore consultations. Train and empower ASHAs , who reach 10 lakh villages. Public Private Partnerships with regulation and accountability. Clinical Establishments Act enforcement and price regulation. Standard Treatment Guidelines to prevent unnecessary procedures. Increase public spending to 2.5% of GDP as mandated by NHP 2017. Way forward / key point Models like Kerala's robust health network, Tamil Nadu's Amma Clinics and Delhi's Mohalla Clinics show that strong public primary care is the most effective tool against marketisation. Health Insurance FOR THE Missing Middle NITI Aayog Report 2021 identified the missing middle problem Nearly 40 crore Indians, mostly informal and self-employed workers, lack any health insurance. They are above the PM-JAY poverty line but cannot afford private insurance. High OOPE risk pushes many into debt and poverty. Concentrated in the unorganised sector, agriculture and gig economy. Suggestions Affordable standardised insurance like Aarogya Sanjeevani . Voluntary contribution with subsidised premiums for the poor. Use of PM-JAY infrastructure for expanding coverage. Risk pooling through SHGs, cooperatives and trade unions . Tax incentives under Section 80D for self-employed. Way forward / key point The missing middle is the next frontier for India's universal health coverage agenda. The NFHS 6 figure of 60.2% household insurance coverage shows progress, but a third of households remain uncovered. Public Health Investment AND Governance Challenges Inter-State variations in health spending Kerala, Tamil Nadu and Delhi spend significantly more on health and show better outcomes. Bihar, UP, Jharkhand and MP have lowest per capita spending and worst indicators. 15th Finance Commission recommended Rs 70051 crore of health grants to States. State health spending varies from 4% to 9% of State budget. The federal nature of health under the Seventh Schedule (State List) creates these variations. NHM as a Centrally Sponsored Scheme tries to bridge the gap but fund utilisation by poor States remains low. Safety of healthcare professionals The murder of a postgraduate doctor at RG Kar Medical College, Kolkata, in 2024 brought healthcare worker safety into national focus. Scale: 75% of doctors in India face some form of violence in their career (IMA Survey). Causes include patient deaths, poor doctor-patient communication, alcohol-related disputes and political pressure. Most attacks happen in emergency wards and casualty departments. Women healthcare workers face additional sexual harassment risk. Existing legal framework Epidemic Diseases (Amendment) Act, 2020 provides protection during pandemics with imprisonment up to 7 years . State Acts in 20 plus States criminalise violence against doctors. NMC Code of Ethics for hospital security. Demands and reforms needed A Central Healthcare Workers Protection Act beyond epidemics. Mandatory security audits in all hospitals. CCTV coverage, panic buttons and trained security. Doctor-patient communication training. Faster grievance redressal mechanisms. Workplace harassment cells under the POSH Act. The Supreme Court formed a National Task Force in 2024 to recommend reforms. Patient Safety Rights Charter The NHRC released a Charter of Patient Rights in 2018 listing 17 patient rights including right to information, right to second opinion, right to confidentiality and right to non-discrimination. States are required to adopt and implement the charter Clinical Establishments Act, 2010 enforces basic standards Many States have not yet implemented the charter fully. Need for patient grievance officers in every hospital. Linkage with eHospital and ABDM for transparent records. Way forward / key point Patient rights need to be balanced with healthcare worker safety to create a culture of mutual respect and accountability."}, {"c": "5", "n": "Health: Structure, Marketisation, Primary Care and Flagship Schemes", "id": "3-primary-healthcare-asha-ayushman-arogya", "t": "3 · Primary Healthcare · ASHA · Ayushman Arogya Mandirs · SDG 3 · National Health Policy 2017", "x": "3 · Primary Healthcare · ASHA · Ayushman Arogya Mandirs · SDG 3 · National Health Policy 2017 # Handout only · Saarthi IAS Exam lens Priority: High. Mains PYQs quoted: Mains 2021 (primary health as precondition for sustainable development), 2018 (community level healthcare for Health for All), 2013 (health-related MDGs) · Health chapter pp. 38-40. Prelims PYQs quoted: none quoted in the material. In simple words Primary care is the first, cheapest and most equitable level, backed by the Alma Ata (1978) and Astana (2018) declarations. ASHAs (10.4 lakh, launched 2005) and Ayushman Arogya Mandirs (12 services, CHOs) are the community level. SDG 3 targets MMR below 70 and U5MR below 25 by 2030; NHP 2017 set 2.5% of GDP for public health, still unmet at 1.8%. Primary Healthcare Key point Primary healthcare is the first contact point and the most cost-effective level of care. The Alma Ata Declaration 1978 and the Astana Declaration 2018 affirm primary healthcare as the foundation of universal health coverage. WHY Primary Healthcare IS Critical FOR Sustainable Development PYQ 2021 Quote PYQ 2021 (10 marks): Besides being a moral imperative of a Welfare State, primary health structure is a necessary precondition for sustainable development. Analyse. Six reasons Cost-effective: primary care prevents costly tertiary interventions. Equity: reaches the rural and urban poor. Demographic dividend: a healthy workforce drives growth. Economic productivity: healthy citizens are more productive. Resilience to shocks: as seen during COVID-19. Reduces OOPE by catching disease early. Memory aid · CEDERR Six reasons: C ost-effective, E quity, D emographic dividend, E conomic productivity, R esilience, R educes OOPE. Sentence (order is free): C are E nsures D evelopment, E quity, R esilience, R ecovery. (own mnemonic) Key point Srinath Reddy Committee (2011) recommended at least 70% of healthcare budget for primary care, aligning with WHO's 50% recommendation. The NFHS 6 jump in antenatal care visits and immunisation coverage shows the primary care expansion is working at the ground level. ASHA Workers AND Frontline Workforce PYQ 2018 Quote PYQ 2018 (10 marks): Appropriate local community level healthcare intervention is a prerequisite to achieve Health for All in India. Explain. ASHA (Accredited Social Health Activist) workers are the backbone of community health Launched in 2005 under NRHM . 10.4 lakh ASHAs across rural India. One ASHA per 1000 population. Selected from the community and trained on basic health. Receive performance-based incentives rather than a fixed salary. Not salaried employees, a long-standing demand. Their work spans maternal health, immunisation, family planning, TB, malaria and now NCDs. Recognition WHO Global Health Leaders Award 2022 given to ASHA workers. Critical role during COVID-19 vaccination and surveillance. Challenges Low and irregular incentives. Lack of formal employee status. Heavy workload without basic equipment. Limited career progression. Way forward / key point Anganwadi Workers and ANMs complete the frontline health workforce. Strengthening them is the most cost-effective health intervention India can make. Ayushman Arogya Mandirs AND HWCs PYQ 2021 PYQ 2018 Key point Health and Wellness Centres (HWCs) were launched in 2018 as the first pillar of Ayushman Bharat. Renamed Ayushman Arogya Mandirs (AAMs) in 2023 . Key features Target of 1.5 lakh AAMs by 2025 with around 1.7 lakh operational by 2025. Provide 12 comprehensive primary healthcare services including maternal and child health, NCDs, mental health, eye care and elderly care. Staffed by Community Health Officers (CHOs) , who are mid-level providers. 1.25 lakh CHOs deployed since 2018. Free essential drugs and diagnostics. Telemedicine linkage through eSanjeevani . Health AND Sustainable Development Goals: SDG 3 AND Progress Key point The Sustainable Development Goals (2015 to 2030) include SDG 3 to ensure healthy lives and promote wellbeing for all at all ages. India is a signatory and the goals are integrated into the Indian planning process. (The 2013 PYQ asked about the earlier Millennium Development Goals that relate to health; SDG 3 is the successor framework.) Key SDG 3 targets MMR below 70 per 1 lakh by 2030. U5MR below 25 per 1000 by 2030. End AIDS, TB, malaria and neglected tropical diseases. Universal Health Coverage by 2030. Reduce NCD premature mortality by one third . India's progress as per Economic Survey 2025-26 MMR reduced by 86% since 1990, exceeding the global average of 48%. U5MR declined by 78% during 1990 to 2023. NMR reduced by 70% during 1990 to 2023. IMR dropped 37% from 40 (2013) to 25 (2023). TB incidence declined by 21% from 237 (2015) to 187 (2024) per lakh, double the global decline of 12%. Way forward / key point India is on track for several SDG 3 targets but needs to accelerate on nutrition, mental health and NCDs . National Health Policy 2017 AND Targets Key point The National Health Policy 2017 provides the strategic vision for India's health sector. It replaced the 2002 policy . NHP 2017 goal or target Status in the handout Increase public health expenditure to 2.5% of GDP by 2025 Still 1.8% of GDP Raise life expectancy from 67.5 to 70 years Achieved: 70.3 in 2023 Reduce TFR to 2.1 Achieved: 2.0 Reduce U5MR to 23 per 1000 Currently 41.9 Reduce MMR to 100 by 2020 Achieved: 97 Reduce NMR to 16 and Stillbirth Rate to single digits Target 90:90:90 target for HIV/AIDS Target Reduce out-of-pocket expenditure as share of health spending Target Strategic shifts From selective to comprehensive primary care. From sectoral approach to integrated care. From input-based to outcome-based financing. Recognition of AYUSH as part of mainstream health Focus on NCDs and mental health Way forward / key point The biggest unmet target is public health spending , which remains at 1.8% of GDP against the 2.5% target . The next NHP is expected to set ambitious targets aligned with SDG 2030."}, {"c": "5", "n": "Health: Structure, Marketisation, Primary Care and Flagship Schemes", "id": "4-flagship-schemes-ayushman-bharat-pm-jay", "t": "4 · Flagship Schemes · Ayushman Bharat Pm-jay · ABDM · Health Equity · Tribal Health", "x": "4 · Flagship Schemes · Ayushman Bharat Pm-jay · ABDM · Health Equity · Tribal Health # Handout only · Saarthi IAS Exam lens Priority: High. Mains PYQs quoted: None quoted in the handout · Health chapter pp. 39-41. Prelims PYQs quoted: none quoted in the material. In simple words Ayushman Bharat (2018) has two pillars: AAMs and PM-JAY (Rs 5 lakh per family, 55 crore beneficiaries, expanded to all 70 plus). The ABDM (2021) builds a digital health backbone (ABHA IDs, HPR, HFR, UHI, HCX). Health equity means a fair chance at the highest level of health; inequity shows geographically, socially, economically, by gender and technologically. Ayushman Bharat Pm-jay Key point Ayushman Bharat, launched in 2018 , is one of the world's largest publicly funded health insurance programmes. Pillar 1: Health and Wellness Centres (now AAMs) for primary care. Pillar 2: Pradhan Mantri Jan Arogya Yojana (PM-JAY). PM-JAY features Health cover of Rs 5 lakh per family per year for secondary and tertiary care. Covers 55 crore beneficiaries from the poorest 40% families. No restriction on family size, age or gender. All pre-existing conditions covered from day one. Cashless treatment at empanelled hospitals. 27000 plus empanelled hospitals across public and private sector. Recent expansion PM-JAY expanded to all citizens aged 70 plus with Rs 5 lakh top-up cover. Will benefit 6 crore senior citizens. This is the biggest expansion since launch. Key achievements 35.4 crore Ayushman cards issued. 7.79 crore hospital admissions authorised. 21% reduction in OOPE. 49% of cards issued to women. Annual net benefit of USD 26.1 million to district hospitals. Way forward / key point The NFHS 6 sharp rise in household health insurance coverage from 41% to 60.2% directly reflects the PM-JAY footprint expansion. Challenges as per CAG report Database errors with invalid beneficiary data. Infrastructure shortcomings in empanelled hospitals. Financial irregularities including fake claims. Implementation delays. Geographical disparity in utilisation. Key point The Expert Committee under V. K. Paul of NITI Aayog was constituted in 2024 to review PM-JAY and recommend reforms. Ayushman Bharat Digital Mission (ABDM) Key point ABDM, launched in 2021 , aims to create a digital health infrastructure to integrate fragmented data and enable seamless service delivery. Key components Ayushman Bharat Health Account (ABHA): unique 14-digit health ID with around 79 crore accounts created. Healthcare Professionals Registry (HPR) with around 6.57 lakh professionals registered. Healthcare Facility Registry (HFR) with over 4 lakh facilities. Unified Health Interface (UHI) for application interoperability. Health Claim Exchange (HCX) for cashless claims. Digital Health Incentive Scheme to encourage adoption. Principles Voluntary participation with opt-out option. Free registration. Privacy protection through consent-based architecture. Federated architecture respecting State autonomy. Challenges Digital divide as rural and elderly cannot access (NFHS 6 shows female internet use jumped to 64.3%, which is encouraging). Privacy concerns without a comprehensive data protection law. Demand and skill mismatch in the digital health workforce. Interoperability issues across State systems. Inadequate primary care data to populate the system. Way forward / key point ABDM has the potential to transform Indian healthcare into a data-driven system but requires addressing these challenges with sensitivity. Concept OF Health Equity IN India Key point Health equity, as defined by WHO , is achieved when every individual has a fair opportunity to attain their highest level of health regardless of social, economic or political circumstances. Dimension of health inequity Manifestation Geographical Urban India has 75% of healthcare professionals against 34% urban population Social SCs and STs face higher child mortality and lower immunisation Economic Nearly 39 million pushed into poverty annually due to OOPE Gender Women face restricted access, especially in marginalised groups Technological Digital health divide favouring urban populations Key point NFHS 6 shows narrowing gender gap in some indicators but widening urban-rural gap in NCDs . Urban women obesity at 42.8% is sharply higher than rural at 25.5% . Tribal health inequity Tribal infant mortality higher than the national average. Sickle cell disease disproportionately affects tribes. Tribal Health Action Plan under MoHFW addresses tribal-specific issues. Lack of trained personnel in tribal areas. Strategies to achieve health equity Strengthen primary healthcare with 70% health budget for primary care . Inclusive insurance models covering the missing middle. Tribal and rural-specific interventions like NHM differential financing. Gender-sensitive health planning. Bridge the digital health divide through assisted access points. Address social determinants of health like water, sanitation, nutrition. Successful models Basthi Dawakhanas in Telangana for the urban poor. Family Health Centres in Kerala. Mohalla Clinics in Delhi. Tamil Nadu Medical Services Corporation for procurement efficiency. Way forward / key point Health equity is not a slogan but the test of whether universal health coverage truly reaches everyone."}, {"c": "5", "n": "Health: Structure, Marketisation, Primary Care and Flagship Schemes", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Right to health under which Article and case? Article 21; Paschim Banga Khet Mazdoor Samity v. State of West Bengal DPSPs on health? 39(e), 41, 42, 47, 48A Three-tier model based on? Bhore Committee 1946: primary (SC, PHC, AAM), secondary (CHC, SDH, DH), tertiary (medical colleges, AIIMS) Doctor distribution gap? 67% doctors serve 34% urban; 66% rural have 33% doctors Public vs private usage? 70% rural, 80% urban use private; private gives ~70% outpatient, 60% inpatient NFHS 6 TFR? 2.0 (urban 1.6, rural 2.1) NFHS 6 stunting? 29.3% (from 35.5%) NFHS 6 insurance coverage? 60.2% of households (from 41%) NFHS 6 dual transition? Undernutrition and infections falling; obesity, diabetes, hypertension rising Exclusive breastfeeding trend? Fell to 55.8% from 63.7% OOPE share now vs 2014-15? 39.4% vs 62.6% (global average 18%) How many pushed into poverty by OOPE? Nearly 4 crore annually Missing middle size? About 40 crore without financial protection (NITI Aayog) Define marketisation. Increasing dominance of market-driven private providers in healthcare delivery Seven adverse impacts of marketisation (name four). Overcharging; unnecessary tests; cherry-picking; urban bias; catastrophic OOPE; brain drain; weak accountability State measures (name five). PHCs under NHM; mobile units; eSanjeevani; ASHAs; regulated PPPs; Clinical Establishments Act; standard treatment guidelines; 2.5% GDP Models against marketisation? Kerala network, Tamil Nadu Amma Clinics, Delhi Mohalla Clinics Who identified the missing middle? NITI Aayog Report 2021: about 40 crore Insurance fixes for the missing middle? Aarogya Sanjeevani; subsidised voluntary premiums; PM-JAY infrastructure; SHGs/cooperatives/unions; Section 80D 15th FC health grants to States? Rs 70051 crore Why does health spending vary across States? Health is on the State List (Seventh Schedule) Doctors facing violence? 75% (IMA survey); RG Kar murder 2024 Epidemic Diseases (Amendment) Act 2020? Protection during pandemics; up to 7 years imprisonment NHRC Charter of Patient Rights? 2018; 17 rights including information, second opinion, confidentiality, non-discrimination Declarations on primary health? Alma Ata 1978; Astana 2018 Six reasons primary care matters? Cost-effective; equity; demographic dividend; productivity; resilience; reduces OOPE Srinath Reddy Committee 2011? At least 70% of health budget to primary care (WHO: 50%) ASHA facts? 2005, NRHM; 10.4 lakh; one per 1000; performance-based incentives, not salaried ASHA recognition? WHO Global Health Leaders Award 2022 HWC to AAM? HWCs 2018 (first pillar of Ayushman Bharat); renamed Ayushman Arogya Mandirs 2023 AAM features? 12 services; staffed by CHOs (1.25 lakh deployed); free drugs and diagnostics; eSanjeevani link SDG 3 targets? MMR below 70; U5MR below 25; end AIDS/TB/malaria; UHC; cut NCD premature mortality by one third India progress? MMR down 86% since 1990; U5MR down 78%; NMR down 70%; IMR 40 to 25; TB incidence down 21% NHP 2017 replaced? The 2002 policy NHP 2017 unmet target? 2.5% of GDP public health spending (actual 1.8%) NHP 2017 shifts? Selective to comprehensive; sectoral to integrated; input-based to outcome-based financing Ayushman Bharat: launch and two pillars? 2018; AAMs (primary care) and PM-JAY PM-JAY cover and reach? Rs 5 lakh per family per year; 55 crore beneficiaries (poorest 40%); 27000+ hospitals; cashless; pre-existing conditions from day one 70 plus expansion? All aged 70 plus with Rs 5 lakh top-up; about 6 crore seniors Key achievements? 35.4 crore cards; 7.79 crore admissions; 21% OOPE reduction; 49% cards to women CAG challenges for PM-JAY? Database errors; infrastructure gaps; fake claims; delays; geographical disparity Who reviews PM-JAY (2024)? Expert Committee under V. K. Paul (NITI Aayog) ABDM launched and components? 2021; ABHA (14-digit, ~79 crore), HPR, HFR, UHI, HCX, Digital Health Incentive Scheme ABDM principles? Voluntary, free, consent-based privacy, federated architecture WHO definition of health equity? Fair opportunity to attain highest level of health regardless of circumstances Five dimensions of health inequity? Geographical; social; economic; gender; technological Urban vs rural women obesity? 42.8% vs 25.5% (NFHS 6) Models of equity? Basthi Dawakhanas (Telangana); Family Health Centres (Kerala); Mohalla Clinics (Delhi); TN Medical Services Corporation"}, {"c": "5", "n": "Health: Structure, Marketisation, Primary Care and Flagship Schemes", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts in Start Here)"}, {"c": "5", "n": "Health: Structure, Marketisation, Primary Care and Flagship Schemes", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards"}, {"c": "6", "n": "Maternal, Geriatric and Mental Health, WASH, NCDs and the Future of Health", "id": "1-maternal-reproductive-and-geriatric-heal", "t": "1 · Maternal, Reproductive AND Geriatric Health · MMR · Schemes · MTP ACT · Pm-jay 70 PLUS", "x": "1 · Maternal, Reproductive AND Geriatric Health · MMR · Schemes · MTP ACT · Pm-jay 70 PLUS # Handout only · Saarthi IAS Exam lens Priority: High. Mains PYQs quoted: Mains 2020 (geriatric and maternal healthcare policies) · Health chapter pp. 41-44. Prelims PYQs quoted: none quoted in the material. In simple words MMR is 97 (SDG: 70) with big State gaps (below 50 in Kerala, Maharashtra, Tamil Nadu; above 150 in Assam, MP, UP, Rajasthan). Schemes: JSY, JSSK, PMSMA, SUMAN, PMMVY, LaQshya. Reproductive health shows modern contraceptive use falling and female sterilisation dominant. Ageing is the next frontier: 12.9% are 60 plus (NFHS 6), PM-JAY now covers 70 plus, and India has under 1000 geriatricians against a need of 25000. Maternal Mortality Ratio AND Interventions PYQ 2020 Quote PYQ 2020 (10 marks): In order to enhance the prospects of social development, sound and adequate health care policies are needed particularly in the fields of geriatric and maternal health care. Discuss. Key point Maternal health is the foundation of demographic transition and women's empowerment . India has made historic progress but regional and social gaps remain. It directly determines the wellbeing of women, families and the next generation. Status of maternal health in India MMR 97 per 1 lakh live births (SRS 2018-20) against SDG target of 70 by 2030 . MMR reduced by 86% since 1990 , exceeding the global average decline of 48%. Antenatal care visits (any) at 95.9% (NFHS 6), up from 92.6% in NFHS 5. First trimester ANC check at 76.2% , up from 70%. Four plus ANC visits at 65.2% , up from 58.5%. Iron folic acid for 180 plus days at 37.8% , up from 26%. Postnatal care within 2 days at 82.8% . Regional disparities Kerala, Maharashtra and Tamil Nadu have MMR below 50 . Assam, MP, UP and Rajasthan have MMR above 150 . High MMR clusters around poverty, illiteracy and weak health infrastructure. Key challenges Quality of care gap in rural and remote areas. Skilled birth attendant shortage despite the midwifery initiative. Socio-cultural barriers like early marriage and adolescent pregnancy. Anaemia at 57% weakens women's ability to survive childbirth. NFHS 6 shows adolescent pregnancy at 6.7% , which is still high. Major initiative Focus Janani Suraksha Yojana Cash incentive for institutional delivery Janani Shishu Suraksha Karyakram Free delivery and treatment for mother and child Pradhan Mantri Surakshit Matritva Abhiyan (PMSMA) Free comprehensive ANC on 9th of every month Surakshit Matritva Aashwasan Yojana (SUMAN) Zero tolerance for denial of service in public facilities Pradhan Mantri Matru Vandana Yojana Rs 5000 cash for first child Midwifery Services Initiative Training 90000 midwives Swasth Nari Sashakt Parivar Abhiyaan Nationwide women's health campaign (Economic Survey 2025-26) LaQshya Quality improvement in labour rooms Way forward / key point The path forward requires bridging regional MMR gaps, tackling anaemia aggressively and addressing socio-cultural barriers like early marriage, which NFHS 6 shows is declining but still affects 20.1% of women. Sexual AND Reproductive Health AND Rights Key point Sexual and Reproductive Health (SRH) covers safe pregnancy, contraception, abortion access, STI prevention and reproductive autonomy. Key data from NFHS 6 Modern contraceptive use at 52.7% , down slightly from 56.4%. Female sterilisation still dominates at 36.5% , showing limited spacing methods. Male sterilisation at just 0.5% , showing gender imbalance in family planning. Total unmet need at 8.5% , down from 9.4%. Hygienic menstrual practices among 15-24 year women at 79.2% , up from 77.6%. Legal framework Medical Termination of Pregnancy (Amendment) Act, 2021 extended abortion to 24 weeks for special categories. Surrogacy (Regulation) Act, 2021 allows only altruistic surrogacy. PCPNDT Act, 1994 prohibits sex-selective abortion. Maternity Benefit (Amendment) Act, 2017 extended paid leave to 26 weeks. K. Umadevi v. Government of Tamil Nadu affirmed maternity leave as core of reproductive rights. Major initiatives Rashtriya Kishor Swasthya Karyakram (RKSK) for adolescent health. Mission Parivar Vikas in high TFR districts. Draft Menstrual Hygiene Policy 2023. Free contraceptive distribution through ASHAs and Anganwadis. Value addition The fall in modern contraceptive use is a concerning signal that demands attention through awareness campaigns and improved access to spacing methods like injectables and intrauterine devices . Geriatric Healthcare: Senior Citizens Under Pm-jay Key point NFHS 6 confirms India's ageing transition, with 12.9% population now 60 plus, up from 11.8% in NFHS 5. The 70 plus segment is growing fastest. Note Note on two figures: this chapter quotes around 10.4 crore senior citizens (UNFPA 2023, 10.4%) and NFHS 6 gives 12.9% aged 60 plus. They come from different sources and years; name the source when quoting. Status of elderly health Around 10.4 crore senior citizens in India. 70 plus population doubled from 2.8% in 2001 to 4.3% in 2021 and is expected to double again by 2031. NCDs are the leading cause of disability among the elderly. 70% of elderly depend on family for daily expenses. Only one-fifth of 60 plus covered by health insurance before PM-JAY expansion. PM-JAY expansion to 70 plus All citizens aged 70 plus now eligible regardless of income. Rs 5 lakh per family per year top-up cover. Will benefit around 6 crore senior citizens. Covers cancer, heart disease, joint replacement and other geriatric conditions. Way forward / key point This is the most significant expansion of PM-JAY since launch and addresses a long-ignored vulnerable group. Care ecosystem for elderly (Budget 2026-27) Building a Care Ecosystem covering geriatric and allied care services. Training of 1.5 lakh multi-skilled caregivers under NSQF. New NIMHANS 2 and upgrading mental health institutes at Ranchi and Tezpur . Emergency and trauma care centres at district hospitals Strengthening district-level Emergency and Trauma Care Centres Major scheme Focus National Programme for Health Care of Elderly (NPHCE) Geriatric units at district hospitals Atal Vayo Abhyuday Yojana (AVYAY) Provides free shelter, healthcare, assistive devices and a national helpline to ensure a secure and dignified life for senior citizens Rashtriya Vayoshri Yojana Free assistive devices for BPL elderly Indira Gandhi National Old Age Pension Scheme Monthly pension under NSAP Elderline 14567 National helpline SAGE Initiative Startup ecosystem for elderly care Aadhaar-based Mobile Application for Digital Life Certification 47.76 lakh beneficiaries authenticated (ES 2025-26) Way forward Build a National Geriatric Policy focused on healthy ageing. Expand home-based care and palliative care services. Train more geriatricians (India has under 1000 against need of 25000 ). Build dementia care infrastructure as cases rise. Integrate AYUSH into elderly wellness. Way forward / key point The combined push of PM-JAY 70 plus expansion and the care ecosystem investment marks India's recognition that the ageing population is the next big healthcare frontier. Falling Fertility RATE AND Demographic Implications Key point The handout states this topic is covered comprehensively in the GS-1 Society module . Only the NFHS 6 anchor is repeated here: TFR 2.0 (urban 1.6, rural 2.1), below replacement level."}, {"c": "6", "n": "Maternal, Geriatric and Mental Health, WASH, NCDs and the Future of Health", "id": "2-mental-health-status-mental-healthcare-a", "t": "2 · Mental Health · Status · Mental Healthcare ACT 2017 · Nimhans AND Nimhans 2 · TELE Manas · WAY Forward", "x": "2 · Mental Health · Status · Mental Healthcare ACT 2017 · Nimhans AND Nimhans 2 · TELE Manas · WAY Forward # Handout only · Saarthi IAS Exam lens Priority: Medium. Mains PYQs quoted: None quoted in the handout · Health chapter pp. 44-47. Prelims PYQs quoted: none quoted in the material. In simple words Mental health is a neglected public health area: 10.6% of adults have a disorder with a 70-92% treatment gap, only 0.75 psychiatrists per lakh, and the programme gets 0.06% of health spending. The Mental Healthcare Act 2017 is rights-based (sui
