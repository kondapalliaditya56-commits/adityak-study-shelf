16, COMCASA, BECA 2020; iCET to TRUST; Kudankulam 1988; Aryabhata 1975; INSTC; India-EU FTA 2026; Horizon 2047; Rafale and Scorpene; SCRI, LUPEX; ECTA, CECA, PACTS. Mains hooks: the “India seeks / India avoids” frame; the 4-box China issue set (China-Pakistan nexus, String of Pearls, Brahmaputra, rare-earth magnets); US frictions (Russia factor, tariffs, H-1B, Pakistan, climate); Russia-China-India triangle; why India-Japan and India-Australia trade lags strategy; three “core ideas” that begin with “not a complete new Cold War”. Closing idea: India’s major-power diplomacy is strategic autonomy under pressure: partnering widely, aligning selectively and depending permanently on none."}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "1-understanding-major-powers", "t": "1 · Understanding major powers", "x": "1 · Understanding major powers # Class + handout “International politics, like all politics, is a struggle for power.” (Hans J. Morgenthau, quoted in the handout.) A major power is a state with significant economic, technological and military capabilities and the strategic intent to shape the international order . Unlike regional powers, major powers influence multiple regions and global institutions through deterrence, agenda-setting and economic interdependence . The USA, China and Russia qualify because they combine strong military, economic and technological capabilities with the intent to shape the global order. How other states respond to a major power (slide 2) Response Meaning Balancing Opposing a dominant power Bandwagoning Aligning with a stronger power to gain security, economic benefits or political advantages, instead of opposing it Strategic autonomy Taking independent decisions Major-power rivalries and alliances shape the global balance of power, which decides whether other states balance, bandwagon or pursue strategic autonomy. Bandwagoning: the handout’s two examples Pair Why the weaker state aligns Belarus-Russia Security, energy and economic support Pakistan-China CPEC investment, defence support and diplomatic backing from China Class slide stress: “Core idea” (slide 2) Major powers shape the choices available to other countries. Slide 2 lists what major powers influence: multiple regions, global institutions, alliances and rivalries, economic and technology networks. Objectives and capabilities of the three powers (slides 3-5, handout p. 1) Power Objectives and ideology Capabilities United States Retain global leadership (handout adds “manifest destiny”); preserve the global order through greater burden-sharing among allies and partners ; maintain an edge in critical technologies; build flexible partnerships Unmatched military power projection; world’s largest economy; leadership in critical technologies and global finance; soft power (media, movies) China Regain status as the Middle Kingdom (“centre of the world under the heaven”, the “middle kingdom complex”); build greater Chinese primacy, using multipolarity as a pathway ; strengthen its position in the Indo-Pacific; reshape international institutions; reduce dependence on the US-led financial system Massive manufacturing scale; near-monopoly on critical minerals (handout; slides say “leverage”); rapidly modernising military; leadership in next-gen tech (AI, green tech, 5G) Russia Maintain strategic influence across Eurasia; resist Western pressure; promote a non-Western multipolar order Massive nuclear arsenal; advanced asymmetric warfare capabilities; immense energy and resource leverage"}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "2-ambitions-and-instruments-the-united-sta", "t": "2 · Ambitions and instruments: the United States", "x": "2 · Ambitions and instruments: the United States # Class + handout US: four ambitions (slides 6-7, handout p. 2) Ambition and aim Instruments Examples Great-power competition and regional balance. Prevent rivals, especially China, from gaining regional dominance and keep a favourable balance of power Minilateral groupings (flexible coalitions); forward military presence ; deterrence ; alliance burden-sharing NATO, Quad, I2U2, AUKUS strengthen regional deterrence. 2026 National Defense Strategy stops an adversary from freely projecting power beyond the island chain Japan → Taiwan → Philippines → Borneo ; strengthens the Indo-Pacific while keeping security in the Western Hemisphere Economic, technological and defence superiority. Preserve US advantages and reduce strategic dependencies Economic statecraft (tariffs, sanctions, export controls, dollar dominance, investment restrictions); technology policy (AI, semiconductors, advanced computing, quantum, cyber, space); industrial policy; supply-chain strategy ( friend-shoring ) Lindsey O. Graham Sanctioning Russia and Iran Act, 2026 : tariffs up to 100% on buyers of Russian energy; extends Iran sanctions. CHIPS and Science Act, 2022 . 2023 AI Framework and Standards : the CAISI shapes international AI standards, watermarking benchmarks and frontier-model evaluations. Restrictions on advanced “Mythos 5” AI models to stop exploitation by foreign adversaries. IPEF and friend-shoring Global financial and institutional influence. Retain influence over global finance, institutions, rules and economic networks Financial power (central role of the US dollar ); institutional power (shape rules, standards and networks through global institutions and bilateral partnerships) Influence through the UN, IMF, World Bank and G20 ; dollar dominance, sanctions and financial restrictions used as economic statecraft Regional security and Western Hemisphere focus. Protect US interests closer to home and strengthen influence in the Western Hemisphere Regional security; Western Hemisphere strategy; renewed Monroe Doctrine principles Operation Absolute Resolve in Venezuela; renewed Western Hemisphere security focus Class slide stress: two “Core ideas” (slide 7) “US power is not only military. It is also financial, institutional and technological. ” And: the US is moving towards more interest-driven and transactional global leadership . The handout adds: from a largely liberal-globalist approach to an interest-driven, transactional form, though still relying heavily on alliances and its economic, technological and military advantages. Handout alert: AUKUS and IPMDA The handout names AUKUS only inside a list of US minilateral groupings. It does not explain what AUKUS is. That matters for the 2021 AUKUS question (see Practice). “Mythos 5” and “Operation Absolute Resolve” are also named without explanation."}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "3-ambitions-and-instruments-china", "t": "3 · Ambitions and instruments: China", "x": "3 · Ambitions and instruments: China # Class + handout China: four ambitions (slides 8-9, handout p. 3) Ambition and aim Instruments Examples Achieve national rejuvenation. Strengthen capabilities and resilience against external pressure Economic and technological resilience (cut dependence on foreign sources); military strengthening; strategic resilience Made in China 2025 ; domestic capabilities in AI, semiconductors, 5G, EVs, batteries, renewable energy, advanced manufacturing Strengthen regional centrality and military reach. Expand regional influence, protect interests, project power beyond the neighbourhood Regional economic connectivity (trade, investment, infrastructure); military and maritime power (PLA, missiles, naval forces); A2/AD and overseas facilities; presence across the Western Pacific and Indian Ocean; protect interests in Taiwan and the South China Sea BRI through ports, railways and corridors such as CPEC and Gwadar ; China-Laos and Southeast Asia rail links; PLA modernisation; Two-Ocean strategy (Western Pacific and Indian Ocean); overseas facility at Djibouti Build technological and economic leadership. Lead in advanced technologies and manufacturing while sustaining its export position Technology and industrial policy; self-reliance ; export-oriented industrial strategy; strategic resource leverage (critical minerals and rare earths as economic and strategic tools) Made in China 2025; the “New Three” : EVs, lithium-ion batteries and solar PV; export controls on critical minerals and rare earths Use multipolarity as a path to its middle-kingdom complex. Increase China’s role in global governance Multilateral and institutional platforms; global governance initiatives; diplomatic power (mediation); institution-building to reduce dependence on Western-led institutions BRICS, SCO, AIIB and BRI ; Global Development Initiative (GDI), Global Security Initiative (GSI), Global Civilization Initiative (GCI) ; 2023 Saudi Arabia-Iran rapprochement through Chinese mediation China’s instruments in one line Connectivity (BRI, CPEC, Gwadar, Djibouti) + military reach (PLA, A2/AD, Two-Ocean) + technology and minerals (Made in China 2025, New Three, rare-earth controls) + institutions (BRICS, SCO, AIIB, GDI, GSI, GCI)."}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "4-ambitions-and-instruments-russia", "t": "4 · Ambitions and instruments: Russia", "x": "4 · Ambitions and instruments: Russia # Class + handout Russia: four ambitions (slides 10-11, handout p. 4) Ambition and aim Instruments Examples Promote multipolarity and strategic autonomy. Oppose unipolarity and reduce dependence on Western-led institutions Multilateral platforms; alternative finance; strategic autonomy from Western political and financial institutions BRICS, SCO and EAEU expand Russia’s diplomatic and economic space; BRICS Bridge proposed as an alternative financial mechanism Secure the Eurasian neighbourhood and preserve great-power status. Maintain influence across the post-Soviet space Regional security (Eastern Europe, Caucasus, Central Asia; prevent perceived strategic encirclement); nuclear and military power; collective security organisations CSTO ; Russia’s Basic Principles of State Policy on Nuclear Deterrence treat aggression by a non-nuclear state backed by a nuclear power as a joint attack. Slide’s core idea: nuclear and military power sustain influence beyond Russia’s economic weight Leverage energy and resources for strategic influence. Use oil, gas, nuclear technology and fertilisers Energy and resource diplomacy; market diversification; sanctions resilience (alternative trade and transport networks) Exports redirected to China, India and Asian markets ; bypassing the G7 oil price cap and EU embargo through a “shadow tanker fleet” Build greater Eurasian connectivity and partnerships. Deepen ties with China, India, Central Asia and Southeast Asia Connectivity ( Northern Sea Route ); strategic partnerships; eastward pivot ; defence cooperation Expansion of the Northern Sea Route; strategic entente with China; ties with India, ASEAN and Central Asia; Russia-North Korea Treaty on Comprehensive Strategic Partnership (mutual military assistance) Key concept: strategic entente An informal, cooperative diplomatic understanding between nations. They agree to consult or align their policies for mutual benefit or to manage a common rival, without necessarily being a formal alliance . (Handout p. 4.)"}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "5-us-china-rivalry", "t": "5 · US-China rivalry", "x": "5 · US-China rivalry # Class + handout The US-China rivalry is the main strategic competition in the current world order. The handout reads it as a power transition leading to the Thucydides Trap . Two key concepts (handout p. 5) Concept Meaning Power Transition Theory Major conflict is more likely when a rising power approaches the capabilities of a dominant power and challenges the existing international order Thucydides Trap The risk of conflict when a rising power threatens the position of an established power Seven dimensions (handout pp. 5-6; slides 12-13 give four plus two boxes) Dimension What the material says 1 · Military and maritime China’s military modernisation and growing presence in the South China Sea and Western Pacific . The US strengthened alliances with Japan, South Korea, Australia and the Philippines and partnerships (Quad, AUKUS) 2 · Taiwan and regional security A major flashpoint: strategic location and importance to global semiconductor supply chains . US arms sales to Taiwan; China’s exercises around Taiwan ( Justice Mission 2025 ) 3 · Technology and semiconductors Competition in semiconductors, AI, advanced computing, telecom. US restrictions limit China’s access to some advanced chips; export controls show technology as a national-security issue. September 2026 Trump-Xi summit proposed a formal US-China AI dialogue, but Washington kept pursuing independent AI capabilities. The AI-powered America.gov launch reflects the technology-leadership contest 4 · Trade and supply chains Both seek to reduce strategic dependence: de-risking, friend-shoring, diversification . China remains central in manufacturing and critical-mineral processing . China’s curbs on gallium, germanium and rare earths show supply chains as instruments of economic statecraft 5 · Economic and financial Washington Consensus (Western market-led, liberal reforms) versus Beijing Consensus (state-led, development-oriented model). Deep economic ties make complete decoupling difficult . The September 2026 summit extended the trade truce and agreed reciprocal tariff reductions on $30 billion of non-sensitive goods each way : temporary de-escalation 6 · Global institutions The US stays central to the alliance and financial architecture; China expanded influence through BRI, AIIB, BRICS and SCO 7 · Global impact The rivalry reshapes the balance of power, raises multipolarity and strategic uncertainty. Both seek influence through infrastructure, finance, technology and connectivity: BRI versus alternative infrastructure initiatives . This raises the strategic importance of the Global South . Others pursue partnership diversification : ASEAN keeps economic ties with China while strengthening security cooperation with the US and others Class slide stress: two “Core ideas” (slides 12-13) “Technology has become a national-security issue.” And: “It is not a complete new Cold War, because economic interdependence continues.” The handout words it: economic interdependence and limited cooperation continue, but strategic competition and mistrust are increasing. Impact on India (slide 13, handout p. 6) Area Impact Indo-Pacific security Greater Chinese presence in the Indian Ocean raises India’s maritime-security concerns and makes the Quad and IORA more relevant Border security Rivalry sharpens the LAC challenge, and widens scope for defence and intelligence cooperation with partners Supply chains China+1 and decoupling create opportunities in electronics, semiconductors, pharmaceuticals, but dependence on Chinese inputs remains a risk Strategic autonomy Stronger Russia-China ties and US-China competition require multi-alignment and diversified partnerships Global governance Rivalry can hinder UNSC and WTO reform and raises India’s role as a bridge for the Global South"}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "6-russia-west-confrontation", "t": "6 · Russia-West confrontation", "x": "6 · Russia-West confrontation # Class + handout “The supreme art of war is to subdue the enemy without fighting.” (Sun Tzu, quoted in the handout.) The Russia-West confrontation is a major fault line in the current world order. It intensified after Russia’s invasion of Ukraine in 2022 . Six dimensions (handout pp. 6-7; slides 14-15) Dimension What the material says 1 · European security and NATO expansion The war strengthened NATO’s role. Finland joined NATO in 2023 and Sweden in 2024 . Higher European defence spending. At the 2026 Ankara Summit , NATO pledged €70 billion in military equipment, assistance and training for Ukraine 2 · Sanctions and economic statecraft Sanctions, export controls and financial restrictions on banks, energy revenues, military industries, shipping and dual-use technologies. The EU’s July 2026 package targeted Russian energy, financial services, the shadow fleet and military-industrial supply chains 3 · Energy and trade realignment Europe cut its dependence on Russian energy; Russia sought Asian markets. EU dependence on Russian gas fell from 45% (2021) to 12% (2025) . In January 2026 the EU adopted a Regulation to phase out Russian pipeline gas and LNG imports 4 · Hybrid and cyber warfare Cyberattacks, disinformation, political interference. NATO treats cyber, space and hybrid threats as part of the strategic environment; the EU has a dedicated sanctions framework against Russia’s destabilising activities 5 · Russia-China strategic partnership Deeper coordination under US-China rivalry and Russia-West confrontation. Under the “No Limits” partnership Sino-Russian trade is about $228 billion (2025) . BRICS and SCO give coordination platforms. Based on shared interests, not a formal military alliance 6 · Global impact Reshaped energy markets, food security, defence spending, alignments. Russian energy, food and fertiliser disruptions hurt developing countries most. Many Global South states avoid choosing a bloc Impact on India (slide 15, handout p. 7) Area Impact Defence dependence Western sanctions can hit Russian-origin equipment, spares and maintenance ; need for defence diversification and indigenisation Energy security Russian crude becomes important as Russian flows to Europe fall; the Sanctioning Russia and Iran Act (2026) creates challenges Strategic autonomy Pressure to balance long-standing Russia ties with growing US-Europe partnerships: multi-alignment Connectivity and Eurasia Instability affects INSTC ; alternative routes through Central Asia and Iran gain importance India-Russia-China dynamics Closer Russia-China ties can reduce India’s strategic space in Eurasia ; diversified partnerships with Europe, the US, Japan become more important Class slide stress: “Core idea” (slide 15) “The world is not divided into two fixed blocs. Many states still follow strategic autonomy.” The handout: bloc-based security competition is stronger, but two completely separate blocs have not formed; states pursue strategic autonomy, diversified partnerships and issue-based cooperation."}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "7-india-s-approach-to-major-power-competit", "t": "7 · India’s approach to major-power competition", "x": "7 · India’s approach to major-power competition # Class + handout Major-power competition creates both challenges and opportunities for India. Instead of aligning with any one bloc, India follows strategic autonomy, multi-alignment and issue-based partnerships . India with each power (slide 16) Power India’s approach US Cooperate on technology, defence and the Indo-Pacific China Manage competition through deterrence and engagement Russia Keep strong ties in defence, energy and Eurasian connectivity India seeks and India follows (slide 16) India seeks to India follows Balance competing interests Strategic autonomy Diversify strategic partnerships Multi-alignment Protect national interest Issue-based partnerships Support a multipolar global order; avoid permanent dependence on any one power Core idea (handout p. 7) India’s major-power diplomacy is the practice of strategic autonomy under pressure: partnering widely, aligning selectively and depending permanently on none. Jaishankar quote (handout p. 7) “This is a time for us to engage America, manage China, cultivate Europe, reassure Russia, bring Japan into play, draw neighbours in, extend the neighbourhood and expand traditional constituencies of support. ” (S. Jaishankar, *The India Way*.) Use it as a ready-made opening for any bilateral answer. The quote as a chain of verbs America engage China manage Europe cultivate Russia reassure Japan bring into play Neighbours draw in; extend the neighbourhood"}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "8-india-china-nature-evolution-and-converg", "t": "8 · India-China: nature, evolution and convergence", "x": "8 · India-China: nature, evolution and convergence # Class + handout Nature of the relationship (slide 17) Nature Meaning Strategic competition Border, Indian Ocean and regional influence Economic interdependence Large trade, but strong imbalance and dependence Selective cooperation BRICS, SCO, climate and global governance Managed competition Dialogue and engagement alongside deterrence and de-risking Slide 17: the relationship combines competition + interdependence + selective cooperation . Handout: neither side seeks open conflict, but deep mistrust limits wider cooperation; dialogue prevents differences from becoming a larger confrontation. Evolution of India-China relations (slide 18, handout p. 8) Phase Keyword Key developments 1950-54 Postcolonial engagement India recognised the PRC in 1949 ; diplomatic relations 1950 ; Panchsheel Agreement 1954 framed peaceful coexistence 1950s-62 Territorial rupture China’s occupation of Tibet turned the India-Tibet frontier into the India-China boundary. 1962 war : deep strategic distrust; Aksai Chin came under Chinese control 1976-88 Diplomatic rapprochement Ambassadorial relations resumed; Rajiv Gandhi’s 1988 visit ; normalisation began 1993-2005 Institutionalised border management 1993-96 agreements (peace and tranquillity framework); 2003 Special Representatives mechanism ; 2005 agreement on guiding principles for a settlement 2008-13 Economic engagement Trade expanded rapidly; the imbalance widened 2017-20 Border confrontation Doklam (2017) showed Chinese pressure and Indian resistance; the Galwan clash (2020) ended the practice of separating border tensions from wider relations 2020-24 Crisis management Corps Commander and WMCC talks : disengagement, friction points. The 2024 Depsang-Demchok understanding brought cautious tactical stabilisation 2025-26 Calibrated re-engagement SR dialogue, WMCC, SCO consultations , visa and flight discussions: cautious stabilisation; structural mistrust persists Phase keywords in order (memory aid built from the table) P T D I E B C C P ostcolonial engagement → T erritorial rupture → D iplomatic rapprochement → I nstitutionalised border management → E conomic engagement → B order confrontation → C risis management → C alibrated re-engagement. Areas of convergence (slide 19, handout pp. 8-9) Area Key points Global governance Greater representation for emerging economies (BRICS) and the Global South; both in NDB and AIIB Trade $151 billion in 2025-26 WTO Developing-country interests: food security, public stockholding, Special Safeguard Mechanism Climate Support CBDR-RC and greater policy space for developing countries Global order Preference for a multipolar order Technology Greater developing-country role in technology governance. At the 18th BRICS Summit (2026) China proposed a BRICS open-source AI community (LLMs, AI training, common digital cloud platform) People-to-people Kailash Mansarovar Yatra, direct flights, visa facilitation : gradual confidence-building measures Security dialogue WMCC and military-diplomatic channels; SCO for regional security. At the 18th BRICS Summit both leaders stressed peace and tranquillity along the border"}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "9-india-china-areas-of-divergence-and-the", "t": "9 · India-China: areas of divergence and the border", "x": "9 · India-China: areas of divergence and the border # Class + handout Areas of divergence (slide 20, handout p. 9) Issue Nature of divergence Boundary dispute Competing claims and attempts to alter the status quo: Doklam (2017) , Galwan Valley clash (2020) ; LAC militarisation; Chinese claims over Arunachal Pradesh and place-name exercises create tension and di lide 27, handout pp. 13-14) Issue Nature of divergence Strategic autonomy The US expects closer alignment; India prefers issue-based cooperation without a formal alliance ; independent positions on Russia, Ukraine, China; engagement with BRICS and SCO Russia factor A key test of autonomy. Defence: S-400, Su-30MKI, T-90 in service. Energy: India prioritises affordable supplies, including Russian oil. Ukraine: dialogue and diplomacy, not automatic alignment. CAATSA: India opposes sanctions influencing sovereign defence choices Trade The US wants lower Indian tariffs on cars and motorcycles; India wants more market access. Reciprocal tariffs: a 25% reciprocal tariff plus a separate 25% tariff linked to Russian oil . A 2026 interim trade deal cut the rate to 18% (duty cuts on premium American cars and motorcycles). Agriculture: the US wants access for animal feed, nuts, fruits; India protects dairy, rice, wheat. WTO: public stockholding and subsidies. GSP: the US removed India from GSP in 2019 Digital and IPR Data localisation and rules on foreign digital firms. India is on the US Special 301 Priority Watch List ; India supports compulsory licensing for public-health needs (pharma) Defence technology The US shares more know-how than complete technological capability; export controls and end-use conditions can limit transfers Pakistan India opposes re-hyphenation of India and Pakistan in US policy and third-party mediation ; US security engagement with Pakistan raises terrorism concerns Mobility Indians received 71% of approved H-1B petitions (FY2024) ; wage-weighted selection may affect Indian applicants. Over 360,000 Indian students in the US (2025) ; 9 Indian student deaths (2018-2025) from violent attacks make student safety a bilateral concern Values and sovereignty US institutions raise religious freedom, press freedom, minority rights; India sees this as interference in internal affairs Climate India stresses CBDR and development space; US climate policy is volati India-US ties have moved from estrangement to strategic convergence . India seeks strategic pragmatism : using US capital, technology and innovation while preserving strategic autonomy and diversified partnerships."}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "16-india-russia-nature-evolution-and-conver", "t": "16 · India-Russia: nature, evolution and convergence", "x": "16 · India-Russia: nature, evolution and convergence # Class + handout India-Russia relations rest on long-standing political trust, defence, energy, nuclear power, space and Eurasian connectivity . The Ukraine war, sanctions, Russia-China proximity, India-US ties and defence diversification point towards new pragmatic balancing . Handout: “ strategic continuity with pragmatic adaptation ”. Nature of the relationship (slide 30) Nature Meaning Strategic trust Long-standing diplomatic and political support Defence ties Legacy platforms, spares, MRO and joint production Energy ties Crude oil, nuclear energy and resources Eurasian cooperation INSTC, Central Asia, Russian Far East Need for diversification Reduce excessive dependence on Russian systems Evolution of India-Russia relations (slide 31, handout p. 15) Phase Keyword Key developments 1947 Diplomatic beginning India and the Soviet Union established relations 1960s Defence partnership Soviet technology transfer for MiG-21 co-production 1971 Strategic trust Treaty of Peace, Friendship and Cooperation : symbol of Soviet support in the Bangladesh crisis 1975 Space cooperation Aryabhata , India’s first satellite, launched with Soviet help 1988 Nuclear cooperation Kudankulam agreement 1993 Post-Soviet adjustment Treaty of Friendship and Cooperation (handout only) 2000 Strategic Partnership Formal Strategic Partnership 2010 Special and Privileged Partnership Upgraded to Special and Privileged Strategic Partnership 2021 Institutional coordination First India-Russia 2+2 Dialogue (handout only) 2022 onwards Strategic stress Ukraine war, sanctions, payment problems, defence supply pressure; energy trade expanded sharply 2024-25 Energy-led trade expansion Trade about US$68.7 billion , driven largely by Indian imports 2025-26 Modernisation phase EAEU, INSTC, Russian Far East, Arctic, local payments, defence-industrial production Areas of convergence (slide 32, handout pp. 15-16) Area Key points Strategic and political Multipolarity; annual summits; Russia supports India’s permanent UNSC seat and NSG membership Multilateral platforms BRICS, SCO and RIC Defence Su-30MKI, T-90, S-400, AK-203, INS Vikramaditya ; Russia important for MRO Defence production Shift from buyer-seller to licensed production, joint development and maintenance (2021-31 defence programme) Energy and economy About 1.92 million barrels a day in May 2026, 36.5% of India’s crude imports ; Rosneft-Essar Oil deal; trade US$68.7 billion in FY2024-25, target US$100 billion by 2030 Civil nuclear Kudankulam is the flagship; also Rooppur in Bangladesh Connectivity INSTC links India with Iran, the Caspian, Russia and Europe and complements Chabahar ; Chennai-Vladivostok corridor to the Russian Far East (energy, minerals, coal, Arctic trade) Space and science Aryabhata (1975); Russia supports Gaganyaan ; GLONASS, polar research, basic sciences, telemedicine Class slide 33 INSTC: the corridor from India through Iran and the Caspian to Russia and Europe."}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "17-india-russia-divergence-the-triangle-and", "t": "17 · India-Russia: divergence, the triangle and way forward", "x": "17 · India-Russia: divergence, the triangle and way forward # Class + handout Areas of divergence (slide 34, handout pp. 16-17) Issue Concern for India Russia-China proximity May reduce India’s strategic space in Eurasia India’s Western partnerships Moscow may view the Quad and Western defence ties with concern. The handout adds this is multi-alignment, not an anti-Russia position : India’s Indo-Pacific focus differs from Russia’s continental Eurasian focus Defence dependence S-400 delays , spare-part risks, sanctions-related payment and logistics problems Ukraine war India supported dialogue and diplomacy, avoided automatic alignment, kept buying Russian crude, protected defence supply chains and kept talking to Ukraine and the West Trade imbalance India exports about US$4.3 billion and imports about US$61.4 billion (2023-24) ; India needs more exports of pharma, engineering goods, machinery, chemicals, textiles, marine products, IT and services Russia-Pakistan engagement Military exercises, Afghanistan engagement, energy exports: a security concern for India Technology gap Strong in defence and nuclear, weak in AI, semiconductors, digital technologies, telecom, advanced electronics and commercial space Russia-China-India triangle (slide 35) Dimension Concern India’s response Strategic alignment Russia-China closeness may deepen (and Western sanctions may deepen Russia’s China dependence) Diversify Russia’s links with India; build domestic capacity Central Asia China leads trade; Russia remains the security actor Use Chabahar, INSTC and SCO BRICS/SCO Chinese influence may shape these platforms Use them for reform and Global South cooperation Energy and resources China may gain greater access to the Arctic and Far East Protect India’s interests in LNG, coking coal, rare earths Handout: India needs Russia to keep enough strategic space in Eurasia, without expecting it to balance China . Way forward (slide 36, handout p. 17) Area Way forward Political Maintain trust amid Russia-China and India-US ties; communicate that Russia remains part of India’s strategic calculus Economic Accelerate India-EAEU FTA talks; diversify trade beyond oil into metallurgy, chemicals, space Ukraine Maintain dialogue and diplomacy Defence Spares and maintenance dialogue; joint development and production under Make in India ; explore joint exports to third countries Payments Local-currency mechanisms within sanctions constraints; more private-sector participation People-to-people Youth and academic exchanges; Yoga and cultural diplomacy Conclusion (slide 36) India-Russia ties must evolve from a defence-and-energy anchor into a diversified partnership covering technology, critical minerals and Eurasian connectivity. Strategic autonomy and mutual trust can sustain it without limiting India’s choices ."}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "18-india-european-union", "t": "18 · India-European Union", "x": "18 · India-European Union # Handout only Source note Handout only (pages 18-20): no class slides yet for the EU, France, Japan and Australia. India-EU relations are evolving into a trade-technology-climate partnership . The EU is a major market and a regulatory, technology and strategic partner. Nature: steadily expanding but often negotiation-driven ; moving from limited economic engagement to a broader strategic partnership. Evolution (handout p. 18) Year Key idea Development 1960s Diplomatic beginning Relations with the European Economic Community 1994 Broader cooperation India-EU Cooperation Agreement 2004 Strategic partnership Upgraded to Strategic Partnership 2007 FTA negotiations Trade and Investment Agreement/FTA talks began 2013 Slowdown Talks stalled over market access, tariffs, mobility, data, investment 2020 Strategic roadmap Roadmap to 2025 2021 Connectivity India-EU Connectivity Partnership 2022 Technology partnership Trade and Technology Council (TTC) announced 2025 Technology and Europe outreach Second TTC; India-EFTA TEPA entered into force 2026 Strategic upgrade India-EU FTA negotiations concluded; cooperation widened into security, defence, technology, climate Convergence Area Key points Strategic and political Rules-based multilateralism, WTO reform , climate; counter-terrorism, cyber, maritime security, non-proliferation, defence Economic and investment Goods trade about US$136.54 billion , services US$83.10 billion (2024-25) . The FTA (“Mother of All Deals”) covers 99.5% of India’s exports : duty-free access for textiles and leather; dairy, cereals, poultry excluded ; access to EU service subsectors (IT, education); mobility for IT professionals, nurses, consultants; AYUSH practitioners may serve where no EU rules exist Technology and digital TTC : AI, semiconductors, HPC, 6G, cybersecurity, DPI, trade and economic security; trusted technology Climate and green transition Green hydrogen, offshore wind, solar, batteries, circular economy, clean steel, efficiency Supply chains and minerals China+1 : semiconductors, pharma, medical devices, electronics, critical minerals, clean tech Connectivity Connectivity Partnership, Global Gateway and IMEC Mobility and services Professional, student and service-provider mobility; research exchanges Divergence Dimension European Union India Strategic approach Normative and regulatory power Strategic autonomy Economic approach High standards and regulation Development space and market access Security Greater emphasis on collective European action Dialogue and diversified partnerships Climate Strong regulatory approach Equity, finance and development space Other frictions: market access, standards, investment protection; GDPR and the AI Act and the absence of EU “data secure” status for India raise compliance costs; EU standards can act as non-tariff barriers for MSMEs; CBAM affects Indian steel, aluminium, cement, fertilisers, hydrogen; visa and labour policy mostly sit with member states; on Russia-Ukraine the EU’s sanctions approach differs from India’s dialogue, energy security and autonomy. Way forward Area Way forward Trade Implement the FTA protecting services, pharma, textiles, MSMEs; improve services mobility and professional recognition Climate Seek CBAM-related carbon recognition, climate finance and technology access Technology Use the TTC for semiconductors, AI, 6G, quantum, HPC, cybersecurity, DPI; trusted digital ecosystems that protect privacy and regulatory autonomy Supply chains and connectivity Diversify chains; move the Connectivity Partnership, Global Gateway and IMEC towards implementation Strategic and security Maritime security, counter-piracy, counter-terrorism, cyber, space; the Security and Defence Partnership Mobility Professional mobility, research exchanges, student visas; India-EFTA TEPA as a supporting marker Conclusion India-EU is moving from a trade-focused partnership to a broader trade-technology-climate and strategic partnership. Next phase: FTA implementation, climate transition, supply chains, mobility and connectivity, balancing EU regulatory power with India’s development needs and strategic autonomy."}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "19-india-france", "t": "19 · India-France", "x": "19 · India-France # Handout only Source note Handout only (pages 19-20): no class slides yet. Ties are guided by the Horizon 2047 Roadmap (2023) . In February 2026 the relationship was elevated to a Special Global Strategic Partnership . Shared: a multipolar order, strategic autonomy, a rules-based Indo-Pacific. France is a resident Indo-Pacific power (overseas territories and military presence); cooperation on maritime security, the Indian Ocean, freedom of navigation and Indo-Pacific connectivity. Cooperation areas (handout pp. 19-20) Area Key points Rafale 36 Rafale inducted for the Air Force. April 2025 : contract for 26 Rafale-Marine for the Navy, with technology transfer for integrating indigenous weapons, a Rafale fuselage production facility, MRO for engines, sensors and weapons in India Scorpene Six Kalvari-class submarines built in India under Project-75 ; sixth commissioned January 2025 ; further cooperation under discussion Defence manufacturing Helicopter engines, combat-aircraft engines, HAMMER missiles, MRO. Tata-Airbus H125 Final Assembly Line at Vemagal, Karnataka (2026): India’s first private-sector helicopter final assembly line Exercises Varuna (Navy), Garuda (Air Force), Shakti (Army) Civil nuclear Jaitapur (Maharashtra), planned six EPR reactors ; exploring SMRs and AMRs Emerging technology AI, cyber, critical technologies under the Year of Innovation and Innovation Roadmap 2030 Space ISRO-CNES : Megha-Tropiques, SARAL; TRISHNA under development; human-spaceflight-related areas Digital payments France was the first European country to accept UPI (2024, Eiffel Tower tickets) Clean energy Jointly launched the International Solar Alliance (2015) Trade and investment Trade about €13.6 billion (FY 2025-26) ; a June 2026 high-level mechanism aims to double trade in five years ; 38 of the 40 CAC-40 companies operate in India Students Target 30,000 Indian students in France by 2030 (from about 10,000 in the mid-2020s) The relationship is moving from… Buyer-seller ties → Co-production Traditional strategic cooperation → Technology and innovation Bilateral partnership → Wider Indo-Pacific and global cooperation"}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "20-india-japan", "t": "20 · India-Japan", "x": "20 · India-Japan # Handout only Source note Handout only (pages 21-22): no class slides yet. “We see Japan as a natural partner.” (PM Narendra Modi, quoted.) The partnership evolved from ODA-led development cooperation to a broader strategic and economic partnership. It is trust-based and largely conflict-free , but outcomes have sometimes stayed below expectations. Convergence (handout p. 21) Area Key points Strategic and political Free, open, inclusive, rules-based Indo-Pacific; Quad, JAI, Malabar Economic and investment Trade about US$27.47 billion (FY 2025-26) ; Japan’s JPY 10 trillion private investment target; cumulative FDI above US$40 billion ; fast-track mechanism under the India-Japan Industrial Competitiveness Partnership (IJICP) ODA and infrastructure Delhi Metro, Western DFC, Mumbai-Ahmedabad High Speed Rail ; Act East Forum for Northeast connectivity; third-country projects via the Asia-Africa Growth Corridor Defence and maritime Exercises JIMEX, Dharma Guardian, Veer Guardian, Malabar ; 2+2 dialogue, ACSA, UNICORN Supply chain and economic security SCRI ; critical minerals, semiconductors, AI, clean energy, telecom, critical infrastructure Space, science, technology LUPEX (Joint Lunar Polar Exploration Mission); first India-Japan AI Strategic Dialogue (2026) ; IndiaAI Mission- GENIAC memorandum ODA (Official Development Assistance): government aid from developed nations, multilateral institutions or agencies to support the economic development and social welfare of developing countries. Divergence Dimension Japan India Strategic alignment US-led alliance system Strategic autonomy and multi-alignment China challenge Mainly maritime/Pacific Land + maritime Indo-Pacific Alliance-based deterrence Cooperation without formal alignment Defence Strong US integration Diversified partnerships Gaps: trade and investment underperform strategic convergence (land, logistics, taxation, compliance); project delays (land acquisition, cost escalation); difficult terrain and Myanmar instability constrain Northeast-ASEAN connectivity; CEPA underutilised (awareness, standards, certification, non-tariff barriers); language and skills gaps; cooperation stronger in exercises and logistics than in defence technology transfer and co-production . Way forward Area Way forward Economy and investment Convert the JPY 10 trillion target into projects in semiconductors, batteries, EVs, clean energy, logistics; fix land, clearances, contracts; supplier clusters and skill pipelines Infrastructure Strengthen Northeast-ASEAN connectivity; better project management Strategic clarity Defence partnership and institutions; move to drones, electronics, cyber, space, surveillance; co-production Technology Semiconductors, critical minerals, clean energy, telecom, cyber, AI, space People Japanese-language training, skill certification, student exchanges Conclusion India-Japan has grown from ODA to a broad strategic partnership. Trade, investment, execution and technology gaps remain. The next phase should convert strategic convergence into deeper economic, industrial and technological cooperation."}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "21-india-australia", "t": "21 · India-Australia", "x": "21 · India-Australia # Handout only Source note Handout only (pages 22-23): no class slides yet. From a low-intensity relationship to a high-trust Indo-Pacific partnership . Australia is India’s southern Indo-Pacific anchor , linking the Indian Ocean, the Pacific, the Quad, critical-mineral security and China+1 supply-chain diversification. Convergence (handout pp. 22-23) Area Key points Strategic and political Free, open, inclusive, rules-based Indo-Pacific; Quad, IORA, EAS, IPOI and ASEAN-centred mechanisms Economic and investment Trade A$50.2 billion (2025) ; India is Australia’s 5th-largest trading partner ; ECTA gives preferential access; talks progressing towards CECA Critical minerals Lithium, cobalt, nickel, rare earths for EVs, batteries, electronics, clean energy; India-Australia Critical Minerals Corridor Clean energy and nuclear 2026 summit finalised arrangements for long-term Australian uranium exports to India under IAEA safeguards Defence and maritime 2026 summit: Joint Declaration on Defence and Security Cooperation , Annual Defence Ministers’ Dialogue , Maritime Security Collaboration Roadmap . Exercises Malabar, AUSINDEX, AUSTRAHIND ; 2+2; Mutual Logistics Support Arrangement Technology, cyber, space 2026 summit launched PACTS (Australia-India Partnership on Cyber, Critical Technologies and Supply Chains) Education and people Student mobility, research, skills; Deakin University campus at GIFT City Divergence Dimension Australia India Strategic alignment US-led alliance system Strategic autonomy and multi-alignment China Greater alliance-based deterrence Engagement + de-risking without bloc politics Indo-Pacific Strong security focus Security + development + strategic autonomy Defence Deep US integration Diversified partnerships Gaps: CECA differences on agriculture, dairy, wine, services, mobility (India cautious on sensitive farm sectors); China dominates global processing and refining of minerals; defence-industrial cooperation less developed than exercises; student visas, cost, safety, employability, recognition; diaspora strains (extremism, hate crimes). Way forward Area Way forward Trade Conclude a balanced CECA protecting sensitive agriculture and livelihoods Minerals and energy Move from MoUs to mining, processing, refining, recycling, strategic reserves; use uranium cooperation for nuclear-energy security Defence and maritime Deepen Malabar, AUSINDEX, AUSTRAHIND, 2+2, logistics; shipbuilding, repair, maintenance Technology Implement PACTS in cyber, AI, quantum, critical technologies, supply chains People Student mobility, visas, safety, employability, qualification recognition; research and skilling Conclusion India-Australia is moving from strategic convergence to an operational partnership , making Australia a key pillar of India’s Indo-Pacific strategy ; the focus is now implementation and outcomes."}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "chapter-timeline", "t": "Timeline", "x": "Timeline # 1947 India-USSR diplomatic relations established 1949-50 India recognises the PRC (1949); diplomatic relations (1950) 1954 Panchsheel Agreement with China ★ 1960s MiG-21 co-production (India-Soviet defence partnership) 1962 India-China war: Aksai Chin comes under Chinese control; brief US support ★ 1971 India-USSR Treaty of Peace, Friendship and Cooperation; US tilt to Pakistan ★ 1975 Aryabhata launched with Soviet help 1976-88 India-China ambassadors resume; Rajiv Gandhi visit 1988 1988 Kudankulam agreement with the USSR 1993-96 India-China peace and tranquillity agreements 1998 Pokhran-II sanctions; Jaswant Singh-Strobe Talbott dialogue begins 2000 India-Russia Strategic Partnership 2003 India-China Special Representatives mechanism 2004 India-EU Strategic Partnership 2005 India-China agreement on guiding principles for a settlement 2005-08 India-US Civil Nuclear Agreement (2008 foundation) ★ 2010 India-Russia Special and Privileged Strategic Partnership 2013 India-EU FTA talks slow down 2015 International Solar Alliance launched (India-France) 2016 LEMOA; India designated a Major Defence Partner 2017 Doklam standoff ★ 2018 2+2 Ministerial Dialogue (India-US) 2019 US removes India from GSP 2020 Galwan clash; BECA ★ 2021 First India-Russia 2+2; India-EU Connectivity Partnership 2022 Russia invades Ukraine; India-EU TTC announced 2023 Finland joins NATO; India joins Artemis Accords; Horizon 2047 (France); Saudi-Iran rapprochement 2024 Sweden joins NATO; Depsang-Demchok understanding (October); France accepts UPI (Eiffel Tower tickets) ★ Apr 2025 China licenses seven heavy rare earths; Rafale-M contract 2025 Dalai Lama succession statement (July); India-EFTA TEPA; Justice Mission 2025 Jan 2026 EU Regulation to phase out Russian gas and LNG Feb 2026 India-France relationship elevated to a Special Global Strategic Partnership 2026 India-EU FTA negotiations concluded; Graham Act; US-India interim trade deal (18%); US exits Paris Agreement; Ankara NATO Summit (€70 bn); 18th BRICS Summit; New Delhi Declaration ★ Sep 2026 Trump-Xi summit: AI dialogue proposed, trade truce extended, $30 bn tariff cuts each way"}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "traps", "t": "Traps", "x": "Traps # Common mix-ups and the rule for the exam hall Trap What goes wrong, and the rule Balancing, bandwagoning, autonomy Balancing opposes the dominant power; bandwagoning joins it; autonomy decides alone. Rule: Belarus-Russia and Pakistan-China are bandwagoning; India is autonomy. Strategic entente is not an alliance An informal understanding, no formal treaty duty. Rule: Russia-China “No Limits” is an entente, not a military alliance (the handout says so). Power Transition Theory versus Thucydides Trap Theory = conflict is likelier when a rising power nears the dominant one. Trap = the risk when a rising power threatens an established one. Rule: the Trap is the risk label, the Theory is the cause. Not a complete new Cold War Slide 13 and slide 15 both stress interdependence and strategic autonomy. Rule: in an answer, never accept “new Cold War” or “two blocs” without this qualifier. Western, middle and eastern sector lengths 1,597 (west), 545 (middle), 1,346 (east) = 3,488 km. The middle is the least disputed. Rule: Aksai Chin and Galwan are west; McMahon Line and Doklam are east. Doklam 2017 versus Galwan 2020 Doklam: India-Bhutan-China tri-junction (east). Galwan: Ladakh (west). Rule: Doklam = 2017 east; Galwan = 2020 west. Gwadar is not a Chinese naval base The handout warns that commercial access should not automatically be called a naval base. Rule: say “potential maritime dimension”. String of Pearls ports Gwadar, Hambantota, Kyaukpyu in Issue box 2; Chapter 1 also lists Djibouti. Rule: do not mix them with the Diamond Necklace (Chabahar, Duqm, Sabang). Tariff figures 25% reciprocal + 25% Russian-oil-linked = up to 50%; the 2026 interim deal cut it to 18%. Rule: give the 25+25 split, then 18%. India avoids “forced abandonment of Russia” India seeks closer US defence ties but avoids a forced break with Russia. Rule: use the seeks v avoids table for “partnership without alliance”. Russia’s trade gap India exports about US$4.3 bn and imports about US$61.4 bn (2023-24); trade total US$68.7 bn is FY2024-25. Rule: quote year with each number. Handout only EU, France, Japan and Australia have no class slides yet. AUKUS, Pax Silica, Mythos 5 and Operation Absolute Resolve are named without explanation. Rule: do not invent details; check class notes."}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "connects", "t": "Connects to", "x": "Connects to # Chapter 1: six phases Phases 5 and 6 (US-China rivalry, Russia-West) are unpacked here with each power’s ambitions and instruments. Chapter 1: India’s evolution The 1971 Treaty and the USS Enterprise episode link to “strategic mistrust” (US) and “strategic trust” (Russia) here. Chapter 1: trade-offs Strategic autonomy versus alignment, China competition versus engagement: the examples are the Quad, Russian oil and S-400 here. Syllabus: India and its neighbourhood China-Pakistan nexus, CPEC, Gwadar, Hambantota and Kyaukpyu, Brahmaputra and Bangladesh lead to the neighbourhood chapters. Syllabus: groupings Quad, BRICS, SCO, I2U2, IMEC, IPEF, AUKUS, RIC and EAEU appear across the powers. Each is a “bilateral, regional and global grouping”. Syllabus: diaspora US diaspora (1.5%, over $300 bn in federal taxes, 82% STEM students) leads to the diaspora topic. Syllabus: policies of other countries US tariffs, the Graham Act 2026, CAATSA, H-1B, China’s rare-earth licensing and EU CBAM are the “effect of policies on India’s interests”. Syllabus: international institutions UNSC and WTO reform, NDB, AIIB, BRICS and SCO platforms."}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Major power: capability + intent to shape order. Responses: balancing, bandwagoning, strategic autonomy. Bandwagoning examples: Belarus-Russia, Pakistan-China. US: four ambitions (great-power balance; economic and technological superiority; financial and institutional influence; Western Hemisphere). Quad, I2U2, AUKUS; CHIPS 2022; Graham Act 2026 (up to 100%); Monroe Doctrine; Operation Absolute Resolve. China: national rejuvenation; regional centrality (BRI, CPEC, Gwadar, Djibouti, Two-Ocean, A2/AD); tech leadership (Made in China 2025, New Three); multipolarity (BRICS, SCO, AIIB, GDI, GSI, GCI; Saudi-Iran 2023). Russia: multipolarity (BRICS, SCO, EAEU, BRICS Bridge); Eurasia (CSTO, nuclear doctrine); energy (shadow fleet); connectivity (Northern Sea Route, Russia-North Korea Treaty). Strategic entente = informal, not alliance. US-China: Thucydides Trap; seven dimensions; Washington v Beijing Consensus; Sept 2026 summit (AI dialogue, $30 bn tariff cuts). Core ideas: tech is a national-security issue; not a new Cold War. Russia-West: Finland 2023, Sweden 2024; Ankara €70 bn; EU gas 45% to 12%; No Limits trade $228 bn. Core idea: not two fixed blocs. India frame: autonomy, multi-alignment, issue-based; US tech, defence, Indo-Pacific; China deterrence and engagement; Russia defence, energy, Eurasia. Jaishankar: engage America, manage China, cultivate Europe, reassure Russia, bring Japan into play. India-China phases: 1950-54 Panchsheel; 1950s-62 rupture; 1976-88 Rajiv visit; 1993-2005 border management; 2008-13 economy; 2017-20 Doklam, Galwan; 2020-24 Depsang-Demchok Oct 2024; 2025-26 re-engagement. Border: 3,488 km = 1,597 western + 545 middle + 1,346 eastern. Aksai Chin (west); McMahon Line (east); Doklam tri-junction. Trade $151 bn; deficit about $112.16 bn. China issue boxes: Pak nexus (CPEC, two-front, Gwadar); String of Pearls (Gwadar, Hambantota, Kyaukpyu); Brahmaputra (upstream); rare earths (90.4% of magnets; Rs 7,280 crore; 6,000 tonnes). Three Mutuals. India-US: partnership not alliance; 1962, 1971 mistrust, Pokhran-II to Talbott, Nuclear deal 2005-08, LEMOA/COMCASA/BECA, iCET to TRUST, Mission 500 ($500 bn by 2030). Frictions: Russia, tariffs 25+25 to 18%, GSP 2019, H-1B 71%, Pakistan, CBDR. Seeks v avoids table. India-Russia: 1947, MiG-21, 1971 Treaty, Aryabhata 1975, Kudankulam 1988, 2000 SP, 2010 SPSP; crude 36.5%; trade $68.7 bn, target $100 bn by 2030; INSTC, Chennai-Vladivostok; S-400, AK-203; triangle with China; trade deficit ($4.3 bn out, $61.4 bn in). EU: 1994, 2004, 2007 FTA talks, 2013 stall, TTC 2022, FTA concluded 2026 (99.5% of exports; dairy excluded); CBAM, GDPR. France: Horizon 2047, Rafale 36 + 26 M, Kalvari, Jaitapur, UPI, ISA 2015. Japan: ODA, JPY 10 tn, $40 bn FDI, IJICP, LUPEX, SCRI, CEPA underused. Australia: A$50.2 bn, ECTA to CECA, uranium, PACTS, Critical Minerals Corridor, Malabar and AUSINDEX."}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts below) Blank-page prompts Fill a 3 x 4 grid: US, China, Russia against their four ambitions and one example each. Draw the India-China border with its three sectors, lengths and key points. Write the “India seeks / India avoids” table for the US from memory. Write one line each on the EU, France, Japan and Australia: what grows, what lags."}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards Mains answer skeletons One for each Mains PYQ quoted in the material. Tap to open; try the answer first. Mains 2026 (15m, 250w): BRI and South Asia as a theatre of great-power competition Intro: the BRI (2013) uses ports, railways and corridors (CPEC, Gwadar) to deepen China’s regional centrality, and South Asia has become a space where China, India and the US compete. Security: CPEC through PoK is a sovereignty objection; China-Pakistan defence cooperation complicates two-front planning; Gwadar adds a potential maritime dimension (do not call it a naval base). Indian Ocean: String of Pearls (Gwadar, Hambantota, Kyaukpyu), research vessels, naval reach; India’s response: maritime domain awareness, neighbourhood partnerships, SAGAR/MAHASAGAR, Quad. Regional influence: Chinese infrastructure money competes with Indian connectivity; India must offer faster, reliable projects (way forward). Critical view: “theatre of competition” is partly true, but South Asia states also hedge; India is more than a reactor (Quad, Act East, partnerships). Closing: BRI raises the stakes for India’s security and influence; the answer is delivery, partnerships and deterrence, not rejection alone. Mains 2024 (10m, 150w): the West fostering India as an alternative to China Intro: US-China rivalry and Russia-West confrontation have pushed the West to look for trusted partners and diversified supply chains. Supply chains: China+1 and friend-shoring open opportunities for India in electronics, semiconductors, pharmaceuticals; the EU lists semiconductors, pharma, medical devices, critical minerals; Australia, France, Japan on minerals and manufacturing. Strategic ally: Quad and Malabar, India-US defence framework and iCET/TRUST, India-France co-production, Japan’s JPY 10 tn target. Limits: dependence on Chinese inputs (rare-earth magnets 90.4%), Russia ties and strategic autonomy, trade frictions (tariffs, CBAM), execution gaps (Japan). Closing: the West sees India as a partner, not a proxy; India accepts it on its own terms. Mains 2023 (15m, 250w): NATO expansion and a stronger US-Europe partnership: good for India? Intro: the Ukraine war expanded NATO (Finland 2023, Sweden 2024) and tightened US-Europe coordination. For India the effect is mixed. Gains: West looks to India for supply chains and technology; EU FTA, TTC; France and US defence co-production; India gets scope for diversification away from Russia. Costs: sanctions on Russia hit India’s defence spares and energy; Graham Act 2026; India-Russia-China triangle can reduce India’s space in Eurasia; pressure on strategic autonomy. India’s response: dialogue and diplomacy on Ukraine, no automatic alignment, multi-alignment, defence diversification and indigenisation. Closing: only partly: it widens India’s options but also raises costs on Russia ties; autonomy decides the net effect. Mains 2021 (15m, 250w): AUKUS and existing partnerships (thin notes: AUKUS is only named) Intro: AUKUS is listed among US minilateral groupings that strengthen regional deterrence. (The notes give no more detail: add AUKUS facts after class before using this in the exam.) Context from the notes: the US builds flexible coalitions (NATO, Quad, I2U2, AUKUS) to prevent China’s regional dominance; alliances with Japan, South Korea, Australia and the Philippines. Existing partnerships: Quad and Malabar for maritime security and technology; India-Australia cooperation (Malabar, AUSINDEX, PACTS); minilateralism supplements, not replaces, existing groupings (Chapter 1). Verdict frame: AUKUS adds a layer; it does not supersede the Quad or ASEAN-centred mechanisms. Closing: another coalition layer in a multipolar churn, not a replacement. Mains 2020 (15m, 250w): Indo-US over Indo-Russian defence deals and the Indo-Pacific Intro: defence ties with the US are moving from arms purchases to interoperability, co-production and technology; Russia remains a legacy and maintenance pillar. US: LEMOA 2016, COMCASA, BECA 2020, 2+2, 2025 ten-year framework, defence trade about $25 bn by end-2023; Quad and Malabar for Indo-Pacific stability. Russia: Su-30MKI, T-90, S-400, AK-203, INS Vikramaditya; MRO; shift to licensed production; but S-400 delays, spares, payment and sanctions risks. Indo-Pacific stability: US partnership supports freedom of navigation and a balance against China; Russian systems are continental in focus (the handout). India’s approach: diversify suppliers; CAATSA objection; no forced abandonment of Russia. Closing: significance of US deals lies in interoperability and technology; Russia stays a legacy pillar; India diversifies. Mains 2020 (15m, 250w): Quad, from military alliance to trade bloc? Intro: the Quad is a minilateral grouping for a free, open and rules-based Indo-Pacific, not a treaty alliance. Test the claim: the notes link the Quad with Malabar, maritime security, resilient supply chains and critical technologies. No trade bloc features are named. India avoids “a formal anti-China military bloc”, “treaty alliance” and “automatic war commitments” (India seeks v avoids). Wider footing: IPEF and friend-shoring (US), SCRI (India, Japan, Australia), PACTS and the Critical Minerals Corridor (Australia). Closing: the Quad is a multi-issue minilateral: security plus supply chains and technology; “trade bloc” overstates the shift. Mains 2019 (15m, 250w): why friction between India and the US Intro: ties moved from Cold War mistrust (1971) to strategic partnership, but a “partnership, not alliance” leaves gaps in expectations. The statement’s core: the US expects closer alignment; India wants issue-based cooperation, autonomy and recognition of its ambitions. Examples: Russia (S-400, CAATSA, oil); tariffs and GSP removal (2019); Pakistan (re-hyphenation, mediation); H-1B and student safety; defence technology limits; values and sovereignty. Counter-evidence: Nuclear Agreement 2005-08, LEMOA/BECA, iCET, Quad. Closing: friction comes from different expectations of India’s role, but converging interests keep the partnership growing. Mains 2019 (10m, 150w): India and Japan, a global and strategic partnership Intro: India-Japan has moved from ODA-led cooperation to a strategic and economic partnership around a free, open Indo-Pacific. Strategic: Quad, JAI, Malabar; JIMEX; 2+2, ACSA; SCRI; LUPEX and AI dialogue. Economic: JPY 10 tn target; Delhi Metro, Western DFC, high-speed rail; Act East Forum; Asia-Africa Growth Corridor. Gaps: trade below potential; execution delays; CEPA underuse; limited defence-technology transfer. Closing: significance for Asia and the world is real; the test is turning convergence into projects. Mains 2018 (15m, 250w): US-Iran nuclear pact and India (thin notes) Intro: the notes do not cover the US-Iran nuclear pact; they cover the Iran-linked pieces below. Add the pact’s details after class. Connectivity: INSTC complements Chabahar; Iran and Central Asia routes matter more if Russia-West tension affects INSTC. Sanctions: the Graham Act 2026 extends Iran sanctions (a risk for India’s energy and connectivity choices). India’s response in the notes’ frame: strategic autonomy and issue-based partnerships; diversify energy; avoid taking sides. Closing: India’s interests (energy, Chabahar, INSTC) argue for autonomy and quiet diplomacy. Mains 2017 (10m, 150w): China’s trade surplus and military ambitions Intro: China’s manufacturing scale and export position fund its military modernisation and regional reach. Economic: trade deficit about $112.16 bn (FY2025-26); dependence on rare earths, graphite, electronics; telecom and cyber risks. Military reach: PLA, A2/AD, Two-Ocean strategy, Djibouti; BRI, CPEC, Gwadar, String of Pearls. India’s response: de-risking, domestic capacity (Rs 7,280-crore magnet scheme), Maritime Domain Awareness, Quad, LAC preparedness, selective engagement. Closing: economic interdependence is also a vulnerability; India combines engagement with de-risking."}]</script><script>
(function(){var D=JSON.parse(document.getElementById('sdata').textContent),q=document.getElementById('q'),res=document.getElementById('res'),cnt=document.getElementById('cnt');
cnt.textContent=D.length+' sections indexed. Tables and diagrams are included as text where possible.';
function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function run(){var v=q.value.trim().toLowerCase();res.innerHTML='';if(v.length<2)return;var ts=v.split(/\s+/),n=0,h='';
for(var i=0;i<D.length&&n<40;i++){var d=D[i],tx=(d.t+' '+d.x).toLowerCase(),ok=ts.every(function(t){return tx.indexOf(t)>=0});if(!ok)continue;n++;
var p=tx.indexOf(ts[0]),s=Math.max(0,p-60),sn=d.x.substr(s,180);
h+='<div class="hit"><a href="geo-ch'+('0'+d.c).slice(-2)+'.html#'+d.id+'"><b>'+esc(d.t)+'</b></a><br><small>'+esc(d.n)+'</small><br>…'+esc(sn)+'…</div>'}
res.innerHTML=h||'<p class="prog">No matches.</p>'}
q.addEventListener('input',run)})();</script><script>/* Shared store: reading progress, preferences, optional cross-device sync. */
(function(){
var KEY='nbapp:v1',root=document.documentElement;
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function fresh(){return{v:1,prefs:{fs:1,lh:1.65,w:780,font:'serif',theme:'auto',pt:0},last:null,nb:{},days:{}}}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var S;
try{S=JSON.parse(lsGet(KEY))}catch(e){S=null}
if(!S||!S.v)S=fresh();
S.prefs=Object.assign(fresh().prefs,S.prefs||{});
// one-time import of the older done list and theme
if(!S.migrated){
  try{var od=JSON.parse(lsGet('nb-done')||'[]');od.forEach(function(n){var c=chap('modern-india',n);c.done=1;c.dt=1})}catch(e){}
  var ot=lsGet('nb-theme');if(ot&&!S.prefs.pt){S.prefs.theme=ot;S.prefs.pt=1}
  S.migrated=1;
}
function chap(nb,n){var b=S.nb[nb]||(S.nb[nb]={});return b[n]||(b[n]={read:{},done:0,dt:0,pos:null,t:0})}
var listeners=[],dirty=false,saveT=null,syncT=null;
function save(){
  dirty=true;clearTimeout(saveT);
  saveT=setTimeout(function(){lsSet(KEY,JSON.stringify(S));listeners.forEach(function(f){try{f()}catch(e){}});scheduleSync()},250);
}
function flush(){lsSet(KEY,JSON.stringify(S))}
function merge(a,b){ // a local, b remote; returns merged
  var o=fresh();
  o.prefs=((b.prefs&&b.prefs.pt||0)>(a.prefs&&a.prefs.pt||0))?Object.assign({},a.prefs,b.prefs):Object.assign({},b.prefs,a.prefs);
  o.last=(!a.last||(b.last&&b.last.ts>a.last.ts))?b.last:a.last;
  o.migrated=1;
  var ids={};Object.keys(a.nb||{}).concat(Object.keys(b.nb||{})).forEach(function(k){ids[k]=1});
  Object.keys(ids).forEach(function(id){
    o.nb[id]={};var ca=(a.nb||{})[id]||{},cb=(b.nb||{})[id]||{},ks={};
    Object.keys(ca).concat(Object.keys(cb)).forEach(function(k){ks[k]=1});
    Object.keys(ks).forEach(function(k){
      var x=ca[k],y=cb[k];if(!x||!y){o.nb[id][k]=x||y;return}
      var r=Object.assign({},x.read,y.read),done=(y.dt||0)>(x.dt||0)?y:x,pos=(y.t||0)>(x.t||0)?y.pos:x.pos;
      o.nb[id][k]={read:r,done:done.done,dt:done.dt||0,pos:pos,t:Math.max(x.t||0,y.t||0)};
    });
  });
  var dk={};Object.keys(a.days||{}).concat(Object.keys(b.days||{})).forEach(function(k){dk[k]=1});
  Object.keys(dk).forEach(function(k){o.days[k]=Math.max((a.days||{})[k]||0,(b.days||{})[k]||0)});
  return o;
}
var syncState='off';
function scheduleSync(){clearTimeout(syncT);syncT=setTimeout(function(){sync()},4000)}
var dbp=null;
function getRef(){
  if(dbp)return dbp;
  dbp=(async function(){
    if(!window.claude||!claude.use)return null;
    var db=await claude.use('db'),u=await claude.use('user');
    if(!db||!u||!u.id)return null;
    var id=await u.id();if(!id)return null;
    return db.doc('data/users/'+id+'/nbapp');
  })().catch(function(){return null});
  return dbp;
}
var busy=false;
async function sync(){
  if(busy)return;busy=true;
  try{
    var ref=await getRef();if(!ref){syncState='local';return}
    var snap=await ref.get(),rem=null;
    if(snap.exists){var d=snap.data();try{rem=JSON.parse(d.state)}catch(e){}}
    var m=rem?merge(S,rem):S;
    var changed=JSON.stringify(m)!==JSON.stringify(S);
    S=m;
    if(changed){flush();listeners.forEach(function(f){try{f()}catch(e){}})}
    var out=JSON.stringify(S);
    if(!rem||JSON.stringify(rem)!==out)await ref.set({v:1,updated:Date.now(),state:out});
    syncState='synced';
  }catch(e){syncState='local'}
  finally{busy=false}
}
var API={
  get:function(){return S},
  chap:chap,
  save:save,flush:flush,sync:sync,
  onChange:function(f){listeners.push(f)},
  syncState:function(){return syncState},
  setPref:function(k,v){S.prefs[k]=v;S.prefs.pt=Date.now();applyPrefs();save()},
  reset:function(){S=fresh();S.migrated=1;flush();save()},
  today:today,
  pct:function(nb,n,total){var c=(S.nb[nb]||{})[n];if(!c||!total)return 0;var r=0;Object.keys(c.read||{}).forEach(function(k){if(c.read[k])r++});return Math.min(1,r/total)},
  isDone:function(nb,n,total){var c=(S.nb[nb]||{})[n];if(!c)return false;if(c.dt)return !!c.done;return false}
};
window.NBS=API;
function applyPrefs(){
  var p=S.prefs;
  var th=p.theme;
  if(th==='auto')root.removeAttribute('data-theme');else root.setAttribute('data-theme',th);
  root.style.setProperty('--zoom',p.fs);root.style.setProperty('--lh',p.lh);root.style.setProperty('--pw',p.w+'px');
  root.setAttribute('data-font',p.font);
}
API.applyPrefs=applyPrefs;applyPrefs();
// studied time, counted while the page is visible and touched in the last minute
var lastAct=Date.now();
['scroll','pointerdown','keydown','touchstart'].forEach(function(e){addEventListener(e,function(){lastAct=Date.now()},{passive:true})});
setInterval(function(){
  if(document.hidden||Date.now()-lastAct>60000||!window.__NB)return;
  var t=today();S.days[t]=(S.days[t]||0)+15;save();
},15000);
document.addEventListener('visibilitychange',function(){if(document.hidden){flush();sync()}else{sync()}});
addEventListener('pagehide',flush);
setTimeout(sync,800);
})();
(function(){var b=document.getElementById('themebtn');if(!b)return;var o=['auto','light','sepia','dark'];b.addEventListener('click',function(){var t=NBS.get().prefs.theme,i=(o.indexOf(t)+1)%o.length;NBS.setPref('theme',o[i]);b.textContent='Theme: '+o[i]})})();
</script></body></html>
