.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}

/* ---- reader app ---- */
:root{--zoom:1;--lh:1.65;--pw:780px}
:root[data-theme="sepia"]{--bg:#F4ECD8;--surface:#FBF5E6;--surface2:#EADFC4;--ink:#3B3022;--muted:#7A6A52;--line:#D8C9A6;--acc:#7A4A12;--acc-ink:#fff;--acc-soft:#EFDDB8;--saf:#A4470A;--saf-soft:#F6E2BE;--red:#9C2A1C;--red-soft:#F3D9CB;--blue:#2F5C8A;--blue-soft:#DDE6E4;--good:#3E6B2A;--good-soft:#DDE8C8;--hl:#F2D98A;color-scheme:light}
:root[data-font="sans"] body{font-family:var(--sans)}
:root[data-font="sans"] .notes p,:root[data-font="sans"] .notes li{font-family:var(--sans)}
.page{zoom:var(--zoom);max-width:var(--pw)}
.notes p,.notes li{line-height:var(--lh)}
.rbar{position:fixed;left:0;top:0;height:3px;width:0;background:var(--acc);z-index:40;transition:width .15s}
.aabtn{color:var(--ink);border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:5px 12px;font:700 14px var(--serif);cursor:pointer;flex:none}
.h2read{float:right;margin:2px 0 0 10px;font:600 12px var(--sans);border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer;min-height:30px}
.h2read[aria-pressed="true"]{background:var(--acc-soft);color:var(--acc);border-color:var(--acc)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;justify-content:center}
.dock button{font:600 14px var(--sans);min-height:44px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;padding:0 14px;cursor:pointer}
.dock .mid{flex:1;max-width:520px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock .mid b{color:var(--acc)}
body.has-dock .page{padding-bottom:110px}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheetin{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:82vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));font:15px/1.4 var(--sans)}
.sheetin h3{margin:0 0 10px;font:700 17px var(--sans)}
.srow{display:flex;align-items:center;gap:10px;margin:12px 0;flex-wrap:wrap}
.srow label{flex:0 0 92px;color:var(--muted);font-weight:600}
.srow .grp{display:flex;gap:6px;flex-wrap:wrap}
.srow button{font:600 14px var(--sans);min-height:42px;min-width:48px;padding:0 12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;cursor:pointer}
.srow button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.secl a{display:flex;gap:10px;align-items:center;padding:12px 6px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;min-height:44px}
.secl a .tk{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--acc-ink)}
.secl a.rd .tk{background:var(--acc);border-color:var(--acc)}
.secl a.cur{background:var(--acc-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:50;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;font:600 14px var(--sans);max-width:92vw;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.toast button{font:700 14px var(--sans);background:transparent;border:0;color:var(--bg);text-decoration:underline;cursor:pointer;min-height:36px}
body.focus .bar{display:none}body.focus .sidetoc{display:none}
figcaption.clamp{max-height:3.3em;overflow:hidden;position:relative;cursor:pointer}

urrent affairs # International Relations changes every month. Each chapter has a Live radar section and a red In the news card inside the sections it feeds. All items come from the July and August 2026 current-affairs magazines in your Project; two web items (the 12 Sep 2026 Modi-Xi meeting and the 13 Sep 2026 Hormuz routes) are marked. Where each current-affairs item lives Item Where to read it US tariffs (50% to 18%), India-US trade report Ch. 1 Phase 5 and Instruments; Ch. 2 US, India-US sections MJDA (Saudi-Türkiye-Pakistan) Ch. 1 Phase 6; Ch. 2 India’s approach Hormuz, Bab el-Mandeb, Chabahar Ch. 1 Phase 6 and determinants ICC withdrawals, UAE exits OPEC Ch. 1 Phase 5 and 6 Cultural diplomacy, polar report, UNSC campaign, BRICS Ch. 1 Instruments Australia, Japan, Indonesia summits Ch. 1 Trade-offs and Instruments; Ch. 2 Japan and Australia UK CETA, NZ FTA, SACU PTA, Israel BIA Ch. 1 Instruments; Ch. 2 India-US management 25th SR talks, Modi-Xi (12 Sep), water disputes, Scarborough Ch. 2 India-China, US-China Nord Stream, Odesa, Kurils, Europe’s missile coalition Ch. 2 Russia sections Iceland and the EU, Ceuta, North Macedonia and Moldova visits Ch. 2 India-EU New Zealand, UNCITRAL, Sudan and South Sudan, Passport Index Parked below until their chapters arrive Parking lot: news with no chapter yet In the news · Jul 2026 CA New Zealand: first Indian PM visit in 40 years, FTA and a Strategic Partnership What happened An India-NZ FTA was signed in April 2026 (about nine months of talks). In July the ties became a Strategic Partnership with a Roadmap to 2030 ; trade target NZ$7 billion by 2030 . NZ joined the maritime-security pillar of India’s IPOI ; the two signed a Mutual Logistics Support Arrangement and a hydrography arrangement. Use it in an answer A “trade first, strategy second” case. Honest caveats for Mains: the Roadmap is non-binding , NZ’s dairy exports clash with India’s smallholders, and NZ’s military scale is small. Prelims hook Realm of New Zealand : s the answer to “why does India do X?”. “Not a shift from values to interests”: India still follows its values but has more capability Handout p. 17 Answers “Has India given up idealism?” type questions. PYQs quoted in the material (Mains only) Year, marks, words What was asked Answer or trap Where in this chapter Source Mains 2026 · Q9 · 10 marks · 150 words IPMDA (Indo-Pacific Partnership for Maritime Domain Awareness) “bridges the gap between India’s SAGAR vision and the Quad’s collective Indo-Pacific strategy.” Critically assess, focusing on IPMDA. Open-ended. See the skeleton in Practice. Partial: SAGAR/MAHASAGAR and Quad in section 11 and Chapter 2. IPMDA itself is not in these notes. slides 3 Mains 2026 · Q10 · 10 marks · 150 words BRICS “acts as a powerful counterweight in global governance, actively amplifying the voice and influence of the Global South.” Explain the role of BRICS in projecting itself as an alternative to other groupings. Open-ended. See the skeleton in Practice. BRICS in sections 5, 6, 7 and 11 slides 3 Mains 2026 · Q19 · 15 marks · 250 words India’s global diaspora “acts as a living bridge, as a critical economic factor and knowledge network in transforming cultural heritage into geopolitical influence and strategic leverage.” Critically examine. Open-ended. See the skeleton in Practice. Determinant 9 in section 8; evacuations in sections 8 and 11; US diaspora in Chapter 2 slides 3 Mains 2026 · Q20 · 15 marks · 250 words China’s BRI “has transformed South Asia from a regional space into a theatre of great power competition.” Analyse the strategic implications for India’s security and regional influence in South Asia. Open-ended. Answered in Chapter 2. Chapter 2 (also BRI 2013 in section 6 here) slides 3 Mains 2025 · 10 marks · 150 words “With the waning of globalization, post-Cold War world is becoming a site of sovereign nationalism.” Elucidate. Open-ended. See the skeleton in Practice. Sections 6 and 7 handout p. 21 Mains 2020 · 15 marks · 250 words “Quadrilateral Security Dialogue (Quad)” is transforming itself into a trade bloc from a military alliance, in present times: discuss. Open-ended. See the skeleton in Practice. Sections 6, 7, 9 and 11 handout p. 21 (also quoted in Chapter 2) Mains 2019 · 15 marks · 250 words “The long-sustained image of India as a leader of the oppressed and marginalised nations has disappeared on account of its new found role in the emerging global order.” Elaborate. Open-ended. See the skeleton in Practice. Sections 9 and 10 handout p. 21 Mains years quoted: 2026 (four questions, quoted on slide 3), 2025, 2020 and 2019. Prelims years quoted: none quoted in the material. Question 20 of 2026 and the Quad question of 2020 are also quoted in Chapter 2. What to prepare Prelims hooks: the six phases and their years; Westphalia 1648; Wilson’s 14 Points 1918; League 1920; NATO 1949 and Warsaw Pact 1955; NAM 1961 (Belgrade); NPT 1968; Stockholm 1972; Schengen 1985; WTO 1995 and China’s entry 2001; BRICS NDB 2014; BRI 2013; Brexit 2016; Gujral Doctrine; String of Pearls versus Diamond Necklace; Operations Ganga, Kaveri and Sindhu. Mains hooks: why each phase gave way to the next (cause and effect); what “multipolar churn” means; economic nationalism and weaponised interdependence; the Global South and institutional reform; India’s determinants and the six periods of its policy; five trade-offs and seven structural challenges; India’s “bridge power” role. Closing idea: India’s central thread is strategic autonomy, now pursued with more economic, military, technological and diplomatic capability."}, {"c": "1", "n": "Introduction to World Geopolitics and India’s Foreign Policy", "id": "1-basics-first-ir-foreign-policy-and-the-s", "t": "1 · Basics first: IR, foreign policy and the six-phase story", "x": "1 · Basics first: IR, foreign policy and the six-phase story # Class + handout International Relations (IR) is the study of how countries interact with one another and with other actors across borders: international organisations, companies, social movements and individuals. Its core question is: why do countries behave the way they do? Behaviour is shaped by power, security, economic interests, ideas and institutions. IR is wider than war and diplomacy: it includes trade, technology, energy, climate change, migration and global institutions. Key terms Term Meaning Main question Foreign policy What a country wants from the outside world and how it pursues those goals What does a country want to achieve abroad? Geopolitics How geography, location and resources affect power and strategy Why does location matter? Global order How power, rules and institutions are arranged in the world Who has influence, and how is the system organised? How the global order evolved: six phases at a glance Phase Period Defining character Phase 1 Until 1914 Sovereign states, empires and the balance of power Phase 2 1919 to 1945 Liberal experiment, its failure and a second world war Phase 3 1945 to 1991 Two superpowers, nuclear deterrence and new institutions Phase 4 1991 to 2008 American primacy, globalisation and the Washington Consensus Phase 5 2008 to 2019 Crisis of the liberal order and the rise of new powers Phase 6 2020 onwards Post-COVID fragmentation, economic nationalism and multipolar churn The handout’s warning: the world did not move in a straight line from war to peace. Every phase mixed power politics, cooperation and competing ideas, and each new phase carried features of the older one. Class slide stress: the teacher’s approach (slide 5) Questions are broader now. Big picture first : the course opens with how the world order evolved. Major powers before bilaterals : what the US, China and Russia want comes before India’s ties with them. Bilaterals follow , inside the bigger picture. Outcome: any specific theme can be placed in its wider context. Teacher’s order of study 1 · The world order Six phases (this chapter) 2 · Major powers US, China, Russia: ambitions and instruments (Chapter 2) 3 · Bilaterals India with China, US, Russia and others (Chapter 2 onwards) 4 · The outcome Place any theme in its wider context Handout alert: where Phase 5 ends The slide table and handout table say Phase 5 is 2008 to 2019 . The Phase 5 slide headings say “ Post-2008 till 2020 ”. Phase 6 begins in 2020 . Rule for the exam hall: Phase 5 = 2008 to 2019/20; Phase 6 starts in 2020 (post-COVID)."}, {"c": "1", "n": "Introduction to World Geopolitics and India’s Foreign Policy", "id": "2-phase-1-dominance-of-realism-until-world", "t": "2 · Phase 1: Dominance of Realism (until World War I)", "x": "2 · Phase 1: Dominance of Realism (until World War I) # Class + handout “A country that demands moral perfection in its foreign policy will achieve neither perfection nor security.” (Henry Kissinger, quoted in the handout.) The sovereign state system Before 1648 , Europe was divided by religious and dynastic conflicts . People were loyal to rulers and churches, not to nation-states. The Thirty Years’ War (1618-1648) was fought largely along Protestant-Catholic and dynastic lines. It showed how fragmented authority and competing loyalties lead to widespread violence. The Peace of Westphalia (1648) ended the war and laid the foundation of modern international law and the sovereign state system . It set the principles of state sovereignty and non-interference in internal affairs. Centralised states such as France and Sweden grew stronger after it. Key concepts Concept Meaning Sovereignty Supreme authority inside its territory; accepts no outside authority over it International anarchy Not chaos. There is no world government above states, so no one but the state itself can guarantee its safety Nation-state A state (fixed territory, population, government) where state and nation (a people who feel they belong together by language, culture or history) broadly match Security dilemma One state arms for defence, others feel threatened and arm too. Both end up less secure , though neither wanted war Balance of Power (BoP) States act to prevent any one power becoming dominant Realism and its flow Realism sees international politics as a struggle for security, survival and sovereignty . With no authority above states, countries rely on self-help and build their own power. This creates mistrust: one state’s build-up makes others feel threatened. The Realism flow (slide 7) International anarchy no central authority Self-help every state builds its own power Mistrust Security dilemma defensive arming looks like a threat Arms race Balance of Power the attempt to stop any one state dominating The road to World War I Many states believed that attacking first could give an advantage. Germany’s Schlieffen Plan reflected this thinking. The Balance of Power could not prevent conflict . Military build-up and rival alliances increased tensions. The assassination of Archduke Franz Ferdinand triggered World War I, but deeper rivalries had already made war likely. The peace after the war stayed weak. Nehru called it a “ nervous state of peace ”. The Realist problem in one line A state may increase its power to become safer, but this can make other states feel threatened. The cycle: fear → self-help → military build-up → arms race → balancing."}, {"c": "1", "n": "Introduction to World Geopolitics and India’s Foreign Policy", "id": "3-phase-2-liberal-thought-enters-but-reali", "t": "3 · Phase 2: Liberal thought enters, but Realism dominates (inter-war)", "x": "3 · Phase 2: Liberal thought enters, but Realism dominates (inter-war) # Class + handout After World War I, ideas of collective security, cooperation and economic interdependence gained ground. Many proposals were not fully realised because of geopolitical resistance and continuing power politics. Rise of liberal ideas Wilson’s 14 Points (1918) : self-determination, free trade, international cooperation and an association of nations. League of Nations (1920) : Wilson’s “association of nations”; collective security, “one for all, all for one”; tried to mediate disputes through diplomacy. Trade and movement of people were seen as tools to reduce the risk of war by linking countries more closely. Two key concepts Concept Meaning Liberalism War is not inevitable. Institutions, trade, democracy and international law can build cooperation without a world government Collective security All members act together against any aggressor. It works only when major powers are willing to enforce it Return of Realism after the Great Depression (1929) Protectionism: trade barriers rose. Authoritarian regimes rose in Germany, Italy and Japan . Expansionism: aggressive foreign policies. The League could not stop Japan in Manchuria (1931) or Italy in Abyssinia (1935) . These developments led to World War II , whose devastation exposed the limits of the inter-war order. The Nuclear Age The atomic bombing of Hiroshima and Nagasaki (1945) changed international security. Nuclear deterrence became central. Mutually Assured Destruction (MAD) discouraged direct nuclear war because any exchange would destroy both sides. Deterrence prevents an attack by convincing the enemy that the cost will exceed the gain. It depends on capability, credibility and clear communication . Phase 2 cause chain Liberal hope 14 Points 1918 → League 1920 Great Depression 1929 protectionism, authoritarian regimes, expansionism League fails Manchuria 1931, Abyssinia 1935 World War II then the nuclear age: Hiroshima and Nagasaki 1945"}, {"c": "1", "n": "Introduction to World Geopolitics and India’s Foreign Policy", "id": "4-phase-3-liberalism-realism-and-idealism", "t": "4 · Phase 3: Liberalism, Realism and Idealism together (Cold War, 1945-1991)", "x": "4 · Phase 3: Liberalism, Realism and Idealism together (Cold War, 1945-1991) # Class + handout Liberal institutions promoted cooperation and collective security, while US-USSR rivalry drove military blocs, proxy wars and the arms race. A third strand, Idealism , appeared as the Non-Aligned Movement. Liberalism: cooperation and collective security Institution or agreement Purpose United Nations (1945) Peace, diplomacy, collective security. Superpower rivalry often limited it IMF and World Bank Economic stability and reconstruction Marshall Plan About 13 billion dollars for rebuilding Europe; also aimed to contain communism NPT (1968) Prevent spread of nuclear weapons; laid the ground for SALT (Strategic Arms Limitation Talks) Stockholm Conference (1972) Early global cooperation on environmental protection Schengen Agreement (1985) Free movement and economic integration in Europe Cooperation and great-power interests: liberal institutions did not work apart from power politics. The Marshall Plan helped rebuild Western Europe and served containment. The USSR created COMECON to deepen economic cooperation and keep influence over Eastern Europe. Realism: rivalry and arms race Feature Detail Blocs NATO (1949) versus Warsaw Pact (1955) Proxy wars Korean War and Vietnam War Nuclear arms race Huge arsenals; Cuban Missile Crisis (1962) brought the world close to nuclear war Middle East Yom Kippur War (1973) : US backed Israel; USSR backed Arab states Result Bipolarity : a world dominated by two powers, with smaller states pressed to align Idealism: NAM and strategic autonomy The Non-Aligned Movement was formally launched at the Belgrade Summit (1961) : peace, sovereignty, anti-colonialism and independent foreign policy. New countries stayed outside the US and USSR blocs. Under Nehru , India promoted strategic autonomy and independent judgement. Strategic autonomy = the ability to take foreign-policy decisions on one’s own national interest, without being bound to any bloc. Security needs sometimes pushed NAM countries towards one bloc. India signed the 1971 Treaty of Peace, Friendship and Cooperation with the USSR during the Bangladesh crisis. India-US relations were strained when the US sent the USS Enterprise into the Bay of Bengal in support of Pakistan. Three strands side by side (slides 11-12) Strand Core idea Examples Liberalism Institutions bring cooperation UN 1945, IMF-World Bank, NPT 1968, Stockholm 1972, Schengen 1985, Marshall Plan, COMECON Realism Rivalry and power balance NATO 1949, Warsaw Pact 1955, Korea, Vietnam, Cuban Missile Crisis 1962 Idealism Peace and independence from blocs NAM 1961, Nehru’s strategic autonomy, with India-USSR Treaty 1971 as a security exception"}, {"c": "1", "n": "Introduction to World Geopolitics and India’s Foreign Policy", "id": "5-phase-4-victory-of-liberalism-the-unipol", "t": "5 · Phase 4: Victory of Liberalism (the unipolar moment, 1991-2008)", "x": "5 · Phase 4: Victory of Liberalism (the unipolar moment, 1991-2008) # Class + handout The high point of the liberal order: democracy, capitalism, free trade, globalisation and multilateral institutions under strong US leadership. At the same time climate change, terrorism and cybersecurity raised the need for global cooperation, and emerging powers pushed the world towards multipolarity. Fall of the USSR (1991) The collapse of the Soviet Union ended the Cold War and left the US as the sole superpower: the unipolar moment . Former Soviet and Eastern European states moved towards democracy and market economies. Poland and the Baltic states moved closer to NATO and the EU . Under Boris Yeltsin , Russia adopted privatisation and deregulation, though the transition created serious economic problems. Globalisation and US hegemony WTO (1995) institutionalised free trade. China’s WTO accession (2001) accelerated its integration. India and Brazil also gained from expanding trade. The US acted through institutions, and unilaterally when it thought necessary. Afghanistan (2001) and Iraq (2003) showed its military reach; the Iraq War also exposed the risks of unchallenged hegemony and strategic overreach . US-led globalisation provided markets, capital and stability that helped emerging economies such as China and India . Global issues needing cooperation Issue Marker Climate change Kyoto Protocol (1997) , later the Paris Agreement (2015) Terrorism 9/11 strengthened counter-terrorism cooperation Cybersecurity Digital dependence created cross-border vulnerability Rise of multipolarity: the economic rise of China, India, Brazil and Russia shifted power away from a purely US-dominated system. BRICS reflected emerging economies’ demand for a greater voice in global governance. India’s LPG reforms (1991) The 1991 balance-of-payments crisis led to Liberalisation (fewer industrial controls and licences), Privatisation (bigger role for private sector) and Globalisation (more trade, FDI, technology). India’s nominal GDP rose from about $270 billion (1991) to nearly $1.2 trillion (2008) . Economic interests became more important in India’s foreign policy. Concept: unipolarity and hegemony Unipolarity is a world with one dominant power. Hegemony is leadership strong enough to write the rules for others. It can give stability but can also lead to overreach."}, {"c": "1", "n": "Introduction to World Geopolitics and India’s Foreign Policy", "id": "6-phase-5-crisis-of-liberalism-post-2008", "t": "6 · Phase 5: Crisis of Liberalism (post-2008)", "x": "6 · Phase 5: Crisis of Liberalism (post-2008) # Class + handout The Global Financial Crisis (2008) weakened Western economies and confidence in the Western-led liberal order. China and India gained weight. The phase saw multipolarity, protectionism, nationalism and strategic competition . Major trends of the phase Trend What changed Shift to the Indo-Pacific China and India became major growth centres. 2010: China overtook Japan as the second-largest economy. The US answered with the Pivot to Asia under Obama Reduced US engagement Focus on domestic recovery; fewer commitments in Iraq and Afghanistan. Later America First under Trump: national interest, tariffs, burden-sharing Rise of BRICS and G20 Emerging economies sought a bigger global role. BRICS created the New Development Bank (2014) . G20 became the platform for managing crises India as a balancing power Bigger Indo-Pacific role with strategic autonomy , through BRICS, G20 and Quad; keeps seeking reform of global institutions, including a permanent UNSC seat Brexit and European challenges Brexit (2016) : sovereignty, immigration and integration concerns; about 52% voted to leave the EU Migration, nationalism, populism The Syrian refugee crisis deepened divisions in Europe. Germany took over one million refugees ; countries such as Hungary resisted Rise of protectionism Tariffs and other measures; the US-China trade war is the main example Rise of China and the start of US-China rivalry Four dimensions of China’s rise Dimension Detail Economic and strategic Manufacturing strength, financial scale, supply-chain centrality. BRI (2013) gave access to chokepoints, ports and energy corridors. Gwadar, Hambantota and CPEC extended presence in the Indian Ocean and reduced dependence on the Malacca Strait Military and maritime Naval expansion; grey-zone tactics and salami slicing to advance claims; South China Sea and Taiwan tensions; A2/AD in its near seas Technological Self-reliance in 5G, semiconductors, EVs, batteries. Made in China 2025 (2015) . Huawei’s 5G became a symbol of US-China tech rivalry Institutional Bigger role in BRICS and SCO ; AIIB strengthened its role in development finance US-China rivalry: how it spread (slide 17) Pivot to Asia Indo-Pacific focus 2018 trade war tariffs Technology competition 5G, semiconductors Supply-chain competition diversification Indo-Pacific competition strategic rivalry Class slide stress: “Overall” (slide 17) Rivalry expanded from trade to technology, supply chains, semiconductors and regional security. Globalisation continued but became more political, protectionist and security-driven . Key terms Term Meaning and example Salami slicing Gradual change through small steps that avoid a major response. Example: incremental expansion in the South China Sea A2/AD Anti-Access/Area-Denial: capabilities to keep an opponent’s forces out of a region. Example: China’s missiles and navy around Taiwan and the South China Sea Strategic chokepoints Narrow sea passages carrying huge trade and energy flows. Examples: Strait of Malacca, Strait of Hormuz Pivot to Asia Obama-era shift of US diplomatic, economic and military attention to the Asia-Pacific Made in China 2025 2015 industrial policy for advanced manufacturing and strategic technologies (semiconductors, EVs, robotics) Strategic competition Long-term rivalry for economic, military, technological and political influence without necessarily going to war Live in the news: the crisis of liberalism, today In the news · Aug 2026 CA From a 3% average to 18%: tariffs became the sharpest tool against a partner Why it matters Free trade is the liberal order’s signature. In 2025 the US put a 25% reciprocal tariff on Indian exports, then a further 25% tied to India’s Russian oil purchases: 50% in all. A February 2026 interim framework cut it to 18% , still far above the historical average of about 3% . Use it in an answer In a “waning globalisation” answer: the target was a partner, not a rival, and trade was used to punish an energy choice. Then add the way out: diversify (Europe, Gulf, Africa, Latin America, ASEAN, Japan) and finish the Bilateral Trade Agreement. Prelims hook Mission 500 = double trade to USD 500 bn by 2030 . Trade Policy Forum : set up in 2005, co-chaired by India’s Commerce Minister and the US Trade Representative. PYQ (2025): “With the waning of globalization, the post-Cold War world is becoming a site of sovereign nationalism. Elucidate.” Try first: Name two signs in the news that the liberal order is weakening. Tariffs on a partner (50% cut to 18%, against a 3% norm) and the ICC walk-outs (Chad, Burkina Faso, Mali, Niger, Venezuela). Either one anchors the “sovereign nationalism” PYQ. Source: Aug 2026 CA §3.3 (India-US trade relations); PYQ line quoted there. In the news · Jul 2026 CA Five states walk out of the International Criminal Court Why it matters Chad notified the UN Secretary-General of its withdrawal. Burkina Faso, Mali, Niger and Venezuela have also started withdrawal. Complaints: 9 of 13 investigations concern African states, the Court has no enforcement arm , and the US, China and Russia are outside it. India is not a member either. Use it in an answer A clean example of “global judicial ambition without universal participation”: universal rules, selective membership. Contrast with the African-led fix that worked: Hissène Habré (Chad’s own ex-President) convicted in 2016 by the Extraordinary African Chambers in Senegal. Prelims hook Article 127, Rome Statute : withdrawal takes effect one year after notification ; the Court keeps jurisdiction over crimes committed while the State was a member. ICC tries individuals (four crimes, 125 States Parties, seat at The Hague); ICJ settles disputes between States. Try first: When does Chad’s withdrawal take effect, and does it erase past cases? One year after notification (Article 127). No: the Court keeps jurisdiction over crimes committed while Chad was a member. Source: Jul 2026 CA §3.7 (Chad’s withdrawal from the ICC). Quick hits · Jul-Aug 2026 US visas: the Department of Homeland Security replaced “Duration of Status” for F (students), J (exchange visitors, researchers) and I (foreign journalists) visas with a fixed authorised stay . Borders as an instrument of nationalism. “Lake America”: the US renamed its federal reference to Lake Ontario ; Canada keeps the existing name. Small story, big signal: even names of shared waters become sovereignty statements. Source: Jul 2026 CA §3.9.4; Aug 2026 CA §3.9.5 (conflict areas)."}, {"c": "1", "n": "Introduction to World Geopolitics and India’s Foreign Policy", "id": "7-phase-6-geopolitical-fragmentation-and-s", "t": "7 · Phase 6: Geopolitical fragmentation and strategic realignment (2020 onwards)", "x": "7 · Phase 6: Geopolitical fragmentation and strategic realignment (2020 onwards) # Class + handout The 2020s have more global and regional conflicts, driven by rivalry, economic shifts and nationalism. States put sovereignty, national security and strategic interests first. Features: strategic recalibration, techno-nationalism , economic nationalism, transactional diplomacy, cyber threats and weaker cooperation. 1 · Major conflicts and rivalries West Asia: the Israel-Hamas conflict (began 2023) created a major humanitarian crisis in Gaza. Iran, Israel, Hezbollah and the Houthis widened it beyond Gaza. In February 2026 joint US-Israeli strikes on Iran marked a major escalation and killed Iran’s Supreme Leader Ayatollah Ali Khamenei. Iran retaliated. The handout reads this as a shift from proxy confrontation towards direct state-to-state conflict . Russia-Ukraine (2022-): sharply raised Russia-West tension; hit European security, energy markets and food; Western military support and sanctions made it part of the wider Russia-West confrontation; no durable settlement yet. Russia vetoed a 2022 UNSC resolution on the invasion. 2 · Power shifts and multipolarity US-China rivalry dominates the Indo-Pacific. China: BRI plus military modernisation ; US: Quad plus AUKUS . Middle powers (India, Brazil, Indonesia, Türkiye) seek strategic space. Countries form issue-based coalitions , not permanent blocs. BRICS, Quad, SCO, G20 show overlapping partnerships and competitive multilateralism : different powers and groupings compete to shape rules and outcomes. India: strategic autonomy and multi-alignment; ties with both Russia and the West; Quad, BRICS, SCO and G20 together. The handout calls this “strategic patience and calibrated engagement”. 3 · Economic nationalism and deglobalisation COVID-19 and geopolitical tension exposed the risks of dependence on global supply chains, strengthening deglobalisation, protectionism and economic nationalism . Supply-chain resilience: diversify semiconductors, pharmaceuticals, critical minerals. Supply Chain Resilience Initiative (SCRI) by India, Japan and Australia. Reshoring: the EU is raising domestic production of semiconductors and pharmaceuticals. Friend-shoring and de-risking: shifting supply chains to trusted partners (example given: Pax Silica). Strategic trade: security considerations shape trade and investment. Alternative finance: BRICS countries have discussed local currencies and alternative payment mechanisms. US tariff politics: a protectionist administration returned after the 2024 election and revived “America First” (the slide says since 2025). The Lindsey O. Graham Sanctioning Russia and Iran Act of 2026 lets the US President impose tariffs up to 100% on countries importing large amounts of Russian oil and gas. In 2025 fresh US tariffs hit Chinese goods; China answered with tariffs on US farm exports and curbs on critical materials, including rare earths . Sovereignty-first policy: national security now outranks market efficiency. India’s own parallel is Atmanirbhar Bharat . Key concepts Concept Meaning and example Geoeconomics Use of trade, tariffs, sanctions, investment or finance to reach strategic goals Weaponised interdependence Using control over financial, trade or technology networks to pressure another country. Examples: curbs on Russian banks’ access to SWIFT ; US chip export controls on China Transactional diplomacy Foreign policy based on immediate benefits and bargaining, not long-term commitments or shared values Techno-nationalism Links technology to national security and economic power; states control critical technologies and may deny them to rivals 4 · Technology and cyber geopolitics The US and China compete in AI, semiconductors, advanced computing and telecom (example: US ban on Huawei). Export controls and technology restrictions are used for security. Cyberattacks on critical infrastructure and military AI raise new risks. India stresses an inclusive, human-centric approach to AI and wider democratisation. The handout quotes PM Modi: “India does not see fear in AI. India sees fortune in AI. India sees the future in AI.” 5 · Rise of the Global South Developing countries want more voice in agenda-setting, development finance and institutional reform . G20 presidencies: Indonesia (2022), India (2023), Brazil (2024), South Africa (2025) , bringing development, debt, food security and Global South concerns forward. African Union became a permanent member of the G20 (2023). Global Alliance Against Hunger and Poverty came under Brazil’s G20 presidency. Reform demands: G4 seeks more permanent UNSC seats; Ezulwini Consensus is the AU’s demand for African representation in the Security Council; developing countries seek more say in the IMF and World Bank . 6 · Nationalism and populist politics Themes: national sovereignty, stricter migration controls, protection of domestic industry, doubt about deeper globalisation. Examples named: Trump’s “America First”, Giorgia Meloni’s Brothers of Italy , Marine Le Pen’s National Rally (France), the AfD (Germany). 7 · Climate and humanitarian stress Climate change is a threat multiplier : food insecurity, displacement, livelihood stress, pressure on resources. It usually intensifies existing vulnerabilities rather than directly causing conflict. Nepal: a 2026 glacier collapse and floods showed Himalayan vulnerability and revived calls for climate justice and loss-and-damage support. South Asia: heatwaves, floods, extreme rain. Myanmar: Cyclone Mocha (2023) worsened a crisis after the 2021 military takeover; conflict pushed refugees into India and Thailand. Sahel and Horn of Africa: conflict, instability and climate shocks worsen hunger and migration. 8 · Institutional paralysis UNSC veto: the P5 veto can block action in major conflicts (Russia’s 2022 veto). WTO Appellate Body paralysis: the US blocked judicial appointments, leaving no quorum for appeals. The handout calls the result selective multilateralism and institutional paralysis . Essence of the phase (slide 21) Rivalry Strategic realignment Economic and tech fragmentation Multipolarity Institutional paralysis Where does the global order stand today? (slides 22-23) Class slide 22 Features 1 to 3: great-power rivalry and multipolarity; economics has become strategic; institutions are under stress. Class slide 23 Features 4 to 6: rise of minilateralism; sovereign nationalism and a changing globalisation; US-led order versus China-backed alternatives (table below). Feature 6: US-led system versus China-backed alternatives (slide 23) Area US-led system China-backed alternatives Development finance IMF / World Bank AIIB / NDB Connectivity PGII / IMEC BRI / CPEC Finance Dollar and SWIFT Yuan settlements and alternative payment mechanisms Technology US-led AI and semiconductors Chinese 5G and digital infrastructure The slide’s own line: China has not replaced the US-led order. Competition has widened across finance, technology, connectivity, institutions and narratives. Minilateral groupings (Quad, SCO, I2U2, BRICS+, trilaterals) supplement, not replace , traditional institutions. Handout alert: “Pax Silica” and “Operation Ajay” The handout names Pax Silica (as a friend-shoring example) and Operation Ajay (in a list of evacuation operations) without explaining them. They appear here only as the handout writes them. Check the notebook if the teacher explained them in class. Live in the news: fragmentation in real time In the news · Aug 2026 CA Saudi Arabia, Türkiye and Pakistan: an attack on one is an attack on all three Why it matters The Mecca Joint Defence Agreement (MJDA) treats an armed attack on any member as an attack on all. Trigger: the US-Israel war on Iran made Gulf states doubt the US security umbrella. It builds on the Saudi-Pakistan defence pact of September 2025 . Each adds something: Saudi finance, Türkiye’s conventional forces and industry, Pakistan’s nuclear deterrent. Use it in an answer Textbook strategic hedging . But call it what it is: not an alliance . No integrated command, no published treaty text, no common enemy (Saudi eyes Iran, Türkiye eyes Israel, Pakistan eyes India), and Türkiye stays in NATO while Saudi Arabia stays US-aligned. The US even welcomed it as burden-sharing. Prelims hook UN Charter Article 51 : right of individual or collective self-defence until the Security Council acts. IORA : India chairs 2025-27. I2U2 : India, Israel, UAE, US. IMEC : India-Middle East-Europe corridor. Try first: Why can’t MJDA be called an alliance? No integrated command, no published treaty text, no common adversary, and its members keep older ties (NATO, US alignment). India’s concerns: Pakistan’s access to Saudi money and Turkish drones, Türkiye on Kashmir, and Bangladesh’s interest in joining. Source: Aug 2026 CA §3.2 (MJDA). In the news · Aug 2026 CA + web The Strait of Hormuz: one narrow sea lane, the world’s nerves Why it matters About 20% of the world’s oil and LNG passes through it. The Iran conflict disrupted it: Japan faced fuel shortages and India had LPG supply worries (Jul 2026 CA). The August CA reports Iran and Oman agreeing to reopen it for 60 days . On 13 Sep 2026 the two agreed details of new entry and exit routes (entry wholly in Iranian waters); Iran says this is not a reopening and has set seven conditions for the US. Use it in an answer Perfect for “chokepoints” and “energy security” answers: one lane links Gulf producers, Japan’s fuel and India’s cooking gas. Write it as a design lesson: diversify suppliers and build strategic reserves (India and Japan agreed to cooperate on Strategic Petroleum Reserves ). Prelims hook PYQ (2026): ships from which countries cross Hormuz to reach the Indian Ocean? (Bahrain, Syria, Qatar, Egypt.) The strait lies between the Persian Gulf and the Gulf of Oman : Bahrain and Qatar sit inside the Gulf, so answer (b) 1 and 3 . Check: Sources differ: the August CA says a 60-day reopening was agreed; the 13 Sep web report says routes were agreed but the strait is still not open. Treat the status as moving and re-check before the exam. Try first: Which of the five listed chokepoints sits at the mouth of the Red Sea? Bab el-Mandeb (Houthis declared a naval blockade of Saudi Arabia there, Jul 2026 CA). The set: Hormuz, Malacca, Bab el-Mandeb, Panama Canal, Turkish Straits. Source: Aug 2026 CA §3.9.2; Jul 2026 CA §3.2 and conflict areas; web: Newsonair, 13 Sep 2026. In the news · Jul 2026 CA Three chokepoints, one India: Hormuz, Bab el-Mandeb, Chabahar Why it matters The Houthis declared a naval blockade of Saudi Arabia at Bab el-Mandeb . US forces destroyed a surveillance tower at Iran’s Chabahar port (Shahid Kalantari) . India’s own terminal there, Shahid Beheshti, run by India Ports Global Limited , gives access to Afghanistan and Central Asia bypassing Pakistan . Chabahar lies outside Hormuz, on the Gulf of Oman. Use it in an answer The geography determinant in action: Pakistan blocks India’s direct land route, so Chabahar matters, and a US-Iran war puts it in the crossfire. Good for “Link West” and “connectivity” answers. Prelims hook Chabahar is on the Gulf of Oman, outside the Strait of Hormuz. In the notes, Chabahar is the first example of the Diamond Necklace . Source: Jul 2026 CA conflict areas (Bab el-Mandeb, Chabahar). In the news · Jul 2026 CA Europe builds its own shield and its own energy scars Why it matters Ten European states announced an Integrated Anti-Ballistic Missile Coalition in Paris: Denmark, France, Germany, Italy, Netherlands, Norway, Spain, Sweden, Ukraine, UK . Separately, German prosecutors said the 2022 Nord Stream sabotage was ordered by Ukrainian state authorities. A Russian missile strike on a merchant vessel at Odesa killed ten crew, four of them Indian . Use it in an answer Fragmentation is not only West versus rest: Europe is hedging too, and energy pipelines have become targets. For India the lesson is practical: nationals at sea and in ports are caught in other people’s wars. Prelims hook Nord Stream : two pipeline systems, Russia to Germany under the Baltic Sea, the world’s longest subsea natural-gas pipeline; Nord Stream 2 is non-operational. Odesa is a Ukrainian port on the north-western Black Sea coast. Source: Jul 2026 CA §3.8.5, §3.9.2, conflict areas. In the news · Aug 2026 CA Even oil clubs are splitting: UAE leaves OPEC Why it matters The UAE exited OPEC in May 2026 . Meanwhile seven OPEC+ countries agreed to raise output “to support market stability”. India is not an OPEC member. Use it in an answer A small, memorable example of blocs reshuffling: even the most disciplined cartel loses a major producer. Prelims hook OPEC : founded at the Baghdad Conference in 1960 , HQ Vienna . Members now: Algeria, Republic of Congo, Equatorial Guinea, Gabon, Iran, Iraq, Kuwait, Libya, Nigeria, Saudi Arabia, Venezuela. OPEC+ (2016) adds partners incl. Russia, Oman, Kazakhstan, Mexico. Source: Aug 2026 CA §3.8.2 (OPEC and OPEC+)."}, {"c": "1", "n": "Introduction to World Geopolitics and India’s Foreign Policy", "id": "8-india-s-foreign-policy-goals-and-ten-det", "t": "8 · India’s foreign policy: goals and ten determinants", "x": "8 · India’s foreign policy: goals and ten determinants # Class + handout India’s foreign policy changes with the global order (Cold War bipolarity to present multipolar churn), the security environment (China border, Pakistan, terrorism), economic needs (trade, FDI, energy, technology, especially after 1991) and national ambitions (G20, Global South, UNSC reform). Three broad goals stay constant: security, prosperity and an independent voice (strategic autonomy). The ten determinants (slides 3-7 of PPT-2, with handout detail) Determinant Aim and content Examples 1 · Economic development Create an outside environment that supports growth: export markets and FDI, technology and capital, energy and minerals, reliable supply chains, connectivity, opportunities for Indian business and workers . The 1991 reforms tightened the link US, EU, Japan (trade and FDI); semiconductors, defence (technology); Russian crude, West Asian oil; China+1; Chabahar, INSTC, IMEC 2 · Security and territorial integrity Boundary disputes with China and Pakistan ; cross-border terrorism; nuclear and missile risks; maritime and cyber security; external influence in the neighbourhood; fragile supply chains. These shape border infrastructure, defence partnerships, nuclear policy, maritime cooperation and opposition to CPEC LAC preparedness; Indian Ocean surveillance 3 · Geography Himalayan frontier (China, Nepal, Bhutan); Pakistan blocks direct land access to Afghanistan and Central Asia (so Chabahar matters); Indian Ocean carries trade and energy; Andaman and Nicobar sit near the Indian-Pacific sea routes; neighbours’ instability affects migration, security, connectivity Malacca Strait; Chabahar 4 · Strategic autonomy Freedom to decide on India’s own interests: pragmatism, sovereignty, multi-alignment, avoiding rigid alliances Quad with the US while keeping ties with Russia 5 · Energy and critical resources Aim: diversification without excessive dependence on any one supplier . West Asia (oil, gas); Russia (crude, nuclear); US (LNG, energy technology); Australia, Africa, Latin America (critical minerals) National Critical Mineral Mission (2025) 6 · Science and technology Access to advanced technology while building domestic capability: AI and semiconductors, space and quantum, defence technology, telecom and cyber, nuclear and clean energy, digital infrastructure India-US critical technology; India-France space 7 · Political values and history Sovereign equality, anti-colonialism and opposition to racial discrimination , non-interference, peaceful settlement, multilateralism, reform of global institutions . Principles combine with pragmatism Demand for UNSC reform 8 · Domestic and federal politics Parliament, parties, industry, media and public opinion shape policy space Tamil Nadu : Sri Lankan Tamils and fishermen; West Bengal : Teesta; Northeast : Bangladesh and Myanmar connectivity; coastal states: ports 9 · Diaspora and people-to-people ties One of the world’s largest overseas communities: remittances and investment, business and professional networks, technology and knowledge links, cultural influence, consular protection Operation Ganga (2022) : Ukraine. Operation Kaveri (2023) : Sudan. Operation Sindhu (2025) : Iran and Israel 10 · Climate and emerging issues Climate change and finance, sustainable lifestyles, global health, cybersecurity and AI governance, oceans and blue economy, space and polar regions ISA, CDRI, Mission LiFE Class slide stress: each determinant is framed as “Aim: … Eg: …” (slides 3-7) The teacher gives a one-line Aim and a current example for every determinant. Use the example in your answer: it is what turns a list into evidence. The diaspora determinant is the one the 2026 Q19 asked about. Ten determinants (memory aid built from the list) E S G S E S t P D D C E conomy · S ecurity · G eography · S trategic autonomy · E nergy · S cience and tech · P olitical values · D omestic politics · D iaspora · C limate. Say: “ E very S mart G uy S ees E nergy, S cience, P olitics, D omestic D iaspora C limate.” Why diaspora matters twice The handout calls the diaspora both a foreign-policy asset and a consular responsibility : assets (remittances, networks, soft power) and duties (evacuations such as Ganga, Kaveri, Sindhu). Live in the news: the determinants, as they played out this summer In the news · Jul 2026 CA + Aug 2026 CA Determinant 5 (energy) meets Hormuz, and a visit to Mauritius Why it matters When Hormuz was disrupted, LPG supply worries hit India and fuel shortages hit Japan. India’s answer is diversification: the Union Petroleum Minister visited Mauritius (Aug 2026), an Indian Ocean partner where India built an airstrip and a jetty on Agaléga and which hosts IORA’s headquarters . Use it in an answer Link a determinant to a live case in one line: “Energy security, determinant 5, is why India must diversify beyond one supplier or one sea lane, as the Hormuz disruption showed.” PYQ (2025): “Energy security constitutes the dominant kingpin of India’s foreign policy…” (the CA quotes it). Prelims hook Mauritius : Port Louis; includes Rodrigues, Agaléga, Cargados Carajos; Aapravasi Ghat is a UNESCO site; hosts the Indian Ocean Rim Association and the Indian Ocean Commission headquarters. Try first: Which determinant explains Chabahar, and which explains Mauritius? Chabahar: geography (Pakistan blocks the land route). Mauritius: energy and maritime security in the Indian Ocean. Source: Jul 2026 CA (Japan summit); Aug 2026 CA §3.10.1; PYQ quoted in Aug 2026 CA §3.2. In the news · Jul 2026 CA Determinant 6 (science and technology): India’s third tech-trust pact Why it matters India and Australia launched PACTS (Partnership for Cyber, Critical Technologies, Supply Chains): India’s third such framework after TRUST (US) and the Technology Security Initiative (UK) . Japan and India launched a first AI Strategic Dialogue . Use it in an answer Shows the shift from buying technology to building trusted technology partnerships. Prelims hook Order to remember: TRUST (US), TSI (UK), PACTS (Australia). Source: Jul 2026 CA §3.1, §3.2."}, {"c": "1", "n": "Introduction to World Geopolitics and India’s Foreign Policy", "id": "9-evolution-of-india-s-foreign-policy-six", "t": "9 · Evolution of India’s foreign policy: six periods", "x": "9 · Evolution of India’s foreign policy: six periods # Class + handout At a glance (slide 8, PPT-2) Period Main approach Key example 1947-1962 Non-alignment and idealism Panchsheel, NAM 1962-1971 Security correction 1962 China war 1971-1991 Strategic assertion Indo-Soviet Treaty 1991-1998 Economic opening LPG, Look East 1998-2014 Diversified partnerships India-US Nuclear Deal 2014-present Multi-alignment Quad + BRICS + SCO 1947-1962: Non-alignment and idealist foreign policy India became independent in the Cold War bipolar order and wanted to avoid dependence on either bloc. Idealist principles: peace, anti-colonialism, racial equality, disarmament, cooperation . The handout calls this emphasis on values “ normative idealism ”. Emphasis: non-alignment, Panchsheel and peaceful coexistence, support for newly independent countries, faith in multilateralism . 1962-1971: Security correction The 1962 China war exposed weak defence preparedness; the 1965 Pakistan war raised the importance of security further. Focus: defence modernisation, territorial integrity, military preparedness, pragmatic engagement with major powers, hard power . Example: more defence cooperation with the Soviet Union. Shift: idealism continued, but Realist concerns became stronger. India did not abandon non-alignment. 1971-1991: Strategic assertion More willingness to use diplomatic and military capability: Indo-Soviet Treaty (1971) , creation of Bangladesh , Pokhran-I (1974) , more involvement in the neighbourhood, still no formal alliances . Key lesson: non-alignment did not stop India from making a strategic partnership when security required it. 1991-1998: Economic opening and strategic adjustment Key idea: autonomy through economic integration . The Soviet collapse and India’s 1991 crisis changed the environment. Focus: liberalisation, trade and FDI, access to capital and technology, Look East Policy , better ties with the US, Europe and East Asia. Gujral Doctrine: better neighbourhood relations through trust + non-reciprocity + respect for sovereignty . 1998-2014: Diversified strategic partnerships Pokhran-II (1998) first drew pressure, then ties widened: deepening India-US relations, India-US Civil Nuclear Agreement , continued Russia partnership, Japan, ASEAN and Europe, more defence, energy and technology cooperation, bigger roles in G20 and BRICS . India built strong relations with several powers without depending on any one . 2014-present: Multi-alignment and strategic pragmatism Context: multipolar churn : US-China rivalry, conflicts, technology competition, supply-chain risk, pressure on institutions. Approach: multi-alignment and issue-based partnerships . Quad: free and open Indo-Pacific amid China’s assertiveness. AIIB: India joined this China-initiated bank despite differences. BRICS: India works with China and Russia for a multipolar order. Russia, energy: India keeps importing Russian oil despite Western pressure. Russia, defence: India bought the S-400 despite the risk of US CAATSA sanctions. Instruments: minilateralism, maritime diplomacy, technology diplomacy, geoeconomics . Role: a bridge power between major powers and the Global South, supporting reformed multilateralism . India’s overall evolution (slide 21, PPT-2) Non-alignment Strategic partnerships Multi-alignment Issue-based cooperation Class slide stress: “Central thread: Strategic autonomy” (slide 21) Present aim: protect national interest, maintain policy independence, build economic and military capability, expand global influence, become a stronger rule-shaper. Handout alert: Gujral Doctrine and idealism are not the same thing The Gujral Doctrine belongs to 1991-1998 and is about the neighbourhood (trust, non-reciprocity, respect for sovereignty). Panchsheel and NAM belong to 1947-1962 . Do not mix the periods."}, {"c": "1", "n": "Introduction to World Geopolitics and India’s Foreign Policy", "id": "10-continuities-changes-trade-offs-and-chal", "t": "10 · Continuities, changes, trade-offs and challenges", "x": "10 · Continuities, changes, trade-offs and challenges # Class + handout Strategic autonomy then and now (slide 15) Earlier approach Present approach Distance from rival blocs Engage several power centres Non-alignment Multi-alignment Limited partnerships Issue-based partnerships Political autonomy Economic + technology + security autonomy Example on the slide: Russian oil + Quad cooperation + BRICS membership. Key continuities Continuity Meaning Example (slide 16) Strategic autonomy Decide on national interest without permanent dependence on any bloc US + Russia ties National interest Security, development and sovereignty guide choices Russian crude Sovereignty and territorial integrity Independent decision-making; protect borders Opposition to CPEC through PoK Global South orientation Anti-colonial solidarity became development partnership, climate justice, institutional reform Voice of the Global South Dialogue and multilateralism Peaceful settlement; cooperation Ukraine diplomacy Neighbourhood centrality South Asia and the Indian Ocean stay vital Neighbourhood First Key changes (slide 17) Earlier pattern Emerging pattern Non-alignment Multi-alignment and issue-based partnerships Post-colonial leadership Global South leadership Continental focus Continental + maritime + technology Limited economic leverage Geoeconomics, DPI and supply-chain partnerships Cautious, defensive diplomacy Proactive diplomacy and minilateralism (G20, Quad, I2U2, BRICS, SCO, ISA, CDRI) Mainly an aid recipient Development partner and capacity builder Limited role in shaping rules Greater ambition to be a rule-shaper The handout’s warning: the shift is not from values to interests . India still follows its values but now has more economic, military and diplomatic capability to protect its interests. Examples on the slide: Quad, IMEC, DPI partnerships, G20 Presidency. Five trade-offs (slides 18-19) Trade-off What India must balance Example Strategic autonomy versus deeper alignment Needs US and Europe for technology, defence, investment and balancing China; wants independence and Russia ties. Sharper US-China and Russia-West rivalry makes it harder Quad + Russian oil China competition versus continued engagement Respond on LAC, Indian Ocean, neighbourhood, technology; keep trade and BRICS/SCO engagement; de-risk Competition: LAC. Cooperation: BRICS, SCO Neighbourhood sensitivity versus security assertion Protect security and answer instability and outside influence without looking overbearing to smaller neighbours Maldives, Nepal, Sri Lanka Global South leadership versus major-power partnerships Speaks for developing countries yet builds close ties with advanced economies. Credibility needs real development support, finance and capacity-building US, EU, Japan ties Principles versus hard national interest Supports peace, dialogue and sovereignty yet takes practical decisions on energy, defence and security Ukraine dialogue + Russian energy The handout stresses: a trade-off is two important interests pulling different ways and India balancing both. The challenges below are constraints, not trade-offs . Structural challenges (handout lists seven; slide 20 shows the first three) Challenge Content Institutional constraints UNSC, IMF and World Bank still reflect an older power structure; India seeks UNSC permanent membership Domestic capability Manufacturing, logistics, technology, defence capacity and resilience must support global ambitions External shocks COVID-19, Ukraine war, Red Sea disruptions (slide); wars, energy disruptions, crises, supply-chain shocks (handout) Disjointed neighbourhood South Asia is among the least integrated regions : low regional trade, connectivity gaps, political tension, weak regional institutions (handout only) Technology dependence Gaps in semiconductors, AI, advanced manufacturing and critical technologies (handout only) Diplomatic capacity Many engagements need a larger, more specialised diplomatic network (handout only) Global perception and credibility Growing ambition has to be balanced with development priorities and commitments on governance, climate, trade and norms (handout only) Key ideas in India’s foreign policy (slide 22) Keyword Meaning (and example) Strategic autonomy Independent choices; US + Russia ties Multi-alignment Engage many power centres; Quad + BRICS Issue-based alignment Different partners for different issues Vishwabandhu India as a reliable friend and bridge-builder Net security provider Regional (especially Indian Ocean) security role First responder Quick help in crises Neighbourhood First Priority to immediate neighbours (handout) Act East Deeper engagement with Southeast Asia and the Indo-Pacific (handout) Reformed multilateralism Reform UNSC and other institutions Global South leadership Represent developing-country concerns Live in the news: the autonomy trade-off, three times in one month In the news · Jul 2026 CA Multi-alignment in practice: three summits, three awkward partners Why it matters In July 2026 India deepened ties with Australia (a US treaty ally inside AUKUS ), Japan (which sanctions Russia ) and Indonesia (which keeps parallel defence ties with China, Russia, Turkey and Western suppliers), while keeping its own defence and energy ties with Russia. Use it in an answer This is the trade-off in one sentence: India gets partners on every side, and none of them fully shares its map of friends. Say it as: “multi-alignment buys options, and the price is that every partner has a reservation.” Prelims hook Australia: Cocos (Keeling) Islands is an Australian external territory in the Indian Ocean. Japan’s disputes: Senkaku/Diaoyu (China), Northern Territories/Southern Kurils (Russia), Takeshima/Dokdo (South Korea). Try first: Name the “reservation” each partner has about India. Australia: India is not an AUKUS-style ally and retains Russia defence ties. Japan: India keeps Russia ties despite sanctions. Indonesia: dependence on China far exceeds trade with India, and it balances all suppliers. Source: Jul 2026 CA §3.1, §3.2, §3.4 (challenge sections)."}, {"c": "1", "n": "Introduction to World Geopolitics and India’s Foreign Policy", "id": "11-instruments-of-india-s-contemporary-fore", "t": "11 · Instruments of India’s contemporary foreign policy", "x": "11 · Instruments of India’s contemporary foreign policy # Handout only Source note Handout only (pages 19-21): no class slides for this part yet. The handout calls the approach The India Way : protecting national interests without joining a fixed bloc, and working with several powers across security, trade, technology, energy, connectivity and development. Geoeconomic and technology diplomacy Area India’s approach Energy security Diversify supply: West Asia, Russia, the US and renewable-energy partnerships Supply-chain resilience China+1, de-risking, friend-shoring, domestic capacity in critical sectors Critical minerals Partnerships for lithium, rare earths, strategic minerals Connectivity Chabahar, INSTC and IMEC as alternative trade routes Digital diplomacy Sharing DPI, UPI and digital public infrastructure Development partnership Lines of credit, grants, training, capacity-building The aim: turn India’s market size, technology and development experience into diplomatic influence. Security diplomacy and the China factor China affects India’s border security, neighbourhood, Indian Ocean strategy, supply chains and technology choices. India’s response mixes deterrence, de-risking, competition and selective engagement : LAC: stronger infrastructure and military preparedness. Indo-Pacific: support for a free, open, inclusive, rules-based order. Maritime partnerships: with the US, Japan, Australia, France and island states. BRI and CPEC: opposition where projects affect India’s sovereignty. Institutions: engage China in BRICS and SCO while also working through the Quad. Two “necklace” ideas Term Meaning Examples String of Pearls China’s network of ports, infrastructure projects and access points across the Indian Ocean region Gwadar (Pakistan), Hambantota (Sri Lanka), military base in Djibouti Diamond Necklace India’s strategy of maritime partnerships, logistics access and strategic cooperation across the Indian Ocean and Indo-Pacific Chabahar (Iran), Duqm (Oman), Sabang (Indonesia) Neighbourhood and Indian Ocean diplomacy Neighbourhood First , connectivity (road, rail, ports, waterways, energy, digital), First Responder help in disasters, managing China’s growing regional influence. In the Indian Ocean India seeks to be a net security provider : Maritime Domain Awareness, anti-piracy, HADR, coastal surveillance, capacity-building . SAGAR and MAHASAGAR link maritime security with shared growth. Minilateral and institutional diplomacy Platform Main role Quad Indo-Pacific, maritime security, technology, supply chains I2U2 Food, energy, investment, technology India-France-UAE trilateral Maritime, defence, energy BRICS / BRICS+ Global South voice and multipolarity SCO Eurasia, Central Asia, security dialogue G20 Development, debt, climate finance, DPI ISA / CDRI Renewable energy and climate resilience India uses minilateralism as a supplement, not a replacement , for multilateralism, and still backs reform in the UN, WTO and global financial institutions. Humanitarian, diaspora and soft-power diplomacy First responder in regional disasters; evacuation diplomacy: Operations Ganga, Kaveri, Ajay and Sindhu ; humanitarian aid (food, medicines, vaccines, relief); diaspora protection. Soft power: Yoga, Buddhism and Ayurveda; diaspora networks; democracy and pluralism; development partnerships; civilisational links. The handout adds that soft power works best when backed by delivery, credibility and development partnerships . Diplomatic terms to know: Vasudhaiva Kutumbakam, Voice of the Global South, Vishwabandhu, human-centric globalisation, Mission LiFE, reformed multilateralism . Live in the news: the toolbox, with this month’s examples In the news · Jul 2026 CA Arms exporter: BrahMos goes to Indonesia, Sabang comes back Why it matters India agreed to supply the BrahMos missile to Indonesia , the second Southeast Asian country after the Philippines . Indonesia will station a liaison officer at India’s IFC-IOR , and the two will revive Sabang port (Aceh), first agreed in 2018 and stalled eight years. With Japan, India agreed the technical details of UNICORN , its first defence-technology co-development. Use it in an answer Use it for “defence diplomacy / net security provider”. Note both ends of the Malacca Strait : Indonesia’s Sabang at one end, India’s Andaman and Nicobar at the other. Add the honest caveat: contract value and delivery date are not announced; the Philippines took two years (2022 contract to 2024 delivery). Prelims hook BrahMos : India-Russia joint venture, supersonic cruise missile; first export customer Philippines . IFC-IOR : set up 2018 , hosted by the Indian Navy at Gurugram . Sabang is on Weh Island, Aceh. In the notes, Sabang is part of the Diamond Necklace . Try first: Why is the Sabang story a warning about announcements? It was agreed in 2018 and stalled for eight years over funding, feasibility and Indonesian sensitivities. Signing is not delivery. Source: Jul 2026 CA §3.4 (India-Indonesia); §3.2 (UNICORN). In the news · Jul 2026 CA + Aug 2026 CA Trade as diplomacy: UK deal in force, NZ deal signed, Africa talks opened Why it matters India-UK CETA is in force with the Double Contribution Convention : the UK removes duties on 99% of tariff lines, India opens about 90% , and keeps dairy, cereals, millets, gold and lab-grown diamonds out. India-New Zealand FTA was signed in April 2026 after about nine months. India-SACU (Botswana, Eswatini, Lesotho, Namibia, South Africa) signed Terms of Reference to start PTA talks. The India-Israel Bilateral Investment Agreement entered into force. Use it in an answer A single line for “economic diplomacy”: “India is signing deals with the West, Oceania and Africa at once, which is exactly the diversification that the US tariff shock demanded.” Flag the catch: the UK’s CBAM (2027) could tax Indian steel and aluminium and eat the tariff gains. Prelims hook PTA (positive list: only listed goods get concessions) versus FTA (negative list: most goods, except sensitive ones). SACU (1910) is the world’s oldest functioning customs union, secretariat at Windhoek . DCC ensures posted workers pay social security in one country only. Try first: PTA or FTA: which uses a negative list? FTA. A PTA gives concessions only on a positive list of agreed products. India-SACU is a PTA; India-UK CETA and India-NZ are FTAs. Source: Jul 2026 CA §3.6, §3.5, §3.9; Aug 2026 CA §3.8.3. In the news · Jul 2026 CA + Aug 2026 CA Seats and summits: UNSC 2028-29, BRICS in India, ASEAN’s maritime year Why it matters India launched its campaign for a non-permanent UNSC seat for 2028-29 under the theme SHANTI (Securing Holistic Advancement through Norms, Trust and Integrity); it has served 8 terms before. India-hosted BRICS 2026 produced the Guwahati Declaration (against drug trafficking), BRICS CONNECT (labour platform) and the Bhopal Declaration (creative economy). 2026 is the ASEAN-India Year of Maritime Cooperation. On 12 Sep 2026 , Modi and Xi met in New Delhi on the sidelines of the 18th BRICS Summit . Use it in an answer For “India and multilateralism”: India is both a reformer asking for a bigger seat and a host shaping the agenda. Cite SHANTI by name; examiners like specifics. Prelims hook UNSC: 15 members (5 permanent with veto, 10 non-permanent elected by UNGA for 2 years, two-thirds majority ). ARF (1994, foreign ministers, 27 members) versus EAS (2005, leaders, 19 members). IPOI was announced by PM Modi at the 2019 EAS, Bangkok. Try first: ARF versus EAS: which is leaders-level, and which has security dialogue as its mandate? EAS is leaders-level (2005, 19 members); ARF is foreign-minister level (1994, 27 members) with a security-dialogue mandate. India joined ARF in 1996 and EAS at its start in 2005. Source: Jul 2026 CA §3.8.2, §3.8.3, §3.9.1; Aug 2026 CA §3.7; web: UNI, 12 Sep 2026. In the news · Aug 2026 CA Soft power with a scheme: cultural exchanges with 98 countries Why it matters India runs Cultural Exchange Programmes with 98 countries under the Global Engagement Scheme (Ministry of Culture): ICEP , Project Mausam , Brihattar Bharat , and safeguarding Intangible Cultural Heritage . The Standing Committee (2022) flagged thin funding, weak coordination, too few trained staff, an unclear ICCR mandate and no structured diaspora consultation. Use it in an answer Balance in Mains: soft power helps, but culture did not settle the India-China border and political tensions can undercut shared heritage (Bangladesh). Fix: a single-window framework, a restructured ICCR, “Diaspora 2.0”, and the creative economy as an export sector. Prelims hook Heritage restoration abroad: Angkor Wat, Ta Prohm, Prambanan . Prambanan (Java, 9th century, UNESCO) is under joint restoration; Tagore-Dewantara Year 2026-27 marks Tagore’s 1927 Indonesia visit. IIT Madras opened India’s first IIT campus outside India in Zanzibar . PYQ (2026): diaspora as “a living bridge… strategic leverage”. Try first: Name the four components of the Global Engagement Scheme. International Cultural Exchange Programme (ICEP), Project Mausam, Brihattar Bharat, and Safeguarding Intangible Cultural Heritage. Source: Aug 2026 CA §3.7 (cultural diplomacy); Jul 2026 CA §3.4, high-level visits. In the news · Aug 2026 CA Science diplomacy at the poles: a parliamentary report says “move from presence to statecraft” Why it matters The Parliamentary Committee on External Affairs reviewed India’s role in the Arctic and Antarctic . India is an Arctic Council Observer (2013) and an Antarctic Treaty Consultative Party (1983) , with stations Himadri (Arctic), Maitri and Bharati (Antarctica). Gaps: no Polar Ambassador, no polar research vessel, Maitri needs replacing, and observers cannot decide anything. Use it in an answer Use for “climate-security nexus” and “science diplomacy”: poles shape the monsoon and sea level, so India’s interest is consequence, not geography . Fixes: a Polar Ambassador, a seventh “Geopolitics and Strategy” pillar in the Arctic Policy 2022 , Maitri-II and an indigenous Polar Research Vessel. Prelims hook Arctic Council (Ottawa Declaration, 1996): 8 Arctic States plus 6 indigenous Permanent Participants; observers do not take final decisions. Madrid Protocol : Antarctica as a natural reserve, no mineral activity except science. Indian Antarctic Act 2022 . PYQs quoted: Arctic Council members (2014); Arctic vs Antarctic melting (2021). Try first: Is Japan a member of the Arctic Council? (2014 PYQ asked about Denmark, Japan, Russia, UK, US.) No. Japan is an observer (the CA proposes an Asian observer grouping of India with Japan, South Korea and Singapore). Official answer to the PYQ is (d): Denmark, Russia, US. Source: Aug 2026 CA §3.1 (Arctic and Antarctic)."}, {"c": "1", "n": "Introduction to World Geopolitics and India’s Foreign Policy", "id": "live-radar", "t": "Live radar: current affairs", "x": "Live radar: current affairs # This section is the newsroom for Chapter 1. Every item comes from the July and August 2026 current-affairs magazines in your Project (two items from the web are marked). Read the table once a week, then try the chain from memory. What happened, and where it plugs into this chapter When News Plugs into Exam angle Aug 2026 US tariffs: 50% cut to 18% (interim, Feb 2026); parliamentary report on India-US trade Phase 5 · Instruments Sovereign nationalism PYQ; diversification Aug 2026 Mecca Joint Defence Agreement (Saudi, Türkiye, Pakistan) Phase 6 Strategic hedging; US umbrella doubts; Article 51 Aug 2026 Hormuz: Iran-Oman reopening for 60 days (Sep: new routes, not yet open) Phase 6 · Determinant 5 Chokepoints; energy security Aug 2026 UAE exits OPEC (May 2026); OPEC+ raises output Phase 6 Blocs reshuffling Aug 2026 Cultural diplomacy: 98 countries; Global Engagement Scheme Instruments Soft power; diaspora PYQ 2026 Aug 2026 Polar report: Arctic and Antarctic Instruments Science diplomacy; Arctic Council PYQ 2014 Jul 2026 ICC withdrawals: Chad, Burkina Faso, Mali, Niger, Venezuela Phase 5 Universal rules, selective membership Jul 2026 Australia, Japan, Indonesia summits Trade-offs · Instruments Multi-alignment; defence exports; economic security Jul 2026 UK CETA in force; NZ FTA; SACU PTA talks; Israel BIA Instruments Economic diplomacy; PTA vs FTA Jul 2026 UNSC 2028-29 campaign (SHANTI); BRICS Guwahati and Bhopal declarations Instruments Multilateralism Jul 2026 Odesa strike (4 Indians dead); Chabahar tower destroyed; Bab el-Mandeb blockade Phase 6 · Determinants Nationals abroad; connectivity under fire 12 Sep 2026 Modi-Xi meeting in New Delhi (BRICS summit sidelines) Instruments (see Ch. 2 India-China) Border calm as a condition for ties Connect the dots: one story from the headlines Five headlines, one argument Trust drops The US-Israel war on Iran makes Gulf states doubt the US umbrella. Hedging Saudi Arabia, Türkiye and Pakistan sign MJDA; the UAE leaves OPEC; Europe forms its own missile-defence coalition. Trade turns sharp The US taxes a partner’s Russian oil purchases: 25% reciprocal plus 25% penalty. Chokepoints bite Hormuz disruption causes fuel shortages in Japan and LPG worries in India. India multi-aligns Summits with Australia, Japan, Indonesia; UK and NZ trade deals; Modi-Xi meeting at BRICS. Write it as a 4-line answer opener: “The liberal order is giving way to hedging. When trust in the US umbrella fell, middle powers formed their own pacts; when trade became a weapon, India diversified; when a chokepoint closed, energy security became the first test of strategic autonomy.” Watch next (status can change before your exam) Hormuz: does the strait actually reopen, and under whose route rules? Re-check before writing any energy answer. India-US Bilateral Trade Agreement: the interim framework (Feb 2026) is a stopgap; the parliamentary committee wants the BTA concluded early. UK CBAM (2027): will India win a carve-out for steel and aluminium? India-Japan 2+2: due within 2026; UNICORN technical details were agreed in principle. ICC: more withdrawal notices? Each takes effect one year after notification. MJDA: is a treaty text ever published, and does Bangladesh join? UNSC 2028-29 election: needs a two-thirds majority of UNGA members present and voting. How to keep this section fresh Every month, add the new magazine’s International Relations items here and file each one under the section it feeds. The test for any headline: which phase, which determinant or which instrument does it prove?"}, {"c": "1", "n": "Introduction to World Geopolitics and India’s Foreign Policy", "id": "chapter-timeline", "t": "Timeline", "x": "Timeline # 1618-1648 Thirty Years’ War: shows the danger of fragmented authority 1648 Peace of Westphalia: sovereign state system, non-interference ★ Till 1914 Phase 1: balance of power; Schlieffen Plan; Archduke Franz Ferdinand’s assassination triggers World War I 1918 Wilson’s 14 Points ★ 1920 League of Nations ★ 1929 Great Depression: protectionism, authoritarian regimes 1931 League fails to stop Japan in Manchuria 1935 League fails to stop Italy in Abyssinia 1945 Hiroshima and Nagasaki; United Nations; Cold War begins ★ 1949 NATO formed 1955 Warsaw Pact 1961 NAM formally launched, Belgrade Summit ★ 1962 Cuban Missile Crisis; India-China war (security correction begins) 1965 India-Pakistan war 1968 NPT 1971 Indo-Soviet Treaty of Peace, Friendship and Cooperation; Bangladesh; USS Enterprise ★ 1972 Stockholm Conference 1973 Yom Kippur War 1974 Pokhran-I 1985 Schengen Agreement 1991 USSR collapses; India’s BoP crisis and LPG reforms ★ 1995 WTO established 1997 Kyoto Protocol 1998 Pokhran-II 2001 China joins WTO; Afghanistan invasion; 9/11 2003 Iraq invasion 2008 Global Financial Crisis: crisis of liberalism begins ★ 2010 China overtakes Japan as the second-largest economy 2013 Belt and Road Initiative 2014 BRICS New Development Bank 2015 Made in China 2025; Paris Agreement 2016 Brexit (about 52% vote to leave) 2018 US-China trade war 2020 Phase 6 begins (post-COVID) ★ 2022 Russia invades Ukraine; Operation Ganga 2023 Israel-Hamas conflict; AU joins G20; Operation Kaveri 2025 Fresh US tariffs; National Critical Mineral Mission; Operation Sindhu Feb 2026 Joint US-Israeli strikes on Iran"}, {"c": "1", "n": "Introduction to World Geopolitics and India’s Foreign Policy", "id": "traps", "t": "Traps", "x": "Traps # Common mix-ups and the rule for the exam hall Trap What goes wrong, and the rule Phase 5 end date Tables say 2008-2019; slide headings say “till 2020”. Rule: answer “2008 to 2019/20” and start Phase 6 in 2020. Westphalia is not the League Westphalia 1648 = sovereignty and non-interference. League 1920 = collective security. Rule: sovereignty links to 1648, collective security to 1920. Security dilemma versus balance of power The dilemma is the problem (arming for defence frightens others); BoP is the attempt to stop dominance. Rule: dilemma = cause of arms race; BoP = response. NAM date NAM was formally launched at Belgrade in 1961 , not at independence in 1947. Rule: 1961 and Belgrade together. 1971 is not “joining a bloc” The Treaty with the USSR is read as a security exception inside non-alignment, not an alliance. Rule: say “strategic partnership without formal alliance”. Strategic autonomy is not neutrality Multi-alignment means engaging several powers at once (Quad + BRICS + Russian oil), not staying away from all. Rule: autonomy = freedom of choice, not distance. Gujral Doctrine belongs to 1991-98 It is about neighbours: trust, non-reciprocity, respect for sovereignty. Rule: Gujral = neighbourhood, 1990s. Trade-off versus challenge The handout separates them: a trade-off balances two interests; a challenge is a constraint. Rule: “vs” rows are trade-offs; the rest are challenges. String of Pearls versus Diamond Necklace Pearls are China’s ports and access (Gwadar, Hambantota, Djibouti). Necklace is India’s partnerships (Chabahar, Duqm, Sabang). Rule: Pearls = China, Necklace = India. Pax Silica and Operation Ajay Named in the handout without explanation. Rule: do not invent details; check class notes."}, {"c": "1", "n": "Introduction to World Geopolitics and India’s Foreign Policy", "id": "connects", "t": "Connects to", "x": "Connects to # Chapter 2: Major Powers Phase 5 and 6 rivalry (US-China, Russia-West) is unpacked there with each power’s ambitions and instruments. Chapter 2: India-China Phase 5 gave BRI, CPEC, Gwadar, Hambantota; Chapter 2 gives the border, issue boxes and the way forward. Chapter 2: India-US The 1971 USS Enterprise episode here is the “strategic mistrust” row there. Chapter 2: India-Russia The 1971 Treaty here opens the India-Russia timeline there; Russian oil and S-400 are the trade-off examples. Syllabus: neighbourhood and groupings Determinants 3 and 8 and the “disjointed neighbourhood” challenge lead to “India and its neighbourhood”. Quad, BRICS, SCO, G20, I2U2 lead to “bilateral, regional and global groupings”. Syllabus: diaspora Determinant 9 and the evacuation operations lead to the syllabus line “Indian diaspora”. Syllabus: institutions UNSC, WTO Appellate Body, IMF and World Bank reform lead to “important international institutions, agencies and fora”. Syllabus: policies of other countries US tariffs, the 2026 sanctions Act, China’s rare-earth controls are the “effect of policies of developed and developing countries on India’s interests”."}, {"c": "1", "n": "Introduction to World Geopolitics and India’s Foreign Policy", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Six phases: to 1914 sovereign states and BoP; 1919-1945 liberal experiment and WWII; 1945-1991 two superpowers and deterrence; 1991-2008 US primacy; 2008-2019/20 crisis of liberalism; 2020 onwards fragmentation. Realism flow: anarchy → self-help → mistrust → security dilemma → arms race → balance of power. Westphalia 1648 = sovereignty and non-interference. Inter-war: 14 Points 1918, League 1920; Depression 1929; Manchuria 1931, Abyssinia 1935; Hiroshi
