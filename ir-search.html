nd the criteria for joining the EU. Article 49 of the Treaty on European Union; Copenhagen Criteria: stable democratic institutions, a functioning market economy, capacity to implement EU law. Source: Aug 2026 CA §3.8.1. Quick hits · Jul-Aug 2026 Ceuta: migrants crossed from Morocco into the Spanish enclave of Ceuta; Spain deployed troops; at least 18 deaths . Ceuta and Melilla are the EU’s only land borders with Africa . President’s visit (July): first visits by an Indian President to North Macedonia (NATO’s 30th member, March 2020; EU candidate) and Moldova (EU candidate; joined the ISA as its 107th member), plus Romania (EU and NATO member; Danube Delta UNESCO site). Trade levers: the Aug 2026 CA names the India-EU FTA alongside the India-UK CETA as tools to diversify exports (textiles, among others). It does not state the FTA’s current status. UK CETA (not the EU): the UK’s CBAM, from 2027 , could tax Indian steel and aluminium and offset tariff gains. Source: Aug 2026 CA §3.9.1; Jul 2026 CA high-level visits, §3.6."}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "19-india-france", "t": "19 · India-France", "x": "19 · India-France # Handout only Source note Handout only (pages 19-20): no class slides yet. Ties are guided by the Horizon 2047 Roadmap (2023) . In February 2026 the relationship was elevated to a Special Global Strategic Partnership . Shared: a multipolar order, strategic autonomy, a rules-based Indo-Pacific. France is a resident Indo-Pacific power (overseas territories and military presence); cooperation on maritime security, the Indian Ocean, freedom of navigation and Indo-Pacific connectivity. Cooperation areas (handout pp. 19-20) Area Key points Rafale 36 Rafale inducted for the Air Force. April 2025 : contract for 26 Rafale-Marine for the Navy, with technology transfer for integrating indigenous weapons, a Rafale fuselage production facility, MRO for engines, sensors and weapons in India Scorpene Six Kalvari-class submarines built in India under Project-75 ; sixth commissioned January 2025 ; further cooperation under discussion Defence manufacturing Helicopter engines, combat-aircraft engines, HAMMER missiles, MRO. Tata-Airbus H125 Final Assembly Line at Vemagal, Karnataka (2026): India’s first private-sector helicopter final assembly line Exercises Varuna (Navy), Garuda (Air Force), Shakti (Army) Civil nuclear Jaitapur (Maharashtra), planned six EPR reactors ; exploring SMRs and AMRs Emerging technology AI, cyber, critical technologies under the Year of Innovation and Innovation Roadmap 2030 Space ISRO-CNES : Megha-Tropiques, SARAL; TRISHNA under development; human-spaceflight-related areas Digital payments France was the first European country to accept UPI (2024, Eiffel Tower tickets) Clean energy Jointly launched the International Solar Alliance (2015) Trade and investment Trade about €13.6 billion (FY 2025-26) ; a June 2026 high-level mechanism aims to double trade in five years ; 38 of the 40 CAC-40 companies operate in India Students Target 30,000 Indian students in France by 2030 (from about 10,000 in the mid-2020s) The relationship is moving from… Buyer-seller ties → Co-production Traditional strategic cooperation → Technology and innovation Bilateral partnership → Wider Indo-Pacific and global cooperation Live in the news: France in the news Quick hits · Jul-Aug 2026 UPI in France: UPI is live across 11 jurisdictions including the UAE, Singapore, France , Nepal, Bhutan, Cambodia, Greece and the Maldives. PYQ (2025): of UAE, France, Germany, Singapore and Bangladesh, in how many does UPI work for merchant payments? The CA’s own list shows three (UAE, France, Singapore): option (b) . Paris, July: the Integrated Anti-Ballistic Missile Coalition of ten European states was announced in Paris, with France a member. P5: France holds a UNSC veto; the UK also backs India’s permanent seat (CA). Check: the two CA issues carry no direct India-France summit item this quarter. Add one when it appears. Source: Aug 2026 CA UPI section (PYQ 2025); Jul 2026 CA §3.9.2, §3.8.3, §3.6."}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "20-india-japan", "t": "20 · India-Japan", "x": "20 · India-Japan # Handout only Source note Handout only (pages 21-22): no class slides yet. “We see Japan as a natural partner.” (PM Narendra Modi, quoted.) The partnership evolved from ODA-led development cooperation to a broader strategic and economic partnership. It is trust-based and largely conflict-free , but outcomes have sometimes stayed below expectations. Convergence (handout p. 21) Area Key points Strategic and political Free, open, inclusive, rules-based Indo-Pacific; Quad, JAI, Malabar Economic and investment Trade about US$27.47 billion (FY 2025-26) ; Japan’s JPY 10 trillion private investment target; cumulative FDI above US$40 billion ; fast-track mechanism under the India-Japan Industrial Competitiveness Partnership (IJICP) ODA and infrastructure Delhi Metro, Western DFC, Mumbai-Ahmedabad High Speed Rail ; Act East Forum for Northeast connectivity; third-country projects via the Asia-Africa Growth Corridor Defence and maritime Exercises JIMEX, Dharma Guardian, Veer Guardian, Malabar ; 2+2 dialogue, ACSA, UNICORN Supply chain and economic security SCRI ; critical minerals, semiconductors, AI, clean energy, telecom, critical infrastructure Space, science, technology LUPEX (Joint Lunar Polar Exploration Mission); first India-Japan AI Strategic Dialogue (2026) ; IndiaAI Mission- GENIAC memorandum ODA (Official Development Assistance): government aid from developed nations, multilateral institutions or agencies to support the economic development and social welfare of developing countries. Divergence Dimension Japan India Strategic alignment US-led alliance system Strategic autonomy and multi-alignment China challenge Mainly maritime/Pacific Land + maritime Indo-Pacific Alliance-based deterrence Cooperation without formal alignment Defence Strong US integration Diversified partnerships Gaps: trade and investment underperform strategic convergence (land, logistics, taxation, compliance); project delays (land acquisition, cost escalation); difficult terrain and Myanmar instability constrain Northeast-ASEAN connectivity; CEPA underutilised (awareness, standards, certification, non-tariff barriers); language and skills gaps; cooperation stronger in exercises and logistics than in defence technology transfer and co-production . Way forward Area Way forward Economy and investment Convert the JPY 10 trillion target into projects in semiconductors, batteries, EVs, clean energy, logistics; fix land, clearances, contracts; supplier clusters and skill pipelines Infrastructure Strengthen Northeast-ASEAN connectivity; better project management Strategic clarity Defence partnership and institutions; move to drones, electronics, cyber, space, surveillance; co-production Technology Semiconductors, critical minerals, clean energy, telecom, cyber, AI, space People Japanese-language training, skill certification, student exchanges Conclusion India-Japan has grown from ODA to a broad strategic partnership. Trade, investment, execution and technology gaps remain. The next phase should convert strategic convergence into deeper economic, industrial and technological cooperation. Live in the news: Japan, July 2026 In the news · Jul 2026 CA 16th India-Japan Annual Summit: from strategic to economic security What was agreed Joint Statement: Advancing a Partnership of Strategic Convergence and Trust . Deliverables: Joint Declaration on Economic Security (semiconductors, critical minerals), cooperation on payments and local-currency transactions , a Joint Statement on Energy Resilience (including Strategic Petroleum Reserves ), the UNICORN defence co-development (agreement in principle), a first AI Strategic Dialogue , and a human-resource action plan : 5 lakh exchanges in 5 years , including 50,000 skilled Indians to Japan . Use it in an answer Why now: both faced US tariffs and the Iran conflict disrupted the Strait of Hormuz (fuel shortages in Japan, LPG worries in India). Say it as: “crisis converted a partnership of convenience into a partnership of resilience.” Delivery is the test: the Indian community in Japan is about 59,000 against a target of 5 lakh. Prelims hook Exercises: Dharma Guardian (army), JIMEX (navy), Veer Guardian (air force), Malabar (multilateral). Japan’s disputes: Senkaku/Diaoyu (China), Northern Territories/Southern Kurils (Russia), Takeshima/Dokdo (South Korea). 2+2 dialogue due within 2026. PYQ quoted: India-Japan “global and strategic partnership” (2019). Try first: Name three summit deliverables that respond directly to the Hormuz crisis. The Joint Statement on Energy Resilience, cooperation on Strategic Petroleum Reserves, and the Economic Security declaration (supply chains for critical minerals and semiconductors). Source: Jul 2026 CA §3.2 (16th India-Japan summit). In the news · Aug 2026 CA The Kurils: Japan protests Putin’s visit Why it matters Japan condemned Putin’s visit to the Kuril Islands . Japan claims Etorofu as one of its Northern Territories . Use it in an answer A one-liner for “divergence on Russia”: Japan sanctions Russia and has an unresolved territorial dispute with it , while India keeps defence and energy ties. Prelims hook The Kuril chain runs from Kamchatka to Hokkaido . Source: Aug 2026 CA §3.9.3."}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "21-india-australia", "t": "21 · India-Australia", "x": "21 · India-Australia # Handout only Source note Handout only (pages 22-23): no class slides yet. From a low-intensity relationship to a high-trust Indo-Pacific partnership . Australia is India’s southern Indo-Pacific anchor , linking the Indian Ocean, the Pacific, the Quad, critical-mineral security and China+1 supply-chain diversification. Convergence (handout pp. 22-23) Area Key points Strategic and political Free, open, inclusive, rules-based Indo-Pacific; Quad, IORA, EAS, IPOI and ASEAN-centred mechanisms Economic and investment Trade A$50.2 billion (2025) ; India is Australia’s 5th-largest trading partner ; ECTA gives preferential access; talks progressing towards CECA Critical minerals Lithium, cobalt, nickel, rare earths for EVs, batteries, electronics, clean energy; India-Australia Critical Minerals Corridor Clean energy and nuclear 2026 summit finalised arrangements for long-term Australian uranium exports to India under IAEA safeguards Defence and maritime 2026 summit: Joint Declaration on Defence and Security Cooperation , Annual Defence Ministers’ Dialogue , Maritime Security Collaboration Roadmap . Exercises Malabar, AUSINDEX, AUSTRAHIND ; 2+2; Mutual Logistics Support Arrangement Technology, cyber, space 2026 summit launched PACTS (Australia-India Partnership on Cyber, Critical Technologies and Supply Chains) Education and people Student mobility, research, skills; Deakin University campus at GIFT City Divergence Dimension Australia India Strategic alignment US-led alliance system Strategic autonomy and multi-alignment China Greater alliance-based deterrence Engagement + de-risking without bloc politics Indo-Pacific Strong security focus Security + development + strategic autonomy Defence Deep US integration Diversified partnerships Gaps: CECA differences on agriculture, dairy, wine, services, mobility (India cautious on sensitive farm sectors); China dominates global processing and refining of minerals; defence-industrial cooperation less developed than exercises; student visas, cost, safety, employability, recognition; diaspora strains (extremism, hate crimes). Way forward Area Way forward Trade Conclude a balanced CECA protecting sensitive agriculture and livelihoods Minerals and energy Move from MoUs to mining, processing, refining, recycling, strategic reserves; use uranium cooperation for nuclear-energy security Defence and maritime Deepen Malabar, AUSINDEX, AUSTRAHIND, 2+2, logistics; shipbuilding, repair, maintenance Technology Implement PACTS in cyber, AI, quantum, critical technologies, supply chains People Student mobility, visas, safety, employability, qualification recognition; research and skilling Conclusion India-Australia is moving from strategic convergence to an operational partnership , making Australia a key pillar of India’s Indo-Pacific strategy ; the focus is now implementation and outcomes. Live in the news: Australia, July 2026 In the news · Jul 2026 CA 3rd India-Australia Annual Summit: uranium, defence, cyber, space, minerals What was agreed Outcomes: an Administrative Arrangement under the 2014 Civil Nuclear Cooperation Agreement (enables long-term Australian uranium exports under IAEA safeguards ); a Joint Declaration on Defence and Security Cooperation upgrading the 2009 declaration plus a Maritime Security Collaboration Roadmap ; PACTS (cyber, critical technologies, supply chains); a temporary space tracking terminal on the Cocos (Keeling) Islands for Gaganyaan ; the India-Australia Critical Minerals Corridor ; a skills MoU for mining in Bhubaneswar. Use it in an answer The sentence that scores: “the relationship is moving from the 3Cs (Commonwealth, cricket, curry) and 3Ds (democracy, diaspora, dosti) to the 3Es (energy, economy, education).” Then name the gap: trade is only US$24.1 bn against China-Australia US$212 bn , and CECA is still unfinished four years after ECTA. Prelims hook Quad partner : Australia hosted Malabar for the first time in 2023 . AUKUS versus India’s multi-alignment is the strategic mismatch. Australia : largest uranium resources , but Kazakhstan the largest producer ; largest lithium producer . Deakin and Wollongong opened India’s first foreign university campuses at GIFT City . Try first: Why does India need the Cocos (Keeling) terminal? To track and receive telemetry from India’s Gaganyaan human spaceflight mission. It is also a trust signal: Indian space infrastructure on Australian territory. Source: Jul 2026 CA §3.1 (3rd India-Australia Annual Summit)."}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "live-radar", "t": "Live radar: current affairs", "x": "Live radar: current affairs # The newsroom for Chapter 2. Every item comes from the July and August 2026 current-affairs magazines in your Project (web items are marked). Read the table once a week, then retell the chain from memory. What happened, and where it plugs into this chapter When News Plugs into Exam angle Aug 2026 25th SR talks: eight-point consensus (hotlines, expert group, trade points, Kailash Yatra) India-China Border architecture without a line 12 Sep 2026 Modi-Xi meeting in New Delhi (BRICS sidelines) India-China Managed cooperation Aug 2026 Scarborough Shoal: China reserve rules; Philippines chart at the UN US-China · India-China UNCLOS 121(3), 16; 2016 award Aug 2026 Transboundary water: Farakka treaty expires Dec 2026; IWT in abeyance; Brahmaputra dam India-China · neighbours Water PYQ 2026 Aug 2026 India-US: committee report; 50% to 18%; Mission 500 India-US Tariffs, NTBs, BTA, friend-shoring Aug 2026 MJDA (Saudi, Türkiye, Pakistan) India’s approach Hedging vs balancing; mandala Aug 2026 Kurils, OPEC+, UAE leaves OPEC Russia Disputed land; energy blocs Aug 2026 Iceland rejects EU talks; Ceuta crisis; Schengen refresher EU Article 49; Copenhagen; 25 of 27 Jul 2026 Europe’s ten-nation missile coalition; Nord Stream; Odesa strike Russia-West Confrontation, energy, seafarers Jul 2026 16th India-Japan summit India-Japan Economic security; UNICORN; 2+2 Jul 2026 3rd India-Australia summit India-Australia Uranium; PACTS; Cocos terminal; CECA gap Jul 2026 India-Indonesia (BrahMos, Sabang), India-NZ, India-UK CETA Instruments · India-China (Necklace) Defence exports; trade diversification Connect the dots: one story from the headlines Five headlines, one argument The US raises the price of partnership Tariffs on India: 50%, then 18% (Feb 2026). India widens its table Summits with Japan, Australia, Indonesia; UK and NZ deals; SACU talks; Modi-Xi meeting. China tests the edges Reserve rules at Scarborough; a Brahmaputra mega-dam; but also an eight-point border consensus. Russia’s war keeps spilling over Odesa strike kills four Indians; Nord Stream blame; Kuril visit angers Japan. Rivals hedge too MJDA, Europe’s missile coalition, UAE leaves OPEC. Write it as a 4-line answer opener: “India is being priced by one great power, probed by another and caught in the spillover of a third’s war. Its answer is not a camp but a wider table: new trade partners, new technology pacts, a thawing but guarded border, and a seat for itself wherever rules are written.” Watch next (status can change before your exam) Farakka Treaty (Dec 2026): renewal, or a new India-Bangladesh water framework? India-US BTA: does the interim 18% framework become a full agreement? Hormuz: does the strait reopen, and under what route rules (Sep 2026: routes agreed, strait not yet open)? India-China: do the new expert group, working group and hotlines start working; do the border trade points reopen? Scarborough Shoal: more rules, more charts, more patrols; an ASEAN-China Code of Conduct remains the real fix. India-Japan 2+2 (within 2026) and UNICORN details. MJDA: does Bangladesh join; does a text appear? UK CBAM (2027) on Indian steel and aluminium. How to keep this section fresh Every month, add the new magazine’s International Relations items here and file each one under the section it feeds. The test for any headline: which bilateral relationship, which rivalry, which instrument does it prove?"}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "chapter-timeline", "t": "Timeline", "x": "Timeline # 1947 India-USSR diplomatic relations established 1949-50 India recognises the PRC (1949); diplomatic relations (1950) 1954 Panchsheel Agreement with China ★ 1960s MiG-21 co-production (India-Soviet defence partnership) 1962 India-China war: Aksai Chin comes under Chinese control; brief US support ★ 1971 India-USSR Treaty of Peace, Friendship and Cooperation; US tilt to Pakistan ★ 1975 Aryabhata launched with Soviet help 1976-88 India-China ambassadors resume; Rajiv Gandhi visit 1988 1988 Kudankulam agreement with the USSR 1993-96 India-China peace and tranquillity agreements 1998 Pokhran-II sanctions; Jaswant Singh-Strobe Talbott dialogue begins 2000 India-Russia Strategic Partnership 2003 India-China Special Representatives mechanism 2004 India-EU Strategic Partnership 2005 India-China agreement on guiding principles for a settlement 2005-08 India-US Civil Nuclear Agreement (2008 foundation) ★ 2010 India-Russia Special and Privileged Strategic Partnership 2013 India-EU FTA talks slow down 2015 International Solar Alliance launched (India-France) 2016 LEMOA; India designated a Major Defence Partner 2017 Doklam standoff ★ 2018 2+2 Ministerial Dialogue (India-US) 2019 US removes India from GSP 2020 Galwan clash; BECA ★ 2021 First India-Russia 2+2; India-EU Connectivity Partnership 2022 Russia invades Ukraine; India-EU TTC announced 2023 Finland joins NATO; India joins Artemis Accords; Horizon 2047 (France); Saudi-Iran rapprochement 2024 Sweden joins NATO; Depsang-Demchok understanding (October); France accepts UPI (Eiffel Tower tickets) ★ Apr 2025 China licenses seven heavy rare earths; Rafale-M contract 2025 Dalai Lama succession statement (July); India-EFTA TEPA; Justice Mission 2025 Jan 2026 EU Regulation to phase out Russian gas and LNG Feb 2026 India-France relationship elevated to a Special Global Strategic Partnership 2026 India-EU FTA negotiations concluded; Graham Act; US-India interim trade deal (18%); US exits Paris Agreement; Ankara NATO Summit (€70 bn); 18th BRICS Summit; New Delhi Declaration ★ Sep 2026 Trump-Xi summit: AI dialogue proposed, trade truce extended, $30 bn tariff cuts each way"}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "traps", "t": "Traps", "x": "Traps # Common mix-ups and the rule for the exam hall Trap What goes wrong, and the rule Balancing, bandwagoning, autonomy Balancing opposes the dominant power; bandwagoning joins it; autonomy decides alone. Rule: Belarus-Russia and Pakistan-China are bandwagoning; India is autonomy. Strategic entente is not an alliance An informal understanding, no formal treaty duty. Rule: Russia-China “No Limits” is an entente, not a military alliance (the handout says so). Power Transition Theory versus Thucydides Trap Theory = conflict is likelier when a rising power nears the dominant one. Trap = the risk when a rising power threatens an established one. Rule: the Trap is the risk label, the Theory is the cause. Not a complete new Cold War Slide 13 and slide 15 both stress interdependence and strategic autonomy. Rule: in an answer, never accept “new Cold War” or “two blocs” without this qualifier. Western, middle and eastern sector lengths 1,597 (west), 545 (middle), 1,346 (east) = 3,488 km. The middle is the least disputed. Rule: Aksai Chin and Galwan are west; McMahon Line and Doklam are east. Doklam 2017 versus Galwan 2020 Doklam: India-Bhutan-China tri-junction (east). Galwan: Ladakh (west). Rule: Doklam = 2017 east; Galwan = 2020 west. Gwadar is not a Chinese naval base The handout warns that commercial access should not automatically be called a naval base. Rule: say “potential maritime dimension”. String of Pearls ports Gwadar, Hambantota, Kyaukpyu in Issue box 2; Chapter 1 also lists Djibouti. Rule: do not mix them with the Diamond Necklace (Chabahar, Duqm, Sabang). Tariff figures 25% reciprocal + 25% Russian-oil-linked = up to 50%; the 2026 interim deal cut it to 18%. Rule: give the 25+25 split, then 18%. India avoids “forced abandonment of Russia” India seeks closer US defence ties but avoids a forced break with Russia. Rule: use the seeks v avoids table for “partnership without alliance”. Russia’s trade gap India exports about US$4.3 bn and imports about US$61.4 bn (2023-24); trade total US$68.7 bn is FY2024-25. Rule: quote year with each number. Handout only EU, France, Japan and Australia have no class slides yet. AUKUS, Pax Silica, Mythos 5 and Operation Absolute Resolve are named without explanation. Rule: do not invent details; check class notes."}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "connects", "t": "Connects to", "x": "Connects to # Chapter 1: six phases Phases 5 and 6 (US-China rivalry, Russia-West) are unpacked here with each power’s ambitions and instruments. Chapter 1: India’s evolution The 1971 Treaty and the USS Enterprise episode link to “strategic mistrust” (US) and “strategic trust” (Russia) here. Chapter 1: trade-offs Strategic autonomy versus alignment, China competition versus engagement: the examples are the Quad, Russian oil and S-400 here. Syllabus: India and its neighbourhood China-Pakistan nexus, CPEC, Gwadar, Hambantota and Kyaukpyu, Brahmaputra and Bangladesh lead to the neighbourhood chapters. Syllabus: groupings Quad, BRICS, SCO, I2U2, IMEC, IPEF, AUKUS, RIC and EAEU appear across the powers. Each is a “bilateral, regional and global grouping”. Syllabus: diaspora US diaspora (1.5%, over $300 bn in federal taxes, 82% STEM students) leads to the diaspora topic. Syllabus: policies of other countries US tariffs, the Graham Act 2026, CAATSA, H-1B, China’s rare-earth licensing and EU CBAM are the “effect of policies on India’s interests”. Syllabus: international institutions UNSC and WTO reform, NDB, AIIB, BRICS and SCO platforms."}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Major power: capability + intent to shape order. Responses: balancing, bandwagoning, strategic autonomy. Bandwagoning examples: Belarus-Russia, Pakistan-China. US: four ambitions (great-power balance; economic and technological superiority; financial and institutional influence; Western Hemisphere). Quad, I2U2, AUKUS; CHIPS 2022; Graham Act 2026 (up to 100%); Monroe Doctrine; Operation Absolute Resolve. China: national rejuvenation; regional centrality (BRI, CPEC, Gwadar, Djibouti, Two-Ocean, A2/AD); tech leadership (Made in China 2025, New Three); multipolarity (BRICS, SCO, AIIB, GDI, GSI, GCI; Saudi-Iran 2023). Russia: multipolarity (BRICS, SCO, EAEU, BRICS Bridge); Eurasia (CSTO, nuclear doctrine); energy (shadow fleet); connectivity (Northern Sea Route, Russia-North Korea Treaty). Strategic entente = informal, not alliance. US-China: Thucydides Trap; seven dimensions; Washington v Beijing Consensus; Sept 2026 summit (AI dialogue, $30 bn tariff cuts). Core ideas: tech is a national-security issue; not a new Cold War. Russia-West: Finland 2023, Sweden 2024; Ankara €70 bn; EU gas 45% to 12%; No Limits trade $228 bn. Core idea: not two fixed blocs. India frame: autonomy, multi-alignment, issue-based; US tech, defence, Indo-Pacific; China deterrence and engagement; Russia defence, energy, Eurasia. Jaishankar: engage America, manage China, cultivate Europe, reassure Russia, bring Japan into play. India-China phases: 1950-54 Panchsheel; 1950s-62 rupture; 1976-88 Rajiv visit; 1993-2005 border management; 2008-13 economy; 2017-20 Doklam, Galwan; 2020-24 Depsang-Demchok Oct 2024; 2025-26 re-engagement. Border: 3,488 km = 1,597 western + 545 middle + 1,346 eastern. Aksai Chin (west); McMahon Line (east); Doklam tri-junction. Trade $151 bn; deficit about $112.16 bn. China issue boxes: Pak nexus (CPEC, two-front, Gwadar); String of Pearls (Gwadar, Hambantota, Kyaukpyu); Brahmaputra (upstream); rare earths (90.4% of magnets; Rs 7,280 crore; 6,000 tonnes). Three Mutuals. India-US: partnership not alliance; 1962, 1971 mistrust, Pokhran-II to Talbott, Nuclear deal 2005-08, LEMOA/COMCASA/BECA, iCET to TRUST, Mission 500 ($500 bn by 2030). Frictions: Russia, tariffs 25+25 to 18%, GSP 2019, H-1B 71%, Pakistan, CBDR. Seeks v avoids table. India-Russia: 1947, MiG-21, 1971 Treaty, Aryabhata 1975, Kudankulam 1988, 2000 SP, 2010 SPSP; crude 36.5%; trade $68.7 bn, target $100 bn by 2030; INSTC, Chennai-Vladivostok; S-400, AK-203; triangle with China; trade deficit ($4.3 bn out, $61.4 bn in). EU: 1994, 2004, 2007 FTA talks, 2013 stall, TTC 2022, FTA concluded 2026 (99.5% of exports; dairy excluded); CBAM, GDPR. France: Horizon 2047, Rafale 36 + 26 M, Kalvari, Jaitapur, UPI, ISA 2015. Japan: ODA, JPY 10 tn, $40 bn FDI, IJICP, LUPEX, SCRI, CEPA underused. Australia: A$50.2 bn, ECTA to CECA, uranium, PACTS, Critical Minerals Corridor, Malabar and AUSINDEX."}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts below) Every Sunday Live radar: read the table, retell the five-headline chain from memory Blank-page prompts Fill a 3 x 4 grid: US, China, Russia against their four ambitions and one example each. Draw the India-China border with its three sectors, lengths and key points. Write the “India seeks / India avoids” table for the US from memory. Write one line each on the EU, France, Japan and Australia: what grows, what lags."}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards Mains answer skeletons One for each Mains PYQ quoted in the material. Tap to open; try the answer first. Mains 2026 (15m, 250w): BRI and South Asia as a theatre of great-power competition Intro: the BRI (2013) uses ports, railways and corridors (CPEC, Gwadar) to deepen China’s regional centrality, and South Asia has become a space where China, India and the US compete. Security: CPEC through PoK is a sovereignty objection; China-Pakistan defence cooperation complicates two-front planning; Gwadar adds a potential maritime dimension (do not call it a naval base). Indian Ocean: String of Pearls (Gwadar, Hambantota, Kyaukpyu), research vessels, naval reach; India’s response: maritime domain awareness, neighbourhood partnerships, SAGAR/MAHASAGAR, Quad. Regional influence: Chinese infrastructure money competes with Indian connectivity; India must offer faster, reliable projects (way forward). Critical view: “theatre of competition” is partly true, but South Asia states also hedge; India is more than a reactor (Quad, Act East, partnerships). Closing: BRI raises the stakes for India’s security and influence; the answer is delivery, partnerships and deterrence, not rejection alone. Mains 2024 (10m, 150w): the West fostering India as an alternative to China Intro: US-China rivalry and Russia-West confrontation have pushed the West to look for trusted partners and diversified supply chains. Supply chains: China+1 and friend-shoring open opportunities for India in electronics, semiconductors, pharmaceuticals; the EU lists semiconductors, pharma, medical devices, critical minerals; Australia, France, Japan on minerals and manufacturing. Strategic ally: Quad and Malabar, India-US defence framework and iCET/TRUST, India-France co-production, Japan’s JPY 10 tn target. Limits: dependence on Chinese inputs (rare-earth magnets 90.4%), Russia ties and strategic autonomy, trade frictions (tariffs, CBAM), execution gaps (Japan). Closing: the West sees India as a partner, not a proxy; India accepts it on its own terms. Mains 2023 (15m, 250w): NATO expansion and a stronger US-Europe partnership: good for India? Intro: the Ukraine war expanded NATO (Finland 2023, Sweden 2024) and tightened US-Europe coordination. For India the effect is mixed. Gains: West looks to India for supply chains and technology; EU FTA, TTC; France and US defence co-production; India gets scope for diversification away from Russia. Costs: sanctions on Russia hit India’s defence spares and energy; Graham Act 2026; India-Russia-China triangle can reduce India’s space in Eurasia; pressure on strategic autonomy. India’s response: dialogue and diplomacy on Ukraine, no automatic alignment, multi-alignment, defence diversification and indigenisation. Closing: only partly: it widens India’s options but also raises costs on Russia ties; autonomy decides the net effect. Mains 2021 (15m, 250w): AUKUS and existing partnerships (thin notes: AUKUS is only named) Intro: AUKUS is listed among US minilateral groupings that strengthen regional deterrence. (The notes give no more detail: add AUKUS facts after class before using this in the exam.) Context from the notes: the US builds flexible coalitions (NATO, Quad, I2U2, AUKUS) to prevent China’s regional dominance; alliances with Japan, South Korea, Australia and the Philippines. Existing partnerships: Quad and Malabar for maritime security and technology; India-Australia cooperation (Malabar, AUSINDEX, PACTS); minilateralism supplements, not replaces, existing groupings (Chapter 1). Verdict frame: AUKUS adds a layer; it does not supersede the Quad or ASEAN-centred mechanisms. Closing: another coalition layer in a multipolar churn, not a replacement. Mains 2020 (15m, 250w): Indo-US over Indo-Russian defence deals and the Indo-Pacific Intro: defence ties with the US are moving from arms purchases to interoperability, co-production and technology; Russia remains a legacy and maintenance pillar. US: LEMOA 2016, COMCASA, BECA 2020, 2+2, 2025 ten-year framework, defence trade about $25 bn by end-2023; Quad and Malabar for Indo-Pacific stability. Russia: Su-30MKI, T-90, S-400, AK-203, INS Vikramaditya; MRO; shift to licensed production; but S-400 delays, spares, payment and sanctions risks. Indo-Pacific stability: US partnership supports freedom of navigation and a balance against China; Russian systems are continental in focus (the handout). India’s approach: diversify suppliers; CAATSA objection; no forced abandonment of Russia. Closing: significance of US deals lies in interoperability and technology; Russia stays a legacy pillar; India diversifies. Mains 2020 (15m, 250w): Quad, from military alliance to trade bloc? Intro: the Quad is a minilateral grouping for a free, open and rules-based Indo-Pacific, not a treaty alliance. Test the claim: the notes link the Quad with Malabar, maritime security, resilient supply chains and critical technologies. No trade bloc features are named. India avoids “a formal anti-China military bloc”, “treaty alliance” and “automatic war commitments” (India seeks v avoids). Wider footing: IPEF and friend-shoring (US), SCRI (India, Japan, Australia), PACTS and the Critical Minerals Corridor (Australia). Closing: the Quad is a multi-issue minilateral: security plus supply chains and technology; “trade bloc” overstates the shift. Mains 2019 (15m, 250w): why friction between India and the US Intro: ties moved from Cold War mistrust (1971) to strategic partnership, but a “partnership, not alliance” leaves gaps in expectations. The statement’s core: the US expects closer alignment; India wants issue-based cooperation, autonomy and recognition of its ambitions. Examples: Russia (S-400, CAATSA, oil); tariffs and GSP removal (2019); Pakistan (re-hyphenation, mediation); H-1B and student safety; defence technology limits; values and sovereignty. Counter-evidence: Nuclear Agreement 2005-08, LEMOA/BECA, iCET, Quad. Closing: friction comes from different expectations of India’s role, but converging interests keep the partnership growing. Mains 2019 (10m, 150w): India and Japan, a global and strategic partnership Intro: India-Japan has moved from ODA-led cooperation to a strategic and economic partnership around a free, open Indo-Pacific. Strategic: Quad, JAI, Malabar; JIMEX; 2+2, ACSA; SCRI; LUPEX and AI dialogue. Economic: JPY 10 tn target; Delhi Metro, Western DFC, high-speed rail; Act East Forum; Asia-Africa Growth Corridor. Gaps: trade below potential; execution delays; CEPA underuse; limited defence-technology transfer. Closing: significance for Asia and the world is real; the test is turning convergence into projects. Mains 2018 (15m, 250w): US-Iran nuclear pact and India (thin notes) Intro: the notes do not cover the US-Iran nuclear pact; they cover the Iran-linked pieces below. Add the pact’s details after class. Connectivity: INSTC complements Chabahar; Iran and Central Asia routes matter more if Russia-West tension affects INSTC. Sanctions: the Graham Act 2026 extends Iran sanctions (a risk for India’s energy and connectivity choices). India’s response in the notes’ frame: strategic autonomy and issue-based partnerships; diversify energy; avoid taking sides. Closing: India’s interests (energy, Chabahar, INSTC) argue for autonomy and quiet diplomacy. Mains 2017 (10m, 150w): China’s trade surplus and military ambitions Intro: China’s manufacturing scale and export position fund its military modernisation and regional reach. Economic: trade deficit about $112.16 bn (FY2025-26); dependence on rare earths, graphite, electronics; telecom and cyber risks. Military reach: PLA, A2/AD, Two-Ocean strategy, Djibouti; BRI, CPEC, Gwadar, String of Pearls. India’s response: de-risking, domestic capacity (Rs 7,280-crore magnet scheme), Maritime Domain Awareness, Quad, LAC preparedness, selective engagement. Closing: economic interdependence is also a vulnerability; India combines engagement with de-risking."}]</script><script>
(function(){var D=JSON.parse(document.getElementById('sdata').textContent),q=document.getElementById('q'),res=document.getElementById('res'),cnt=document.getElementById('cnt');
cnt.textContent=D.length+' sections indexed. Tables and diagrams are included as text where possible.';

function run(){var v=q.value.trim().toLowerCase();res.innerHTML='';if(v.length<2)return;var ts=v.split(/\s+/),n=0,h='';
for(var i=0;i<D.length&&n<40;i++){var d=D[i],tx=(d.t+' '+d.x).toLowerCase(),ok=ts.every(function(t){return tx.indexOf(t)>=0});if(!ok)continue;n++;
var p=tx.indexOf(ts[0]),s=Math.max(0,p-60),sn=d.x.substr(s,180);
h+='<div class="hit"><a href="geo-ch'+('0'+d.c).slice(-2)+'.html#'+d.id+'"><b>'+esc(d.t)+'</b></a><br><small>'+esc(d.n)+'</small><br>…'+esc(sn)+'…</div>'}
res.innerHTML=h||'<p class="prog">No matches.</p>'}
q.addEventListener('input',run)})();</script><script>/* Shared store: reading progress, preferences, optional cross-device sync. */
(function(){
var KEY='nbapp:v1',root=document.documentElement;
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function fresh(){return{v:1,prefs:{fs:1,lh:1.65,w:780,font:'serif',theme:'auto',pt:0},last:null,nb:{},days:{}}}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var S;
try{S=JSON.parse(lsGet(KEY))}catch(e){S=null}
if(!S||!S.v)S=fresh();
S.prefs=Object.assign(fresh().prefs,S.prefs||{});
// one-time import of the older done list and theme
if(!S.migrated){
  try{var od=JSON.parse(lsGet('nb-done')||'[]');od.forEach(function(n){var c=chap('modern-india',n);c.done=1;c.dt=1})}catch(e){}
  var ot=lsGet('nb-theme');if(ot&&!S.prefs.pt){S.prefs.theme=ot;S.prefs.pt=1}
  S.migrated=1;
}
function chap(nb,n){var b=S.nb[nb]||(S.nb[nb]={});return b[n]||(b[n]={read:{},done:0,dt:0,pos:null,t:0})}
var listeners=[],dirty=false,saveT=null,syncT=null;
function save(){
  dirty=true;clearTimeout(saveT);
  saveT=setTimeout(function(){lsSet(KEY,JSON.stringify(S));listeners.forEach(function(f){try{f()}catch(e){}});scheduleSync()},250);
}
function flush(){lsSet(KEY,JSON.stringify(S))}
function merge(a,b){ // a local, b remote; returns merged
  var o=fresh();
  o.prefs=((b.prefs&&b.prefs.pt||0)>(a.prefs&&a.prefs.pt||0))?Object.assign({},a.prefs,b.prefs):Object.assign({},b.prefs,a.prefs);
  o.last=(!a.last||(b.last&&b.last.ts>a.last.ts))?b.last:a.last;
  o.migrated=1;
  var ids={};Object.keys(a.nb||{}).concat(Object.keys(b.nb||{})).forEach(function(k){ids[k]=1});
  Object.keys(ids).forEach(function(id){
    o.nb[id]={};var ca=(a.nb||{})[id]||{},cb=(b.nb||{})[id]||{},ks={};
    Object.keys(ca).concat(Object.keys(cb)).forEach(function(k){ks[k]=1});
    Object.keys(ks).forEach(function(k){
      var x=ca[k],y=cb[k];if(!x||!y){o.nb[id][k]=x||y;return}
      var r=Object.assign({},x.read,y.read),done=(y.dt||0)>(x.dt||0)?y:x,pos=(y.t||0)>(x.t||0)?y.pos:x.pos;
      o.nb[id][k]={read:r,done:done.done,dt:done.dt||0,pos:pos,t:Math.max(x.t||0,y.t||0)};
    });
  });
  var dk={};Object.keys(a.days||{}).concat(Object.keys(b.days||{})).forEach(function(k){dk[k]=1});
  Object.keys(dk).forEach(function(k){o.days[k]=Math.max((a.days||{})[k]||0,(b.days||{})[k]||0)});
  return o;
}
var syncState='off';
function scheduleSync(){clearTimeout(syncT);syncT=setTimeout(function(){sync()},4000)}
var dbp=null;
function getRef(){
  if(dbp)return dbp;
  dbp=(async function(){
    if(!window.claude||!claude.use)return null;
    var db=await claude.use('db'),u=await claude.use('user');
    if(!db||!u||!u.id)return null;
    var id=await u.id();if(!id)return null;
    return db.doc('data/users/'+id+'/nbapp');
  })().catch(function(){return null});
  return dbp;
}
var busy=false;
async function sync(){
  if(busy)return;busy=true;
  try{
    var ref=await getRef();if(!ref){syncState='local';return}
    var snap=await ref.get(),rem=null;
    if(snap.exists){var d=snap.data();try{rem=JSON.parse(d.state)}catch(e){}}
    var m=rem?merge(S,rem):S;
    var changed=JSON.stringify(m)!==JSON.stringify(S);
    S=m;
    if(changed){flush();listeners.forEach(function(f){try{f()}catch(e){}})}
    var out=JSON.stringify(S);
    if(!rem||JSON.stringify(rem)!==out)await ref.set({v:1,updated:Date.now(),state:out});
    syncState='synced';
  }catch(e){syncState='local'}
  finally{busy=false}
}
var API={
  get:function(){return S},
  chap:chap,
  save:save,flush:flush,sync:sync,
  onChange:function(f){listeners.push(f)},
  syncState:function(){return syncState},
  setPref:function(k,v){S.prefs[k]=v;S.prefs.pt=Date.now();applyPrefs();save()},
  reset:function(){S=fresh();S.migrated=1;flush();save()},
  today:today,
  pct:function(nb,n,total){var c=(S.nb[nb]||{})[n];if(!c||!total)return 0;var r=0;Object.keys(c.read||{}).forEach(function(k){if(c.read[k])r++});return Math.min(1,r/total)},
  isDone:function(nb,n,total){var c=(S.nb[nb]||{})[n];if(!c)return false;if(c.dt)return !!c.done;return false}
};
window.NBS=API;
function applyPrefs(){
  var p=S.prefs;
  var th=p.theme;
  if(th==='auto')root.removeAttribute('data-theme');else root.setAttribute('data-theme',th);
  root.style.setProperty('--zoom',p.fs);root.style.setProperty('--lh',p.lh);root.style.setProperty('--pw',p.w+'px');
  root.setAttribute('data-font',p.font);
}
API.applyPrefs=applyPrefs;applyPrefs();
// studied time, counted while the page is visible and touched in the last minute
var lastAct=Date.now();
['scroll','pointerdown','keydown','touchstart'].forEach(function(e){addEventListener(e,function(){lastAct=Date.now()},{passive:true})});
setInterval(function(){
  if(document.hidden||Date.now()-lastAct>60000||!window.__NB)return;
  var t=today();S.days[t]=(S.days[t]||0)+15;save();
},15000);
document.addEventListener('visibilitychange',function(){if(document.hidden){flush();sync()}else{sync()}});
addEventListener('pagehide',flush);
setTimeout(sync,800);
})();
(function(){var b=document.getElementById('themebtn');if(!b)return;var o=['auto','light','sepia','dark'];b.addEventListener('click',function(){var t=NBS.get().prefs.theme,i=(o.indexOf(t)+1)%o.length;NBS.setPref('theme',o[i]);b.textContent='Theme: '+o[i]})})();
