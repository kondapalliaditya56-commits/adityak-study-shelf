ma 1945; MAD and deterrence. Cold War: UN 1945, NPT 1968, Stockholm 1972, Schengen 1985, Marshall Plan (about $13 bn) versus COMECON; NATO 1949, Warsaw Pact 1955, Cuban crisis 1962, Yom Kippur 1973; NAM Belgrade 1961; India-USSR Treaty 1971. Unipolar: USSR 1991; WTO 1995; China WTO 2001; Afghanistan 2001, Iraq 2003; Kyoto 1997; India LPG 1991 (GDP about $270 bn to about $1.2 tn by 2008). Crisis: GFC 2008; China No. 2 in 2010; Pivot to Asia; NDB 2014; BRI 2013; Made in China 2025; Brexit 2016 (52%); 2018 trade war. Phase 6: West Asia (Feb 2026 strikes on Iran), Ukraine 2022; competitive multilateralism; Graham Act 2026 (up to 100% tariff); weaponised interdependence; G20 Indonesia-India-Brazil-South Africa 2022-2025; AU in G20 2023; G4 and Ezulwini; UNSC veto, WTO AB. Essence: Rivalry → Strategic Realignment → Economic and Tech Fragmentation → Multipolarity → Institutional Paralysis. Ten determinants: economy, security, geography, strategic autonomy, energy, S&T, values, domestic politics, diaspora, climate. Six periods: 1947-62 non-alignment; 1962-71 security correction; 1971-91 assertion; 1991-98 opening (Gujral Doctrine); 1998-2014 diversified; 2014- multi-alignment. Five trade-offs: autonomy v alignment; China competition v engagement; neighbourhood v assertion; Global South v major powers; principles v interest. Seven challenges: institutions, capability, shocks, neighbourhood, technology, diplomacy, credibility. Instruments: geoeconomics and tech, security (String of Pearls v Diamond Necklace), neighbourhood and IOR (SAGAR, MAHASAGAR), minilateral, humanitarian (Ganga, Kaveri, Ajay, Sindhu), soft power."}, {"c": "1", "n": "Introduction to World Geopolitics and India’s Foreign Policy", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts below) Every Sunday Live radar: read the table, retell the five-headline chain from memory Blank-page prompts Draw the six phases with one date each and the defining character of each. Write the Realism flow from memory, then the Phase 6 “Essence” chain. List the ten determinants, the six periods, five trade-offs and seven challenges. Write a 5-line opening for “Has India given up idealism?” using strategic autonomy."}, {"c": "1", "n": "Introduction to World Geopolitics and India’s Foreign Policy", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards Mains answer skeletons One for each Mains PYQ quoted in the material. Tap to open; try the answer first. Mains 2025 (10m, 150w): sovereign nationalism after waning globalisation Intro: the post-Cold War liberal order (WTO 1995, China 2001) has given way, since 2008, to globalisation that is “more selective, more political, more security-driven”. Waning globalisation: GFC 2008; protectionism; 2018 US-China trade war; COVID exposed supply-chain risks → reshoring, friend-shoring, de-risking. Sovereign nationalism: Brexit 2016 (sovereignty, immigration), Syrian refugee crisis, populist parties (America First, Brothers of Italy, National Rally, AfD), migration controls, techno-nationalism, security over market efficiency. Institutions weaken: UNSC veto, WTO Appellate Body paralysis → selective multilateralism. Counter-trend: interdependence continues; minilateral groupings and the Global South seek voice; India answers with Atmanirbhar Bharat plus multi-alignment. Closing: globalisation is not ending; it is being rewired by sovereignty and security. Mains 2020 (15m, 250w): Quad, from military alliance to trade bloc? Intro: the Quad (India, US, Japan, Australia) is a minilateral grouping for a free and open Indo-Pacific, not a treaty alliance. Test the claim: the notes give the Quad’s role as Indo-Pacific, maritime security, technology and supply chains. Trade bloc features are not named. Maritime side: Quad and Malabar strengthen maritime security and naval coordination. Economic and technology side: resilient supply chains and critical technologies (Chapter 2). India’s stance: avoids a formal anti-China military bloc; uses minilateralism as a supplement, not a replacement (Chapter 1). Closing: the Quad is a multi-issue minilateral; calling it a trade bloc overstates the shift. Mains 2019 (15m, 250w): has India stopped being a leader of the oppressed? Intro: in 1947-62 India stressed anti-colonialism, racial equality and support for newly independent states, and led NAM. What changed: post-colonial leadership → Global South leadership; aid recipient → development partner; rule-shaping ambition. Evidence of continuity: Voice of the Global South; G20 presidency 2023; AU’s permanent G20 seat (2023); CBDR and climate justice stance. Evidence of tension: the Global South v major-power trade-off (close ties with US, EU, Japan); credibility needs real finance and capacity-building; security turn after 1962. Verdict: the image has changed form (from moral leader to bridge power), not vanished. Closing: India now leads by delivery and by bridging, not by moral claim alone. Mains 2026 Q10 (10m, 150w): BRICS as counterweight and alternative Intro: BRICS grew from emerging economies’ demand for a bigger voice in global governance. Alternative finance: NDB (2014) alongside AIIB versus IMF/World Bank; talk of local currencies and alternative payments; Russia’s “BRICS Bridge” idea (Chapter 2). Voice and multipolarity: BRICS and BRICS+ project Global South voice; China uses BRICS, SCO, AIIB, BRI to expand influence. India’s use: works with China and Russia for a multipolar order; the 2026 New Delhi Declaration backed a Task Force on Growth and Development and a bigger NDB role (Chapter 2). Limits: groupings supplement, not replace, existing institutions; India-China divergences; Chinese influence may shape the platform. Closing: a counterweight in voice, not yet a replacement for the US-led system. Mains 2026 Q19 (15m, 250w): diaspora as living bridge and strategic leverage Intro: India has one of the world’s largest overseas communities, treated as a foreign-policy asset and a consular responsibility. Economic: remittances, investment, business and professional networks. Knowledge and technology links; in the US, Indians are about 1.5% of the population, pay over $300 bn in federal taxes, and Indian students are 82% STEM (Chapter 2). Cultural and soft power: Yoga, Buddhism, Ayurveda, diaspora networks, civilisational links. Critical view: leverage is limited by host-country politics (H-1B, student safety, extremism in some places); consular burden (Ganga 2022, Kaveri 2023, Sindhu 2025); soft power works only when backed by delivery and credibility. Closing: a bridge and an asset, but leverage depends on host-country goodwill and Indian delivery. Mains 2026 Q9 (10m, 150w): IPMDA between SAGAR and the Quad Intro: SAGAR/MAHASAGAR links maritime security with shared growth; the Quad is the collective Indo-Pacific strategy. (IPMDA is not covered in these notes; add its details after class.) SAGAR/MAHASAGAR: India as net security provider through Maritime Domain Awareness, anti-piracy, HADR, coastal surveillance, capacity-building. Quad: Indo-Pacific, maritime security, technology and supply chains. Bridge logic: Maritime Domain Awareness is the shared capability: it answers Chinese presence (ports, research vessels, naval reach) in the Indian Ocean. Critical angle: depends on partners’ capacity and on island states’ comfort (neighbourhood sensitivity v security assertion). Closing: IPMDA-type cooperation connects India’s regional role to the Quad, but delivery is the test."}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "exam-lens-priority-and-pyqs", "t": "Exam lens: priority and PYQs", "x": "Exam lens: priority and PYQs # Source note This chapter has class slides and a handout. Class slides PPT-3 (37 slides) and handout Chapter 2, pages 1-24 (uploaded as “GS-2 International Relations - 3”). The slides are typed with no handwriting or board ink , so the teacher’s stress is read from the slides’ “Core idea” lines, headings and tables. Slides 1 and 37 carry no text (title and closing). The handout adds more than the slides: the full tables of ambitions and instruments, the Russia-West and US-China dimensions in detail, and the EU, France, Japan and Australia, which have no slides yet (labelled “Handout only”). The material quotes no Prelims PYQs ; its PYQ page lists ten Mains questions (2017 to 2026). Years listed are “years quoted”, not a count of distinct questions. What the teacher and handout stress Signal in the material Where Why it matters “ Core idea: Major powers shape the choices available to other countries. ” Responses: balancing, bandwagoning, strategic autonomy Slide 2 The frame for every “why does India do X?” answer. “ Core idea: The US is moving towards more interest-driven and transactional global leadership. ” “US power is not only military. It is also financial, institutional and technological.” Slide 7 Gives the US paragraph in any answer on US policy. “ Core idea: Technology has become a national-security issue. ” Slide 12 Links US-China rivalry to chips, AI, export controls. “ Core idea: It is not a complete new Cold War , because economic interdependence continues.” (US-China) Slide 13 Use it to test a “new Cold War” claim in a Mains question. “ Core idea: The world is not divided into two fixed blocs. Many states still follow strategic autonomy.” (Russia-West) Slide 15 Same use: test a “two blocs” claim. India follows strategic autonomy, multi-alignment, issue-based partnerships ; avoids permanent dependence on any one power Slide 16 The answer frame for the whole chapter. India-China is “ competition + interdependence + selective cooperation ”; the Three Mutuals close the topic Slides 17 and 23 A ready conclusion for any China answer. India-US: “ Partnership, not alliance ”; “ India seeks / India avoids ” table Slides 24 and 28 The most reusable table in the chapter. India-Russia: from a defence-and-energy anchor into a diversified partnership Slide 36 A ready conclusion for any Russia answer. PYQs quoted in the material (Mains only) Year, marks, words What was asked Answer or trap Where in this chapter Source Mains 2026 · 15 marks · 250 words China’s BRI “has transformed South Asia from a regional space into a theatre of great power competition.” Analyse the strategic implications of the BRI for India’s security and regional influence in South Asia. Open-ended. See the skeleton in Practice. Sections 5, 9 and 10 (CPEC, Gwadar, String of Pearls); BRI 2013 in Chapter 1 handout p. 24 (also slide 3 of PPT-1) Mains 2024 · 10 marks · 150 words “The West is fostering India as an alternative to reduce dependence on China’s supply chain and as a strategic ally to counter China’s political and economic dominance.” Explain with examples. Open-ended. See the skeleton in Practice. Sections 5, 13, 18 and 21 handout p. 24 Mains 2023 · 15 marks · 250 words “The expansion and strengthening of NATO and a stronger US-Europe strategic partnership works well for India.” What is your opinion? Give reasons and examples. Open-ended. “Agree in part”: test the claim. See the skeleton in Practice. Sections 6, 7, 12-15 and 18 handout p. 24 Mains 2021 · 15 marks · 250 words AUKUS is aimed at countering China’s ambitions in the Indo-Pacific. Is it going to supersede the existing partnerships in the region? Discuss its strength and impact. Open-ended. AUKUS is only named in these notes (a US minilateral grouping); see the skeleton and its thin-notes warning. Section 2 (US minilateral groupings); sections 5 and 13 handout p. 24 Mains 2020 · 15 marks · 250 words What is the significance of Indo-US defence deals over Indo-Russian defence deals? Discuss with reference to stability in the Indo-Pacific region. Open-ended. See the skeleton in Practice. Sections 13, 14 and 16 handout p. 24 Mains 2020 · 15 marks · 250 words “Quadrilateral Security Dialogue (Quad)” is transforming itself into a trade bloc from a military alliance, in present times — Discuss. Open-ended. Also quoted in Chapter 1. Sections 2, 13, 15, 20 and 21; Chapter 1 handout p. 24 Mains 2019 · 15 marks · 250 words “What introduces friction into the ties between India and the United States is that Washington is still unable to find for India a position in its global strategy, which would satisfy India’s national self-esteem and ambitions.” Explain with suitable examples. Open-ended. See the skeleton in Practice. Sections 12 and 14 handout p. 24 Mains 2019 · 10 marks · 150 words “The time has come for India and Japan to build a strong contemporary relationship, one involving global and strategic partnership that will have a great significance for Asia and the world as a whole.” Comment. Open-ended. See the skeleton in Practice. Section 20 handout p. 24 Mains 2018 · 15 marks · 250 words In what ways would the ongoing US-Iran Nuclear Pact Controversy affect the national interest of India? How should India respond? Open-ended. Thin notes: the US-Iran nuclear pact is not covered here; only Iran-linked pieces (Chabahar, INSTC, Iran sanctions) appear. Sections 2, 6 and 16 (partial) handout p. 24 Mains 2017 · 10 marks · 150 words “China is using its economic relations and positive trade surplus as tools to develop potential military power status in Asia.” In the light of this statement, discuss its impact on India as her neighbour. Open-ended. See the skeleton in Practice. Sections 3, 5, 9 and 10 handout p. 24 Mains years quoted: 2017, 2018, 2019 (two), 2020 (two), 2021, 2023, 2024, 2026. The 2026 BRI question and the 2020 Quad question are also quoted in Chapter 1. Prelims years quoted: none quoted in the material. Every question is a statement or a “discuss” type: test the claim, then answer with examples. What to prepare Prelims hooks: Bandwagoning (Belarus-Russia, Pakistan-China); Thucydides Trap and Power Transition Theory; Washington versus Beijing Consensus; Made in China 2025; “New Three” (EVs, lithium-ion batteries, solar PV); GDI, GSI, GCI; CSTO, EAEU, BRICS Bridge; 3,488 km India-China border and its three sectors (1,597, 545, 1,346 km); Panchsheel 1954; 1962; Doklam 2017; Galwan 2020; Depsang-Demchok October 2024; LEMOA 2016, COMCASA, BECA 2020; iCET to TRUST; Kudankulam 1988; Aryabhata 1975; INSTC; India-EU FTA 2026; Horizon 2047; Rafale and Scorpene; SCRI, LUPEX; ECTA, CECA, PACTS. Mains hooks: the “India seeks / India avoids” frame; the 4-box China issue set (China-Pakistan nexus, String of Pearls, Brahmaputra, rare-earth magnets); US frictions (Russia factor, tariffs, H-1B, Pakistan, climate); Russia-China-India triangle; why India-Japan and India-Australia trade lags strategy; three “core ideas” that begin with “not a complete new Cold War”. Closing idea: India’s major-power diplomacy is strategic autonomy under pressure: partnering widely, aligning selectively and depending permanently on none."}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "1-understanding-major-powers", "t": "1 · Understanding major powers", "x": "1 · Understanding major powers # Class + handout “International politics, like all politics, is a struggle for power.” (Hans J. Morgenthau, quoted in the handout.) A major power is a state with significant economic, technological and military capabilities and the strategic intent to shape the international order . Unlike regional powers, major powers influence multiple regions and global institutions through deterrence, agenda-setting and economic interdependence . The USA, China and Russia qualify because they combine strong military, economic and technological capabilities with the intent to shape the global order. How other states respond to a major power (slide 2) Response Meaning Balancing Opposing a dominant power Bandwagoning Aligning with a stronger power to gain security, economic benefits or political advantages, instead of opposing it Strategic autonomy Taking independent decisions Major-power rivalries and alliances shape the global balance of power, which decides whether other states balance, bandwagon or pursue strategic autonomy. Bandwagoning: the handout’s two examples Pair Why the weaker state aligns Belarus-Russia Security, energy and economic support Pakistan-China CPEC investment, defence support and diplomatic backing from China Class slide stress: “Core idea” (slide 2) Major powers shape the choices available to other countries. Slide 2 lists what major powers influence: multiple regions, global institutions, alliances and rivalries, economic and technology networks. Objectives and capabilities of the three powers (slides 3-5, handout p. 1) Power Objectives and ideology Capabilities United States Retain global leadership (handout adds “manifest destiny”); preserve the global order through greater burden-sharing among allies and partners ; maintain an edge in critical technologies; build flexible partnerships Unmatched military power projection; world’s largest economy; leadership in critical technologies and global finance; soft power (media, movies) China Regain status as the Middle Kingdom (“centre of the world under the heaven”, the “middle kingdom complex”); build greater Chinese primacy, using multipolarity as a pathway ; strengthen its position in the Indo-Pacific; reshape international institutions; reduce dependence on the US-led financial system Massive manufacturing scale; near-monopoly on critical minerals (handout; slides say “leverage”); rapidly modernising military; leadership in next-gen tech (AI, green tech, 5G) Russia Maintain strategic influence across Eurasia; resist Western pressure; promote a non-Western multipolar order Massive nuclear arsenal; advanced asymmetric warfare capabilities; immense energy and resource leverage"}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "2-ambitions-and-instruments-the-united-sta", "t": "2 · Ambitions and instruments: the United States", "x": "2 · Ambitions and instruments: the United States # Class + handout US: four ambitions (slides 6-7, handout p. 2) Ambition and aim Instruments Examples Great-power competition and regional balance. Prevent rivals, especially China, from gaining regional dominance and keep a favourable balance of power Minilateral groupings (flexible coalitions); forward military presence ; deterrence ; alliance burden-sharing NATO, Quad, I2U2, AUKUS strengthen regional deterrence. 2026 National Defense Strategy stops an adversary from freely projecting power beyond the island chain Japan → Taiwan → Philippines → Borneo ; strengthens the Indo-Pacific while keeping security in the Western Hemisphere Economic, technological and defence superiority. Preserve US advantages and reduce strategic dependencies Economic statecraft (tariffs, sanctions, export controls, dollar dominance, investment restrictions); technology policy (AI, semiconductors, advanced computing, quantum, cyber, space); industrial policy; supply-chain strategy ( friend-shoring ) Lindsey O. Graham Sanctioning Russia and Iran Act, 2026 : tariffs up to 100% on buyers of Russian energy; extends Iran sanctions. CHIPS and Science Act, 2022 . 2023 AI Framework and Standards : the CAISI shapes international AI standards, watermarking benchmarks and frontier-model evaluations. Restrictions on advanced “Mythos 5” AI models to stop exploitation by foreign adversaries. IPEF and friend-shoring Global financial and institutional influence. Retain influence over global finance, institutions, rules and economic networks Financial power (central role of the US dollar ); institutional power (shape rules, standards and networks through global institutions and bilateral partnerships) Influence through the UN, IMF, World Bank and G20 ; dollar dominance, sanctions and financial restrictions used as economic statecraft Regional security and Western Hemisphere focus. Protect US interests closer to home and strengthen influence in the Western Hemisphere Regional security; Western Hemisphere strategy; renewed Monroe Doctrine principles Operation Absolute Resolve in Venezuela; renewed Western Hemisphere security focus Class slide stress: two “Core ideas” (slide 7) “US power is not only military. It is also financial, institutional and technological. ” And: the US is moving towards more interest-driven and transactional global leadership . The handout adds: from a largely liberal-globalist approach to an interest-driven, transactional form, though still relying heavily on alliances and its economic, technological and military advantages. Handout alert: AUKUS and IPMDA The handout names AUKUS only inside a list of US minilateral groupings. It does not explain what AUKUS is. That matters for the 2021 AUKUS question (see Practice). “Mythos 5” and “Operation Absolute Resolve” are also named without explanation. Live in the news: US instruments, caught on camera In the news · Aug 2026 CA Tariffs as foreign policy: 25% + 25% became 18% Why it matters The US used economic statecraft against India: a 25% reciprocal tariff (2025), a further 25% citing Russian oil, then a February 2026 interim framework bringing the total to 18% . India’s baseline moved from about 3% to 18% . Use it in an answer In a “US ambitions and instruments” answer, this is your instrument example: tariffs punished an energy choice by a partner. Pair it with the friend-shoring idea the US now offers (semiconductors, electronics). Prelims hook Friend-shoring : relocating supply chains to trusted countries with shared interests. Minerals Security Partnership : India joined in 2023 . IPEF (2022, 14 members): India is in the Supply Chains, Clean Economy and Fair Economy pillars, but an observer in the Trade pillar . Source: Aug 2026 CA §3.3. Quick hits · Jul-Aug 2026 US-Saudi civil nuclear deal: a 123 Agreement (Section 123, US Atomic Energy Act 1954) giving a 30-year framework for civil nuclear cooperation. A 123 Agreement is required before the US can transfer nuclear material, reactors, technology or fuel. India-US 123 Agreement: 2008. Visa rules: “Duration of Status” replaced by a fixed stay for F, J and I visas. CENTCOM at Chabahar: US forces destroyed a surveillance tower at Iran’s Shahid Kalantari port, near India’s own terminal. “Lake America”: the US federal reference to Lake Ontario was renamed; Canada keeps the old name. Source: Jul 2026 CA §3.9.4, §3.9.5, conflict areas; Aug 2026 CA §3.9.5."}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "3-ambitions-and-instruments-china", "t": "3 · Ambitions and instruments: China", "x": "3 · Ambitions and instruments: China # Class + handout China: four ambitions (slides 8-9, handout p. 3) Ambition and aim Instruments Examples Achieve national rejuvenation. Strengthen capabilities and resilience against external pressure Economic and technological resilience (cut dependence on foreign sources); military strengthening; strategic resilience Made in China 2025 ; domestic capabilities in AI, semiconductors, 5G, EVs, batteries, renewable energy, advanced manufacturing Strengthen regional centrality and military reach. Expand regional influence, protect interests, project power beyond the neighbourhood Regional economic connectivity (trade, investment, infrastructure); military and maritime power (PLA, missiles, naval forces); A2/AD and overseas facilities; presence across the Western Pacific and Indian Ocean; protect interests in Taiwan and the South China Sea BRI through ports, railways and corridors such as CPEC and Gwadar ; China-Laos and Southeast Asia rail links; PLA modernisation; Two-Ocean strategy (Western Pacific and Indian Ocean); overseas facility at Djibouti Build technological and economic leadership. Lead in advanced technologies and manufacturing while sustaining its export position Technology and industrial policy; self-reliance ; export-oriented industrial strategy; strategic resource leverage (critical minerals and rare earths as economic and strategic tools) Made in China 2025; the “New Three” : EVs, lithium-ion batteries and solar PV; export controls on critical minerals and rare earths Use multipolarity as a path to its middle-kingdom complex. Increase China’s role in global governance Multilateral and institutional platforms; global governance initiatives; diplomatic power (mediation); institution-building to reduce dependence on Western-led institutions BRICS, SCO, AIIB and BRI ; Global Development Initiative (GDI), Global Security Initiative (GSI), Global Civilization Initiative (GCI) ; 2023 Saudi Arabia-Iran rapprochement through Chinese mediation China’s instruments in one line Connectivity (BRI, CPEC, Gwadar, Djibouti) + military reach (PLA, A2/AD, Two-Ocean) + technology and minerals (Made in China 2025, New Three, rare-earth controls) + institutions (BRICS, SCO, AIIB, GDI, GSI, GCI). Live in the news: China’s instruments, this summer In the news · Aug 2026 CA Writing a nature reserve into a disputed shoal Why it matters China issued rules to manage the Huangyan Dao National Nature Reserve around Scarborough Shoal : no one may enter except as law allows, and fishing, mining and coral extraction that harm rare species are banned without approval. The Philippines had just deposited its official chart of the shoal with the UN. Use it in an answer A neat example of lawfare : environmental protection used to assert control. Contrast the instruments: China writes a domestic rule; the Philippines files an international chart; the 2016 arbitral award says China has no historic-rights basis. Prelims hook Scarborough = Huangyan Dao (China) = Panatag (Philippines). The 2016 UNCLOS tribunal held it a rock under Article 121(3) : no EEZ, no continental shelf. See the full card under US-China rivalry. Source: Aug 2026 CA §3.5 (South China Sea). Quick hits · Aug 2026 Polar Silk Road: China pushes it in the Arctic; Russia holds over 40% of the Arctic; Marine Protected Areas in Antarctica’s Southern Ocean (which India co-sponsors) are blocked by Russia and China . Brahmaputra: China is building one of the largest hydropower projects on the river; India has raised concern about flows. China controls the upstream Brahmaputra, Sutlej and Indus. CPEC , China’s flagship BRI project, passes through PoK . India has not joined the BRI (launched 2013). Source: Aug 2026 CA §3.1, §3.4, §3.6."}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "4-ambitions-and-instruments-russia", "t": "4 · Ambitions and instruments: Russia", "x": "4 · Ambitions and instruments: Russia # Class + handout Russia: four ambitions (slides 10-11, handout p. 4) Ambition and aim Instruments Examples Promote multipolarity and strategic autonomy. Oppose unipolarity and reduce dependence on Western-led institutions Multilateral platforms; alternative finance; strategic autonomy from Western political and financial institutions BRICS, SCO and EAEU expand Russia’s diplomatic and economic space; BRICS Bridge proposed as an alternative financial mechanism Secure the Eurasian neighbourhood and preserve great-power status. Maintain influence across the post-Soviet space Regional security (Eastern Europe, Caucasus, Central Asia; prevent perceived strategic encirclement); nuclear and military power; collective security organisations CSTO ; Russia’s Basic Principles of State Policy on Nuclear Deterrence treat aggression by a non-nuclear state backed by a nuclear power as a joint attack. Slide’s core idea: nuclear and military power sustain influence beyond Russia’s economic weight Leverage energy and resources for strategic influence. Use oil, gas, nuclear technology and fertilisers Energy and resource diplomacy; market diversification; sanctions resilience (alternative trade and transport networks) Exports redirected to China, India and Asian markets ; bypassing the G7 oil price cap and EU embargo through a “shadow tanker fleet” Build greater Eurasian connectivity and partnerships. Deepen ties with China, India, Central Asia and Southeast Asia Connectivity ( Northern Sea Route ); strategic partnerships; eastward pivot ; defence cooperation Expansion of the Northern Sea Route; strategic entente with China; ties with India, ASEAN and Central Asia; Russia-North Korea Treaty on Comprehensive Strategic Partnership (mutual military assistance) Key concept: strategic entente An informal, cooperative diplomatic understanding between nations. They agree to consult or align their policies for mutual benefit or to manage a common rival, without necessarily being a formal alliance . (Handout p. 4.) Live in the news: Russia’s instruments, this summer Quick hits · Jul-Aug 2026 Kuril Islands: Japan condemned President Putin’s visit. Japan claims Etorofu as part of its Northern Territories . The chain stretches from Kamchatka to Japan’s Hokkaido and separates the Sea of Okhotsk from the North Pacific; rich in fish and minerals, strategic. OPEC+: Russia is a partner in the 2016 grouping; seven OPEC+ countries agreed to raise output in Aug 2026. The UAE left OPEC in May 2026 . Arctic: Russia holds over 40% of the Arctic, with extensive strategic and energy assets; it limits data availability. Nord Stream: German prosecutors said the 2022 sabotage was ordered by Ukrainian state authorities. Nord Stream 2 remains non-operational. Source: Aug 2026 CA §3.9.3, §3.8.2, §3.1; Jul 2026 CA §3.8.5."}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "5-us-china-rivalry", "t": "5 · US-China rivalry", "x": "5 · US-China rivalry # Class + handout The US-China rivalry is the main strategic competition in the current world order. The handout reads it as a power transition leading to the Thucydides Trap . Two key concepts (handout p. 5) Concept Meaning Power Transition Theory Major conflict is more likely when a rising power approaches the capabilities of a dominant power and challenges the existing international order Thucydides Trap The risk of conflict when a rising power threatens the position of an established power Seven dimensions (handout pp. 5-6; slides 12-13 give four plus two boxes) Dimension What the material says 1 · Military and maritime China’s military modernisation and growing presence in the South China Sea and Western Pacific . The US strengthened alliances with Japan, South Korea, Australia and the Philippines and partnerships (Quad, AUKUS) 2 · Taiwan and regional security A major flashpoint: strategic location and importance to global semiconductor supply chains . US arms sales to Taiwan; China’s exercises around Taiwan ( Justice Mission 2025 ) 3 · Technology and semiconductors Competition in semiconductors, AI, advanced computing, telecom. US restrictions limit China’s access to some advanced chips; export controls show technology as a national-security issue. September 2026 Trump-Xi summit proposed a formal US-China AI dialogue, but Washington kept pursuing independent AI capabilities. The AI-powered America.gov launch reflects the technology-leadership contest 4 · Trade and supply chains Both seek to reduce strategic dependence: de-risking, friend-shoring, diversification . China remains central in manufacturing and critical-mineral processing . China’s curbs on gallium, germanium and rare earths show supply chains as instruments of economic statecraft 5 · Economic and financial Washington Consensus (Western market-led, liberal reforms) versus Beijing Consensus (state-led, development-oriented model). Deep economic ties make complete decoupling difficult . The September 2026 summit extended the trade truce and agreed reciprocal tariff reductions on $30 billion of non-sensitive goods each way : temporary de-escalation 6 · Global institutions The US stays central to the alliance and financial architecture; China expanded influence through BRI, AIIB, BRICS and SCO 7 · Global impact The rivalry reshapes the balance of power, raises multipolarity and strategic uncertainty. Both seek influence through infrastructure, finance, technology and connectivity: BRI versus alternative infrastructure initiatives . This raises the strategic importance of the Global South . Others pursue partnership diversification : ASEAN keeps economic ties with China while strengthening security cooperation with the US and others Class slide stress: two “Core ideas” (slides 12-13) “Technology has become a national-security issue.” And: “It is not a complete new Cold War, because economic interdependence continues.” The handout words it: economic interdependence and limited cooperation continue, but strategic competition and mistrust are increasing. Impact on India (slide 13, handout p. 6) Area Impact Indo-Pacific security Greater Chinese presence in the Indian Ocean raises India’s maritime-security concerns and makes the Quad and IORA more relevant Border security Rivalry sharpens the LAC challenge, and widens scope for defence and intelligence cooperation with partners Supply chains China+1 and decoupling create opportunities in electronics, semiconductors, pharmaceuticals, but dependence on Chinese inputs remains a risk Strategic autonomy Stronger Russia-China ties and US-China competition require multi-alignment and diversified partnerships Global governance Rivalry can hinder UNSC and WTO reform and raises India’s role as a bridge for the Global South Live in the news: the rivalry, on a map In the news · Aug 2026 CA Scarborough Shoal: the 2016 award, a rock, and a chart at the UN Why it matters China claims nearly 90% of the South China Sea under the Nine-Dash Line , overlapping ASEAN states’ EEZs. The 2016 UNCLOS tribunal said there is no legal basis for China’s historic rights ; it held Scarborough Shoal is a “rock” (Article 121(3)) with no EEZ or shelf, and affirmed traditional Filipino fishing rights . China calls the award null and void. In 2026 the Philippines deposited its nautical chart with the UN (UNCLOS Article 16) and China issued reserve rules . Use it in an answer Frame the rivalry as rules versus facts on the water : law (award, charts at the UN) against construction (artificial islands, reserve rules). The US is not the claimant here; the rivalry runs through its Philippine ally and India’s own interests. Prelims hook UNCLOS Art. 16 (charts to the UN Secretary-General), Art. 121(3) (rocks), Art. 123 (cooperation in semi-enclosed seas). Spratlys : claimed in full by China, Taiwan, Vietnam; parts by Malaysia, Philippines. Paracels : held by China, claimed by Vietnam and Taiwan. PYQs quoted: SCS significance (2016); India-China bilateral issues with SCS (2014). Try first: Which article denies a “rock” an EEZ, and which one sends charts to the UN? Article 121(3) denies a rock an EEZ or continental shelf. Article 16 requires charts to be deposited with the UN Secretary-General. Source: Aug 2026 CA §3.5 (South China Sea). In the news · Aug 2026 CA Why India has skin in this game: 55% of its trade Why it matters Over 55% of India’s trade passes through the South China Sea and Malacca Strait (MEA). The sea carries about 22% of global trade and 60% of maritime trade , holds about 12% of the world fish catch , and its deep basin hides submarines. ONGC Videsh holds exploration Block 128 off Vietnam. India’s first BrahMos export went to the Philippines . Use it in an answer Link the US-China contest to India’s interests: trade, energy, defence exports. India’s answer in policy words: Act East, Neighbourhood First, MAHASAGAR . Add the way out: a binding ASEAN-China Code of Conduct and UNCLOS-aligned claims. Prelims hook MAHASAGAR : extends SAGAR from maritime security to economic and geopolitical concerns; India as “Preferred Security Partner and First Responder” rather than only “net security provider”. SCS oil and gas: 11 billion barrels of oil, 190 trillion cubic feet of gas. Source: Aug 2026 CA §3.5. In the news · Aug 2026 CA The rivalry reaches the poles Why it matters India sits between two blocs at the poles: Seven of the eight Arctic States are NATO members , Russia holds over 40% of the Arctic, and China pushes a Polar Silk Road . India is only an Arctic Council observer (2013) , without a decision-making vote. Use it in an answer Use it in a “rivalry beyond the Indo-Pacific” answer. India’s lever is science (Himadri, IndARC) and the three-pole advantage (Arctic, Antarctica, Himalaya). Prelims hook Arctic Council (1996 Ottawa Declaration): 8 States, 6 Permanent Participants. India’s Arctic Policy (2022) : six pillars. Source: Aug 2026 CA §3.1."}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "6-russia-west-confrontation", "t": "6 · Russia-West confrontation", "x": "6 · Russia-West confrontation # Class + handout “The supreme art of war is to subdue the enemy without fighting.” (Sun Tzu, quoted in the handout.) The Russia-West confrontation is a major fault line in the current world order. It intensified after Russia’s invasion of Ukraine in 2022 . Six dimensions (handout pp. 6-7; slides 14-15) Dimension What the material says 1 · European security and NATO expansion The war strengthened NATO’s role. Finland joined NATO in 2023 and Sweden in 2024 . Higher European defence spending. At the 2026 Ankara Summit , NATO pledged €70 billion in military equipment, assistance and training for Ukraine 2 · Sanctions and economic statecraft Sanctions, export controls and financial restrictions on banks, energy revenues, military industries, shipping and dual-use technologies. The EU’s July 2026 package targeted Russian energy, financial services, the shadow fleet and military-industrial supply chains 3 · Energy and trade realignment Europe cut its dependence on Russian energy; Russia sought Asian markets. EU dependence on Russian gas fell from 45% (2021) to 12% (2025) . In January 2026 the EU adopted a Regulation to phase out Russian pipeline gas and LNG imports 4 · Hybrid and cyber warfare Cyberattacks, disinformation, political interference. NATO treats cyber, space and hybrid threats as part of the strategic environment; the EU has a dedicated sanctions framework against Russia’s destabilising activities 5 · Russia-China strategic partnership Deeper coordination under US-China rivalry and Russia-West confrontation. Under the “No Limits” partnership Sino-Russian trade is about $228 billion (2025) . BRICS and SCO give coordination platforms. Based on shared interests, not a formal military alliance 6 · Global impact Reshaped energy markets, food security, defence spending, alignments. Russian energy, food and fertiliser disruptions hurt developing countries most. Many Global South states avoid choosing a bloc Impact on India (slide 15, handout p. 7) Area Impact Defence dependence Western sanctions can hit Russian-origin equipment, spares and maintenance ; need for defence diversification and indigenisation Energy security Russian crude becomes important as Russian flows to Europe fall; the Sanctioning Russia and Iran Act (2026) creates challenges Strategic autonomy Pressure to balance long-standing Russia ties with growing US-Europe partnerships: multi-alignment Connectivity and Eurasia Instability affects INSTC ; alternative routes through Central Asia and Iran gain importance India-Russia-China dynamics Closer Russia-China ties can reduce India’s strategic space in Eurasia ; diversified partnerships with Europe, the US, Japan become more important Class slide stress: “Core idea” (slide 15) “The world is not divided into two fixed blocs. Many states still follow strategic autonomy.” The handout: bloc-based security competition is stronger, but two completely separate blocs have not formed; states pursue strategic autonomy, diversified partnerships and issue-based cooperation. Live in the news: confrontation, July-August 2026 In the news · Jul 2026 CA Europe forms a ten-nation missile shield; Ukraine is a member Why it matters Ten countries announced the Integrated Anti-Ballistic Missile Coalition in Paris : Denmark, France, Germany, Italy, Netherlands, Norway, Spain, Sweden, Ukraine and the UK. Its aim is a shared integrated ballistic-missile defence that complements existing European systems . Use it in an answer Evidence for the “Russia-West confrontation” sections: Europe is now building air-defence architecture around Ukraine itself, not only sanctioning Russia. Prelims hook Note the membership is not the same as NATO or the EU : it includes Ukraine and excludes some EU states. Ukraine joining this coalition is the news hook. Source: Jul 2026 CA §3.9.2. In the news · Jul 2026 CA Nord Stream, Odesa, Kuril: three fronts, one pattern Why it matters Nord Stream: German prosecutors said the 2022 sabotage was ordered by Ukrainian state authorities . Odesa: a Russian missile strike on a merchant ship killed ten crew, four of them Indian . Kurils: Japan condemned Putin’s visit to islands it calls its Northern Territories. Use it in an answer Three fronts, one pattern: energy lifelines, shipping and disputed territory are all now arenas of the same confrontation. Add the India angle: Indian seafarers die in the crossfire. Prelims hook Odesa : Ukrainian port, north-western Black Sea. Kuril/Etorofu : Japan’s Northern Territories claim; Sea of Okhotsk separated from the North Pacific. Try first: Which of the three events killed Indians, and where is the port? The Odesa ship strike (four Indian crew among ten dead); Odesa is a Ukrainian port on the north-western Black Sea. Source: Jul 2026 CA §3.8.5, conflict areas; Aug 2026 CA §3.9.3."}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "7-india-s-approach-to-major-power-competit", "t": "7 · India’s approach to major-power competition", "x": "7 · India’s approach to major-power competition # Class + handout Major-power competition creates both challenges and opportunities for India. Instead of aligning with any one bloc, India follows strategic autonomy, multi-alignment and issue-based partnerships . India with each power (slide 16) Power India’s approach US Cooperate on technology, defence and the Indo-Pacific China Manage competition through deterrence and engagement Russia Keep strong ties in defence, energy and Eurasian connectivity India seeks and India follows (slide 16) India seeks to India follows Balance competing interests Strategic autonomy Diversify strategic partnerships Multi-alignment Protect national interest Issue-based partnerships Support a multipolar global order; avoid permanent dependence on any one power Core idea (handout p. 7) India’s major-power diplomacy is the practice of strategic autonomy under pressure: partnering widely, aligning selectively and depending permanently on none. Jaishankar quote (handout p. 7) “This is a time for us to engage America, manage China, cultivate Europe, reassure Russia, bring Japan into play, draw neighbours in, extend the neighbourhood and expand traditional constituencies of support. ” (S. Jaishankar, *The India Way*.) Use it as a ready-made opening for any bilateral answer. The quote as a chain of verbs America engage China manage Europe cultivate Russia reassure Japan bring into play Neighbours draw in; extend the neighbourhood Live in the news: India’s balancing act, with evidence In the news · Jul 2026 CA + Aug 2026 CA Hedging by others, balancing by India: MJDA and three summits Why it matters While Saudi Arabia, Türkiye and Pakistan hedged with MJDA, India signed with Australia (inside AUKUS), Japan (sanctions Russia) and Indonesia (parallel ties with China, Russia, Turkey). The MEA said it is examining MJDA’s implications for national security and regional stability and will safeguard national interests. Use it in an answer India’s approach in one line: partners on every side, alliances with none . MJDA shows the world hedging; the summits show India hedging back. Add the Kautilya mandala : a neighbouring rival (Pakistan) may gain strength through its allies, so befriend the rival’s rivals (Greece, Cyprus, Armenia; UAE, Israel, Oman). Prelims hook Link and Act West ; IMEC , I2U2 , IORA (India chair 2025-27), MAHASAGAR . IPEF observer in the trade pillar shows India picks the pillars it joins. Try first: In what sense is India’s response to MJDA “mandala” thinking? It treats Pakistan’s new allies as a neighbour-rival strengthened by friends, and answers by befriending the encircling states: Greece, Cyprus, Armenia, and UAE, Israel, Oman. Source: Aug 2026 CA §3.2; Jul 2026 CA §3.1, §3.2, §3.4."}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "8-india-china-nature-evolution-and-converg", "t": "8 · India-China: nature, evolution and convergence", "x": "8 · India-China: nature, evolution and convergence # Class + handout Nature of the relationship (slide 17) Nature Meaning Strategic competition Border, Indian Ocean and regional influence Economic interdependence Large trade, but strong imbalance and dependence Selective cooperation BRICS, SCO, climate and global governance Managed competition Dialogue and engagement alongside deterrence and de-risking Slide 17: the relationship combines competition + interdependence + selective cooperation . Handout: neither side seeks open conflict, but deep mistrust limits wider cooperation; dialogue prevents differences from becoming a larger confrontation. Evolution of India-China relations (slide 18, handout p. 8) Phase Keyword Key developments 1950-54 Postcolonial engagement India recognised the PRC in 1949 ; diplomatic relations 1950 ; Panchsheel Agreement 1954 framed peaceful coexistence 1950s-62 Territorial rupture China’s occupation of Tibet turned the India-Tibet frontier into the India-China boundary. 1962 war : deep strategic distrust; Aksai Chin came under Chinese control 1976-88 Diplomatic rapprochement Ambassadorial relations resumed; Rajiv Gandhi’s 1988 visit ; normalisation began 1993-2005 Institutionalised border management 1993-96 agreements (peace and tranquillity framework); 2003 Special Representatives mechanism ; 2005 agreement on guiding principles for a settlement 2008-13 Economic engagement Trade expanded rapidly; the imbalance widened 2017-20 Border confrontation Doklam (2017) showed Chinese pressure and Indian resistance; the Galwan clash (2020) ended the practice of separating border tensions from wider relations 2020-24 Crisis management Corps Commander and WMCC talks : disengagement, friction points. The 2024 Depsang-Demchok understanding brought cautious tactical stabilisation 2025-26 Calibrated re-engagement SR dialogue, WMCC, SCO consultations , visa and flight discussions: cautious stabilisation; structural mistrust persists Phase keywords in order (memory aid built from the table) P T D I E B C C P ostcolonial engagement → T erritorial rupture → D iplomatic rapprochement → I nstitutionalised border management → E conomic engagement → B order confrontation → C risis management → C alibrated re-engagement. Areas of convergence (slide 19, handout pp. 8-9) Area Key points Global governance Greater representation for emerging economies (BRICS) and the Global South; both in NDB and AIIB Trade $151 billion in 2025-26 WTO Developing-country interests: food security, public stockholding, Special Safeguard Mechanism Climate Support CBDR-RC and greater policy space for developing countries Global order Preference for a multipolar order Technology Greater developing-country role in technology governance. At the 18th BRICS Summit (2026) China proposed a BRICS open-source AI community (LLMs, AI training, common digital cloud platform) People-to-people Kailash Mansarovar Yatra, direct flights, visa facilitation : gradual confidence-building measures Security dialogue WMCC and military-diplomatic channels; SCO for regional security. At the 18th BRICS Summit both leaders stressed peace and tranquillity along the border Live in the news: the thaw, step by step In the news · Web, 12 Sep 2026 Modi and Xi meet in New Delhi on the BRICS sidelines Why it matters On 12 September 2026 the two leaders met on the sidelines of the 18th BRICS Summit in New Delhi. They reviewed a “steady improvement” in ties, urged a long-term strategic approach , and stressed that peace and tranquillity along the border remain essential . Their previous meeting was at Tianjin in August 2025 . Use it in an answer Use it for “nature of relations”: competition with managed cooperation . The border stays the hinge on which the rest of the relationship swings. Prelims hook BRICS gives a venue where India and China meet without bilateral formality. India has not joined the BRI (2013). Check: Only the intro of this report was readable (paywall). Verify details in a full news report before quoting beyond the three lines above. Source: web: United News of India, 12 Sep 2026."}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "9-india-china-areas-of-divergence-and-the", "t": "9 · India-China: areas of divergence and the border", "x": "9 · India-China: areas of divergence and the border # Class + handout Areas of divergence (slide 20, handout p. 9) Issue Nature of divergence Boundary dispute Competing claims and attempts to alter the status quo: Doklam (2017) , Galwan Valley clash (2020) ; LAC militarisation; Chinese claims over Arunachal Pradesh and place-name exercises create tension and diplomatic pressure Regional influence China’s growing regional and maritime presence versus India’s interest in a multipolar Asia and secure sea lanes ; BRI, Chinese Indian Ocean presence, dual-use infrastructure and CPEC remain concerns, while India supports UNCLOS, freedom of navigation and ASEAN centrality Global governance Both want more developing-country representation but compete for Global South influence : India stresses reformed multilateralism and strategic autonomy; China promotes GDI and GSI Trade imbalance Asymmetric interdependence . Trade deficit about $112.16 billion in FY 2025-26 ; Chinese imports pressure Indian manufacturing and create supply-chain risks Technology Dependence on China for rare earths, graphite, electronics ; telecom equipment, apps and connected infrastructure raise cybersecurity and trusted-vendor concerns Brahmaputra China is upstream on the Yarlung Zangbo/Brahmaputra, India downstream . India seeks hydrological data, transparency and assessment of downstream impact Tibet factor Links the boundary dispute, Himalayan security and cultural ties. The Dalai Lama’s July 2025 succession statement makes the issue significant for future relations Handout p. 9 The three sectors of the India-China border and the sticking points: western, middle and eastern. The border: three sectors (handout p. 9) Sector Where and how long Key points Western Ladakh, adjoining Xinjiang and Tibet; 1,597 km India holds Aksai Chin is part of Ladakh; it is under Chinese control. Major fighting in 1962 . Tensions rose after 2020 (Galwan). After rounds of talks, an October 2024 agreement on patrolling in Depsang and Demchok Middle Himachal Pradesh and Uttarakhand; 545 km Least disputed of the three Eastern Sikkim and Arunachal Pradesh; 1,346 km The McMahon Line forms the basis of India’s boundary in the Arunachal sector; China disputes it. Major battles in 1962 . Doklam is the India-Bhutan-China tri-junction Total: India shares a 3,488 km border with China (Ladakh, Himachal Pradesh, Uttarakhand, Sikkim, Arunachal Pradesh). The border is not fully demarcated ; India and China differ over the alignment of the LAC , and over the India-Bhutan-China tri-junction. 1,597 + 545 + 1,346 = 3,488. Handout alert: the dates to keep apart Doklam 2017 (Eastern sector tri-junction) and Galwan 2020 (Western sector, Ladakh) are different places and years. Depsang-Demchok is in the Western sector (October 2024). The slides place Doklam and Galwan together in the 2017-20 phase of “Border confrontation”. Live in the news: the border, as of August 2026 In the news · Aug 2026 CA 25th Special Representatives talks: an eight-point consensus What was agreed The 25th round of SR talks on the boundary question produced eight points : two additional military meeting points and two hotlines ; an Expert Group on Boundary Delimitation and a Working Group on Border Management , both under the WMCC ; reopening of Lipulekh, Shipki La and Nathu La border trade points and more Kailash Mansarovar Yatra batches ; and a pledge to advance settlement talks on the 2005 Agreement on Political Parameters and Guiding Principles . Use it in an answer The word to use is “architecture” : hotlines, groups and trade points are confidence-building, but they do not draw a line. Still unresolved: no mutually agreed LAC , Arunachal (renaming of places, stapled visas), CPEC through PoK , and tri-junctions like Doklam near the Siliguri Corridor . Prelims hook SR mechanism : 2003. WMCC : 2012. 2005 Political Parameters. 1993 Peace and Tranquillity Agreement; 2020 Moscow 5-Point Statement ; October 2024 Patrolling Agreement . Passes: Shipki La (HP); Mana, Niti, Lipulekh (Uttarakhand); Nathu La, Jelep La (Sikkim); Bum La (Arunachal). Try first: Which two new bodies sit under the WMCC, and what does each do? An Expert Group on Boundary Delimitation (works on the line) and a Working Group on Border Management (works on the ground: patrols, contact, protocols). Source: Aug 2026 CA §3.4 (India-China boundary)."}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "10-india-china-four-issue-boxes", "t": "10 · India-China: four issue boxes", "x": "10 · India-China: four issue boxes # Class + handout Issue box 1: China-Pakistan nexus (slide 22, handout p. 10) Dimension Why mbers, launched 2022. India is an observer in the Trade pillar . Source: Aug 2026 CA §3.3; Jul 2026 CA §3.1."}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "14-india-us-areas-of-divergence", "t": "14 · India-US: areas of divergence", "x": "14 · India-US: areas of divergence # Class + handout Divergence (slide 27, handout pp. 13-14) Issue Nature of divergence Strategic autonomy The US expects closer alignment; India prefers issue-based cooperation without a formal alliance ; independent positions on Russia, Ukraine, China; engagement with BRICS and SCO Russia factor A key test of autonomy. Defence: S-400, Su-30MKI, T-90 in service. Energy: India prioritises affordable supplies, including Russian oil. Ukraine: dialogue and diplomacy, not automatic alignment. CAATSA: India opposes sanctions influencing sovereign defence choices Trade The US wants lower Indian tariffs on cars and motorcycles; India wants more market access. Reciprocal tariffs: a 25% reciprocal tariff plus a separate 25% tariff linked to Russian oil . A 2026 interim trade deal cut the rate to 18% (duty cuts on premium American cars and motorcycles). Agriculture: the US wants access for animal feed, nuts, fruits; India protects dairy, rice, wheat. WTO: public stockholding and subsidies. GSP: the US removed India from GSP in 2019 Digital and IPR Data localisation and rules on foreign digital firms. India is on the US Special 301 Priority Watch List ; India supports compulsory licensing for public-health needs (pharma) Defence technology The US shares more know-how than complete technological capability; export controls and end-use conditions can limit transfers Pakistan India opposes re-hyphenation of India and Pakistan in US policy and third-party mediation ; US security engagement with Pakistan raises terrorism concerns Mobility Indians received 71% of approved H-1B petitions (FY2024) ; wage-weighted selection may affect Indian applicants. Over 360,000 Indian students in the US (2025) ; 9 Indian student deaths (2018-2025) from violent attacks make student safety a bilateral concern Values and sovereignty US institutions raise religious freedom, press freedom, minority rights; India sees this as interference in internal affairs Climate India stresses CBDR and development space; US climate policy is volatile: withdrawal from the Paris Agreement in 2026 creates uncertainty on climate finance and targets Handout alert: the tariff numbers Two tariff figures appear: “ up to 50% ” (handout p. 12, the 2025-26 row: reciprocal tariffs before an interim deal) and the breakdown 25% + 25% (handout p. 13). The 2026 interim deal reduced the rate to 18% . Rule: 25% reciprocal + 25% Russian-oil-linked = 50%, later 18%. Live in the news: divergence, as the parliamentary committee lists it In the news · Aug 2026 CA Where it hurts: the committee’s list of frictions Why it matters Rising and unpredictable tariffs (18% against a 3% norm; frequent changes, earlier penalties). Non-tariff barriers: strict SPS standards and MRL limits on farm exports; heavy customs paperwork and audits. Macro limits: rupee volatility; MSMEs with thin buffers. The visa change (fixed stay for F, J, I visas) adds a people-to-people friction. Use it in an answer Group frictions as price (tariffs), paperwork (NTBs), people (visas) and then add the Russia factor (the 25% oil penalty) from the notes. This gives a clean three-plus-one structure. Prelims hook SPS : sanitary and phytosanitary. MRL : Maximum Residue Limit. Rules of origin and MRAs (mutual recognition agreements) are the usual remedies. Try first: Name the three kinds of friction (price, paperwork, people) with one live example each. Price: 18% tariffs. Paperwork: SPS/MRL and customs audits. People: the new fixed-stay rule for F, J, I visas. Source: Aug 2026 CA §3.3; Jul 2026 CA §3.9.4."}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "15-india-us-how-india-manages-the-relations", "t": "15 · India-U
