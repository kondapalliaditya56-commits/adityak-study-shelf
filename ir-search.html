.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}

/* ---- reader app ---- */
:root{--zoom:1;--lh:1.65;--pw:780px}
:root[data-theme="sepia"]{--bg:#F4ECD8;--surface:#FBF5E6;--surface2:#EADFC4;--ink:#3B3022;--muted:#7A6A52;--line:#D8C9A6;--acc:#7A4A12;--acc-ink:#fff;--acc-soft:#EFDDB8;--saf:#A4470A;--saf-soft:#F6E2BE;--red:#9C2A1C;--red-soft:#F3D9CB;--blue:#2F5C8A;--blue-soft:#DDE6E4;--good:#3E6B2A;--good-soft:#DDE8C8;--hl:#F2D98A;color-scheme:light}
:root[data-font="sans"] body{font-family:var(--sans)}
:root[data-font="sans"] .notes p,:root[data-font="sans"] .notes li{font-family:var(--sans)}
.page{zoom:var(--zoom);max-width:var(--pw)}
.notes p,.notes li{line-height:var(--lh)}
.rbar{position:fixed;left:0;top:0;height:3px;width:0;background:var(--acc);z-index:40;transition:width .15s}
.aabtn{color:var(--ink);border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:5px 12px;font:700 14px var(--serif);cursor:pointer;flex:none}
.h2read{float:right;margin:2px 0 0 10px;font:600 12px var(--sans);border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer;min-height:30px}
.h2read[aria-pressed="true"]{background:var(--acc-soft);color:var(--acc);border-color:var(--acc)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;justify-content:center}
.dock button{font:600 14px var(--sans);min-height:44px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;padding:0 14px;cursor:pointer}
.dock .mid{flex:1;max-width:520px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock .mid b{color:var(--acc)}
body.has-dock .page{padding-bottom:110px}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheetin{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:82vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));font:15px/1.4 var(--sans)}
.sheetin h3{margin:0 0 10px;font:700 17px var(--sans)}
.srow{display:flex;align-items:center;gap:10px;margin:12px 0;flex-wrap:wrap}
.srow label{flex:0 0 92px;color:var(--muted);font-weight:600}
.srow .grp{display:flex;gap:6px;flex-wrap:wrap}
.srow button{font:600 14px var(--sans);min-height:42px;min-width:48px;padding:0 12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;cursor:pointer}
.srow button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.secl a{display:flex;gap:10px;align-items:center;padding:12px 6px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;min-height:44px}
.secl a .tk{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--acc-ink)}
.secl a.rd .tk{background:var(--acc);border-color:var(--acc)}
.secl a.cur{background:var(--acc-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:50;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;font:600 14px var(--sans);max-width:92vw;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.toast button{font:700 14px var(--sans);background:transparent;border:0;color:var(--bg);text-decoration:underline;cursor:pointer;min-height:36px}
body.focus .bar{display:none}body.focus .sidetoc{display:none}
figcaption.clamp{max-height:3.3em;overflow:hidden;position:relative;cursor:pointer}

tents page will update. Copyright Notes are personal study notes. Copyright for the material belongs to the teacher and institute. Keep this notebook private."}, {"c": "0", "n": "Start Here: How to Use This Notebook", "id": "2-ir-in-the-gs-2-paper-and-how-it-is-asked", "t": "2 · IR in the GS-2 paper and how it is asked", "x": "2 · IR in the GS-2 paper and how it is asked # Class slides Syllabus lines (slide 2, PPT-1) Syllabus line India and its neighbourhood: relations Bilateral, regional and global groupings and agreements involving India and/or affecting India’s interests Effect of policies and politics of developed and developing countries on India’s interests Indian diaspora Important international institutions, agencies and fora: their structure, mandate Weightage (slide 3, PPT-1) Question Marks Words Q9 and Q10 10 each 150 Q19 and Q20 15 each 250 Every year, 4 questions carrying 50 marks come from IR. The slide says this placement and marks distribution have been consistent over the years. The four 2026 questions on slide 3 No. Statement, in short Where it is covered Q9 · 10m IPMDA bridges the gap between India’s SAGAR vision and the Quad’s collective Indo-Pacific strategy. Critically assess, focusing on IPMDA Chapter 1 (partial); IPMDA itself is not in the notes Q10 · 10m BRICS as a powerful counterweight, amplifying the Global South. Role of BRICS in projecting itself as an alternative to other groupings Chapters 1 and 2 Q19 · 15m India’s diaspora as a living bridge, economic factor and knowledge network, turning cultural heritage into strategic leverage. Critically examine Chapter 1 (determinant 9) and Chapter 2 (US diaspora) Q20 · 15m BRI has turned South Asia into a theatre of great-power competition. Strategic implications for India’s security and regional influence Chapter 2 Class slide stress: how the nature of IR questions has changed (slide 4) From bilateral relations to India’s place in the global order: questions now start from the global context, not from single-country relations. Statement-based questions that require critical evaluation: they open with an assertive claim that must be tested, not endorsed . Examples on the slide, 2026: BRI turning South Asia into a theatre; BRICS as a “powerful counterweight”; the diaspora as “strategic leverage”. The teacher’s approach to IR (slide 5) 1 · Questions are broader now themes asked in a wider context 2 · Big picture first how the world order evolved (Chapter 1) 3 · Major powers before bilaterals what US, China and Russia want (Chapter 2) 4 · Bilaterals follow within the bigger picture 5 · The outcome place any theme in its wider context A repeatable answer shape (built from slides 4 and 5) Open with the global setting (one sentence from Chapter 1). Test the claim : where it holds, where it does not. Give examples (the notes give one for most points). Close with India’s frame: strategic autonomy, multi-alignment, issue-based partnerships ."}, {"c": "0", "n": "Start Here: How to Use This Notebook", "id": "3-the-box-colours", "t": "3 · The box colours", "x": "3 · The box colours # Notebook The same boxes are used in every chapter. Class slide stress (orange) What the teacher’s slides stress: “Core idea”, “Key lesson”, “Essence”, the PYQs on the screen. The IR decks are typed: there is no handwriting, underlining or board ink , so “teacher stressed” here means what the slide itself highlights. Handout alert (red) A date or fact where the slides and the handout differ, or a thing the handout names without explaining. Each ends with a rule for the exam hall. Key idea (green) The line to remember: a definition, a conclusion or a closing idea. Example (blue) A quote, example or ready-made shape for an answer. Source note (grey) Where the section comes from: Class + handout, or Handout only (no slides yet). Memory aid A memory aid built from the material’s own words, never from outside facts."}, {"c": "0", "n": "Start Here: How to Use This Notebook", "id": "4-priority-a ATO expansion and US-Europe partnership: good for India? Chapter 2 2021 15m · 250w AUKUS and existing Indo-Pacific partnerships Chapter 2 (thin notes) 2020 15m · 250w Indo-US versus Indo-Russian defence deals Chapter 2 2020 15m · 250w Quad: military alliance to trade bloc? Chapters 1 and 2 2019 15m · 250w Friction in India-US ties Chapter 2 2019 15m · 250w India as a leader of the oppressed and marginalised Chapter 1 2019 10m · 150w India-Japan global and strategic partnership Chapter 2 2018 15m · 250w US-Iran nuclear pact and India Chapter 2 (thin notes) 2017 10m · 150w China’s trade surplus and military power Chapter 2 Every question in the table is a statement or “discuss” type. Chapter pages give each one a skeleton in their Practice section. Handout alert: three gaps flagged IPMDA (2026 Q9), AUKUS (2021) and the US-Iran nuclear pact (2018) are asked in PYQs but have thin or no notes in the material. Their skeletons say so. Add details from your class notes."}, {"c": "0", "n": "Start Here: How to Use This Notebook", "id": "5-which-lecture-covers-which-chapter", "t": "5 · Which lecture covers which chapter", "x": "5 · Which lecture covers which chapter # Notebook Lecture-to-chapter map Upload Material Goes to Notes PPT-1 (24 slides) Class slides: syllabus, weightage, 2026 questions, six phases of the global order Chapter 1, sections 1-7 Slide 1 is a title slide PPT-2 (23 slides) Class slides: India’s foreign policy: goals, determinants, six periods, trade-offs, challenges, key ideas Chapter 1, sections 8-10 Slides stop before the instruments section Handout “GS-2 IR - 12” (24 pages) Chapter 1 handout Chapter 1 The upload label “12” is the handout for Chapter 1 PPT-3 (37 slides) Class slides: major powers, US-China, Russia-West, India with China, US, Russia Chapter 2, sections 1-17 Slides 1 and 37 carry no text Handout “GS-2 IR - 3” (28 pages) Chapter 2 handout Chapter 2 The upload label “3” is Chapter 2. Includes the EU, France, Japan, Australia Handout only (no class slides yet) Chapter 1, section 11: Instruments of India’s contemporary foreign policy. Chapter 2, sections 18-21: the EU, France, Japan, Australia. Parts of earlier tables (a few phases of India-US and India-Russia) that the handout adds beyond the slides are marked “handout only”. Missing lectures No lecture is missing between PPT-1, PPT-2 and PPT-3. Later chapters are not uploaded yet: they will follow as the classes finish."}, {"c": "0", "n": "Start Here: How to Use This Notebook", "id": "6-tools-inside-the-notebook-and-a-revision", "t": "6 · Tools inside the notebook and a revision plan", "x": "6 · Tools inside the notebook and a revision plan # Notebook Tools in every chapter Tool What it does Exam lens Priority, PYQs quoted, what to prepare Mind map and Outline One-screen view of the chapter; use Outline on a phone Timeline Dates, with high-yield dates starred Traps Common mix-ups, each with a rule for the exam hall Recall sheet and Revise Read once, hide, rebuild; spaced schedule and blank-page prompts Practice Quick quiz, flashcards (tap to flip) and Mains answer skeletons Search Finds any word across chapters; links to the exact section Done box and Aa Mark a chapter done; change text size, width and theme Spaced revision plan (counted from the day you finish a chapter) Day What to do Time Day 0 Read the Exam lens and the notes once; mark the chapter done As needed Day +1 Recall sheet: read once, hide, rebuild 15 min Day +3 Flashcards (missed ones only) 15 min Day +7 Quick quiz; fix every miss against the Traps 20 min Day +21 Write two Mains answers from the skeletons, from memory 40 min Day +45 Blank-page test: draw the chapter map and the timeline from memory 30 min One line for the whole notebook India’s central thread is strategic autonomy : partnering widely, aligning selectively and depending permanently on none."}, {"c": "1", "n": "Introduction to World Geopolitics and India’s Foreign Policy", "id": "exam-lens-priority-and-pyqs", "t": "Exam lens: priority and PYQs", "x": "Exam lens: priority and PYQs # Source note This chapter has class slides and a handout. Class slides PPT-1 (24 slides) and PPT-2 (23 slides); handout Chapter 1, pages 1-21 (uploaded as “GS-2 International Relations - 12”). The slides are typed. There is no handwriting, underlining or board ink in these decks , so the “teacher’s stress” in this notebook comes from what the slides themselves put in headings, “Core idea”, “Key lesson”, “Essence” and “Key ideas” lines. Priority below is read from the slides and the handout’s PYQ page. The material quotes no Prelims PYQs for IR (this is the GS Mains module). Mains years quoted are listed below; a “years quoted” count is not a count of distinct questions. What the teacher and handout stress Signal in the material Where Why it matters IR carries 4 questions and 50 marks every year : Q9 and Q10 (10 marks, 150 words) and Q19 and Q20 (15 marks, 250 words) Slide 3 (PPT-1) Fixes your time per answer. The slide says the placement has stayed consistent over the years. “Questions are broader now”: themes asked in a wider context , not as direct bilateral questions Slides 4 and 5 (PPT-1) Open every answer with the global setting, then narrow to India. Statement-based questions that must be tested, not endorsed Slide 4 (PPT-1) Use “agree in part, but…”. Every 2026 question opened with a strong claim. Order of study: big picture first, major powers before bilaterals Slide 5 (PPT-1) Chapter 1 is the big picture; Chapter 2 gives the powers; bilaterals follow. Phase 6 “ Essence of the phase ”: Rivalry → Strategic Realignment → Economic and Tech Fragmentation → Multipolarity → Institutional Paralysis Slide 21 (PPT-1) A ready-made one-line introduction for any current-affairs IR answer. “ Where does the global order stand today? ”: six features, with a US-led versus China-backed table Slides 22-23 (PPT-1) The six features are a checklist for the “context” paragraph. India’s “ Central thread: strategic autonomy ” and the “Key ideas” keyword table Slides 21-22 (PPT-2) Strategic autonomy is the answer to “why does India do X?”. “Not a shift from values to interests”: India still follows its values but has more capability Handout p. 17 Answers “Has India given up idealism?” type questions. PYQs quoted in the material (Mains only) Year, marks, words What was asked Answer or trap Where in this chapter Source Mains 2026 · Q9 · 10 marks · 150 words IPMDA (Indo-Pacific Partnership for Maritime Domain Awareness) “bridges the gap between India’s SAGAR vision and the Quad’s collective Indo-Pacific strategy.” Critically assess, focusing on IPMDA. Open-ended. See the skeleton in Practice. Partial: SAGAR/MAHASAGAR and Quad in section 11 and Chapter 2. IPMDA itself is not in these notes. slides 3 Mains 2026 · Q10 · 10 marks · 150 words BRICS “acts as a powerful counterweight in global governance, actively amplifying the voice and influence of the Global South.” Explain the role of BRICS in projecting itself as an alternative to other groupings. Open-ended. See the skeleton in Practice. BRICS in sections 5, 6, 7 and 11 slides 3 Mains 2026 · Q19 · 15 marks · 250 words India’s global diaspora “acts as a living bridge, as a critical economic factor and knowledge network in transforming cultural heritage into geopolitical influence and strategic leverage.” Critically examine. Open-ended. See the skeleton in Practice. Determinant 9 in section 8; evacuations in sections 8 and 11; US diaspora in Chapter 2 slides 3 Mains 2026 · Q20 · 15 marks · 250 words China’s BRI “has transformed South Asia from a regional space into a theatre of great power competition.” Analyse the strategic implications for India’s security and regional influence in South Asia. Open-ended. Answered in Chapter 2. Chapter 2 (also BRI 2013 in section 6 here) slides 3 Mains 2025 · 10 marks · 150 words “With the waning of globalization, post-Cold War world is becoming a site of sovereign nationalism.” Elucidate. Open-ended. See the skeleton in Practice. Sections 6 and 7 handout p. 21 Mains 2020 · 15 marks · 250 words “Quadrilateral Security Dialogue (Quad)” is transforming itself into a trade bloc from a military alliance, in present times: discuss. Open-ended. See the skeleton in Practice. Sections 6, 7, 9 and 11 handout p. 21 (also quoted in Chapter 2) Mains 2019 · 15 marks · 250 words “The long-sustained image of India as a leader of the oppressed and marginalised nations has disappeared on account of its new found role in the emerging global order.” Elaborate. Open-ended. See the skeleton in Practice. Sections 9 and 10 handout p. 21 Mains years quoted: 2026 (four questions, quoted on slide 3), 2025, 2020 and 2019. Prelims years quoted: none quoted in the material. Question 20 of 2026 and the Quad question of 2020 are also quoted in Chapter 2. What to prepare Prelims hooks: the six phases and their years; Westphalia 1648; Wilson’s 14 Points 1918; League 1920; NATO 1949 and Warsaw Pact 1955; NAM 1961 (Belgrade); NPT 1968; Stockholm 1972; Schengen 1985; WTO 1995 and China’s entry 2001; BRICS NDB 2014; BRI 2013; Brexit 2016; Gujral Doctrine; String of Pearls versus Diamond Necklace; Operations Ganga, Kaveri and Sindhu. Mains hooks: why each phase gave way to the next (cause and effect); what “multipolar churn” means; economic nationalism and weaponised interdependence; the Global South and institutional reform; India’s determinants and the six periods of its policy; five trade-offs and seven structural challenges; India’s “bridge power” role. Closing idea: India’s central thread is strategic autonomy, now pursued with more economic, military, technological and diplomatic capability."}, {"c": "1", "n": "Introduction to World Geopolitics and India’s Foreign Policy", "id": "1-basics-first-ir-foreign-policy-and-the-s", "t": "1 · Basics first: IR, foreign policy and the six-phase story", "x": "1 · Basics first: IR, foreign policy and the six-phase story # Class + handout International Relations (IR) is the study of how countries interact with one another and with other actors across borders: international organisations, companies, social movements and individuals. Its core question is: why do countries behave the way they do? Behaviour is shaped by power, security, economic interests, ideas and institutions. IR is wider than war and diplomacy: it includes trade, technology, energy, climate change, migration and global institutions. Key terms Term Meaning Main question Foreign policy What a country wants from the outside world and how it pursues those goals What does a country want to achieve abroad? Geopolitics How geography, location and resources affect power and strategy Why does location matter? Global order How power, rules and institutions are arranged in the world Who has influence, and how is the system organised? How the global order evolved: six phases at a glance Phase Period Defining character Phase 1 Until 1914 Sovereign states, empires and the balance of power Phase 2 1919 to 1945 Liberal experiment, its failure and a second world war Phase 3 1945 to 1991 Two superpowers, nuclear deterrence and new institutions Phase 4 1991 to 2008 American primacy, globalisation and the Washington Consensus Phase 5 2008 to 2019 Crisis of the liberal order and the rise of new powers Phase 6 2020 onwards Post-COVID fragmentation, economic nationalism and multipolar churn The handout’s warning: the world did not move in a straight line from war to peace. Every phase mixed power politics, cooperation and competing ideas, and each new phase carried features of the older one. Class slide stress: the teacher’s approach (slide 5) Questions are broader now. Big picture first : the course opens with how the world order evolved. Major powers before bilaterals : what the US, China and Russia want comes before India’s ties with them. Bilaterals follow , inside the bigger picture. Outcome: any specific theme can be placed in its wider context. Teacher’s order of study 1 · The world order Six phases (this chapter) 2 · Major powers US, China, Russia: ambitions and instruments (Chapter 2) 3 · Bilaterals India with China, US, Russia and others (Chapter 2 onwards) 4 · The outcome Place any theme in its wider context Handout alert: where Phase 5 ends The slide table and handout table say Phase 5 is 2008 to 2019 . The Phase 5 slide headings say “ Post-2008 till 2020 ”. Phase 6 begins in 2020 . Rule for the exam hall: Phase 5 = 2008 to 2019/20; Phase 6 starts in 2020 (post-COVID)."}, {"c": "1", "n": "Introduction to World Geopolitics and India’s Foreign Policy", "id": "2-phase-1-dominance-of-realism-until-world", "t": "2 · Phase 1: Dominance of Realism (until World War I)", "x": "2 · Phase 1: Dominance of Realism (until World War I) # Class + handout “A country that demands moral perfection in its foreign policy will achieve neither perfection nor security.” (Henry Kissinger, quoted in the handout.) The sovereign state system Before 1648 , Europe was divided by religious and dynastic conflicts . People were loyal to rulers and churches, not to nation-states. The Thirty Years’ War (1618-1648) was fought largely along Protestant-Catholic and dynastic lines. It showed how fragmented authority and competing loyalties lead to widespread violence. The Peace of Westphalia (1648) ended the war and laid the foundation of modern international law and the sovereign state system . It set the principles of state sovereignty and non-interference in internal affairs. Centralised states such as France and Sweden grew stronger after it. Key concepts Concept Meaning Sovereignty Supreme authority inside its territory; accepts no outside authority over it International anarchy Not chaos. There is no world government above states, so no one but the state itself can guarantee its safety Nation-state A state (fixed territory, population, government) where state and nation (a people who feel they belong together by language, culture or history) broadly match Security dilemma One state arms for defence, others feel threatened and arm too. Both end up less secure , though neither wanted war Balance of Power (BoP) States act to prevent any one power becoming dominant Realism and its flow Realism sees international politics as a struggle for security, survival and sovereignty . With no authority above states, countries rely on self-help and build their own power. This creates mistrust: one state’s build-up makes others feel threatened. The Realism flow (slide 7) International anarchy no central authority Self-help every state builds its own power Mistrust Security dilemma defensive arming looks like a threat Arms race Balance of Power the attempt to stop any one state dominating The road to World War I Many states believed that attacking first could give an advantage. Germany’s Schlieffen Plan reflected this thinking. The Balance of Power could not prevent conflict . Military build-up and rival alliances increased tensions. The assassination of Archduke Franz Ferdinand triggered World War I, but deeper rivalries had already made war likely. The peace after the war stayed weak. Nehru called it a “ nervous state of peace ”. The Realist problem in one line A state may increase its power to become safer, but this can make other states feel threatened. The cycle: fear → self-help → military build-up → arms race → balancing."}, {"c": "1", "n": "Introduction to World Geopolitics and India’s Foreign Policy", "id": "3-phase-2-liberal-thought-enters-but-reali", "t": "3 · Phase 2: Liberal thought enters, but Realism dominates (inter-war)", "x": "3 · Phase 2: Liberal thought enters, but Realism dominates (inter-war) # Class + handout After World War I, ideas of collective security, cooperation and economic interdependence gained ground. Many proposals were not fully realised because of geopolitical resistance and continuing power politics. Rise of liberal ideas Wilson’s 14 Points (1918) : self-determination, free trade, international cooperation and an association of nations. League of Nations (1920) : Wilson’s “association of nations”; collective security, “one for all, all for one”; tried to mediate disputes through diplomacy. Trade and movement of people were seen as tools to reduce the risk of war by linking countries more closely. Two key concepts Concept Meaning Liberalism War is not inevitable. Institutions, trade, democracy and international law can build cooperation without a world government Collective security All members act together against any aggressor. It works only when major powers are willing to enforce it Return of Realism after the Great Depression (1929) Protectionism: trade barriers rose. Authoritarian regimes rose in Germany, Italy and Japan . Expansionism: aggressive foreign policies. The League could not stop Japan in Manchuria (1931) or Italy in Abyssinia (1935) . These developments led to World War II , whose devastation exposed the limits of the inter-war order. The Nuclear Age The atomic bombing of Hiroshima and Nagasaki (1945) changed international security. Nuclear deterrence became central. Mutually Assured Destruction (MAD) discouraged direct nuclear war because any exchange would destroy both sides. Deterrence prevents an attack by convincing the enemy that the cost will exceed the gain. It depends on capability, credibility and clear communication . Phase 2 cause chain Liberal hope 14 Points 1918 → League 1920 Great Depression 1929 protectionism, authoritarian regimes, expansionism League fails Manchuria 1931, Abyssinia 1935 World War II then the nuclear age: Hiroshima and Nagasaki 1945"}, {"c": "1", "n": "Introduction to World Geopolitics and India’s Foreign Policy", "id": "4-phase-3-liberalism-realism-and-idealism", "t": "4 · Phase 3: Liberalism, Realism and Idealism together (Cold War, 1945-1991)", "x": "4 · Phase 3: Liberalism, Realism and Idealism together (Cold War, 1945-1991) # Class + handout Liberal institutions promoted cooperation and collective security, while US-USSR rivalry drove military blocs, proxy wars and the arms race. A third strand, Idealism , appeared as the Non-Aligned Movement. Liberalism: cooperation and collective security Institution or agreement Purpose United Nations (1945) Peace, diplomacy, collective security. Superpower rivalry often limited it IMF and World Bank Economic stability and reconstruction Marshall Plan About 13 billion dollars for rebuilding Europe; also aimed to contain communism NPT (1968) Prevent spread of nuclear weapons; laid the ground for SALT (Strategic Arms Limitation Talks) Stockholm Conference (1972) Early global cooperation on environmental protection Schengen Agreement (1985) Free movement and economic integration in Europe Cooperation and great-power interests: liberal institutions did not work apart from power politics. The Marshall Plan helped rebuild Western Europe and served containment. The USSR created COMECON to deepen economic cooperation and keep influence over Eastern Europe. Realism: rivalry and arms race Feature Detail Blocs NATO (1949) versus Warsaw Pact (1955) Proxy wars Korean War and Vietnam War Nuclear arms race Huge arsenals; Cuban Missile Crisis (1962) brought the world close to nuclear war Middle East Yom Kippur War (1973) : US backed Israel; USSR backed Arab states Result Bipolarity : a world dominated by two powers, with smaller states pressed to align Idealism: NAM and strategic autonomy The Non-Aligned Movement was formally launched at the Belgrade Summit (1961) : peace, sovereignty, anti-colonialism and independent foreign policy. New countries stayed outside the US and USSR blocs. Under Nehru , India promoted strategic autonomy and independent judgement. Strategic autonomy = the ability to take foreign-policy decisions on one’s own national interest, without being bound to any bloc. Security needs sometimes pushed NAM countries towards one bloc. India signed the 1971 Treaty of Peace, Friendship and Cooperation with the USSR during the Bangladesh crisis. India-US relations were strained when the US sent the USS Enterprise into the Bay of Bengal in support of Pakistan. Three strands side by side (slides 11-12) Strand Core idea Examples Liberalism Institutions bring cooperation UN 1945, IMF-World Bank, NPT 1968, Stockholm 1972, Schengen 1985, Marshall Plan, COMECON Realism Rivalry and power balance NATO 1949, Warsaw Pact 1955, Korea, Vietnam, Cuban Missile Crisis 1962 Idealism Peace and independence from blocs NAM 1961, Nehru’s strategic autonomy, with India-USSR Treaty 1971 as a security exception"}, {"c": "1", "n": "Introduction to World Geopolitics and India’s Foreign Policy", "id": "5-phase-4-victory-of-liberalism-the-unipol", "t": "5 · Phase 4: Victory of Liberalism (the unipolar moment, 1991-2008)", "x": "5 · Phase 4: Victory of Liberalism (the unipolar moment, 1991-2008) # Class + handout The high point of the liberal order: democracy, capitalism, free trade, globalisation and multilateral institutions under strong US leadership. At the same time climate change, terrorism and cybersecurity raised the need for global cooperation, and emerging powers pushed the world towards multipolarity. Fall of the USSR (1991) The collapse of the Soviet Union ended the Cold War and left the US as the sole superpower: the unipolar moment . Former Soviet and Eastern European states moved towards democracy and market economies. Poland and the Baltic states moved closer to NATO and the EU . Under Boris Yeltsin , Russia adopted privatisation and deregulation, though the transition created serious economic problems. Globalisation and US hegemony WTO (1995) institutionalised free trade. China’s WTO accession (2001) accelerated its integration. India and Brazil also gained from expanding trade. The US acted through institutions, and unilaterally when it thought necessary. Afghanistan (2001) and Iraq (2003) showed its military reach; the Iraq War also exposed the risks of unchallenged hegemony and strategic overreach . US-led globalisation provided markets, capital and stability that helped emerging economies such as China and India . Global issues needing cooperation Issue Marker Climate change Kyoto Protocol (1997) , later the Paris Agreement (2015) Terrorism 9/11 strengthened counter-terrorism cooperation Cybersecurity Digital dependence created cross-border vulnerability Rise of multipolarity: the economic rise of China, India, Brazil and Russia shifted power away from a purely US-dominated system. BRICS reflected emerging economies’ demand for a greater voice in global governance. India’s LPG reforms (1991) The 1991 balance-of-payments crisis led to Liberalisation (fewer industrial controls and licences), Privatisation (bigger role for private sector) and Globalisation (more trade, FDI, technology). India’s nominal GDP rose from about $270 billion (1991) to nearly $1.2 trillion (2008) . Economic interests became more important in India’s foreign policy. Concept: unipolarity and hegemony Unipolarity is a world with one dominant power. Hegemony is leadership strong enough to write the rules for others. It can give stability but can also lead to overreach."}, {"c": "1", "n": "Introduction to World Geopolitics and India’s Foreign Policy", "id": "6-phase-5-crisis-of-liberalism-post-2008", "t": "6 · Phase 5: Crisis of Liberalism (post-2008)", "x": "6 · Phase 5: Crisis of Liberalism (post-2008) # Class + handout The Global Financial Crisis (2008) weakened Western economies and confidence in the Western-led liberal order. China and India gained weight. The phase saw multipolarity, protectionism, nationalism and strategic competition . Major trends of the phase Trend What changed Shift to the Indo-Pacific China and India became major growth centres. 2010: China overtook Japan as the second-largest economy. The US answered with the Pivot to Asia under Obama Reduced US engagement Focus on domestic recovery; fewer commitments in Iraq and Afghanistan. Later America First under Trump: national interest, tariffs, burden-sharing Rise of BRICS and G20 Emerging economies sought a bigger global role. BRICS created the New Development Bank (2014) . G20 became the platform for managing crises India as a balancing power Bigger Indo-Pacific role with strategic autonomy , through BRICS, G20 and Quad; keeps seeking reform of global institutions, including a permanent UNSC seat Brexit and European challenges Brexit (2016) : sovereignty, immigration and integration concerns; about 52% voted to leave the EU Migration, nationalism, populism The Syrian refugee crisis deepened divisions in Europe. Germany took over one million refugees ; countries such as Hungary resisted Rise of protectionism Tariffs and other measures; the US-China trade war is the main example Rise of China and the start of US-China rivalry Four dimensions of China’s rise Dimension Detail Economic and strategic Manufacturing strength, financial scale, supply-chain centrality. BRI (2013) gave access to chokepoints, ports and energy corridors. Gwadar, Hambantota and CPEC extended presence in the Indian Ocean and reduced dependence on the Malacca Strait Military and maritime Naval expansion; grey-zone tactics and salami slicing to advance claims; South China Sea and Taiwan tensions; A2/AD in its near seas Technological Self-reliance in 5G, semiconductors, EVs, batteries. Made in China 2025 (2015) . Huawei’s 5G became a symbol of US-China tech rivalry Institutional Bigger role in BRICS and SCO ; AIIB strengthened its role in development finance US-China rivalry: how it spread (slide 17) Pivot to Asia Indo-Pacific focus 2018 trade war tariffs Technology competition 5G, semiconductors Supply-chain competition diversification Indo-Pacific competition strategic rivalry Class slide stress: “Overall” (slide 17) Rivalry expanded from trade to technology, supply chains, semiconductors and regional security. Globalisation continued but became more political, protectionist and security-driven . Key terms Term Meaning and example Salami slicing Gradual change through small steps that avoid a major response. Example: incremental expansion in the South China Sea A2/AD Anti-Access/Area-Denial: capabilities to keep an opponent’s forces out of a region. Example: China’s missiles and navy around Taiwan and the South China Sea Strategic chokepoints Narrow sea passages carrying huge trade and energy flows. Examples: Strait of Malacca, Strait of Hormuz Pivot to Asia Obama-era shift of US diplomatic, economic and military attention to the Asia-Pacific Made in China 2025 2015 industrial policy for advanced manufacturing and strategic technologies (semiconductors, EVs, robotics) Strategic competition Long-term rivalry for economic, military, technological and political influence without necessarily going to war"}, {"c": "1", "n": "Introduction to World Geopolitics and India’s Foreign Policy", "id": "7-phase-6-geopolitical-fragmentation-and-s", "t": "7 · Phase 6: Geopolitical fragmentation and strategic realignment (2020 onwards)", "x": "7 · Phase 6: Geopolitical fragmentation and strategic realignment (2020 onwards) # Class + handout The 2020s have more global and regional conflicts, driven by rivalry, economic shifts and nationalism. States put sovereignty, national security and strategic interests first. Features: strategic recalibration, techno-nationalism , economic nationalism, transactional diplomacy, cyber threats and weaker cooperation. 1 · Major conflicts and rivalries West Asia: the Israel-Hamas conflict (began 2023) created a major humanitarian crisis in Gaza. Iran, Israel, Hezbollah and the Houthis widened it beyond Gaza. In February 2026 joint US-Israeli strikes on Iran marked a major escalation and killed Iran’s Supreme Leader Ayatollah Ali Khamenei. Iran retaliated. The handout reads this as a shift from proxy confrontation towards direct state-to-state conflict . Russia-Ukraine (2022-): sharply raised Russia-West tension; hit European security, energy markets and food; Western military support and sanctions made it part of the wider Russia-West confrontation; no durable settlement yet. Russia vetoed a 2022 UNSC resolution on the invasion. 2 · Power shifts and multipolarity US-China rivalry dominates the Indo-Pacific. China: BRI plus military modernisation ; US: Quad plus AUKUS . Middle powers (India, Brazil, Indonesia, Türkiye) seek strategic space. Countries form issue-based coalitions , not permanent blocs. BRICS, Quad, SCO, G20 show overlapping partnerships and competitive multilateralism : different powers and groupings compete to shape rules and outcomes. India: strategic autonomy and multi-alignment; ties with both Russia and the West; Quad, BRICS, SCO and G20 together. The handout calls this “strategic patience and calibrated engagement”. 3 · Economic nationalism and deglobalisation COVID-19 and geopolitical tension exposed the risks of dependence on global supply chains, strengthening deglobalisation, protectionism and economic nationalism . Supply-chain resilience: diversify semiconductors, pharmaceuticals, critical minerals. Supply Chain Resilience Initiative (SCRI) by India, Japan and Australia. Reshoring: the EU is raising domestic production of semiconductors and pharmaceuticals. Friend-shoring and de-risking: shifting supply chains to trusted partners (example given: Pax Silica). Strategic trade: security considerations shape trade and investment. Alternative finance: BRICS countries have discussed local currencies and alternative payment mechanisms. US tariff politics: a protectionist administration returned after the 2024 election and revived “America First” (the slide says since 2025). The Lindsey O. Graham Sanctioning Russia and Iran Act of 2026 lets the US President impose tariffs up to 100% on countries importing large amounts of Russian oil and gas. In 2025 fresh US tariffs hit Chinese goods; China answered with tariffs on US farm exports and curbs on critical materials, including rare earths . Sovereignty-first policy: national security now outranks market efficiency. India’s own parallel is Atmanirbhar Bharat . Key concepts Concept Meaning and example Geoeconomics Use of trade, tariffs, sanctions, investment or finance to reach strategic goals Weaponised interdependence Using control over financial, trade or technology networks to pressure another country. Examples: curbs on Russian banks’ access to SWIFT ; US chip export controls on China Transactional diplomacy Foreign policy based on immediate benefits and bargaining, not long-term commitments or shared values Techno-nationalism Links technology to national security and economic power; states control critical technologies and may deny them to rivals 4 · Technology and cyber geopolitics The US and China compete in AI, semiconductors, advanced computing and telecom (example: US ban on Huawei). Export controls and technology restrictions are used for security. Cyberattacks on critical infrastructure and military AI raise new risks. India stresses an inclusive, human-centric approach to AI and wider democratisation. The handout quotes PM Modi: “India does not see fear in AI. India sees fortune in AI. India sees the future in AI.” 5 · Rise of the Global South Developing countries want more voice in agenda-setting, development finance and institutional reform . G20 presidencies: Indonesia (2022), India (2023), Brazil (2024), South Africa (2025) , bringing development, debt, food security and Global South concerns forward. African Union became a permanent member of the G20 (2023). Global Alliance Against Hunger and Poverty came under Brazil’s G20 presidency. Reform demands: G4 seeks more permanent UNSC seats; Ezulwini Consensus is the AU’s demand for African representation in the Security Council; developing countries seek more say in the IMF and World Bank . 6 · Nationalism and populist politics Themes: national sovereignty, stricter migration controls, protection of domestic industry, doubt about deeper globalisation. Examples named: Trump’s “America First”, Giorgia Meloni’s Brothers of Italy , Marine Le Pen’s National Rally (France), the AfD (Germany). 7 · Climate and humanitarian stress Climate change is a threat multiplier : food insecurity, displacement, livelihood stress, pressure on resources. It usually intensifies existing vulnerabilities rather than directly causing conflict. Nepal: a 2026 glacier collapse and floods showed Himalayan vulnerability and revived calls for climate justice and loss-and-damage support. South Asia: heatwaves, floods, extreme rain. Myanmar: Cyclone Mocha (2023) worsened a crisis after the 2021 military takeover; conflict pushed refugees into India and Thailand. Sahel and Horn of Africa: conflict, instability and climate shocks worsen hunger and migration. 8 · Institutional paralysis UNSC veto: the P5 veto can block action in major conflicts (Russia’s 2022 veto). WTO Appellate Body paralysis: the US blocked judicial appointments, leaving no quorum for appeals. The handout calls the result selective multilateralism and institutional paralysis . Essence of the phase (slide 21) Rivalry Strategic realignment Economic and tech fragmentation Multipolarity Institutional paralysis Where does the global order stand today? (slides 22-23) Class slide 22 Features 1 to 3: great-power rivalry and multipolarity; economics has become strategic; institutions are under stress. Class slide 23 Features 4 to 6: rise of minilateralism; sovereign nationalism and a changing globalisation; US-led order versus China-backed alternatives (table below). Feature 6: US-led system versus China-backed alternatives (slide 23) Area US-led system China-backed alternatives Development finance IMF / World Bank AIIB / NDB Connectivity PGII / IMEC BRI / CPEC Finance Dollar and SWIFT Yuan settlements and alternative payment mechanisms Technology US-led AI and semiconductors Chinese 5G and digital infrastructure The slide’s own line: China has not replaced the US-led order. Competition has widened across finance, technology, connectivity, institutions and narratives. Minilateral groupings (Quad, SCO, I2U2, BRICS+, trilaterals) supplement, not replace , traditional institutions. Handout alert: “Pax Silica” and “Operation Ajay” The handout names Pax Silica (as a friend-shoring example) and Operation Ajay (in a list of evacuation operations) without explaining them. They appear here only as the handout writes them. Check the notebook if the teacher explained them in class."}, {"c": "1", "n": "Introduction to World Geopolitics and India’s Foreign Policy", "id": "8-india-s-foreign-policy-goals-and-ten-det", "t": "8 · India’s foreign policy: goals and ten determinants", "x": "8 · India’s foreign policy: goals and ten determinants # Class + handout India’s foreign policy changes with the global order (Cold War bipolarity to present multipolar churn), the security environment (China border, Pakistan, terrorism), economic needs (trade, FDI, energy, technology, especially after 1991) and national ambitions (G20, Global South, UNSC reform). Three broad goals stay constant: security, prosperity and an independent voice (strategic autonomy). The ten determinants (slides 3-7 of PPT-2, with handout detail) Determinant Aim and content Examples 1 · Economic development Create an outside environment that supports growth: export markets and FDI, technology and capital, energy and minerals, reliable supply chains, connectivity, opportunities for Indian business and workers . The 1991 reforms tightened the link US, EU, Japan (trade and FDI); semiconductors, defence (technology); Russian crude, West Asian oil; China+1; Chabahar, INSTC, IMEC 2 · Security and territorial integrity Boundary disputes with China and Pakistan ; cross-border terrorism; nuclear and missile risks; maritime and cyber security; external influence in the neighbourhood; fragile supply chains. These shape border infrastructure, defence partnerships, nuclear policy, maritime cooperation and opposition to CPEC LAC preparedness; Indian Ocean surveillance 3 · Geography Himalayan frontier (China, Nepal, Bhutan); Pakistan blocks direct land access to Afghanistan and Central Asia (so Chabahar matters); Indian Ocean carries trade and energy; Andaman and Nicobar sit near the Indian-Pacific sea routes; neighbours’ instability affects migration, security, connectivity Malacca Strait; Chabahar 4 · Strategic autonomy Freedom to decide on India’s own interests: pragmatism, sovereignty, multi-alignment, avoiding rigid alliances Quad with the US while keeping ties with Russia 5 · Energy and critical resources Aim: diversification without excessive dependence on any one supplier . West Asia (oil, gas); Russia (crude, nuclear); US (LNG, energy technology); Australia, Africa, Latin America (critical minerals) National Critical Mineral Mission (2025) 6 · Science and technology Access to advanced technology while building domestic capability: AI and semiconductors, space and quantum, defence technology, telecom and cyber, nuclear and clean energy, digital infrastructure India-US critical technology; India-France space 7 · Political values and history Sovereign equality, anti-colonialism and opposition to racial discrimination , non-interference, peaceful settlement, multilateralism, reform of global institutions . Principles combine with pragmatism Demand for UNSC reform 8 · Domestic and federal politics Parliament, parties, industry, media and public opinion shape policy space Tamil Nadu : Sri Lankan Tamils and fishermen; West Bengal : Teesta; Northeast : Bangladesh and Myanmar connectivity; coastal states: ports 9 · Diaspora and people-to-people ties One of the world’s largest overseas communities: remittances and investment, business and professional networks, technology and knowledge links, cultural influence, consular protection Operation Ganga (2022) : Ukraine. Operation Kaveri (2023) : Sudan. Operation Sindhu (2025) : Iran and Israel 10 · Climate and emerging issues Climate change and finance, sustainable lifestyles, global health, cybersecurity and AI governance, oceans and blue economy, space and polar regions ISA, CDRI, Mission LiFE Class slide stress: each determinant is framed as “Aim: … Eg: …” (slides 3-7) The teacher gives a one-line Aim and a current example for every determinant. Use the example in your answer: it is what turns a list into evidence. The diaspora determinant is the one the 2026 Q19 asked about. Ten determinants (memory aid built from the list) E S G S E S t P D D C E conomy · S ecurity · G eography · S trategic autonomy · E nergy · S cience and tech · P olitical values · D omestic politics · D iaspora · C limate. Say: “ E very S mart G uy S ees E nergy, S cience, P olitics, D omestic D iaspora C limate.” Why diaspora matters twice The handout calls the diaspora both a foreign-policy asset and a consular responsibility : assets (remittances, networks, soft power) and duties (evacuations such as Ganga, Kaveri, Sindhu)."}, {"c": "1", "n": "Introduction to World Geopolitics and India’s Foreign Policy", "id": "9-evolution-of-india-s-foreign-policy-six", "t": "9 · Evolution of India’s foreign policy: six periods", "x": "9 · Evolution of India’s foreign policy: six periods # Class + handout At a glance (slide 8, PPT-2) Period Main approach Key example 1947-1962 Non-alignment and idealism Panchsheel, NAM 1962-1971 Security correction 1962 China war 1971-1991 Strategic assertion Indo-Soviet Treaty 1991-1998 Economic opening LPG, Look East 1998-2014 Diversified partnerships India-US Nuclear Deal 2014-present Multi-alignment Quad + BRICS + SCO 1947-1962: Non-alignment and idealist foreign policy India became independent in the Cold War bipolar order and wanted to avoid dependence on either bloc. Idealist principles: peace, anti-colonialism, racial equality, disarmament, cooperation . The handout calls this emphasis on values “ normative idealism ”. Emphasis: non-alignment, Panchsheel and peaceful coexistence, support for newly independent countries, faith in multilateralism . 1962-1971: Security correction The 1962 China war exposed weak defence preparedness; the 1965 Pakistan war raised the importance of security further. Focus: defence modernisation, territorial integrity, military preparedness, pragmatic engagement with major powers, hard power . Example: more defence cooperation with the Soviet Union. Shift: idealism continued, but Realist concerns became stronger. India did not abandon non-alignment. 1971-1991: Strategic assertion More willingness to use diplomatic and military capability: Indo-Soviet Treaty (1971) , creation of Bangladesh , Pokhran-I (1974) , more involvement in the neighbourhood, still no formal alliances . Key lesson: non-alignment did not stop India from making a strategic partnership when security required it. 1991-1998: Economic opening and strategic adjustment Key idea: autonomy through economic integration . The Soviet collapse and India’s 1991 crisis changed the environment. Focus: liberalisation, trade and FDI, access to capital and technology, Look East Policy , better ties with the US, Europe and East Asia. Gujral Doctrine: better neighbourhood relations through trust + non-reciprocity + respect for sovereignty . 1998-2014: Diversified strategic partnerships Pokhran-II (1998) first drew pressure, then ties widened: deepening India-US relations, India-US Civil Nuclear Agreement , continued Russia partnership, Japan, ASEAN and Europe, more defence, energy and technology cooperation, bigger roles in G20 and BRICS . India built strong relations with several powers without depending on any one . 2014-present: Multi-alignment and strategic pragmatism Context: multipolar churn : US-China rivalry, conflicts, technology competition, supply-chain risk, pressure on institutions. Approach: multi-alignment and issue-based partnerships . Quad: free and open Indo-Pacific amid China’s assertiveness. AIIB: India joined this China-initiated bank despite differences. BRICS: India works with China and Russia for a multipolar order. Russia, energy: India keeps importing Russian oil despite Western pressure. Russia, defence: India bought the S-400 despite the risk of US CAATSA sanctions. Instruments: minilateralism, maritime diplomacy, technology diplomacy, geoeconomics . Role: a bridge power between major powers and the Global South, supporting reformed multilateralism . India’s overall evolution (slide 21, PPT-2) Non-alignment Strategic partnerships Multi-alignment Issue-based cooperation Class slide stress: “Central thread: Strategic autonomy” (slide 21) Present aim: protect national interest, maintain policy independence, build economic and military capability, expand global influence, become a stronger rule-shaper. Handout alert: Gujral Doctrine and idealism are not the same thing The Gujral Doctrine belongs to 1991-1998 and is about the neighbourhood (trust, non-reciprocity, respect for sovereignty). Panchsheel and NAM belong to 1947-1962 . Do not mix the periods."}, {"c": "1", "n": "Introduction to World Geopolitics and India’s Foreign Policy", "id": "10-continuities-changes-trade-offs-and-chal", "t": "10 · Continuities, changes, trade-offs and challenges", "x": "10 · Continuities, changes, trade-offs and challenges # Class + handout Strategic autonomy then and now (slide 15) Earlier approach Present approach Distance from rival blocs Engage several power centres Non-alignment Multi-alignment Limited partnerships Issue-based partnerships Political autonomy Economic + technology + security autonomy Example on the slide: Russian oil + Quad cooperation + BRICS membership. Key continuities Continuity Meaning Example (slide 16) Strategic autonomy Decide on national interest without permanent dependence on any bloc US + Russia ties National interest Security, development and sovereignty guide choices Russian crude Sovereignty and territorial integrity Independent decision-making; protect borders Opposition to CPEC through PoK Global South orientation Anti-colonial solidarity became development partnership, climate justice, institutional reform Voice of the Global South Dialogue and multilateralism Peaceful settlement; cooperation Ukraine diplomacy Neighbourhood centrality South Asia and the Indian Ocean stay vital Neighbourhood First Key changes (slide 17) Earlier pattern Emerging pattern Non-alignment Multi-alignment and issue-based partnerships Post-colonial leadership Global South leadership Continental focus Continental + maritime + technology Limited economic leverage Geoeconomics, DPI and supply-chain partnerships Cautious, defensive diplomacy Proactive diplomacy and minilateralism (G20, Quad, I2U2, BRICS, SCO, ISA, CDRI) Mainly an aid recipient Development partner and capacity builder Limited role in shaping rules Greater ambition to be a rule-shaper The handout’s warning: the shift is not from values to interests . India still follows its values but now has more economic, military and diplomatic capability to protect its interests. Examples on the slide: Quad, IMEC, DPI partnerships, G20 Presidency. Five trade-offs (slides 18-19) Trade-off What India must balance Example Strategic autonomy versus deeper alignment Needs US and Europe for technology, defence, investment and balancing China; wants independence and Russia ties. Sharper US-China and Russia-West rivalry makes it harder Quad + Russian oil China competition versus continued engagement Respond on LAC, Indian Ocean, neighbourhood, technology; keep trade and BRICS/SCO engagement; de-risk Competition: LAC. Cooperation: BRICS, SCO Neighbourhood sensitivity versus security assertion Protect security and answer instability and outside influence without looking overbearing to smaller neighbours Maldives, Nepal, Sri Lanka Global South leadership versus major-power partnerships Speaks for developing countries yet builds close ties with advanced economies. Credibility needs real development support, finance and capacity-building US, EU, Japan ties Principles versus hard national interest Supports peace, dialogue and sovereignty yet takes practical decisions on energy, defence and security Ukraine dialogue + Russian energy The handout stresses: a trade-off is two important interests pulling different ways and India balancing both. The challenges below are constraints, not trade-offs . Structural challenges (handout lists seven; slide 20 shows the first three) Challenge Content Institutional constraints UNSC, IMF and World Bank still reflect an older power structure; India seeks UNSC permanent membership Domestic capability Manufacturing, logistics, technology, defence capacity and resilience must support global ambitions External shocks COVID-19, Ukraine war, Red Sea disruptions (slide); wars, energy disruptions, crises, supply-chain shocks (handout) Disjointed neighbourhood South Asia is among the least integrated regions : low regional trade, connectivity gaps, political tension, weak regional institutions (handout only) Technology dependence Gaps in semiconductors, AI, advanced manufacturing and critical technologies (handout only) Diplomatic capacity Many engagements need a larger, more specialised diplomatic network (handout only) Global perception and credibility Growing ambition has to be balanced with development priorities and commitments on governance, climate, trade and norms (handout only) Key ideas in India’s foreign policy (slide 22) Keyword Meaning (and example) Strategic autonomy Independent choices; US + Russia ties Multi-alignment Engage many power centres; Quad + BRICS Issue-based alignment Different partners for different issues Vishwabandhu India as a reliable friend and bridge-builder Net security provider Regional (especially Indian Ocean) security role First responder Quick help in crises Neighbourhood First Priority to immediate neighbours (handout) Act East Deeper engagement with Southeast Asia and the Indo-Pacific (handout) Reformed multilateralism Reform UNSC and other institutions Global South leadership Represent developing-country concerns"}, {"c": "1", "n": "Introduction to World Geopolitics and India’s Foreign Policy", "id": "11-instruments-of-india-s-contemporary-fore", "t": "11 · Instruments of India’s contemporary foreign policy", "x": "11 · Instruments of India’s contemporary foreign policy # Handout only Source note Handout only (pages 19-21): no class slides for this part yet. The handout calls the approach The India Way : protecting national interests without joining a fixed bloc, and working with several powers across security, trade, technology, energy, connectivity and development. Geoeconomic and technology diplomacy Area India’s approach Energy security Diversify supply: West Asia, Russia, the US and renewable-energy partnerships Supply-chain resilience China+1, de-risking, friend-shoring, domestic capacity in critical sectors Critical minerals Partnerships for lithium, rare earths, strategic minerals Connectivity Chabahar, INSTC and IMEC as alternative trade routes Digital diplomacy Sharing DPI, UPI and digital public infrastructure Development partnership Lines of credit, grants, training, capacity-building The aim: turn India’s market size, technology and development experience into diplomatic influence. Security diplomacy and the China factor China affects India’s border security, neighbourhood, Indian Ocean strategy, supply chains and technology choices. India’s response mixes deterrence, de-risking, competition and selective engagement : LAC: stronger infrastructure and military preparedness. Indo-Pacific: support for a free, open, inclusive, rules-based order. Maritime partnerships: with the US, Japan, Australia, France and island states. BRI and CPEC: opposition where projects affect India’s sovereignty. Institutions: engage China in BRICS and SCO while also working through the Quad. Two “necklace” ideas Term Meaning Examples String of Pearls China’s network of ports, infrastructure projects and access points across the Indian Ocean region Gwadar (Pakistan), Hambantota (Sri Lanka), military base in Djibouti Diamond Necklace India’s strategy of maritime partnerships, logistics access and strategic cooperation across the Indian Ocean and Indo-Pacific Chabahar (Iran), Duqm (Oman), Sabang (Indonesia) Neighbourhood and Indian Ocean diplomacy Neighbourhood First , connectivity (road, rail, ports, waterways, energy, digital), First Responder help in disasters, managing China’s growing regional influence. In the Indian Ocean India seeks to be a net security provider : Maritime Domain Awareness, anti-piracy, HADR, coastal surveillance, capacity-building . SAGAR and MAHASAGAR link maritime security with shared growth. Minilateral and institutional diplomacy Platform Main role Quad Indo-Pacific, maritime security, technology, supply chains I2U2 Food, energy, investment, technology India-France-UAE trilateral Maritime, defence, energy BRICS / BRICS+ Global South voice and multipolarity SCO Eurasia, Central Asia, security dialogue G20 Development, debt, climate finance, DPI ISA / CDRI Renewable energy and climate resilience India uses minilateralism as a supplement, not a replacement , for multilateralism, and still backs reform in the UN, WTO and global financial institutions. Humanitarian, diaspora and soft-power diplomacy First responder in regional disasters; evacuation diplomacy: Operations Ganga, Kaveri, Ajay and Sindhu ; humanitarian aid (food, medicines, vaccines, relief); diaspora protection. Soft power: Yoga, Buddhism and Ayurveda; diaspora networks; democracy and pluralism; development partnerships; civilisational links. The handout adds that soft power works best when backed by delivery, credibility and development partnerships . Diplomatic terms to know: Vasudhaiva Kutumbakam, Voice of the Global South, Vishwabandhu, human-centric globalisation, Mission LiFE, reformed multilateralism ."}, {"c": "1", "n": "Introduction to World Geopolitics and India’s Foreign Policy", "id": "chapter-timeline", "t": "Timeline", "x": "Timeline # 1618-1648 Thirty Years’ War: shows the danger of fragmented authority 1648 Peace of Westphalia: sovereign state system, non-interference ★ Till 1914 Phase 1: balance of power; Schlieffen Plan; Archduke Franz Ferdinand’s assassination triggers World War I 1918 Wilson’s 14 Points ★ 1920 League of Nations ★ 1929 Great Depression: protectionism, authoritarian regimes 1931 League fails to stop Japan in Manchuria 1935 League fails to stop Italy in Abyssinia 1945 Hiroshima and Nagasaki; United Nations; Cold War begins ★ 1949 NATO formed 1955 Warsaw Pact 1961 NAM formally launched, Belgrade Summit ★ 1962 Cuban Missile Crisis; India-China war (security correction begins) 1965 India-Pakistan war 1968 NPT 1971 Indo-Soviet Treaty of Peace, Friendship and Cooperation; Bangladesh; USS Enterprise ★ 1972 Stockholm Conference 1973 Yom Kippur War 1974 Pokhran-I 1985 Schengen Agreement 1991 USSR collapses; India’s BoP crisis and LPG reforms ★ 1995 WTO established 1997 Kyoto Protocol 1998 Pokhran-II 2001 China joins WTO; Afghanistan invasion; 9/11 2003 Iraq invasion 2008 Global Financial Crisis: crisis of liberalism begins ★ 2010 China overtakes Japan as the second-largest economy 2013 Belt and Road Initiative 2014 BRICS New Development Bank 2015 Made in China 2025; Paris Agreement 2016 Brexit (about 52% vote to leave) 2018 US-China trade war 2020 Phase 6 begins (post-COVID) ★ 2022 Russia invades Ukraine; Operation Ganga 2023 Israel-Hamas conflict; AU joins G20; Operation Kaveri 2025 Fresh US tariffs; National Critical Mineral Mission; Operation Sindhu Feb 2026 Joint US-Israeli strikes on Iran"}, {"c": "1", "n": "Introduction to World Geopolitics and India’s Foreign Policy", "id": "traps", "t": "Traps", "x": "Traps # Common mix-ups and the rule for the exam hall Trap What goes wrong, and the rule Phase 5 end date Tables say 2008-2019; slide headings say “till 2020”. Rule: answer “2008 to 2019/20” and start Phase 6 in 2020. Westphalia is not the League Westphalia 1648 = sovereignty and non-interference. League 1920 = collective security. Rule: sovereignty links to 1648, collective security to 1920. Security dilemma versus balance of power The dilemma is the problem (arming for defence frightens others); BoP is the attempt to stop dominance. Rule: dilemma = cause of arms race; BoP = response. NAM date NAM was formally launched at Belgrade in 1961 , not at independence in 1947. Rule: 1961 and Belgrade together. 1971 is not “joining a bloc” The Treaty with the USSR is read as a security exception inside non-alignment, not an alliance. Rule: say “strategic partnership without formal alliance”. Strategic autonomy is not neutrality Multi-alignment means engaging several powers at once (Quad + BRICS + Russian oil), not staying away from all. Rule: autonomy = freedom of choice, not distance. Gujral Doctrine belongs to 1991-98 It is about neighbours: trust, non-reciprocity, respect for sovereignty. Rule: Gujral = neighbourhood, 1990s. Trade-off versus challenge The handout separates them: a trade-off balances two interests; a challenge is a constraint. Rule: “vs” rows are trade-offs; the rest are challenges. String of Pearls versus Diamond Necklace Pearls are China’s ports and access (Gwadar, Hambantota, Djibouti). Necklace is India’s partnerships (Chabahar, Duqm, Sabang). Rule: Pearls = China, Necklace = India. Pax Silica and Operation Ajay Named in the handout without explanation. Rule: do not invent details; check class notes."}, {"c": "1", "n": "Introduction to World Geopolitics and India’s Foreign Policy", "id": "connects", "t": "Connects to", "x": "Connects to # Chapter 2: Major Powers Phase 5 and 6 rivalry (US-China, Russia-West) is unpacked there with each power’s ambitions and instruments. Chapter 2: India-China Phase 5 gave BRI, CPEC, Gwadar, Hambantota; Chapter 2 gives the border, issue boxes and the way forward. Chapter 2: India-US The 1971 USS Enterprise episode here is the “strategic mistrust” row there. Chapter 2: India-Russia The 1971 Treaty here opens the India-Russia timeline there; Russian oil and S-400 are the trade-off examples. Syllabus: neighbourhood and groupings Determinants 3 and 8 and the “disjointed neighbourhood” challenge lead to “India and its neighbourhood”. Quad, BRICS, SCO, G20, I2U2 lead to “bilateral, regional and global groupings”. Syllabus: diaspora Determinant 9 and the evacuation operations lead to the syllabus line “Indian diaspora”. Syllabus: institutions UNSC, WTO Appellate Body, IMF and World Bank reform lead to “important international institutions, agencies and fora”. Syllabus: policies of other countries US tariffs, the 2026 sanctions Act, China’s rare-earth controls are the “effect of policies of developed and developing countries on India’s interests”."}, {"c": "1", "n": "Introduction to World Geopolitics and India’s Foreign Policy", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Six phases: to 1914 sovereign states and BoP; 1919-1945 liberal experiment and WWII; 1945-1991 two superpowers and deterrence; 1991-2008 US primacy; 2008-2019/20 crisis of liberalism; 2020 onwards fragmentation. Realism flow: anarchy → self-help → mistrust → security dilemma → arms race → balance of power. Westphalia 1648 = sovereignty and non-interference. Inter-war: 14 Points 1918, League 1920; Depression 1929; Manchuria 1931, Abyssinia 1935; Hiroshima 1945; MAD and deterrence. Cold War: UN 1945, NPT 1968, Stockholm 1972, Schengen 1985, Marshall Plan (about $13 bn) versus COMECON; NATO 1949, Warsaw Pact 1955, Cuban crisis 1962, Yom Kippur 1973; NAM Belgrade 1961; India-USSR Treaty 1971. Unipolar: USSR 1991; WTO 1995; China WTO 2001; Afghanistan 2001, Iraq 2003; Kyoto 1997; India LPG 1991 (GDP about $270 bn to about $1.2 tn by 2008). Crisis: GFC 2008; China No. 2 in 2010; Pivot to Asia; NDB 2014; BRI 2013; Made in China 2025; Brexit 2016 (52%); 2018 trade war. Phase 6: West Asia (Feb 2026 strikes on Iran), Ukraine 2022; competitive multilateralism; Graham Act 2026 (up to 100% tariff); weaponised interdependence; G20 Indonesia-India-Brazil-South Africa 2022-2025; AU in G20 2023; G4 and Ezulwini; UNSC veto, WTO AB. Essence: Rivalry → Strategic Realignment → Economic and Tech Fragmentation → Multipolarity → Institutional Paralysis. Ten determinants: economy, security, geography, strategic autonomy, energy, S&T, values, domestic politics, diaspora, climate. Six periods: 1947-62 non-alignment; 1962-71 security correction; 1971-91 assertion; 1991-98 opening (Gujral Doctrine); 1998-2014 diversified; 2014- multi-alignment. Five trade-offs: autonomy v alignment; China competition v engagement; neighbourhood v assertion; Global South v major powers; principles v interest. Seven challenges: institutions, capability, shocks, neighbourhood, technology, diplomacy, credibility. Instruments: geoeconomics and tech, security (String of Pearls v Diamond Necklace), neighbourhood and IOR (SAGAR, MAHASAGAR), minilateral, humanitarian (Ganga, Kaveri, Ajay, Sindhu), soft power."}, {"c": "1", "n": "Introduction to World Geopolitics and India’s Foreign Policy", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts below) Blank-page prompts Draw the six phases with one date each and the defining character of each. Write the Realism flow from memory, then the Phase 6 “Essence” chain. List the ten determinants, the six periods, five trade-offs and seven challenges. Write a 5-line opening for “Has India given up idealism?” using strategic autonomy."}, {"c": "1", "n": "Introduction to World Geopolitics and India’s Foreign Policy", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards Mains answer skeletons One for each Mains PYQ quoted in the material. Tap to open; try the answer first. Mains 2025 (10m, 150w): sovereign nationalism after waning globalisation Intro: the post-Cold War liberal order (WTO 1995, China 2001) has given way, since 2008, to globalisation that is “more selective, more political, more security-driven”. Waning globalisation: GFC 2008; protectionism; 2018 US-China trade war; COVID exposed supply-chain risks → reshoring, friend-shoring, de-risking. Sovereign nationalism: Brexit 2016 (sovereignty, immigration), Syrian refugee crisis, populist parties (America First, Brothers of Italy, National Rally, AfD), migration controls, techno-nationalism, security over market efficiency. Institutions weaken: UNSC veto, WTO Appellate Body paralysis → selective multilateralism. Counter-trend: interdependence continues; minilateral groupings and the Global South seek voice; India answers with Atmanirbhar Bharat plus multi-alignment. Closing: globalisation is not ending; it is being rewired by sovereignty and security. Mains 2020 (15m, 250w): Quad, from military alliance to trade bloc? Intro: the Quad (India, US, Japan, Australia) is a minilateral grouping for a free and open Indo-Pacific, not a treaty alliance. Test the claim: the notes give the Quad’s role as Indo-Pacific, maritime security, technology and supply chains. Trade bloc features are not named. Maritime side: Quad and Malabar strengthen maritime security and naval coordination. Economic and technology side: resilient supply chains and critical technologies (Chapter 2). India’s stance: avoids a formal anti-China military bloc; uses minilateralism as a supplement, not a replacement (Chapter 1). Closing: the Quad is a multi-issue minilateral; calling it a trade bloc overstates the shift. Mains 2019 (15m, 250w): has India stopped being a leader of the oppressed? Intro: in 1947-62 India stressed anti-colonialism, racial equality and support for newly independent states, and led NAM. What changed: post-colonial leadership → Global South leadership; aid recipient → development partner; rule-shaping ambition. Evidence of continuity: Voice of the Global South; G20 presidency 2023; AU’s permanent G20 seat (2023); CBDR and climate justice stance. Evidence of tension: the Global South v major-power trade-off (close ties with US, EU, Japan); credibility needs real finance and capacity-building; security turn after 1962. Verdict: the image has changed form (from moral leader to bridge power), not vanished. Closing: India now leads by delivery and by bridging, not by moral claim alone. Mains 2026 Q10 (10m, 150w): BRICS as counterweight and alternative Intro: BRICS grew from emerging economies’ demand for a bigger voice in global governance. Alternative finance: NDB (2014) alongside AIIB versus IMF/World Bank; talk of local currencies and alternative payments; Russia’s “BRICS Bridge” idea (Chapter 2). Voice and multipolarity: BRICS and BRICS+ project Global South voice; China uses BRICS, SCO, AIIB, BRI to expand influence. India’s use: works with China and Russia for a multipolar order; the 2026 New Delhi Declaration backed a Task Force on Growth and Development and a bigger NDB role (Chapter 2). Limits: groupings supplement, not replace, existing institutions; India-China divergences; Chinese influence may shape the platform. Closing: a counterweight in voice, not yet a replacement for the US-led system. Mains 2026 Q19 (15m, 250w): diaspora as living bridge and strategic leverage Intro: India has one of the world’s largest overseas communities, treated as a foreign-policy asset and a consular responsibility. Economic: remittances, investment, business and professional networks. Knowledge and technology links; in the US, Indians are about 1.5% of the population, pay over $300 bn in federal taxes, and Indian students are 82% STEM (Chapter 2). Cultural and soft power: Yoga, Buddhism, Ayurveda, diaspora networks, civilisational links. Critical view: leverage is limited by host-country politics (H-1B, student safety, extremism in some places); consular burden (Ganga 2022, Kaveri 2023, Sindhu 2025); soft power works only when backed by delivery and credibility. Closing: a bridge and an asset, but leverage depends on host-country goodwill and Indian delivery. Mains 2026 Q9 (10m, 150w): IPMDA between SAGAR and the Quad Intro: SAGAR/MAHASAGAR links maritime security with shared growth; the Quad is the collective Indo-Pacific strategy. (IPMDA is not covered in these notes; add its details after class.) SAGAR/MAHASAGAR: India as net security provider through Maritime Domain Awareness, anti-piracy, HADR, coastal surveillance, capacity-building. Quad: Indo-Pacific, maritime security, technology and supply chains. Bridge logic: Maritime Domain Awareness is the shared capability: it answers Chinese presence (ports, research vessels, naval reach) in the Indian Ocean. Critical angle: depends on partners’ capacity and on island states’ comfort (neighbourhood sensitivity v security assertion). Closing: IPMDA-type cooperation connects India’s regional role to the Quad, but delivery is the test."}, {"c": "2", "n": "Major Powers and Their Relationship with India", "id": "exam-lens-priority-and-pyqs", "t": "Exam lens: priority and PYQs", "x": "Exam lens: priority and PYQs # Source note This chapter has class slides and a handout. Class slides PPT-3 (37 slides) and handout Chapter 2, pages 1-24 (uploaded as “GS-2 International Relations - 3”). The slides are typed with no handwriting or board ink , so the teacher’s stress is read from the slides’ “Core idea” lines, headings and tables. Slides 1 and 37 carry no text (title and closing). The handout adds more than the slides: the full tables of ambitions and instruments, the Russia-West and US-China dimensions in detail, and the EU, France, Japan and Australia, which have no slides yet (labelled “Handout only”). The material quotes no Prelims PYQs ; its PYQ page lists ten Mains questions (2017 to 2026). Years listed are “years quoted”, not a count of distinct questions. What the teacher and handout stress Signal in the material Where Why it matters “ Core idea: Major powers shape the choices available to other countries. ” Responses: balancing, bandwagoning, strategic autonomy Slide 2 The frame for every “why does India do X?” answer. “ Core idea: The US is moving towards more interest-driven and transactional global leadership. ” “US power is not only military. It is also financial, institutional and technological.” Slide 7 Gives the US paragraph in any answer on US policy. “ Core idea: Technology has become a national-security issue. ” Slide 12 Links US-China rivalry to chips, AI, export controls. “ Core idea: It is not a complete new Cold War , because economic interdependence continues.” (US-China) Slide 13 Use it to test a “new Cold War” claim in a Mains question. “ Core idea: The world is not divided into two fixed blocs. Many states still follow strategic autonomy.” (Russia-West) Slide 15 Same use: test a “two blocs” claim. India follows strategic autonomy, multi-alignment, issue-based partnerships ; avoids permanent dependence on any one power Slide 16 The answer frame for the whole chapter. India-China is “ competition + interdependence + selective cooperation ”; the Three Mutuals close the topic Slides 17 and 23 A ready conclusion for any China answer. India-US: “ Partnership, not alliance ”; “ India seeks / India avoids ” table Slides 24 and 28 The most reusable table in the chapter. India-Russia: from a defence-and-energy anchor into a diversified partnership Slide 36 A ready conclusion for any Russia answer. PYQs quoted in the material (Mains only) Year, marks, words What was asked Answer or trap Where in this chapter Source Mains 2026 · 15 marks · 250 words China’s BRI “has transformed South Asia from a regional space into a theatre of great power competition.” Analyse the strategic implications of the BRI for India’s security and regional influence in South Asia. Open-ended. See the skeleton in Practice. Sections 5, 9 and 10 (CPEC, Gwadar, String of Pearls); BRI 2013 in Chapter 1 handout p. 24 (also slide 3 of PPT-1) Mains 2024 · 10 marks · 150 words “The West is fostering India as an alternative to reduce dependence on China’s supply chain and as a strategic ally to counter China’s political and economic dominance.” Explain with examples. Open-ended. See the skeleton in Practice. Sections 5, 13, 18 and 21 handout p. 24 Mains 2023 · 15 marks · 250 words “The expansion and strengthening of NATO and a stronger US-Europe strategic partnership works well for India.” What is your opinion? Give reasons and examples. Open-ended. “Agree in part”: test the claim. See the skeleton in Practice. Sections 6, 7, 12-15 and 18 handout p. 24 Mains 2021 · 15 marks · 250 words AUKUS is aimed at countering China’s ambitions in the Indo-Pacific. Is it going to supersede the existing partnerships in the region? Discuss its strength and impact. Open-ended. AUKUS is only named in these notes (a US minilateral grouping); see the skeleton and its thin-notes warning. Section 2 (US minilateral groupings); sections 5 and 13 handout p. 24 Mains 2020 · 15 marks · 250 words What is the significance of Indo-US defence deals over Indo-Russian defence deals? Discuss with reference to stability in the Indo-Pacific region. Open-ended. See the skeleton in Practice. Sections 13, 14 and 16 handout p. 24 Mains 2020 · 15 marks · 250 words “Quadrilateral Security Dialogue (Quad)” is transforming itself into a trade bloc from a military alliance, in present times — Discuss. Open-ended. Also quoted in Chapter 1. Sections 2, 13, 15, 20 and 21; Chapter 1 handout p. 24 Mains 2019 · 15 marks · 250 words “What introduces friction into the ties between India and the United States is that Washington is still unable to find for India a position in its global strategy, which would satisfy India’s national self-esteem and ambitions.” Explain with suitable examples. Open-ended. See the skeleton in Practice. Sections 12 and 14 handout p. 24 Mains 2019 · 10 marks · 150 words “The time has come for India and Japan to build a strong contemporary relationship, one involving global and strategic partnership that will have a great significance for Asia and the world as a whole.” Comment. Open-ended. See the skeleton in Practice. Section 20 handout p. 24 Mains 2018 · 15 marks · 250 words In what ways would the ongoing US-Iran Nuclear Pact Controversy affect the national interest of India? How should India respond? Open-ended. Thin notes: the US-Iran nuclear pact is not covered here; only Iran-linked pieces (Chabahar, INSTC, Iran sanctions) appear. Sections 2, 6 and 16 (partial) handout p. 24 Mains 2017 · 10 marks · 150 words “China is using its economic relations and positive trade surplus as tools to develop potential military power status in Asia.” In the light of this statement, discuss its impact on India as her neighbour. Open-ended. See the skeleton in Practice. Sections 3, 5, 9 and 10 handout p. 24 Mains years quoted: 2017, 2018, 2019 (two), 2020 (two), 2021, 2023, 2024, 2026. The 2026 BRI question and the 2020 Quad question are also quoted in Chapter 1. Prelims years quoted: none quoted in the material. Every question is a statement or a “discuss” type: test the claim, then answer with examples. What to prepare Prelims hooks: Bandwagoning (Belarus-Russia, Pakistan-China); Thucydides Trap and Power Transition Theory; Washington versus Beijing Consensus; Made in China 2025; “New Three” (EVs, lithium-ion batteries, solar PV); GDI, GSI, GCI; CSTO, EAEU, BRICS Bridge; 3,488 km India-China border and its three sectors (1,597, 545, 1,346 km); Panchsheel 1954; 1962; Doklam 2017; Galwan 2020; Depsang-Demchok October 2024; LEMOA 20
