ve democracy, executive accountability and federal cooperation. Strengthening it needs effective scrutiny, fair representation, political accountability and respect for constitutional institutions. Mplads (members OF Parliament Local AREA Development Scheme) Key features Launched in 1993 under the P. V. Narasimha Rao government so MPs can recommend local development works based on their constituencies’ needs. Nodal ministry: Ministry of Statistics and Programme Implementation (MoSPI). Allocation: Rs 5 crore per MP per year Funds are non-lapsable and unspent balances carry forward Nature of work: durable community assets in drinking water, sanitation, education, health and roads. Implementation: MPs recommend The District Authority sanctions and implements through eligible agencies COVID-19: suspended for 2020-21 and initially for 2021-22, then restored during 2021-22. Area of operation Lok Sabha MP: within their own constituency. Rajya Sabha MP: any district in the State they represent. Nominated MP: any district or districts in one State chosen by the MP. Restrictions: funds cannot ordinarily be used for religious buildings, routine maintenance of official buildings or assets named after individuals, subject to guidelines. Audit: Chartered Accountants, Local Fund Auditors or Statutory Auditors, on the Accountant General’s recommendation. Criticism of MPLADS Separation of powers: legislators influence executive work by choosing projects. Federalism: health, sanitation and roads largely fall under State and local governments. Corruption and misuse: reports of diversion of funds, irregular sanctioning and delays. Non-lapsable funds: may encourage hoarding and spending near elections. Poor utilisation (unspent amounts): 14th Lok Sabha Rs 176 crore 15th Rs 551 crore 16th Rs 1,734 crore Weak asset maintenance: focus on creating assets, not maintaining them. Unequal distribution: overlapping recommendations from Lok Sabha, Rajya Sabha and nominated MPs can leave districts unequal. Weakening local bodies: projects ideally belong to Panchayats and Municipalities, which already lack funds. Body / case View on MPLADS NCRWC (2002) Recommended discontinuing it, citing federalism and distribution of powers Second ARC Recommended abolishing it, saying it weakens separation of powers between legislature and executive Election Commission of India Opposes it because it gives sitting MPs an unfair advantage, disturbing the level playing field Parliamentary Committee on MPLADS Supported continuing the scheme with procedural reforms, including changing its name Bhim Singh v. Union of India (2010) A five-judge bench upheld its constitutionality: MPs have only a recommendatory role, and district and local authorities sanction and implement, so it does not violate separation of powers Way forward: stronger monitoring to stop diversion and ensure timely completion; better coordination to avoid duplication and unequal spread; more involvement of Panchayats and Municipalities; accountability through better utilisation, independent audits, asset maintenance and transparency. Parliament IS Supreme BUT NOT Sovereign Why Parliament is supreme Highest legislative body at the Union level Legislates on Union and Concurrent List subjects Residuary powers (Article 248): exclusive power on subjects in no list. Constitutional amendment (Article 368), though some amendments need State ratification. Control over the executive: the Council of Ministers is collectively responsible to the Lok Sabha (Article 75), which can remove the government by no-confidence. Authority over judicial structure: can raise the number of Supreme Court judges (Article 124) and create tribunals, within limits. Financial supremacy: Controls Union taxation and spending No money leaves the Consolidated Fund without its authority Impeachment and removal powers: can impeach the President and remove judges of the Supreme Court and High Courts. Why it is not sovereign Constitutional supremacy: Parliament gets its powers from the Constitution and must act within it. Judicial review: courts can strike down laws that violate the Constitution. Basic Structure doctrine: Parliament cannot destroy the basic structure (Kesavananda Bharati, 1973). Federal structure: cannot ordinarily legislate on State List subjects except in constitutionally specified conditions. Fundamental Rights: laws must respect them and other constitutional limits. Way forward / key point Conclusion: the Indian Parliament is supreme in its law-making and in holding the executive to account at the Union level, but not sovereign, because the Constitution is supreme. Unlike the British Parliament, its powers are limited by the Constitution."}, {"c": "16", "n": "Speaker, Privileges, Bicameralism and Functioning of Parliament", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Speaker presides over joint sittings under Article 108 Quorum of the Lok Sabha One-tenth of total membership Money Bill certification Article 110(3): Speaker’s decision final, but reviewable (Rojer Mathew 2019) Speaker’s anti-defection decisions are Subject to judicial review (Kihoto Hollohan 1992) Speaker’s vote Casting vote only on a tie (Article 100) Notice for removing the Speaker 14 days, effective majority Speaker’s rank in Table of Precedence 7th, with the Chief Justice of India First Indian Speaker-type precedent for neutrality Vithalbhai Patel (1925) Committee on Presiding Officers’ neutrality (1967) V. S. Page Committee Articles on privileges: Parliament / State legislatures 105 / 194 Do privileges extend to the President? No Freedom from civil arrest period During sessions and 40 days before and after Does it apply to criminal arrest? No Article protecting substantially true reports of proceedings Article 361A Article barring courts from questioning proceedings Article 122 (procedural irregularity only) Cash-for-Query case Raja Ram Pal v. Speaker, 2007 Case that overruled P. V. Narasimha Rao (1998) Sita Soren v. Union of India, 2024 (seven judges) Which body examines breach of privilege? Committee of Privileges Article for Parliament’s composition Article 79 Rajya Sabha size Maximum 250; now 245 including 12 nominated Rajya Sabha election system PR by Single Transferable Vote; 6-year term, one-third retire every 2 years Rajya Sabha time for Money Bill 14 days to recommend Can a no-confidence motion be moved in RS? No Article 249 vote Two-thirds present and voting; valid 1 year Article 312 Creation of All-India Services by RS resolution Removal of Vice-President starts in Rajya Sabha (Article 67) Domicile requirement removed in 2003 Number of joint sittings held Three (per handout); example POTA Bill 2002 Women MPs in 17th / 18th Lok Sabha 78 (about 14%) / 74 (about 14%) Women’s reservation Act of 2023 Nari Shakti Vandan Adhiniyam, 106th Amendment Articles inserted by it 330A, 332A, 334A (and 239AA amended) Does it apply to Rajya Sabha? No Duration of reservation 15 years, subject to Parliament When does it take effect? After Census figures and delimitation 131st Bill introduced / outcome 16 April 2026 / defeated in Lok Sabha on 17 April 2026 (verify) Proposed Lok Sabha maximum 850 (815 States + 35 UTs) Why South worries about delimitation Slower population growth would reduce its share of seats Minimum sittings proposed 120 days Lok Sabha, 100 days Rajya Sabha MPs with declared criminal cases: 17th / 18th Lok Sabha 233 (43%) / 251 (46%), of which 170 (31%) serious Article on MPs’ salaries Article 106 (1954 Act) MPLADS started / by whom 1993, P. V. Narasimha Rao government MPLADS allocation Rs 5 crore per MP per year, non-lapsable Nodal ministry for MPLADS MoSPI Case that upheld MPLADS Bhim Singh v. Union of India, 2010 (five judges) Bodies that wanted MPLADS ended NCRWC 2002, Second ARC, Election Commission Why Parliament is not sovereign Constitution is supreme: judicial review, basic structure, federalism, Fundamental Rights"}, {"c": "16", "n": "Speaker, Privileges, Bicameralism and Functioning of Parliament", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts in Start Here)"}, {"c": "16", "n": "Speaker, Privileges, Bicameralism and Functioning of Parliament", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards"}, {"c": "17", "n": "Federalism and Centre-State Legislative and Administrative Relations", "id": "1-federalism-in-india-features-debate-evol", "t": "1 · Federalism IN India · Features · Debate · Evolution · Forms OF Federalism", "x": "1 · Federalism IN India · Features · Debate · Evolution · Forms OF Federalism # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Centre State Relations handout pp. 3-7. Prelims PYQs quoted: none quoted in the material. In simple words Federalism means powers are divided by the Constitution between the Centre and the States, and neither can take the other's share away at will. India is a \"holding together\" federation: a large country that gave power to regions to keep unity. It has real federal features and strong unitary features, so scholars call it quasi-federal, cooperative or sui generis. In practice it has moved through centralised, regional, judicially corrected, coalition and cooperative-competitive phases. WHAT IS Federalism? Meaning Federalism is a political system in which powers are constitutionally divided between a Central Government and regional governments. Both levels get their authority from the Constitution and use power within their own spheres. Merely having regional governments does not make a system federal. A system is truly federal when regional governments have constitutionally guaranteed powers that the Centre cannot take away at will . Basis Coming Together Federation Holding Together Federation Origin Independent political units unite to form a federation A larger political entity distributes power among regional units Objective Mutual security and common interests Accommodate regional diversity while keeping national unity Distribution of powers Constituent units generally enjoy stronger constitutional autonomy The Centre generally enjoys greater powers Examples USA, Switzerland, Australia India, Spain, Belgium Value addition India's position: India follows the holding together model, combining regional autonomy with a strong constitutional Union. Federal Features OF THE Indian Constitution Despite the strong Centre, several provisions make India a federation: 1. Dual polity: the Constitution sets up Union and State governments, each with constitutionally assigned powers. States are not merely administrative agents of the Union. 2. Written Constitution: clearly defines the powers, functions and limits of both levels. 3. Division of powers: the Seventh Schedule distributes subjects among the Union List, State List and Concurrent List. 4. Supremacy of the Constitution: Both Union and State governments must act within it Neither has unlimited legislative power 5. Rigid amendment procedure: under Article 368, amendments touching specified federal provisions need ratification by at least half of the State Legislatures. 6. Independent judiciary: the Supreme Court settles constitutional disputes between Union and States under Article 131 , subject to constitutional conditions. 7. Bicameralism: the Rajya Sabha represents States and Union Territories in Parliament and has special powers under Articles 249 and 312. Unitary Features OF THE Indian Constitution The Constitution also gives the Centre a dominant position: 1. Strong Centre: the Union List holds subjects of national importance, and Parliament has residuary powers under Article 248. 2. Single Constitution and single citizenship (no separate State constitutions or State citizenship, unlike some federations). 3. Parliament's power over States (Article 3): Parliament can alter State boundaries, names and areas without the concerned State's consent. 4. Union supremacy over the Concurrent List (Article 254): a Union law ordinarily prevails over a conflicting State law, subject to exceptions. 5. Emergency provisions: in a National Emergency (Article 352) the Union gets extra legislative and executive powers over States. 6. President's Rule (Article 356): the Union can take over State administration when constitutional machinery fails, subject to parliamentary and judicial safeguards. 7. Governor's office: Appointed by the President (Article 155) May reserve State Bills for the President under Article 200 8. Integrated institutions: a single judiciary, All-India Services, Election Commission and CAG give uniformity across the country. 9. Fiscal centralisation: the Union controls important revenue sources while States depend on tax devolution and Central grants. Note Why these centralising features? They were designed to protect national unity, administrative coordination and constitutional stability, especially during political or security crises (the Constituent Assembly was working in the shadow of Partition). Nature OF Indian Federalism: THE Debate Views of scholars K. C. Wheare: \"quasi-federal\". He described India's Constitution as federal in structure but with a strong unitary bias. Granville Austin: \"cooperative federalism\". He stressed that the Centre and States must work together to reach national development and constitutional goals. Sui generis means \"of its own kind\". India's federal system does not fit fully into the traditional federal or unitary models. It combines constitutional autonomy for States with a Centre strong enough to keep national unity. \"India has a federal Constitution but a strong-Centre government\" — arguments for the statement: Constitutional centralisation: residuary powers, emergency provisions and Union supremacy on the Concurrent List favour the Centre. Political centralisation: national parties and centralised party leadership can reduce State governments' autonomy. Financial dependence: States rely heavily on Central transfers and Centrally Sponsored Schemes. Administrative control: Governors, All-India Services and Union directions can strengthen Central influence over State administration. Counterarguments Constitutional autonomy: States have independent legislative and executive powers in their own sphere. Judicial protection: in S. R. Bommai (1994) the Supreme Court recognised federalism as part of the Basic Structure and restricted arbitrary use of Article 356. Regional political assertion: regional parties and coalition politics have raised the bargaining power of States. Shared institutions: the GST Council, Finance Commission and Inter-State Council provide ways to cooperate and negotiate. Way forward / key point Conclusion: India is neither purely federal nor purely unitary. It is a federal system with a strong Centre, designed to combine national integration with regional autonomy. Evolution OF Indian Federalism Indian federalism has never been static. Its working has changed with political developments, economic reforms, regional movements and court decisions. 1950-1967: Centralised federalism One-party dominance: Congress governed the Centre and most States, so there was little political confrontation. Planning Commission (1950): centralised planning and resource allocation strengthened Union influence. Article 356 was used against State governments, including the Communist government in Kerala in 1959 . Nature: the Centre dominated; States had limited bargaining power. 1967-1980: Regionalism and friction 1967 elections: non-Congress governments came to power in several States. Regional parties such as the DMK grew and demanded autonomy. The Rajamannar Committee (1969) was set up by the Tamil Nadu government to study Centre-State relations. The Emergency (1975-77) showed how far the Constitution can centralise power. Nature: the old consensus weakened and State autonomy became a major demand. 1980s-1990s: Assertive States, judicial correction Regional movements in Punjab, Assam, Andhra Pradesh and other States. The Sarkaria Commission (1983) recommended more consultation, restraint in using Article 356 and stronger cooperative institutions. In S. R. Bommai (1994) the Supreme Court made President's Rule subject to judicial review and affirmed federalism as basic structure. Nature: States became more assertive and the judiciary built safeguards against arbitrary central intervention. 1990s-2014: Coalitions and economic federalism Coalition governments: regional parties became partners at the Union level and gained bargaining power. 1991 liberalisation: States began competing for investment and shaping their own economic development. 73rd and 74th Amendments (1992) strengthened Panchayats and Municipalities. The Inter-State Council (1990) was set up on the Sarkaria Commission's advice. Nature: political bargaining and economic competition increased the role of States. 2014 onwards: Cooperative and competitive federalism NITI Aayog (2015) replaced the Planning Commission. GST Council (2017) enabled shared decisions on indirect taxes under Article 279A. States compete for investment and governance rankings. Fiscal tensions continue over GST compensation, cesses, surcharges and Centrally Sponsored Schemes. After 2024, greater dependence on coalition partners at the Union level has renewed the relevance of regional bargaining. Nature: cooperation, competition and bargaining together, while the Centre's constitutional position stays strong. Different Forms OF Indian Federalism India's federalism does not follow a single model. Several overlapping forms describe how it works. 1. Asymmetric federalism Meaning: different States or regions have different constitutional arrangements to suit their history, geography and culture. Special provisions: Articles 371 to 371J give special arrangements for certain States. The Sixth Schedule gives autonomous arrangements for specified tribal areas in the North-East. Significance: it accommodates regional diversity without weakening national unity (details in the Inter-State chapter). 2. Bargaining federalism (associated with W. H. Morris-Jones) Meaning: continuous negotiation between the Centre and States over resources, powers and policies. Political bargaining: regional parties negotiate with the Union on policy priorities and State-specific demands. Fiscal bargaining: States seek greater tax devolution, grants and financial flexibility. Institutional bargaining: Earlier through the Planning Commission and National Development Council Today through the GST Council and other forums Significance: it lets States influence national decisions, but too much political bargaining can weaken consistent policymaking. 3. Cooperative federalism Meaning: collaboration and partnership between the Centre and States to reach common national goals. Mechanisms: GST Council (shared decisions on GST) NITI Aayog Governing Council (PM and Chief Ministers consult) Finance Commission (recommends financial transfers) Inter-State Council (coordination) Joint implementation of programmes such as MGNREGA and the Right to Education Act It works best when institutions create space for dialogue, fiscal transfers reduce dependence, and legislation shares responsibility. Challenges: Strong Union powers limit State autonomy Different parties ruling at the Centre and States can sharpen confrontation Coordination bodies meet rarely and have little authority Conditional grants reduce States' freedom to set priorities Centralised party leadership can influence State decisions 4. Competitive federalism Meaning: States compete to attract investment, resources and economic opportunity by improving governance and infrastructure. Instruments: Ease of Doing Business reforms NITI Aayog indices (State Health Index, School Education Quality Index, SDG India Index, India Innovation Index) Investment summits such as Vibrant Gujarat and Magnetic Maharashtra Significance: encourages policy innovation and administrative efficiency, better infrastructure and service delivery, and helps States respond to globalisation. Challenges: Poorer States lack resources to compete with developed States Investment concentrates in already developed regions Excess rivalry can weaken cooperation and create regional tensions Way forward: competitive federalism should work within a framework of cooperative federalism, with adequate support for economically weaker States. 5. Conflictual federalism Meaning: prolonged disputes between the Centre and States over constitutional powers, financial resources or administrative authority. Areas of conflict: Legislative (Union intervention in State subjects, Concurrent List laws) Administrative (Governor's office, CBI jurisdiction, Central forces, All-India Services) Financial (tax devolution, GST compensation, borrowing limits, conditional grants) Inter-State (river waters, boundaries, resources) Significance: some disagreement is normal in a working federation, but prolonged confrontation weakens institutional trust and governance. Way forward / key point Overall understanding: cooperation, competition, bargaining and conflict are not mutually exclusive. They exist together in Indian federalism. The challenge is to make sure political disagreements do not undermine constitutional autonomy and cooperative governance."}, {"c": "17", "n": "Federalism and Centre-State Legislative and Administrative Relations", "id": "2-centre-state-legislative-relations-lists", "t": "2 · Centre-state Legislative Relations · Lists · Residuary · 42nd Amendment · Doctrines", "x": "2 · Centre-state Legislative Relations · Lists · Residuary · 42nd Amendment · Doctrines # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Centre State Relations handout pp. 7-9. Prelims PYQs quoted: none quoted in the material. In simple words Legislative power is divided by territory (Article 245) and by subject (Article 246, Seventh Schedule). The Union List beats the State List; on the Concurrent List the Union law prevails in a clash. Residuary powers go to Parliament. The 42nd Amendment moved five subjects to the Concurrent List. When Union and State laws overlap, courts use doctrines such as pith and substance, colourable legislation, harmonious construction, federal supremacy and ancillary powers. Distribution OF Legislative Powers The Constitution distributes legislative power on two bases. 1. Territorial jurisdiction (Article 245). Parliament can make laws for the whole or any part of India . A State Legislature can make laws for the whole or any part of the State . A law made by Parliament is not invalid merely because it operates outside India (extra-territorial operation). Doctrine of Territorial Nexus: a State law may affect persons, property or activities outside the State if there is a real and sufficient connection between the State and the subject of the law. Case: State of Bihar v. Charusila Dasi (1959) upheld the application of State legislation where a sufficient territorial connection existed. Key distinction: Parliament has wider territorial authority State legislation ordinarily operates within the State, subject to territorial nexus 2. Distribution of subjects (Article 246). The Seventh Schedule divides subjects into three lists. Union List (List I) State List (List II) Concurrent List (List III) Parliament has exclusive legislative authority State Legislatures ordinarily have exclusive authority Both Parliament and State Legislatures can make laws Subjects of national importance Subjects of regional and local importance Subjects needing national uniformity and regional flexibility Defence, foreign affairs, banking, currency, atomic energy Police, public order, public health, agriculture, prisons Education, forests, criminal law, marriage, electricity Constitutional position The Union List prevails where legislative fields overlap and cannot be reconciled. Parliament may legislate on State List subjects for Union Territories (Article 246(4)). On the Concurrent List, under Article 254 a Union law ordinarily prevails over a conflicting State law, subject to constitutional exceptions. Residuary Powers (article 248) Residuary subjects are matters not listed in the Union, State or Concurrent Lists. Parliament has exclusive authority to legislate on them, including residuary taxation powers . This is an important centralising feature of Indian federalism. Contrast with the USA: there, undelegated powers generally remain with the States or the people. Transfer OF Subjects TO THE Concurrent LIST The 42nd Constitutional Amendment Act, 1976 moved five subjects from the State List to the Concurrent List: 1. Education 2. Forests 3. Weights and Measures 4. Protection of Wild Animals and Birds 5. Administration of Justice , including the constitution and organisation of courts other than the Supreme Court and High Courts Memory aid · EFWWA E ducation · F orests · W eights and measures · W ild animals and birds · A dministration of justice (own mnemonic) Rationale for the transfer Concerns National uniformity: common standards in education, justice and weights and measures Erosion of State autonomy: States lost exclusive legislative authority over important subjects Cross-border issues: forests and wildlife need coordinated national policy Union supremacy: conflicting Central legislation may override State laws under Article 254 Cooperative legislation: both Centre and States can legislate to meet national and local needs Loss of local responsiveness: national policy may not reflect regional languages, resources and needs Inadequate consultation: the transfer happened during the Emergency (1975-77) , raising concern about unilateral centralisation Value addition Sarkaria and Punchhi Commissions: stressed consulting States before Parliament legislates on Concurrent List subjects. Principles OF Interpretation OF Legislative Powers Disputes arise when a Union law and a State law seem to cover the same subject. Courts use several doctrines to decide validity. 1. Doctrine of Pith and Substance Meaning: courts look at the true nature and main purpose of a law, not its incidental effects. A law is not automatically invalid just because it incidentally enters another legislature's field. If its pith and substance is within the legislature's competence, incidental encroachment can be allowed. Case: State of Bombay v. F. N. Balsara (1951) upheld major provisions of the Bombay Prohibition Act despite incidental overlap with Union subjects. 2. Doctrine of Colourable Legislation Meaning: what cannot be done directly cannot be done indirectly. It stops a legislature from indirectly using a power the Constitution does not give it. Courts look at the substance of the law, not just its title or form. Case: K. C. Gajapati Narayan Deo v. State of Orissa (1953) explained the doctrine in relation to legislative competence. 3. Doctrine of Harmonious Construction Meaning: entries in different lists should be read together so that each has meaning. Courts try to reconcile apparently conflicting entries One entry should not needlessly make another redundant Case: Calcutta Gas Company v. State of West Bengal (1962) applied harmonious interpretation to overlapping entries. 4. Principle of Federal Supremacy Meaning: where entries genuinely conflict and cannot be reconciled, the Union List prevails over the State List . This follows the scheme of Article 246. On Concurrent List subjects, conflicts between valid Union and State laws are governed by Article 254 . Significance: protects national legislative priorities, but limits State autonomy. 5. Doctrine of Ancillary Powers Meaning: the power to legislate on a subject includes powers reasonably necessary to make the law effective. Example: the power to impose a tax ordinarily includes the power to lay down its assessment, collection and prevention of evasion. 6. Limits on delegated legislation Parliament and State Legislatures may delegate detailed rule-making to the executive. But essential legislative functions , especially deciding legislative policy, cannot be delegated completely. Significance: stops legislatures from surrendering their core lawmaking job to the executive. Note How to remember the order: Pith and substance (what is it really about?) → Colourable legislation (is it a disguise?) → Harmonious construction (can the entries live together?) → Federal supremacy (if not, Union List wins) → Ancillary powers (what comes with the power?)."}, {"c": "17", "n": "Federalism and Centre-State Legislative and Administrative Relations", "id": "3-parliament-on-state-list-repugnancy-art", "t": "3 · Parliament ON State LIST · Repugnancy (Art 254) · Model LAWS · FARM LAWS · Assent TO Bills", "x": "3 · Parliament ON State LIST · Repugnancy (Art 254) · Model LAWS · FARM LAWS · Assent TO Bills # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Centre State Relations handout pp. 9-13. Prelims PYQs quoted: none quoted in the material. In simple words Parliament can legislate on State List subjects in specific cases: Rajya Sabha resolution (249), National Emergency (250), request by States (252), treaties (253), Union Territories and President's Rule. Article 254 settles repugnancy on the Concurrent List. Model laws, the Farm Laws 2020 and the Governor's delay in giving assent (Tamil Nadu 2025 and the November 2025 Presidential Reference) show where federal friction lies. Parliament's Power TO Legislate ON State LIST Subjects Although the State List is normally for State Legislatures, the Constitution lets Parliament legislate on State subjects in specified circumstances. Article 249: Legislation in the national interest The Rajya Sabha may authorise Parliament to legislate on a State List subject in the national interest. It needs a resolution backed by not less than two-thirds of members present and voting . The resolution stays valid for a maximum of one year and can be renewed for one year at a time. A law made this way ceases to operate six months after the resolution expires, except for things already done. Federal significance: the Rajya Sabha, which represents States, enables temporary Union legislation on matters normally reserved to States. GST: Article 249 also allows such a resolution on Goods and Services Tax under Article 246A. Article 250: During a National Emergency Parliament can legislate on State List subjects while a National Emergency (Article 352) is in force. Laws made this way cease to operate six months after the Emergency ends, subject to protection of past actions. Rationale: coordinated national action in extraordinary circumstances. Article 251: Inconsistency between Union and State laws under Articles 249 and 250 State Legislatures do not lose their legislative powers when Parliament legislates under Article 249 or 250. But if the State law and the Union law conflict, the Union law prevails . The conflicting State law is inoperative only while the parliamentary law continues to have effect. Article 252: At the request of States Two or more States may request Parliament to legislate on a State List subject. The State Legislatures must pass resolutions (in a bicameral State, both Houses must approve). Parliament may then make a law applying to those States. Other States can adopt it by passing similar resolutions. Once made, the law can be amended or repealed only by Parliament , not by the State Legislature. Example: the Water (Prevention and Control of Pollution) Act, 1974 was made using Article 252. Federal significance: States can seek common legislation without permanently moving the whole subject to the Union List. Article 253: Implementing international agreements Parliament can make laws to implement international treaties and agreements , conventions with foreign countries , and decisions of international conferences and organisations . This power extends even to matters in the State List . Federal concern: international agreements increasingly affect agriculture, environment, health, education and development, which are State responsibilities. Punchhi Commission: recommended more State involvement in treaty negotiations where agreements directly affect State List subjects. Other circumstances Union Territories (Article 246(4)): Parliament can legislate on State List subjects for territories not part of a State. President's Rule (Article 356): Parliament may exercise the State Legislature's legislative powers when authorised during President's Rule. Memory aid · EMERGENCY-REQUEST-TREATY Art 249 RS resolution · 250 Emergency · 251 inconsistency (Union wins) · 252 States request · 253 treaties. Numbers run in order, so just remember what each one is for. (own mnemonic) Repugnancy Between Union AND State LAWS (article 254) Repugnancy arises when a valid State law conflicts with a valid parliamentary law on a Concurrent List subject. Article 254(1): general rule. If a State law conflicts with a Central law, the Central law prevails and the State law is void to the extent of the inconsistency . The rule applies whether the parliamentary law was made before or after the State law. Article 254(2): exception through Presidential assent. A State law on a Concurrent List subject can prevail within that State , even if it conflicts with an earlier parliamentary law, provided the State Bill was reserved for the President's consideration and got Presidential assent . But Parliament can later amend, vary or repeal the State law or make a conflicting law on the same matter. Federal significance: Article 254(2) gives States limited flexibility to adopt laws suited to local needs. How courts decide repugnancy Mere differences in wording or approach do not automatically show repugnancy. Courts ask: do the two laws contain directly conflicting provisions ? Would obeying one mean violating the other ? Did Parliament intend to occupy the entire field ? Significance: avoids needless invalidation of State laws while respecting constitutional supremacy. Other Instruments OF Legislative Relations Model laws on State subjects What: draft laws prepared by the Union Government for States to adopt, modify or reject voluntarily . They promote common standards without Parliament legislating directly on State List subjects. Examples: Model Agricultural Land Leasing Act, 2016 (leasing reforms) Model Agricultural Produce and Livestock Marketing Act, 2017 (market reforms) Model Tenancy Act, 2021 (tenancy regulation and disputes) Model Prisons and Correctional Services Act, 2023 (prison reforms) Advantages: National uniformity while preserving State autonomy States can adapt reforms to local conditions Promotes cooperative federalism and policy innovation Concerns: Uneven adoption across States Central funding incentives may indirectly steer State choices Model laws can become a tool of \"soft centralisation\" if States are not truly consulted Case study: the Farm Laws, 2020 The three Farm Laws became a major controversy over how legislative powers are divided. Constitutional position: State List Entry 14 ( agriculture ) State List Entry 28 ( markets and fairs ) Concurrent List Entry 33 ( trade and commerce in specified goods, including foodstuffs) Union's argument: Parliament could legislate under Entry 33 of the Concurrent List on trade and commerce in foodstuffs. States' objections: (1) legislative encroachment, as agricultural markets ordinarily fall in State jurisdiction (2) loss of APMC revenue, as trade outside regulated mandis could cut State market fees (3) fear for MSP , as farmers feared marketing changes could gradually weaken procurement (the laws did not abolish MSP) (4) inadequate consultation State response: Punjab and some other States passed legislation to modify the operation of the Central laws in their territory, raising questions under Article 254 . Outcome: the three laws were repealed in 2021 after sustained protests. The Supreme Court did not finally decide their legislative constitutionality. Federal lesson: reforms touching State responsibilities need consultation, consensus and constitutional clarity, even if Parliament has a plausible source of competence. Reservation OF State Bills AND Assent (articles 200 AND 201) Article 200: when a Bill passed by the State Legislature is presented to the Governor, he may 1. Grant assent. 2. Withhold assent , with the constitutional procedure of returning a non-Money Bill for reconsideration. 3. Reserve the Bill for the President's consideration. The Governor must reserve a Bill if it would so reduce the powers of the High Court as to endanger the position the Constitution gives it. Article 201: the President may grant or withhold assent to a reserved Bill and may direct reconsideration of a non-Money Bill. Federal concern: delay in giving assent or reserving Bills can block State legislation and create uncertainty over the powers of elected State governments. Supreme Court developments on assent 1. Tamil Nadu Governor case (April 2025). A two-judge Bench examined the Governor's long delay in acting on Bills passed by the Tamil Nadu Legislature. It held that the Governor cannot indefinitely withhold assent or use inaction to obstruct legislation (no pocket veto or absolute veto) It set specific time limits for the Governor and President to act under Articles 200 and 201 And using Article 142 it declared 10 Bills deemed assented , finding the Governor's actions unconstitutional 2. 16th Presidential Reference (November 2025). A five-judge Constitution Bench , in advisory jurisdiction under Article 143 , clarified the position: (a) three options under Article 200 (assent; withhold and return a non-Money Bill with comments; reserve for the President) and the Governor has discretion to choose among them (b) no judicial timelines : courts cannot fix deadlines, as the Constitution gives none (c) no deemed assent : courts cannot use Article 142 for it, as that would replace a constitutional function and breach separation of powers (d) limited judicial intervention : in prolonged, unexplained and indefinite inaction, courts may issue a limited mandamus to act within a reasonable time, without dictating the decision (e) limited justiciability : decisions under Articles 200 and 201 cannot ordinarily be challenged on merits before the Bill becomes law Effect on the Tamil Nadu judgment The November 2025 opinion did not formally set aside the specific relief given to Tamil Nadu in April 2025: the 10 Bills kept their legal validity . But the larger Bench's reading superseded the earlier reasoning on judicially imposed timelines and deemed assent, which can no longer be treated as binding precedent. Constitutional significance: the Court tried to balance State legislative autonomy, gubernatorial discretion, separation of powers and judicial oversight, while making clear that indefinite inaction is not constitutionally acceptable . (current affairs; verify) Commission Recommendations ON Legislative Relations Sarkaria Commission (1983-88) Strong Centre without over-centralisation: it accepted the need for a strong Union but warned against excessive interference in State autonomy. Concurrent List: the Centre should legislate only where national uniformity is necessary, after consulting States. Residuary powers: Keep residuary taxation powers with the Union Place other residuary matters in the Concurrent List Article 249: It opposed deleting or amending Article 249, as existing safeguards were enough Suggested procedural safeguards in the Rajya Sabha to build consensus Reservation of Bills: the Governor should behave like constitutional machinery, and the Centre should decide on a Bill reserved for the President within four months . Other measures: Liberal use of Article 254(2) for State-specific laws Framework legislation by the Union on Concurrent List subjects, leaving details to States Pre-legislative consultation through the Inter-State Council and sectoral forums Stronger parliamentary committee scrutiny of laws raising federal questions Way forward 1. Respect legislative autonomy: Parliament should avoid needless intervention in State List subjects. 2. Strengthen consultation: consult States before laws on Concurrent List subjects and international agreements. 3. Reform assent procedures: more transparency and accountability in handling State Bills. 4. Strengthen the Rajya Sabha: give more attention to State interests. 5. Encourage model laws: voluntary, adaptable model legislation where coordination is needed without binding uniformity. 6. Promote cooperative federalism: use the Inter-State Council, GST Council and other forums to settle legislative disagreements through dialogue. Way forward / key point Conclusion: Centre-State legislative relations combine State autonomy with a strong Union framework. This keeps national unity, but excessive centralisation weakens federal trust. The way forward is constitutional restraint, meaningful consultation and respect for State legislative powers."}, {"c": "17", "n": "Federalism and Centre-State Legislative and Administrative Relations", "id": "4-centre-state-administrative-relations-di", "t": "4 · Centre-state Administrative Relations · Directions · AIS · Councils · BSF · Commissions", "x": "4 · Centre-state Administrative Relations · Directions · AIS · Councils · BSF · Commissions # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Centre State Relations handout pp. 13-18. Prelims PYQs quoted: none quoted in the material. In simple words Executive power follows legislative power. The Union can give binding directions to States (Articles 256, 257, 339(2), 347, 350A, and in emergencies), and States and the Union can delegate functions to each other (258, 258A). All-India Services bind the administration together. Coordination bodies (Inter-State Council, Zonal Councils, NEC, NITI Governing Council, GST Council) exist but are weak. Flashpoints are broad directions, BSF jurisdiction and Centrally Sponsored Schemes. Distribution OF Executive Powers The general principle is that executive power follows legislative power. The government that can make laws on a subject ordinarily also has the job of implementing them. The Constitution also lets the Union issue binding administrative directions to States on certain matters, in normal times and in emergencies. Directions in normal times Article 256: every State must use its executive power to ensure compliance with laws made by Parliament . The Union may give directions to States for implementing such laws. Article 257: States must use their executive power without impeding or prejudicing the Union's executive power. The Union may give directions about (a) building and maintaining communications declared important for national or military purposes and (b) protection of railways within a State. The Union must compensate States for specified extra costs of following such directions. Article 339(2): the Union may direct States on preparing and carrying out schemes essential for the welfare of Scheduled Tribes . Article 347: the President may direct a State to officially recognise a language spoken by a substantial section of its population , for specified purposes. Article 350A: States and local authorities should provide mother-tongue instruction at the primary stage for linguistic minority children The President may give directions to ensure this Directions during emergencies National Emergency (Article 352): the Union may direct States on how they use their executive power, even on matters ordinarily in the State sphere. President's Rule (Article 356): the President may take over specified executive functions of the State when its constitutional machinery fails. Financial Emergency (Article 360): the Union may give directions on financial propriety, salary reductions and reservation of State financial Bills for the President. Consequence of non-compliance (Article 365): if a State fails to comply with constitutionally valid Union directions, the President may hold that the State government cannot be carried on according to the Constitution. But non-compliance does not automatically justify President's Rule: action under Article 356 stays subject to constitutional safeguards and judicial review. Mutual Delegation OF Executive Functions The Constitution lets the Union and States hand administrative functions to each other for efficient governance. Article 258 (Union to States): the President may, with the State Government's consent , entrust Union executive functions to State authorities. Parliament may also confer specified powers and duties on State authorities by law. The Union must compensate for specified extra administrative costs. Article 258A (States to Union): the Governor may, with the Union Government's consent , entrust State executive functions to Union authorities. Significance: gives administrative flexibility and coordination, supports cooperative federalism, and does not permanently alter legislative powers. All-india Services AND Administrative Federalism All-India Services (AIS) are common to the Union and States and promote administrative integration and uniform standards of governance. Constitutional basis: Article 312 lets Parliament create new All-India Services after a Rajya Sabha resolution passed by two-thirds of members present and voting . Existing services: Indian Administrative Service ( IAS ), Indian Police Service ( IPS ), Indian Forest Service ( IFoS ). Significance: Administrative unity (common standards across Union and States) National integration (officers serve in different States and with the Union) Professional expertise (continuity and specialised experience) Policy coordination (helps carry out Union and State programmes) Issues in managing All-India Services 1. Dual control: officers work under State governments but are governed by Central service rules, creating tension over accountability and control. 2. Central deputation: disagreements over releasing officers for Union assignments. 3. Political interference: frequent transfers and postings hurt independence and continuity. 4. Cadre shortages: shortages weaken State administrative capacity and discourage deputation. 5. Federal autonomy: States argue that too much Central control over officers reduces their ability to run their own administration. Reform: better Union-State consultation, cadre planning, professional independence and transparent transfer policies. Institutions FOR Centre-state Coordination Effective federalism needs institutions that encourage consultation, cooperation and settlement of differences. Inter-State Council (Article 263) Basis: Article 263 lets the President set up an Inter-State Council if it serves the public interest. It was set up in 1990 on the Sarkaria Commission's recommendation. Composition: The Prime Minister is Chairperson Chief Ministers of all States Chief Ministers of Union Territories with Legislative Assemblies Administrators of other UTs Specified Union Ministers and other participants under applicable provisions Functions: (1) inquire into and advise on disputes between States (2) investigate and discuss matters of common interest to Union and States (3) make recommendations for better coordination of policy and administrative action Nature: Advisory and recommendatory It cannot enforce its decisions Issues: (1) meets infrequently and is not a regular forum (2) recommendations are not binding (3) weak follow-up and monitoring (4) States need not be consulted through the Council before every important Union decision that affects them (5) the GST Council and NITI Aayog Governing Council have taken over some consultation Sarkaria Commission: recommended a permanent Inter-State Council. Punchhi Commission: favoured strengthening its authority, consultation and dispute-resolution role. Zonal Councils Five Zonal Councils were set up under the States Reorganisation Act, 1956 . Composition: The Union Home Minister is Chairperson Chief Ministers of member States are members and rotating Vice-Chairpersons Two other Ministers from each member State Representatives of the UTs concerned Objectives: Prevent acute State consciousness and regionalism Develop the habit of cooperative working Resolve inter-State and Centre-State problems Promote regional economic and social development Handle issues of linguistic minorities, infrastructure and administrative coordination Significance: a regional platform to settle common problems by dialogue. North Eastern Council (NEC) Set up under the North Eastern Council Act, 1971 . It covers the eight North-Eastern States and gives a platform for regional planning, infrastructure development and inter-State coordination, with representation of the member States and the Union Government. Significance: addresses the North-East's distinctive geographic, developmental and security challenges. Other coordination mechanisms NITI Aayog Governing Council: consultation on national development policy and State priorities. GST Council (Article 279A): joint decisions on GST. Empowered Committee of State Finance Ministers: helped the move to VAT and GST. National Integration Council: forum for national integration and communal harmony. Chief Secretaries' and DGP conferences: administrative coordination, information-sharing and policy implementation. Issues IN Centre-state Administrative Relations 1. Broad powers under Articles 256 and 257 Concern: these Articles give the Centre wide authority to give binding directions to States. Issues: The vague wording gives the Union much discretion Frequent directions can interfere with States' own administrative duties They can become a source of confrontation when different parties rule the Centre and States And Article 365 non-compliance can be used to justify action over breakdown of constitutional machinery Punchhi Commission: Articles 256 and 257 should be safeguards of last resort Formal directions should usually follow consultation and warnings 2. BSF jurisdiction The Border Security Force works under the BSF Act, 1968 . Section 139 lets the Union Government confer specified powers on BSF personnel by notification. Extension (2021): the Union changed the area within which the BSF may use specified powers (arrest, search and seizure under certain laws). State Earlier limit Revised limit Punjab 15 km 50 km West Bengal 15 km 50 km Assam 15 km 50 km Gujarat 80 km 50 km Rajasthan 50 km 50 km The notification also covered the entire territory of specified North-Eastern States and the Union Territories of Jammu and Kashmir and Ladakh. Important distinction: the wider area is about specified statutory powers . It does not transfer general responsibility for police and public order from States to the BSF. Union's justification: Better response to cross-border infiltration and organised crime Better action against narcotics, weapons and other smuggling Uniform operational area across border States Quicker coordination with State Police against trans-border offences States' concerns: (1) federal encroachment , as police and public order are State subjects (2) inadequate consultation (Punjab and West Bengal objected) (3) overlapping jurisdiction may cause BSF-State Police conflict (4) civil liberties , since wider search and arrest powers need safeguards (5) a larger area does not improve security unless capacity and cooperation improve too Way forward: stronger BSF-State Police coordination, intelligence-sharing, operating protocols and human-rights safeguards. 3. Union ministries on State List subjects Subjects like agriculture, public health, police and local government mostly fall in the State List, yet the Union runs ministries and programmes in several of these areas. This creates a debate between national coordination and State autonomy . In favour: (1) national standards keep minimum service levels across States (2) inter-State problems such as pandemics, pollution and disease outbreaks need coordinated response (3) Centrally Sponsored Schemes give resources to fiscally weaker States (4) technical expertise of Union institutions. Example: during COVID-19 national coordination was needed for vaccine procurement, distribution and public health measures Against: (1) encroachment blurs the constitutional division of duties (2) one-size-fits-all schemes ignore regional needs (3) fiscal dependence : conditional funding pushes States to adopt Union priorities (4) political centralisation : control over grants and programmes raises the Centre's influence. Example: the creation of the Ministry of Cooperation raised concern about Union involvement in a subject mainly assigned to States Way forward: the NITI Aayog Sub-Group of Chief Ministers on Centrally Sponsored Schemes favoured rationalising schemes and more State flexibility: focus Union support on core national priorities, give States flexibility in implementation, consult before launching programmes touching State subjects, and balance national goals with State needs. Commission Recommendations ON Administrative Relations Sarkaria Commission (1983-88) 1. Restrained use of Union directions: use Articles 256 and 257 carefully, respecting State autonomy. 2. Inter-State Council: set up a permanent council under Article 263. 3. Prior consultation: consult States widely before Union executive action or legislation on Concurrent List subjects. 4. President's Rule: Article 356 only as a last resort, with safeguards. Punchhi Commission (2007-10) 1. Articles 256 and 257: Union directions should be safety valves, not tools of routine administrative control. 2. Inter-State Council: strengthen its authority, dispute-resolution role and capacity. 3. Zonal Councils: meet regularly and follow up on recommendations. 4. Sectoral coordination: a Forum of Chief Ministers , chaired by a Chief Minister on rotation, to coordinate policy in sectors such as energy, food, education, environment and health. 5. Central forces: consult States better when deploying them. 6. Administrative federalism: balance national security, effective governance and State autonomy. Way forward 1. Strengthen intergovernmental institutions: revive the Inter-State Council and Zonal Councils with regular meetings and follow-up. 2. Respect State autonomy: use binding Union directions only where constitutionally necessary, preferably after consultation. 3. Investigative coordination: clear procedures for CBI consent , inter-State investigations and information-sharing. 4. Reform All-India Service management: better cadre management, deputation procedures and professional independence. 5. Security cooperation: BSF, Central forces and State Police should coordinate without needless jurisdictional conflict. 6. Rationalise Centrally Sponsored Schemes: more State flexibility in planning, implementing and using funds. 7. Promote cooperative federalism: replace needless confrontation with dialogue, trust and shared administrative responsibility. Way forward / key point Conclusion: administrative relations aim at effective implementation of laws and national coordination while preserving State autonomy. Success depends on constitutional restraint, administrative cooperation and mutual trust; stronger intergovernmental institutions can balance a strong Union with the rights of States."}, {"c": "17", "n": "Federalism and Centre-State Legislative and Administrative Relations", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. India: coming together or holding together? Holding together (like Spain, Belgium); USA, Switzerland, Australia are coming together Who called India quasi-federal? K. C. Wheare Who stressed cooperative federalism? Granville Austin Meaning of sui generis Of its own kind Case that made federalism basic structure S. R. Bommai, 1994 Article for Parliament altering State boundaries Article 3 (State consent not mandatory) Rajamannar Committee 1969, set up by Tamil Nadu Bargaining federalism is associated with W. H. Morris-Jones Articles for special State provisions 371 to 371J; Sixth Schedule for tribal areas Article for territorial extent of laws Article 245 Article for the three lists Article 246 (Seventh Schedule) Residuary powers Article 248: Parliament, including residuary taxation Five subjects moved to the Concurrent List in 1976 Education, forests, weights and measures, wild animals and birds, administration of justice Doctrine of territorial nexus case State of Bihar v. Charusila Dasi (1959) Pith and substance case State of Bombay v. F. N. Balsara (1951) Colourable legislation meaning What cannot be done directly cannot be done indirectly Harmonious construction case Calcutta Gas Co. v. State of West Bengal (1962) If entries truly conflict, which list wins? Union List Article 249 majority and validity Two-thirds of RS members present and voting; one year, renewable; law lapses six months after Article 250 Parliament legislates on State List during National Emergency Article 252 Two or more States request Parliament; only Parliament can amend or repeal Act made under Article 252 Water (Prevention and Control of Pollution) Act, 1974 Article 253 Laws to implement international treaties, even on State List Article 254(2) State law on Concurrent List prevails in that State with Presidential assent; Parliament can still override later Farm Laws Union entry Concurrent List Entry 33 (trade and commerce in foodstuffs) Farm Laws outcome Repealed 2021; Supreme Court did not decide constitutionality Presidential Reference Nov 2025 on timelines No judicial timelines, no deemed assent; limited mandamus for indefinite inaction (verify) Executive power follows Legislative power Article 256 / 257 States must comply with Union laws / must not impede Union executive power Article 258 / 258A Union entrusts functions to States (State consent) / States to Union (Union consent) Article 312 New All-India Services by RS two-thirds present and voting Inter-State Council set up / basis 1990, Sarkaria; Article 263; PM chairs Zonal Councils chaired by Union Home Minister; 5 councils under States Reorganisation Act 1956 NEC set up under North Eastern Council Act, 1971 BSF Act and section BSF Act 1968, Section 139; 2021 notification set 50 km in Punjab, West Bengal, Assam Punchhi on Articles 256-257 Safeguards of last resort; consult and warn first"}, {"c": "17", "n": "Federalism and Centre-State Legislative and Administrative Relations", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts in Start Here)"}, {"c": "17", "n": "Federalism and Centre-State Legislative and Administrative Relations", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards"}, {"c": "18", "n": "Governor, Article 356, Fiscal Federalism and Inter-State Relations", "id": "1-office-of-the-governor-president-s-rule", "t": "1 · Office OF THE Governor · President's RULE · Article 356 · Bommai · Financial Emergency", "x": "1 · Office OF THE Governor · President's RULE · Article 356 · Bommai · Financial Emergency # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Centre State Relations handout pp. 18-23. Prelims PYQs quoted: none quoted in the material. In simple words The Governor is the State's constitutional head but is appointed by the President and holds office at his pleasure, so he is both a constitutional head and a link between Centre and State. Controversies: Governor as Centre's agent, hung Assemblies, delayed assent, summoning the House. Article 356 was often misused; Bommai (1994) subjected it to judicial review and the floor test. Commissions favour reforming the office rather than abolishing it. Constitutional Position OF THE Governor The Governor is the constitutional head of the State, like the President at the Union level. But unlike the elected President, the Governor is appointed by the President and holds office during the President's pleasure. He performs two roles: (1) constitutional head , acting normally on the aid and advice of the elected Council of Ministers (2) link between Union and State , performing functions that connect State administration with the Union This dual role is a major source of controversy, especially when different parties govern the Centre and the State. Article Provision 153 There shall be a Governor for each State. One person may be Governor of two or more States. 155 Appointed by the President by warrant under his hand and seal. 156 Holds office during the pleasure of the President; normal term five years . 157 Must be an Indian citizen and at least 35 years old. 158 Cannot be a member of Parliament or a State Legislature, or hold any other office of profit. 159 Takes the oath before the Chief Justice of the High Court (or the senior-most available judge). Why appointed and not elected? The Constituent Assembly preferred appointment by the President because: Avoid dual political authority: an elected Governor might claim an independent mandate and clash with the Chief Minister. Parliamentary government: the Governor was meant to be a constitutional head, with real power in the elected government. National integration: appointment keeps a constitutional link between the Centre and States. Administrative simplicity: separate elections for a mainly nominal office would cost needlessly. Concern: appointment can create political dependence on the Union Government, especially because of the Doctrine of Pleasure . Discretionary Powers OF THE Governor Article 163: the Council of Ministers aids and advises the Governor, except where the Constitution requires him to act in his discretion. The Governor does not have unlimited discretion. It must have a constitutional basis and stays subject to judicial safeguards. Constitutional discretion: (a) reserving Bills for the President (Article 200) in permitted circumstances (b) administering a Union Territory (Article 239): a Governor made Administrator of an adjoining UT acts in that role independently of the State Council of Ministers (c) special provisions : some Governors have specified functions under the Sixth Schedule and Articles 371 to 371J Situational discretion arises from political circumstances where the Constitution requires the Governor to use judgment: (a) hung Assembly : choosing a Chief Minister when no party has a clear majority (b) loss of majority : requiring a floor test when there are credible doubts about the government's majority (c) government formation : finding an alternative government when the incumbent loses majority support (d) President's Rule : reporting circumstances suggesting failure of constitutional machinery under Article 356 Important: these decisions must respect the elected Legislature, parliamentary conventions and constitutional limits. Major Issues WITH THE Office OF Governor Governor as agent of the Centre The Governor is often criticised for acting as an agent of the Centre instead of a neutral constitutional head. 1. Political appointments: Governors may come from the ruling party at the Centre. 2. Doctrine of Pleasure: possible removal before the five-year term can weaken independence. 3. Interference in State governance: disputes over appointing Chief Ministers, summoning Assemblies and administrative decisions. 4. Delay in assent to Bills: long inaction can block legislation passed by elected State Legislatures. 5. Recommending President's Rule: the Governor's reports can become politically controversial. Federal implication: two competing centres of authority within a State weaken responsible government. Counterargument: the Governor has legitimate duties in hung Assemblies, constitutional breakdowns and Bills raising constitutional concerns. Not every intervention is political misuse. Doctrine of Pleasure and security of tenure Under Article 156 the Governor holds office during the President's pleasure. Issues: no guarantee against early removal Perceived dependence on the Union Frequent transfers and removals affect continuity and neutrality B. P. Singhal v. Union of India (2010): The Supreme Court held that (1) the Governor may be removed without giving reasons publicly (2) but removal cannot be arbitrary, capricious or unreasonable (3) a mere change of government at the Centre is not, by itself, enough reason for removal Significance: the Doctrine of Pleasure is not an unrestricted power. Appointing a Chief Minister in a hung Assembly A hung Assembly arises when no party or alliance has a clear majority. Issues: The Governor's choice of whom to invite may favour one formation Delays or discretionary decisions encourage bargaining and defections His personal assessment of majority may differ from the will of the elected House Constitutional principle: a government's majority should ordinarily be proved by a floor test in the Assembly. Reform: follow objective government-formation conventions and hold prompt floor tests where needed. Summoning and proroguing the State Legislature Article 174 empowers the Governor to summon, prorogue and dissolve the Legislative Assembly. Nabam Rebia v. Deputy Speaker (2016): The Governor cannot ordinarily use these powers independently of the aid and advice of the Council of Ministers He cannot interfere in legislative proceedings merely because of political disagreement His discretion remains subject to constitutional limits and judicial review Significance: strengthened the elected State government's authority over legislative business. President's RULE (article 356) Article 356 lets the President issue a proclamation when the government of a State cannot be carried on in accordance with the Constitution. It may be based on the Governor's report or other relevant information. Procedure: the proclamation must be approved by both Houses of Parliament within two months (subject to constitutional exceptions). Once approved it normally lasts six months . It can be extended with parliamentary approval, up to a maximum of three years , with additional conditions beyond one year. Effects: The President may take over specified executive functions of the State The State Council of Ministers ordinarily ceases to hold office Parliament may exercise the State Legislature's legislative powers The Assembly may be suspended or dissolved, subject to safeguards Important: the powers of the High Court cannot be taken over or suspended under Article 356. Misuse of Article 356 — historically criticised as a tool of political interference in State governments. Concerns: (1) political dismissal of governments because of differences with the Centre (2) Governor's reports influenced by politics rather than real constitutional breakdown (3) no floor test , with majority judged outside the Assembly (4) erosion of federalism and democratic accountability Historical examples: Kerala (1959) , dismissal of the Communist government 1977 , dismissal of several State governments after the change of government at the Centre 1980 , similar dismissals after another change at the Centre 1992 , dismissal of BJP-led State governments after the demolition of the Babri Masjid Judicial safeguards S. R. Bommai v. Union of India (1994): A nine-judge Bench delivered the landmark judgment limiting misuse of President's Rule. Principles: (1) federalism is part of the Basic Structure (2) a proclamation under Article 356 is subject to judicial review (3) majority should ordinarily be tested by a floor test in the Assembly, not by the Governor's subjective view (4) the President's satisfaction must rest on constitutionally relevant material (5) courts may restore a dismissed government and Assembly if the proclamation is unconstitutional Rameshwar Prasad v. Union of India (2006): concerned the dissolution of the Bihar Assembly in 2005 . The Court held the dissolution unconstitutional and reaffirmed that the Governor's recommendations and Union decisions cannot rest on unsupported assumptions about political developments. It strengthened judicial scrutiny of Governors' reports and premature dissolution. Financial Emergency (article 360) The President may proclaim a Financial Emergency if the financial stability or credit of India, or any part of its territory, is threatened. Provisions: Needs parliamentary approval within two months (subject to constitutional exceptions) Once approved, it continues until revoked . No Financial Emergency has ever been proclaimed in India. Effect on Centre-State relations: The Union may direct States to (a) observe specified principles of financial propriety (b) reduce salaries and allowances of specified persons serving in connection with State affairs (c) reserve Money Bills and other Financial Bills for the President after the State Legislature passes them Significance: allows strong Central control over State finances during a severe financial crisis. Reforms IN THE Office OF Governor AND Emergency Powers Sarkaria Commission (1983-88) Appointment: An eminent person from outside the State , detached from active politics Avoid appointing politicians linked to the ruling party at the Centre to opposition-ruled States Consult the Chief Minister Tenure and removal: The normal five-year tenure should not be disturbed except in exceptional circumstances Avoid arbitrary removal and communicate reasons through proper procedures Article 356: Use only as a last resort Give the State government a chance to correct constitutional violations where practicable Prefer a floor test to decide legislative majority Punchhi Commission (2007-10) Appointment and tenure: Greater consultation and political neutrality A fixed five-year tenure Delete the words \"during the pleasure of the President\" from Article 156 Removal: an impeachment-type procedure by the State Legislature, with a chance for the Governor to be heard. Discretion: Clearly define its scope Prevent needless interference with elected State governments Reduce political controversy from the Governor's statutory functions, including the Chancellor's role Articles 200 and 201: clearer procedures and a six-month period to decide reserved Bills (needs constitutional change). Article 356: Limited and proportionate Union intervention Explore localised emergency arrangements instead of taking over a whole State when trouble is confined to one area Ncrwc (2002) A consultative appointment mechanism involving the Prime Minister, Union Home Minister, Lok Sabha Speaker and the Chief Minister of the State. Greater security of tenure and clear procedures for removal. Stress on the neutrality and constitutional independence of the Governor's office. Reform OR Abolish THE Office OF Governor? For abolition or major curtailment For retention Colonial legacy: the office came from a structure designed for Central control Constitutional link: an institutional connection between Union and States Political interference: Governors may be used to influence opposition-ruled States Neutral umpire: may play an important role in hung Assemblies and constitutional crises Lack of accountability: not directly accountable to the State electorate National integration: special responsibilities in sensitive and tribal regions Unnecessary discretion: controversies over Bills, sessions and government formation harm democracy Constitutional continuity: keeps important institutions working during political uncertainty Preferred approach: reform, not abolition. Major commissions have generally favoured reforming the office. The emphasis should be on: 1. Consultative appointment: Involve the State Chief Minister Transparent selection norms 2. Security of tenure: prevent arbitrary removal and political transfers. 3. Limited discretion: clearly define where independent gubernatorial judgment is needed. 4. Legislative accountability: no needless delay in acting on State Bills, within the constitutional framework. 5. Academic autonomy: reduce political conflict over universities and other statutory duties. 6. Restrained emergency powers: Article 356 as an exceptional measure, subject to judicial safeguards. Way forward / key point Conclusion: the Governor and emergency provisions reflect the attempt to combine State autonomy with national unity. Misuse weakens responsible government, democratic accountability and federal trust. Political restraint, stronger conventions and implementing the commissions' recommendations are essential for cooperative federalism."}, {"c": "18", "n": "Governor, Article 356, Fiscal Federalism and Inter-State Relations", "id": "2-fiscal-federalism-divisible-pool-cess-fi", "t": "2 · Fiscal Federalism · Divisible POOL · CESS · Finance Commission · 15th AND 16th FC", "x": "2 · Fiscal Federalism · Divisible POOL · CESS · Finance Commission · 15th AND 16th FC # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Centre State Relations handout pp. 23-26. Prelims PYQs quoted: none quoted in the material. In simple words The Union raises most big taxes while States do most spending, so money must flow from Centre to States (vertical imbalance), and richer and poorer States differ (horizontal imbalance). The Finance Commission (Art 280) recommends the States' share of the divisible pool (41% under both the 15th and 16th FC) and how to split it among States. Cesses and surcharges are outside the pool, which is a major grievance. Meaning AND Nature OF Fiscal Federalism Fiscal federalism is the constitutional arrangement for dividing financial powers, taxation authority and resources between the Union and States. In India the Union controls several major revenue sources, while States spend heavily on health, education, agriculture, infrastructure and social welfare. This creates a need for tax devolution, grants-in-aid and institutional coordination to keep fiscal balance. Types of fiscal imbalance Vertical fiscal imbalance: The mismatch between the revenue-raising powers and the spending duties of the Union and States. The Union collects a large share of national tax revenue States carry major responsibility for public services So States depend on Central transfers Horizontal fiscal imbalance: differences in revenue capacity and spending needs among States (income, population, geography, infrastructure). Poorer States generally need more help. The Finance Commission tries to reduce these gaps through horizontal tax devolution. Divisible pool of Central taxes (Article 270) The divisible pool is the shareable part of Union tax revenue that is shared between the Centre and States. It generally includes shareable Union taxes after excluding: Cesses for specific purposes Surcharges Certain taxes assigned separately by the Constitution And the cost of tax collection The Finance Commission recommends the States' share of this pool. Important: a recommendation of 41% devolution does not mean States get 41% of the Centre's gross tax revenue. Cesses and surcharges (Article 271) Surcharge: an additional charge on an existing tax, levied for Union purposes. Cess: a tax for a specific purpose , such as funding a particular programme. Their proceeds are generally excluded from the divisible pool . This lets the Union keep revenue that is not shared with States. Growing use of these instruments is a major issue in Centre-State finances. Grants-in-aid Article 275: grants from the Union to States under constitutional provisions, including those based on the Finance Commission's recommendations. Article 282: the Union and States may give grants for any public purpose , even on a subject outside their normal legislative competence. Federal significance: grants help fill fiscal gaps, but too much dependence on conditional and discretionary transfers reduces State autonomy. Finance Commission (article 280) The Finance Commission is a constitutional body under Article 280 that recommends how financial resources are shared between the Union and States. Composition and appointment: Constituted by the President every five years or earlier if needed A Chairperson and four other members . Qualifications and selection follow the Finance Commission (Miscellaneous Provisions) Act, 1951 Qualifications: The Chairperson must have experience in public affairs The other members are chosen from persons with expertise in law, government finance and accounts, financial administration or economics, as prescribed Functions 1. Vertical tax devolution: the share of the divisible pool that goes from the Union to States. 2. Horizontal tax devolution: how the States' collective share is distributed among individual States. 3. Grants-in-aid: principles for Union grants to States. 4. Local body financing: measures to add to the resources of Panchayats and Municipalities, based on State Finance Commission recommendations. 5. Other matters referred by the President. Vertical devolution Horizontal devolution Distribution of the divisible pool between the Union and States collectively Distribution of the States' share among individual States Addresses vertical fiscal imbalance Addresses horizontal fiscal imbalance Example: 41% share for States under the 16th Finance Commission Uses criteria such as income distance, population, area and forest cover 15th Finance Commission (2021-26) Chairperson: N. K. Singh. Major recommendations: 1. Vertical devolution: 41% of the divisible pool for States. The fall from 42% reflected the changed status of Jammu and Kashmir as a Union Territory. 2. Horizontal distribution: used 2011 population , income distance, area, forest and ecology, demographic performance and tax effort. 3. Revenue deficit grants for 17 States over the award period. 4. Local body grants: stronger transfers to Panchayats and Municipalities, including grants linked to essential services. 5. Disaster management: a corpus of about Rs 1.6 lakh crore . 6. Sectoral and performance grants: support for health, education, agriculture and other priorities. 16th Finance Commission (2026-31) Chairperson: Dr. Arvind Panagariya. The Commission submitted its report on 17 November 2025, and it was tabled in Parliament on 1 February 2026. (current affairs; verify) Vertical devolution: it kept the States' share of the divisible pool at 41% . The Union Government accepted it. For 2026-27 the Union Budget provided Rs 1.4 lakh crore as Finance Commission grants to States. Criterion 15th FC 16th FC Income distance 45% 42.5% Population (2011) 15% 17.5% Demographic performance 12.5% 10% Area 15% 10% Forest 10% 10% Tax and fiscal effort 2.5% — Contribution to GDP — 10% Total 100% 100% What the revised formula means Income distance still has the highest weight, to support States with lower per capita income. Population weight rose, recognising the spending needs of more populous Stat
