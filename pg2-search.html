 · Safeguards · Threats", "x": "1 · Judiciary · Structure · Independence · Safeguards · Threats # Handout only · Saarthi IAS Exam lens Priority: High. Mains PYQs quoted: None quoted in the handout · Judiciary module pp. 4-8. Prelims PYQs quoted: none quoted in the material. In simple words India has one unified court system: Supreme Court at the top, then High Courts, then Subordinate Courts, and the same courts apply Union and State laws. Judges must decide without pressure from Parliament or the government, because the government is the biggest litigant and courts guard the Constitution and rights. The Constitution gives tenure, salary, removal and other safeguards, yet appointments, the CJI's roster power, post-retirement jobs and funding still threaten independence. Independence is never freedom from accountability. Structure OF THE Indian Judiciary Integrated and unified system India has an integrated and unified judicial system with the Supreme Court at the apex , followed by High Courts and Subordinate Courts . Unlike some federal countries, India does not have separate judicial systems for Union and State laws. The same hierarchy of courts interprets and applies both. Level of court Constitutional framework Supreme Court Articles 124-147 High Courts Articles 214-231 Subordinate Judiciary Articles 233-237 Judicial hierarchy: one chain for Union and State laws Supreme Court (Arts 124-147) High Courts (Arts 214-231) Subordinate Courts (Arts 233-237) Meaning AND Importance OF Judicial Independence What it means Judicial independence means the judiciary must perform its functions without interference or pressure from the legislature, the executive or other external influences. It is essential for the Rule of Law , Separation of Powers and protection of Fundamental Rights . The Supreme Court has recognised judicial independence as part of the Basic Structure of the Constitution. WHY IS Judicial Independence Required? (8 reasons) Eight reasons 1. Separation of Powers and Checks and Balances: the judiciary must exercise an objective and impartial check on the legislature and executive. This is possible only when it is independent of both. 2. Government as a major litigant: the government is involved in a large number of cases. Independence ensures that judgments are not influenced by the government against which cases are filed. 3. Upholding the Constitution: courts must protect the Constitution from unconstitutional actions and laws enacted by the legislature or executive. 4. Preservation of Rule of Law: members of the legislature and executive are not above the law. An independent judiciary ensures that the same law applies to everyone. 5. Protection of Fundamental Rights: most writ petitions are complaints against government actions. Independence is necessary to protect citizens from arbitrary State action. 6. Counter-majoritarian role: democracy is the rule of the majority, not the tyranny of the majority. Courts protect minority rights and constitutional values against majoritarian excesses. 7. Preservation of federal polity: the Supreme Court resolves disputes between the Centre and States. It can preserve the federal balance only when it is independent of both. 8. Control over executive failure: independence helps check executive malfeasance, misfeasance and nonfeasance. Term Meaning Malfeasance Deliberate commission of an unlawful act Misfeasance Improper performance of a lawful duty Nonfeasance Failure to perform a required duty Constitutional Safeguards FOR Judicial Independence Key point The Constitution provides several safeguards to protect judges from political pressure and arbitrary interference. Safeguard Constitutional provision Security of tenure Supreme Court judges retire at 65 years and High Court judges at 62 years . Difficult removal process Under Articles 124(4) and 217 , judges can be removed only for proved misbehaviour or incapacity , following the prescribed special-majority parliamentary procedure. Financial security Supreme Court judges' salaries are charged to the Consolidated Fund of India . High Court judges' salaries are charged to the Consolidated Fund of the State , while their pensions are charged to the Consolidated Fund of India. Protection of service conditions Judicial allowances and specified service benefits cannot be varied to a judge's disadvantage after appointment, subject to constitutional provisions. Restriction on legislative discussion Articles 121 and 211 restrict discussion of judges' conduct in Parliament and State Legislatures, subject to constitutional exceptions. Judicial appointments Judges are appointed by the President through a process involving the judiciary, presently governed by the Collegium System . Contempt powers Articles 129 and 215 empower the Supreme Court and High Courts to punish contempt and protect the administration of justice. Post-retirement practice Retired Supreme Court judges cannot plead or act before any court or authority in India. High Court judges face restrictions under Article 220 . Value addition Important: the power to punish contempt protects the administration of justice , not judges from legitimate criticism. Removal of judges A Supreme Court or High Court judge may be removed by the President after an address by each House of Parliament supported by: A majority of the total membership of the House. Not less than two-thirds of members present and voting . The grounds are limited to proved misbehaviour or incapacity . Significance: this difficult procedure prevents the government from removing judges merely because their decisions are inconvenient. Threats TO Judicial Independence Key point Despite constitutional safeguards, the higher judiciary faces several institutional and political challenges. 1. Executive influence over judicial appointments Delayed appointments: the Union Government may delay action on Collegium recommendations, contributing to judicial vacancies. Return of recommendations: repeated disagreements between the executive and Collegium may create institutional friction. Indirect pressure: prolonged uncertainty over appointments may weaken confidence in the independence of the selection process. Value addition Important: the executive has a constitutionally recognised role in appointments. The concern is not executive participation itself, but arbitrary interference or unexplained delays . Way forward / key point Reform: ensure a transparent appointment procedure with reasonable timelines, clear selection criteria and institutional accountability. 2. Master of Roster and selective allocation of cases The Chief Justice of India (CJI) is the Master of Roster , with administrative authority to constitute Benches and allocate cases. Constitutional purpose: this power ensures orderly court functioning and proper distribution of judicial work. Concentration of administrative power: the CJI exercises considerable discretion in assigning cases to different Benches. Selective listing: critics argue that politically sensitive cases may be assigned to particular Benches, raising concerns about impartiality. Lack of transparency: limited disclosure of reasons for unusual allocations can create doubts about fairness. Institutional independence: judicial independence may be affected not only by external pressure but also by the misuse of internal administrative authority. Note Example: in January 2018 , four senior Supreme Court judges publicly raised concerns over the allocation of important cases under the then CJI, Justice Dipak Misra . Key point Judicial position: the Supreme Court has reaffirmed that the CJI is the Master of Roster, but the power must be exercised fairly and in the interest of judicial administration. Way forward / key point Way forward: publish clear roster rules, adopt objective allocation criteria and provide reasons for exceptional departures. 3. Post-retirement appointments of judges Retired judges are often appointed to tribunals, commissions, governorships and other public positions. This has raised concerns about a possible conflict between judicial independence and post-retirement opportunities. Judge Post-retirement position Justice Ranjan Gogoi Nominated to the Rajya Sabha in 2020 , after retiring as CJI Justice S. Abdul Nazeer Appointed Governor of Andhra Pradesh in 2023 , shortly after retirement from the Supreme Court Justice Ashok Bhushan Appointed Chairperson of the National Company Law Appellate Tribunal (NCLAT) in 2021 , after retiring from the Supreme Court Key point These appointments are not, by themselves, evidence of misconduct. However, they raise concerns about the appearance of judicial independence. Arguments in favour Judicial expertise: retired judges possess valuable experience in constitutional law, administration and dispute resolution. Institutional requirements: bodies such as the NHRC, tribunals and commissions may require judicial experience under their statutory frameworks. Independent leadership: experienced judges can provide impartial leadership to important public institutions. No automatic conflict of interest: judicial integrity depends on individual conduct and institutional safeguards, not merely the availability of post-retirement positions. Arguments against Conflict of interest: judges may be perceived as avoiding judgments against the government that could influence their future appointments. Pre-retirement influence: immediate appointments can create suspicion that discussions or expectations arose before retirement. Executive dependence: where the government controls appointments to post-retirement offices, judges may face perceived incentives to favour the executive. Public confidence: such appointments may create doubts about the independence of earlier judgments, even without proof of actual bias. Institutional credibility: the appearance of political favour can weaken trust in the judiciary. Reforms in post-retirement appointments Cooling-off period: introduce a proposed two to three-year cooling-off period before retired judges accept executive-controlled appointments, subject to carefully designed statutory exceptions. Transparent selection: appointments to tribunals and commissions should follow objective criteria and independent selection procedures. First Law Commission (1958): favoured restrictions on judges accepting government employment after retirement. Justice R. M. Lodha's proposal: suggested a system under which judges could choose between retirement with pension and continued service through a structured appointment mechanism. Reform tribunal appointments: reduce dependence on discretionary post-retirement appointments through better institutional recruitment systems. Retirement age: proposals to increase the retirement age of judges should be examined alongside service conditions and manpower requirements. Value addition Key principle: judicial independence must be protected not only from actual interference, but also from arrangements that create a reasonable perception of conflict of interest . 4. Financial and administrative dependence Although judges enjoy constitutionally protected salaries and service conditions, the judiciary depends on the government for several administrative requirements. Judicial infrastructure: court buildings, technology and support facilities depend substantially on public funding. Staff shortages: inadequate administrative and technical personnel affect judicial functioning. Budgetary dependence: limited control over infrastructure expenditure can affect institutional autonomy. Judicial vacancies: delayed appointments may increase workload and weaken the effective functioning of courts. Way forward / key point Way forward: strengthen judicial infrastructure planning, provide predictable funding and improve administrative capacity. 5. External pressure and public campaigns Judicial independence can also be threatened by pressures outside the government. Political pressure: public statements or campaigns may seek to influence pending judicial matters. Media trials: excessive commentary during ongoing proceedings may undermine fair-trial safeguards. Threats and intimidation: judges, lawyers and witnesses may face pressure in politically or socially sensitive cases. Organised interests: powerful economic or social groups may attempt to influence litigation. Way forward / key point Reform: protect judges from intimidation while preserving legitimate criticism, media freedom and public accountability. Judicial Independence VS Judicial Accountability Independence does not mean freedom from accountability The judiciary must remain independent from external interference while being accountable for integrity, conduct, fairness and performance . Approach Effect Excessive executive control May weaken judicial independence and allow political interference Complete judicial self-regulation May create opacity, insufficient scrutiny and weak accountability Balanced approach Judicial administration should combine independent decision-making, transparent procedures and credible accountability mechanisms In the news (Saarthi IAS CA; verify dates) Recent development (April 2025): the Supreme Court resolved to place judges' asset declarations in the public domain . It also expanded online disclosure of information concerning judicial appointments. These steps strengthen transparency without transferring control of judicial decisions to the executive. (verify dates) WAY Forward Seven steps 1. Protect institutional autonomy: prevent arbitrary interference in appointments, judicial administration and decision-making. 2. Strengthen appointment procedures: introduce transparent criteria and ensure timely consideration of Collegium recommendations. 3. Reform case allocation: adopt clear roster rules and transparent procedures for assigning sensitive cases. 4. Regulate post-retirement appointments: consider a cooling-off period and independent selection mechanisms for public offices. 5. Strengthen financial independence: ensure adequate judicial infrastructure, staffing and predictable public funding. 6. Promote judicial accountability: improve transparency, ethical standards and disciplinary mechanisms without compromising judicial independence. 7. Protect legitimate criticism: balance judicial authority with freedom of speech and public scrutiny. Value addition Conclusion: judicial independence is essential for protecting the Constitution, Fundamental Rights and Rule of Law. However, independence cannot become a shield against accountability. The objective should be an independent, transparent and accountable judiciary that commands public confidence."}, {"c": "19", "n": "Judiciary: Independence, Appointments, Collegium and Accountability", "id": "2-judicial-appointments-collegium-njac-tra", "t": "2 · Judicial Appointments · Collegium · NJAC · Transfers", "x": "2 · Judicial Appointments · Collegium · NJAC · Transfers # Handout only · Saarthi IAS Exam lens Priority: High. Mains PYQs quoted: None quoted in the handout · Judiciary module pp. 8-12. Prelims PYQs quoted: none quoted in the material. In simple words The Collegium system grew through three Judges Cases: the first gave primacy to the executive, the second and third shifted it to the judiciary and fixed who must be consulted. The Collegium is criticised for opacity, favouritism, weak personnel planning and no accountability, and for weak diversity. Parliament tried the NJAC through the 99th Amendment in 2014, but the Fourth Judges Case (2015) struck it down for breaching judicial independence, and the Collegium returned. Transfers of High Court judges also need transparent reasons. Evolution OF THE Collegium System Collegium timeline First Judges Case 1981: executive primacy Second Judges Case 1993: judiciary primacy, Collegium born Third Judges Case 1998: size and consultation clarified NJAC 2014 struck down 2015: Collegium restored First Judges Case: S. P. Gupta v. Union of India (1981) The Supreme Court held that consultation does not mean concurrence . The opinion of the CJI was not binding on the executive. The executive enjoyed primacy in judicial appointments. Consultation had to be effective, rather than a mere procedural formality. Significance: the judgment favoured executive primacy in judicial appointments. Second Judges Case: Supreme Court Advocates-on-Record Association v. Union of India (1993) The Supreme Court overruled the First Judges Case . Consultation implies primacy of the CJI's opinion . The CJI must consult a Collegium of senior-most Supreme Court judges . Judicial appointments cannot be based solely on the personal opinion of the CJI. Significance: transferred primacy in judicial appointments from the executive to the judiciary . Third Judges Case: Presidential Reference (1998) The Supreme Court clarified the consultation process. 1. Supreme Court appointments: the CJI must consult the four senior-most judges of the Supreme Court. 2. High Court appointments: the CJI must consult the two senior-most Supreme Court judges. 3. Transfer of High Court judges: the CJI must consult the four senior-most Supreme Court judges, along with the Chief Justices of the concerned High Courts . 4. Collective opinion: the sole opinion of the CJI does not constitute effective consultation. 5. Dissent within Collegium: if two members of the Supreme Court Collegium express adverse opinions, the recommendation should not be forwarded. Significance: established the principle of plurality of judges in judicial appointments. Case Holding Primacy First Judges (1981) S. P. Gupta Consultation is not concurrence; CJI opinion not binding Executive Second Judges (1993) SC Advocates-on-Record Assn Overruled first case; CJI consults a Collegium of senior-most judges Judiciary Third Judges (1998) Presidential Reference SC: CJI + 4 senior-most; HC: CJI + 2 senior-most; transfers: 4 + Chief Justices of the High Courts concerned; two adverse opinions block Judiciary (plurality of judges) Criticism OF THE Collegium System 1. Lack of transparency The Collegium does not consistently disclose detailed reasons for selecting or rejecting candidates. Selection criteria are not sufficiently clear to the public. This creates allegations of favouritism and weakens public confidence. Example: although Collegium resolutions are now published, they do not always explain why one eligible candidate was preferred over another . 2. Allegations of favouritism and nepotism The absence of transparent selection criteria creates scope for allegations of personal preferences and favouritism. Family connections within the legal profession raise concerns about equal opportunity. There is no fully independent mechanism to examine such allegations. Issue: even where appointments are made on merit, opacity makes it difficult to rebut allegations of bias. 3. Inefficient judicial personnel management Collegium judges are already occupied with substantial judicial work. The Collegium has limited institutional capacity for systematic manpower planning. Delays in recommendations and appointments contribute to vacancies. Issue: judicial appointments require continuous assessment of vacancies, workload, specialisation and future requirements, which an informal selection system may struggle to provide. 4. Weak accountability The Collegium is not subject to a clearly defined system of public accountability for its decisions. There is limited independent scrutiny of selection procedures. Unsuccessful candidates have no ordinary mechanism to challenge selection decisions merely on comparative merit. Core debate: judicial independence is necessary, but independence cannot mean absence of accountability. 5. Constitutional concerns Critics argue that the Collegium System amounts to a judicial rewriting of the appointment procedure. The Constitution provides for consultation , but does not expressly grant exclusive appointment primacy to judges. The system reduces the role of democratically accountable institutions. Counterargument: judicial primacy is necessary to protect appointments from political interference, particularly because the government is a major litigant. 6. Federal concerns The Supreme Court Collegium exercises decisive influence over High Court appointments. This may reduce the effective role of High Court judges and State-level constitutional authorities. High Court judges may also perceive that their career progression depends heavily on the Supreme Court Collegium. Federal implication: the system raises questions about balancing judicial independence with the federal character of the judiciary. Diversity IN Judicial Appointments The higher judiciary has faced persistent concerns over the representation of women, Scheduled Castes, Scheduled Tribes, Other Backward Classes and minority communities. 1. Inadequate representation of women: women's representation in the Supreme Court and High Courts remains considerably lower than their share in the population. 2. Social diversity: there is no reservation system for appointments to the Supreme Court and High Courts, and representation of historically disadvantaged communities remains a concern. 3. Regional representation: the Collegium considers representation from different High Courts. However, regional balance alone does not ensure broader social diversity. 4. Dominance of the Bar: appointments from established legal practices may favour candidates with stronger professional networks. 5. Limited district judiciary representation: judicial officers promoted from subordinate courts are often underrepresented in High Court appointments. Bar vs Judicial Service in High Court appointments A convention has developed under which approximately two-thirds of High Court judges are appointed from the Bar and one-third from the judicial service . This is an administrative convention, not a fixed constitutional quota . Late elevation: judicial officers may be elevated to High Courts at a relatively advanced age, resulting in shorter tenures. Career stagnation: limited opportunities for promotion discourage talented judicial officers. Preference for Bar candidates: established advocates may receive greater consideration. Loss of grassroots experience: limited representation of trial-court judges reduces the presence of practical experience from the subordinate judiciary. Way forward on diversity Transparent criteria: establish clear standards based on merit, integrity, competence and experience. Social diversity: give greater consideration to women and underrepresented communities. Judicial service representation: improve opportunities for meritorious district judges to reach High Courts. Earlier elevation: ensure promoted judicial officers have meaningful tenures. Institutional support: create a professional secretariat for judicial appointment planning. National Judicial Appointments Commission (NJAC) Background The 99th Constitutional Amendment Act, 2014 , along with the National Judicial Appointments Commission Act, 2014 , sought to replace the Collegium System with the NJAC. The objective was to introduce a more institutional and participatory system of judicial appointments. Composition of NJAC (six members) 1. Chief Justice of India: Chairperson. 2. Two senior-most Supreme Court judges: Members. 3. Union Law and Justice Minister: Member. 4. Two eminent persons: nominated by a committee consisting of the Prime Minister, CJI and Leader of Opposition in Lok Sabha , or the leader of the largest opposition party where applicable. Special provision: one eminent person was to be selected from among SCs, STs, OBCs, minorities or women. Veto provision: any two members could block a recommendation. Functions of NJAC Recommend appointments of the CJI and Supreme Court judges . Recommend appointments of High Court Chief Justices and judges . Recommend transfers of High Court judges. Ensure that recommended candidates possess ability and integrity . Fourth Judges CASE (2015) Judgment In Supreme Court Advocates-on-Record Association v. Union of India (2015) , a five-judge Constitution Bench struck down the 99th Constitutional Amendment and the NJAC Act . The Court held that the proposed system violated judicial independence , which forms part of the Basic Structure of the Constitution. Outcome: the Collegium System was restored . Reasons for striking down NJAC 1. Executive influence: the presence of the Union Law Minister raised concerns because the government is a major litigant before the courts. 2. Undefined eminent persons: the absence of sufficiently clear eligibility criteria created scope for arbitrary selection. 3. Reduced judicial primacy: the CJI and senior judges did not possess sufficient control over the appointment process. 4. Veto provision: any two members could block an appointment, allowing non-judicial members to prevent a recommendation even where judicial members supported it. 5. Threat to judicial independence: the Court held that the proposed structure failed to provide adequate protection against external influence. Criticism of the NJAC judgment Democratic deficit: the Court struck down a constitutional amendment passed by Parliament and ratified by the required number of States. Judicial monopoly: critics argue that the Court restored a system in which judges enjoy primacy over their own appointments. No constitutional basis: the Collegium is not expressly mentioned in the constitutional text. Opacity remained: striking down NJAC did not automatically address the Collegium's lack of transparency. Limited accountability: the judgment did not establish a sufficiently independent accountability mechanism for appointments. Institutional conflict: the decision intensified disagreements between the executive and judiciary over appointment powers. Defence of the NJAC judgment Basic Structure: judicial independence cannot be compromised even through a constitutional amendment. Political interference: executive influence over appointments could undermine impartial adjudication. Government as litigant: a politically controlled appointment mechanism may create conflicts of interest. Constitutional supremacy: parliamentary approval does not place an amendment beyond Basic Structure review. Value addition Core debate: the issue is not simply Collegium vs NJAC, but how to combine judicial independence, transparency, accountability and democratic participation . In the news (Saarthi IAS CA; verify dates) Recent transparency measures (May 2025): the Supreme Court published additional information about the judicial appointment process, including the roles of the High Court Collegium, State Governments, Union Government and Supreme Court Collegium; information about candidates recommended for High Court appointments; and details of professional background, specified diversity categories and family relationships with judges. These measures improve transparency, although the demand for objective selection criteria and detailed reasoning remains. (verify dates) Issues WITH Transfer OF HIGH Court Judges 1. Lack of transparency Detailed reasons for transfer recommendations are not always made public. This makes it difficult to distinguish routine administrative transfers from allegedly punitive transfers. Non-disclosure creates speculation and affects public confidence. 2. Allegations of punitive transfers The transfer power may be perceived as a means of disciplining judges who deliver inconvenient judgments. Note Example: Justice S. Muralidhar (2020). His transfer from the Delhi High Court to the Punjab and Haryana High Court attracted controversy because it occurred around the time his Bench made observations concerning police action during the Delhi riots. Value addition Important: the Supreme Court Collegium had recommended the transfer earlier. The timing generated criticism, but it does not, by itself, establish a punitive motive. 3. Chilling effect on judicial independence Judges may fear transfers to less preferred High Courts. Such concerns could influence the willingness to decide sensitive cases independently. The lack of published reasons makes it difficult to remove doubts about the transfer process. 4. Executive influence Transfers require a formal Presidential order . Delays or requests for reconsideration may lead to disagreements between the executive and Collegium. The system must balance judicial primacy with constitutionally recognised executive participation. 5. Limited judicial review Judicial review of transfer decisions is limited, particularly where the prescribed consultation process has been followed. Courts generally avoid substituting their assessment for that of the Collegium on administrative suitability. Key issue: limited review increases the importance of transparent procedures and proper institutional safeguards. Reforms IN Transfer OF Judges Six reforms 1. Transparent reasons: publish sufficient reasons for transfers while protecting legitimate confidentiality. 2. Clear transfer policy: establish objective criteria relating to administrative needs, tenure and institutional requirements. 3. Meaningful consultation: obtain and consider the views of the judge concerned and relevant judicial authorities. 4. Prevent punitive transfers: transfers should not substitute for disciplinary action where allegations of misconduct arise. 5. Timely implementation: avoid unnecessary delays in implementing recommendations after completion of the constitutional process. 6. Strengthen institutional trust: ensure that transfers serve public interest and better administration of justice."}, {"c": "19", "n": "Judiciary: Independence, Appointments, Collegium and Accountability", "id": "3-judicial-accountability-removal-in-house", "t": "3 · Judicial Accountability · Removal · In-house Procedure · Transparency", "x": "3 · Judicial Accountability · Removal · In-house Procedure · Transparency # Handout only · Saarthi IAS Exam lens Priority: High. Mains PYQs quoted: None quoted in the handout · Judiciary module pp. 12-17. Prelims PYQs quoted: none quoted in the material. In simple words Accountability has two sides: corruption and misbehaviour, and performance such as delayed judgments. The only constitutional tool is removal under Articles 124(4) and 217 by the Judges (Inquiry) Act, 1968 process, which is so hard that no judge has been removed; the 1999 In-House Procedure fills the gap but cannot remove anyone. Law-backed fixes such as the 2010 Bill lapsed. Transparency has grown through RTI, asset disclosure and live-streaming. Meaning OF Judicial Accountability What it means Judicial accountability means that judges must be accountable for their conduct, integrity, fairness and performance , without compromising judicial independence. It is understood mainly in two dimensions: 1. Corruption and misbehaviour: a judge may engage in corruption, unethical conduct, conflict of interest or misuse of judicial authority. 2. Judicial performance: a judge may be a person of impeccable integrity but may lack efficiency, knowledge of law or diligence in delivering judgments. Value addition Key issue: judicial independence is necessary to protect judges from external pressure. However, independence cannot mean absence of accountability. Mechanisms OF Judicial Accountability Removal of Supreme Court and High Court judges Under Articles 124(4) and 217 , a judge can be removed by the President on the grounds of proved misbehaviour or incapacity . Procedure under the Judges (Inquiry) Act, 1968 : Removal of a judge: five steps Motion: 100 Lok Sabha or 50 Rajya Sabha members Speaker or Chairman admits or rejects 3-member Inquiry Committee Address in each House: total membership + two-thirds present and voting President orders removal Five steps in detail 1. Initiation: a removal motion requires the signatures of at least 100 Lok Sabha members or 50 Rajya Sabha members . 2. Admission: the Speaker or Chairman may admit or reject the motion. 3. Inquiry Committee: if admitted, a three-member committee is constituted, comprising a Supreme Court judge, a High Court Chief Justice and a distinguished jurist . 4. Parliamentary approval: if misbehaviour or incapacity is proved, each House must pass an address by a majority of its total membership and two-thirds of members present and voting . 5. Removal: the President issues the order of removal. Value addition Important: the Constitution uses the term removal , although the process is commonly called impeachment . Issues with the removal process 1. Difficult procedure: the requirement of a special majority makes removal extremely difficult. 2. Political considerations: parliamentary voting may be influenced by party loyalties rather than the seriousness of misconduct. 3. No intermediate penalties: the constitutional removal mechanism is designed for serious misconduct. There is no equally effective statutory framework for lesser misconduct by higher judiciary judges. 4. Absence of regular scrutiny: the removal procedure does not provide a mechanism for continuous assessment of judicial conduct. 5. Resignation during proceedings: a judge may resign before the parliamentary process reaches a conclusion, raising questions about accountability. Justice V. Ramaswami Case (1993) Justice V. Ramaswami became the first Supreme Court judge to face a parliamentary removal motion . The inquiry committee found him guilty of certain charges of misconduct. However, the motion failed in the Lok Sabha , partly because Congress members abstained from voting. Significance: demonstrated how political considerations can prevent removal even after an inquiry establishes misconduct. In-house Procedure OF THE Judiciary What it is The Supreme Court adopted the In-House Procedure in 1999 to examine complaints against judges of the Supreme Court and High Courts. It was designed to maintain a balance between judicial integrity and judicial independence . Complaint against Inquiry by A High Court judge The CJI may constitute an inquiry committee generally comprising a Supreme Court judge and two High Court Chief Justices A High Court Chief Justice An inquiry committee of a Supreme Court judge and two High Court Chief Justices A Supreme Court judge A committee of three Supreme Court judges The procedure is primarily an internal fact-finding and corrective mechanism. Possible outcomes Unsubstantiated complaint: the complaint may be closed. Lesser misconduct: the judge may be advised, or appropriate internal measures may be considered. Serious misconduct: the CJI may advise the judge to resign or seek voluntary retirement . Refusal to resign: the findings may be forwarded to the President and Prime Minister for consideration of constitutional removal proceedings. Value addition Important: the In-House Committee cannot itself remove a judge or impose criminal punishment . Criticism of the In-House Procedure 1. Self-regulation: judges investigate allegations against other judges, creating concerns about institutional bias. 2. Lack of transparency: inquiry reports are generally not made public, making independent scrutiny difficult. 3. No statutory foundation: the procedure is internally evolved rather than established through a comprehensive parliamentary law. 4. Limited enforcement powers: the committee cannot independently remove a judge or impose ordinary disciplinary penalties. 5. Weak public participation: complainants have limited access to the inquiry process and its findings. 6. Independence vs accountability: excessive external control may threaten judicial independence, while complete self-regulation may weaken public confidence. Justice Yashwant Varma CASE (2025-26) The case renewed concerns over judicial misconduct, internal inquiries and the effectiveness of the removal process. (verify dates) March 2025: allegations arose following the reported discovery of burnt currency notes after a fire at a residence associated with Justice Yashwant Varma, then a Delhi High Court judge. In-House inquiry: the CJI constituted a three-member committee to examine the allegations. May 2025: the committee submitted its report. The CJI subsequently forwarded the report and the judge's response to the President and Prime Minister . 2025-26: parliamentary removal proceedings and legal challenges followed. April 2026: Justice Varma resigned from judicial office. May 2026: a separate parliamentary inquiry committee submitted its report to the Lok Sabha Speaker. Issues highlighted 1. Effectiveness of In-House Procedure: the judiciary can investigate allegations internally but cannot itself remove a judge. 2. Resignation and accountability: resignation raises the question of whether serious allegations should still be examined through appropriate legal mechanisms. 3. Transparency: limited disclosure of inquiry material creates concerns about public confidence and procedural fairness. 4. Institutional coordination: the case demonstrates the need for clarity between judicial fact-finding, parliamentary removal and criminal investigation. Way forward / key point Way forward: establish a transparent and legally sound accountability framework without exposing judges to politically motivated complaints. Criminal Accountability OF Judges K. Veeraswami v. Union of India (1991) The Supreme Court recognised that judges of the higher judiciary are not immune from criminal law . However, it prescribed an important safeguard: Prior consultation and approval of the CJI are required before registering an FIR against a sitting Supreme Court or High Court judge under the framework considered in the case. Objective: prevent politically motivated criminal proceedings against judges. Concern: the safeguard may also create difficulties in ensuring accountability where serious allegations arise. Federal and constitutional significance: the issue involves balancing judicial independence, criminal accountability and the Rule of Law. Restatement OF Values OF Judicial LIFE What it is The Supreme Court adopted the Restatement of Values of Judicial Life in 1997 , containing 16 principles governing judicial conduct. It seeks to preserve the integrity, impartiality and public credibility of judges. Major principles 1. Judicial impartiality: judges must act fairly and avoid any appearance of bias. 2. Conflict of interest: judges should not hear cases involving close relatives or personal interests. 3. Financial propriety: judges must avoid speculative financial activities and improper financial dealings. 4. Restrictions on gifts: judges should not accept gifts or hospitality that may compromise their independence. 5. Judicial restraint: judges should avoid unnecessary political involvement, public controversies and media engagement. 6. Professional integrity: a judge's conduct must preserve public confidence in the judicial office. Value addition Key principle: justice must not only be done but must also be seen to be done . Limitations The principles are primarily self-regulatory . Their enforcement depends on internal judicial mechanisms. There is no comprehensive statutory system of independent monitoring. Violations falling short of removal remain difficult to address. Judicial Standards AND Accountability BILL, 2010 Background The Bill sought to establish a statutory framework for judicial conduct and accountability. It was passed by the Lok Sabha in 2012 , but later lapsed without becoming law. Major provisions 1. Judicial standards: proposed statutory standards governing the conduct of Supreme Court and High Court judges. 2. Asset declaration: required judges to declare their assets and liabilities, including specified family assets. 3. National Judicial Oversight Committee: proposed an institutional mechanism for examining judicial complaints. 4. Complaints Scrutiny Panels: provided for preliminary scrutiny of complaints against judges. 5. Minor corrective measures: allowed advisories and warnings in specified circumstances. 6. Removal proceedings: proposed mechanisms for investigating serious judicial misconduct. Criticism of the Bill 1. Threat to judicial independence: involvement of non-judicial members in oversight raised concerns about external influence. 2. Vague standards: broadly framed conduct standards could be misused against judges. 3. Confidentiality provisions: strict confidentiality requirements might discourage genuine complaints. 4. Frivolous complaint penalties: excessive penalties could deter whistleblowers and complainants. 5. Constitutional concerns: the authority to impose minor measures on constitutional court judges raised questions about the constitutional scheme. Significance: the Bill highlighted the need for a statutory accountability mechanism, but also the difficulty of balancing accountability with judicial independence. Judicial Performance Accountability Beyond corruption: performance Judicial accountability must not be limited to corruption and misbehaviour. It should also include the performance of judges. A judge may be honest and impartial but still contribute to delays through inefficient case management or failure to deliver judgments on time. Major issues 1. Delayed judgments: judges may reserve judgments for long periods after completing hearings. 2. Inadequate case management: poor scheduling and unnecessary adjournments affect the disposal of cases. 3. Limited performance evaluation: there is no comprehensive, independent performance-review framework for judges of constitutional courts. 4. Inconsistent quality: differences in legal reasoning, procedural efficiency and judgment writing affect the quality of justice. 5. Weak peer review: professional evaluation of judicial performance remains limited. Reforms Judicial performance review: develop objective indicators of efficiency, diligence and judicial conduct. Quality over quantity: assessment should consider the quality of judgments, not merely the number of cases disposed of. Peer review: encourage academic and professional scrutiny of judicial reasoning. Timely judgments: strengthen procedures for monitoring cases where judgments remain reserved. Judicial training: improve continuous legal education and professional development. Value addition Important: performance assessment must not become a mechanism for pressuring judges to decide cases in a particular manner. Transparency IN THE Judiciary Key point Transparency is essential for ensuring public confidence, accountability and institutional credibility. However, it must be balanced with judicial independence, confidentiality and the privacy of litigants . Right to Information and the judiciary The Right to Information Act, 2005 applies to the judiciary as a public authority. In Central Public Information Officer, Supreme Court of India v. Subhash Chandra Agarwal (2019) , the Supreme Court held that the office of the CJI comes within the scope of the RTI Act . Judicial independence does not place the judiciary entirely beyond transparency laws. Information disclosure must be balanced with privacy, confidentiality and judicial independence. Disclosure is subject to the exemptions and public-interest tests provided under the RTI Act. Significance: recognised that judicial independence and transparency are complementary constitutional values. Asset declaration by judges The Supreme Court had earlier adopted internal arrangements for judges to declare their assets. Major development (April 2025): the Full Court of the Supreme Court resolved that asset declarations of Supreme Court judges would be placed in the public domain , available through the Supreme Court's official website. Significance: improves transparency regarding the financial interests of judges, strengthens public confidence in judicial integrity and helps address concerns about conflicts of interest. Remaining issue: public disclosure practices are not uniform across the entire higher judiciary, particularly among High Courts. Live-streaming OF Court Proceedings What and why Live-streaming allows the public to observe judicial proceedings without being physically present in court. Swapnil Tripathi v. Supreme Court of India (2018): the Supreme Court recognised the importance of open justice and supported live-streaming of court proceedings, subject to appropriate safeguards. Constitutional basis: open courts promote transparency, public participation and access to justice. Benefits Transparency: enables public scrutiny of court proceedings. Access to justice: reduces the need for litigants to travel long distances merely to observe hearings. Accountability: allows litigants to monitor the work of their lawyers and court proceedings. Legal education: recorded proceedings can support the training of law students and researchers. Public confidence: encourages trust in the fairness and openness of judicial institutions. Issues Privacy: public broadcasting may expose sensitive personal information. Witness protection: recording vulnerable witnesses may affect their safety and willingness to testify. Misuse of recordings: edited clips can misrepresent judicial observations. Cybersecurity: court platforms and recordings may face hacking or manipulation. Digital divide: limited connectivity may restrict access to digital proceedings. Effect on proceedings: publicity may influence the conduct of participants in sensitive cases. Progress Gujarat High Court became a pioneer in live-streaming court proceedings in 2021 . The Supreme Court began live-streaming Constitution Bench proceedings in 2022 . As of January 2026 , live-streaming was operational in 11 High Courts , according to the Ministry of Law and Justice. (verify dates) Safeguards Restrict live-streaming in sensitive cases involving sexual violence, minors and protected witnesses . Develop uniform rules on recording, archiving and access. Strengthen cybersecurity and technical infrastructure. Protect the privacy of parties while preserving the principle of open justice."}, {"c": "19", "n": "Judiciary: Independence, Appointments, Collegium and Accountability", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Which Articles cover the Supreme Court, High Courts and Subordinate Judiciary? 124-147; 214-231; 233-237 Retirement ages of SC and HC judges? 65 years and 62 years Articles for removal of SC and HC judges? 124(4) and 217 Majority needed to remove a judge? Majority of total membership plus two-thirds of members present and voting, in each House Articles restricting discussion of judges' conduct? 121 (Parliament) and 211 (State Legislatures) Articles on contempt power of SC and HC? 129 and 215 Who is the Master of Roster? The Chief Justice of India Malfeasance, misfeasance, nonfeasance? Unlawful act done deliberately; lawful duty done improperly; duty not done Post-retirement examples in the handout? Gogoi (RS 2020), S. Abdul Nazeer (Governor AP 2023), Ashok Bhushan (NCLAT 2021) Proposed cooling-off period? Two to three years First Judges Case and holding? S. P. Gupta 1981: consultation is not concurrence; executive primacy Second Judges Case? 1993 SC Advocates-on-Record Assn: overruled first; CJI primacy with Collegium Third Judges Case: consultation sizes? SC: CJI + 4 senior-most; HC: CJI + 2 senior-most; transfer: 4 + Chief Justices of HCs Adverse opinions that block a name? Two members of the SC Collegium NJAC created by? 99th Amendment Act 2014 + NJAC Act 2014 NJAC members? CJI, 2 senior-most SC judges, Law Minister, 2 eminent persons (6) Who picks the eminent persons? PM, CJI and Leader of Opposition in Lok Sabha NJAC veto rule? Any two members could block a recommendation Fourth Judges Case? 2015, five-judge Bench struck down NJAC; Collegium restored Bar to judicial service ratio in HC? About two-thirds to one-third (convention
