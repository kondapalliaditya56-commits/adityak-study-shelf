es. Demographic performance still counts population control, but with lower weight. Contribution to GDP is new, recognising States' contribution to national output. Federal implication: the formula tries to balance equity, population needs and economic contribution, but debate over relative State shares continues. Grants-in-aid: about Rs 9.47 lakh crore recommended for 2026-31. Purpose Recommended amount Rural Local Bodies Rs 4,35,236 crore Urban Local Bodies Rs 3,56,257 crore Disaster Management Grants Rs 1,55,916 crore Total Rs 9,47,409 crore Important changes It discontinued the separate revenue deficit, sector-specific and State-specific grants of the 15th FC. It strengthened local body financing through basic and performance-linked grants. It recommended a Rs 2,04,401 crore disaster management corpus , including the States' contribution. It stressed fiscal discipline and transparent accounting of off-budget borrowings . Fiscal roadmap: Reduce the Union fiscal deficit to 3.5% of GDP by 2030-31 A State fiscal deficit limit of 3% of GSDP a year Bring off-budget borrowings onto government budgets Significance: more emphasis on local government financing, economic contribution and fiscal transparency. Note All 16th FC figures above come from the handout and are current-affairs items; verify before quoting in the exam."}, {"c": "18", "n": "Governor, Article 356, Fiscal Federalism and Inter-State Relations", "id": "3-gst-council-niti-aayog-special-category", "t": "3 · GST Council · NITI Aayog · Special Category Status · Fiscal Issues · Commissions", "x": "3 · GST Council · NITI Aayog · Special Category Status · Fiscal Issues · Commissions # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Centre State Relations handout pp. 26-31. Prelims PYQs quoted: none quoted in the material. In simple words GST (101st Amendment, 1 July 2017) is shared taxation run by a GST Council in which the Union has one-third of the votes and States two-thirds; decisions need three-fourths, so neither side can decide alone. The Mohit Minerals case (2022) held Council recommendations are not binding. NITI Aayog replaced the Planning Commission as a think tank. Special Category Status lost meaning after 2015. Fiscal grievances: cesses, CSS conditions, borrowing limits, off-budget borrowing and population-based devolution. Goods AND Services TAX AND Fiscal Federalism The 101st Constitutional Amendment Act, 2016 created a new framework of shared taxation between the Union and States. GST came into effect on 1 July 2017. Article 246A: gives Parliament and State Legislatures the power to make laws on GST, subject to its provisions. Article 269A: levy, collection and apportionment of IGST (Integrated GST) on inter-State supplies. Article 279A: sets up the GST Council . GST Council: composition GST Council: voting Union Finance Minister is Chairperson Union Government: one-third of the weighted votes Union Minister of State in charge of Revenue or Finance is a member States together: two-thirds of the weighted votes Finance or Taxation Ministers nominated by State Governments are members A decision that needs a vote must get at least three-fourths of the weighted votes of members present and voting Value addition Why this matters: with one-third and two-thirds, neither the Union nor the States together can force a decision alone. Three-fourths means the Union needs some States, and the States need the Union. Benefits of GST for federalism 1. Cooperative decision-making: a constitutional forum where the Centre and States jointly discuss indirect taxes. 2. Common national market: fewer tax barriers and less fragmentation of inter-State trade. 3. Tax harmonisation: common rules and rates across States. 4. Revenue coordination: a framework for sharing IGST and handling tax administration issues. Issues with GST federalism 1. Loss of tax autonomy: States gave up several independent indirect-tax powers. 2. Dependence on the GST Council: big rate or structure changes need Union-State negotiation. 3. Unequal revenue capacity: States with different economies may see different revenue results under one uniform tax. 4. Union influence: the Centre's voting weight and fiscal powers still matter in negotiations. Union of India v. Mohit Minerals Pvt. Ltd. (2022) The Supreme Court held that GST Council recommendations are not binding on Parliament and State Legislatures as a matter of constitutional law. Both levels have constitutionally recognised legislative powers over GST. The Council reflects cooperative federalism , based on dialogue and negotiation, not absolute command. Significance: protects States' legislative authority while recognising the need for a coordinated GST system. NITI Aayog The National Institution for Transforming India (NITI Aayog) was set up on 1 January 2015, replacing the Planning Commission. It is a non-constitutional and non-statutory policy think tank. Features: (1) policy think tank giving strategic and technical advice to Union and States (2) cooperative federalism through its Governing Council (3) competitive federalism through performance assessment, innovation and competition among States (4) bottom-up planning that brings State priorities into national strategy (5) research and innovation for evidence-based policy Basis Planning Commission NITI Aayog Established 1950 2015 Nature Central planning institution Policy think tank Approach Top-down planning Bottom-up consultation Primary role Five-Year Plans and resource allocation Policy advice, monitoring and coordination Financial powers Influenced Plan-related transfers Does not directly allocate Plan funds Federal approach Relatively centralised Cooperative and competitive federalism Significance: a platform for Centre-State consultation; involves States in national development priorities; encourages innovation through State indices and performance assessments; supports programmes such as the Aspirational Districts Programme. Limitations: (1) no independent financial authority , unlike the Planning Commission (2) advisory role , not binding on ministries or States (3) limited State influence : States take part in consultation without necessarily deciding final policy (4) institutional overlap with Union ministries and other intergovernmental bodies Way forward: strengthen its role in evidence-based policy, State consultation, programme evaluation and cooperative federalism. Special Category Status OF States Special Category Status (SCS) came under the planning framework to give preferential Central assistance to States with geographic, economic and infrastructure disadvantages. It has no independent constitutional or statutory basis. Criteria historically considered: Hilly and difficult terrain Low population density or large tribal population Strategic location on international borders Economic and infrastructural backwardness Non-viable State finances Earlier benefits: Preferential Normal Central Assistance 90:10 grant-loan ratio for certain Plan assistance (general States got less favourable terms) Higher Central support for specified schemes Tax concessions and other incentives under applicable policies Changes after 2015 The Planning Commission was replaced by NITI Aayog. The system of Normal Central Assistance was discontinued . The 14th Finance Commission increased untied tax devolution to States. So the old planning-based difference between Special Category and general States lost much of its meaning. Important distinction: SCS is different from the special constitutional provisions in Articles 371 to 371J . Raghuram Rajan Committee (2013) recommended replacing the old classification with a Composite Development Index, classing States as relatively developed, less developed and least developed, so assistance matches development need and backwardness. Contemporary relevance: demands for SCS continue because of worries about regional inequality and State fiscal capacity. Issues IN Centre-state Financial Relations 1. Vertical fiscal imbalance. The Union controls a large share of tax revenue while States do major spending on health, education, infrastructure and welfare. Implications: dependence on Central transfers and grants; limited freedom to fund State priorities; difficulty meeting rising spending commitments. Way forward: more predictable tax devolution, untied transfers and State revenue mobilisation. 2. Rising cesses and surcharges. The Union increasingly relies on them, and their proceeds are generally outside the divisible pool. Implications: reduces the effective shareable revenue Weakens the effect of higher nominal devolution Increases Union discretion over spending. Way forward: rationalise cesses and surcharges and improve transparency 3. Unequal fiscal capacity among States. Richer States have stronger revenue bases Poorer States have higher needs but lower capacity Hilly, forested and sparsely populated States face higher costs of delivering services. Way forward: keep equalisation-based transfers while recognising geography, demographic performance and economic contribution 4. Conditional grants and Centrally Sponsored Schemes. Funds often come with matching contributions, spending conditions and guidelines. Implications: less flexibility on State priorities Fiscal pressure on weaker States Duplication of Union and State programmes. The NITI Aayog Sub-Group of Chief Ministers recommended rationalising CSS and giving States more flexibility. Way forward: more untied assistance and freedom in implementation 5. GST and loss of revenue autonomy. GST replaced several independent State taxes with a common framework. Implications: less freedom to change rates; dependence on GST Council decisions; revenue uncertainty when collections fall short. Way forward: stronger consultation, better compliance, predictable revenue-sharing. 6. State borrowing restrictions (Article 293). States may borrow within India subject to constitutional conditions. States with outstanding Union loans or Union guarantees generally need Central consent for more borrowing. Fiscal deficit limits also operate through fiscal responsibility frameworks. Issues: restrictions reduce the ability to respond to slowdowns and emergencies Disputes over the treatment of off-budget borrowing and State-owned entities Uniform limits ignore different fiscal capacity. Way forward: transparent and predictable borrowing rules with discipline and reasonable flexibility 7. Off-budget borrowings and hidden liabilities. States may borrow through public enterprises, guarantees and special purpose vehicles, keeping some liabilities out of their ordinary budgets. Implications: understates the true fiscal burden Less transparency and accountability Future debt-servicing risk. The 16th FC recommended stricter accounting and counting them in fiscal indicators 8. Uncertainty and delays in transfers. Late or short Central transfers upset State budgeting and programmes. Implications: welfare and infrastructure disruption More short-term borrowing Weak long-term planning. Way forward: timely release, predictable schedules and transparent reporting 9. Finance Commission and population-based distribution. More reliance on the 2011 Census worries States that slowed their population growth. States' argument: Successful family planning should not reduce financial support Demographic performance reflects investment in health, education and women's empowerment Population-based distribution can shift the balance between equity and performance Counterargument: more populous States also have greater spending needs and more people to serve. Way forward: balance population, income distance, demographic performance and development needs. 10. Fiscal competition and populist spending. States face pressure to give subsidies, welfare benefits and electoral promises while keeping fiscal discipline. Concerns: rising subsidies squeeze capital expenditure and essential services Persistent revenue deficits raise borrowing Differences in fiscal capacity mean unequal ability to fund welfare. Way forward: better spending efficiency, separate productive welfare spending from poorly targeted subsidies, and strengthen medium-term fiscal planning Commission Recommendations ON Fiscal Federalism Sarkaria Commission: fair and predictable transfers to States; restraint in using non-shareable revenue (cess, surcharge); the Finance Commission's constitutional role in resource distribution; dialogue with States on fiscal matters affecting them. Punchhi Commission: Concern at growing reliance on cesses and surcharges in the divisible pool Stronger institutional support and State participation in financial decisions Rationalise Centrally Sponsored Schemes with more State flexibility Support State-specific fiscal approaches in borrowing Stronger consultation on transfers and national fiscal policy Raghuram Rajan Committee (2013): A Composite Development Index Allocate resources by development need, not old State classifications Assist less developed States Way forward 1. Strengthen fiscal autonomy: predictable tax devolution and untied grants. 2. Rationalise cesses and surcharges: transparency and protect States' effective share. 3. Improve horizontal equity: balance population, income distance, geographic disadvantage and demographic performance. 4. Reform Centrally Sponsored Schemes: more State flexibility in design and implementation. 5. Strengthen fiscal institutions: better coordination among the Finance Commission, GST Council, NITI Aayog and State Finance Commissions. 6. Ensure responsible borrowing: discipline with State-specific needs recognised. 7. Promote transparency: bring off-budget borrowing and contingent liabilities into fiscal reporting. 8. Strengthen local governments: predictable grants and more financial capacity for Panchayats and Municipalities. Way forward / key point Conclusion: fiscal federalism balances national development with State autonomy. The aim is equitable distribution, fiscal discipline and more State flexibility. Stronger financial institutions and cooperative decision-making can cut regional disparities and strengthen India's federal structure."}, {"c": "18", "n": "Governor, Article 356, Fiscal Federalism and Inter-State Relations", "id": "4-inter-state-relations-water-disputes-bou", "t": "4 · Inter-state Relations · Water Disputes · Boundaries · Language · Articles 371-371J", "x": "4 · Inter-state Relations · Water Disputes · Boundaries · Language · Articles 371-371J # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Centre State Relations handout pp. 31-36. Prelims PYQs quoted: none quoted in the material. In simple words Inter-State relations cover how States deal with each other: courts and records (Art 261), rivers (Art 262), boundaries (Art 3, Art 131), trade (Arts 301-307), language (Arts 343-351) and special regional provisions (Arts 371-371J, Sixth Schedule). Water disputes (Cauvery, Krishna, Ravi-Beas) and boundary disputes (Belagavi, Assam-Meghalaya) are the main problems and tribunals alone do not solve them. Constitutional Framework Inter-State relations are the constitutional, political and administrative relationships among States. They matter because States share rivers, transport networks, markets, natural resources and cultural links. Article Provision 131 Supreme Court's original jurisdiction in specified Union-State and inter-State disputes 261 Full Faith and Credit Clause 262 Adjudication of inter-State river water disputes 263 Inter-State Council 301-307 Freedom of trade, commerce and intercourse 3 Formation of new States and alteration of boundaries Full Faith and Credit Clause (Article 261) Full faith and credit must be given throughout India to the public acts, records and judicial proceedings of the Union and States. Public acts and records: official acts and records are recognised across the country. Judicial proceedings: final judgments and orders of civil courts can be executed anywhere in India, as per law. Significance: legal uniformity, mutual recognition and administrative integration. Inter-state Water Disputes River disputes are among the most lasting challenges to cooperative federalism. They arise over water allocation, dam construction, irrigation, drinking water and competing development needs. Article 262: Parliament may provide for adjudication of disputes about the waters of inter-State rivers and river valleys. It may also exclude the jurisdiction of the Supreme Court and other courts over such disputes, to the extent the law provides. Inter-State River Water Disputes Act, 1956: Provides for Water Disputes Tribunals A State may ask the Union to refer a dispute for adjudication If negotiation fails and statutory conditions are met, a tribunal may be constituted Decisions published under the Act have binding legal effect River Boards Act, 1956: provides for River Boards to regulate and develop inter-State rivers and support integrated development. But the statutory River Board mechanism has not been effectively operationalised . Dispute States involved Major issue Cauvery Karnataka, Tamil Nadu, Kerala, Puducherry River water allocation and seasonal releases Krishna Maharashtra, Karnataka, Telangana, Andhra Pradesh Allocation and redistribution of river waters Ravi-Beas Punjab, Haryana, Rajasthan Water sharing and the Sutlej-Yamuna Link Canal Mahadayi Goa, Karnataka, Maharashtra Water diversion and competing regional needs Mahanadi Odisha, Chhattisgarh Upstream use and downstream availability Why are these disputes so hard to settle? 1. Delay in tribunal proceedings: complex investigation, litigation and procedure prolong disputes. 2. Weak enforcement: even after an award, disagreement continues over actual releases. 3. Politicisation: water becomes linked to regional identity, elections and State autonomy. 4. Poor data sharing: disputes over rainfall, river flows and reservoir storage reduce trust. 5. Fragmented river management: States plan irrigation and dams separately instead of using a river-basin approach . 6. Climate change: irregular rain, drought and water stress sharpen competing demands. Example: the Cauvery dispute It concerns sharing of Cauvery waters among Karnataka, Tamil Nadu, Kerala and Puducherry. The Cauvery Water Disputes Tribunal gave its final award in 2007 . In 2018 the Supreme Court modified parts of the allocation, keeping the overall framework of 740 TMC ft in a normal water year . The Cauvery Water Management Authority (CWMA) and Cauvery Water Regulation Committee (CWRC) help implement it. Federal significance: tribunal awards alone are not enough without institutional coordination, reliable data and political cooperation. Proposed reforms: Inter-State River Water Disputes (Amendment) Bill, 2019 Disputes Resolution Committee: try negotiation before a tribunal. Single tribunal: a permanent tribunal with several benches instead of a separate tribunal for each dispute. Time-bound resolution: measures to cut procedural delay. Data management: better collection and upkeep of river-basin data. Important: these are proposals in the 2019 Bill , not an already working permanent tribunal system. Way forward: Early dialogue and mediation Time-bound adjudication Transparent flow and reservoir monitoring Integrated river-basin management Climate adaptation in allocation Better coordination to implement awards Inter-state Boundary Disputes Boundary disputes come from historical claims, linguistic identities, administrative boundaries and competing territorial demands. Article 3: Parliament may alter the area, boundaries and names of States by law. The affected State Legislature must be given an opportunity to express its views , but its consent is not constitutionally mandatory . Article 131: the Supreme Court has original jurisdiction in specified disputes between the Union and States or between States, where legal rights are involved. Major disputes Maharashtra-Karnataka: Centres on areas including Belagavi , with linguistic and territorial claims Shows the continuing effect of linguistic reorganisation and regional identity Assam-Meghalaya: Long-standing disputes on several stretches of the shared boundary. A Memorandum of Understanding (2022) settled six of twelve areas of difference The rest need negotiation and demarcation Assam-Arunachal Pradesh: historical boundary disputes affecting many villages. A 2023 MoU sought to settle disputes about 123 villages . Major issues: Different readings of colonial-era boundaries Territorial demands based on language and culture Competing claims over policing, land records and services Boundary disputes can inflame regional sentiment Settlement can take decades Way forward: Bilateral negotiation between States The Union facilitates without needless interference Scientific demarcation using reliable maps, surveys and land records Stronger Zonal Councils Protect the interests of people living in disputed areas Language AND Indian Federalism Language has shaped India's territorial reorganisation, regional identity and Centre-State relations. The Constitution tries to balance national communication with linguistic diversity. Article Provision 343 Hindi in Devanagari script is the official language of the Union 345 Official language or languages of a State 346 Language for communication between States and the Union 347 Recognition of a language spoken by a substantial section of a State's population 350 Right to submit representations for redress of grievances in a language used in the Union or State 350A Mother-tongue instruction at the primary stage for linguistic minority children 350B Special Officer for Linguistic Minorities 351 Directive for the development of the Hindi language Value addition Important: India has no constitutionally declared national language . Hindi is the official language of the Union, while English continues for Union official purposes under the applicable legal framework. Issues in language federalism 1. Hindi imposition concerns: several States, especially in the south, oppose what they see as imposing Hindi. 2. Educational autonomy: disputes on language policy, school education and medium of instruction. 3. Linguistic minorities: small language communities may lack education and public services in their mother tongue. 4. Administrative barriers: language differences affect recruitment, public communication and access to government. 5. Regional identity: language is tied to culture, political mobilisation and demands for autonomy. Way forward: Respect linguistic diversity and protect language rights Flexible education policy Protect linguistic minorities Multilingual administration Consult before unilateral decisions on State language policy Federal significance: accommodating language turns regional diversity into a source of national integration rather than conflict. Asymmetric Federalism: Articles 371 TO 371J Asymmetric federalism means different States or regions have different powers, protections or administrative structures. India adopted it to accommodate historical, cultural, tribal and geographic diversity. Article State(s) Major provision 371 Maharashtra, Gujarat Special responsibilities for development boards and regional development 371A Nagaland Protection of specified customary, social and land-related matters 371B Assam Committee of the Legislative Assembly for specified tribal areas 371C Manipur Special arrangements for administration of hill areas 371D Andhra Pradesh, Telangana Equitable opportunities in public employment and education 371F Sikkim Special constitutional protections after its integration 371G Mizoram Protection of specified customary and land-related matters 371H Arunachal Pradesh Governor's special responsibility for law and order 371I Goa Minimum size of the Legislative Assembly 371J Karnataka Special provisions for the development of the Kalyana Karnataka region Sixth Schedule: provides Autonomous District and Regional Councils in specified tribal areas of Assam, Meghalaya, Tripura and Mizoram. They exercise specified powers on local administration, customary practices, land and community affairs, subject to the Constitution. Significance: (1) protects diversity of cultural, tribal and historical identities (2) regional autonomy with governance arrangements suited to local needs (3) national integration by accommodating regional aspirations within the Union (4) conflict management of sensitive regional demands through constitutional means Challenges: (1) unequal powers may spark demands for similar benefits from other States (2) administrative complexity from overlap among elected governments, Governors and autonomous institutions (3) special arrangements do not automatically ensure better development (4) changes to special provisions may raise fears about identity and autonomy Way forward: keep the aim of regional accommodation while strengthening democratic accountability, institutional coordination and equitable development. Major Challenges IN Inter-state Relations AND WAY Forward Challenges 1. Competition over natural resources: rivers, forests and energy. 2. Regionalism and linguistic tensions: cultural and territorial disputes can turn political. 3. Unequal development: intensifies competition for investment and Central aid. 4. Weak dispute resolution: delays in negotiation and adjudication. 5. Limited institutional coordination: infrequent meetings and weak follow-up of inter-State forums. 6. Migration and labour mobility: different regional opportunities and policies can cause social tension involving migrant workers. 7. Climate change: shared environmental risks need neighbouring States to coordinate. Way forward 1. Strengthen the Inter-State Council for dialogue and early settlement. 2. Revitalise Zonal Councils for boundary disputes, infrastructure planning and shared administrative concerns. 3. Reform water dispute resolution: data-sharing, tribunal efficiency, implementation of awards. 4. Promote economic integration: free and non-discriminatory inter-State trade. 5. Protect linguistic and cultural diversity within constitutional guarantees. 6. Strengthen regional autonomy under asymmetric arrangements. 7. Promote cooperative federalism: solve shared problems by negotiation instead of prolonged confrontation. Way forward / key point Conclusion: inter-State cooperation matters as much as Centre-State coordination for Indian federalism. Effective institutions, respect for regional diversity and fair dispute resolution can strengthen national integration without weakening State autonomy."}, {"c": "18", "n": "Governor, Article 356, Fiscal Federalism and Inter-State Relations", "id": "5-challenges-to-federalism-emerging-issues", "t": "5 · Challenges TO Federalism · Emerging Issues · Reforms · Commissions · Assessment", "x": "5 · Challenges TO Federalism · Emerging Issues · Reforms · Commissions · Assessment # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Centre State Relations handout pp. 36-42. Prelims PYQs quoted: none quoted in the material. In simple words Federalism is challenged by political, legislative, administrative and financial centralisation and by weak coordination bodies. Emerging issues are delimitation, climate, public health, migration and weak local government. Reform needs restraint in using constitutional offices, real consultation, fair finance and decentralisation below the State. Four commissions (Rajamannar, Sarkaria, NCRWC, Punchhi) shaped the debate. Major Challenges TO Indian Federalism The challenges can be seen under five heads: political, legislative, administrative, financial and institutional. 1. Political centralisation Dominance of national parties: major parties often have a centralised high command. Decisions on leadership, policy and candidate selection are taken nationally, reducing State-level autonomy. Different parties at Centre and States: political differences turn constitutional disagreements into long conflicts (Governors, Central agencies, financial transfers). Weak regional representation: the Rajya Sabha represents States, but party discipline and national priorities can override State-specific concerns. Unequal bargaining: States whose parties are influential coalition partners may get more political influence than others. Federal implication: political centralisation can weaken State autonomy even without any formal change in the constitutional division of powers. 2. Legislative centralisation Encroachment on State subjects: the Union may use broad entries in the Union or Concurrent Lists to legislate on matters close to State responsibilities. Example: the Farm Laws 2020 raised questions about Parliament's authority over agricultural markets. Dominance over the Concurrent List: under Article 254, Central law generally prevails over conflicting State law. Inadequate consultation: States may have little say in laws on education, agriculture, labour and other shared subjects. Delays in assent: disputes under Articles 200 and 201 can delay laws passed by elected State Legislatures. International agreements: the Union's Article 253 power may affect State subjects without enough State involvement in treaty talks. Federal implication: concern about the balance between national uniformity and State legislative autonomy. 3. Administrative centralisation Broad Union directions: Articles 256 and 257 let the Centre give binding directions. All-India Services: disputes over central deputation, transfers and cadre management affect State control. Central investigating agencies: States withdrawing general consent for the CBI shows disagreement over investigative jurisdiction. Deployment of Central forces: expansion of BSF jurisdiction raised concerns about the division of responsibility between national security agencies and State Police. Union ministries on State subjects: involvement in agriculture, health and local governance can help coordination but reduce State policy flexibility. Federal implication: coordination turns problematic when Union supervision is seen as interference. 4. Financial dependence Vertical imbalance: States carry big expenditure responsibilities but depend on the Union for much of their money. Cesses and surcharges: being outside the divisible pool, they reduce what is shared. Conditional grants: Centrally Sponsored Schemes can limit States' freedom to set spending priorities. GST and tax autonomy: States have less independent control over several indirect taxes and must negotiate changes in the GST Council. Borrowing restrictions: disputes over Article 293, fiscal deficit limits and off-budget borrowing. Federal implication: States may have constitutional duties without enough independent resources to perform them. 5. Weak intergovernmental institutions Infrequent meetings: the Inter-State Council has not been a regular forum. Advisory nature: recommendations of the Inter-State and Zonal Councils are generally not binding. Weak follow-up: limited monitoring reduces effect. No general pre-legislative consultation duty: nothing requires consultation through the Inter-State Council before every law affecting States. Institutional overlap: NITI Aayog Governing Council, GST Council and other forums handle different aspects of coordination, not always in an integrated way. Federal implication: weak consultation pushes disputes from negotiation to political confrontation or litigation. Emerging Challenges TO Indian Federalism Delimitation and political representation Delimitation is readjusting the allocation of seats and boundaries of constituencies on the basis of population. It affects the balance of political representation among States. Constitutional framework: Articles 81 and 82 (Lok Sabha seats and readjustment after a Census) Article 170 (State Assemblies) The 42nd Amendment (1976) froze the inter-State allocation of parliamentary seats on the 1971 Census The 84th Amendment (2001) extended the freeze until figures of the first Census after 2026 The 87th Amendment (2003) allowed boundaries to be readjusted using the 2001 Census without changing the State-wise seat allocation Federal issues: (1) States with lower population growth fear a fall in their share of seats (2) higher-population States may gain (3) changed representation can alter regional bargaining power in Parliament (4) delimitation must also fix unequal population per constituency to keep equal representation (5) women's reservation under the 106th Amendment is tied to the delimitation framework Constitution (131st Amendment) Bill, 2026 Introduced in the Lok Sabha on 16 April 2026 . Proposals: Raise the maximum Lok Sabha strength from 550 to 850 Up to 815 seats from States and 35 from Union Territories Allow delimitation using a Census specified by parliamentary law Help carry out women's reservation through the proposed delimitation framework Outcome: the Bill was defeated in the Lok Sabha on 17 April 2026 and did not become law. (current affairs; verify) Federal significance: the debate shows how hard it is to balance population-based representation, demographic performance and State political interests. Way forward: broad political consultation, transparent criteria and safeguards against avoidable regional imbalance. Climate change and environmental federalism Climate change needs cooperation across State boundaries. Issues: Air pollution, river pollution and forest degradation cross State borders Floods, droughts and heatwaves need Union-State coordination Himalayan, coastal and drought-prone States face different risks States may lack money for adaptation and disaster mitigation Example: air pollution in Delhi-NCR needs coordination among Delhi, Haryana, Punjab, Uttar Pradesh and Union authorities. Way forward: Inter-State environmental coordination River-basin and airshed based planning Enough funding for adaptation and disaster management State flexibility in climate policy Public health federalism Public health is mainly a State List subject, but major health emergencies need national coordination. Issues: States run health services while the Union gives policy, funds and technical coordination COVID-19 showed the need to balance national measures with State health needs States differ in hospitals, staff, money and disease surveillance Uniform Central guidelines may not suit regional conditions Way forward: cooperative planning, disease surveillance, financial support and State implementation capacity. Migration and regional mobility Migration links State economies but can also create political and administrative tension. Issues: Job competition can fuel demands for local preference Migrants may face discrimination or social barriers Workers need portable welfare benefits Labour protection involves several governments Way forward: promote labour mobility, portable benefits, protection of migrant workers and cooperation between source and destination States. Federalism and local self-government The 73rd and 74th Amendments (1992) strengthened Panchayats and Municipalities, but decentralisation is incomplete in many States. Issues: (1) incomplete devolution : many local bodies lack functions, funds and functionaries (2) financial dependence on State and Central transfers (3) weak State Finance Commissions , delayed in constitution and in acting on recommendations (4) administrative control : State departments keep tasks that elected local governments could do (5) parallel institutions such as development authorities work outside normal local democratic accountability Federal significance: stronger federalism needs decentralisation below the State level, not only more State autonomy from the Union. Strengthening Cooperative AND Competitive Federalism Institutional reforms 1. Revitalise the Inter-State Council: Regular meetings Consultation, coordination and dispute resolution 2. Strengthen Zonal Councils: boundary disputes, infrastructure, security and regional development. 3. Set up sectoral forums: regular Union-State consultation on health, education, agriculture, industry and environment. 4. Improve follow-up: clear mechanisms to review implementation of intergovernmental recommendations. Legislative reforms 1. Respect State legislative powers: avoid needless intervention in State List subjects. 2. Consult on Concurrent List laws: meaningful consultation before laws affecting States. 3. Protect State-specific legislation: use Article 254(2) appropriately where States need flexibility. 4. Strengthen the Rajya Sabha: more weight to State interests in national lawmaking. 5. Consult States on international agreements that affect their responsibilities. Administrative reforms 1. Restrained Union directions: use Articles 256 and 257 only where constitutionally necessary. 2. Reform the Governor's office: political neutrality, security of tenure and clear limits on discretion. 3. Improve All-India Service management: transparent deputation, cadre allocation and personnel policies. 4. Security coordination: better cooperation between Central agencies and State Police. 5. Reduce administrative overlap: clear responsibilities under Centrally Sponsored Schemes and shared programmes. Financial reforms 1. Predictable transfers: timely and transparent devolution and grants. 2. Rationalise cesses and surcharges to protect the divisible pool. 3. More untied grants so States set their own development priorities. 4. Equitable horizontal distribution: recognise income distance, population, demographic performance and geographic disadvantage. 5. Responsible borrowing: discipline with reasonable flexibility. 6. Strengthen local finances: better State Finance Commissions and transfers to local bodies. Political and administrative decentralisation 1. Internal party democracy: strengthen regional leadership and State-level decisions within national parties. 2. Respect constitutional conventions: do not use constitutional offices for partisan advantage. 3. Greater State participation: involve Chief Ministers and State institutions in national policy. 4. Strengthen local governments: real devolution of functions, funds and functionaries. Major Commissions ON Centre-state Relations Rajamannar Committee (1969). Appointed by the Tamil Nadu Government to study Centre-State relations and suggest more State autonomy. Recommendations: Reduce excessive concentration of legislative and administrative power at the Centre Transfer residuary legislative powers to States Reconsider the Concurrent List Strengthen States' independent financial resources Set up an effective Inter-State Council Significance: an early systematic demand for decentralisation and State autonomy. Sarkaria Commission (1983-88). Appointed by the Union Government under Justice R. S. Sarkaria. It accepted the need for a strong Centre but warned against over-centralisation. Recommendations: Consult States before legislating on Concurrent List subjects Keep residuary taxation with the Union and put other residuary matters in the Concurrent List Appoint an eminent, politically detached Governor after consulting the State Article 356 only as a last resort, with warnings and safeguards A permanent Inter-State Council under Article 263 Fair transfers and avoid needless use of non-shareable revenue Significance: tried to improve cooperation within the existing framework, not redesign the Union. NCRWC (2002). Chaired by Justice M. N. Venkatachaliah. Recommendations: A more consultative process for appointing Governors involving Union and State representatives Protect the Governor's independence and constitutional role Better institutional cooperation and respect for federal principles Stronger safeguards against misuse of Article 356 Better democratic decentralisation and accountability Significance: stressed constitutional conventions, institutional neutrality and effective federal cooperation. Punchhi Commission (2007-10). Chaired by Justice M. M. Punchhi. It studied Centre-State relations in the context of coalition politics, economic reforms, internal security and changing governance. Recommendations: Structured consultation with States before Central laws on the Concurrent List Involve States in treaties affecting their responsibilities Fixed tenure, independence and an impeachment-type removal for Governors Clearer procedures for Articles 200 and 201 delays Treat Articles 256 and 257 directions as last resort Strengthen the Inter-State Council Review how cesses, surcharges and Centrally Sponsored Schemes affect State autonomy Consult States better before deploying Central forces Significance: favoured stronger State participation and more effective institutions for modern federal problems. Memory aid · RSNP R ajamannar 1969 → S arkaria 1983 → N CRWC 2002 → P unchhi 2007: the order of the four commissions (own mnemonic) Overall Assessment OF Indian Federalism Indian federalism has moved from a largely centralised system after Independence to a more complex arrangement with regional political assertion, economic competition and intergovernmental bargaining. Strengths Continuing weaknesses National integration: a strong Union keeps political and territorial unity Political centralisation: national party structures and constitutional offices can weaken State autonomy Regional autonomy: States have protected legislative and administrative responsibilities Fiscal dependence: States rely on Union transfers for major spending duties Accommodation of diversity: linguistic reorganisation, asymmetric provisions, regional institutions Weak consultation: important decisions without enough State participation Judicial protection: federalism recognised as basic structure Inter-State disputes: water, boundary and resource disputes remain hard to settle Institutional cooperation: Finance Commission, GST Council, Inter-State Council, NITI Aayog Incomplete decentralisation: Panchayats and Municipalities often lack powers and resources Way forward. The goal is not to weaken the Union or give States unrestricted powers, but to get a proper balance between national coordination and regional autonomy. This needs: Constitutional restraint by each level within its powers. Cooperative institutions: stronger consultation and dispute resolution. Fiscal fairness: predictable and equitable resources. Political neutrality: no misuse of constitutional offices and institutions. Democratic decentralisation: strengthen both State governments and local self-government. Mutual trust: replace needless confrontation with negotiation and shared responsibility. Way forward / key point Conclusion: Indian federalism is a dynamic system shaped by constitutional principles, politics and changing economic needs. Its strength is combining national unity with regional diversity. Its future depends on strengthening cooperative and competitive federalism, protecting State autonomy and making constitutional institutions work with restraint and mutual respect."}, {"c": "18", "n": "Governor, Article 356, Fiscal Federalism and Inter-State Relations", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Governor appointed under / term Article 155 / Article 156 (five years, at the President's pleasure) Governor eligibility Indian citizen, at least 35 years (Art 157) Governor takes oath before Chief Justice of the High Court (Art 159) B. P. Singhal 2010 held Governor can be removed without reasons but not arbitrarily; change of Centre alone is not enough Nabam Rebia 2016 Governor cannot summon or dissolve independently of ministers' advice President's Rule approval and duration Both Houses within 2 months; 6 months, extendable to max 3 years Bommai 1994: bench /
