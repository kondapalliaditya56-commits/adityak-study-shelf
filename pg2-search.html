in the handout · Fundamental Rights 2 handout pp. 22-26. Prelims PYQs quoted: none quoted in the material. In simple words Arts 23 and 24 bind both the State and private persons and cover citizens and non-citizens. PUDR and Bandhua Mukti Morcha widened forced labour. Buddhadev Karmaskar (2022) gave sex workers equal protection. The 2016 child-labour law bans work under 14, with family and entertainment exceptions. Article 23 Value addition Arts 23-24 are available to citizens and non-citizens and are enforceable against the State and private individuals . Provision 23(1): Bans traffic in human beings, begar and similar forced labour Punishable by law 23(2): State may impose compulsory service for public purposes without discrimination only on religion, race, caste or class The Article is a prohibition Offences come from statutes Judicial interpretation Begar: Unpaid service by coercion Forced labour: work against free will through physical, economic or other pressure PUDR v. Union of India (1982): Pay below minimum wage can be forced labour Economic compulsion counts Protects workers against public and private employers Bandhua Mukti Morcha (1984): Bonded labour State must identify, release, rehabilitate Laws Bonded Labour System (Abolition) Act, 1976 Immoral Traffic (Prevention) Act (ITPA), 1956 BNS, 2023 on trafficking and exploitation Trafficking AND SEX WORK ITPA 1956 prohibits brothel keeping , living on earnings of another's prostitution, procuring or inducing , detaining persons, public solicitation Voluntary adult sex work is not itself an offence Trafficking, exploitation, brothel activity and solicitation remain punishable trafficking (recruitment, transport, harbouring, receipt by prohibited means for exploitation) must be distinguished from voluntary adult sex work For legalisation / decriminalisation better regulation spot trafficking and coercion lower STD and HIV risk labour rights access to justice against violence remove middlemen better living conditions Against may raise demand and trafficking commodification of women ethical concerns prefer rehabilitation and livelihoods poverty limits free choice patriarchal police attitudes Models cited Germany, Denmark, New Zealand use different regulation or decriminalisation models Note Budhadev Karmaskar v. State of West Bengal (2022): sex workers are entitled to equal protection of law ; Art 21 dignity covers them and their children. Directions: police must not interfere with consenting adult sex work; take sexual-assault complaints seriously; no physical or verbal abuse ; protect identity in raids; children not separated from mothers merely for occupation. Trafficking offences remain. Article 24: Child Labour Provision \"No child below fourteen shall be employed in any factory or mine or other hazardous employment \" Applies to public and private employers Child and Adolescent Labour (Prohibition and Regulation) Act, 1986 original: Banned children only in listed hazardous work Permitted other work under rules: clashed with Art 21A 2016 amendment: bans work under 14 in all occupations , with exceptions: family enterprise (non-hazardous, after school or in vacations) and the audio-visual entertainment industry (artists in ads, films, TV, sports; not circus ) new category Adolescents (14-18) : barred from mines, inflammable substances or explosives, specified hazardous processes Issues family exception hard to monitor conflict with education where families need earnings adolescents exposed to dangerous work outside the schedule poverty : ban alone fails enforcement: inspections, rehabilitation and schooling of rescued children Way forward / key point 21A vs 24: 21A gives the right to education (6-14) ; 24 protects against hazardous work (under 14) ; the 2016 Act extends the statutory ban to all occupations with exceptions."}, {"c": "10", "n": "Death Penalty, Articles 21A, 22, 23 and 24", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Rarest of rare source Bachan Singh 1980 Machhi Singh factors manner, motive, anti-social, magnitude, vulnerability 262nd Report abolish except terror and waging war Art 161 limit Governor cannot pardon in death cases Shatrughan Chauhan 2014 delay and mental illness can justify commutation BNSS 475 14 years minimum before release in specified cases Sriharan 2015 clemency vs remission; special life term Vishakha 1997 harassment guidelines; POSH Act 2013 Internal Committee threshold 10 or more employees Nagaraja 2014 Jallikattu ban upheld; biocentric view 2023 Jallikattu case State amendments upheld by five judges Art 21A inserted by 86th Amendment 2002; in force 1 April 2010 Art 45 now early childhood care below six Ordinary arrest rights ILPM Time to Magistrate 24 hours Arnesh Kumar 2014 police must justify arrest; up to seven years Pankaj Bansal 2023 grounds in writing (PMLA) 22(3) exceptions enemy aliens, preventive detainees Advisory Board limit three months 44th Amendment 1978 changes two months, never in force Entry for preventive detention Union List 9 and Concurrent List 3 NCRWC cap six months Laws in force COFEPOSA, NSA, PBM Act Arts 23 and 24 apply against State and private persons PUDR 1982 below minimum wage can be forced labour Bandhua Mukti Morcha 1984 bonded labour release and rehabilitation Bonded Labour Act year 1976 ITPA year 1956 Is voluntary adult sex work an offence? not itself, under ITPA Buddhadev Karmaskar 2022 equal protection, dignity for sex workers Adolescent age band 14 to 18 Child labour exceptions 2016 family enterprise and audio-visual entertainment (not circus)"}, {"c": "10", "n": "Death Penalty, Articles 21A, 22, 23 and 24", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts in Start Here)"}, {"c": "10", "n": "Death Penalty, Articles 21A, 22, 23 and 24", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards"}, {"c": "11", "n": "Religion, Secularism, Minorities and the Waqf Act", "id": "1-articles-25-26-conversion-essential-reli", "t": "1 · Articles 25-26 · Conversion · Essential Religious Practices · Temples", "x": "1 · Articles 25-26 · Conversion · Essential Religious Practices · Temples # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Fundamental Rights 2 handout pp. 26-30. Prelims PYQs quoted: none quoted in the material. In simple words Art 25 protects conscience and the right to profess, practise and propagate, but propagation is not a right to convert (Stainislaus). Art 26 protects denominations. Courts use the Essential Religious Practices test, with Santhara, Sabarimala and temple control as live examples. FOUR Articles AT A Glance Art Protects 25 freedom of conscience; profess, practise, propagate religion 26 freedom to manage religious affairs 27 no tax for promoting a particular religion 28 religious instruction and worship in educational institutions Article 25 AND Conversion Art 25 subject to public order, morality, health and other Fundamental Rights State may regulate economic, financial, political and other secular activity linked to religion and make welfare and reform laws Note Rev. Stainislaus v. State of Madhya Pradesh (1977): right to propagate does not include a Fundamental Right to convert another person ; upheld laws against conversion by force, fraud or inducement . Criticisms propagation becomes a hollow right religion is a matter of conscience allurement is hard to define burden of proof on voluntariness State laws Several States ban conversion by force, fraud, coercion, some inducement Some need notice or declaration Gujarat Freedom of Religion (Amendment) Act, 2021: Linked conversion with interfaith marriage Reporting and investigation Gujarat HC stayed parts on interfaith marriage without proof of force, fraud or allurement Issue: State may stop forced conversion but not intrude on conscience, privacy, choice Article 26 AND Essential Religious Practices Art 26 denominations may establish and maintain institutions , manage religious affairs , and own and administer property as per law (26(c), (d)) ERP doctrine (Shirur Mutt, 1954) is it essential or integral to the religion? within protected religious affairs? subject to public order, morality, health, other rights ? religious or really a secular activity the State can regulate? Memory aid · EPSR ERP test: E ssential part? · P rotected sphere? · S ubject to limits? · R eligious or secular? (own mnemonic) Issues with ERP courts lack theological competence may privilege some practices black-and-white answers on diverse beliefs Reform vs autonomy Balance religious freedom, equality, constitutional morality, reform LIVE Examples Santhara (Nikhil Soni, 2015) Rajasthan HC declared the Jain fast-to-death unlawful, not an ERP Supporters: spiritual discipline, not suicide , autonomy SC stayed the judgment in 2015, so the HC ban is not operative 2016 Haji Ali Dargah: Bombay HC upheld women's right to enter the inner sanctum 2016 Shani Shingnapur: Bombay HC stressed women's access; women entered 2018 Sabarimala: SC 4:1 held exclusion of women of menstruating age unconstitutional 2019 review: larger questions on religious freedom and ERP referred to a larger Bench 2026 nine-judge bench heard the reference; reserved judgment May 2026 (verify) Four competing dimensions individual vs State individual vs individual group vs State State regulation in public interest Loudspeakers and Azaan (Allahabad HC, 2020) Azaan is religiously significant but loudspeakers are not essential Azaan by human voice continues Loudspeakers can be regulated for noise pollution Religious Property AND Temple Management Shirur Mutt principles religious autonomy in protected affairs State may regulate economic, financial, administrative activity donations, accounts, property can be regulated but no excessive interference (judicial review) For regulation Against excess regulation financial transparency and accountability weakens religious autonomy stops misuse of donations and property bureaucratisation, political interference protects devotees, promotes reform excessive State control Models and cases SGPC: historic Gurdwaras under the Sikh Gurdwaras Act, 1925 , with elected community participation Char Dham Devasthanam Act, 2019 (Uttarakhand): Board over major shrines Repealed 2021 after opposition Sree Padmanabhaswamy (2020): SC upheld Travancore Royal Family's traditional management with court-set arrangement temples with different arrangements: Tirupati, Jagannath, Vaishno Devi, Badrinath, Kedarnath Property 26(c), (d) own and administer property per law Art 300A: no deprivation of property except by authority of law religious property is not immune from lawful acquisition for public purposes, but must respect religious character"}, {"c": "11", "n": "Religion, Secularism, Minorities and the Waqf Act", "id": "2-articles-27-28-secularism-communalism", "t": "2 · Articles 27-28 · Secularism · Communalism", "x": "2 · Articles 27-28 · Secularism · Communalism # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Fundamental Rights 2 handout pp. 30-33. Prelims PYQs quoted: none quoted in the material. In simple words Art 27 bars taxes that promote a religion; Art 28 bars religious instruction in wholly State-funded schools. India follows principled distance, not strict separation. Communalism, narrow secularism and weak institutions threaten it; the cure is acceptance, scientific temper, rule of law and inclusive development. Articles 27 AND 28 Art 27 no one compelled to pay taxes whose proceeds go to promote a particular religion a regulatory fee for administering religious institutions is not automatically barred Institution (Art 28) Religious instruction wholly State-funded prohibited, subject to 28(2) State-administered but set up under a religious endowment or trust permitted where the trust requires it State-aided or recognised permitted, but no compulsion without prescribed consent (28(3)) Education vs instruction Aruna Roy (2002): religious education (about religions, philosophy, ethics) is not prohibited religious instruction (promoting adherence to one religion) D. A. V. College (1971): teaching the life and teachings of Guru Nanak is not automatically prohibited instruction Against compulsory prayers freedom of conscience Art 28 scientific temper For ethical values Indian culture value-based education Way forward / key point Way forward: inclusive, voluntary , value-based practice without imposing one community's beliefs. Secularism Meaning George Jacob Holyoake popularised the term State not controlled by religion Freedom to follow, change or not follow a religion No discrimination on religion Indian model \"Secular\" added to the Preamble by the 42nd Amendment, 1976 Spirit present from the start not strict separation: Principled Distance ( Rajeev Bhargava ): neither hostile to nor merged with religion Engages for welfare, equality, reform features: No theocracy Religious freedom Equality of religions Principled intervention Protection of diversity basis: Preamble, Arts 14-16, 25-28, 29-30, 51A Cases S. R. Bommai (1994): secularism is part of the Basic Structure Balram Singh (2024): rejected challenges to \"Socialist\" and \"Secular\" in the Preamble Country Model India principled distance, equal freedom, intervention for reform USA constitutional separation of Church and State France laïcité : secular public institutions, limits on public religious display (response to Church power) UK established Church with broad religious freedom Why secularism matters J. S. Mill: harm principle, individual freedom John Rawls: veil of ignorance, fairness peace and harmony scientific temper and reform democracy : equal participation Memory aid · IFPMD Importance: I ndividual freedom (Mill) · F airness (Rawls) · P eace · M odernity · D emocracy. (own mnemonic) Communalism Meaning and types Using religious identity to create divisions and competing political interests Treats communities as homogeneous and conflicting Majority communalism (may pose as nationalism) and minority communalism (separatism, polarisation) Both threaten secularism and integration Challenges to secularism narrow conception: State-centric, tolerance not acceptance, ignores intra-religious (caste, sect) divides extreme religiosity and polarisation: Ritual and costume differences Mobilisation on religious identity Demonisation, mob violence failure of institutions: family, education, political parties weak law: no single Central law on communal violence, prevention, rehabilitation, compensation developmental imbalances: insecurity from unequal opportunity Memory aid · NEFLD Challenges: N arrow concept · E xtreme religiosity · F ailing institutions · L aw gaps · D evelopment gaps. (own mnemonic) Note Sachar Committee (2006): documented Muslims' disadvantages in education, employment, credit, public-sector representation ; urged equitable development. Amartya Sen: people have multiple identities ; a singular identity breeds hostility and blocks cooperation. Measures acceptance over tolerance scientific temper and constitutional morality rule of law against violence and discrimination inclusive development constructive social work like Gandhi's"}, {"c": "11", "n": "Religion, Secularism, Minorities and the Waqf Act", "id": "3-articles-29-30-minority-education-rte-am", "t": "3 · Articles 29-30 · Minority Education · RTE · AMU", "x": "3 · Articles 29-30 · Minority Education · RTE · AMU # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Fundamental Rights 2 handout pp. 34-38. Prelims PYQs quoted: none quoted in the material. In simple words Art 29(1) protects any section's culture (not only minorities); 29(2) bars discrimination in admission. Art 30 lets minorities run their institutions but not maladminister. Minority status is State-wise (TMA Pai). Pramati exempted minority schools from RTE; AMU (2024) overruled Azeez Basha. Articles 29 AND 30 Safeguards for minorities common domain: Preamble, Arts 14-16, 25-28, 46, Fundamental Duties special domain: Arts 29, 30 15(5) excludes Art 30(1) minority institutions from its special admission rules Clause Content 29(1) any section of citizens with a distinct language, script or culture may conserve it; not only minorities 29(2) no denial of admission to State-maintained or aided institutions on religion, race, caste, language only 30(1) religious and linguistic minorities may establish and administer educational institutions of choice 30(1A) protects the right on compulsory acquisition of property 30(2) no discrimination in State aid because of minority management Value addition Right to administer is not right to maladminister. State may regulate standards, qualifications, transparency. WHO IS A Minority Note T. M. A. Pai Foundation (2002): for Art 30, minority status (religious and linguistic) is determined State-wise , not nationally. E.g. Hindus are a religious minority in Punjab, Nagaland, Mizoram . The Centre's notified list is statutory, for schemes and institutions. Six notified religious minorities Muslims Christians Sikhs Buddhists Zoroastrians (Parsis) Jains (notified 2014) Memory aid · MCSBZJ Six minorities: M uslims · C hristians · S ikhs · B uddhists · Z oroastrians · J ains. (own mnemonic) Linguistic minorities Art 347: President may direct recognition of a language on substantial demand Art 350A: mother-tongue instruction at primary stage Art 350B: Special Officer appointed by the President Report laid before Parliament and sent to States Institutions NCM: statutory, National Commission for Minorities Act, 1992 NCMEI: NCMEI Act, 2004 , on minority status and educational rights Regulation AND RTE 29(2) vs 30(1) Aided minority institutions may give reasonable preference to their community but cannot exclude all others State may regulate admission for merit and transparency Unaided institutions have more flexibility with fair, non-exploitative admission Note Sk. Md. Rafique (2020): West Bengal Madrasah Service Commission Act: teacher selection through a statutory commission is not automatically unconstitutional for minority institutions; regulation must not extinguish Art 30 rights. Note Pramati Educational and Cultural Trust (2014): RTE s.12(1)(c) (25% entry seats for weaker sections) cannot be applied to minority institutions in a way that impairs Art 30(1); aided and unaided minority institutions exempted . Critics: RTE aims at social inclusion ; exemption reduces opportunity. Suggestion: admit weaker children from their own community. Note Anjuman Ishaat-e-Taleem Trust (Sept 2025) (verify): SC doubted the blanket exemption ; read Arts 21A and 30 harmoniously ; RTE need not destroy minority character; called for larger Bench . Pramati stays binding until altered. Aligarh Muslim University 1877 Muhammadan Anglo-Oriental College (Sir Syed Ahmad Khan); AMU Act, 1920 makes it a university 1967 S. Azeez Basha: not a minority institution because established by statute 1981 AMU Amendment Act recognises the Muslim community's role 2005-06 Allahabad HC rejected the minority-based reservation 2019 SC refers issue to seven judges 8 Nov 2024 AMU v. Naresh Agarwal: 4:3 ; statutory incorporation does not remove minority status; test = origin, purpose, community role ; pre-1950 institutions can claim Art 30; national importance does not exclude. Azeez Basha overruled but AMU's status left to a regular Bench Minority Welfare Schemes AND Significance Against minority-specific schemes Art 15(1) religion-only basis welfare should follow deprivation other protections exist For socio-economic disadvantage Art 14 reasonable classification Art 46 national integration Way forward / key point Minority schemes are not automatically unconstitutional ; validity depends on legal basis, objective, eligibility, equality. Significance of 29-30: identity, equality, minority autonomy, inclusive education, integration."}, {"c": "11", "n": "Religion, Secularism, Minorities and the Waqf Act", "id": "4-waqf-amendment-act-2025-nazul-land", "t": "4 · WAQF (amendment) ACT, 2025 · Nazul LAND", "x": "4 · WAQF (amendment) ACT, 2025 · Nazul LAND # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Fundamental Rights 2 handout pp. 38-39. Prelims PYQs quoted: none quoted in the material. In simple words The 2025 amendment changes Waqf registration, boards and dispute handling. The SC in September 2025 refused a full stay but paused the five-year Muslim requirement, executive decisions on government-land disputes, and capped non-Muslim members. The final ruling on validity is pending. Nazul land is government land under lease. Background AND KEY Changes Waqf permanent dedication of property for religious, charitable or other purposes under Muslim law: mosques, dargahs, graveyards, schools Waqf Act, 1995 was the main framework The Waqf (Amendment) Act, 2025 (also linked to the UMEED framework) changes registration, management and oversight Provision Change Non-Muslim representation non-Muslim members in the Central Waqf Council and State Waqf Boards Waqf by user restricts future recognition based only on long religious use; protects existing registered Waqfs Five-year requirement person creating a Waqf must have professed Islam for at least five years Government oversight government-designated officer in disputes over government property claimed as Waqf For transparency and accountability property protection against fraudulent claims modernisation of records better supervision Against Art 26 autonomy hit by non-Muslim members waqf by user hurts undocumented religious properties five-year rule intrudes on religious freedom separation of powers: executive deciding property rights Constitutional questions Art 14 equality Art 25 (five-year rule) Art 26 (denominational administration) Separation of powers Supreme Court Interim Order, September 2025 Note SC refused to stay the whole Act but suspended parts (verify against the order): Three directions five-year practising Muslim rule: stayed until States set a mechanism to decide who qualifies government property disputes: Stayed executive power to change Waqf status and revenue records before adjudication Disputes go to the Waqf Tribunal and courts non-Muslim members: not suspended but capped at four in the Central Waqf Council and three in State Waqf Boards Memory aid · FGN Interim order: F ive-year rule paused · G overnment-land disputes to tribunal · N on-Muslim members capped (4 and 3). (own mnemonic) Value addition Interim relief is not a final ruling on validity; keep the two apart in answers. Nazul LAND What it is Government-owned land leasable to persons or institutions Many came under government ownership in the colonial period Government keeps ownership , others hold leasehold Uses: housing, schools, hospitals leasehold: Right to use for a period Freehold: ownership Link to Waqf dispute: can long religious use create Waqf status over land claimed by government? The interim order stops executives from altering disputed status before proper adjudication Core issue: balance protection of religious endowments, property rights, transparency and lawful oversight"}, {"c": "11", "n": "Religion, Secularism, Minorities and the Waqf Act", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Stainislaus 1977 propagation is not a right to convert ERP doctrine origin Shirur Mutt 1954 Santhara 2015 Rajasthan HC banned; SC stayed Sabarimala 2018 4:1, exclusion unconstitutional Sabarimala reference nine judges, reserved May 2026 (verify) Loudspeaker ruling 2020 not essential to Azaan; regulate noise SGPC law Sikh Gurdwaras Act 1925 Char Dham Act 2019, repealed 2021 Property protection article Art 300A Art 27 no tax to promote a religion Art 28 fully State-funded no religious instruction Aruna Roy 2002 religious education is not religious instruction Who popularised secularism George Jacob Holyoake \"Secular\" added by 42nd Amendment 1976 Indian secularism term principled distance, Rajeev Bhargava Bommai 1994 secularism is basic structure Balram Singh 2024 Socialist and Secular words upheld Sachar Committee 2006 Sen on identity multiple identities 29(1) holders any section of citizens, not only minorities 29(2) protects against discrimination in admission Minority unit State-wise, TMA Pai 2002 Jains notified 2014 Art 350B Special Officer for linguistic minorities NCM Act 1992 Pramati 2014 minority schools exempt from RTE 2025 doubt on Pramati Anjuman Ishaat-e-Taleem, larger Bench (verify) Azeez Basha 1967 AMU not minority; overruled 2024 AMU 2024 bench seven judges, 4:3, test: origin, purpose, community role Waqf Act original 1995 Amendment year 2025, UMEED framework Waqf by user change restricts future recognition by long use alone Five-year rule must profess Islam five years; stayed pending mechanism Non-Muslim caps four in Central Council, three in State Boards Where disputes go Waqf Tribunal and courts Nazul land government-owned, leased out"}, {"c": "11", "n": "Religion, Secularism, Minorities and the Waqf Act", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild
