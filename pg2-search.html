 Article 142 · Restraint # Handout only · Saarthi IAS Exam lens Priority: High. Mains PYQs quoted: None quoted in the handout · Judiciary module pp. 17-24. Prelims PYQs quoted: none quoted in the material. In simple words Judicial review is the power of courts to test laws and executive action against the Constitution; it grew from Shankari Prasad to Kesavananda Bharati and beyond. Judicial activism is the courts' proactive role (PIL, guidelines where there is a legal vacuum); it becomes overreach when courts replace policy. Article 142 lets the Supreme Court do complete justice, and restraint means courts act as an alarm clock, not a timekeeper. Judicial Review Meaning Judicial review is the power of courts to examine whether a law or executive action is consistent with the Constitution . If it violates the Constitution, the court can declare it unconstitutional . It is based on the principle of Constitutional Supremacy and forms part of the Basic Structure of the Constitution. Article Role in judicial review Article 13 Laws inconsistent with Fundamental Rights are void to the extent of inconsistency Article 32 Supreme Court can enforce Fundamental Rights Article 226 High Courts can issue writs for Fundamental Rights and other legal rights Articles 131-136 Provide important jurisdictional powers of the Supreme Court Article 368 Constitutional amendments are subject to the Basic Structure Doctrine Evolution of judicial review (six cases) 1. Shankari Prasad Case (1951): upheld Parliament's power to amend Fundamental Rights. 2. Golaknath Case (1967): held that Parliament could not amend Fundamental Rights. 3. Kesavananda Bharati Case (1973): established the Basic Structure Doctrine . Parliament can amend the Constitution but cannot destroy its basic structure. 4. Minerva Mills Case (1980): reaffirmed limited amending power and the importance of judicial review. 5. L. Chandra Kumar Case (1997): held that judicial review by the Supreme Court and High Courts is part of the Basic Structure. Tribunal decisions remain subject to constitutional judicial review. 6. I. R. Coelho Case (2007): held that laws placed in the Ninth Schedule after 24 April 1973 are subject to Basic Structure review. 1951 Shankari Prasad: FRs can be amended 1967 Golaknath: FRs cannot be amended 1973 Kesavananda Bharati: Basic Structure 1980 Minerva Mills 1997 L. Chandra Kumar 2007 I. R. Coelho: Ninth Schedule Importance of judicial review Protection of Fundamental Rights: prevents the government from violating constitutionally guaranteed rights. Constitutional supremacy: ensures that Parliament and State Legislatures operate within constitutional limits. Checks and balances: prevents arbitrary exercise of legislative and executive powers. Protection of federalism: maintains the constitutional division of powers between the Centre and States. Counter-majoritarian role: prevents an elected majority from violating the constitutional rights of minorities. Rule of Law: subjects all public authorities to constitutional limitations. Criticism of judicial review Democratic deficit: unelected judges can invalidate laws enacted by democratically elected legislatures. Judicial overreach: courts may enter policy areas meant for the legislature or executive. Delays in governance: important policies and laws may remain under litigation for long periods. Subjective interpretation: constitutional provisions may receive different interpretations depending on judicial reasoning. Institutional conflict: frequent invalidation of laws may increase tensions between the judiciary and elected governments. Limitations on judicial review (it is not an unlimited power) Presumption of constitutionality: courts ordinarily presume that legislation is constitutionally valid. Judicial restraint: courts generally avoid substituting their preferences for legitimate policy choices. Doctrine of Severability: invalid portions of a law may be separated while preserving valid provisions. Constitutional amendments: Parliament may amend the Constitution in response to judgments, subject to the Basic Structure. Institutional competence: courts recognise that certain technical and policy questions are better handled by elected governments and expert bodies. Value addition Key principle: judicial review protects the Constitution. It should not become a means of replacing every policy decision of the government. Judicial Activism Meaning Judicial activism refers to a proactive approach adopted by courts in interpreting the Constitution, expanding rights and addressing failures of the legislature or executive. It often involves an imaginative interpretation of constitutional provisions to respond to changing social conditions. Value addition Key distinction: judicial review examines the constitutional validity of State action . Judicial activism describes a proactive approach to exercising judicial powers. Evolution of judicial activism in India (three phases) Phase I: 1950-1967, Phase of constitutional interpretation. The Supreme Court largely focused on interpreting constitutional provisions and resolving disputes. Its approach was comparatively formal and restrained. A. K. Gopalan (1950) reflected a narrow interpretation of personal liberty under Article 21. Property rights and land reform disputes dominated important constitutional litigation. Phase II: 1967-1977, Phase of constitutional confrontation. The judiciary became increasingly involved in disputes concerning Parliament's amending powers. Golaknath (1967) restricted Parliament's power to amend Fundamental Rights. Kesavananda Bharati (1973) established the Basic Structure Doctrine. During the Emergency, the ADM Jabalpur judgment (1976) became a major example of judicial failure to protect civil liberties. Phase III: 1977 onwards, Phase of judicial activism. The Supreme Court increasingly focused on social justice, Fundamental Rights and the marginalised sections of society. Liberalisation of locus standi led to the growth of Public Interest Litigation . Article 21 was interpreted more broadly to protect dignity and various aspects of personal liberty. During the 1990s, environmental protection became an important area of judicial intervention. Value addition Significance: the Supreme Court increasingly moved from being merely the Supreme Court of India to the Supreme Court of Indians , especially through rights-based litigation. Factors behind the rise of judicial activism (eight) 1. Failure of democratic institutions: inadequacies in the functioning of the legislature and executive encouraged judicial intervention. 2. Protection of marginalised groups: courts sought to provide justice to people unable to approach them independently. 3. Flexible locus standi: relaxation of standing rules allowed public-spirited individuals to approach courts on behalf of disadvantaged groups. 4. Suo motu cognisance: courts began taking up certain matters on their own initiative. 5. Epistolary jurisdiction: letters highlighting serious grievances could be treated as writ petitions. 6. Legislative vacuum: courts issued guidelines where important legal protections were absent. 7. Expanding constitutional rights: broader interpretation of Article 21 increased the judiciary's role in social and economic matters. 8. Global constitutionalism: international human rights principles influenced constitutional interpretation. Constitutionalism vs majoritarianism The Constitution represents enduring constitutional values , while elections express the political preferences of voters at a particular time. An elected majority cannot violate constitutional limitations merely because it enjoys popular support. Significance: judicial activism can protect constitutional values against temporary political pressures. Forms OF Judicial Activism Executive activism Courts issue directions in areas where the executive has failed to act or has inadequately implemented existing laws. Prakash Singh Case (2006): directions concerning police reforms. M. C. Mehta cases: judicial intervention in pollution control, including cleaner fuels and environmental safeguards in Delhi. Prison reforms: judicial directions concerning prison conditions and prisoners' rights. Issue: such interventions can improve governance but may also place courts in the position of supervising administrative decisions. Legislative activism Courts lay down guidelines when there is a legal vacuum and constitutional rights require protection. Vishaka Case (1997): guidelines to prevent sexual harassment at the workplace, before Parliament enacted a specific law. Witness Protection Scheme (2018): the Supreme Court approved the scheme prepared by the Union Government in consultation with the National Legal Services Authority and directed its implementation pending suitable legislation. Significance: courts play a complementary role where legislative inaction threatens constitutional rights. Limitation: judicial guidelines cannot become an unrestricted substitute for parliamentary legislation. Public Interest Litigation (PIL) Meaning and origin PIL allows a public-spirited individual or organisation to approach a court for the protection of public rights, particularly where affected persons cannot approach the court themselves. It developed prominently during the late 1970s and 1980s , associated especially with Justices P. N. Bhagwati and V. R. Krishna Iyer . Major features 1. Relaxation of locus standi: a directly affected person need not always file the petition. 2. Epistolary jurisdiction: courts may treat letters highlighting serious public grievances as petitions. 3. Social action litigation: activists and organisations may represent disadvantaged communities. 4. Rights-based approach: PIL is widely used in matters involving human rights, environment, prisoners and vulnerable groups. Area Positive contribution of PIL Bonded labour Bandhua Mukti Morcha (1984): the Court intervened to protect bonded labourers and their right to live with dignity Prisoners' rights Hussainara Khatoon cases: strengthened the right to speedy trial, particularly for undertrial prisoners Environment M. C. Mehta cases: strengthened environmental protection through judicial directions and principles Gender justice Vishaka (1997): established workplace sexual harassment guidelines Right to food PUCL Right to Food litigation: strengthened judicial protection of food entitlements Transgender rights NALSA (2014): the Supreme Court recognised transgender persons' constitutional rights and affirmed recognition of gender identity Criticism and misuse of PIL Publicity interest litigation: PILs are sometimes filed primarily to gain publicity or political attention, rather than protect genuine public interests. Such petitions waste judicial time and distract courts from important cases. Private interest litigation: PILs may be used to advance personal, commercial or political interests under the appearance of public welfare. Issue: the judiciary may become a forum for settling private disputes or political rivalries. Departure from original purpose: PIL was originally intended to help poor and disadvantaged people who could not approach courts themselves. However, petitions increasingly involve broad questions of public administration, economic policy and political controversies. Key point Nuance: PILs concerning broader public issues are not automatically improper. Their legitimacy depends on the presence of genuine public interest and a justiciable legal issue . Other issues 1. Judicial burden: frivolous petitions increase the workload of already overburdened courts. 2. Executive interference: PILs may lead courts to supervise policies and projects that require administrative expertise. 3. Delay in development projects: interim orders and prolonged litigation may delay important public projects. 4. Unequal access: influential groups may use PIL more effectively than the poor, for whom the mechanism was originally developed. 5. Weak implementation: courts may issue directions without the administrative machinery required to implement them. Safeguards against misuse of PIL 1. Preliminary scrutiny: strengthen the Supreme Court PIL Cell and screening procedures. 2. Genuine public interest: examine the petitioner's credentials, the nature of the grievance and the presence of personal motives. 3. Exemplary costs: impose costs on frivolous or motivated petitions. 4. Prioritisation: give priority to cases involving Fundamental Rights, vulnerable groups and urgent public harm. 5. Judicial restraint: avoid entertaining petitions seeking to replace legitimate policy decisions. 6. Effective remedies: focus on enforceable directions rather than prolonged judicial supervision. Key point Supreme Court guidance: in State of Uttaranchal v. Balwant Singh Chaufal (2010) , the Court issued guidelines to prevent misuse of PIL and protect genuine public interest litigation. Judicial Activism VS Judicial Overreach Key point Judicial overreach occurs when courts exceed their legitimate constitutional role and interfere excessively with the functions of the legislature or executive. It must be distinguished from judicial activism, which may be necessary to protect constitutional rights. Judicial activism Judicial overreach Proactive exercise of judicial powers Intervention beyond legitimate constitutional limits Seeks to protect constitutional rights and values May substitute judicial preferences for government policy Can address serious legislative or executive failures May weaken separation of powers Example: Vishaka Guidelines (1997) Allegations of overreach have arisen in cases involving detailed policy supervision and administrative management Value addition Important: whether a particular decision amounts to overreach is often a matter of constitutional debate , not an established legal conclusion. Positive implications of judicial activism 1. Limits administrative discretion: checks arbitrary exercise of executive powers. 2. Improves accountability: promotes transparency, probity and accountability in governance. 3. Expands Fundamental Rights: helps reconcile the permanent values of the Constitution with changing social conditions. 4. Protects vulnerable groups: strengthens access to justice for women, children, prisoners and disadvantaged communities. 5. Addresses government inaction: provides remedies where public authorities fail to protect constitutional rights. 6. Fills legislative gaps: establishes temporary safeguards where the absence of legislation threatens rights. 7. Promotes environmental justice: develops principles for protecting natural resources and public health. Adverse implications of judicial activism 1. Jurisdictional inflation: courts increasingly enter areas traditionally handled by the legislature or executive. 2. Separation of powers: excessive intervention may disturb the constitutional balance between institutions. 3. Institutional competence: judges may lack specialised knowledge required for complex economic and administrative decisions. 4. Implementation problems: courts do not directly control the financial and administrative resources needed to implement their directions. 5. Polycentric nature of public issues: many policy decisions affect several competing interests. Courts may not be able to examine every consequence. 6. Growing judicial caseload: continuous supervision of government programmes increases the workload of courts. 7. Democratic accountability: judges are not directly accountable to voters for policy outcomes. 8. Judicial credibility: repeated intervention in political controversies may expose courts to allegations of partisanship. Institutional limitations of courts Polycentric issues: a single policy decision may affect multiple interests. For example, closing polluting industries can protect the environment but also affect employment and livelihoods. Epistemic limitations: courts may lack the technical knowledge required to design and supervise complex policies. Implementation capacity: courts possess neither the power of the purse , exercised by legislatures, nor the executive's direct administrative machinery. Role of amicus curiae: courts may appoint an amicus curiae, or friend of the court, to assist them with legal arguments and specialised information. Key principle: the judiciary should act as an alarm clock, not a timekeeper . It should draw attention to constitutional failures without permanently taking over administration. Examples of judicial activism and overreach 1. Supreme Court's stay on Farm Laws (2021). Positive: stayed three Farm Laws (2020) to facilitate dialogue between farmers and government. Criticism: staying legislation without deciding its validity raised concerns about judicial intervention in policy disputes. Outcome: laws repealed by Parliament in 2021. 2. Judicial management of BCCI. Positive: promoted transparency and accountability in cricket administration. Criticism: prolonged judicial supervision raised concerns about administrative overreach. 3. Liquor outlets near highways. Positive: restricted liquor outlets near highways to improve road safety. Criticism: affected livelihoods, State revenue and regulatory autonomy. Article 142: Power TO DO Complete Justice What it does Article 142 empowers the Supreme Court to pass orders necessary for doing complete justice in a case before it. This power helps the Court provide effective relief where ordinary legal remedies may be inadequate. However, it must be exercised within the constitutional framework. Significance of Article 142 1. Complete justice: allows the Court to grant appropriate relief in exceptional circumstances. 2. Legal gaps: helps address situations where existing legal remedies do not fully resolve an injustice. 3. Protection of rights: enables effective enforcement of constitutional and legal rights. 4. Flexibility: allows the Court to respond to extraordinary circumstances requiring equitable relief. Examples of Article 142 1. Bhopal Gas Disaster settlement: Article 142 was invoked in proceedings concerning the settlement and relief arising from the disaster. 2. Ayodhya judgment (2019): the Court exercised Article 142 in granting alternative land for the construction of a mosque. 3. Chandigarh Mayoral Election (2024): the Court used Article 142 to provide relief after finding serious irregularities in the counting process. 4. Tamil Nadu Governor case (April 2025): the Court invoked Article 142 to treat ten pending State Bills as deemed assented. Value addition Important: the constitutional validity of the last use was subsequently addressed in the 16th Presidential Reference (2025) . Judicial Restraint The objective is not to eliminate judicial activism but to ensure that it remains consistent with constitutional limits and institutional competence. Principles of judicial restraint 1. Separation of powers: respect the constitutional roles of the legislature and executive. 2. Constitutional necessity: intervene where rights or constitutional limitations genuinely require judicial protection. 3. Institutional competence: avoid detailed policymaking where specialised expertise and administrative discretion are necessary. 4. Proportionality: ensure that judicial directions do not create excessive or unintended consequences. 5. Effective remedies: prefer practical and enforceable directions over continuous judicial supervision. 6. Democratic accountability: recognise that elected governments remain accountable for public policy decisions. WAY Forward Eight steps 1. Preserve judicial review: protect its role in maintaining constitutional supremacy and Fundamental Rights. 2. Prevent misuse of PIL: strengthen scrutiny and impose costs on frivolous or motivated petitions. 3. Promote judicial restraint: avoid unnecessary interference in legitimate policy decisions. 4. Respect separation of powers: courts should not routinely replace legislative or executive decisions. 5. Improve institutional expertise: use expert committees and amicus curiae where complex technical issues arise. 6. Strengthen executive accountability: improve governance institutions so that routine administrative failures do not require judicial intervention. 7. Ensure effective remedies: focus judicial directions on enforceable outcomes and clear constitutional violations. 8. Apply Article 142 carefully: ensure that complete justice is delivered without overriding constitutional provisions. Value addition Conclusion: judicial review and judicial activism have played an important role in protecting Fundamental Rights, constitutional values and social justice. However, excessive judicial intervention may weaken the separation of powers and democratic accountability. The judiciary must combine constitutional vigilance with judicial restraint ."}, {"c": "20", "n": "Judicial Review, Activism, Pendency, Legal Aid and ADR", "id": "2-judicial-pendency-causes-implications-e", "t": "2 · Judicial Pendency · Causes · Implications · E-courts · Reforms", "x": "2 · Judicial Pendency · Causes · Implications · E-courts · Reforms # Handout only · Saarthi IAS Exam lens Priority: High. Mains PYQs quoted: None quoted in the handout · Judiciary module pp. 24-30. Prelims PYQs quoted: none quoted in the material. In simple words Pendency means cases filed but not finally decided; arrears are cases pending beyond a reasonable period. India has docket explosion (too many cases) and docket exclusion (many cannot reach courts) at once. Causes include too few judges and vacancies, government as a compulsive litigant, adjournments, delayed judgments, weak investigation, procedure, frivolous suits, poor infrastructure and no judicial impact assessment. Remedies include the National Litigation Policy, NJDG, e-Courts Phase III, infrastructure schemes and the National Mission for Justice Delivery. Judicial Pendency IN India Meaning Judicial pendency refers to cases that have been filed before courts but have not yet been finally disposed of . A large number of pending cases, particularly those awaiting decisions for several years, remains a major challenge to India's justice delivery system. Status of pending cases (latest official data in the handout) Over 5.8 crore cases were pending across Indian courts in October 2026 (Ministry of Law and Justice). Supreme Court: 92,876 cases pending as of 16 March 2026. High Courts: 63,98,686 cases pending as of 16 March 2026. District and Subordinate Courts: account for the overwhelming majority of pending cases. Value addition Important: these figures relate to different reporting dates and should not be added to calculate a single total. (verify figures) Term Meaning Pendency All cases awaiting final disposal, including recently filed cases Arrears Cases that remain unresolved beyond a reasonable or prescribed period Key issue: every pending case is not necessarily a delayed case. A case filed today cannot be considered an arrear merely because it remains pending tomorrow. India lacks a single universally applicable time threshold for defining arrears across all case categories. Pendency figures alone do not establish judicial inefficiency. The focus should be on ageing cases, disposal rates and reasons for delay . Disposal rate and backlog Disposal rate refers to the number of cases decided by courts during a specified period. Case Clearance Rate (CCR) compares disposed cases with newly instituted cases. CCR above 100%: courts dispose of more cases than are newly filed, helping reduce existing backlog. CCR below 100%: new filings exceed disposals, increasing pendency. Key concern: even when courts dispose of cases at the same rate at which new cases are filed, the old backlog remains unresolved . Docket Explosion VS Docket Exclusion Key point A docket is the collection or list of cases before a court. Docket explosion Docket exclusion Courts become overburdened by a large number of cases Many people, particularly the poor, remain unable to approach courts Focuses on excessive litigation and judicial workload Focuses on lack of access to justice Requires better judicial capacity and case management Requires affordable legal services and removal of access barriers Value addition Indian context: India faces both problems simultaneously . Courts have crores of pending cases, while many citizens cannot access justice because of poverty, distance, lack of awareness and high litigation costs. Way forward / key point Key principle: judicial reforms should aim to reduce delay without restricting genuine access to courts. Supreme Court's Expanding Docket The Supreme Court was intended to function primarily as a Constitutional Court, protecting Fundamental Rights, federalism and constitutional supremacy. However, its docket increasingly includes ordinary civil, criminal, service, tax and other appellate matters. Major issues 1. Excessive Special Leave Petitions: wide discretionary jurisdiction under Article 136 has substantially increased the appellate workload. 2. Limited constitutional focus: routine appeals compete with important Constitution Bench matters for judicial time. 3. Repeated litigation: some disputes reach the Supreme Court after several rounds of adjudication. 4. Delayed constitutional questions: important questions of constitutional interpretation may remain unresolved for long periods. 5. Geographical inequality: litigants from distant States incur greater costs in approaching the Supreme Court in New Delhi. Key point Federal and constitutional implication: the Court's expanding appellate role may affect its ability to give timely attention to Fundamental Rights and constitutional disputes. Reform debate Restrict routine SLPs: apply greater selectivity to appeals under Article 136. Prioritise Constitution Benches: ensure regular hearing of substantial constitutional questions. Improve case management: identify cases requiring early disposal and prevent unnecessary adjournments. National Court of Appeal: consider separate appellate arrangements while preserving uniformity of law. Causes OF Judicial Pendency 1. Inadequate number of judges The shortage of judges is a major reason behind judicial delays. Official data (February 2026): Sanctioned judicial strength 25,894 Working judicial strength 21,027 Judges per million population approximately 22 Law Commission's 120th Report (1987) recommended increasing the judge-population ratio to 50 judges per million population . Issue: India continues to face a shortage of judicial personnel relative to its population and rising litigation needs. Way forward: increase judicial strength based on case workload, filing trends and disposal requirements, rather than population alone. 2. Judicial vacancies Vacancies persist even against the sanctioned strength of courts. Delays in appointments to the Supreme Court and High Courts. Shortage of judges in District and Subordinate Courts. Inadequate manpower planning and delayed recruitment. Unequal distribution of vacancies across States. Impact: existing judges face heavier workloads, while litigants experience longer waiting periods. Way forward: fill vacancies promptly, improve appointment coordination and prepare long-term judicial manpower plans. 3. Government as a compulsive litigant The government is a major litigant before Indian courts. Government departments frequently challenge adverse judgments. One government department may litigate against another. Officials sometimes prefer the attitude of \"Let the court decide\" , instead of taking administrative responsibility. Unnecessary appeals and delayed settlements increase the judicial workload. Impact: public resources are spent on avoidable litigation, while genuine disputes remain pending. Way forward: implement a responsible litigation policy, strengthen departmental legal cells and discourage unnecessary appeals. 4. Culture of adjournments Repeated adjournments are an important cause of delay. Reasons: Lawyers seeking additional time Non-appearance of witnesses or parties Incomplete documents and procedural defects Delays in serving summons and notices Impact: hearings become prolonged, increasing the cost and uncertainty of litigation. Way forward: enforce case schedules, restrict unnecessary adjournments and use digital systems for summons and case tracking. 5. Delayed pronouncement of judgments A judgment may remain reserved for a long period after the completion of arguments. Anil Rai v. State of Bihar (2001): the Supreme Court issued guidelines concerning delays in pronouncing reserved judgments. Delays create uncertainty for litigants. Prolonged intervals may affect the effective resolution of disputes. Lack of systematic monitoring weakens accountability. Way forward: maintain internal monitoring of reserved judgments and ensure timely pronouncement while protecting judicial independence. 6. Poor investigation and prosecution Weak investigation and prosecution contribute particularly to delays in criminal cases . Problems: Poor quality of police investigation Shortage of trained prosecutors Inadequate forensic facilities Delays in collecting evidence Non-appearance or hostility of witnesses Impact: cases remain pending, undertrial detention continues and the credibility of the criminal justice system suffers. Way forward: strengthen forensic infrastructure, prosecution services, witness protection and investigation quality. 7. Procedural complexities Court procedures can become lengthy and expensive because of: Multiple stages of appeal and revision Repeated procedural applications Delays in serving notices and summons Incomplete pleadings and documentation Inadequate coordination between investigating agencies, lawyers and courts Recent legal reform: the Bharatiya Nyaya Sanhita, Bharatiya Nagarik Suraksha Sanhita and Bharatiya Sakshya Adhiniyam came into force on 1 July 2024 , replacing the principal colonial-era criminal laws. Value addition Important: legislative changes alone cannot ensure speedy justice without better implementation, training and judicial infrastructure. 8. Frivolous and vexatious litigation Frivolous litigation: cases filed without sufficient legal merit. Vexatious litigation: repeated or improper litigation intended to harass another party or misuse judicial proceedings. Wastes judicial time and public resources. Delays genuine cases. May be used to pressure individuals or government authorities. Law Commission's 192nd Report (2005) examined measures relating to vexatious litigation. Way forward: use proportionate costs, strengthen preliminary scrutiny and discourage repetitive litigation. Safeguard: such measures must not be used to restrict genuine litigants, PILs or complaints against government authorities. 9. Inadequate judicial infrastructure A shortage of courtrooms, staff, residential facilities and technology affects judicial efficiency. Problems: Inadequate courtrooms and space for records Shortage of trained court staff Limited residential accommodation for judicial officers Poor facilities for litigants, witnesses and lawyers Uneven digital connectivity and technical support Official data (February 2026): against a sanctioned strength of 25,894 judicial officers, approximately 22,712 court halls were available. Impact: even where judges are appointed, insufficient infrastructure can prevent courts from functioning at full capacity. 10. Absence of judicial impact assessment Whenever a new law is enacted, additional litigation may arise from its interpretation and implementation. Judicial Impact Assessment means estimating the likely effect of new laws on: number and nature of cases Requirement of additional judges and staff Court infrastructure and financial resources Administrative capacity for implementation Issue: inadequate assessment of the judicial consequences of legislation contributes to unexpected workloads. Way forward: introduce Judicial Impact Assessment for major legislation and provide corresponding judicial resources. Adverse Implications OF Judicial Pendency Eight implications 1. Justice delayed is justice denied: delayed judgments weaken the practical value of legal rights. 2. Erosion of public confidence: prolonged litigation reduces trust in the judiciary. 3. Economic costs: delays increase legal expenses and create uncertainty for businesses and investors. 4. Burden on undertrials: accused persons may remain in custody for long periods without final determination of guilt. 5. Extra-legal dispute resolution: delays may encourage people to employ extra-legal or extra-judicial means to settle disputes. 6. Social inequality: poor litigants are less able to sustain prolonged legal proceedings. 7. Waste of resources: repeated hearings consume the time and money of litigants, lawyers and courts. 8. Weak enforcement: delayed adjudication and execution of judgments reduce the effectiveness of legal remedies. Government Initiatives AND Judicial Reforms National Litigation Policy, 2010 The policy was formulated to transform the government from a compulsive and irresponsible litigant into a responsible litigant . Objectives: Reduce unnecessary government litigation Discourage the attitude of \"Let the court decide\" Promote early settlement and withdrawal of avoidable cases Improve management of government litigation 1. Nodal officers: appoint officers in government departments to monitor litigation. 2. Screening of appeals: examine whether challenging an adverse judgment is necessary. 3. Prioritisation: give greater attention to matters concerning social justice, welfare laws and vulnerable groups. 4. Competent legal representation: improve selection and support of government lawyers. 5. Alternative settlement: promote settlements where legally appropriate. Major limitation: implementation has remained uneven, and unnecessary government litigation continues. Way forward: strengthen accountability of departments for avoidable appeals and repeated non-compliance with court orders. National Judicial Data Grid (NJDG) An online platform developed under the e-Courts Project to provide information on judicial cases. It includes separate dashboards for the Supreme Court, High Courts and District Courts . Functions: Provides information on pending and disposed cases Tracks the age, category and stage of cases Helps identify courts with large backlogs Supports research and evidence-based judicial policymaking Significance of NJDG 1. Transparency: makes judicial pendency and case information publicly accessible. 2. Performance assessment: helps examine filing patterns, disposal rates and ageing cases. 3. Resource planning: supports decisions on judicial manpower and infrastructure. 4. Identification of delays: helps locate bottlenecks in the justice delivery process. 5. Policy research: enables analysis of judicial trends by governments and researchers. Limitations of NJDG 1. Data quality: accuracy depends on regular and consistent updating by courts. 2. Classification problems: differences in case categorisation may affect comparisons across courts. 3. Limited analytical capacity: data availability does not automatically translate into effective case management. 4. Technical gaps: digital capacity and training differ across court establishments. 5. Privacy concerns: greater access to court data requires protection of sensitive personal information. Way forward / key point Way forward (NJDG): improve data standardisation, quality checks, analytical tools and training. e-Courts Mission Mode Project The e-Courts Project seeks to integrate Information and Communication Technology (ICT) into India's justice delivery system. Phase I (2007-2015): focused on computerisation of courts and basic digital infrastructure. Phase II (2015-2023): expanded digital services, including Case Information Systems, NJDG, e-filing and video conferencing. Phase III (2023-2027): focuses on developing digital, paperless and more accessible courts. Phase I 2007-15 Computerisation, basic digital infrastructure Phase II 2015-23 Case Information Systems, NJDG, e-filing, video conferencing Phase III 2023-27 Digital, paperless, accessible courts; Rs 7,210 crore e-Courts Phase III Financial outlay: Rs 7,210 crore for 2023-2027. 1. Digitisation: digitisation of pending and legacy court records. 2. e-Filing and e-Payments: online submission of cases and payment of court fees. 3. Virtual hearings: expansion of video conferencing to courts, jails and selected hospitals. 4. e-Sewa Kendras: assistance to litigants in accessing digital judicial services. 5. Artificial Intelligence (AI): use of AI and Optical Character Recognition (OCR) to support case analysis and administrative efficiency. 6. Data integration: improved interoperability of digital judicial records and applications. Benefits of e-Courts Speedy justice: reduces procedural delays and improves case tracking. Accessibility: enables litigants to access services without repeated physical visits. Transparency: provides online information about case status and judicial orders. Cost reduction: saves time and travel expenses. Data-based planning: supports better management of judicial workloads. Issues with e-Courts 1. Digital divide: poor and rural litigants may lack digital skills and internet access. 2. Infrastructure: courts differ in internet connectivity, hardware and technical support. 3. Cybersecurity: digital records require protection from unauthorised access and manipulation. 4. Training: judges, lawyers and court staff require regular technical training. 5. AI limitations: automated systems may introduce errors or bias if used without appropriate human supervision. Way forward / key point Way forward (e-Courts): adopt technology as an assistive tool, while retaining human judicial decision-making, transparency and data protection. Judicial infrastructure reforms: Centrally Sponsored Scheme The Union Government has implemented the Centrally Sponsored Scheme for Development of Infrastructure Facilities for District and Subordinate Courts since 1993-94 . Components: Court halls Residential units for judicial officers Lawyers' halls Toilet complexes Digital computer rooms Latest budgetary support: the Union Budget 2026 provided Rs 810 crore for judicial infrastructure under the scheme. (verify figures) Major issues: Inadequate funding relative to requirements Uneven infrastructure development across States Delays in land acquisition and construction Shortage of technical and administrative staff Differences in utilisation of funds by State governments Way forward: improve infrastructure planning, fund utilisation and coordination between the Union, State Governments and High Courts. National Judicial Infrastructure Authority of India (NJIAI) The proposal seeks to create a specialised institution for developing and managing court infrastructure. Proposed features: A national framework for judicial infrastructure planning Greater coordination between the judiciary and governments Similar institutional arrangements at the State or High Court level Long-term planning for courtrooms, accommodation and digital facilities Significance: could improve infrastructure quality and reduce dependence on ad hoc planning. Value addition Important: NJIAI is a proposal , not an established statutory authority. National Mission for Justice Delivery and Legal Reforms Established in 2011 . Its objectives include: Reducing judicial delays and arrears Improving infrastructure and judicial capacity Promoting procedural and administrative reforms Improving accountability and access to justice Significance: recognises that pendency requires a combination of judicial manpower, infrastructure, procedural reform and effective management."}, {"c": "20", "n": "Judicial Review, Activism, Pendency, Legal Aid and ADR", "id": "3-access-to-justice-legal-aid-nalsa-witnes", "t": "3 · Access TO Justice · Legal AID · Nalsa · Witness Protection", "x": "3 · Access TO Justice · Legal AID · Nalsa · Witness Protection # Handout only · Saarthi IAS Exam lens Priority: High. Mains PYQs quoted: None quoted in the handout · Judiciary module pp. 30-34. Prelims PYQs quoted: none quoted in the material. In simple words Access to justice means every person can approach courts and get a fair, timely remedy whatever their wealth or status. Articles 14, 21, 22(1) and 39A and cases such as Hussainara Khatoon and Khatri II make free legal aid a constitutional matter. NALSA, set up under the Legal Services Authorities Act, 1987, runs legal aid through State, District and Taluk bodies. Barriers are cost, distance, ignorance, discrimination and the digital divide; Tele-Law, Nyaya Bandhu, Nyaya Mitra, paralegal volunteers and LADCS respond. The Witness Protection Scheme, 2018 protects witnesses so trials stay fair. Meaning AND Constitutional Basis What access to justice means Access to justice means that every person should be able to approach courts, protect their rights and obtain a fair and timely remedy , irrespective of their economic or social position. It is an essential part of the Rule of Law, Right to Equality and Right to Life and Personal Liberty . Article What it provides Article 14 Guarantees equality before the law and equal protection of laws Article 21 Protects the Right to Life and Personal Liberty. The Supreme Court has recognised speedy trial and fair legal procedure as important components of this right Article 22(1) Protects the right of an arrested person to consult and be defended by a legal practitioner of their choice Article 39A Directs the State to ensure equal justice and free legal aid , so that opportunities for securing justice are not denied because of economic or other disabilities Important judicial judgments 1. Hussainara Khatoon v. State of Bihar (1979): recognised the Right to Speedy Trial under Article 21 , particularly in the context of undertrial prisoners. 2. M. H. Hoskot v. State of Maharashtra (1978): recognised the importance of legal assistance for ensuring fair procedure and meaningful access to justice. 3. Khatri (II) v. State of Bihar (1981): held that the State's obligation to provide legal aid begins when an accused is first produced before a Magistrate , not merely when the trial begins. 4. Suk Das v. Union Territory of Arunachal Pradesh (1986): held that failure to provide required free legal assistance can violate the constitutional guarantee of a fair trial. Value addition Significance: access to justice is not merely a welfare objective. It is closely connected with Fundamental Rights and constitutional due process . National Legal Services Authority (nalsa) What it is NALSA was established under the Legal Services Authorities Act, 1987 to provide free and competent legal services to weaker sections of society. The Act came into force on 9 November 1995 . National Legal Services Day is observed annually on 9 November . Institution Major role NALSA Apex legal services body, with the CJI as Patron-in-Chief State Legal Services Authority (SLSA) Coordinates legal aid at the State level, with the High Court Chief Justice as Patron-in-Chief District Legal Services Authority (DLSA) Provides legal aid at the district level, generally headed by the District Judge Taluk Legal Services Committee Provides legal services at the local level Supreme Court and High Court Legal Services Committees Facilitate legal assistance for cases before the respective courts Major functions of NALSA 1. Free legal aid: provides legal advice and representation to eligible beneficiaries. 2. Legal awareness: organises legal literacy programmes to inform citizens about their rights. 3. Lok Adalats: promotes settlement of disputes through compromise and conciliation. 4. Social justice litigation: supports legal action concerning the rights of weaker sections. 5. Legal aid schemes: develops programmes for women, children, prisoners, persons with disabilities and other vulnerable groups. 6. Access to welfare: helps beneficiaries secure legal entitlements under government schemes and laws. Eligibility FOR FREE Legal AID Section 12 of the Legal Services Authorities Act, 1987 identifies the categories eligible for free legal services. Members of Scheduled Castes and Scheduled Tribes . Women and children . Victims of human trafficking or begar . Persons with mental illness or disabilities . Victims of disasters, ethnic violence and caste atrocities . Industrial workmen . Persons in custody , including eligible undertrial prisoners. Persons below the prescribed annual income limit . Income criteria The income ceiling varies across States and Union Territories. For cases before the Supreme Court , NALSA specifies an annual income ceiling of Rs 5 lakh . Value addition Important: eligibility based on categories such as women, children and SC/ST status does not depend on satisfying the ordinary income criterion . Key point Section 13: the concerned Legal Services Authority must also be satisfied that the applicant has a genuine case to prosecute or defend. Nature of free legal services Legal advice and consultation. Representation through a panel lawyer . Preparation of legal documents. Court fees and specified procedural expenses. Assistance with appeals and other legal proceedings. Value addition Important: legal aid is available for appropriate civil and criminal matters, and is not confined to cases before subordinate courts. Barriers TO Access TO Justice Economic barriers 1. High litigation costs: lawyers' fees, travel expenses and repeated hearings make litigation expensive. 2. Opportunity cost: poor litigants may lose wages whenever they attend court proceedings. 3. Prolonged litigation: even where legal assistance is free, indirect costs may make it difficult to continue a case. Implication: constitutional rights may remain ineffective for people who cannot afford to enforce them. Geographical barriers Courts are often located far from rural and remote communities. Travel costs and poor transport facilities discourage litigation. Shortage of legal professionals in rural areas affects access to competent representation. Way forward: strengthen district legal services authorities, mobile legal services and local legal assistance centres. Lack of legal awareness Many citizens are unaware of: Their Fundamental and legal rights Eligibility for free legal aid Procedures for approaching courts Availability of alternative dispute resolution mechanisms Way forward: expand legal literacy through schools, Panchayats, community organisations and Paralegal Volunteers . Social and institutional barriers 1. Social discrimination: caste, gender and other social inequalities may discourage vulnerable groups from approaching courts. 2. Language barriers: court proceedings and legal documents may be difficult for litigants unfamiliar with the language used. 3. Complex procedures: formal legal procedures are difficult for ordinary citizens to understand. 4. Poor legal representation: the appointment of a free lawyer does not always ensure effective legal assistance. 5. Digital divide: online judicial services may exclude people without internet access or digital literacy. Value addition Key issue: access to justice must mean effective legal protection , not merely the physical availability of courts. Major Government Initiatives Tele-Law Provides legal advice through digital communication platforms, especially for people in rural and underserved areas. Implemented under the Department of Justice's Designing Innovative Solutions for Holistic Access to Justice (DISHA) scheme. Connects citizens with panel lawyers through digital platforms Uses Common Service Centres (CSCs) and other digital access channels Provides pre-litigation legal advice Seeks to reduce geographical and financial barriers to legal consultation Achievement: more than 1.12 crore pre-litigation consultations had been provided by 28 February 2026 (Ministry of Law and Justice). (verify figures) Significance: brings legal advice closer to citizens without requiring repeated visits to courts. Nyaya Bandhu: Pro Bono Legal Services Promotes pro bono legal services , under which advocates voluntarily provide free legal assistance to eligible beneficiaries. Encourages lawyers to provide free legal representation Links eligible persons with pro bono advocates Promotes a culture of professional social responsibility among lawyers Supports persons eligible under Section 12 of the Legal Services Authorities Act Achievement: 10,263 advocates were registered under the programme as of 28 February 2026. (verify figures) Recent development: Tele-Law was integrated with the Nyaya Bandhu platform in 2023 to facilitate further legal assistance and court representation where needed. Nyaya Mitra Introduced to assist in reducing long-pending cases . Provides support through persons with legal or judicial experience Helps identify and monitor selected pending cases Supports coordination with relevant authorities for their disposal Significance: addresses delays through case-specific assistance and better coordination. Paralegal Volunteers (PLVs) Assist citizens in understanding and accessing legal services. Their functions include: spreading legal awareness Helping eligible persons apply for free legal aid Assisting vulnerable groups in approaching Legal Services Authorities Connecting communities with available legal remedies Significance: reduce the distance between formal legal institutions and ordinary citizens. Legal Aid Defence Counsel System (LADCS) Seeks to provide dedicated legal representation in criminal cases to eligible persons. It is implemented through NALSA under a Central Sector Scheme . 1. Dedicated defence lawyers: Legal Aid Defence Counsels provide legal representation in criminal matters. 2. Full-time legal assistance: the system seeks to provide continuous representation rather than relying only on lawyers who also maintain private practices. 3. Support to undertrials: assists eligible prisoners during bail proceedings, trials and other stages of criminal litigation. 4. District-level offices: Legal Aid Defence Counsel offices operate through District Legal Services Authorities. Achievements (Ministry of Law and Justice): 680 districts had functional LADCS offices as of 31 December 2025 12,62,857 cases had been assigned since implementation began 8,71,581 cases had been disposed of, according to data reported in 2026. (verify figures) Significance: seeks to improve the quality and continuity of criminal legal aid, particularly for economically disadvantaged accused persons. Witness Protection AND FAIR Trial Key point Witnesses play an important role in criminal trials. However, threats and intimidation may prevent them from giving truthful testimony. Term Meaning Perjury Knowingly giving false evidence under oath or in circumstances covered by the applicable law Hostile witness A witness whose testimony becomes adverse to the party calling them, leading the court to permit cross-examination by that party Value addition Important: a hostile witness is not automatically guilty of perjury . A witness may turn hostile because of intimidation, fear, inducement or other reasons. Major issues 1. Witness intimidation: threats from accused persons or influential groups may prevent truthful testimony. 2. Bribery and inducement: witnesses may be pressured to alter their statements. 3. Prolonged trials: repeated court appearances increase inconvenience and vulnerability. 4. Weak protection: inadequate security and support may discourage witnesses from cooperating. 5. Loss of evidence: hostile or unavailable witnesses may weaken the prosecution's case. Key point Federal and constitutional significance: effective witness protection is essential for the Right to Fair Trial under Article 21 . Witness Protection Scheme, 2018 Prepared by the Union Government in consultation with NALSA and approved by the Supreme Court in Mahender Chawla v. Union of India (2018) . The Court directed its implementation until suitable legislation was enacted. Category Nature of threat Category A Threat to the life of the witness or family members Category B Threat to safety, reputation or property of the witness or family Category C Moderate threat involving harassment or intimidation Major features 1. Threat Analysis Report: prepared by the designated police authority to assess the level of threat. 2. Witness Protection Order: issued by the competent authority based on the threat assessment. 3. Identity protection: measures may be taken to protect the identity of witnesses. 4. Relocation: witnesses may be relocated in serious cases. 5. Change of identity: available in appropriate cases involving serious threats. 6. Witness Protection Fund: provides financial support for implementing protection measures. Issues in implementation 1. Funding constraints: effective protection, especially relocation, requires adequate resources. 2. Police capacity: local police may lack specialised training and infrastructure. 3. Independence concerns: witnesses may hesitate to approach authorities if local agencies are perceived as compromised. 4. Lack of awareness: many witnesses may be unaware of available protections. 5. Uneven implementation: protection facilities and administrative capacity vary across States. Way forward Establish dedicated witness protection units . Strengthen confidentiality and threat assessment procedures. Provide adequate financial resources. Protect vulnerable witnesses through appropriate court facilities. Ensure timely trials to reduce prolonged exposure to intimidation."}, {"c": "20", "n": "Judicial Review, Activism, Pendency, Legal Aid and ADR", "id": "4-alternative-dispute-resolution-lok-adala", "t": "4 · Alternative Dispute Resolution · LOK Adalats · Arbitration · Mediation", "x": "4 · Alternative Dispute Resolution · LOK Adalats · Arbitration · Mediation # Handout only · Saarthi IAS Exam lens Priority: High. Mains PYQs quoted: None quoted in the handout · Judiciary module pp. 34-41. Prelims PYQs quoted: none quoted in the material. In simple words ADR settles disputes outside regular courts: faster, cheaper, more flexible. Lok Adalats work by compromise and their award is a final civil-court decree with no court fee; Permanent Lok Adalats (Section 22B) can decide public-utility disputes up to Rs 1 crore. Arbitration is governed by the Arbitration and Conciliation Act, 1996 (amended 2015, 2019, 2021), IIAC is the institutional centre, the Commercial Courts Act, 2015 gives specialised courts and the Mediation Act, 2023 gives mediation a statute. Speed must not cost fairness. Meaning AND NEED FOR ADR What it is Alternative Dispute Resolution (ADR) refers to methods of resolving disputes outside the regular court system . ADR offers faster, cheaper and more flexible dispute resolution, particularly in civil, commercial and family matters. Need for ADR 1. Judicial pendency: reduces the burden on regular courts by settling suitable disputes outside formal litigation. 2. Affordable justice: saves time, court fees and litigation expenses. 3. Speedy resolution: avoids lengthy judicial procedures and repeated adjournments. 4. Preservation of relationships: encourages compromise, particularly in family and commercial disputes. 5. Ease of doing business: provides an alternative forum for resolving contractual and commercial disputes. 6. Access to justice: makes dispute resolution more accessible to poor and disadvantaged groups. Key point Constitutional basis: Article 39A directs the State to promote equal justice and free legal aid. LOK Adalats What it is Lok Adalat, or People's Court , is based on the philosophy of compromise and conciliation . The first Lok Adalat was organised in Gujarat in 1982 . It received statutory recognition under the Legal Services Authorities Act, 1987 . Composition A Lok Adalat Bench generally consists of: A serving or retired judicial officer An advocate A social worker or other eligible member The members act primarily as statutory conciliators , helping parties reach an amicable settlement. Powers and jurisdiction 1. Pending cases: cases already before courts may be referred to Lok Adalats. 2. Pre-litigation disputes: disputes may be settled before formal court proceedings begin. 3. Civil matters: includes motor accident claims, labour disputes, property disputes and matrimonial settlements. 4. Compoundable criminal cases: certain criminal offences that can legally be compromised may be settled. 5. Non-compoundable offences: Lok Adalats cannot settle offences that are non-compoundable under law. Nature of Lok Adalat awards An award is deemed to be a decree of a civil court . It is final and binding on the parties. No ordinary appeal lies against the award. There is no court fee for proceedings before a Lok Adalat. Court fees already paid are refunded where the pending case is settled. Value addition Important: an ordinary Lok Adalat cannot decide a dispute on merits when the parties fail to reach a compromise. The matter returns to the regular court or appropriate forum. Types of Lok Adalats National Lok Adalat: organised across the country on specified days. Conducted at different court levels, from the Supreme Court to Taluk courts. Deals with suitable pending cases and pre-litigation disputes. Enables the settlement of a large number of cases through coordinated proceedings. Permanent Lok Adalat: the 2002 Amendment to the Legal Services Authorities Act provided for Permanent Lok Adalats dealing with public utility services . Established under Section 22B . Deals with disputes concerning transport, electricity, water supply, postal and other notified public utility services. Operates as a pre-litigation mechanism . Has a monetary jurisdiction of up to Rs 1 crore . First attempts settlement through conciliation. Mobile and e-Lok Adalats: Mobile Lok Adalat travels to different areas, including remote regions, to provide access to dispute resolution. e-Lok Adalat uses digital platforms to conduct settlement proceedings and reduce physical attendance. Parivarik Mahila Lok Adalat: developed to promote settlement of family and matrimonial disputes through counselling, compromise and conciliation. It seeks to make dispute resolution more accessible, particularly for women facing family-related conflicts. Value addition Special power: unlike an ordinary Lok Adalat, a Permanent Lok Adalat may decide an eligible dispute on merits if conciliation fails, subject to statutory restrictions. Achievements of Lok Adalats 1. Speedy disposal: help settle large numbers of cases without prolonged litigation. 2. Affordable justice: reduces court fees, travel expenses and legal costs. 3. Reduced judicial burden: suitable disputes are resolved without a full judicial trial. 4. Social harmony: encourages compromise and helps preserve relationships. 5. Access to justice: provides a less formal process for poor and vulnerable litigants. Issues with Lok Adalats 1. Compromise vs justice: ADR may sound noble and idealistic, but sometimes it can also be alien to the language of rights. 2. Unequal bargaining power: litigants are often pitted against powerful entities such as banks, insurance companies and electricity boards. 3. Compromises imposed on the poor: financially weaker parties may accept unfair settlements because they cannot afford prolonged litigation. 4. Pressure for disposal: emphasis on disposing of large numbers of cases may undermine genuine consent. 5. Limited adjudicatory powers: ordinary Lok Adalats cannot decide a dispute where compromise fails. 6. Quality of settlement: a large number of disposed cases does not necessarily indicate that every settlement was fair. Way forward for Lok Adalats 1. Genuine consent: ensure that settlements are voluntary and free from coercion. 2. Protect weaker parties: provide legal assistance to litigants facing powerful institutions. 3. Quality over quantity: assess fairness and implementation of settlements, not merely disposal numbers. 4. Strengthen legal awareness: inform litigants about their rights and available remedies. 5. Improve institutional capacity: provide adequate members, staff and digital facilities. Arbitration AND Conciliation Legal framework The Arbitration and Conciliation Act, 1996 provides the principal legal framework for arbitration in India. It was enacted to provide an alternative forum for adjudication of disputes, especially between commercial entities. The Act draws substantially on the United Nations Commission on International Trade Law (UNCITRAL) Model Law . Issues WITH Arbitration IN India 1. Limited culture of institutional arbitration Although large companies increasingly resort to arbitration, India has traditionally relied heavily on ad hoc arbitration . Ad hoc arbitration: parties organise proceedings themselves without an established arbitration institution administering the process. Institutional arbitration: proceedings are administered by an established institution under its procedural rules. Issue: ad hoc arbitration may suffer from inconsistent procedures, delays and weak administrative support. 2. High cost of arbitration Arbitrators' fees can be substantial. Proceedings often involve senior lawyers and extensive documentation. Prolonged hearings increase expenses. Small businesses may find arbitration unaffordable. Implication: arbitration may become as expensive as ordinary litigation. 3. Dependence on retired judges Retired judges are frequently appointed as arbitrators. Concerns: Domain experts are not always adequately represented Judicial-style procedures may make arbitration more formal Repeated adjournments can weaken the objective of speedy settlement Way forward: encourage the appointment of technical specialists, commercial experts and professionally trained arbitrators. 4. Judicial intervention and delays Under Section 34 , an arbitral award can be challenged before the competent court on specified grounds. Parties may use legal challenges to delay enforcement. Court proceedings can increase cost and uncertainty. Repeated litigation weakens the advantage of arbitration. Value addition Important: Section 34 does not provide an ordinary appeal on the merits. It permits an application to set aside an award on limited statutory grounds . 5. Weak institutional capacity Inadequate professional arbitration institutions. Uneven quality of arbitrators. Limited accreditation and training. Insufficient awareness among businesses, particularly Micro, Small and Medium Enterprises (MSMEs) . Implication: India faces competition from established international arbitration centres such as Singapore and London . Reforms IN THE Arbitration Framework Arbitration and Conciliation (Amendment) Act, 2015 1. Time-bound arbitration: introduced a framework for timely completion of proceedings. 2. Reduced automatic stays: filing a challenge against an arbitral award no longer automatically stays its enforcement. 3. Limited court intervention: strengthened the principle that courts should interfere only on specified grounds. 4. Fast-track procedure: introduced simplified procedures for faster arbitration. Significance: sought to make arbitration faster, more predictable and commercially effective. Arbitration and Conciliation (Amendment) Act, 2019 The amendment sought to promote institutional arbitration and improve professional standards. 1. Arbitration Council of India (ACI): provided a statutory framework for a body intended to promote arbitration and professional standards. 2. Institutional arbitration: strengthened mechanisms for appointment of arbitrators through designated arbitral institutions. 3. Time limits: modified the statutory time-limit framework, particularly for international commercial arbitration. 4. Confidentiality: introduced provisions protecting the confidentiality of arbitral proceedings, subject to exceptions. 5. Professional standards: sought to improve accreditation, training and institutional quality. B. N. Srikrishna Committee: the reforms drew on recommendations of the High-Level Committee to Review the Institutionalisation of Arbitration Mechanism in India. Arbitration and Conciliation (Amendment) Act, 2021 1. Fraud and corruption: provided for an unconditional stay of an award where the court is prima facie satisfied that the underlying agreement, contract or making of the award was induced or affected by fraud or corruption. 2. Arbitrator qualifications: omitted the earlier Eighth Schedule prescribing qualifications and accreditation norms for arbitrators. Significance: sought to address concerns over fraudulent awards and rigid professional qualification requirements. 2015 Time-bound, fewer automatic stays, fast track 2019 Arbitration Council of India, institutional arbitration, confidentiality 2021 Unconditional stay for fraud or corruption; Eighth Schedule omitted Time limits under Section 29A For domestic arbitrations, the statutory framework generally provides: 12 months from completion of pleadings for making the award A further six months through mutual consent Additional extension by the competent court where legally necessary Value addition Important: the 2019 amendment changed the application of these timelines to international commercial arbitration. It would be incorrect to state that every arbitration must necessarily conclude within 18 months. India International Arbitration Centre (IIAC) Established on 13 June 2022 under the India International Arbitration Centre Act, 2019 , as amended. It is an institution of national importance located in New Delhi . Objectives: 1. Institutional arbitration: promote organised arbitration instead of excessive dependence on ad hoc proceedings. 2. International arbitration: develop India as a preferred destination for international commercial arbitration. 3. Professional arbitrators: maintain panels of qualified Indian and international arbitrators. 4. Training and research: promote professional education in arbitration and other ADR mechanisms. 5. Administrative assistance: provide infrastructure and procedural support for arbitration proceedings. Major issues: Competition from established international arbitration centres Need for greater confidence among domestic and foreign businesses Limited awareness of institutional arbitration Cost concerns for smaller commercial disputes Need for experienced arbitrators and efficient administration Way forward: strengthen institutional credibility, professional independence, cost-effective procedures and international recognition. Commercial Courts ACT, 2015 The Act provides for specialised courts dealing with commercial disputes. It seeks to ensure speedy adjudication of commercial matters and improve the ease of doing business. 1. Commercial Courts: specialised courts for commercial disputes. 2. Commercial Divisions: designated divisions of High Courts for specified commercial matters. 3. Commercial Appellate Divisions: hear appeals under the statutory framework. 4. Specialised procedures: provide for stricter case management and procedural timelines. 5. Specified value: the 2018 amendment reduced the minimum specified value from Rs 1 crore to Rs 3 lakh . Mediation ACT, 2023 The Act provides a comprehensive statutory framework to promote mediation, particularly institutional mediation. It aims to encourage amicable settlement of civil and commercial disputes while reducing dependence on regular courts. 1. Voluntary pre-litigation mediation: provides for parties to voluntarily attempt mediation before filing civil or commercial proceedings. 2. Time-bound mediation: provides for completion within 120 days , extendable by 60 days with consent. 3. Mediated settlement agreement: creates a statutory framework for settlement agreements that are intended to be binding and enforceable. 4. Limited grounds of challenge: provides specified grounds such as fraud, corruption and impersonation for challenging settlement agreements. 5. Mediation Council of India: provides for a national institution to promote mediation and regulate relevant professional standards. 6. Online mediation: recognises technology-based mediation with appropriate consent and safeguards. 7. Community mediation: provides for settlement of disputes likely to affect peace and harmony within a locality. Significance Promotes a culture of settlement rather than litigation. Encourages professional and institutional mediation. Supports cost-effective commercial dispute resolution. Seeks to provide legal recognition to mediated settlements. Promotes community harmony and access to justice. Issues with the Mediation Act 1. Phased implementation: several important provisions require operationalisation. 2. Institutional capacity: effective mediation requires trained mediators and functioning mediation institutions. 3. Public awareness: people may remain unfamiliar with mediation and its legal consequences. 4. Unequal bargaining power: stronger parties may dominate negotiations. 5. Settlement quality: pressure for quick settlement may weaken genuine consent. 6. Government participation: greater use of mediation in government disputes requires clear authority and institutional willingness. Way forward (Mediation) Operationalise the remaining statutory framework. Strengthen the Mediation Council of India and professional standards. Expand training and accreditation of mediators. Improve digital infrastructure for online mediation. Protect voluntariness and fairness of settlements. Encourage mediation in suitable government and commercial disputes. Status OF ADR Infrastructure IN India According to the Ministry of Law and Justice (August 2026): 452 ADR Centres were functioning across India as of March 2026. 1,394 Mediation Centres were functioning. 4,681 Judicial Officers, 10,124 lawyers and 753 other mediators had been trained and deployed as mediators. (verify figures) Major challenges in India's ADR framework 1. Lack of awareness: many litigants and lawyers remain unfamiliar with ADR mechanisms. 2. Unequal bargaining power: weaker parties may be pressured into unfair compromises. 3. High arbitration costs: institutional and ad hoc arbitration may become expensive, particularly for MSMEs. 4. Limited professional capacity: shortage of trained and accredited arbitrators and mediators. 5. Judicial intervention: challenges to arbitral awards and enforcement proceedings may prolong disputes. 6. Weak government participation: government departments may prefer litigation rather than negotiated settlement. 7. Institutional limitations: ADR facilities remain unevenly distributed across regions. 8. Settlement quality: disposal figures alone do not establish that the parties received fair outcomes. WAY Forward Eight steps 1. Promote institutional ADR: strengthen credible arbitration and mediation institutions. 2. Improve professional standards: ensure regular training, accreditation and ethical accountability of arbitrators and mediators. 3. Protect weaker litigants: ensure settlements are voluntary and based on informed consent. 4. Strengthen pre-litigation mediation: improve implementation of Section 12A of the Commercial Courts Act . 5. Expand local access: strengthen Lok Adalats, mediation centres and digital ADR services in underserved regions. 6. Reduce unnecessary court intervention: preserve the finality of arbitration while allowing challenges on recognised legal grounds. 7. Make government a responsible litigant: encourage early settlement of suitable government disputes. 8. Assess quality, not merely disposal: evaluate fairness, compliance with settlements and long-term satisfaction of parties. Value addition Conclusion: ADR can make justice faster, affordable and less adversarial, while reducing pressure on regular courts. However, speed cannot come at the cost of fairness, voluntariness and legal rights. A strong ADR system must combine efficient settlement with protection of weaker parties ."}, {"c": "20", "n": "Judicial Review, Activism, Pendency, Legal Aid and ADR", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Case that upheld power to amend FRs? Shankari Prasad (1951) Case that said FRs cannot be amended? Golaknath (1967) Case of Basic Structure? Kesavananda Bharati (1973) Case on Ninth Schedule after 24 April 1973? I. R. Coelho (2007) Case: tribunal decisions under judicial review? L. Chandra Kumar (1997) Three phases of activism? 1950-67 interpretation; 1967-77 confrontation; 1977 onwards activism Judges linked with PIL? P. N. Bhagwati and V. R. Krishna Iyer Guidelines against misuse of PIL (2010)? State of Uttaranchal v. Balwant Singh Chaufal Alarm clock, not timekeeper means? Courts flag failures but do not take over administration Article 142 gives power to? Do complete justice in a case before the Supreme Court Article 142 examples? Bhopal Gas, Ayodhya 2019, Chandigarh Mayor 2024, TN Governor case 2025 Pendency vs arrears? Pendency: all cases awaiting disposal. Arrears: pending beyond a reasonable or prescribed period CCR above 100% means? More cases disposed than filed; backlog falls Docket explosion vs docket exclusion? Too many cases for courts vs people unable to reach courts Article behind SLP workload? Article 136 Judges per million (Feb 2026)? Law Commission target? About 22; 50 per million (120th Report, 1987) Sanctioned vs working strength (Feb 2026)? 25,894 vs 21,027 Compulsive litigant attitude? \"Let the court decide\" Reserved judgment guidelines? Anil Rai v. State of Bihar (2001) Criminal laws replaced on 1 July 2024? BNS, BNSS, Bharatiya Sakshya Adhiniyam National Litigation Policy year? 2010 e-Courts phases and Phase III outlay? 2007-15; 2015-23; 2023-27; Rs 7,21
