iew 2023 Jallikattu case State amendments upheld by five judges Art 21A inserted by 86th Amendment 2002; in force 1 April 2010 Art 45 now early childhood care below six Ordinary arrest rights ILPM Time to Magistrate 24 hours Arnesh Kumar 2014 police must justify arrest; up to seven years Pankaj Bansal 2023 grounds in writing (PMLA) 22(3) exceptions enemy aliens, preventive detainees Advisory Board limit three months 44th Amendment 1978 changes two months, never in force Entry for preventive detention Union List 9 and Concurrent List 3 NCRWC cap six months Laws in force COFEPOSA, NSA, PBM Act Arts 23 and 24 apply against State and private persons PUDR 1982 below minimum wage can be forced labour Bandhua Mukti Morcha 1984 bonded labour release and rehabilitation Bonded Labour Act year 1976 ITPA year 1956 Is voluntary adult sex work an offence? not itself, under ITPA Buddhadev Karmaskar 2022 equal protection, dignity for sex workers Adolescent age band 14 to 18 Child labour exceptions 2016 family enterprise and audio-visual entertainment (not circus)"}, {"c": "10", "n": "Death Penalty, Articles 21A, 22, 23 and 24", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts in Start Here)"}, {"c": "10", "n": "Death Penalty, Articles 21A, 22, 23 and 24", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards"}, {"c": "11", "n": "Religion, Secularism, Minorities and the Waqf Act", "id": "1-articles-25-26-conversion-essential-reli", "t": "1 · Articles 25-26 · Conversion · Essential Religious Practices · Temples", "x": "1 · Articles 25-26 · Conversion · Essential Religious Practices · Temples # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Fundamental Rights 2 handout pp. 26-30. Prelims PYQs quoted: none quoted in the material. In simple words Art 25 protects conscience and the right to profess, practise and propagate, but propagation is not a right to convert (Stainislaus). Art 26 protects denominations. Courts use the Essential Religious Practices test, with Santhara, Sabarimala and temple control as live examples. FOUR Articles AT A Glance Art Protects 25 freedom of conscience; profess, practise, propagate religion 26 freedom to manage religious affairs 27 no tax for promoting a particular religion 28 religious instruction and worship in educational institutions Article 25 AND Conversion Art 25 subject to public order, morality, health and other Fundamental Rights State may regulate economic, financial, political and other secular activity linked to religion and make welfare and reform laws Note Rev. Stainislaus v. State of Madhya Pradesh (1977): right to propagate does not include a Fundamental Right to convert another person ; upheld laws against conversion by force, fraud or inducement . Criticisms propagation becomes a hollow right religion is a matter of conscience allurement is hard to define burden of proof on voluntariness State laws Several States ban conversion by force, fraud, coercion, some inducement Some need notice or declaration Gujarat Freedom of Religion (Amendment) Act, 2021: Linked conversion with interfaith marriage Reporting and investigation Gujarat HC stayed parts on interfaith marriage without proof of force, fraud or allurement Issue: State may stop forced conversion but not intrude on conscience, privacy, choice Article 26 AND Essential Religious Practices Art 26 denominations may establish and maintain institutions , manage religious affairs , and own and administer property as per law (26(c), (d)) ERP doctrine (Shirur Mutt, 1954) is it essential or integral to the religion? within protected religious affairs? subject to public order, morality, health, other rights ? religious or really a secular activity the State can regulate? Memory aid · EPSR ERP test: E ssential part? · P rotected sphere? · S ubject to limits? · R eligious or secular? (own mnemonic) Issues with ERP courts lack theological competence may privilege some practices black-and-white answers on diverse beliefs Reform vs autonomy Balance religious freedom, equality, constitutional morality, reform LIVE Examples Santhara (Nikhil Soni, 2015) Rajasthan HC declared the Jain fast-to-death unlawful, not an ERP Supporters: spiritual discipline, not suicide , autonomy SC stayed the judgment in 2015, so the HC ban is not operative 2016 Haji Ali Dargah: Bombay HC upheld women's right to enter the inner sanctum 2016 Shani Shingnapur: Bombay HC stressed women's access; women entered 2018 Sabarimala: SC 4:1 held exclusion of women of menstruating age unconstitutional 2019 review: larger questions on religious freedom and ERP referred to a larger Bench 2026 nine-judge bench heard the reference; reserved judgment May 2026 (verify) Four competing dimensions individual vs State individual vs individual group vs State State regulation in public interest Loudspeakers and Azaan (Allahabad HC, 2020) Azaan is religiously significant but loudspeakers are not essential Azaan by human voice continues Loudspeakers can be regulated for noise pollution Religious Property AND Temple Management Shirur Mutt principles religious autonomy in protected affairs State may regulate economic, financial, administrative activity donations, accounts, property can be regulated but no excessive interference (judicial review) For regulation Against excess regulation financial transparency and accountability weakens religious autonomy stops misuse of donations and property bureaucratisation, political interference protects devotees, promotes reform excessive State control Models and cases SGPC: historic Gurdwaras under the Sikh Gurdwaras Act, 1925 , with elected community participation Char Dham Devasthanam Act, 2019 (Uttarakhand): Board over major shrines Repealed 2021 after opposition Sree Padmanabhaswamy (2020): SC upheld Travancore Royal Family's traditional management with court-set arrangement temples with different arrangements: Tirupati, Jagannath, Vaishno Devi, Badrinath, Kedarnath Property 26(c), (d) own and administer property per law Art 300A: no deprivation of property except by authority of law religious property is not immune from lawful acquisition for public purposes, but must respect religious character"}, {"c": "11", "n": "Religion, Secularism, Minorities and the Waqf Act", "id": "2-articles-27-28-secularism-communalism", "t": "2 · Articles 27-28 · Secularism · Communalism", "x": "2 · Articles 27-28 · Secularism · Communalism # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Fundamental Rights 2 handout pp. 30-33. Prelims PYQs quoted: none quoted in the material. In simple words Art 27 bars taxes that promote a religion; Art 28 bars religious instruction in wholly State-funded schools. India follows principled distance, not strict separation. Communalism, narrow secularism and weak institutions threaten it; the cure is acceptance, scientific temper, rule of law and inclusive development. Articles 27 AND 28 Art 27 no one compelled to pay taxes whose proceeds go to promote a particular religion a regulatory fee for administering religious institutions is not automatically barred Institution (Art 28) Religious instruction wholly State-funded prohibited, subject to 28(2) State-administered but set up under a religious endowment or trust permitted where the trust requires it State-aided or recognised permitted, but no compulsion without prescribed consent (28(3)) Education vs instruction Aruna Roy (2002): religious education (about religions, philosophy, ethics) is not prohibited religious instruction (promoting adherence to one religion) D. A. V. College (1971): teaching the life and teachings of Guru Nanak is not automatically prohibited instruction Against compulsory prayers freedom of conscience Art 28 scientific temper For ethical values Indian culture value-based education Way forward / key point Way forward: inclusive, voluntary , value-based practice without imposing one community's beliefs. Secularism Meaning George Jacob Holyoake popularised the term State not controlled by religion Freedom to follow, change or not follow a religion No discrimination on religion Indian model \"Secular\" added to the Preamble by the 42nd Amendment, 1976 Spirit present from the start not strict separation: Principled Distance ( Rajeev Bhargava ): neither hostile to nor merged with religion Engages for welfare, equality, reform features: No theocracy Religious freedom Equality of religions Principled intervention Protection of diversity basis: Preamble, Arts 14-16, 25-28, 29-30, 51A Cases S. R. Bommai (1994): secularism is part of the Basic Structure Balram Singh (2024): rejected challenges to \"Socialist\" and \"Secular\" in the Preamble Country Model India principled distance, equal freedom, intervention for reform USA constitutional separation of Church and State France laïcité : secular public institutions, limits on public religious display (response to Church power) UK established Church with broad religious freedom Why secularism matters J. S. Mill: harm principle, individual freedom John Rawls: veil of ignorance, fairness peace and harmony scientific temper and reform democracy : equal participation Memory aid · IFPMD Importance: I ndividual freedom (Mill) · F airness (Rawls) · P eace · M odernity · D emocracy. (own mnemonic) Communalism Meaning and types Using religious identity to create divisions and competing political interests Treats communities as homogeneous and conflicting Majority communalism (may pose as nationalism) and minority communalism (separatism, polarisation) Both threaten secularism and integration Challenges to secularism narrow conception: State-centric, tolerance not acceptance, ignores intra-religious (caste, sect) divides extreme religiosity and polarisation: Ritual and costume differences Mobilisation on religious identity Demonisation, mob violence failure of institutions: family, education, political parties weak law: no single Central law on communal violence, prevention, rehabilitation, compensation developmental imbalances: insecurity from unequal opportunity Memory aid · NEFLD Challenges: N arrow concept · E xtreme religiosity · F ailing institutions · L aw gaps · D evelopment gaps. (own mnemonic) Note Sachar Committee (2006): documented Muslims' disadvantages in education, employment, credit, public-sector representation ; urged equitable development. Amartya Sen: people have multiple identities ; a singular identity breeds hostility and blocks cooperation. Measures acceptance over tolerance scientific temper and constitutional morality rule of law against violence and discrimination inclusive development constructive social work like Gandhi's"}, {"c": "11", "n": "Religion, Secularism, Minorities and the Waqf Act", "id": "3-articles-29-30-minority-education-rte-am", "t": "3 · Articles 29-30 · Minority Education · RTE · AMU", "x": "3 · Articles 29-30 · Minority Education · RTE · AMU # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Fundamental Rights 2 handout pp. 34-38. Prelims PYQs quoted: none quoted in the material. In simple words Art 29(1) protects any section's culture (not only minorities); 29(2) bars discrimination in admission. Art 30 lets minorities run their institutions but not maladminister. Minority status is State-wise (TMA Pai). Pramati exempted minority schools from RTE; AMU (2024) overruled Azeez Basha. Articles 29 AND 30 Safeguards for minorities common domain: Preamble, Arts 14-16, 25-28, 46, Fundamental Duties special domain: Arts 29, 30 15(5) excludes Art 30(1) minority institutions from its special admission rules Clause Content 29(1) any section of citizens with a distinct language, script or culture may conserve it; not only minorities 29(2) no denial of admission to State-maintained or aided institutions on religion, race, caste, language only 30(1) religious and linguistic minorities may establish and administer educational institutions of choice 30(1A) protects the right on compulsory acquisition of property 30(2) no discrimination in State aid because of minority management Value addition Right to administer is not right to maladminister. State may regulate standards, qualifications, transparency. WHO IS A Minority Note T. M. A. Pai Foundation (2002): for Art 30, minority status (religious and linguistic) is determined State-wise , not nationally. E.g. Hindus are a religious minority in Punjab, Nagaland, Mizoram . The Centre's notified list is statutory, for schemes and institutions. Six notified religious minorities Muslims Christians Sikhs Buddhists Zoroastrians (Parsis) Jains (notified 2014) Memory aid · MCSBZJ Six minorities: M uslims · C hristians · S ikhs · B uddhists · Z oroastrians · J ains. (own mnemonic) Linguistic minorities Art 347: President may direct recognition of a language on substantial demand Art 350A: mother-tongue instruction at primary stage Art 350B: Special Officer appointed by the President Report laid before Parliament and sent to States Institutions NCM: statutory, National Commission for Minorities Act, 1992 NCMEI: NCMEI Act, 2004 , on minority status and educational rights Regulation AND RTE 29(2) vs 30(1) Aided minority institutions may give reasonable preference to their community but cannot exclude all others State may regulate admission for merit and transparency Unaided institutions have more flexibility with fair, non-exploitative admission Note Sk. Md. Rafique (2020): West Bengal Madrasah Service Commission Act: teacher selection through a statutory commission is not automatically unconstitutional for minority institutions; regulation must not extinguish Art 30 rights. Note Pramati Educational and Cultural Trust (2014): RTE s.12(1)(c) (25% entry seats for weaker sections) cannot be applied to minority institutions in a way that impairs Art 30(1); aided and unaided minority institutions exempted . Critics: RTE aims at social inclusion ; exemption reduces opportunity. Suggestion: admit weaker children from their own community. Note Anjuman Ishaat-e-Taleem Trust (Sept 2025) (verify): SC doubted the blanket exemption ; read Arts 21A and 30 harmoniously ; RTE need not destroy minority character; called for larger Bench . Pramati stays binding until altered. Aligarh Muslim University 1877 Muhammadan Anglo-Oriental College (Sir Syed Ahmad Khan); AMU Act, 1920 makes it a university 1967 S. Azeez Basha: not a minority institution because established by statute 1981 AMU Amendment Act recognises the Muslim community's role 2005-06 Allahabad HC rejected the minority-based reservation 2019 SC refers issue to seven judges 8 Nov 2024 AMU v. Naresh Agarwal: 4:3 ; statutory incorporation does not remove minority status; test = origin, purpose, community role ; pre-1950 institutions can claim Art 30; national importance does not exclude. Azeez Basha overruled but AMU's status left to a regular Bench Minority Welfare Schemes AND Significance Against minority-specific schemes Art 15(1) religion-only basis welfare should follow deprivation other protections exist For socio-economic disadvantage Art 14 reasonable classification Art 46 national integration Way forward / key point Minority schemes are not automatically unconstitutional ; validity depends on legal basis, objective, eligibility, equality. Significance of 29-30: identity, equality, minority autonomy, inclusive education, integration."}, {"c": "11", "n": "Religion, Secularism, Minorities and the Waqf Act", "id": "4-waqf-amendment-act-2025-nazul-land", "t": "4 · WAQF (amendment) ACT, 2025 · Nazul LAND", "x": "4 · WAQF (amendment) ACT, 2025 · Nazul LAND # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Fundamental Rights 2 handout pp. 38-39. Prelims PYQs quoted: none quoted in the material. In simple words The 2025 amendment changes Waqf registration, boards and dispute handling. The SC in September 2025 refused a full stay but paused the five-year Muslim requirement, executive decisions on government-land disputes, and capped non-Muslim members. The final ruling on validity is pending. Nazul land is government land under lease. Background AND KEY Changes Waqf permanent dedication of property for religious, charitable or other purposes under Muslim law: mosques, dargahs, graveyards, schools Waqf Act, 1995 was the main framework The Waqf (Amendment) Act, 2025 (also linked to the UMEED framework) changes registration, management and oversight Provision Change Non-Muslim representation non-Muslim members in the Central Waqf Council and State Waqf Boards Waqf by user restricts future recognition based only on long religious use; protects existing registered Waqfs Five-year requirement person creating a Waqf must have professed Islam for at least five years Government oversight government-designated officer in disputes over government property claimed as Waqf For transparency and accountability property protection against fraudulent claims modernisation of records better supervision Against Art 26 autonomy hit by non-Muslim members waqf by user hurts undocumented religious properties five-year rule intrudes on religious freedom separation of powers: executive deciding property rights Constitutional questions Art 14 equality Art 25 (five-year rule) Art 26 (denominational administration) Separation of powers Supreme Court Interim Order, September 2025 Note SC refused to stay the whole Act but suspended parts (verify against the order): Three directions five-year practising Muslim rule: stayed until States set a mechanism to decide who qualifies government property disputes: Stayed executive power to change Waqf status and revenue records before adjudication Disputes go to the Waqf Tribunal and courts non-Muslim members: not suspended but capped at four in the Central Waqf Council and three in State Waqf Boards Memory aid · FGN Interim order: F ive-year rule paused · G overnment-land disputes to tribunal · N on-Muslim members capped (4 and 3). (own mnemonic) Value addition Interim relief is not a final ruling on validity; keep the two apart in answers. Nazul LAND What it is Government-owned land leasable to persons or institutions Many came under government ownership in the colonial period Government keeps ownership , others hold leasehold Uses: housing, schools, hospitals leasehold: Right to use for a period Freehold: ownership Link to Waqf dispute: can long religious use create Waqf status over land claimed by government? The interim order stops executives from altering disputed status before proper adjudication Core issue: balance protection of religious endowments, property rights, transparency and lawful oversight"}, {"c": "11", "n": "Religion, Secularism, Minorities and the Waqf Act", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Stainislaus 1977 propagation is not a right to convert ERP doctrine origin Shirur Mutt 1954 Santhara 2015 Rajasthan HC banned; SC stayed Sabarimala 2018 4:1, exclusion unconstitutional Sabarimala reference nine judges, reserved May 2026 (verify) Loudspeaker ruling 2020 not essential to Azaan; regulate noise SGPC law Sikh Gurdwaras Act 1925 Char Dham Act 2019, repealed 2021 Property protection article Art 300A Art 27 no tax to promote a religion Art 28 fully State-funded no religious instruction Aruna Roy 2002 religious education is not religious instruction Who popularised secularism George Jacob Holyoake \"Secular\" added by 42nd Amendment 1976 Indian secularism term principled distance, Rajeev Bhargava Bommai 1994 secularism is basic structure Balram Singh 2024 Socialist and Secular words upheld Sachar Committee 2006 Sen on identity multiple identities 29(1) holders any section of citizens, not only minorities 29(2) protects against discrimination in admission Minority unit State-wise, TMA Pai 2002 Jains notified 2014 Art 350B Special Officer for linguistic minorities NCM Act 1992 Pramati 2014 minority schools exempt from RTE 2025 doubt on Pramati Anjuman Ishaat-e-Taleem, larger Bench (verify) Azeez Basha 1967 AMU not minority; overruled 2024 AMU 2024 bench seven judges, 4:3, test: origin, purpose, community role Waqf Act original 1995 Amendment year 2025, UMEED framework Waqf by user change restricts future recognition by long use alone Five-year rule must profess Islam five years; stayed pending mechanism Non-Muslim caps four in Central Council, three in State Boards Where disputes go Waqf Tribunal and courts Nazul land government-owned, leased out"}, {"c": "11", "n": "Religion, Secularism, Minorities and the Waqf Act", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts in Start Here)"}, {"c": "11", "n": "Religion, Secularism, Minorities and the Waqf Act", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards"}, {"c": "12", "n": "Directive Principles, Property, Uniform Civil Code and Fundamental Duties", "id": "1-dpsp-classification-fundamental-rights-v", "t": "1 · DPSP · Classification · Fundamental Rights VS DPSP", "x": "1 · DPSP · Classification · Fundamental Rights VS DPSP # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · DPSP and Fundamental Duties handout pp. 1-3. Prelims PYQs quoted: none quoted in the material. In simple words DPSPs (Part IV, Articles 36-51) are goals the State must follow to build a welfare State. Courts cannot enforce them, but use them to interpret Fundamental Rights. Courts first put Fundamental Rights above DPSPs (Champakam 1951), then moved step by step to the present view that the two must be balanced and harmonised (Minerva Mills 1980): two wheels of one chariot. WHAT ARE DPSPs? The Directive Principles of State Policy are in Part IV, Articles 36 to 51. They aim to set up a Welfare State based on social, economic and political justice. Why they are non-justiciable (cannot be enforced in court): Financial constraints: socio-economic rights need large resources. Administrative capacity: some principles need institutions and infrastructure first. Social conditions: reforms like the Uniform Civil Code need careful thought about social diversity. Nature of the principles: some, such as international peace, are broad policy aims and not individual rights that a court can enforce. Important: being non-justiciable does not make DPSPs legally irrelevant. Courts use them to interpret Fundamental Rights and to examine the constitutional purpose of laws. Classification OF DPSPs DPSPs are commonly sorted into Socialist, Gandhian and Liberal-Intellectual principles. This is an academic classification, not written in the Constitution, and some Articles fit more than one group. Classification Articles Main objective Socialist 38, 39, 39A, 41, 42, 43, 43A Social and economic justice, welfare and protection of labour Gandhian 40, 43, 43B, 46, 47, 48 Village self-government, cottage industries, weaker sections and rural welfare Liberal-Intellectual 44, 45, 48A, 49, 50, 51 Civil reform, education, environment, heritage, judicial independence and international peace What the main Articles say (general knowledge, verify) 38: Promote a social order based on justice and reduce inequalities. 39: equal right to livelihood, fair distribution of resources, no concentration of wealth, equal pay, protection of workers and children. 39A: equal justice and free legal aid. 40: village panchayats. 41: right to work, education and public assistance. 42: just working conditions and maternity relief. 43: living wage Cottage industries. 43A: workers' participation in management. 43B: cooperative societies. 44: Uniform Civil Code. 45: early childhood care and education. 46: promote the interests of SCs, STs and weaker sections. 47: nutrition, public health and prohibition of intoxicants. 48: modern agriculture and animal husbandry, cow protection. 48A: protect environment, forests and wildlife. 49: protect monuments of national importance. 50: separate judiciary from executive. 51: promote international peace and respect for international law Fundamental Rights vs DPSP: Judicial Evolution The relationship between Part III (Fundamental Rights) and Part IV (DPSP) has been shaped by court decisions. State of Madras v. Champakam Dorairajan (1951) The Supreme Court held that Fundamental Rights prevail over DPSPs in a direct conflict. DPSPs cannot override enforceable Fundamental Rights. Golaknath v. State of Punjab (1967) The Court held that Parliament could not amend Fundamental Rights . This limited Parliament's power to amend rights in order to carry out DPSPs. Kesavananda Bharati v. State of Kerala (1973) Parliament can amend Fundamental Rights to implement DPSPs , but an amendment cannot violate the Basic Structure . Minerva Mills v. Union of India (1980) The Court held that harmony and balance between Fundamental Rights and DPSPs is part of the Basic Structure . Giving absolute priority to either Part III or Part IV would upset the constitutional balance. The two are complementary and supplementary , not inherently in conflict. Present constitutional position Parliament may amend Fundamental Rights to implement DPSPs, subject to the Basic Structure doctrine . Courts try harmonious construction between Parts III and IV. DPSPs help courts interpret the scope of Fundamental Rights, especially Article 21 . Article 31C gives special protection to qualifying laws that implement Articles 39(b) and 39(c) . Way forward / key point Core principle: Fundamental Rights and DPSPs are like two wheels of a chariot . Both are needed to reach the Constitution's goal of a social revolution."}, {"c": "12", "n": "Directive Principles, Property, Uniform Civil Code and Fundamental Duties", "id": "2-article-39-b-c-right-to-property-eminent", "t": "2 · Article 39(b)(c) · Right TO Property · Eminent Domain · Nine-judge Verdict 2024", "x": "2 · Article 39(b)(c) · Right TO Property · Eminent Domain · Nine-judge Verdict 2024 # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · DPSP and Fundamental Duties handout pp. 3-4. Prelims PYQs quoted: none quoted in the material. In simple words Article 39(b) wants community resources shared for the common good and 39(c) wants wealth not concentrated. The right to property is no longer fundamental (44th Amendment 1978); it is a constitutional right under Article 300A. In Property Owners Association (5 Nov 2024) a nine-judge Bench said not every private property is a community resource, but some can be, and Article 31C continues to protect qualifying laws. Article 39(b) AND (c) Article 39(b): the State should ensure that the ownership and control of the material resources of the community are distributed so as to serve the common good. Article 39(c): the economic system should not result in the concentration of wealth and means of production to the common detriment. Together they aim at economic justice and at preventing too much concentration of economic power. Right TO Property Under THE Constitution The Right to Property was first a Fundamental Right under Articles 19(1)(f) and 31. The 44th Constitutional Amendment Act, 1978 removed its Fundamental Right status. It is now a constitutional right under Article 300A: no person shall be deprived of property except by authority of law. Important features Constitutional right: no longer a Fundamental Right. Authority of law: the executive cannot take away property by a mere administrative order without legal authority. Public purpose: compulsory acquisition must serve a genuine public purpose. Compensation: the protection does not guarantee market-value compensation in every case, but compensation and acquisition procedures remain open to constitutional scrutiny. Judicial review: property acquisition laws and actions can be challenged in court. Eminent domain is the State's power to acquire private property for a public purpose under a valid law. Key issues: Balancing private ownership and public interest Fair compensation and rehabilitation Protection against arbitrary acquisition Distributing resources for social and economic justice Kolkata Municipal Corporation v. Bimal Kumar Shah (2024) The Supreme Court listed seven procedural safeguards for lawful property acquisition: 1. Right to notice: the owner must be told of the proposed acquisition. 2. Right to be heard: objections must be properly considered. 3. Reasoned decision: authorities must explain the acquisition decision. 4. Public purpose: acquisition must serve a legitimate public purpose. 5. Fair compensation: the framework must provide fair compensation or restitution. 6. Timely process: efficient procedure without unreasonable delay. 7. Conclusion of proceedings: the process must reach a lawful end. Significance: Article 300A protects more than the formal need for a law. It also needs safeguards against arbitrary deprivation. Memory aid · NHRP-FTC N otice · H earing · R easons · P ublic purpose · F air compensation · T imely · C onclusion (the seven safeguards) (own mnemonic) Property Owners Association v. State OF Maharashtra (2024) Background: the case concerned provisions of the Maharashtra Housing and Area Development Act, 1976 on acquiring certain properties for redevelopment. The central question: can privately owned property be treated as a material resource of the community under Article 39(b)? Judgment: on 5 November 2024 a nine-judge Constitution Bench gave a 7:2 majority judgment. Key holdings 1. Not every private property is a community resource. Not all privately owned resources qualify as material resources of the community under Article 39(b), though some may . 2. No automatic State claim. The State cannot treat all private property as a community resource just because redistribution may serve a public purpose. 3. Criteria for identifying community resources: The nature and characteristics of the resource Its impact on community welfare Its scarcity And the consequences of it being concentrated in private hands 4. Constitutional flexibility. The Constitution does not prescribe a single economic model Governments may adopt different economic policies within constitutional limits 5. Article 31C continues to operate. It still protects qualifying laws that implement Articles 39(b) and 39(c) from challenge under Articles 14 and 19. But this does not remove every constitutional limit or stop scrutiny of whether a law truly satisfies Article 31C. Significance of the judgment Protection of property rights: stops every private resource being automatically labelled a community resource. Economic justice: allows redistribution where resources genuinely satisfy Article 39(b). Judicial clarity: gives criteria to identify material resources of the community. Balanced economic model: recognises both public welfare and private ownership. Constitutional balance: reinforces the relationship between DPSPs and constitutional rights. Way forward / key point Core principle: Article 39(b) promotes distribution of resources for the common good, but public welfare cannot justify treating every privately owned resource as community property."}, {"c": "12", "n": "Directive Principles, Property, Uniform Civil Code and Fundamental Duties", "id": "3-uniform-civil-code-article-44-personal-l", "t": "3 · Uniform Civil CODE · Article 44 · Personal LAWS · Uttarakhand", "x": "3 · Uniform Civil CODE · Article 44 · Personal LAWS · Uttarakhand # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · DPSP and Fundamental Duties handout pp. 4-7. Prelims PYQs quoted: none quoted in the material. In simple words Article 44 asks the State to try for a Uniform Civil Code, one set of civil laws on marriage, divorce, maintenance, adoption and succession for all religions. India has separate personal laws, so the debate is equality and gender justice against religious freedom and diversity. Key cases: Shah Bano, Danial Latifi, Shayara Bano, Sarla Mudgal, Abdul Samad. The 21st Law Commission (2018) preferred gradual reform. Uttarakhand has a State UCC since 27 January 2025. Article 44 AND Personal LAWS Article 44 directs the State to endeavour to secure a Uniform Civil Code (UCC) throughout India. A UCC would give common civil laws on marriage, divorce, maintenance, adoption, succession and inheritance, irrespective of religion . India has different personal laws on these matters. That creates a debate between equality, religious freedom, gender justice and cultural diversity . Community / framework Important legislation Hindus, Buddhists, Jains and Sikhs Hindu Marriage Act 1955; Hindu Succession Act 1956; Hindu Adoptions and Maintenance Act 1956; Hindu Minority and Guardianship Act 1956 Muslims Muslim Personal Law (Shariat) Application Act 1937; Dissolution of Muslim Marriages Act 1939; other applicable laws Christians Indian Christian Marriage Act 1872; Indian Divorce Act 1869 Parsis Parsi Marriage and Divorce Act 1936 Religion-neutral civil marriage Special Marriage Act 1954 Special Marriage Act, 1954 Provides a civil marriage framework irrespective of religion or caste. Lets interfaith couples marry without religious conversion. Contains provisions about public notice and objections . Concern: the notice procedure can expose couples to family pressure, harassment or threats. Judicial Developments ON Personal LAWS Shah Bano (1985) The question was whether a divorced Muslim woman could claim maintenance under Section 125 CrPC, 1973 . The Supreme Court held that Section 125 is religion-neutral , so she could claim maintenance if she met the statutory conditions, and payment of Mahr did not automatically end the husband's maintenance duty. Muslim Women (Protection of Rights on Divorce) Act, 1986 Created a separate statutory framework for the rights of divorced Muslim women. Widely seen as a response to the Shah Bano judgment . Danial Latifi v. Union of India (2001) The Supreme Court upheld the validity of the 1986 Act and held that the husband must make a reasonable and fair provision for the divorced wife within the Iddat period, and this is not limited to her needs during Iddat alone. Shayara Bano v. Union of India (2017) By a 3:2 majority the Supreme Court set aside instant Triple Talaq (Talaq-e-Biddat) . Muslim Women (Protection of Rights on Marriage) Act, 2019 Declared instant Triple Talaq void and illegal and made pronouncing it a criminal offence with up to three years imprisonment. Mohd. Abdul Samad v. State of Telangana (2024) The Supreme Court reaffirmed that divorced Muslim women can claim maintenance under Section 144 BNSS , alongside remedies under the 1986 Act. Criticism of the 2019 Act Criminalisation: critics say a marital issue already made legally ineffective need not mean imprisonment. Family welfare: imprisonment can hurt the financial security of women and children where the husband is the sole earner. Abandonment: the law does not directly address abandonment of spouses across all communities. Significance of Abdul Samad: Maintenance rights are not defeated merely because a personal law exists (secular protection) It strengthens financial protection of divorced Muslim women (gender justice) Personal-law legislation and general maintenance provisions can work together (harmonious interpretation) Polygamy and personal laws Polygamy is having more than one spouse at the same time. Hindu marriage law generally prohibits a second marriage during the lifetime of an existing spouse. Traditional Muslim personal law allows a Muslim man up to four wives , subject to applicable legal conditions. The position differs across communities and statutes. Sarla Mudgal v. Union of India (1995): a Hindu husband cannot escape the law against bigamy merely by converting to Islam without dissolving the first marriage. Issue: the debate is about religious autonomy, equality before law and women's rights. FOR AND Against A Uniform Civil CODE Arguments in favour 1. Gender justice. Many personal laws grew in patriarchal conditions. A UCC may remove discriminatory practices in marriage, divorce, maintenance and inheritance. Example: the debate on Triple Talaq and maintenance for divorced Muslim women. 2. National integration. Separate personal laws mean separate legal frameworks for communities Supporters say a common civil framework promotes equal citizenship and national consolidation 3. Secularism. A religion-neutral civil framework may lessen the role of religious identity in deciding legal rights and duties. 4. Simplification of laws. A common framework can reduce procedural differences and simplify disputes on marriage, divorce and succession. 5. Equality before law. Similar civil matters should be governed by common principles whatever the religion. Arguments against 1. Religious and cultural diversity. India has many religions, denominations and communities with different customs A single code may fail to fit them all 2. Minority apprehensions. Minorities may see a UCC as imposing the personal laws or culture of the majority, causing distrust and opposition. 3. Freedom of religion. Personal laws may involve religious practice Reform must balance Articles 25 and 26 with equality, dignity and other rights 4. Difficulty framing uniform rules. Communities follow different rules on marriage, divorce, inheritance and adoption Finding common rules acceptable to all is hard 5. Selective reform. Critics question the heavy focus on Article 44 when other DPSPs on employment, health, education and social security remain poorly implemented. 6. Uniformity vs equality. Uniform rules do not automatically give substantive equality. The aim should be to remove discrimination without needlessly destroying cultural diversity. 21st Law Commission consultation paper (2018) observed that a UCC was neither necessary nor desirable at that stage. It preferred reforming discriminatory provisions within existing family laws while keeping legitimate diversity. Suggestions: Remove discriminatory practices from personal laws Strengthen equality and dignity, especially for women Reform family laws gradually through consultation Avoid treating diversity itself as a problem Uttarakhand Uniform Civil CODE The Uniform Civil Code of Uttarakhand, 2024 came into force on 27 January 2025. Uttarakhand became the first State in independent India to adopt such a comprehensive State-level UCC. Features: A common legal framework on marriage, divorce, maintenance and succession for persons covered Compulsory marriage registration Polygamy prohibited within the framework Registration and legal requirements for live-in relationships Scheduled Tribes and certain constitutionally protected customary rights are excluded 2026 development: Uttarakhand amended its UCC framework through the UCC Amendment Ordinance, 2026 , followed by the UCC Amendment Act, 2026 . (current affairs; verify) Concerns: Privacy (mandatory live-in registration raises personal-autonomy questions) Administrative oversight (more State involvement in private relationships) Cultural diversity (exemptions raise questions about what uniformity means) Implementation (needs public awareness and easy procedures) Significance: an important State-level example to study the benefits and difficulties of a UCC. Way forward Gradual reform: remove discriminatory provisions through consultation with the affected communities. Gender justice: equality in marriage, divorce, maintenance and inheritance. Optional civil framework: strengthen accessible, religion-neutral alternatives under civil law. Stakeholder consultation: women, legal experts, minority communities and civil society. Constitutional balance: protect equality and dignity without needless interference in religious and cultural freedom. Way forward / key point Conclusion: the aim of a UCC should be equality and gender justice, not uniformity for its own sake. Reform should be gradual, inclusive and consistent with constitutional values."}, {"c": "12", "n": "Directive Principles, Property, Uniform Civil Code and Fundamental Duties", "id": "4-dpsp-significance-and-criticism-fundamen", "t": "4 · DPSP Significance AND Criticism · Fundamental Duties · Article 51A", "x": "4 · DPSP Significance AND Criticism · Fundamental Duties · Article 51A # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · DPSP and Fundamental Duties handout pp. 7-10. Prelims PYQs quoted: none quoted in the material. In simple words DPSPs give long-term direction to every government and a yardstick for citizens, but they are non-justiciable, costly and unevenly implemented. Fundamental Duties (Article 51A, Part IVA) were added by the 42nd Amendment (1976) on the Swaran Singh Committee's advice; the 86th Amendment (2002) made them eleven. They are non-justiciable, so courts use them to support rights and policies rather than to punish citizens directly. Significance OF DPSPs 1. Welfare State: DPSPs deepen the Preamble's commitment to social and economic justice. 2. Policy direction: a common framework for Central and State governments even when political leadership changes. 3. Complement to Fundamental Rights: Part III protects individual liberty Part IV creates the social conditions needed to enjoy those rights 4. Democratic accountability: a yardstick for citizens to judge government policy. 5. Continuing relevance: inequality, environmental damage, unemployment and social exclusion make DPSPs more important. Criticism OF DPSPs 1. Non-justiciable nature. Courts cannot enforce DPSPs directly, so implementation depends on political will and State capacity. Critics called them \"pious superfluities\" and compared them to a cheque that cannot be cashed until resources become available. 2. Financial and administrative constraints. Employment, health, education and social security need large public spending. States differ in financial and administrative capacity, which affects implementation. 3. Unsystematic enumeration. The Constitution mixes broad objectives such as justice and equality with specific policies such as prohibition and cattle protection. This causes differences of scope and interpretation. 4. Lack of clarity. Some principles are broadly worded and leave much discretion to governments. But this flexibility also lets them adapt to changing social and economic conditions. 5. Tension between individual freedom and public welfare. Some directives can clash with liberty, religious freedom and economic choice. Examples: prohibition (Article 47), cattle slaughter (Article 48) and the Uniform Civil Code (Article 44). 6. Uneven implementation. Directives on labour welfare, social security, weaker sections and equal opportunity are only partly fulfilled. The problem is not just missing laws but weak implementation and unequal access to benefits . Way forward / key point Conclusion: DPSPs remain essential to India's vision of a Welfare State. Success depends on sustained political commitment, enough resources and effective implementation. The goal is social and economic justice without weakening Fundamental Rights. Fundamental Duties: Article 51A Fundamental Duties are in Part IVA, Article 51A. They were added by the 42nd Constitutional Amendment Act, 1976 on the recommendation of the Swaran Singh Committee. The 86th Amendment Act, 2002 added one more duty, so there are now 11 Fundamental Duties. Rationale: To reduce indifference to nation-building and larger public interests To balance individual freedom with social responsibility To encourage citizens to take an active part in national development The 11 duties (general knowledge, verify wording): to (a) respect the Constitution, its ideals, the National Flag and the National Anthem; (b) cherish the noble ideals of the freedom struggle; (c) uphold and protect the sovereignty, unity and integrity of India; (d) defend the country and render national service when called; (e) promote harmony and brotherhood and renounce practices derogatory to the dignity of women; (f) value and preserve the rich heritage of our composite culture; (g) protect and improve the natural environment and have compassion for living creatures; (h) develop scientific temper, humanism and the spirit of inquiry and reform; (i) safeguard public property and abjure violence; (j) strive towards excellence in individual and collective activity; (k) the parent or guardian to provide opportunities for education to a child aged 6-14 years (added in 2002). Rights and duties: two sides of one coin. Rights protect individual freedom; duties remind citizens of their responsibilities to society. Fundamental Right Related Fundamental Duty Article 15: prohibition of discrimination Article 51A(e): promote harmony and renounce practices derogatory to women Article 19: freedom of speech and expression Article 51A(h): develop scientific temper and the spirit of inquiry Article 21: right to life Article 51A(g): protect the environment and living creatures Article 21A: right to education Article 51A(k): parents must provide educational opportunities to children aged 6-14 Quote Gandhi's view: citizens should give importance to performing their duties; rights and duties are closely connected. Constitutional position Fundamental Rights: mainly protect individuals against arbitrary State action. Fundamental Duties: encourage responsible behaviour towards society and the nation. DPSPs: direct the State toward social and economic justice. Together, Parts III, IV and IVA support the vision of individual dignity and collective welfare. Judicial Interpretation OF Fundamental Duties 1. Bijoe Emmanuel v. State of Kerala (1986): freedom of conscience. Three students of the Jehovah's Witnesses refused to sing the National Anthem because of their religious beliefs, though they stood respectfully while it was sung. The Supreme Court held that students cannot be forced to sing the Anthem against genuine religious belief. Their conduct was protected under Articles 19(1)(a) and 25. Respect for national symbols does not require compulsory singing in every case. Significance: Fundamental Duties cannot override freedom of conscience and religion. 2. M. C. Mehta v. Union of India: environment. The Court used Article 51A(g) to stress citizens' duty to protect the environment, and directed steps to promote environmental education, including teaching environmental awareness in educational institutions. Significance: duties can support judicial directions for environmental protection. 3. Vellore Citizens Welfare Forum v. Union of India (1996). The Court recognised key environmental principles: the Precautionary Principle , the Polluter Pays Principle and Sustainable Development , strengthening environmental protection under Articles 21, 48A and 51A(g) . 4. National Anthem in cinema halls: Shyam Narayan Chouksey. In 2016 the Court directed cinema halls to play the Anthem before films. In 2018 it modified this and made playing the Anthem optional , keeping safeguards for respectful conduct and persons with disabilities. Important: the Prevention of Insults to National Honour Act, 1971 punishes specified acts of disrespect. It does not create a general duty to sing the National Anthem. Laws that give effect to Fundamental Duties. Duties are non-justiciable, but several laws support them. Fundamental Duty Related law or framework Respect for National Flag and Anthem: 51A(a) Prevention of Insults to National Honour Act 1971; Flag Code of India Protect the environment: 51A(g) Environment (Protection) Act 1986; Wildlife (Protection) Act 1972 Preserve cultural heritage: 51A(f) Ancient Monuments and Archaeological Sites and Remains Act 1958 Dignity of women: 51A(e) Dowry Prohibition Act 1961; Protection of Women from Domestic Violence Act 2005 Safeguard public property: 51A(i) Prevention of Damage to Public Property Act 1984 Education of children: 51A(k) Right of Children to Free and Compulsory Education Act 2009 Value addition Important distinction: these laws give effect to related constitutional objectives. Not every breach of a Fundamental Duty automatically becomes a criminal offence. Committee Recommendations Justice J. S. Verma Committee (1999) studied how duties can be promoted through education and awareness. It recommended: include Fundamental Duties in school curricula and civic education; use educational material and mass media; train teachers in constitutional values; identify existing laws that give effect to the duties. NCRWC (2002) recommended: A duty to vote (encourage participation in elections) A duty to pay taxes as a civic responsibility Responsible parenthood And stronger civic education on duties. These were recommendations and have not all been put into Article 51A Rights vs Duties: THE Debate For greater emphasis on duties For prioritising rights Promote responsible citizenship and social discipline Fundamental Rights are enforceable ; duties are generally non-justiciable Strengthen national unity and public welfare Too much emphasis on duties may weaken protection against arbitrary State action Encourage protection of the environment and public property Governments may use duties to justify needless limits on dissent Build a culture of active democratic participation The State must fulfil its own constitutional obligations and not shift responsibility to citizens Balanced position. Rights and duties are complementary, not competing. Citizens should respect their duties, but duties must not become an excuse to weaken individual liberty, equality or constitutional safeguards. Way forward: Teach duties alongside rights (civic education) Promote constitutional values through schools, media and community programmes Use specific laws where necessary, subject to Fundamental Rights Governments must fulfil their own constitutional duties Encourage voting, environmental protection, public service and community cooperation Way forward / key point Conclusion: Fundamental Duties make citizens active participants in nation-building. Their purpose is to strengthen constitutional responsibility, not weaken individual freedom. A healthy democracy needs both enforceable rights and responsible citizens."}, {"c": "12", "n": "Directive Principles, Property, Uniform Civil Code and Fundamental Duties", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. DPSP articles Part IV, Articles 36-51 Why DPSPs are not justiciable Financial limits, administrative capacity, social conditions, broad nature Three academic groups of DPSP Socialist, Gandhian, Liberal-Intellectual Champakam Dorairajan 1951 Fundamental Rights prevail over DPSPs Golaknath 1967 Parliament cannot amend Fundamental Rights Kesavananda Bharati 1973 Can amend FRs to implement DPSPs, but not the basic structure Minerva Mills 1980 Balance of FRs and DPSPs is basic structure duties in schools; train teachers; identify laws NCRWC 2002 duties suggested Vote, pay taxes, responsible parenthood DPSP critics' phrase \"Pious superfluities\"; a cheque that cannot be cashed"}, {"c": "12", "n": "Directive Principles, Property, Uniform Civil Code and Fundamental Duties", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts in Start Here)"}, {"c": "12", "n": "Directive Principles, Property, Uniform Civil Code and Fundamental Duties", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards"}, {"c": "13", "n": "Constitutional and Statutory Bodies: NCSC, NCST, NCBC, NHRC", "id": "1-ncsc-and-ncst-articles-338-338a-function", "t": "1 · NCSC AND NCST · Articles 338, 338A · Functions · Achievements · Critique · Reforms", "x": "1 · NCSC AND NCST · Articles 338, 338A · Functions · Achievements · Critique · Reforms # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Constitutional and Statutory Bodies handout pp. 3-8. Prelims PYQs quoted: none quoted in the material. In simple words The National Commission for Scheduled Castes (Article 338) and the National Commission for Scheduled Tribes (Article 338A) are constitutional watchdogs. They check whether the safeguards given to SCs and STs are really working, inquire into complaints and advise the government on development. They can summon people and documents like a civil court, but they can only recommend, not order. Delays, vacancies, weak independence and thin staff reduce their impact. National Commission FOR Scheduled Castes (NCSC): THE Basics Article What it does 338 Creates the NCSC and lays down its composition, powers and functions. Because it sits in the Constitution, it is a constitutional body, not a mere statutory one. 341 The President, after consulting the Governor of the State concerned, specifies which castes are to be treated as Scheduled Castes in that State or Union Territory. A caste is therefore an SC only through this notification. 366(24) Defines “Scheduled Castes” for constitutional purposes (the castes, races or tribes, or parts of them, that are notified under Article 341). Functions: what the NCSC actually does 1. Investigation and monitoring. It examines the constitutional and legal safeguards meant for SCs, evaluates how well they work and points out where implementation is failing. Example: reviewing reservation in education, jobs and promotions in central and State services. 2. Inquiry into complaints. It looks into cases where SCs are denied their rights, face atrocities or are discriminated against, and recommends remedies. Example: violence against Dalits that falls under the SC/ST (Prevention of Atrocities) Act. 3. Advice on development planning. It takes part in, and advises on, the planning of socio-economic development for SCs so that policy is inclusive. Example: inputs on targeted schemes like the Scheduled Castes Sub-Plan. 4. Annual and special reports. It reports to the President on how the safeguards are being implemented and on the SCs’ socio-economic progress. 5. Recommendations to governments. It suggests policy measures so that safeguards, welfare schemes and development programmes are implemented effectively. 6. Extra role. It also performs similar functions for the Anglo-Indian community. Until the 102nd Constitutional Amendment Act, 2018 the NCSC also handled matters relating to OBCs That work now belongs to the NCBC NCSC: AN Analytical LOOK Where the NCSC has worked (strengths) Service safeguards. It has scrutinised recruitment, promotion and reservation practices across government services. It encouraged SC/ST employee associations, liaison officers and special grievance cells in ministries and PSUs to deal with discrimination. It has intervened where reservation benefits were denied in central universities and UPSC recruitment. Education. It focuses on literacy and access to higher education, with special attention to female literacy. It monitors scholarships and pushes for better schools and hostels for SC students. Its review of the Post-Matric Scholarship Scheme found poor disbursement of funds and recommended Direct Benefit Transfer (DBT). Atrocities and civil rights. It monitors atrocity cases, especially custodial violence and police excesses. NCRB data for 2021 shows crimes against SCs make up nearly 89% of all atrocity cases against SCs and STs combined, which shows the scale of the problem. However, it tracks numbers and procedures more than it pushes wider social reform. Land and economic issues. It recognises that SCs depend heavily on agriculture and argues for land reform and protection against land alienation. Its proposals on redistribution and tenancy rights usually meet political resistance. Land disputes in Tamil Nadu and Bihar show that Dalits remain vulnerable to land grabbing. Where it falls short (limitations) Non-binding recommendations: despite civil-court-like investigative powers, its findings have no legal force, so governments can ignore them. Procedural delay: inquiries drag on, so justice becomes slow and often ineffective. Perceived closeness to government: appointments and alignment with government positions raise doubts about its independence. Late reports: annual reports arrive late and are often not discussed in Parliament. The 12th Report (for 2018-20) was tabled only in 2022. Elite bias: priorities tend to favour better-off SC groups, while the poorest Dalits are under-represented. Reactive style: it rarely uses its suo motu power to start action on its own. Reforms suggested Autonomy: appoint members through a bipartisan process so the executive cannot control them. Timely reporting: make annual submission and discussion in Parliament mandatory for accountability. Inclusion: concentrate on the most marginalised sub-groups inside the SC category rather than letting a few groups capture benefits. Data-driven work: use qualitative and quantitative studies and involve social scientists in policy advice. Clear roles: sort out overlaps with the Ministry of Social Justice. Proactive role: use suo motu powers in atrocities, land disputes and denial of reservation. Way forward / key point Concluding thought: caste identities are slowly weakening in cities because of education and mobility, but caste inequality persists, especially in rural India. Leaders such as B. R. Ambedkar, K. R. Narayanan and Ram Nath Kovind show progress, yet they also show why institutional safeguards are still needed. The NCSC has to change from a procedural watchdog into a proactive reformist body. National Commission FOR Scheduled Tribes (NCST): Background Who is a “Scheduled Tribe”? A “tribe” generally means a community with shared culture, language and territory, often living in relative isolation. A Scheduled Tribe (ST) is a constitutional category: communities notified under Article 342 for special protection. The Constitution neither defines “tribe” nor gives criteria for inclusion. Tribal communities are recognised by distinct cultural traditions, remoteness and socio-economic disadvantage. Census 2011: India has 10.42 crore STs, about 8.6% of the population. They live on over 15% of the country’s area and sit on nearly 20% of natural resources . They are concentrated in Central India (Madhya Pradesh, Chhattisgarh, Jharkhand, Odisha, Gujarat, Maharashtra, Rajasthan) and the North-East. Development levels vary widely: Mizoram has near-universal literacy, while groups such as the Jarawas and Shompens of the Andaman and Nicobar Islands are highly vulnerable. The NCST is created under Article 338A (inserted when the single SC/ST commission was split). Functions of the NCST 1. Investigation. Examines how constitutional and legal safeguards for STs are implemented. Example: monitoring the PESA Act in Scheduled Areas. 2. Complaint redressal. Inquires into specific complaints of denial of rights or discrimination. Example: land alienation disputes in Jharkhand and Odisha. 3. Planning advice. Gives inputs on socio-economic policy, evaluates schemes and suggests reforms. Example: recommending focus on tribal education and livelihood under the Tribal Sub-Plan. 4. Reporting. Submits annual and special reports to the President on tribal rights and welfare. 5. Policy recommendations. Advises the Union and States on protection, welfare and development of STs. Additional functions under the 2005 Rules Securing the rights of tribals over minor forest produce . Protecting tribal ownership over land, water and mineral resources. Making sure tribals displaced by development projects are rehabilitated. Preventing land alienation and helping restore land that has already been alienated. Promoting tribal participation in forest management and social afforestation. Helping implement PESA, 1996 in Scheduled Areas. Encouraging a shift from jhum (shifting) cultivation to sustainable livelihoods. NCST: Achievements AND Critique Achievement What happened Land safeguards (2023) Issued a notice over the Great Nicobar project, questioning the diversion of 84.1 sq km of tribal reserve land and 130 sq km of forest land without proper consultation. Forest rights Its opposition to the 2019 amendments to the Forest Rights Act (FRA) helped stall proposals that would have diluted community rights over forests. Displacement oversight (2017) A Special Report showed that 28% of displaced tribal households in Chhattisgarh mining projects had not been rehabilitated, which led the government to review. Education advice (2020) Its input on Eklavya Model Residential Schools pushed for expansion to 452 new schools in under-served tribal belts. Complaint redressal Using civil-court powers it summoned State officials in the Pathalgadi cases (Jharkhand, 2016), which brought national attention to the misuse of sedition-type laws against tribals. Reservation monitoring The 2018-19 Annual Report recorded a 4.5% shortfall in ST representation in central PSU jobs and pushed ministries to correct it. Critique and limitations Dysfunction: parliamentary reports show the NCST has been largely inactive for about four years and has not submitted reports to Parliament, which undermines its mandate of monitoring safeguards. Weak regional reach: it works with only six regional offices , many understaffed. Requests for offices in tribal-heavy States such as Andhra Pradesh and Maharashtra remain unmet. Lack of independence: the Ministry of Tribal Affairs overshadows it, which blurs the line between an advisory commission and an executive department. Exclusion from policy-making: it has complained of inadequate consultation on key laws such as the Forest Rights Act, which directly affect tribal welfare. Underfunding: chronic budget shortages limit inquiries, outreach and monitoring, and reduce operational independence. A 2022 parliamentary committee noted it was working with under 50% of sanctioned strength . Way forward for the NCST Fill vacancies quickly so a fully functional body with expert members restores credibility and timely monitoring. Expand regional presence with more, properly staffed offices, so it can talk to tribal communities directly. Reinforce autonomy from the Ministry of Tribal Affairs through structural reform, so it acts as a neutral protector. Formal consultation: make it mandatory to consult the Commission on policies that affect STs, so tribal voices are built into law-making. Better budget and financial autonomy for investigations, outreach and monitoring. Way forward / key point Concluding thought: the NCST was meant to be the guardian of tribal rights under Article 338A. Staff shortages, limited independence, weak outreach and poor funding have blunted it. Its effectiveness depends on timely reporting, government responsiveness and proactive suo motu action, especially because tribals are over 8% of the population and still face marginalisation."}, {"c": "13", "n": "Constitutional and Statutory Bodies: NCSC, NCST, NCBC, NHRC", "id": "2-ncbc-rohini-commission-challenges-of-sc", "t": "2 · NCBC · Rohini Commission · Challenges OF Sc-st-obc Commissions · Types OF Rights", "x": "2 · NCBC · Rohini Commission · Challenges OF Sc-st-obc Commissions · Types OF Rights # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Constitutional and Statutory Bodies handout pp. 8-11. Prelims PYQs quoted: none quoted in the material. In simple words The NCBC got constitutional status in 2018, so it can no longer be changed at the executive’s will and it has civil-court powers in inquiries. All three commissions (SC, ST, OBC) suffer from similar problems: vacancies, advisory-only powers, delays and low awareness. The chapter also explains the four kinds of rights (natural, moral, legal, human) and how Fundamental Rights differ from other constitutional rights. National Commission FOR Backward Classes (NCBC) Why backwardness is a caste question in India Backward classes in India are rooted in systemic disadvantage tied to caste, occupation and social hierarchy . Social “class” is fluid (a person can move up), but caste-based backwardness carries intergenerational barriers in education, jobs and representation. To address this, constitutional and statutory mechanisms were created. They ended in the NCBC. Once the NCBC was given constitutional status (2018) , it no longer depends on executive discretion. It works as an autonomous constitutional body, giving it autonomy while keeping it accountable to the highest constitutional office. Justice Rohini Commission (OBC sub-categorisation) Set up in 2017 under Article 340 to examine sub-classification of the 27% OBC quota . It proposed dividing OBC castes into four groups so that benefits reach the less-advantaged castes, not only the dominant ones. Proposed split: Group 1 gets 2%, Group 2 gets 6%, Group 3 gets 9% and Group 4 gets 10% (total 27%). The final report was still awaited as per the handout. Powers of the NCBC (civil-court powers) It can summon and enforce the attendance of any person from anywhere in India and examine them on oath. It can require the discovery and production of official or private documents. It can receive evidence on affidavits and requisition public records from courts or government offices. It can issue summons for witnesses and documents, and has any other powers the President gives it. These quasi-judicial powers let it investigate independently and hold institutions accountable. Benefits of constitutional status (with examples) 1. More authority. Civil-court powers in inquiries make officials accountable. It can summon officers, demand records and take affidavits while probing OBC grievances. 2. Wider mandate. Earlier it only revised the OBC list Now it also monitors welfare schemes and safeguards. It can probe denial of scholarships or weak enforcement of reservation 3. Parliamentary oversight. Its reports are tabled in Parliament, which forces an executive response. Its 2022 report on under-use of OBC welfare funds made ministries explain corrective steps. 4. Independence. Tenure and service safeguards stop arbitrary changes to how it works. 5. Stronger social-justice role. It acted on the reservation backlog in central PSUs and pushed recruitment drives for OBC candidates. 6. Symbolic and political value. Constitutional status in 2018 reassured the roughly 40% of India that is OBC of the State’s commitment to equity. Note Note on the handout: the table on the NCBC’s composition and Articles (338B and related provisions) was an image in the PDF and could not be read. Add it from the handout by hand. Challenges Faced BY SC, ST AND OBC Commissions Seven shared problems 1. Vacancies and resource gaps. Persistent understaffing and small budgets weaken them. A 2022 Parliamentary Committee noted the NCST was running on less than 50% of sanctioned strength, which hurt its inquiries. 2. Erosion of autonomy. Politics influences appointments and recommendations are not binding, which reduces credibility. NCBC’s 2020 reports on OBC reservation backlog in central universities were ignored by ministries. 3. Weak statutory powers. They cannot enforce compliance or fix structural problems. The NCBC cannot define “backwardness”, as clarified in the Maratha Quota judgment (2021). 4. Case backlog and delayed reporting. Thousands of complaints are pending and annual reports reach Parliament late, which blunts accountability. 5. Opaque functioning. Little transparency in how members are selected and limited disclosure of outcomes lower public trust. 6. Representation deficit. Retired bureaucrats dominate instead of experts, academics or community representatives, so perspectives are narrow. 7. Low outreach and awareness. Target communities often do not know how to complain. NCRB 2020 showed rising SC/ST atrocity cases but few complaints reached the commissions because people did not know the procedure. Pathways for reform Independence: redo appointment processes with clear criteria, expert representation and less political interference. Wider powers: Consider making recommendations binding Let the NCBC define backwardness parameters Harmonise powers across the SC, ST and OBC commissions Efficiency: fill vacancies quickly, give adequate budgets and modernise case-handling infrastructure. Transparency: digital case tracking, fixed timelines for resolving complaints and regular public disclosures. Data and research: build full caste/tribe databases and commission impact studies of welfare schemes (like post-NFHS style surveys). Collaboration: structured coordination with ministries, State commissions and NGOs, and partnerships with academic institutions. Capacity: a dedicated cadre for these commissions, with training for members and staff in rights, technology and emerging challenges. Way forward / key point Conclusion: strengthening the SC, ST and OBC commissions needs autonomy, resources and binding powers. With transparency, data-driven policy and collaboration, they can become credible constitutional watchdogs that deliver substantive equality. Types OF Rights What is a right? A justified claim that allows individuals to live with dignity and freedom. Rights are broadly of four types. Type Meaning and key features Examples Natural rights Belong to every person by birth. They are not granted by the government . Considered universal and inalienable. Right to life, liberty and property Moral rights Based on moral values, conscience and social acceptance. Generally not legally enforceable . Right to respectful and fair treatment Legal rights Recognised and protected by law and enforceable through courts . Civil rights (life, liberty, equality); Political rights (voting, contesting elections); Economic rights (work, fair wages, social security) Human rights Universal and inalienable rights available to all individuals: civil, political, economic, social and cultural. Recognised under the UDHR, 1948 . Right to life, dignity, equality, education and freedom Fundamental Rights vs Constitutional Rights Both are categories of legal rights. The difference is where they sit and how they are enforced. Basis Fundamental Rights Other constitutional rights Meaning Basic rights guaranteed under Part III of the Constitution Rights given by the Constitution but outside Part III Provisions Articles 12-35 Various provisions, such as Article 300A and Article 326 Examples Right to Equality, Freedom, Life and Personal Liberty Right to Property (Art 300A) and Right to Vote (Art 326) Enforcement Directly enforceable through Article 32 (Supreme Court) and Article 226 (High Court) Enforceable through appropriate legal remedies, depending on the right Value addition Key point: all Fundamental Rights are constitutional rights, but not all constitutional rights are Fundamental Rights."}, {"c": "13", "n": "Constitutional and Statutory Bodies: NCSC, NCST, NCBC, NHRC", "id": "3-national-human-rights-commission-nhrc-co", "t": "3 · National Human Rights Commission (NHRC) · Composition · Working · Functions · ROLE · Reforms", "x": "3 · National Human Rights Commission (NHRC) · Composition · Working · Functions · ROLE · Reforms # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Constitutional and Statutory Bodies handout pp. 11-16. Prelims PYQs quoted: none quoted in the material. In simple words The NHRC was set up in 1993 under the Protection of Human Rights Act after worries about custodial violence and encounter deaths. It inquires into violations (suo motu or on complaint), visits jails, reviews safeguards and spreads awareness. Its recommendations are only advisory, it cannot touch the armed forces except to ask for reports, and GANHRI has criticised its independence. Reforms aim to give it binding force, transparent appointments and more staff. WHY AND HOW THE NHRC WAS Created Background Human rights are the inherent and inalienable rights of every person, ensuring dignity, equality and freedom regardless of race, caste, gender or belief. In the 1980s and early 1990s, concern about custodial violence, encounter deaths and systemic discrimination pushed India to build an institution to protect rights. This led to the NHRC under the Protection of Human Rights Act, 1993 . Parliament built a three-tier structure : the NHRC at the national level, State Human Rights Commissions (SHRCs) in States, and Human Rights Courts in districts. This aims for both accountability and access. It works in line with the UN-endorsed Paris Principles (1993) , which call for autonomy, independence and accountability of national human rights institutions. Composition AND Structure Aspect Details Established 12 October 1993 , under the Protection of Human Rights Act, 1993 Composition A Chairperson, 5 full-time Members and 7 ex-officio Members Selection committee Prime Minister (chair); Home Minister; Speaker of Lok Sabha; Deputy Chairman of Rajya Sabha; Leader of Opposition in Lok Sabha; Leader of Opposition in Rajya Sabha Appointing authority The President of India Eligibility: Chairperson A retired Chief Justice of India or a retired Judge of the Supreme Court Eligibility: Members One Member who is or was a Supreme Court Judge; one who is or was a Chief Justice of a High Court ; three with knowledge or experience of human rights (at least one must be a woman) Ex-officio Members Chairpersons of the National Commissions for SCs, STs, Women and Minorities; Chairperson of the National Commission for Backward Classes; Chairperson of the NCPCR; Chief Commissioner for Persons with Disabilities Term 3 years or until age 70 , whichever is earlier. Eligible for reappointment. Removal By the President on grounds of misbehaviour or incapacity, after an inquiry by the Supreme Court Salary and allowances Fixed by the Central Government but cannot be changed to their disadvantage Powers Powers of a civil court during inquiries; can call for information from government and authorities; can recommend compensation or prosecution; can use the services of officers and investigation agencies; expanded role in Union Territories, and the Secretary-General has administrative and financial powers Memory aid · PM-HM-LS-DCh-LoP NHRC selection panel = PM, Home Minister, Speaker, RS Deputy Chairman, and the two Leaders of Opposition (six people). (own mnemonic) HOW THE NHRC Works (procedure) Step by step (governed by the 1993 Act and the NHRC (Procedure) Regulations, 1994) 1. Complaint. Individuals, NGOs or the Commission itself (suo motu) can start a case. It should generally relate to violations within one year of occurrence. The Law Division first screens it before it is admitted. 2. Inquiry. After admission the NHRC can either investigate itself through its Investigation Division (headed by an officer of Director General of Police rank) or ask the concerned authority or police for a report. It then decides whether the act is a “violation” under the law. 3. Hearings and recommendations. In serious matters (custodial deaths, bonded labour, encounter killings) it holds open hearings or field visits. It then recommends compensation, disciplinary action or a policy change. 4. Follow-up. The ministry or State must submit an Action Taken Report (ATR) within one month . The NHRC reviews compliance and may publish non-compliance in its annual report, which is tabled in Parliament, so there is public accountability. 5. Coordination and research. It works through specialised divisions (Research, Training, Policy, Awareness) to build institutional knowledge. Functions (section 12 OF THE 1993 ACT) Eleven functions 1. Inquiry into violations (Sections 17-18): into violations, or negligence in preventing them, by a public servant, suo motu, on a petition, or on a court’s reference. This is its core function. 2. Intervening in court proceedings that involve allegations of human rights violations, with the court’s approval. 3. Inspecting detention centres (jails, juvenile homes, psychiatric facilities) to study living conditions and suggest reform, in line with the UN Mandela Rules (2015) . 4. Reviewing legal safeguards : Fundamental Rights, criminal procedure, prison laws and police manuals, and advising on effective enforcement. 5. Addressing factors that inhibit rights : Terrorism, displacement, communal violence, environmental damage Suggesting preventive or remedial steps 6. International alignment : Studying treaties like the UDHR 1948, ICCPR 1966 and CEDAW 1979 and recommending domestic alignment Coordinating with the UN Human Rights Council and other national institutions under the Paris Principles 7. Research and policy on themes like gender violence, bonded labour and climate justice. 8. Human rights literacy : publications, training for police and officials, campaigns in schools and universities with NCERT and UGC. 9. Working with civil society : supporting NGOs and rights defenders as partners in advocacy and victim assistance. 10. Miscellaneous : any other function needed for promoting rights, including setting up human rights courts, monitoring bonded labour and overseeing women and child protection. 11. Added by practice and amendment : monitoring Supreme Court orders on custodial deaths, manual scavenging and police reforms, and overseeing the National Action Plan on Business and Human Rights (NAP-BHR) started by the Ministry of Corporate Affairs. Note GANHRI (Global Alliance of National Human Rights Institutions) accredits national human rights bodies. It has repeatedly raised concerns about India’s NHRC. Recent reports (2024-25) say the selection process is non-transparent (vacancies not publicly advertised; vague application, screening and appointment procedures), follow-up on serious violations is weak, independence from the executive is limited and civil society participation is thin. These critiques contributed to the recommendation to downgrade the NHRC from “A” grade accreditation. (verify current status) ROLE Played BY THE NHRC Main contributions Guidelines and legal oversight. It issued detailed guidelines on custodial deaths, which later shaped Supreme Court law ( D. K. Basu v. State of West Bengal, 1997 ). It criticised misuse of special security laws such as POTA and TADA and recommended safeguards against arbitrary detention. Socio-economic rights and marginalised groups. It took up the starvation deaths in Odisha (2001-02), leading to stronger monitoring of food-security schemes in Kalahandi
