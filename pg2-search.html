ty reachable under Art 226 NSGA 2025 assent 18 August 2025; NSB and National Sports Tribunal Kennedy and affirmative action executive order 1961 Gandhi vs Ambedkar approach moral regeneration vs objective secular measures Thorat and Attewell 2007 same qualifications, different hiring outcomes by identity Deshpande and Weisskopf 2012 Railways 1980-2002, no productivity loss Mismatch remedy remedial classes and counselling Why caste not class caste adds social isolation; quota also gives representation Corrective justice reply to the caste-hostility argument Quota Plus coined by Satish Deshpande Tamil Nadu reservation up to 69% Quota Plus measures HELM-D Art 334 extended to 25 January 2030 by 104th Amendment (2019) Rohini Commission 2017, Art 340, report 31 July 2023, 27% OBC split Creamy layer threshold ₹8 lakh per annum Rohit Nathan 2026 held parental salary alone cannot decide; 2004 letter invalid; Art 142 relief Jarnail Singh 2018 creamy layer idea for SC/ST promotions Davinder Singh 2024 7 judges, 6-1, SC sub-classification allowed with data Davinder Singh bar cannot alter Art 341 list Ram Singh 2015 about Jat inclusion in Central OBC list rejected Ram Singh: backwardness needs objective, contemporary data; not history or self-perception alone NALSA 2014 transgender persons recognised as socially disadvantaged Vertical vs horizontal discrimination caste hierarchy vs cuts across castes (women, transgender) Jaishri Patil 2021 Maratha 2018 Act struck; 50% ceiling Maratha 2024 Act 10%, pending Bombay HC (verify) EWS amendment 103rd, 2019; Arts 15(6) and 16(6); 10% Janhit Abhiyan 2022 5 judges, 3-2, EWS upheld"}, {"c": "5", "n": "Fundamental Rights: Nature, Article 12 and Reservation", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts in Start Here)"}, {"c": "5", "n": "Fundamental Rights: Nature, Article 12 and Reservation", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards"}, {"c": "6", "n": "Article 19, Defamation, Contempt and Limits on Speech", "id": "1-article-19-restrictions-defamation-subra", "t": "1 · Article 19 · Restrictions · Defamation · Subramanian Swamy", "x": "1 · Article 19 · Restrictions · Defamation · Subramanian Swamy # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Fundamental Rights handout pp. 17-20. Prelims PYQs quoted: none quoted in the material. In simple words Art 19(1) gives citizens seven (now six) freedoms; each has its own list of grounds for restriction. Speech has the longest list (eight). Press, silence, information and privacy are inferred. Criminal defamation survived in Subramanian Swamy (2016), now sits in BNS s.356. Article 19(1): THE Rights (citizens ONLY) Clause Right Restriction clause (a) freedom of speech and expression 19(2) (b) assemble peaceably and without arms 19(3) (c) form associations, unions, co-operative societies 19(4) (d) move freely throughout India 19(5) (e) reside and settle anywhere in India 19(5) (f) omitted (property) - (g) practise any profession, occupation, trade or business 19(6) Memory aid · SAA-MRP Art 19(1): S peech · A ssembly · A ssociation · M ovement · R esidence · (f gone) · P rofession. (own mnemonic) Grounds OF Restriction 19(2): speech and expression (eight grounds) Sovereignty and integrity of India Security of the State Friendly relations with foreign States Public order Decency or morality Contempt of court Defamation Incitement to an offence Memory aid · SSF-P-DM-CDI Eight grounds: S overeignty · S ecurity · F riendly relations · P ublic order · D ecency-morality · C ontempt · D efamation · I ncitement. (own mnemonic) Clause Reasonable restrictions in the interests of 19(3) assembly sovereignty and integrity · public order 19(4) association sovereignty and integrity · public order · morality 19(5) movement, residence general public · protection of any Scheduled Tribe 19(6) profession, trade general public ; may also lay down professional or technical qualifications and allow State or State-owned corporations to carry on a trade, wholly or partly excluding citizens Rights Inferred FROM 19(1)(a) Four inferred rights Right to silence: freedom to speak includes, in context, the freedom not to speak Freedom of the press: Expressing other people's views rests on freedom of expression Not separately listed Right to information: You cannot express well without information Right to know is an aspect of 19(1)(a) Right to privacy: Constant surveillance creates a chilling effect Privacy is a Fundamental Right chiefly under Art 21 , linked with Art 19 Memory aid · SPIP Inferred from speech: S ilence · P ress · I nformation · P rivacy. (own mnemonic) Defamation Legal position Defamation is a ground in 19(2) Gives rise to civil and criminal proceedings criminal defamation: Section 356 of the Bharatiya Nyaya Sanhita, 2023 Earlier IPC Sections 499 and 500 exceptions under s.356: Good-faith imputations Comment on public conduct of public servants Truth for the public good Magistrates are said to apply it mechanically without checking exceptions Issues with criminal defamation public remedy for a private wrong : civil wrong between parties in most democracies chilling effect: Self-censorship of journalists and opposition Followers file complaints Social media lets cases be filed in many parts of the country Used to harass activists and journalists access: Costs and time favour the powerful The common person struggles Note Subramanian Swamy v. Union of India (2016): challenge to IPC 499/500 as an unreasonable restriction on 19(1)(a). For retention: State must protect reputation (dignity); freedom is not absolute. Against: chilling effect; civil damages suffice. SC upheld criminal defamation: right to reputation is part of Art 21 (life and dignity) , balanced against free speech; stressed dignity and fraternity . Critics: missed a chance to decriminalise."}, {"c": "6", "n": "Article 19, Defamation, Contempt and Limits on Speech", "id": "2-contempt-of-court", "t": "2 · Contempt OF Court", "x": "2 · Contempt OF Court # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Fundamental Rights handout pp. 20-22. Prelims PYQs quoted: none quoted in the material. In simple words Courts can punish contempt under Arts 129 and 215 and the 1971 Act. The trouble is vagueness: scandalising the court, judge in own cause, intent vs effect. Mulgaokar (1978) says use sparingly; the UK abolished scandalising in 2013. Reform: objective standards. Meaning AND Types Constitutional and statutory basis Contempt of Courts Act, 1971 defines and regulates it Art 129: Supreme Court is a Court of Record and can punish its own contempt Art 215: same for High Courts Civil contempt wilful disobedience of any judgment, decree, direction, order, writ or process or wilful breach of an undertaking given to a court Criminal contempt scandalising or lowering the authority of a court prejudicing or interfering with judicial proceedings interfering with or obstructing the administration of justice in any other way Value addition Why the power exists: unpopular rulings can trigger campaigns that undermine the independence and authority of the judiciary; without independence the public interest suffers. Issues Five issues Nemo judex in causa sua (no one is judge in their own cause): the court whose authority is attacked may itself decide the contempt Vagueness: \"scandalising the court\" No objective yardstick Depends on judges' subjective assessment , so outcomes vary, which touches equality before law Broad use stifles genuine criticism Intent vs effect: Proceedings may look at the tendency of criticism rather than mens rea Relevance of intention depends on the type of contempt Impression of infallibility: Judges are human Just criticism of a judge is not criticism obstructing the institution Judge vs court: Contempt of court is not contempt of an individual judge The line blurs Memory aid · NVIJ Issues: N emo judex · V agueness · I ntent vs effect · I nfallibility · J udge vs court. (own mnemonic) Note In Re S. Mulgaokar (1978): Justice V. R. Krishna Iyer : judges should have broad shoulders ; protect the administration of justice , not the personal reputation of judges. Mulgaokar guidelines Sparing use Not every criticism merits contempt act seriously when an attack is calculated to obstruct or destroy the judicial process distinguish judge from court press freedom: the press may criticise courts within responsible limits judicial restraint even if language is harsh for malicious or intimidatory attacks, use contempt in the public interest Safeguards IN THE 1971 ACT Section 13 and Section 15 s.13: No sentence unless the contempt substantially interferes with due course of justice After the 2006 amendment truth is a defence if in public interest and bona fide s.15: Criminal contempt (other than in the court's presence): suo motu by SC or HC Others need consent of the Attorney General or Solicitor General (SC) or Advocate General (HC) Consent rule does not restrict suo motu jurisdiction Comparisons AND Reform Country Position UK abolished scandalising the judiciary as contempt in England and Wales in 2013 ; \"old fools\" illustration: being old is a fact, being a fool is opinion USA strong free-expression protection; contempt is more restrictive for criticism outside the courtroom Reform agenda objective standards in place of vague phrases (Art 19(1)(a) compatibility) Criticism is not obstruction Keep contempt for conduct that obstructs justice judicial accountability: criticism improves institutions protect the administration of justice, not judges' reputation"}, {"c": "6", "n": "Article 19, Defamation, Contempt and Limits on Speech", "id": "3-book-bans-sedition-obscenity-film-certif", "t": "3 · BOOK BANS · Sedition · Obscenity · FILM Certification · Section 66A", "x": "3 · BOOK BANS · Sedition · Obscenity · FILM Certification · Section 66A # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Fundamental Rights handout pp. 23-27. Prelims PYQs quoted: none quoted in the material. In simple words Controversy alone does not justify a ban; the State must stay inside Art 19(2). Sedition (s.124A) was read down in Kedar Nath, put in abeyance in 2022 and replaced by BNS s.152. Obscenity moved from Hicklin to community standards. Section 66A fell in Shreya Singhal (2015). Banning OF Books Position and arguments against bans Restrictions only on grounds in Art 19(2) A book being controversial, unpopular or offensive is not enough freedom of expression central to liberal democracy, even for unpopular ideas right to receive information: bans hurt readers too chilling effect: writers and historians self-censor threat of violence: The State should not reward it by suppressing lawful expression It must protect expression and keep order Note S. Rangarajan v. P. Jagjivan Ram (1989): expression cannot be suppressed because of threatened demonstrations or violence ; State must protect lawful expression; need a proximate connection to harm, not illusory or remote threats. A film case, but applies to books too. Sedition History Colonial offence put in the IPC in 1870 Used against Tilak and against Gandhi (1922) IPC s.124A: Hatred, contempt or disaffection against the government established by law Criticised for vague wording and misuse against journalists, activists, students and opponents Note Kedar Nath Singh v. State of Bihar (1962): SC upheld s.124A but restricted it to speech or acts involving incitement to violence or tendency to create public disorder . Strong criticism of government alone is not sedition. Issues colonial legacy misuse against dissent chilling effect on 19(1)(a) government of the day is not the State or the nation 1870 sedition enters the IPC 1922 Gandhi prosecuted 1962 Kedar Nath: upheld but read down 2022 SC directs s.124A be kept in abeyance ; deals with fresh and pending cases 1 Jul 2024 BNS in force; 124A not retained ; s.152 BNS introduced BNS Section 152: acts endangering sovereignty, unity and integrity covers purposely or knowingly exciting secession, armed rebellion, subversive activities , encouraging separatist feelings , endangering sovereignty, unity, integrity by words, signs, visible representation, electronic communication, financial means or otherwise punishment: life imprisonment or up to seven years , plus fine Explanation protects lawful criticism: disapproval of government measures to get them changed by lawful means critics: \"subversive\" and \"separatist\" need careful reading or can catch dissent Must satisfy 19(1)(a) and 19(2) Obscenity 1868 Hicklin test: obscene if it can deprave and corrupt susceptible minds; isolated passages can be judged 1965 Ranjit Udeshi: SC applied Hicklin; upheld conviction over sale of Lady Chatterley's Lover 2014 Aveek Sarkar: SC rejected Hicklin ; contemporary community standards ; judge the work as a whole in context; mere nudity is not obscenity Law and balance Earlier IPC 292-294 Now BNS 294-296 Online: IT Act ss.67 and 67A Sexuality or nudity is not automatically obscene Balance artistic expression with decency and morality Memory aid · HRA Obscenity tests in order: H icklin (1868) → R anjit Udeshi (1965, applied it) → A veek Sarkar (2014, community standards). (own mnemonic) FILM Certification Framework cinema is protected by 19(1)(a) subject to 19(2) CBFC: Statutory body under the Ministry of Information and Broadcasting , set up under the Cinematograph Act, 1952 Films need prior certification (pre-censorship) K. A. Abbas (1970): upheld pre-censorship with safeguards because of the film's visual and emotional impact Rangarajan (1989): No suppression for threats of protest No Heckler's Veto Certificate Meaning U unrestricted public exhibition UA 7+ parental guidance below 7 UA 13+ parental guidance below 13 UA 16+ parental guidance below 16 A adults only S restricted to a specified profession or class Cinematograph (Amendment) Act, 2023 age-based categories UA 7+, 13+, 16+ perpetual validity of certificates (earlier 10-year limit removed) anti-piracy provisions on unauthorised recording and exhibition removed the Centre's revisional powers under s.6(1) , consistent with K. M. Shankarappa Cinematograph (Certification) Rules, 2024: online applications, transparency, priority screening Issues subjectivity paternalism toward adults political influence chilling effect (cuts, delays) certification should guide, not censor Note Current affairs (verify): the September 2026 magazine reports New Guidelines for Film Certification 2026 from MIB, superseding the 1991 notification, with categories U/A 7+, 13+, 16+, A and Specialized . Check the exact text before quoting. Section 66A, IT ACT What it was Inserted by the IT (Amendment) Act, 2008 , in force 2009 Punished messages that were grossly offensive, menacing, annoying, inconvenient or misleading Up to 3 years and fine problems: Vague terms , arbitrary use against criticism, chilling effect Mere annoyance is not a 19(2) ground Shreya Singhal v. Union of India (2015) SC struck down s.66A as violating 19(1)(a) , not saved by 19(2). Principles: discussion and advocacy are protected , only incitement tied to a 19(2) ground can be restricted vagueness overbreadth chilling effect . 2022: Cases still being filed SC said no one can be prosecuted under 66A and ordered references removed from pending cases Significance online speech is protected by 19(1)(a) cannot criminalise speech for being annoying, inconvenient or offensive restrictions must be clear, reasonable, within 19(2) reaffirms judicial review"}, {"c": "6", "n": "Article 19, Defamation, Contempt and Limits on Speech", "id": "4-freedom-of-speech-and-expression-signifi", "t": "4 · Freedom OF Speech AND Expression · Significance · Balance · Threats", "x": "4 · Freedom OF Speech AND Expression · Significance · Balance · Threats # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Fundamental Rights handout pp. 27-28. Prelims PYQs quoted: none quoted in the material. In simple words Speech has value in itself, keeps democracy accountable, builds community, drives change and the marketplace of ideas. Restrictions must be proportionate; err on the side of freedom. Threats: old laws, weak politicians, weak courts, compliant media, Heckler's Veto, pliant officials. WHY Freedom OF Speech Matters Five reasons Inherent value: A faculty unique to humans (imaginative and visual communication) Expression of human nature Cornerstone of democracy: Accountability through free media and criticism Not absolute, but society must tolerate unpopular views (Galileo, Socrates) Enables community life: Minorities feel they belong only if their views are heard Collective life needs equal worth of views Enables progressive change: Women's suffrage, workers' conditions, African American voting rights Better governance through ideas and criticism Promotes innovation: Marketplace of ideas Best ideas gain acceptance Contest refines ideas Memory aid · ICC-PI Significance: I nherent value · C ornerstone of democracy · C ommunity life · P rogress · I nnovation. (own mnemonic) Balancing Freedom AND Restriction Proportionality freedom is not absolute : it must not become a tool for mischief or for violating others' rights restrictions must be proportionate : only as wide as the objective needs when in doubt, err on the side of freedom Example: Banning two-wheelers to stop road accidents is over-restriction Tackle the causes of accidents instead Note Current affairs (verify): the August 2026 magazine notes In Re Noise Pollution (2005) : Art 19(1)(a) does not permit amplified noise that violates others' rights. Use it as a boundary example for speech vs others' rights. Threats TO Freedom OF Speech IN India Five threats Obsolete colonial laws and moral standards not revised for modern times Weakness of the political class in amending or repealing restrictive laws Misuse to silence dissent Weakness of the judiciary: Reluctance to strike down or narrow such laws Sedition shows a law can chill speech even with few convictions Relief comes after long litigation Weakness of media and publishers: Aligning with government Publishers withdrawing books under threat = Heckler's Veto Moral corruption of officials: carrying out orders under political pressure despite weak charges Memory aid · OPJMO Threats: O bsolete laws · P oliticians · J udiciary · M edia and publishers · O fficials. (own mnemonic) Way forward / key point Heckler's Veto: the threat of disruption or violence by one group effectively silences a speaker. The remedy (Rangarajan): the State must protect lawful expression and keep order, not give in to the heckler."}, {"c": "6", "n": "Article 19, Defamation, Contempt and Limits on Speech", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Art 19(1)(f) omitted Art 19 applies to citizens only Number of grounds in 19(2) eight Grounds for 19(4) association sovereignty, public order, morality 19(5) special ground protection of Scheduled Tribe interests Four inferred rights SPIP Criminal defamation now BNS section 356 (was IPC 499, 500) Subramanian Swamy 2016 criminal defamation upheld; reputation is part of Art 21 Contempt Act year 1971 Articles on contempt power 129 (SC) and 215 (HC) Civil contempt wilful disobedience or breach of undertaking Criminal contempt scandalising, prejudicing proceedings, obstructing justice Nemo judex no one is judge in their own cause Mulgaokar 1978 words broad shoulders (Krishna Iyer) Truth as defence section 13, after 2006 amendment, public interest and bona fide UK abolished scandalising in 2013 Rangarajan 1989 no ban due to threatened violence; proximate link needed Sedition in IPC year 1870 Kedar Nath 1962 s.124A upheld but limited to incitement to violence or public disorder 2022 sedition order kept in abeyance BNS in force 1 July 2024; s.152 replaces sedition in spirit s.152 punishment life or up to 7 years plus fine Hicklin to Aveek Sarkar depraving minds to community standards, work as a whole CBFC under Cinematograph Act 1952 K. A. Abbas 1970 pre-censorship upheld Shreya Singhal 2015 s.66A struck down; vagueness, overbreadth, chilling effect Five reasons FoSE matters ICC-PI Marketplace of ideas means free contest of ideas refines them Proportionality example two-wheeler ban for accidents is over-restriction Five threats OPJMO Heckler's Veto threat of disruption silences speech Noise pollution case 2005 (verify) amplified noise not protected by 19(1)(a)"}, {"c": "6", "n": "Article 19, Defamation, Contempt and Limits on Speech", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts in Start Here)"}, {"c": "6", "n": "Article 19, Defamation, Contempt and Limits on Speech", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards"}, {"c": "7", "n": "Media, Digital Regulation and the Right to Protest", "id": "1-freedom-of-the-press-role-of-media-issue", "t": "1 · Freedom OF THE Press · ROLE OF Media · Issues · Trial BY Media", "x": "1 · Freedom OF THE Press · ROLE OF Media · Issues · Trial BY Media # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Fundamental Rights handout pp. 29-32. Prelims PYQs quoted: none quoted in the material. In simple words Press freedom is inferred from Art 19(1)(a). Media is a civic forum and watchdog; Sen's China example shows what censorship costs. Problems: ownership concentration, paid news, conflicts of interest, trial by media (Sahara, postponement), TRP-driven sensationalism. Constitutional Basis AND ROLE Basis Press freedom is not named in the Constitution It is inferred from Art 19(1)(a) NCRWC recommended explicit recognition in Art 19 Role of media in a democracy civic forum: A \"parliament of citizens\" Public discussion, debate, criticism watchdog: Speaks truth to power More press freedom, more accountability Modern democracy is mediated adversarial relationship (slightly) with government is a sign of health protective: voice to the voiceless, helps welfare of weaker sections information: censorship leaves citizens, then government, less informed and weakens feedback value creation: brings attention to disasters and neglected issues (health facilities, malnutrition, road accidents, schools) and shapes what the government treats as important Memory aid · CWAPIV Roles: C ivic forum · W atchdog · A dversarial · P rotective · I nformation · V alue-setting. (own mnemonic) Note Amartya Sen's example: in the Great Chinese Famine (1958-61) , censorship meant even officials lacked reliable information on the crisis; absence of free information and criticism worsened the disaster. A free press helps governments see and answer suffering. Issues AND Challenges Press freedom in India many registered publications and channels suggest a vibrant space, but numbers do not prove freedom World Press Freedom Index (RSF) ranks countries India's ranking raises questions on journalist safety, political pressure, institutional conditions. Rank figures in the lecture are year-specific , not the present rank (check current RSF) Concentration of ownership Readership and viewership concentrated in a few entities Easier for the powerful to influence owners have other businesses and dealings with government (contracts, approvals) and links with parties Murdochisation: One entity dominating print, TV and radio Reduces diversity Limits on cross-media concentration argued for Media corruption Paid news: Payment-influenced content presented as news Candidates and outlets collude Small papers vulnerable Raises election-expenditure questions Not a separate offence under the RPA 1951 by that label, though conduct may fall under other laws Conflict of interest: outlets holding equity in businesses they then cover Trial BY Media Meaning and rights hit media acts as judge, jury and executioner : A Kangaroo Court (body without legitimate authority acting as a court) Khap Panchayats criticised similarly reputation (Art 21 dignity): guilty before the verdict privacy: excessive reporting of personal details fair trial: pressure on the judiciary, loss of presumption of innocence , interference with administration of justice Note Sahara India Real Estate v. SEBI (2012): Doctrine of Postponement. If immediate reporting creates a real and substantial risk to a fair trial, the court may order a temporary postponement , with strict safeguards: necessary and proportionate . Criticism: may deny the right to know , does not curb frivolous media behaviour , can shield influential accused; balance fair trial with public information. Commercialisation OF Media Advertisement-driven journalism \" Good news is no news \": chase for ads and TRPs fuels sensationalism the Chinese Wall between editorial and marketing has been breached (it should stop commercial pressure on editorial decisions) Sensationalism: five forms exclusive stories chased for TRPs breaking news on unfinished stories: inaccuracy commodification: serious news packaged as entertainment yellow journalism: little researched content, sensational headlines gonzo journalism: Reporter becomes part of the story Deliberately subjective, not necessarily unethical post-truth: emotion and belief outweigh objective facts Memory aid · EBCYGP Sensationalism: E xclusives · B reaking news · C ommodification · Y ellow · G onzo · P ost-truth. (own mnemonic) Poor quality of journalism No uniform professional licence Course quality varies need better education and training standards without hurting independence"}, {"c": "7", "n": "Media, Digital Regulation and the Right to Protest", "id": "2-regulation-of-media-press-council-fdi-it", "t": "2 · Regulation OF Media · Press Council · FDI · IT Rules, 2021", "x": "2 · Regulation OF Media · Press Council · FDI · IT Rules, 2021 # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Fundamental Rights handout pp. 32-37. Prelims PYQs quoted: none quoted in the material. In simple words Self-regulation is toothless (Katju); government regulation is risky; the ideal is independent external regulation. Know the bodies, the Press Council make-up, FDI limits, the Programme Code, and the IT Rules 2021 (intermediaries, SSMIs, traceability, three-tier grievance, OTT). NEED AND Bodies Why independent regulation media is meant to be adversarial , so government regulation can harm media and society self-regulation is the ideal on paper, but Justice Markandey Katju : self-regulation equals no regulation so external regulation independent of government is more prudent Leveson Inquiry (UK, 2012) after the News of the World phone-hacking scandal backed stronger independent press regulation Body Scope BCCC (Broadcasting Content Complaints Council) self-regulation of non-news broadcasting content NBDSA (News Broadcasting and Digital Standards Authority, earlier NBSA) self-regulation of news broadcasting ASCI (Advertising Standards Council of India) self-regulation of advertising standards Value addition Critics call self-regulatory bodies toothless : weak enforcement powers. Press Council OF India Composition Statutory body under the Press Council Act, 1978 Chairperson + 28 members Chair traditionally a retired SC judge 20 represent the press 5 from Parliament 1 Bar Council of India 1 UGC 1 Sahitya Akademi Memory aid · 20-5-1-1-1 PCI 28: 20 press + 5 Parliament + one each from Bar Council, UGC, Sahitya Akademi (20+5+3 = 28). (own mnemonic) Functions and limits two functions: preserve press freedom and maintain standards and ethics of journalism Scope mainly newspapers and news agencies Cannot directly regulate TV and online Limited enforcement, so demands for stronger comprehensive regulation FDI IN NEWS Media Category FDI limit Route Print (news and current affairs) 26% Government approval Digital news media (specified activities) 26% Government approval TV news and current affairs channels 49% Government approval Case for liberalising First Press Commission (1955) feared excessive foreign control but print still has monopolies and concentration more investment could help small newspapers survive , with editorial control kept domestic Government Suppression OF Media Pressure routes legislation, executive action, licensing, advertising policy , regulatory pressure Illustrations Yakub Memon coverage (2015): notices reportedly sent to ABP News, Aaj Tak, NDTV under the Programme Code of the Cable Television Networks Rules, 1994 Programme Code bars: Offences to good taste or decency Obscene or defamatory content Falsehoods, innuendoes, half-truths Content inciting violence or public disorder Content affecting the integrity of the judiciary . Criticism: vague words allow arbitrary use denial of government advertising to particular outlets: indirect pressure on press freedom Digital NEWS AND THE IT Rules, 2021 Why digital news is hard to regulate Internet keeps evolving Fixed classes can force structures convergence: TV channels also online foreign ownership in some platforms borderless: news in the USA is read in India platforms (Google, Facebook) distribute news: publisher vs intermediary vs distributor Scope IT (Intermediary Guidelines and Digital Media Ethics Code) Rules, 2021 , under the IT Act, 2000 intermediary: Receives, stores or transmits records for another (Facebook, WhatsApp, YouTube, Instagram) Digital news and OTT publishers are not automatically intermediaries reasons: Fake news Hate speech and security threats Abuse Incitement Morphed pictures of women Defamation. Tehseen Poonawalla (2018) (mob lynching guidelines; curb explosive messages) is part of the backdrop Due diligence by intermediaries inform users of rules, privacy policy, user agreement act on lawful orders to remove or disable unlawful content retain information for prescribed periods ( 180-day requirements in defined cases, not for every deleted item) grievance redressal mechanism Significant Social Media Intermediaries (SSMI) threshold originally 50 lakh registered users in India extra duties: Chief Compliance Officer Resident Grievance Officer Nodal Contact Person (24x7 with law enforcement) Monthly compliance report Memory aid · CRNM SSMI four: C hief compliance officer · R esident grievance officer · N odal person · M onthly report. (own mnemonic) First originator (messaging SSMIs) must enable identification of the first originator on a judicial or authorised government order , for serious offences (sovereignty, security, public order, sexual violence) concerns: Breaks end-to-end encryption Privacy (Art 21) needs legality, necessity, proportionality Security and business interests Tier Grievance mechanism for digital publishers 1. Publisher appoint a Grievance Redressal Officer ; resolve within the prescribed period (originally 15 days ) 2. Self-regulatory body of publishers, if complainant is not satisfied 3. Government oversight Central Government and an Inter-Departmental Committee ; criticised as government-run final oversight Other provisions emergency blocking directions under the specified process: censorship worries OTT classification: U, U/A 7+, 13+, 16+, A Parental controls and age verification for adult content code of ethics: digital news publishers follow the PCI Norms of Journalistic Conduct and the Programme Code (rules built for old media on new platforms) Issues WITH THE IT Rules, 2021 Eight issues Safe harbour (Section 79, IT Act): Conditional protection from liability for third-party content Lost if due diligence is not followed Encryption and privacy: traceability may risk mass surveillance Limited consultation across publishers, tech firms, civil society, users Excessive delegated legislation: Rules cannot go beyond the parent Act A fuller statute may be needed Unreasonable restrictions and censorship: test against 19(1)(a) and 19(2) Compliance burden , especially for small digital outlets Legacy media online may face overlapping print, TV and digital rules Memory aid · SELDUCL Issues: S afe harbour · E ncryption · L imited consultation · D elegated legislation · U nreasonable restriction · C ompliance burden · L egacy media overlap. (own mnemonic) Way forward / key point Balance: Big Tech shapes public discourse and the State must protect security and order, so regulation within constitutional limits is valid; but it must respect privacy and free speech . The digital space is still evolving."}, {"c": "7", "n": "Media, Digital Regulation and the Right to Protest", "id": "3-right-to-protest", "t": "3 · Right TO Protest", "x": "3 · Right TO Protest # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Fundamental Rights handout pp. 37-38. Prelims PYQs quoted: none quoted in the material. In simple words Protest is derived from Arts 19(1)(a), (b), (c) and linked to Art 21. It is subject to reasonable restrictions. Amit Sahni (Shaheen Bagh) says no indefinite blocking of roads; Himat Lal says no unrestricted right but no blanket ban; Rangarajan needs a proximate link to harm. Basis AND Limits Constitutional basis Derived mainly from Art 19(1)(a) (speech) and 19(1)(b) (assembly) Connected to 19(1)(c) (association) protests concern life, livelihood, dignity , so also linked to Art 21 Since parent rights are subject to reasonable restrictions , so is protest The task is balancing peaceful protest with public order and others' rights Memory aid · AAA-21 Protest roots: A rt 19(1)(a) speech · 19(1)( b ) assembly · 19(1)(c) association, plus Art 21. (own mnemonic) Landmark Cases Case Held Himat Lal K. Shah v. Commissioner of Police (1973) assembly right is not an unrestricted right to protest anywhere, any way ; State may regulate meetings and processions , but no general or arbitrary ban on peaceful assemblies in all public places S. Rangarajan (1989) expression cannot be suppressed on illusory, imaginary or remote threats to public order; need a proximate connection with anticipated harm Amit Sahni v. Commissioner of Police (2020) (Shaheen Bagh) protest must be balanced with public order and others' rights; no indefinite occupation or blockage of public roads ; State may regulate place and manner Criticism of Amit Sahni Disruption is natural to many protests Society must show reasonable tolerance of inconvenience, else the right becomes hollow But public inconvenience is not an extra ground in Art 19(3) Any restriction must be justified within the Constitution and law Way forward / key point Balance: assembly is a Fundamental Right; restrict only within constitutional limits; protect democratic mobilisation and dissent as well as public order. Current Affairs TO ADD (verify) Note July 2026 magazine, \"Right to Protest\": the NEET protest march ; the SC observed that peaceful protest is guaranteed . Cases listed there: Ramlila Maidan (2012) , MKSS (2018) (designated protest sites in Delhi), Anuradha Bhasin (internet access), Shaheen Bagh (2020) . Prelims fodder: Art 19 is for citizens only ; \"public order\" was inserted by the First Amendment, 1951 . Note September 2026 magazine: the SC used Art 142 to quash FIRs against students in the NEET-UG 2026 protest . PYQ 2019 on Art 142 and PYQs on free speech, hate speech and films are noted there. Check the order before quoting. Memory aid · HRA-P Case order: H imat Lal (1973) → R angarajan (1989) → A mit Sahni (2020). (own mnemonic)"}, {"c": "7", "n": "Media, Digital Regulation and the Right to Protest", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Press freedom basis inferred from Art 19(1)(a) NCRWC recommendation explicit press freedom in Art 19 Sen's example Great Chinese Famine 1958-61 Murdochisation one entity dominating print, TV, radio Paid news in RPA 1951 not a separate offence by that label Kangaroo court acts as court without legitimate authority Sahara v. SEBI 2012 doctrine of postponement Chinese Wall editorial separate from marketing Gonzo journalism subjective, reporter involved, not necessarily unethical Katju on self-regulation equal to no regulation Leveson Inquiry UK 2012 after phone hacking PCI Act and size 1978; chair plus 28 members PCI 28 members 20 press, 5 Parliament, 1 each Bar Council, UGC, Sahitya Akademi FDI print / digital / TV news 26 / 26 / 49 per cent, government route Programme Code under Cable Television Networks Rules, 1994 IT Rules 2021 SSMI threshold 50 lakh users SSMI four officers CRNM Three tiers publisher, self-regulatory body, government committee Section 79 safe harbour for intermediaries Protest rooted in Art 19(1)(a), (b), (c) and Art 21 Himat Lal 1973 regulate, but no blanket ban on assemblies Rangarajan 1989 proximate link needed; no illusory threats Amit Sahni 2020 Shaheen Bagh; no indefinite road blockage Critics say tolerate inconvenience or the right is hollow Art 19 holders citizens only First Amendment 1951 added \"public order\" (verify)"}, {"c": "7", "n": "Media, Digital Regulation and the Right to Protest", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts in Start Here)"}, {"c": "7", "n": "Media, Digital Regulation and the Right to Protest", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards"}, {"c": "8", "n": "Article 19(1)(g), Article 20 and Article 21: Foundations, Environment", "id": "1-article-19-1-g-dance-bars-online-gaming", "t": "1 · Article 19(1)(g) · Dance BARS · Online Gaming ACT 2025", "x": "1 · Article 19(1)(g) · Dance BARS · Online Gaming ACT 2025 # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Fundamental Rights 2 handout pp. 3-4. Prelims PYQs quoted: none quoted in the material. In simple words Citizens may practise any trade or profession, but Art 19(6) lets the State restrict it in the public interest, prescribe qualifications, or take over a trade. Dance bars show a blanket ban is disproportionate; online gaming shows skill vs chance and Union vs State power. Article 19(1)(g) AND 19(6) Right and restrictions 19(1)(g): practise any profession , carry on any occupation, trade or business 19(6): reasonable restrictions in the interests of the general public State monopoly: partial or complete State monopoly in a trade, business, industry or service professional qualifications: State may prescribe minimum technical or professional qualifications public-interest limits on trades like liquor and arms Note State of Maharashtra v. Indian Hotel and Restaurants Association (2013): SC overturned the Mumbai dance-bar ban (adverse moral and social effects). Many women depend on the work for livelihood . Regulation is fine, a discriminatory or disproportionate blanket ban is not. Skill-based Gaming AND Online Gaming Framework links profession, public morality, technology and federalism Art 19(1)(g) and 19(6) Entry 34, State List: betting and gambling is a State subject R.M.D. Chamarbaugwala (1957): Competitions of substantial skill are not gambling Rummy and some fantasy formats were treated as games of skill Pure chance gets no protection Karnataka and Tamil Nadu High Courts struck down blanket bans on online skill games as disproportionate The position then changed with the 2025 central law Promotion and Regulation of Online Gaming Act, 2025 (verify) national framework to prohibit online money games and promote e-sports and online social games three categories: E-sports Online social games (no prohibited stakes) Online money games (money stakes for monetary gain, whether skill or chance ) Bans offering, advertising and facilitating money games Banks and payment gateways cannot process them An Authority on Online Gaming Blocking powers penalties: Offering: up to 3 years and ₹1 crore Advertising: up to 2 years and ₹50 lakh Search, seizure, corporate liability Why the Act Concerns addiction and financial loss overbroad ban may push users to offshore sites youth vulnerability federalism: betting is a State subject fraud, rigged algorithms jobs and investment hit money laundering skill vs chance: proportionality for games once held skill-based State-by-State fragmentation enforcement against offshore platforms and payment channels Way forward / key point Way forward: strengthen enforcement against offshore platforms; promote e-sports and social gaming; get judicial clarity on federalism and proportionality under 19(1)(g) ."}, {"c": "8", "n": "Article 19(1)(g), Article 20 and Article 21: Foundations, Environment", "id": "2-article-20-protection-in-conviction-self", "t": "2 · Article 20 · Protection IN Conviction · Self-incrimination", "x": "2 · Article 20 · Protection IN Conviction · Self-incrimination # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Fundamental Rights 2 handout pp. 4-5. Prelims PYQs quoted: none quoted in the material. In simple words Art 20 has three shields against arbitrary punishment, for citizens and non-citizens, and cannot be suspended in an Emergency. Art 20(3) bars compelled testimony: Selvi (2010) says narco, polygraph and brain mapping cannot be forced, but blood, DNA and fingerprints can be taken. Three Safeguards Clause Protection 20(1) ex post facto criminal laws 20(2) double jeopardy 20(3) self-incrimination Value addition Art 20 applies to citizens and non-citizens and cannot be suspended even during a National Emergency . Memory aid · EDS Art 20: E x post facto · D ouble jeopardy · S elf-incrimination (in clause order). (own mnemonic) Article 20(3): Self-incrimination Meaning \"No person accused of any offence shall be compelled to be a witness against himself\" Protects against compelled testimonial evidence No forced incriminating statements Scientific techniques Narcoanalysis (sodium pentothal) Polygraph (lie detector) Brain mapping Note Selvi v. State of Karnataka (2010): these tests cannot be forcibly administered ; involuntary use violates Art 20(3) (where applicable) and Art 21 . With voluntary and informed consent and safeguards they may be done, but statements are not automatically admissible ; material discovered through them may be admissible under evidence rules. Physical vs testimonial lawful collection of blood, DNA, fingerprints, specimen signatures or handwriting, identification parades is generally allowed without consent Key distinction: 20(3) bars compelled testimony , not every collection of physical or identifying evidence"}, {"c": "8", "n": "Article 19(1)(g), Article 20 and Article 21: Foundations, Environment", "id": "3-article-21-golden-triangle-livelihood-he", "t": "3 · Article 21 · Golden Triangle · Livelihood · Health · Menstrual Health", "x": "3 · Article 21 · Golden Triangle · Livelihood · Health · Menstrual Health # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Fundamental Rights 2 handout pp. 5-7. Prelims PYQs quoted: none quoted in the material. In simple words Arts 14, 19 and 21 are the Golden Triangle. Art 21 moved from procedure established by law (Gopalan) to fair, just and reasonable procedure (Maneka), and from a negative duty to positive duties: livelihood (Olga Tellis), health, menstrual health. A \"canopy\" of rights. Foundation Value addition Golden Triangle: Arts 14, 19, 21 . Even if other Part III rights were removed, much protection could be deduced from these three (equality, freedom, life and personal liberty). Text and early reading \"No person shall be deprived of his life or personal liberty except according to procedure established by law \" First read as protection from executive , not legislative , tyranny The law's reasonableness is not mentioned 1950 A. K. Gopalan: narrow reading of personal liberty and procedure established by law 1978 Maneka Gandhi: procedure must be fair, just and reasonable , not arbitrary or oppressive Later livelihood, health, shelter, privacy, dignity, environment, access to justice Negative to positive obligation Life once meant only physical existence The State's duty has grown from not interfering to protecting and preserving life (health, shelter, education, environment) rights read into 21: Dignity, livelihood, shelter Health, emergency aid, menstrual health Clean environment and climate Privacy, autonomy, reputation Fair and speedy trial, legal aid Protection from custodial violence and inhuman prison conditions Peaceful sleep Art 21 is a canopy of rights Livelihood AND Shelter Note Olga Tellis v. Bombay Municipal Corporation (1985): pavement and slum dwellers evicted as encroachers. Held: right to life includes right to livelihood ; eviction needs fair and lawful procedure . It did not create an absolute right to alternative housing. Linked Part III with Part IV , bridging civil-political and socio-economic rights. Health AND Menstrual Health Right to health access to healthcare and emergency medical aid is part of life and dignity positive duty, extent depends on constitutional standards, laws and resources Right to menstrual health manage menstruation safely, affordably, with dignity : clean toilets, sanitary products, medical support, no stigma Linked to life, dignity, health, education SC stressed sanitary products, private clean toilets and safe disposal in schools mandatory menstrual leave: the Court left it to policy , not a nationwide judicial order Policy dilemma Practical solutions severe pain (e.g. endometriosis): no one should be forced to work through it flexible hours, work from home mandatory employer-paid leave may cause hiring bias clean rest rooms, private sanitation, pain relief school sanitary products, running water, safe disposal"}, {"c": "8", "n": "Article 19(1)(g), Article 20 and Article 21: Foundations, Environment", "id": "4-article-21-clean-environment-climate-rig", "t": "4 · Article 21 · Clean Environment · Climate Right · Ranjitsinh (2024)", "x": "4 · Article 21 · Clean Environment · Climate Right · Ranjitsinh (2024) # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Fundamental Rights 2 handout pp. 7-8. Prelims PYQs quoted: none quoted in the material. In simple words Courts read a clean environment into Art 21 and added the polluter-pays, precautionary, public-trust and sustainable-development principles. M. K. Ranjitsinh (2024) recognised a right against climate change under Arts 14 and 21 and balanced bustard conservation with renewable energy. Clean Environment 1986 M. C. Mehta (Oleum gas leak): absolute liability 1991 Subhash Kumar v. State of Bihar: pollution-free water and air under Art 21 1996 Vellore Citizens' Welfare Forum: precautionary principle and polluter pays part of sustainable development Four principles polluter pays: the polluter bears the cost precautionary: anticipate and prevent harm public trust: natural resources are held in trust by the State for the public sustainable development: balance growth and protection Memory aid · PPPS Environment principles: P olluter pays · P recautionary · P ublic trust · S ustainable development. (own mnemonic) Applications firecracker air pollution vehicular emissions in Delhi river pollution oversight by courts and tribunals Right Against Climate Change Note M. K. Ranjitsinh v. Union of India (2024): case on the Great Indian Bustard hit by overhead power lines in Rajasthan and Gujarat. Recognised a fundamental right against adverse effects of climate change under Arts 14 and 21 ; replaced blanket line restrictions with an expert-driven, calibrated approach balancing conservation and renewable energy. Analysis Green vs green dilemma: save an endangered bird or expand clean energy renewables seen as environmental protection , not mere commerce Targeted protection on expert assessment Institutional humility (experts demarcate) Significance and criticism Constitutionalises climate rights Recognises impact on health, food, water, dignity Climate equity (poor hit hardest) Positive State duties criticism: Little guidance on enforcing the new right Relaxing line restrictions may weaken bustard protection Way forward / key point Shows the Constitution as a living document : Art 21 keeps expanding with new environmental challenges."}, {"c": "8", "n": "Article 19(1)(g), Article 20 and Article 21: Foundations, Environment", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. 19(1)(g) right profession, occupation, trade or business Dance bar case 2013 blanket ban disproportionate; regulation allowed Betting entry Entry 34, State List Chamarbaugwala 1957 skill vs gambling Three game categories 2025 e-sports, online social, online money Money-game penalty 3 years and ₹1 crore; advertising 2 years and ₹50 lakh Art 20 three clauses ex post facto, double jeopardy, self-incrimination Suspended in Emergency? No Applies to citizens and non-citizens Selvi 2010 narco, polygraph, brain mapping not forced Allowed without consent blood, DNA, fingerprints, handwriting Golden Triangle Arts 14, 19, 21 Gopalan vs Maneka narrow vs fair, just, reasonable Olga Tellis 1985 livelihood part of life; no absolute right to alternative housing Art 21 role shift negative to positive obligation Menstrual leave left to policy by the SC Absolute liability case M. C. Mehta 1986, Oleum gas leak Subhash Kumar 1991 pollution-free air and water under Art 21 Vellore 1996 precautionary and polluter pays Ranjitsinh 2024 right against adverse effects of climate change, Arts 14 and 21 Green vs green bustard vs renewable energy"}, {"c": "8", "n": "Article 19(1)(g), Article 20 and Article 21: Foundations, Environment", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts in Start Here)"}, {"c": "8", "n": "Article 19(1)(g), Article 20 and Article 21: Foundations, Environment", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards"}, {"c": "9", "n": "Article 21: Privacy, Autonomy, Right to Die and Prisoners' Rights", "id": "1-right-to-privacy-dpdp-right-to-be-forgot", "t": "1 · Right TO Privacy · DPDP · Right TO BE Forgotten · Digital Access", "x": "1 · Right TO Privacy · DPDP · Right TO BE Forgotten · Digital Access # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Fundamental Rights 2 handout pp. 8-10. Prelims PYQs quoted: none quoted in the material. In simple words Privacy became a Fundamental Right in Puttaswamy (2017), overruling the older view. It can be limited only by law, for a legitimate aim, if necessary and proportionate. Know surveillance (s.69, Pegasus), DPDP Act 2023, RTI vs privacy, right to be forgotten, personality rights and digital access. Judicial Evolution 1954 / 1962 M. P. Sharma and Kharak Singh: no general right to privacy; but Kharak Singh struck night visits by police 1997 PUCL: phone tapping violates privacy (Art 21) and 19(1)(a); safeguards: lawful authorisation, limited duration, review 2017 K. S. Puttaswamy: nine judges, unanimous : privacy is a Fundamental Right under Arts 14, 19, 21 Puttaswamy holdings personal autonomy: body, identity, food, relationships, sexual orientation informational privacy: against unjustified collection, use, disclosure of data dignity and equality: belongs to everyone, not an elitist privilege Overruled earlier denial and the ADM Jabalpur (1976) position Base for data protection, LGBTQ+ rights and limits on surveillance Restrictions: four tests Legality (basis in law) Legitimate aim Necessity Proportionality Memory aid · LLNP Privacy test: L egality · L egitimate aim · N ecessity · P roportionality. (own mnemonic) Contemporary Issues Surveillance s.69, IT Act 2000: interception, monitoring, decryption on specified grounds with safeguards Pegasus raised surveillance, accountability and chilling-effect worries Surveillance must be lawful, necessary, proportionate, overseen DPDP Act, 2023 Protects digital personal data while allowing lawful processing Consent , data security, individual rights, grievance redressal DPDP Rules, 2025 give phased implementation concerns: broad State exemptions , weak independent oversight RTI link: S.8(1)(j) RTI Act personal-information exemption The DPDP Act amends it: privacy vs transparency International frame Art 17 ICCPR (no arbitrary interference with privacy) Justice A. P. Shah Committee (2012) on comprehensive privacy protection Right TO BE Forgotten Idea and status Seek removal, masking or restricted access to personal information whose public availability is no longer justified A person should not be stigmatised for life by irrelevant past data Several High Courts examined it under informational privacy, dignity, reputation (de-indexing, masking identities) Not absolute Memory aid · GCPRR Concerns: G lobal internet · C ensorship risk · P ublic records · R TI · R ewriting history. (own mnemonic) Concerns spelt out removed on one platform, available elsewhere can suppress legitimate criticism erodes completeness of public records clashes with right to information May rewrite history Balance privacy and rehabilitation with expression, accountability, preserved records Personality Rights AND Digital Access Personality rights Protect name, image, voice, likeness from unauthorised commercial use Tied to privacy, reputation, publicity Anil Kapoor (2023) and Jackie Shroff (2024): Delhi High Court protection AI threats: Deepfakes, voice cloning But over-protection can hurt satire, parody, art (Art 19(1)(a)) 2019 Faheema Shirin (Kerala HC): internet access linked to education and privacy under Art 21 2020 Anuradha Bhasin: expression and trade via the internet protected; restrictions need legality and proportionality ; indefinite shutdowns impermissible 2025 Pragya Prasun and Amar Jain: digital accessibility part of right to life and dignity, esp. for persons with disabilities Way forward / key point Digital governance must promote inclusion , not create new barriers to rights. Digital exclusion can block access to ID, banking, scholarships and welfare."}, {"c": "9", "n": "Article 21: Privacy, Autonomy, Right to Die and Prisoners' Rights", "id": "2-personal-autonomy-life-partner-mtp-lgbtq", "t": "2 · Personal Autonomy · LIFE Partner · MTP · Lgbtq+ Rights", "x": "2 · Personal Autonomy · LIFE Partner · MTP · Lgbtq+ Rights # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Fundamental Rights 2 handout pp. 10-12. Prelims PYQs quoted: none quoted in the material. In simple words Art 21 protects the choice of partner (Hadiya), reproductive autonomy (MTP Act) and sexual and gender identity (NALSA, Navtej). Supriyo (2023) refused a right to same-sex marriage and left it to Parliament. Note the 2026 amendment to the Transgender Act and BNS dropping s.377. Choice OF Partner Note Shafin Jahan v. Asokan K. M. (2018), Hadiya case: right to choose a life partner is protected by Art 21 ; freedom of conscience and religion protected; neither the State nor patriarchal authority can override an adult's lawful choice. Related Lata Singh (2006): adults may marry outside caste or religion Shakti Vahini (2018): measures against honour crimes , protect couples Abortion AND Reproductive Autonomy Debate Woman's right over her body and reproductive agency vs State duty to protect life including foetal interests When does life begin (biology, morality, religion) Cases Suchita Srivastava (2009): reproductive choice is part of personal liberty X v. Principal Secretary, Health (2022): unmarried women cannot be excluded from abortion access on marital status MTP Act 1971 (amended 2021) Rule up to 20 weeks on prescribed grounds, one registered medical practitioner 20 to 24 weeks specified categories of women, two practitioners beyond 24 weeks Medical Board for substantial foetal abnormalities, other recognised cases confidentiality identity and privacy protected Value addition The law regulates when abortion is permitted; it is not an unrestricted right at any stage . Issues: autonomy, safe treatment, foetal interests, unequal rural access. Lgbtq+ Rights (ARTS 14, 15, 16, 19, 21) Transgender rights NALSA (2014): Transgender persons are the Third Gender Equality (14), non-discrimination (15, 16), expression, self-identification, dignity (19, 21) Treat as socially and educationally backward with reservation Referred to the Yogyakarta Principles (2006) Transgender Persons (Protection of Rights) Act, 2019: Bars discrimination in education, jobs, health, services Identity certificate via District Magistrate Criticised for weak self-identification and low penalties Amendment Act, 2026 (handout; verify): Narrower definition , medical certification , stronger penalty for forced assumption of transgender identity Raises self-identification and NALSA concerns 2009 Naz Foundation (Delhi HC): read down s.377 for consensual adult acts 2013 Suresh Kumar Koushal: SC reversed it 2018 Navtej Singh Johar: SC decriminalised consensual same-sex acts (violated Arts 14, 15, 19, 21); privacy, dignity, constitutional morality over majoritarian morality 1 Jul 2024 BNS does not retain s.377: worry about protection against non-consensual acts Marriage Arun Kumar (Madras HC, 2019): \"bride\" in the Hindu Marriage Act includes a transgender woman Supriyo v. Union of India (2023): No general Fundamental Right to marry Special Marriage Act not extended to same-sex couples Transgender persons in heterosexual relationships can marry Dignity, autonomy, equality reaffirmed Wider recognition left to the legislature Memory aid · NNS LGBTQ+ case chain: N ALSA (2014) → N avtej (2018) → S upriyo (2023). (own mnemonic)"}, {"c": "9", "n": "Article 21: Privacy, Autonomy, Right to Die and Prisoners' Rights", "id": "3-right-to-die-suicide-euthanasia-living-w", "t": "3 · Right TO DIE · Suicide · Euthanasia · Living WILL", "x": "3 · Right TO DIE · Suicide · Euthanasia · Living WILL # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Fundamental Rights 2 handout pp. 12-14. Prelims PYQs quoted: none quoted in the material. In simple words Art 21 gives a right to die with dignity in recognised end-of-life situations, not a right to end life at will (Gian Kaur). Attempted suicide is now treated as a mental-health matter. Passive euthanasia and living wills were recognised in Aruna Shanbaug and Common Cause; Harish Rana (2026) covers withdrawing nutrition. Suicide AND Decriminalisation Why life is different We can speak or not speak, move or not move But death is irreversible , so the logic does not carry over directly Legal position IPC s.309 punished an unsuccessful attempt Mental Healthcare Act, 2017, s.115: Presumption of severe stress Care, treatment, rehabilitation BNS s.226: Only an attempt to compel or restrain a public servant The general s.309 offence is not retained For decriminalisation compassion odd to punish an attempt but not the act encourages treatment failure of social support golden hour: fear of case delays aid global trend to care Against social consequences for family and society State duty to protect life Note Gian Kaur v. State of Punjab (1996): upheld then-s.309; right to life does not include a right to die ; distinguished ending life from dignity in the natural process of dying . Law Commission: 42nd Report (1971) and 210th Report (2008) recommended repeal. Euthanasia Type Meaning Active direct act, e.g. lethal drug, causes death Passive withholding or withdrawing life-sustaining treatment in legally recognised cases Voluntary patient's informed wish Non-voluntary patient cannot decide; legal decision process needed Involuntary against the patient's wishes For ends suffering informal withdrawals already happen financial burden scarce ICU resources Against medical ethics (duty to preserve life) abuse by vested interests unexpected recovery less research incentive family convenience over patient interest 2011 Aruna Shanbaug: passive euthanasia allowed under strict conditions; High Court oversight and medical opinion 2016 Medical Treatment of Terminally Ill Patients Bill: not enacted 2018 Common Cause: right to die with dignity part of Art 21; passive euthanasia and Advance Medical Directives (living wills) recognised; no general right to end life 2023 Modified Common Cause guidelines: simpler procedure, revised medical boards, no routine High Court approval 2026 Harish Rana: Clinically Assisted Nutrition and Hydration (CANH) can be medical treatment capable of withdrawal; stress on best interests, medical opinion, family consultation, safeguards (verify) Way forward / key point Living will: a competent adult records wishes on future life-sustaining treatment if they lose capacity. Key distinction: Art 21 protects dying with dignity in recognised end-of-life situations, not an unrestricted right to end life."}, {"c": "9", "n": "Article 21: Privacy, Autonomy, Right to Die and Prisoners' Rights", "id": "4-speedy-trial-legal-aid-undertrials-custo", "t": "4 · Speedy Trial · Legal AID · Undertrials · Custodial Violence · D. K. BASU", "x": "4 · Speedy Trial · Legal AID · Undertrials · Custodial Violence · D. K. BASU # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Fundamental Rights 2 handout pp. 14-15. Prelims PYQs quoted: none quoted in the material. In simple words Hussainara Khatoon made speedy trial and free legal aid part of Art 21. About three-quarters of prisoners are undertrials; BNSS s.479 gives early release. Sunil Batra: prisoners keep their rights. D. K. Basu laid down nine arrest safeguards against custodial violence. Speedy Trial AND Legal AID Note Hussainara Khatoon v. State of Bihar (1979): undertrials jailed for years without trial. Speedy trial is part of Art 21 ; prolonged detention without trial violates liberty; State must give free legal aid to indigent accused; led to release of many undertrials; the process must not become the punishment . Undertrial prisoners Accused kept in jail during investigation or trial, not convicted About three-fourths of India's prison population reasons: Overworked police \" bail is the rule, jail the exception \" ignored Judicial pendency Weak prosecution Poverty and poor legal aid BNSS s.479: Release after half of the maximum sentence One-third for eligible first-time offenders, with exceptions Bhim Singh (2014): SC directed effective use of safeguards against long undertrial detention Memory aid · OBJWP Undertrial causes: O verworked police · B ail ignored · J udicial pendency · W eak prosecution · P overty. (own mnemonic) Note Sunil Batra v. Delhi Administration (1978): prisoners keep their Fundamental Rights ; no arbitrary or inhuman treatment, torture or cruel punishment. Imprisonment limits liberty by law; it does not end dignity . Custodial Violence Meaning and reasons Physical, mental or sexual abuse of persons in custody Not every custodial death is custodial violence reasons: Overworked police Media and public pressure for quick results (forced confessions) Poor investigation tools Weak training Weak accountability Safeguards Art 20(3) Art 21 Art 22 BNSS s.53: medical examination of arrestee to record injuries BNSS s.196: magisterial inquiry into custodial death, disappearance or rape Note D. K. Basu v. State of West Bengal (1997): guidelines against arbitrary arrest and custodial violence. # D. K. Basu guideline 1 police identification and name tags 2 arrest memo : date, time, witnessed and countersigned 3 inform a relative, friend or nominated person 4 police diary entry of arrest and person informed 5 injury inspection memo with a copy 6 medical examination at intervals 7 documents to Magistrate 8 arrestee may meet a lawyer during interrogation (not throughout) 9 police control room information Memory aid · PAIPIMMLC Nine steps: P olice ID · A rrest memo · I nform family · P olice diary · I njury memo · M edical check · M agistrate · L awyer · C ontrol room. (own mnemonic)"}, {"c": "9", "n": "Article 21: Privacy, Autonomy, Right to Die and Prisoners' Rights", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Puttaswamy bench nine judges, 2017 Overruled ADM Jabalpur approach Privacy test LLNP PUCL 1997 phone tapping safeguards RTI exemption for personal info section 8(1)(j) Right to be forgotten removal or masking when no longer justified; not absolute Anuradha Bhasin 2020 no indefinite internet shutdown Pragya Prasun 2025 digital accessibility part of life and dignity Hadiya case year Shafin Jahan v. Asokan 2018 Lata Singh 2006 adults may marry outside caste or religion MTP time limits 20 weeks one doctor; 20-24 two doctors; beyond 24 Medical Board X v. Principal Secretary 2022 unmarried women included NALSA 2014 Third Gender, reservation as backward class Navtej 2018 consensual same-sex acts decriminalised Supriyo 2023 no right to same-sex marriage; legislature to decide BNS and s.377 not retained Mental Healthcare Act section 115, presumption of severe stress BNS section on attempt 226, only to compel a public servant Gian Kaur 1996 no right to die under Art 21 Aruna Shanbaug 2011, passive euthanasia Common Cause 2018 dignity in dying; living wills 2023 change no routine HC approval Harish Rana 2026 CANH withdrawal (verify) Hussainara Khatoon 1979 speedy trial and legal aid under Art 21 Undertrial share about three-fourths of prisoners BNSS section 479 release at half (one-third for first-time offenders) Sunil Batra 1978 prisoners keep fundamental rights D. K. Basu 1997 nine guidelines on arrest BNSS 196 magisterial inquiry into custodial death"}, {"c": "9", "n": "Article 21: Privacy, Autonomy, Right to Die and Prisoners' Rights", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts in Start Here)"}, {"c": "9", "n": "Article 21: Privacy, Autonomy, Right to Die and Prisoners' Rights", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards"}, {"c": "10", "n": "Death Penalty, Articles 21A, 22, 23 and 24", "id": "1-death-penalty-rarest-of-rare-clemency-re", "t": "1 · Death Penalty · Rarest OF RARE · Clemency · Remission", "x": "1 · Death Penalty · Rarest OF RARE · Clemency · Remission # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Fundamental Rights 2 handout pp. 15-17. Prelims PYQs quoted: none quoted in the material. In simple words Capital punishment is constitutional but limited to the rarest of rare cases (Bachan Singh 1980, Machhi Singh 1983). Mercy lies with the President (Art 72) and Governor (Art 161). Life imprisonment normally means natural life; remission is regulated by BNSS and Sriharan (2015). Position AND Arguments Value addition Art 21 allows deprivation of life only by a fair, just and reasonable procedure. SC upheld the death penalty but limited it by the Rarest of Rare doctrine. For deterrence retributive justice collective conscience on heinous crimes Against irreversible , error kills the innocent dignity: cruel, inhuman reform denied class bias: poor lack lawyers deterrence unproven vs life term Extradition from abolitionist states ICC does not use it Law Commission 35th Report (1967): retain 262nd Report (2015): Abolish except terrorism and waging war Plus police reform, witness protection, victim compensation Rarest OF RARE Note Bachan Singh v. State of Punjab (1980): upheld death penalty. Life imprisonment is the rule, death the exception ; weigh aggravating (exceptional brutality) and mitigating factors (age, background, reform chance); individualised sentencing : crime and criminal. Machhi Singh v. State of Punjab (1983): five factors Manner (brutality) Motive (moral depravity) Anti-social nature (caste hatred, bride burning) Magnitude (victims, scale) Victim's vulnerability (children, elderly) proposed a Balance Sheet approach Memory aid · MMAMV Machhi Singh: M anner · M otive · A nti-social · M agnitude · V ulnerable victim. (own mnemonic) 1996 Ravji: over-weighed the crime, ignored the criminal 2009 Bariyar: Ravji inconsistent with Bachan Singh; mitigating factors restored 2012 Sangeet: criticised the mechanical balance sheet; weigh crime and criminal Limits of the doctrine subjective terms (\"collective conscience\") judge-centric: similar crimes, different sentences death sentences reversed on appeal: fairness doubts Clemency Provisions Art 72: President can pardon death sentences and use other clemency powers Art 161: Governor can suspend, remit, commute death sentences but cannot grant a full pardon in death cases both act on aid and advice of the Council of Ministers Case Held Kehar Singh (1989) President may re-examine evidence on mercy petitions; limited judicial review Epuru Sudhakar (2006) no mala fide, caste, religion, political favouritism or irrelevant considerations Triveniben (1989) undue delay may justify commutation Shatrughan Chauhan (2014) unexplained delay and serious mental illness may justify commutation; safeguards on notifying mercy rejection and execution Clemency Board proposal need: expertise, transparency, timely decisions challenge: Constitutional fit Binding or not indicative six-month period, reasons for delay Remission AND LIFE Imprisonment BNSS, 2023 S.473 suspension and remission S.474 commutation S.475 minimum 14 years before statutory release in specified life cases S.477 Central concurrence in specified cases Life imprisonment ordinarily means remainder of natural life , not automatic release at 14 years Note Union of India v. V. Sriharan (2015) (Rajiv Gandhi case): constitutional clemency is distinct from statutory remission; Central concurrence needed in specified cases; courts may impose life without ordinary remission for a fixed term over 14 years or natural life. Later: SC ordered release of Perarivalan (May 2022) and six others (Nov 2022)."}, {"c": "10", "n": "Death Penalty, Articles 21A, 22, 23 and 24", "id": "2-article-21-posh-jallikattu-assessment-ar", "t": "2 · Article 21 · POSH · Jallikattu · Assessment · Article 21A", "x": "2 · Article 21 · POSH · Jallikattu · Assessment · Article 21A # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Fundamental Rights 2 handout pp. 17-19. Prelims PYQs quoted: none quoted in the material. In simple words Vishakha led to the POSH Act 2013. Reputation is part of Art 21 (Swamy). Jallikattu balanced animal welfare and Art 29(1) culture (2023 upheld State laws). Art 21 is strong but invites overreach and weak implementation. Art 21A (86th Amendment) gives free education for 6 to 14. Sexual Harassment: Vishakha TO POSH Note Vishakha v. State of Rajasthan (1997): PIL on workplace harassment. Violates Arts 14, 15, 19(1)(g), 21 ; with no law, SC framed the Vishakha Guidelines , which became the base of the POSH Act, 2013 . POSH Act, 2013 Internal Committee mandatory for workplaces with 10 or more employees Local Committee where an IC is unavailable (incl. some unorganised sector) Time-bound inquiry Confidentiality concerns: non-compliance, compromised committees, low awareness in informal and rural work Reputation AND Animal Welfare Reputation Subramanian Swamy (2016): Reputation is part of dignity under Art 21 Criminal defamation upheld Balance with 19(1)(a) Animals and Jallikattu Prevention of Cruelty to Animals Act, 1960 ** 2011:** bulls added to prohibited performing animals Animal Welfare Board v. A. Nagaraja (2014): Upheld bans on Jallikattu and bullock-cart races Animal dignity Art 51A(g) compassion Shift from anthropocentric to biocentric view Five Freedoms: From hunger and thirst Discomfort Pain, injury, disease Fear and distress Freedom to express normal behaviour 2016 Centre notification allowed traditional bull events 2017 Tamil Nadu law Art 29(1) culture vs animal welfare Note Animal Welfare Board v. Union of India (2023): five-judge bench upheld State amendments allowing Jallikattu (TN), Kambala (Karnataka), bullock-cart races (Maharashtra) with safeguards; within State competence; did not decide whether Jallikattu is an essential part of Tamil culture; no violation of Arts 14, 21, 51A(g). Critical Assessment OF Article 21 Strengths from procedure to dignity positive obligations on State protects the vulnerable through PIL a living document Concerns judicial overreach weak implementation (resources, governance) balancing liberty and public interest Article 21A: Right TO Education Provision and features \"State shall provide free and compulsory education to all children aged six to fourteen \" as the State may by law determine 86th Amendment Act, 2002 Operational 1 April 2010 with the RTE Act, 2009 Needs a statute NCRWC idea: extend to 6-18 for SCs, STs, girls (handout note) Art 45 (DPSP, not justiciable) now directs early childhood care and education for under-6s 21A covers elementary education"}, {"c": "10", "n": "Death Penalty, Articles 21A, 22, 23 and 24", "id": "3-article-22-arrest-safeguards-preventive", "t": "3 · Article 22 · Arrest Safeguards · Preventive Detention", "x": "3 · Article 22 · Arrest Safeguards · Preventive Detention # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Fundamental Rights 2 handout pp. 19-22. Prelims PYQs quoted: none quoted in the material. In simple words Art 22(1)-(2) protect those arrested under ordinary law (grounds, lawyer, 24-hour Magistrate). Art 22(4)-(7) govern preventive detention: Advisory Board after three months, grounds and representation. Know the laws, the 44th Amendment never in force, and the 2026 cases. Ordinary Arrest: 22(1) AND 22(2) Rights information of grounds lawyer of choice produced before nearest Magistrate within 24 hours (excluding travel time) custody beyond 24 hours needs a Magistrate's authority Memory aid · ILPM Four rights: I nformed · L awyer · P roduced within 24 hours · M agistrate authority beyond. (own mnemonic) BNSS S.47 grounds and bail right S.48 inform relative or friend S.58 no detention beyond 24 hours 1994 Joginder Kumar: arrest not routine, must be justified 1997 D. K. Basu: arrest safeguards 2014 Arnesh Kumar: police must justify arrest, esp. offences up to seven years 2023 Pankaj Bansal: grounds in writing under PMLA Note Jaskaran Jeet Singh Deol v. State of Punjab (2026) (verify): grounds in writing, in a language the accused understands ; violation of 22(1) makes the arrest unlawful and entitles release; re-arrest for the same offence needs prior judicial approval with reasons ; superior oversight, another officer to investigate, departmental action; High Courts may award compensation . Value addition Art 22(3) exceptions: enemy aliens (not every foreigner) and persons under preventive detention laws . Preventive Detention Punitive Preventive Purpose punish after conviction prevent anticipated harm Basis offence proved material suggesting prejudicial activity Procedure after criminal trial under preventive detention laws Safeguards ordinary criminal procedure special constitutional safeguards Legislative powers Union List Entry 9: defence, foreign affairs, security of India Concurrent List Entry 3: security of a State, public order, essential supplies and services Safeguards 22(4)-(7) 22(4): no detention beyond three months without Advisory Board (persons who are, were or are qualified to be High Court judges) finding sufficient cause 44th Amendment (1978) would cut it to two months but was never brought into force Text still says three 22(5): Grounds communicated as soon as may be Earliest chance of representation 22(6): facts may be withheld in public interest 22(7): Parliament may fix cases beyond three months without a Board, maximum periods, Board procedure Memory aid · ABRP Safeguards: A dvisory Board (3 months) · B asis (grounds) communicated · R epresentation · P arliament fixes limits. (own mnemonic) Issues and NCRWC no fixed time for giving grounds broad public-interest secrecy Board of merely \"qualified\" persons subjective satisfaction NCRWC: Only sitting High Court judges on Boards Cap at six months Fixed time limits for grounds Law Status Preventive Detention Act, 1950 expired 1969 MISA, 1971 repealed 1978 COFEPOSA, 1974 in force National Security Act, 1980 in force PBM and Essential Commodities Act, 1980 in force Value addition UAPA (s.43D(5) bail limits) and PMLA raise arrest and bail concerns but are not ordinary preventive detention laws under 22(4)-(7). Judicial safeguards Rekha (2011): Not a routine police shortcut Ordinary law first Real need shown even if already in jail Ameena Begum (2023): Public order differs from law and order Relevant material with rational probative value Mulla Afroz v. Union of India (2026) (verify): Under NSA , a police confession alone cannot justify detention Detention must address future threats , not punish past offences Ordinary process cannot be bypassed Order quashed, ₹10 lakh costs on Uttar Pradesh Critique liberty lost without conviction arbitrary use against opponents and activists no Art 22(1)-(2) protection Art 21 still applies must not bypass ordinary criminal justice"}, {"c": "10", "n": "Death Penalty, Articles 21A, 22, 23 and 24", "id": "4-right-against-exploitation-articles-23-2", "t": "4 · Right Against Exploitation · Articles 23-24 · SEX WORK · Child Labour", "x": "4 · Right Against Exploitation · Articles 23-24 · SEX WORK · Child Labour # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted
