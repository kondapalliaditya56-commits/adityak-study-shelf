.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.btn{font:600 14px var(--sans);padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:40px 0 20px}.pager a{display:block;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;text-decoration:none;color:var(--ink);font:600 15px var(--sans)}.pager a.nx{text-align:right}.pager small{display:block;color:var(--muted);font-weight:500;font-size:12px}

/* ---- reader app ---- */
:root{--zoom:1;--lh:1.65;--pw:780px}
:root[data-theme="sepia"]{--bg:#F4ECD8;--surface:#FBF5E6;--surface2:#EADFC4;--ink:#3B3022;--muted:#7A6A52;--line:#D8C9A6;--acc:#7A4A12;--acc-ink:#fff;--acc-soft:#EFDDB8;--saf:#A4470A;--saf-soft:#F6E2BE;--red:#9C2A1C;--red-soft:#F3D9CB;--blue:#2F5C8A;--blue-soft:#DDE6E4;--good:#3E6B2A;--good-soft:#DDE8C8;--hl:#F2D98A;color-scheme:light}
:root[data-font="sans"] body{font-family:var(--sans)}
:root[data-font="sans"] .notes p,:root[data-font="sans"] .notes li{font-family:var(--sans)}
.page{zoom:var(--zoom);max-width:var(--pw)}
.notes p,.notes li{line-height:var(--lh)}
.rbar{position:fixed;left:0;top:0;height:3px;width:0;background:var(--acc);z-index:40;transition:width .15s}
.aabtn{color:var(--ink);border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:5px 12px;font:700 14px var(--serif);cursor:pointer;flex:none}
.h2read{float:right;margin:2px 0 0 10px;font:600 12px var(--sans);border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer;min-height:30px}
.h2read[aria-pressed="true"]{background:var(--acc-soft);color:var(--acc);border-color:var(--acc)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;justify-content:center}
.dock button{font:600 14px var(--sans);min-height:44px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;padding:0 14px;cursor:pointer}
.dock .mid{flex:1;max-width:520px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock .mid b{color:var(--acc)}
body.has-dock .page{padding-bottom:110px}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheetin{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:82vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));font:15px/1.4 var(--sans)}
.sheetin h3{margin:0 0 10px;font:700 17px var(--sans)}
.srow{display:flex;align-items:center;gap:10px;margin:12px 0;flex-wrap:wrap}
.srow label{flex:0 0 92px;color:var(--muted);font-weight:600}
.srow .grp{display:flex;gap:6px;flex-wrap:wrap}
.srow button{font:600 14px var(--sans);min-height:42px;min-width:48px;padding:0 12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;cursor:pointer}
.srow button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.secl a{display:flex;gap:10px;align-items:center;padding:12px 6px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;min-height:44px}
.secl a .tk{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--acc-ink)}
.secl a.rd .tk{background:var(--acc);border-color:var(--acc)}
.secl a.cur{background:var(--acc-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:50;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;font:600 14px var(--sans);max-width:92vw;box-shadow:0 6px 24px rgba(0,0,0,.3)}

body.focus .bar{display:none}body.focus .sidetoc{display:none}
figcaption.clamp{max-height:3.3em;overflow:hidden;position:relative;cursor:pointer}

ed in the handout 81 · NCBC · Challenges OF Sc-st-obc Commissions · Types OF Rights Low none quoted in the handout 82 · National Human Rights Commission · Composition · Working · Challenges Low none quoted in the handout 83 · UDHR · State Human Rights Commissions · Human Rights Courts Low none quoted in the handout 84 · National Commission FOR Women · Powers · Constitutional Status Debate Low none quoted in the handout 85 · Ncpcr · Scpcr · Children's Courts Low none quoted in the handout 86 · Minority Rights · Common AND Separate Domain · National Commission FOR Minorities Low none quoted in the handout 87 · National Investigation Agency · Scheduled Offences · Challenges · 2024 Ruling Low none quoted in the handout 88 · THE President · Nominal HEAD · Discretion · Election · Usa-india-france Low none quoted in the handout 89 · Ordinance-making Power · Article 123 · Court Cases · Debate Low none quoted in the handout 90 · President: India VS Germany · Vice-president · Prime Minister Low none quoted in the handout 91 · Parliamentary System · Features · Merits · Limits · India VS Britain Low none quoted in the handout 92 · Council OF Ministers · Cabinet · Committees · Cabinet Secretariat · PMO · Secretariat Low none quoted in the handout 93 · 130th Amendment BILL 2025 · Removal OF Ministers IN Custody · Basic Structure Low none quoted in the handout 94 · Speaker OF THE LOK Sabha · Powers · Impartiality · Reforms Low none quoted in the handout 95 · Parliamentary Privileges · Articles 105, 194 · RAJA RAM PAL · SITA Soren Low none quoted in the handout 96 · Bicameralism · Rajya Sabha VS LOK Sabha · Powers · Significance · Limits Low none quoted in the handout 97 · Women's Reservation · NARI Shakti Vandan · 131st Amendment BILL 2026 · Delimitation Low none quoted in the handout 98 · Functioning OF Parliament · Reforms · Mplads · Supreme NOT Sovereign Low none quoted in the handout 99 · Federalism IN India · Features · Debate · Evolution · Forms OF Federalism Low none quoted in the handout 100 · Centre-state Legislative Relations · Lists · Residuary · 42nd Amendment · Doctrines Low none quoted in the handout 101 · Parliament ON State LIST · Repugnancy (Art 254) · Model LAWS · FARM LAWS · Assent TO Bills Low none quoted in the handout 102 · Centre-state Administrative Relations · Directions · AIS · Councils · BSF · Commissions Low none quoted in the handout 103 · Office OF THE Governor · President's RULE · Article 356 · Bommai · Financial Emergency Low none quoted in the handout 104 · Fiscal Federalism · Divisible POOL · CESS · Finance Commission · 15th AND 16th FC Low none quoted in the handout 105 · GST Council · NITI Aayog · Special Category Status · Fiscal Issues · Commissions Low none quoted in the handout 106 · Inter-state Relations · Water Disputes · Boundaries · Language · Articles 371-371J Low none quoted in the handout 107 · Challenges TO Federalism · Emerging Issues · Reforms · Commissions · Assessment Low none quoted in the handout"}, {"c": "1", "n": "Constitutionalism, Rule of Law, Separation of Powers and Checks and Balances", "id": "1-constitutionalism-rule-of-law", "t": "1 · Constitutionalism · RULE OF LAW", "x": "1 · Constitutionalism · RULE OF LAW # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Polity handout pp. 3-4. Prelims PYQs quoted: none quoted in the material. In simple words Constitutionalism means a government whose powers are limited by a supreme law. Rule of Law (Dicey) is one tool for that. Know the meaning, the six features, negative vs positive constitutionalism, why codification alone is not enough, Dicey's three principles and the exceptions to equality. Constitutionalism: Meaning AND Features Meaning and concept Powers of the government are not absolute They are limited by a body of laws or a supreme law called the Constitution Government must subscribe to this body of laws as its legitimacy depends on it Hence constitutionalism abhors absolutism tools to limit government: Dicey's Rule of Law and Separation of Powers Features of constitutionalism Rule of Law Separation of Powers basic civil liberties and protection of people's rights Democracy: temporariness of government through periodic free and fair elections Independent Judiciary Free Media Memory aid · DR FISC Six features: D emocracy (periodic elections) · R ule of law · F ree media · I ndependent judiciary · S eparation of powers · C ivil liberties. (own mnemonic) Negative constitutionalism (prevent tyranny) idea that the State can be a danger or source of oppression gained ground in the late medieval and early modern age developed largely among Western thinkers to prevent tyranny by limiting the powers of the government after oppression by the ruling class Positive constitutionalism Zeal for limiting power may hinder the State from performing basic functions (e.g. public order), leading to anarchy So the State must be empowered government must have certain powers to perform its functions properly balances power to prevent tyranny (excess power and abuse) and anarchy (inadequate power) Memory aid · TA Positive constitutionalism balances T yranny (too much power) against A narchy (too little). (own mnemonic) Constitutionalism beyond the written Constitution these principles are assimilated into the Indian Constitution to varying degrees mere codification is not a sufficient condition : principles must be implemented and observable to citizens in daily life United Kingdom: no single codified Constitution, yet constitutionalism exists so the presence or absence of codification does not guarantee the presence or absence of constitutionalism RULE OF LAW Meaning and concept many have contributed, but A. V. Dicey 's contribution is the most seminal basically the supremacy of law over arbitrary power : government power exercised according to law, and the law itself consistent with constitutional principles Dicey's principles Supremacy of law: rule by principles of law, not whims and fancies of the ruler , and the ruler is also subject to law. SC: however high a person may be, the law is above them . Upanishads express similar ideas (Dharma of the king, Lex is Rex ). Corollary: arbitrary exercise of power is prohibited Equality before law: all sections of society equally subject to the law of the land. Affirmative action and positive discrimination depart from strict formal equality but promote substantive equality Equality of law administered through ordinary courts: today many forums have adjudicatory functions, e.g. quasi-judicial CAT, ITAT and other tribunals Memory aid · SEE Dicey: S upremacy of law · E quality before law · E qual administration through ordinary courts. (own mnemonic) Exceptions TO Legal Equality President and Governors: Article 361 while in office, no criminal proceedings can be instituted or continued against them no civil proceedings for acts in personal capacity during tenure unless two months' prior notice is given no arrest or imprisonment process from any court during the term of office a departure from strict formal equality A. G. Noorani's criticism termed the criminal exemption a mindless borrowing from the West , based on British practice where courts cannot prosecute the ruler In Britain courts are historically tied to the authority of the Crown and the sovereign enjoys constitutional immunity In India both the President and the courts are creations of the Constitution , so similar provisions are questionable can be abused: politicians facing criminal prosecution can be appointed Governors if introduced today through a constitutional amendment, it would not get the approval of the public or the courts Other exceptions diplomatic immunity parliamentary privileges: Article 105(2): an MP is not liable to any court proceedings for anything said or any vote given in Parliament or any committee Protection for speech inside the House, an exception even to defamation law Memory aid · DPP Exceptions to equality: D iplomats · P arliamentarians (Art 105(2)) · P resident and Governors (Art 361). (own mnemonic)"}, {"c": "1", "n": "Constitutionalism, Rule of Law, Separation of Powers and Checks and Balances", "id": "2-separation-of-powers-checks-and-balances", "t": "2 · Separation OF Powers · Checks AND Balances", "x": "2 · Separation OF Powers · Checks AND Balances # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Polity handout pp. 5-8. Prelims PYQs quoted: none quoted in the material. In simple words Power should not sit in one institution, so it is split into law-making, law execution and law adjudication. Perfect separation is impossible; India follows a middle path with checks and balances. Know the overlaps, why strictness fails, each check, and the India / USA / UK comparison. Meaning, Functions, Benefits Separation of Powers power of government should not be concentrated in one institution but divided among them Traditionally legislative, executive and judicial/adjudicatory In medieval times kings held all, leading to absolutism Montesquieu 's name is indelibly associated with the concept functions: Law-making (legislative) Law execution (executive) Law adjudication (judicial) Governance runs on consensus between the three organs , hence Checks and Balances Benefits preserves democracy and rights of the people healthy division of labour, specialisation and efficiency healthy debate and constructive friction , so deliberation leads to better outcomes Functional Overlap Among Organs Value addition Even in the USA , the traditional home of rigid separation, there is dilution. Perfect separation is not possible in a modern State and is not followed anywhere in the world. Westminster system in a parliamentary system separation between legislature and executive is never complete executive = permanent bureaucracy plus the Council of Ministers headed by the PM (political executive), who are generally MPs, so a minister is part of both legislature and executive Article 75(5): a non-MP can become a minister but must become a member of either House within six consecutive months in the USA a person cannot be in the Presidential Cabinet and Congress at once: the biggest qualification to be a minister in India is a disqualification in the USA Delegated legislation Law passed in a broad skeletal form Detailed rules, regulations and bye-laws are framed by the executive law-making is delegated to the executive, a subordinate legislature Administrative adjudication adjudication is traditionally a judicial function, but here the executive carries it out : e.g. district administration (revenue courts) , tribunals like CAT and ITAT technical matters of adjudication are better handled this way Judge-made laws where law is silent or ambiguous the court clarifies it by interpretation: a law-making function where there is a legal vacuum the court gives guidelines that function as law, e.g. Vishakha Guidelines Ordinances urgent need for a law and Parliament not in session : the President can promulgate Ordinances under Article 123 function as laws passed by Parliament, subject to constitutional requirements Regulatory bodies emerged worldwide due to the complex modern economy law-making, implementation and adjudication all vested in them: Make rules, regulate the sector, penalise defaulters E.g. SEBI, IRDAI MPLADS and Article 372 MPLADS: An MP's main job is legislating, but here MPs identify local needs and recommend works , a developmental (executive) function Overlap of legislative representation and executive functions , though sanction and implementation stay with administrative authorities Article 372: Pre-Constitution laws could be aligned with the Constitution This power was with the President for the first three years , so the executive performed legislative functions Memory aid · MAJOR WAD Eight overlaps: M PLADS · A rt 372 · J udge-made law · O rdinances · R egulators · W estminster (minister is MP) · A dministrative adjudication · D elegated legislation. (own mnemonic) Limits OF Strict Separation Why rigid separation is not maintainable specialisation: traditional organs cannot handle all complex functions of modern administration speed and efficiency: if all tribunal cases went to the judiciary it would be overwhelmed and could not perform its primary functions public interest: Power is not a property but a means to an end If the end (serving people, their welfare) is better served by vesting power in an institution not meant to exercise it, so be it Memory aid · SSP Limits of strict separation: S pecialisation · S peed · P ublic interest. (own mnemonic) System OF Checks AND Balances Note India does not follow strict, rigid separation as in the USA but a system of checks and balances (term borrowed from the USA): functions are divided among branches and each acts as a check on the others to prevent abuse of power. Executive checks the judiciary: appointment of judges on paper the executive has a role (President appoints), but in India the process has come to be substantially controlled by the judiciary through the Collegium System USA: President nominates, subject to Senate confirmation executive participation helps ensure competent judges of integrity Legislature checks the judiciary: removal of judges Article 124(4): SC judge removed by the President after an address by each House , supported by a majority of the total membership and not less than two-thirds of members present and voting A corresponding process for High Court judges so difficult that not one HC or SC judge has been removed through it to date Judiciary checks the executive and legislature strikes down unconstitutional laws and illegal or unconstitutional executive action power to determine legality and constitutionality = Judicial Review Legislature checks the executive laws need enactment by the legislature questions the executive via Question Hour, resolutions and debates extreme case: No-Confidence Motion against the Council of Ministers in the Lok Sabha Executive checks the judiciary: clemency power to grant clemency for punishments after judicial proceedings: President (Art 72) and Governors (Art 161) A distinct constitutional power, not an ordinary appeal Meant for human errors and unduly harsh punishments Memory aid · CRJ-NQ Checks in action: C ollegium / appointment · R emoval Art 124(4) · J udicial review · N o-confidence · Q uestion Hour · clemency (Art 72, 161). (own mnemonic) Separation OF Powers: India, USA, UK Country Position (handout) India if the offices of both President and Vice-President are vacant, the CJI discharges the President's functions under the President (Discharge of Functions) Act, 1969 ; if the CJI is unavailable, the seniormost available SC judge . An overlap where the head of one branch temporarily performs another's functions USA no such arrangement: more rigid separation than India UK looser separation than the USA; highest appellate judicial function used to sit in Parliament ( House of Lords ), changed by the UK Supreme Court in 2009 Way forward / key point India follows a middle path between the rigid USA and the looser UK. NEED FOR Greater Checks ON THE Executive Why historically more power gets vested in the executive if judicial independence is compromised and the opposition is fragmented , executive rule goes unchecked so a proactive legislature, discussion and an independent judiciary are needed, but in contemporary times both are less effective Less discussion on Bills in Parliament Separation exists on paper but may be weakened in a substantive sense Institutional checks on executive power CAG, ECI, UPSC and CVC enjoy varying degrees of institutional independence CAG, ECI and UPSC are constitutional bodies CVC is a statutory body so there is no unbridled exercise of power by the political executive Memory aid · CECU Institutional checks: C AG · E CI · C VC (statutory) · U PSC. (The first, second and fourth are constitutional.) (own mnemonic)"}, {"c": "1", "n": "Constitutionalism, Rule of Law, Separation of Powers and Checks and Balances", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Constitutionalism in one line powers of government limited by a supreme law Six features DR FISC Negative constitutionalism prevent tyranny by limiting power Positive constitutionalism balance tyranny and anarchy; State must have powers Is codification enough? No; UK has none yet has constitutionalism Dicey's three principles supremacy of law, equality before law, ordinary courts President/Governor immunity Article 361; civil notice of two months MP speech immunity Article 105(2) Who called Art 361 mindless borrowing A. G. Noorani Who is linked to Separation of Powers Montesquieu Three state functions law-making, execution, adjudication Art 75(5) time limit six consecutive months Ordinance power Article 123, when Parliament not in session Judge removal provision Art 124(4); special majority; none removed so far Clemency articles Art 72 President; Art 161 Governor Who acts if President and VP posts vacant CJI, under the 1969 Act Which is more rigid: India or USA USA Constitutional vs statutory checks CAG, ECI, UPSC constitutional; CVC statutory"}, {"c": "1", "n": "Constitutionalism, Rule of Law, Separation of Powers and Checks and Balances", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts in Start Here)"}, {"c": "1", "n": "Constitutionalism, Rule of Law, Separation of Powers and Checks and Balances", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards"}, {"c": "2", "n": "Critique of the Constitution, Constitutionalism in Practice and Interpretation", "id": "1-critical-appraisal-of-the-constitution-a", "t": "1 · Critical Appraisal OF THE Constitution · Ambedkar's Warnings", "x": "1 · Critical Appraisal OF THE Constitution · Ambedkar's Warnings # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Polity handout pp. 8-10. Prelims PYQs quoted: none quoted in the material. In simple words The handout lists five criticisms of the Constitution (borrowed, verbose, bulky, un-Gandhian, inconsistent) and the reply to each. Ambedkar's warnings at the close of the Constituent Assembly are the value-addition. Criticisms AND Replies Charge 1: un-Indian and borrowed alleged slavish imitation of the West and a carbon copy of the GoI Act, 1935 British frameworks came through laws of 1861, 1892, 1909, 1919 and 1935 Large parts borrowed from the 1935 Act Reply all provisions were debated in the Constituent Assembly before adoption: structure was adopted, the soul was debated Framed on secular democracy After many constitutions existed, it would be foolish not to look at others Ideas are not the copyright of any country intelligent adaptation, not blind copying : US Bill of Rights vs Part III Granville Austin: calling it un-Indian was absurd as what constitutes Indianness is not defined Charge 2: complicated, verbose language The Assembly was full of legal experts It is a legal document , so legal jargon is expected Ivor Jennings: a \"lawyer's paradise\" Charge 3: too voluminous, and the defence the effort tried to bring under one fold the accumulated experience of many constitutions deals with details of administration : accounts, audit, public services, elections, languages single Constitution for the whole country (the US is smaller as states have their own) diversity : Special provisions for states, minorities, backward classes Centre-State relations in detail Detail leaves minimal ambiguity and helps avoid litigation The GoI Act, 1935 was itself bulky Memory aid · DISCO Why bulky: D iversity · I nstitutional details of administration · S ingle Constitution for all · C entre-State detail · O ne-fold borrowing (1935 Act) and no ambiguity. (own mnemonic) Charge 4: Ungandhian Constitution Allegation that Gandhi's ideology is not adequately reflected Congress strategy in the struggle was Gandhian, but post-Independence economy and polity took a different approach ( Gandhi's cottage industries vs Nehru's industrialisation ) oceanic circles of power: power should radiate from the village to the Centre, not the reverse not enforceable: village panchayats went into Directive Principles, Article 40 (non-justiciable) Ambedkar saw villages as dens of darkness (casteism, patriarchy, feudalism) Local democracy would represent local elites later local self-government got constitutional status via the 73rd and 74th Amendments Charge 5: lack of theoretical consistency India has many contradictions , so the Constitution reflects them provisions of modernity (liberty, equality, fraternity) and tradition (debates on UCC, divorce, adoption ) India is a blend of modernity and tradition The incoherence in society gets reflected in the Constitution Memory aid · BVBUC Five charges: B orrowed · V erbose · B ulky · U ngandhian · C ontradictory (inconsistent). (own mnemonic) Ambedkar's Warnings AT THE Inauguration Three warnings plus one need constitutional methods: Mass protests mattered when exploited under British rule but not after Independence Use constitutional methods to redress grievances and prevent the grammar of anarchy no hero worship in politics: do not raise leaders to divine status political vs socio-economic equality: \"entering an era of contradictions\" : one person, one vote, one value in politics, but inequality continues in socio-economic life So political democracy should be used to alleviate socio-economic inequalities need to cultivate constitutional values: constitutionalism and constitutional morality must be nurtured in generations to come Memory aid · CHE Ambedkar's warnings: C onstitutional methods · H ero worship no · E quality contradiction (+ cultivate morality). (own mnemonic)"}, {"c": "2", "n": "Critique of the Constitution, Constitutionalism in Practice and Interpretation", "id": "2-constitutionalism-in-practice-interpreta", "t": "2 · Constitutionalism IN Practice · Interpretation · Conventions", "x": "2 · Constitutionalism IN Practice · Interpretation · Conventions # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Polity handout pp. 10-12. Prelims PYQs quoted: none quoted in the material. In simple words Writing principles down is not enough; political, administrative and social culture decide whether constitutionalism lives. Courts also interpret the Constitution through definitions and several methods, and conventions give it flesh and blood. Constitutionalism IN Practice Three cultures decide it political culture: Parties nurture democracy, but often show undemocratic culture : family fiefdoms, high-command culture, less scope for dissent, nomination of criminals, vindictive politics after coming to power The very institutions meant to preserve constitutionalism undermine it administrative culture: Civil servants must see themselves as servants of the people . Under the British, civil services existed to preserve the Empire (colonial mindset, White Man's Burden ) The elitist/colonial mindset still persists to a lesser degree , with corruption, nepotism and non-transparency social value system: High tolerance of unethical practices E.g. little public outrage at extrajudicial police encounter killings Memory aid · PAS Three cultures: P olitical · A dministrative · S ocial value system. (own mnemonic) Constitutional Interpretation Need and aids The Constitution must be applied correctly It is interconnected and must be read in light of its overall philosophy and objectives Article 366 defines many terms (e.g. SCs, STs) Article 12 defines the State General Clauses Act, 1897 (list of legal terms) is applied through Article 367 Methods the Supreme Court has given ordinary meaning of English words: commonly used meanings unless the context demands otherwise preamble: Provisions amplify the philosophy summarised in the Preamble Of multiple interpretations the one that best fits the Preamble's philosophy is correct progressive interpretation: Norms change, so read provisions with changing social norms and emerging conditions E.g. Article 21 from restrictive to expansive meaning of life, giving shelter to many rights purposive interpretation: Uses the purpose or intent (Constituent Assembly Debates) Read in light of the entire Constitution, an ecosystem in itself , and all parts read together harmonious construction: where one provision conflicts with another, reconcile them and give maximum possible effect liberal interpretation: Provisions on liberty and security of citizens interpreted in their favour E.g. privacy, freedom of the press, RTI through Articles 19 and 21 Memory aid · OPPHL Methods: O rdinary meaning · P reamble · P rogressive · P urposive · H armonious · L iberal. (own mnemonic) ROLE OF Conventions Conventions Tools used by the judiciary to interpret the Constitution Some conventions of the English parliamentary system are used by courts the US Constitution originally had seven Articles , supplemented by conventions and practices uncodified but carry legitimacy backed by public opinion and political practice , not necessarily legally enforceable Let the Constitution adapt without amendment Courts use them to interpret it They provide flesh and blood to the dry bones of law"}, {"c": "2", "n": "Critique of the Constitution, Constitutionalism in Practice and Interpretation", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Who called it a lawyer's paradise Ivor Jennings Who said un-Indian charge was absurd Granville Austin Gandhian ideas in the Constitution village panchayats in DPSP Art 40; later 73rd, 74th Amendments Gandhi's oceanic circles power from village to Centre Ambedkar on villages dens of darkness Ambedkar: grammar of anarchy give up mass protest, use constitutional methods Ambedkar on hero worship no hero worship in politics Era of contradictions one vote one value vs socio-economic inequality Three cultures political, administrative, social value system Article 366 defines terms like SC and ST Article 12 defines the State General Clauses Act year and link 1897; via Article 367 Six methods of interpretation OPPHL Harmonious construction reconcile conflicting provisions, maximum effect Liberal interpretation e.g. privacy, press freedom, RTI via Arts 19, 21 Conventions give flesh and blood to the dry bones of law"}, {"c": "2", "n": "Critique of the Constitution, Constitutionalism in Practice and Interpretation", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts in Start Here)"}, {"c": "2", "n": "Critique of the Constitution, Constitutionalism in Practice and Interpretation", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards"}, {"c": "3", "n": "Constitutional Morality and the Living Constitution", "id": "1-constitutional-morality", "t": "1 · Constitutional Morality", "x": "1 · Constitutional Morality # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Polity handout pp. 12-13 · current affairs: verify dates. Prelims PYQs quoted: none quoted in the material. In simple words Constitutional morality is deep commitment to constitutional values even when popular sentiment opposes them. Know Ambedkar's idea, how it differs from public morality, the Navtej and Sabarimala judgments, and the debate on whether courts should use it. Meaning AND Ambedkar's IDEA Value addition Constitutional morality is a deep commitment to the values of the Constitution : liberty, equality, fraternity, justice and dignity, even when popular sentiment runs against them . Dr. B. R. Ambedkar's conception meant accepting plural opinions, rejecting coercion, keeping the executive answerable to elected representatives , and ensuring no single person or institution claims absolute authority Not a natural sentiment in India It had to be cultivated a Constitution can be silently subverted not by changing its text but by distorting how it is administered courts have built on this: protecting minority rights, limiting majoritarianism, keeping all branches in check Public morality Constitutional morality rooted in majority beliefs, traditions, customs rooted in constitutional principles (liberty, equality, fraternity, justice) can be majoritarian, regressive, discriminatory inclusive, rights-based, progressive subordinate when in conflict prevails when in conflict Significance protects individual and minority rights from majority pressure check on the highest functionaries : ministers, judges, citizens keeps the spirit of the Constitution alive beyond its text gives courts a tool to interpret rights expansively Memory aid · PCKI Significance: P rotects minorities · C hecks the high · K eeps the spirit alive · I nterprets rights expansively. (own mnemonic) Judicial Application Landmark judgments Navtej Singh Johar v. Union of India (2018): SC decriminalised consensual same-sex relations between adults (Section 377 IPC) Indian Young Lawyers Association v. State of Kerala (2018): the Sabarimala judgment on women's entry into the temple in both, constitutional morality must prevail over public or social morality when they conflict with constitutional rights and values THE Debate Criticism April 2026: SG Tushar Mehta in the Sabarimala review argued it should be discarded as a ground of judicial review: \"vague and subjective\" , absent from the text, letting courts strike down actions without clear basis 2018, K. K. Venugopal (then AG): \"very dangerous\" , could make the SC a third chamber of Parliament Counter view: Upendra Baxi not a judicial invention: embedded in the Preamble, Part III and Part IVA three ideas: Equality, liberty, fraternity Respect for diversity Constitution in letter and spirit Protects the vulnerable when majority opinion is hostile Vagueness is inherent in all principles and courts use it through reasoned judgments Note Recent (verify): a nine-judge Constitution Bench reserved judgment on the Sabarimala reference on 14 May 2026 . Handout view: it is a shared responsibility of legislature, executive and judiciary ; discarding it would leave the constitutional spirit vulnerable to the majoritarianism it was designed to check."}, {"c": "3", "n": "Constitutional Morality and the Living Constitution", "id": "2-the-constitution-as-a-living-document-ar", "t": "2 · THE Constitution AS A Living Document · Article 21", "x": "2 · THE Constitution AS A Living Document · Article 21 # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Polity handout pp. 13-15 · 2025 case: verify. Prelims PYQs quoted: none quoted in the material. In simple words A living constitution evolves without losing its core identity. Know the seven features that make ours living, five reasons it must be, and the five-stage journey of Article 21 from Gopalan to digital access. Concept AND Features Value addition The Indian Constitution is not a frozen text ; it is a living instrument with capabilities of enormous dynamism . A living constitution evolves with time without losing its core identity : an ongoing project responding to social, economic and political realities. What makes it living Article 368: Amendment power Over a hundred amendments since 1950 amendment procedures: Simple majority, special majority, special majority with State ratification : flexible yet stable Simple-majority changes are made outside Article 368 Basic Structure Doctrine: Kesavananda Bharati v. State of Kerala (1973) keeps amendments within limits Judicial Review: supported by Articles 13, 32, 136 and 226 (32 and 226 writ jurisdiction; 136 special leave to appeal) open-textured language: esp. Articles 14, 19, 21 Directive Principles: guideposts to gradually realise socio-economic goals constitutional conventions develop over time Memory aid · ABJODDC Seven features: A rt 368 · B asic structure · J udicial review · O pen texture · D PSP · D ifferent amendment procedures · C onventions. (own mnemonic) Why it is necessary for India social: gender equality, LGBTQ rights , dismantling caste hierarchies economic: 1991 liberalisation, privatisation, globalisation forced reinterpretation of socialist provisions technological: internet, mobile, data, AI, digital identity raise questions on privacy, speech, surveillance federal evolution: coalition politics, cooperative and competitive federalism global engagement: treaties, climate agreements, human rights covenants Memory aid · SETFG Five drivers: S ocial · E conomic · T echnological · F ederal · G lobal. (own mnemonic) Note Limit: living does not mean it can mean anything anyone wants. It is bound by the values of the Preamble, the limits of the Basic Structure and the discipline of constitutional methods . Article 21: THE Living Constitution IN Action 1950 A. K. Gopalan: narrow reading; restrictive personal liberty ; rights as separate compartments; \" procedure established by law \" without fairness test 1978 Maneka Gandhi: progressive view; procedure must be fair, just and reasonable ; opened a whole new world of rights PILs unstated rights read into Art 21 (see list below) 2017 Puttaswamy: nine-judge bench, unanimous: privacy intrinsic to life and liberty (physical, informational, decisional); overruled ADM Jabalpur (1976) Now dignity in death, partner choice, transgender rights, personality rights, digital access Rights read into Article 21 (Stage 3) livelihood: Olga Tellis (1985) free legal aid: Hussainara Khatoon (1979) clean environment: M. C. Mehta cases education: led to Article 21A by the 86th Amendment, 2002 health: Paschim Banga Khet Mazdoor Samity shelter: Chameli Singh speedy trial and protection against custodial violence Memory aid · L-FEEHSS Stage-3 rights: L ivelihood (Olga Tellis) · F ree legal aid (Hussainara) · E nvironment (M. C. Mehta) · E ducation (21A) · H ealth (Paschim Banga) · S helter (Chameli Singh) · S peedy trial. (own mnemonic) Stage 5: continuing expansion Right to die with dignity (passive euthanasia) Right to choose a partner Rights of transgender persons Personality rights (e.g. Jackie Shroff case) right to digital access: Pragya Prasun v. Union of India (2025): an intrinsic component of the right to life and liberty under Article 21 (verify) Ambedkar's Insight Way forward / key point The Constitution is not a mere lawyer's document but a vehicle of life, and its spirit is the spirit of the age . \"However good a Constitution may be, if those who are implementing it are bad, it will prove to be bad. However bad a Constitution may be, if those implementing it are good, it will prove to be good.\" It lives only when institutions and citizens give it life in every generation ."}, {"c": "3", "n": "Constitutional Morality and the Living Constitution", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Constitutional morality means deep commitment to constitutional values even against popular sentiment Ambedkar: not natural, must be cultivated Silent subversion happens by distorting how the Constitution is administered Navtej Johar 2018 decriminalised consensual same-sex relations (Sec 377) Sabarimala case 2018 Indian Young Lawyers Association v. State of Kerala Who called it vague and subjective Tushar Mehta (SG, April 2026) Who said very dangerous K. K. Venugopal (2018) Baxi: embedded in Preamble, Part III, Part IVA Living constitution evolves without losing core identity Limits on \"living\" Preamble values, Basic Structure, constitutional methods Basic structure case Kesavananda Bharati (1973) Judicial review articles 13, 32, 136, 226 Gopalan 1950 vs Maneka 1978 narrow vs fair, just, reasonable procedure Puttaswamy 2017 nine judges; privacy; overruled ADM Jabalpur Livelihood / legal aid cases Olga Tellis / Hussainara Khatoon Art 21A inserted by 86th Amendment, 2002 Digital access case Pragya Prasun v. Union of India (2025)"}, {"c": "3", "n": "Constitutional Morality and the Living Constitution", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts in Start Here)"}, {"c": "3", "n": "Constitutional Morality and the Living Constitution", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards"}, {"c": "4", "n": "Union and Its Territory: Small States, Second SRC, Delhi and Ladakh", "id": "1-union-and-its-territory-linguistic-state", "t": "1 · Union AND ITS Territory · Linguistic States · Small States · Second SRC", "x": "1 · Union AND ITS Territory · Linguistic States · Small States · Second SRC # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Polity handout pp. 15-17. Prelims PYQs quoted: none quoted in the material. In simple words After 1947 language became the main basis for redrawing states. Know the arguments for and against, the three committees, Andhra and the 1956 Act, then the small-states debate, the Uttar Pradesh case and the case for a Second SRC. Linguistic Reorganisation OF States Value addition After Independence language became the main basis for reorganising states, replacing the colonial emphasis on administrative convenience . 1920s: Congress accepted it in principle ( Gandhi reorganised Pradesh Congress Committees on linguistic lines). After 1947: Nehru opposed immediate reorganisation, fearing threats to national unity after Partition. Against administrative difficulties from numerous linguistic demands national integration: strong linguistic identities weaken common identity secessionism: linguistic nationalism may encourage separatism regionalism: demands for jobs, subsidies, benefits raise regional hostility In favour administrative efficiency: governance in the people's language education and culture: mother-tongue education democratic participation: easier engagement secular basis: alternative to religion and caste in drawing boundaries Memory aid · AINR vs AEDS Against: A dministration · I ntegration · N o secession · R egionalism. For: A dministration · E ducation · D emocratic participation · S ecular basis. (own mnemonic) Committee / Commission Major recommendations S. K. Dhar Commission (1948) rejected linguistic reorganisation; favoured administrative convenience JVP Committee (1948) Nehru, Patel, Pattabhi Sitaramayya opposed immediate linguistic reorganisation Fazl Ali Commission (1953) chair Fazl Ali , with K. M. Panikkar and H. N. Kunzru ; accepted language as an important basis subject to national unity, economic viability, administrative efficiency ; rejected one state, one language Memory aid · DJF Order: D har (no) → J VP (not now) → F azl Ali (yes, with limits). (own mnemonic) Major developments Andhra State (1953): After the death of Potti Sreeramulu in a hunger strike for a Telugu state The first linguistically reorganised state States Reorganisation Act, 1956: 14 states and 6 Union Territories Issue OF Small States Note Demand for smaller states persists due to administrative convenience, regional identities and development deficits . Demands: Koshal (Odisha), Kodagu (Karnataka), Vidarbha and Konkan (Maharashtra), Bodoland (Assam), Maru Pradesh (Rajasthan), Mithilanchal (Bihar), Gorkhaland (West Bengal) . In favour administrative convenience: Large states have varied terrains and priorities Smaller ones are more homogeneous, so planning is easier economic growth: higher growth in some cases (Punjab, Haryana; Uttarakhand, Jharkhand, Chhattisgarh) democratic participation: capital nearer the people, though not always realised Issues definitional problem: what is small or large (population, area, both)? inter-state disputes: borders and water fragmentation: undoing Sardar Patel's work no guarantee of human development: needs resources, planning, bureaucracy, leadership financial constraints: lower resources, costs of capitals, central dependence alternative: decentralisation via districts, panchayats, urban local bodies Memory aid · AEG vs DIFNFA For: A dministration · E conomy · G rassroots democracy. Against: D efinition · I nter-state disputes · F ragmentation · N o human-development guarantee · F inance · A lternative (decentralise). (own mnemonic) Way forward / key point Democratic decentralisation should be the first line of action , followed by adequate funds and empowerment with functions and functionaries . Case of Uttar Pradesh Ambedkar was wary of one huge state He proposed dividing UP into three states for administrative convenience, disproportionate influence in national politics and better minority representation recent proposals: Harit Pradesh, Awadh, Purvanchal, Bundelkhand Economic viability questions remain counter: If smaller is the solution, create more districts Empower local bodies first If population is an asset for India, so for UP: greater representation is its democratic right , not disproportion CASE FOR A Second SRC Why continuing statehood demands: reorganisation is an evolving exercise, not one-stop changing regional realities: three decades of LPG reforms caused demographic, economic, social, regional imbalances and neglect allegations growing population in certain states objective decision-making: assess on administrative convenience, economic viability, development deficits, cultural identity, national unity , not politics Way forward Second SRC with rational, scientific, objective criteria economic viability assessment democratic decentralisation (funds, functions, functionaries) address development deficits: packages, autonomous councils, development boards statehood as a last resort , not a panacea Memory aid · SEDAL Way forward: S econd SRC · E conomic viability · D ecentralise · A ddress deficits · L ast resort statehood. (own mnemonic)"}, {"c": "4", "n": "Union and Its Territory: Small States, Second SRC, Delhi and Ladakh", "id": "2-demand-for-delhi-statehood", "t": "2 · Demand FOR Delhi Statehood", "x": "2 · Demand FOR Delhi Statehood # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Polity handout pp. 17-18 · 2023 Act: verify. Prelims PYQs quoted: none quoted in the material. In simple words Delhi has an elected government but no control over police, public order and land. Know the constitutional position, the pro and anti arguments, the 2018 and 2023 Supreme Court rulings, the 2023 Act and the way forward. Constitutional Position Where Delhi stands national capital, but the elected government lacks full control of police, public order and land 69th Amendment Act, 1991 inserted Article 239AA : Legislative Assembly and Council of Ministers designated National Capital Territory (NCT) , administered by a Lieutenant Governor appointed by the President police, public order, land are outside the Assembly's competence Parliament retains power to legislate on State and Concurrent List subjects for Delhi Arguments In favour of statehood delay in decision-making: Centre handles police, order, land Elected government and LG share some responsibility, so fragmented responsibility means fragmented accountability population: many full states are smaller than Delhi democratic accountability: The elected government needs adequate powers Greater autonomy reduces LG-government conflict Against statehood national capital: Sentimental value for all Indians, cannot be the property of one section Houses Parliament, the Supreme Court, foreign missions financial viability: An urban agglomeration , industry shifting out due to pollution norms Infrastructure needs large resources resource dependency: relies on neighbouring states for water, power, resources population argument limits: Many cities exceed small states Should they all be states? Memory aid · DPD vs NFRP For: D elay · P opulation · D emocratic accountability. Against: N ational capital · F inance · R esource dependence · P opulation argument stretched. (own mnemonic) Judicial AND Legislative Developments 2018 SC judgment: stressed constitutional morality, representative government and collaborative federalism in Delhi's administration 2023 SC judgment: the elected Delhi Government has legislative and executive powers over services except police, public order, land 2023 GNCTD (Amendment) Act, 2023: statutory framework under which the Union retains significant control over appointments, transfers and postings of officers Way forward rather than full statehood, focus on institutional clarity : LG in a constitutional/nominal advisory role on non-reserved matters greater administrative autonomy to the elected government over civic governance and public service delivery, while keeping Union control over core strategic functions"}, {"c": "4", "n": "Union and Its Territory: Small States, Second SRC, Delhi and Ladakh", "id": "3-ladakh-statehood-sixth-schedule", "t": "3 · Ladakh · Statehood · Sixth Schedule", "x": "3 · Ladakh · Statehood · Sixth Schedule # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Polity handout pp. 18-19 · 2025-26 developments: verify. Prelims PYQs quoted: none quoted in the material. In simple words Ladakh became a Union Territory without a legislature in 2019. Know its set-up, the grievances, the four-point demand of LAB and KDA, why Sixth Schedule is sought, the Centre's position and a balanced way forward. Constitutional Position AND Grievances Position J&K Reorganisation Act, 2019 made Ladakh a separate UT without a legislature on 31 October 2019 administration: Lieutenant Governor under Article 239 , with AGMUT cadre officers local governance: two Hill Councils, LAHDC Leh and LAHDC Kargil , with limited autonomous powers judiciary: shares the High Court of J&K and Ladakh representation: one Lok Sabha seat , no Legislative Assembly or Chief Minister Major grievances democratic deficit: no elected Assembly tribal identity: fear over land, employment, resources ecological vulnerability: unregulated tourism, mining, infrastructure threaten glaciers, water, biodiversity of a fragile high-altitude desert Four-point Demand Leh Apex Body (LAB) and Kargil Democratic Alliance (KDA) demand: 1) full statehood with a Legislative Assembly 2) Sixth Schedule status 3) a separate Public Service Commission 4) two Lok Sabha seats (Leh and Kargil). Memory aid · SSPL Four demands: S tatehood · S ixth Schedule · P SC of its own · L ok Sabha seats (2). (own mnemonic) Sixth Schedule demand Article 244(2): provides Autonomous District and Regional Councils with powers over land, forests, customs, local administration in specified Northeastern tribal areas NCST recommendation (2019): Sixth Schedule protection for Ladakh given its predominantly tribal population significance: tribal self-government, cultural protection, local control over resources and ecological conservation requirement: a constitutional amendment , as coverage is limited to specified Northeastern states Centre's Position AND WAY Forward Centre's position and developments strategic concerns: sensitive borders with China and Pakistan alternative safeguards: Article 371-style protections for land, culture, employment discussed MHA High-Powered Committee to negotiate with Ladakhi representatives public mobilisation: Sonam Wangchuk and Ladakhi groups: protests, marches, hunger strikes 2025: Domicile, reservation, official language and recruitment safeguards, plus Hill Council provisions 2026: talks continue with differences over the extent of self-government (verify) Way forward democratic representation: examine an elected Assembly with national-security safeguards constitutional protection: Sixth Schedule or Article 371-style strengthen Hill Councils with Funds, Functions and Functionaries (3Fs) local employment: Recruitment safeguards Separate PSC demand sustainable development: local say on glaciers, water, fragile ecosystems continued dialogue with LAB and KDA Memory aid · DCSLSC Way forward: D emocratic representation · C onstitutional protection · S trengthen Hill Councils (3Fs) · L ocal jobs · S ustainable development · C ontinued dialogue. (own mnemonic) Way forward / key point A lasting solution must balance democratic autonomy, tribal identity, ecological protection and national security ."}, {"c": "4", "n": "Union and Its Territory: Small States, Second SRC, Delhi and Ladakh", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Dhar  card to flip. Back Next Missed it Shuffle Only missed All cards"}, {"c": "5", "n": "Fundamental Rights: Nature, Article 12 and Reservation", "id": "1-nature-of-fundamental-rights-article-12", "t": "1 · Nature OF Fundamental Rights · Article 12 · BCCI", "x": "1 · Nature OF Fundamental Rights · Article 12 · BCCI # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Fundamental Rights handout pp. 4-7. Prelims PYQs quoted: none quoted in the material. In simple words Fundamental Rights sit in Part III. Most work against the State, so Article 12 defines who the State is. Courts use tests (statute, control, agency, public function) to decide if a body is State. BCCI is the standing example: not State, but still reachable by writ for public duty. WHAT Fundamental Rights ARE Meaning rights found in Part III of the Constitution rights outside Part III are not Fundamental Rights: The Right to Vote The statutory Right to Information (RTI Act, 2005) but the right to know and receive information is recognised as part of Article 19(1)(a) Category Articles Right to Equality Arts 14-18 Right to Freedom Arts 19-22 Right against Exploitation Arts 23-24 Right to Freedom of Religion Arts 25-28 Cultural and Educational Rights Arts 29-30 Constitutional Remedies Art 32 (Supreme Court); Art 226 gives remedies through High Courts Memory aid · EFERCC Categories in order: E quality (14-18) · F reedom (19-22) · E xploitation (23-24) · R eligion (25-28) · C ultural-educational (29-30) · C onstitutional remedies (32). (own mnemonic) Nature OF Fundamental Rights Negative rights most rights stop the State from acting, e.g. denying equality Vertical application most rights protect individuals against the State Positive rights some require the State to act , e.g. education under Art 21A Horizontal application Some also bind private persons , e.g. Art 17 (untouchability) Other violations by private persons are met through civil and criminal law Other features Justiciable: enforced by courts through Art 32 (SC) and Art 226 (HCs) Citizens vs all persons: Some only for citizens ( Art 19 ) Others for all persons including foreigners ( Arts 14 and 21 ) Not absolute: subject to reasonable restrictions on constitutional grounds Emergency and special cases Art 358: Art 19 protections are affected during a National Emergency on grounds of war or external aggression Art 359: President may suspend the right to move courts for specified rights Arts 20 and 21 enforcement cannot be suspended Art 33: Parliament may restrict or remove some rights of Armed Forces, public-order forces, intelligence and specified telecom personnel for discipline. Example: Police Forces (Restriction of Rights) Act, 1966 Self-executing vs needing a law most rights are directly enforceable without a law some need a law: Art 17 → Protection of Civil Rights Act, 1955 Art 21A → RTE Act, 2009 Art 23 → laws against trafficking and forced labour Art 35 gives Parliament law-making power to implement specified rights Article 12: Definition OF State Value addition Art 12 defines State for Part III. Since most rights run vertically against the State , we must know who the State is. State includes Government and Parliament of India Government and Legislature of each State Local authorities (rural and urban) Other authorities within India or under the control of the Government of India Why \"other authorities\" is the debate Wording is vague State functions are dynamic and are increasingly outsourced to bodies acting on its behalf question: can citizens claim Fundamental Rights against these bodies too? The SC has given tests Judicial tests set up by a statute or executive order (e.g. RBI) substantial financial and administrative control by government works as an agency or instrumentality of the State performs sovereign or public functions (defence, taxation, law and order) Memory aid · SFAP Four tests: S tatute-created · F inancial and administrative control · A gency of State · P ublic or sovereign function. (own mnemonic) Note Pradeep Kumar Biswas v. IICB (2002): the tests are not rigid or isolated . Overall question: is the body financially, functionally and administratively dominated or controlled by government? Control must be deep and pervasive ; mere regulatory control is not enough . Is the judiciary \"State\"? Art 12 does not mention the judiciary judicial functions: Courts protect rights Decisions are challenged by appeal or review , not under Art 12 administrative functions (staff recruitment and management): Judiciary can be treated as State Such acts can be challenged for violating rights CASE Study: BCCI Facts and Zee Telefilms (2005) BCCI is a private society registered under the Tamil Nadu Societies Registration Act , yet has a near monopoly over Indian cricket and selects the national team Zee Telefilms v. Union of India (2005): Constitution Bench held BCCI is not State : not created by statute No deep, pervasive government control No government financial support Functions important but not sovereign yet the Court separated being State (Art 12) from performing a public function : a public duty can attract writ jurisdiction of the High Court under Art 226 even if the body is not State BCCI is State (argument) BCCI is not State (argument) monopoly control over a national sport not created by statute public functions affecting careers no pervasive government control represents India in international bodies financially independent, mostly private funds decisions affect Fundamental Rights Ajay Hasia and Pradeep Kumar Biswas tests not fully met Way forward / key point Law Commission 275th Report (2018) recommended bringing the BCCI under the RTI Act because of its public functions. The debate is really about fitting the modern administrative State into Art 12. National Sports Governance Act, 2025 (handout; verify details) Presidential assent 18 August 2025 A statutory framework replacing the non-statutory National Sports Development Code, 2011 National Sports Board (NSB) recognises and regulates National Sports Federations, with power to suspend or cancel recognition for governance failures National Sports Tribunal for sports disputes recognised bodies must set up Ethics, Dispute Resolution and Athletes Committees and codes protecting athletes, especially women and minors aims at Olympic and Paralympic Charter alignment: India's 2036 Summer Olympics aspiration RTI link and concerns RTI applies if a body is substantially financed by government, so financially independent BCCI is not automatically a public authority performing public functions does not automatically make a body State (Art 12) or a public authority (RTI) concerns: Over-centralisation in the NSB (government role in appointments) Conflict of a domestic regulator with the autonomy of FIFA and ICC"}, {"c": "5", "n": "Fundamental Rights: Nature, Article 12 and Reservation", "id": "2-affirmative-action-the-case-for-and-agai", "t": "2 · Affirmative Action · THE CASE FOR AND Against Reservation", "x": "2 · Affirmative Action · THE CASE FOR AND Against Reservation # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Fundamental Rights handout pp. 7-10. Prelims PYQs quoted: none quoted in the material. In simple words Affirmative action opens elite positions to groups that were kept out. Ambedkar wanted objective constitutional measures, not waiting for a change of heart. Know the eight arguments for, and the objections with their replies (injustice, merit, caste not class, creamy layer, mismatch). Meaning AND TWO Approaches Affirmative Action Broader and more refined term than reservation Became prominent when US President John F. Kennedy used it in an executive order in 1961 for equal opportunity set of anti-discriminatory measures giving access to preferred positions (IITs, IIMs, IAS, IPS) to groups who would otherwise be excluded or unrepresented These positions were historically monopolised by upper sections (gender, caste, class) The State tries to alter the social composition of elites Gandhian (spiritual) approach Ashwini Deshpande calls it the Evangelical Approach moral regeneration of upper castes through philanthropic upliftment Ambedkar's objective approach secular , not spiritual Rejected waiting for a change of heart We cannot wait years for moral regeneration needs objective measures , e.g. constitutional provisions for SCs and STs Arguments IN Favour Eight arguments for Historical injustice: Compensation for centuries of untouchability and deprivation USA (racial injustice), Australia (Aboriginal communities) Division of labourers, not labour: Work assigned by accident of birth Link between caste and job weaker among upper castes, but lower castes (Dalits, manual scavenging ) still face it Class and caste coincide: Lower castes face poverty plus social isolation Dalits also face landlessness Untouchability persists in new forms: separate utensils for domestic help, shoes outside the kitchen, trouble renting a home, honour killings over inter-caste marriage, caste preference in matrimonial ads Labour-market dualism: Ashwini Deshpande on unequal outcomes. Thorat and Attewell (2007): applications with Hindu non-Dalit, Hindu Dalit and Muslim identities, same qualifications , different outcomes Bridging inequality: Development alone does not close the gap Affirmative action bridges equality in law and equality in fact Benefits society: Not only the individual Promotes the weakest and allows full use of the talent pool Memory aid · HDC-UL-BB For: H istorical injustice · D ivision of labourers · C aste-class overlap · U ntouchability persists · L abour-market dualism · B ridging law-fact gap · B enefits society. (own mnemonic) Arguments Against AND Replies Objection Reply Injustice to tackle injustice unequal starting conditions: a weaker-section candidate cannot compete equally with a dominant-section one Breeds caste hostility stratification already created caste distinctions; this is corrective justice Compromises merit merit is assisted, not inborn : schooling, family support, absence of discrimination, post-school support Hurts productivity Deshpande and Weisskopf (2012) , Indian Railways 1980-2002: no evidence that reservation reduces productivity Creamy sections corner benefits need better targeting, not abolition ; poor targeting afflicts many schemes Mismatch hypothesis dropout needs evidence , not generalising; answer is extra and remedial classes, counselling Why caste, not class a poor Dalit faces poverty plus social isolation and discrimination; quota also fixes representation ; other welfare handles poverty in every community Memory aid · IBMPCMC Objections: I njustice · B ias-hostility · M erit · P roductivity · C reamy layer · M ismatch · C lass-not-caste. (own mnemonic) Way forward / key point Answer frame for Mains: state the objection, concede what is valid, reply with evidence, then give the reform (targeting, support), not abolition ."}, {"c": "5", "n": "Fundamental Rights: Nature, Article 12 and Reservation", "id": "3-beyond-quota-better-targeting-creamy-lay", "t": "3 · Beyond Quota · Better Targeting · Creamy Layer · Sub-classification", "x": "3 · Beyond Quota · Better Targeting · Creamy Layer · Sub-classification # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Fundamental Rights handout pp. 10-14. Prelims PYQs quoted: none quoted in the material. In simple words Quota alone cannot close gaps, so add support (land, jobs, handholding, diversity index). Then fix targeting: revise lists, apply the creamy layer, sub-classify OBCs (Rohini) and SCs (Davinder Singh 2024). Rohit Nathan (2026) says parental salary alone cannot decide creamy layer. Quota PLUS Policy Idea (Satish Deshpande) Quota Plus : reservation alone cannot solve all socio-economic disadvantage Limits of quota urban vs rural gap: Most backward classes, including Dalits, live in rural India with poor schooling Quotas in engineering and medical colleges help those already able to qualify 50% ceiling set by the SC (subject to later developments) Tamil Nadu has historically gone up to 69% Raising percentages alone does not remove structural disadvantage Additional measures land reforms (many Dalits are landless labourers) non-farm employment generation setting up MSMEs handholding of beneficiaries: academic and institutional support in professional colleges private sector Diversity Index on gender, community, caste Memory aid · HELM-D Quota Plus: H andholding · E mployment off-farm · L and reform · M SMEs · D iversity index. (own mnemonic) Diversity Index (illustrative) Class 0 - 0.33 Low diversity 0.33 - 0.66 Medium diversity 0.66 - 1.00 High diversity Use of the index Centre and States could weigh diversity in public procurement and outsourcing Discussed in the UPA period Idea is private-sector diversity without relying only on compulsory reservation Long-term objective Art 334: Original reservation of seats for SCs and STs in Lok Sabha and State Assemblies for ten years This is political , not jobs or education Extended by amendments 104th Amendment Act, 2019 extended it to 25 January 2030 handout proposal: Phased reduction of dependence on quotas once equal opportunity is reached Review at three levels: promotion quotas, job quotas, education quotas . This is a policy proposal, not a constitutional requirement Better Targeting Three tools revise backward-class lists through the constitutional process: add new groups, remove those that no longer qualify Creamy layer to exclude advanced members Criteria to be reviewed regularly sub-classification within OBCs: a few communities take a disproportionate share Justice G. Rohini Commission (2017) appointed under Art 340 to study unequal distribution of benefits among OBCs in the Central List and suggest sub-categorisation within the 27% quota reported illustrative split into four groups of 2%, 6%, 9%, 10% : reported proposals, not implemented Report submitted to the President on 31 July 2023 Submission does not mean implementation Creamy Layer Meaning and scope stops relatively advanced members of backward classes from cornering benefits Central framework applies to OBC reservation in jobs and admissions Income threshold ₹8 lakh per annum , with detailed Income/Wealth Test conditions Salary and agricultural income treated separately SC/ST: Jarnail Singh (2018) discussed the principle for promotions But the Centre and most States have no general OBC-style exclusion for SC/ST , and it is not generally applied to initial appointments Note Union of India v. Rohit Nathan (2026) (handout spells it Rohith; verify): Bench of Justices P. S. Narasimha and R. Mahadevan on UPSC candidates whose parents worked in PSUs, banks, private sector . What the SC held Parental salary alone cannot decide creamy layer The status and category of the parent's post matter 1993 Office Memorandum (based on Indra Sawhney 1992 ) is the foundation The 2004 clarificatory letter is invalid to the extent it changed the 1993 criteria (a clarification cannot add substantive conditions) Under the 1993 OM, salary and agricultural income are excluded from the Income/Wealth Test Parental service status still counts Art 14: treating PSU and private-sector employees' children differently from similarly placed government employees without valid basis violates equality creamy layer is rooted in substantive equality (Arts 14, 15, 16) , not mere administrative policy Art 142 used for relief: supernumerary posts for eligible candidates wrongly denied non-creamy-layer benefit, with a time-bound process Critique test may become too income-dependent though affirmative action targets social discrimination Separate treatment of agricultural income lets prosperous farming families pass the test Benefits may pass across generations to the better-off but the framework also uses parental status and other criteria, not only income Sub-classification OF SCs: Davinder Singh (2024) State of Punjab v. Davinder Singh (2024) seven-judge Constitution Bench, 6-1 : States may sub-classify within Scheduled Castes for fairer distribution of benefits recognises that inequality exists among SC communities themselves Conditions must rest on empirical data cannot be used to include or exclude communities from the Presidential SC List ( Art 341 ) subject to judicial review cannot give the entire benefit to one sub-group arbitrarily Memory aid · JEMS Davinder Singh limits: J udicial review · E mpirical data · M ust not alter Art 341 list · S ub-group cannot take everything. (own mnemonic) Value addition Opinions of individual judges on a creamy layer for SCs are not a universal rule; keep them distinct from an administrative or statutory exclusion."}, {"c": "5", "n": "Fundamental Rights: Nature, Article 12 and Reservation", "id": "4-dominant-caste-demands-maratha-ews-effec", "t": "4 · Dominant Caste Demands · Maratha · EWS · Effectiveness", "x": "4 · Dominant Caste Demands · Maratha · EWS · Effectiveness # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Fundamental Rights handout pp. 14-17. Prelims PYQs quoted: none quoted in the material. In simple words Backwardness must be shown by current objective data, not past victimhood or votes. Jats were rejected in Ram Singh (2015); the Maratha quota went 16% to 13/12% to struck down (2021), then a 2024 Act is pending. EWS 10% was upheld 3-2 in 2022. Dominant-caste Demands: JAT Background Centre and States have discretion in listing communities as OBC, within constitutional safeguards and judicial review the Jati-Varna link is clear at the top and bottom of the hierarchy but weaker among middle castes , so backwardness is contentious 2014: On the eve of Lok Sabha elections the UPA decided to include Jats in the Central OBC list in certain States Critics saw electoral motive Rejected by the SC in Ram Singh (2015) Ram Singh v. Union of India (2015): principles Historical injustice alone cannot identify OBCs Present social and educational conditions must count continuous evolution of backward classes: e.g. recognition of transgender persons in NALSA (2014) Self-perception cannot be the sole basis Need objective, contemporary data (no single time period fixed) Questioned the adequacy of material behind the Jat decision Need for reliable caste-based data Vertical discrimination against groups lower in the traditional hierarchy answered by Arts 15(4) and 16(4) (affirmative action in education and jobs) Horizontal discrimination cuts across castes: women, transgender persons Answered by Arts 15(1) and 16(2) Horizontal reservation cuts across vertical categories where provided also needs attitude and infrastructure change , not quotas alone Maratha Reservation: Timeline 2014 Maharashtra announces 16% for Marathas and a proposed 5% for Muslims in education and jobs; legal challenges over backwardness, religion and the ceiling 2018 SEBC Act, 2018 : 16% for Marathas in education and jobs; challenged in the Bombay High Court 2019 Bombay HC broadly upheld but cut it to 13% in jobs and 12% in education 2021 Jaishri Laxmanrao Patil: SC struck down the 2018 Act; no extraordinary circumstances to cross the 50% ceiling ; reaffirmed Indra Sawhney (1992) 2024 new SEBC Act: 10% for Marathas, additional to existing quotas; challenged on the ceiling. Handout: as of October 2026 still before the Bombay HC (verify) Memory aid · SEBC-16-13-10 Maratha numbers: 16 (2018 Act) → 13/12 (HC 2019) → struck (SC 2021) → 10 (2024 Act). (own mnemonic) EWS Reservation Constitutional basis 103rd Amendment Act, 2019 added Arts 15(6) and 16(6) : 10% reservation for Economically Weaker Sections , subject to conditions Criticisms breaks the 50% ceiling of Indra Sawhney Art 16(4) tests are backwardness and inadequate representation EWS may not meet them purely economic criterion: earlier cases said social backwardness cannot rest on economics alone A separate vertical category though poverty cuts across communities Excludes poor persons in SC, ST, OBC groups Note Janhit Abhiyan v. Union of India (2022): five-judge bench upheld the amendment 3-2 ; economic criteria valid; exclusion of SC/ST/OBC upheld. The ceiling and economics points are criticisms debated , not the legal position that invalidates EWS. Effectiveness OF Reservation Gains (supporters) education gaps between SC/ST and general population narrowed more representation in services and institutions rise of a Dalit middle class Continuing challenges unequal access to quality education concentration of benefits inadequate representation at higher levels judge by representation and broader socio-economic progress"}, {"c": "5", "n": "Fundamental Rights: Nature, Article 12 and Reservation", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Where are FRs found Part III Right to Vote is a FR? No, outside Part III Art 19 vs Art 14, 21 Art 19 citizens only; 14 and 21 all persons Cannot be suspended in Emergency enforcement of Arts 20 and 21 Art 33 restricts rights of armed and police forces; Act of 1966 Four tests of State SFAP Pradeep Kumar Biswas 2002 deep and pervasive control; tests not rigid Is judiciary State only for administrative functions Zee Telefilms 2005 BCCI not State; public duty reachable under Art 226 NSGA 2025 assent 18 August 2025; NSB and National Sports Tribunal Kennedy and affirmative action executive order 1961 Gandhi vs Ambedkar approach moral regeneration vs objective secular measures Thorat and Attewell 2007 same qualifications, different hiring outcomes by identity Deshpande and Weisskopf 2012 Railways 1980-2002, no productivity loss Mismatch remedy remedial classes and counselling Why caste not class caste adds social isolation; quota also gives representation Corrective justice reply to 19 · Restrictions · Defamation · Subramanian Swamy", "x": "1 · Article 19 · Restrictions · Defamation · Subramanian Swamy # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Fundamental Rights handout pp. 17-20. Prelims PYQs quoted: none quoted in the material. In simple words Art 19(1) gives citizens seven (now six) freedoms; each has its own list of grounds for restriction. Speech has the longest list (eight). Press, silence, information and privacy are inferred. Criminal defamation survived in Subramanian Swamy (2016), now sits in BNS s.356. Article 19(1): THE Rights (citizens ONLY) Clause Right Restriction clause (a) freedom of speech and expression 19(2) (b) assemble peaceably and without arms 19(3) (c) form associations, unions, co-operative societies 19(4) (d) move freely throughout India 19(5) (e) reside and settle anywhere in India 19(5) (f) omitted (property) - (g) practise any profession, occupation, trade or business 19(6) Memory aid · SAA-MRP Art 19(1): S peech · A ssembly · A ssociation · M ovement · R esidence · (f gone) · P rofession. (own mnemonic) Grounds OF Restriction 19(2): speech and expression (eight grounds) Sovereignty and integrity of India Security of the State Friendly relations with foreign States Public order Decency or morality Contempt of court Defamation Incitement to an offence Memory aid · SSF-P-DM-CDI Eight grounds: S overeignty · S ecurity · F riendly relations · P ublic order · D ecency-morality · C ontempt · D efamation · I ncitement. (own mnemonic) Clause Reasonable restrictions in the interests of 19(3) assembly sovereignty and integrity · public order 19(4) association sovereignty and integrity · public order · morality 19(5) movement, residence general public · protection of any Scheduled Tribe 19(6) profession, trade general public ; may also lay down professional or technical qualifications and allow State or State-owned corporations to carry on a trade, wholly or partly e
