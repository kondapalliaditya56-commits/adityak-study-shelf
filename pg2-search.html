ransfers, restructuring) federal: Governors have Art 213 power H. M. Seervai defends Strong judicial review can strike a law at once Ordinance prevents a legal vacuum in recess Counter USA has equally strong review but no decree power Uses emergency sessions Examples Effect GNCTD (Amendment) Ordinance 2023 NCCSA; more Lieutenant Governor control over services CVC and DSPE Ordinances 2021 ED and CBI Directors: three one-year extensions, up to five years Essential Defence Services Ordinance 2021 curbed strikes in 41 ordnance factories Tribunals Reforms Ordinance 2021 abolished IPAB, FCAT CAQM Ordinance 2021 Commission for Air Quality Management in NCR Farm Sector Ordinances 2020 trade outside APMC, contract farming; Acts repealed in 2021 Way forward / key point Way forward: convene Parliament within one or two weeks of major ordinances; President to use the proviso to Art 74(1) to return questionable advice; keep actions reversible (Krishna Kumar Singh)."}, {"c": "15", "n": "The President, Ordinances and Parliamentary Government", "id": "3-president-india-vs-germany-vice-presiden", "t": "3 · President: India VS Germany · Vice-president · Prime Minister", "x": "3 · President: India VS Germany · Vice-president · Prime Minister # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Executive and Legislature handout pp. 7-10. Prelims PYQs quoted: none quoted in the material. In simple words India and Germany both have nominal Presidents, but India's has wider formal powers (ordinances, assent, veto types). India's VP chairs the Rajya Sabha and has no executive role, unlike the US VP. The PM is the real executive, unlike the US President who is both Head of State and Government. President OF India VS Germany Basis India Germany Position nominal Head of State; PM real executive nominal Head of State; Chancellor real executive Election indirect by Electoral College indirect by Federal Convention Electors elected MPs and MLAs (Delhi, Puducherry) all Bundestag members + equal number of delegates chosen by State parliaments Method PR-STV, weighted, secret ballot secret ballot; absolute majority in first two rounds, most votes in third Min. age 35 40 Tenure / re-election 5 years / no limit (Art 57) 5 years / one consecutive re-election (Art 54) Appoints head of govt PM who commands Lok Sabha majority proposes Chancellor, elected by Bundestag; President formally appoints Veto absolute, suspensive, pocket (Art 111) no political or pocket veto; may refuse on constitutional grounds (Art 82) Ordinance Art 123 none Dissolution Lok Sabha under Art 85, on advice Bundestag only in specified cases (Arts 63, 68) Military Supreme Commander (Art 53) Defence Minister in peacetime; Chancellor in defence Pardon Art 72, incl. death sentences Art 60, individual federal cases Removal impeachment (Art 61) charges by Bundestag/Bundesrat; Federal Constitutional Court decides Value addition Key difference: in India the President formally appoints the PM; in Germany the Bundestag elects the Chancellor. Vice-president: India VS USA Aspect India USA Model modelled on the US VP, adapted to parliamentary system original, under presidential system Legislative role ex officio Chairman of Rajya Sabha President of the Senate Executive role none; legislative and ceremonial important as immediate successor Succession acts as President temporarily; new election within six months automatically becomes President for the remaining term Prime Minister Note Ivor Jennings: \"The Prime Minister is the keystone of the Constitution. All roads in the Constitution lead to the Prime Minister.\" Dimension PM of India US President System parliamentary; fusion of powers presidential; separation Office Head of Government; President is Head of State both Head of State and Government Appointment appointed by President; needs Lok Sabha majority indirectly elected, 538 electors Legislature membership must be an MP (or become one within 6 months) cannot be in Congress Cabinet Council of Ministers, collective responsibility, \"primus inter pares\" secretaries appointed with Senate confirmation; not collectively responsible Tenure flexible, depends on Lok Sabha confidence fixed 4 years, 2 terms max (22nd) Legislative influence direct; guides bills and agenda indirect; cannot introduce bills Veto none; assent by the President on advice regular veto (two-thirds override) and pocket veto Dissolution can advise dissolution of Lok Sabha cannot dissolve Congress Military de facto through Cabinet Committee on Security; President is Supreme Commander Commander-in-Chief (Art II, Sec 2) Removal no-confidence motion, simple majority, whole Council resigns impeachment: House majority, Senate two-thirds"}, {"c": "15", "n": "The President, Ordinances and Parliamentary Government", "id": "4-parliamentary-system-features-merits-lim", "t": "4 · Parliamentary System · Features · Merits · Limits · India VS Britain", "x": "4 · Parliamentary System · Features · Merits · Limits · India VS Britain # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Executive and Legislature handout pp. 10-12. Prelims PYQs quoted: none quoted in the material. In simple words India follows the parliamentary (cabinet, Westminster) model at Union (Arts 74, 75) and State (Arts 163, 164) levels. Its merits are harmony and accountability; its demerits are instability and cabinet dictatorship. India differs from Britain in being a republic with a written constitution and judicial review. Features Meaning executive politically accountable to the legislature: India, Britain, Japan, Canada Presidential (fixed tenure): USA, Brazil also: Cabinet / Responsible / Westminster model PM seen as primus inter pares Crossman, Mackintosh: \"prime ministerial government\" Feature Detail Nominal and real executive President de jure; PM de facto (Art 74) Majority party rule leader who commands Lok Sabha majority is PM; coalition in a hung House Collective responsibility Art 75(3) : Council answers to Lok Sabha; successful no-confidence means whole Council resigns Political cohesion common policies; coalitions rely on consensus Dual membership ministers in both executive and legislature; Art 75(5) : non-MP must join a House within 6 months PM leadership central link of President, Cabinet, Parliament Dissolution Art 85 on advice Secrecy Art 75(4) oath of office and secrecy Basis Parliamentary (India) Presidential (USA) Executive dual single Powers fusion separation Tenure depends on confidence fixed 4 years Responsibility collective to Lok Sabha Cabinet answers to President Removal no-confidence impeachment Dissolution Lok Sabha can be dissolved no Membership ministers in Parliament cabinet members not in Congress Merits AND Limits Advantages harmony of executive and legislature responsible government (Question Hour, committees, no-confidence) checks on arbitrary power alternative government without fresh polls (Jennings: Leader of Opposition = alternative PM) broad representation Limitations instability (Charan Singh, V. P. Singh, Chandra Shekhar, I. K. Gujral) policy discontinuity (Janata 1977-79) cabinet dictatorship (Laski, Muir; Emergency 1975-77) fusion of powers (Bagehot: \"hyphen that joins the buckle\") non-expert ministers coalition compulsions Why India chose it familiarity: GoI Acts 1919 and 1935 Ambedkar: Balance stability and responsibility Preferred accountability avoid deadlock accommodate diversity flexibility Swaran Singh Committee 1976 retained it Basis India Britain State republic constitutional monarchy Head of State elected President hereditary monarch Supremacy constitutional supremacy parliamentary sovereignty Constitution written uncodified Judicial review courts strike down laws generally cannot invalidate Acts PM either House conventionally Commons Ministers non-MPs allowed 6 months normally from either House Countersignature no general requirement certain royal acts need it Shadow Cabinet none established Structure federal predominantly unitary"}, {"c": "15", "n": "The President, Ordinances and Parliamentary Government", "id": "5-council-of-ministers-cabinet-committees", "t": "5 · Council OF Ministers · Cabinet · Committees · Cabinet Secretariat · PMO · Secretariat", "x": "5 · Council OF Ministers · Cabinet · Committees · Cabinet Secretariat · PMO · Secretariat # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Executive and Legislature handout pp. 13-18. Prelims PYQs quoted: none quoted in the material. In simple words Council of Ministers has three ranks (Cabinet, MoS, Deputy) and is capped at 15% of the Lok Sabha (81) by the 91st Amendment. The Cabinet is the real policy body, supported by committees, the Cabinet Secretariat and the PMO. Concerns: PMO centralisation and weak scrutiny. Council OF Ministers Ranks (by convention) Cabinet Ministers: key portfolios (Defence, Home, Finance, External Affairs), chaired by the PM Ministers of State: attached to a Cabinet Minister, or Independent Charge (may attend Cabinet when invited) Deputy Ministers: assist, no independent charge, rarely used now Note Size cap: 91st Amendment, 2003, Art 75(1A): ministers including the PM not over 15% of Lok Sabha : with 543 seats, 81 . Smaller council clear decisions lower expenditure no rewarding of allies accountability Larger council scale needs coverage regional/community representation coalition partners specialised portfolios Value addition First ARC (1966): Cabinet about 16 including PM; Council about 40 , never above 45 ; a Deputy PM; a Cabinet Committee on Administration. Cabinet Status Ramsay Muir: \"steering wheel of the ship of State\" Word \"Cabinet\" entered the Constitution via the 44th Amendment 1978 Art 352(3) : Emergency needs the Cabinet's written decision Basis Council of Ministers Cabinet Composition all ministers PM + Cabinet Ministers Size larger smaller Role implements; executive responsibility principal policy-making Meetings rarely as a whole regularly Articles 74, 75 352(3) Functions policy formulation legislative agenda financial direction (Budget) administrative coordination appointments and crisis management Checks judicial review Parliament (questions, motions, committees) EC, CAG and other bodies public opinion, media, opposition Value addition \"The creation dominates the creator\": Cabinet drawn from Parliament but controls its agenda. Kitchen Cabinet: informal inner group (e.g. P. N. Haksar, D. P. Dhar under Indira Gandhi); faster, secret, but dilutes the Cabinet. Cabinet Committees Extra-constitutional ** under Transaction of Business Rules 1961 (Art 77(3))** number, names, composition set by the PM Chaired by PM or a senior minister Standing or ad hoc Committee Function Political Affairs (CCPA) political coordination, Centre-State; the \"Super Cabinet\" Economic Affairs (CCEA) economic and industrial policy, investment approvals, pricing, subsidies Security (CCS) defence, national security, major procurement Appointments (ACC) senior appointments and postings Parliamentary Affairs government business in Parliament Investment and Growth investment, infrastructure, bottlenecks Skill, Employment and Livelihood jobs, skills Accommodation government housing Memory aid · PESA-PIS-A Big four committees: P olitical · E conomic · S ecurity · A ppointments. (own mnemonic) Issues irregular meetings junior ministers have limited role political stature over expertise PM chairs many, centralisation weak scrutiny by the full Cabinet Cabinet Secretariat, PMO, Secretariat Cabinet Secretariat Under the PM Chief coordinating agency agendas, minutes, follow-up of decisions ensures Transaction of Business and Allocation of Business Rules, 1961 Committees of Secretaries for inter-ministerial issues Crisis coordination Cabinet Secretary Senior-most civil servant Ex officio Chairman of Civil Services Board Buffer between political executive and civil services \"conscience keeper\" N. R. Pillai first T. V. Somanathan current (verify) tenure up to four years, plus up to 3 months extension PMO Non-constitutional Prime Minister's Secretariat 15 Aug 1947 , renamed PMO 28 March 1977 policy advice, coordination, monitoring, departments in PM's charge (Atomic Energy, Space), NITI Aayog, public relations over-centralisation: weak Cabinet deliberation, ministers as implementers, parallel unelected power, delays, States sidelined work through established systems Central Secretariat headquarters of ministries and departments split system: Policy in Secretariat Implementation by attached/subordinate offices and field agencies policy, legislative drafts, Budget, supervision, coordination (CAG, UPSC), institutional memory issues: file layers, generalist bias, technology gaps, overlap, weak coordination with States reforms: Second ARC flatter structure Lateral entry E-Office Merge ministries Mission Karmayogi"}, {"c": "15", "n": "The President, Ordinances and Parliamentary Government", "id": "6-130th-amendment-bill-2025-removal-of-min", "t": "6 · 130th Amendment BILL 2025 · Removal OF Ministers IN Custody · Basic Structure", "x": "6 · 130th Amendment BILL 2025 · Removal OF Ministers IN Custody · Basic Structure # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Executive and Legislature handout pp. 18-20 (current affairs, verify). Prelims PYQs quoted: none quoted in the material. In simple words The Bill (introduced 20 Aug 2025, referred to a JPC) would remove a PM, CM or minister who stays in custody 30 consecutive days for an offence punishable with 5+ years. Supporters cite criminalisation of politics; critics cite presumption of innocence, federalism and parliamentary democracy. WHAT THE BILL DOES Note Current-affairs item. Status per the handout: under parliamentary examination (JPC); not law . Verify latest status. Provisions Introduced in Lok Sabha on 20 August 2025 by the Home Minister Referred to a Joint Parliamentary Committee covers PM, Union Ministers, CMs, State/UT ministers detained 30 consecutive days for an offence punishable with 5 years or more Ministers: President (on PM's advice) or Governor (on CM's advice) must remove them by the 31st day Otherwise they cease to hold office from the 32nd day PM and CMs: must resign by the 31st day, else cease from the 32nd reappointment allowed after release Companion Bills for Puducherry and J&K Delhi via amendment to Art 239AA Memory aid · 30-31-32 30 days custody → advice by 31 st day → office ends on 32 nd. (own mnemonic) Rationale no separate criminal standard for ministers RPA 1951 Section 8: disqualification only after conviction, which takes years avoid \"governing from jail\" Basic Structure Concerns Parliamentary democracy P. V. Narasimha Rao v. State (1998): Parliamentary democracy is part of basic structure Art 75(3) Manoj Narula (2014): PM/CM prerogative in choosing ministers Automatic removal restricts it investigations could decide tenures without a no-confidence vote Federalism S. R. Bommai (1994): federalism is basic structure arrest by ED, CBI or NIA could remove a State CM (Union interference) State police against Union ministers or another State's CM: confrontation Rule of law and innocence BNSS Section 35: Arrest on reasonable suspicion Not proof of guilt BNSS Section 187: Default bail after 60/90 days 30 days may pass before charges strict bail in PMLA Section 45 and UAPA Section 43D(5) removal before a judicial finding: arbitrariness, due process, Arts 14 and 21 Mechanism Authority Trigger Legislator disqualification (Arts 103/192) President/Governor on EC opinion constitutional and statutory bars, e.g. office of profit Defection (Tenth Schedule) Speaker/Chairman, subject to review defection or whip violation Criminal (RPA Section 8) conviction by a court specified convictions, incl. 2+ years under Sec 8(3) Proposed 130th President/Governor on advice, automatic cessation 30 days custody for 5+ year offence"}, {"c": "15", "n": "The President, Ordinances and Parliamentary Government", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Union Executive articles Arts 52-78 Advice binding via Art 74(1) Return advice once 44th Amendment 1978 Bommai on Art 74(2) material behind advice reviewable PM dismissed under Art 75(2) Narayanan 1997 returned advice for President's Rule in UP President election disputes Supreme Court, Art 71 Ordinance article Art 123 Lapses six weeks after reassembly 38th vs 44th Amendment finality given, then removed Wadhwa 1987 256 Bihar ordinances; fraud on the Constitution Krishna Kumar Singh 2017 7 judges; no automatic survival of rights Governor's ordinance article Art 213 Ordinances 17th Lok Sabha 29 Min age India vs Germany 35 vs 40 Germany re-election one consecutive India VP in Rajya Sabha ex officio Chairman VP acting as President: new election within six months Jennings on PM keystone of the Constitution US removal House majority, Senate two-thirds Collective responsibility Art 75(3) Non-MP minister must join in six months, Art 75(5) Secrecy oath Art 75(4) Swaran Singh 1976 retain parliamentary system Bagehot on Cabinet hyphen that joins the buckle Britain vs India supremacy parliamentary sovereignty vs constitutional supremacy Council size cap 15% of Lok Sabha, 81, by 91st Amendment 2003 Cabinet word entered 44th Amendment 1978 Committees under Transaction of Business Rules 1961 Super Cabinet CCPA PMO renamed 28 March 1977 First Cabinet Secretary N. R. Pillai First ARC Cabinet size 16, council 40-45 130th Amendment Bill introduced 20 August 2025, Lok Sabha Custody trigger 30 consecutive days, 5+ year offence Automatic cessation from 32nd day Delhi covered via Art 239AA amendment Narula 2014 PM/CM choice of ministers Status with JPC, not law (verify)"}, {"c": "15", "n": "The President, Ordinances and Parliamentary Government", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts in Start Here)"}, {"c": "15", "n": "The President, Ordinances and Parliamentary Government", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards"}, {"c": "16", "n": "Speaker, Privileges, Bicameralism and Functioning of Parliament", "id": "1-speaker-of-the-lok-sabha-powers-impartia", "t": "1 · Speaker OF THE LOK Sabha · Powers · Impartiality · Reforms", "x": "1 · Speaker OF THE LOK Sabha · Powers · Impartiality · Reforms # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Executive and Legislature handout pp. 20-22. Prelims PYQs quoted: none quoted in the material. In simple words The Speaker presides, certifies Money Bills, decides anti-defection cases and guards privileges, yet is usually a party member. Safeguards (tenure, pay on the Consolidated Fund, casting vote only) exist; reform ideas are party-neutral convention and an independent anti-defection tribunal. Powers AND Functions Presiding presides over Lok Sabha and joint sittings (Art 108) Order Points of order Interpretation of rules adjourn/suspend for disorder or lack of quorum ( one-tenth ) Procedure admissibility of questions, motions, resolutions Regulates debate Expunges unparliamentary words May allow a secret sitting Money Bill (Art 110) Speaker decides 110(3) says final Rojer Mathew v. South Indian Bank (2019): certification is not immune from judicial review Anti-defection decides disqualification under the Tenth Schedule Kihoto Hollohan v. Zachillhu (1992): decisions subject to judicial review Committees, privileges Guardian of House rights Appoints chairs of several committees chairs Business Advisory, Rules, General Purposes committees Ex officio President of the Indian Parliamentary Group Chairs Conference of Presiding Officers Vote (Art 100) No vote in the first instance Casting vote on a tie Independence AND ITS Limits Safeguards removal needs effective majority and 14 days' notice salary charged on Consolidated Fund Art 122: proceedings not questioned for procedural irregularity (constitutional violations are reviewable) casting vote only Tenth Schedule: may give up party membership on election without disqualification ranks 7th in the Table of Precedence with the CJI conduct discussed only by substantive motion Challenges usually retains party membership delayed or partisan anti-defection rulings Money Bill disputes (Rajya Sabha's rights) discretion over motions, debates, discipline pressure from a strong majority ONCE A Speaker, Always A Speaker Idea Neutral even after tenure In the UK the Speaker resigns from party and is generally returned unopposed Vithalbhai Patel (1925) quit the Swaraj Party after becoming President of the Central Legislative Assembly V. S. Page Committee (1967): sever party ties, seek consensus on an impartial Speaker, parties not to contest his seat, no ministerial office For impartiality protects parliamentary democracy better anti-defection rulings credibility Example: 2025, SC told the Telangana Speaker to decide pending disqualification petitions in a set time Challenges career disincentive weak conventions in India less political accountability resigning from the party alone is incomplete Reforms bipartisan selection independent anti-defection tribunal strengthen neutrality conventions transparent procedures training Country Practice UK Speaker resigns from party; major parties do not contest the seat Canada elected by secret ballot of MPs Australia usually keeps party affiliation but expected to preside impartially Way forward / key point G. V. Mavalankar: once elected Speaker he is \"above parties, above politics ... belongs to all the members or to none. He holds the scales of justice evenly.\""}, {"c": "16", "n": "Speaker, Privileges, Bicameralism and Functioning of Parliament", "id": "2-parliamentary-privileges-articles-105-19", "t": "2 · Parliamentary Privileges · Articles 105, 194 · RAJA RAM PAL · SITA Soren", "x": "2 · Parliamentary Privileges · Articles 105, 194 · RAJA RAM PAL · SITA Soren # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Executive and Legislature handout pp. 22-24. Prelims PYQs quoted: none quoted in the material. In simple words Privileges protect the independence of the House and its members. They are uncodified. Raja Ram Pal (2007) allowed expulsion but kept review; Sita Soren (2024, 7 judges) overruled Narasimha Rao: no immunity for bribery tied to speech or vote. Sources AND Classification Basis Art 105 (Parliament), Art 194 (State Legislatures) extend to those who may speak in proceedings ( Union ministers, Attorney General ) but not the President sources: laws (none comprehensive), rules, conventions, judgments Collective publish and regulate proceedings ( Art 361A protects true reports) secret sittings make rules punish contempt (reprimand, admonition, suspension, imprisonment, expulsion) be told of arrest/conviction of members committees can summon Art 122 bar on courts permission before arrest or legal process in precincts Individual freedom of speech in House ( Art 105 ) no civil arrest during session and 40 days before and after (not criminal or preventive detention) exempt from being a witness during sessions exempt from jury service Value addition Privileges are functional , not personal; also called the \" indirect rights of citizens \". Breach VS Contempt; Procedure Breach of privilege Contempt of the House violation of a specific right of the House, committee or member any act obstructing or lowering the House's functioning, authority or dignity narrower; e.g. obstructing an MP broader; e.g. disobeying a lawful order Note Every breach of privilege may be a contempt, but every contempt need not be a breach of a specific privilege. 1 member raises a privilege question with Speaker/Chairman's consent 2 Presiding Officer checks for a prima facie case 3 referred to the Committee of Privileges 4 House accepts, modifies or rejects its recommendation Judgments Raja Ram Pal v. Speaker (2007) Cash-for-Query (2005) expulsions upheld privileges are not immune from review: constitutional violations and substantive illegality reviewable, not mere procedural irregularity Sita Soren v. Union of India (2024) seven judges: no immunity for bribery linked to speeches or votes overruled P. V. Narasimha Rao (1998) privileges protect legislative independence, not corruption Codify clarity limits on punishment fewer clashes with judiciary protects FRs Do not codify loss of flexibility majority may shape it more litigation less autonomy Way forward selective codification of major privileges and punishments due process: hearing, reasons, proportionality judicial balance (procedure vs constitutional violation) transparent Committees of Privileges"}, {"c": "16", "n": "Speaker, Privileges, Bicameralism and Functioning of Parliament", "id": "3-bicameralism-rajya-sabha-vs-lok-sabha-po", "t": "3 · Bicameralism · Rajya Sabha VS LOK Sabha · Powers · Significance · Limits", "x": "3 · Bicameralism · Rajya Sabha VS LOK Sabha · Powers · Significance · Limits # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Executive and Legislature handout pp. 24-28. Prelims PYQs quoted: none quoted in the material. In simple words Parliament = President + Rajya Sabha + Lok Sabha (Art 79). Rajya Sabha is a permanent, indirectly elected federal chamber with equal powers in most things, inferior on money matters and accountability, and special powers under Arts 249, 312 and 67. WHY TWO Houses Art 79 Parliament = President + Rajya Sabha (Council of States) + Lok Sabha (House of the People) President is not a member but summons, prorogues, dissolves the Lok Sabha, addresses Parliament, gives assent For federal voice for States deliberation , less haste experts via nominations continuity (never dissolves) check on unilateral constitutional change Against delay duplication indirect election party-line voting accommodating defeated politicians Value addition Deadlock tools: Joint Sitting (Art 108) and the Money Bill procedure. Basis Lok Sabha Rajya Sabha Article 81 80 Nature directly elected indirectly elected Strength 543 elected max 250; sanctioned 245 incl. 12 nominated Election FPTP, adult suffrage PR by single transferable vote Representation population based States/UTs, unequal Tenure 5 years unless dissolved permanent; 6-year terms, about one-third retire every 2 years Presiding Speaker, Deputy Speaker Vice-President as Chairman; Deputy Chairman Accountability Council collectively responsible can question, cannot remove government Money Bills exclusive introduction, final say recommend changes within 14 days Special no-confidence, Demands for Grants Arts 249 and 312; initiates VP removal Joint sitting numerical advantage equal voting rights per member Women 106th Amendment reservation no constitutional reservation Powers OF Rajya Sabha Parity ordinary bills (subject to joint sitting) Art 368 amendments, passed separately, no joint sitting Election/impeachment of President Election and removal of VP removal of SC/HC judges, CAG, CEC per rules approves ordinances (Art 123) and Emergency proclamations (Arts 352, 356, 360) discusses CAG, UPSC, Finance Commission reports Ministers incl. PM may belong to either House Inferior Money Bills (Arts 109-110): Introduced only in Lok Sabha RS recommends within 14 days Deemed passed if not returned cannot vote on Demands for Grants no no-confidence motion in RS joint sitting : Lok Sabha usually prevails E.g. Prevention of Terrorism Bill 2002 Special Art 249: Authorise Parliament to legislate on a State List subject in national interest by two-thirds present and voting Resolution valid one year , renewable yearly Law ceases 6 months after Art 312: create new All-India Services (two-thirds) Art 67: removal of VP originates only in RS (majority of all members, agreed by LS) approve Emergency proclamations if Lok Sabha is dissolved Memory aid · 249-312-67 RS special powers: 249 State List · 312 All-India Services · 67 VP removal. (own mnemonic) Significance AND Limits Significance House of Elders revisory chamber guardian of Constitution federal chamber 12 nominated experts (literature, science, art, social service) \" House of Corrections \" vs Lok Sabha \" House of Passions \" Limitations unequal State representation (unlike US Senate) 2003: domicile requirement removed UTs and nominated members Weak on Money Bills Aadhaar controversy Only three joint sittings Could not stop the 42nd Amendment accommodation of defeated politicians disruption: Hamid Ansari (2013) \" federation of anarchists \" Why unequal representation population differences India not formed by agreement of sovereign States equal seats would give small States disproportionate influence Way forward / key point RS is neither as weak as the House of Lords nor as strong as the US Senate."}, {"c": "16", "n": "Speaker, Privileges, Bicameralism and Functioning of Parliament", "id": "4-women-s-reservation-nari-shakti-vandan-1", "t": "4 · Women's Reservation · NARI Shakti Vandan · 131st Amendment BILL 2026 · Delimitation", "x": "4 · Women's Reservation · NARI Shakti Vandan · 131st Amendment BILL 2026 · Delimitation # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Executive and Legislature handout pp. 28-30 (current affairs, verify). Prelims PYQs quoted: none quoted in the material. In simple words The 106th Amendment (Nari Shakti Vandan Adhiniyam, 2023) reserves one-third of Lok Sabha and Assembly seats for women after Census and delimitation. The 131st Amendment Bill 2026 (more seats, population-based delimitation) was defeated; the debate is the North-South balance. Women IN Parliament Lok Sabha Women MPs 15th about 11% 16th about 11.4% 17th 78, about 14% 18th (2024) 74, about 14% Constituent Assembly quota debated; many women preferred socio-economic empowerment 1996, 1998, 1999 Bills introduced, not enacted 2008 / 2010 108th Amendment Bill passed by Rajya Sabha 2010, lapsed with 15th Lok Sabha 2023 106th Amendment Act : one-third reservation Nari Shakti Vandan Adhiniyam, 2023 33% in Lok Sabha, State Assemblies, Delhi Assembly Inserted Arts 330A, 332A, 334A Amended 239AA one-third of SC/ST seats go to SC/ST women takes effect after the required Census and delimitation Seats rotate 15-year period, Parliament can extend not for Rajya Sabha or Legislative Councils For political equality panchayat evidence on water, sanitation leadership pipeline inclusive debate Concerns proxy representation rotation weakens constituency ties tokenism delay tied to Census and delimitation Alternatives party ticket quota of one-third (risk: weak seats) dual-member constituencies (big electoral change) Education, finance, safety, training Party democracy, less criminalisation 131st Amendment BILL, 2026 Note Current-affairs item. Per the handout: three Bills introduced in Lok Sabha on 16 April 2026 : Constitution (131st Amendment) Bill, Delimitation Bill, UT Laws (Amendment) Bill. The Constitution Bill was defeated in Lok Sabha in April 2026 , so the other two became infructuous . Verify. Proposals Lok Sabha maximum 550 to 850 (up to 815 States, 35 UTs) population-based reallocation Parliament to fix the Census by law (2011 Census usable) drop the wait for the first Census after the 106th Amendment so women's quota starts earlier Delimitation Issues Issues North-South imbalance: South (TN, Kerala, Karnataka, AP) slowed population growth North (UP, Bihar, MP) grew faster less constitutional certainty if timing and Census left to ordinary law gerrymandering (allegations in J&K and Assam) judicial review: Delimitation Commission orders have force of law, mostly shielded weakens Rajya Sabha in joint sittings if only Lok Sabha grows delays could delay women's reservation Basis India USA UK Term Delimitation Redistricting Boundary Review Authority Delimitation Commission under law state legislatures or independent commissions four independent Boundary Commissions Frequency after Census, subject to freezes after each decennial Census generally every 8 years Legal basis Arts 81, 82, 170; Delimitation Acts US Constitution, federal and State laws Parliamentary Constituencies Act 1986 Judicial review orders protected, within constitutional limits racial discrimination reviewable; pure partisan gerrymandering not legality only Lower House 543 435 650 Way forward / key point Way forward: national consensus, balance population with regional equity, independent Commission, judicial safeguards, phased implementation."}, {"c": "16", "n": "Speaker, Privileges, Bicameralism and Functioning of Parliament", "id": "5-functioning-of-parliament-reforms-mplads", "t": "5 · Functioning OF Parliament · Reforms · Mplads · Supreme NOT Sovereign", "x": "5 · Functioning OF Parliament · Reforms · Mplads · Supreme NOT Sovereign # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Executive and Legislature handout pp. 30-34. Prelims PYQs quoted: none quoted in the material. In simple words Parliament is weakened by fewer sittings, disruptions, thin debate, delegated legislation and criminalisation (46% MPs with declared cases in 2024). Reforms include fixed sittings and stronger committees. MPLADS (Rs 5 crore a year) was upheld in Bhim Singh (2010) but many panels want it scrapped. Parliament is supreme but not sovereign. Declining Effectiveness Issues Fewer sitting days Government controls timing disruptions and adjournments (15th Lok Sabha 2009-14 low productivity) thin debate: little committee scrutiny, anti-defection and party discipline, technical complexity delegated legislation with inadequate scrutiny cabinet dominance (\"creation dominates the creator\") guillotine: Demands for Grants passed without discussion frequent ordinances Representation and accountability criminalisation: 16th LS (2014) about 34% 17th (2019) 233 (43%) 18th (2024) 251 (46%) , 170 (31%) serious cases. Declared in affidavits, not findings of guilt ageing: only about 11% of 18th LS aged 40 or below population per MP up since the 1971 Census ethics: Cash-for-Query, Cash-for-Vote, MPLADS irregularities weak research support Salaries (article 106) Item Amount Law Salary, Allowances and Pension of Members of Parliament Act, 1954 Basic salary Rs 1.24 lakh a month (from 1 April 2023) Constituency allowance Rs 87,000 a month Office expense allowance Rs 75,000 a month Daily allowance Rs 2,500 Value addition Pay should not be the main attraction nor too low; consider an independent body like the UK's IPSA . Reforms Reforms Fixed calendar ** proposals: 120 days Lok Sabha, 100 days** Rajya Sabha stronger committees with experts and research narrow whips to confidence votes and essential business Opposition days (UK model) Disclose criminal antecedents and funding Enforce ethics women's reservation and delimitation by consensus Speaker neutrality Less executive control of business research services and training Mplads Features Launched 1993 (P. V. Narasimha Rao government) Nodal MoSPI Rs 5 crore per MP a year, non-lapsable durable assets: drinking water, sanitation, education, health, roads MPs recommend District Authority sanctions and implements suspended 2020-21 (and initially 2021-22), restored in 2021-22 LS MP: Own constituency RS MP: any district in the State Nominated MP: any district(s) in one State No religious buildings, routine maintenance, assets named after persons Audit by CAs/Local Fund Auditors on Accountant General's recommendation Criticism separation of powers federalism (State/local subjects) corruption, delays non-lapsable funds encourage election-time spending unspent: 14th LS Rs 176 cr 15th Rs 551 cr 16th Rs 1,734 cr Weak maintenance Unequal district spread weakens Panchayats and Municipalities Body / case Position NCRWC 2002 discontinue Second ARC abolish (separation of powers) Election Commission opposes: unfair advantage to sitting MPs Parliamentary Committee continue with reforms, change name Bhim Singh v. Union (2010) 5 judges upheld: MPs only recommend; local authorities sanction, so no breach of separation of powers Supreme BUT NOT Sovereign Why supreme apex law-maker (Union, Concurrent) residuary powers, Art 248 amends Constitution, Art 368 controls executive (Art 75, no-confidence) judicial structure (Art 124, tribunals) financial control: Consolidated Fund impeachment/removal powers Why not sovereign Constitution is supreme judicial review Basic Structure (Kesavananda 1973) federal structure Fundamental Rights Way forward / key point Unlike the British Parliament, India's Parliament has constitutionally limited powers."}, {"c": "16", "n": "Speaker, Privileges, Bicameralism and Functioning of Parliament", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Money Bill article Art 110; Rojer Mathew 2019 review Kihoto Hollohan 1992 Speaker's Tenth Schedule decisions reviewable Casting vote Art 100 Removal notice 14 days Speaker's rank 7th, with CJI Page Committee 1967, Speaker neutrality Vithalbhai Patel 1925, left Swaraj Party Privilege articles Art 105 (Parliament), 194 (States) No civil arrest period session + 40 days before and after Not covered the President Raja Ram Pal 2007 expulsion upheld; review allowed Sita Soren 2024 7 judges; bribery no immunity; overruled Narasimha Rao Art 122 courts cannot question procedure Rajya Sabha article Art 80; LS is Art 81 RS strength max 250; 245 sanctioned, 12 nominated Money Bill window 14 days Art 249 vote two-thirds present and voting; one year VP removal starts in Rajya Sabha, Art 67 Joint sittings held three Domicile rule removed 2003 Women reservation Act 106th Amendment 2023, 33% New Articles 330A, 332A, 334A (and 239AA amended) Not covered Rajya Sabha, Legislative Councils 18th Lok Sabha women 74 131st Bill date 16 April 2026; defeated (verify) Proposed Lok Sabha size 850 Lower house seats UK / USA 650 / 435 Criminal cases 18th LS 251 MPs (46%), 170 serious MPs 40 or below, 18th LS about 11% Proposed sitting days 120 LS, 100 RS MPLADS started 1993 MPLADS per MP Rs 5 crore a year, non-lapsable Bhim Singh 2010 MPLADS upheld Residuary power article Art 248"}, {"c": "16", "n": "Speaker, Privileges, Bicameralism and Functioning of Parliament", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts in Start Here)"}, {"c": "16", "n": "Speaker, Privileges, Bicameralism and Functioning of Parliament", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards"}, {"c": "17", "n": "Federalism and Centre-State Legislative and Administrative Relations", "id": "1-federalism-in-india-features-debate-evol", "t": "1 · Federalism IN India · Features · Debate · Evolution · Forms OF Federalism", "x": "1 · Federalism IN India · Features · Debate · Evolution · Forms OF Federalism # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Centre State Relations handout pp. 3-7. Prelims PYQs quoted: none quoted in the material. In simple words India is a holding-together federation with a strong Centre: federal in structure, unitary in bias. Wheare called it quasi-federal; Austin stressed cooperative federalism. Its working has passed through five phases and blends cooperative, competitive, bargaining, asymmetric and conflictual forms. WHAT IS A Federation Idea Powers constitutionally divided between Centre and regional governments, both drawing authority from the Constitution Regional governments have guaranteed powers the Centre cannot take away at will Basis Coming together Holding together Origin independent units unite larger entity distributes power to regions Aim mutual security, common interests accommodate diversity while keeping unity Powers units stronger Centre stronger Examples USA, Switzerland, Australia India , Spain, Belgium Federal features dual polity written Constitution Seventh Schedule division constitutional supremacy rigid amendment (Art 368) : ratification by half the States for federal provisions independent judiciary, Art 131 bicameralism: Rajya Sabha (Arts 249, 312) Unitary features Strong Centre Residuary power Art 248 single Constitution, citizenship Art 3 : Parliament alters States without consent Art 254 Union law prevails Emergency (Art 352) President's Rule (Art 356) Governor (Art 155; Art 200 reservation) integrated institutions: judiciary, AIS, EC, CAG fiscal centralisation THE Debate Scholars K. C. Wheare: quasi-federal (federal with strong unitary bias) Granville Austin: cooperative federalism sui generis: of its own kind Strong-Centre side constitutional centralisation national party high commands financial dependence Governors, AIS, directions Federal side independent powers S. R. Bommai 1994: federalism is Basic Structure regional parties and coalitions GST Council, Finance Commission, Inter-State Council Evolution 1950-67 Centralised: one-party dominance, Planning Commission 1950 , Art 356 used (Kerala 1959) 1967-80 Regionalism: non-Congress States in 1967, DMK, Rajamannar Committee 1969 , Emergency 1975-77 1980s-90s Assertive States, judicial correction: Punjab, Assam, AP; Sarkaria 1983 ; Bommai 1994 1990s-2014 Coalitions, economic federalism: 1991 liberalisation; 73rd and 74th Amendments 1992 ; Inter-State Council 1990 2014 on Cooperative and competitive: NITI Aayog 2015, GST Council 2017 (Art 279A), fiscal tensions (GST compensation, cesses, CSS), coalition dependence after 2024 Forms OF Indian Federalism Form Meaning and tools Asymmetric different arrangements for different States: Arts 371-371J , Sixth Schedule Bargaining (W. H. Morris-Jones) continuous negotiation: political, fiscal, institutional (Planning Commission, NDC, now GST Council); risk of inconsistent policy Cooperative GST Council, NITI Governing Council, Finance Commission, Inter-State Council, joint schemes (MGNREGA, RTE); limited by centralisation, party differences, weak institutions, conditional grants Competitive ease of doing business, NITI indices (State Health Index, School Education Quality Index, SDG India Index, India Innovation Index), Vibrant Gujarat, Magnetic Maharashtra; risks: unequal competition, concentration, rivalry Conflictual legislative, administrative (Governor, CBI, forces, AIS), financial (devolution, GST compensation, borrowing), inter-State disputes Way forward / key point Cooperation, competition, bargaining and conflict coexist; the challenge is to keep disagreement from undermining autonomy and cooperation."}, {"c": "17", "n": "Federalism and Centre-State Legislative and Administrative Relations", "id": "2-centre-state-legislative-relations-lists", "t": "2 · Centre-state Legislative Relations · Lists · Residuary · 42nd Amendment · Doctrines", "x": "2 · Centre-state Legislative Relations · Lists · Residuary · 42nd Amendment · Doctrines # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Centre State Relations handout pp. 7-9. Prelims PYQs quoted: none quoted in the material. In simple words Powers are split by territory (Art 245) and subject (Art 246, Seventh Schedule). Parliament holds residuary power (Art 248). The 42nd Amendment moved five subjects to the Concurrent List. Courts reconcile overlaps with pith and substance, colourable legislation and harmonious construction. Distribution OF Powers Art 245 (territory) Parliament: Whole or any part of India State: whole or part of State no Parliament law invalid for operating outside India Territorial nexus: State law can reach outside if real and sufficient connection State of Bihar v. Charusila Dasi (1959) Union List State List Concurrent List Parliament exclusive; national importance States ordinarily exclusive; regional/local both can legislate; uniformity plus flexibility defence, foreign affairs, banking, currency, atomic energy police, public order, public health, agriculture, prisons education, forests, criminal law, marriage, electricity Position Union List prevails when fields overlap and cannot be reconciled Parliament can legislate on State List for Union Territories ( Art 246(4) ) Concurrent conflicts: Art 254 Note Residuary (Art 248): subjects in no list, including residuary taxation, belong exclusively to Parliament. Unlike the USA, where undelegated powers stay with States or people. 42nd Amendment Transfer (1976) Five subjects moved State to Concurrent Education Forests Weights and measures Protection of wild animals and birds Administration of justice (courts other than SC and HC) Memory aid · EFWWA E ducation · F orests · W eights & measures · W ild animals · A dministration of justice. (own mnemonic) Rationale national uniformity cross-border forests and wildlife cooperative legislation Concerns erosion of State autonomy Union supremacy via Art 254 less local responsiveness done during the Emergency without consultation Value addition Sarkaria and Punchhi: consult States before legislating on Concurrent List subjects. Doctrines OF Interpretation Doctrine Meaning Case Pith and substance look at the true nature and purpose; incidental encroachment allowed State of Bombay v. F. N. Balsara (1951) Colourable legislation what cannot be done directly cannot be done indirectly; substance over form K. C. Gajapati Narayan Deo v. Orissa (1953) Harmonious construction read entries together so each has meaning Calcutta Gas Co. v. West Bengal (1962) Federal supremacy if entries truly conflict, Union List prevails (Art 246); Concurrent via Art 254 Ancillary powers power on a subject includes what is needed to make it effective (e.g. tax: assessment, collection) Limits on delegation rule-making can be delegated, but essential legislative policy cannot Memory aid · PCHFAD P ith · C olourable · H armonious · F ederal supremacy · A ncillary · D elegation limits. (own mnemonic)"}, {"c": "17", "n": "Federalism and Centre-State Legislative and Administrative Relations", "id": "3-parliament-on-state-list-repugnancy-art", "t": "3 · Parliament ON State LIST · Repugnancy (Art 254) · Model LAWS · FARM LAWS · Assent TO Bills", "x": "3 · Parliament ON State LIST · Repugnancy (Art 254) · Model LAWS · FARM LAWS · Assent TO Bills # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Centre State Relations handout pp. 9-13. Prelims PYQs quoted: none quoted in the material. In simple words Parliament can enter the State List through Arts 249-253, in a Union Territory, and in President's Rule. Art 254(2) lets a presidentially assented State law prevail. Governors' delay in assent led to the Tamil Nadu case (April 2025) and a Presidential Reference opinion (Nov 2025) that rejected court timelines and deemed assent. Parliament ON State LIST Subjects Article Provision 249 Rajya Sabha resolution by two-thirds present and voting in national interest; valid one year , renewable yearly; law ceases 6 months after; also for GST (Art 246A) 250 during National Emergency ; ceases 6 months after it ends 251 State keeps its power; if conflict, Union law prevails while it lasts 252 two or more States request; resolutions of State Legislatures (both Houses if bicameral); other States may adopt; only Parliament can amend/repeal; e.g. Water (Prevention and Control of Pollution) Act 1974 253 to implement treaties, conventions, decisions of international bodies, even on State List (Punchhi: involve States in treaties) Others 246(4) Union Territories; Art 356 President's Rule Memory aid · 249-250-252-253 249 national interest · 250 Emergency · 252 States request · 253 treaties. (own mnemonic) Repugnancy (article 254) Rules 254(1): State law void to the extent of conflict with a Central law, whether earlier or later 254(2): State law on Concurrent List prevails in that State if reserved for the President and assented But Parliament can later amend, vary or repeal it Courts ask directly conflicting provisions? would obeying one break the other? did Parliament intend to occupy the whole field? different wording alone is not repugnancy Model LAWS AND FARM LAWS Model laws draft laws by the Union that States adopt voluntarily Model Agricultural Land Leasing Act 2016 APLM Act 2017 Model Tenancy Act 2021 Model Prisons and Correctional Services Act 2023 pros: Uniformity with autonomy Cons: uneven adoption, funding incentives, \"soft centralisation\" Farm Laws 2020 State List Entry 14 (agriculture) and 28 (markets and fairs) Union relied on Concurrent List Entry 33 (trade in foodstuffs) States objected: Encroachment, loss of APMC fees, MSP fears, no consultation Punjab and others passed modifying laws (Art 254) Repealed 2021 Supreme Court never finally decided legislative competence lesson: consult States Assent TO State Bills (articles 200, 201) Provisions Art 200: Governor may assent, withhold (return a non-Money Bill), or reserve for the President Must reserve a Bill that would endanger the High Court's position Art 201: President may assent, withhold or direct reconsideration (non-Money Bill) delays can obstruct elected legislatures April 2025 Tamil Nadu Governor case (two judges): no pocket or absolute veto; fixed timelines for Governor and President; used Art 142 to declare 10 Bills deemed assented Nov 2025 16th Presidential Reference (five judges, Art 143): Governor has three options with discretion; no judicial timelines ; no deemed assent via Art 142 ; limited mandamus to act within reasonable time for indefinite inaction; decisions not challengeable on merits before Bill becomes law Note The Nov 2025 opinion did not undo the 10 Tamil Nadu Bills' validity, but its reasoning on timelines and deemed assent replaced the April 2025 reasoning as precedent. (current affairs; verify) Commissions AND WAY Forward Sarkaria on legislation strong Centre but no over-centralisation legislate on Concurrent List only where uniformity is needed, after consulting States Keep residuary taxation with the Union Other residuary matters to Concurrent List keep Art 249 as it is Centre to decide on reserved Bills within four months Liberal Art 254(2) Framework laws Pre-legislative consultation via Inter-State Council Way forward avoid unnecessary entry into State List consultation on Concurrent List and treaties transparent assent rules strengthen Rajya Sabha for State interests prefer model laws use ISC and GST Council"}, {"c": "17", "n": "Federalism and Centre-State Legislative and Administrative Relations", "id": "4-centre-state-administrative-relations-di", "t": "4 · Centre-state Administrative Relations · Directions · AIS · Councils · BSF · Commissions", "x": "4 · Centre-state Administrative Relations · Directions · AIS · Councils · BSF · Commissions # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Centre State Relations handout pp. 13-18. Prelims PYQs quoted: none quoted in the material. In simple words Executive power follows legislative power, but the Union can direct States (Arts 256, 257, 365). All-India Services, the Inter-State Council (Art 263), Zonal Councils and NEC coordinate. Friction: broad directions, AIS control, BSF jurisdiction (2021), Union ministries on State subjects. Union Control AND Delegation Article Provision 256 States must ensure compliance with Parliament's laws; Union may direct 257 States must not impede Union executive power; directions on communications of national/military importance and railway protection; Union compensates costs 339(2) directions on ST welfare schemes 347 President can direct a State to recognise a language 350A mother-tongue primary instruction; President may direct 365 failure to follow valid directions: President may find constitutional machinery has failed (does not automatically justify Art 356) 258 President with State consent entrusts Union functions to States; Union compensates 258A Governor with Union consent entrusts State functions to Union Emergencies Art 352: Union directions even on State matters Art 356: President assumes State executive functions Art 360: financial propriety, salary cuts, reserve financial Bills All-india Services AIS Art 312: Rajya Sabha two-thirds resolution to create Existing: IAS, IPS, IFoS benefits: administrative unity, national integration, expertise, policy coordination issues: dual control , central deputation, political transfers, cadre shortages, State autonomy reform: consultation, cadre planning, independence, transparent transfers Coordination Institutions Inter-State Council (Art 263) set up 1990 on Sarkaria's advice PM chair CMs of States, CMs of UTs with legislatures, Administrators of other UTs, specified Union ministers inquire into State disputes, discuss common interests, recommend coordination Advisory Infrequent meetings, weak follow-up, overlap with GST Council and NITI. Sarkaria: permanent ISC Punchhi: strengthen it Zonal Councils five, under the States Reorganisation Act 1956 Union Home Minister chairs CMs are members and rotating vice-chairs Two other ministers per State UT representatives aims: curb acute State consciousness and regionalism, habit of cooperation, solve inter-State problems, regional development North Eastern Council NEC Act 1971 Eight North-Eastern States Regional planning, infrastructure Others NITI Governing Council GST Council (Art 279A) Empowered Committee of State Finance Ministers (VAT, GST transition) National Integration Council Chief Secretaries' and DGP conferences Issues Directions (Arts 256, 257) vague and broad, reduce autonomy, political misuse, Art 365 threat Punchhi: treat as last-resort safeguards, after consultation and warning BSF jurisdiction (2021) BSF Act 1968, Section 139 notifications Punjab, West Bengal, Assam: 15 km to 50 km Gujarat: 80 to 50 km Rajasthan: 50 km unchanged Entire specified North-East States, J&K, Ladakh Only specified statutory powers Not general police or public order Union: infiltration, smuggling, trafficking, uniformity, quick response. States: police is State List , no consultation (Punjab, West Bengal), overlap, civil liberties Union ministries on State subjects for: national standards, pandemics and pollution, CSS funds, expertise (COVID-19) against: encroachment, one-size-fits-all, fiscal dependence, centralisation (e.g. Ministry of Cooperation ) NITI Sub-Group of CMs on CSS: rationalise schemes, flexibility Commission Administrative recommendations Sarkaria (1983-88) restrained use of Arts 256-257; permanent ISC under Art 263; prior consultation; Art 356 last resort Punchhi (2007-10) directions as safety valves; stronger ISC with dispute-resolution role; regular Zonal Councils; Forum of CMs chaired by rotation for sectors (energy, food, education, environment, health); consult on central forces Way forward / key point Way forward: revive ISC and Zonal Councils; directions only where necessary; clear CBI consent procedures; reform AIS cadre management; BSF-police protocols; rationalise CSS."}, {"c": "17", "n": "Federalism and Centre-State Legislative and Administrative Relations", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. India is a ___ federation holding-together Wheare called it quasi-federal Austin stressed cooperative federalism Bargaining federalism W. H. Morris-Jones Rajamannar Committee 1969, Tamil Nadu Inter-State Council set up 1990 NITI Aayog 2015 Territory article Art 245 Lists article Art 246 Residuary power Art 248, Parliament Five subjects moved in 1976 education, forests, weights/measures, wild animals, administration of justice Pith and substance case F. N. Balsara 1951 Colourable legislation case Gajapati Narayan Deo 1953 Harmonious construction case Calcutta Gas 1962 Art 249 vote two-thirds present and voting; one year Art 252 example Water Act 1974 Art 253 international agreements Art 254(2) presidential assent to State law Farm Laws repealed 2021 TN Governor case April 2025, 10 Bills deemed assented Presidential Reference Nov 2025, no timelines, no deemed assent Sarkaria on reserved Bills Centre decides within four months Union directions articles 256, 257 (and 365) Delegation Union to States Art 258 Delegation States to Union Art 258A ISC set up 1990, Art 263 Zonal Councils five, 1956 Act NEC Act 1971 BSF new limit 50 km in Punjab, West Bengal, Assam Punchhi idea Forum of Chief Ministers"}, {"c": "17", "n": "Federalism and Centre-State Legislative and Administrative Relations", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts in Start Here)"}, {"c": "17", "n": "Federalism and Centre-State Legislative and Administrative Relations", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards"}, {"c": "18", "n": "Governor, Article 356, Fiscal Federalism and Inter-State Relations", "id": "1-office-of-the-governor-president-s-rule", "t": "1 · Office OF THE Governor · President's RULE · Article 356 · Bommai · Financial Emergency", "x": "1 · Office OF THE Governor · President's RULE · Article 356 · Bommai · Financial Emergency # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Centre State Relations handout pp. 18-23. Prelims PYQs quoted: none quoted in the material. In simple words The Governor is an appointed constitutional head and a Union-State link, which makes the office contested. Art 356 was often misused until Bommai (1994) made proclamations reviewable. Commissions prefer reforming, not abolishing, the Governor. Constitutional Position Article Provision 153 a Governor for each State; one person can serve two or more 155 appointed by the President by warrant under hand and seal 156 holds office during the pleasure of the President ; normal term 5 years 157 Indian citizen, 35 years 158 not an MP/MLA, no office of profit 159 oath before the High Court Chief Justice or senior-most judge Why appointed avoid dual authority with the CM parliamentary system needs a constitutional head national integration link avoids cost of elections for a nominal post Discretion Art 163 Ministers aid and advise except where the Governor must act in discretion Discretion must have a constitutional basis and is subject to review Constitutional discretion reserving Bills (Art 200) Administrator of a UT (Art 239) Sixth Schedule, Arts 371-371J roles Situational discretion hung Assembly: whom to invite floor test on credible doubt alternative government report for Art 356 Issues WITH THE Office Issues Political appointees Doctrine of pleasure insecurity interference: CM choice, summoning Assemblies delay in assent controversial 356 reports two competing centres of authority Note Counter: Governors have real duties in hung Assemblies, breakdowns and constitutionally sensitive Bills; not all intervention is misuse. B. P. Singhal v. Union (2010) Governor can be removed without public reasons, but not arbitrarily or capriciously A change of government at the Centre alone is not enough Hung Assembly Risk of favouring one side and encouraging defections Principle: floor test Reform: objective conventions and prompt floor tests Nabam Rebia v. Deputy Speaker (2016) Art 174 summon, prorogue, dissolve: Governor generally acts on ministerial advice Cannot interfere in legislative proceedings over political disagreement President's RULE (article 356) Procedure and effect When State government cannot be carried on per the Constitution On Governor's report or other information Parliament approves within two months lasts 6 months , extendable to a maximum of 3 years (conditions beyond one year) President takes executive functions Ministry usually ceases Parliament exercises legislative power Assembly suspended or dissolved High Court powers cannot be taken over Misuse dismissal for political difference Governors' reports with political motives majority tested outside the Assembly erosion of federalism. Examples: Kerala 1959 1977 and 1980 dismissals after Centre changed 1992 after Babri Masjid Way forward / key point S. R. Bommai v. Union (1994), nine judges: federalism is Basic Structure; proclamation judicially reviewable ; majority to be tested on the floor ; satisfaction must rest on relevant material ; courts may restore a dismissed government and Assembly. Rameshwar Prasad v. Union (2006) Dissolution of the Bihar Assembly (2005) held unconstitutional Reports cannot rest on unsupported assumptions Financial Emergency (Art 360) if financial stability or credit of India is threatened Parliament approves within two months Continues until revoked Never proclaimed Union may direct financial propriety, salary reductions, reserving Money/Financial Bills Reforms Body Recommendations Sarkaria eminent person from outside the State, detached from politics, not ruling-party politician in opposition State; consult CM; keep 5-year tenure; Art 356 last resort, warn first, prefer floor test Punchhi fixed 5 years; delete \"during the pleasure of the President\" from Art 156; impeachment-type removal by State Legislature ; define discretion; limit Chancellor-role controversy; six months to decide reserved Bills; localised emergency instead of whole State NCRWC 2002 appointment consulting PM, Home Minister, Lok Sabha Speaker and the State CM; security of tenure; neutrality Abolish colonial legacy political interference unaccountable unneeded discretion Retain Union-State link neutral umpire in hung Assemblies sensitive/tribal regions continuity Way forward / key point Preferred route: reform, not abolition: consultative appointment, security of tenure, limited discretion, no delay in Bills, less conflict over universities, 356 as exception."}, {"c": "18", "n": "Governor, Article 356, Fiscal Federalism and Inter-State Relations", "id": "2-fiscal-federalism-divisible-pool-cess-fi", "t": "2 · Fiscal Federalism · Divisible POOL · CESS · Finance Commission · 15th AND 16th FC", "x": "2 · Fiscal Federalism · Divisible POOL · CESS · Finance Commission · 15th AND 16th FC # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Centre State Relations handout pp. 23-26. Prelims PYQs quoted: none quoted in the material. In simple words The Union holds major revenues while States hold major spending, so transfers are needed. The Finance Commission (Art 280) recommends vertical and horizontal devolution. 15th FC: 41%; 16th FC (Panagariya, 2026-31) kept 41% and added a GDP-contribution criterion. Fiscal Imbalance AND Transfers Vertical imbalance Union has revenue powers, States have spending duties dependence on transfers Horizontal imbalance States differ in income, population, geography Poorer States need more FC equalises Divisible pool (Art 270) shareable Union taxes excluding cesses, surcharges, certain separately assigned taxes, and collection costs a 41% share does not mean 41% of the Centre's gross tax revenue Cess and surcharge (Art 271) surcharge: Extra on an existing tax Cess: tax for a specific purpose Proceeds generally outside the pool, so the Union keeps them Rising reliance is a major grievance Grants-in-aid Art 275: grants per the Finance Commission Art 282: grants for any public purpose, even outside legislative competence excess conditional/discretionary transfers reduce autonomy Finance Commission (article 280) Set-up Constituted by the President every five years Chairperson + four members FC (Miscellaneous Provisions) Act 1951 : Chair with public affairs experience Members from law, finance and accounts, financial administration, economics Functions vertical devolution (Union-States share of pool) horizontal devolution (among States) grants-in-aid principles supplement resources of Panchayats and Municipalities (based on SFC reports) other matters referred by the President Vertical Horizontal pool split between Union and States as a group; fixes vertical imbalance States' share split among States; fixes horizontal imbalance; income distance, population, area, forest cover 15th FC (2021-26), N. K. Singh 41% (down from 42% because J&K became a Union Territory) criteria: 2011 population, income distance, area, forest and ecology, demographic performance, tax effort revenue deficit grants for 17 States Local body grants Disaster corpus about Rs 1.6 lakh crore Sectoral and performance grants 16th FC (2026-31), Dr Arvind Panagariya Report submitted 17 Nov 2025 Tabled 1 Feb 2026 41% retained Union accepted Union Budget 2026-27 provides Rs 1.4 lakh crore FC grants Criterion 15th FC 16th FC Income distance 45% 42.5% Population (2011) 15% 17.5% Demographic performance 12.5% 10% Area 15% 10% Forest 10% 10% Tax and fiscal effort 2.5% — Contribution to GDP — 10% Total 100% 100% Note Reading the shift: income distance still highest; population weight up; demographic performance down; GDP contribution newly rewards economic output ; debate over relative State shares continues. 16th FC grants 2026-31 Amount Rural local bodies Rs 4,35,236 crore Urban local bodies Rs 3,56,257 crore Disaster management grants Rs 1,55,916 crore Total about Rs 9.47 lakh crore Rs 9,47,409 crore Other 16th FC points dropped separate revenue-deficit, sector-specific and State-specific grants local body grants: basic and performance-linked disaster corpus Rs 2,04,401 crore (incl. States' contribution) transparent accounting of off-budget borrowings Union fiscal deficit 3.5% of GDP by 2030-31 State limit 3% of GSDP a year Value addition Current-affairs figures from the handout; verify against the report."}, {"c": "18", "n": "Governor, Article 356, Fiscal Federalism and Inter-State Relations", "id": "3-gst-council-niti-aayog-special-category", "t": "3 · GST Council · NITI Aayog · Special Category Status · Fiscal Issues · Commissions", "x": "3 · GST Council · NITI Aayog · Special Category Status · Fiscal Issues · Commissions # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Centre State Relations handout pp. 26-31. Prelims PYQs quoted: none quoted in the material. In simple words GST (101st Amendment, 1 July 2017) is shared taxation run by the GST Council, where neither side can win alone. NITI Aayog replaced the Planning Commission as a think tank. Special Category Status has no constitutional basis and has faded since 2015. Fiscal friction: cesses, CSS, borrowing limits, off-budget debt. GST AND Federalism Framework 101st Amendment 2016 In force 1 July 2017 Art 246A GST law-making by both Art 269A IGST on inter-State supplies Art 279A GST Council GST Council Chair: Union Finance Minister Member: Union MoS for Revenue/Finance Members: State Finance/Taxation Ministers votes: Union one-third, States collectively two-thirds Decisions need three-fourths of weighted votes of members present and voting, so neither side can decide alone Benefits cooperative decisions common national market harmonised rates IGST sharing framework Issues loss of State tax autonomy dependence on Council unequal revenue capacity Union influence through its voting weight Note Union of India v. Mohit Minerals (2022): GST Council recommendations are not binding on Parliament and State Legislatures; both have legislative power over GST; cooperative federalism by dialogue. NITI Aayog Basics Set up 1 January 2015 , replacing the Planning Commission Non-constitutional, non-statutory think tank Cooperative and competitive federalism Bottom-up planning Research Aspirational Districts Programme Basis Planning Commission NITI Aayog Set up 1950 2015 Nature central planning body policy think tank Approach top-down bottom-up consultation Role Five-Year Plans, resource allocation advice, monitoring, coordination Funds influenced Plan transfers does not allocate Plan funds Federal approach relatively centralised cooperative and competitive Limits no financial authority advisory limited State influence overlap with ministries and other forums Special Category Status (SCS) Basics Created in the planning framework No constitutional or statutory basis criteria: hilly terrain, low density or sizeable tribal population, strategic border location, backwardness, non-viable finances benefits: preferential Normal Central Assistance, 90:10 grant-loan, extra scheme support, tax concessions After 2015 Planning Commission replaced Normal Central Assistance ended 14th FC raised untied devolution SCS lost most meaning different from Arts 371-371J Raghuram Rajan Committee 2013: Composite Development Index States as relatively developed / less developed / least developed demands continue Issues IN Fiscal Relations Issue Point Way forward Vertical imbalance dependence, limited freedom predictable devolution, untied transfers Cess/surcharge excluded from pool, weakens devolution rationalise, transparency Unequal capacity rich vs poor, costlier hill/forest States equalisation with geography Conditional grants / CSS matching funds, less flexibility, duplication NITI CM sub-group: rationalise; untied aid GST less rate flexibility, revenue shortfalls consultation, compliance, predictability Borrowing (Art 293) States with Union loans/guarantees need consent; fiscal limits transparent, predictable rules Off-budget borrowing hidden liabilities via PSUs, SPVs, guarantees 16th FC: stricter accounting Delays in transfers budget disruption timely releases FC and population 2011 Census worries States with slower growth; counter: populous States have more needs balance population, income distance, demography Populist spending subsidies squeeze capital expenditure efficiency, medium-term planning Body View on fiscal federalism Sarkaria fair, predictable transfers; restraint on cess/surcharge; FC's role; State consultation Punchhi concern over cess/surcharge in pool; State participation in financial decisions; rationalise CSS; State-specific borrowing; coordination Rajan 2013 Composite Development Index; aid to less developed States Way forward predictable devolution and untied grants rationalise cess and surcharge horizontal equity reform CSS coordinate FC, GST Council, NITI, SFCs responsible borrowing bring off-budget debt into reporting strengthen local governments"}, {"c": "18", "n": "Governor, Article 356, Fiscal Federalism and Inter-State Relations", "id": "4-inter-state-relations-water-disputes-bou", "t": "4 · Inter-state Relations · Water Disputes · Boundaries · Language · Articles 371-371J", "x": "4 · Inter-state Relations · Water Disputes · Boundaries · Language · Articles 371-371J # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Centre State Relations handout pp. 31-36. Prelims PYQs quoted: none quoted in the material. In simple words Inter-State ties rest on Arts 131, 261, 262, 263, 301-307 and 3. Water disputes (Cauvery, Krishna, Ravi-Beas, Mahadayi, Mahanadi) and boundary disputes (Maharashtra-Karnataka, Assam-Meghalaya, Assam-Arunachal) need better data, faster tribunals and Zonal Councils. Asymmetry runs through Arts 371-371J and the Sixth Schedule. Constitutional Framework Article Provision 131 Supreme Court original jurisdiction in specified Union-State and inter-State disputes 261 Full Faith and Credit to public acts, records, judicial proceedings 262 adjudication of inter-State river disputes; can bar court jurisdiction 263 Inter-State Council 301-307 freedom of trade, commerce, intercourse 3 new States and boundary changes Water Disputes Laws Inter-State River Water Disputes Act 1956: Tribunals on Union reference after failed talks Published awards bind River Boards Act 1956: boards for inter-State rivers, never effectively operationalised Dispute States Issue Cauvery Karnataka, Tamil Nadu, Kerala, Puducherry allocation, seasonal releases Krishna Maharashtra, Karnataka, Telangana, Andhra Pradesh allocation and redistribution Ravi-Beas Punjab, Haryana, Rajasthan sharing, Sutlej-Yamuna Link Canal Mahadayi Goa, Karnataka, Maharashtra diversion Mahanadi Odisha, Chhattisgarh upstream use, downstream availability Cauvery Tribunal award 2007 2018 Supreme Court modified allocation, retaining 740 TMC ft in a normal year implementation bodies: CWMA and CWRC Problems tribunal delay weak enforcement politicisation poor data sharing fragmented project planning climate stress Note Inter-State River Water Disputes (Amendment) Bill 2019 (proposals only): Disputes Resolution Committee, a single permanent tribunal with benches, time limits, data management. Not an operating system yet. Way forward early mediation time-bound adjudication transparent flow data river-basin management climate adaptation enforcement of awards Boundary Disputes Rules Art 3: Parliament may alter areas and names Affected Legislature is consulted, consent not mandatory Art 131 for legal-rights disputes Dispute Detail Maharashtra-Karnataka Belagavi and linguistic/territorial claims Assam-Meghalaya MoU 2022 settled 6 of 12 areas Assam-Arunachal MoU 2023 on 123 villages Causes and fixes colonial boundaries, linguistic identity, overlapping administration, political mobilisation, delay Bilateral talks Union as facilitator Scientific demarcation Zonal Councils Local participation Language AND Federalism Article Provision 343 Hindi in Devanagari: Union official language 345 State official language(s) 346 language for Union-State communication 347 recognition of a language of a substantial section of a State 350 representation for grievance redress in any language used 350A mother-tongue primary instruction 350B Special Officer for Linguistic Minorities 351 development of Hindi Value addition India has no constitutionally declared national language ; Hindi is the Union official language and English continues for official use. Issues Hindi imposition fears (South) medium of instruction linguistic minorities administrative barriers regional identity Asymmetric Federalism Article State Provision 371 Maharashtra, Gujarat development boards, regional development 371A Nagaland customary, social, land matters 371B Assam Assembly committee for tribal areas 371C Manipur hill areas administration 371D Andhra Pradesh, Telangana equitable opportunities in jobs and education 371F Sikkim protections after integration 371G Mizoram customary and land matters 371H Arunachal Pradesh Governor's special responsibility for law and order 371I Goa minimum Assembly size 371J Karnataka Kalyana Karnataka development Memory aid · MNAMASMAGK 371: M aha-Guj · N agaland A · A ssam B · M anipur C · A ndhra D · S ikkim F · M izoram G · A runachal H · G oa I · K arnataka J. (own mnemonic) Sixth Schedule Autonomous District and Regional Councils in tribal areas of Assam, Meghalaya, Tripura, Mizoram Local administration, customs, land Significance protects diversity regional autonomy national integration conflict management Challenges demands for similar benefits administrative complexity special status does not ensure development identity sensitivity Inter-State challenges and way forward resources, regionalism, unequal development, weak dispute resolution, weak forums, migration, climate strengthen ISC and Zonal Councils, water-dispute reform, free inter-State trade, protect linguistic diversity, meaningful autonomy"}, {"c": "18", "n": "Governor, Article 356, Fiscal Federalism and Inter-State Relations", "id": "5-challenges-to-federalism-emerging-issues", "t": "5 · Challenges TO Federalism · Emerging Issues · Reforms · Commissions · Assessment", "x": "5 · Challenges TO Federalism · Emerging Issues · Reforms · Commissions · Assessment # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Centre State Relations handout pp. 36-42. Prelims PYQs quoted: none quoted in the material. In simple words Challenges are political, legislative, administrative, financial and institutional. New ones are delimitation, climate, public health, migration and weak local government. Four commissions (Rajamannar, Sarkaria, NCRWC, Punchhi) shape reform: restraint, consultation, fair finance and strong forums. FIVE Layers OF Challenge Layer Issues Political national high commands; different parties at Centre and State; party discipline over State concerns in Rajya Sabha; unequal bargaining Legislative broad entries (Farm Laws); Art 254 dominance; thin consultation; Art 200-201 delays; Art 253 treaties Administrative Arts 256-257; AIS disputes; CBI general consent withdrawn by States ; BSF jurisdiction; Union ministries in State subjects Financial vertical imbalance; cesses; CSS; GST autonomy loss; Art 293 borrowing Institutional rare ISC meetings; non-binding advice; weak follow-up; no general pre-legislative consultation; overlapping forums Memory aid · PLAFI Five layers: P olitical · L egislative · A dministrative · F inancial · I nstitutional. (own mnemonic) Emerging Challenges Delimitation Arts 81, 82, 170 42nd Amendment 1976: froze seat allocation on 1971 Census 84th Amendment 2001: freeze until first Census after 2026 87th Amendment 2003: boundaries readjusted on 2001 Census, no change in State allocation issues: population vs demographic performance, regional balance, bargaining power, equal population per seat, link to women's reservation (106th Amendment) Note 131st Amendment Bill 2026 : introduced 16 April 2026 ; defeated in Lok Sabha on 17 April 2026 . Proposed 550 to 850 seats (815 States, 35 UTs), Census by legislation, easier women's quota. (current affairs; verify) Climate and environmental federalism Shared pollution, disasters, unequal vulnerability, thin State resources Example Delhi-NCR air Fix: coordination, river-basin and airshed planning, funding, flexibility Public health federalism Health is a State subject COVID-19 showed need for coordination Unequal capacity Uniform guidelines Fix: cooperative planning, surveillance, funding Migration jobs for locals, linguistic tension, benefit portability, inter-State labour coordination Local self-government 73rd and 74th Amendments 1992 Incomplete devolution of functions, funds, functionaries Financial dependence Weak State Finance Commissions Parallel agencies. Federalism also needs decentralisation below the State Reform Agenda Area Reforms Institutional revive ISC and Zonal Councils; sectoral forums; follow-up mechanisms Legislative avoid State List; consult on Concurrent List; use Art 254(2); strengthen Rajya Sabha; consult on treaties Administrative restrain Arts 256-257; reform Governor; AIS deputation; Central agency
