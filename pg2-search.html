oyees Nagaraja 2014 Jallikattu ban upheld; biocentric view 2023 Jallikattu case State amendments upheld by five judges Art 21A inserted by 86th Amendment 2002; in force 1 April 2010 Art 45 now early childhood care below six Ordinary arrest rights ILPM Time to Magistrate 24 hours Arnesh Kumar 2014 police must justify arrest; up to seven years Pankaj Bansal 2023 grounds in writing (PMLA) 22(3) exceptions enemy aliens, preventive detainees Advisory Board limit three months 44th Amendment 1978 changes two months, never in force Entry for preventive detention Union List 9 and Concurrent List 3 NCRWC cap six months Laws in force COFEPOSA, NSA, PBM Act Arts 23 and 24 apply against State and private persons PUDR 1982 below minimum wage can be forced labour Bandhua Mukti Morcha 1984 bonded labour release and rehabilitation Bonded Labour Act year 1976 ITPA year 1956 Is voluntary adult sex work an offence? not itself, under ITPA Buddhadev Karmaskar 2022 equal protection, dignity for sex workers Adolescent age band 14 to 18 Child labour exceptions 2016 family enterprise and audio-visual entertainment (not circus)"}, {"c": "10", "n": "Death Penalty, Articles 21A, 22, 23 and 24", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts in Start Here)"}, {"c": "10", "n": "Death Penalty, Articles 21A, 22, 23 and 24", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards"}, {"c": "11", "n": "Religion, Secularism, Minorities and the Waqf Act", "id": "1-articles-25-26-conversion-essential-reli", "t": "1 · Articles 25-26 · Conversion · Essential Religious Practices · Temples", "x": "1 · Articles 25-26 · Conversion · Essential Religious Practices · Temples # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Fundamental Rights 2 handout pp. 26-30. Prelims PYQs quoted: none quoted in the material. In simple words Art 25 protects conscience and the right to profess, practise and propagate, but propagation is not a right to convert (Stainislaus). Art 26 protects denominations. Courts use the Essential Religious Practices test, with Santhara, Sabarimala and temple control as live examples. FOUR Articles AT A Glance Art Protects 25 freedom of conscience; profess, practise, propagate religion 26 freedom to manage religious affairs 27 no tax for promoting a particular religion 28 religious instruction and worship in educational institutions Article 25 AND Conversion Art 25 subject to public order, morality, health and other Fundamental Rights State may regulate economic, financial, political and other secular activity linked to religion and make welfare and reform laws Note Rev. Stainislaus v. State of Madhya Pradesh (1977): right to propagate does not include a Fundamental Right to convert another person ; upheld laws against conversion by force, fraud or inducement . Criticisms propagation becomes a hollow right religion is a matter of conscience allurement is hard to define burden of proof on voluntariness State laws Several States ban conversion by force, fraud, coercion, some inducement Some need notice or declaration Gujarat Freedom of Religion (Amendment) Act, 2021: Linked conversion with interfaith marriage Reporting and investigation Gujarat HC stayed parts on interfaith marriage without proof of force, fraud or allurement Issue: State may stop forced conversion but not intrude on conscience, privacy, choice Article 26 AND Essential Religious Practices Art 26 denominations may establish and maintain institutions , manage religious affairs , and own and administer property as per law (26(c), (d)) ERP doctrine (Shirur Mutt, 1954) is it essential or integral to the religion? within protected religious affairs? subject to public order, morality, health, other rights ? religious or really a secular activity the State can regulate? Memory aid · EPSR ERP test: E ssential part? · P rotected sphere? · S ubject to limits? · R eligious or secular? (own mnemonic) Issues with ERP courts lack theological competence may privilege some practices black-and-white answers on diverse beliefs Reform vs autonomy Balance religious freedom, equality, constitutional morality, reform LIVE Examples Santhara (Nikhil Soni, 2015) Rajasthan HC declared the Jain fast-to-death unlawful, not an ERP Supporters: spiritual discipline, not suicide , autonomy SC stayed the judgment in 2015, so the HC ban is not operative 2016 Haji Ali Dargah: Bombay HC upheld women's right to enter the inner sanctum 2016 Shani Shingnapur: Bombay HC stressed women's access; women entered 2018 Sabarimala: SC 4:1 held exclusion of women of menstruating age unconstitutional 2019 review: larger questions on religious freedom and ERP referred to a larger Bench 2026 nine-judge bench heard the reference; reserved judgment May 2026 (verify) Four competing dimensions individual vs State individual vs individual group vs State State regulation in public interest Loudspeakers and Azaan (Allahabad HC, 2020) Azaan is religiously significant but loudspeakers are not essential Azaan by human voice continues Loudspeakers can be regulated for noise pollution Religious Property AND Temple Management Shirur Mutt principles religious autonomy in protected affairs State may regulate economic, financial, administrative activity donations, accounts, property can be regulated but no excessive interference (judicial review) For regulation Against excess regulation financial transparency and accountability weakens religious autonomy stops misuse of donations and property bureaucratisation, political interference protects devotees, promotes reform excessive State control Models and cases SGPC: historic Gurdwaras under the Sikh Gurdwaras Act, 1925 , with elected community participation Char Dham Devasthanam Act, 2019 (Uttarakhand): Board over major shrines Repealed 2021 after opposition Sree Padmanabhaswamy (2020): SC upheld Travancore Royal Family's traditional management with court-set arrangement temples with different arrangements: Tirupati, Jagannath, Vaishno Devi, Badrinath, Kedarnath Property 26(c), (d) own and administer property per law Art 300A: no deprivation of property except by authority of law religious property is not immune from lawful acquisition for public purposes, but must respect religious character"}, {"c": "11", "n": "Religion, Secularism, Minorities and the Waqf Act", "id": "2-articles-27-28-secularism-communalism", "t": "2 · Articles 27-28 · Secularism · Communalism", "x": "2 · Articles 27-28 · Secularism · Communalism # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Fundamental Rights 2 handout pp. 30-33. Prelims PYQs quoted: none quoted in the material. In simple words Art 27 bars taxes that promote a religion; Art 28 bars religious instruction in wholly State-funded schools. India follows principled distance, not strict separation. Communalism, narrow secularism and weak institutions threaten it; the cure is acceptance, scientific temper, rule of law and inclusive development. Articles 27 AND 28 Art 27 no one compelled to pay taxes whose proceeds go to promote a particular religion a regulatory fee for administering religious institutions is not automatically barred Institution (Art 28) Religious instruction wholly State-funded prohibited, subject to 28(2) State-administered but set up under a religious endowment or trust permitted where the trust requires it State-aided or recognised permitted, but no compulsion without prescribed consent (28(3)) Education vs instruction Aruna Roy (2002): religious education (about religions, philosophy, ethics) is not prohibited religious instruction (promoting adherence to one religion) D. A. V. College (1971): teaching the life and teachings of Guru Nanak is not automatically prohibited instruction Against compulsory prayers freedom of conscience Art 28 scientific temper For ethical values Indian culture value-based education Way forward / key point Way forward: inclusive, voluntary , value-based practice without imposing one community's beliefs. Secularism Meaning George Jacob Holyoake popularised the term State not controlled by religion Freedom to follow, change or not follow a religion No discrimination on religion Indian model \"Secular\" added to the Preamble by the 42nd Amendment, 1976 Spirit present from the start not strict separation: Principled Distance ( Rajeev Bhargava ): neither hostile to nor merged with religion Engages for welfare, equality, reform features: No theocracy Religious freedom Equality of religions Principled intervention Protection of diversity basis: Preamble, Arts 14-16, 25-28, 29-30, 51A Cases S. R. Bommai (1994): secularism is part of the Basic Structure Balram Singh (2024): rejected challenges to \"Socialist\" and \"Secular\" in the Preamble Country Model India principled distance, equal freedom, intervention for reform USA constitutional separation of Church and State France laïcité : secular public institutions, limits on public religious display (response to Church power) UK established Church with broad religious freedom Why secularism matters J. S. Mill: harm principle, individual freedom John Rawls: veil of ignorance, fairness peace and harmony scientific temper and reform democracy : equal participation Memory aid · IFPMD Importance: I ndividual freedom (Mill) · F airness (Rawls) · P eace · M odernity · D emocracy. (own mnemonic) Communalism Meaning and types Using religious identity to create divisions and competing political interests Treats communities as homogeneous and conflicting Majority communalism (may pose as nationalism) and minority communalism (separatism, polarisation) Both threaten secularism and integration Challenges to secularism narrow conception: State-centric, tolerance not acceptance, ignores intra-religious (caste, sect) divides extreme religiosity and polarisation: Ritual and costume differences Mobilisation on religious identity Demonisation, mob violence failure of institutions: family, education, political parties weak law: no single Central law on communal violence, prevention, rehabilitation, compensation developmental imbalances: insecurity from unequal opportunity Memory aid · NEFLD Challenges: N arrow concept · E xtreme religiosity · F ailing institutions · L aw gaps · D evelopment gaps. (own mnemonic) Note Sachar Committee (2006): documented Muslims' disadvantages in education, employment, credit, public-sector representation ; urged equitable development. Amartya Sen: people have multiple identities ; a singular identity breeds hostility and blocks cooperation. Measures acceptance over tolerance scientific temper and constitutional morality rule of law against violence and discrimination inclusive development constructive social work like Gandhi's"}, {"c": "11", "n": "Religion, Secularism, Minorities and the Waqf Act", "id": "3-articles-29-30-minority-education-rte-am", "t": "3 · Articles 29-30 · Minority Education · RTE · AMU", "x": "3 · Articles 29-30 · Minority Education · RTE · AMU # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Fundamental Rights 2 handout pp. 34-38. Prelims PYQs quoted: none quoted in the material. In simple words Art 29(1) protects any section's culture (not only minorities); 29(2) bars discrimination in admission. Art 30 lets minorities run their institutions but not maladminister. Minority status is State-wise (TMA Pai). Pramati exempted minority schools from RTE; AMU (2024) overruled Azeez Basha. Articles 29 AND 30 Safeguards for minorities common domain: Preamble, Arts 14-16, 25-28, 46, Fundamental Duties special domain: Arts 29, 30 15(5) excludes Art 30(1) minority institutions from its special admission rules Clause Content 29(1) any section of citizens with a distinct language, script or culture may conserve it; not only minorities 29(2) no denial of admission to State-maintained or aided institutions on religion, race, caste, language only 30(1) religious and linguistic minorities may establish and administer educational institutions of choice 30(1A) protects the right on compulsory acquisition of property 30(2) no discrimination in State aid because of minority management Value addition Right to administer is not right to maladminister. State may regulate standards, qualifications, transparency. WHO IS A Minority Note T. M. A. Pai Foundation (2002): for Art 30, minority status (religious and linguistic) is determined State-wise , not nationally. E.g. Hindus are a religious minority in Punjab, Nagaland, Mizoram . The Centre's notified list is statutory, for schemes and institutions. Six notified religious minorities Muslims Christians Sikhs Buddhists Zoroastrians (Parsis) Jains (notified 2014) Memory aid · MCSBZJ Six minorities: M uslims · C hristians · S ikhs · B uddhists · Z oroastrians · J ains. (own mnemonic) Linguistic minorities Art 347: President may direct recognition of a language on substantial demand Art 350A: mother-tongue instruction at primary stage Art 350B: Special Officer appointed by the President Report laid before Parliament and sent to States Institutions NCM: statutory, National Commission for Minorities Act, 1992 NCMEI: NCMEI Act, 2004 , on minority status and educational rights Regulation AND RTE 29(2) vs 30(1) Aided minority institutions may give reasonable preference to their community but cannot exclude all others State may regulate admission for merit and transparency Unaided institutions have more flexibility with fair, non-exploitative admission Note Sk. Md. Rafique (2020): West Bengal Madrasah Service Commission Act: teacher selection through a statutory commission is not automatically unconstitutional for minority institutions; regulation must not extinguish Art 30 rights. Note Pramati Educational and Cultural Trust (2014): RTE s.12(1)(c) (25% entry seats for weaker sections) cannot be applied to minority institutions in a way that impairs Art 30(1); aided and unaided minority institutions exempted . Critics: RTE aims at social inclusion ; exemption reduces opportunity. Suggestion: admit weaker children from their own community. Note Anjuman Ishaat-e-Taleem Trust (Sept 2025) (verify): SC doubted the blanket exemption ; read Arts 21A and 30 harmoniously ; RTE need not destroy minority character; called for larger Bench . Pramati stays binding until altered. Aligarh Muslim University 1877 Muhammadan Anglo-Oriental College (Sir Syed Ahmad Khan); AMU Act, 1920 makes it a university 1967 S. Azeez Basha: not a minority institution because established by statute 1981 AMU Amendment Act recognises the Muslim community's role 2005-06 Allahabad HC rejected the minority-based reservation 2019 SC refers issue to seven judges 8 Nov 2024 AMU v. Naresh Agarwal: 4:3 ; statutory incorporation does not remove minority status; test = origin, purpose, community role ; pre-1950 institutions can claim Art 30; national importance does not exclude. Azeez Basha overruled but AMU's status left to a regular Bench Minority Welfare Schemes AND Significance Against minority-specific schemes Art 15(1) religion-only basis welfare should follow deprivation other protections exist For socio-economic disadvantage Art 14 reasonable classification Art 46 national integration Way forward / key point Minority schemes are not automatically unconstitutional ; validity depends on legal basis, objective, eligibility, equality. Significance of 29-30: identity, equality, minority autonomy, inclusive education, integration."}, {"c": "11", "n": "Religion, Secularism, Minorities and the Waqf Act", "id": "4-waqf-amendment-act-2025-nazul-land", "t": "4 · WAQF (amendment) ACT, 2025 · Nazul LAND", "x": "4 · WAQF (amendment) ACT, 2025 · Nazul LAND # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Fundamental Rights 2 handout pp. 38-39. Prelims PYQs quoted: none quoted in the material. In simple words The 2025 amendment changes Waqf registration, boards and dispute handling. The SC in September 2025 refused a full stay but paused the five-year Muslim requirement, executive decisions on government-land disputes, and capped non-Muslim members. The final ruling on validity is pending. Nazul land is government land under lease. Background AND KEY Changes Waqf permanent dedication of property for religious, charitable or other purposes under Muslim law: mosques, dargahs, graveyards, schools Waqf Act, 1995 was the main framework The Waqf (Amendment) Act, 2025 (also linked to the UMEED framework) changes registration, management and oversight Provision Change Non-Muslim representation non-Muslim members in the Central Waqf Council and State Waqf Boards Waqf by user restricts future recognition based only on long religious use; protects existing registered Waqfs Five-year requirement person creating a Waqf must have professed Islam for at least five years Government oversight government-designated officer in disputes over government property claimed as Waqf For transparency and accountability property protection against fraudulent claims modernisation of records better supervision Against Art 26 autonomy hit by non-Muslim members waqf by user hurts undocumented religious properties five-year rule intrudes on religious freedom separation of powers: executive deciding property rights Constitutional questions Art 14 equality Art 25 (five-year rule) Art 26 (denominational administration) Separation of powers Supreme Court Interim Order, September 2025 Note SC refused to stay the whole Act but suspended parts (verify against the order): Three directions five-year practising Muslim rule: stayed until States set a mechanism to decide who qualifies government property disputes: Stayed executive power to change Waqf status and revenue records before adjudication Disputes go to the Waqf Tribunal and courts non-Muslim members: not suspended but capped at four in the Central Waqf Council and three in State Waqf Boards Memory aid · FGN Interim order: F ive-year rule paused · G overnment-land disputes to tribunal · N on-Muslim members capped (4 and 3). (own mnemonic) Value addition Interim relief is not a final ruling on validity; keep the two apart in answers. Nazul LAND What it is Government-owned land leasable to persons or institutions Many came under government ownership in the colonial period Government keeps ownership , others hold leasehold Uses: housing, schools, hospitals leasehold: Right to use for a period Freehold: ownership Link to Waqf dispute: can long religious use create Waqf status over land claimed by government? The interim order stops executives from altering disputed status before proper adjudication Core issue: balance protection of religious endowments, property rights, transparency and lawful oversight"}, {"c": "11", "n": "Religion, Secularism, Minorities and the Waqf Act", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Stainislaus 1977 propagation is not a right to convert ERP doctrine origin Shirur Mutt 1954 Santhara 2015 Rajasthan HC banned; SC stayed Sabarimala 2018 4:1, exclusion unconstitutional Sabarimala reference nine judges, reserved May 2026 (verify) Loudspeaker ruling 2020 not essential to Azaan; regulate noise SGPC law Sikh Gurdwaras Act 1925 Char Dham Act 2019, repealed 2021 Property protection article Art 300A Art 27 no tax to promote a religion Art 28 fully State-funded no religious instruction Aruna Roy 2002 religious education is not religious instruction Who popularised secularism George Jacob Holyoake \"Secular\" added by 42nd Amendment 1976 Indian secularism term principled distance, Rajeev Bhargava Bommai 1994 secularism is basic structure Balram Singh 2024 Socialist and Secular words upheld Sachar Committee 2006 Sen on identity multiple identities 29(1) holders any section of citizens, not only minorities 29(2) protects against discrimination in admission Minority unit State-wise, TMA Pai 2002 Jains notified 2014 Art 350B Special Officer for linguistic minorities NCM Act 1992 Pramati 2014 minority schools exempt from RTE 2025 doubt on Pramati Anjuman Ishaat-e-Taleem, larger Bench (verify) Azeez Basha 1967 AMU not minority; overruled 2024 AMU 2024 bench seven judges, 4:3, test: origin, purpose, community role Waqf Act original 1995 Amendment year 2025, UMEED framework Waqf by user change restricts future recognition by long use alone Five-year rule must profess Islam five years; stayed pending mechanism Non-Muslim caps four in Central Council, three in State Boards Where disputes go Waqf Tribunal and courts Nazul land government-owned, leased out"}, {"c": "11", "n": "Religion, Secularism, Minorities and the Waqf Act", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts in Start Here)"}, {"c": "11", "n": "Religion, Secularism, Minorities and the Waqf Act", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards"}, {"c": "12", "n": "Directive Principles, Property, Uniform Civil Code and Fundamental Duties", "id": "1-dpsp-classification-fundamental-rights-v", "t": "1 · DPSP · Classification · Fundamental Rights VS DPSP", "x": "1 · DPSP · Classification · Fundamental Rights VS DPSP # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · DPSP and Fundamental Duties handout pp. 2-3. Prelims PYQs quoted: none quoted in the material. In simple words DPSP (Part IV, Arts 36-51) aim at a welfare State and are not enforceable, yet courts use them to read Fundamental Rights. The case chain: Champakam (FR wins) to Golaknath to Kesavananda to Minerva Mills (balance is Basic Structure). Think two wheels of one chariot. WHAT AND WHY Non-justiciable DPSP Part IV, Arts 36-51 Aim: a Welfare State built on social, economic and political justice why non-justiciable: Financial limits Administrative capacity Social conditions (e.g. UCC needs care) Nature (broad aims like international peace) not legally irrelevant: courts use them to interpret Fundamental Rights and test the purpose of laws Classification (academic, NOT IN THE TEXT) Type Articles Aim Socialist 38, 39, 39A, 41, 42, 43, 43A social and economic justice, welfare, labour Gandhian 40, 43, 43B, 46, 47, 48 village self-government, cottage industries, weaker sections, rural welfare Liberal-Intellectual 44, 45, 48A, 49, 50, 51 civil reform, education, environment, heritage, judicial independence, peace Value addition Some Articles belong to more than one category. Memory aid · SGL Three types: S ocialist · G andhian · L iberal-intellectual. (own mnemonic) Fundamental Rights VS DPSP 1951 State of Madras v. Champakam Dorairajan: FRs prevail over DPSP in direct conflict 1967 Golaknath: Parliament cannot amend FRs, hence cannot do so to implement DPSP 1973 Kesavananda Bharati: Parliament can amend FRs to implement DPSP but not violate Basic Structure 1980 Minerva Mills: harmony and balance between FR and DPSP is part of the Basic Structure ; neither Part III nor IV has absolute priority; they are complementary Memory aid · CGKM Case order: C hampakam → G olaknath → K esavananda → M inerva Mills. (own mnemonic) Present position Parliament may amend FRs to implement DPSP, subject to the Basic Structure courts use harmonious construction of Parts III and IV DPSP help read Art 21 Art 31C specially protects qualifying laws under 39(b) and 39(c) Way forward / key point Two wheels of a chariot: both are needed for the Constitution's goal of social revolution."}, {"c": "12", "n": "Directive Principles, Property, Uniform Civil Code and Fundamental Duties", "id": "2-article-39-b-c-right-to-property-eminent", "t": "2 · Article 39(b)(c) · Right TO Property · Eminent Domain · Nine-judge Verdict 2024", "x": "2 · Article 39(b)(c) · Right TO Property · Eminent Domain · Nine-judge Verdict 2024 # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · DPSP and Fundamental Duties handout pp. 3-4. Prelims PYQs quoted: none quoted in the material. In simple words Art 39(b) wants resources distributed for the common good; 39(c) stops concentration of wealth. Property is now only a constitutional right (Art 300A). The 2024 nine-judge bench held not every private resource is a community resource, but kept Art 31C alive. Article 39(b) AND (c) 39(b) ownership and control of the material resources of the community distributed to serve the common good 39(c) economic system should not cause concentration of wealth and means of production to the common detriment Right TO Property Status Earlier a Fundamental Right under Arts 19(1)(f) and 31 The 44th Amendment, 1978 removed that status now a constitutional right under Art 300A : no deprivation of property except by authority of law Features authority of law: no deprivation by mere executive order public purpose for compulsory acquisition compensation: no guarantee of market value in every case, but still open to scrutiny judicial review available Eminent domain State's power to acquire private property for a public purpose under valid law Issues: private vs public interest, fair compensation and rehabilitation, protection from arbitrary acquisition Note Kolkata Municipal Corporation v. Bimal Kumar Shah (2024): seven procedural safeguards under Art 300A: notice · hearing · reasoned decision · public purpose · fair compensation · timely process · conclusion of proceedings . Art 300A protects more than the bare need for a law. Memory aid · NHR-PCTC Seven safeguards: N otice · H earing · R easons · P ublic purpose · C ompensation · T imely · C onclusion. (own mnemonic) Property Owners Association v. State OF Maharashtra (2024) Case Provisions of the Maharashtra Housing and Area Development Act, 1976 on acquiring properties for redevelopment Question: is private property a material resource of the community under 39(b)? 5 November 2024 , nine-judge bench, 7:2 Holdings not every private resource is a community resource, but some may be no automatic State claim to all private property factors: Nature and importance Community welfare impact Scarcity Concentration in private hands Constitution prescribes no single economic model Art 31C continues to shield qualifying 39(b)/(c) laws from Art 14 and 19 challenges, but courts still check whether a law truly qualifies Memory aid · NCSC Resource test: N ature · C ommunity welfare · S carcity · C oncentration. (own mnemonic) Way forward / key point Significance: protects property from blanket classification, still allows genuine redistribution, gives clear criteria, a balanced model. Public welfare cannot justify treating every private resource as community property."}, {"c": "12", "n": "Directive Principles, Property, Uniform Civil Code and Fundamental Duties", "id": "3-uniform-civil-code-article-44-personal-l", "t": "3 · Uniform Civil CODE · Article 44 · Personal LAWS · Uttarakhand", "x": "3 · Uniform Civil CODE · Article 44 · Personal LAWS · Uttarakhand # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · DPSP and Fundamental Duties handout pp. 4-7. Prelims PYQs quoted: none quoted in the material. In simple words Art 44 asks the State to work toward a Uniform Civil Code. India has separate personal laws; Shah Bano, Danial Latifi, Shayara Bano and Abdul Samad are the milestones. The Law Commission (2018) favoured reform over uniformity. Uttarakhand began a State UCC on 27 Jan 2025. Article 44 AND Personal LAWS UCC Art 44 directs the State to endeavour to secure a UCC Common civil law on marriage, divorce, maintenance, adoption, succession, inheritance irrespective of religion debate: equality, religious freedom, gender justice, diversity Community Main laws Hindus, Buddhists, Jains, Sikhs Hindu Marriage Act 1955; Hindu Succession Act 1956; Hindu Adoptions and Maintenance Act 1956; Hindu Minority and Guardianship Act 1956 Muslims Muslim Personal Law (Shariat) Application Act 1937; Dissolution of Muslim Marriages Act 1939 Christians Indian Christian Marriage Act 1872; Indian Divorce Act 1869 Parsis Parsi Marriage and Divorce Act 1936 Religion-neutral Special Marriage Act, 1954 : civil marriage without conversion; but public notice may expose couples to family pressure Judicial Milestones 1985 Shah Bano: CrPC s.125 is religion-neutral; divorced Muslim woman can claim maintenance; mahr does not end the duty 1986 Muslim Women (Protection of Rights on Divorce) Act : separate framework, seen as a response to Shah Bano 2001 Danial Latifi: upheld the 1986 Act; husband must make reasonable and fair provision within Iddat, not limited to needs in Iddat 2017 Shayara Bano: 3:2 , instant Triple Talaq ( Talaq-e-Biddat ) set aside 2019 Muslim Women (Protection of Rights on Marriage) Act: instant talaq void and illegal, offence up to 3 years ; critics: criminalisation, family finances, abandonment not covered 2024 Mohd. Abdul Samad: divorced Muslim women can claim maintenance under BNSS s.144 as well as the 1986 Act Polygamy Hindu law bars a second marriage in the spouse's lifetime Traditional Muslim law allows up to four wives subject to conditions Sarla Mudgal (1995): a Hindu husband cannot escape the bigamy law by converting to Islam without dissolving the first marriage FOR AND Against For UCC gender justice (patriarchal laws) national integration secularism simpler laws equality before law Against religious and cultural diversity minority fears of majority imposition Arts 25 and 26 hard to frame common rules selective reform while other DPSPs lag uniformity is not equality Memory aid · GNSSE For UCC: G ender justice · N ational integration · S ecularism · S implification · E quality. (own mnemonic) Note 21st Law Commission Consultation Paper (2018): a UCC was neither necessary nor desirable at that stage ; remove discrimination within each family law, gradual reform by consultation, don't treat diversity as the problem. Uttarakhand UCC UCC of Uttarakhand, 2024 in force 27 January 2025 : first State in independent India with a comprehensive State UCC Common rules on marriage, divorce, maintenance, succession Compulsory marriage registration Polygamy prohibited Live-in relationships registered Scheduled Tribes and protected customs excluded 2026: UCC Amendment Ordinance, then UCC Amendment Act, 2026 (verify) concerns: privacy of live-ins, State oversight, exemptions vs uniformity, implementation Way forward gradual reform through consultation gender justice in marriage, divorce, maintenance, inheritance optional religion-neutral civil framework stakeholder consultation constitutional balance : aim is equality and gender justice, not uniformity for its own sake"}, {"c": "12", "n": "Directive Principles, Property, Uniform Civil Code and Fundamental Duties", "id": "4-dpsp-significance-and-criticism-fundamen", "t": "4 · DPSP Significance AND Criticism · Fundamental Duties · Article 51A", "x": "4 · DPSP Significance AND Criticism · Fundamental Duties · Article 51A # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · DPSP and Fundamental Duties handout pp. 7-10. Prelims PYQs quoted: none quoted in the material. In simple words DPSP give a welfare yardstick but are weak without political will (\"pious superfluities\"). Fundamental Duties (Part IVA, Art 51A) came with the 42nd Amendment on Swaran Singh's advice; there are 11. Duties are non-justiciable but supported by laws and cases (Bijoe Emmanuel, M. C. Mehta, anthem orders). DPSP: Significance AND Criticism Significance welfare State commitment common policy direction across governments complement FRs (liberty vs social conditions) yardstick to judge governments more relevant with inequality, environment, jobs Criticism non-justiciable : \" pious superfluities \", an uncashable cheque money and capacity limits unsystematic mix of broad aims and specifics (prohibition, cattle protection) vague but flexible liberty vs welfare tension: Art 47, 48, 44 uneven implementation : weak delivery, not just missing laws Fundamental Duties Basics Part IVA, Art 51A Added by the 42nd Amendment, 1976 on the Swaran Singh Committee The 86th Amendment, 2002 added one, so 11 duties rationale: reduce indifference to nation-building, balance freedom with responsibility, encourage participation Right Linked duty Art 15 (no discrimination) 51A(e) promote harmony, renounce practices derogatory to women Art 19 (speech) 51A(h) scientific temper and spirit of inquiry Art 21 (life) 51A(g) protect environment and living creatures Art 21A (education) 51A(k) parents to provide educational opportunities, ages 6-14 Value addition Gandhi: rights and duties are closely linked; stress performance of duties. Parts III (rights, against State), IV (directive to State), IVA (citizens) together support dignity and collective welfare. Cases Bijoe Emmanuel (1986): Jehovah's Witness students stood respectfully but refused to sing the National Anthem Protected by 19(1)(a) and 25 Duties cannot override conscience M. C. Mehta: Used 51A(g) Environmental education in institutions Vellore (1996): Precautionary, polluter pays, sustainable development Arts 21, 48A , 51A(g) Shyam Narayan Chouksey: 2016 anthem in cinemas ordered 2018 made optional The Prevention of Insults to National Honour Act, 1971 penalises insult, no general duty to sing Duty Supporting law 51A(a) flag and anthem Prevention of Insults to National Honour Act 1971; Flag Code 51A(g) environment Environment (Protection) Act 1986; Wildlife (Protection) Act 1972 51A(f) heritage Ancient Monuments and Archaeological Sites and Remains Act 1958 51A(e) women's dignity Dowry Prohibition Act 1961; PWDV Act 2005 51A(i) public property Prevention of Damage to Public Property Act 1984 51A(k) education RTE Act 2009 Value addition Not every breach of a duty is automatically a crime. Committees Justice J. S. Verma Committee (1999): teach duties in schools, public awareness, teacher training, identify existing laws NCRWC (2002): Duty to vote , pay taxes , responsible parenthood , civic education Recommendations only , not all in Art 51A For more stress on duties responsible citizenship unity and welfare protect environment and property democratic culture For prioritising rights rights enforceable, duties not risk of weakening protection duties can justify curbs on dissent State must first meet its own obligations Way forward / key point Balance: rights and duties are complementary, not competing. Way forward: civic education, awareness, specific laws subject to FRs, responsible governance, participation."}, {"c": "12", "n": "Directive Principles, Property, Uniform Civil Code and Fundamental Duties", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. DPSP articles 36-51 in Part IV Champakam 1951 FR prevails over DPSP Golaknath 1967 Parliament cannot amend FRs Kesavananda 1973 can amend FR for DPSP within Basic Structure Minerva Mills 1980 balance of FR and DPSP is Basic Structure Art 31C protects laws implementing 39(b) and 39(c) 39(b) material resources distributed for common good 39(c) no concentration of wealth Property right now Art 300A, after 44th Amendment 1978 Bimal Kumar Shah 2024 seven procedural safeguards Property Owners Association 2024 nine judges, 7:2, 5 Nov 2024 Resource test NCSC Art 31C status still operates Art 44 State to endeavour for a UCC Special Marriage Act 1954, civil marriage Shah Bano 1985 CrPC 125 maintenance for divorced Muslim woman Danial Latifi 2001 1986 Act upheld; fair provision Shayara Bano 2017 3:2, instant triple talaq set aside 2019 Act punishment up to three years Abdul Samad 2024 maintenance under BNSS 144 Sarla Mudgal 1995 conversion cannot escape bigamy law Law Commission 2018 UCC neither necessary nor desirable then Uttarakhand UCC in force 27 January 2025 DPSP criticism phrase pious superfluities Art 51A in Part IVA Added by 42nd Amendment 1976, Swaran Singh Committee Number of duties 11 after 86th Amendment 2002 Bijoe Emmanuel 1986 cannot force anthem singing against conscience Anthem in cinemas 2016 ordered, 2018 optional Verma Committee 1999, duties in education NCRWC 2002 ideas voting, taxes, responsible parenthood"}, {"c": "12", "n": "Directive Principles, Property, Uniform Civil Code and Fundamental Duties", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts in Start Here)"}, {"c": "12", "n": "Directive Principles, Property, Uniform Civil Code and Fundamental Duties", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards"}, {"c": "13", "n": "Constitutional and Statutory Bodies: NCSC, NCST, NCBC, NHRC", "id": "1-ncsc-ncst-articles-338-338a-functions-cr", "t": "1 · NCSC · NCST · Articles 338, 338A · Functions · Critique", "x": "1 · NCSC · NCST · Articles 338, 338A · Functions · Critique # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Constitutional and Statutory Bodies handout pp. 3-8. Prelims PYQs quoted: none quoted in the material. In simple words NCSC (Art 338) and NCST (Art 338A) watch over safeguards for SCs and STs. They have civil-court powers in inquiries, but their advice is not binding. Both suffer from delay, thin staff and weak independence. National Commission FOR Scheduled Castes (NCSC) Article Provision 338 sets up the NCSC, its composition, powers and functions 341 President (after consulting the Governor) specifies which castes are SCs in each State/UT 366(24) defines Scheduled Castes Functions investigate and monitor safeguards (e.g. reservation in education, jobs, promotions) inquire into complaints of denial of rights, atrocities, discrimination (SC/ST Atrocities Act cases) advise on planning for SC development (e.g. SC Sub-Plan) annual and special reports to the President recommend measures to governments Also functions for the Anglo-Indian community Until the 102nd Amendment, 2018 it also dealt with OBCs Work done Scrutiny of recruitment and promotion Liaison officers, grievance cells , SC/ST employee associations education: Literacy, scholarships, hostels Post-Matric Scholarship review urged DBT atrocities: NCRB 2021 shows crimes against SCs about 89% of atrocities against SCs/STs together land: advocates reform and protection against alienation Limitations non-binding recommendations delays perceived alignment with government late reports, e.g. 12th Report (2018-20) tabled only in 2022 elite-centric focus rare suo motu action Reforms bipartisan appointments timely reporting and discussion in Parliament focus on marginalised sub-groups data-driven work clear role vs Ministry of Social Justice proactive suo motu power National Commission FOR Scheduled Tribes (NCST) Background ST notified under Article 342 The Constitution does not define \"tribe\" Census 2011: 10.42 crore STs ( 8.6% ), on over 15% of area , with nearly 20% of natural resources Concentrated in Central India and the Northeast Mizoram near-universal literacy vs vulnerable groups like Jarawas and Shompens NCST is under Article 338A Functions examine safeguards (e.g. PESA in Scheduled Areas) complaints (land alienation in Jharkhand, Odisha) advise on planning (e.g. Tribal Sub-Plan ) annual and special reports to the President policy advice to Union and States Additional functions (Rules, 2005) minor forest produce rights ownership of land, water, minerals rehabilitation of those displaced by projects prevent land alienation and restore it tribal role in forest management and social afforestation implement PESA 1996 shift from jhum to sustainable livelihoods Achievements Critique 2023: notice on Great Nicobar (84.1 sq km tribal reserve, 130 sq km forest) inactive about four years, no reports to Parliament opposed 2019 FRA amendments only six regional offices , understaffed 2017 report: 28% of displaced tribal households in Chhattisgarh mining lacked rehabilitation overshadowed by Ministry of Tribal Affairs 2020 input: 452 new Eklavya schools inadequate consultation (e.g. FRA) summoned officials in Pathalgadi cases (Jharkhand, 2016) chronic underfunding 2018-19: 4.5% shortfall of STs in central PSUs 2022 committee: working with under 50% of sanctioned strength Way forward / key point Way forward (NCST): fill vacancies, more regional offices, autonomy from the Ministry, mandatory consultation on ST policies, better funding."}, {"c": "13", "n": "Constitutional and Statutory Bodies: NCSC, NCST, NCBC, NHRC", "id": "2-ncbc-challenges-of-sc-st-obc-commissions", "t": "2 · NCBC · Challenges OF Sc-st-obc Commissions · Types OF Rights", "x": "2 · NCBC · Challenges OF Sc-st-obc Commissions · Types OF Rights # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Constitutional and Statutory Bodies handout pp. 8-11. Prelims PYQs quoted: none quoted in the material. In simple words NCBC was given constitutional status in 2018 and has civil-court powers. All three commissions share the same ills: vacancies, non-binding advice, delays and thin outreach. Rights come as natural, moral, legal and human rights; Fundamental Rights are legal rights inside Part III. NCBC Note Table of NCBC composition and the Constitution Article are in a picture in the handout and were not readable ; the notes below use only the text. Constitutional status came in 2018 (the 102nd Amendment appears in the NCSC section). Idea backwardness here is caste-linked (occupation, hierarchy), producing intergenerational barriers status: No longer dependent on executive discretion An autonomous constitutional body accountable to the highest constitutional office Justice Rohini Commission, 2017, under Article 340 sub-classification of the 27% OBC quota into 4 groups: G1 2% G2 6% G3 9% G4 10% (total 27%) Final report awaited Powers (civil court) summon people across India and examine on oath discovery and production of documents Evidence on affidavits Requisition public records summons for witnesses and documents any further powers given by the President Benefits of constitutional status civil court powers in inquiries mandate beyond list revision : welfare and safeguards parliamentary oversight (e.g. 2022 report on under-used OBC welfare funds) autonomy and tenure protection role in social justice (central PSU backlog) symbolic value for about 40% of the population Challenges OF SC, ST AND OBC Commissions Challenges vacancies and resource gaps (2022 panel: NCST under 50% strength) erosion of autonomy : political appointments, non-binding advice (NCBC 2020 backlog reports ignored) weak powers : NCBC cannot define backwardness (Maratha Quota Judgment, 2021) backlog , late reports opaque selection retired bureaucrats dominate low awareness (NCRB 2020: rising atrocities, few complaints) Reforms independence with clear criteria and experts Binding recommendations NCBC to define backwardness Harmonise powers fill posts, budgets, modern infrastructure digital case tracking , fixed timelines caste and tribe databases, impact studies coordination with ministries, states, NGOs, universities dedicated cadre and training Memory aid · VAD-OTRCF Common ills of commissions: V acancies · A utonomy · D elay · O paque · T oothless · R epresentation · C overage · F unds. (own mnemonic) Types OF Rights Type Meaning Example Natural belong to every person by birth; universal, inalienable life, liberty, property Moral based on moral values; generally not legally enforceable respectful, fair treatment Legal recognised and protected by law; enforceable in courts civil (life, equality); political (vote); economic (work, fair wages) Human universal, inalienable; civil, political, economic, social, cultural; UDHR 1948 life, dignity, equality, education, freedom Basis Fundamental Rights Constitutional Rights (other) Where Part III outside Part III Articles 12-35 e.g. 300A, 326 Examples equality, freedom, life property (300A), vote (326) Enforcement directly by Art 32 (SC) and Art 226 (HC) appropriate legal remedies Way forward / key point All Fundamental Rights are Constitutional Rights, but not all Constitutional Rights are Fundamental Rights."}, {"c": "13", "n": "Constitutional and Statutory Bodies: NCSC, NCST, NCBC, NHRC", "id": "3-national-human-rights-commission-composi", "t": "3 · National Human Rights Commission · Composition · Working · Challenges", "x": "3 · National Human Rights Commission · Composition · Working · Challenges # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Constitutional and Statutory Bodies handout pp. 11-16. Prelims PYQs quoted: none quoted in the material. In simple words NHRC (Protection of Human Rights Act 1993) is a recommendatory body with civil-court powers, built to Paris Principles. Its weak spots are no binding power, limits on armed forces cases, a one-year bar, and doubts about independence (GANHRI). Origin AND Structure Why 1980s-90s concern over custodial violence, encounter deaths, discrimination Protection of Human Rights Act, 1993 NHRC set up 12 October 1993 three tiers: NHRC (national), SHRCs (state), Human Rights Courts (district) follows Paris Principles (1993) Aspect Detail Composition Chairperson + 5 full-time members + 7 ex-officio members Appointment committee PM (chair), Home Minister, Lok Sabha Speaker, RS Deputy Chairman, LoP in both Houses; appointed by the President Chairperson retired Chief Justice of India or SC judge Members one SC judge (serving/retired); one HC Chief Justice/judge; three with human rights experience (at least one woman) Ex-officio chairpersons of the national commissions for SC, ST, Women, Minorities, BC, Child Rights and the Chief Commissioner for Persons with Disabilities Term 3 years or age 70 , whichever earlier; reappointable Removal by the President for misbehaviour/incapacity after Supreme Court inquiry Pay fixed by Centre, not varied to disadvantage Powers civil court powers; call for information; recommend compensation or prosecution; use investigation agencies; Secretary-General has administrative and financial powers Memory aid · PHLS-LL Appointment panel: P M · H ome Minister · L S Speaker · R S Deputy Chairman · two L oPs. (own mnemonic) Working Process Complaint by individual, NGO or suo motu Generally within one year of the violation Screened by the Law Division inquiry: own Investigation Division (DG of Police rank) or report from authority Hearings or field visits in serious cases (custodial deaths, bonded labour, encounters) Recommends compensation, disciplinary action or policy change Action Taken Report within one month Non-compliance shown in annual report tabled in Parliament divisions for research, training, policy, awareness Functions (Section 12) inquiry (suo motu, petition or court reference; Sections 17-18) intervene in court cases with permission inspect jails and detention centres (UN Mandela Rules 2015 ) review safeguards examine factors like terrorism, displacement, communal violence Study treaties ( UDHR 1948, ICCPR 1966, CEDAW 1979 ) Work with UNHRC research, education, partner NGOs Monitor Supreme Court orders on custodial deaths, manual scavenging National Action Plan on Business and Human Rights Note GANHRI (accredits national human rights bodies): 2024-25 reports flag a non-transparent selection (no public advertisement, vague screening), weak follow-up on serious violations, limited independence , little civil society role; recommendation to downgrade from \"A\" grade . The handout also says GANHRI downgraded NHRC in 2017 (two statements; verify). ROLE AND Notable Cases Role Custodial death guidelines linked to D. K. Basu (1997) Critique of POTA/TADA misuse Odisha starvation deaths (2001-02) leading to scheme monitoring 2022 Chhattisgarh mining displacement NHRC v. State of Arunachal Pradesh (1996) : Locus to move court for Chakma refugees Prison reports fed the Justice Amitava Roy Committee Shaped Juvenile Justice Act 2000 and Mental Healthcare Act 2017 Online courses (2020) Case (year) NHRC action Gujarat riots (2002) suo motu; pressed the State; moved SC Punjab mass cremations (1995-2012) Rs 1.75 lakh each to 1,051 families Silicosis, Gujarat (2011-) investigated tribal labourers' conditions Rohingya, Jammu (2017) basic facilities, non-discrimination Maharashtra farmer suicides (2018) notices over agrarian distress Manipur encounters (2013-16) monitored SIT on 1,528 alleged fake encounters; SC called NHRC \"toothless tiger\" Covid migrants (2020) reports from states and railways Hathras (2020) cognisance of alleged gangrape and hurried cremation Manipur violence (2023) notices on displacement and sexual violence Limits AND Reform Challenges Advisory only Cannot penalise or award compensation directly Justice H. L. Dattu (2016) said \"toothless tiger\" jurisdiction: Armed forces only via report Cases older than one year Private persons unless State complicity composition: Retired judges dominate Limited diversity \"post-retirement forum\" operations: backlog, deputation staff, funds independence: executive-dominated appointments access: low awareness, urban-centric Where it failed G. N. Saibaba (2024-25): complaints on prison conditions dismissed \"Nata Pratha\" minor girl (2024): Police inaction found Slow justice DMF Odisha (2025): reports sought, little visible action Way forward Binding recommendations in grave cases Cover private actors and security forces Own investigation wing advertised vacancies , diverse membership dedicated budget, permanent staff, regional benches Online tracking of recommendations Audits Parliamentary review Multilingual portals Free legal and medical aid Amend the Act to meet Paris Principles External performance review"}, {"c": "13", "n": "Constitutional and Statutory Bodies: NCSC, NCST, NCBC, NHRC", "id": "4-udhr-state-human-rights-commissions-huma", "t": "4 · UDHR · State Human Rights Commissions · Human Rights Courts", "x": "4 · UDHR · State Human Rights Commissions · Human Rights Courts # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Constitutional and Statutory Bodies handout pp. 16-19. Prelims PYQs quoted: none quoted in the material. In simple words UDHR (10 Dec 1948, 30 Articles) is echoed in India's Preamble, FRs, DPSPs and duties. States have SHRCs (3-year term after the 2019 amendment) and Human Rights Courts (Sec 30) to try offences, but both are under-used. UDHR 1948 AND THE Constitution UDHR adopted by the UN General Assembly on 10 December 1948 after World War II principles: Dignity, Liberty, Equality, Brotherhood 30 Articles Indian provision UDHR link Preamble justice, liberty, equality, fraternity Arts 14-18 equality and non-discrimination (UDHR 1, 7) Arts 19-22 freedom, life, liberty (UDHR 3, 9, 19, 20) Arts 23-24 exploitation (UDHR 4) Arts 25-28 religion (UDHR 18) Arts 29-30 cultural and educational rights (UDHR 26, 27) Art 32 remedies (UDHR 8) DPSP 38, 39, 41, 42, 47 socio-economic rights (UDHR 22-25) Duties 51A(e), (f), (h) harmony and women's dignity, composite culture, scientific temper Art 21A / 45 / 300A / 326 education (UDHR 26) / early childhood care / property (UDHR 17) / adult suffrage (UDHR 21) State Human Rights Commissions Aspect Provision (post-2019 Amendment) Composition Chairperson + 2 Members ; Chairperson: retired HC Chief Justice or judge (2019 change); Members: serving/retired HC judge or District Judge (7 years), and a human rights expert Appointment Governor on committee headed by the Chief Minister with Speaker, State Home Minister, LoP (and Council Chairman and LoP if bicameral) Consultation Chief Justice of the HC if a sitting judge is appointed Tenure 3 years or age 70 (cut from 5 years in 2019); reappointable Removal only by the President , after SC inquiry After tenure cannot hold State or Central employment Administration Secretary has administrative and financial powers (2019) Powers and functions (Section 29) inquiry (suo motu, petition, court) intervene in proceedings inspect jails and mental health institutions review safeguards, structural causes, international norms research, awareness, work with NGOs Procedure Complaint online/post/in person Media cases suo motu Older than one year ordinarily not admitted Section 17 report from the State Civil court powers (CPC 1908) Section 18 recommend compensation, discipline/prosecution, reforms ATR within one month Section 19 armed/paramilitary forces: report from the Centre , which responds within three months annual report to the State Legislature Challenges non-binding staff and funds Cannot revisit cases before NHRC One-year bar delayed legislative follow-up Human Rights Courts (section 30) Set-up State Government with the Chief Justice of the High Court's concurrence notifies one per district, usually the Sessions Court tries criminal offences from human rights violations or negligence by public servants Special Public Prosecutor (Section 31) , advocate with at least 7 years link: SHRC/NHRC investigate and recommend These courts try and punish Limits and developments courts exist mostly in name: No exclusive judges, infrastructure, funds Little awareness Tamil Nadu, Kerala, Maharashtra have started exclusive benches/pilots 2018 SC order (Re: Inhuman Conditions in 1382 Prisons) asked states to operationalise them"}, {"c": "13", "n": "Constitutional and Statutory Bodies: NCSC, NCST, NCBC, NHRC", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. NCSC article 338 NCST article 338A SC specified by Art 341, President ST notified under Art 342 NCSC and OBCs until 102nd Amendment 2018 STs in Census 2011 10.42 crore, 8.6% NCST regional offices six NCSC 12th Report 2018-20, tabled in 2022 Rohini Commission 2017, Art 340, 27% OBC quota in 4 groups Rohini groups 2, 6, 9, 10 percent NCBC powers civil court powers NCBC status constitutional in 2018 Four types of rights natural, moral, legal, human FR enforced by Art 32 and Art 226 Rights outside Part III e.g. 300A, 326 NHRC set up 12 October 1993, 1993 Act Members Chair + 5 full-time + 7 ex-officio Term 3 years or age 70 Removal President after SC inquiry Complaint time limit one year Action Taken Report within one month Punjab cremations Rs 1.75 lakh to 1,051 families \"Toothless tiger\" Manipur encounters; H. L. Dattu 2016 Accrediting body GANHRI UDHR adopted 10 December 1948, 30 Articles SHRC tenure now 3 years or 70 (2019) SHRC appointed by Governor, committee led by CM SHRC removed by President Armed forces under SHRC Section 19, Centre reports in 3 months Human Rights Courts Section 30, Special PP Section 31 SC 2018 on HR courts Re: Inhuman Conditions in 1382 Prisons"}, {"c": "13", "n": "Constitutional and Statutory Bodies: NCSC, NCST, NCBC, NHRC", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts in Start Here)"}, {"c": "13", "n": "Constitutional and Statutory Bodies: NCSC, NCST, NCBC, NHRC", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards"}, {"c": "14", "n": "Bodies for Women, Children, Minorities and the NIA", "id": "1-national-commission-for-women-powers-con", "t": "1 · National Commission FOR Women · Powers · Constitutional Status Debate", "x": "1 · National Commission FOR Women · Powers · Constitutional Status Debate # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Constitutional and Statutory Bodies handout pp. 19-23. Prelims PYQs quoted: none quoted in the material. In simple words NCW (1992, NCW Act 1990) is a statutory, advisory body with civil-court powers. There is a demand for constitutional status (like Arts 338, 338A) for autonomy and binding force, supported by the Verma Committee (2013). Structure AND Functions Basics Set up in 1992 under the NCW Act, 1990 Apex statutory body for gender justice, in line with CEDAW (1979) Aspect Provision Composition Chairperson (eminent woman) + 5 Members (one from SC/ST) + Member-Secretary Appointed by Central Government Tenure 3 years ; reappointable Removal insolvency, conviction, incapacity; may resign to the Centre HQ New Delhi; regional offices as needed Functions review constitutional and legal safeguards investigate complaints and suo motu cases advise governments inspect jails, remand homes, shelters research (trafficking, workplace harassment, domestic violence, sex ratio) legal literacy and awareness support NGOs intervene in court cases Powers civil court powers (CPC 1908) inquire suo motu or on petition call for reports from departments recommend prosecution, compensation, discipline visit custodial places hold public hearings advisory only , yet shaped reforms to the Dowry Prohibition Act and POSH law Recent Initiatives (2020-2025) Initiatives Digital Shakti (Phase IV, 2022; with Meta, CyberPeace): over 3 lakh women sensitised She Is a Changemaker (2021): over 12,000 grassroots leaders One Stop Centres, 181 helpline \"We Think Digital\" campaign suo motu: Hathras (2020), Manipur (2023), Kallakurichi school suicide (2022) Indecent Representation of Women Act amendments Gender budgeting audits POSH monitoring trained over 30,000 police with BPR&D trafficking survivors, migrant and transgender women (2023) Demand FOR Constitutional Status Reasons limited enforcement dependence on Ministry of WCD rising gender violence Paris Principles parity with Arts 338, 338A bodies Expected benefits Autonomy Funds from Consolidated Fund binding directives continuity stronger policy impact global standing (CEDAW) Challenges Statutory status limits independence Political bias allegations in Manipur 2023 thin staff (2022 Parliamentary Committee) NCRB 2022: Over 4.45 lakh crimes against women Low conviction Dalit, tribal, migrant women neglected (e.g. Maharashtra sugarcane cutters) advisory (post-Kathua 2018 responses slow) overlap with State Commissions, NHRC 20,000+ complaints a year (2022), slow redress Way forward constitutional status (suggested by the Justice Verma Committee, 2013 ) transparent, inclusive appointments ( Anjali Bhardwaj, 2019 ) reach marginalised women staff, funds, digital grievance systems binding recommendations gig economy, cyber abuse, harassment (2023 surveys) partner NGOs and SHRCs Way forward / key point Parivarik Mahila Lok Adalat: NCW with State Legal Services Authorities; informal, conciliatory forum under the Legal Services Authorities Act 1987 for family disputes (domestic violence, maintenance, divorce, dowry, property, custody); mediation and rehabilitation."}, {"c": "14", "n": "Bodies for Women, Children, Minorities and the NIA", "id": "2-ncpcr-scpcr-children-s-courts", "t": "2 · Ncpcr · Scpcr · Children's Courts", "x": "2 · Ncpcr · Scpcr · Children's Courts # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Constitutional and Statutory Bodies handout pp. 23-30. Prelims PYQs quoted: none quoted in the material. In simple words NCPCR (2007, CPCR Act 2005) is the apex child-rights watchdog, with civil-court powers and a say in RTE, POCSO and JJ Acts. States have SCPCRs; Children's Courts (Sec 25) give child-friendly trials. Advice is not binding. Ncpcr Basics statutory, set up 2007 under the Commissions for Protection of Child Rights Act, 2005 , under the Ministry of WCD UNCRC 1989 , ratified by India 1992 Child = below 18 monitors RTE 2009, POCSO 2012, JJ Act 2015 Objectives protection and redressal review laws and policies child-centric governance monitor key laws research and awareness Initiatives POCSO e-Box for reporting abuse Samvardhan : vulnerability mapping against trafficking (Bihar, West Bengal pilots) MASI app : inspect Child Care Institutions (post-Muzaffarpur) GHAR-GO portal: restoration of children to families (Covid) Baal Swaraj e-monitoring (since 2020) Aspect Provision Composition Chairperson + 6 Members (at least two women) Member fields education; child health/welfare; juvenile justice; ending child labour; child psychology/sociology; child laws Appointed by Central Government; 3-member selection committee chaired by the Union WCD Minister Tenure 3 years ; renewable once (max two terms) Age Chairperson up to 65 ; Members up to 60 Removal insolvency, incapacity, moral turpitude, misuse, absence from 3 consecutive meetings Functions review safeguards annual and special reports (tabled with action-taken memorandum) inquire suo motu, on complaint or court direction study hindering factors (trafficking, labour, conflict, HIV/AIDS) children in special circumstances inspect juvenile homes research, awareness, NGOs limit: cannot inquire into matters before an SCPCR or another statutory body Powers (Sections 14-17) civil court powers: summon, documents, affidavits, public records, search/inspect premises Recommend prosecution, compensation Approach HC/SC Interim relief ATR child-friendly procedures per POCSO (confidential, anonymous) Challenges non-binding (2021 child labour advisories ignored) 1.6 lakh+ POCSO cases pending staff deficit perceived political influence (Manipur) online exploitation (NCRB 2022) digital trafficking (gaming apps, dark web; UNODC 2021) NFHS-5: only 36% rural households know child rights laws Way forward amend the Act for binding powers special POCSO/JJ benches AI tools for CSAM cyber safety in NCERT curricula more staff and psychologists diverse selection panel child-safety audits by tech firms Scpcr AND Children's Courts Aspect SCPCR Basis Section 17 of the 2005 Act; State notification Composition Chairperson + 6 Members (2 women) Appointed by State Government; selection committee chaired by the Minister in charge of children Tenure 3 years, max two terms; ages 65 and 60 Functions review state laws, inquire, inspect child institutions, special circumstances, research, coordinate with NCPCR, advise on rules Powers civil court powers; may recommend prosecution or file writs; annual report to State Legislature Children's Courts (Section 25) State Government with HC Chief Justice concurrence notifies a Sessions Court as Children's Court or sets up a separate court per district try offences against children (JJ Act, POCSO) Public Prosecutor/Special PP with 7 years child-friendly: in-camera , no direct cross-examination, counsellor, little contact with accused Work with CWCs and JJBs Restorative, \"best interest of the child\""}, {"c": "14", "n": "Bodies for Women, Children, Minorities and the NIA", "id": "3-minority-rights-common-and-separate-doma", "t": "3 · Minority Rights · Common AND Separate Domain · National Commission FOR Minorities", "x": "3 · Minority Rights · Common AND Separate Domain · National Commission FOR Minorities # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Constitutional and Statutory Bodies handout pp. 30-33. Prelims PYQs quoted: none quoted in the material. In simple words The Constitution never defines \"minority\". It gives minorities rights in a common domain (shared by all citizens) and a separate domain (Arts 29, 30, 347, 350A, 350B). NCM (statutory, 1992) covers six notified religious communities. TWO Domains OF Minority Rights Common domain DPSP: 38(2) reduce inequalities 46 weaker sections Duties: Harmony Composite culture FR: 14 15(1),(2) 15(4) 16(1),(2) 16(4) 25(1) 26 27 28 Separate domain 29(1) conserve language, script, culture 29(2) no denial of admission to State-aided institutions 30(1) minorities may establish and administer institutions 30(2) no discrimination in aid 347 recognition of a language 350A mother tongue at primary stage 350B Special Officer for Linguistic Minorities Explanation I to Art 25: Sikhs and kirpan Value addition Vision: India as a two-tier commonwealth of citizens and cultural, religious, linguistic groups; special provisions also for SCs, STs and Backward Classes; equality harmonised with diversity. National Commission FOR Minorities 1978 Ministry of Home Affairs Resolution; Minorities Commission set up under MHA 1984 moved to the new Ministry of Welfare 1988 Welfare Ministry Resolution: linguistic minorities excluded 1992 NCM Act gave statutory status 17 May 1993 first statutory Commission constituted 2014 Jains added to the notified list Notified minority Population (crore) % Muslims 17.22 14.2 Christians 2.78 2.3 Sikhs 2.08 1.7 Buddhists 0.84 0.7 Jains 0.45 0.4 Total 23.37 19.3 Note The first notification (1993) named five: Muslims, Christians, Sikhs, Buddhists, Zoroastrians (Parsis) . Section 2(c) : a minority is a community notified by the Central Government. Census 2011 basis. The handout's table omits the Parsi row but the total is shown as 19.3%. Memory aid · MCSBZJ Six notified: M uslims · C hristians · S ikhs · B uddhists · Z oroastrians · J ains. (own mnemonic) Aspect NCM Composition Chairperson, Vice-Chairperson and 5 Members Representation at least 5 incl. Chairperson from notified minorities Appointed by Central Government (Ministry of Minority Affairs) Tenure 3 years ; removal by Centre for insolvency, moral turpitude, unsound mind, misuse, absence from 3 meetings Functions (Section 9(1)) evaluate development progress monitor safeguards incl. Arts 29-30 recommend to governments examine complaints research on discrimination socio-economic and educational studies Policy suggestions Periodic and special reports other matters referred by the Centre Complaints Police excesses Service matters Minority institutions Religious property encroachments NCM seeks reports, then recommends redress (no binding force)"}, {"c": "14", "n": "Bodies for Women, Children, Minorities and the NIA", "id": "4-national-investigation-agency-scheduled", "t": "4 · National Investigation Agency · Scheduled Offences · Challenges · 2024 Ruling", "x": "4 · National Investigation Agency · Scheduled Offences · Challenges · 2024 Ruling # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Constitutional and Statutory Bodies handout pp. 34-37. Prelims PYQs quoted: none quoted in the material. In simple words NIA (NIA Act 2008, after 26/11) probes scheduled terror-linked offences across India without state consent and, since 2019, abroad. Federalism, UAPA misuse, staff gaps and low conviction are the debates. Ankush Vipan Kapoor (2024) allows linked non-scheduled offences with Central intimation. Basics AND Powers Aspect Detail Basis NIA Act, 2008 after the 26/11 Mumbai attacks ; 2019 amendment widened jurisdiction Control Ministry of Home Affairs; HQ New Delhi; branches Mumbai, Hyderabad, Kolkata, Guwahati, Kochi, Lucknow, Raipur, Jammu Head Director General (IPS) Jurisdiction concurrent across India; extended outside India (2019) Special Courts Sessions Judges nominated with High Court Chief Justice ; appeal to High Court, target 3 months Functions and powers investigate without State permission (e.g. Pulwama 2019) offences against Indians abroad scheduled offences: UAPA, WMD Act, Explosives, IPC Ch. VI take over cases from state police (e.g. Kerala gold smuggling, 2020) Civil-court-like powers Attach property TFFC cell for terror financing and fake currency work with Interpol, FBI, Europol trial in Special Courts (e.g. Ajmer Dargah blast) Scheduled category Examples Terrorism and security UAPA 1967; Atomic Energy Act 1962; WMD Act 2005 Explosives and arms Explosive Substances Act 1908; Anti-Hijacking Act 2016; prohibited arms Counterfeit currency IPC 489A-489E Offences against State IPC Chapter VI, 121-130 2019 additions human trafficking, cyber-terrorism, counterfeit currency, prohibited arms International SAARC Convention Act 1993; offences abroad involving Indians Working Process 1 local police report to State, then Centre within 24 hours 2 Centre screens within 15 days whether it is a scheduled offence 3 once NIA takes over, state police stop investigating 4 DG approves FIR; preliminary inquiry 5 officers act as station house officers across India 6 trial in Special Court (e.g. Samjhauta Express blast case, Panchkula) 7 appeal to High Court within 30 days ; two-judge bench to decide within 3 months 8 states must cooperate with logistics and witnesses Criticisms AND WAY Forward Challenges federalism (Kerala CM on gold case) human rights , long UAPA detention (Bhima Koregaon) staff: about 1,200 personnel vs 300+ cases a year (CAG 2021) overreach, selective targeting low conviction (Samjhauta acquittals 2019) cyber and darknet gaps coordination gaps (Pathankot 2016) perceived political bias Way forward Centre-State coordination council (like Inter-State Council) more staff, offices in Northeast AI, blockchain, forensic tools NHRC oversight of interrogations digital Special Courts (e-Courts Phase III) annual CAG audit MLATs, Interpol notices awareness and helplines Note Ankush Vipan Kapoor v. NIA (2024): Section 8 of the NIA Act read holistically. NIA may investigate non-scheduled offences linked to a scheduled offence (e.g. IPC fraud with terror financing), must inform the Central Government before widening the probe, and must investigate linked offences jointly . This widens jurisdiction for hybrid terror-economic-cyber crimes."}, {"c": "14", "n": "Bodies for Women, Children, Minorities and the NIA", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. NCW set up 1992 under NCW Act 1990 NCW members Chair + 5 + Member-Secretary NCW tenure 3 years Digital Shakti Phase IV 2022, Meta and CyberPeace Verma Committee 2013 constitutional status for NCW NCRB 2022 over 4.45 lakh crimes against women Women helpline 181 NCPCR set up 2007 under CPCR Act 2005 NCPCR members Chair + 6, at least two women Tenure and ages 3 years, twice; 65 and 60 UNCRC 1989, India ratified 1992 MASI app to inspect Child Care Institutions Children's Courts section Section 25 Minority defined in Constitution? No Minorities Commission founded 1978 under MHA NCM Act 1992 First statutory Commission 17 May 1993 Jains notified 2014 Minority definition (NCM Act) Section 2(c), notified by Centre Special Officer for Linguistic Minorities Art 350B Mother tongue at primary level Art 350A NIA Act 2008, after 26/11 2019 amendment jurisdiction outside India, new offences NIA head Director General (IPS) Centre screens case within 15 days Appeal to High Court within 30 days; decide in 3 months Special Court judge Sessions Judge via HC Chief Justice Ankush Vipan Kapoor 2024 linked non-scheduled offences with Central intimation"}, {"c": "14", "n": "Bodies for Women, Children, Minorities and the NIA", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts in Start Here)"}, {"c": "14", "n": "Bodies for Women, Children, Minorities and the NIA", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards"}, {"c": "15", "n": "The President, Ordinances and Parliamentary Government", "id": "1-the-president-nominal-head-discretion-el", "t": "1 · THE President · Nominal HEAD · Discretion · Election · Usa-india-france", "x": "1 · THE President · Nominal HEAD · Discretion · Election · Usa-india-france # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Executive and Legislature handout pp. 2-4. Prelims PYQs quoted: none quoted in the material. In simple words The President is the de jure head, acting on binding ministerial advice (Art 74). Real discretion exists mainly in hung Parliaments, plus one return of advice or bills. The balanced view: neither a rubber stamp nor an active ruler. Union Executive AND THE President Union Executive Part V, Chapter I, Arts 52-78 : President, Vice-President, Council of Ministers headed by the PM, Attorney-General Art 52 office of President Art 53 executive power vested in the President Why indirect election parliamentary logic: a nominal head needs no direct mandate avoids rivalry with the PM over popular mandate cost and complexity of a national poll federal representation through MPs and MLAs (Arts 54, 55) Three roles Head of State (first citizen) Supreme Commander of the armed forces Nominal/constitutional head (de jure executive) Binding Advice (article 74) Art 74(1) President acts on aid and advice of the Council of Ministers; the advice is binding 1976 42nd Amendment: made binding advice explicit 1978 44th Amendment: President may return advice once for reconsideration; reconsidered advice is binding Art 74(2) courts cannot inquire into the advice; S. R. Bommai (1994): advice is non-justiciable but the material behind it can be examined Why a nominal head continuity when governments fall non-partisan symbol separates Head of State from Head of Government limited discretion in crises such as a hung Parliament Discretionary Powers Situations choosing a PM when no party has a clear majority dismissing a PM who lost the Lok Sabha majority but will not resign ( Art 75(2) ) suspensive veto: return a bill once refuse dissolution advice from a PM who has lost the majority act until a new PM is found if the PM dies suddenly pocket veto: keep a bill pending without return or assent Note K. R. Narayanan, 1997: returned the Cabinet's advice to impose President's Rule in Uttar Pradesh , using moral authority. Rubber stamp Art 74 binds the President wide powers exercised on advice no formal override ever More than a stamp suspensive and pocket veto (Zail Singh) hung Parliament choices matter Narayanan 1997 non-partisan legitimising check R. Venkataraman (My Presidential Years): right to ask questions and seek reconsideration Way forward / key point Balanced view: neither a mere rubber stamp nor an active ruler; real role in hung Parliaments, instability and emergencies. Presidential Election Criticism of the system highly complex value of MLA votes differs by State it is neither true PR nor plain STV: one post cannot be divided proportionally, so it is really an alternative vote style, calling it PR is a \"constitutional misnomer\" Feature USA India France Type indirect, Electoral College indirect, elected MPs and MLAs direct by citizens Voters 538 electors chosen in State elections elected MPs of both Houses and elected MLAs (with Delhi, Puducherry) citizens 18+ Method winner-take-all in 48 states and DC; Maine and Nebraska by district proportional representation by single transferable vote, secret ballot, weighted votes two rounds; top two in a runoff To win 270 of 538; else House elects more than half of valid weighted votes (quota) over 50% of valid votes Eligibility natural-born, 35, 14 years residence citizen, 35, qualified for Lok Sabha, no office of profit French citizen, 18+, 500 endorsements Term 4 years 5 years 5 years Limit 2 elections (22nd Amendment) no limit (Art 57) max 2 consecutive Disputes State administration, courts Supreme Court (Art 71) Constitutional Council"}, {"c": "15", "n": "The President, Ordinances and Parliamentary Government", "id": "2-ordinance-making-power-article-123-court", "t": "2 · Ordinance-making Power · Article 123 · Court Cases · Debate", "x": "2 · Ordinance-making Power · Article 123 · Court Cases · Debate # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Executive and Legislature handout pp. 4-7. Prelims PYQs quoted: none quoted in the material. In simple words Under Art 123 the President (on advice) can issue an ordinance when a House is not in session. It has the force of an Act but lapses six weeks after Parliament reassembles. Courts forbid repeated re-promulgation (Wadhwa, Krishna Kumar Singh). Article 123: Conditions When Either House (or both) not in session If both are sitting, no ordinance Same force as an Act but temporary Usable in peacetime (not an Emergency power) Rare in democracies UK and USA have none Ambedkar: to meet a \"situation which may suddenly and immediately arise\" Conditions and limits President satisfied of immediate necessity (acts on Art 74 advice) 38th Amendment 1975 made satisfaction final 44th Amendment 1978 removed that, restoring review for mala fide or irrelevant material subject matter: Union and Concurrent List Can amend or repeal laws, retrospective subject to Art 20(1) cannot violate Fundamental Rights or amend the Constitution (Art 368) Duration laid before both Houses on reassembly ceases six weeks after reassembly (from the later date) unless replaced by an Act ends earlier if both Houses pass disapproving resolutions maximum normally six months + six weeks (Art 85(1) interval) may be withdrawn anytime Lok Sabha Rule 71(1): replacing Bill needs a statement of why urgent Memory aid · SIX-6-6 Duration: 6 weeks after reassembly; at most 6 months gap + 6 weeks. (own mnemonic) Judicial Control 1970 R. C. Cooper: ordinance power has constitutional limits; challengeable for violating rights 1982 A. K. Roy: ordinance-making is a legislative power with constitutional limits; judicial review 1987 D. C. Wadhwa v. Bihar: Bihar promulgated 256 ordinances (1967-81), some kept up to 14 years ; re-promulgation is a \"fraud on the Constitution\" 2017 Krishna Kumar Singh v. Bihar (7 judges): repeated ordinances impermissible; laying is mandatory; rights under an ordinance do not automatically survive expiry (except where reversing is impossible, impractical or against public interest); courts check for misuse Trends, Debate, Examples Period Ordinances 1952-2014 over 660 (about 10 a year) 16th Lok Sabha (2014-19) 45 17th Lok Sabha (2019-24) 29 Nehru era (first three Lok Sabhas, 1952-64) 66 1978 High Denomination Bank Notes (Demonetisation) Ordinance Issues separation of powers blurred bypasses debate and committees fait accompli (asset t
