elling public interest; and courts can examine whether the power was used for a genuine purpose or misused. History AND Trends Evolution Nehru era (1952-64): 66 ordinances during the first three Lok Sabhas. 1978: demonetisation was carried out through the High Denomination Bank Notes (Demonetisation) Ordinance, 1978. 1990s: coalition politics and legislative delays increased reliance on ordinances. Period Ordinances promulgated 1952-2014 Over 660 (around 10 a year) 16th Lok Sabha (2014-19) 45 17th Lok Sabha (2019-24) 29 Critical Debates AND Issues Constitutional principles at stake Separation of powers: ordinances let the Executive temporarily exercise legislative power, which upsets the institutional balance. Parliamentary accountability: they bypass debate, committee scrutiny and public consultation. Fait accompli: the Executive can take irreversible decisions through an ordinance (asset transfers, restructuring) that Parliament may find hard to undo later. Federal balance: Governors have a similar power under Article 213 , which raises concerns over executive misuse and Centre-State relations. The Seervai debate H. M. Seervai’s defence: the ordinance power is essential because Indian courts have strong judicial review and can strike down an existing law immediately. In such a case an ordinance avoids an administrative or legal vacuum while Parliament is in recess. Counter-argument: The USA has equally strong judicial review without giving the President decree powers It relies on emergency legislative sessions instead Important ordinance What it did Government of NCT of Delhi (Amendment) Ordinance, 2023 Created the NCCSA and increased the Lieutenant Governor’s control over services in Delhi CVC (Amendment) and DSPE (Amendment) Ordinances, 2021 Allowed up to three one-year extensions for ED and CBI Directors, raising their maximum tenure to five years Essential Defence Services Ordinance, 2021 Restricted strikes and lockouts in essential defence services during restructuring of 41 ordnance factories Tribunals Reforms Ordinance, 2021 Abolished appellate bodies like IPAB and FCAT and moved their functions to existing courts and authorities Commission for Air Quality Management in NCR Ordinance, 2021 Set up the CAQM to control air pollution and stubble burning in Delhi and nearby areas Farm Sector Reform Ordinances, 2020 Allowed agricultural trade outside APMC mandis and set a contract-farming framework; the resulting Acts were repealed in 2021 Way forward: strengthening safeguards Timely parliamentary scrutiny: a convention to convene Parliament within one or two weeks of promulgating a major ordinance, so debate happens early. More assertive Presidential oversight: use the proviso to Article 74(1) to return questionable ordinance recommendations for Cabinet reconsideration. Reversible actions: as far as possible, actions under an ordinance should be reversible if Parliament does not pass the replacing law, in line with Krishna Kumar Singh (2017). Way forward / key point Conclusion: ordinance-making is a necessary mechanism for urgent legislation but must remain the exception. Parliamentary scrutiny, judicial review and responsible executive conduct are needed to prevent misuse."}, {"c": "15", "n": "The President, Ordinances and Parliamentary Government", "id": "3-comparisons-president-india-vs-germany-v", "t": "3 · Comparisons · President: India vs Germany · Vice-president: India vs USA · PM vs US President", "x": "3 · Comparisons · President: India vs Germany · Vice-president: India vs USA · PM vs US President # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Executive and Legislature handout pp. 7-10. Prelims PYQs quoted: none quoted in the material. In simple words Three comparison tables the handout gives for quick revision: how the Indian President differs from Germany’s head of state, how the Indian Vice-President differs from the American one, and how the Indian Prime Minister differs from the US President. Learn the contrasts: nominal vs real executive, fusion vs separation of powers, fixed tenure vs confidence. President OF India vs President OF Germany Basis India Germany Constitutional position Nominal Head of State; the PM is the real executive Nominal Head of State; the Chancellor is the real executive Election Indirect election by an Electoral College Indirect election by the Federal Convention Electoral college Elected MPs of both Houses and elected MLAs of States, Delhi and Puducherry All Bundestag members and an equal number of delegates elected by State Parliaments (delegates need not be State legislators) Voting method Proportional Representation by Single Transferable Vote with weighted votes, secret ballot Secret ballot; absolute majority in the first two rounds; most votes wins in the third round Minimum age 35 years 40 years Eligibility Indian citizen, qualified for Lok Sabha membership, no disqualifying office of profit German citizen eligible to vote in Bundestag elections Tenure 5 years 5 years Re-election No term limit (Article 57) Only one consecutive re-election (Article 54) Executive powers Executive power vested in the President (Article 53), used mainly on ministerial advice Mainly representative and constitutional functions; the Chancellor heads the government Ministerial advice Binding advice of the Council of Ministers; can seek reconsideration once (Art 74) Presidential orders generally need countersignature by the Chancellor or a Minister, with exceptions (Art 58) Appointment of head of government Appoints the PM, normally the leader who commands a Lok Sabha majority Proposes the Chancellor, who is elected by the Bundestag; the President formally appoints Veto powers Absolute, suspensive and pocket veto over ordinary Bills, within constitutional limits (Article 111) No general political or pocket veto; may refuse to sign laws on constitutional grounds (Article 82) Ordinance power Can issue ordinances under Article 123 No equivalent power Dissolving the lower House Can dissolve the Lok Sabha (Article 85), ordinarily on ministerial advice Can dissolve the Bundestag only in specified circumstances (Articles 63 and 68) Military command Supreme Commander of the Defence Forces (Article 53) Defence Minister commands in peacetime; the Chancellor during a state of defence Pardoning power Article 72, including death sentences and other specified cases Article 60, for individual federal cases Removal Impeachment by Parliament for violation of the Constitution (Article 61) Bundestag or Bundesrat can bring charges; the Federal Constitutional Court decides removal (Article 61) Key distinctions India: the President has wider formal powers in ordinances, emergencies and legislative assent. Germany: The President mainly performs constitutional and representative functions The Chancellor has stronger executive authority Major difference: In India the President formally appoints the PM In Germany the Bundestag elects the Chancellor , who is then appointed by the President Vice-president OF India vs Vice-president OF THE USA Aspect Vice-President of India Vice-President of the USA Basis / model An office modelled on the American Vice-President but adapted to the Indian parliamentary framework Original executive institution under the US presidential system Legislative role Ex officio Chairman of the Rajya Sabha (Upper House) President of the Senate (Upper House of Congress) Executive role No real executive authority; functions are largely legislative and ceremonial Significant executive importance as the immediate successor to the President Succession to Presidency Acts as President temporarily when a vacancy arises; an election for a new President must be held within six months Automatically becomes President on the death, resignation or removal of the President and serves the remaining term Tenure after succession Acts only till the new President takes office Continues as President for the unexpired term of the predecessor Nature of position Parliamentary and largely legislative in function Executive and constitutional successor in nature Prime Minister OF India vs President OF THE USA Quote Sir Ivor Jennings: “The Prime Minister is the keystone of the Constitution. All roads in the Constitution lead to the Prime Minister.” In India’s parliamentary system the President is the nominal (de jure) executive and Head of State, while the Prime Minister is the real (de facto) executive, Head of the Government, responsible for administration and policymaking. Dimension Prime Minister of India President of the United States System of government Parliamentary (Westminster) system: fusion of executive and legislative powers Presidential system: separation of powers with checks and balances Nature of office Head of Government (de facto executive); the President of India remains the nominal Head of State Both Head of State and Head of Government Election and appointment Appointed by the President; must command majority support in the Lok Sabha Indirectly elected through the Electoral College (538 electors) Legislative membership Mandatory: must be a member of either House (or become one within six months) Prohibited: cannot be a member of Congress (Article I, Section 6) Cabinet structure Council of Ministers drawn generally from Parliament, functioning on collective responsibility (primus inter pares) Presidential Cabinet: department secretaries are appointed by the President with Senate confirmation and are executive officials and advisers, not collectively responsible Tenure and stability Flexible: no fixed personal term; continues while the government keeps Lok Sabha confidence Fixed 4-year term, limited to a maximum of two elections (22nd Amendment) Legislative influence Direct and significant: guides government Bills, legislative priorities and the agenda Indirect: cannot directly introduce Bills; relies on members of Congress to sponsor legislation Veto powers over Bills No personal veto; assent is handled by the President of India, ordinarily on the Council’s advice Has a regular veto (overridable by two-thirds in both Houses) and a pocket veto Dissolution of legislature Can advise the President to dissolve the Lok Sabha before its five-year term ends Has no power to dissolve the House or the Senate Military command Directs military policy de facto through the Cabinet Committee on Security; the Indian President remains constitutional Supreme Commander Direct constitutional Commander-in-Chief of the US Armed Forces (Article II, Section 2) Removal A successful no-confidence motion by a simple majority of members present and voting in the Lok Sabha requires the entire Council of Ministers to resign Removed through impeachment: simple majority in the House and conviction by two-thirds of Senators present"}, {"c": "15", "n": "The President, Ordinances and Parliamentary Government", "id": "4-parliamentary-system-features-vs-preside", "t": "4 · Parliamentary System · Features · vs Presidential · Merits AND Limits · WHY India Chose IT · India vs Britain", "x": "4 · Parliamentary System · Features · vs Presidential · Merits AND Limits · WHY India Chose IT · India vs Britain # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Executive and Legislature handout pp. 10-12. Prelims PYQs quoted: none quoted in the material. In simple words India follows a parliamentary system at both Union (Articles 74 and 75) and State (Articles 163 and 164) level: the executive is accountable to the legislature, with a nominal head and a real head. It gives harmony, accountability and flexibility but can bring instability and cabinet dominance. India chose it because of historical familiarity and the wish for responsible government. It differs from Britain in being a republic with a written constitution and judicial review. WHAT IS A Parliamentary System? Meaning The Indian Constitution sets up a parliamentary system at the Union level (Articles 74 and 75) and the State level (Articles 163 and 164) . Parliamentary system: the executive is politically accountable to the legislature. Examples: India, Britain, Japan, Canada. Presidential system: the executive has a fixed tenure and does not depend on legislative confidence. Examples: USA, Brazil. It is also called Cabinet Government, Responsible Government or the Westminster Model . Ivor Jennings called it a “cabinet system” because the Cabinet holds real executive authority. Traditionally the PM was “ primus inter pares ” (first among equals). But the PM’s growing dominance led scholars like Crossman and Mackintosh to call it “prime ministerial government” . KEY Features IN India Eight features 1. Nominal and real executive. The President is the nominal (de jure) executive and Head of State The PM is the real (de facto) executive and Head of Government. Under Article 74 the President acts on aid and advice but may seek reconsideration once 2. Majority party rule. The President appoints as PM a leader who can command majority support in the Lok Sabha. In a hung Parliament, a party or coalition that can secure a majority forms the government. 3. Collective responsibility (Article 75(3)). The Council of Ministers is collectively responsible to the Lok Sabha. A successful no-confidence motion forces the entire Council to resign. 4. Political cohesion. Ministers generally follow common policies and collective decisions. In coalitions, unity depends on cooperation and consensus. 5. Dual membership. Ministers belong to both the executive and the legislature, a fusion of powers. Under Article 75(5) a non-MP minister must become a member of either House within six months. 6. Leadership of the PM. The PM heads the Council, coordinates policy and is the central link between the President, Cabinet and Parliament. 7. Dissolution of the lower House (Article 85). The President may dissolve the Lok Sabha, ordinarily on the advice of the Council of Ministers headed by the PM, allowing fresh elections before the term ends. 8. Secrecy (Article 75(4)). Ministers take an oath of office and of secrecy, administered by the President. Cabinet discussions stay confidential, so there can be free debate and collective decisions. Basis Parliamentary system (India) Presidential system (USA) Executive Dual: President (nominal) and PM (real) Single: the President is both Head of State and Government Executive and legislature Fusion of powers Separation of powers Tenure Depends on legislative confidence Fixed tenure of 4 years Responsibility Collective responsibility to the Lok Sabha Cabinet is accountable to the President Removal No-confidence motion President removable through impeachment Dissolution Lok Sabha can be dissolved early President cannot dissolve Congress Membership Ministers normally belong to Parliament Cabinet members cannot simultaneously serve in Congress Advantages (merits) Five advantages 1. Executive-legislative harmony: fusion promotes coordination and smoother lawmaking. 2. Responsible government: Article 75(3) ensures accountability through Question Hour, debates, committees and no-confidence motions. 3. Checks on arbitrary power: collective responsibility and parliamentary scrutiny help prevent misuse of executive authority. 4. Alternative government: another party or coalition can form a government without fresh elections if it can win a majority. Jennings: the Leader of the Opposition serves as an “alternative Prime Minister”. 5. Broad representation: the Council of Ministers can include different regions, communities and political groups, reflecting India’s diversity. Limitations (demerits) Six limitations 1. Political instability: coalition disputes and loss of majority can cause frequent changes. Examples: the short-lived governments of Charan Singh, V. P. Singh, Chandra Shekhar and I. K. Gujral. 2. Lack of policy continuity: a change of government may reverse policies. Example: the Janata Government (1977-79) reversed several policies of the earlier Congress government. 3. Cabinet dictatorship: a strong majority lets the PM and Cabinet dominate Parliament and weakens scrutiny. H. J. Laski and Ramsay Muir warned of the “dictatorship of the cabinet”. Example: concentration of power during the Emergency (1975-77). 4. Fusion of powers: close links weaken checks and balances. Walter Bagehot: “the cabinet is a hyphen that joins the buckle that binds the executive and legislative departments together.” 5. Governance by non-experts: ministers are chosen mostly on political considerations, so technical expertise may be limited. 6. Coalition compulsions: policy compromises, conflicting priorities and slower decisions. WHY India Adopted THE Parliamentary System Six reasons 1. Historical familiarity: India had experience with parliamentary institutions under British rule The Government of India Acts of 1919 and 1935 gradually introduced responsible government, especially in the provinces 2. Preference for responsible government: B. R. Ambedkar stressed balancing stability and responsibility. The Constituent Assembly preferred more executive accountability over the fixed tenure of a presidential system. 3. Preventing deadlocks: the fusion of executive and legislature was expected to reduce conflict and ease lawmaking. 4. Accommodating diversity: The system allows regions, communities and parties to be represented in the executive Coalitions can accommodate regional interests 5. Flexibility: a government can be replaced without fresh elections if another leader gets a majority. 6. Swaran Singh Committee (1976): recommended keeping the parliamentary system rather than shifting to a presidential form. Indian vs British Parliamentary System Basis India Britain Nature of State Republic Constitutional monarchy Head of State Elected President Hereditary monarch Supremacy Constitutional supremacy Parliamentary sovereignty Constitution Written Uncodified Judicial review Courts can strike down unconstitutional laws Courts generally cannot invalidate Acts of Parliament Prime Minister May belong to either House Conventionally belongs to the House of Commons Ministers Non-MPs allowed for six months Ministers normally belong to either House Legal responsibility No general requirement of ministerial countersignature of presidential acts Certain royal acts need ministerial countersignature Shadow Cabinet No formal shadow cabinet Established opposition institution Political structure Federal system Predominantly unitary system with devolution Way forward / key point Conclusion: India’s parliamentary system combines executive accountability, political flexibility and representative governance. Its success depends on strong parliamentary scrutiny, collective responsibility and respect for constitutional institutions."}, {"c": "15", "n": "The President, Ordinances and Parliamentary Government", "id": "5-council-of-ministers-cabinet-committees", "t": "5 · Council OF Ministers · Cabinet · Committees · Cabinet Secretariat · PMO · Central Secretariat", "x": "5 · Council OF Ministers · Cabinet · Committees · Cabinet Secretariat · PMO · Central Secretariat # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Executive and Legislature handout pp. 13-18. Prelims PYQs quoted: none quoted in the material. In simple words The Council of Ministers is the full ministry (Cabinet Ministers, Ministers of State, Deputy Ministers), capped at 15% of the Lok Sabha by the 91st Amendment. The Cabinet is its small inner core that takes the real policy decisions. It is supported by Cabinet Committees, the Cabinet Secretariat (headed by the Cabinet Secretary), the PMO and the Central Secretariat. Each is useful but also raises issues like centralisation and delays. Council OF Ministers: Composition AND SIZE Composition The Council of Ministers is a large body that includes all ministers of the Union Government. Its composition is decided by the Prime Minister, who considers seniority, political experience, regional balance and coalition needs. The Constitution does not rank ministers, but three broad categories have grown by convention. Category Role Cabinet Ministers The core policy-making body and the most powerful subset. Senior ministers with key portfolios such as Defence, Home Affairs, Finance and External Affairs. Chaired by the PM; takes decisions on major national policies. Ministers of State (Attached) Assist a Cabinet Minister and handle specific areas or departments within that ministry. Ministers of State (Independent Charge) Head ministries or departments independently. Not regular Cabinet members but may attend Cabinet meetings when invited. Deputy Ministers Assist Cabinet Ministers or Ministers of State in administrative and parliamentary work. No independent charge. The rank has lost significance and is rarely used now. Size: the 91st Amendment (2003) It introduced a ceiling : under Article 75(1A) the total number of ministers, including the PM, cannot exceed 15% of the Lok Sabha’s strength . With 543 seats, the maximum is 81 ministers including the PM. Arguments for a smaller Council Arguments for a larger Council Clearer decision-making and less overlap India’s scale needs functional coverage across ministries Lower public expenditure Ensures regional and community representation Avoids rewarding political allies Accommodates coalition partners Easier individual accountability Specialised portfolios need dedicated ministers First ARC (1966) recommendations The Union Cabinet should normally have 16 ministers including the PM. The Council of Ministers should normally have 40 members and never exceed 45 . A Deputy Prime Minister could help with coordination and administrative reform. A Cabinet Committee on Administration, with support in the Cabinet Secretariat, should help in reforms. THE Cabinet What it is The Cabinet is the smaller and more powerful body inside the Council of Ministers and the principal policy-making and decision-making authority of the Union Government. Ramsay Muir called it the “ steering wheel of the ship of the State ”. Constitutional status: the word “Cabinet” was formally put into the Constitution by the 44th Amendment, 1978 . Under Article 352(3) , a National Emergency cannot be proclaimed unless the written decision of the Union Cabinet is communicated to the President. The Cabinet consists of the PM and ministers of Cabinet rank as specified under Article 352. Basis Council of Ministers Cabinet Composition All categories of ministers PM and Cabinet Ministers Size Larger body Smaller body Role Implements policies and exercises executive responsibility Principal policy-making and decision-making body Meetings Rarely meets as a whole Meets regularly Constitutional mention Articles 74 and 75 Article 352(3) Responsibility Collectively responsible to the Lok Sabha Maintains policy unity and Cabinet solidarity Functions of the Cabinet Policy formulation: the main policy-making body of the government. Legislative management: decides the legislative agenda, major Bills and proposals about parliamentary sessions. Financial functions: directs Budget preparation, expenditure and economic policy. Administrative coordination: coordinates ministries and settles major policy differences. Appointments and crisis management: oversees major appointments and takes key decisions in national emergencies and crises. Cabinet dominance and checks on it Because the Cabinet comes from Parliament yet strongly influences its agenda, it is said that “ the creation dominates the creator ”. A strong majority can lead to Cabinet dominance and weaker scrutiny. Judicial checks: judicial review of executive actions. Legislative checks: questions, debates, motions and committees. Institutional checks: oversight by the Election Commission, CAG and other independent bodies. Political checks: public opinion, media scrutiny, opposition parties and pressure within the party. Kitchen Cabinet (Inner Cabinet) A smaller, informal group of the PM and a few trusted colleagues. It discusses sensitive or urgent political matters before formal Cabinet meetings. It brings speed and confidentiality, but may dilute the authority of the formal Cabinet. Example: during Indira Gandhi’s leadership, advisers like P. N. Haksar and D. P. Dhar had considerable influence. Cabinet Committees What they are — small groups of ministers formed to deal with specific policy areas or administrative functions. They reduce the Cabinet’s workload by examining issues in detail before decisions are taken. Extra-constitutional: not mentioned in the Constitution. They work under the Government of India (Transaction of Business) Rules, 1961 , framed under Article 77(3) . Formation: their number, names and composition are decided by the Prime Minister. Membership: Generally senior Cabinet Ministers Ministers of State may be included or invited Chair: the PM or a designated senior minister. Types: Standing committees work on a continuing basis Ad hoc committees are formed for specific purposes Cabinet Committee Major functions 1. Political Affairs (CCPA) Political coordination, Centre-State relations and major policy disputes. Often called the “ Super Cabinet ”. 2. Economic Affairs (CCEA) Major economic and industrial policies, investment approvals, pricing and subsidies 3. Security (CCS) Defence, national security, strategic planning and major defence procurement 4. Appointments (ACC) Important senior appointments, postings and personnel decisions 5. Parliamentary Affairs Coordination of government business in Parliament and legislative priorities 6. Investment and Growth Promotes investment and infrastructure and removes policy bottlenecks 7. Skill, Employment and Livelihood Employment generation, skill development and workforce participation 8. Accommodation Allocation and management of government accommodation Functions and significance Efficient decisions: smaller committees examine proposals and decide faster. Specialisation: ministers with relevant experience go into details. Inter-ministerial coordination: resolve disputes and prevent delays. Collective responsibility: encourages consultation and limits arbitrary decisions by individual ministers. PM leadership: helps the PM supervise important policy areas. Issues with Cabinet Committees Irregular meetings in some committees. Limited participation: junior ministers can be included but may have little say. Political considerations: membership can reflect political stature rather than expertise. Centralisation: the PM chairing several key committees may reduce independent ministerial deliberation. Weak Cabinet scrutiny: committee decisions may get limited discussion in the full Cabinet. Cabinet Secretariat AND Cabinet Secretary Cabinet Secretariat The organisation created specifically to support the Cabinet, Cabinet Committees and the Prime Minister. It works directly under the PM and is the chief coordinating agency of the Government of India. 1. Secretarial assistance: Prepares and circulates agendas and background papers for Cabinet meetings Records and circulates minutes Monitors implementation of Cabinet decisions 2. Implementing the Rules of Business: the Government of India (Transaction of Business) Rules, 1961 and the (Allocation of Business) Rules, 1961. 3. Inter-ministerial coordination: Resolves differences between ministries Promotes policy coordination and prevents duplication Uses Committees of Secretaries for inter-ministerial issues 4. Administrative monitoring: collects information on ministries’ major activities, monitors decisions and implementation, and coordinates responses in major crises. 5. Policy support: promotes new policy initiatives and gives administrative support for coherent governance. Cabinet Secretary Heads the Cabinet Secretariat and is regarded as the senior-most civil servant in the Government of India. Head of civil services: senior-most administrative coordinator and ex-officio Chairman of the Civil Services Board. Adviser: gives high-level administrative advice to the PM and Cabinet. Coordinator: resolves disputes among Secretaries. Link: a buffer between the political executive and the civil services, protecting both from undue interference. Leader: often called the “ conscience keeper of the civil services ” because his conduct influences the whole system. Facts: N. R. Pillai was the first Cabinet Secretary of independent India. T. V. Somanathan is the current Cabinet Secretary as per the handout (verify). Extensions may be given in public interest under service rules, generally within a four-year ceiling, with a possible further extension of up to three months. Prime Minister’s Office (PMO) What it is — a non-constitutional administrative body that gives secretarial assistance to the Prime Minister. Evolution: Set up as the Prime Minister’s Secretariat (PMS) on 15 August 1947 Renamed the Prime Minister’s Office (PMO) on 28 March 1977 . It has become a major centre of policy coordination and monitoring Functions: Policy advice (briefing notes, analysis, recommendations) Coordination between ministries and an interface between PM and bureaucracy Monitoring of major programmes and decisions Direct responsibilities such as helping the PM in departments under his charge (Atomic Energy and Space) and NITI Aayog Public relations, important correspondence and diplomatic engagements Why a strong PMO is needed Continuity of administrative support and advice to the PM. Coordination of issues involving many ministries. Policy monitoring of important decisions and implementation. International engagement: helps coordinate communication with foreign governments and leaders. Centralisation of power in the PMO It has grown from a secretariat-style support body into a major coordinating centre of governance, especially under politically strong PMs. Reasons: strong electoral mandates demanding coordination Need for a single point of inter-ministerial coordination Leadership styles that prefer central control Concerns: (1) weak Cabinet deliberation , as major decisions may be taken in the PMO before they reach the Cabinet (2) reduced ministerial autonomy , so ministers become implementers (3) a parallel power structure of unelected officials with influence but no parliamentary accountability (4) delays from too many approvals moving upwards (5) weak federal consultation , States feeling sidelined Way forward: The PMO must work through the established administrative system and not bypass it Strong coordination should strengthen, not weaken, collective Cabinet responsibility Central Secretariat What it is — the headquarters of Union ministries and departments, which assists the political executive in policy formulation, legislation, budgeting and administrative supervision. Split system: the Government of India broadly follows a split between policy formulation (mainly the Secretariat and ministries) and policy implementation (attached offices, subordinate offices and field agencies). Example: the Health Ministry frames policy, while implementing agencies and field institutions carry out programmes. Functions of the Central Secretariat Policy formulation: gives ministers background information, facts, data and advice, and examines the legal and administrative impact of proposals. Legislative functions: Prepares draft Bills, rules and regulations Helps ministers answer parliamentary questions and debates Financial functions: prepares Budget proposals and monitors departmental spending. Administrative supervision: general supervision over implementation, ordinarily without day-to-day field work. Coordination: a channel between ministries, Union and State governments, and bodies like CAG and UPSC. Institutional memory: keeps records of earlier decisions for continuity and consistency. Issues and reforms Issues: Administrative delay (too many file layers) Generalist bias (limited domain expertise) Technology gaps Overlapping functions Weak coordination with State governments Reforms: The Second ARC recommended flatter structures, fewer levels and more delegation Strengthen domain expertise, including lateral entry where suitable Expand e-Office and digital file movement Merge or reorganise ministries with overlapping functions Mission Karmayogi to build the capacity and skills of Secretariat staff The aim: a leaner, more specialised, digital and better-coordinated Secretariat that makes policymaking faster and citizen-focused."}, {"c": "15", "n": "The President, Ordinances and Parliamentary Government", "id": "6-constitution-130th-amendment-bill-2025-r", "t": "6 · Constitution (130th Amendment) BILL, 2025 · Removal OF Ministers · Basic Structure Questions", "x": "6 · Constitution (130th Amendment) BILL, 2025 · Removal OF Ministers · Basic Structure Questions # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Executive and Legislature handout pp. 18-20. Prelims PYQs quoted: none quoted in the material. In simple words The 130th Amendment Bill (introduced 20 August 2025, sent to a Joint Parliamentary Committee) would remove the PM, Union Ministers, CMs and State ministers who stay in custody for 30 consecutive days for offences punishable by 5 years or more. Supporters see it as closing a gap and stopping “governing from jail”. Critics say it clashes with presumption of innocence, federalism and parliamentary democracy. It has not become law. THE BILL Basics The Constitution (One Hundred and Thirtieth Amendment) Bill, 2025 was introduced in the Lok Sabha on 20 August 2025 by the Minister of Home Affairs and referred to a Joint Parliamentary Committee (JPC) . It proposes the removal of the Prime Minister, Union Ministers, Chief Ministers and State/UT Ministers who remain in custody for 30 consecutive days in connection with serious criminal offences. Status: the Bill remains under parliamentary examination and has not become law (current affairs; verify). Key provisions Threshold: applies to ministers accused of offences punishable with imprisonment that may extend to five years or more , who stay arrested and detained for 30 consecutive days . Union and State ministers: the President (on the PM’s advice) or the Governor (on the CM’s advice) must remove the minister. Advice must be given by the 31st day of custody. Without advice the minister automatically ceases to hold office from the 32nd day . PM and CMs: Must resign by the 31st day of custody If not, they automatically cease to hold office from the 32nd day Reappointment: a removed minister, PM or CM may be reappointed after release from custody. Companion legislation: similar provisions are proposed for Puducherry and Jammu and Kashmir through separate amendment Bills. Delhi is covered by the proposed amendment to Article 239AA . Rationale Why the Bill is proposed Closing a constitutional gap: the Constitution has no separate general criminal disqualification standard for ministers beyond existing constitutional and legislative rules. Criminalisation of politics: under Section 8 of the Representation of the People Act, 1951 , criminal disqualification generally follows conviction , which can take years. Administrative continuity: to stop ministers from continuing in executive office during long custody, addressing the concern of “ governing from jail ”. Constitutional Challenges: Basic Structure The Bill raises concerns under the Basic Structure doctrine (Kesavananda Bharati, 1973) because removal can happen before conviction or even before charges are framed. 1. Parliamentary democracy. In P. V. Narasimha Rao v. State (1998) the Supreme Court recognised parliamentary democracy as part of the basic structure, and under Article 75(3) the Council of Ministers is responsible to the Lok Sabha. In Manoj Narula v. Union of India (2014) the Court recognised the constitutional prerogative of the PM and CM to select ministers, which automatic removal may restrict. Concern: investigative action could end the tenure of elected governments without a no-confidence vote. 2. Federal balance. Under S. R. Bommai (1994) federalism is part of the basic structure. Central agencies such as the ED, CBI or NIA arresting a State CM could trigger removal, raising fears of Union interference. State agencies acting against Union ministers or another State’s CM could cause inter-governmental confrontation. 3. Rule of law and presumption of innocence. Under Section 35 of the BNSS, 2023 , arrests can be made on grounds including reasonable suspicion, subject to safeguards Arrest does not prove guilt. Section 187 BNSS provides default bail after 60 or 90 days, so 30 days of custody can pass before charges are framed. Strict bail conditions in PMLA Section 45 and UAPA Section 43D(5) apply in specified cases. Concern: removal before a judicial finding on the merits raises questions of arbitrariness, due process and presumption of innocence under Articles 14 and 21 Mechanism Authority / process Trigger Legislator disqualification (Articles 103/192) President/Governor, acting on the Election Commission’s opinion Constitutional and statutory disqualifications such as office of profit Defection (Tenth Schedule) Speaker/Chairman, subject to judicial review Defection or violation of party whip, subject to exceptions Criminal disqualification (Section 8, RPA 1951) Criminal conviction by a competent court Specified convictions, including 2+ years’ imprisonment under Section 8(3) Proposed 130th Amendment President/Governor on advice, or automatic cessation 30 consecutive days of custody for an offence punishable with 5+ years Note Spot the difference: existing rules disqualify after conviction ; the proposal acts after 30 days of custody without conviction. That is the heart of both the support and the criticism."}, {"c": "15", "n": "The President, Ordinances and Parliamentary Government", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Union Executive consists of President, Vice-President, Council of Ministers with the PM, and Attorney-General Which Articles deal with executive power of the Union? Article 52 (office), 53 (executive power), 74 (advice), 75 (ministers) Which amendment made ministerial advice binding? 42nd Amendment, 1976 Which amendment allowed one reconsideration? 44th Amendment, 1978 Can courts inquire into advice given by ministers? No (Art 74(2)), but the material behind it can be examined (Bommai) Who returned advice for President’s Rule in UP in 1997? K. R. Narayanan Pocket veto is associated with President Zail Singh Is the Presidential election true PR-STV? Not exactly; critics call it an alternative vote, since one office cannot be divided Who decides Presidential election disputes? Supreme Court (Article 71) Article for the President’s ordinance power Article 123 (Governor: Article 213) When can an ordinance be issued? When either or both Houses are not in session and immediate action is needed Life of an ordinance Lapses 6 weeks after Parliament reassembles; maximum 6 months + 6 weeks Which amendment removed the bar on reviewing satisfaction? 44th Amendment, 1978 (the 38th had made it final) Can an ordinance amend the Constitution? No, only Article 368 can Case: repeated re-promulgation is fraud on the Constitution D. C. Wadhwa v. State of Bihar, 1987 (256 ordinances) 2017 seven-judge case on lapsed ordinances Krishna Kumar Singh v. State of Bihar Ordinances in 16th and 17th Lok Sabha 45 and 29 Farm ordinances 2020 — outcome Resulting Acts repealed in 2021 Minimum age: President of India / Germany 35 / 40 Re-election limit in Germany Only one consecutive re-election (Art 54) Who elects the German Chancellor? The Bundestag; the President formally appoints Indian VP is ex officio Chairman of the Rajya Sabha When the Indian President’s office is vacant, VP acts till A new President is elected within six months US VP succeeding the President Serves the unexpired term PM must be a member of Parliament? Yes, or become one within six months US President as a member of Congress? Prohibited Removal of PM vs US President No-confidence motion vs impeachment (two-thirds Senate conviction) Articles on the parliamentary system: Union / State 74-75 / 163-164 Collective responsibility article Article 75(3), to the Lok Sabha Non-MP minister must become an MP within Six months (Art 75(5)) Oath of secrecy for ministers Article 75(4) Who called PM the keystone of the Constitution? Ivor Jennings Who warned of “dictatorship of the cabinet”? H. J. Laski and Ramsay Muir Committee that recommended keeping the parliamentary system (1976) Swaran Singh Committee Examples of unstable governments Charan Singh, V. P. Singh, Chandra Shekhar, I. K. Gujral India vs Britain: supremacy Constitutional supremacy vs parliamentary sovereignty Ceiling on the Council of Ministers 15% of Lok Sabha strength (Art 75(1A), 91st Amendment 2003); 81 for 543 seats First ARC suggested Cabinet size 16 ministers; Council normally 40, never above 45 Which amendment introduced the word “Cabinet”? 44th Amendment, 1978 (Art 352(3)) Cabinet Committees work under which rules? Transaction of Business Rules, 1961, framed under Art 77(3) Which committee is called the “Super Cabinet”? Cabinet Committee on Political Affairs Who heads the Cabinet Secretariat? Cabinet Secretary (first: N. R. Pillai) PMO became PMO on 28 March 1977 (PMS since 15 Aug 1947) Which reform body suggested flatter Secretariat? Second ARC Who coined “steering wheel of the ship of the State”? Ramsay Muir 130th Amendment Bill introduced on 20 August 2025 in Lok Sabha; referred to a JPC Custody period that triggers removal 30 consecutive days Offence threshold Punishable with 5 years or more When does a minister automatically cease to hold office? From the 32nd day if no advice is given by the 31st Which Article is amended for Delhi? Article 239AA Basic structure cases cited Kesavananda Bharati; P. V. Narasimha Rao (1998); Manoj Narula (2014); S. R. Bommai (1994) Criminal disqualification today is based on Conviction (Section 8, RPA 1951) Default bail BNSS section Section 187 (60 or 90 days) Status as per handout Under parliamentary examination; not law (verify)"}, {"c": "15", "n": "The President, Ordinances and Parliamentary Government", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts in Start Here)"}, {"c": "15", "n": "The President, Ordinances and Parliamentary Government", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards"}, {"c": "16", "n": "Speaker, Privileges, Bicameralism and Functioning of Parliament", "id": "1-speaker-of-the-lok-sabha-powers-independ", "t": "1 · Speaker OF THE LOK Sabha · Powers · Independence · “ONCE A Speaker, Always A Speaker” · Reforms", "x": "1 · Speaker OF THE LOK Sabha · Powers · Independence · “ONCE A Speaker, Always A Speaker” · Reforms # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Executive and Legislature handout pp. 20-22. Prelims PYQs quoted: none quoted in the material. In simple words The Speaker presides over the Lok Sabha, decides if a Bill is a Money Bill, rules on anti-defection disqualification and guards members’ privileges. Safeguards protect the office, but real neutrality is doubted because the Speaker usually stays in a party and decides disqualification cases. Reforms include bipartisan selection, an independent tribunal for anti-defection and the convention “Once a Speaker, always a Speaker”. Powers AND Functions OF THE Speaker 1. Presiding and disciplinary powers Presides over the Lok Sabha and over joint sittings of Parliament ( Article 108 ). Maintains order and decorum and can direct disorderly members to withdraw or take action under House rules. Decides points of order and interprets procedural rules and precedents. Can adjourn or suspend a sitting in grave disorder or when there is no quorum (one-tenth of total membership) . 2. Legislative and procedural powers Decides the admissibility of questions, motions and resolutions. Regulates debates, decides who speaks and for how long. Can expunge objectionable remarks or unparliamentary language from House records. Can allow a secret sitting under the rules. 3. Money Bill certification (Article 110) The Speaker decides whether a Bill is a Money Bill . Article 110(3) says the Speaker’s decision is final. But certification is subject to judicial review where a constitutional violation is alleged. In Rojer Mathew v. South Indian Bank (2019) the Supreme Court recognised that Money Bill certification is not completely immune from judicial review. 4. Anti-defection powers (Tenth Schedule) The Speaker decides disqualification of Lok Sabha members on grounds of defection. In Kihoto Hollohan v. Zachillhu (1992) the Supreme Court held that the Speaker’s decisions under the Tenth Schedule are subject to judicial review . 5. Committees and privileges Guardian of the rights and privileges of the Lok Sabha, its committees and members. Appoints chairpersons of several Lok Sabha committees and supervises them. Chairs the Business Advisory Committee, Rules Committee and General Purposes Committee . Ex-officio President of the Indian Parliamentary Group and chairs the Conference of Presiding Officers of Legislative Bodies in India. 6. Voting (Article 100) Does not vote in the first instance in ordinary proceedings. Uses a casting vote in case of a tie. This helps keep the Chair neutral. Independence AND Impartiality Safeguards — the Speaker is expected to stay apart from daily party politics and protect all members whatever their party. 1. Security of tenure: removal needs an effective majority and 14 days’ notice , protecting against sudden removal. 2. Financial independence: salary and allowances are charged on the Consolidated Fund of India and are not voted annually. 3. Limited judicial interference: Under Article 122 , courts cannot question parliamentary proceedings for mere procedural irregularity Constitutional violations remain reviewable 4. Casting vote only on a tie: supports neutrality. 5. Anti-defection exemption: under the Tenth Schedule the Speaker may voluntarily give up party membership on election to the office without being disqualified, if conditions are met. 6. High status: 7th rank in the Table of Precedence, alongside the Chief Justice of India. 7. Parliamentary protection: the Speaker’s conduct is not normally discussed in the House except on a substantive motion. Challenges to independence Political affiliation: the Speaker generally keeps party membership, raising neutrality concerns. Anti-defection decisions: delays and alleged partisan decisions raise doubts about impartiality. Money Bill certification: disputes have raised concerns about the Rajya Sabha’s rights. Procedural discretion: decisions on admission of motions, debate and discipline can look pro-government. Dependence on a majority: pressure from a ruling party with a strong majority. “ONCE A Speaker, Always A Speaker” Meaning and origin A person elected Speaker should stay politically neutral even after the term ends. In the UK the Speaker resigns from party affiliation and generally gets re-elected without opposition from major parties. Indian precedent: Vithalbhai Patel (1925) resigned from the Swaraj Party after becoming President of the Central Legislative Assembly and later contested as an independent. V. S. Page Committee (1967) recommended conventions to strengthen neutrality: the Speaker should sever party connections Parties should seek consensus on keeping an impartial Speaker Major parties should avoid contesting the Speaker’s constituency where such consensus exists An elected Speaker should not seek ministerial or other political executive office at the same time Arguments in favour Challenges Ensures impartiality: less dependence on the ruling party, fair treatment of all MPs Career disincentive: permanent political detachment may discourage capable politicians from taking the post Protects parliamentary democracy: Speaker guards both government and opposition Weak conventions: unlike the UK, neutrality conventions are not firmly established in India Better anti-defection decisions: detachment reduces claims of partisan rulings Limited accountability: permanent detachment may reduce political accountability Institutional credibility: public confidence in the dignity of the Chair Incomplete reform: quitting a party alone may not ensure neutrality without changes to anti-defection adjudication and procedures Note Example (2025): the Supreme Court directed the Telangana Assembly Speaker to decide pending disqualification petitions against defecting MLAs within a specified period, highlighting concern over delays in anti-defection decisions. (verify) Reforms and way forward Bipartisan selection: consultation between ruling party and Opposition before choosing the Speaker. Independent anti-defection adjudication: consider moving the power from the Speaker to an independent tribunal or other impartial authority. Strengthen neutrality conventions such as “Once a Speaker, always a Speaker”, with safeguards against an immediate return to partisan office. Better procedures: transparent and consistent decisions on motions, debates, Money Bills and discipline. Capacity building: training in constitutional law, parliamentary procedure and impartial decision-making. Country Practice United Kingdom Speaker resigns from party affiliation; major parties generally do not contest the Speaker’s constituency Canada Speaker is elected through a secret ballot of MPs Australia Speaker generally keeps political affiliation but is expected to preside impartially Quote G. V. Mavalankar: “Once a person is elected Speaker, he is expected to be above parties, above politics. In other words, he belongs to all the members or belongs to none. He holds the scales of justice evenly, irrespective of party or person.”"}, {"c": "16", "n": "Speaker, Privileges, Bicameralism and Functioning of Parliament", "id": "2-parliamentary-privileges-article-105-col", "t": "2 · Parliamentary Privileges · Article 105 · Collective AND Individual · Breach vs Contempt · Judgments · Codification", "x": "2 · Parliamentary Privileges · Article 105 · Collective AND Individual · Breach vs Contempt · Judgments · Codification # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Executive and Legislature handout pp. 22-24. Prelims PYQs quoted: none quoted in the material. In simple words Parliamentary privileges are special rights and immunities of the Houses, committees and members (Article 105 for Parliament; Article 194 for State legislatures). They protect free functioning, not personal comfort. They are not codified. The Supreme Court has held that they are not beyond judicial review (Raja Ram Pal, 2007) and that MPs cannot claim immunity for bribery linked to speeches or votes (Sita Soren, 2024). WHAT ARE Privileges? Meaning Special rights, immunities and exemptions enjoyed by the two Houses of Parliament, their committees and their members. They protect the independence, dignity and effective working of Parliament and shield members from outside interference. Article 105: privileges at the Union level. Article 194: similar privileges for State Legislatures. They also extend to persons who are entitled to take part in parliamentary proceedings, such as Union Ministers and the Attorney General . They do not extend to the President , even though the President is an integral part of Parliament. Sources of privileges Laws: Parliament may define privileges by law, but no comprehensive law codifying all privileges has been made. Rules of procedure governing business and privilege matters. Parliamentary conventions (established practices). Judicial interpretations: Supreme Court judgments on scope and limits. Collective Privileges (OF EACH House) Eight collective privileges 1. Publication of proceedings: each House can publish and regulate its proceedings. Article 361A protects substantially true reports, except those of secret sittings, subject to conditions. 2. Secret sittings: each House can exclude strangers and hold secret proceedings. 3. Internal regulation: can frame rules and regulate its own proceedings. 4. Punishment for contempt: can punish members and outsiders by reprimand, admonition, suspension, imprisonment or expulsion, as applicable. 5. Information on arrest: the House must be told about the arrest, detention, conviction or imprisonment of its members. 6. Summoning powers: committees can summon witnesses and demand documents, subject to rules. 7. Judicial protection (Article 122): courts cannot question proceedings for mere procedural irregularity, but constitutional violations are reviewable. 8. Protection within the precincts: arrest or service of legal process inside parliamentary precincts needs the Presiding Officer’s permission, subject to rules. Individual Privileges (OF Members) Four individual privileges 1. Freedom of speech (Article 105): immunity from court proceedings for speeches and votes in Parliament, subject to constitutional limits. 2. Freedom from civil arrest: during sessions and 40 days before and after . It does not apply to criminal cases or preventive detention. 3. Exemption from court attendance: members are generally not compelled to appear as witnesses during sessions, subject to rules. 4. Exemption from jury service: traditionally exempt, though jury trials are no longer part of India’s ordinary criminal justice system. Value addition Nature: privileges are functional protections, not personal privileges . They are also called the “ indirect rights of citizens ” because they let MPs represent the people freely. Breach OF Privilege vs Contempt OF THE House Breach of privilege Contempt of the House Violation of a specific right or privilege of the House, its committees or members Any act that obstructs or undermines the functioning, authority or dignity of the House Example: obstructing an MP in performing parliamentary duties Example: disobeying a lawful order of the House Narrower concept Broader concept, may include breach of privilege Value addition Every breach of privilege may amount to contempt, but every contempt need not involve breach of a specific privilege. Procedure for breach of privilege 1. Notice: a member raises a question of privilege with the permission of the Speaker or Chairman. 2. Preliminary examination: the Presiding Officer checks whether a prima facie case exists. 3. Committee of Privileges: the matter may be sent to the Committee to investigate and recommend. 4. Decision: the House may accept, modify or reject the Committee’s recommendations and decide the action. Important Supreme Court Judgments Case Background and holding Raja Ram Pal v. Speaker, Lok Sabha (2007) MPs were expelled after the Cash-for-Query scandal (2005) . The Supreme Court upheld Parliament’s power to expel members for misconduct under its privilege jurisdiction, but held that privileges are not completely immune from judicial review : courts can examine constitutional violations and substantive illegality, not mere procedural irregularities. Sita Soren v. Union of India (2024) A seven-judge Constitution Bench ruled that MPs and MLAs cannot claim immunity from prosecution for bribery linked to their speeches or votes. It overruled P. V. Narasimha Rao v. State (1998) . Principle: privileges protect legislative independence, not corruption or criminal misconduct. Significance of privileges Legislative independence from undue influence by the executive, judiciary and outside agencies. Freedom of representation: MPs can raise public concerns without fear of legal harassment for protected parliamentary speech. Institutional dignity and authority of Parliament. Effective oversight: supports debates, inquiries and scrutiny of the government. Codification Debate Arguments for codification Arguments against codification Legal clarity: removes doubt about the scope of privileges Loss of flexibility: impossible to define every breach or contempt Prevents misuse: clear limits on parliamentary punishment Political influence: the ruling majority might shape privileges to its interest Judicial harmony: fewer clashes between legislature and judiciary More litigation: codified provisions may draw more legal challenges Protects Fundamental Rights: clear safeguards against arbitrary action Reduced autonomy: may restrict the House’s ability to handle new situations Key concerns: undefined powers (breach vs contempt); uncertain limits of imprisonment, suspension and expulsion; balance with Articles 14, 19 and 21; distinction between internal procedure and constitutional violations. Way forward: Selective codification of major privileges and punishments while keeping procedural flexibility Due process (fair hearing, reasoned decisions, proportionate punishment) Judicial balance Transparent and impartial Committees of Privileges Way forward / key point Conclusion: privileges are essential for legislative independence and democratic accountability, but must stay consistent with constitutional supremacy, fundamental rights and the rule of law."}, {"c": "16", "n": "Speaker, Privileges, Bicameralism and Functioning of Parliament", "id": "3-bicameralism-rajya-sabha-vs-lok-sabha-po", "t": "3 · Bicameralism · Rajya Sabha vs LOK Sabha · Powers · Significance · Limitations", "x": "3 · Bicameralism · Rajya Sabha vs LOK Sabha · Powers · Significance · Limitations # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Executive and Legislature handout pp. 24-28. Prelims PYQs quoted: none quoted in the material. In simple words Parliament has the President, Rajya Sabha and Lok Sabha (Article 79). India chose two Houses for federal voice, deliberation, expertise and continuity. Rajya Sabha is equal to the Lok Sabha on ordinary Bills and constitutional amendments, weaker on Money Bills and government accountability, and has special powers (Articles 249 and 312, VP removal). It is neither as weak as the House of Lords nor as strong as the US Senate. Constitutional Framework AND Rationale Structure Article 79 : Parliament = the President + Rajya Sabha (Council of States) + Lok Sabha (House of the People) . The President is not a member of either House but is part of Parliament. He summons and prorogues, dissolves the Lok Sabha, addresses Parliament and gives assent to Bills. Why India adopted bicameralism Federal representation: the Rajya Sabha gives States a voice at the national level. Better deliberation: a second chamber reconsiders what the Lok Sabha passes and reduces the risk of hasty or ill-considered laws. Diverse representation: experts come in through Presidential nomination, State representatives through indirect election. Continuity: the Rajya Sabha never dissolves, giving institutional memory even when the Lok Sabha is dissolved. Constitutional safeguard: a second chamber helps stop unilateral constitutional change by a Lok Sabha majority. Arguments against bicameralism Delay: Bills need approval from both Houses. Duplication: both Houses discuss the same issues, increasing time and cost. Indirect election: Rajya Sabha members are not directly elected, which raises questions of accountability. Weak federal role: members often vote on party lines instead of defending State interests. Political accommodation: the Upper House may be used to accommodate defeated politicians or loyalists. Value addition Bicameralism adds a layer of deliberation, and the Constitution gives tools to settle disagreements: Joint Sitting (Article 108) and the Money Bill procedure. LOK Sabha vs Rajya Sabha Basis Lok Sabha Rajya Sabha Constitutional basis Article 81 Article 80 Nature House of the People, directly elected Council of States, indirectly elected Membership 543 elected seats Maximum 250; present sanctioned strength 245, including 12 nominated members Election First-Past-the-Post, universal adult suffrage Proportional Representation by Single Transferable Vote Representation Population-based State/UT-based representation, with unequal allocation Tenure 5 years, unless dissolved earlier Permanent House. Members serve 6 years, about one-third retiring every 2 years Presiding officers Speaker and Deputy Speaker Vice-President as Chairman, and a Deputy Chairman Executive accountability Council of Ministers is collectively responsible to the Lok Sabha Can question ministers but cannot remove the government by a no-confidence motion Money Bills Exclusive power to introduce, and final decision on recommendations Can only recommend changes within 14 days Special powers No-confidence motion; voting on Demands for Grants Articles 249 and 312; initiation of the Vice-President’s removal Joint sitting Usually has a numerical advantage Participates with equal voting rights for individual members Women’s representation 106th Amendment provides reservation, subject to implementation requirements No constitutional women’s reservation Position AND Powers OF THE Rajya Sabha A. Areas of parity (equal powers) 1. Ordinary legislation: equal power to introduce, amend and pass ordinary Bills, subject to the joint sitting mechanism. 2. Constitutional amendments (Article 368): Both Houses must separately pass the Bill by the special majority No joint sitting is available 3. Election and removal of authorities: Takes part in the election and impeachment of the President The election and removal of the Vice-President (the removal resolution starts in the Rajya Sabha) Parliamentary removal of Supreme Court and High Court judges, CAG and Chief Election Commissioner, as per their provisions 4. Ordinances and Emergencies: both Houses ordinarily approve ordinances (Article 123) and Emergency proclamations (Articles 352, 356, 360). 5. Other: Discusses reports of CAG, UPSC, Finance Commission and other constitutional bodies Takes part in legislation on the jurisdiction of the Supreme Court and other Union institutions Ministers including the PM can belong to either House B. Areas of inferior powers 1. Money Bills (Articles 109-110): Introduced only in the Lok Sabha . The Rajya Sabha can only recommend amendments within 14 days The Lok Sabha may accept or reject them. If the Rajya Sabha does not return the Bill within 14 days it is deemed passed in the form passed by the Lok Sabha 2. Financial control: can discuss the Budget but cannot vote on Demands for Grants . 3. Executive accountability: Under Article 75(3) the Council of Ministers is responsible only to the Lok Sabha A no-confidence motion cannot be moved in the Rajya Sabha 4. Joint sitting (Article 108): the Lok Sabha’s numerical strength usually prevails. Example: the Prevention of Terrorism Bill, 2002 was passed in a joint sitting. C. Special powers exclusive to the Rajya Sabha 1. Legislation on a State List subject (Article 249): the Rajya Sabha can authorise Parliament to legislate on a State List subject in the national interest, by a resolution backed by two-thirds of members present and voting . Valid for one year , renewable one year at a time. Laws made this way lapse six months after the resolution ceases, except for things already done. 2. Creating All-India Services (Article 312): by a two-thirds majority of members present and voting. Existing: IAS, IPS and Indian Forest Service. 3. Removal of the Vice-President (Article 67): The resolution can begin only in the Rajya Sabha It needs a majority of all the then members and the Lok Sabha’s agreement 4. Emergency proclamations: if the Lok Sabha is dissolved, the Rajya Sabha may approve proclamations under Articles 352, 356 and 360, ensuring continuity until the new Lok Sabha considers it within the set period. Significance AND Limitations OF THE Rajya Sabha Significance House of Elders: senior statesmen, experienced politicians and experts can contribute. Revisory chamber: prevents hasty or ill-considered laws and promotes informed debate. Guardian of the Constitution: helps prevent constitutional change based only on a Lok Sabha majority. Federal chamber: allows States to take part in Union decisions. Intellectual representation: 12 nominated members with special knowledge in literature, science, art and social service. It is sometimes called the “ House of Corrections ”, and the Lok Sabha the “ House of Passions ”. Limitations and criticism 1. Weak federal character: States are not equally represented (unlike the US Senate) The 2003 removal of the domicile requirement means a Rajya Sabha member from a State need not live there Representation of Union Territories and nominated members adds non-federal features 2. Limited financial powers: weak control over Money Bills. Controversies over Money Bill certification, including the Aadhaar legislation , raised fears of bypassing the Upper House. 3. Doubtful effectiveness as a revisory chamber: Parliament has held only three joint sittings The Rajya Sabha could not stop major constitutional changes like the 42nd Amendment (1976) 4. Political accommodation: Critics say it becomes a platform for defeated politicians, retired bureaucrats and loyalists Nominating former constitutional functionaries has raised concerns about independence 5. Declining quality of debate: frequent disruptions and walkouts. Vice-President Hamid Ansari in 2013 used the expression “ federation of anarchists ”. Why are States unequally represented? Population differences: Indian States differ greatly in population and size. Nature of the federation: India was not formed by an agreement among previously independent States, unlike the USA. Small-State dominance: equal representation would give small States disproportionate influence over national law. Way forward / key point Overall position: the Rajya Sabha is neither as weak as the British House of Lords nor as powerful as the US Senate. Its worth lies in combining federal representation, legislative review and institutional continuity."}, {"c": "16", "n": "Speaker, Privileges, Bicameralism and Functioning of Parliament", "id": "4-women-in-parliament-106th-amendment-131s", "t": "4 · Women IN Parliament · 106th Amendment · 131st Amendment BILL 2026 · Delimitation Issues", "x": "4 · Women IN Parliament · 106th Amendment · 131st Amendment BILL 2026 · Delimitation Issues # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Executive and Legislature handout pp. 28-30. Prelims PYQs quoted: none quoted in the material. In simple words Women are about half of India’s population but only about 14% of the Lok Sabha. The Nari Shakti Vandan Adhiniyam (106th Amendment, 2023) promises one-third reservation, but only after the Census and delimitation. The 131st Amendment Bill (16 April 2026) tried to expand the Lok Sabha and speed this up but was defeated. The delimitation debate is mainly about South vs North, federal balance and fairness. Women’s Representation IN Parliament Where we stand — women are nearly half the population but have limited representation. 15th Lok Sabha: around 11% women MPs. 16th Lok Sabha: around 11.4%. 17th Lok Sabha: 78 women MPs, about 14%. 18th Lok Sabha (2024): 74 women MPs, about 14% at the time of election. Constituent Assembly Reservation for women was debated, but many women members preferred social and economic empowerment over legislative quotas. 1996, 1998, 1999 Women’s Reservation Bills were introduced but could not be enacted. 2008 The 108th Constitutional Amendment Bill , passed by the Rajya Sabha in 2010, lapsed with the dissolution of the 15th Lok Sabha. 2023 The 106th Constitutional Amendment Act brought in one-third reservation for women. NARI Shakti Vandan Adhiniyam, 2023 (106th Amendment) Key provisions One-third reservation: 33% in the Lok Sabha, State Legislative Assemblies and the Delhi Legislative Assembly . Constitutional changes: inserted Articles 330A, 332A and 334A and amended Article 239AA . SC/ST women: one-third of the seats reserved for SCs and STs go to women from those communities. Implementation: takes effect after the required Census figures are published and delimitation is done . Rotation and duration: seats rotate after later delimitation exercises. A 15-year period is provided, subject to Parliament’s power to decide continuation. Exclusion: does not apply to the Rajya Sabha or State Legislative Councils. Arguments in favour Concerns and challenges Political equality: corrects the historical under-representation of women Proxy representation: male relatives may control elected women Policy priorities: women-led Panchayats give more attention to water supply, sanitation and local services Rotation of seats: weakens constituency continuity and long-term political investment Leadership development: encourages women’s participation in parties and decision-making Tokenism: a quota alone may not fix patriarchal structures and party-level discrimination Inclusive governance: more diverse perspectives in debates and policy Delayed implementation: dependence on Census and delimitation creates uncertainty Alternative reform proposals Party ticket quotas: parties must give at least one-third of tickets to women (through electoral law). Limit: parties may field women in seats where their chance of winning is low. Dual-member constituencies: some constituencies elect one man and one woman. Limit: needs big changes to the electoral system and may create unequal influence between the two representatives. Long-term empowerment: Women’s education, financial independence, safety and political training Internal party democracy Less criminalisation of politics Constitution (131st Amendment) BILL, 2026 What was introduced Three connected Bills were introduced in the Lok Sabha on 16 April 2026 : the Constitution (131st Amendment) Bill , the Delimitation Bill and the Union Territories Laws (Amendment) Bill . Expansion of the Lok Sabha: raise its maximum strength from 550 to 850 , with up to 815 from States and 35 from Union Territories. Population-based delimitation: reallocate seats so constituencies across States have roughly equal populations. Census basis: Let Parliament decide by law which Census is used for delimitation The accompanying Bill would have allowed use of the 2011 Census Women’s reservation: remove the need to wait for the first Census after the 106th Amendment Act, 2023, allowing earlier implementation. Note Outcome: the Constitution (131st Amendment) Bill was defeated in the Lok Sabha on 17 April 2026 ; the two connected Bills became infructuous. (current affairs; verify the date and numbers) Issues Related TO Delimitation Six issues 1. North-South federal imbalance. Southern States (Tamil Nadu, Kerala, Karnataka, Andhra Pradesh) slowed population growth through health, education and family planning Northern States (Uttar Pradesh, Bihar, Madhya Pradesh) grew faster. A strictly population-based redistribution would raise Northern States’ share and cut Southern States’ political weight 2. Reduced constitutional certainty. The proposed framework would let Parliament decide the timing of delimitation and the Census used by ordinary law, raising fears of more political discretion over representation. 3. Gerrymandering risk. Gerrymandering is deliberately drawing boundaries to favour a party or dilute a community’s influence. Delimitation in Jammu and Kashmir and Assam has faced allegations of politically motivated changes. 4. Judicial review concerns. Under the present law, Delimitation Commission orders have the force of law and are generally protected from direct court challenge The proposals raised concerns about the scope of judicial scrutiny and accountability 5. Weakening the Rajya Sabha. A large rise in Lok Sabha seats without a matching rise in Rajya Sabha seats reduces the Upper House’s relative weight in joint sittings. 6. Link with women’s reservation. Delay or dispute over delimitation also delays women’s reservation under the current framework. Basis India USA United Kingdom Term Delimitation Redistricting Boundary Review Authority Delimitation Commission constituted under law State legislatures or independent commissions, depending on the State Four independent Boundary Commissions Frequency Linked to Census, subject to constitutional freezes Generally after every decennial Census Generally every 8 years Legal basis Articles 81, 82, 170 and Delimitation Acts US Constitution and federal/State election laws Parliamentary Constituencies Act 1986, as amended Judicial review Commission orders generally protected from direct challenge, subject to constitutional limits Racial discrimination claims reviewable; purely partisan gerrymandering claims not justiciable in federal courts Courts may review legality but not the merits of independent boundary recommendations Lower House seats 543 elected seats 435 voting members 650 members Political influence Commission-based process Varies by State, considerable partisan influence in some Independent and rules-based Way forward for India National consensus: consult States and parties before large changes in seat allocation. Safeguard federalism: balance population-based representation with regional equity. Independent Commission: strengthen its autonomy and transparency. Judicial safeguards: clear remedies against constitutional violations and arbitrary boundary changes. Phased implementation: avoid sudden changes that may harm any region’s representation."}, {"c": "16", "n": "Speaker, Privileges, Bicameralism and Functioning of Parliament", "id": "5-functioning-of-parliament-representation", "t": "5 · Functioning OF Parliament · Representation · Salaries · Reforms · Mplads · Supreme BUT NOT Sovereign", "x": "5 · Functioning OF Parliament · Representation · Salaries · Reforms · Mplads · Supreme BUT NOT Sovereign # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Executive and Legislature handout pp. 30-35. Prelims PYQs quoted: none quoted in the material. In simple words Parliament’s effectiveness has declined: fewer sitting days, disruptions, rushed Bills, delegated legislation, cabinet dominance, guillotine, ordinances, criminalisation and weak research support. Reforms include more sittings, stronger committees, a looser whip, ethics and fair delimitation. MPLADS (Rs 5 crore per MP per year) is controversial though upheld in Bhim Singh (2010). Parliament is supreme in law-making and accountability, but not sovereign, because the Constitution is supreme. Declining Parliamentary Effectiveness Seven problems 1. Inadequate sitting days. Sitting days have fallen sharply since the early decades after Independence. Fewer sittings mean less debate, scrutiny and opposition accountability, and the government has great control over the timing and length of sessions. 2. Disruptions and adjournments. Slogan shouting, walkouts and disruptions reduce productive time. They can draw attention to issues, but repeated adjournments also weaken government accountability. Example: the 15th Lok Sabha (2009-14) had heavy disruptions and low productivity. 3. Declining quality of debate. Bills are sometimes passed with little discussion or committee examination. The Anti-Defection Law, party discipline and big majorities reduce independent thinking. Technical complexity makes it hard for MPs to scrutinise specialised laws. 4. Delegated legislation. Parliament often passes broad laws and leaves the executive to frame detailed rules, which reduces control if delegated legislation gets little scrutiny. 5. Cabinet dominance. The executive controls much of the legislative agenda while Parliament plays a limited part in starting major legislation: “the creation dominates the creator”. 6. Increasing use of the guillotine. It puts outstanding Demands for Grants to a vote at the scheduled time without further discussion. Needed for timely Budget approval, but too much use cuts financial scrutiny. 7. Frequent ordinances. Repeated use of Article 123 weakens debate and scrutiny Ordinances must stay exceptional Problems OF Representation AND Accountability Five problems 1. Criminalisation of politics. 16th Lok Sabha (2014): about 34% of MPs declared criminal cases. 17th (2019): 233 MPs (43%) . 18th (2024): 251 MPs (46%) , including 170 (31%) with serious cases. These are cases declared in election affidavits, not findings of guilt. 2. An ageing Parliament. The share of younger MPs has fallen. In the 18th Lok Sabha only about 11% were aged 40 or below at the time of election. 3. Inadequate representation. The population each Lok Sabha MP represents has risen a lot since the 1971 Census. With 543 seats, MPs represent very different population sizes, which raises concerns about equal representation and workload. 4. Declining political conduct. Cash-for-Query, Cash-for-Vote allegations and MPLADS irregularities have raised ethical concerns Stronger ethics committees, transparency and electoral reform are needed 5. Weak research support. Modern laws need technical, economic, scientific and legal expertise Parliamentary research and committee support must be strengthened MPs’ salaries and resources (Article 106) Article 106 lets Parliament fix members’ salaries and allowances by law: the Salary, Allowances and Pension of Members of Parliament Act, 1954 . Basic salary: Rs 1.24 lakh per month (from 1 April 2023). Constituency allowance: Rs 87,000 per month. Office expense allowance: Rs 75,000 per month. Daily allowance: Rs 2,500, subject to rules. Debate: pay should not be so high that it becomes the main attraction of politics, nor so low that good candidates stay away. An independent mechanism like the UK’s Independent Parliamentary Standards Authority may improve public confidence. Reforms FOR Strengthening Parliament Eight reform areas 1. More sittings: a fixed legislative calendar and minimum sitting days. Proposals suggest 120 days for the Lok Sabha and 100 for the Rajya Sabha . 2. Stronger committees: make sure major Bills get adequate committee examination, with technical experts and research support. 3. Reform the Anti-Defection Law: consider limiting whips mainly to confidence votes and essential government business, so MPs can deliberate independently while governments stay stable. 4. Strengthen the Opposition’s role: Adequate opportunities for debates, motions and scrutiny Consider dedicated days for Opposition-chosen business, drawing on the UK model 5. Electoral and ethical reforms: Better disclosure of criminal antecedents and political funding Stronger enforcement of parliamentary ethics 6. Better representation: Implement women’s reservation through a fair constitutional process Delimit by national consensus, federal consultation and transparent procedure 7. Greater parliamentary independence: stronger autonomy of parliamentary institutions, a neutral Speaker and less executive control over business. 8. Research and deliberation: expand research services and train MPs so Parliament is a forum for analysis, scientific reasoning and informed policy. Way forward / key point Conclusion: Parliament is not merely a law-making body. It is the base of representati
