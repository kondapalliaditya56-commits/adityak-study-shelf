and Bolangir. In 2022 it flagged large-scale displacement of tribals in Chhattisgarh due to mining and told the State to ensure rehabilitation. Complementing the judiciary. In NHRC v. State of Arunachal Pradesh (1996) the Supreme Court upheld the NHRC’s standing to move the court to protect Chakma refugees. Its prison reports (2017-18) fed into the Justice Amitava Roy Committee recommendations on decongesting prisons. Policy advocacy and awareness. Its recommendations helped shape the Juvenile Justice Act (2000) and the Mental Healthcare Act (2017) . It launched open online courses on human rights in 2020. Case (year) NHRC’s role Gujarat riots (2002) Took suo motu notice of mass graves, pressed the State to report on measures and moved the Supreme Court on behalf of victims Punjab mass cremations (1995-2012) Directed Rs 1.75 lakh compensation each to 1,051 families whose kin were cremated unlawfully; a landmark for dignity rights Silicosis deaths in Gujarat (2011-ongoing) Investigated unsafe working conditions for tribal labourers; pressed for State action and compensation Rohingya refugees in Jammu (2017) Asked the government to ensure basic humanitarian facilities and non-discriminatory treatment Farmers’ suicides in Maharashtra (2018) Issued notices to the State over agrarian distress and the lack of institutional support for farmers’ families Manipur extra-judicial killings (2013-16) After petitions, monitored the SC-appointed SIT on 1,528 alleged fake encounters; it also showed NHRC’s limits, with the SC calling it a “ toothless tiger ” COVID-19 migrant crisis (2020) Intervened in migrant deaths from hunger or exhaustion; sought reports from States and railways; pressed for relief Hathras case (2020) Took cognisance of the alleged gang-rape of a Dalit woman and the hurried cremation; sought accountability of UP authorities Manipur violence (2023) Issued notices to the Centre and State on large-scale displacement and sexual violence against women during ethnic clashes Challenges AND Where THE NHRC HAS Failed Six challenges 1. No enforcement power. Recommendations are advisory, so compliance is poor. It cannot impose penalties or directly award compensation. In 2016, then NHRC Chairperson Justice H. L. Dattu himself called it a “toothless tiger” in an interview. 2. Limited jurisdiction. In cases involving the armed forces it can only seek a report from the government. It cannot take up cases older than one year, or violations by private individuals unless State complicity is proved. 3. Structure and composition. Too many retired judges make it more judicial than human-rights-centred. There is limited diversity: SCs, STs, women and civil society activists are under-represented. Critics call it a “post-retirement” home for judges and bureaucrats. 4. Operations and resources. A heavy backlog from excess caseload Inadequate staffing, especially in investigation and research (many on deputation) Scarce funds that hamper outreach, especially at State level 5. Independence and credibility. The executive dominates appointments, raising doubts about impartiality Reliance on government resources reduces perceived autonomy. GANHRI downgraded its accreditation in 2017, citing political interference and lack of pluralism 6. Accessibility and awareness. Many citizens, especially from marginalised groups, do not know the NHRC’s mandate. Procedural complexity and urban-centred working limit access. Case (year) What went wrong G. N. Saibaba case (2024-25) Despite repeated pleas from the imprisoned academic about prison conditions and health, the NHRC was criticised for dismissing complaints and not ensuring protection and medical care “Nata Pratha” minor girl suicide case (2024) The girl, allegedly sold by her father after police ignored her complaint, died by suicide in 2020. The NHRC enquiry found police inaction, but justice has been slow and accountability partial District Mineral Foundation (DMF) funds, Odisha (2025) The NHRC asked for reports on delay or misuse of DMF funds meant for mining-affected areas, but actual corrective action and relief to affected people remain uncertain WAY Forward: Reforming AND Strengthening THE NHRC Six reform directions 1. Powers and jurisdiction. Make recommendations binding in grave violations, with a statutory duty on governments to respond. Extend jurisdiction to violations by private actors and security forces, with independent investigation wings. 2. Transparent, inclusive appointments. Publicly advertise vacancies with clear application, screening and shortlisting steps. Add diversity: women, SC/ST, minorities and rights activists alongside judges. 3. Resources and decentralisation. A dedicated budget and permanent staff instead of deputation. Regional benches and stronger SHRCs for faster handling. 4. Accountability and follow-up. An online tracker for the status of recommendations and government responses Periodic independent audits and parliamentary review of annual reports 5. Awareness and victim support. Targeted outreach in rural, tribal and marginalised areas Multilingual online complaint portals Free legal and medical aid for victims 6. Regular legal and institutional review. Amend the Protection of Human Rights Act periodically to meet global standards like the Paris Principles Evaluate performance through external committees and civil society consultation"}, {"c": "13", "n": "Constitutional and Statutory Bodies: NCSC, NCST, NCBC, NHRC", "id": "4-udhr-1948-and-the-constitution-state-hum", "t": "4 · UDHR 1948 AND THE Constitution · State Human Rights Commissions · Human Rights Courts", "x": "4 · UDHR 1948 AND THE Constitution · State Human Rights Commissions · Human Rights Courts # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Constitutional and Statutory Bodies handout pp. 16-19. Prelims PYQs quoted: none quoted in the material. In simple words The UDHR (1948) set the moral base for human rights, and many of its ideas appear in India’s Preamble, Fundamental Rights, DPSP and Fundamental Duties. State Human Rights Commissions (SHRCs) are the State-level counterparts of the NHRC, and Human Rights Courts (Section 30) try human rights offences in districts. The 2019 amendment changed tenure and eligibility. Both SHRCs and these courts are weak in practice. Universal Declaration OF Human Rights (UDHR), 1948 What it is Adopted by the UN General Assembly on 10 December 1948 . It was the first international document to recognise that all human beings are born free and equal in dignity and rights. Drafted after the Second World War to prevent future atrocities by setting common standards of justice, freedom and peace. It rests on four principles: Dignity, Liberty, Equality and Brotherhood . It has 30 Articles , broadly grouped into civil-political rights and socio-economic rights. How the Indian Constitution reflects the UDHR Preamble: promises Justice, Liberty, Equality and Fraternity, reflecting the UDHR’s commitment to dignity and freedom. Indian provision Matching idea UDHR link Articles 14-18 (Fundamental Rights) Equality and non-discrimination UDHR Arts 1, 7 Articles 19-22 Freedom, life and personal liberty UDHR Arts 3, 9, 19, 20 Articles 23-24 Protection against exploitation UDHR Art 4 Articles 25-28 Freedom of religion UDHR Art 18 Articles 29-30 Cultural and educational rights UDHR Arts 26, 27 Article 32 Constitutional remedies UDHR Art 8 DPSP: Art 38 Social and economic justice UDHR Arts 22-25 (socio-economic rights) DPSP: Art 39 Adequate livelihood and equal pay same DPSP: Art 41 Right to work, education and public assistance same DPSP: Art 42 Humane working conditions and maternity relief same DPSP: Art 47 Nutrition and public health same Duty 51A(e) Promote harmony; respect women’s dignity UDHR emphasis on dignity Duty 51A(f) Preserve composite culture cultural rights Duty 51A(h) Develop scientific temper and humanism social responsibility Other constitutional provisions that echo the UDHR Article 21A: free and compulsory education for children aged 6 to 14 (UDHR Art 26). Article 45: early childhood care and education for children below 6. Article 300A: right to property (UDHR Art 17). Article 326: adult suffrage, reflecting the right to political participation (UDHR Art 21). Way forward / key point Conclusion: the Indian Constitution gives legal and institutional form to many UDHR principles by protecting dignity through Fundamental Rights, DPSP and Fundamental Duties. State Human Rights Commissions (SHRCs) Role Working inside a State’s boundaries, SHRCs monitor prisons, handle custodial violence, review safeguards and create awareness. They are the first line of institutional redress for citizens and complement the NHRC in building a nationwide human rights architecture based on constitutional morality and accountability. Aspect Provision (after the 2019 amendment) Composition A Chairperson and 2 Members . Chairperson: a retired Chief Justice or Judge of a High Court (after 2019, even a retired HC judge is eligible, not only a Chief Justice). Members: (i) a serving or retired HC judge or a District Judge with 7 years’ experience; (ii) an expert in human rights. Appointing authority The Governor , on the recommendation of a committee headed by the Chief Minister , with the Speaker of the Assembly, the State Home Minister and the Leader of Opposition in the Assembly. If the Legislature has two Houses, the Chairman and Leader of Opposition of the Legislative Council are also included. Consultation If a sitting HC judge or District Judge is to be appointed, prior consultation with the Chief Justice of the High Court is mandatory. Tenure 3 years or until age 70 (reduced from 5 years by the 2019 Amendment). Eligible for reappointment. Removal Only the President can remove them (not the Governor), on grounds like insolvency, infirmity, conviction or misbehaviour, proved by a Supreme Court inquiry (similar to the NHRC). After tenure Cannot take employment under the State or Central Government. Conditions of service Decided by the State Government but cannot be changed to their disadvantage after appointment. Administration The Secretary holds administrative and financial powers, subject to the Chairperson’s control (2019 amendment). Powers and functions (Section 29 of the 1993 Act) — preventive, corrective and advisory 1. Inquiry into violations (suo motu, on petition or on a court’s direction): custodial deaths, police excesses, bonded labour, discrimination by State authorities. 2. Intervening in judicial proceedings involving human rights allegations, so State agencies follow constitutional and legal safeguards. 3. Inspecting and monitoring jails, detention centres and mental health institutions, and recommending humane treatment, medical care and legal aid. 4. Reviewing legal safeguards and recommending legislative or policy changes. 5. Examining structural causes such as terrorism, communal violence and systemic exclusion. 6. Engaging with international norms by studying treaties and advising the State to align local laws. 7. Research, education and awareness through drives, school curricula, workshops and tie-ups with NGOs and universities. 8. Collaborating with civil society , acting as a bridge between NGOs and the State. Working mechanism and inquiry procedure 1. Complaint and admissibility. Any person, NGO or public authority can complain (online, by post or in person) The Commission also takes suo motu notice of media reports. Cases older than one year are ordinarily not admitted unless there are exceptional circumstances 2. Preliminary scrutiny (Section 17). It may seek information or a report from the State Government or a subordinate authority within a set time. If there is no reply it proceeds on its own. If it is satisfied that remedial action has already been taken, it may close the matter and inform the complainant. 3. Inquiry and hearing. It inquires directly or through its investigation division with civil-court powers under the Code of Civil Procedure, 1908 (summoning witnesses, requisitioning documents, recording evidence on oath). Hearings are open and follow natural justice. 4. Recommendations (Section 18). On finding a violation it may recommend compensation or damages , advise disciplinary or criminal proceedings against erring officials, and suggest policy or administrative reform. The State Government must send an Action Taken Report within one month . 5. Special procedure for armed forces (Section 19). For the armed or paramilitary forces it can only call for a report from the Central Government and make recommendations on that basis. The Centre must report back within three months , so oversight exists, though limited. 6. Documentation and follow-up. Inquiries, decisions and compliance updates are published in the Annual Report tabled in the State Legislature . Persistent non-compliance is publicly highlighted, which adds moral and political pressure. 7. Coordination and outreach. It works with the NHRC, Human Rights Courts and civil society to harmonise standards and avoid duplication, with field visits and training especially in rural and tribal areas. Key challenges Non-binding: State governments often ignore recommendations. Resource constraints: staff shortages and no financial autonomy in many SHRCs. Limited jurisdiction: cannot revisit cases already before the NHRC, and cannot take up violations older than one year. Implementation gap: reports laid before legislatures often see delays or minimal follow-up. Human Rights Courts (section 30 OF THE 1993 ACT) Idea: to give speedy justice and real enforcement, the Act requires Human Rights Courts in every district. They are the grassroots judicial mechanism. Establishment (Section 30): the State Government, with the concurrence of the Chief Justice of the High Court , notifies a Human Rights Court for each district to try offences from human rights violations. In most States, the Sessions Court is designated. Jurisdiction: they try human rights violations or negligence by public servants that amount to criminal offences. The aim is expeditious trial, because such cases would otherwise face delays in ordinary courts. Special Public Prosecutor (Section 31): The State must appoint one for every Human Rights Court A practising advocate with at least 7 years’ experience Link with SHRC/NHRC: SHRCs and the NHRC investigate and recommend Human Rights Courts actually try offences and punish . This bridges the gap between recommendation and enforcement Limitations and recent developments In practice these courts are used rarely. Many States have designated Sessions Courts only on paper, with no separate infrastructure, exclusive judges or funds. Victims are unaware, and SHRCs refer few cases. Tamil Nadu, Kerala and Maharashtra have started exclusive benches or pilot human rights courts. The Supreme Court (2018, Re: Inhuman Conditions in 1382 Prisons ) directed States to make these courts operational to deal with custodial violence and prison abuse."}, {"c": "13", "n": "Constitutional and Statutory Bodies: NCSC, NCST, NCBC, NHRC", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. NCSC is under which Article? Article 338 NCST is under which Article? Article 338A Who specifies the SCs of a State? The President, after consulting the Governor (Art 341) Under which Article are STs notified? Article 342 Until when did the NCSC also handle OBC matters? Until the 102nd Amendment Act, 2018 STs in Census 2011 10.42 crore, 8.6% of the population NCST regional offices Six, many understaffed NCSC 12th Report (2018-20) tabled in 2022 (late) Which law did NCST help protect in 2019? Forest Rights Act, by opposing its amendments When did the NCBC get constitutional status? 2018 (102nd Amendment) Under which Article was the Rohini Commission set up? Article 340, in 2017 Rohini proposal for the 27% OBC quota 4 groups: 2%, 6%, 9%, 10% Which judgment said NCBC cannot define backwardness? Maratha Quota judgment, 2021 Four types of rights Natural, moral, legal, human Which rights can be enforced directly under Art 32? Fundamental Rights (Part III) Right to property is under which Article now? Article 300A (a constitutional right, not fundamental) Right to vote is under which Article? Article 326 NHRC established on 12 October 1993, under the Protection of Human Rights Act, 1993 NHRC members Chairperson + 5 full-time + 7 ex-officio Who can be NHRC Chairperson? A retired Chief Justice of India or SC judge NHRC term 3 years or age 70, whichever is earlier Who removes an NHRC member? The President, after a Supreme Court inquiry Time limit to file a complaint Generally within one year of the violation ATR must be submitted within One month NHRC and armed forces Can only seek a report from the government International standards for national human rights bodies Paris Principles (1993) Who accredits national human rights institutions? GANHRI UDHR adopted on 10 December 1948 (UN General Assembly) UDHR has how many Articles? 30 UDHR Article 21 corresponds to which Indian Article? Article 326 (adult suffrage, political participation) SHRC members Chairperson + 2 Members Who appoints SHRC members? The Governor, on a committee led by the Chief Minister Who can remove SHRC members? Only the President, after a Supreme Court inquiry SHRC and NHRC tenure after 2019 3 years or age 70 SHRC and armed forces (Section 19) Can only seek a Centre report; Centre responds in 3 months Human Rights Courts under which Section? Section 30 (Special Public Prosecutor: Section 31) Supreme Court case on prison conditions and HR courts Re: Inhuman Conditions in 1382 Prisons, 2018"}, {"c": "13", "n": "Constitutional and Statutory Bodies: NCSC, NCST, NCBC, NHRC", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts in Start Here)"}, {"c": "13", "n": "Constitutional and Statutory Bodies: NCSC, NCST, NCBC, NHRC", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards"}, {"c": "14", "n": "Bodies for Women, Children, Minorities and the NIA", "id": "1-national-commission-for-women-ncw-compos", "t": "1 · National Commission FOR Women (NCW) · Composition · Powers · Recent WORK · Constitutional Status · PMLA", "x": "1 · National Commission FOR Women (NCW) · Composition · Powers · Recent WORK · Constitutional Status · PMLA # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Constitutional and Statutory Bodies handout pp. 19-23. Prelims PYQs quoted: none quoted in the material. In simple words The NCW is a statutory body (1992, under the NCW Act 1990) that watches over women’s rights, inquires into violations and advises the government. It has civil-court powers during inquiries but its recommendations are only advisory. There is a long-running demand to give it constitutional status like the NCSC and NCST, for autonomy, binding force and parity. The Parivarik Mahila Lok Adalat gives women a fast, informal way to settle family disputes. WHAT THE NCW IS Introduction Set up in 1992 under the National Commission for Women Act, 1990 . It is the apex statutory body that monitors constitutional safeguards for women, investigates violations and advises the government on legal and policy reform. It was set up to promote gender justice in line with India’s commitments under CEDAW (1979) . It acts as a watchdog and catalyst for women’s rights, empowerment and participation in governance. Aspect Provision Composition Chairperson + 5 Members + a Member-Secretary. Chairperson: an eminent woman committed to women’s welfare. Members: experts from law, administration, management, the women’s movement or social work ( one from SC/ST ). Member-Secretary: an expert in management or research, or a senior government officer. Appointing authority The Central Government appoints all members under the NCW Act, 1990. Tenure 3 years (or as prescribed by the Government); eligible for reappointment. Resignation and removal Members can resign to the Central Government; they can be removed for insolvency, conviction or incapacity. Service conditions Set by the Central Government and not to be altered to their disadvantage during tenure. Headquarters New Delhi; may set up regional offices as needed. Functions AND Powers Functions (legal review, policy coordination, awareness, grievance redress) 1. Review of constitutional and legal safeguards: checks whether constitutional provisions and laws protect women enough and recommends amendments. 2. Investigation and inquiry: looks into specific complaints and suo motu cases of deprivation of women’s rights, non-implementation of protective laws, or failures of the administration. 3. Advice to government: advises the Centre and States on policy, legal reform and effective implementation of women’s welfare programmes. 4. Monitoring custodial and institutional facilities: inspects jails, remand homes and women’s shelters to ensure humane, lawful treatment. 5. Research and documentation: studies on trafficking, workplace harassment, domestic violence and the declining sex ratio to support evidence-based policy. 6. Public awareness and legal literacy: campaigns and workshops on women’s rights and remedies. 7. Collaboration with NGOs and civil society. 8. Intervention in court cases involving serious violations of women’s rights, especially where public interest is involved or legal aid is needed. Powers (quasi-judicial: investigative, recommendatory, advisory) Civil-court powers under the Code of Civil Procedure, 1908, while investigating: summon witnesses, examine them on oath, demand documents and receive affidavits. Power to inquire suo motu or on petition, including non-enforcement of protective laws and maladministration. Power to call for reports from any central or State department or agency on women’s rights and welfare. Power to recommend prosecution, compensation or disciplinary action after an inquiry. Power to visit custodial institutions such as jails, remand homes and shelters. Power to hold public hearings and consultations on issues like sexual violence, trafficking and workplace discrimination. Advisory and recommendatory power: recommendations are not legally binding , but its reports often guide reform, for example to the Dowry Prohibition Act and the Sexual Harassment at Workplace Act. Recent Interventions (2020-2025) The NCW has gone beyond its statutory functions to deal with cybercrime, workplace safety, digital awareness and gender-sensitive governance, a shift from redressal to empowerment. Online harassment (2020-24): launched the Digital Shakti Campaign (Phase IV, 2022) with Meta and Cyber Peace Foundation to train women in online safety and digital literacy. Over 3 lakh women sensitised on cyber hygiene and legal recourse. Economic empowerment: the She Is a Changemaker programme (2021) to build leadership among women in politics, PRIs and social sectors. Skill and entrepreneurship workshops for over 12,000 grassroots women leaders. Legal awareness and counselling: expanded the One Stop Centres network and strengthened the 24x7 Women Helpline (181) for counselling, legal aid and rehabilitation. Launched the “We Think Digital” campaign for cyber-legal literacy among college students. High-profile cases: suo motu cognisance of the Hathras gang-rape (2020) , Manipur ethnic violence (2023) and the Kallakurichi school suicide case (2022) , issuing notices and ensuring time-bound reporting and victim assistance. Law reform: recommended amendments to the Indecent Representation of Women (Prohibition) Act, pushed gender-budgeting audits and monitored implementation of POSH guidelines in workplaces. Gender sensitisation: with the Bureau of Police Research and Development (BPR&D) trained over 30,000 police personnel on gender sensitivity and victim handling. Marginalised women: initiatives for trafficking survivors, migrant women and transgender women, with health outreach and livelihood schemes (2023). Demand FOR Constitutional Status FOR THE NCW The idea: since 1992 the NCW has been statutory. There is a consistent demand to give it constitutional status like the NCSC (Art 338) and NCST (Art 338A), to strengthen its authority and independence. Why it is demanded Limited enforcement: its recommendations are advisory, so governments and police often do not comply. Executive dependence: appointment and funding are controlled by the Ministry of Women and Child Development, hurting autonomy and credibility. Rising gender-based violence: growing crimes against women, online abuse and systemic discrimination need a stronger body with direct accountability. International commitments: constitutional status would match global standards such as the UN Paris Principles (1993) on independent national human rights institutions. Parity: SCs and STs already have constitutional commissions Similar status for women would improve institutional equality Expected benefits More autonomy: independent appointments, secure tenure and money charged to the Consolidated Fund of India . Binding recommendations on women’s rights, workplace safety and law enforcement. Continuity: protection from political or administrative interference across governments. Stronger policy impact on domestic violence, cyber safety and reproductive rights. Better global standing in compliance with CEDAW. Challenges the NCW faces today Limited autonomy and perceived political bias. As a statutory body it is less independent than constitutional bodies like the EC or CAG. Allegations of bias came up during the Manipur crisis in 2023. Inadequate resources. A Parliamentary Committee on Empowerment of Women (2022) said staff were too few for all-India coverage. High crime despite oversight. NCRB 2022 recorded over 4.45 lakh cases of crimes against women Conviction rates remain low, so deterrence is weak Marginalised women neglected. Concerns of tribal, Dalit and migrant women seldom reach the NCW Women sugarcane cutters in Maharashtra stayed under-reported despite petitions Advisory nature. Governments can ignore or delay action Many reports (for example after the Kathua rape case, 2018) saw slow State responses Overlapping jurisdictions with State Commissions, the NHRC and Lokpal The Committee on Empowerment of Women has repeatedly asked for a clearer delineation of powers Slow grievance redress. It gets 20,000+ complaints a year (2022 data), many resolved late. There is no real-time, technology-based monitoring. Way forward Constitutional status for independence, as suggested by the Justice Verma Committee (2013) after the Delhi gang-rape. Transparent, inclusive appointments including women activists and academics, not only government nominees. The Supreme Court in the Anjali Bhardwaj case (2019) stressed transparency in appointments. Reach marginalised women : Dalit, tribal, migrant and rural. More staff, funds and digital infrastructure including tech-based grievance redress. Binding power to enforce key recommendations. New challenges: gig-economy work, cyber abuse and workplace harassment (NCW surveys in 2023 highlight gig women’s vulnerabilities). Stronger collaboration with civil society and State commissions. Parivarik Mahila LOK Adalat (PMLA) Launched by the NCW with State Legal Services Authorities as an informal, conciliatory forum for women-related disputes, mainly family and matrimonial ones. It works under the Legal Services Authorities Act, 1987, aiming at speedy, friendly and low-cost justice. It handles domestic violence, maintenance, divorce, dowry, property disputes and custody . Proceedings are women-friendly and non-adversarial. The stress is on mediation, empathy and rehabilitation rather than punishment, so women can seek justice without fear or delay. It works with NGO support in resolving family disputes."}, {"c": "14", "n": "Bodies for Women, Children, Minorities and the NIA", "id": "2-ncpcr-state-commissions-for-child-rights", "t": "2 · Ncpcr · State Commissions FOR Child Rights (scpcr) · Children’s Courts", "x": "2 · Ncpcr · State Commissions FOR Child Rights (scpcr) · Children’s Courts # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Constitutional and Statutory Bodies handout pp. 23-30. Prelims PYQs quoted: none quoted in the material. In simple words The NCPCR (2007, under the CPCR Act 2005) is the national watchdog for children’s rights; each State may set up a similar SCPCR, and the Act also provides Children’s Courts for speedy, child-friendly trials. It has civil-court powers and monitors the RTE, POCSO and JJ laws. Its advice is not binding, POCSO pendency is high and digital threats are growing, so reform aims at binding powers, fast-track courts and better tech. National Commission FOR Protection OF Child Rights (ncpcr) Introduction A statutory body set up in 2007 under the Commissions for Protection of Child Rights (CPCR) Act, 2005 . It functions under the Ministry of Women and Child Development (MWCD) and is the apex national institution to protect, promote and monitor children’s rights. Its moral and legal base is the UN Convention on the Rights of the Child (UNCRC), 1989 , which India ratified in 1992 . The UNCRC defines a child as any human being below 18 . Its mandate covers review of child-related laws, investigation of violations, monitoring of laws like the RTE Act (2009), POCSO Act (2012) and JJ Act (2015) , and promoting awareness and accountability. Objectives Protection and redress: take notice of cases where child rights are denied or violated and ensure redress by inquiry or legal action. Policy and law review: examine laws, policies and programmes concerning children for alignment with the Constitution and international obligations. Child-centric governance: integrate child-rights concerns in all government decisions and planning. Monitor implementation of the Right to Education, Juvenile Justice and POCSO laws. Research and awareness: studies, reports and outreach to make the public sensitive to child protection. In essence it is a watchdog that keeps the State accountable to every child’s rights to survival, development, protection and participation. Initiatives to meet its mandate POCSO e-Box: an online complaint box where children can directly report sexual abuse, confidentially, with quick redress and mandatory action under the POCSO Act. Used widely since 2016 so school children can complain without fear. Samvardhan programme: vulnerability mapping to combat child trafficking, tied to district mechanisms and anti-trafficking units. Piloted in high-trafficking districts in Bihar and West Bengal. MASI App (Monitoring App for Seamless Inspection): a digital tool for real-time inspection of Child Care Institutions (CCIs) to ensure compliance with JJ Act norms. It flagged serious gaps in shelter homes after the Muzaffarpur case. GHAR-GO Portal (Go Home and Re-Unite): a digital platform to track and help restore or repatriate children in institutional care to their families or guardians. Used during COVID-19 to restore stranded migrant children. Aspect Provision Legal basis Commissions for Protection of Child Rights Act, 2005 Composition 1 Chairperson + 6 Members (at least two must be women ) Chairperson A person of eminence who has made outstanding contributions to child welfare and development Members (six fields) Eminent persons experienced in: (1) education, (2) child health, care or welfare, (3) juvenile justice or child rehabilitation, (4) eliminating child labour or helping children in distress, (5) child psychology or sociology, (6) laws relating to children Appointing authority Central Government Selection committee 3 members, chaired by the Union Minister of Women and Child Development, with senior officials of the ministry and one independent expert Tenure 3 years, renewable once (maximum two terms) Age limit Chairperson up to 65 ; Members up to 60 Removal On grounds of insolvency, incapacity, moral turpitude, misuse of office, absence from three consecutive meetings, etc. Nature Statutory, autonomous, recommendatory; has civil-court powers during inquiries Functions OF THE Ncpcr Core functions under the CPCR Act, 2005 1. Legal and institutional review of safeguards for child rights and recommending effective implementation (example: reviewing JJ Act implementation against UNCRC). 2. Monitoring and reporting: annual and special reports to the Central Government, tabled in Parliament with an Action Taken Memorandum . 3. Inquiry and investigation into violations suo motu, on complaint or on court direction. It may summon witnesses, gather evidence and recommend prosecution or remedial action. 4. Addressing vulnerabilities: displacement, trafficking, child labour, conflict, HIV/AIDS, disasters and domestic violence. 5. Children in special circumstances: Those in conflict with law, orphans, children of prisoners and children in institutions Recommending rehabilitation 6. Inspection and oversight: visiting juvenile homes, observation homes and child-care institutions and directing remedial action. 7. Research and policy advocacy. 8. Awareness and education of the public, parents, teachers and institutions (example: Child Rights Week initiatives). 9. Engagement with civil society : NGOs, child welfare organisations and community groups. 10. A limit: it cannot inquire into any matter already pending before a State Commission (SCPCR) or another statutory body, to avoid overlap. Extra functions under other child laws RTE Act, 2009: Review safeguards for the right to education Inquire into complaints of denial of free and compulsory education Use civil-court powers in such inquiries POCSO Act, 2012: Monitor implementation nationwide Run awareness drives and training for law enforcement and the judiciary Include POCSO work in its annual report to Parliament JJ Act, 2015: Oversee implementation including Child Welfare Committees (CWCs) and Juvenile Justice Boards (JJBs) Recommend improvements in rehabilitation, adoption and foster care Report compliance in its annual submission Powers AND Working Procedure Inquiry process (Sections 14-17) 1. How it takes notice: suo motu, on a written complaint from an individual, NGO or child-rights organisation, or on court direction. 2. Calling for reports: It can seek information or a report from the Central or State Government or a subordinate authority within a fixed time. If reports are delayed it can go ahead on its own If satisfied that adequate action has been taken it may close the case and inform the complainant 3. On-spot inquiry: field visits, recording statements and inspecting institutions such as juvenile homes, schools or shelters. 4. Full investigation: if a preliminary review shows a prima facie violation, it starts a full inquiry, directly or through an authorised team. Civil-court powers (Section 14) Summon and examine witnesses on oath Demand discovery and production of documents Receive evidence on affidavits Requisition public records from any court or office Issue summons for examination of persons or papers Authorise search and inspection of any premises or institution housing children These give it procedural authority and independence from executive interference. Actions after an inquiry (Sections 15-17) Recommend that the government begin prosecution or disciplinary action, and recommend compensation, rehabilitation or damages for the victim. Approach higher courts: move the Supreme Court or High Court for writs, orders or directions when legal enforcement is needed. Interim relief: suggest rescue, shelter or medical care at once. Follow-up: The government must submit an Action Taken Report within a set period The NCPCR can publish findings and monitor compliance Reports: annual and special reports go to the Central and State Governments and are laid before Parliament and State Legislatures with memoranda on actions taken and reasons for non-implementation. Working procedure Sittings are held regularly with a minimum quorum Decisions are by majority A Secretariat and Investigation Division with legal, research and field officers (on deputation or direct recruitment). Coordination with SCPCRs for jurisdictional clarity and information exchange. Child-friendly procedure: confidential hearings, anonymity of child victims and non-adversarial questioning, as per POCSO guidelines (2012). Technology: since 2020 online complaint portals and digital tracking through the Baal Swaraj e-monitoring system. Challenges faced by the NCPCR Non-binding recommendations: limits enforceability. The 2021 child-labour advisories were ignored by several States. Judicial pendency: over 1.6 lakh POCSO cases pending, which weakens deterrence and faith in child protection. Resource and staff deficit: too few people to inspect child care institutions. MASI found gaps in CCIs, but follow-up is poor. Perceived political influence: Perceived bias weakens trust in its independence Its response to the Manipur violence drew criticism for delay Online child sexual exploitation: NCRB 2022 reports rising cybercrimes against children including grooming The COVID-19 lockdown worsened online abuse and child pornography Digital trafficking networks: traffickers use gaming apps and the dark web to recruit children (UNODC 2021). Rural awareness gap: NFHS-5 shows only 36% of rural households know about child rights laws, so reporting is slow. Way forward Binding powers: Amend the CPCR Act so that recommendations bind The NHRC’s stronger powers could be a model Fast-track mechanisms: special benches for POCSO and JJ Act cases (the Delhi High Court’s 2023 directive shows the need for speedier hearings). AI and digital tools to detect child sexual abuse material online (the EU’s INHOPE network is an example of global cooperation). Cyber-safety education in the NCERT curriculum (MeitY’s 2022 child-safety toolkit is a baseline). More money and staff , including psychologists for child care institutions. Independent appointments: add child-rights activists and legal experts to the selection panel (the Supreme Court’s 2019 CIC judgment stressed transparent appointments). Partner with tech firms: mandatory child-safety audits for gaming and social media companies (the UK Online Safety Bill 2023 offers lessons). State Commission FOR Protection OF Child Rights (scpcr) Each State Government can set up an SCPCR by notification in the Official Gazette under the CPCR Act, 2005 (Section 17). It is the State-level counterpart of the NCPCR, giving decentralised monitoring, investigation and promotion of child rights in line with national laws and UN conventions. It ensures State laws, policies and administration match child welfare principles in the Constitution, the UNCRC and national child-protection laws. Aspect Provision Composition Chairperson + 6 Members (at least 2 women) Chairperson A person of eminence with outstanding service in promoting child welfare and development Members (six fields) Education; child health, welfare or development; juvenile justice or care of marginalised children; eliminating child labour; child psychology or sociology; laws relating to children Appointing authority State Government Selection committee Chaired by the Minister-in-charge of the department dealing with children Tenure 3 years; reappointment once (maximum two terms) Age limit Chairperson up to 65; Members up to 60 Removal Can resign to the State Government; can be removed for misbehaviour, incapacity, insolvency or abuse of office Nature Statutory, quasi-judicial and recommendatory Functions of the SCPCR (like the NCPCR, but limited to the State) Examine State laws, welfare schemes and administrative mechanisms and recommend reform to the State Government. Inquire into violations (suo motu or on complaint) and recommend prosecution or departmental action. Inspect juvenile homes, observation homes and shelter homes run by the State or NGOs, ensuring JJ Act standards. Examine problems of children affected by communal violence, trafficking, disasters, HIV/AIDS or domestic abuse and recommend protection. Promote awareness and research on State-specific issues like dropout rates, trafficking or malnutrition. Coordinate with the NCPCR and submit reports for nationwide consistency. Advise the State on rules, policies or schemes under the RTE, JJ and POCSO Acts. Powers and working procedure Civil-court powers under the CPC, 1908: summon and examine witnesses on oath, require production of documents, receive affidavits, requisition public records, issue summons for witnesses and documents. Same inquiry mechanism as the NCPCR: receive complaints, call for government reports, do field inspections. After the inquiry it may recommend prosecution, relief to victims, or file writ petitions before the State High Court or the Supreme Court . It reports annually and specially to the State Government, which lays the report before the State Legislature with an action-taken memorandum The State informs the Commission of action taken within a set time Children’s Courts Why: to ensure speedy trials and child-friendly justice, the CPCR Act, 2005 requires Children’s Courts at State or district level. They deal with offences against children or violations of child rights in a way that respects the child’s age, psychology and dignity. They complement the NCPCR and SCPCRs. Aspect Provision Legal basis Section 25 of the CPCR Act, 2005 Establishment The State Government, with the concurrence of the Chief Justice of the High Court , may specify a Court of Session or set up a separate Children’s Court in each district Jurisdiction To try offences against children or violations of child rights under any law (for example JJ Act, POCSO Act) Public Prosecutor The State appoints a Public Prosecutor or Special Public Prosecutor (minimum 7 years in criminal law) Objective Speedy, child-sensitive justice with protection from intimidation, trauma and secondary victimisation Functions and role Speedy trial of child abuse, trafficking, exploitation or denial of statutory rights, in time-bound proceedings. Child-friendly procedure: In-camera hearings to protect privacy No direct cross-examination of child victims Psychological support or a child counsellor Minimal exposure to the accused during testimony Enforcement: offences under the POCSO Act 2012, the Juvenile Justice Act 2015 and any other law on child welfare or exploitation. Coordination with CWCs and JJBs for holistic rehabilitation and social reintegration after the trial. Restorative orientation: correction, rehabilitation and victim-centred outcomes over punishment, reflecting the best interest of the child principle from the UNCRC (1989)."}, {"c": "14", "n": "Bodies for Women, Children, Minorities and the NIA", "id": "3-minority-rights-common-and-separate-doma", "t": "3 · Minority Rights · Common AND Separate Domain · National Commission FOR Minorities (NCM)", "x": "3 · Minority Rights · Common AND Separate Domain · National Commission FOR Minorities (NCM) # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Constitutional and Statutory Bodies handout pp. 30-34. Prelims PYQs quoted: none quoted in the material. In simple words The Constitution never defines “minority”, but protects them in two ways: rights that every citizen has (the common domain) and rights meant only for minorities (the separate domain, Articles 29, 30, 347, 350A and 350B). The Minorities Commission began in 1978 and became the statutory NCM in 1992. It evaluates progress, monitors safeguards, looks into complaints and recommends to governments, but only for the six notified religious communities. Constitutional Rights AND Safeguards FOR Minorities Starting point: the Constitution does not define “minority”, but it recognises communities based on religion or language who may need special protection to keep their identity and have equality. It gives a detailed framework of rights, which shows India’s commitment to pluralism and inclusion. These provisions divide into two domains: the Common Domain (rights open to all citizens, ensuring equality, liberty and justice) and the Separate Domain (protections meant exclusively for minorities to guard their identity, language, culture and educational institutions). This dual framework keeps equality before law universal while protecting minority identities within a secular democracy. The Preamble, which declares India a secular State and guarantees liberty of thought, expression, belief, faith and worship, reflects this spirit. I. Common Domain (rights OF ALL Citizens) (A) Directive Principles (Part IV) — not justiciable, but fundamental to governance under Article 37 Article 38(2): the State must try to eliminate inequalities in status, facilities and opportunities among individuals and groups living in different areas or in different occupations. Article 46: the State must promote with special care the educational and economic interests of weaker sections, in addition to SCs and STs. Minority groups often fall within weaker sections, so these Articles give them targeted State attention. (B) Fundamental Duties (Part IVA, Article 51A) The duty to promote harmony and the spirit of common brotherhood among all Indians, rising above religious, linguistic, regional or sectional diversities. The duty to value and preserve the rich heritage of India’s composite culture . These strengthen social cohesion and mutual respect among the groups that make up the nation. Fundamental Right (Part III) in the common domain What it gives Article 14 Equality before law and equal protection of the laws Articles 15(1), 15(2) No discrimination on grounds of religion, race, caste, sex or place of birth Article 15(4) State may make special provisions for socially and educationally backward classes of citizens, including minorities Articles 16(1), 16(2) Equality of opportunity in public employment; no discrimination on those grounds Article 16(4) Reservation in State services for backward classes not adequately represented Article 25(1) Freedom of conscience and the right to freely profess, practise and propagate religion, subject to public order, morality and other Fundamental Rights Article 26 Every religious denomination can manage its own affairs in religion, set up and maintain institutions, and own and administer property Article 27 No one can be compelled to pay taxes for promoting a particular religion Article 28 Freedom to attend or not attend religious instruction or worship in educational institutions wholly maintained, recognised or aided by the State II. Separate Domain (rights ONLY FOR Minorities) Provision What it gives Article 29(1) Any section of citizens with a distinct language, script or culture has the right to conserve it Article 29(2) No denial of admission to any State-aided educational institution on grounds only of religion, race, caste or language Article 30(1) All religious and linguistic minorities can establish and administer educational institutions of their choice Article 30(2) The State cannot discriminate against minority-managed institutions when giving aid Article 347 The President can recognise a language spoken by a section of a State’s population for official purposes Article 350A The State must provide facilities for instruction in the mother tongue at the primary stage for linguistic minorities Article 350B A Special Officer for Linguistic Minorities to investigate safeguards and report to the President Explanation I to Article 25 Recognises the Sikh community’s right to wear and carry kirpans as part of freedom of religion Way forward / key point India’s pluralistic vision: the Constitution treats India as multi-religious, multi-lingual and multi-cultural. The framers saw the Indian nation not as a mere collection of individuals but as a two-tier commonwealth : of citizens, and of the cultural, religious and linguistic groups they belong to. Each group, like each citizen, has equal Fundamental Rights and equal Fundamental Duties, so diversity enriches the national identity instead of dividing it. Protecting weaker sections in a plural society: weakness can come from small numbers or from social, economic or educational disadvantage. So there are special provisions for religious and linguistic minorities, and also for SCs, STs and backward classes. This reaffirms India’s model of secularism and inclusive development, where equality goes hand in hand with diversity and every group, majority or minority, gets both protection and participation. National Commission FOR Minorities (NCM): History 1978 The Ministry of Home Affairs Resolution proposed a permanent institution. Despite many safeguards, minorities felt unequal and discriminated against; the Government said the enforcement of safeguards deserved “the highest importance”. The Minorities Commission was set up in 1978 under the Home Ministry. 1984 Transferred to the newly created Ministry of Welfare , a shift from law and order to welfare and development. 1988 By a Welfare Ministry Resolution, linguistic minorities were excluded from its jurisdiction, so the Commission looked only at religious minorities. 1992 The National Commission for Minorities Act, 1992 gave statutory status. The first statutory Commission was constituted on 17 May 1993 . 1993 notification Five religious communities notified as minorities under Section 2(c) : Muslims, Christians, Sikhs, Buddhists and Zoroastrians (Parsis) . 2014 Jains added by another notification. Religion (Census 2011) Population (crore) Percentage Muslims 17.22 14.2 Christians 2.78 2.3 Sikhs 2.08 1.7 Buddhists 0.84 0.7 Jains 0.45 0.4 Total 23.37 19.30 Note Definition under the Act: Section 2(c) of the NCM Act, 1992 defines “minority” as “a community notified as such by the Central Government.” So all the Commission’s statutory functions apply only to the six notified religious communities . Memory aid · MCSBZJ Notified minorities: M uslims, C hristians, S ikhs, B uddhists, Z oroastrians (1993) and J ains (2014). (own mnemonic) NCM: Composition AND Functions Parameter Details Composition Chairperson, Vice-Chairperson and 5 Members (multi-member body) Eligibility Persons of eminence, ability and integrity from diverse fields Minority representation At least 5 members, including the Chairperson, must belong to the notified minority communities Appointing authority Nominated by the Central Government (Ministry of Minority Affairs) Tenure 3 years; can resign at any time; the Central Government can remove them on specified grounds Removal grounds Insolvency, moral turpitude, unsound mind, misuse of office, absence from 3 consecutive meetings, incapacity or refusal to act Functions (Section 9(1) of the NCM Act, 1992) Evaluating development progress: assessing how minorities fare under Union and State programmes. Monitoring safeguards: overseeing implementation of constitutional and legal safeguards, including Articles 29 and 30 on cultural and educational rights. Advice and recommendations to the Centre and States on better implementation and improving minorities’ condition. Addressing complaints of deprivation of rights and safeguards and taking them up with the relevant authorities. Research and studies on the causes and impact of discrimination against minorities and ways to remove it. Studying socio-economic and educational conditions of minority communities. Policy suggestions to the Union and States for minority welfare. Reports: periodic and special reports to the Central Government on problems minorities face. Other matters referred by the Central Government. Complaints and redress Common complaints: police excesses or atrocities , service matters in public employment, issues of minority educational institutions , and encroachment or disputes over religious properties . On a complaint, the NCM asks for detailed reports from the Union or State authorities, reviews the findings and recommends redress. So it acts as a statutory watchdog."}, {"c": "14", "n": "Bodies for Women, Children, Minorities and the NIA", "id": "4-national-investigation-agency-nia-functi", "t": "4 · National Investigation Agency (NIA) · Functions · Process · Special Courts · Criticism · Ankush Vipan Kapoor (2024)", "x": "4 · National Investigation Agency (NIA) · Functions · Process · Special Courts · Criticism · Ankush Vipan Kapoor (2024) # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Constitutional and Statutory Bodies handout pp. 34-38. Prelims PYQs quoted: none quoted in the material. In simple words The NIA was created by the NIA Act, 2008 after the 26/11 attacks as a central agency to investigate terrorism and other scheduled offences across India without needing State consent. Cases go to special courts and appeals lie to the High Court. Critics point to federalism worries, UAPA detentions, thin staff and low conviction in some cases. In Ankush Vipan Kapoor (2024) the Supreme Court said the NIA may also probe linked non-scheduled offences, after informing the Centre. WHAT THE NIA IS Introduction Established through the NIA Act, 2008 , after the 26/11 Mumbai terror attacks , to create a specialised federal body for counter-terrorism. Headquartered in New Delhi, it can investigate scheduled offences without State consent , giving a swift and centralised response to terrorism, cross-border crime and offences that affect national security. It works under the Ministry of Home Affairs and is headed by a Director General (IPS rank) . Aspect Details Legal basis NIA Act, 2008; amended in 2019 to widen its jurisdiction Trigger for creation 2008 Mumbai terror attacks; the need for a federal counter-terror mechanism Headquarters New Delhi; branch offices in Mumbai, Hyderabad, Kolkata, Guwahati, Kochi, Lucknow, Raipur and Jammu Leadership Director General (IPS rank) Jurisdiction Concurrent jurisdiction across India; extended outside India after the 2019 amendment Scheduled offences UAPA, Explosives Act, Atomic Energy Act, WMD Act, IPC Chapter VI (waging war, sedition/offences against the State), counterfeit currency, hijacking, cyber-terrorism Special courts Set up by the Centre or States; presided by Sessions Judges appointed in consultation with the High Court Chief Justice Appeals Lie to the High Court; disposal targeted within 3 months Functions AND Powers Eight functions, with examples 1. Counter-terror investigation across States without State permission, so the anti-terror response is uniform. Example: the Pulwama attack (2019) probe led to a high conviction rate. 2. Jurisdiction outside India: widened in 2019 to probe offences against Indians abroad. Example: Indian assets targeted in Kabul (2021) were monitored under the wider powers. 3. Exclusive authority on scheduled offences under UAPA, the WMD Act, the Explosives Act and IPC Chapter VI. Example: a fake currency racket under IPC Sections 489A to 489E. 4. Concurrent jurisdiction with State police: it can take over cases from State police within 15 days of referral. Example: the Kerala gold smuggling case moved from State police in 2020. 5. Civil-court-like powers during inquiry: summon witnesses, demand records, attach property . Example: asset attachment in ISIS recruitment cases under UAPA. 6. Specialised cells for terror financing: the TFFC Cell monitors terror financing and counterfeit circulation. Example: Rs 2000 counterfeit notes traced to Pakistan-based networks. 7. International collaboration with Interpol, FBI and Europol on global terror cases. Example: Dawood Ibrahim’s networks flagged through FATF information sharing. 8. Supervision through Special Courts for speedy trial. Example: the Ajmer Dargah blast trial concluded in an NIA Special Court. Category Acts and offences covered (scheduled offences) Terrorism and security Unlawful Activities (Prevention) Act, 1967; Atomic Energy Act, 1962; WMD Act, 2005 Explosives and arms Explosive Substances Act, 1908; Anti-Hijacking Act, 2016; manufacture and sale of prohibited arms Counterfeit and smuggling IPC Sections 489A-489E (counterfeit currency and notes) IPC Chapter VI IPC Sections 121-130 (waging war, sedition, offences against the State) Cyber and trafficking (2019 amendment) Human trafficking, cyber-terrorism, counterfeit currency, prohibited arms trade International dimension SAARC Convention Act, 1993; offences outside India involving Indians or Indian assets HOW THE NIA Works (process) Eight steps 1. Initial reporting: local police send the FIR to the State and then to the Centre within 24 hours . Example: inputs registered by the NCRB on arms smuggling are shared with the NIA. 2. Central screening within 15 days: the Centre decides whether it is a scheduled offence fit for the NIA. Example: the 2022 Ludhiana blast was quickly handed over. 3. Transfer from State: once the NIA takes over, State police stop all investigation. Example: the West Bengal coal scam probe moved from CID to NIA. 4. Preliminary inquiry and registration: the DG approves the FIR and an inquiry wing begins fact-finding. 5. Investigation with nationwide powers: NIA officers act as station house officers across India. Example: nationwide raids against the PFI in September 2022. 6. Trial in Special Courts: before Sessions Judges appointed on the High Court Chief Justice’s recommendation. Example: the Samjhauta Express blast case in Panchkula. 7. Appeals to the High Court within 30 days: a two-judge bench is required to dispose of them within three months. 8. State coordination during trial: States must give cooperation, logistics and witnesses. Special Courts under the NIA Act Notified by the Central Government to try only scheduled offences investigated by the agency. Presided over by a Sessions Judge or Additional Sessions Judge nominated by the Chief Justice of the High Court. They can sit outside their normal seat if needed, which gives flexibility for sensitive trials. Appeals go directly to the High Court Timelines are stressed to avoid delays in terror trials Challenges AND Criticisms Eight criticisms Federalism: States say the Centre overrides their policing powers. The Kerala CM criticised the NIA takeover of the gold smuggling case. Human rights: allegations of coercive interrogation and prolonged detention under UAPA. Amnesty International flagged arrests after the Bhima Koregaon case. Manpower: only about 1,200 personnel against a rising caseload of 300+ cases a year. A CAG report (2021) flagged staff shortage in regional offices. Overreach and misuse: Perceived selective targeting of NGOs and minority-linked groups Greenpeace India flagged misuse of foreign-funding scrutiny Low convictions in some high-profile cases: the Samjhauta Express blast verdict acquitted all accused (2019), which weakens deterrence and credibility. Technology lag: No AI-driven monitoring of the dark net and encrypted networks Europol reports highlight India’s vulnerability to cyber-radicalisation Coordination gaps with State agencies: delayed intelligence sharing reduces efficiency (the 2016 Pathankot attack probe saw jurisdictional disputes). Perceived political bias: Criticism that NIA cases often match the ruling party’s narrative Opposition flagged selective raids against NGOs in 2021 Way forward Federal cooperation: a Centre-State coordination council for security issues, on the Inter-State Council model. More staff and regional presence: recruitment and new offices in the North-East and border regions (a 2022 parliamentary panel recommended more branch offices). Digital and cyber capability: AI, blockchain and forensic tools for dark-net monitoring (lessons from the US FBI’s Joint Terrorism Task Force). Human rights compliance: NHRC oversight in custodial interrogation and trials UN guidelines on counter-terror measures Efficient special courts: digital courts for faster terror trials (e-Courts Phase III, 2023). Accountability and audits: annual CAG audit of the NIA for budget and impartiality. Global cooperation: stronger MLATs and Interpol red notices for fugitives abroad (cooperation with the UAE sped up extradition of gangsters). Awareness and citizen participation: reporting channels, helplines and civic awareness. Supreme Court: Ankush Vipan Kapoor v. NIA (2024) The Supreme Court widened the scope of NIA investigation by reading Section 8 of the NIA Act holistically. 1. Linked offences: the NIA may investigate non-scheduled offences connected with a scheduled offence . Example: if terror financing involves IPC fraud charges, the NIA can probe both. 2. Central approval: the agency must inform the Central Government before widening the investigation . This gives executive oversight and prevents arbitrary extension of powers. 3. Joint investigation: linked offences must be investigated together with the scheduled offence, to avoid duplication, keep consistency and strengthen prosecution. 4. Significance: the ruling widens the NIA’s jurisdiction and reinforces India’s anti-terror architecture. It helps tackle hybrid crimes where terror links overlap with economic and cyber offences. Way forward / key point Conclusion: the NIA is India’s federal answer to terrorism and national security threats. Its wide jurisdiction and international reach make it indispensable, but federal friction, resource gaps and digital challenges need fixing. With transparency, modern technology and Centre-State synergy it can become a global-standard counter-terror agency."}, {"c": "14", "n": "Bodies for Women, Children, Minorities and the NIA", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. NCW established in 1992, under the NCW Act, 1990 NCW members Chairperson + 5 Members + Member-Secretary Who appoints NCW members? Central Government NCW tenure 3 years Is the NCW constitutional? No, statutory; there is a demand to make it constitutional Which committee suggested constitutional status (2013)? Justice Verma Committee Digital Shakti Campaign was in partnership with Meta and Cyber Peace Foundation Women Helpline number 181 PMLA works under which Act? Legal Services Authorities Act, 1987 NCPCR established in 2007, under the CPCR Act 2005 Ministry under which NCPCR works Ministry of Women and Child Development NCPCR composition 1 Chairperson + 6 Members (at least 2 women) Age limits at NCPCR Chairperson 65, Members 60 NCPCR tenure 3 years, renewable once UNCRC adopted / India ratified 1989 / 1992; child = below 18 POCSO e-Box Online complaint box for children MASI App Monitoring App for Seamless Inspection of Child Care Institutions Children’s Courts under which Section? Section 25 of the CPCR Act Pending POCSO cases mentioned Over 1.6 lakh Does the Constitution define “minority”? No Articles in the separate domain 29, 30, 347, 350A, 350B (and Explanation I to Art 25) Article that lets minorities run educational institutions Article 30(1) Special Officer for Linguistic Minorities Article 350B Minorities Commission first set up in 1978, under the Home Ministry Statutory NCM from NCM Act 1992; first Commission 17 May 1993 Who defines “minority” under the Act? The Central Government, by notification (Section 2(c)) Six notified minorities Muslims, Christians, Sikhs, Buddhists, Zoroastrians, Jains When were Jains notified? 2014 NCM composition Chairperson, Vice-Chairperson and 5 Members NIA created by which Act and when? NIA Act, 2008, after the 26/11 attacks Which year did the Act widen NIA jurisdiction? 2019 (including offences outside India) NIA is headed by Director General (IPS rank) Ministry under which NIA works Ministry of Home Affairs Centre screens a case within 15 days Special Court judges are Sessions Judges appointed in consultation with the High Court Chief Justice Appeals from NIA Special Courts go to The High Court (two-judge bench; 3 months) Case that widened NIA scope in 2024 Ankush Vipan Kapoor v. NIA What did that case allow? Probing linked non-scheduled offences, after informing the Centre Staff mentioned in the handout About 1,200 personnel vs 300+ cases a year"}, {"c": "14", "n": "Bodies for Women, Children, Minorities and the NIA", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts in Start Here)"}, {"c": "14", "n": "Bodies for Women, Children, Minorities and the NIA", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards"}, {"c": "15", "n": "The President, Ordinances and Parliamentary Government", "id": "1-the-president-election-nominal-head-bind", "t": "1 · THE President · Election · Nominal HEAD · Binding Advice · Discretion · Rubber Stamp Debate", "x": "1 · THE President · Election · Nominal HEAD · Binding Advice · Discretion · Rubber Stamp Debate # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Executive and Legislature handout pp. 2-4. Prelims PYQs quoted: none quoted in the material. In simple words The President is the head of State and the nominal (de jure) executive, while the Prime Minister and Council of Ministers are the real (de facto) executive. The President must act on their advice (Article 74), but can send it back once. In a hung Parliament and in a few other situations the President has real discretion. So the office is neither a rubber stamp nor an active ruler. THE Union Executive AND THE President Union Executive (Part V, Chapter I, Articles 52 to 78) The Union Executive is the branch that implements laws and runs the day-to-day administration of the country. It consists of: (1) the President , (2) the Vice-President , (3) the Council of Ministers headed by the Prime Minister , and (4) the Attorney-General of India . Among these the President holds the highest constitutional position. He is the head of the State and all executive actions of the Union are taken in his name. Why is the President elected indirectly? The Constituent Assembly debated this deeply before finalising Articles 54 and 55. Parliamentary system logic: since the President is only a nominal head and not the real executive, a direct election like that of the US President seemed unnecessary. Avoiding political rivalry: a direct national election could create conflict between the President and the Prime Minister, both claiming a popular mandate. Cost and complexity: a direct election over so large an electorate would be slow and expensive, especially for a largely ceremonial office. Federal representation: including elected members of both Parliament and the State Assemblies means the President represents both the Union and the States. Position AND ROLE: REAL HEAD vs Nominal HEAD Constitutional position Article 52 creates the office of the President. Article 53 vests the executive power of the Union in the President, to be used directly or through subordinate officers, in accordance with the Constitution. The President holds three roles : Head of State (first citizen and symbol of national unity) Supreme Commander of the Armed Forces And constitutional or nominal head , the de jure executive but not the real executive Binding nature of ministerial advice (Article 74) Article 74(1): the President acts on the aid and advice of the Council of Ministers headed by the Prime Minister, and this advice is binding. 42nd Amendment (1976) made it explicit that the President must act on ministerial advice, removing any doubt about discretionary power. 44th Amendment (1978) allowed the President to send the advice back once for reconsideration. But if the Council reconsiders and repeats the advice, it is binding. Article 74(2) bars courts from inquiring into what advice ministers gave the President. But in S. R. Bommai v. Union of India (1994) the Supreme Court clarified that while the advice itself is non-justiciable, the material on which it is based can be examined by courts. Why have a nominal head at all? Continuity and stability: the President stays in office even when a government falls, so there is no constitutional vacuum. Non-partisan head: a symbol of national unity above party politics. Prevents concentration of power: separates the Head of State from the Head of Government. Constitutional safeguard: can return advice for reconsideration and use limited discretion, for example during a hung Parliament. The difference between the de jure executive (President) and the de facto executive (PM and Council of Ministers) is a defining feature of India’s parliamentary democracy. Discretionary Powers OF THE President Situations where the President can act without being bound by the Council’s advice Appointing the PM when no party has a clear majority in the Lok Sabha: the President uses personal judgment to invite the leader most likely to command confidence. Dismissing a PM who has lost the Lok Sabha majority but refuses to resign (Article 75(2): ministers hold office during the President’s pleasure). Returning a Bill for reconsideration (suspensive veto): can be done once. Refusing dissolution of the Lok Sabha if a PM who has lost the majority advises it. If the PM dies suddenly the Council of Ministers is automatically dissolved The President can act until a new PM is formed and then appoint a new PM who can command a majority Pocket veto: keeping a Bill pending without formal return or assent. Note K. R. Narayanan (1997): he returned the Cabinet’s advice to impose President’s Rule in Uttar Pradesh. This is an example of the President using moral authority even without formal legal power. Assessment: Rubber Stamp OR Constitutional Guardian? Arguments: rubber stamp Article 74 makes Cabinet advice binding The President “acts on advice” with no formal right to deviate Vast executive, legislative, financial and military powers are used entirely on ministerial advice. India has no history of a President formally overriding a Cabinet decision. Arguments: more than a rubber stamp The suspensive veto lets the President send a matter back once, forcing the government to rethink. The pocket veto (unique to India) allows indefinite delay, as shown by President Zail Singh . Discretion in hung-assembly situations is real: choosing who forms the government is not trivial. Narayanan’s return of the UP President’s Rule advice shows moral authority can be used within conventions. In a majoritarian democracy the President’s non-partisan role is a legitimising check on arbitrary parliamentary action. R. Venkataraman in My Presidential Years noted that the ability to ask questions, point out concerns and require reconsideration, even once, gives the office real constitutional weight. Way forward / key point Balanced view: the President is neither a mere rubber stamp nor an active ruler. Normally he acts on the aid and advice of the Council of Ministers, but in crises (hung Parliament, unstable government, emergency) he can play an important role through limited discretion and moral authority to protect the Constitution. Presidential Elections Criticism of the election system It is a highly complex system. The value of an MLA’s vote differs from State to State. It is neither true proportional representation nor a plain single transferable vote system. Calling it “proportional representation” is a constitutional misnomer because a single office cannot be divided proportionally , so the process is really an alternative vote and not a true PR-STV system. Feature USA India France Type of election Indirect, through the Electoral College Indirect, through elected MPs and MLAs Direct election by citizens Electors / voters 538 electors, selected through State elections Elected MPs of both Houses and elected MLAs of States, plus Delhi and Puducherry Citizens aged 18+ with voting rights Voting method Winner-take-all in 48 States and DC; Maine and Nebraska use district allocation Proportional representation by Single Transferable Vote (STV), secret ballot; votes have weighted values Two-round system: top two candidates go to a runoff if nobody has a majority in round 1 Winning requirement 270 of 538 electoral votes; if none, the House of Representatives elects More than half of the total valid weighted votes, using an electoral quota More than 50% of valid votes, in round 1 or round 2 Eligibility Natural-born citizen, minimum 35 years, 14 years’ US residence Indian citizen, minimum 35 years, qualified for Lok Sabha membership, no disqualifying office of profit French citizen, minimum 18 years, voting rights and 500 endorsements from elected officials Term 4 years 5 years 5 years Term limits Maximum 2 elections (22nd Amendment) No term limit (Article 57) Maximum 2 consecutive terms Election disputes / oversight State administration, Congressional counting, judicial review Supreme Court decides disputes (Article 71) Constitutional Council supervises and validates elections"}, {"c": "15", "n": "The President, Ordinances and Parliamentary Government", "id": "2-ordinance-making-power-article-123-condi", "t": "2 · Ordinance-making Power (article 123) · Conditions · Limits · Cases · Trends · Examples", "x": "2 · Ordinance-making Power (article 123) · Conditions · Limits · Cases · Trends · Examples # Handout only · Saarthi IAS Exam lens Priority: Low. Mains PYQs quoted: None quoted in the handout · Executive and Legislature handout pp. 4-7. Prelims PYQs quoted: none quoted in the material. In simple words Under Article 123 the President can issue an ordinance when Parliament is not in session and immediate action is needed. It has the force of an Act but is temporary: it must be laid before both Houses and lapses six weeks after Parliament reassembles unless replaced by an Act. Courts have said repeated re-promulgation is a fraud on the Constitution (D. C. Wadhwa) and that the power is open to judicial review. WHAT IS THE Ordinance Power? Meaning The ordinance-making power is an exceptional feature of the Indian Constitution. Under Article 123 , the President can promulgate an ordinance when either House or both Houses of Parliament are not in session (for example when the Lok Sabha is prorogued or dissolved while the Rajya Sabha is sitting, or vice versa). Ordinary legislation needs the approval of both Houses. An ordinance lets the Executive take immediate legislative action when Parliament cannot make a law through the normal process. Legal status: it has the same force and effect as an Act of Parliament , but it is a temporary law . Not an Emergency power: ordinances can be issued in peacetime, without declaring an Emergency under Part XVIII. Global comparison: such power is unusual in major democracies. The UK and the USA have no equivalent presidential ordinance-making power. Constituent Assembly view: Dr. B. R. Ambedkar defended it as a way to deal with “a situation which may suddenly and immediately arise” when existing laws are not enough and Parliament is not in session. Constitutional Conditions AND Limitations 1. Parliament must not be in session An ordinance can be issued only when either or both Houses are not in session. If both are in session , an ordinance cannot be promulgated. It is an interim legislative power, not a parallel substitute for Parliament. 2. Immediate necessity must be satisfied The President must be satisfied that circumstances require immediate action, and he acts on the aid and advice of the Council of Ministers (Article 74). 38th Amendment (1975) made the President’s satisfaction final, conclusive and non-justiciable. 44th Amendment (1978) removed this protection, bringing back judicial review. Judicial scrutiny today: courts can examine whether the satisfaction rests on relevant material or is tainted by mala fide intent or an improper purpose. They do not judge the wisdom of the policy or the adequacy of the material. 3. Legislative competence and subject matter The ordinance power is co-extensive with Parliament’s ordinary legislative power , subject to constitutional limits. Subject matter: generally the Union List and Concurrent List , plus matters on which Parliament can legislate under special provisions. Effect: it can amend or repeal existing laws and operate retrospectively, subject to limits like Article 20(1). Limits: it cannot violate Fundamental Rights or other constitutional restrictions. It cannot amend the Constitution , which needs the Article 368 procedure. 4. Parliamentary approval and duration Mandatory laying: every ordinance must be placed before both Houses after they reassemble. Duration: it ceases to operate six weeks after Parliament reassembles , unless replaced by an Act. Earlier end: it ends sooner if both Houses pass resolutions disapproving it . If the Houses reassemble on different dates , the six weeks are counted from the later date. Maximum life: normally six months and six weeks , because the gap between two sessions can be at most six months (Article 85(1)). Withdrawal: the President can withdraw it at any time on ministerial advice. Procedural safeguard: under Rule 71(1) of the Lok Sabha Rules , a Bill replacing an ordinance must come with a statement explaining why immediate legislation was needed. Memory aid · SINE-LAPSE Ordinance checklist: S ession off · I mmediate need · N o amendment of the Constitution / no FR violation · E ffect like an Act · L aid before both Houses · A pproval or lapse in 6 weeks · P resident may withdraw · E xpiry max 6 months + 6 weeks. (own mnemonic) Judicial Control AND Lapsed Ordinances Case What the Court held R. C. Cooper v. Union (1970) The ordinance power is subject to constitutional limits. Ordinances can be challenged in court for violating Fundamental Rights or other constitutional provisions. A. K. Roy v. Union (1982) Ordinance-making is a legislative power, subject to constitutional limits. An ordinance has the same force and effect as parliamentary legislation and is subject to judicial review, especially when it violates constitutional rights. D. C. Wadhwa v. State of Bihar (1987) Between 1967 and 1981 Bihar re-promulgated 256 ordinances , keeping some alive for up to 14 years without legislative consideration. The Court held that repeated re-promulgation to bypass the legislature is a “fraud on the Constitution” and that the Executive cannot replace the regular legislative process with ordinances. Krishna Kumar Singh v. State of Bihar (2017, seven-judge bench) Bihar repeatedly issued ordinances to take over private Sanskrit schools. When they expired, the question was whether rights created under them continued. The Court held: re-promulgation without legislative scrutiny is impermissible ; every ordinance must be laid before the legislature (failure is a serious violation); rights and benefits created under an ordinance do not automatically continue after it expires , although some effects may continue if reversing them is impossible, impractical or against comp
