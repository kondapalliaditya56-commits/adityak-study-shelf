-Police coordination; clear CSS roles Financial timely devolution; rationalise cess; more untied grants; fair horizontal formula; responsible borrowing; strengthen local finance Political internal party democracy; no partisan use of constitutional offices; CMs in national policy; local governments Commissions Body Key recommendations Rajamannar Committee 1969 (Tamil Nadu) more State autonomy; residuary powers to States ; rethink Concurrent List; stronger State finances; effective ISC Sarkaria 1983-88 (Justice R. S. Sarkaria) consult on Concurrent List; residuary taxation with Union, rest Concurrent; eminent, detached Governor after consulting State; Art 356 last resort; permanent ISC; fair transfers NCRWC 2002 (Justice M. N. Venkatachaliah) consultative Governor appointment; neutrality; safeguards against Art 356 misuse; decentralisation Punchhi 2007-10 (Justice M. M. Punchhi) structured consultation on Concurrent List; State role in treaties; fixed Governor tenure and impeachment-type removal; clearer Arts 200-201; Arts 256-257 as last resort; stronger ISC; review cesses/CSS; consult on central forces Memory aid · RSNP Commissions in order: R ajamannar 1969 · S arkaria 1983 · N CRWC 2002 · P unchhi 2007. (own mnemonic) Overall Assessment Strengths national integration regional autonomy accommodation of diversity (reorganisation, asymmetry) judicial protection (Basic Structure) cooperative institutions (FC, GST Council, ISC, NITI) Weaknesses political centralisation fiscal dependence weak consultation water/boundary/resource disputes incomplete decentralisation Way forward / key point The aim is not to weaken the Union or give States unrestricted powers, but a balance through restraint, cooperative institutions, fiscal fairness, political neutrality, decentralisation and mutual trust."}, {"c": "18", "n": "Governor, Article 356, Fiscal Federalism and Inter-State Relations", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Governor appointed under Art 155 Pleasure doctrine Art 156 Min age 35 Singhal 2010 removal not arbitrary Nabam Rebia 2016 Governor acts on advice for Art 174 Art 356 approval within two months; max 3 years Bommai 1994 nine judges; federalism basic structure Rameshwar Prasad 2006 Bihar dissolution unconstitutional Financial Emergency Art 360, never used FC article Art 280, every five years Divisible pool article Art 270 Cess and surcharge article Art 271 Grants articles 275 and 282 15th FC share / chair 41%, N. K. Singh 16th FC chair Arvind Panagariya 16th FC new criterion contribution to GDP, 10% 16th FC fiscal targets Union 3.5% by 2030-31; States 3% of GSDP GST in force 1 July 2017, 101st Amendment GST Council article Art 279A Voting weights Union 1/3, States 2/3; 3/4 to decide Mohit Minerals 2022 Council recommendations not binding NITI Aayog 1 January 2015 SCS basis none constitutional or statutory Rajan Committee 2013, Composite Development Index State borrowing article Art 293 Full Faith and Credit Art 261 River disputes article Art 262 River Boards Act 1956, not operational Cauvery normal-year share total 740 TMC ft; award 2007; SC 2018 Assam-Meghalaya MoU 2022, 6 of 12 areas Assam-Arunachal MoU 2023, 123 villages Hindi Art 343; no national language Art 371A / 371J Nagaland / Karnataka Freeze on seats 1971 Census, 42nd Amendment; extended by 84th (2001) 87th Amendment 2003, boundaries on 2001 Census 131st Bill introduced 16 April 2026, defeated 17 April 2026 (verify) NCRWC chair Justice M. N. Venkatachaliah Punchhi chair Justice M. M. Punchhi Rajamannar Tamil Nadu, 1969, residuary powers to States Local govt amendments 73rd and 74th, 1992"}, {"c": "18", "n": "Governor, Article 356, Fiscal Federalism and Inter-State Relations", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, res.innerHTML=h||'<p class="prog">No matches.</p>'}
q.addEventListener('input',run)})();</script><script>/* Shared store: reading progress, preferences, optional cross-device sync. */
(function(){
var KEY='nbapp:v1',root=document.documentElement;
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function fresh(){return{v:1,prefs:{fs:1,lh:1.65,w:780,font:'serif',theme:'auto',pt:0},last:null,nb:{},days:{}}}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var S;
try{S=JSON.parse(lsGet(KEY))}catch(e){S=null}
if(!S||!S.v)S=fresh();
S.prefs=Object.assign(fresh().prefs,S.prefs||{});
// one-time import of the older done list and theme
if(!S.migrated){
  try{var od=JSON.parse(lsGet('nb-done')||'[]');od.forEach(function(n){var c=chap('modern-india',n);c.done=1;c.dt=1})}catch(e){}
  var ot=lsGet('nb-theme');if(ot&&!S.prefs.pt){S.prefs.theme=ot;S.prefs.pt=1}
  S.migrated=1;
}
function chap(nb,n){var b=S.nb[nb]||(S.nb[nb]={});return b[n]||(b[n]={read:{},done:0,dt:0,pos:null,t:0})}
var listeners=[],dirty=false,saveT=null,syncT=null;
function save(){
  dirty=true;clearTimeout(saveT);
  saveT=setTimeout(function(){lsSet(KEY,JSON.stringify(S));listeners.forEach(function(f){try{f()}catch(e){}});scheduleSync()},250);
}
function flush(){lsSet(KEY,JSON.stringify(S))}
function merge(a,b){ // a local, b remote; returns merged
  var o=fresh();
  o.prefs=((b.prefs&&b.prefs.pt||0)>(a.prefs&&a.prefs.pt||0))?Object.assign({},a.prefs,b.prefs):Object.assign({},b.prefs,a.prefs);
  o.last=(!a.last||(b.last&&b.last.ts>a.last.ts))?b.last:a.last;
  o.migrated=1;
  var ids={};Object.keys(a.nb||{}).concat(Object.keys(b.nb||{})).forEach(function(k){ids[k]=1});
  Object.keys(ids).forEach(function(id){
    o.nb[id]={};var ca=(a.nb||{})[id]||{},cb=(b.nb||{})[id]||{},ks={};
    Object.keys(ca).concat(Object.keys(cb)).forEach(function(k){ks[k]=1});
    Object.keys(ks).forEach(function(k){
      var x=ca[k],y=cb[k];if(!x||!y){o.nb[id][k]=x||y;return}
      var r=Object.assign({},x.read,y.read),done=(y.dt||0)>(x.dt||0)?y:x,pos=(y.t||0)>(x.t||0)?y.pos:x.pos;
      o.nb[id][k]={read:r,done:done.done,dt:done.dt||0,pos:pos,t:Math.max(x.t||0,y.t||0)};
    });
  });
  var dk={};Object.keys(a.days||{}).concat(Object.keys(b.days||{})).forEach(function(k){dk[k]=1});
  Object.keys(dk).forEach(function(k){o.days[k]=Math.max((a.days||{})[k]||0,(b.days||{})[k]||0)});
  return o;
}
var syncState='off';
function scheduleSync(){clearTimeout(syncT);syncT=setTimeout(function(){sync()},4000)}
var dbp=null;
function getRef(){
  if(dbp)return dbp;
  dbp=(async function(){
    if(!window.claude||!claude.use)return null;
    var db=await claude.use('db'),u=await claude.use('user');
    if(!db||!u||!u.id)return null;
    var id=await u.id();if(!id)return null;
    return db.doc('data/users/'+id+'/nbapp');
  })().catch(function(){return null});
  return dbp;
}
var busy=false;
async function sync(){
  if(busy)return;busy=true;
  try{
    var ref=await getRef();if(!ref){syncState='local';return}
    var snap=await ref.get(),rem=null;
    if(snap.exists){var d=snap.data();try{rem=JSON.parse(d.state)}catch(e){}}
    var m=rem?merge(S,rem):S;
    var changed=JSON.stringify(m)!==JSON.stringify(S);
    S=m;
    if(changed){flush();listeners.forEach(function(f){try{f()}catch(e){}})}
    var out=JSON.stringify(S);
    if(!rem||JSON.stringify(rem)!==out)await ref.set({v:1,updated:Date.now(),state:out});
    syncState='synced';
  }catch(e){syncState='local'}
  finally{busy=false}
}
var API={
  get:function(){return S},
  chap:chap,
  save:save,flush:flush,sync:sync,
  onChange:function(f){listeners.push(f)},
  syncState:function(){return syncState},
  setPref:function(k,v){S.prefs[k]=v;S.prefs.pt=Date.now();applyPrefs();save()},
  reset:function(){S=fresh();S.migrated=1;flush();save()},
  today:today,
  pct:function(nb,n,total){var c=(S.nb[nb]||{})[n];if(!c||!total)return 0;var r=0;Object.keys(c.read||{}).forEach(function(k){if(c.read[k])r++});return Math.min(1,r/total)},
  isDone:function(nb,n,total){var c=(S.nb[nb]||{})[n];if(!c)return false;if(c.dt)return !!c.done;return false}
};
window.NBS=API;
function applyPrefs(){
  var p=S.prefs;
