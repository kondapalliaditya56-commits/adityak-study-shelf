endency, Legal Aid and ADR", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test (prompts in Start Here)"}, {"c": "20", "n": "Judicial Review, Activism, Pendency, Legal Aid and ADR", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards"}, {"c": "21", "n": "Subordinate Courts, Tribunals and Consumer Justice", "id": "1-subordinate-judiciary-aijs-gram-nyayalay", "t": "1 · Subordinate Judiciary · AIJS · GRAM Nyayalayas · FAST Track Courts · Mp-mla Courts", "x": "1 · Subordinate Judiciary · AIJS · GRAM Nyayalayas · FAST Track Courts · Mp-mla Courts # Handout only · Saarthi IAS Exam lens Priority: High. Mains PYQs quoted: None quoted in the handout · Judiciary module pp. 41-47. Prelims PYQs quoted: none quoted in the material. In simple words District and Subordinate Courts carry the largest share of pending cases and face vacancies, poor infrastructure, hard working conditions, career stagnation and weak diversity. The All-India Judicial Service (Article 312, 42nd Amendment 1976) would bring a common service from District Judge level up, but it raises federal and language concerns. Gram Nyayalayas (Act 2008) bring justice to rural doorsteps, Fast Track Courts and Fast Track Special Courts speed selected cases, and special courts handle cases against MPs and MLAs. Major Issues IN THE Subordinate Judiciary 1. Judicial pendency and vacancies The District and Subordinate Courts account for the largest share of pending cases in India. Major problems: Shortage of judges against sanctioned strength Delays in recruitment examinations and appointments Unequal judicial workload across districts Inadequate court staff and administrative support Implication: shortages at the district level increase the burden on the entire judicial system. Reform: fill vacancies through regular recruitment and undertake scientific manpower planning based on filing and disposal rates. 2. Inadequate judicial infrastructure Subordinate Courts often suffer from inadequate courtrooms, technology and basic facilities. Empirical Study on Judicial Infrastructure (2024) highlighted several concerns: 37.7% of surveyed judicial officers reported inadequate courtroom space 36.3% reported inadequate furniture and essential facilities 39% of surveyed court premises lacked fire safety equipment Many courts lacked adequate digital equipment and video conferencing facilities Value addition Important: these findings came from a sample-based study , not a nationwide census of every court. (verify figures) 3. Working conditions of judicial officers 1. Inadequate accommodation: shortage of government housing affects judges posted in remote districts. 2. Rural postings: poor connectivity and lack of facilities discourage judicial officers from accepting remote assignments. 3. Staff shortages: inadequate clerical and technical staff increases the administrative burden on judges. 4. Heavy workload: judges handle large numbers of cases alongside administrative responsibilities. 5. Limited training: continuous professional training remains uneven across States. Way forward: improve housing, transport, support staff, digital facilities and judicial training. 4. Career stagnation The judicial service faces concerns over limited promotion opportunities and slow career progression. Judicial officers may spend long periods in the same grade. Limited vacancies restrict promotion to higher judicial positions. District Judges may be elevated to High Courts relatively late, resulting in shorter tenures. Uncertain career progression affects morale and talent retention. Implication: capable lawyers may prefer private practice over joining the judicial service. Way forward: provide transparent promotion criteria, better service conditions and opportunities for earlier elevation. 5. Representation of women and disadvantaged communities Social diversity remains an important issue in the judiciary. Women in judiciary: women constituted approximately 38% of judges in the District Judiciary according to data cited in the India Justice Report 2025 . Representation varies considerably across States. The proportion of women in the higher judiciary has remained substantially lower. SC/ST representation: representation of Scheduled Castes and Scheduled Tribes in subordinate courts varies across States. Recruitment rules and reservation policies are determined under the applicable State judicial service framework. Issues with representation: 1. Unequal recruitment: social and educational disadvantages affect access to judicial careers. 2. Regional variation: representation of women and disadvantaged communities differs among States. 3. Career progression: entry-level representation does not necessarily translate into adequate representation in senior judicial positions. 4. Institutional diversity: courts benefit from judges with different social, regional and professional experiences. Way forward: Ensure fair and transparent recruitment Improve access to judicial training Address barriers faced by women and disadvantaged communities Strengthen career progression in the subordinate judiciary All-india Judicial Service (AIJS) What it is AIJS is a proposal to create a common judicial service for the Union and States, with a more uniform framework for recruitment and service conditions. Constitutional basis: Article 312 Article 312 empowers Parliament to create an All-India Service if the Rajya Sabha passes a resolution supported by not less than two-thirds of members present and voting , declaring that its creation is necessary or expedient in the national interest. The 42nd Constitutional Amendment Act, 1976 expressly included the possibility of an All-India Judicial Service. Important provisions: AIJS can be created through a parliamentary law . It cannot include posts below the rank of District Judge , as defined under Article 236. It is intended to be common to the Union and States. Evolution of the AIJS proposal Law Commission reports: the Law Commission supported the idea of a common judicial service in its reports, including the 14th Report (1958) . 42nd Amendment (1976): provided an express constitutional basis. All India Judges' Association cases: the Supreme Court considered the need for reforms in judicial recruitment and service conditions. Second Administrative Reforms Commission: supported steps to improve the quality and consistency of judicial recruitment. Present position: AIJS has not been established . Differences persist among State Governments and High Courts over its structure and implementation. Arguments in favour of AIJS 1. Uniform standards: it will bring a uniform standard of judicial service across States. 2. Better talent: a national recruitment process may attract capable candidates from different parts of India. 3. Impartial recruitment: selection through an independent recruitment mechanism could reduce allegations of favouritism and politicisation. 4. Judicial vacancies: regular recruitment may help fill vacancies and improve manpower planning. 5. Professional training: a common framework may improve the quality of judicial training. 6. Career progression: greater mobility and structured service conditions may improve career opportunities. 7. Regional disparities: common standards may help reduce differences in recruitment quality across States. Issues related to AIJS Federalism and State autonomy: recruitment to the Subordinate Judiciary is presently governed largely by State rules and High Court supervision . A centrally managed service may reduce the role of State Governments and High Courts. This raises concerns about the federal character of judicial administration. Key debate: whether uniform recruitment can be achieved without weakening the constitutional role of High Courts under Article 235 . Language and local laws: judicial officers deal with State laws, local languages and customary practices. Candidates recruited from other regions may lack sufficient local knowledge. Language barriers can affect communication with litigants, witnesses and lawyers. Example: a judicial officer unfamiliar with the regional language may face difficulties in conducting trials in rural courts. Recruitment and eligibility: 1. Age and experience: differences in eligibility requirements across States complicate a common recruitment framework. 2. Reservation policies: States follow different reservation arrangements in judicial services. 3. Service conditions: pay, promotions and seniority rules differ across States. 4. Recruitment mechanism: the precise role of the UPSC, High Courts and State Governments remains a matter of debate. Limited impact on existing problems: 1. Vacancies may continue: central recruitment alone cannot guarantee timely appointments. 2. Poor infrastructure: AIJS does not automatically provide courtrooms, staff and technology. 3. Career stagnation: a common service may not resolve limited promotion opportunities. 4. Training requirements: recruits will still require training in local laws, procedures and languages. 5. Institutional resistance: lack of consensus among States and High Courts may delay implementation. Way forward on AIJS 1. Build consensus: consult State Governments, High Courts and judicial service associations. 2. Protect High Court control: preserve constitutional safeguards under Article 235. 3. Language training: provide compulsory training in regional languages and State laws. 4. Uniform minimum standards: develop common recruitment and training standards while allowing suitable regional flexibility. 5. Improve service conditions: address pay, promotions, rural postings and career stagnation. 6. Strengthen existing recruitment: AIJS should complement, not replace, reforms in State Judicial Services. Value addition Key principle: AIJS can improve judicial quality only when supported by infrastructure, training, fair recruitment and federal cooperation. GRAM Nyayalayas The Gram Nyayalayas Act, 2008 was enacted to provide affordable and speedy justice at the doorstep of rural citizens. 1. Local justice: Gram Nyayalayas are established at the intermediate Panchayat level or a group of contiguous Panchayats, as provided by law. 2. Nyayadhikari: each Gram Nyayalaya is headed by a judicial officer appointed by the State Government in consultation with the High Court . 3. Civil and criminal jurisdiction: deals with specified civil disputes and criminal offences under the Act and its schedules. 4. Mobile courts: Nyayadhikaris may hold proceedings in villages rather than requiring litigants to travel to distant courts. 5. Summary procedures: simplified procedures support speedy and affordable adjudication. 6. Conciliation: Gram Nyayalayas are encouraged to promote settlement wherever appropriate. Significance: they seek to reduce the cost, delay and distance of litigation for rural citizens. Issues with Gram Nyayalayas 1. Poor implementation: only a limited number of Gram Nyayalayas have become functional compared with the original expectations. 2. Resource constraints: States cite shortages of funds, courtrooms and trained staff. 3. Overlapping jurisdiction: confusion arises because other courts are available with similar jurisdiction. 4. Reluctance of State authorities: States may be unwilling to spare judicial officers and administrative resources. 5. Lack of awareness: rural citizens may remain unaware of the availability and jurisdiction of Gram Nyayalayas. 6. Irregular functioning: some Gram Nyayalayas do not hold proceedings on all working days, reducing their effectiveness. In the news (Saarthi IAS CA; verify dates) Parliamentary Committee recommendation (2026): the Parliamentary Standing Committee on Law and Justice recommended that Gram Nyayalayas should function on all working days , rather than only once or twice a week. It also emphasised the timely creation and filling of Nyayadhikari posts. (verify dates) Way forward Ensure regular functioning of Gram Nyayalayas. Provide adequate infrastructure and trained staff. Clarify jurisdiction in relation to existing courts. Expand mobile court facilities. Improve awareness through Panchayats and Legal Services Authorities. Strengthen financial assistance to States. FAST Track Courts What and why Fast Track Courts were introduced to provide speedy disposal of selected cases , particularly where ordinary litigation involves prolonged delays. The major push for their establishment came from the 11th Finance Commission (2000-05) . Regular Fast Track Courts (FTCs) These courts are established by State Governments in consultation with the concerned High Courts , according to requirements and available resources. They may deal with: heinous crimes Cases involving women, children and senior citizens Cases involving persons with disabilities or terminal illness Property-related disputes pending for more than five years Official data: 880 regular FTCs were functional in 22 States and Union Territories as of 31 December 2025. (verify figures) Fast Track Special Courts (FTSCs) The Union Government launched the Fast Track Special Courts Scheme in October 2019 . It is a Centrally Sponsored Scheme for speedy trial of cases involving rape and offences under the Protection of Children from Sexual Offences (POCSO) Act, 2012 . 1. Specialised courts: dedicated courts for sexual offences. 2. Exclusive POCSO Courts: certain courts exclusively hear offences under the POCSO Act. 3. Financial assistance: the Centre provides financial assistance under the prescribed sharing pattern. 4. Dedicated staff: support is provided for judicial officers and court staff. 5. Victim protection: courts may use child-friendly facilities and vulnerable witness deposition arrangements. Latest official data (as of 30 April 2026): 775 FTSCs were functional These included 398 exclusive POCSO Courts They were operating across 29 States and Union Territories The Union Government had temporarily extended the scheme until 30 September 2026 . (verify figures) Value addition Important: the exclusive POCSO Courts are included within the total of 775 , not additional courts. Issues with Fast Track Courts 1. Funding constraints: regular FTCs depend heavily on State resources, while FTSCs require sustained scheme support. 2. Judicial vacancies: special courts may lack dedicated judicial officers and staff. 3. Inadequate infrastructure: courtrooms, forensic facilities and witness protection arrangements remain insufficient. 4. Inter-State variations: different States refer different categories of cases to Fast Track Courts. 5. Quality of justice: pressure for quick disposal may affect the rights of accused persons and the quality of adjudication. 6. Limited structural impact: Fast Track Courts reduce delays in selected cases but do not address the overall shortage of judges. Value addition Key issue: Fast Track Courts treat an important symptom of judicial pendency, but cannot replace wider judicial reform. Way forward Ensure stable and predictable funding. Appoint dedicated judges and support staff. Improve forensic and witness protection infrastructure. Monitor case disposal without compromising fair-trial rights. Strengthen the regular court system alongside specialised courts. Special Courts FOR MPs AND MLAs Special arrangements have been developed to prioritise criminal cases involving Members of Parliament and State Legislatures. Ashwini Kumar Upadhyay v. Union of India: the Supreme Court issued directions concerning the speedy disposal of criminal cases against MPs and MLAs. 2023 directions: The Court emphasised priority hearings for criminal cases involving legislators Monitoring by High Courts Avoidance of unnecessary adjournments Improving the timely disposal of such cases Constitutional significance 1. Political accountability: delays may allow serious criminal allegations against elected representatives to remain unresolved for years. 2. Electoral integrity: speedy adjudication helps voters assess the legal position of elected representatives. 3. Rule of Law: legislators should not receive preferential treatment in avoiding criminal accountability. 4. Fair trial: speedy proceedings must protect the rights of both the accused and victims. Issues Shortage of courts and judicial personnel. Delays in investigation and prosecution. Witness intimidation and political influence. Transfer of cases between jurisdictions. Risk that excessive pressure for speedy disposal affects procedural fairness. Way forward: ensure priority listing, dedicated judicial capacity and stronger High Court monitoring without compromising due process."}, {"c": "21", "n": "Subordinate Courts, Tribunals and Consumer Justice", "id": "2-tribunals-cat-ngt-key-judgments-consumer", "t": "2 · Tribunals · CAT · NGT · KEY Judgments · Consumer Protection · CCPA · E-jagriti", "x": "2 · Tribunals · CAT · NGT · KEY Judgments · Consumer Protection · CCPA · E-jagriti # Handout only · Saarthi IAS Exam lens Priority: High. Mains PYQs quoted: None quoted in the handout · Judiciary module pp. 47-54. Prelims PYQs quoted: none quoted in the material. In simple words Tribunals are specialised bodies for speedy, expert, cheaper justice; Articles 323A and 323B (42nd Amendment, 1976) support them, though not every tribunal rests on these Articles. Problems are weak independence, executive control, pendency and lack of uniformity. Sampath Kumar, L. Chandra Kumar, R. Gandhi, Madras Bar Association and Rojer Mathew cases built the rule that tribunals supplement, never replace, High Courts. Consumer justice rests on the Consumer Protection Act, 2019, with the CCPA as regulator and e-Jagriti as the digital platform. Tribunal System IN India What tribunals are Tribunals are specialised judicial or quasi-judicial bodies established to adjudicate disputes in specific areas such as service matters, taxation, environment and corporate affairs . Their main objectives are to provide speedy, specialised and inexpensive justice and reduce the burden on regular courts. Constitutional framework The 42nd Constitutional Amendment Act, 1976 inserted Articles 323A and 323B into the Constitution. Article 323A: Administrative Tribunals. Parliament may establish tribunals for disputes concerning recruitment and service conditions of public servants . The Administrative Tribunals Act, 1985 provides for the establishment of the Central Administrative Tribunal and State Administrative Tribunals. Article 323B: Tribunals for other matters. Parliament and State Legislatures may establish tribunals for specified subjects within their legislative competence. These include taxation, industrial disputes, land reforms, elections and other specified matters. Value addition Important: not every tribunal is established under Articles 323A or 323B. Several tribunals derive their authority from separate parliamentary laws . Rationale behind tribunalisation Tribunalisation refers to the shifting of adjudication from regular courts to specialised tribunals . Advantages: 1. Speedy justice: reduces pendency by diverting suitable cases from overburdened courts. 2. Specialised expertise: technical matters can be handled by experts with domain knowledge. 3. Flexible procedures: tribunals are generally not bound by all the procedural requirements applicable to ordinary civil courts. 4. Affordable justice: simpler procedures may reduce litigation expenses. 5. Reduced judicial workload: allows regular courts to focus on other civil, criminal and constitutional matters. 6. Technical adjudication: tribunals such as the NGT and ITAT combine legal knowledge with specialised expertise. Central Administrative Tribunal (CAT) What it is Established in 1985 under the Administrative Tribunals Act, 1985 . It provides an alternative forum for adjudicating disputes relating to the recruitment and service conditions of specified Central Government employees. Deals with appointments, promotions, transfers, disciplinary matters and other service conditions. Includes judicial and administrative members . Follows principles of natural justice and is not strictly bound by the Code of Civil Procedure. Has a Principal Bench in New Delhi and other benches across India. Judicial review: following L. Chandra Kumar (1997) , CAT decisions are subject to judicial review by the concerned High Court. Issues with CAT 1. Growing pendency: service disputes may remain unresolved for long periods. 2. Vacancies: shortage of members reduces the effectiveness of benches. 3. Executive influence: administrative members are often drawn from the executive, raising concerns about independence. 4. Institutional capacity: inadequate staff and infrastructure affect case disposal. 5. Limited digital facilities: uneven digital capacity can slow proceedings. Way forward: ensure timely appointments, independent administration, stronger digital facilities and adequate judicial expertise. National Green Tribunal (NGT) What it is Established under the National Green Tribunal Act, 2010 . It provides specialised adjudication of cases concerning environmental protection, forests and other natural resources , within its statutory jurisdiction. 1. Composition: includes a Chairperson, judicial members and expert members. 2. Specialised jurisdiction: deals with substantial environmental questions arising under specified environmental laws. 3. Regional benches: Principal Bench in New Delhi , with zonal benches at Bhopal, Pune, Kolkata and Chennai . 4. Environmental principles: applies Sustainable Development, Precautionary Principle and Polluter Pays Principle . 5. Compensation: can award compensation, relief and restitution for environmental damage. 6. Appeals: appeals against NGT orders may be made to the Supreme Court under the statutory framework. Contributions of NGT Issued directions concerning air and water pollution. Acted against illegal sand mining and environmental violations. Addressed pollution in major rivers, including the Ganga and Yamuna. Strengthened application of environmental principles in adjudication. Issues with NGT 1. Limited jurisdiction: NGT can directly adjudicate only matters covered by the laws specified in its statutory Schedule. 2. Vacancies: shortage of judicial and expert members delays hearings. 3. Limited regional access: a small number of benches increases travel and litigation costs for distant litigants. 4. Weak enforcement: implementation of NGT orders depends heavily on government agencies and Pollution Control Boards. 5. Technical capacity: environmental damage assessment requires reliable scientific data and specialised expertise. 6. Administrative dependence: funding and service conditions raise concerns about tribunal independence. In the news (Saarthi IAS CA; verify dates) Parliamentary Committee findings (2026): the Parliamentary Standing Committee examining tribunal performance reported that the NGT required 10 judicial members and 10 expert members , but only 5 judicial members and 6 expert members were in position at the time of review. The tribunal lacked a dedicated and adequately structured IT division . Recommendations: fill vacancies, strengthen technical staff, improve digital facilities and ensure better monitoring of long-pending cases. (verify dates) Problems WITH THE Tribunal System IN India Key point Despite their objectives, tribunals have not fully achieved the promise of quick and inexpensive justice. 1. Lack of judicial independence 1. Executive dominance in appointments: government influence over selection committees may weaken the independence of tribunals. 2. Conflict of interest: the government may act as both the appointing authority and a major litigant before the tribunal. 3. Short tenure: limited tenure may affect independence and discourage qualified candidates. 4. Reappointment concerns: members seeking another term may be perceived as dependent on the executive. 5. Post-retirement appointments: tribunals may become positions for retired judges and bureaucrats, raising concerns about transparent selection. 2. Executive control over administration Tribunals often depend on their parent Ministries for funding, staff and administrative support. Financial dependence may affect functional autonomy. Parent Ministries may have an interest in the disputes decided by tribunals. Differences in administrative arrangements create inconsistency across tribunals. Value addition Key issue: an adjudicatory body cannot function effectively if its independence depends excessively on the executive authority whose decisions it may review. 3. Pendency and infrastructure deficits Many tribunals face large case backlogs. Shortage of members and benches causes delays. Inadequate courtrooms, staff and digital infrastructure reduce efficiency. Limited regional benches restrict access to justice. Example: the 2026 Parliamentary Standing Committee reported 27 vacancies against 126 sanctioned member posts in ITAT as of May 2026. (verify figures) 4. Lack of uniformity Different tribunals have different: Appointment procedures Tenure and service conditions Qualifications of members Administrative arrangements Procedural rules Implication: lack of uniformity weakens institutional consistency and makes tribunal administration more complex. 5. Judicial expertise vs technical expertise 1. Excessive bureaucratic representation: administrative members may lack adequate judicial training. 2. Insufficient technical expertise: some tribunals may not have enough qualified specialists in relevant fields. 3. Judicial dominance debate: tribunals exercising significant judicial functions require proper judicial safeguards. 4. Quality of decisions: inadequate expertise may affect legal reasoning and adjudication. Way forward: balance judicial independence with specialised technical knowledge, according to the nature of each tribunal's jurisdiction. Important Supreme Court Judgments ON Tribunals S. P. Sampath Kumar v. Union of India (1987) The Supreme Court examined whether tribunals could replace High Courts in specified areas of adjudication. It accepted the tribunal framework where it provided an effective alternative institutional mechanism, and emphasised the importance of judicial independence and suitable appointment procedures. Significance: initially supported tribunalisation, subject to adequate constitutional safeguards. L. Chandra Kumar v. Union of India (1997) A seven-judge Constitution Bench clarified the constitutional position of tribunals. Judicial review under Articles 32 and 226/227 forms part of the Basic Structure . Tribunals cannot completely replace the constitutional role of High Courts. Tribunal decisions remain subject to review before a Division Bench of the concerned High Court , within the framework laid down by the Court. Significance: tribunals can supplement the judiciary but cannot exclude the constitutional powers of High Courts. Union of India v. R. Gandhi (2010) The Supreme Court examined the constitutional validity of the tribunal framework concerning company law . It recognised Parliament's power to establish specialised tribunals Required adequate safeguards for judicial independence Held that technical members should be appointed where specialised expertise is genuinely required Emphasised appropriate qualifications and judicial participation in selection Significance: tribunalisation cannot dilute the standards required for independent judicial adjudication. Madras Bar Association Case (2014) The Supreme Court struck down the framework for the proposed National Tax Tribunal . Grounds: inadequate judicial safeguards Excessive executive influence in appointments Concerns over the qualifications and independence of tribunal members Transfer of important judicial functions without equivalent institutional protection Significance: independence of tribunals must be protected when they exercise functions traditionally performed by constitutional courts. Rojer Mathew v. South Indian Bank (2019) The Supreme Court examined the framework governing tribunal appointments under the Finance Act, 2017 . It struck down the Tribunal Rules, 2017 because of deficiencies affecting judicial independence Emphasised safeguards in the appointment, tenure and service conditions of tribunal members Raised important concerns over executive influence and the manner of tribunal reforms Significance: Parliament may reorganise tribunals, but their functioning must respect the Basic Structure and separation of powers. Madras Bar Association Cases (2020 and 2021) The Supreme Court continued to examine tribunal appointments and service conditions. Principles: 1. Judicial primacy: selection committees must contain adequate safeguards for judicial independence. 2. Minimum tenure: favoured a five-year term for tribunal chairpersons and members. 3. Age limits: objected to restrictions that unnecessarily excluded qualified younger candidates. 4. Appointments: sought transparent appointment procedures and timely government action. 5. National Tribunals Commission: recommended establishing an independent body to oversee tribunal administration. Madras Bar Association Judgment (19 November 2025) The Supreme Court examined the constitutional validity of provisions of the Tribunals Reforms Act, 2021 . (verify dates) 1. Judicial independence: struck down provisions that failed to protect the independence of tribunals. 2. Short tenure: rejected the reintroduction of constitutionally defective tenure provisions. 3. Executive control: reaffirmed that tribunal appointments must not be dominated by the executive. 4. Legislative override: Parliament cannot simply re-enact provisions already declared unconstitutional without curing their defects. 5. National Tribunals Commission: directed the Union to establish an independent Commission within four months . 6. Constitutional supremacy: reaffirmed that judicial decisions interpreting constitutional limits must be respected by the legislature and executive. Significance: tribunal reforms must satisfy the principles of judicial independence, separation of powers and constitutional supremacy. Case Core holding S. P. Sampath Kumar (1987) Accepted tribunals as an effective alternative, subject to safeguards L. Chandra Kumar (1997) Seven-judge Bench: judicial review is Basic Structure; tribunals cannot replace High Courts; appeal to a Division Bench of the HC Union of India v. R. Gandhi (2010) Company law tribunals valid, with judicial independence safeguards; technical members only where genuinely needed Madras Bar Association (2014) Struck down the National Tax Tribunal framework Rojer Mathew (2019) Struck down Tribunal Rules, 2017 under Finance Act, 2017 Madras Bar Association (2020, 2021) Five-year tenure, judicial primacy in selection, National Tribunals Commission suggested Madras Bar Association (19 Nov 2025) Struck down provisions of Tribunals Reforms Act, 2021; Commission within four months Consumer Protection IN India Meaning Consumer protection seeks to safeguard citizens against unfair trade practices, defective goods, deficient services and misleading advertisements . The Consumer Protection Act, 2019 replaced the Consumer Protection Act, 1986. It came into force on 20 July 2020 and introduced a stronger framework suited to e-commerce and the digital economy. Six consumer rights Meaning Right to Safety Protection against hazardous goods and services Right to Information Information on quality, quantity, purity, standard and price Right to Choose Access to a variety of goods and services at competitive prices Right to be Heard Consumer interests must receive due consideration Right to Seek Redressal Protection against unfair practices and exploitation Right to Consumer Education Awareness of consumer rights and available remedies Consumer Protection Act, 2019: major features 1. Wider definition of consumer: covers both online and offline transactions. 2. Three-tier Consumer Commissions: provides specialised institutions for consumer dispute redressal. 3. Central Consumer Protection Authority: establishes a body for protecting consumer interests collectively. 4. Product liability: allows claims against manufacturers, sellers and service providers under specified conditions. 5. Mediation: provides for amicable settlement of consumer disputes. 6. E-commerce regulation: covers unfair trade practices in online transactions. 7. Digital complaints: provides for electronic filing and virtual hearings. Central Consumer Protection Authority (CCPA) Established under Section 10 of the Consumer Protection Act, 2019. Its objective is to promote, protect and enforce the rights of consumers as a class . 1. Investigation: inquire into violations of consumer rights and unfair trade practices. 2. Recall of goods: order recall of unsafe goods or withdrawal of unsafe services. 3. Misleading advertisements: direct discontinuance or modification of misleading advertisements. 4. Penalties: impose statutory penalties on manufacturers, endorsers and publishers in specified cases. 5. Consumer protection: act against practices affecting consumers collectively. Consumer Commissions CCPA Primarily adjudicate individual consumer disputes and award appropriate remedies Acts as a regulatory and enforcement authority to protect consumers as a class Consumer protection in e-commerce The Consumer Protection (E-commerce) Rules, 2020 regulate specified aspects of online transactions. Requirements: disclosure of information concerning products, sellers and services Availability of appropriate grievance redressal mechanisms Transparency concerning return, refund and related policies Prohibition of specified unfair trade practices Accountability of e-commerce entities under applicable rules Dark patterns Deceptive design practices that manipulate consumers into making decisions they may not otherwise have made . False urgency: misleading claims that an offer is about to expire. Basket sneaking: adding items or charges without informed consent. Subscription traps: making cancellation unnecessarily difficult. Drip pricing: revealing mandatory charges only at later stages. The CCPA Guidelines for Prevention and Regulation of Dark Patterns, 2023 address such deceptive practices. e-Jagriti platform Launched on 1 January 2025 as a unified digital platform for consumer dispute redressal. It integrates earlier systems such as e-Daakhil, CONFONET, OCMS and NCDRC-CMS . 1. Online filing: consumers can file complaints digitally. 2. Virtual hearings: reduces physical visits to Consumer Commissions. 3. Case tracking: provides digital information on case progress. 4. Paperless processing: supports electronic case records and communication. 5. Multilingual access: improves accessibility for different users. 6. AI-assisted features: supports digital communication and administrative processing. Issues in consumer dispute redressal 1. Judicial vacancies: shortage of Presidents and Members affects Consumer Commission functioning. 2. Rising pendency: a high volume of complaints may delay disposal. 3. Weak enforcement: consumers may face difficulty securing compliance with Commission orders. 4. Digital divide: rural and elderly consumers may struggle with digital filing systems. 5. Limited awareness: many consumers remain unaware of their rights and legal remedies. 6. E-commerce complexity: cross-border transactions, digital platforms and complex supply chains make accountability difficult. 7. Misleading advertisements: influencer marketing and digital promotions create new enforcement challenges. 8. Institutional capacity: Consumer Commissions require trained staff, technology and adequate infrastructure. Way forward Fill vacancies in Consumer Commissions. Strengthen enforcement of Commission orders. Expand consumer awareness and legal literacy. Improve the accessibility of e-Jagriti. Strengthen regulation of misleading advertisements and dark patterns. Promote mediation for suitable consumer disputes. Improve coordination between CCPA and Consumer Commissions."}, {"c": "21", "n": "Subordinate Courts, Tribunals and Consumer Justice", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Study on judicial infrastructure (2024): courtroom space and fire safety? 37.7% inadequate courtroom space; 39% premises lacked fire safety equipment; sample-based Women in district judiciary (India Justice Report 2025)? About 38% Article creating All-India Services and the resolution needed? Article 312; Rajya Sabha resolution by two-thirds of members present and voting Amendment that mentioned AIJS? 42nd Amendment, 1976 Lowest post in AIJS? District Judge (Article 236) Article for High Court control over subordinate judiciary? Article 235 Gram Nyayalayas Act year and head? 2008; Nyayadhikari appointed by State Government with High Court Who pushed Fast Track Courts? 11th Finance Commission (2000-05) FTSC scheme launched and for what? October 2019; rape and POCSO cases FTSCs (30 April 2026)? 775 functional, including 398 exclusive POCSO Courts, in 29 States and UTs Case on speedy trial of MPs and MLAs? Ashwini Kumar Upadhyay v. Union of India Articles inserted by the 42nd Amendment for tribunals? 323A (Administrative Tribunals) and 323B (other matters) CAT established under? Administrative Tribunals Act 1985; Principal Bench in New Delhi NGT Act and benches? NGT Act 2010; Delhi principal; zonal at Bhopal, Pune, Kolkata, Chennai q.addEventListener('input',run)})();</script><script>/* Shared store: reading progress, preferences, optional cross-device sync. */
(function(){
var KEY='nbapp:v1',root=document.documentElement;
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function fresh(){return{v:1,prefs:{fs:1,lh:1.65,w:780,font:'serif',theme:'auto',pt:0},last:null,nb:{},days:{}}}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var S;
try{S=JSON.parse(lsGet(KEY))}catch(e){S=null}
if(!S||!S.v)S=fresh();
S.prefs=Object.assign(fresh().prefs,S.prefs||{});
// one-time import of the older done list and theme
if(!S.migrated){
  try{var od=JSON.parse(lsGet('nb-done')||'[]');od.forEach(function(n){var c=chap('modern-india',n);c.done=1;c.dt=1})}catch(e){}
  var ot=lsGet('nb-theme');if(ot&&!S.prefs.pt){S.prefs.theme=ot;S.prefs.pt=1}
  S.migrated=1;
}
function chap(nb,n){var b=S.nb[nb]||(S.nb[nb]={});return b[n]||(b[n]={read:{},done:0,dt:0,pos:null,t:0})}
var listeners=[],dirty=false,saveT=null,syncT=null;
function save(){
  dirty=true;clearTimeout(saveT);
  saveT=setTimeout(function(){lsSet(KEY,JSON.stringify(S));listeners.forEach(function(f){try{f()}catch(e){}});scheduleSync()},250);
}
function flush(){lsSet(KEY,JSON.stringify(S))}
function merge(a,b){ // a local, b remote; returns merged
  var o=fresh();
  o.prefs=((b.prefs&&b.prefs.pt||0)>(a.prefs&&a.prefs.pt||0))?Object.assign({},a.prefs,b.prefs):Object.assign({},b.prefs,a.prefs);
  o.last=(!a.last||(b.last&&b.last.ts>a.last.ts))?b.last:a.last;
  o.migrated=1;
  var ids={};Object.keys(a.nb||{}).concat(Object.keys(b.nb||{})).forEach(function(k){ids[k]=1});
  Object.keys(ids).forEach(function(id){
    o.nb[id]={};var ca=(a.nb||{})[id]||{},cb=(b.nb||{})[id]||{},ks={};
    Object.keys(ca).concat(Object.keys(cb)).forEach(function(k){ks[k]=1});
    Object.keys(ks).forEach(function(k){
      var x=ca[k],y=cb[k];if(!x||!y){o.nb[id][k]=x||y;return}
      var r=Object.assign({},x.read,y.read),done=(y.dt||0)>(x.dt||0)?y:x,pos=(y.t||0)>(x.t||0)?y.pos:x.pos;
      o.nb[id][k]={read:r,done:done.done,dt:done.dt||0,pos:pos,t:Math.max(x.t||0,y.t||0)};
    });
  });
  var dk={};Object.keys(a.days||{}).concat(Object.keys(b.days||{})).forEach(function(k){dk[k]=1});
  Object.keys(dk).forEach(function(k){o.days[k]=Math.max((a.days||{})[k]||0,(b.days||{})[k]||0)});
  return o;
}
var syncState='off';
function scheduleSync(){clearTimeout(syncT);syncT=setTimeout(function(){sync()},4000)}
var dbp=null;
function getRef(){
  if(dbp)return dbp;
  dbp=(async function(){
    if(!window.claude||!claude.use)return null;
    var db=await claude.use('db'),u=await claude.use('user');
    if(!db||!u||!u.id)return null;
    var id=await u.id();if(!id)return null;
    return db.doc('data/users/'+id+'/nbapp');
  })().catch(function(){return null});
  return dbp;
}
var busy=false;
async function sync(){
  if(busy)return;busy=true;
  try{
    var ref=await getRef();if(!ref){syncState='local';return}
    var snap=await ref.get(),rem=null;
    if(snap.exists){var d=snap.data();try{rem=JSON.parse(d.state)}catch(e){}}
    var m=rem?merge(S,rem):S;
    var changed=JSON.stringify(m)!==JSON.stringify(S);
    S=m;
    if(changed){flush();listeners.forEach(function(f){try{f()}catch(e){}})}
    var out=JSON.stringify(S);
    if(!rem||JSON.stringify(rem)!==out)await ref.set({v:1,updated:Date.now(),state:out});
    syncState='synced';
  }catch(e){syncState='local'}
  finally{busy=false}
}
var API={
  get:function(){return S},
  chap:chap,
  save:save,flush:flush,sync:sync,
  onChange:function(f){listeners.push(f)},
  syncState:function(){return syncState},
  setPref:function(k,v){S.prefs[k]=v;S.prefs.pt=Date.now();applyPrefs();save()},
  reset:function(){S=fresh();S.migrated=1;flush();save()},
  today:today,
  pct:function(nb,n,total){var c=(S.nb[nb]||{})[n];if(!c||!total)return 0;var r=0;Object.keys(c.read||{}).forEach(function(k){if(c.read[k])r++});return Math.min(1,r/total)},
  isDone:function(nb,n,total){var c=(S.nb[nb]||{})[n];if(!c)return false;if(c.dt)return !!c.done;return false}
};
window.NBS=API;
function applyPrefs(){
  var p=S.prefs;
  var th=p.theme;
  if(th==='auto')root.removeAttribute('data-theme');else root.setAttribute('data-theme',th);
  root.style.setProperty('--zoom',p.fs);root.style.setProperty('--lh',p.lh);root.style.setProperty('--pw',p.w+'px');
  root.setAttribute('data-font',p.font);
}
API.applyPrefs=applyPrefs;applyPrefs();
// studied time, counted while the page is visible and touched in the last minute
var lastAct=Date.now();
['scroll','pointerdown','keydown','touchstart'].forEach(function(e){addEventListener(e,function(){lastAct=Date.now()},{passive:true})});
setInterval(function(){
  if(document.hidden||Date.now()-lastAct>60000||!window.__NB)return;
  var t=today();S.days[t]=(S.days[t]||0)+15;save();
},15000);
document.addEventListener('visibilitychange',function(){if(document.hidden){flush();sync()}else{sync()}});
addEventListener('pagehide',flush);
setTimeout(sync,800);
})();
