family. How do those help us in understanding family in the present times? Intro: name Family and Kinship and state the central idea in one line (see The story first). Body: build the answer from the notes under: Functional Theory of Family; Critique of Functional Theory of Family. Close: finish with the matching criticisms section and a one-line judgement. Previous Religion and Society Next Social Change in Modern Society Personal study notes built from: Sarrthi IAS · Sociology Optional Foundation 2027 · Family and Kinship (class notes). Only the handout facts are used; memory aids are labelled own. Copyright belongs to the teacher or institute; keep this private."}, {"c": "16", "n": "Social Change in Modern SocietyHigh priority", "id": "chapter-map", "t": "Chapter map", "x": "Chapter map # Map Outline Social change Theories Functional Conflict Evolutionary Cyclical Cultural Sorokin Ogburn Weber Agents Demography Education Technology State Movements Development and dependency Frank Wallerstein Prebisch Amin Science and technology Automation Reform COVID-19 Media Pluralist Frankfurt School Digital Education Mobility Marxist critique Boudon"}, {"c": "16", "n": "Social Change in Modern SocietyHigh priority", "id": "lens", "t": "Exam lens", "x": "Exam lens # Exam lens Priority: High. Mains PYQs quoted: 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025. Prelims: not asked (Mains optional). Mains hooks 35 Mains PYQs quoted in the handout, 2013-2025. Clusters: theories of social change and conflict (6), dependency, Frank and Wallerstein (6), science, technology and media (13), education and mobility (6), development and sustainable development (2). Repeat questions on A.G. Frank, cultural lag, science and technology as agents, and education as mobility versus reproduction. Pair every theory with a limitation, link technology and education to inequality, and bring Indian examples (reservation, digital divide, Super 30)."}, {"c": "16", "n": "Social Change in Modern SocietyHigh priority", "id": "story", "t": "The story first", "x": "The story first # The story first Functionalists see change as gradual adaptation, Marxists as conflict, evolutionists as progress and cyclical theorists as recurrence; cultural theorists look to ideas. Agents of change include population, education, technology, religion, state, movements and economy. Development brings change but also dependency, and science, media and education reshape society, sometimes reproducing inequality. 1. What is social change? Transformation in the structure, functions, values, norms and relationships of society over time, driven by economic, political, cultural, technological and demographic forces. *→ How do theories explain it?* 2. Functional, conflict, evolutionary and cyclical theories. Durkheim (mechanical to organic solidarity) and Parsons (differentiation). Spencer's simple-to-complex Social Darwinism, Comte's three stages and Tonnies' Gemeinschaft to Gesellschaft; critics call them linear, Eurocentric and deterministic. Sorokin's ideational, idealistic and sensate cycle. *→ What about ideas and culture?* 3. Cultural theories and agents. Sorokin's mentalities, Ogburn's cultural lag and Weber's Protestant ethic. Agents: demographic factors, education, science and technology, religion, state, social movements and economy. *→ What of development?* 4. Development and dependency. Development transforms society but can bring inequality and dependency. Frank (metropolis-satellite, development of underdevelopment), Prebisch, Amin, and Wallerstein's core, semi-periphery and periphery; critics note South Korea, Taiwan and India's gains. *→ How do science and media change society?* 5. Science, technology, media. Automation, social reform against superstition, optimist, pessimist and neutralist views, COVID-19, Ogburn's lag, mass and digital media (Adorno-Horkheimer culture industry, Arab Spring) and inclusive development. *→ And education?* 6. Education. Locke's tabula rasa and education as mobility channel for Dalits, OBCs, women and tribals; Marxist critics (Althusser, Bowles and Gintis, Boudon) say it reproduces inequality under meritocracy. Cast: Herbert Spencer = Social Darwinism · Auguste Comte = law of three stages · Pitirim Sorokin = cultural cycles · W.F. Ogburn = cultural lag · A.G. Frank = development of underdevelopment · Immanuel Wallerstein = world systems theory"}, {"c": "16", "n": "Social Change in Modern SocietyHigh priority", "id": "terms", "t": "In simple words", "x": "In simple words # Functionalists : gradual adaptation ; Marxists : conflict ; evolutionists : linear progress ; Sorokin : cycles . Ogburn : material culture changes faster than non-material culture ( cultural lag ). Frank : development of underdevelopment ; Wallerstein : core, semi-periphery, periphery . Technology and education both change society and can reproduce inequality . Term In plain words Social change Transformation of society's structure, functions, values and norms over time. Social Darwinism Spencer's survival-of-the-fittest view of social evolution. Cultural lag Ogburn: non-material culture lags behind material culture. Dependency Poor countries' reliance on rich ones for capital, technology and markets. Metropolis-satellite Frank: surplus flows from periphery to capitalist centres. World systems theory Wallerstein: global capitalism divided into core, semi-periphery and periphery. Techno-optimist Sees technology as inherently positive. Techno-neutralist Sees technology as value-neutral. Culture industry Adorno and Horkheimer: commodified culture that discourages critical thought. Meritocracy Rewards by merit, which Marxists say hides inequality."}, {"c": "16", "n": "Social Change in Modern SocietyHigh priority", "id": "1-social-change", "t": "1 · Social Change", "x": "1 · Social Change # Handout only Social change refers to transformation in the structure, functions, values, norms, and relationships within society over time. It reflects the continuous process through which societies evolve in response to economic, political, cultural, technological, and demographic forces. Sociologists have attempted to explain the nature, causes, direction, and consequences of social change through different theoretical perspectives."}, {"c": "16", "n": "Social Change in Modern SocietyHigh priority", "id": "2-sociological-theories-of-social-change", "t": "2 · Sociological Theories of Social Change", "x": "2 · Sociological Theories of Social Change # Handout only Various sociological theories attempt to explain how and why societies change over time. Functionalists view change as gradual adaptation maintaining social order, Marxists emphasize conflict and contradictions, evolutionary theorists focus on progressive development, while cyclical theorists highlight recurring patterns of rise and decline."}, {"c": "16", "n": "Social Change in Modern SocietyHigh priority", "id": "3-functional-and-conflict-theories-of-soci", "t": "3 · Functional and Conflict Theories of Social Change", "x": "3 · Functional and Conflict Theories of Social Change # Handout only Functionalist theories view society as an interrelated system whose various institutions work together to maintain stability and equilibrium. Social change occurs gradually as institutions adapt to changing social conditions. Emile Durkheim explained social change through the transition from mechanical solidarity in traditional societies to organic solidarity in modern industrial societies characterized by division of labour and interdependence. Talcott Parsons viewed social change as an adaptive and evolutionary process involving greater differentiation and specialization of institutions. Functionalists therefore emphasize consensus, integration, and orderly transformation. Conflict theories, particularly Marxism, view social change as the outcome of contradictions, inequality, and struggle between competing groups. Karl Marx argued that changes in the mode of production generate conflicts between classes, leading to structural transformation of society. According to Marx, history progresses through stages such as slavery, feudalism, capitalism, and socialism, each shaped by class conflict. Unlike functionalists, conflict theorists see conflict as the driving force of social change. Critics argue that functionalism overemphasizes stability and neglects inequality, while Marxism gives excessive importance to economic factors and class conflict."}, {"c": "16", "n": "Social Change in Modern SocietyHigh priority", "id": "4-evolutionary-and-cyclical-theories-of-so", "t": "4 · Evolutionary and Cyclical Theories of Social Change", "x": "4 · Evolutionary and Cyclical Theories of Social Change # Handout only Evolutionary and cyclical theories are among the earliest attempts to explain the pattern and direction of social change. While evolutionary theories view societies as progressing gradually from simple to complex stages in a linear manner, cyclical theories argue that societies and civilizations rise, decline, and regenerate in recurring historical cycles. Together, these theories seek to identify broad patterns underlying long-term social transformation."}, {"c": "16", "n": "Social Change in Modern SocietyHigh priority", "id": "5-evolutionary-theories", "t": "5 · Evolutionary Theories", "x": "5 · Evolutionary Theories # Handout only Picture hook March of progress silhouettes. Hook for linear social evolution. (handout p.3) Evolutionary theories explain social change as a gradual movement from simple to complex forms of society. Herbert Spencer argued that societies evolve from simple and homogeneous structures to complex and heterogeneous ones through differentiation and integration. Spencer is regarded as the chief proponent of Social Darwinism. He identified stages of societal evolution, from simple to compound , doubly compounded , and trebly compounded societies, each representing a higher level of structural complexity. Auguste Comte proposed the Law of Three Stages: Theological stage Metaphysical stage Positive stage Ferdinand Tonnies explained social change through the transition from Gemeinschaft (community-based traditional society) to Gesellschaft (modern contractual society). Memory aid (own) · Comte's law of three stages T M P Tell Me Please. T = Theological stage; M = Metaphysical stage; P = Positive stage. Stages run in time order, so the order is kept. (order kept)"}, {"c": "16", "n": "Social Change in Modern SocietyHigh priority", "id": "6-criticism-of-evolutionary-theories", "t": "6 · Criticism of Evolutionary Theories", "x": "6 · Criticism of Evolutionary Theories # Handout only Linear View: These theories assume that all societies move in the same direction. Eurocentric Bias: They are largely based on the historical experience of Europe. Deterministic Nature: They treat progress as inevitable. Final-Stage Fallacy: Evolutionary theorists often posit an ultimate or final stage of social development (e.g., Comte’s positive stage). However, social change is a continuous and open-ended process without a fixed endpoint. Thus, many scholars today do not accept social evolution as universal or unilinear."}, {"c": "16", "n": "Social Change in Modern SocietyHigh priority", "id": "7-cyclical-theory", "t": "7 · Cyclical Theory", "x": "7 · Cyclical Theory # Handout only Picture hook Sorokin's pendulum: sensate, idealistic, ideational (handout diagram). (handout p.4) Cyclical theories reject the idea of continuous progress and argue that societies pass through recurring cycles of rise, decline, and regeneration. Pitirim Sorokin, in Social and Cultural Dynamics, argued that societies oscillate between three cultural orientations: Ideational culture Idealistic culture Sensate culture According to Sorokin, excessive materialism in sensate culture eventually creates crisis and leads societies back towards spiritual orientations. Thus, social change is viewed as repetitive and cyclical rather than linear."}, {"c": "16", "n": "Social Change in Modern SocietyHigh priority", "id": "8-cultural-theories-of-social-change", "t": "8 · Cultural Theories of Social Change", "x": "8 · Cultural Theories of Social Change # Handout only Cultural theories of social change emphasize the role of ideas, values, beliefs, norms, religion, and cultural practices in shaping the direction and nature of social transformation. Unlike purely economic or technological explanations, these theories argue that changes in cultural systems and worldviews often become the driving force behind institutional and structural change in society. Pitirim Sorokin explained social change through shifts in dominant cultural mentalities, arguing that societies oscillate between ideational, sensate, and idealistic cultures. William F. Ogburn highlighted how rapid changes in material culture create a cultural lag because non-material culture such as values and laws adapt more slowly. Max Weber demonstrated how religious ideas, particularly the Protestant ethic, contributed to the rise of capitalism and modernity. In the Indian context, M. N. Srinivas explained social change through concepts such as Sanskritization, where lower castes adopt upper-caste practices and culture to improve their social status. Together, these approaches underline the importance of culture as an independent and dynamic force in social change. Critics argue that cultural theories of social change often overemphasize the role of ideas, values, and religion; while neglecting material conditions, economic structures, technology, and power relations. Marxist scholars particularly criticize cultural theories for ignoring class conflict and the role of economic forces in shaping society. Some cultural theories, such as that of Pitirim Sorokin, have also been criticized for being overly speculative and lacking empirical verification. Further, cultural explanations sometimes fail to explain why similar cultural values may produce different outcomes in different societies."}, {"c": "16", "n": "Social Change in Modern SocietyHigh priority", "id": "9-major-agents-of-social-change", "t": "9 · Major Agents of Social Change", "x": "9 · Major Agents of Social Change # Handout only Social change occurs due to the interaction of multiple structural, cultural, technological, and political forces. Demographic Factors Changes in population size, structure, and composition influence patterns of social organization. Emile Durkheim linked demographic expansion to the transition from mechanical solidarity to organic solidarity, where social cohesion shifts from similarity to interdependence. Education Education promotes rationality, mobility, awareness, and modernization. Emile Durkheim viewed education as a means of transmitting societal norms and values. Education also facilitates social mobility and democratization. Science and Technology Science and technology are among the most powerful agents of social change. Industrialization, mechanization, communication technologies, and digitalization have transformed economic structures, lifestyles, family relations, and political processes. Religion Religion can both resist and promote social change. Max Weber, in The Protestant Ethic and the Spirit of Capitalism, showed how religious ethics influenced the rise of capitalism. Religious reform movements and revivalist movements have also contributed significantly to social transformation.\\ State Governments and laws institutionalize social change through reforms and welfare policies. Measures such as abolition of untouchability, land reforms, reservation policies, and gender laws have transformed Indian society. Social Movements Social movements challenge existing inequalities and demand structural reforms. Movements such as Dalit movements, women’s movements, environmental movements, and farmers’ movements have contributed significantly to democratization and social justice. Economy Economic transformation significantly reshapes social structures and institutions. Industrialization, capitalism, globalization, and market expansion alter occupational patterns, class relations, lifestyles, and family structures. In essence, social change is multidimensional and results from the interaction of economic, political, cultural, technological, and ideological factors. Memory aid (own) · Seven agents of social change (handout order) D E S R S M E Dogs Eat Soft Red Steak, Making Enemies. D = Demographic factors; E = Education; S = Science and technology; R = Religion; S = State; M = Social movements; E = Economy. The handout lists the seven agents in this order, so the order is kept. (order kept)"}, {"c": "16", "n": "Social Change in Modern SocietyHigh priority", "id": "10-development-and-dependency", "t": "10 · Development and Dependency", "x": "10 · Development and Dependency # Handout only Development refers to a process of economic growth, modernization, technological advancement, and improvement in the quality of life. However, sociologists argue that development is not merely economic growth; it also transforms social structures, institutions, values, and power relations. While development may generate opportunities, it can also produce inequality, displacement, dependency, and social conflict."}, {"c": "16", "n": "Social Change in Modern SocietyHigh priority", "id": "11-development-and-social-change", "t": "11 · Development and Social Change", "x": "11 · Development and Social Change # Handout only Development acts as a major source of social change. Industrialization, urbanization, expansion of education, communication technologies, and globalization have transformed family structures, occupations, lifestyles, caste relations, and political participation in many societies. In India, development has contributed to: Expansion of middle classes Increased literacy and mobility Women’s participation in public life Growth of democratic awareness Decline of some traditional barriers At the same time, development has also generated: Regional inequalities Displacement due to dams and industries Ecological degradation Agrarian distress Informalization of labour Thus, societies undergoing rapid development often experience tensions, conflicts, and uneven transformation."}, {"c": "16", "n": "Social Change in Modern SocietyHigh priority", "id": "12-dependency-theory", "t": "12 · Dependency Theory", "x": "12 · Dependency Theory # Handout only Dependency theory emerged in Latin America during the 1960s as a critique of modernization theory. Thinkers such as Andre Gunder Frank, Raul Prebisch, and Samir Amin argued that underdevelopment in poorer countries is not due to internal backwardness alone, but because of their unequal integration into the global capitalist system. Dependency theorists argue that the world economy is divided into dominant developed nations and dependent underdeveloped nations. Poorer countries remain dependent on richer countries for: Capital Technology Markets Investment Industrial goods According to dependency theorists, colonialism integrated Asia, Africa, and Latin America into the capitalist world economy in subordinate positions. Even after political independence, dependency continues through neo-colonial mechanisms such as multinational corporations, unequal trade relations, foreign debt, and international financial institutions. Thus, dependency theorists reject the modernization view that all countries can develop by simply following the Western path."}, {"c": "16", "n": "Social Change in Modern SocietyHigh priority", "id": "13-features-of-dependency", "t": "13 · Features of Dependency", "x": "13 · Features of Dependency # Handout only 1. Unequal exchange between developed and developing nations 2. Dependence on foreign capital and technology 3. Historical roots in colonialism 4. Continued neo-colonial economic domination 5. Role of local elites in sustaining dependency 6. Extraction of surplus from poorer regions"}, {"c": "16", "n": "Social Change in Modern SocietyHigh priority", "id": "14-technology-globalization-and-dependency", "t": "14 · Technology, Globalization and Dependency", "x": "14 · Technology, Globalization and Dependency # Handout only Technology and globalization have accelerated both development and dependency. Technological progress has improved productivity, communication, healthcare, and education. Globalization has expanded trade, investment, and employment opportunities. However, developing countries often remain dependent upon advanced nations for: Technology Digital infrastructure Patents and innovation High-end manufacturing Financial capital This creates technological dependency and unequal globalization. At the same time, globalization has intensified labour insecurity, ecological degradation, and vulnerability to global economic crises."}, {"c": "16", "n": "Social Change in Modern SocietyHigh priority", "id": "15-a-g-frank-and-development-of-underdevelo", "t": "15 · A.G. Frank and “Development of Underdevelopment”", "x": "15 · A.G. Frank and “Development of Underdevelopment” # Handout only Andre Gunder Frank argued that underdevelopment is not an original condition but a product of capitalist development itself. According to Frank, the world economy operates through a “metropolis-satellite structure” in which surplus is continuously transferred from the peripheral satellite regions to metropolitan capitalist centres. Frank termed this process the “development of underdevelopment.” Development in the capitalist core and underdevelopment in the periphery are therefore interconnected processes. Colonialism and capitalist penetration destroyed self-sufficient local economies and transformed them into dependent suppliers of raw materials and cheap labour. Frank argued that genuine development requires reducing dependency and pursuing autonomous, self-reliant economic growth."}, {"c": "16", "n": "Social Change in Modern SocietyHigh priority", "id": "16-world-systems-theory", "t": "16 · World Systems Theory", "x": "16 · World Systems Theory # Handout only Picture hook Core, semi-periphery and periphery flows (handout diagram). (handout p.7) Immanuel Wallerstein expanded dependency analysis through World Systems Theory. He argued that capitalism should be understood as a global historical system divided into: 1. Core nations 2. Semi-periphery nations 3. Periphery nations Core countries possess advanced industries, technological dominance, and financial power. Peripheral countries largely supply raw materials and labour-intensive goods. Semi-peripheral countries occupy an intermediate position and display both exploitative and dependent characteristics. Unlike classical dependency theory, Wallerstein emphasized the stabilizing role of semi-peripheral countries such as India, Brazil, and South Africa within the capitalist world system. Memory aid (own) · Wallerstein's world system C S P Cats Sleep Peacefully. C = Core nations; S = Semi-periphery nations; P = Periphery nations. The handout lists them from core outward, so the order is kept. (order kept)"}, {"c": "16", "n": "Social Change in Modern SocietyHigh priority", "id": "17-criticism-of-dependency-theory", "t": "17 · Criticism of Dependency Theory", "x": "17 · Criticism of Dependency Theory # Handout only 1. It overemphasizes external causes while neglecting internal issues such as corruption, governance failure, and social inequality. 2. It cannot adequately explain the rapid development of countries such as South Korea and Taiwan. 3. Excessive protectionism and isolation that dependency theorists advocate may hinder economic competitiveness. 4. Globalization has also created opportunities for growth and technological advancement in several developing countries. India has also reaped the benefits of global integration with consistently higher rate of economic growth since 1990s and substantial reduction in poverty levels. 5. Dependency theory is outdated in the post-Soviet world."}, {"c": "16", "n": "Social Change in Modern SocietyHigh priority", "id": "18-contemporary-relevance", "t": "18 · Contemporary Relevance", "x": "18 · Contemporary Relevance # Handout only Despite above criticisms, dependency theory remains relevant in understanding: Global economic inequalities, debt dependency, and technological monopolies. Unequal globalization and continued dominance of western multinational corporations. Barbara Stallings contends that countries like China are trying to create a dependency relationship with Latin America by providing technology and aid. Many developing countries continue to remain dependent on advanced capitalist economies for finance, technology, and global market access. In essence, development and dependency are deeply interconnected processes. While modernization and globalization create opportunities for growth and transformation, they may also reproduce inequalities and structural dependence within the global capitalist system."}, {"c": "16", "n": "Social Change in Modern SocietyHigh priority", "id": "19-science-and-technology-as-agents-of-soci", "t": "19 · Science and Technology as Agents of Social Change", "x": "19 · Science and Technology as Agents of Social Change # Handout only Science and technology have emerged as among the most powerful agents of social change in modern society. Scientific discoveries and technological innovations have transformed economic structures, political institutions, education, family life, communication, and cultural practices. The pace and direction of social change in contemporary society are increasingly shaped by technological advancement. The Industrial Revolution marked the beginning of large-scale technological transformation by replacing human and animal labour with machines and giving rise to industrial society. In the contemporary period, digital technologies have further transformed production, communication, governance, and everyday life. Technological development has increased efficiency, rationalization, and specialization. E-governance has improved transparency and delivery of public services. Digital technologies have transformed banking, commerce, healthcare, and education. Science and technology have also transformed education through online learning platforms, digital classrooms, and wider access to information. The internet and communication technologies have democratized knowledge and reduced barriers of time and space. Family life and social relationships have also changed due to technological advancement. Contraceptive technologies, IVF, social media, and digital communication have altered marriage patterns, reproductive choices, and interpersonal relations. Household technologies have reduced domestic drudgery and increased women’s participation in public life. At the same time, science and technology have contributed to rationalization and secularization by weakening superstitions and fatalistic beliefs. Scientific education encourages empirical reasoning and critical thinking. Max Weber described this process as the “disenchantment of the world.”"}, {"c": "16", "n": "Social Change in Modern SocietyHigh priority", "id": "20-automation-and-changing-nature-of-work", "t": "20 · Automation and Changing Nature of Work", "x": "20 · Automation and Changing Nature of Work # Handout only Picture hook Robot and worker. Hook for automation. (handout p.8) Technological advancement and automation have significantly transformed the nature of work and employment. Positive changes include: 1. Increased productivity and efficiency 2. Growth of digital economy and new occupations 3. Remote work and flexible employment 4. Expansion of service-sector jobs However, automation has also generated several concerns: 1. Job displacement due to mechanization and AI 2. Informalization and contractualization of labour 3. Gig economy and platform-based precarious work 4. Deskilling and alienation of workers Karl Marx highlighted the alienating effects of mechanization, where workers lose control over the labour process. Thus, technology simultaneously creates opportunities and insecurities."}, {"c": "16", "n": "Social Change in Modern SocietyHigh priority", "id": "21-science-technology-and-social-reform", "t": "21 · Science, Technology and Social Reform", "x": "21 · Science, Technology and Social Reform # Handout only Science and technology have challenged age-old taboos, myths, and superstitions by promoting rationality and empirical thinking. Scientific advancements in medicine, reproductive health, and public hygiene have weakened fatalistic attitudes associated with disease, fertility, and death. Technologies such as DNA testing, organ transplantation, and assisted reproductive techniques have transformed traditional notions of purity, destiny, and divine will. Scientific education and digital dissemination of knowledge encourage questioning attitudes and critical inquiry. Auguste Comte viewed the rise of scientific reasoning as the transition towards the positive stage of society."}, {"c": "16", "n": "Social Change in Modern SocietyHigh priority", "id": "22-technological-impact", "t": "22 · Technological Impact", "x": "22 · Technological Impact # Handout only Different schools of thought have interpreted the impact of technology in contrasting ways. Techno-optimists like Marc Andreessen argue that technological advancement is inherently positive, improving comfort, efficiency, and communication, and making life easier and more productive. Techno-pessimists , however, stress its darker side - alienation, surveillance, environmental degradation, cybercrime, and the potential for destruction through weapons and ecological harm. In contrast, Techno-neutralists maintain that technology itself is value-neutral; it can be used for both constructive and destructive purposes depending on human intent and application."}, {"c": "16", "n": "Social Change in Modern SocietyHigh priority", "id": "23-covid-19-and-technological-transformatio", "t": "23 · COVID-19 and Technological Transformation", "x": "23 · COVID-19 and Technological Transformation # Handout only The COVID-19 pandemic demonstrated the transformative role of science and technology in contemporary society. Scientific innovation in vaccine development, epidemiology, and digital health surveillance shaped state and societal responses to the crisis. Technology enabled work-from-home arrangements, online education, telemedicine, digital payments, and e-commerce. Governance also became increasingly technology-driven through digital monitoring and online welfare delivery. At the same time, the pandemic exposed digital inequalities, misinformation, surveillance concerns, and the digital divide between connected and excluded populations."}, {"c": "16", "n": "Social Change in Modern SocietyHigh priority", "id": "24-cultural-lag", "t": "24 · Cultural Lag", "x": "24 · Cultural Lag # Handout only William F. Ogburn concept of cultural lag explains the uneven pace of social change. According to Ogburn, material culture such as technology changes more rapidly than non-material culture such as values, beliefs, norms, and laws. This gap between technological innovation and social adaptation creates tensions and social problems. Examples include: 1. Slow social acceptance of IVF and reproductive technologies 2. Ethical dilemmas relating to artificial intelligence 3. Cybercrime and inadequate cyber laws 4. Vaccine hesitancy despite medical advancement The concept of cultural lag remains highly relevant in understanding contemporary technological change."}, {"c": "16", "n": "Social Change in Modern SocietyHigh priority", "id": "25-media-as-agent-of-social-change", "t": "25 · Media as Agent of Social Change", "x": "25 · Media as Agent of Social Change # Handout only Mass media has become a major modern agent of social change by shaping public opinion, disseminating knowledge, and highlighting issues. From a pluralist perspective , media strengthens democracy by promoting awareness, participation, and accountability. Social media platforms have democratized communication and enabled marginalized groups to voice their concerns. However, Marxist scholars argue that media often serves dominant class interests. Frankfurt School thinkers such as Theodor Adorno and Max Horkheimer criticized the “ culture industry ” for commodifying culture and discouraging critical thinking."}, {"c": "16", "n": "Social Change in Modern SocietyHigh priority", "id": "26-digital-media-and-social-change", "t": "26 · Digital Media and Social Change", "x": "26 · Digital Media and Social Change # Handout only Picture hook Social media users. Hook for digital media. (handout p.10) More recently, the rise of digital media has deep socio-political implications. It serves as a platform for activism, advocacy, and social movements. Being decentralized and largely unregulated, it allows voices that were previously marginalized to be heard. The Arab Spring in the early 2010s demonstrated the power of social media in mobilizing people against authoritarian regimes. Similarly, the anti-establishment protests in Nepal and various grassroots movements in India owe much of their strength to digital mobilization. Nouraie-Simone points out that digital media has given rise to cyberfeminism, creating safe and empowering online spaces for women to express themselves. The #MeToo movement is a striking example of how digital media became a platform for women to speak out against sexual harassment, challenge patriarchal norms, and demand accountability. Criticisms of Digital Media 1. Digital divide and unequal access 2. Surveillance capitalism and Algorithmic manipulation 3. Online harassment and trolling 4. Spread of misinformation, fake news, and low-quality content (Andrew Keen in The Cult of the Amateur) 5. Digital narcissism and inauthenticity (Andrew Keen in Digital Vertigo) 6. Social isolation and digital addiction (Cal Newport in Digital Minimalism) Thus, digital media can democratize communication and be liberating, but it also can reproduce inequalities and create new social problems."}, {"c": "16", "n": "Social Change in Modern SocietyHigh priority", "id": "27-science-technology-and-inclusive-develop", "t": "27 · Science, Technology and Inclusive Development", "x": "27 · Science, Technology and Inclusive Development # Handout only Sociologists argue that democratization of science and technology is necessary for inclusive development. Technological advancement should not remain confined to privileged sections of society. Inclusive technological development requires: 1. Affordable digital access 2. Rural connectivity 3. Public investment in healthcare and education technology 4. Technological accessibility for marginalized groups 5. Reduction of digital divide Science and technology therefore need to be guided by ethical considerations and social justice. In essence, science and technology are dynamic and double-edged agents of social change. They have made societies more interconnected, rational, and productive, but have also created new inequalities, insecurities, and ethical dilemmas. The sociological challenge lies in ensuring that technological progress remains socially inclusive and oriented towards human welfare."}, {"c": "16", "n": "Social Change in Modern SocietyHigh priority", "id": "28-education-and-social-change", "t": "28 · Education and Social Change", "x": "28 · Education and Social Change # Handout only Picture hook Schoolgirls with books. Hook for education as a transformative force. (handout p.11) Education occupies a central place in modern societies as a major institution responsible for transmitting knowledge, skills, values, and social norms. It links the individual with the wider social world and enables people to participate in economic, political, and cultural life. In rapidly changing societies, education is regarded as a major agent of social transformation capable of promoting modernization, mobility, democratization, and development. John Locke viewed the human mind astabula rasaand argued that personality and abilities are shaped through learning and experience. Education therefore becomes a transformative force that moulds individuals and expands human potential. Human capital theorists such as Gary Becker argue that investment in education enhances productivity, employability, and economic growth. Similarly, Amartya Sen and Martha Nussbaum, through the capabilities approach , regard education as a fundamental capability that expands human freedom, agency, and participation. From a functionalist perspective , education promotes social integration and meritocracy. Emile Durkheim argued that schools act as “society in miniature” where children learn discipline, cooperation, and collective values essential for social cohesion. Kingsley Davis and Wilbert Moore viewed education as a mechanism that allocates individuals to positions according to talent and competence. Modernization theorists such as Alex Inkeles and Daniel Lerner argue that education promotes rationality, scientific temper, achievement orientation, and occupational specialization, thereby facilitating transition from traditional to modern society."}, {"c": "16", "n": "Social Change in Modern SocietyHigh priority", "id": "29-education-and-social-mobility", "t": "29 · Education and Social Mobility", "x": "29 · Education and Social Mobility # Handout only Education is often regarded as one of the most important channels of social mobility in contemporary societies. Expansion of schooling and higher education has enabled individuals from marginalized groups to access modern occupations, government jobs, urban employment, and middle-class lifestyles. Education has contributed to mobility among Dalits, OBCs, women, and tribal communities through reservations, scholarships, and state support. Popular films like Super 30 highlight the importance of education as a tool for social mobility Educational credentials increasingly determine access to employment, income, prestige, and occupational mobility. The expansion of technical, professional, and vocational education has further strengthened the role of education in economic advancement. However, schooling does not guarantee equal mobility for all sections of society because educational opportunities themselves are unequally distributed."}, {"c": "16", "n": "Social Change in Modern SocietyHigh priority", "id": "30-critical-perspectives-on-education", "t": "30 · Critical Perspectives on Education", "x": "30 · Critical Perspectives on Education # Handout only Marxist scholars argue that education often reproduces rather than eliminates inequality. Louis Althusser described education as an important ideological tool through which capitalist societies reproduce and legitimize existing class relations. In Schooling in Capitalist America, Samuel Bowles and Herbert Gintis argued that schools reward obedience, punctuality, discipline, and conformity - traits required in capitalist workplaces. Further, the education system legitimizes inequality under the guise of meritocracy. Raymond Boudon argued that even when students enter the same educational system, differences in family background, parental support, expectations, and resources produce unequal outcomes. Thus, equality of opportunity does not necessarily produce equality of results. Empirical studies support these arguments. Research by Abigail McKnight shows that children from affluent families continue to enjoy major advantages in educational and occupational attainment despite abilities similar to those from humble backgrounds. In conclusion, education can possibly function as a source of mobility and progressive change, but continued prevalence of social inequality despite educational expansion, and unequal access to education itself, indicate the need for urgent educational reforms make it more inclusive and to fully harness its potential."}, {"c": "16", "n": "Social Change in Modern SocietyHigh priority", "id": "traps", "t": "Traps", "x": "Traps # Common mix-ups and the rule for the exam hall Trap What goes wrong, and the rule Frank vs Wallerstein Frank: metropolis-satellite; Wallerstein: three-zone world system. Exam-hall rule: two-part vs three-part. Sorokin appears twice He is both a cyclical and a cultural theorist with the same three mentalities. Exam-hall rule: say which frame you use. Cultural lag is about speed Material culture changes faster than non-material culture; it is not about decline of culture. Exam-hall rule: say 'faster' and 'slower'. Education both liberates and reproduces Mobility channel versus Marxist reproduction thesis. Exam-hall rule: give both sides. Dependency is contested Critics note East Asian growth and India's gains after 1990s. Exam-hall rule: close with criticism."}, {"c": "16", "n": "Social Change in Modern SocietyHigh priority", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Durkheim's change idea? Mechanical to organic solidarity Spencer's societies? Simple, compound, doubly compounded, trebly compounded Comte's three stages? Theological, metaphysical, positive Tonnies' shift? Gemeinschaft to Gesellschaft Three evolutionary criticisms? Linear, Eurocentric, deterministic Sorokin's book and cultures? Social and Cultural Dynamics; ideational, idealistic, sensate Ogburn's concept? Cultural lag Dependency theory began where and when? Latin America, 1960s Dependency thinkers named? Frank, Prebisch, Amin Frank's phrase? Development of underdevelopment Frank's structure? Metropolis-satellite Wallerstein's three zones? Core, semi-periphery, periphery Two counterexamples to dependency? South Korea and Taiwan Techno-optimist named? Marc Andreessen Adorno and Horkheimer's term? Culture industry Bowles and Gintis's book? Schooling in Capitalist America Boudon's point? Same school, unequal outcomes due to family background Locke's mind image? Tabula rasa"}, {"c": "16", "n": "Social Change in Modern SocietyHigh priority", "id": "abbr", "t": "Abbreviation column", "x": "Abbreviation column # Meanings are plain-language aids; verify before quoting Short form Full form One-line meaning COVID-19 Coronavirus disease 2019 Pandemic and technology section UNDP United Nations Development Programme Sustainable Development Goals report in PYQ SDG Sustainable Development Goals UNDP report named in PYQ IVF In vitro fertilisation Example of cultural lag OBC Other Backward Classes Education and mobility DNA Deoxyribonucleic acid Science and reform example PYQ Previous Years' Questions Questions UPSC has already asked"}, {"c": "16", "n": "Social Change in Modern SocietyHigh priority", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test: redraw the chapter map"}, {"c": "16", "n": "Social Change in Modern SocietyHigh priority", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards Mains answer skeletons One for each Mains PYQ quoted in the handout. Tap to open; try the answer first. 2025 · 20 marks · What do you understand by sustainable development? Discuss the elements of sustainable development a… Question. What do you understand by sustainable development? Discuss the elements of sustainable development as proposed in the UNDP's Sustainable Development Goals Report-2015. Intro: name Social Change in Modern Society and state the central idea in one line (see The story first). Body: build the q.addEventListener('input',run)})();</script><script>/* Shared store: reading progress, preferences, optional cross-device sync. */
(function(){
var KEY='nbapp:v1',root=document.documentElement;
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function fresh(){return{v:1,prefs:{fs:1,lh:1.65,w:780,font:'serif',theme:'auto',pt:0},last:null,nb:{},days:{}}}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var S;
try{S=JSON.parse(lsGet(KEY))}catch(e){S=null}
if(!S||!S.v)S=fresh();
S.prefs=Object.assign(fresh().prefs,S.prefs||{});
// one-time import of the older done list and theme
if(!S.migrated){
  try{var od=JSON.parse(lsGet('nb-done')||'[]');od.forEach(function(n){var c=chap('modern-india',n);c.done=1;c.dt=1})}catch(e){}
  var ot=lsGet('nb-theme');if(ot&&!S.prefs.pt){S.prefs.theme=ot;S.prefs.pt=1}
  S.migrated=1;
}
function chap(nb,n){var b=S.nb[nb]||(S.nb[nb]={});return b[n]||(b[n]={read:{},done:0,dt:0,pos:null,t:0})}
var listeners=[],dirty=false,saveT=null,syncT=null;
function save(){
  dirty=true;clearTimeout(saveT);
  saveT=setTimeout(function(){lsSet(KEY,JSON.stringify(S));listeners.forEach(function(f){try{f()}catch(e){}});scheduleSync()},250);
}
function flush(){lsSet(KEY,JSON.stringify(S))}
function merge(a,b){ // a local, b remote; returns merged
  var o=fresh();
  o.prefs=((b.prefs&&b.prefs.pt||0)>(a.prefs&&a.prefs.pt||0))?Object.assign({},a.prefs,b.prefs):Object.assign({},b.prefs,a.prefs);
  o.last=(!a.last||(b.last&&b.last.ts>a.last.ts))?b.last:a.last;
  o.migrated=1;
  var ids={};Object.keys(a.nb||{}).concat(Object.keys(b.nb||{})).forEach(function(k){ids[k]=1});
  Object.keys(ids).forEach(function(id){
    o.nb[id]={};var ca=(a.nb||{})[id]||{},cb=(b.nb||{})[id]||{},ks={};
    Object.keys(ca).concat(Object.keys(cb)).forEach(function(k){ks[k]=1});
    Object.keys(ks).forEach(function(k){
      var x=ca[k],y=cb[k];if(!x||!y){o.nb[id][k]=x||y;return}
      var r=Object.assign({},x.read,y.read),done=(y.dt||0)>(x.dt||0)?y:x,pos=(y.t||0)>(x.t||0)?y.pos:x.pos;
      o.nb[id][k]={read:r,done:done.done,dt:done.dt||0,pos:pos,t:Math.max(x.t||0,y.t||0)};
    });
  });
  var dk={};Object.keys(a.days||{}).concat(Object.keys(b.days||{})).forEach(function(k){dk[k]=1});
  Object.keys(dk).forEach(function(k){o.days[k]=Math.max((a.days||{})[k]||0,(b.days||{})[k]||0)});
  return o;
}
var syncState='off';
function scheduleSync(){clearTimeout(syncT);syncT=setTimeout(function(){sync()},4000)}
var dbp=null;
function getRef(){
  if(dbp)return dbp;
  dbp=(async function(){
    if(!window.claude||!claude.use)return null;
    var db=await claude.use('db'),u=await claude.use('user');
    if(!db||!u||!u.id)return null;
    var id=await u.id();if(!id)return null;
    return db.doc('data/users/'+id+'/nbapp');
  })().catch(function(){return null});
  return dbp;
}
var busy=false;
async function sync(){
  if(busy)return;busy=true;
  try{
    var ref=await getRef();if(!ref){syncState='local';return}
    var snap=await ref.get(),rem=null;
    if(snap.exists){var d=snap.data();try{rem=JSON.parse(d.state)}catch(e){}}
    var m=rem?merge(S,rem):S;
    var changed=JSON.stringify(m)!==JSON.stringify(S);
    S=m;
    if(changed){flush();listeners.forEach(function(f){try{f()}catch(e){}})}
    var out=JSON.stringify(S);
    if(!rem||JSON.stringify(rem)!==out)await ref.set({v:1,updated:Date.now(),state:out});
    syncState='synced';
  }catch(e){syncState='local'}
  finally{busy=false}
}
var API={
  get:function(){return S},
  chap:chap,
  save:save,flush:flush,sync:sync,
  onChange:function(f){listeners.push(f)},
  syncState:function(){return syncState},
  setPref:function(k,v){S.prefs[k]=v;S.prefs.pt=Date.now();applyPrefs();save()},
  reset:function(){S=fresh();S.migrated=1;flush();save()},
  today:today,
  pct:function(nb,n,total){var c=(S.nb[nb]||{})[n];if(!c||!total)return 0;var r=0;Object.keys(c.read||{}).forEach(function(k){if(c.read[k])r++});return Math.min(1,r/total)},
  isDone:function(nb,n,total){var c=(S.nb[nb]||{})[n];if(!c)return false;if(c.dt)return !!c.done;return false}
};
window.NBS=API;
function applyPrefs(){
  var p=S.prefs;
  var th=p.theme;
  if(th==='auto')root.removeAttribute('data-theme');else root.setAttribute('data-theme',th);
  root.style.setProperty('--zoom',p.fs);root.style.setProperty('--lh',p.lh);root.style.setProperty('--pw',p.w+'px');
  root.setAttribute('data-font',p.font);
}
API.applyPrefs=applyPrefs;applyPrefs();
// studied time, counted while the page is visible and touched in the last minute
var lastAct=Date.now();
['scroll','pointerdown','keydown','touchstart'].forEach(function(e){addEventListener(e,function(){lastAct=Date.now()},{passive:true})});
setInterval(function(){
  if(document.hidden||Date.now()-lastAct>60000||!window.__NB)return;
  var t=today();S.days[t]=(S.days[t]||0)+15;save();
},15000);
document.addEventListener('visibilitychange',function(){if(document.hidden){flush();sync()}else{sync()}});
addEventListener('pagehide',flush);
setTimeout(sync,800);
})();
