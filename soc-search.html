on, solidarity, conflict management, order Social breakdown and widespread conflict, leading to systemic collapse L atency Generate and sustain cultural patterns and motivations. Two parts: pattern-maintenance (create, preserve and transmit values, meanings and beliefs; socialization; social identity) and tension management (let actors tackle and release tensions of social life) No cultural reproduction or emotional stabilization: individuals lack motivation to conform; cultural entropy and systemic instability Parsons argued that successful societies maintain functional balance among AGIL, ensuring stability and continuity"}, {"c": "8", "n": "Talcott ParsonsHigh priority", "id": "4-parsons-theory-of-social-change", "t": "4 · Parsons' theory of social change", "x": "4 · Parsons' theory of social change # Handout only Explained within structural functionalism: societies are not static but constantly adjusting to internal and external pressures He rejected the idea that change is inherently destabilizing; change is a mechanism for maintaining social order Two central ideas: dynamic equilibrium and the cybernetic hierarchy of control Dynamic equilibrium Society is a system with clearly defined boundaries: its institutions, norms and processes are distinct from those outside; the system-environment distinction is continuously maintained so the society keeps its internal coherence Within the boundaries the system is in equilibrium: harmony, balance and cooperation between subsystems; but the equilibrium is not static The system constantly exchanges with its environment: economic pressures, demographic shifts and technological changes enter and disturb the equilibrium; certain parts are affected first, and as subsystems are interconnected, other subsystems must adjust too Change begins with strains or disturbances from technological innovation, demographic shifts, cultural conflicts or economic crises; these destabilize the structure and create a need for adaptation; as the system adapts, a new balance is restored So social change is not abrupt or revolutionary but a gradual, adaptive and orderly process; change occurs so that stability can be preserved Cybernetic hierarchy of control Four action systems arranged in a hierarchy (lowest to highest): 1. Organismic : biological and physical functioning of individuals, supplies material energy; lowest 2. Personality : psychological dispositions, motivations and needs of actors 3. Social : institutionalised roles, norms and patterns of interaction 4. Cultural : values, beliefs and symbols that guide action; highest Needs flow upward from lower to higher systems (biological needs place demands on personality, social and finally cultural system) Control flows downward : cultural values and norms direct the social system, which shapes personality, which regulates biological impulses Higher systems are low-energy but high-information controllers; lower systems are high-energy but low-information providers This exchange of needs upward and controls downward is the cybernetic hierarchy of control; it keeps the action systems coordinated and integrated despite pressures for change; the social system is never isolated, linked to other systems by flows of energy and information, so adaptive responses are coherent, not chaotic Evolution of society Long-term change is an evolutionary movement toward greater structural differentiation , adaptive capacity and value-generalization Societies grow complex by developing more refined, specialised structures to meet new needs; these are integrated through broad, generalized values that make cooperation among differentiated units possible The model privileges integration, coherence and stability; change is purposive and gradual; rupture or revolution is rejected as a normal form of change; conflict, dissent or breakdown are temporary disruptions, not fundamental drivers Sequence in short: pressures arise, society responds through differentiation, reintegrates through shared norms, and restores equilibrium; disturbances are absorbed, processed and resolved through hierarchical regulation rather than breakdown or conflict Memory aid (own) · Cybernetic hierarchy, lowest to highest O P S C Organisms Produce Social Culture. O = Organismic; P = Personality; S = Social; C = Cultural. Own memory aid: biology gives rise to personality, society and culture. Needs go up, control comes down. (Order kept: it is a hierarchy)"}, {"c": "8", "n": "Talcott ParsonsHigh priority", "id": "5-criticisms-of-parsons-theory-of-social-s", "t": "5 · Criticisms of Parsons' theory of social system", "x": "5 · Criticisms of Parsons' theory of social system # Handout only Influential in making structural functionalism the dominant paradigm of mid-20th-century sociology, but criticised for style, scope, assumptions and ideological biases 1. Difficult language and too lengthy : C.W. Mills (<i>The Sociological Imagination<\/i>) quotes many paragraphs of Parsons' difficult prose and 'translates' them into shorter, clear language; Mills says the 555 pages of <i>The Social System<\/i> can be translated into about 150 pages of straightforward English 2. Grand theory : Mills treats Parsons as an exemplar of what can go wrong when a social scientist builds a unified theory of man and society; grand theory is too general, ignores social problems in historical or structural contexts, tries to explain all structures in all societies, so creates highly abstract concepts and gives general descriptions of all interaction instead of explaining a specific interaction 3. Little empirical basis : overly concerned with theory building; should have looked more at empirical realities of society to draw more reasonable conclusions 4. Assumes value consensus : different social groups may have different values; the assumed consensus may reflect the values of dominant sections, not of society as a whole 5. Overemphasis on harmony and consensus : real societies have conflict and disagreement, part of all healthy societies; stress on normative order and integration downplays power dynamics, inequality and conflict; fails to address how power and domination influence social action and structures In sum: abstract, overly optimistic, ideologically biased toward stability and power maintenance; useful macro-level framework but neglects conflict, agency and empirical specificity, limiting its use in diverse, dynamic contexts Memory aid (own) · Five criticisms of the social-system theory F L O A T FLOAT. F = Facts missing: little empirical basis; L = Language difficult and too lengthy (Mills); O = Overemphasis on harmony and consensus; power and conflict downplayed; A = Assumes value consensus; T = Grand Theory: too general and abstract. Own memory aid: the theory FLOATS above real social life. (No fixed order, so initials rearranged)"}, {"c": "8", "n": "Talcott ParsonsHigh priority", "id": "6-pattern-variables", "t": "6 · Pattern variables", "x": "6 · Pattern variables # Handout only Developed to explain the fundamental choices actors make in social action; action involves dilemmas or alternative orientations and actors must choose one over the other The choices are shaped by cultural values, norms and expectations, which define how people relate to others, express emotions, pursue goals and assign status Pattern variables are paired alternatives of value orientations that guide behaviour and help understand differences between traditional and modern societies Pair First pole Second pole Example (handout) 1. Ascription vs Achievement (how status is assigned) Ascription: status by birth, caste, gender, ethnicity Achievement: status by performance, skills, merit Caste hierarchy is ascriptive; job promotion on performance is achievement-based 2. Affectivity vs Affective Neutrality (emotional expression) Affectivity: emotional expression allowed, even expected Affective neutrality: emotions controlled for objectivity or professionalism Parent-child relationship is affective; a doctor keeping emotional distance from a patient is affectively neutral 3. Collectivity Orientation vs Self-Orientation (whose interest guides action) Collectivity: group goals and collective welfare first Self-orientation: individual goals and self-expression first An entrepreneur pursuing profit is self-oriented; a soldier sacrificing personal safety for the nation is collectivistic 4. Particularism vs Universalism (how rules are applied) Particularism: special treatment based on relationships, status or exceptions Universalism: general rules applied equally to everyone A judge deciding by law is universalism; a job to a relative because of family is particularism 5. Diffuseness vs Specificity (scope of obligations) Diffuseness: broad, wide-ranging, overlapping obligations Specificity: limited, narrow obligations tied to a role or task Employer-employee relationship is specific; family relationships are diffuse Traditional to modern society Traditional societies : affectivity, particularism, ascription, diffuseness, collectivity orientation Modern societies : affective neutrality, universalism, achievement, specificity, self-orientation The shift reflects industrialization, urbanization, education and rationalization; modern societies need predictability, standardization and meritocracy, so rely on universal rules, achieved status and specific role expectations; traditional societies stress community ties, inherited roles and emotional bonds So social change is not breakdown but a systematic shift in value orientations (ascriptive to achievement-based, particularistic to universalistic, affective to neutral) that changes patterns of interaction, institutions and role expectations Use: an analytical framework showing how values shape social action, and a tool to compare traditional and modern societies Memory aid (own) · Traditional society: five pattern-variable poles P A C E D PACED. P = Particularism; A = Ascription; C = Collectivity orientation; E = Affectivity (emotionally expressive); D = Diffuseness. Own memory aid: traditional life is PACED by birth, family and community. (No fixed order, so initials rearranged) Memory aid (own) · Modern society: five pattern-variable poles M I N U S MINUS. M = Achievement (merit); I = Self-orientation (individual interest); N = Affective Neutrality; U = Universalism; S = Specificity. Own memory aid: modern society is traditional life MINUS emotion, birth-status and diffuse ties. (No fixed order, so initials rearranged)"}, {"c": "8", "n": "Talcott ParsonsHigh priority", "id": "7-criticisms-of-parsons-theory-of-pattern", "t": "7 · Criticisms of Parsons' theory of pattern variables", "x": "7 · Criticisms of Parsons' theory of pattern variables # Handout only A notable attempt to conceptualize actors' dilemmas and separate traditional from modern orientations, but criticised for abstraction, cultural specificity and theoretical limits 1. Rigid dichotomy : binary oppositions miss the complexity and fluidity of real interaction; behaviour often lies on a continuum, not in either-or boxes 2. Overly abstract and theoretical, lacking empirical basis : C.W. Mills criticised overly abstract models without empirical grounding; such dichotomies oversimplify; hard to operationalize and test in empirical research; R.K. Merton also said Parsons' theories lack empirical rigor, and his middle-range theories reflect this concern (theories more empirically grounded and directly testable) 3. Ethnocentric bias and claims of universal application : based mainly on Western societies, particularly the United States, and assumed universally applicable; rooted in Western values, may not suit non-Western societies with different norms 4. Downplays human agency : focuses on the normative structure and roles; underemphasizes individuals who actively interpret, negotiate and sometimes resist norms and who shape and reshape norms and institutions; social action is more fluid and interpretative than the framework suggests Overall: influential for patterned orientations of social action; a useful heuristic device, but abstract, ethnocentric and overly dichotomous; does not fully explain the complexity, diversity and negotiated character of action in contemporary societies Memory aid (own) · Four criticisms of the pattern variables A R E A AREA. A = Abstract and theoretical, lacking empirical basis (Mills, Merton); R = Rigid dichotomy; E = Ethnocentric bias: Western societies, claimed as universal; A = Agency downplayed. Own memory aid: the pattern variables cover a wide AREA of action, yet fail in four ways. (No fixed order, so initials rearranged) Memory aid (own) · AGIL (the handout's own acronym, kept as given) A G I L AGIL. A = Adaptation; G = Goal-Attainment; I = Integration; L = Latency. Own memory aid: a society must stay AGILE to survive. (Fixed acronym from the handout)"}, {"c": "8", "n": "Talcott ParsonsHigh priority", "id": "traps", "t": "Traps", "x": "Traps # Common mix-ups and the rule for the exam hall Trap What goes wrong, and the rule Change is not revolution Parsons rejects rupture or revolution as a normal form of change; conflict and breakdown are temporary disruptions. Exam-hall rule: write 'gradual, adaptive, orderly', never 'revolutionary', for Parsons. Which pole is traditional? Traditional: affectivity, particularism, ascription, diffuseness, collectivity. Modern: the opposite five. Exam-hall rule: say PACED for traditional and MINUS for modern before listing. Who said what Mills: difficult prose, grand theory, 555 pages to about 150, and abstract models. Merton: lack of empirical rigour; middle-range theory. Exam-hall rule: attach each critic to his own charge. Needs up, control down Needs flow upward from the organismic system; control flows downward from the cultural system. Exam-hall rule: draw the arrow before writing."}, {"c": "8", "n": "Talcott ParsonsHigh priority", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Who founded Harvard's Department of Social Relations? Talcott Parsons Name the book of 1951 that sets out the social system. The Social System Two mechanisms that secure conformity? Socialization and social control Expand AGIL. Adaptation, Goal-Attainment, Integration, Latency Two parts of Latency? Pattern-maintenance and tension management Which AGIL failure gives 'cultural entropy'? Latency Two central ideas of Parsons' theory of change? Dynamic equilibrium; cybernetic hierarchy of control Order of the four action systems, lowest to highest? Organismic, Personality, Social, Cultural Which way do needs flow, and which way does control flow? Needs upward; control downward Long-term change moves toward what? Greater structural differentiation, adaptive capacity and value-generalization Mills: 555 pages of The Social System translate into how many pages? About 150 pages of straightforward English Five pattern variables? Ascription-Achievement; Affectivity-Affective neutrality; Collectivity-Self orientation; Particularism-Universalism; Diffuseness-Specificity Which poles mark modern societies? Affective neutrality, universalism, achievement, specificity, self-orientation Which two critics found Parsons lacking in empirical rigour? C.W. Mills and R.K. Merton"}, {"c": "8", "n": "Talcott ParsonsHigh priority", "id": "abbr", "t": "Abbreviation column", "x": "Abbreviation column # Meanings are plain-language aids; verify before quoting Short form Full form One-line meaning AGIL Adaptation, Goal-Attainment, Integration, Latency Parsons' four functional prerequisites PYQ Previous Years' Questions Questions UPSC has already asked LSE London School of Economics One of Parsons' universities C.W. Mills C. Wright Mills Critic; author of The Sociological Imagination R.K. Merton Robert K. Merton Critic; advocate of middle-range theories 2022/I/7a/20 Year / Paper I / Question 7a / 20 marks How the handout labels each PYQ"}, {"c": "8", "n": "Talcott ParsonsHigh priority", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test: redraw the chapter map"}, {"c": "8", "n": "Talcott ParsonsHigh priority", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards Mains answer skeletons One for each Mains PYQ quoted in the handout. Tap to open; try the answer first. 2022 · 20 marks · Critically analyse Parsons views on society as a social system. Question. Critically analyse Parsons views on society as a social system. Intro: name Talcott Parsons and state the central idea in one line (see The story first). Body: build the answer from the notes under: Social system. Close: finish with the matching criticisms section and a one-line judgement. 2020 · 10 marks · Analyse the relevance of 'Pattern Variables' in the study of Social change. Question. Analyse the relevance of 'Pattern Variables' in the study of Social change. Intro: name Talcott Parsons and state the central idea in one line (see The story first). Body: build the answer from the notes under: Pattern variables. Close: finish with the matching criticisms section and a one-line judgement. 2018 · 20 marks · How can Parsons AGIL framework be used to analyse key problems in a society? Discuss. Question. How can Parsons AGIL framework be used to analyse key problems in a society? Discuss. Intro: name Talcott Parsons and state the central idea in one line (see The story first). Body: build the answer from the notes under: AGIL framework. Close: finish with the matching criticisms section and a one-line judgement. 2017 · 10 marks · Critically analyse Talcott Parsons' conception of 'Pattern Variables'. Question. Critically analyse Talcott Parsons' conception of 'Pattern Variables'. Intro: name Talcott Parsons and state the central idea in one line (see The story first). Body: build the answer from the notes under: Pattern variables. Close: finish with the matching criticisms section and a one-line judgement. 2016 · 20 marks · Describe the functional prerequisites of social systems as given by Talcott Parsons. Examine in the … Question. Describe the functional prerequisites of social systems as given by Talcott Parsons. Examine in the context of a university as a social system. Intro: name Talcott Parsons and state the central idea in one line (see The story first). Body: build the answer from the notes under: Social system; AGIL framework. Close: finish with the matching criticisms section and a one-line judgement. 2015 · 20 marks · How is social equilibrium mentioned in Parsonian framework? Question. How is social equilibrium mentioned in Parsonian framework? Intro: name Talcott Parsons and state the central idea in one line (see The story first). Body: build the answer from the notes under: Parsons' theory of social change; Social system. Close: finish with the matching criticisms section and a one-line judgement. 2013 · 10 marks · Examine the relevance of Parsonian Social systems in a present society? Question. Examine the relevance of Parsonian Social systems in a present society? Intro: name Talcott Parsons and state the central idea in one line (see The story first). Body: build the answer from the notes under: Social system. Close: finish with the matching criticisms section and a one-line judgement. Previous Max Weber Next R.K. Merton Personal study notes built from: Sarrthi IAS · Sociology Optional Foundation 2027 · Talcott Parsons handout (pp. 1-8). Only the handout facts are used; memory aids are labelled own. Copyright belongs to the teacher or institute; keep this private."}, {"c": "9", "n": "R.K. MertonHigh priority", "id": "chapter-map", "t": "Chapter map", "x": "Chapter map # Map Outline Merton Critique of functionalism Universal functionalism Functional unity Indispensability Functions Manifest Latent Dysfunction Reference groups Selection factors Relative deprivation Deviance Goals vs means Five adaptations Anomie Merton vs Durkheim Criticisms American context Cohen Cloward and Ohlin"}, {"c": "9", "n": "R.K. MertonHigh priority", "id": "lens", "t": "Exam lens", "x": "Exam lens # Exam lens Priority: High. Mains PYQs quoted: 2014, 2016, 2019, 2020, 2021, 2022, 2023, 2025. Prelims: not asked (Mains optional). Mains hooks 11 Mains PYQs quoted in the handout, 2014-2025: reference groups (4), manifest and latent functions (3), deviance and conformity (3), anomie (1), reactions to functionalism (1). Many PYQs ask you to apply Merton to a real example (bureaucrats' tenure, corruption, traffic, fashion, digital identity): keep one example per concept. Anomie comparison with Durkheim is a repeat theme. Merton turns functionalism into a tool for hidden purposes and for explaining deviance as structural strain. Every answer needs one example and the persistent-anomie contrast."}, {"c": "9", "n": "R.K. MertonHigh priority", "id": "story", "t": "The story first", "x": "The story first # The story first Merton repairs classical functionalism: not every institution is functional, indispensable or unified. He adds manifest and latent functions and dysfunctions, reference groups and relative deprivation, and explains deviance as the strain between cultural goals and legitimate means. 1. Fixing functionalism. Robert K. Merton (1910-2003) criticised Malinowski and Radcliffe-Brown in Social Theory and Social Structure for three postulates: universal functionalism, functional unity and indispensability. *→ His fix: look at what institutions really do.* 2. Manifest, latent, dysfunction. Manifest functions are intended and recognised, latent ones unintended and unrecognised (the Hopi rain dance). Dysfunctions are negative consequences. The distinction reveals hidden purposes, explains why institutions persist and curbs ethnocentric bias. *→ Individuals also measure themselves against groups.* 3. Reference groups and relative deprivation. A reference group is the standard a person uses to judge himself (term coined by Hyman, elaborated by Sharif and Merton). Choosing a non-membership group depends on perceived rewards, open systems, idealised perception and social isolation. Relative deprivation (Stouffer, The American Soldier) is dissatisfaction from comparing oneself with those better off. *→ Comparison can push people towards deviance.* 4. Strain and deviance. In Social Structure and Anomie, deviance arises when culturally prescribed goals and the legitimate means to reach them do not match. Five adaptations: conformity, innovation, ritualism, retreatism, rebellion. *→ Durkheim and Merton share a word, anomie, but not a meaning.* 5. Anomie compared, and the critics. Durkheim sees anomie as temporary and abnormal; Merton as a persistent, structural feature. Critics: cultural specificity (American), non-utilitarian crime (Albert Cohen), illegitimate opportunity structures (Cloward and Ohlin), white-collar crime, power and psychology. Cast: Hopi rain dance = Merton's example of manifest vs latent function · The American Soldier = Stouffer's study; relative deprivation · Cloward and Ohlin = illegitimate opportunity structures"}, {"c": "9", "n": "R.K. MertonHigh priority", "id": "terms", "t": "In simple words", "x": "In simple words # Merton criticises classical functionalism's postulates of universal functionalism, functional unity and indispensability . He adds manifest and latent functions and dysfunctions to make functional analysis rigorous. Reference groups and relative deprivation explain how people judge themselves. In Social Structure and Anomie , deviance comes from the strain between cultural goals and legitimate means : conformity, innovation, ritualism, retreatism, rebellion . Term In plain words Manifest function Intended and recognised consequence of an institution. Latent function Unintended and unrecognised consequence. Dysfunction Negative consequence of a social practice. Reference group Group used as a standard to evaluate one's own feelings, attitudes and behaviour. Relative deprivation Dissatisfaction from comparing oneself with those better off. Deviance Acts that do not conform to norms and invite negative sanctions. Anomie (Merton) Structural strain between cultural goals and legitimate means; persistent. Anomie (Durkheim) Normlessness during rapid change; temporary and abnormal. Innovation Accepts cultural goals, rejects or lacks legitimate means. Ritualism Scales down goals but rigidly follows means."}, {"c": "9", "n": "R.K. MertonHigh priority", "id": "1-r-k-merton", "t": "1 · R.K. Merton", "x": "1 · R.K. Merton # Handout only Robert K. Merton (1910-2003) was an American sociologist who profoundly shaped 20th-century sociological theory. Born into a working-class Jewish immigrant family in Philadelphia, he rose through scholarships and academic brilliance to study at Temple University and later pursue his PhD under Pitirim Sorokin at Harvard. His career was primarily associated with Columbia University, where he mentored generations of sociologists. Merton is celebrated for transforming structural functionalism into a more analytically flexible theoretical approach. His key contributions include the refinement of functional analysis, the concept of manifest and latent functions, middle range theory, strain theory of deviance, role-set, reference group theory, and the sociology of science."}, {"c": "9", "n": "R.K. MertonHigh priority", "id": "2-merton-s-criticisms-of-classical-functio", "t": "2 · Merton’s Criticisms of Classical Functionalism", "x": "2 · Merton’s Criticisms of Classical Functionalism # Handout only Classical functionalists such as Bronislaw Malinowski and A. R. Radcliffe-Brown made some broad assumptions about the nature of social systems and social phenomena. Merton respected the functionalist tradition but felt that its underlying postulates were overstated, theoretically limiting, and empirically unverifiable. Hence, he reformulated functionalism by criticizing three key postulates and replacing them with a more rigorous analytical framework. In his book Social Theory and Social Structure , Merton specifically criticized:"}, {"c": "9", "n": "R.K. MertonHigh priority", "id": "3-1-postulate-of-universal-functionalism", "t": "3 · 1. Postulate of Universal Functionalism", "x": "3 · 1. Postulate of Universal Functionalism # Handout only This postulate holds that all social or cultural forms have positive functions. Malinowski, says Merton, advances this in its most extreme form. As Malinowski says, ‘In every type of civilisation, every custom, material object, idea and belief fulfils some vital function’. According to Merton, functionalists overstated the functionality of every cultural item. Merton contends that any existing cultural item may be functional (having positive consequences), dysfunctional (having negative consequences), or non-functional (having no effect) for specific social groups. 2. Postulate of Functional Unity assumes that all parts of the social system are inter-related and interdependent. A change in any one part of the society is assumed to produce changes in all other social institutions. It assumes that different social institutions work together with internal consistency and harmony. Merton suggests that this assumption may not be true for highly complex societies. 3. Postulate of Indispensability This postulate states that since the existing social institutions perform some vital functions for the society; the society cannot exist in their absence. In other words, the social institutions (performing vital social functions) are indispensable for the society. A functionalist analysis, Merton says, should not assume anything to be indispensable. There may be functional alternatives, equivalents or substitutes. In other words, the same vital function (served by a given institution), may be fulfilled by another institution under changed circumstances. Merton’s critique of classical functionalism marked a turning point in functional theory in sociology. By challenging some of its basic assumptions, he created space for a more flexible and empirically grounded form of functional analysis. His emphasis on dysfunctions, functional alternatives, and functional autonomy enabled sociologists to study how complex societies adapt to change without assuming automatic harmony and integration."}, {"c": "9", "n": "R.K. MertonHigh priority", "id": "4-manifest-and-latent-functions", "t": "4 · Manifest and Latent Functions", "x": "4 · Manifest and Latent Functions # Handout only Picture hook A classroom. Hook for an institution's manifest functions. (handout p.3) Robert K. Merton introduced the concepts of manifest and latent functions to refine functional analysis and to make it more analytically rigorous and empirically grounded. Merton first systematically formulated these concepts in his influential book \"Social Theory and Social Structure\" (1949) , which remains a foundational text in functionalist sociology. He argued that classical functionalism tended to assume that all aspects of culture contribute positively to social stability, often ignoring unintended consequences or failing to distinguish between intended and unintended outcomes. By separating manifest from latent functions, Merton created a conceptual tool that enabled sociologists to analyse both the obvious, conscious purposes of social practices and the unintended, hidden consequences that may be equally important in maintaining or disrupting social life. Manifest functions refer to those positive consequences of any social practice, institution, or cultural pattern which are intended as well as recognized . They are the outcomes that actors consciously seek to produce when they engage in a particular action. For example, the manifest function of schooling is to impart knowledge and skills. Actors generally understand these consequences and evaluate actions in terms of these explicit goals. Latent functions , by contrast, refer to those positive consequences of any social practice or institution which are neither intended nor recognized. These are the hidden consequences of actions or institutions, which may nevertheless have significant social effects. These consequences may not be apparent to participants and may even contradict the intended aims. For example, a latent function of schooling may be to allow the parents time for themselves free from the responsibilities of child care. Schooling also delays entry into the labour market, reducing youth unemployment and managing demographic pressures, while providing a socially acceptable space for adolescence. Schools also become venues for the creation of peer cultures and friendship networks, that shape later life trajectories. Additionally, they reinforce patriotism and national identity through textbooks, rituals, and celebrations, helping to reproduce the ideological foundations of the nation-state. A classic example used by Merton to illustrate manifest and latent functions is the Hopi Indian rain dance . The manifest function of the rain dance is to produce rainfall, a clearly intended outcome linked to agricultural survival. However, regardless of whether the dance succeeds in producing rain, it generates latent functions - such as reinforcing group solidarity, confirming shared beliefs, providing emotional reassurance, and preserving cultural identity. These latent consequences, though unintended, play a more stable and significant role in maintaining social cohesion than the manifest purpose itself. In other words, even if the manifest aim fails, the ritual persists because its latent functions fulfil crucial social needs. Manifest function of schools is to impart education. But do they fulfill any latent functions? In Merton’s framework, unintended consequences and latent functions are related but not identical concepts. Unintended consequences refer broadly to outcomes of social action that were not consciously intended or anticipated by actors. These may be positive, negative, or neutral, and they can occur at any level of social life. In contrast, latent functions are a specific subset of unintended consequences - those unintended outcomes that contribute to the adjustment, adaptation, or maintenance of the social system. In other words, all latent functions are unintended consequences, but not all unintended consequences qualify as latent functions. For example, an unintended consequence might lead to maladjustment, or it may be accidental or irrelevant, whereas a latent function has systemic significance, even though actors are unaware of it. This distinction allowed Merton to separate dysfunctional and non-functional by-products of action from unrecognized but functionally important outcomes, giving functional analysis greater analytical precision. Merton also identified manifest and latent dysfunctions , which refer to the recognized and unrecognized negative consequences of social actions or institutions. Manifest dysfunctions are the harmful effects known to the actors, whereas latent dysfunctions refer to unexpected negative outcomes that remain unrecognized by the actors. For example, manifest dysfunctions of schooling are the academic stress and bullying faced by students. Latent dysfunctions of schooling may be reproduction of class inequalities, sexual harassment, and social exclusion of students through peer hierarchies. By including dysfunctions within functional analysis, Merton demonstrated that social practices do not always contribute to equilibrium, and that functional analysis must account for instability and maladaptation. Significance of Merton’s Concepts of Manifest and Latent Functions and"}, {"c": "9", "n": "R.K. MertonHigh priority", "id": "5-dysfunctions", "t": "5 · Dysfunctions", "x": "5 · Dysfunctions # Handout only 1. Enables deeper understanding: This distinction helps us to go beyond the common-sense perception of the world. A notion like latent function opens your eyes, and enables you to see the hidden purposes of many social practices and cultural beliefs. 2. Explains persistence of institutions: Latent functions help explain why institutions or practices continue despite failing in their manifest objectives. Practices like the Hopi rain dance may not meet their stated goals (producing rain), but they strengthen group unity and identity - an important latent function. 3. Allows recognition of dysfunctions: By including negative consequences - both manifest and latent - Merton broadens the scope of functional analysis beyond its traditional focus on stability. 4. Helps overcome ethnocentric bias: Social scientists are less likely to succumb to their own biases, particularly when analysing societies and cultures vastly different from their own, if they are mindful of identifying the latent consequences of the social institutions and cultural practices under study. Instead of dismissing some practices as absurd, sociologists ask why they persist and what hidden needs they fulfil. 5. Challenges conventional ideas of rationality and morality: Merton shows that even practices labelled “irrational” or “immoral” may fulfil necessary latent functions, forcing us to rethink what counts as rational or moral. Practices condemned as immoral may perform important functions. For example, prostitution, widely condemned as immoral, performs the latent function of fulfilling the sexual needs of those who are unable to marry. 6. Strengthens functionalist analysis without dogmatism: Merton corrects classical functionalism by recognising dysfunctions, unintended consequences, and multiple functions of social action. Criticisms & Limitations of Concepts of Manifest and Latent Functions: Although influential and widely adopted, the framework of manifest and latent functions & dysfunctions has been criticised on theoretical, methodological, and empirical grounds as follows: 1. Subjectivity in Identifying Latent Functions: The distinction between manifest and latent functions is often subjective and ambiguous, as different researchers may classify the same consequence differently; what one sociologist views as latent, another may see as manifest, reducing analytical consistency. 2. Problems of Empirical Verification: Latent functions and dysfunctions are, by definition, unintended and unrecognized, and therefore cannot be directly observed; they must be inferred indirectly, making empirical verification difficult and prone to speculative reasoning. 3. Residual Functional Bias in Analysis: Despite recognising dysfunctions and non-functions, Merton’s analysis retains a functionalist orientation that privileges order, integration, and social stability, thereby downplaying the negative consequences and disruptive aspects of social phenomena. 4. Difficulty in Establishing Causality: It is methodologically challenging to establish a clear causal link between a social practice and its latent consequences because unintended outcomes may result from multiple interacting factors; for example, group solidarity among the Hopi Indians may not be attributable solely to the rain dance, but also to kinship, economic interdependence, or shared rituals more broadly. 5. Neglect of Power, Inequality, and Conflict: Merton’s framework tends to overlook how conflict, domination, and power structures shape social practices and their consequences; latent outcomes may benefit privileged groups at the expense of others, yet the theory offers limited tools to analyse such power asymmetries. Merton’s formulation of manifest and latent functions represents a major theoretical innovation that transformed functionalism into a more dynamic approach. Merton provided a powerful analytical framework for understanding the complexity of social life. Though these concepts expanded the analytical scope of functionalism; the theory faces significant limitations, particularly in terms of subjectivity, causal ambiguity, and a residual functionalist emphasis on stability rather than conflict. While it is a valuable conceptual tool, it must be supplemented by approaches that foreground power, inequality, and empirical rigor."}, {"c": "9", "n": "R.K. MertonHigh priority", "id": "6-reference-groups", "t": "6 · Reference Groups", "x": "6 · Reference Groups # Handout only Picture hook Children in team jerseys. Hook for reference groups. (handout p.6) The concept of reference group was initially coined by Herbert Hyman , and later elaborated by Muzaffar Sharif and Robert K. Merton . A reference group is any social group that an individual uses as a standard or benchmark to evaluate and shape their own feelings, attitudes, and behaviour. Thus, individuals use reference groups as a frame of reference to measure their own actions, achievements, preferences, and values. Human beings always live in groups and our everyday conduct is influenced by the groups to which we belong. These membership groups exercise normative pressure: they expect certain behaviour from members, who comply because they seek approval and acceptance. Therefore, individuals evaluate their actions with reference to the norms and values of their membership group, making these groups reference groups. However, individuals are not influenced only by the groups to which they belong. Many times, non-membership groups also shape an individual’s conduct, aspirations, and self-evaluation. Merton therefore emphasized that both membership and non-membership groups may serve as reference groups. For many children in India, professional cricketers are a reference group. Anticipatory socialization refers to the process by which individuals prepare themselves for entry into a non-membership reference group by adopting its norms, values, attitudes, and lifestyle. It is functional because it increases the individual’s likelihood of admission into that desired group and eases adjustment once entry is achieved. However, anticipatory socialization may also be dysfunctional. When the values of one’s membership group clash with those of the aspirational group, the individual may become alienated from current group members without yet being accepted by the new group. In such a situation, the individual may become a “marginal man” - maladjusted in his membership group and not fully integrated into the non- membership group either."}, {"c": "9", "n": "R.K. MertonHigh priority", "id": "7-reference-group-selection-process", "t": "7 · Reference Group Selection Process", "x": "7 · Reference Group Selection Process # Handout only Reference group selection is a complex and dynamic process. Individuals may choose different reference groups at different stages of life, and even at a particular moment, one may have multiple reference groups for different domains: appearance, career, morality, lifestyle, etc. These groups may impose competing or conflicting demands , and their norms and values may clash. Individuals attempt to balance, prioritize, or compartmentalize these expectations. People often choose positive reference groups , whose norms they seek to emulate in order to obtain membership. However, individuals may also be influenced by negative reference groups , by consciously rejecting their norms to establish counter-norms because they wish to avoid membership or association with them. Non-membership groups may serve as reference groups for multiple reasons: 1. Perceived rewards: An individual may choose a non-membership group because its membership is expected to confer greater power, prestige, wealth, or status . 2. Open systems encourage mobility: Non-membership groups are more likely to be selected in open systems that permit mobility than in closed systems where mobility is restricted. 3. Idealized perception: Individuals are often aware of the shortcomings of their membership group but not of those of the non-membership group; the latter may therefore appear more attractive from the outside . 4. Social isolation: Those dissatisfied with their position in membership groups are more likely to adopt non-membership groups as reference groups. Individuals often look beyond current membership to aspire to better positions and derive psychological satisfaction from imagining themselves as members of more desirable groups. Memory aid (own) · Why people choose a non-membership reference group P O I S Peers Offer Ideal Standards. P = Perceived rewards; O = Open systems encourage mobility; I = Idealized perception; S = Social isolation. The handout numbers the four factors 1-4, so the order is kept. (order kept)"}, {"c": "9", "n": "R.K. MertonHigh priority", "id": "8-relative-deprivation", "t": "8 · Relative Deprivation", "x": "8 · Relative Deprivation # Handout only The concept of relative deprivation was developed by Samuel Stouffer in the study titled The American Soldier. Relative deprivation refers to the feeling of dissatisfaction that arises when individuals compare themselves with others who are better off , even if their objective situation is adequate. Stouffer found that married soldiers felt deprived when compared to fellow unmarried soldiers , thus showing that dissatisfaction is relative, not absolute. The concept highlights how individuals evaluate themselves with reference to groups they belong to or aspire to join. Membership groups shape everyday conduct, while aspirational non-membership groups influence long-term goals, identity formation, and social mobility."}, {"c": "9", "n": "R.K. MertonHigh priority", "id": "9-conformity-and-deviance", "t": "9 · Conformity and Deviance", "x": "9 · Conformity and Deviance # Handout only Picture hook Men in a poor settlement. Hook for strain between goals and means. (handout p.8) Deviance refers to those acts which do not conform to the norms and expectations of society , exceed its tolerance limits and invite negative sanctions . In a broader sense, deviance may include a wide variety of actions - those which society condemns, those which it rewards, and those which society ignores. However, Marshall Clinard argues that the term deviance should be reserved only for behaviour that is disapproved by society and lies beyond its tolerance limits. Thus, deviance is best understood as norm-violating behaviour that attracts negative sanction. Drug abuse is a form of deviant behaviour Deviance is culture and context specific . Acts considered deviant in one society may be acceptable or even encouraged in another. Similarly, acts considered deviant in a particular society at one historical moment may come to be tolerated or even celebrated later as values and cultural standards change. Since norms vary across societies and change over time, deviance is not an absolute category but a socially constructed and historically contingent one."}, {"c": "9", "n": "R.K. MertonHigh priority", "id": "10-r-k-merton-s-theory-of-deviance", "t": "10 · R.K. Merton’s Theory of Deviance", "x": "10 · R.K. Merton’s Theory of Deviance # Handout only Merton rejected biological, psychological and other individualistic explanations of deviance and instead offered a sociological theory rooted in structural and cultural conditions. In his influential essay Social Structure and Anomie , he argued that deviant behaviour emerges from the relationship between culturally prescribed goals and institutionalized means . In American society, a particular type of anomie arises because of the discrepancy between the cultural emphasis on material success and the unequal access to legitimate means of achieving it. The culturally approved goal in American society is economic success, symbolized by wealth, prosperity, and material achievement. The institutionalized means to achieve these goals include higher education, hard work, thrift, talent cultivation, adherence to rules, and entrepreneurial risk-taking. However, access to these means is not equally distributed. Consequently, many individuals experience strain , because they are pressured to pursue culturally valued goals but lack socially approved avenues to do so."}, {"c": "9", "n": "R.K. MertonHigh priority", "id": "11-modes-of-individual-adaptation", "t": "11 · Modes of Individual Adaptation", "x": "11 · Modes of Individual Adaptation # Handout only Picture hook Merton's typology of individual adaptation: conformity, innovation, ritualism, retreatism, rebellion (handout diagram). (handout p.10) Based on one’s location in the social structure, individuals respond differently to situations of strain and anomie. Merton identifies five types of adaptive responses: 1. Conformity: Those who accept the culturally approved goals and pursue them through institutionalized means. They seek material success through education, hard work, and legitimate occupational pathways. 2. Innovation: Those who accept the cultural goals of success but reject or cannot access institutionalized means, instead resorting to alternative, often illegitimate methods to attain wealth. Typically (but not exclusively), lower- class individuals are likely to innovate because legitimate avenues are unavailable or blocked. 3. Ritualism: Those who abandon or scale down cultural goals but rigidly adhere to institutionalized means. They continue to follow rules, routines, and work discipline even when they have given up aspirations of material success - often exemplified by lower-middle-class individuals in repetitive, dead-end employment. 4. Retreatism: Those who reject both cultural goals and institutionalized means, effectively withdrawing from society. They may have initially attempted conformity but, after failure, retreat into marginal lifestyles such as addiction, vagrancy, or chronic unemployment. Merton does not confine retreatism to a specific class. 5. Rebellion: Those who reject existing cultural goals and institutionalized means and replace them with new goals and new means. They seek to establish an alternative social order. Examples may include revolutionaries or insurgent movements that challenge the legitimacy of the state and use violence for political transformation. Rebellion is often led by those who are a rising class and are dissatisfied with the status quo. Merton’s strain theory provides a structural explanation of deviance by linking rule- breaking to the gap between culturally defined goals and access to legitimate means. It shows how the very values that sustain social order can also produce deviance when they are not accompanied by equal opportunity. Criticisms of Merton’s Theory of Conformity and Deviance Merton’s strain theory is a landmark sociological explanation of deviance that links rule-breaking to structural conditions - specifically, the disjunction between culturally approved goals and socially approved means. While highly influential, it has invited several criticisms on theoretical, empirical, and cultural grounds. 1. Cultural specificity of the model: Merton developed his theory in the context of American society, where the cultural goal of monetary success and achievement is heavily emphasized. As a result, the framework may not be universally applicable to societies with different cultural values, institutional arrangements, or less pronounced achievement orientations. 2. Inability to explain non-utilitarian crime: Albert Cohen argues that Merton can explain utilitarian crimes such as theft or robbery, where deviance is a means to achieve economic goals. However, non-utilitarian and expressive crimes - such as vandalism, and violence for its own sake - cannot be explained as responses to blocked economic opportunities. These crimes often serve emotional or group-status needs, which Merton overlooks. 3. Neglect of illegitimate opportunity structures: Memory aid (own) · Five modes of individual adaptation C I R R R Clever Inventors Rarely Retreat, Rebel. C = Conformity; I = Innovation; R = Ritualism; R = Retreatism; R = Rebellion. The handout numbers the five modes 1-5, so the order is kept. (order kept)"}, {"c": "9", "n": "R.K. MertonHigh priority", "id": "12-criticisms-of-the-strain-model-cloward-a", "t": "12 · Criticisms of the strain model: Cloward and Ohlin onward", "x": "12 · Criticisms of the strain model: Cloward and Ohlin onward # Handout only point out that Merton emphasizes unequal access to legitimate opportunity structures (education, jobs), but neglects how access to illegitimate opportunity structures (gangs, organized crime, criminal networks) is also unequally distributed. They argue that deviance is shaped not merely by blocked legitimate means but by the availability of organized alternatives that enable deviant careers. 4. Inadequate explanation of white-collar crime: Critics point out that Merton’s model is insufficient for explaining crimes committed by individuals already in positions of privilege and success. White-collar criminals often have full access to legitimate means but pursue deviant actions due to greed, opportunity, corporate culture, or competitive pressure - none of which fit neatly within Merton’s strain categories. 5. Failure to incorporate power and inequality: Marxist critics argue that Merton ignores how laws are unequally enforced, and how the privileged have more power to define deviance, evade legal consequences, and use the state to protect their interests. Merton assumes a relatively neutral legal system, whereas Marxists emphasize selectivity in punishing deviance. 6. Downplaying psychological factors: Merton’s theory highlights social structure and cultural goals, but pays minimal attention to personality traits, emotional drives, mental health, trauma, or individual motivations. Overall, critics argue that while Merton provided a powerful structural explanation of deviance, his analysis is limited by cultural specificity, inadequate attention to non- economic forms of deviance, and insufficient consideration of white-collar crime, and unequal power in law enforcement. Nevertheless, these criticisms stimulated a rich body of subsequent research and theory building, making Merton’s work foundational to the sociology of deviance. Anomie in the writings of Durkheim and Merton: The concept of anomie was first articulated by Emile Durkheim and later reinterpreted by Robert K. Merton. While both use the term extensively in their writings, they differ significantly regarding its meaning, causes, nature, and consequences."}, {"c": "9", "n": "R.K. MertonHigh priority", "id": "13-1-meaning-of-anomie", "t": "13 · 1. Meaning of Anomie", "x": "13 · 1. Meaning of Anomie # Handout only According to Durkheim , anomie refers to a state of normlessness in which social norms lose their power to regulate individual desires and behavior. According to Merton , anomie refers to a condition of structural strain in which there is a gap between culturally approved goals and the institutionalized means available to achieve them."}, {"c": "9", "n": "R.K. MertonHigh priority", "id": "14-2-causes-of-anomie", "t": "14 · 2. Causes of Anomie", "x": "14 · 2. Causes of Anomie # Handout only According to Durkheim , anomie is caused by rapid social change such as industrialization, economic expansion, or crisis, which disrupts collective norms. According to Merton , anomie is caused by structural inequality and the cultural overemphasis on success goals, which push individuals to pursue wealth despite limited legitimate means."}, {"c": "9", "n": "R.K. MertonHigh priority", "id": "15-3-consequences-for-individuals", "t": "15 · 3. Consequences for Individuals", "x": "15 · 3. Consequences for Individuals # Handout only For Durkheim, anomie results in moral uncertainty, purposelessness, and disorientation , often manifesting in pathological outcomes such as suicide. For Merton, anomie results in varied forms of deviant behaviour , including innovation, ritualism, retreatism, and rebellion, depending on individuals’ access to opportunities."}, {"c": "9", "n": "R.K. MertonHigh priority", "id": "16-4-duration-and-nature-of-the-condition", "t": "16 · 4. Duration and Nature of the Condition", "x": "16 · 4. Duration and Nature of the Condition # Handout only Durkheim views anomie as a temporary, abnormal condition that arises during periods of social transition or disruption. Merton views anomie as a chronic, normalised feature of capitalist societies , resulting from permanent structural inequalities."}, {"c": "9", "n": "R.K. MertonHigh priority", "id": "17-5-typical-social-context", "t": "17 · 5. Typical Social Context", "x": "17 · 5. Typical Social Context # Handout only Durkheim situates anomie in societies undergoing rapid transformation , where traditional norms cannot keep pace with change. Merton situates anomie in stratified capitalist societies , where cultural goals remain uniform but access to institutionalized means varies by class."}, {"c": "9", "n": "R.K. MertonHigh priority", "id": "18-6-solutions-suggested", "t": "18 · 6. Solutions Suggested", "x": "18 · 6. Solutions Suggested # Handout only Durkheim suggests that anomie can be resolved through strengthening moral regulation and social integration to restore social order. Merton suggests that anomie can be addressed by reducing pressure on cultural success goals or expanding access to legitimate means to reduce structural strain. Durkheim and Merton both use the idea of anomie, but their approaches differ fundamentally. Durkheim views anomie as a breakdown of normative regulation due to social change, while Merton treats it as a structural strain."}, {"c": "9", "n": "R.K. MertonHigh priority", "id": "traps", "t": "Traps", "x": "Traps # Common mix-ups and the rule for the exam hall Trap What goes wrong, and the rule Ritualism vs conformity Ritualists scale down goals but follow means rigidly; conformists accept both goals and means. Exam-hall rule: ritualism = means without goals. Latent function vs unintended consequence Related but not identical; the handout draws the distinction (2019 PYQ). Exam-hall rule: name both, then give one example each. Two sources This chapter is built from an IAS Gurukul handout, not a Sarrthi one; confirm with your class notes if a fact differs. Exam-hall rule: class notes win in class."}, {"c": "9", "n": "R.K. MertonHigh priority", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Merton's years? 1910-2003 Merton's book that criticised classical functionalism? Social Theory and Social Structure Whom did he criticise? Malinowski and Radcliffe-Brown Three postulates he criticised? Universal functionalism, functional unity, indispensability Manifest vs latent function? Intended and recognised vs unintended and unrecognised Merton's classic example of latent function? Hopi Indian rain dance Who coined 'reference group'? Herbert Hyman; elaborated by Sharif and Merton Relative deprivation was developed in which study? The American Soldier (Stouffer) Merton's essay on deviance? Social Structure and Anomie Five modes of adaptation? Conformity, innovation, ritualism, retreatism, rebellion Who rejects both goals and means and withdraws? Retreatists Durkheim vs Merton on anomie? Temporary and abnormal vs persistent and structural Who found Merton unable to explain non-utilitarian crime? Albert Cohen Who stressed illegitimate opportunity structures? Cloward and Ohlin"}, {"c": "9", "n": "R.K. MertonHigh priority", "id": "abbr", "t": "Abbreviation column", "x": "Abbreviation column # Meanings are plain-language aids; verify before quoting Short form Full form One-line meaning PYQ Previous Years' Questions Questions UPSC has already asked IAS Gurukul Source institute of this handout Not a Sarrthi handout"}, {"c": "9", "n": "R.K. MertonHigh priority", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test: redraw the chapter map"}, {"c": "9", "n": "R.K. MertonHigh priority", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards Mains answer skeletons One for each Mains PYQ quoted in the handout. Tap to open; try the answer first. 2025 · 10 marks · Can Merton's reference group theory be relevant in understanding identity making in digital world? E… Question. Can Merton's reference group theory be relevant in understanding identity making in digital world? Explain Intro: name R.K. Merton and state the central idea in one line (see The story first). Body: build the answer from the notes under: Reference Groups; Reference Group Selection Process; Relative Deprivation. Close: finish with the matching criticisms section and a one-line judgement. 2023 · 10 marks · Is reference group theory a universally applicable model? Elucidate. Question. Is reference group theory a universally applicable model? Elucidate. Intro: name R.K. Merton and state the central idea in one line (see The story first). Body: build the answer from the notes under: Reference Groups; Reference Group Selection Process; Relative Deprivation. Close: finish with the matching criticisms section and a one-line judgement. 2022 · 20 marks · Critically examine how Durkheim and Merton explicate Anomie. Question. Critically examine how Durkheim and Merton explicate Anomie. Intro: name R.K. Merton and state the central idea in one line (see The story first). Body: build the answer from the notes under: 6. Solutions Suggested; R.K. Merton’s Theory of Deviance. Close: finish with the matching criticisms section and a one-line judgement. 2021 · 10 marks · With suitable examples, explain how conformity and deviance coexist in a society as propounded by R.… Question. With suitable examples, explain how conformity and deviance coexist in a society as propounded by R.K. Merton. Intro: name R.K. Merton and state the central idea in one line (see The story first). Body: build the answer from the notes under: R.K. Merton’s Theory of Deviance; Modes of Individual Adaptation; Conformity and Deviance. Close: finish with the matching criticisms section and a one-line judgement. 2020 · 20 marks · What are the reactions of R.K Merton to the functionalism of social anthropologists? Bring on the li… Question. What are the reactions of R.K Merton to the functionalism of social anthropologists? Bring on the limitations of latent functions. Intro: name R.K. Merton and state the central idea in one line (see The story first). Body: build the answer from the notes under: Manifest and Latent Functions; Merton’s Criticisms of Classical Functionalism; 1. Postulate of Universal Functionalism. Close: finish with the matching criticisms section and a one-line judgement. 2019 · 20 marks · How according to Merton, are deviant subcultures generated? Question. How according to Merton, are deviant subcultures generated? Intro: name R.K. Merton and state the central idea in one line (see The story first). Body: build the answer from the notes under: R.K. Merton’s Theory of Deviance; Modes of Individual Adaptation. Close: finish with the matching criticisms section and a one-line judgement. 2019 · 10 marks · What according to Merton, is the different between ‘unanticipated consequences’ and ‘latent function… Question. What according to Merton, is the different between ‘unanticipated consequences’ and ‘latent functions’? Give examples to elaborate. Intro: name R.K. Merton and state the central idea in one line (see The story first). Body: build the answer from the notes under: Manifest and Latent Functions. Close: finish with the matching criticisms section and a one-line judgement. 2016 · 20 marks · Analyse the manifest and latent functions of ‘security of the tenure of the bureaucrats’ in the ligh… Question. Analyse the manifest and latent functions of ‘security of the tenure of the bureaucrats’ in the light of Merton’s theory. Intro: name R.K. Merton and state the central idea in one line (see The story first). Body: build the answer from the notes under: Manifest and Latent Functions; Dysfunctions. Close: finish with the matching criticisms section and a one-line judgement. 2014 · 10 marks · Using Merton’s Concept of ‘manifest’ and latent functions, explain the persistence of corruption in … Question. Using Merton’s Concept of ‘manifest’ and latent functions, explain the persistence of corruption in India Society? Intro: name R.K. Merton and state the central idea in one line (see The story first). Body: build the answer from the notes under: Manifest and Latent Functions; Dysfunctions. Close: finish with the matching criticisms section and a one-line judgement. 2014 · 10 marks · How could one use Merton’s concept of deviance to understand the traffic problems in urban area? Question. How could one use Merton’s concept of deviance to understand the traffic problems in urban area? Intro: name R.K. Merton and state the central idea in one line (see The story first). Body: build the answer from the notes under: R.K. Merton’s Theory of Deviance; Modes of Individual Adaptation; Conformity and Deviance. Close: finish with the matching criticisms section and a one-line judgement. 2014 · 10 marks · How can we use reference group theory to understand the fashion in Society? Question. How can we use reference group theory to understand the fashion in Society? Intro: name R.K. Merton and state the central idea in one line (see The story first). Body: build the answer from the notes under: Reference Groups; Reference Group Selection Process; Relative Deprivation. Close: finish with the matching criticisms section and a one-line judgement. Previous Talcott Parsons Next G.H. Mead Personal study notes built from: IAS Gurukul · Sociology Optional handout on R.K. Merton (not a Sarrthi IAS handout). Only the handout facts are used; memory aids are labelled own. Copyright belongs to the teacher or institute; keep this private."}, {"c": "10", "n": "G.H. MeadHigh priority", "id": "chapter-map", "t": "Chapter map", "x": "Chapter map # Map Outline Mead Self Reflexive Social product Stages Preparatory Play Game Generalised other Community attitudes Full selfhood I and Me Me: norms I: creativity Symbolic interactionism Meanings Blumer Criticisms Structure Unconscious Biology"}, {"c": "10", "n": "G.H. MeadHigh priority", "id": "lens", "t": "Exam lens", "x": "Exam lens # Exam lens Priority: High. Mains PYQs quoted: 2013, 2014, 2015, 2018, 2019, 2020, 2022, 2024. Prelims: not asked (Mains optional). Mains hooks 8 Mains PYQs quoted in the handout, 2013-2024: self and generalised other (4), 'I' and 'Me' (1), twin-born (1), symbolic interactionism (2). Short, definitional questions (10 marks) dominate: be ready with stages, generalised other, I and Me. One question links Mead to gender identity: use the stages and role-taking. Mead shows that society lives inside us as the 'me' and changes through the 'I'. Every answer needs the stages and the generalised other."}, {"c": "10", "n": "G.H. MeadHigh priority", "id": "story", "t": "The story first", "x": "The story first # The story first The self is not born, it is made in interaction. Children copy, play roles, then take the attitude of the whole community (the generalised other); the self has a social 'me' and a creative 'I', and self and society are twin-born. 1. Self is reflexive and social. George Herbert Mead (1863-1931) taught at the University of Chicago. For him the self is the capacity to see and judge oneself from the standpoint of others. It is not innate: it emerges through social interaction, which is why only humans have it. His ideas were compiled after his death in Mind, Self and Society. *→ How does a child acquire it?* 2. Three stages. Preparatory stage (birth to 2-3 years): imitation without meaning. Play stage (2-3 to 5-6): taking the role of significant others such as parents. Game stage (5-6 onwards): organised games and the generalised other, the organised attitudes of the wider community; full selfhood is attained. *→ The self then keeps changing through role-taking.* 3. I and Me. The 'me' is the internalised attitudes and norms of society: social control, conformity, stability. The 'I' is the spontaneous, creative response: innovation and change. Social life is their continuous interaction. *→ Meanings make this possible, through symbols.* 4. Symbolic interactionism. Mead's ideas underlie symbolic interactionism, a term coined by his student Herbert Blumer. Three assumptions: people act on meanings; meanings arise from interaction; meanings are modified in interaction. Mind is an inner conversation and self and society are twin-born. *→ Now the critics.* 5. Criticisms. Structuralists say it overstates individual agency and ignores structure; psychoanalytic critics say it overstates conscious communication; it neglects large-scale processes (capitalism, globalisation) and biological or innate factors. Cast: Mind, Self and Society = compiled after his death · Herbert Blumer = student who coined symbolic interactionism · Generalised other = organised attitudes of the wider community"}, {"c": "10", "n": "G.H. MeadHigh priority", "id": "terms", "t": "In simple words", "x": "In simple words # The self is reflexive and social : it emerges through interaction, not at birth. Three stages: preparatory (imitation), play (significant others), game (generalised other). The self has a social 'me' (norms) and a creative 'I' (innovation); self and society are twin-born . Mead's ideas are the base of symbolic interactionism (term coined by Blumer). Critics: ignores structure, the unconscious, large-scale change and biology. Term In plain words Self Capacity to view and evaluate oneself from the standpoint of others. Significant others Parents, teachers, siblings whose roles children take in the play stage. Generalised other Organised attitudes, expectations and norms of the wider community. Role-taking Imagining oneself in the position of another to see how they see you. The 'me' Internalised attitudes and norms; conformity and stability. The 'I' Spontaneous, creative response; source of change. Symbolic interactionism Social life is built from shared meanings that arise in interaction. Mind The process of thinking, an inner conversation."}, {"c": "10", "n": "G.H. MeadHigh priority", "id": "1-g-h-mead", "t": "1 · G.H. Mead", "x": "1 · G.H. Mead # Handout only Picture hook George Herbert Mead. (handout p.3) George Herbert Mead (1863–1931) was an American philosopher and social psychologist closely who taught at the University of Chicago. Trained in philosophy and psychology, Mead made a seminal contribution to sociology by developing a social theory of the self and society , emphasizing that individual identity emerges through social interaction. Although he did not publish a major book during his lifetime, his ideas were compiled posthumously in Mind, Self and Society . Mead is regarded as the founder of the symbolic interactionist tradition , as his work systematically explained how symbols, language, and role-taking shape social action. His ideas provided a powerful micro-level alternative to structural and positivist approaches and continue to influence sociology, social psychology, and interactionist studies."}, {"c": "10", "n": "G.H. MeadHigh priority", "id": "2-self-and-identity", "t": "2 · Self and Identity", "x": "2 · Self and Identity # Handout only Picture hook Friends laughing together. Hook for the game stage and the generalised other. (handout p.6) Picture hook Child with a doll. Hook for the play stage. (handout p.4) Picture hook Adult and infant: imitation, the first step of self-formation. Hook for the preparatory stage. (handout p.4) According to Mead, the self refers to the capacity of human beings to view, analyse, and evaluate themselves from the standpoint of others . The self is essentially reflexive , meaning that the individual can become both the subject and the object of his own awareness. This reflexivity distinguishes humans from animals and inanimate objects. The self is not innate. Infants or specific body parts do not possess a self. The self emerges gradually through social interaction . The self develops only in society. As individuals grow and interact with others, they acquire the ability to see themselves as others see them, thereby forming a self-concept. Mead explained that the self develops through a sequence of stages during socialisation: 1. Preparatory Stage : From birth to around 2–3 years of age, children imitate the gestures and actions of others without understanding their meaning. These imitative acts are mechanical and do not yet involve role-taking or self-awareness. An infant imitating his mother Play Stage : Between approximately 2–3 and 5–6 years, children begin to engage in play-acting. They take on the roles of significant others such as parents, teachers, or siblings. Through role-play, children become aware of the distinction between themselves and the roles they enact, thereby beginning to develop a sense of self. A girl child plays with a doll. She acts like her mother while doing so. 2. Game Stage : From around 5–6 years onwards, children participate in organised games involving multiple players and formal rules. At this stage, they develop the concept of the generalised other , which represents the organised set of attitudes of the wider community. The child learns to see himself from the collective standpoint of others, and it is at this stage that full selfhood is attained . Children playing the game of cricket. We develop a ‘self’ during this stage The concept of the generalised other is central to Mead's theory of self-development. It refers to the organised set of attitudes, expectations, values, and norms of the wider community. By internalising the perspective of the generalised other, individuals learn to evaluate their own behaviour according to socially accepted standards. The self emerges when an individual can view himself from the standpoint of the larger community rather than merely from the perspective of particular significant others. Thus, the development of self is inseparable from the internalisation of the generalised other. Through participation in complex social situations, individuals learn to evaluate their own behaviour from others’ perspectives, which enables coordinated social life. The self is thus, fundamentally a product of socialisation . However, the self is dynamic and ever-evolving , changing throughout one’s life as social interactions change. The self continually evolves throughout life during social interaction situations through the process of role-taking . In social interaction situations, the individual takes up the role of the counter actor or counteractors to assess how they perceive him. Self is therefore shaped by what an individual thinks others think of him. Role-taking involves imaginatively placing oneself in the position of others to understand their expectations and meanings. Through role-taking, individuals learn to observe themselves from others’ viewpoints. Mead argued that the self can develop only when an individual can treat himself as an object, which requires the ability to adopt the perspective of others. Unlike deterministic theories of socialisation, Mead argued that individuals are active participants in their own socialisation. Through role-taking, interpretation, and interaction, people not only absorb social norms but also actively construct their self. Communication and Symbolic Interactionism Mead distinguished between conscious and unconscious communication in social interaction. Conscious communication takes place through the exchange of significant symbols , especially language . A symbol becomes significant when it evokes the same response in the person using it as it is intended to evoke in others. Language provides a shared system of meanings and is central to human interaction. Symbols are central to human interaction. According to Mead, symbols do not merely stand for objects but define them in particular ways and suggest appropriate responses. Symbols are socially created and derive their meaning from shared understanding. Language, as the most complex symbolic system, enables communication, thought, and social organisation. Unconscious communication occurs through gestures, facial expressions, and body language, often without deliberate intention. For Mead, conscious communication through the exchange of shared symbols is the more deliberate and decisive form of communication in human societies. Human social interaction is through the exchange of symbols Mead’s ideas form the basis of symbolic interactionism , a term later coined by his student Herbert Blumer . Symbolic interactionism emphasises that social life is constructed through shared meanings arising from interaction. The symbolic interactionist perspective rests on three core assumptions: 1. Individuals act toward objects and people based on the meanings they attach to them. 2. These meanings arise out of social interaction. 3. Meanings are not fixed and are continually modified in interaction situations. The ‘I’ and the ‘Me’ Mead conceptualised the self as consisting of two interrelated components: the ‘I’ and the ‘Me’. The ‘me’ represents the internalised attitudes, expectations, and norms of society. It reflects the organised set of responses to generalised others. The me embodies social control within the individual, and promotes conformity and stability. The ‘I’ represents the spontaneous, creative, and unpredictable response of the individual to societal expectations. It is the source of innovation and change and is never fully controlled by society. Social life is shaped by the continuous interaction between the ‘I’ and the ‘Me’. Mind, Self, and Society In Mead’s writings, mind refers to the process of thinking, which he defined as an inner conversation. Contrary to conventional thinking that viewed mind as producing self and society, Mead argued for a reciprocal relationship between self and society. Self and society are “twin-born” , each shaping and sustaining the other. Mead viewed the self as essential to becoming fully human. Self-consciousness enables thinking, planning, and deliberate action. Thinking is made possible by language and symbols. By internalising societal expectations through the generalised other, individuals regulate their conduct and contribute to social order. Evaluation of Mead Mead was a pioneer of symbolic interactionist approach . Along with C.H. Cooley and John Dewey , Mead is considered one of the founders of the symbolic interactionism. The interactionist approach developed by Mead provided a systematic critique of the macro approaches in sociology and also the positivist tradition; by emphasising meaning, interaction, and agency. Mead was an important faculty at the University of Chicago, which was the most prominent centre of sociological research at the time. He taught and trained some of the finest minds in the symbolic interactionist tradition, including Herbert Blumer. The concept of self and the important role played by significant symbols highlighted by Mead constitute the basis for symbolic interactionist writings to this day. He not only influenced the discipline the sociology but also psychology and brought the two disciplines closer. Memory aid (own) · Stages of the self P P G Pupils Play Games. P = Preparatory stage; P = Play stage; G = Game stage. The stages form a sequence by age, so the order is kept. (order kept)"}, {"c": "10", "n": "G.H. MeadHigh priority", "id": "3-criticisms-of-g-h-mead", "t": "3 · Criticisms of G.H. Mead", "x": "3 · Criticisms of G.H. Mead # Handout only 1. Structuralists criticise symbolic interactionism for overemphasising the individual agency; and downplaying the role of structural constraints. 2. Critics, particularly those of the psychoanalytic traditions, argue that Mead placed excessive emphasis on conscious communication and role-taking. Unconscious motives, emotions, and psychological processes may play a much greater role in human behaviour than Mead acknowledged. 3. Mead's theory focuses primarily on face-to-face interactions and everyday social situations. Critics argue that it pays insufficient attention to broader social processes such as capitalism, globalization, and large-scale social change. 4. Mead viewed the self primarily as a social product emerging through interaction. Critics argue that he paid insufficient attention to biological, genetic, and innate psychological factors that may also shape personality and behaviour. Despite the criticisms levelled against him, Mead remains one of the most influential thinkers in sociological theory. His analysis of the self as a social product, emerging through interaction, language, and role-taking, fundamentally reshaped our understanding of the relationship between individual and society. Mead’s work laid the intellectual foundations of symbolic interactionism and offered a powerful corrective to deterministic and overly structural explanations of human behaviour. Even though his theory underplays structural constraints and unconscious processes, its emphasis on meaning, agency, and everyday interaction continues to provide invaluable insights into soc
