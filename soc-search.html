s. Capital is the central productive force; the bourgeoisie and the proletariat are antagonistic classes; workers are free but sell their labour power; production is for profit and exchange; competition is relentless; crises recur; the worker is alienated. *→ Alienation is the human cost.* 4. Alienation. In the 1844 Manuscripts Marx shows the worker alienated from the product, from the act of production, from fellow workers and society, and from self (species essence). Lukacs later develops reification from commodity fetishism. *→ Alienation breeds the conflict that moves history.* 5. Class struggle and the end of capitalism. The Communist Manifesto (1848, with Engels) says history is a history of class struggle. Capitalism produces its own gravediggers: the petite bourgeoisie sink into the proletariat, workers concentrate in factories, and pauperisation grows, until revolution and communism: classless, collectively owned, abundant. *→ Then weigh the critics and the defenders.* Cast: Engels = co-author of The Communist Manifesto; stated the three laws of dialectics · Lukacs = History and Class Consciousness; reification · Raymond Aron = called Marxism the opium of the intellectuals · Fukuyama = The End of History"}, {"c": "5", "n": "Karl MarxHigh priority", "id": "terms", "t": "In simple words", "x": "In simple words # Marx says material production, not ideas, moves history (historical or dialectical materialism). History has five stages ; each has a mode of production (productive forces + relations of production), with the economy as base and law, religion and state as superstructure . Under capitalism the worker is alienated (product, process, fellow workers, self) and class struggle between bourgeoisie and proletariat drives change towards communism . Critics: economic determinism, ignores caste, patriarchy and agency, failed predictions, Soviet collapse. Defenders: rising inequality and the gig economy show his relevance. Term In plain words Historical materialism Material conditions of production drive social change; also called dialectical materialism. Productive forces Means of production (tools, machines, resources) plus labour power. Relations of production The social relations that arise in production, such as owner and worker. Base The economy: forces and relations of production. Superstructure Family, law, religion, education, culture, media, state and politics. Bourgeoisie Owners of the means of production in capitalism. Proletariat Workers who sell their labour power for wages. Alienation The worker's estrangement from product, production process, fellow workers and self. Commodity fetishism Social relations appear as relations between things; Lukacs builds reification on it. Pauperisation Growing impoverishment of the proletariat relative to the bourgeoisie. Petite bourgeoisie Small traders and independent producers who sink into the proletariat."}, {"c": "5", "n": "Karl MarxHigh priority", "id": "1-karl-marx", "t": "1 · Karl Marx", "x": "1 · Karl Marx # Handout only Picture hook Karl Marx. (handout p.3) Karl Marx (1818-1883) was a German philosopher whose ideas profoundly shaped modern sociology, political theory, and economic thought. His writings, including The Communist Manifesto and Das Capital, fundamentally changed how scholars study society, economy, history, inequality and power. Karl Marx (1818-1883) is one of the most influential figures in modern times"}, {"c": "5", "n": "Karl MarxHigh priority", "id": "2-historical-materialism", "t": "2 · Historical Materialism", "x": "2 · Historical Materialism # Handout only Marx, originally part of the Young Hegelian group, was influenced by Hegel but also critically rejected many of his ideas, famously stating that he \"put Hegel on his head.\" Marx replaced Hegel’s philosophical idealism with materialism, arguing that material conditions - not abstract ideas - are foundational in shaping human society and consciousness. Marx rejected the idea that ideas are the drivers of history. According to him, material reality is primary , and ideas are secondary, shaped by the material conditions of existence. In simple terms, human beings must first secure their material survival , and only then engage in other forms of social, cultural, or intellectual life. The production of material goods is the primary historical act. Historical materialism focuses primarily on economic factors , arguing that material conditions drive historical change . As the system of production evolves, the rest of society - its institutions, values, culture, and politics - changes with it. Thus, “it is not the consciousness of man that determines his being, but his social being that determines his consciousness.” Marx traced the transformation of society across historical epochs and linked changes in economy to transformation in wider society. Marx did not reject Hegel’s dialectical method; instead, he applied it to material reality, rather than ideas. Hence his theory is called dialectical materialism or historical materialism. Engels later summarised the operation of dialectics in three basic laws."}, {"c": "5", "n": "Karl MarxHigh priority", "id": "3-laws-of-dialectics-as-outlined-by-engels", "t": "3 · Laws of Dialectics (as outlined by Engels)", "x": "3 · Laws of Dialectics (as outlined by Engels) # Handout only 1. Law of unity and conflict of opposites: Every stage of society contains opposing forces or contradictions, and these conflicts drive change. 2. Law of passage of quantitative change into qualitative change: Gradual quantitative changes eventually reach a tipping point, resulting in a sudden, qualitative transformation. 3. Law of negation of negation: Every society is replaced by a new social organization, which in turn is superseded, producing progress through successive transformations. Marx applied the dialectical method to the material world, emphasising that history progresses through contradictions in economic structure and their eventual resolution. Marx elaborated historical materialism in works such as A Contribution to the Critique of Political Economy. The theory explains social transformation through changes in the system of production . It is called historical because Marx traced the evolution of human society from one stage to another over time, and materialist because it interprets social change in terms of material/economic conditions. Human history is viewed as progressive, driven by improvements in production technology which alter the economy and subsequently transform social structure. Marx and Engels considered their theory scientific , grounded in the empirical study of material conditions. They argued that the economy forms the base of society. As the economy evolves, changes occur in other spheres of social life. Thus, the development of productive forces propels transformation in society as a whole."}, {"c": "5", "n": "Karl MarxHigh priority", "id": "4-stages-of-human-history-according-to-mar", "t": "4 · Stages of Human History According to Marx", "x": "4 · Stages of Human History According to Marx # Handout only 1. Primitive Communism: Characterised by rudimentary technology, hunting-and-gathering, minimal surplus, and no private property. Society is egalitarian and organised around communal subsistence. 2. Ancient Slave Society: With the development of agriculture, surplus appears, leading to private property, class division, and slavery. Society is divided into masters (haves) and slaves (have-nots). 3. Feudal Society: Technological improvement leads to greater agricultural production. Society is divided into feudal lords (haves) and serfs (have-nots). 4. Capitalist Society: Marked by industrialisation, mechanised production, and large surplus production. Society is divided into bourgeoisie (owners) and proletariat (workers). 5. Communism: A classless, egalitarian society characterised by advanced technology, collective ownership of resources, abolition of private property, and elimination of exploitation. Human needs are met, and social harmony prevails. The relationship between the haves and have-nots is one of antagonistic cooperation - mutual dependence combined with conflict of interests. In all class societies, the central conflict is between those who own the means of production and those who do not, and history advances through struggle between these classes. Historical materialism offers a scientific explanation of social change rooted in economic forces. Marx argued that changes in the mode of production transform the economy, leading to shifts in social structure, culture, and institutions. Human history, therefore, is the story of developing productive forces, successive class conflicts, and movement towards a classless society. Marx’s theory remains influential because it established a powerful framework for understanding history, power, inequality, and social transformation. Memory aid (own) · Five stages of history P A F C C Paying Attention Fetches Class Consciousness. P = Primitive communism; A = Ancient slave society; F = Feudal society; C = Capitalist society; C = Communism. The stages are a time sequence, so the order is kept. (order kept)"}, {"c": "5", "n": "Karl MarxHigh priority", "id": "5-mode-of-production", "t": "5 · Mode of Production", "x": "5 · Mode of Production # Handout only In Marxian theory, the mode of production refers to the specific way in which the production and distribution of goods are organised in a society. It reflects both the material conditions under which people produce and the social relations that emerge from this process. Each historical epoch is characterised by a distinct mode of production, such as the ancient slave mode, feudal mode, and capitalist mode of production. Marx argued that understanding any society requires understanding its mode of production because it shapes not only economic life but also social relations, institutions, and culture. Every mode of production is defined by its productive forces . These refer to all the inputs involved in the process of production. Marx divides them into two components: 1. Means of Production : These are all inputs other than labour power used in production - tools, machines, technology, natural resources, factories, raw materials, land, etc. 2. Labour Power : This refers to the human capacity to work - skills, physical strength, knowledge, and creativity. Thus, forces of production = means of production + labour power. As productive forces develop over time - through technological progress, better tools, changing skills - the mode of production itself evolves. Marx emphasised that production is a social enterprise. Human beings cannot produce in isolation; they must enter into specific social relationships in order to organise and carry out production. These are known as the relations of production . Relations of production include: The relationships between people involved in production (e.g., master-slave, lord-serf, capitalist-worker), and The relationships between people and the productive forces (i.e., who controls the means of production, who owns resources, who works with them). These relations determine patterns of ownership, control, responsibility, and the distribution of surplus. For Marx, class structure arises directly from the relations of production. Every mode of production consists of two interrelated components: 1. Base (Infrastructure): The economy - i.e., the organisation of production, distribution, class relations, forces and relations of production - forms the foundation of society. 2. Superstructure :All non-economic institutions and practices - family, law, religion, education, culture, media, state and politics - constitute the superstructure. According to Marx, the relationship between base and superstructure is twofold: 1. Base shapes the superstructure : Changes in the economic base (e.g., new technologies, new class relations) lead to changes in social, political and cultural life. For instance, industrial capitalism gave rise to modern factories, bureaucratic states, individualism, new legal systems, and new family structures. 2. Superstructure stabilises and legitimises the base : Institutions in the superstructure promote ideas and norms that justify and maintain existing economic arrangements. For example, religion encourages acceptance of inequality and suffering - leading Marx to call religion the “opium of the masses.” Similarly, education justifies class differences and helps maintain the status quo. Thus, the superstructure both emerges from and reinforces the economic base. Marx identified several historical modes of production which succeed one another, each corresponding to specific productive forces and relations of production: Primitive Communal Mode (egalitarian, no private property) Ancient Slave Mode (masters and slaves) Feudal Mode (lords and serfs) Capitalist Mode of Production (bourgeoisie and proletariat) Communist Mode (egalitarian) The concept of mode of production is central to Marx’s understanding of society. It highlights how material production forms the foundation of social life, how economic structures shape social institutions, and how changes in productive forces lead to broader social transformations. By examining forces of production, relations of production, and the base-superstructure relationship, Marx provides a comprehensive framework for explaining historical change and the dynamics of class society."}, {"c": "5", "n": "Karl MarxHigh priority", "id": "6-capitalist-mode-of-production", "t": "6 · Capitalist Mode of Production", "x": "6 · Capitalist Mode of Production # Handout only Picture hook Cartoon: wealth created by labour, wages handed back by the capitalist class. Hook for surplus value. (handout p.7) The capitalist mode of production is the dominant economic system analyzed by Karl Marx in Das Kapital(1867). Marx examines capitalism as an economic arrangement and a historical stage defined by a specific combination of productive forces and relations of production. Capitalism, in Marx’s view, marks a stage where production is highly developed, markets are fully expanded, and society is divided into antagonistic yet interdependent classes. Marx considered capitalism both dynamic and deeply exploitative, driven by contradictions inherent in its class structure. Marx considered capitalism as being characterized by exploitation of workers by capitalists Main Features of the Capitalist Mode of Production: 1. Salience of Capital In capitalism, capital becomes the most important productive force and is best understood as money invested in economic activity with the intention of generating additional money, so that production is directed towards the expansion of capital rather than the satisfaction of human needs. 2. Antagonistic Classes Capitalism is characterized by two major social classes - the bourgeoisie and the proletariat - whose relationship is one of antagonistic cooperation, since while both depend on each other for production, their class interests are mutually incompatible. The dependence is unequal as workers rely on capitalists for survival whereas capitalists rely on workers for profit, resulting in an exploitative oppressor-oppressed relationship. 3. Circuit of Capital The capitalist economy operates through the circuit M → C → M′ where money is advanced to purchase commodities which are then sold to obtain more money than what was originally invested, making the expansion of money the primary aim of production and defining the essential logic of capitalism. 4. Market-Centric Economy All production in the capitalist mode takes place primarily for exchange in the market, with every input procured through the market and every output directed back into it, thereby making the market the central mechanism coordinating economic life and assigning value to goods, labour, and resources. 5. Free Workers The workers in capitalist society are legally free individuals who can sell their labour power in the labour market for wages. However, this freedom is largely formal because lacking control over the means of production they are compelled to work for wages in order to survive. 6. Private Ownership The means of production in capitalism are privately owned by the bourgeoisie, and this private ownership enables the capitalist class to control the labour process, direct production, appropriate surplus value, and maintain structural dominance over the working class. 7. Universal Commodification Capitalism extends monetary valuation to almost all aspects of life and turns goods, services, time, skills, and even forms of human activity into commodities that can be bought and sold, thereby creating a society where nearly everything is available through the market. 8. Profit as the Driving Force The principal motive behind capitalist production is the maximization of profit, which Marx explains as arising from the appropriation of surplus value produced by workers, because while labour generates all value, capital appropriates a part of this value without equivalent compensation. A newspaper cartoon depicting the appropriation of labour by capitalists For Marx, profit represents the surplus value of labour appropriated by the capitalists; since capital contributes no value of its own, which makes the extraction of surplus labour a structurally exploitative process. 9. Relentless Competition Capitalists operate in a fiercely competitive environment. To survive in the market, each capitalist must constantly adopt new machinery, improve productivity, reduce labour costs, and reconfigure the labour process. The cut-throat competition compels every capitalist to revolutionise the means of production, making technological advancement continuous, rapid, and often disruptive. 10. Periodic crises Capitalism is inherently unstable and experiences periodic cyclic crises because goods are produced for profit rather than need, leading to mismatches between production and consumption and resulting in recessions, unemployment, and economic downturns. 11. Alienation Capitalism leads to the alienation of the worker as under conditions of wage labour, the worker experiences a deep sense of powerlessness and dissatisfaction. The capitalist mode of production, as described by Marx and Engels, is simultaneously the most productive and the most exploitative economic system in human history, marked by private ownership, wage labour, market dependence, class antagonism, surplus extraction, and alienation. While it unleashes extraordinary technological and productive capacities, it also generates crises, inequalities, and contradictions that Marx believed would ultimately undermine it."}, {"c": "5", "n": "Karl MarxHigh priority", "id": "7-alienation", "t": "7 · Alienation", "x": "7 · Alienation # Handout only Alienation is a central concept in Karl Marx’s theory of work and is elaborated most clearly in his Economic and Philosophic Manuscripts of 1844. Marx contends that the worker in capitalist society does not feel content and remains unhappy at work, because labour is not an expression of his essential being but an activity performed under compulsion. Work in capitalism drains the worker of energy, fragments his physical and mental capacities, and becomes a source of misery rather than self-expression. Alienation literally comes from the Latin word alienus , meaning “stranger,” and it refers to the worker’s estrangement from his work and the work environment. Marx says the worker “only feels himself outside his work, and in his work feels outside himself; at home when he is not working, and when he is working he is not at home.” At work, the worker is miserable and drains his body and mind. Alienation arises because the worker has no control over the production process, no ownership of the product, and no freedom of creative expression. His labour becomes a commodity that is bought and sold on the market like any other object, reducing his humanity to an economic unit of exchange. For the worker, then, labour is an exhausting and degrading activity. Alienation: Factory workers in capitalism are over-worked, exhausted, and dissatisfied Marx identifies four dimensions of alienation in capitalist society: 1. Alienation from the product In capitalism, the worker is estranged from the product of his labour; which is owned and appropriated by the capitalist rather than the worker who created them. The product stands before him as something “foreign” or “strange.” Moreover, due to intense specialization, each worker contributes only a fragment of the final good, making it impossible for him to recognise himself in the product. He neither owns it nor identifies with it, and therefore the product becomes an external force that confronts the worker rather than an expression of his creativity. 2. Alienation from the production process The worker is also alienated from the act of production itself. The entire process - its pace, techniques, tools, technologies, and division of tasks - is rigidly controlled by the capitalist. The worker has no say in organising work, setting objectives, or deciding how production should proceed. Labour is reduced to mechanically following instructions. Since work is not chosen, directed, or shaped by the worker, the production process becomes an oppressive force rather than a fulfilling human activity. 3. Alienation from fellow workers and society Capitalism divides workers through hierarchies such as skilled, semi-skilled, and unskilled categories, and through competitive labour markets that pit individuals against one another. As a result, workers do not see each other as members of a collective class but as competitors, rivals, superiors, or subordinates. Social relationships become transactional and mediated by money, limiting the development of deep, meaningful human bonds. Human beings interact with each other as economic units rather than full persons, preventing solidarity, cooperation, and connection. 4. Alienation from self According to Marx, to labour and the conscious transformation of nature is the ‘species essence’ of human beings. Work has the potential to be the most fulfilling of all human activities, expressing creativity, individuality, and human potential. However, in capitalism the worker is estranged from his own essence because his labour becomes a forced, external, and demeaning activity. Since he cannot identify with either the product or the process, work becomes mere drudgery done for survival, not an expression of his human capacities. The worker therefore becomes alienated from himself - his creativity, his individuality, and his humanity. Alienation reaches its peak in capitalist society, where labour is commodified, production is controlled by capitalists, and workers are reduced to instruments of profit maximisation. The notion of alienation together demonstrate how capitalism fragments human personality, distorts social relations, and prevents individuals from realising their creative and human potential. Marx believed that overcoming capitalist production relations would eliminate alienation and restore labour as a fulfilling, creative, and humanising activity. Related Concepts: Commodity fetishism is a concept developed by Karl Marx in Capital, Volume I.It means that under capitalism, social relations between people take the form of relations between things. In a capitalist market, commodities appear to possess value in themselves , as if value naturally arises from the object, rather than from the human labour that produced it. This leads people to focus on commodities and prices while overlooking the social processes and power relations behind their production. Marx argued that labour is the real source of value, but in capitalism this labour becomes invisible . Workers sell their labour power for wages, and the products of their labour confront them as independent objects with market prices. As a result, exploitation is concealed, and relations between workers and capitalists appear as simple, equal exchanges in the market. Social relations are thus reduced to monetary transactions between commodities. Marx used the term “fetishism” by drawing an analogy with religion. Just as religious objects are believed to have supernatural powers created by humans themselves, commodities are believed to have value and power independent of human labour. People forget that they themselves created these commodities and the value attached to them. Through commodity fetishism, capitalism produces false consciousness. Inequality, domination, and exploitation appear as natural outcomes of the market rather than as products of specific social relations. People begin to judge one another by what they own rather than by their human qualities, and consumption becomes central to social status and identity . Reification refers to the process by which social relations, human activities, and abstract ideas come to be perceived as things - fixed, objective, and independent of human agency. The Marxist concept is developed by Georg Lukacs in History and Class Consciousness. Reification literally means “ thing-ification .” In capitalist society, reification occurs when relationships between people take the form of relationships between objects . Human labour, creativity, and social cooperation appear as properties of commodities, money, or institutions rather than as outcomes of human action. So, people begin to experience society as something that dominates them rather than something they actively create. The concept of reification builds upon Marx’s idea of commodity fetishism . Reification extends its logic beyond commodities to institutions like the state, bureaucracy, law, and even time and labour, which are treated as measurable, calculable things rather than lived human experiences. Lukacs argued that under capitalism, fragment human activity is fragmented into isolated tasks. Workers are reduced to mechanical functions, and their labour becomes an object governed by external rules. This leads to alienation, loss of creativity, and a diminished sense of human freedom. People come to accept existing social arrangements as inevitable and immutable. Inequality, exploitation, and domination appear as technical or administrative necessities rather than as social choices. In essence, reification explains how capitalism transforms dynamic human relations into rigid, object-like structures. It is a key concept in Marxist social theory for understanding alienation, domination, and the loss of human agency in modern society. Memory aid (own) · Four forms of alienation P P F S People Produce For Survival. P = from the Product; P = from the Production process; F = from Fellow workers and society; S = from Self (species essence). The handout numbers the four forms 1-4, so the order is kept. (order kept)"}, {"c": "5", "n": "Karl MarxHigh priority", "id": "8-class-struggle", "t": "8 · Class Struggle", "x": "8 · Class Struggle # Handout only Picture hook Cartoon: workers united, the hand that will rule the world. Hook for class consciousness. (handout p.10) Marx places class struggle at the centre of human history . In The Communist Manifesto (1848), co-authored with Friedrich Engels, Marx famously asserts that “ the history of all hitherto existing societies is the history of class struggles .” In every historical epoch, society is divided into two antagonistic classes - the haves, who control the means of production, and the have-nots , who are dispossessed and exploited. This fundamental conflict of interest renders every social order inherently unstable. Within each mode of production, new productive forces gradually develop inside the womb of the old social structure . These emerging forces continue to grow and refine themselves within the old framework for as long as that framework can accommodate them. However, a stage eventually arrives when these productive forces can no longer expand under the existing relations of production. At that point, the old relations start to act as fetters on further development , blocking the progress of the new system taking shape. It is at this historical juncture that a decisive class struggle breaks out . The rising class - whose interests are aligned with the new productive forces - confronts the entrenched ruling minority. They mobilise the have-nots, challenge the legitimacy of the old order, and overthrow the existing arrangements. Through this decisive struggle, the old mode of production is dismantled and a new one emerges in its place. As illustration, consider the transition from feudalism to capitalism . Elements of capitalist production - such as merchant capital, and early manufacturing in embryonic factories using new technologies - first emerged within a broadly feudal society. These new productive forces continued to develop gradually inside the feudal structure. But with time, feudal relations of production - based on serfdom, hereditary privilege, and rigid hierarchy - began to restrict the further expansion of capitalist forces. At that critical point, a decisive class struggle unfolded between the rising bourgeoisie and the declining feudal lords. The bourgeoisie mobilised the dispossessed classes, challenged the political dominance of feudal lords, and eventually replaced feudalism with capitalism, inaugurating a new (capitalist) mode of production. Marx views class struggle not as a peripheral phenomenon but as the driving force of historical change . Each mode of production contains internal contradictions that eventually give rise to a new class, a new struggle, and ultimately a new social order. The next logical step in this framework is to examine how capitalism itself contains the seeds of its transformation into communism."}, {"c": "5", "n": "Karl MarxHigh priority", "id": "9-transformation-from-capitalism-to-commun", "t": "9 · Transformation from Capitalism to Communism", "x": "9 · Transformation from Capitalism to Communism # Handout only Marx argues that the destruction of capitalism and its transformation into communism is not a moral ideal or a political dream , but a scientific prediction based on the objective contradictions inherent in capitalist society. In Das Kapital, Marx contends that capitalism contains within itself the forces that will inevitably lead to its collapse. Marx predicted that workers will unite and overthrow capitalism The two major classes, the bourgeoisie and the proletariat, have fundamental conflicts of interest that cannot be resolved within the capitalist framework. Alongside this, several social and economic processes unfold within capitalism that intensify class conflict and push society toward its revolutionary transition, as follows: 1. De-skilling With continual technological advancement, production becomes increasingly mechanised and simplified. The skills earlier required for different occupations are gradually removed, leaving workers performing routine, fragmented tasks. This process ultimately homogenises the working class , making workers more similar in their objective conditions of life. As differentiation among workers decreases, their capacity for collective organisation and shared identity increases. 2. Petite bourgeoisie will sink into the proletariat Small traders, merchants, and independent producers - the petite bourgeoisie - cannot withstand competition from large capitalist enterprises. As big capital expands, these small property-holders steadily lose their businesses and are pushed downward into wage labour. The petite bourgeoisie historically had a stabilising effect on capitalist society because they embodied traits of both classes. As this intermediate group disappears, class divisions become sharper and the conflict between bourgeoisie and proletariat becomes more stark. 3. Concentration of workers in large-scale production units As industries grow, more and more workers are gathered together in large factories and enterprises. This physical concentration facilitates communication, fosters shared experiences, and nurtures a growing sense of common identity. When thousands of workers labour under the same roof, facing identical exploitation, the conditions become ideal for the development of collective consciousness and organisation. 4. Pauperisation of the proletariat Marx argues that the proletariat becomes increasingly impoverished relative to the bourgeoisie as capitalism advances. The gap between labour and capital widens sharply, leading to intensified deprivation, insecurity, and exploitation. Wealth becomes increasingly concentrated in a small minority of capitalists, while the working-class becomes relatively worse off. This pauperisation magnifies class discontent and strengthens revolutionary tendencies. As these processes unfold, class polarization takes place, with class identities and antagonisms becoming sharp and clear. The two major classes grow more distinct, with an unbridgeable gulf emerging between the haves and the have-nots, the oppressors and the oppressed. The proletariat, initially a class in itself (a class defined merely by its objective position as non-owners of capital), gradually becomes a class for itself , meaning that workers develop true class consciousness . To clarify, false class consciousness is the worker’s mistaken belief that his interests align with the bourgeoisie or that existing inequalities are natural or just; this is eventually replaced by true class consciousness, in which workers recognise their shared interests and common enemy. Once the proletariat becomes a class for itself, it is capable of coordinated revolutionary action. The stage is now set for a bloody proletariat revolution. According to Marx, this revolutionary transition differs fundamentally from earlier class struggles. Historically, class struggles took place between two minorities: one entrenched ruling minority and one rising minority that would become the next ruling class. But the struggle between capitalists and workers is between a ruling minority and a ruled majority. And unlike previous transitions, which merely replaced one class society with another, the proletarian revolution aims to abolish class distinctions altogether and inaugurate a classless, communist society. The proletarian revolution, according to Marx, is followed by a transitional phase known as the dictatorship of the proletariat , also called the socialist stage. This is not a dictatorship in the conventional sense of autocratic rule; rather, it refers to the political supremacy of the working class. In Critique of the Gotha Programme (1875), Marx contends that during this phase, the proletariat capture the state apparatus and takes control of the productive forces through its vanguard. The central task of this stage is to eliminate all remnants of capitalism , both in the economy and in the superstructure. The institutions, laws, norms, ideologies, and political structures that legitimised capitalist exploitation are systematically dismantled so that the old society does not reassert itself. The dictatorship of the proletariat therefore acts as the instrument through which the last traces of capitalist relations are uprooted. Once these vestiges are destroyed and class antagonisms disappear, society transitions to the final stage of human history - communist society. In communism , all productive resources are collectively owned by the entire community. In his various works, such as Critique of the Gotha Programme(1875), and The Communist Manifesto(1848), Marx outlines a broad outline of the communist society. It is a genuinely classless society, free from distinctions of wealth, status, or power. Inequalities rooted in private property no longer exist because private ownership of the means of production has been completely abolished. Communism is marked by highly advanced technology , abundant production, and the end of material scarcity. Production and distribution operate according to Marx’s celebrated principle:“From each according to his ability, to each according to his needs.” In communist society, alienation disappears because work ceases to be a forced, externalised activity and becomes a free, creative expression of human essence. The state withers away , as its historical role was to legitimize and uphold the interests of the ruling class, and it no longer has any function in a classless society. Religion also ceases to exist because, as per Marx, it is rooted in conditions of alienation and exploitation that no longer exist. Human relations become genuinely cooperative, non-hierarchical, and fulfilling. Individuals are no longer confined to narrow occupational specialisations; instead, they contribute their labour freely to the community and develop their full humanity, creativity, and individuality. Marx envisages communism as the culmination of human history, the stage at which the contradictions of previous societies are finally resolved and history comes to an end."}, {"c": "5", "n": "Karl MarxHigh priority", "id": "10-marxism-a-critical-analysis", "t": "10 · Marxism – A Critical Analysis", "x": "10 · Marxism – A Critical Analysis # Handout only Picture hook A mass workers' rally. Hook for collective class action. (handout p.16) Picture hook Lenin addressing a crowd. He led the Bolshevik Revolution and established the USSR (handout). (handout p.14) Picture hook Map of the former USSR republics, numbered. Hook for Marxism in practice. (handout p.13) Karl Marx remains one of the most influential and debated thinkers in social science. His ideas on class, capitalism, and social change have shaped modern sociology, economics, and political movements. At the same time, Marx’s theories have attracted strong criticism for their assumptions, predictions, and implications. An internet meme making fun of Marxism Criticisms of Marxism 1. Marxism is economically deterministic , as it reduces various aspects of social life - law, politics, religion, and culture - to underlying economic base. 2. The theory overemphasizes conflict , portraying history as a class struggle and ignoring cooperation, consensus, and interdependence in society. 3. Marx's claim of universality is criticized , since his historical stages are based on European experiences and fail to account for the diverse trajectories of other societies. 4. Marxism ignores non-class forms of inequality and exploitation , such as caste, patriarchy, racial oppression, and religious discrimination. 5. Marx neglected individual agency , treating people as mere products of structural and historical forces, with no capacity for independent action. 6. Marx reduces the power of ideas and ideologies , treating them as mere reflections of material reality and failing to recognize their role in shaping social change. 7. The predicted proletarian revolution has not occurred , the working class has not risen up as Marx anticipated. 8. Capitalism has evolved into welfare capitalism , incorporating reforms, labour rights, and social security, improving workers’ lives. 9. Working class has become increasingly heterogeneous , divided by skill, income, and lifestyle, contrary to Marx’s view of a homogenized proletariat. 10. Marx assumes labor as the essence of human nature , ignoring man’s tendency towards indolence. Soviet Union, which came closest to implementing Marx’s ideas, disintegrated into 15 countries on 26 December 1991. 11. Communism is utopian and impractical, as it assumes an ideal human nature, and overlooks complexities of governance and resource distribution. 12. Collapse of Soviet Union and other socialist regimes indicates that the Marxist model is not viable in practice. 13. Marxism claims to be a scientific theory , but critics argue that its empirical base is narrow, its predictions have failed, and it lacks objectivity. 14. Raymond Aron criticizes Marxism as the ‘opium of the intellectuals’ , arguing that many Marxist scholars have ignored or justified human rights abuses under communist regimes. 15. Francis Fukuyama contends in The End of History that the fall of communism marks the global triumph of liberal democracy and capitalism as the most viable political and economic system. Contemporary Relevance and Defence of Marxism 1. Global Influence Karl Marx continues to be regarded as one of the foremost thinkers of modern times. His writings had a profound impact on societies across the globe. During the Cold War, in the Eastern Bloc, a large chunk of humanity was affected by his ideology in their daily lives. Lenin (1870-1924) led the Bolshevik Revolution in Russia, established USSR, and affected the lives of millions 2. Crisis in Capitalism The impact of Marxist writings continues to be felt even after the collapse of the USSR. Whenever global capitalism is in crisis (most recently, during the 2009 global financial crisis), Marxist writings are revisited. 3. Misunderstanding Marx Many criticisms of Marxism stem from an incomplete or incorrect reading of Marx's works. Marx was a prolific writer, and his writings are voluminous and complex. A more nuanced reading of his philosophy will make redundant many of these criticisms. a. On Economic Determinism Marx is often accused of economic determinism - that he believes the superstructure is shaped by the base. However, a closer look at Marx's writings reveals that he writes the superstructure is shaped by the base \"in the last instance.\" This means that Marx does acknowledge the role of the superstructure in social life, although ultimately the economy prevails. b. On Individual Agency Marx is also accused of ignoring individual agency, focusing only on wider socio-economic forces. However, Marx writes that history is the activity of men in pursuit of their ends. His call to action - “Workers of the world, unite! You have nothing to lose but your chains” - clearly indicates that he sees individuals not as passive but as active shapers of their own destiny. 4. Contemporary Relevance Many of Marx’s analyses and concepts are highly relevant today. Elon Musk has become the world’s first trillionaire in 2026. Meanwhile, 1.1 billion people (17.5 % of the world’s population) live in acute poverty. Marx had highlighted the growing concentration of wealth under capitalism. a. On Inequality Marx wrote about the increasing concentration of wealth in capitalism. o The 2018 Oxfam report showed that the 26 richest individuals held as much wealth as the bottom 50% of humanity (3.8 billion people). o The 2023 Oxfam report titledSurvival of the Richestrevealed that the richest 1% captured over two-thirds of all wealth created since 2020, while 1.7 billion workers lived in countries where inflation outpaced wages. o The 2024 Oxfam report Inequality, Inc. noted that the wealth of the five richest men doubled since 2020, while 5 billion people became poorer. o Economist Thomas Piketty, in his paperThe Rise of the Billionaire Raj, observed that the top 1% in India now hold 40% of the country's wealth and earn 22% of its income – indicating more inequality than during the British Raj. b. Alienation Today Marx’s concepts of worker exploitation and alienation are reflected in the modern gig economy, corporate burnout, stress, and even suicides. Movements of mass resignations among Western white-collar workers show their continuing relevance. c. State - Bourgeois Nexus Marx emphasized the close nexus between the state and the bourgeoisie, famously saying the state is but a committee to manage bourgeois interests. This rings true today in the form of corporate bailouts, financial incentives to big businesses, and the rise of crony capitalism. d. Living Legacy of Marxism Marxism remains alive in trade unionism and contemporary working-class movements worldwide. Left-leaning political parties like CPI and CPI(M) in India and others abroad draw heavily from Marxist thought. In academia, especially social sciences, Marxist analysis remains influential. Protests by Samsung factory workers at Sriperumbudur in Tamil Nadu (2025) e. Marxist ideas have also influenced a wide range of social movements , such as the 2011 Occupy Movement in the West, Naxalite movement in India, women’s movements, various peasant and tribal rebellions and environmental struggles. 5. Contribution to Sociology In sociology, Marxism helped balance the functional bias in early sociology. Early thinkers like Comte and Durkheim emphasized harmony, and interdependence. Marxism rectified this by highlighting conflict and exploitation as fundamental to social life. Taken together, the criticisms and defences of Marx show why his ideas continue to generate discussion even after more than a century. While some of his predictions did not unfold as he expected, many of his insights into power, inequality, exploitation, and economic instability remain relevant for understanding contemporary societies. A critical yet fair engagement with Marx allows students to appreciate both the limitations of his theories and their enduring analytical value."}, {"c": "5", "n": "Karl MarxHigh priority", "id": "traps", "t": "Traps", "x": "Traps # Common mix-ups and the rule for the exam hall Trap What goes wrong, and the rule Historical vs dialectical materialism The handout uses both names for the same theory: material conditions of production drive history. Exam-hall rule: write 'dialectical materialism or historical materialism' once, then use one term. Base and superstructure The superstructure stabilises and legitimises the base, but the base shapes the superstructure. Defenders say the accusation of economic determinism misreads Marx. Exam-hall rule: say the base shapes it, and the superstructure also stabilises it. Alienation vs anomie Marx's alienation comes from capitalist production relations; Durkheim's anomie is normlessness in transition. Exam-hall rule: Marx = power and ownership; Durkheim = norms and integration."}, {"c": "5", "n": "Karl MarxHigh priority", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Marx's years? 1818-1883 Marx's group before breaking from Hegel? Young Hegelians Who framed the three laws of dialectics? Engels Name the three laws Unity and conflict of opposites; quantity into quality; negation of negation Five stages in order? Primitive communism, ancient slave, feudal, capitalist, communism Base and superstructure? Base = economy; superstructure = family, law, religion, education, culture, media, state, politics Das Kapital published? 1867 Communist Manifesto published? 1848, with Engels Where is alienation elaborated? Economic and Philosophic Manuscripts of 1844 Four forms of alienation? Product, production process, fellow workers and society, self Who developed reification? Georg Lukacs, in History and Class Consciousness Who called Marxism the opium of the intellectuals? Raymond Aron Whose book is The End of History? Francis Fukuyama Class struggle: the driving force of? Historical change"}, {"c": "5", "n": "Karl MarxHigh priority", "id": "abbr", "t": "Abbreviation column", "x": "Abbreviation column # Meanings are plain-language aids; verify before quoting Short form Full form One-line meaning PYQ Previous Years' Questions Questions UPSC has already asked I/2b/20 Paper I / Question 2b / 20 marks How the handout labels each PYQ USSR Union of Soviet Socialist Republics Soviet Union; its collapse is a criticism of the Marxist model"}, {"c": "5", "n": "Karl MarxHigh priority", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test: redraw the chapter map"}, {"c": "5", "n": "Karl MarxHigh priority", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards Mains answer skeletons One for each Mains PYQ quoted in the handout. Tap to open; try the answer first. 2025 · 20 marks · Highlight the main features of historical materialism as propounded by Marx. How far is this theory … Question. Highlight the main features of historical materialism as propounded by Marx. How far is this theory relevant in understanding contemporary societies? Explain. Intro: name Karl Marx and state the central idea in one line (see The story first). Body: build the answer from the notes under: Historical Materialism; Laws of Dialectics (as outlined by Engels); Stages of Human History According to Marx. Close: finish with the matching criticisms section and a one-line judgement. 2024 · 10 marks · Critically explain the salient features of ‘alienation’ as propounded by Karl Marx. Question. Critically explain the salient features of ‘alienation’ as propounded by Karl Marx. Intro: name Karl Marx and state the central idea in one line (see The story first). Body: build the answer from the notes under: Alienation. Close: finish with the matching criticisms section and a one-line judgement. 2023 · 20 marks · What is historical materialism? Examine its relevance in understanding contemporary societies. Question. What is historical materialism? Examine its relevance in understanding contemporary societies. Intro: name Karl Marx and state the central idea in one line (see The story first). Body: build the answer from the notes under: Historical Materialism; Laws of Dialectics (as outlined by Engels); Stages of Human History According to Marx. Close: finish with the matching criticisms section and a one-line judgement. 2021 · 20 marks · Critically examine the dialectics involved in each mode of production as propounded by Karl Marx. Question. Critically examine the dialectics involved in each mode of production as propounded by Karl Marx. Intro: name Karl Marx and state the central idea in one line (see The story first). Body: build the answer from the notes under: Mode of Production; Capitalist Mode of Production; Laws of Dialectics (as outlined by Engels). Close: finish with the matching criticisms section and a one-line judgement. 2020 · 10 marks · Critically assess the Marxian Theory of ‘Alienation’. Question. Critically assess the Marxian Theory of ‘Alienation’. Intro: name Karl Marx and state the central idea in one line (see The story first). Body: build the answer from the notes under: Alienation. Close: finish with the matching criticisms section and a one-line judgement. 2019 · 10 marks · What is the Marxist concept of ‘Fetishism of Commodities? Question. What is the Marxist concept of ‘Fetishism of Commodities? Intro: name Karl Marx and state the central idea in one line (see The story first). Body: build the answer from the notes under: Alienation. Close: finish with the matching criticisms section and a one-line judgement. 2018 · 20 marks · According to Marx, how are human beings alienated from their human potential and what does he sugges… Question. According to Marx, how are human beings alienated from their human potential and what does he suggest to change this? Intro: name Karl Marx and state the central idea in one line (see The story first). Body: use the chapter sections that match the keywords of the question. Close: finish with the matching criticisms section and a one-line judgement. 2017 · 20 marks · Analyse Marxian conception of historical materialism as a critique of Hegelian dialectics. Question. Analyse Marxian conception of historical materialism as a critique of Hegelian dialectics. Intro: name Karl Marx and state the central idea in one line (see The story first). Body: build the answer from the notes under: Historical Materialism; Laws of Dialectics (as outlined by Engels); Stages of Human History According to Marx; Mode of Production. Close: finish with the matching criticisms section and a one-line judgement. 2016 · 10 marks · Evaluate Marx’s ideas on mode of production. Question. Evaluate Marx’s ideas on mode of production. Intro: name Karl Marx and state the central idea in one line (see The story first). Body: build the answer from the notes under: Mode of Production; Capitalist Mode of Production. Close: finish with the matching criticisms section and a one-line judgement. 2014 · 10 marks · According to Marx, capitalism transforms even the personal relationship between men and women. Criti… Question. According to Marx, capitalism transforms even the personal relationship between men and women. Critically examine with illustrations from the contemporary Indian context. Intro: name Karl Marx and state the central idea in one line (see The story first). Body: build the answer from the notes under: Capitalist Mode of Production; Alienation. Close: finish with the matching criticisms section and a one-line judgement. 2014 · 20 marks · Identify the similarities and differences between Marx’s theory of ‘alienation’ and Durkheim’s theor… Question. Identify the similarities and differences between Marx’s theory of ‘alienation’ and Durkheim’s theory of ‘anomie’. Intro: name Karl Marx and state the central idea in one line (see The story first). Body: build the answer from the notes under: Alienation. Close: finish with the matching criticisms section and a one-line judgement. 2013 · 10 marks · Analyse the salient features of historical materialism. Question. Analyse the salient features of historical materialism. Intro: name Karl Marx and state the central idea in one line (see The story first). Body: build the answer from the notes under: Historical Materialism; Laws of Dialectics (as outlined by Engels); Stages of Human History According to Marx. Close: finish with the matching criticisms section and a one-line judgement. Previous Research Methods and Analysis Next Emile Durkheim Personal study notes built from: Sarrthi IAS · Sociology Optional Foundation 2027 · Karl Marx handout. Only the handout facts are used; memory aids are labelled own. Copyright belongs to the teacher or institute; keep this private."}, {"c": "6", "n": "Emile DurkheimHigh priority", "id": "chapter-map", "t": "Chapter map", "x": "Chapter map # Map Outline Durkheim Social facts Externality Independence Constraining Generality Religion Sacred and profane Totem and Churinga Functions New sacreds Division of labour Mechanical Organic Abnormal forms Anomie Normlessness Transition stage Suicide Integration Regulation Four types Criticisms Religion Division of labour Social facts Suicide"}, {"c": "6", "n": "Emile DurkheimHigh priority", "id": "lens", "t": "Exam lens", "x": "Exam lens # Exam lens Priority: High. Mains PYQs quoted: 2013, 2014, 2015, 2017, 2018, 2019, 2020, 2021, 2022, 2024, 2025. Prelims: not asked (Mains optional). Mains hooks 14 Mains PYQs quoted in the handout, 2013-2025: religion (6), suicide (3), social facts (2), division of labour (2), anomie (1), modernity (1). Questions pair Durkheim with Marx, Weber or Merton: have the comparison lines ready. Every concept has a criticism list at the end of the handout: end each answer with it. Durkheim explains why society holds together: shared rules, shared religion and interdependence. Every critic asks what that harmony hides."}, {"c": "6", "n": "Emile DurkheimHigh priority", "id": "story", "t": "The story first", "x": "The story first # The story first Society is a real thing above its members. Its rules (social facts) press on us, religion shows society worshipping itself, division of labour binds a modern crowd together, and when the rules fail (anomie) the suicide rate rises. 1. Society is more than its people. Durkheim (1858-1917) wanted sociology to be a rigorous discipline with its own subject matter. That subject matter is social facts: collective ways of acting, feeling and thinking, external to the individual and able to coerce him. Society is sui generis, a reality of its own. *→ Now ask what holds such a society together.* 2. Religion is society worshipping itself. Among the Arunta, each clan had a totem, carved on the sacred Churinga. Worshipping the totem is worshipping the clan. God is society divinised, and religion supplies shared morality, social control, solidarity and collective effervescence. *→ In a modern society the old sacreds fade, so what binds people now?* 3. Division of labour binds the modern crowd. Pre-modern societies hold together by sameness (mechanical solidarity, strong conscience collective). Modern societies hold together by interdependence (organic solidarity) as volume, material density and moral density rise. *→ But the change from one to the other is shaky.* 4. Anomie is the shaky stage in between. When old norms die before new ones arrive, there is normlessness: conflicting or missing rules, insatiable desire, unrest. Durkheim also names three abnormal forms of division of labour and the remedies: professional associations, contract, state action. *→ Normlessness has a measurable human cost.* 5. Suicide rates prove the point. In Le Suicide (1897) he treats suicide as a social fact. Two forces decide the rate: social integration and moral regulation. Too little or too much of either gives four types: egoistic, altruistic, anomic, fatalistic. *→ Finally, test the whole edifice against its critics.* Cast: Arunta = the tribe he studied for religion · Churinga = sacred object carved with the totem · Le Suicide = 1897, first empirical sociological study of suicide"}, {"c": "6", "n": "Emile DurkheimHigh priority", "id": "terms", "t": "In simple words", "x": "In simple words # Durkheim says society is a reality above individuals ; its rules ( social facts ) are external, general and constraining. Religion is society worshipping itself (sacred vs profane, totem, collective effervescence). Division of labour moves society from mechanical (sameness) to organic (interdependence) solidarity; the rocky stage between is anomie (normlessness). Suicide is a social fact: integration and moral regulation give egoistic, altruistic, anomic and fatalistic suicide. Critics: too harmonious, ignores conflict and agency, over-objective, relies on official statistics. Term In plain words Social fact Collective way of acting, feeling and thinking, external to the individual and coercive. Sui generis Society is a reality of its own, more than the sum of its parts. Sacred and profane Sacred = set apart and forbidden; profane = ordinary. Totem Clan symbol of a plant or animal; the Arunta worshipped it. Collective effervescence The exalted shared feeling produced by group ritual. Conscience collective Totality of beliefs and sentiments common to members of a society. Mechanical solidarity Unity from sameness in pre-modern society. Organic solidarity Unity from interdependence in modern society. Anomie Normlessness: old norms gone, new ones not yet formed. Social integration How strongly individuals are connected to society. Moral regulation How strongly norms guide and limit desires and behaviour."}, {"c": "6", "n": "Emile DurkheimHigh priority", "id": "1-emile-durkheim", "t": "1 · Emile Durkheim", "x": "1 · Emile Durkheim # Handout only Emile Durkheim (1858-1917), born in France, is widely regarded as one of the principal founding fathers of sociology. Trained in philosophy but deeply interested in the scientific study of society, Durkheim dedicated his career to establishing sociology as a rigorous academic discipline. Emile Durkheim (1858-1917) His approach is marked by a strong commitment to functionalism - the idea that social institutions and practices must be understood in terms of the functions they perform in maintaining social order, integration, and collective life. Durkheim studied diverse aspects of social life like religion, economy, and education. His contributions not only laid the methodological foundations of the discipline but also shaped some of its most enduring debates on the nature of social life."}, {"c": "6", "n": "Emile DurkheimHigh priority", "id": "2-religion-and-society", "t": "2 · Religion and Society", "x": "2 · Religion and Society # Handout only Picture hook Churinga: a sacred totemic object. Hook for religion as the sacred that binds the clan. (handout p.4) In his seminal work ‘Elementary Forms of the Religious Life’; Durkheim defines religion as “ a unified system of beliefs and practices related to sacred things, i.e. things set apart & forbidden. Religion unites its members into a single moral community.” All societies divide their world into two parts - sacred and profane. Sacred is always separated and set apart from all the other objects. Sacred thing is that which the profane should not and cannot touch with impunity. There are detailed rules and regulations and social practices that are laid down detailing how the sacred is to be approached. Sacred is protected and isolated through strong prohibitions and taboos. It is not the utility of a thing which makes it sacred. Anything can be sacred - a stone, a pebble, a colour, a river, a symbol, a plant, or an animal. Sacred is not superior to the profane in terms of its utility. But the sacred is infinitely superior to the profane in terms of dignity and power. Objects may make a passage from profane to sacred & from sacred to profane through rituals. There is nothing about the qualities of a particular pebble or a tree that makes it sacred. Sacred things must be symbols, and they must represent something. To understand the role of religion in society, the relationship between sacred symbols and what they represent must be established. Churinga, a sacred object of the Aruna people Durkheim studied the religious beliefs and practices of the Arunta tribe of Australian aborigines. Arunta is a simple, small-scale, and primitive society. Arunta society is divided into various exogamous clans. Each clan is represented by a symbol (of a plant or an animal). The symbol of a clan is known as totem . Each clan had its own flag. On its flag was carved its symbol or totem. Members of a clan expected the help or support of the other members of the clan in case of a dispute with a member of another clan. The religion of the Arunta people is known as Totemism . In their religious practices, the Churinga was of central importance. This was the most sacred object for the clan. The totem of the clan was carved on its Churinga. Durkheim asks: \"So if the totem is at once the symbol of the god and of the society, is that not because the god and the society are only one?\" Effectively, the clan members worshipped the totem, which was a symbol of their clan itself. Hence, Durkheim deduced that religion involves society worshipping itself. God is society divinised. God and society are one and the same ."}, {"c": "6", "n": "Emile DurkheimHigh priority", "id": "3-functions-of-religion", "t": "3 · Functions of religion", "x": "3 · Functions of religion # Handout only Religion contributes to the maintenance and well-being of the society in several ways. It provides the members of a society with a set of shared morality ; a shared set of values and moral beliefs. In their absence, there would be no social order, social solidarity, or cooperation. The moral code followed by its members binds them into a single moral community and integrates them. It thus helps to maintain social order. Religion helps to ensure social control over the individual members. By making the important social rules and duties sacred, religion provides society with greater power to control the action of its individual members. Social obligations become religious duties. For instance, marriage in primitive societies is not just a social duty but is a sacred bond. The moral guidelines of religion thus help to regulate the individual’s behaviour. The attitude of respect that people attach to religion is applied to important social duties and obligations. The relationship between man and society is exactly the same as the relationship between man and god, which is a relationship of man’s dependence on god/society . In worship, people are, in effect, recognising the importance of the social group and their dependence upon it. In this way, religion strengthens group unity and promotes social solidarity . Religion is also an important source of strength , particularly in difficult times. During death, rituals are performed. The members of society offer emotional support and express solidarity with the bereaved. Religious rituals are frequently accompanied by collective singing, dancing, and chanting. This produces a collective effervescence , which strengthens the bonds binding the individual to the religious community. Rituals this bring individuals together in an exalted state, and reinforce their sense of shared identity and purpose. Religion thus ensures social cohesion and is a source of social unity and solidarity."}, {"c": "6", "n": "Emile DurkheimHigh priority", "id": "4-religion-in-modern-society", "t": "4 · Religion in modern society", "x": "4 · Religion in modern society # Handout only With modernization, European society was also undergoing secularization; i.e. a decline in the social significance of religion. Durkheim was of the view that traditional forms of religion were clearly declining . However, religion has not become irrelevant in modern industrial society. While traditional religions have been questioned, the essence of religion is still prevalent in modern times. The old sacreds are replaced by new sacreds . The nation is the new sacred . The symbols of the nation are considered sacred (national flag, national anthem). The new ‘sacred’ are also set apart and forbidden. For instance, the national flag is held in very high esteem and the flag code lays down the rules governing its use. The national emblem is the new totem, representing the people. The new ‘religion’ continues to perform the functions primitive religions did. This new religion provides a new shared morality and shared values (enshrined in the Constitution). It binds us beyond caste, class and creed. When the national anthem is chanted, it produces a collective effervescence which strengthens the bonds binding the individuals to the wider society. The ‘cult of the individual’ is the new religion in modern society. The individual’s freedom, dignity and rights are considered sacrosanct and inviolable. Any violation of these is considered sacrilege and a moral offence of the highest order."}, {"c": "6", "n": "Emile DurkheimHigh priority", "id": "5-division-of-labour", "t": "5 · Division of Labour", "x": "5 · Division of Labour # Handout only Picture hook Hands joining puzzle pieces. Hook for solidarity: parts fitting into one whole. (handout p.6) Division of Labour means the splitting up of an activity into a number of smaller parts or processes. These tasks are then assigned to different persons. Economists like Adam Smith viewed this process of skill specialisation as resulting in a massive increase in speed, efficiency, quality, and economic productivity. Durkheim’s analysis of division of labour brought new dimensions to its understanding, broader than that of the economists. For Durkheim, division of labour is not confined to the economic realm. It exists throughout the society. ‘Division of Labour in Society’ was Durkheim’s Ph.D. thesis and his first major sociological work. In it, he suggests that the division of labour fulfils some vital needs of the society. Durkheim was concerned about the effects of increased individualism on modern society. In pre-modern society, it is as if people are made out of the same mould. The population is homogeneous and the conscience collective is strong (conscience collective refers to the totality of beliefs and sentiments common to the members of the society). Individualism is kept in check, and collectivism is emphasized. People are bound together strongly by a mechanical solidarity due to shared sentiments, lifestyles and community orientation. But how will modern industrial society stay intact with so much individualism? According to Durkheim, an elaborate and complex division of labour ensures organic solidarity among the members of the society due to their greater interdependence on each other. Dividing work not only leads to efficiency but also ensures cohesion in society As the volume (size of the population), material density (density of population), and moral density (the frequency of social interactions) increase; society changes from pre-modern to modern society. As the society modernizes, a complex form of division of labour with a large number of occupations and a high degree of skills specialisation emerges. This enables the society to regulate competition within each occupational category within manageable levels."}, {"c": "6", "n": "Emile DurkheimHigh priority", "id": "6-social-change-from-pre-modern-to-modern", "t": "6 · Social change from pre-modern to modern society", "x": "6 · Social change from pre-modern to modern society # Handout only Aspect Pre-Modern Society Modern Society Technology Rudimentary Advanced Number of occupations Few Many Basis of division of labour Ascriptive criteria like caste and gender Skills, talent, education, inclination Nature of division of labour Simple Complex Level of specialisation Low High Type of population Homogenous Heterogeneous Conscience Collective Strong Weak Individualism Kept in check High Law Repressive Restitutive Social relationships Personal, emotional, informal, durable, and multi-dimensional Transactional, formal, rules-based, superficial, unemotional, purpose-driven, and transient Interdependence Less More Basis of social solidarity Sameness Interdependence Nature of social solidarity Mechanical solidarity Organic solidarity"}, {"c": "6", "n": "Emile DurkheimHigh priority", "id": "7-functions-of-division-of-labour", "t": "7 · Functions of division of labour", "x": "7 · Functions of division of labour # Handout only 1. Improves efficiency and productivity. 2. Ensures interdependence and organic solidarity. 3. Peaceful solution to the needs of the society, created by the increase in population size and density. It reduces the competition in society, enabling peace and harmony. 4. Integrates societies in the absence of a strong collective conscience."}, {"c": "6", "n": "Emile DurkheimHigh priority", "id": "8-anomie", "t": "8 · Anomie", "x": "8 · Anomie # Handout only Picture hook Clash on the street. Hook for anomie: norms breaking down. (handout p.7) The term ‘anomie’ literally means normlessness. When the society changes from traditional to modern, there is an intervening stage of anomie. During this stage, the society is unable to offer clear guidelines to its members. In many areas of social life, there may be an absence of any guidelines. In some other areas of social life, there may be conflicting norms. This creates a general atmosphere of confusion and chaos in the society. Anomie occurs during periods of drastic and rapid changes in the political, economic, and social structures. The traditional norms may have been destroyed but new norms have not yet emerged to replace them. The old scale has been upset. But a new one has not yet been devised. The period of anomie is unstable, chaotic, and rife with conflict. It is a period of derangement. The social norms that provide continuity, stability and certainty have been weakened or are missing. Anomie recently engulfed Nepal Individual members of the society are consumed by an insatiable desire. Many members of the society consider their work meaningless and not valued by the society. The period of anomie gives rise to social tensions and social disorder. There is a general atmosphere of hopelessness and widely prevalent unhappiness in society. However, the phase of anomie is transitional. Modern norms will eventually completely replace the traditional ones . S ociety will once again offer clear guidelines to its members. Confusion and unhappiness will be a thing of the past as the society transforms into a fully modern society. There are 3 abnormal forms of division of labour. (i) Anomic division of labour exists when there is a lack of clear guidelines governing the economic behaviour of man. Due to unchecked and unlimited desires of people, there are frequent industrial conflicts. (ii) Forced division of labour exists when an individual is compelled into an occupational role which is not suited to his temperament, ability, inclination, and interests. For example, due to monetary constraints, poverty, or caste system. (iii) Inadequate Organisation of Work - When the workers are not clear about their roles. There is no proper division of tasks among the people, resulting in inefficiency. These abnormal forms can be addressed by: (i) Establishment of professional associations in different areas of work. Such associations are self-regulatory bodies comprising members of their own field. They provide a code of conduct and inculcate in their members a sense of commitment and duty, and temper their greed. (ii) Contract A formal written contract will make clear the expected duties of each party to the contract and what they can hope to receive for the performance of their duties. (iii) State action The state can play an important role in checking abnormal division of labour. It can intervene through legislation, policies and schemes that enable people to seek opportunities of their inclination by providing scholarships or removing historical disabilities."}, {"c": "6", "n": "Emile DurkheimHigh priority", "id": "9-social-facts", "t": "9 · Social Facts", "x": "9 · Social Facts # Handout only Society has a reality of its own over and above the individuals who comprise it. Members of the society are constrained by social facts , which are ‘collective ways of acting, feeling, and thinking that are external to the individual. Social facts are endowed with the power of coercion by reason of which they control the individual.’ Language and law are examples of social facts. For Durkheim, beliefs and moral codes are passed down by generations and are shared by everyone who constitute the society. It is not the consciousness of the individual that directs his behaviour. Rather, it is the common beliefs and sentiments that transcend the individual and shape his consciousness. Therefore, for Durkheim, society is a system that obeys its own laws. The society is ‘sui generis’ . It is more than the sum total of its parts. Society has a reality of its own, irreducible to the actions, motives, or psychology of individual persons. It has an independent existence and distinctive nature that emerge from social interaction but cannot be fully explained by summing up individual behaviours. When individuals come together, they generate collective consciousness, norms, values, and institutions that transcend them and act back upon them. These collective forces shape how people think, feel, and behave, often without them being fully aware of it. Thus, society is not merely a “collection of individuals”; rather, it is a higher-order existence that produces social facts-rules, customs, and beliefs-which possess coercive authority over the individuals. Durkheim was one of the founding fathers of the discipline of sociology. In its initial years, the discipline of sociology faced resistance from some of the existing branches of knowledge, such as philosophy and psychology. It was in this context that Durkheim clearly demarcated the subject matter of the discipline of sociology. He described sociology as the study of ‘ social facts.’ By conceptualizing and defining social facts, Durkheim was largely successful in giving the nascent discipline of sociology its distinctive subject matter & identity."}, {"c": "6", "n": "Emile DurkheimHigh priority", "id": "10-characteristics-of-social-facts", "t": "10 · Characteristics of social facts", "x": "10 · Characteristics of social facts # Handout only 1. Externality - Every individual is born into an existing society with a definite social organisation. There are various social norms and values he finds readymade at birth and learns through the process of socialisation. However, these exist prior to the individual and are external to him. 2. Independence - Social facts are independent of the will, choice, or inclination of the individual members of the society. Social facts are also independent of their individual manifestations. 3. Constraining - Social facts constrain individual members to conform. Social facts exert themselves on the individual; and extract compliance from the individual. 4. Generality - Social facts are general in character. They are what most people are acting, thinking, and feeling. Social facts are classified into two types: 1. Material social facts - those social facts that are directly observable. For example, technology, architecture, and laws. 2. Non-material social facts - those social facts that are not directly observable. For example, values, morals, and conscience collective. Memory aid (own) · Four characteristics of social facts E I C G Every Individual Complies, Generally. E = Externality; I = Independence; C = Constraining; G = Generality. The four are numbered 1-4 in the handout, so the order is kept: social facts are external, independent of the will, constraining, and general. (order kept)"}, {"c": "6", "n": "Emile DurkheimHigh priority", "id": "11-methodology-to-study-social-facts", "t": "11 · Methodology to study social facts", "x": "11 · Methodology to study social facts # Handout only Durkheim gave a detailed methodology to study social facts in his book ‘ Rules of the Sociological Method ’. A positivist, he advocated the application of the scientific method to study social facts. Durkheim insisted that sociologists should study social facts as ‘things’ 1. Rules for Observation a. The first and foremost rule is that ‘ treat social facts as things .’ Social facts are to be treated as a ‘thing’ which is directly observable and empirically capturable. They should be quantified and measured. The data obtained should be processed using statistical tools and techniques. Durkheim suggests that social facts are real and have an objective reality. b. The sociologist must clearly define and demarcate the phenomenon being studied. c. The sociologist must discard any preconceived notions that dominate the minds of ordinary men, and adopt an emotionally neutral attitude while studying social facts. 2. Rules for Distinguishing between normal and pathological social facts A social fact is considered a normal social fact if it is generally encountered in society. Any deviation from this standard is pathological. 3. Rules for Classification Since the scientific method of experimentation has limited application in sociological research, sociologists may rely upon other scientific methods such as the comparative method while studying society in order to establish cause-effect relationships. For comparison, the sociologist must do proper classification of the social phenomena into appropriate categories. 4. Rules for Explanation a. The causative factors of a social phenomenon may be different from the functions which it performs. b. ‘Trace social facts to other social facts.’ - Social facts cannot be explained by reducing them to any underlying natural, biological, or psychological factors. The explanation of any social phenomenon has to be found in the nature of the society itself. c. Explanation of social facts must yield general theories. d. Durkheim’s formulation of social facts ultimately provided sociology with both a distinct subject matter and a rigorous scientific o
