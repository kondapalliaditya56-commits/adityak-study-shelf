 sects, cults and new religious movements (5), secularisation (4), revivalism, communalism and fundamentalism (5), science and religion and pluralism (4). Recurring: Weber's Protestant ethic, sects versus cults, animism versus naturism, revivalism versus communalism. Compare theorists in a table, then bring Indian examples: Bhakti sects, Kumbh Mela, communalism and the multicultural state."}, {"c": "14", "n": "Religion and SocietyHigh priority", "id": "story", "t": "The story first", "x": "The story first # The story first Religion gives meaning to life, and sociologists ask where it came from and what it does. Müller, Tylor and Durkheim give origins, Marx and feminists expose its ideological role, Weber links Protestant ethic to capitalism. In modern society secularisation, revival, fundamentalism, sects and cults show how religion changes form rather than vanishes. 1. What is religion? Roland Robertson defines religion as belief in supernatural beings that have a governing effect on life. Sociologists study it as a social institution that shapes relationships, power and change. *→ Where did it begin?* 2. Origins: naturism, animism, totemism. Max Müller: nature worship from fear and awe. E.B. Tylor: spirit (anima) worship to explain death and dreams. Durkheim: totemism among the Arunta; worshipping the totem is worshipping society. Malinowski's Trobriand study shows religion easing life crises and risk. *→ What does religion do for power?* 3. Marx and feminists. Marx: religion is the opiate of the people; it makes suffering virtuous, treats order as divine, promises divine intervention and a beautiful afterlife. Feminists (Karen Armstrong, de Beauvoir) point to patriarchy and religion as opium for women. *→ Can religion change the economy?* 4. Weber and the Protestant ethic. Calvinism's predestination, calling, work as worship, asceticism and reinvestment fostered the spirit of capitalism. Critics: Sombart, Kautsky, Schumpeter, and the charge that Weber misread Hinduism and Confucianism. Weber rejects economic determinism. *→ Is religion fading?* 5. Secularisation and revival. Bryan Wilson: religion loses social significance; evidence from science, church attendance, structural differentiation and surveys. Critics: Luckmann's invisible religion, Durkheim's new sacred. Revival grows from materialism, politics, technology and prosperity, and differs from communalism. *→ What of extreme forms and new groups?* 6. Fundamentalism, sects and cults. Fundamentalism reacts to modernisation (Madan), globalisation (Shupe) and uncertainty (Giddens); Bruce adds enemy, recruits and single sacred texts. Troeltsch's church and sect expand to church, denomination, sect and cult; cults are now called new religious movements. Cast: Max Müller = naturism · E.B. Tylor = animism · Emile Durkheim = totemism, religion as society · Max Weber = Protestant ethic and capitalism · Bryan Wilson = secularisation · Thomas Luckmann = invisible religion"}, {"c": "14", "n": "Religion and SocietyHigh priority", "id": "terms", "t": "In simple words", "x": "In simple words # Origins : Müller = nature; Tylor = spirits; Durkheim = totem as society. Marx : religion is an opiate serving the ruling class; Weber : Protestant ethic helped capitalism; Durkheim : religion binds society. Secularisation = declining social significance of religion, but it is uneven and reversible . Church > denomination > sect > cult (new religious movement) differ by size, hierarchy and parent religion. Term In plain words Naturism Müller: religion began as nature worship. Animism Tylor: religion began as spirit worship. Totemism Durkheim: clan's sacred animal or plant symbol that represents the clan. Spirit of capitalism Weber: ethic of disciplined, rational, continuous profit-making. Predestination Calvinist belief that salvation is fixed by God. Secularization Process in which religious thinking, practice and institutions lose social significance (Wilson). Invisible religion Luckmann: religion shifted from public ritual to private belief. Religious revivalism Renewed assertion of religious beliefs and practices. Fundamentalism Militant, literal reading of sacred texts and a return to an imagined pure past. New religious movements Neutral term preferred over 'cult'."}, {"c": "14", "n": "Religion and SocietyHigh priority", "id": "1-overview", "t": "1 · Overview", "x": "1 · Overview # Handout only Religion is one of the most ancient and universal social institutions, playing a central role in shaping beliefs, values, norms, and collective identities. In every society, religion provides meaning to human existence, offers explanations for suffering and uncertainty, and establishes moral guidelines for conduct. Sociologist Roland Robertson defined religion as a belief in “the existence of supernatural beings which have a governing effect on life.” This definition emphasizes that religion is concerned with realities that go beyond the observable world and provides meaning by linking everyday life with a higher power. Sociologists study religion not merely as a matter of personal faith, but as a social institution that influences social relationships, power structures, cultural practices, and social change."}, {"c": "14", "n": "Religion and SocietyHigh priority", "id": "2-theories-of-religion", "t": "2 · Theories of Religion", "x": "2 · Theories of Religion # Handout only Picture hook John Calvin. (handout p.7) Picture hook Ritual performer with fire. Hook for spirit worship (animism). (handout p.4) Picture hook Sacred banyan grove. Hook for nature worship (naturism). (handout p.3) 1. Naturism The theory of naturism contends that religion emerged in the form of nature worship. Max Muller believed that the primitive man, being greatly exposed to and vulnerable before the forces of nature, experienced constant fear, wonder, and awe. To cope with the emotional turmoil caused by nature, he began to personify its elements and propitiate them. This led to the development of religion, and its process helped him to fulfil his emotional needs and manage his anxiety. Primitive man began worshipping trees and nature 2. Animism According to E. B. Tylor , the primitive man was troubled by two fundamental questions: what causes the difference between the living and the dead, and what explains the images seen in dreams and visions. To address these mysteries, he developed the concept of anima or spirit, giving rise to the earliest forms of religious belief. Thus, religion began as spirit worship, as a means to satisfy the intellectual needs of man. Primitive tribes worhipped spirits 3. Functionalism Durkheim , in The Elementary Forms of the Religious Life, views religion as a unifying force that promotes shared morality and reinforces social cohesion. It binds individuals into a moral community through collective rituals. Durkheim studied totemism among Arunta tribe of Australia and treated it as one of the simplest forms of religion. A totem is usually an animal or plant symbol regarded as sacred by a clan. Members of the clan believe that they share a special relationship with the totem. For Durkheim, the totem is not merely a religious symbol; it represents the clan itself. Thus, when people worship the totem, they are indirectly worshipping society. Totemism therefore shows that religion is rooted in collective life and helps create social solidarity. Malinowski , in his study of the Trobriand Islanders , observed that religious activity accompanied major life crises such as birth, marriage, and death. During these significant transitions, religion provided emotional support, helping individuals overcome anxiety and fear. Religion also accompanied deep-sea fishing, giving the islanders a sense of certainty in the face of risk and uncertainty . However, the functional theory is criticized for downplaying conflict, violence, and divisiveness in the name of religion. It tends to overlook the oppressive role religion has played in reinforcing patriarchy, caste-based discrimination, and other forms of social inequality. Basis Naturism Animism Totemism Main Thinker Max Müller E. B. Tylor Emile Durkheim Core Idea Religion began as nature worship. Religion began as spirit worship. Religion involves worship of sacred clan symbols. Source of Religious Belief Fear, wonder and awe before natural forces like sun, rain, fire, thunder and rivers. Reflection on dreams, death, soul, ghosts and spirits. Collective attachment to a totem (usually an animal or plant symbol). Communities that practice Vedic Aryans Algonquian and Ojibwa (USA), Zulu (S. Africa) Arunta tribe (Australia) Human Need Served Emotional need to cope with nature’s power and uncertainty. Intellectual need to explain life, death and dreams. Social need for group unity, identity and solidarity. Religion arises from Nature of Explanation Religion arises from personification of nature. Religion arises from belief in anima or spirit. society worshipping itself through sacred symbols. 4. Marxism Karl Marx famously stated that \" religion is the opiate of the people .\" From a Marxist perspective, religion is part of the superstructure that functions to serve the interests of the ruling class. It helps to legitimize and justify economic inequality, maintain the status quo, and perpetuate dominance of the bourgeoisie over the proletariat. Religion performs this ideological function in several ways: a) It makes suffering virtuous Religion often glorifies suffering as a moral good, encouraging the poor to see their hardships as noble or divinely willed. For example, many religious texts promote the idea that humility and poverty are closer to godliness. This discourages people from resisting or questioning their economic deprivation. b) It explains social order as divinely ordained Religious doctrines frequently present existing hierarchies and class positions as natural or ordained by God. This discourages people from challenging injustice, as doing so could be seen as opposing divine will. c) It gives hope of divine intervention Religion promises that a higher power will eventually intervene and deliver justice - either in this life or the next. This creates a sense of passivity, submission, and resignation among the oppressed classes, who wait for divine help rather than organizing to change their material conditions. d) It promotes the notion of a beautiful afterlife Many religions teach that the faithful will be rewarded in the afterlife for their suffering in this life. This belief encourages the poor to accept their current oppression in the hope of eternal bliss, thus distracting them from seeking justice or economic equality in the present world. Thus, from the Marxist perspective, religion functions ideologically to support the capitalist system by normalizing inequality, pacifying the oppressed, and discouraging revolution. 5. Feminist Theory of Religion Feminist scholars have highlighted the patriarchal bias and control in most religions. Nearly all major world religions are patriarchal. Karen Armstrong argues that religions are overwhelmingly male-dominated: Founders of most religions are men. Gods are often male; priesthood and top religious leadership are male. Menstruation is considered taboo, and women are excluded from key rituals. Simone de Beauvoir , in her book The Second Sex, suggests religion acts as \"opium for women\" glorifying motherhood and defining women in roles like the obedient wife. 6. Weber's Theory of Religion Max Weber sought to understand why modern capitalism developed first in the West, particularly in Protestant regions of Europe, and not in other advanced civilizations like China or India. Protestants worked hard and were devoted to worldly success Weber argued that certain religious ideas within Protestantism, especially Calvinism, played a crucial role in fostering the spirit of capitalism. Spirit of Capitalism Weber defines the ‘spirit of capitalism’ as a set of values and attitudes that emphasize hard work, discipline, and rational economic activity aimed at continuous profit-making. Unlike earlier economic systems that were more about subsistence or the pursuit of wealth for personal enjoyment, the capitalist spirit is characterized by the pursuit of profit as an ethical duty and through rational organization of work. Weber argued that the ethos of capitalism entails a disciplined, calculated approach to work and economic activity - one that is efficient, systematic, and rational. Weber identified specific characteristics of this capitalist spirit: Systematic pursuit of profit : The desire to continuously accumulate wealth is seen as a moral duty rather than an individual desire for luxury or indulgence. Hard work and frugality : A focus on diligence and saving, with profit being reinvested in further economic ventures rather than personal consumption. Rational organization : Businesses operate in a methodical and rational manner, prioritizing efficiency and planning. Weber approvingly quotes from Benjamin Franklin’s ‘Necessary Hints To Those That Would Be Rich’ and considers it as the personification of the spirit of capitalism - prudence, hard work, industry, and honesty, are the traits necessary of a businessman. John Calvin (1509-1564) led the Protestant Reformation in Europe Key points of Weber’s theory: 1. Finite Mind of Man Cannot Comprehend the Infinite Mind of God Calvinist theology emphasized the absolute transcendence and incomprehensibility of God’s will. Human beings, with their limited understanding, could not question or influence divine plans. This encouraged a this-worldly orientation amongst its followers. 2. 24x7 Work Ethic : Protestantism, especially in Puritan form, promoted the idea that \"work is worship\". It distanced itself from the Catholic tradition of numerous religious holidays. The sanctification of constant labor led to a relentless work culture, where time was to be used productively at all times. This work ethic deeply shaped the values of early capitalism, fostering continuous industriousness and discipline. 3. Reinterpreting the Prohibition on Usury : While the Bible traditionally condemned usury (charging interest on loans), Protestant thinkers reinterpreted this prohibition. They distinguished between exploitative lending and legitimate interest in business, thus morally legitimizing capitalist banking and finance , which had been stigmatized in earlier Christian doctrine. This reinterpretation paved the way for modern capitalist financial systems to flourish. 4. Doctrine of Predestination : Calvinists believed that only a few were predestined by God for salvation, and this could not be changed. This created salvation anxiety among believers, who then looked for Signs of being chosen . Worldly success was considered as a Sign of salvation . Prosperity through hard work came to be seen as an indication of divine favour. Thus, Calvinists began to devote themselves to their occupations with intense seriousness to demonstrate moral worth. 5. Notion of Calling: Weber highlighted how Protestantism, especially Calvinism, introduced the idea that every individual has a \"calling\" - a God-given duty to perform their secular work with dedication and discipline. Unlike earlier views that saw religious devotion as separate from worldly labor, Protestants treated work itself as a form of worship. This sanctified daily labor, encouraging industriousness and skill specialization - which laid the cultural foundation for modern capitalism. 6. Asceticism and Reinvestment : Protestant ethics promoted asceticism - a lifestyle of discipline and self-denial. Rather than spending on luxuries, profits were reinvested in business. This led to capital accumulation , a key driver of capitalism. Protestant beliefs encouraged one to remain dedicated to their work, be industrious, and undertake work as a religious duty. Thus, the Protestant ethic inculcated the spirit of capitalism in its followers. Weber emphasized that religion can be a major driver of socio- economic change , countering Marx’s idea that religion is a status quoist force. However, once capitalism took root, its momentum became self-sustaining and independent of religious values . In sum, Weber showed how religious ideas shaped economic behaviour , illustrating the complex relationship between culture and economy . Criticisms of Weber's Theory of Religion 1. Weber Misunderstood Other Religions Critics argue that Weber had a limited or orientalist view of non-Western religions like Hinduism and Confucianism, reducing them unfairly to passive and otherworldly traditions. 2. Capitalism Originated amongst Jews Some scholars argue that Jewish communities, especially in medieval Europe, played a critical role in developing capitalist practices like moneylending, trade, and finance. 3. Calvinism Opposed Greed Sombart contended that Calvinism discouraged greed and profit-making for its own sake, contradicting Weber’s linkage between Calvinist values and capitalist accumulation. 4. Capitalism Preceded Protestantism Kautsky believed Weber got the causality backwards - that it was not Protestantism that caused capitalism, but rather capitalism that influenced religious thought and values. Commercial capitalism began before the Protestant Reformation. Protestantism may have legitimized capitalism later but was not its origin. 5. Capitalism Began in Catholic Italy Schumpeter argued that capitalism first took root in 14th-century Italian city-states like Florence and Venice - regions steeped in Catholicism, not Protestantism. While Weber’s theory has also been subject to several criticisms, it remains a foundational text in the sociology of religion. Weber’s key contribution to the sociology of religion was his rejection of economic determinism, the idea that material conditions (as proposed by Karl Marx) shape society. Weber's work on religion is in fact an important critique of Marx's historical materialism. Marx argued that the economic base determines the superstructure, including religion, and viewed religion largely as a reflection of material conditions. Weber challenged this one-way causal relationship by demonstrating that ideas, beliefs, and values can themselves become independent forces of social change. He showed that the ascetic values of Protestantism fostered discipline, hard work, and thrift, thereby contributing to the rise of modern capitalism. Weber, unlike Marx, showed that religion helped the emergence of capitalism, advocating a multicausal rather than economically deterministic understanding of social change. Comparison of Marx, Weber, and Durkheim’s Theories of Religion Basis Karl Marx Max Weber Emile Durkheim Approach Conflict approach Interpretive approach Functionalist approach Social Role of Religion Legitimizes domination, exploitation and inequality Provides ethical orientation and meaning for social action Promotes social integration and collective solidarity Major Works The German Ideology; Das Kapital The Protestant Ethic and the Spirit of Capitalism; The Sociology of Religion The Elementary Forms of Religious Life Object of Study Religion in general Major world religions (Protestantism, Hinduism, Judaism, Confucianism) Totemism of Arunta tribe Method of Critical and theoretical Comparative analysis focusing on meanings Ethnographic study of a tribal Study analysis focusing on meanings and motivations study of a tribal community Religion and Social Change Religion maintains status quo by legitimizing existing inequalities Religion can become an agent of social change (e.g., Protestant ethic and capitalism) Religion maintains social order and stability Key Concepts \"Religion is the opium of the people\" Protestant Ethic, religious ideas as drivers of social change Sacred and Profane, Collective Conscience, Totemism Memory aid (own) · Weber and Calvinism: four key points (order free) S P O T SPOT. S = Salvation anxiety (predestination); P = Prohibition on usury reinterpreted; O = Occupational calling; T = Twenty-four by seven work ethic. Calvinism SPOTs signs of salvation in worldly success. (order free)"}, {"c": "14", "n": "Religion and SocietyHigh priority", "id": "3-religion-in-modern-society", "t": "3 · Religion In Modern Society", "x": "3 · Religion In Modern Society # Handout only Picture hook Hand of science meeting hand of religion. Hook for the science and religion debate. (handout p.19) Picture hook Empty church. Hook for secularisation in Europe. (handout p.11) Secularization Secularization means the declining social significance of religion in modern society. Once central to all aspects of life, religion now plays a reduced role in shaping social institutions and everyday decisions. Bryan Wilson in Religion in Secular Societydefined secularization as “the process whereby religious thinking, practices and institutions lose social significance”. Religion, he contends, has lost influence at the societal, the institutional and the individual level. Empty churches in Europe signify Secularization Causative Factors and Evidence 1. Challenge from Science With the growing domain of scientific knowledge, people have increasingly turned to scientific rather than theological explanations for natural and social phenomena. Science is seen to offer more accurate explanations and solutions to human problems. Comte, in his Law of Three Stages, argued that societies evolve from the theological stage to ultimately the positive/ scientific stage. Weber noted that modernization brings with it rationalization and disenchantment. As rational thinking takes over, role of mystery and religious awe diminishes. Decisions in modern life are largely made through logic, evidence, and calculated reasoning. 2. Decline in Church Attendance A marked fall in regular church attendance, particularly in Western Europe, serves as direct empirical evidence of secularization. This indicates a reduced role of religion in everyday lives of people. 3. Disengagement of Church In pre-modern societies, religious institutions played a key role in governance, education, and economic regulation. However, with modernization, a process ofstructural differentiationhas occurred - where specialized institutions have emerged for different societal functions (Steve Bruce). As a result, religion has withdrawn from these spheres and lost its former centrality. 4. Surveys as Evidence Numerous surveys have documented a noticeable decline in religious affiliation and belief worldwide. According to the Pew Research Center (2010), around 1.1 billion people globally were atheist, agnostic, or unaffiliated with any religion. In the United States, a Gallup poll found that 21% of Americans identified with no religion in 2022 - a steep rise from just 1% in 1951. The Eurobarometer survey (2010) reported that 40% of people in France, 34% in Sweden, 30% in the Netherlands, and 27% in Germany did not hold any religious beliefs. Similarly, a 2012 WIN-Gallup poll estimated that 47% Chinese are atheist. 5. Declining Role of Religion During Life-Crisis Events In earlier societies, religion played a pivotal role in life-crisis events such as birth, puberty, marriage, and death. Today, these have become increasingly secularized-marriages are often civil, birthdays are celebrated without rituals, and even religious festivals are marked more by social celebration than spirituality. This shift reflects a weakening role of religious institutions and authorities in shaping key moments of personal and social life. While the above arguments and evidence suggest a significant decline in the authority and public influence of religion in modern societies, this interpretation is not uncontested. Several scholars argue that secularization has been overstated, uneven, or wrongly understood, pointing out that religion has not disappeared but has transformed, and reasserted itself in new forms. These criticisms question the universality and linearity of the secularization thesis and invite a more nuanced evaluation of its claims. Criticisms of Secularization Hypothesis 1. Problems of Measurement : Measuring religiosity is complex. Religious belief is deeply personal and not easily quantifiable by metrics like church attendance alone. 2. Invisible Religion : Thomas Luckmann, in his book Invisible Religion, argues that religion has shifted from public rituals to personal, individualized expressions of faith. Instead of public celebrations or institutional worship, modern societies have seen religious practices become more private and individual-centered. 3. New Forms of Sacred : Durkheim suggests that while traditional religious symbols may decline, modern society creates new sacred symbols-such as nation worship or the cult of the individual-that fulfill similar integrative functions. 4. Growing Religious Fundamentalism : The surge of religious fundamentalism and revivalist movements across the globe counters the secularization thesis, showing religion's continued relevance in contemporary society. Modernization has promoted secularization in many ways. However, modernization and secularization do not always move together in a uniform manner. Modernization promotes science, rationalization, urbanization, education, and institutional differentiation, all of which can weaken traditional religious authority. This is visible in many Western European societies where church attendance and religious affiliation have declined. On the other hand, the experience of West Asia, India, and several other societies shows that modernization may also coexist with religious revivalism, fundamentalism, and public religiosity. The secularization debate suggests that while religion’s public authority and institutional control over social life have weakened in many societies, this does not necessarily imply the disappearance of religion itself. Instead, religion has changed its form-becoming privatized, individualized, diversified, or reasserted in new social and political ways. Thus, rather than a linear decline, secularization appears to be a context-specific, uneven, and reversible process; shaped by history, culture, and power relations. Contemporary societies therefore reflect not a post-religious world, but a reconfigured relationship between religion, state, and society. Memory aid (own) · Evidence for secularisation (handout order) S A D S L Some Authors Dislike Surveying Lives. S = Science challenges religion; A = Attendance at church declines; D = Disengagement of the church from governance and education; S = Surveys show declining belief; L = Life-crisis events become secular. The handout numbers the five evidences in this order, so the order is kept. (order kept)"}, {"c": "14", "n": "Religion and SocietyHigh priority", "id": "4-religious-revival-in-contemporary-times", "t": "4 · Religious Revival in Contemporary Times", "x": "4 · Religious Revival in Contemporary Times # Handout only Picture hook Bathers at the Kumbh Mela. Hook for religious revival. (handout p.14) In contemporary times, contrary to the secularization thesis, we are witnessing a clear resurgence of religion in various forms. There is an increase in public piety, visible assertion of religious identity, growing interest in spirituality, large attendance at religious gatherings, and a notable rise in religious tourism and pilgrimage across the globe. This phenomenon is referred to as religious revival- a process wherein religion reclaims its place in the lives of individuals and societies in response to the challenges and discontents of modernity. Religious gatherings like the Kumbh Mela signify religious revival Understanding Religious Revival 1. Invisible Religion : In modern societies, religion often continues to exist in invisible, private forms. Thomas Luckmann , in Invisible Religion, argues that human beings are intrinsically religious, and even if religious practice is no longer publicly visible, individuals continue to rely on religion for personal meaning and comfort. 2. Reaction to Materialism : Increasingly materialistic and consumerist lifestyles leave people feeling empty and disenchanted. As a response, many seek spiritual solace. Societies with high levels of affluence - like the United States - have seen growing interest in mysticism, spirituality, yoga retreats, and Eastern wisdom. 3. Political Mobilization : In many parts of the world, the growing popularity of right-wing political parties has contributed to religious revival. These movements often glorify the religious identity of the majority community, promote conservative social values, and take strong stances on immigration and cultural nationalism, thereby reinforcing religious sentiment. 4. Technology : Modern technology has played a significant role in propagating religion. Televangelists use television to reach mass audiences; social media platforms spread religious messages rapidly. Additionally, improvements in transportation have made religious pilgrimages cheaper, faster, and more comfortable, thereby increasing participation. 5. Economic Prosperity : Religious revival is often facilitated when financial resources are available. For example, wealthy diasporas or religious patrons fund temple constructions, religious schools, and mass religious events, enabling religion to flourish. Basis Religious Revivalism Communalism Meaning Renewal or renewed assertion of religious beliefs and practices Political use of religion to mobilize one community against another Nature May be spiritual, cultural, or social Primarily political Attitude to Others Not necessarily hostile to other religions Often involves suspicion or hostility towards other communities Impact Cultural revival, spiritual renewal, deeper religiosity in a community Leads to inter-community animosity, conflict, and riots Examples Rise in pilgrimage, temple visits, spiritual movements, religious festivals Communal polarization, hate speeches, vote-bank politics Religious revivalism can create serious challenges for the modern nation-state when religious identity enters public and political life in an aggressive form. It may strengthen communal polarization, majoritarian politics, minority insecurity, and fuel demands for religion-based laws and policies. It may also challenge individual freedoms, gender equality, scientific temper, and constitutional morality. In multicultural societies like India, revivalist mobilization can blur the distinction between citizenship and religious identity. However, revivalism is not necessarily anti-secular. Moderate revival may reflect cultural pride, spiritual renewal, search for identity and meaning, or preservation of heritage. The challenge arises when religious revival turns exclusionary, political, and intolerant."}, {"c": "14", "n": "Religion and SocietyHigh priority", "id": "5-religious-fundamentalism", "t": "5 · Religious Fundamentalism", "x": "5 · Religious Fundamentalism # Handout only Religious fundamentalism refers to a militant and assertive form of religiosity that emphasizes a strict, literal interpretation of sacred texts and a desire to return to an imagined pure or original form of religion. Fundamentalist movements typically reject religious pluralism, challenge progressive values, and seek to reassert the dominance of their faith in both private and public spheres. Across the globe - from Islamic revivalism in the Middle East, Christian fundamentalism in the United States, to ultra-Orthodox Judaism in Israel - such movements reflect a complex interplay of religion, politics, identity, and social change. Understanding Religious Fundamentalism 1. Reaction against Modernization: Religious fundamentalism often emerges as a counter-response to modernization, which is perceived as eroding traditional values and identities. T.N. Madan argues that the loss of religious centrality in modern public life leads some communities to reassert their faith in a purist and rigid manner. 2. Response to Globalization: Anson Shupe highlights that globalization, by promoting cultural homogenization and economic integration, marginalizes religious traditions. In reaction, communities may turn to fundamentalism to preserve their distinct identity and resist cultural dilution. 3. Coping with Risk and Uncertainty: According to Anthony Giddens , the complexity and uncertainty of contemporary life - marked by environmental crises, economic instability, and geopolitical turmoil - drive people to seek stability and certainty. Religious fundamentals offer a structured worldview and moral clarity in such turbulent times. 4. Additional Factors: Steve Bruce suggests that fundamentalism is not just a response to modernity but also influenced by strategic and contextual factors. These include the presence of a common external enemy , and a pool of potential recruits (especially disillusioned youth). Furthermore, Bruce argues that religions based on a single sacred text are more prone to fundamentalist tendencies due to their strong ideological coherence. Religious fundamentalism is a complex phenomenon rooted in the anxieties of modernity, globalization, and social change. While it often emerges as a reactionary force defending perceived traditional values and religious purity, its growth is also shaped by deeper psychological, political, and cultural dynamics. Far from being a relic of the past, fundamentalism is a distinctly modern response to uncertainty and identity crises, often thriving in environments where religion provides a sense of order, meaning, and belonging. Sects and Cults Troeltsch classified religions into two broad types: church and sect . This classification was later expanded by other scholars into a fourfold typology - church, denomination, sect, and cult. A church is a religion that enjoys a monopoly in a society. It has a well-developed hierarchy of officials, draws its membership from all social strata, and has a large follower base. When multiple religions coexist in a society, each major religion is considered a denomination . Like churches, denominations have a sizable membership from various strata and maintain a structured hierarchy. Sects are relatively smaller and newer religious groups that have broken away from a parent religion. They often emerge in protest against specific aspects of the parent tradition. Typically, sects lack a well-developed hierarchy. Their membership base is small and often drawn from the lower social strata. Roy Wallis describes sects as deviant religious groups that see themselves as uniquely legitimate. They tend to operate in opposition to the wider world and usually demand high levels of commitment from their members. Frequently, they are led by charismatic leaders. Stark and Bainbridge argue that sects form as offshoots of existing religions. They recruit new members primarily through teaching and persuasion, rather than by birth. Over time, sects may either transition into denominations or perish. Some may become institutionalized. When a sect becomes a denomination or gets institutionalized, it tends to become more mainstream. Sects play an important role in multi-religious societies by providing smaller communities of belonging within large religious traditions. They often emerge as reformist or protest movements against ritualism, hierarchy, priestly dominance, or moral decline in the parent religion. Sects can thus democratize religion by giving voice to marginalized groups and by emphasizing personal devotion, ethical discipline, and equality. For example, many Bhakti sects in India challenged caste hierarchy and ritualism, while Protestant sects in Europe challenged the authority of the Catholic Church. However, sects may also deepen religious fragmentation if they denounce traditional religions too strongly, and claim monopoly over truth. Cults are typically small and newer religious groups that are not direct offshoots of any established or parent religion. As Stark and Bainbridge describe them, cults are, in that sense, new religions. Unlike sects, which often emerge as a reformist protest within an existing tradition, cults areinnovativeandnovel. They develop around new revelations, charismatic leaders, or alternative philosophies. Key Characteristics of Cults No clear parent religion : Cults are not derived from pre-existing religious systems and may introduce entirely new cosmologies, rituals, or doctrines. Loosely organized : Unlike churches or sects, cults often lack a formal hierarchy or bureaucratic structure. Low levels of commitment : Membership is generally fluid. Adherence to a cult is more voluntary and indicates a transactional relationship. Charismatic leadership : Many cults are centered around the personality and teachings of a single leader who is perceived as having divine insight. Experiential focus : Cults often emphasize mystical experience, personal healing, spiritual empowerment, or unconventional knowledge rather than scriptural obedience. Consumerism : Wallis contends that cults align well with modern consumer culture, offering spiritual services in exchange for participation or donations. Due to the negative connotations associated with the term cult - often linked with manipulation and brainwashing - scholars now prefer to use the term New Religious Movements. This neutral term allows for objective study without moral judgment. Examples of Cults Scientology (Founded by L. Ron Hubbard): Promotes self-knowledge and spiritual healing through \"auditing\" and Dianetics. It is highly controversial but remains influential and global. Raelian Movement (Founded by Claude Vorilhon or \"Rael\"): Believes life on Earth was created by extra-terrestrials. It combines science fiction themes with religious rituals. Heaven’s Gate (Led by Marshall Applewhite and Bonnie Nettles): A millenarian UFO cult that ended tragically in mass suicide in 1997. New Religious Movements refer to relatively recent religious or spiritual groups that exist outside established mainstream traditions. Scholars prefer to use this term instead of “cult” because it is more neutral and less value-loaded. Roy Wallis classified New Religious Movements into three orientations. First, world-rejecting movements reject mainstream society and demand total commitment from members, such as some millenarian groups. Second, world-accommodating movements do not fully reject society but provide spiritual renewal within existing religious traditions. Third, world-affirming movements accept the wider world and offer techniques for personal success, healing, self-development, or prosperity. Thus, New Religious Movements reflect the search for meaning, identity, and spiritual experience in modern societies. The modern world has seen emergence of a plethora of such movements. In fact, the growth of sects and cults or New Religious Movements in contemporary society is linked to the uncertainties of modern life. Rapid social change, urban loneliness, individualism, consumerism, weakening of traditional community ties, and dissatisfaction with established religions create a search for alternative sources of meaning. Globalization and digital media also allow spiritual ideas to spread rapidly across borders. Many such groups offer emotional support, identity, healing, discipline, and personal transformation. Some also appeal to modern consumer culture by offering spirituality as a service. Thus, the mushrooming of sects and cults reflects both religious experimentation and the anxieties of modern society. Religion and Science Religion and science have long been viewed as opposites - even as enemies. The rise of modern science played a pivotal role in the secularization of societies, as people began to rely more on empirical, rational, and scientific explanations to understand the natural and social world. Consequently, theological or religious interpretations lost centrality, especially in modern Western societies. The historical mistrust between the two is evident in incidents like the Galileo affair , where scientific discoveries were met with severe religious backlash. The relationship between Religion and Science is very complex However, contemporary scholars like John Polkinghorne have argued that the relationship between religion and science is not necessarily antagonistic. In his bookScience and Theology, Polkinghorne outlines four broad models to understand this complex relationship: 1. Conflict Model: This model views religion and science as fundamentally incompatible and mutually exclusive. Prominent figures like Richard Dawkins and Peter Atkins assert that the two represent opposing worldviews that cannot be reconciled. 2. Independence Model: This model sees religion and science as two distinct and independent domains of inquiry. According to Stephen Jay Gould , they arenon-overlapping magisteria- religion deals with purpose, meaning, and values, while science concerns itself with facts, empirical evidence, and theories about the physical world. Science and religion deal with fundamentally separate aspects of human experience. So, each stays within its own domain, and they co-exist peacefully. 3. Dialogue Model: This model suggests that both religion and science are essential for human development and should engage in constructive, mutually respectful dialogue. Institutions like the Faraday Institute and journals such as Theology and Sciencefoster such exchanges by encouraging conversation between scientists and religious scholars. Religion may shape the values and motivations of scientists; and science may refine religious interpretations. R.K. Merton has pointed out that modern science in its early development was influenced by Christianity. 4. Integration Model: According to this model, science and religion are not entirely separate but are part of a unified effort to understand reality. Lawrence Principe supports this view, arguing that the distinction between religion and science is artificial. This model stresses that several religions have historically integrated well with scientific ideas. the movement of ideas back and forth between scientific and theological thought has been more usual, and the seeming clashes are fewer and recent. Religions have played a key role in development of modern universities and libraries; and scientific research and scholarship was encouraged by religious institutions. The relationship between religion and science reflects not just a clash or coexistence of worldviews, but also the broader dynamics of how knowledge is constructed, legitimized, and institutionalized in society. As the sociology of knowledge reminds us, what is accepted as \"truth\" - whether religious or scientific - is shaped by social, cultural, and historical contexts. Understanding their interaction, therefore, not only enriches our grasp of both domains but also reveals the deeper processes through which human societies seek meaning and truth. Monism and Pluralism Religion, as a system of beliefs, has evolved diverse metaphysical and theological orientations. Among the most foundational are monism and pluralism, which offer contrasting ways of conceptualizing divinity , truth , and the path to salvation. Monism refers to the belief that ultimate reality is fundamentally one - all apparent diversity is ultimately an expression or illusion of a single, unified divine principle. Advaita Vedanta philosophy of Adi Shankaracharya is monist Monism is closely associated with Advaita Vedanta in Hindu philosophy, where Brahman is the sole, eternal reality. Monistic systems often emphasize internal spiritual experience over external ritual. They promote a more universalistic outlook - seeing all forms of life and faith as expressions of the same divine source. Pluralism is a term used in religious philosophy to refer to a worldview of multiplicity, in contrast to monism. It is the view that there are many different substances in nature that constitute reality. It acknowledges diversity rather than subsuming it into a single metaphysical unity. In Indian traditions, Dvaita philosophy represents theological pluralism - recognizing multiple souls and a God as distinct from creation. Madhvacharya believed in three entities: God, jiva (soul) and jada (maya, matter). Independent Reality is One (Vishnu). The dependent reality comprises all else - the jivas and the jadas. Vishnu is independent (svatantra), and Jiva are dependent (paratantra) on him. He is almighty, eternal, all-knowing, and compassionate Independent Reality. The second reality is dependent (asvatantra-tattva) on Him, but is an equally real universe that exists with its own separate essence. Everything that comprises the second reality, such as individual souls and matter have their own separate reality. Shintoism (Japan) and Anekantavada (in Jainism) also endorses a pluralist position. Thinkers like John Hick advocate that all major religions are culturally conditioned responses to the same ultimate reality - the Real. Both monism and pluralism offer important religious visions - one emphasizing oneness and the other diversity . These frameworks shape not only belief systems but also social attitudes. Religious Pluralism Religious pluralism refers to the coexistence and recognition of multiple religious communities within the same society. In India, Hinduism, Islam, Christianity, Sikhism, Buddhism, Jainism, Zoroastrianism, Judaism, and tribal faiths coexist. Indian society displays a wide variety of religious practices. These include idol worship, prayer, fasting, pilgrimage, festivals, meditation, yoga, ancestor worship, nature worship, spirit worship, bhakti, satsang, temple rituals, mosque prayers, church services, gurudwara congregations, and tribal sacred grove worship. Many practices are community-based and reinforce solidarity, while others are personal and devotional. Indian religious life is also marked by syncretic traditions such as Sufi shrines, Bhakti practices, shared festivals, and local cults. Thus, religious practice in India is highly diverse, combining textual traditions, folk practices, ritual observances, and everyday spirituality. India is home to several religions A multicultural society accommodates cultural and religious diversity through constitutional rights, equal citizenship, minority protections, cultural autonomy, secular governance, democratic representation, and inter-community dialogue. In India, provisions such as freedom of religion, cultural and educational rights of minorities, linguistic reorganization of states, and recognition of multiple personal and cultural practices reflect attempts to manage this diversity. Many other present-day societies such as the United States, the United Kingdom, and Singapore are also marked by multiple religious traditions living within a common political framework. In fact, religious pluralism is the order of modern societies. Pluralism is more than mere religious diversity because pluralism implies acceptance, mutual respect, and institutional accommodation of different faiths. In multifaith societies, religion performs both integrative and divisive functions. It gives individuals identity, moral values, emotional security, and a sense of community. Religious institutions also promote charity, welfare, education, and collective support. At the same time, when religion becomes politicized or exclusivist, it may generate communalism, intolerance, and conflict. Religious pluralism may result in competing personal laws, and tension between religious freedom and constitutional equality Therefore, in plural societies, religion can promote moral integration and cultural diversity, but it also requires constitutional secularism, interfaith dialogue, and state regulation to prevent conflict."}, {"c": "14", "n": "Religion and SocietyHigh priority", "id": "traps", "t": "Traps", "x": "Traps # Common mix-ups and the rule for the exam hall Trap What goes wrong, and the rule Naturism vs animism Naturism: nature worship (Müller); animism: spirit worship (Tylor). Exam-hall rule: nature vs spirit. Totemism is not just worship of an animal For Durkheim the totem represents the clan, so worship is of society. Exam-hall rule: totem = society. Weber vs Marx on religion Marx: religion reflects the base; Weber: religious ideas can drive economic change. Exam-hall rule: Weber = multicausal. Revivalism vs communalism vs fundamentalism Revivalism is renewal (may be cultural); communalism is political use of religion; fundamentalism is militant literalism. Exam-hall rule: culture, politics, literalism. Sect vs cult Sects break from a parent religion; cults are new and not offshoots. Exam-hall rule: parent religion = sect."}, {"c": "14", "n": "Religion and SocietyHigh priority", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Robertson's definition? Belief in supernatural beings with a governing effect on life Naturism by? Max Müller Animism by? E.B. Tylor Durkheim's book? The Elementary Forms of the Religious Life Tribe Durkheim studied? Arunta of Australia Malinowski's study site? Trobriand Islanders Marx on religion? Opiate of the people Feminist writers named? Karen Armstrong; Simone de Beauvoir (The Second Sex) Weber's thesis? Protestant ethic fostered the spirit of capitalism Which Franklin text does Weber quote? Necessary Hints to Those That Would Be Rich Who said capitalism began in Italy? Schumpeter Who said capitalism preceded Protestantism? Kautsky Bryan Wilson's book? Religion in Secular Society Luckmann's book? Invisible Religion Who explains fundamentalism as reaction to modernisation? T.N. Madan Giddens on fundamentalism? Response to risk and uncertainty Troeltsch's two types? Church and sect Preferred neutral term for cult? New religious movements"}, {"c": "14", "n":
