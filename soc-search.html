 adoption who usually live together and support one another; Murdock stresses common residence, economic cooperation and reproduction. *→ Is it universal and useful?* 2. Functional theory and critique. Murdock: reproductive, sexual, educational and economic functions across 200 societies; Parsons: primary socialisation and stabilisation of adult personalities (warm bath, instrumental and expressive roles). Critics cite kibbutz, female-headed households, Nayars, same-sex couples, celibates, and Vogel, Bell, Leach, Laing and Cooper on the dark side. *→ What do Marxists and feminists add?* 3. Marxist and feminist views. Engels: monogamy arose with private property and certain paternity. Marxist feminists: the family reproduces labour power and conditions docility. Liberal feminists (Oakley, Bernard) and radical feminists (Brownmiller, Hanisch) see patriarchy and call for abolition. *→ What do people actually do?* 4. Family practices and contemporary change. Morgan: family is something people do. Giddens: transformation of intimacy; trends include late marriage, live-in, single-person households, falling fertility, divorce, filiocentric families and commercialised marriage; Leach critiques the cereal packet family. *→ What of new forms?* 5. Diversity and queer kinship. Diverse forms include inter-racial and inter-religious marriage, single-parent, blended, open and same-sex families. Butler's queer theory challenges heteronormativity; queer kinship builds chosen families; India's movement traces from Section 377 to NGO activism. *→ What about women within it?* 6. Women and patriarchy. Women face unpaid care, pink-collar segregation, the reserve army role, glass ceiling and glass cliff, and sexual harassment as power. Walby's six structures: household, paid work, state, violence, sexuality, culture. Cast: G.P. Murdock = four functions of the family · Talcott Parsons = irreducible functions · Friedrich Engels = family and private property · Ann Oakley = Housewife · David Morgan = family practices · Sylvia Walby = six structures of patriarchy"}, {"c": "15", "n": "Family and KinshipHigh priority", "id": "terms", "t": "In simple words", "x": "In simple words # Murdock : family is universal (four functions); Parsons : primary socialisation and stabilisation of adult personalities . Critics : kibbutz, Nayars, female-headed homes, same-sex families ; Laing, Cooper, Leach show the dark side. Marxist/feminist : family serves property, capital and patriarchy ; Morgan : family is what people do . Queer kinship = chosen families ; Walby : six structures of patriarchy. Term In plain words Family Group linked by blood, marriage or adoption with ties of residence and support. Primary socialisation First learning of language, norms and values within the family. Warm bath Parsons: family soothes adults' stress from work. Instrumental and expressive roles Parsons: husband provides, wife nurtures. Family practices Morgan: routine everyday acts that make a family. Filiocentric family Family organised around children's needs. Heteronormativity Assumption that heterosexuality is the default. Queer kinship Chosen, non-biological, non-marital forms of family and care. Glass ceiling Invisible barrier to women's advancement (Marilyn Loden). Glass cliff Women promoted in crisis, set up to fail (Michelle Ryan)."}, {"c": "15", "n": "Family and KinshipHigh priority", "id": "1-family-and-kinship", "t": "1 · Family and Kinship", "x": "1 · Family and Kinship # Handout only Picture hook Nuclear family. Hook for the family as the primary group. (handout p.3) In sociology, the family is a socially recognized group of individuals connected by blood, marriage, or adoption, who usually live together, share emotional ties, and provide mutual support. According to G. P. Murdock , the family is a social group characterized by common residence, economic cooperation, and reproduction. It involves adults of both sexes, at least two of whom maintain a socially approved sexual relationship, and their children, whether biological or adopted."}, {"c": "15", "n": "Family and KinshipHigh priority", "id": "2-functional-theory-of-family", "t": "2 · Functional Theory of Family", "x": "2 · Functional Theory of Family # Handout only From a functional perspective , the family is regarded as a universal and indispensable institution that contributes to the maintenance of social stability and order . Functional theorists argue that social institutions exist because they perform functions that are necessary for the survival of society, and the family performs some of the most vital of these functions. Family is a fundamental social unit G. P. Murdock, on the basis of his comparative study of over 200 societies , claimed that the family exists in some form in all known societies , making it a universal institution. According to him, the family is universal because it performs four essential functions that are crucial for social survival. 1. Reproductive function of the family ensures the continuation of society by bringing forth new members. Without reproduction, no society can survive over time. 2. Sexual function of the family provides a socially approved and regulated context for the expression of sexuality. By containing and channelizing sexual behaviour within socially sanctioned boundaries, the family helps maintain social order. 3. Educational function refers to the task of primary socialization. The family is the first agency through which children learn language, norms, values, and appropriate patterns of behaviour necessary for social life. 4. Economic function of the family involves cooperation and division of labour among family members, particularly between husband and wife. The family functions as a unit of production, consumption, and economic support. While the family may not be the only institution performing these functions, it performs them very efficiently and effectively. Indeed, no society has been able to find a complete and effective substitute for the family as an institution. Talcott Parsons’ Functional Theory of the Family Talcott Parsons analysed the family as a vital social institution contributing to the maintenance, integration, and stability of the social system . Writing in the context of modern industrial society, Parsons argued that social institutions perform specific functions necessary for the survival of society. The family, though structurally transformed from extended to nuclear form, remains indispensable because it continues to perform certain basic and irreducible functions that cannot be effectively carried out by any other institution. With industrialisation, many traditional functions of the family - such as economic production, education, and welfare - have been taken over by specialised institutions like factories, schools, and the state. However, this does not imply the decline of the family. Instead, the family becomes more specialised , concentrating on functions it performs most efficiently. In modern society, the isolated nuclear family is an essential requirement, as it engages in: 1. Primary Socialisation of Children The first basic and irreducible function of the family is the primary socialisation of children. The family serves as the first and most crucial agency through which the child internalises the culture, values, norms, and role expectations of society. Through intimate and sustained interaction with parents in early childhood, the child learns fundamental social skills such as language, discipline, emotional control, and moral responsibility. Parsons argued that this early socialisation within the family is irreplaceable because it occurs in a context of deep emotional bonds , which no formal institution can replicate. Schools may provide secondary socialisation, but the foundational personality structure is formed within the family. Effective primary socialisation ensures the reproduction of social norms and helps maintain value consensus , which is essential for social order and stability. 2. Stabilisation of Adult Personalities Parsons suggests that modern industrial society is highly competitive, impersonal, and stressful. Individuals face constant pressures arising from work, achievement, and role performance. The family acts as a crucial emotional refuge where adults find psychological support, security, and emotional satisfaction. Within the nuclear family, especially in the marital relationship, adults are able to release tensions generated in the external world. This is the “warm bath” function of the family, suggesting that the family helps soothe emotional strains and prevent psychological breakdown. By stabilising adult personalities, the family contributes to the smooth functioning of the wider social system. Parsons linked these functions to a clear division of labour between spouses. He argued that the husband performs the instrumental role , oriented towards economic provision, while the wife performs the expressive role , centred on emotional care, nurturing, and socialisation. This role differentiation, according to Parsons, promotes efficiency and reduces role conflict within the family. In conclusion, Parsons’ functional theory presents the family as a specialised yet indispensable institution in modern society. It continues to perform two basic functions, which are central to maintaining social order and psychological stability, making the family a cornerstone of the modern industrial society. Memory aid (own) · Murdock's four functions of the family S E E R SEER. S = Sexual function; E = Economic function; E = Educational function; R = Reproductive function. The family is a SEER: it foresees and secures society's survival. (order free)"}, {"c": "15", "n": "Family and KinshipHigh priority", "id": "3-critique-of-functional-theory-of-family", "t": "3 · Critique of Functional Theory of Family", "x": "3 · Critique of Functional Theory of Family # Handout only Picture hook Quarrelling parents and a child covering his ears. Hook for the dark side of family life. (handout p.6) The functional theory of the family, while influential, has been criticized for presenting an overly simplistic and sanitized view of family life. Critics have questioned both the central premise of functional theory of the family- that the family is universal, and that the family is functional for the society. Some prominent criticisms are as follows: 1. Murdock’s claim that the family is a universal social institution has been challenged by several scholars who cite empirical examples of societies where the classical family structure does not appear to exist. i. One important example is the Israeli kibbutz system, where children traditionally did not co-reside with their biological parents. Instead, they were treated as children of the kibbutz and were collectively raised by the community, thereby weakening the residential and parental exclusivity emphasized in Murdock’s writings on the family. ii. Studies of poor Black neighbourhoods in North America indicate that a significant proportion of households are female-headed, with the adult male often absent. This also challenges Murdock’s assertion of a universal family having adults of both sexes residing together and cooperating economically. Among the Nayars of Kerala , the co-residential unit was matrilineal, and the iii. husband-father figure did not exist. Women lived with their sisters and children in matrilineal units, and lineage, inheritance, and authority were traced through the female line, thereby questioning the universality of the conjugal family unit. Also, in many societies, there is growing incidence of same-sex couples , with or iv. without children. Such family forms do not conform to Murdock’s emphasis on adults of both sexes maintaining a socially approved sexual relationship. v. Individuals such as celibates, saints, monks, nuns, and sex workers , who may consciously opt out of marriage and family life, are also cited as examples that appear to contradict the universality of the family. Dysfunctional perspectives challenge the functionalist view of the family as a harmonious and integrative institution. Scholars drawing from psychiatry, social psychology, and radical sociology have highlighted the darker, often neglected consequences of family life. i. Vogel and Bell , in their studies of children who developed schizophrenia, argued that mental illness can emerge as a coping mechanism in response to an emotionally toxic family environment. Their research suggested that schizophrenic children were often made emotional scapegoats for unresolved marital conflicts between parents. The child’s illness helped stabilize the family by diverting attention away from parental discord. While this scapegoating may be functional for the family unit and even for society as a whole, it can have severe dysfunctional consequences for the child, including psychological breakdown and long-term mental illness. Family life can be stressful and conflict-ridden ii. Edmund Leach , in A Runaway World? criticized the modern nuclear family by comparing it to an overloaded electrical circuit . He argued that nuclear family members place excessive emotional, economic, and psychological expectations on one another, which cannot realistically be fulfilled. Unlike traditional societies with extended kinship networks, modern nuclear families lack broader support systems, leading to heightened tensions and frequent conflict. Leach also contended that the nuclear family erects psychological barriers between its members and wider society , weakening social solidarity. According to him, greater social harmony would require reducing the exclusivity and emotional intensity imposed by the nuclear family. iii. R. D. Laing , in The Politics of the Family, viewed the family as a space where individuals may act like gangsters , offering mutual protection while simultaneously inflicting emotional violence on one another. He emphasized the intense emotional nexus within the family, particularly between father and son. “From the moment of birth, the baby is subjected to these forces of violence called love”, declares Laing. Laing argued that parents exploit their emotional power over children to extract obedience and exert psychological pressure, deeply shaping the child’s sense of emotional well-being. iv. David Cooper , in The Death of the Family, presented a radical critique of the family, arguing that every child is born with immense creative potential. The family systematically destroys this potential by suppressing individuality , creativity, passion, and aspiration. He famously suggested that“bringing up a child is bringing down a person.” Cooper argued that the internalization of the family leads to the murder of the individual, as the child is moulded into a socially acceptable but emotionally repressed adult. In conclusion, dysfunctional perspectives reveal that the family is not merely a nurturing and stabilizing institution but can also be a source of psychological stress, repression, and social pathology. These critiques caution against romanticizing the family. They underscore the need to recognize power relations, emotional violence, and structural constraints operating within family life, thereby offering a more nuanced and critical understanding of the institution."}, {"c": "15", "n": "Family and KinshipHigh priority", "id": "4-marxist-theory-of-family", "t": "4 · Marxist Theory of Family", "x": "4 · Marxist Theory of Family # Handout only Friedrich Engels, in his seminal workThe Origin of the Family, Private Property and the State, traces the historical development of the family in relation to changes in the mode of production. He argues that early primitive communist societies were characterized by group marriages with minimal restrictions on sexual behavior. In such societies, the concept of private property did not exist, and hence, there was little concern about the biological lineage of children. However, as societies transitioned towards private property ownership, especially in the hands of men, there arose a need to ensure that wealth and property were inherited by legitimate heirs - children of undisputed paternity. To secure this certainty, over time, societies began to impose increasing restrictions on sexual behavior, particularly of women, culminating in the emergence of monogamous marriage as a social institution. This form of marriage, Engels argues, was not a natural or moral evolution but a legal and ideological structure created to serve the interests of property-owning men. The state formalized and sanctified these restrictions through laws that regulated sexuality and marriage. In this framework, the institution of the family becomes a tool for transmitting private property, and the subordination of women within the family is seen as a consequence of their role in this system of inheritance and property consolidation."}, {"c": "15", "n": "Family and KinshipHigh priority", "id": "5-feminist-theories-of-family", "t": "5 · Feminist Theories of Family", "x": "5 · Feminist Theories of Family # Handout only Marxist Feminism In the 20th century, feminist scholars such as Veronica Beechey, Angela Davis, and Margaret Benston used the Marxist framework to analyze the working-class family. From a Marxist perspective, the family is part of the superstructure and serves the class interests of the bourgeoisie in several ways: 1. Reproduction of Labour Power The family ensures the biological and social reproduction of future workers required by the capitalist economy. 2. Ideological Conditioning Device Scholars like Diana Feeley and David Cooper argue that the family socializes children into personality traits (such as obedience, discipline, and punctuality) that make them docile and efficient workers in the future. 3. Reduction of Bargaining Power of the Proletariat According to Margaret Benston, the working-class man is socially and morally obligated to provide for his family. This limits his ability to withdraw labour and makes him more likely to submit to capitalist exploitation, thereby reducing collective worker resistance. 4. Unpaid Domestic Labour Benston highlights that working-class women perform large amounts of unpaid domestic labour, which is highly beneficial to capitalists. One wage sustains the labour power of two people. This domestic work frees working-class men to generate surplus value for capitalists. 5. Absorption of Working-Class Male Anger Fran Ansley famously argued that \"women are the takers of shit.\" The working-class family absorbs the anger and frustration of exploited men, thereby preventing threats to the capitalist order. Men exercise petty tyranny over wives and children, stabilizing the capitalist system."}, {"c": "15", "n": "Family and KinshipHigh priority", "id": "6-liberal-feminism", "t": "6 · Liberal Feminism", "x": "6 · Liberal Feminism # Handout only Liberal feminists argue that the family is a key site where women's subordination is produced and reinforced. Anne Oakley highlights the role of gendered socialization within the family, where girls are taught traits that conform to traditional gender roles. In her bookHousewife, she critiques the mother-housewife role as alienating and exploitative. According to Oakley, this role involves unpaid labour, long hours without breaks, no holidays, and no recognition or appreciation from society. The work is monotonous and uninspiring, offering no opportunities for growth or reward. Oakley goes so far as to say that the condition of housewives should be treated as public health concern number one. Jessie Bernard , in her analysis of marriage, presents an interesting idea: that every marriage consists of two marriages - one experienced by the man, and another by the woman. Her research suggests that married men tend to enjoy better health, longer lives, and more satisfying experiences than their unmarried counterparts. In contrast, married women are more likely to suffer from depression, illness, and feelings of inadequacy compared to unmarried women. This indicates that marriage disproportionately benefits men, while women often bear the emotional and physical costs of the institution. Many women face Domestic Violence from their partners"}, {"c": "15", "n": "Family and KinshipHigh priority", "id": "7-radical-feminism", "t": "7 · Radical Feminism", "x": "7 · Radical Feminism # Handout only Picture hook Domestic violence. Hook for the family as a site of coercion. (handout p.8) Radical feminists such as Susan Brownmiller and Carol Hanisch take a much more fundamental and revolutionary stance on the family. They argue that the heterosexual nuclear family is the central institution through which patriarchal power is maintained. The family, according to them, is not just a neutral social unit but the seat of male dominance - a patriarchal unit of a patriarchal whole. It is within the family that patriarchal ideology is reproduced, particularly through the unequal burden of childbearing and childrearing, which falls exclusively on women. Radical feminists believe that the family also functions as a site of domestic violence and coercion, where men often exercise brute force over their wives, revealing patriarchy in its most naked form. They do not view reform within the current structure as sufficient; rather, they call for the abolition of the traditional family itself. Brownmiller and Hanisch advocate for the creation of alternative social arrangements that are free from patriarchal control and more equitable in nature. According to this perspective, only by dismantling the traditional family can true gender equality be achieved."}, {"c": "15", "n": "Family and KinshipHigh priority", "id": "8-focus-on-family-practices", "t": "8 · Focus on ‘Family Practices’", "x": "8 · Focus on ‘Family Practices’ # Handout only David Morgan is a key contemporary sociologist of the family, best known for developing the concept of family practices. He argues that the family should not be seen as a fixed institution or structure (like nuclear or joint family), but as something people do in their everyday lives. According to Morgan, family is created and sustained through routine, ordinary activities such as caring, eating together, sharing money, celebrating rituals, maintaining emotional ties, and staying in touch. These repeated actions constitute family practices, through which people actively “make” family. Morgan’s approach shifts focus from what a family is to how family life is lived . This helps sociology move beyond rigid definitions based on marriage, blood, or co-residence, and instead recognize diverse family forms such as live-in relationships, same-sex families, single-parent households, and stepfamilies. Morgan acknowledges that family practices are embedded in wider social contexts. They are shaped by factors like gender norms, class, employment patterns, state policies, culture, and life course stages. For example, caring practices differ across social classes and between men and women. Morgan also emphasizes that family practices are fluid, negotiated, and dynamic , changing over time as relationships, responsibilities, and circumstances change. This makes his approach particularly useful for understanding contemporary transformations in marriage and family."}, {"c": "15", "n": "Family and KinshipHigh priority", "id": "9-criticisms", "t": "9 · Criticisms", "x": "9 · Criticisms # Handout only 1. Neglect of structure and power: Critics argue that Morgan’s focus on everyday practices underplays structural constraints such as patriarchy, class inequality, and state regulation, which strongly shape family life. 2. Limited attention to inequality: While Morgan acknowledges gender and class, his framework does not sufficiently explain systematic inequalities, especially women’s disproportionate burden of care work. 3. Over-emphasis on agency: By stressing what individuals “do,” the approach may exaggerate individual choice and flexibility, ignoring situations where people have little control over family arrangements. 4. Conceptual vagueness: The idea of “family practices” is sometimes criticized as being too broad and loose, making it difficult to clearly distinguish family from other close social relationships. David Morgan’s concept of family practices is a major contribution to the sociology of the family, especially in understanding diversity, change, and lived experience in contemporary societies. However, its emphasis on micro-level practices needs to be complemented with stronger attention to power, inequality, and structural forces to provide a more complete sociological explanation."}, {"c": "15", "n": "Family and KinshipHigh priority", "id": "10-contemporary-trends-in-marriage-and-fami", "t": "10 · Contemporary Trends in Marriage and Family", "x": "10 · Contemporary Trends in Marriage and Family # Handout only Marriage and family, though long regarded as stable and enduring social institutions, are undergoing profound transformations in contemporary societies. Processes such as industrialisation, urbanisation, individualisation, women’s education, and the expansion of market and state institutions have significantly altered patterns of intimacy, partnership, and family life. Sociologists like Anthony Giddens point to a broader transformation of intimacy, marked by greater emphasis on choice, emotional fulfilment, and reflexivity. As a result, traditional norms governing marriage and family are being reworked, giving rise to diverse forms such as late marriage, live-in relationships, single-person households, declining fertility, and changing intergenerational relations. 1. Transformation of Intimacy In pre-industrial societies, marriage was primarily based on pragmatic concerns like reproduction, sex, and division of labour, and was rooted in religious and moral permanence. With industrialization, the idea of romantic love emerged as the new basis for marriage, popularized by literature and media. Dating apps have introduced a new dimension in human intimacy In contemporary society, Anthony Giddens argues that we are witnessing the rise of \" plastic sexuality \" - sexuality detached from reproduction and shaped by individual choice. Marriages now tend to last only as long as both partners feel fulfilled, resulting in fluidity and diversity in family arrangements. 2. Late Marriages According to the American Census 2018, the average age at first marriage has risen significantly, indicating a major shift in life course planning. This trend is also reflected globally, particularly in urban areas. Late marriages have important social implications: they often lead to shorter reproductive spans, lower fertility rates, and greater individualism, impacting both family structures and cultural expectations. 3. Live-in Relationshipsm Unmarried cohabitation is increasingly gaining acceptance, especially among younger, urban populations. These arrangements reflect a decline in the social pressure to marry and a preference for flexible, commitment-light forms of intimacy. Such relationships challenge the traditional family model and raise new questions about legal rights, social legitimacy, and emotional stability. Even in India, the courts and several laws have recognised live-in relationships between consenting adults. The legal system has also extended limited legal protection relating to maintenance and domestic violence, indicating gradual legal accommodation of changing family forms without equating live-in relationships with marriages. 4. Single-Person Households More individuals, especially in developed countries, are choosing to live alone, driven by economic independence, delayed marriage, or personal preference. This rise reflects growing individualism and changing notions of success and fulfillment, where solitude is no longer stigmatized but sometimes even celebrated. 5. Decline in Fertility Global fertility rates have been steadily declining due to delayed marriages, career prioritization, urbanization, and the rising cost of child-rearing. This trend has long-term implications for population ageing, labour supply, and intergenerational dynamics within families. There is also a visible rise in both voluntary and involuntary childlessness, particularly in industrial and post-industrial societies. Many couples choose to remain child-free for lifestyle, ecological, or financial reasons. This shift reflects changing ideas of fulfillment and identity beyond parenthood. 6. Increasing Divorce Rates Divorce rates have risen due to reduced stigma, financial independence of women, simplified legal processes, and secular attitudes toward marriage. Many now see marriage as a transactional arrangement, not a sacred lifelong bond. This trend leads to more single-parent and step-families, yet sociologists like Talcott Parsons argue that the high rate of remarriage reflects continued cultural support for marriage itself. 7. Changing Kinship Relations Contemporary kinship relations are undergoing significant social transformation. Husband - wife relationships are becoming increasingly based on companionship, emotional fulfilment, and negotiation rather than rigid gender roles. Parent - child relations have also become more democratic, with greater emphasis on dialogue, emotional bonding, and individual autonomy. At the same time, the importance of extended kin has declined. Greater geographical mobility and changing lifestyles have weakened the control of kin over marriage, residence, and other personal decisions. Kinship has thus adapted to the changing realities of modern society. 8. Filiocentric Families Contemporary Western families have also become increasingly filiocentric, i.e. the children become the central axis of family life. This transformation is closely tied to broader demographic changes - declining fertility and delayed childbearing mean fewer children, thereby intensifying parental investment in each child. Increasingly, families are concentrating economic, emotional, and societal resources on upbringing of fewer children. Further, in modern societies marked by competitive labour markets, children are viewed as key projects of social mobility , leading to what is termed as “intensive parenting” - highly planned, time-consuming, and resource-heavy childrearing. This trend reflects the emotionalization of the family, where the family’s primary function shifts from production and kinship continuity to emotional support and personality stabilization (Talcott Parsons), with children as the focal recipients of this emotional investment. The weakening of patriarchal authority and extended kinship obligations further displaces traditional centres of power, making family decisions - residential, occupational, and lifestyle - largely oriented around the perceived interests of the child. Consumer capitalism further reinforces this orientation by constructing children as significant consumers. 9. Commercialization of Marriage A significant contemporary trend is the growing commercialization of marriage , wherein what was historically embedded in religious and community obligations is now increasingly shaped by market logic, consumer culture, and calculative rationality . Marriage has shifted from being primarily a sacramental or ritualistic union to a highly commodified event , marked by the expansion of the “wedding industry” - event management, destination weddings, designer consumption, and curated experiences. This reflects the penetration of market forces into intimate life , where even personal relationships are mediated through economic transactions. Simultaneously, kinship ties are becoming more instrumental and negotiated , with considerations of status, lifestyle compatibility, earning capacity, and social capital often outweighing traditional norms of lineage, religion, or community. This transformation is driven by multiple interrelated factors. The rise of consumer capitalism and social media has redefined marriage as a site of display, aspiration, and identity construction, while growing individualism have weakened community control, allowing greater scope for choice but also introducing a cost-benefit calculus into partner selection. The spread of education and women’s employment has further altered the terms of marriage, making it more contractual and negotiated rather than community and custom-based. Additionally, digital platforms and dating apps have formalized partner search into a quasi-marketplace governed by preferences and filters, reinforcing transactional tendencies. Thus, marriage today increasingly reflects a shift from ritual obligation to commercialized and negotiated exchange, indicating the broader restructuring of family and kinship under conditions of modernity and market expansion."}, {"c": "15", "n": "Family and KinshipHigh priority", "id": "11-diversity-in-marriage-and-family", "t": "11 · Diversity in Marriage and Family", "x": "11 · Diversity in Marriage and Family # Handout only The traditional image of the family as a nuclear unit composed of a heterosexual couple and their biological children has undergone significant transformation in contemporary societies. Globalization, rising individualism, and the expansion of rights-based discourses have all contributed to reshaping the meaning and structure of family. Today, family arrangements are marked by diversity, reflecting the multiple ways in which people choose to organize their domestic lives. Edmund Leach critiques the \"cereal packet\" model of the family - which assumes a standardized, nuclear format - as being far removed from contemporary social reality. According to him, families today appear in diverse forms such as same-sex couples, single-person households, elderly living alone, and non-biological parenting arrangements. These new configurations reflect changing notions of intimacy, gender, and kinship. 1. Inter-Racial and Inter-Religious Marriages In the United States, the trend toward inter-racial and inter-religious unions has grown substantially. Inter-racial marriages increased from 3% in 1967 to 17% in 2015, while inter-religious marriages grew from 19% to 39% over the same period. These changes reflect greater autonomy in partner selection, as well as rising cultural and religious tolerance in society. 2. Unmarried Cohabitation Live-in relationships are increasingly getting accepted as an alternative to formal marriage, especially in urban and youth cultures. This trend highlights a move toward individual freedom, flexibility, and negotiated intimacy, challenging the normative sequence of marriage followed by childbearing and lifelong cohabitation. 3. Single Parent Families These are families in which children are raised by only one parent due to divorce, separation, widowhood, non-marital births, adoption, or choice. Their growing prevalence reflects changing family forms, greater individual autonomy, and evolving social attitudes towards marriage and parenthood. 4. Blended Families As divorce and remarriage become more common, blended families - where children from previous relationships live together with step-siblings and step-parents - are on the rise. These families involve complex dynamics of shared parenting, multiple households, and flexible definitions of kinship. 5. Open Relationships Beyond monogamy, a small but visible segment of society is embracing polyamorous or open relationships, where individuals consensually engage in romantic or sexual relationships with multiple partners. These arrangements challenge the notion of marriage and deeply entrenched cultural norms around fidelity. 6. Same-Sex Families With increasing legal recognition and social acceptance, same-sex unions are becoming more visible. Same-sex couples are also raising children through adoption or surrogacy. These families challenge heteronormative assumptions and contribute to an expanded understanding of love, care, and parenting. Overall, the growing diversity in marriage and family highlights the declining dominance of a single, normative model of personal life. Instead of uniformity, contemporary societies are characterised by pluralism, where relationships are increasingly shaped by individual choice, negotiated norms, and changing ideas of legitimacy and commitment. This diversification challenges law, policy, and social attitudes to move beyond rigid definitions of family. In conclusion, contemporary trends in marriage and family reflect not the decline of these institutions but their reconfiguration in response to wider social, economic, and cultural changes. While traditional forms have weakened, new patterns of intimacy and family life have emerged, emphasising autonomy, negotiation, and emotional satisfaction. These changes pose challenges such as loneliness, ageing without support, and marital instability, but they also expand individual choice and redefine relationships on more egalitarian terms."}, {"c": "15", "n": "Family and KinshipHigh priority", "id": "12-queer-theory", "t": "12 · Queer Theory", "x": "12 · Queer Theory # Handout only Queer theory emerged in the early 1990s as an interdisciplinary critical framework that challenges fixed categories of gender and sexuality. Queer theory questions the very foundations of how society defines what is “normal” in terms of sexual and gender identities. At its core, queer theory argues that sexuality and gender are socially constructed , fluid, and performative-not fixed, natural, or biologically determined. Thinkers like Judith Butler , in her work Gender Trouble (1990), argue that gender is not something one is, but something one does repeatedly through actions and behaviors. In this view, both gender and sexuality are performed roles , maintained through repetition and social expectation. Same sex unions are gaining visibility and acceptance Queer theory challenges heteronormativity in society - the assumption that heterosexuality is the default, natural, and default mode of sexual orientation. This ideology presents binary gender roles (man/woman), heterosexual attraction, and nuclear family models as the societal norm, marginalizing all other forms of identity and relationship. Queer theorists argue that heteronormativity is deeply embedded in laws, media, education, religion, and everyday language, shaping how people perceive themselves and others. This normative framework invisibilizes queer lives and delegitimizes non-heterosexual identities. As a consequence of heteronormativity, homophobia becomes systemically reinforced. Homophobic attitudes and value systems in society consider homosexuality as unnatural, immoral, and sinful, viewing it as destabilizing and threatening to the institution of marriage and family. It is often portrayed as a sexual perversion characterized by promiscuity, non-monogamous relationships, and as a source of sexually transmitted diseases. Homosexuality is condemned by such homophobic societal attitudes as a threat to children and, in many cultures, as a western cultural import. Queer theory sees homophobia not just as hate or fear of homosexuals, but as a broader effort to maintain rigid gender and sexual binaries. Homophobia is not just about individual prejudice, but is structural violence and cultural erasure. Queer theory aims to question fixed gender identities , critique the power structures that privilege heterosexual norms, and create space for a plurality of sexual and gender expressions . It offers a powerful lens for examining the politics of identity, intimacy, and desire beyond the binary. In The History of Sexuality (1976 - 1984), Michel Foucault argues that this period saw an unprecedented proliferation of discourse around sex , as medical, legal, religious, and scientific institutions began to categorize and regulate different forms of sexuality in the west-prompting individuals to confess and define their sexual identities. Foucault contends that sexuality is a social construct , emerging as a distinct sphere only in modernity. “Homosexuality” became an identity category through historical processes of classification and control. Rather than repressing sex, modern societies categorized and scrutinized it-turning it into a site of power - knowledge. This work laid the intellectual groundwork for queer theory , gender studies, and feminist scholarship, inspiring scholars to analyze how sexual norms are historically contingent and institutionally reinforced. Indian heteronormativity challenges alternative sexuality as ‘western’ or ‘un-Indian’. Ruth Vanita and Saleem Kidwai 's ground-breaking bookSame-Sex Love in India: Readings from Literature and History(2000) however challenges the common misconception that same-sex desire is a Western import. Through a rich compilation of texts from ancient to modern India-ranging from Sanskrit epics to court chronicles and colonial records-the authors demonstrate that same-sex relationships have long been part of Indian cultural and literary traditions. The book provides historical evidence of both male and female same-sex love, illustrating how diverse Indian societies acknowledged, and, at times, even celebrated such relationships. The socio-cultural acknowledgment and acceptance of non-conformist sexual identities can be seen in India’s civilizational heritage. Devdutt Pattanaik’sShikhandi and Other Tales They Don’t Tell You explores themes of gender fluidity and queerness in Indian mythology. Through retellings of stories from the Mahabharata, Ramayana, and Puranas, Pattanaik highlights how ancient Indian traditions recognized non-binary identities and same-sex relationships, challenging the idea that queerness is un-Indian or modern."}, {"c": "15", "n": "Family and KinshipHigh priority", "id": "13-queer-kinship", "t": "13 · Queer Kinship", "x": "13 · Queer Kinship # Handout only Picture hook Same-sex couple. Hook for queer kinship and chosen family. (handout p.14) Queer theory has significantly expanded the sociological understanding of kinship by questioning the assumption that family and kinship must necessarily be based on heterosexual marriage, biological reproduction, and blood relations. Queer kinship refers to forms of family, intimacy, care, and belonging created by LGBTQ+ individuals that often extend beyond conventional biological or marital ties. Such kinship networks may be based on friendship, chosen families, co-parenting, adoption, assisted reproduction, or long-term same-sex partnerships. Illustrations of queer kinship include same-sex couples raising children through adoption or assisted reproduction, LGBTQ+ individuals forming \"chosen families\" based on friendship and mutual care, and increasing legal recognition of same-sex unions in several countries. These developments illustrate the growing diversity of family forms in contemporary societies. Queer kinship challenges the traditional kinship system in several ways. It questions the heteronormative assumption that marriage is exclusively between a man and a woman. It separates kinship from biological reproduction by recognizing adoption, surrogacy, and assisted reproductive technologies; and it broadens the idea of parenthood beyond biological motherhood and fatherhood. It emphasizes emotional commitment, care, and mutual support over blood relationships. Thus, queer kinship demonstrates that kinship is not merely a biological institution but also a socially constructed and culturally negotiated relationship."}, {"c": "15", "n": "Family and KinshipHigh priority", "id": "14-lgbt-rights-movement-in-india", "t": "14 · LGBT Rights Movement in India", "x": "14 · LGBT Rights Movement in India # Handout only Picture hook Delhi Queer Pride march. Hook for the LGBT rights movement. (handout p.16) The history of the LGBT rights movement in India is deeply layered, tracing its roots to literature and reformist thought even during the colonial period. Pride parades are now organized regularly in metro cities in India by LGBT rights activists While the British Raj criminalized homosexuality through Section 377 of the Indian Penal Code (1861) , Indian society and writers often approached gender and sexuality with more nuance and empathy. During the colonial era, voices like Mahatma Gandhi acknowledged same-sex desire, though often from a moral-reformist lens. Gopal Bandhu Das , Pandey Bechan Sharma (Ugra) , and Firaq Gorakhpuri wrote candidly about homoerotic desire, often wrapped in literary symbolism or social critique. Ismat Chughtai ’s bold 1942 Urdu short story Lihaaf subtly portrayed lesbian intimacy and remains a landmark in South Asian queer literature. In the 1970s, publication of The World of Homosexuals- India’s first book to openly discuss homosexuality with compassion and advocacy was a landmark and systematic assessment of homosexuality in India. The 1990s marked a turning point , with the rise of identity politics, NGO activism, and greater visibility of queer lives. Organizations like Humsafar Trust and Naz Foundation played key roles in advocacy, health rights, and legal reform. The movement gained momentum through public pride marches, art, cinema, and legal battles. After a long struggle, Section 377 was read down in 2018 by the Supreme Court of India, decriminalizing consensual homosexual acts among adults."}, {"c": "15", "n": "Family and KinshipHigh priority", "id": "15-same-sex-marriage-and-population-dynamic", "t": "15 · Same-Sex Marriage and Population Dynamics", "x": "15 · Same-Sex Marriage and Population Dynamics # Handout only The debate on same-sex marriage has also generated sociological discussions on its possible implications for population dynamics. Since same-sex couples generally do not reproduce biologically as a couple, critics argue that wider acceptance of same-sex marriages may contribute, at the margin, to lower fertility rates in societies already experiencing demographic transition. However, sociologists point out that the impact on overall population growth is likely to be limited because LGBTQ+ persons constitute a relatively small proportion of the population. Moreover, many same-sex couples become parents through adoption, surrogacy, assisted reproductive technologies, or previous heterosexual marriages. From a sociological perspective, the significance of same-sex marriage lies less in its demographic impact and more in expanding the social definition of family, marriage, citizenship, and equal rights. Thus, debates surrounding same-sex marriage primarily concern inclusion, dignity, and legal recognition rather than population decline. Today, while some legal progress has been made in queer rights, the LGBT rights movement continues to push for broader acceptance, anti-discrimination laws, and the right to marry, adopt, and live freely without stigma."}, {"c": "15", "n": "Family and KinshipHigh priority", "id": "16-position-of-women-in-society", "t": "16 · Position of Women in Society", "x": "16 · Position of Women in Society # Handout only Across cultures and societies, women have traditionally occupied a subordinate position to men. Patriarchy is a global phenomenon. According to UN Women, women account for over two-thirds of the world’s illiterate population. Less than 20% of the world’s landholders are women. The World Bank reports that only 6 countries globally provide equal legal rights for women to work as men. The UN also notes that, globally, women perform three times more unpaid domestic work compared to men. According to Sylvia Walby in her bookTheorizing Patriarchy, patriarchy is a system of social structures and practices in which men dominate, oppress, and exploit women. Sexual Division of Labour and Patriarchy Across societies, specific tasks have historically been assigned based on gender roles. G.P. Murdock, after studying 224 societies, found that sexual division of labour and patriarchy are near-universal phenomena, based on biological differences. There are undeniable differences in the male and the female body Women's limited mobility due to childbirth and child-rearing led to their association with household-based tasks. Men's greater muscular strength led to their assignment to physically demanding tasks. Tasks requiring travel or mobility were typically assigned to men, while domestic or nearby tasks were assigned to women. Women were often limited to nurturing roles (e.g., nurses, teachers), while men dominated more public and formal work spheres. However, Ann Oakley challenges Murdock’s claim and the widespread assumption that the sexual division of labour is universal across cultures. Drawing on cross-cultural evidence, she points out that tasks commonly perceived as gender-specific are, in fact, performed by both men and women in various societies. For instance, in 38 societies, both genders participate in cooking, and in 14 societies, lumbering is a shared activity. Critics of Murdock also refute the notion that women’s biological makeup limits their capabilities."}, {"c": "15", "n": "Family and KinshipHigh priority", "id": "17-women-in-the-economy", "t": "17 · Women in the Economy", "x": "17 · Women in the Economy # Handout only Labour Force Participation According to the ILO, the global gender gap in Labour Force Participation Rate (LFPR) is 23%. Higher gender gaps in LFPR are observed in developing countries (South Asia: ~50% gender gap in LFPR). Occupational Segregation Women are often employed in \"pink-collar jobs\" (less prestigious and lower-paid roles). Oakley observed that many such jobs mirror women’s traditional domestic roles. According to Oakley, many so-called “women’s jobs” are merely extensions of traditional domestic roles , not the result of natural aptitude or limitations. Women as part of Reserve Army of Labour In Marxist theory, the reserve army of labour refers to a pool of unemployed or underemployed workers that capitalists can draw upon when needed. Marxist feminist scholars like Veronica Beechey argue that women often form a significant part of this reserve army. They are drawn into the workforce during times of labour shortage (e.g., wars or economic booms) and pushed back into domestic roles during downturns. This flexible, secondary status of women workers helps keep wages low and serves capitalist interests by maintaining a cheap, disposable workforce."}, {"c": "15", "n": "Family and KinshipHigh priority", "id": "18-barriers-in-the-workplace", "t": "18 · Barriers in the Workplace", "x": "18 · Barriers in the Workplace # Handout only Picture hook Harassment at the workplace. Hook for power and control. (handout p.18) Women encounter barriers like glass ceiling, glass cliff and sexual harassment in the workplace. Glass Ceiling (term coined by Marilyn Loden) refers to the invisible barriers preventing women’s career advancement. Many working women have to deal with sexual harassment in offices The notion of Glass Cliff , introduced by Michelle Ryan, describes how women are more likely to be promoted during times of organizational crisis, so they can be blamed when failure occurs. Sexual harassment at the workplace , from a feminist perspective, is not merely about individual misconduct but a tool of power and control used to reinforce gender hierarchies. It reflects deeply rooted patriarchal norms that view women as subordinate and their presence in professional spaces as threatening to male dominance. As Elizabeth Stanko observes,sexual harassment is about exercising power rather than sexual desire. It functions as a mechanism to police women's behavior, limit their mobility, and discourage their full participation in the workforce. Role of Religion in Patriarchy Nearly all major world religions are patriarchal. Karen Armstrong argues that religions are overwhelmingly male-dominated: Founders of most religions are men. Religious leaders and priests in most cultures are exclusively or mostly men Gods are often male; priesthood and top religious leadership are male. Menstruation is considered taboo, and women are excluded from key rituals. Simone de Beauvoir , in her book The Second Sex, suggests religion acts as \"opium for women\" glorifying motherhood and defining women in roles like the obedient wife. Patriarchy as Ideology Patriarchy functions as an ideology that legitimizes male dominance over women across various spheres of social life. It comprises a set of beliefs and values that normalize and justify the superiority of men and the subordination of women. This ideological system draws a rigid line between masculine and feminine traits, assigning higher worth to traits coded as masculine - such as dominance, aggression, rationality, and emotional restraint - over feminine traits like passivity, sensitivity, emotionality, and domesticity. Patriarchal ideology further rationalizes male control over women's bodies, sexuality, reproduction, and mobility. It manifests in son preference, unequal inheritance rights, and the social devaluation of the girl child in many cultures. This ideology is institutionalized and perpetuated through various social institutions such as religion, legal systems, educational curricula, family upbringing, and mass media, all of which help reproduce gender hierarchies in everyday life. Patriarchy and Development Patriarchy has profound implications for social development as it restricts women's capabilities, opportunities, and participation in public life. Gender discrimination in education, health, employment, and political participation reduces human capital, labour force participation, and overall economic productivity. Patriarchal norms also normalize gender-based violence, unequal division of domestic labour, and poor health outcomes, thereby hindering inclusive and sustainable development. Conversely, greater gender equality enhances educational attainment, economic growth, democratic participation, and human development. Thus, sociologists, economists, and policy makers increasingly view the dismantling of patriarchal structures as a prerequisite for equitable social development."}, {"c": "15", "n": "Family and KinshipHigh priority", "id": "19-patriarchy-as-social-structure", "t": "19 · Patriarchy as Social Structure", "x": "19 · Patriarchy as Social Structure # Handout only Sylvia Walby, a prominent British sociologist, conceptualized patriarchy as a system of social structures and practices in which men dominate, oppress, and exploit women. In her influential work “Theorizing Patriarchy” (1990), she identified six interrelated structures through which patriarchy is maintained and reproduced in society. 1. The Household : Women are often confined to unpaid domestic labour , child-rearing, and caregiving roles within the household. This limits their autonomy and economic independence. On one hand, increasing female education and labour force participation, have led to greater sharing of household responsibilities in many modern families. However, time-use surveys continue to show that women perform a disproportionate share of unpaid domestic and care work, indicating that change has been gradual rather than complete. 2. Paid Work : Even in the public sphere, women face occupational segregation, wage gaps, and glass ceilings. Men dominate higher-paying, prestigious positions, while women are clustered in low pay, precarious jobs. 3. The State : State policies and legal frameworks often reflect male interests, with inadequate support for reproductive rights, gender-based violence, and labour protections for women. 4. Violence : Gender-based violence is a tool of control and subjugation. From domestic abuse to sexual harassment, violence reinforces male power and female vulnerability. 5. Sexuality : Patriarchal control extends to women’s sexuality, promoting norms that valorize male sexual freedom while policing and restricting female sexual expression. 6. Culture : Cultural institutions like religion, media, literature, and education reproduce gender stereotypes and legitimize male superiority, further embedding patriarchal values in society. Together, these six structures show that patriarchy is not just about individual attitudes, but a systemic and institutionalized form of domination affecting every domain of women’s lives. Walby’s model is valuable because it allows analysis of both public and private patriarchy, and how they vary across cultures and time. Patriarchal Bargain Deniz Kandiyoti, a Turkish feminist scholar, introduced the concept of the \"Patriarchal Bargain\" in her influential 1988 essay “Bargaining with Patriarchy.” The concept refers to the tacit or strategic compromises that women make within patriarchal systems to maximize their security, status, or life chances, even while remaining within unequal power structures. Muslim girls protesting against the ban on Hijab in Karnataka colleges Patriarchal bargain means that, in a patriarchal culture, a woman upholds patriarchal norms, accepts gender stereotypes, and also imposes them on other women. By doing so, she maximizes her own power and prestige. Thus, a woman conforms to the demands of patriarchy in order to gain some benefits - these benefits may be psychological, emotional, or social. Patriarchy, thus, rewards individual women who internalize patriarchal ideology and uphold its norms and values. Thus, women actively participate in legitimising, upholding, and perpetuating patriarchy. While, individually, a woman gains through the patriarchal bargain, but, for women collectively, it results in a loss. Global Gender Gap Report , published annually by the World Economic Forum, provides a comprehensive assessment of gender inequalities across the world by benchmarking the relative gaps between women and men in key areas. It tracks progress over time and highlights both gains and persistent disparities in gender parity. This report evaluates gender disparities across four key dimensions: 1. Health and Survival 2. Educational Attainment 3. Economic Participation 4. Political Empowerment Key Highlights (2025): Overall global gender gap: 31.2% Best-performing region is Northern America, closely followed by Europe. India ranks 131 out of 148 countries. The 2025 report reveals that while meaningful progress has been made towards closing gender gaps, especially in education and health, women’s position in economic and political life remains significantly disadvantaged compared to men. Persistent gender disparities underscore the structural and cultural barriers that women continue to encounter globally. Increasing women's education across societies has improved awareness of legal rights, labour force participation, political participation and decision-making within families. However, education alone has not eliminated patriarchal discrimination because gender inequality continues to be reproduced through cultural norms, labour markets, inheritance practices and domestic responsibilities. The report’s long-term projections suggest that, at the current pace, achieving full gender parity could take well over a century, underscoring the need for accelerated policy action, institutional reforms, and societal change to ensure that women can participate fully and equally in all spheres of social, economic, and political life. PYQs Memory aid (own) · Walby's six structures of patriarchy (handout order) H P S V S C Hungry People Sometimes Value Spicy Curry. H = Household; P = Paid work; S = State; V = Violence; S = Sexuality; C = Culture. The handout numbers the six structures in this order, so the order is kept. (order kept)"}, {"c": "15", "n": "Family and KinshipHigh priority", "id": "traps", "t": "Traps", "x": "Traps # Common mix-ups and the rule for the exam hall Trap What goes wrong, and the rule Murdock vs Parsons Murdock lists four universal functions; Parsons names two functions of the modern nuclear family. Exam-hall rule: Murdock = four; Parsons = two. Liberal vs radical feminism Liberal: reform and equal socialisation (Oakley); radical: abolish the patriarchal family. Exam-hall rule: reform vs abolition. Family practices is not a structure Morgan studies what people do, not nuclear versus joint form. Exam-hall rule: practice, not form. Queer theory vs queer kinship Queer theory challenges fixed gender and sexuality; queer kinship is the resulting family forms. Exam-hall rule: theory first, then kinship. Same-sex marriage and population Impact on population is limited; the significance is inclusion and legal recognition. Exam-hall rule: say 'limited demographic impact'."}, {"c": "15", "n": "Family and KinshipHigh priority", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Murdock's definition? Common residence, economic cooperation and reproduction Murdock's four functions? Reproductive, sexual, educational, economic Parsons' two irreducible functions? Primary socialisation; stabilisation of adult personalities Warm bath? Family as emotional refuge for adults Instrumental vs expressive? Husband provides; wife nurtures Which Indian group questions the conjugal family? Nayars of Kerala (matrilineal) Leach's image of the nuclear family? Overloaded electrical circuit Laing's book? The Politics of the Family Cooper's book? The Death of the Family Engels' book? The Origin of the Family, Private Property and the State Oakley's book? Housewife Who said every marriage is two marriages? Jessie Bernard Radical feminists named? Susan Brownmiller and Carol Hanisch Morgan's concept? Family practices Butler's work? Gender Trouble (1990) Glass ceiling and glass cliff coined by? Marilyn Loden; Michelle Ryan Walby's book and year? Theorizing Patriarchy, 1990 Six structures of patriarchy? Household, paid work, state, violence, sexuality, uild the answer from the notes under: Functional Theory of Family; Marxist Theory of Family; Feminist Theories of Family. Close: finish with the matching criticisms section and a one-line judgement. 2021 · 20 marks · Discuss the changing nature of kinship relations in the contemporary world. Question. Discuss the changing nature of kinship relations in the contemporary world. Intro: name Family and Kinship and state the central idea in one line (see The story first). Body: build the answer from the notes under: Contemporary Trends in Marriage and Family. Close: finish with the matching criticisms section and a one-line judgement. 2021 · 20 marks · Explain how the pattern of patriarchy is being altered in the family and at the workplace in the pre… Question. Explain how the pattern of patriarchy is being altered in the family and at the workplace in the present context. Intro: name Family and Kinship and state the central idea in one line (see The story first). Body: build the answer from the notes under: Patriarchy as Social Structure. Close: finish with the matching criticisms section and a one-line judgement. 2020 · 20 marks · What is the impact of gender division of labour on the development of society? Question. What is the impact of gender division of labour on the development of society? Intro: name Family and Kinship and state the central idea in one line (see The story first). Body: build the answer from the notes under: Women in the Economy. Close: finish with the matching criticisms section and a one-line judgement. 2019 · 20 marks · In the light of judicial intervention on 'Live-in relationships', discuss the future of marriage and… Question. In the light of judicial intervention on 'Live-in relationships', discuss the future of marriage and family in India. Intro: name Family and Kinship and state the central idea in one line (see The story first). Body: build the answer from the notes under: Contemporary Trends in Marriage and Family. Close: finish with
