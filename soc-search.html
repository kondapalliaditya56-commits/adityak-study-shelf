/* ---- reader app ---- */
:root{--zoom:1;--lh:1.65;--pw:780px}
:root[data-theme="sepia"]{--bg:#F4ECD8;--surface:#FBF5E6;--surface2:#EADFC4;--ink:#3B3022;--muted:#7A6A52;--line:#D8C9A6;--acc:#7A4A12;--acc-ink:#fff;--acc-soft:#EFDDB8;--saf:#A4470A;--saf-soft:#F6E2BE;--red:#9C2A1C;--red-soft:#F3D9CB;--blue:#2F5C8A;--blue-soft:#DDE6E4;--good:#3E6B2A;--good-soft:#DDE8C8;--hl:#F2D98A;color-scheme:light}
:root[data-font="sans"] body{font-family:var(--sans)}
:root[data-font="sans"] .notes p,:root[data-font="sans"] .notes li{font-family:var(--sans)}
.page{zoom:var(--zoom);max-width:var(--pw)}
.notes p,.notes li{line-height:var(--lh)}
.rbar{position:fixed;left:0;top:0;height:3px;width:0;background:var(--acc);z-index:40;transition:width .15s}
.aabtn{color:var(--ink);border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:5px 12px;font:700 14px var(--serif);cursor:pointer;flex:none}
.h2read{float:right;margin:2px 0 0 10px;font:600 12px var(--sans);border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer;min-height:30px}
.h2read[aria-pressed="true"]{background:var(--acc-soft);color:var(--acc);border-color:var(--acc)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;justify-content:center}
.dock button{font:600 14px var(--sans);min-height:44px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;padding:0 14px;cursor:pointer}
.dock .mid{flex:1;max-width:520px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock .mid b{color:var(--acc)}
body.has-dock .page{padding-bottom:110px}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheetin{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:82vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));font:15px/1.4 var(--sans)}
.sheetin h3{margin:0 0 10px;font:700 17px var(--sans)}
.srow{display:flex;align-items:center;gap:10px;margin:12px 0;flex-wrap:wrap}
.srow label{flex:0 0 92px;color:var(--muted);font-weight:600}
.srow .grp{display:flex;gap:6px;flex-wrap:wrap}
.srow button{font:600 14px var(--sans);min-height:42px;min-width:48px;padding:0 12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;cursor:pointer}
.srow button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.secl a{display:flex;gap:10px;align-items:center;padding:12px 6px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;min-height:44px}
.secl a .tk{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--acc-ink)}
.secl a.rd .tk{background:var(--acc);border-color:var(--acc)}
.secl a.cur{background:var(--acc-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:50;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;font:600 14px var(--sans);max-width:92vw;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.toast button{font:700 14px var(--sans);background:transparent;border:0;color:var(--bg);text-decoration:underline;cursor:pointer;min-height:36px}
body.focus .bar{display:none}body.focus .sidetoc{display:none}
figcaption.clamp{max-height:3.3em;overflow:hidden;position:relative;cursor:pointer}

ty, industrial society and the USA appear as one-off short questions (2013, 2014, 2016, 2021). Open every answer with the two revolutions, then the Renaissance and Enlightenment, then name the six influences: that frame fits nearly every PYQ."}, {"c": "1", "n": "Modernity and the Emergence of SociologyHigh priority", "id": "story", "t": "The story first", "x": "The story first # The story first Sociology was born when the old European order broke. The French and Industrial Revolutions made modern society, the Renaissance and Enlightenment gave the tools of reason and science, and early thinkers used them to study and mend the new world; the USA then turned it into a university discipline. 1. A new science for a new society. August Comte (1798-1857) coined the term 'Sociology' in 1838. The handout stresses that sociology was no accident: political systems, economic structures, ideas and institutions changed so deeply that older ways of understanding society proved inadequate. *→ What had changed?* 2. Two revolutions made modern society. The French Revolution (1789-1799) ended monarchy, weakened the Church and brought citizenship, democracy, secularism and equal rights, and it loosened feudal land relations for free trade and private property. The Industrial Revolution (1760-1840) brought mass production, migration to towns, slums, new classes (capitalists and industrial workers), nuclear families and anonymity. *→ Where did the ideas come from?* 3. Renaissance and Enlightenment. The Renaissance (14th-17th century) brought the Scientific Revolution, which gave the scientific method, and the Commercial Revolution, which brought banking, the company form and a middle class. The Enlightenment (17th-18th century), the Age of Reason, questioned Church, monarchy and even God, and held that humans are rational and society can be reorganised on rational principles. *→ How did these ideas shape early sociology?* 4. Six influences. Scientific method, rationality and progress came from the Enlightenment. After it came history (historical periods and social types), biological theories of evolution (society as an organism, Spencer) and social surveys (Eden's 'The state of the poor', 1797; Booth in London; Rowntree in York). *→ Then the discipline crossed the Atlantic.* 5. From Europe to the USA. After the American Civil War (1861-1865) the American Social Science Association was formed in 1865. Sumner introduced the first sociology course at Yale in 1875; Ward's Dynamic Sociology (1883) opposed Social Darwinism; Albion Small set up the first full department at Chicago in 1892; the Chicago school (1915-1935) built urban sociology and fieldwork; by mid-century Parsons' functionalism dominated. Cast: August Comte = coined 'Sociology' in 1838 · William G. Sumner = first sociology course, Yale, 1875 · Albion W. Small = first US department, Chicago, 1892 · Lester F. Ward = Dynamic Sociology, 1883; against Social Darwinism · Emile Durkheim = first European department, 1895"}, {"c": "1", "n": "Modernity and the Emergence of SociologyHigh priority", "id": "terms", "t": "In simple words", "x": "In simple words # Sociology is the scientific attempt to understand modern society : it grew from the French and Industrial Revolutions . The Renaissance gave the scientific method ; the Enlightenment gave reason, rationality and progress . Six influences shaped early sociology: scientific method, rationality, progress, history, evolution, surveys . In the USA it grew after the Civil War and became an academic discipline at Chicago (1892) . Term In plain words Modernity The way of life that came with the French and Industrial Revolutions: citizenship, industry, cities and reason. Renaissance 14th-17th century revival of art, literature and science (humanism, realism, empiricism). Enlightenment 17th-18th century Age of Reason that questioned Church and monarchy and trusted human reason. Industrial Revolution 1760-1840 shift to factory production, towns, new classes and new social problems. Social survey Method of studying social conditions to solve problems; Eden, Booth and Rowntree used it. Social Darwinism Spencer-Sumner idea of laissez-faire and survival of the fittest that Ward opposed. Chicago school 1915-1935 group that made urban sociology and fieldwork a core of the discipline."}, {"c": "1", "n": "Modernity and the Emergence of SociologyHigh priority", "id": "1-overview", "t": "1 · Overview", "x": "1 · Overview # Handout only MODERNITY AND SOCIAL CHANGES IN EUROPE AND THE EMERGENCE OF The emergence of sociology in the 19th century was not an accident but the outcome of profound and wide-ranging transformations in European society. As political systems, economic structures, intellectual traditions, and social institutions underwent dramatic change, earlier modes of understanding society proved inadequate. Sociology arose as a systematic and scientific attempt to make sense of these new social realities. French philosopher August Comte (1798-1857) who coined the term Sociology Timeline for Emergence of Sociology: 1. 1838 - August Comte coined the term ‘Sociology’ 2. 1875 - First sociology course was introduced in the U.S.A. by William G. Sumner 3. 1892 - First Department of Sociology was established in the U.S.A. by Albion Small 4. 1895 - First Department of Sociology in Europe was established by Emile Durkheim Memory aid (own) · Timeline of firsts C S S D Clever Students Seek Degrees. C = Comte coined Sociology, 1838; S = Sumner first course (Yale), 1875; S = Small first US department (Chicago), 1892; D = Durkheim first European department, 1895. The timeline runs in date order, so the order is kept. (order kept)"}, {"c": "1", "n": "Modernity and the Emergence of SociologyHigh priority", "id": "2-intellectual-precursors-ancient-and-clas", "t": "2 · Intellectual precursors: ancient and classical thought", "x": "2 · Intellectual precursors: ancient and classical thought # Handout only Writings of ancient scholars and philosophers in both the East and the West were extensive; and discussed various aspects of social life. From Kautilya’s Arthashastra and Manusmriti in India, the teachings of Buddha and Confucius in India and China respectively, to Plato’s Republic; the ancient philosophy covered a wide array of societal concerns covering a wide range of social issues. These issues included the nature of the state, citizenship, social inequality, man-woman relationship, education, and family life. Modern sociology continues to grapple with many of the same questions that the ancient philosophers tried to address."}, {"c": "1", "n": "Modernity and the Emergence of SociologyHigh priority", "id": "3-transformations-in-europe-and-the-birth", "t": "3 · Transformations in Europe and the birth of sociology", "x": "3 · Transformations in Europe and the birth of sociology # Handout only Picture hook Slum street. Hook for the urban squalor and social problems that early sociology set out to study. (handout p.5) Picture hook Factory chimneys. Hook for the Industrial Revolution and industrial capitalism. (handout p.4) The discipline of sociology emerged in the 19th century in Europe in response to sweeping socio-political transformations. The French and the Industrial Revolutions had the combined effect of giving birth to the modern society . It was to understand the social changes accompanying the birth of modern society that the discipline of sociology was founded. The French Revolution (1789-1799) significantly impacted the nature of the polity, economy, and society in France. The political implications of the French Revolution was the end monarchy, weakening the powers of the Church, and introducing the modern ideas ofcitizenship,democracy, secularism andequal rights for all. Socially, i t challenged the old hierarchy and promoted the ideals of liberty, equality, and fraternity, giving ordinary people a new sense of dignity and participation. Economically, it weakened feudal land relations, encouraged a more open economy, and created conditions for capitalist growth by promoting free trade and private property. The Industrial Revolution (1760-1840) brought about significant changes in various aspects of social life in Europe. Economically , the Industrial Revolution gave rise to the industrial capitalist economy characterised by increase in productivity, mass-based production, skills specialisation, and expansion of trade and commerce. Industrial Revolution (1760-1840) not only affected how we produce, but also how we live Spatially, it led to large scale migration from rural areas to industrial towns and cities, and the development of slums. Socially, the Industrial Revolution resulted in the emergence of new social classes such as the capitalist class and industrial workers; nuclearization of the family, a sense of anonymity, loneliness, and social isolation amongst the industrial workers. Consequently, the traditional social order collapsed and made way for the rise of a new one. The existing branches of knowledge seemed inadequate and ill-equipped to make sense of these transformative changes. Old patterns of living and traditional modes of thought now seemed outdated. The sense of security and continuity associated with the old order was now replaced by an unseen uncertainty. Growth of slums and poverty in England prompted Marx and Engels to write on the conditions of the working class. New social problems arose. The industrial towns and cities were over-populated and urban resources were under immense strain. The living conditions of the working class in the urban areas were pathetic. Rampant industrial conflict, new diseases due to pollution and poor sanitation, rise in crime rates, and glaring inequalities were other major social issues in the industrial cities. It was to analyse these transformations in European societies and to address these new social problems that the discipline of sociology emerged. Social philosophers like August Comte, St. Simon, and Emile Durkheim took a keen interest in developing a scientific analysis of the turmoil and chaos in France. In England, scholars like Herbert Spencer were making efforts on similar lines. Karl Marx and Friedrich Engels analysed the exploitative nature of industrial capitalism and traced its historical development. In short, nearly all of the early social thinkers were keenly engaged in understanding the nature of the modern industrial society and finding solutions to the emergent social concerns. RENAISSANCE AND ENLIGHTENMENT - THE INTELLECTUAL FOUNDATIONS OF MODERN EUROPE AND OF SOCIOLOGY The transformative revolutions in Europe during the 18th and 19th centuries were made possible by the intellectual developments in Europe during the Renaissance and Enlightenment periods. Renaissance (14 - 17th Century) witnessed the Scientific Revolution and the Commercial Revolution. The Scientific Revolution entailed new scientific inventions and discoveries. Most importantly, it led to the discovery of the scientific method. The Commercial Revolution led to the development of the banking industry and the company form of organisation. It also led to the emergence of the middle class , which would later provide leadership for the revolutions in Europe. During Renaissance; art, literature, and science, all flourished. The scientific approach to various natural phenomenon, the human body, and social institutions became prevalent. Elements of the natural and social world became objects of close observation and experiments. Old ideas were challenged. The defining features of the Renaissance movement, namely humanism , realism , and empiricism also informed the discipline of sociology in its early years. The Enlightenment period (17th-18th Century) embodied a new spirit of awakening in European society. The Age of Reason marked a clear departure from the traditional thinking of feudal Europe. Intellectuals of the era started questioning each and every aspect of social life. Nothing was sacrosanct anymore - be it the authority of the Church, or the legitimacy of monarchical rule, or the very notion of god itself. Enlightenment thought argued that human beings are essentially rational. The society can be reorganised based on rational principles. Philosophers like Rousseau, Montesquieu, Voltaire, Hobbes, Locke, and Adam Smith created a new intellectual framework to explain various aspects of social life. Their writings laid down the foundation for the French and the Industrial Revolutions. The Enlightenment period also unleashed intellectual currents that influenced the early sociologists."}, {"c": "1", "n": "Modernity and the Emergence of SociologyHigh priority", "id": "4-intellectual-influences-on-early-sociolo", "t": "4 · Intellectual influences on early sociology", "x": "4 · Intellectual influences on early sociology # Handout only Sociology emerged as a response to the forces of change, which took place during 18th and 19th centuries in Europe. The ideas discussed again and again in early sociological writings are thus essentially ideas of that period. Enlightenment thinkers of 18th century affected early sociology. Enlightenment had a profound bearing on the origins of sociology, as follows: 1. Scientific method The 18th century thinkers began to consistently study the human conditions in a scientific way using the methods of the natural sciences . They applied scientific principles of analysis to the study of human beings and their nature and society. 2. Rationality The 18th century thinkers relied on reason to judge social institutions and their suitability for human nature. Human beings, according to them, are essentially rational and this rationality can lead them to freedom of thought and action. 3. Progress The 18th century thinkers believed that human beings are capable of attaining perfection . By criticising and changing social institutions they can create for themselves even greater degrees of freedom, which, in turn would enable them increasingly to actualise the potentially creative powers. Three other intellectual influences of the period immediately after Enlightenment also influenced the emergence of sociology in Europe: 4. History In the 19th century, history became an important intellectual influence. The basic idea was that society must have progressed through a series of steps from a simple to complex stage. It has given the concepts of historical periods and social types . The thinkers who developed the philosophy of history were St. Pierre and Giambattista Vico . Later; the sociological writings of Comte, Spencer, Marx and many others reflected the impact of this intellectual trend. 5. Biological Theories of Evolution The influence of history was further reinforced by the biological theory of evolution. Sociology moved towards an evolutionary approach , seeking to identify the main stages in social evolution. It tended to be modelled on biology, as is evident from the widely used concept of society as an organism , and from the attempts to understand the nature of social evolution. Herbert Spencer is the best example of this kind of writing. 6. Surveys Social survey forms an important element in modern sociology. It emerged due to two reasons, one was the growing conviction that the methods of the natural sciences could be extended to the study of human affairs; that human phenomenon could be classified and measured. The other was the concern with poverty as a social problem, following the recognition that poverty was not natural but social. The social survey is one of the principal methods of sociological inquiry. This became particularly popular after ‘The state of the poor’ (1797) by F.M. Eden. The basic idea which underlines this method is that through the knowledge of the social conditions one can arrive at solutions to solve the social problems . Later, Charles Booth and Benjamin S. Rowntree carried forward this legacy and carried out systematic social surveys focused on poverty in English cities of London and York during late 19th and 20the centuries. Early sociology was thus shaped by the intellectual climate created by Enlightenment rationality, scientific method, historical consciousness, evolutionary thought, and empirical social surveys. These influences pushed thinkers like Comte, Spencer, Marx and Durkheim to conceptualise society as something that could be studied systematically, explained scientifically, and reformed rationally. Later sociologists like T.B. Bottomore highlight that these very currents - Enlightenment ideas, evolutionism, and historical thinking - were foundational intellectual backgrounds that made the rise of sociology possible. Memory aid (own) · Six influences on early sociology S R P H E S Sociologists Reason, Plan, Help Every Society. S = Scientific method; R = Rationality; P = Progress; H = History; E = Evolution (biological theories); S = Surveys. The handout lists them in this sequence (three from the Enlightenment, three after it), so the order is kept. (order kept)"}, {"c": "1", "n": "Modernity and the Emergence of SociologyHigh priority", "id": "5-development-of-sociology-in-the-usa", "t": "5 · Development of sociology in the USA", "x": "5 · Development of sociology in the USA # Handout only It is significant that an interest in sociology arose in the United States just after the American Civil War (1861-1865) . The War left America with many problems which caught the attention of men. It had rocked the social structure of the American people to its foundations. It had challenged thinking men to a reconsideration of the fundamental problems of government and social relationships. Like every important war, the Civil War and its results disturbed the social structure and raised questions concerning settled opinions, and presented the challenge of re-examining some fundamental notions. It was a time when social readjustment was necessary and new relationships had to be established. It was in this background that in 1865 the American Social Science Association was formed in Boston. Frank Sanborn, one of the founders of the Association, attributes its origin to the necessity of studying the new questions raised by the Civil War. Also, European scholarship exercised an undoubted influence upon the minds of young Americans trying to think through a maze of new problems. Comte’s ‘Course of Positive Philosophy’; Spencer’s Study of Sociology (1873) and Principles of Sociology (1874) particularly affected the writings and social analysis of American scholars. The pioneers in sociology in the US were influenced by these early European sociologists. Also, about this time, a flood of students were going from America to European universities for study. When they came back to America and started contributing to social science research, the impact of European education and thought was clearly discernible in their writings. The development of sociology in the USA was thus greatly influenced by the development of sociology in Europe. William Graham Sumner in the U.S.A. was particularly influenced by the writings of Herbert Spencer and Comte. In 1875 ; for the first time, a course titled ‘Sociology’ was introduced in the U.S.A. by Sumner at the Yale University. Lester Frank Ward was the first President of the American Sociological Association Progressive Era (1901–1929) was a period of widespread social activism and political reform in USA. During this period, the discipline of sociology also took a direction away from Social Darwinism. Specifically, Lester Frank Ward challenged Social Darwinism . Ward was of the view that the purpose of science is not just to observe from a distance, but, instead, the discipline of sociology should seek to provide solutions, provide inputs into public policy, and seek to reshape the society. Ward was of the stated view that \"The real object of science is to benefit man. A science which fails to do this is lifeless. Sociology, which of all sciences should benefit man most, is in danger of falling into the class of dead sciences.” Ward was a supporter of the concept of the welfare state. Ward critiqued Spencer and Spencer's theories of laissez-faire and survival of the fittest, which were popular in socio-economic thought in the United States after the American Civil War. Ward positioned himself in opposition to Spencer and Sumner (an advocate for Spencer's ideas), who had promoted the principles of laissez-faire. It was in 1883 that the first American book on sociology , L.F. Ward’s Dynamic Sociology , appeared. Ward is often described as a father of American sociology and served as the first president of the American Sociological Association from 1905 until 1907. This was also period of immense social activism. For instance, the writings of Black sociologist W.E.B. du Bois highlighted the problem of racial discrimination in American society. Du Bois was one of the founders of the National Association for the Advancement of Colored People (NAACP) in 1909. He was also a prolific author who highlighted racial discrimination in USA through his writings, and pioneered the civil right movement. From the academic writings of Sumner, sociology moved into the public realm though du Bois’s writings. The earliest feminist writings can be traced to Charlotte Gilman (1860-1935). Her works were primarily focused on gender, specifically gendered labor division in society, and the problem of male domination. The first full-fledged university department of sociology was established in 1892 at the University of Chicago by Albion W. Small, who in 1895 also founded the American Journal of Sociology. The ‘ Chicago school ’ rose to international prominence as an epicentre of advanced sociological thought between 1915 and 1935. Their works became the first major research to specialize in urban sociology . This was considered the Golden Age of Sociology, with influence on many well-known sociologists. Their research into the urban environment of Chicago would also be influential in combining theory and fieldwork. Some of the major figures of the Chicago school included Ernest Burgess, George Herbert Mead , Robert E. Park, W. I. Thomas, Louis Wirth, and Florian Znaniecki. GH Mead and CH Cooley were influential in the development of symbolic interactionism and social psychology at the University of Chicago. Chicago School’s contribution institutionalised field study methods and empirical urban research in sociology. By mid-20th century, the functionalist approach of Talcott Parsons (1902 –1979) came to dominate American sociology."}, {"c": "1", "n": "Modernity and the Emergence of SociologyHigh priority", "id": "traps", "t": "Traps", "x": "Traps # Common mix-ups and the rule for the exam hall Trap What goes wrong, and the rule Who coined and who founded Comte coined the term in 1838; Durkheim set up the first European department in 1895; Small the first US department in 1892. Exam-hall rule: coined = Comte; first Europe department = Durkheim; first US department = Small. Sumner vs Small Sumner introduced the first course (1875, Yale); Small established the first full department (1892, Chicago). Exam-hall rule: course = Sumner, department = Small. Ward vs Spencer and Sumner Ward challenged Social Darwinism and laissez-faire; Spencer and Sumner promoted them. Exam-hall rule: Ward = welfare state and reform. Renaissance vs Enlightenment Renaissance (14th-17th century) gave the scientific method; the Enlightenment (17th-18th) made reason and progress the core. Exam-hall rule: method = Renaissance; reason = Enlightenment."}, {"c": "1", "n": "Modernity and the Emergence of SociologyHigh priority", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Who coined 'Sociology' and when? August Comte, 1838 First sociology course in the USA? William G. Sumner, Yale, 1875 First US department of sociology? Albion Small, Chicago, hing criticisms section and a one-line judgement. 2019 · 10 marks · Discuss the historical antecedents of the emergence of sociology as a discipline. Question. Discuss the historical antecedents of the emergence of sociology as a discipline. Intro: name Modernity and the Emergence of Sociology and state the central idea in one line (see The story first). Body: build the answer from the notes under: Intellectual precursors: ancient and classical thought; Transformations in Europe and the birth of sociology. Close: finish with the matching criticisms section and a one-line judgement. 2016 · 10 marks · “Sociology is pre-eminently study of modern society.” Discuss Question. “Sociology is pre-eminently study of modern society.” Discuss Intro: name Modernity and the Emergence of Sociology and state the central idea in one line (see The story first). Body: build the answer from the notes under: Transformations in Europe and the birth of sociology. Close: finish with the matching criticisms section and a one-line judgement. 2015 · 10 marks · How had enlightenment contributed to the emergence of Sociology? Question. How had enlightenment contributed to the emergence of Sociology? Intro: name Modernity and the Emergence of Sociology and state the central idea in one line (see The story first). Body: build the answer from the notes under: Transformations in Europe and the birth of sociology; Intellectual influences on early sociology. Close: finish with the matching criticisms section and a one-line judgement. 2014 · 10 marks · Write a short answer of the following in about 150 words: How did the emergence of industrial societ… Question. Write a short answer of the following in about 150 words: How did the emergence of industrial society change family life in Western Europe? Intro: name Modernity and the Emergence of Sociology and state the central idea in one line (see The story first). Body: build the answer from the notes under: Transformations in Europe and the birth of sociology. Close: finish with the matching criticisms section and a one-line judgement. 2013 · 10 marks · “Sociology emerged in Europe and flourished to begin with on social reformist orientation in the U.S… Question. “Sociology emerged in Europe and flourished to begin with on social reformist orientation in the U.S.A.” -Comment. Intro: name Modernity and the Emergence of Sociology and state the central idea in one line (see The story first). Body: build the answer from the notes under: Development of sociology in the USA. Close: finish with the matching criticisms section and a one-line judgement. Next Scope of Sociology, Other Social Sciences and Common Sense Personal study notes built from: Sarrthi IAS · Sociology Optional Foundation 2027 · Modernity and Social Changes in Europe and the Emergence of Sociology (27th May). Only the handout facts are used; memory aids are labelled own. Copyright belongs to the teacher or institute; keep this private."}, {"c": "2", "n": "Scope of Sociology, Other Social Sciences and Common SenseHigh priority", "id": "chapter-map", "t": "Chapter map", "x": "Chapter map # Map Outline Discipline of sociology Common sense Everyday knowledge Durkheim: avoid Marxist: ideology Convergence Hypotheses Similar explanations Ethnomethodology Absorbed concepts Social sciences History Economics Psychology Political science Anthropology Scope Formalistic Synthetic Statics and dynamics Expanding scope Digital society Environment AI"}, {"c": "2", "n": "Scope of Sociology, Other Social Sciences and Common SenseHigh priority", "id": "lens", "t": "Exam lens", "x": "Exam lens # Exam lens Priority: High. Mains PYQs quoted: 2013, 2014, 2016, 2017, 2020, 2021, 2022, 2023, 2025. Prelims: not asked (Mains optional). Mains hooks 13 Mains PYQs quoted in the handout, 2013-2025: comparison with other social sciences (7), common sense (4), scope (2). Almost all are 10-mark questions; three are 20-mark (2017, 2021, 2023). 2025 alone asked scope, history and common sense: keep the comparison tables ready. Answer by contrasting method (systematic vs everyday) and focus (holistic vs one aspect), then close with the interdisciplinary trend."}, {"c": "2", "n": "Scope of Sociology, Other Social Sciences and Common SenseHigh priority", "id": "story", "t": "The story first", "x": "The story first # The story first Sociology differs from common sense in method and reliability, yet the two touch at four points. It also stands beside history, economics, psychology, political science and anthropology as the holistic study of social relationships, and its scope has kept widening from forms and institutions to digital society. 1. Two ways of knowing. Sociology is systematic, scientific and evidence-based; common sense is everyday, taken-for-granted knowledge from experience, tradition and socialisation. Durkheim warned that common sense must not contaminate sociological inquiry, and the Marxist view is that common sense is part of ruling-class ideology that legitimises the status quo. *→ Do they ever meet?* 2. Four meeting points. Common-sense ideas can inspire hypotheses; functionalist explanations sometimes resemble common sense (Parsons' expressive and instrumental roles); phenomenology and ethnomethodology (Garfinkel) study common sense itself; and sociological concepts get absorbed into everyday thinking. *→ How does sociology relate to other disciplines?* 3. Sociology and its sister sciences. Sociology is holistic and focuses on social relationships and structure. History gives the temporal background; economics studies wealth and markets; psychology studies the individual mind; political science studies state and power; anthropology (the sister discipline) studied small-scale societies. Interdisciplinary fields such as political sociology and economic sociology show the trend. *→ What does sociology itself cover?* 4. Scope. The Formalistic School (Simmel) says sociology should study only the forms of social relationships. The Synthetic School (Durkheim, Sorokin) says it is a general science of society. Comte split it into social statics and social dynamics; Durkheim defined it as the study of social facts; Weber as interpretive understanding of social action. *→ And now?* 5. An expanding scope. Once family, religion, caste and village communities; now globalisation, social media, environment, alternative sexuality and genders, blockchain, robotics, artificial intelligence, digital society and new branches such as medical and environmental sociology. Cast: Emile Durkheim = keep common sense out; sociology is the study of social facts · Harold Garfinkel = study how people use common sense · Georg Simmel = Formalistic School: study forms of interaction · Auguste Comte = social statics and social dynamics · Max Weber = interpretive understanding of social action"}, {"c": "2", "n": "Scope of Sociology, Other Social Sciences and Common SenseHigh priority", "id": "terms", "t": "In simple words", "x": "In simple words # Common sense is everyday, untested knowledge; sociology is systematic, evidence-based study of society. The two meet in hypotheses, similar explanations, ethnomethodology and absorbed concepts. Sociology is holistic : it overlaps with history, economics, psychology, political science and anthropology but studies social relationships and structure . The scope is debated ( Formalistic vs Synthetic ) and keeps expanding (digital society, AI, environment). Term In plain words Common sense Everyday taken-for-granted knowledge from experience, culture and socialisation. Formalistic School Simmel's view: study only the forms of social relationships. Synthetic School Durkheim and Sorokin's view: sociology is a general, integrated science of society. Social statics Comte's study of social order and stability. Social dynamics Comte's study of social change and progress. Ethnomethodology Garfinkel's study of how people use common sense to make social life. Historical sociology Field joining history and sociology."}, {"c": "2", "n": "Scope of Sociology, Other Social Sciences and Common SenseHigh priority", "id": "1-sociology-and-common-sense", "t": "1 · Sociology and Common Sense", "x": "1 · Sociology and Common Sense # Handout only Sociology and common sense are both ways of understanding the social world, but they differ sharply in their nature, scope, and reliability. Sociology is the systematic and scientific study of human society, social relationships, and patterns of social life. It relies on empirical investigation, theoretical analysis, and critical reasoning to explain social phenomena. Common sense, on the other hand, refers to the everyday, taken-for-granted knowledge and beliefs that people acquire through personal experience, cultural traditions, and socialization. It is rooted in subjective perception and is often shaped by prevailing norms, customs, and ideologies. Emile Durkheim strongly argued that sociologists should not let common sense contaminate objective sociological inquiry. Sociology demands systematic, evidence-based analysis, whereas common sense is often based on untested assumptions and personal experiences. From a Marxist perspective , common sense is not a neutral body of knowledge but part of the ruling class ideology. It promotes the view that the prevailing capitalist system is fair, reasonable, and beneficial to all, thereby legitimising and reproducing the status quo. In this way, common sense is inherently conservative , disregarding the deeper structures of inequality and the true nature of social reality. Despite its limitations, common sense is omnipresent - it is used and needed by everyone in everyday life. It is popular and frequently relied upon, because it is immediately accessible and resonates with everyday experience. However, reliance on common sense can be double-edged: it can sometimes guide action effectively, but it can also perpetuate bias and error."}, {"c": "2", "n": "Scope of Sociology, Other Social Sciences and Common SenseHigh priority", "id": "2-convergence-of-sociology-and-common-sens", "t": "2 · Convergence of Sociology and Common Sense", "x": "2 · Convergence of Sociology and Common Sense # Handout only Picture hook Two-way exchange between common sense and sociology (handout diagram). (handout p.3) Although sociology strives to transcend common sense biases, there are points where the two intersect: 1. Hypothesis formation: Common sense ideas can inspire initial hypotheses for sociological research, which can then be tested empirically. 2. Similar explanations: Functionalist explanations of certain phenomena sometimes resemble common sense interpretations. For example, Talcott Parsons’ view that women have an expressive role and men an instrumental role parallels widely held common sense beliefs about gender roles. 3. Phenomenology and Ethnomethodology highlight the value of analysing common sense knowledge. Harold Garfinkel argued that sociological research should examine how people use common sense to construct and navigate their social worlds. 4. Absorption of sociological concepts into common sense: Over time, concepts developed within sociology can enter everyday thinking and common sense explanations. In sum, while sociology and common sense have different epistemological foundations - systematic research versus everyday intuition - they occasionally overlap. The challenge for sociologists is to critically evaluate common sense insights, separate myth from reality, and, where appropriate, refine and integrate them into rigorous sociological understanding. Memory aid (own) · Four meeting points of sociology and common sense H E A P HEAP. H = Hypothesis formation; E = similar Explanations; A = Absorption of sociological concepts; P = Phenomenology and ethnomethodology. Common sense is a HEAP of raw ideas that sociology sorts and tests. (order free)"}, {"c": "2", "n": "Scope of Sociology, Other Social Sciences and Common SenseHigh priority", "id": "3-sociology-and-its-comparison-with-other", "t": "3 · Sociology and its Comparison with Other Social Sciences", "x": "3 · Sociology and its Comparison with Other Social Sciences # Handout only Sociology studies society, social relationships, institutions, and collective human behaviour. Since human life is multidimensional, sociology is closely related to other social sciences such as history, economics, psychology, political science, and anthropology. These disciplines often overlap in subject matter and methods, yet each has its own distinct focus and perspective. Sociology differs from them because of its holistic approach and emphasis on social relationships and social structure. French philosopher Auguste Comte (1798-1857) is the founder of modern sociology In contemporary social sciences, the importance of multi-disciplinarity has increased significantly because complex problems cannot be understood through a single discipline alone. Issues such as poverty, climate change, migration, caste inequality, gender violence, globalization, and digital transformation involve economic, political, psychological, historical, and cultural dimensions simultaneously. As a result, sociology increasingly interacts with economics, political science, psychology, anthropology, history, and even natural sciences to develop a more comprehensive understanding of society. The growth of interdisciplinary fields such as political sociology, economic sociology, social anthropology, environmental sociology, and behavioural economics reflects this trend toward multi-disciplinarity in contemporary research and policymaking."}, {"c": "2", "n": "Scope of Sociology, Other Social Sciences and Common SenseHigh priority", "id": "4-sociology-and-history", "t": "4 · Sociology and History", "x": "4 · Sociology and History # Handout only Sociology and history are closely connected because both study human society and social change. E. H. Carr described history as a continuous dialogue between the past and present, while sociologists such as Max Weber and Karl Marx extensively used historical analysis to explain social structures and change. Basis Sociology History Main Focus Social relationships and institutions Past events and historical developments Nature Analytical and theoretical Descriptive and chronological Time Orientation Mainly present-oriented Primarily past-oriented Aim Discover social patterns and generalizations Describe unique historical events Method Surveys, observation, social analysis Historical records, archives, documents Karl Marx (1818-1883) used the method of historical materialism to understand society Despite these differences, sociology and history are deeply interrelated. Historical knowledge helps sociology understand the evolution of institutions such as family, caste, religion, and state. At the same time, sociology provides history with analytical concepts like class, status, power, and bureaucracy. Historical sociology has emerged as an important interdisciplinary field combining both disciplines. Thus, history provides the temporal background for sociology, while sociology helps interpret historical developments in a broader social context."}, {"c": "2", "n": "Scope of Sociology, Other Social Sciences and Common SenseHigh priority", "id": "5-sociology-and-economics", "t": "5 · Sociology and Economics", "x": "5 · Sociology and Economics # Handout only Economics and sociology both study human activities in society, especially those related to production, consumption, and distribution. Karl Marx, Max Weber, and Emile Durkheim all examined economic processes sociologically. Scottish philosopher Adam Smith (1723-1790) was the founder of modern economics Basis Sociology Economics Main Focus Society and social relationships Economic activities and wealth Scope Broad and holistic Specialized and narrower Unit of Analysis Groups, institutions, communities Individual, firm, market Approach Social and cultural Economic and quantitative Concern Social inequality and interaction Production, distribution, consumption The two disciplines overlap considerably. Economic behaviour is influenced by social norms, caste, class, gender, religion, and culture. Weber’s study of Protestant ethics and capitalism illustrates this relationship clearly. Similarly, economic inequalities influence social stratification and mobility. Economic sociology today studies markets, labour, consumption, and globalization sociologically. In essence, economics studies economic life specifically, whereas sociology studies economic activities within the wider social structure."}, {"c": "2", "n": "Scope of Sociology, Other Social Sciences and Common SenseHigh priority", "id": "6-sociology-and-psychology", "t": "6 · Sociology and Psychology", "x": "6 · Sociology and Psychology # Handout only Both sociology and psychology study human behaviour, but their perspectives differ. Psychology focuses on the individual mind, emotions, personality, and cognition, while sociology examines how society and social groups shape behaviour. George Herbert Mead and Sigmund Freud significantly influenced debates on the relationship between individual personality and society. Austrian neurologist Sigmund Freud (1856-1939) popularized the technique of psychoanalysis in psychology Basis Sociology Psychology Main Focus Social behaviour and groups Individual behaviour and mind Unit of Analysis Society, groups, institutions Individual Approach Social and collective Mental and individual Concern Social interaction and culture Emotions, personality, cognition Orientation Mainly macro and micro social processes Mainly individual-level analysis The disciplines overlap in areas such as socialization, attitude formation, deviance, and group behaviour. Social psychology emerged as a bridge between sociology and psychology. Sociologists study how social structures shape personality, while psychologists examine how individual mental processes influence behaviour. Thus, psychology explains behaviour at the individual level, whereas sociology explains how social environment shapes that behaviour."}, {"c": "2", "n": "Scope of Sociology, Other Social Sciences and Common SenseHigh priority", "id": "7-sociology-and-political-science", "t": "7 · Sociology and Political Science", "x": "7 · Sociology and Political Science # Handout only Sociology and political science are closely related because political institutions function within society. Rajni Kothari and Andre Beteille showed how caste, class, and social structure influence political processes in India. Kautilya wrote the Arthashastra, one of the world’s oldest texts on statecraft and politics Basis Sociology Political Science Main Focus Society and social relations State, government, and power Scope Broad social processes Political institutions and governance Concern Social order and interaction Authority, law, and administration Basis Sociology Political Science Approach Sociological perspective Political and legal perspective Unit of Analysis Groups and institutions State and political organizations The two disciplines converge in the study of power, authority, leadership, democracy, political participation, and social movements. Political sociology emerged as a specialized field studying the interaction between society and politics. Social factors such as caste, religion, ethnicity, and class strongly influence voting behaviour and political mobilization in India. Therefore, political science studies political systems specifically, while sociology studies politics as one aspect of social life."}, {"c": "2", "n": "Scope of Sociology, Other Social Sciences and Common SenseHigh priority", "id": "8-sociology-and-anthropology", "t": "8 · Sociology and Anthropology", "x": "8 · Sociology and Anthropology # Handout only Sociology and anthropology are often called sister disciplines because both study human society and culture. Traditionally, anthropology focused on tribal and small-scale societies, whereas sociology concentrated more on modern industrial societies. Scholars such as A. R. Radcliffe-Brown and Bronislaw Malinowski strongly influenced sociological methods and theory. Prof. M.N. Srinivas (1916-1999) is a key figure in both sociology and anthropology in India Basis Sociology Anthropology Main Focus Modern and complex societies Tribal and small-scale societies Scope Social institutions and processes Culture and human evolution Method Surveys, statistics, social analysis Participant observation, ethnography Orientation Contemporary social problems Comparative and cultural Unit of Study Large societies and institutions Small communities and cultures The distinction between the two disciplines has gradually narrowed. Sociologists increasingly use ethnographic methods, while anthropologists now study urban and industrial societies. Indian sociologists such as M. N. Srinivas combined sociological and anthropological approaches in village studies. In short, anthropology provides deep cultural understanding, while sociology offers broader analysis of social institutions and structures. In conclusion, sociology maintains close interdisciplinary relations with all major social sciences because human society cannot be understood through a single perspective. While each discipline has its own distinct focus and methods, sociology occupies a unique position due to its holistic and integrative study of social life. Memory aid (own) · Sociology and its sister sciences P H A S E PHASE. P = Psychology; H = History; A = Anthropology; S = political Science; E = Economics. Sociology moves in PHASE with its sister sciences. (order free)"}, {"c": "2", "n": "Scope of Sociology, Other Social Sciences and Common SenseHigh priority", "id": "9-scope-of-sociology", "t": "9 · Scope of Sociology", "x": "9 · Scope of Sociology # Handout only The scope of sociology refers to the range of subjects, issues, and areas that sociology studies. Since sociology is a relatively new social science, sociologists have long debated what exactly should be included within its field of study. Broadly, sociology studies society, social relationships, institutions, social processes, and human behaviour in social context. However, different sociologists have defined its scope differently. Two major viewpoints regarding the scope of sociology are the Formalistic School and the Synthetic School. Formalistic School argued that sociology should study only the “forms” of social relationships and not their concrete content. Georg Simmel believed sociology should focus on patterns of interaction such as cooperation, conflict, competition, domination, and subordination. According to this school, economics, politics, and religion are already studied by separate disciplines, so sociology should confine itself to studying forms of social interaction common to all fields. Synthetic School viewed sociology as a general science of society. It argued that sociology should study all aspects of social life in an integrated manner. Emile Durkheim believed sociology studies social facts and collective life, while thinkers like Sorokin emphasized that sociology synthesizes knowledge from different social sciences. This approach gave sociology a broad scope including family, religion, economy, polity, culture, social change, and social institutions. Basis Formalistic School Synthetic School Main Idea Sociology should study only the forms of social relationships Sociology should study society in a comprehensive manner Focus Pure sociology; limited scope Broad and integrated scope Nature Specialized discipline General social science What Sociology Studies Forms of interaction like cooperation, conflict, competition All aspects of social life and social institutions View on Other Social Sciences Sociology should remain distinct from other social sciences Sociology should synthesize findings of all social sciences Major Thinkers Georg Simmel, Vierkandt, Small L. T. Hobhouse, Sorokin Auguste Comte , regarded as the father of sociology, envisaged the scope of sociology as encompassing the study of both social continuity and social change. He divided sociology into: Social Statics - study of social order, stability, and institutions such as family, religion, and state; and Social Dynamics - study of social change, progress, and evolution of society. Emile Durkheim defined sociology as the study of social facts . Durkheim emphasized that sociology studies these collective social realities rather than individual behaviour. Max Weber , however, defined sociology as the interpretive understanding of social action . According to Weber, sociology studies actions that individuals attach meaning to and direct toward others. Thus, Weber shifted sociology’s focus toward meanings, motives, and social interaction of social actors. As the world is changing, the scope of sociology is also widening"}, {"c": "2", "n": "Scope of Sociology, Other Social Sciences and Common SenseHigh priority", "id": "10-expanding-scope-of-sociology", "t": "10 · Expanding Scope of Sociology", "x": "10 · Expanding Scope of Sociology # Handout only Picture hook Connected world map. Hook for globalisation widening the scope of sociology. (handout p.10) The scope of sociology has continuously expanded with changes in society. Earlier, sociology mainly studied institutions such as family, religion, caste, and village communities. Today, sociology examines a wide range of contemporary issues including globalization, social media, environment, alternative sexuality and genders, and social impacts of new technologies like blockchain, robotics, and artificial intelligence. Sociology today engages with new social movements, digital society, identity theft, and cyber culture. New branches such as medical sociology, environmental sociology, sociology of pandemics, and sociology of globalization have emerged. This expanding scope reflects sociology’s dynamic nature and its ability to adapt to changing social realities. In conclusion, sociology has evolved from a limited study of social relationships to a broad and dynamic discipline studying almost every aspect of social life."}, {"c": "2", "n": "Scope of Sociology, Other Social Sciences and Common SenseHigh priority", "id": "traps", "t": "Traps", "x": "Traps # Common mix-ups and the rule for the exam hall Trap What goes wrong, and the rule Formalistic vs Synthetic Formalistic (Simmel) = forms only; Synthetic (Durkheim, Sorokin) = integrated whole. Exam-hall rule: forms = Simmel; whole = Synthetic. Statics vs dynamics Statics = order and stability; dynamics = change and progress. Exam-hall rule: statics sits still, dynamics moves. Common sense is not all wrong The handout says it is double-edged: it guides action but can carry bias and error. Exam-hall rule: give both sides before concluding. Who studied tribal societies Anthropology traditionally studied tribal and small-scale societies; sociology studied modern industrial societies, but the gap has narrowed. Exam-hall rule: write 'traditionally' and add the narrowing."}, {"c": "2", "n": "Scope of Sociology, Other Social Sciences and Common SenseHigh priority", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. What does Durkheim say about common sense? It must not contaminate objective sociological inquiry Marxist view of common sense? Part of ruling-class ideology that legitimises the status quo Four points where sociology and common sense meet? Hypotheses, similar explanations, ethnomethodology, absorbed concepts Who is the ethnomethodology voice here? Harold Garfinkel Which Parsons idea parallels common sense? Women expressive, men instrumental Sister disciplines? Sociology and anthropology Who founded modern sociology? Modern economics? Comte (1798-1857); Adam Smith (1723-1790) Unit of analysis in economics vs sociology? Individual, firm, market vs groups, institutions, communities Formalistic School's thinker? Georg Simmel Synthetic School's thinkers? Durkheim and Sorokin Comte's two divisions? Social statics and social dynamics Weber's definition? Interpretive understanding of social action New branches today? Medical, environmental, pandemics, globalisation"}, {"c": "2", "n": "Scope of Sociology, Other Social Sciences and Common SenseHigh priority", "id": "abbr", "t": "Abbreviation column", "x": "Abbreviation column # Meanings are plain-language aids; verify before quoting Short form Full form One-line meaning AI Artificial Intelligence One of the new areas sociology studies PYQ Previous Years' Questions Questions UPSC has already asked"}, {"c": "2", "n": "Scope of Sociology, Other Social Sciences and Common SenseHigh priority", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test: redraw the chapter map"}, {"c": "2", "n": "Scope of Sociology, Other Social Sciences and Common SenseHigh priority", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards Mains answer skeletons One for each Mains PYQ quoted in the handout. Tap to open; try the answer first. 2025 · 10 marks · In what way is the scope of sociology unique? Explain. Question. In what way is the scope of sociology unique? Explain. Intro: name Scope of Sociology, Other Social Sciences and Common Sense and state the central idea in one line (see The story first). Body: build the answer from the notes under: Scope of Sociology; Expanding Scope of Sociology. Close: finish with the matching criticisms section and a one-lin rom the notes under: Sociology and Political Science. Close: finish with the matching criticisms section and a one-line judgement. 2022 · 10 marks · Delimit the scope of Sociology in relation to other social sciences. Question. Delimit the scope of Sociology in relation to other social sciences. Intro: name Scope of Sociology, Other Social Sciences and Common Sense and state the central idea in one line (see The story first). Body: build the answer from the notes under: Sociology and its Comparison with Other Social Sciences; Scope of Sociology; Expanding Scope of Sociology. Close: finish with the matching criticisms section and a one-line judgement. 2021 · 10 marks · How is Sociology related to common sense? Question. How is Sociology related to common sense? Intro: name Scope of Sociology, Other Social Sciences and Common Sense and state the central idea in one line (see The story first). Body: build the answer from the notes under: Sociology and Common Sense; Convergence of Sociology and Common Sense. Close: finish with the matching criticisms section and a one-line judgement. 2021 · 20 marks · From the viewpoint of growing importance of multidisciplinary, how do you relate sociology to other … Question. From the viewpoint of growing importance of multidisciplinary, how do you relate sociology to other social sciences? Intro: name Scope of Sociology, Other Social Sciences and Common Sense and state the central idea in one line (see The story first). Body: build the answer from the notes under: Sociology and its Comparison with Other Social Sciences. Close: finish with the matching criticisms section and a one-line judgement. 2020 · 10 marks · In the Context of globalization, has the scope of Sociology been changing in India? Comment Question. In the Context of globalization, has the scope of Sociology been changing in India? Comment Intro: name Scope of Sociology, Other Social Sciences and Common Sense and state the central idea in one line (see The story first).
