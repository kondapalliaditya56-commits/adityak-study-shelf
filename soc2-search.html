ian Social StructureHigh priority", "id": "20-land-reforms", "t": "20 · Land Reforms", "x": "20 · Land Reforms # Handout only After independence, land reforms were undertaken to restructure agrarian relations and reduce inequality. P. C. Joshi identifies three broad approaches : Gandhian approach : Based on trusteeship; large landowners were urged to donate surplus land. The Bhoodan movement promoted voluntary redistribution. Marxist approach : Emphasised violent uprising of the landless and the rural poor to end their class-based oppression, and redistribution of land from the rich to the poor to eliminate exploitation. Radical nationalist approach : Advocated restructuring society along socialist lines to reduce inequality."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "21-major-land-reform-measures", "t": "21 · Major land reform measures", "x": "21 · Major land reform measures # Handout only Land reforms in post-independence India were aimed at restructuring agrarian relations, reducing inequality, and promoting social justice by redistributing land and securing the rights of cultivators. One of the earliest and most significant measures was the abolition of intermediaries . This reform sought to eliminate layers of landlords who stood between the state and the actual cultivators. By removing zamindars and similar intermediaries, the state aimed to establish a direct relationship with the tiller, thereby reducing exploitation and giving cultivators ownership or occupancy rights over land. Another crucial component was tenancy reforms , which focused on improving the conditions of tenant farmers. These reforms included regulation of rents (to prevent excessive extraction), provision of security of tenure (so that tenants could not be arbitrarily evicted), and, in some cases, granting ownership rights to tenants who had been cultivating land for long periods. The idea was to ensure that those who actually tilled the land had both economic security and an incentive to invest in agricultural productivity. Land ceiling laws were introduced to address the concentration of land in the hands of a few large landowners. These laws imposed an upper limit on the amount of land an individual or family could own. Any land held above this ceiling was to be taken over by the state and redistributed to the landless and marginal farmers. This measure aimed at promoting a more equitable distribution of land and reducing rural inequality, although its effectiveness was often limited due to loopholes and evasion."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "22-land-redistribution-and-the-bhoodan-move", "t": "22 · Land redistribution and the Bhoodan movement", "x": "22 · Land redistribution and the Bhoodan movement # Handout only Closely related was the policy of land redistribution , under which surplus land acquired through ceiling laws or voluntary donations (such as under the Bhoodan movement) was distributed among landless labourers and small farmers. The objective was to create a class of small peasant proprietors and reduce dependence on landlords. However, the quantity and quality of redistributed land often limited the impact of this measure. In addition, efforts were made towards consolidation of landholdings , especially in regions where fragmentation of land into small, scattered plots reduced agricultural efficiency. Consolidation involved reorganising fragmented plots into a single contiguous holding for each farmer, thereby facilitating better use of modern inputs, irrigation, and mechanisation. Overall, these land reform measures sought to transform the agrarian structure from one characterised by inequality and exploitation to one based on equity, productivity, and peasant ownership. While their implementation varied across regions, they played an important role in shaping post-independence rural India."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "23-impact-of-land-reforms", "t": "23 · Impact of Land Reforms", "x": "23 · Impact of Land Reforms # Handout only 1. Creation of owner-cultivators : Tenancy reforms and ownership rights converted tenants into peasant proprietors, increasing their stake in land and incentives for productivity. 2. Economic growth : The new proprietors of land took interest in land improvement and helped to increase the productivity of land. The ex-landlords took up modern occupations. (Doshi & Jain). 3. Reduction of exploitation : Abolition of zamindari reduced parasitic intermediaries, bringing cultivators into direct relation with the state and reducing rent extraction. 4. Agrarian productivity gains : Secure land rights encouraged investment in irrigation, inputs, and technology, contributing to agricultural growth. 5. Political empowerment of intermediate castes : Redistribution and control over land enabled rise of intermediate castes in local politics, democratising rural power structures (Rudolph & Rudolph). 6. Weakening feudal hierarchy : Decline of landlord dominance reduced traditional authority structures and opened space for mobility and assertion by lower groups. 7. Foundation for Green Revolution : Land reforms (especially in regions like Punjab, Haryana, and Western UP) created a class of farmers who were interested to adopt new technologies and boost productivity. 8. Legal recognition of tenant rights : The land reforms established norms of fair rent, security of tenure, and protection against arbitrary eviction. 9. Social justice orientation : Land reforms reflected a commitment to equity and redistribution in post-colonial state policy, shaping welfare discourse."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "24-limitations-and-criticisms", "t": "24 · Limitations and Criticisms", "x": "24 · Limitations and Criticisms # Handout only 1. Land reforms were implemented half - heartedly . Consequently, inequalities in land ownership have continued. (Walter Fernandes) 2. Land reforms have increased inequalities in the countryside. (Malcolm Adiseshiah). State governments favoured big landlords . (NC Saxena) 3. Land reforms ignored the right to ownership of women cultivators. (Doshi & Jain) 4. Lack of updated land records, corruption, and slow legal processes delayed and diluted reform outcomes. 5. Some states like West Bengal and Kerala saw relatively better outcomes, while many other states lagged significantly, leading to uneven impact. While the land reforms were well-intentioned and much-needed, the underlying spirit of land reforms, to provide ‘land to the tiller’, remained largely unfulfilled due to their ineffective implementation. This, in turn, can be explained with reference to the legal loopholes, administrative corruption, and the social base of India’s political and administrative elites . The agrarian social structure in India is characterised by deep and overlapping inequalities rooted in caste, class, and gender. Colonial land tenure systems institutionalised exploitation, while post-independence land reforms attempted to create a more equitable system. Although reforms brought partial transformation, their limited implementation and emerging trends such as transfer of land to non-cultivators have continued to reproduce inequality in new forms. Thus, rural India remains a site of both structural continuity and change."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "25-green-revolution-and-social-change", "t": "25 · Green Revolution and social change", "x": "25 · Green Revolution and social change # Handout only Picture hook A farmer on a tractor: mechanisation in agriculture. (handout p.15) The Green Revolution was a state-led programme of large-scale modernization of Indian agriculture initiated in the mid-1960s. It marked a transition from traditional subsistence farming to a technology-driven, high-productivity agricultural system. The programme introduced High-Yielding Variety (HYV) seeds, chemical fertilizers, pesticides, assured irrigation, and mechanization, supported by institutional mechanisms such as credit, extension services, and minimum support prices. Its primary objective was to increase agricultural productivity, achieve food security, and reduce dependence on food imports. Green Revolution has led to technological and economic transformation of Indian agriculture The Green Revolution fundamentally transformed Indian agriculture by demonstrating the decisive role of technology in agrarian change. It enabled rapid increases in food grain production , particularly wheat and rice, and helped India move from a situation of food scarcity to relative self-sufficiency. Scholars like Dandekar and Rath observed that India transitioned from a “begging bowl” dependent on imports to a nation capable of feeding its population. This technological transformation also stimulated rural economic growth . Increased agricultural productivity enhanced farmers’ incomes and purchasing power, leading to expansion of rural markets for consumer goods and agro-industrial products. As noted by Ashok Thapar, this created a more vibrant rural economy with forward and backward linkages. The Green Revolution also promoted private investment in agriculture (K.N. Raj), as farmers invested in irrigation, tractors, and modern inputs. This led to mechanization and development of rural infrastructure, as well as growth of ancillary industries related to seeds, fertilizers, and farm equipment. Importantly, it also brought about significant social and political changes . As observed by Paul Brass, the benefits of the Green Revolution also accrued to the enterprising intermediate castes with access to land and capital. These groups emerged as a new dominant class in rural areas, often referred to as “ bullock capitalists ” (Lloyd Rudolph and Susanne Rudolph), altering traditional power structures and contributing to new forms of political mobilization and caste assertion. Thus, the Green Revolution was not merely an agricultural change but a broader process of agrarian transformation involving class formation and shifts in power relations."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "26-criticisms-of-the-green-revolution", "t": "26 · Criticisms of the Green Revolution", "x": "26 · Criticisms of the Green Revolution # Handout only While the Green Revolution achieved notable success in increasing agricultural productivity, its outcomes have been uneven and accompanied by significant social, economic, and environmental costs. The Green Revolution has been severally criticized, as follows: Widening of agrarian inequalities : The benefits of the Green Revolution were unevenly distributed. Large farmers with access to land, credit, irrigation, and technology benefited disproportionately, while small and marginal farmers were left behind. This led to class differentiation and rural polarization (Francine Frankel). Regional disparities : The impact of the Green Revolution was concentrated in regions like Punjab, Haryana, and Western Uttar Pradesh, where irrigation facilities were available. Other regions, especially rain-fed and eastern areas, did not benefit equally, leading to uneven regional development. Creation of new rural elite : The Green Revolution led to the emergence of a new class of wealthy farmers (dominant castes), who gained economic and political power. This resulted in new forms of dominance rather than elimination of inequality. Marginalization of small farmers : High costs of inputs such as HYV seeds, fertilizers, and machinery made it difficult for small farmers to participate fully, pushing many into indebtedness or forcing them out of agriculture. Labour exploitation : Mechanization reduced demand for agricultural labour in some regions, leading to migration and the emergence of vulnerable, migrant labourers (‘ footloose labour ’) as highlighted by Jan Breman . Environmental degradation : Excessive use of chemical fertilizers and pesticides led to soil degradation, water pollution, and loss of biodiversity. Monoculture farming weakened ecological balance (Vandana Shiva). Groundwater depletion : Intensive irrigation practices, especially in Punjab and Haryana, led to over-extraction of groundwater and falling water tables, raising concerns about long-term sustainability (Sucha Singh Gill). Health hazards : Chemical inputs entered the food chain, posing risks to human and animal health. Reinforcement of gender inequality : The Green Revolution strengthened patriarchal structures, as control over land and technology remained male-dominated. This also contributed to increased son preference (Ashish Bose). Limited impact on rural poverty : Despite increased production, benefits did not adequately trickle down to landless labourers and the rural poor, limiting its impact on poverty alleviation. In sum, the Green Revolution represents a landmark in India’s agricultural and economic history, demonstrating the transformative potential of technology in agrarian change. However, its “victory narrative” must be critically examined in light of its uneven impact, as it simultaneously generated growth and deepened inequalities. The Green Revolution illustrates the complex relationship between technology, social structure, and power, highlighting that agricultural modernization, while necessary, must be inclusive and sustainable to achieve equitable social transformation."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "27-modes-of-production-in-indian-agricultur", "t": "27 · Modes of Production in Indian Agriculture", "x": "27 · Modes of Production in Indian Agriculture # Handout only The mode of production refers to the dominant pattern of productive relations -that is, how production is organized, who owns the means of production, and how labour and surplus are distributed. In the context of Indian agriculture, the co-existence of and exchange between the feudal and capitalist modes of production has been a key area of research among sociologists and economists."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "28-feudal-mode-of-production", "t": "28 · Feudal Mode of Production", "x": "28 · Feudal Mode of Production # Handout only Under the feudal mode of production, land is the most crucial means of production. Other inputs like seeds, manure, and water were derived from nature and dependent on natural cycles. Agriculture, therefore, remained subsistence-oriented and nature-dependent. Land was not merely an economic asset but a symbol of social status and family honour. Ownership was largely hereditary, and control over land determined one’s position in the rural hierarchy. Landholding families often commanded not just economic but also ritual and political power in villages. The relationship between landlords and tenants was hierarchical and personalized. The landlord enjoyed authority over tenants, who lacked autonomy in cultivation decisions. In many cases, this relationship had an exploitative character, involving forms of forced labour (begar) and customary servitude under systems like jajmani. The tenant’s dependence extended beyond land access to social and cultural obligations, making rural social life deeply intertwined with feudal norms. Such relations were more than just economic in nature, sustained not merely through economic coercion but also through social and ritual dominance."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "29-transition-from-feudal-to-capitalist-mod", "t": "29 · Transition from Feudal to Capitalist Mode of Production", "x": "29 · Transition from Feudal to Capitalist Mode of Production # Handout only Sociologists such as A.R. Desai and K.L. Sharma have argued that post-Independence India witnessed a gradual shift from feudalism to capitalism in agriculture. This transformation was neither uniform nor complete but was driven by several interrelated factors : 1. Land Reforms : The abolition of zamindari, tenancy reforms, and ceiling legislations weakened feudal intermediaries and increased peasant proprietorship, although unevenly. 2. Green Revolution : The introduction of HYV seeds, irrigation, chemical fertilizers, and mechanization infused capital and technology into agriculture, leading to commercialization and profit orientation. 3. Decline of Jajmani System : Traditional service-based occupational interdependence declined as monetary exchange and market relations spread. 4. Expansion of Market : Agricultural inputs and outputs became part of the national and global market economy, integrating rural producers into capitalist circuits. 5. Modern Education & Urban Migration : Exposure to urban values, education, and non-agricultural employment eroded the traditional feudal mindset. This transition signified the commodification of land, labour, and produce, marking a structural change in rural India."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "30-capitalist-mode-of-production", "t": "30 · Capitalist Mode of Production", "x": "30 · Capitalist Mode of Production # Handout only In the capitalist mode of production, capital - rather than land - becomes the main input and determinant of production. Ownership is no longer purely hereditary; land and other inputs such as tractors, threshers, HYV seeds, and fertilizers are purchased in the market. Agricultural production is increasingly market-oriented , geared towards profit maximization, and not subsistence. The produce is sold in mandis (agricultural markets), and investment decisions are made based on returns and efficiency rather than traditional obligations. There is a perceptible decline in the emotional attachment to land. Land has increasingly become a commodity that can be bought and sold, diminishing the cultural and emotional value associated with it. Agricultural labourers now work based on contractual or wage relationships, similar to industrial labour. The agrarian working class , comparable to the industrial proletariat, has emerged. Agriculture is no longer a way of life as it was under the feudal system. It has become an economic enterprise , governed by principles of efficiency, productivity, and profitability. The changing means of production - particularly mechanization, capital-intensive inputs, and market-oriented agriculture - have reduced the demand for manual labour, leading to underemployment and displacement of agricultural workers. Small and marginal farmers, unable to invest in new technologies, often face indebtedness and loss of livelihood. This has contributed to increased rural poverty, especially among landless labourers and vulnerable groups, highlighting the uneven and exclusionary nature of agrarian transformation."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "31-conclusion", "t": "31 · Conclusion", "x": "31 · Conclusion # Handout only Today, Indian agriculture is characterized by multiple modes of production. In the Green Revolution belt, capitalist features predominate. In the more backward regions, feudal elements are still visible. In large parts, feudal tendencies are being fast replaced by capitalist considerations due to modernization. Several regions exhibit a complex combination of feudal as well as capitalist features in varying degrees."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "32-agrarian-class-structure-in-india", "t": "32 · Agrarian Class Structure in India", "x": "32 · Agrarian Class Structure in India # Handout only Agrarian class structure refers to the pattern of differentiation in rural society based on ownership and control over land, access to productive resources, and role in agricultural production. In India, this structure is shaped by both economic and social factors, particularly caste, making it more complex than a purely class-based system. Several scholars have offered different classification of the classes in Indian agriculture. A. R. Desai identified three broad classes in agrarian society: Upper Class Landowners - own large parcels of land and often employ labour Middle Class Landowners - own medium-sized landholdings and largely rely on family labour with occasional hiring Lower Class Landowners - own small or marginal landholdings and often supplement income through wage labour This classification highlights that control over land is the primary basis of agrarian class differentiation, though it is mediated by other factors. Jan Breman , in his study of Surat (Gujarat), identified the following three categories: Large Farmers - own more than 15 acres Middle Farmers - own between 5-15 acres Small & Marginal Farmers - own less than 5 acres Breman suggests that classification should not be based on land size alone. Factors such as soil quality, irrigation, productivity, and market access significantly affect economic position. This indicates that agrarian class is increasingly shaped by access to capital and infrastructure, not just land."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "33-caste-or-class", "t": "33 · Caste or Class?", "x": "33 · Caste or Class? # Handout only Andre Beteille , in his work Class Structure in an Agrarian Society(study of Sripuram, Tamil Nadu), argued that agrarian stratification is based on multiple criteria - ownership of land, control over labour, and access to power. He identified two broad classes: Owners of land Non-owners of land Beteille did not argue that caste has vanished; rather, he showed that class and caste intersect but are analytically distinct. Economic differentiation within castes is increasing, indicating partial movement towards class-based stratification. Pauline Kolenda , in her study of a village in Kanyakumari (Tamil Nadu), observed that dominant castes often occupy better economic positions, but internal differentiation within castes is growing . Thus, caste has not been replaced by class, but class divisions are emerging within caste groups. Daniel Thorner gave a three-fold classification of agrarian classes: 1. Malik - large landowners. Maliks are of 2 types: a. Absentee landlords b. Supervisory Maliks. 2. Kisan - Kisans are peasant proprietors or cultivators who typically own small tracts of land or they take land on lease from the Maliks. Kisans themselves till the land or use family labour. Kisans may employ outside labour during peak seasons to supplement family labour. 3. Mazdoor - landless labourers who depend on wage labour; include sharecroppers and small tenants. This framework is significant as it captures relations of production (ownership, control, labour dependence) rather than just size of landholding. Government of India classifies landholders as: Category Size of Land (in hectares) Marginal Less than 1 Small 1-2 Semi-Medium 2-4 Medium 4-10 Large >10 Approximately 85% of farmers are small and marginal, making agriculture largely subsistence-oriented and economically vulnerable, while large farmers (only 0.4%) control disproportionate resources. Memory aid (own) · Landholding size classes (smallest to largest) M S S M L My Silly Sister Made Lunch. M = Marginal: less than 1 hectare; S = Small: 1-2 hectares; S = Semi-medium: 2-4 hectares; M = Medium: 4-10 hectares; L = Large: more than 10 hectares. Sentence follows the size order from smallest to largest. (order kept (size ladder))"}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "34-changing-agrarian-class-structure", "t": "34 · Changing Agrarian Class Structure", "x": "34 · Changing Agrarian Class Structure # Handout only Agrarian class structure in India has been undergoing significant changes due to modern forces. Land reforms weakened traditional landlordism and created a class of peasant proprietors, though unevenly. The Green Revolution led to the rise of rich farmers, particularly from intermediate castes, who emerged as dominant economic and political actors. Mechanization and commercialization have reduced dependence on traditional labour, weakening systems like jajmani and leading to greater class differentiation within villages. Migration and diversification of livelihoods have further altered rural structure, with many households combining agriculture with non-farm income. Thus, agrarian class structure is becoming more fluid and differentiated, with both upward mobility and marginalisation occurring simultaneously."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "35-impact-of-globalization", "t": "35 · Impact of Globalization", "x": "35 · Impact of Globalization # Handout only Globalization has further transformed agrarian class relations by integrating agriculture into wider markets. Large farmers with access to capital, technology, and markets have benefited from commercialization, while small and marginal farmers face price volatility, indebtedness, and economic insecurity. The rise of contract farming, agribusiness, and corporate entry into agriculture has altered traditional relations, increasing dependence of small farmers on external actors. This has led to class polarization, with emergence of a prosperous agrarian elite alongside a vulnerable class of small farmers and landless labourers."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "36-conclusion", "t": "36 · Conclusion", "x": "36 · Conclusion # Handout only Agrarian class structure in India is not static and not purely caste-based. It is increasingly shaped by economic forces, technological change, and globalization. While traditional hierarchies have weakened, new forms of inequality and differentiation have emerged. Thus, agrarian society today reflects a complex interaction of caste, class, and market forces, undergoing continuous transformation."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "37-rural-and-agrarian-transformation-in-ind", "t": "37 · Rural and Agrarian Transformation in India", "x": "37 · Rural and Agrarian Transformation in India # Handout only Rural and agrarian transformation has been taking place in India since ages, but particularly gained momentum during colonial and post-independence periods. Several multi-dimensional changes in rural society have been brought about by state policies, technological interventions, market forces, and social movements. This transformation involves shifts in agricultural practices, class relations, livelihood patterns, and institutional structures. From a largely subsistence-oriented, caste-bound agrarian order, rural India has gradually moved towards a more market-oriented, diversified, and dynamic system, though unevenly across regions. These transformations reflect both continuity of traditional structures and emergence of new forms of inequality, mobility, and organisation. State initiatives, particularly, have been instrumental in bringing about important changes in rural areas. These include policies and programs aimed at promotion of cooperatives, community development program, schemes like MGNREGA, and the MSP regime, to name a few."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "38-cooperatives-in-india", "t": "38 · Cooperatives in India", "x": "38 · Cooperatives in India # Handout only Cooperatives refer to a collectivity of people who pool their resources and jointly manage economic activity in cooperation. A cooperative is an autonomous association of persons united voluntarily to meet their common economic, social, and cultural needs through a jointly owned and democratically controlled enterprise. Cooperatives function on principles of voluntary participation, democratic decision-making, and equitable distribution of benefits."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "39-evolution-of-cooperatives-in-india", "t": "39 · Evolution of Cooperatives in India", "x": "39 · Evolution of Cooperatives in India # Handout only The cooperative movement in India originated in response to rural indebtedness and exploitation of farmers in the colonial era . Over time, it expanded from credit societies to diverse sectors such as dairying, sugar production, banking, housing, and handlooms. In sectors like dairy (e.g., milk cooperatives), cooperatives have achieved notable success. India’s agrarian structure, dominated by small and marginal farmers with limited capital, makes cooperatives particularly relevant. By pooling small resources, cooperatives help achieve economies of scale, improve access to credit, inputs, and markets, and strengthen collective bargaining power. The state has also played a role in promoting cooperatives, including the 97th Constitutional Amendment (2011), which recognised the right to form cooperatives, and the creation of a Ministry of Cooperation (2021) to strengthen the sector."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "40-role-of-cooperatives-in-rural-developmen", "t": "40 · Role of Cooperatives in Rural Development and Poverty Alleviation", "x": "40 · Role of Cooperatives in Rural Development and Poverty Alleviation # Handout only Cooperatives play an important role in rural transformation by acting as instruments of economic organisation and social empowerment . They provide affordable credit, reduce dependence on moneylenders, and facilitate access to agricultural inputs such as seeds, fertilizers, and irrigation. By enabling collective marketing, cooperatives help farmers secure better prices and reduce exploitation by intermediaries. They also contribute to poverty alleviation by integrating small farmers, landless labourers, and artisans into economic activities. Through employment generation and income enhancement, cooperatives promote inclusive development. In sectors like dairy, cooperatives have enabled participation of women and marginal groups, thereby strengthening livelihoods and social empowerment. A. R. Desai observed that cooperatives can complement land reforms by restructuring agrarian relations and reducing inequalities. Similarly, P. R. Dubhashi described cooperatives as not merely institutions but a dynamic movement , evolving with changing needs - from credit provision to multi-sectoral engagement."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "41-analysis-of-cooperative-movement", "t": "41 · Analysis of Cooperative Movement", "x": "41 · Analysis of Cooperative Movement # Handout only 1. Cooperatives are not just institutions but a movement , adapting to changing needs - from credit societies to diversified economic organisations. 2. They can help overcome distortions in agrarian structure created by colonial rule and support rural reconstruction (A. R. Desai). 3. However, their success has been uneven . While large and middle farmers have benefited through access to credit and infrastructure, poorer and landless groups have often been excluded (Chaturvedi). 4. Daniel Thorner argued that cooperatives are often dominated by rural elites , functioning on the basis of “caste economics.” In many cases, powerful families control decision-making, undermining democratic functioning."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "42-challenges-faced-by-cooperative-movement", "t": "42 · Challenges Faced by Cooperative Movement", "x": "42 · Challenges Faced by Cooperative Movement # Handout only The cooperative movement in India faces several structural and functional challenges: 1. Weak organisational structure and lack of coordination among different cooperatives. 2. Limited participation of members , especially small farmers and marginalized groups. 3. Lack of professional management and technical expertise . 4. Inadequate infrastructure and financial resources. 5. Over-dependence on government support, affecting autonomy. 6. Difficulty in competing in a liberalised and globalised economy. 7. Elite capture and politicisation , undermining democratic functioning. These challenges have restricted the effectiveness of cooperatives as instruments of inclusive rural development."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "43-measures-to-strengthen-cooperatives", "t": "43 · Measures to Strengthen Cooperatives", "x": "43 · Measures to Strengthen Cooperatives # Handout only To enhance their effectiveness at the grassroots level, several measures are necessary: 1. Ensuring greater autonomy and reducing political interference. 2. Promoting inclusive membership , especially of small farmers, women, and marginalized groups. 3. Strengthening professional management and capacity building . 4. Improving infrastructure, digital integration , and access to markets. 5. Encouraging federation and coordination among cooperatives for better scale and efficiency. 6. Reducing dependence on state support by enhancing financial sustainability . Cooperatives have played a significant role in rural development and poverty alleviation by promoting collective action, improving access to resources, and strengthening livelihoods. However, their potential has been constrained by structural weaknesses, elite capture, and changing economic conditions. Strengthening cooperatives through institutional reforms and inclusive practices is essential for making them effective instruments of equitable rural transformation."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "44-programmes-of-rural-development-in-india", "t": "44 · Programmes of Rural Development in India", "x": "44 · Programmes of Rural Development in India # Handout only Rural development programmes in India aim at improving the economic conditions, livelihoods, and quality of life of rural populations, particularly small farmers, landless labourers, and marginalized groups. These programmes combine state intervention, institutional innovation, and community participation to address poverty, unemployment, and agrarian distress. Over time, they have evolved from top-down welfare initiatives to more participatory and rights-based approaches."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "45-community-development-programme-cdp", "t": "45 · Community Development Programme (CDP)", "x": "45 · Community Development Programme (CDP) # Handout only The Community Development Programme was a multi-purpose programme launched in the early 1950s with the aim of achieving holistic development of rural India. It covered sectors such as agriculture, irrigation, animal husbandry, health, education, communication, cooperation, and village industries. The programme was implemented through administrative machinery at district and block levels and was later supplemented by the National Extension Scheme. S. C. Dube identified the basic aims of CDP as: 1. Monetization and increase in agricultural production 2. Modernization of communication systems 3. Improvement in rural health, hygiene, and education 4. Socio-economic transformation of villages Its broader objectives included employment generation, promotion of self-reliance, development of local leadership, expansion of cooperative principles, and creation of community assets. Despite its ambitious vision, the Community Development Programme largely failed to achieve its goals due to several structural limitations . It suffered from the absence of clearly defined priorities and an uneven distribution of benefits, with local elites capturing a disproportionate share. The programme was marked by excessive bureaucratization and limited people’s participation, operating largely through a top-down administrative approach that lacked grassroots involvement (as noted by S. C. Dube). A. R. Desai pointed out that it was based on the faulty assumption of village consensus, ignoring deep caste and class divisions within rural society. The Balwant Rai Mehta Committee recommended democratic decentralisation through Panchayati Raj Institutions, which became a major institutional outcome of the programme."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "46-mgnrega", "t": "46 · MGNREGA", "x": "46 · MGNREGA # Handout only Picture hook Rural women at MGNREGA worksite earthwork. (handout p.22) The Mahatma Gandhi National Rural Employment Guarantee Act (MGNREGA) represents a shift towards a rights-based approach to rural development. It guarantees 100 days of wage employment to rural households willing to do unskilled manual work. The MGNREGA has had multiple impacts: 1. It provides income security to rural households, especially during agricultural off-seasons 2. It reduces distress migration by creating local employment opportunities 3. It strengthens bargaining power of labourers, leading to higher rural wages 4. It promotes social inclusion , as participation of women and marginalized groups is significant 5. It contributes to creation of rural assets such as roads, ponds, and irrigation structures However, challenges such as delays in wage payments, corruption, and uneven implementation limit its effectiveness. MGNREGA workers at a site The Viksit Bharat Guarantee for Rozgar and Ajeevika Mission Gramin Act (VB-G RAM G Act, 2025) aims at a comprehensive legislative reset. It strengthens the implementation framework by increasing the administrative expenditure ceiling from 6 per cent to 9 per cent, providing greater support for staffing, remuneration, training, and technical capacity. This shift reflects a practical and people-centred approach to programme management, moving towards a more professional and adequately supported system. Stronger administrative capacity is expected to enhance service delivery, and reinforce accountability, ensuring that the objectives of the new framework are achieved consistently at the village level. However, the new framework has been criticized. Critics allege that by repealing the MGNREGA, the government has converted a demand-based legal right to work into a centralised, discretionary, budget-capped scheme, fully controlled by the central government. Employment is no longer guaranteed by law but subject to annual allocations, political priorities, and fiscal arbitrariness. This is a betrayal of agri- workers, especially the landless and the rural poor who depend on MGNREGA for survival and dignity."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "47-role-of-msp-in-rural-development", "t": "47 · Role of MSP in Rural Development", "x": "47 · Role of MSP in Rural Development # Handout only The Minimum Support Price (MSP) scheme is an important policy tool aimed at ensuring remunerative prices to farmers and protecting them from market fluctuations. By guaranteeing a minimum price for certain crops, MSP helps in stabilizing farm incomes and encouraging agricultural production. From a sociological perspective, MSP contributes to rural development by: 1. Providing income stability to farmers, especially in regions with strong procurement systems (e.g., Punjab, Haryana) 2. Encouraging investment in agriculture, thereby increasing productivity 3. Reducing vulnerability to market risks and price crashes However, its benefits are uneven, as MSP procurement is concentrated in certain regions and crops. Large and medium farmers benefit more, while small farmers and those in non-procurement regions are often excluded. Thus, while MSP has potential for rural development, its impact remains regionally and socially differentiated."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "48-challenges-in-rural-development-programm", "t": "48 · Challenges in Rural Development Programmes", "x": "48 · Challenges in Rural Development Programmes # Handout only Despite multiple initiatives, rural development programmes face several persistent challenges: 1. Elite capture : Benefits are often appropriated by dominant castes and local elites. 2. Lack of participation : Programmes remain top-down, with limited involvement of local communities. 3. Administrative inefficiency : Bureaucratic delays, corruption, and poor implementation reduce effectiveness. 4. Regional disparities : Better-performing states gain more, while backward regions lag behind. 5. Fragmentation of programmes : Lack of coordination among schemes leads to duplication and inefficiency. 6. Exclusion of the poorest : Landless labourers, women, and marginalized groups often fail to access benefits. 7. Dependence on state machinery : Weak local institutions hinder sustainable outcomes. Rural development programmes in India have evolved from early state-led initiatives like the Community Development Programme to more participatory and rights-based schemes such as MGNREGA. While these programmes have contributed to employment generation, poverty alleviation, and infrastructure development, their impact has been uneven due to structural inequalities, administrative challenges, and limited grassroots participation. Strengthening decentralisation, inclusiveness, and accountability remains crucial for achieving sustainable rural transformation."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "49-problems-of-rural-labour-bondage-and-mig", "t": "49 · Problems of Rural Labour, Bondage and Migration", "x": "49 · Problems of Rural Labour, Bondage and Migration # Handout only Rural labour in India constitutes one of the most vulnerable segments of society, largely comprising landless labourers, marginal farmers, and migrant workers. Their conditions are shaped by unequal agrarian structures, lack of assets, and dependence on seasonal employment. The processes of agrarian transformation, commercialization, and globalization have not eliminated their vulnerabilities but have instead created new forms of insecurity, exploitation, and mobility."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "50-problems-of-rural-labour", "t": "50 · Problems of Rural Labour", "x": "50 · Problems of Rural Labour # Handout only Rural labourers face multiple structural and economic constraints. Their most fundamental problem is lack of access to land and productive resources, which forces them to depend on wage labour. Employment in agriculture is highly seasonal and uncertain , leading to underemployment and disguised unemployment. Low wages remain a persistent issue, often falling below statutory minimum wages due to weak enforcement and surplus labour supply. Labourers also lack bargaining power, as they are dependent on landlords or large farmers for employment. In many regions, wages are influenced by caste hierarchy, reinforcing social inequality. Another major issue is the absence of social security . Rural labourers have limited access to healthcare, insurance, pensions, or stable income sources. Women labourers face additional disadvantages, including lower wages, lack of recognition, and gender-based division of labour. Mechanization and commercialization of agriculture have further reduced labour demand in certain regions, leading to labour displacement and increased vulnerability. Thus, rural labour continues to remain trapped in a cycle of poverty and insecurity."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "51-bonded-labour-and-forms-of-bondage", "t": "51 · Bonded Labour and Forms of Bondage", "x": "51 · Bonded Labour and Forms of Bondage # Handout only Bonded labour represents an extreme form of exploitation in rural India, where labourers are tied to employers through debt, caste obligations, or customary practices. Although legally abolished (Bonded Labour System (Abolition) Act, 1976), it persists in disguised forms. Bondage is often rooted in interlinked credit and labour markets, where labourers borrow from landlords and are forced to work under exploitative conditions to repay debts. These debts are often hereditary, passing from one generation to another. Bonded labour is closely associated with caste hierarchy, with Dalits and marginalized communities disproportionately affected. It involves restrictions on mobility, low or unpaid wages, and lack of freedom to change employers. Even where traditional bonded labour has declined, new forms of neo-bondage have emerged in sectors such as brick kilns, construction, and plantations, where advances, labour contractors, and migration create similar dependency relations. Thus, bondage reflects the persistence of semi-feudal relations within a changing capitalist agrarian economy."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "52-migration-and-rural-labour-mobility", "t": "52 · Migration and Rural Labour Mobility", "x": "52 · Migration and Rural Labour Mobility # Handout only Migration has become a defining feature of rural transformation in India. It is both a survival strategy and a response to structural constraints in rural areas. Causes of Migration 1. Lack of employment opportunities in rural areas 2. Seasonal nature of agriculture 3. Low wages and indebtedness 4. Agrarian distress and land fragmentation 5. Attraction of better wages and opportunities in urban areas Migration is often circular or seasonal , with labourers moving to cities during lean agricultural periods and returning during peak seasons. Migration is largely distress-driven rather than opportunity-driven, especially for landless labourers. Migrants often work in informal sectors such as construction, brick kilns, factories, and domestic work. They are typically unskilled or semi-skilled, with little job security."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "53-problems-faced-by-migrant-labour", "t": "53 · Problems Faced by Migrant Labour", "x": "53 · Problems Faced by Migrant Labour # Handout only 1. Precarious employment : Work is irregular, low-paid, and lacks legal protection. 2. Poor living conditions : Migrants often live in slums or temporary shelters with inadequate facilities. 3. Lack of social security : No access to welfare schemes due to lack of documentation or portability. 4. Exploitation by contractors : Middlemen often control wages and working conditions. 5. Social exclusion : Migrants face discrimination in urban areas and lack integration. 6. Family disruption : Migration leads to separation of families and feminization of agriculture in villages. Scholars like Jan Breman have described migrant labour as “ footloose labour ”, characterised by insecurity, mobility, and lack of protection. This highlights transition from traditional bondage to more flexible but equally precarious labour relations. The problems of rural labour, bondage, and migration reflect the contradictions of agrarian transformation in India. While modernization and market integration have created new opportunities, they have also deepened vulnerabilities for those lacking resources and skills. Addressing these challenges requires not only economic interventions but also structural reforms, social protection, and strengthening of labour rights to ensure inclusive rural development."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "54-factionalism-in-rural-india", "t": "54 · Factionalism in Rural India", "x": "54 · Factionalism in Rural India # Handout only Rural Indian society is often described as faction-ridden, where villagers are divided into competing groups based on kinship, caste, and power relations. Beals and Siegel describe factionalism as an overt conflict within a group leading to abandonment of cooperative activities . Oscar Lewis, in Group Dynamics in a North Indian Village(1954), defines a faction as primarily a kinship unit consisting of one or more extended families. Yogendra Singh also views factions as kin-based groups (kunbas) descended from a common ancestor. A fight breaks out between two powerful factions in a village Lewis’s study of Rampur (a Jat village near Delhi) noted factions which were semi-permanent groups organised around caste and kinship ties. The main causative factors of factionalism are: Quarrels and disputes over inheritance of property. Family feuds over adoption for succession. Disputes over land and irrigation rights. Conflicts arising from sexual offences. Murders and violent conflicts. S. Dhillon observed that rivalry and opposition between groups is a defining feature of factions, often arising from personality clashes and struggles for dominance. Other factors include competition for political power, access to state resources, and assertion of group interests. Thus, factionalism indicates that rural society is not homogeneous and cooperative, but also conflict-ridden and deeply divided along social and economic lines."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "55-peasants-and-farmers-movements-in-india", "t": "55 · Peasants and Farmers’ Movements in India", "x": "55 · Peasants and Farmers’ Movements in India # Handout only Picture hook Peasants gathered at a mass meeting. (handout p.26) Indian agriculture presents a paradox. On one hand, it has achieved significant growth - India is among the largest producers of milk, rice, wheat, and other commodities, with foodgrain production exceeding 300 million tonnes and strong export performance. On the other hand, the sector is marked by deep agrarian distress, reflected in farmer protests, indebtedness, and suicides. The root of rural unrest lies in structural contradictions: agriculture contributes only about 15-20% to GDP but employs nearly half the workforce, leading to low productivity and disguised unemployment. Factors such as land fragmentation, dependence on monsoons, indebtedness, rising aspirations under globalization, weak MSP implementation, and dominance of intermediaries have intensified farmer vulnerability. As P. Sainath argues, agrarian distress arises from multiple structural causes including low productivity, lack of irrigation, weak credit access, and market dependence. A. R. Desai distinguishes between peasants and farmers : 1. Peasants: small landholders engaged in subsistence agriculture 2. Farmers: relatively large landholders engaged in commercial agriculture Desai argues that pre-independence movements were largely peasant movements, whereas post-independence mobilisations increasingly reflect farmer (commercial agrarian class) interests."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "56-colonial-era-peasant-movements", "t": "56 · Colonial Era Peasant Movements", "x": "56 · Colonial Era Peasant Movements # Handout only Peasant movements during the colonial period were largely responses to the economic exploitation and structural distortions introduced by British agrarian policies. The colonial state reorganised land relations primarily to maximise revenue extraction, which disrupted traditional agrarian systems and placed immense pressure on cultivators. As a result, peasants across different regions mobilised in protest against oppressive conditions, giving rise to a series of movements such as the Champaran movement, Indigo revolt, Deccan riots, Bardoli and Kheda satyagrahas, and the Kisan Sabha movement. Though varying in form and leadership, these movements shared a common foundation in agrarian distress induced by the colonial policies."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "57-tebhaga-movement-a-case-study", "t": "57 · Tebhaga Movement: A Case Study", "x": "57 · Tebhaga Movement: A Case Study # Handout only The Tebhaga Movement (1946-47) in Bengal was a significant peasant uprising led primarily by sharecroppers, known as bargadars, who demanded a larger share of the produce. Traditionally, sharecroppers were required to give half of the produce to landlords. The movement sought to change this arrangement by demanding tebhaga - that is, two-thirds of the produce for the cultivator and one-third for landlord. This demand was rooted in the argument that the sharecropper bore the burden of cultivation, including labour and inputs. The movement played an important role in asserting the rights of sharecroppers against exploitative landlordism. It brought into focus the structural inequalities inherent in agrarian relations and highlighted the precarious conditions under which sharecroppers lived. By mobilising peasants across regions, the Tebhaga Movement contributed to the development of class consciousness among the peasantry, shifting the nature of agrarian protests from localized grievances to broader struggles based on class interests. The impact of the movement extended beyond its immediate demands. It significantly influenced post-independence tenancy reforms, particularly in West Bengal, where legal measures were later introduced to protect the rights of sharecroppers. More broadly, the Tebhaga Movement helped draw national attention to issues of agrarian inequality and exploitation, making them central to debates on rural reform. In this sense, the movement marked a transition from sporadic and fragmented peasant protests to more organized, class-based mobilisations, laying the groundwork for future agrarian movements in India. According to D. N. Dhanagare , the primary driving force behind these movements was economic exploitation rather than ideological mobilisation. The introduction of exploitative land tenure systems such as zamindari and ryotwari led to the emergence of absentee landlordism, where intermediaries extracted high rents without contributing to agricultural development. Peasants were burdened with excessive land revenue demands, pushing them into chronic indebtedness. The situation was further aggravated by frequent eviction of tenants , lack of security of tenure, and increasing landlessness. Declining agricultural productivity, coupled with recurrent famines and price instability, deepened rural distress. These structural conditions created widespread dissatisfaction among peasants, who responded through collective resistance and protest. Thus, colonial-era peasant movements reflected the progressive pauperisation of the Indian peasantry, as economic pressures eroded their livelihoods and autonomy. These movements were not merely sporadic uprisings but represented a sustained response to the systemic exploitation embedded in colonial agrarian policies."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "58-new-farmers-movements", "t": "58 · New Farmers’ Movements", "x": "58 · New Farmers’ Movements # Handout only From the late 1970s onwards, India witnessed the emergence of a new phase of agrarian mobilization, commonly referred to as the new farmers’ movements. These movements were led by organizations such as the Bharatiya Kisan Union under Mahendra Singh Tikait, the Shetkari Sanghatana led by Sharad Joshi, the Karnataka Rajya Ryot Sangha, and the Tamil Nadu Agriculturists Association. Unlike earlier peasant movements, these were primarily led by relatively prosperous farmers, especially those belonging to dominant and intermediate castes who had benefited from the Green Revolution. Farmer leader Mahendra Singh Tikait at a protest in New Delhi These movements were characterized by a strong focus on economic demands such as higher Minimum Support Prices (MSP), subsidies, and loan waivers. They employed largely non-violent, Gandhian methods of protest, including rallies, road blockades (chakka jam), and mass mobilization. Importantly, the state was not seen as an adversary but as a negotiating authority from which concessions could be extracted. Ideologically, these movements also articulated a “ India vs Bharat ” narrative, highlighting the perceived neglect of rural interests in favour of urban and industrial sectors. However, despite their wide mobilisation, the benefits and demands of these movements were often skewed towards the interests of rich and middle farmers, while small and marginal farmers remained relatively underrepresented due to their limited resources and weaker bargaining capacity."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "59-contemporary-farmers-mobilization", "t": "59 · Contemporary Farmers’ Mobilization", "x": "59 · Contemporary Farmers’ Mobilization # Handout only In the contemporary period, farmers’ movements have undergone significant changes in their nature and form. They are increasingly issue-based, focusing on concerns such as MSP guarantees, land acquisition policies, and the entry of corporate actors into agriculture. These movements have also gained greater visibility due to the role of media and digital platforms, enabling wider dissemination of their demands and narratives. The current farmers’ agitations and protests have to be understood in the wider context of globalization. S. S. Jodhka points out that as the share of agriculture in GDP has declined, reducing the overall political clout of farmers, agrarian mobilization persists due to continuing distress and insecurity in rural livelihoods."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "60-farm-laws-and-recent-farmers-protests", "t": "60 · Farm Laws and Recent Farmers’ Protests", "x": "60 · Farm Laws and Recent Farmers’ Protests # Handout only Picture hook Farmers protest on the highway, 2020-21. (handout p.27) The farmers’ protests of 2020-21 represent one of the most significant contemporary agrarian movements in India. The protests were triggered by three farm laws aimed at promoting contract farming, allowing sale of agricultural produce outside APMC mandis, and deregulating certain agri-commodities. The government justified these reforms as necessary for liberalizing agriculture and improving farmer incomes through market integration. Farmers blocking arterial roads to Delhi during protests in 2020 and 2021 However, many farmers perceived these reforms as a threat to their livelihoods. They feared that the new laws would weaken the MSP system, facilitate corporate domination of agriculture, and erode the existing mandi-based procurement structure. The movement witnessed large-scale mobilization, particularly from Punjab and Haryana, with sustained protests at Delhi’s borders. S.S. Jodhka highlights that the movement reflected not only economic concerns but also identity issues , especially among Sikh farmers. Nivedita Menon noted the significant participation of women , indicating a broadening of the social base of these movements. Notably, these mobilizations tend to remain regionally concentrated , particularly in agriculturally advanced regions like Punjab, Haryana, and western Uttar Pradesh. Scholars like Neera Chandhoke criticised attempts to delegitimise the protests , while Ashis Nandy interpreted them as a reaffirmation of democratic resistance . The eventual repeal of the farm laws demonstrated the continuing relevance and strength of agrarian movements in India’s democratic framework."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "61-changing-nature-of-farmers-movements", "t": "61 · Changing Nature of Farmers’ Movements", "x": "61 · Changing Nature of Farmers’ Movements # Handout only Farmers’ movements in India have been undergoing a gradual transformation in their character. There has been a shift from class-based mobilization to issue-based mobilization, where specific demands rather than broad class identities drive collective action. Similarly, movements have evolved from being localized struggles to large-scale, nationally coordinated protests. Another important shift is the expansion of demands beyond purely economic issues to include identity, dignity, and rights-based concerns. The growing role of civil society organizations, media, and even transnational networks has further shaped the nature of these movements. This reflects the increasing complexity of agrarian issues in a globalized and interconnected world."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "62-link-with-agrarian-transformation", "t": "62 · Link with Agrarian Transformation", "x": "62 · Link with Agrarian Transformation # Handout only Farmers’ movements are closely linked to broader processes of agrarian transformation in India. The declining significance of agriculture in the national economy, coupled with continued dependence of a large population on farming, has generated persistent distress and periodic protests. The transfer of land from cultivators to non-cultivating entities has created anxieties regarding loss of livelihood and identity among farmers. At the same time, globalization has raised aspirations while exposing farmers to volatile markets and economic risks. Thus, agrarian movements can be understood both as a response to structural changes in rural society and as an agent influencing further transformation, shaping policies and public discourse on agriculture."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "63-conclusion", "t": "63 · Conclusion", "x": "63 · Conclusion # Handout only Peasant and farmers’ movements in India have evolved from anti-colonial struggles rooted in survival to contemporary mobilizations shaped by market forces and state policies. While earlier movements were mainly directed against colonial exploitation, modern movements reflect tensions between liberalization, agrarian livelihoods, and state intervention. Their persistence underscores that rural India continues to be a critical arena of social conflict, negotiation, and democratic assertion. Memory aid (own) · Causes of village factionalism M A I L S MAILS. M = Murders and violent conflicts; A = Adoption feuds over succession; I = Inheritance quarrels over property; L = Land and irrigation rights disputes; S = Sexual offences. Village feuds arrive like MAILS: each old quarrel feeds a faction. (order free)"}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "traps", "t": "Traps", "x": "Traps # Common mix-ups and the rule for the exam hall Trap What goes wrong, and the rule Metcalfe vs Ambedkar Metcalfe: village as little republic; Ambedkar: village as sink of localism. Exam-hall rule: Metcalfe = harmony, Ambedkar = oppression. Srinivas vs Beteille villages Srinivas: Rampura and Coorg; Beteille: Sripuram; Bailey: Bisipara. Exam-hall rule: match village to author. Feudal vs capitalist Feudal: land is main input; capitalist: capital and market inputs. Exam-hall rule: land = feudal, capital = capitalist. Old vs new farmers' movements Colonial and Tebhaga movements were about survival; new ones led by prosperous farmers want MSP and subsidies. Exam-hall rule: ask who led and what they demanded."}, {"c": "20", "n": "Rural Society and Agrarian Social StructureHigh priority", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Who called villages little republics? Charles Metcalfe Ambedkar's phrase for the village? A sink of localism, a den of ignorance, narrow-mindedness and communalism Srinivas's Coorg book? Religion and Society among the Coorgs of South India (1952) Beteille's Sripuram study? Caste, Class and Power (1965) Bailey's village? Bisipara, Odisha Joshi's three approaches to land reform? Gand  marks · Write short note with a sociological perspective: Classes in agrarian society in India. (150 words) Question. Write short note with a sociological perspective: Classes in agrarian society in India. (150 words) Intro: name Rural Society and Agrarian Social Structure and state the central idea in one line (see The story first). Body: build the answer from the notes under: Agrarian Class Structure in India. Close: finish with the matching criticisms section and a one-line judgement. Previous Impact of Colonial Rule on Indian Society Next Caste System, Untouchability and Dalit Movements Personal study notes built from: Sarrthi IAS · Sociology Optional Foundation 2027 · Rural Sociology (26th September). Only the handout facts are used; memory aids are labelled own. Copyright belongs to the teacher or institute; keep this private."}, {"c": "21", "n": "Caste System, Untouchability and Dalit MovementsHigh priority", "id": "chapter-map", "t": "Chapter map", "x": "Chapter map # Map Outline Caste system Features Ascribed status Endogamy Hierarchy Occupation Theories Ghurye Dumont Srinivas Beteille Gupta Concepts Sanskritisation Dominant caste Harmonic and disharmonic Untouchability Three types (Ambedkar) Article 17 Modern forms Dalit movement Gandhian Ambedkarite BSP and Panthers"}, {"c": "21", "n": "Caste System, Untouchability and Dalit MovementsHigh priority", "id": "lens", "t": "Exam lens", "x": "Exam lens # Exam lens Priority: High. Mains PYQs quoted: 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025. Prelims: not asked (Mains optional). Mains hooks 37 Mains PYQs are quoted in the handout, every year from 2013 to 2025: the highest-priority chapter of Paper II. Clusters: untouchability forms (4), Ambedkar and annihilation of caste (4), Dumont and binary opposition (4), Beteille (3), Sanskritisation (2), Gupta's discrete castes and muddled hierarchies, features of caste, caste in non-Hindu groups, and eight on the Dalit movement. Build every caste answer from a theorist's table, then close with Ambedkar versus Gandhi for the Dalit question."}, {"c": "21", "n": "Caste System, Untouchability and Dalit MovementsHigh priority", "id": "story", "t": "The story first", "x": "The story first # The story first Caste is a closed, hereditary, endogamous and ranked system. Ghurye lists its features, Dumont reads it as an ideology of purity and pollution, Srinivas studies its ground reality through Sanskritisation and the dominant caste, Beteille shows it giving way to class and power, and Dipankar Gupta replaces hierarchy with discrete castes. Untouchability and the Dalit movement carry the story from Gandhi to Ambedkar. 1. What caste is. From the Portuguese casta (lineage) and Latin castus (pure), caste organises society into hereditary, endogamous and ranked groups. Its features: ascribed status, no mobility, occupational specification, endogamy, hierarchy, restrictions on feeding and intercourse, and civil and religious disabilities and privileges. *→ How do thinkers read it?* 2. Ghurye and Dumont. Ghurye's Caste and Race in India (1932) gives six features: segmental division, hierarchy, restrictions on feeding and social intercourse, civil and religious disabilities and privileges, lack of unrestricted choice of occupation, restrictions on marriage. Dumont's Homo Hierarchicus reads caste as an ideology of the pure and impure, pan-India, with holism and hierarchy against Western individualism and equality. *→ What does fieldwork show?* 3. Srinivas on caste. Srinivas analysed the ground reality. Sanskritisation is a lower caste or tribe taking up the rituals and customs of a higher caste; Gould reads it as defiance. The dominant caste, from Rampura, has numerical strength, land, political power, education and jobs; Pocock and Majumdar criticise it. His 2003 essay An Obituary on Caste as a System notes its resilience. *→ Is caste changing?* 4. Beteille and Gupta. Beteille's Caste, Class and Power (Tanjore, 1965) shows caste no longer sufficient and criticises Dumont in Harmonic and Disharmonic Social Systems. Dipankar Gupta's Interrogating Caste calls the hierarchy thesis a sacerdotal book view: hierarchies are multiple and muddled and castes exist as discrete units, building on Bougle's repulsion. *→ How is caste studied?* 5. Approaches, non-Hindus and untouchability. Structural versus cultural and attributional versus interactional views. Caste-like distinctions exist among Muslims and Christians for historical and cultural reasons. Ambedkar's three types are the Untouchables, the Unapproachables and the Unseeables; Article 17 abolished untouchability but covert forms persist. *→ How did Dalits respond?* 6. Dalit movement. From pre-colonial sects and Phule to Gandhi's Harijan Sevak Sangh (1932), Hridaya Parivartan and reform within Hinduism, then Ambedkar: endogamy as core mechanism, Annihilation of Caste, rejection of Varna and legal and political safeguards. After independence came the BSP of Kanshi Ram and Mayawati and the Dalit Panthers. Cast: G.S. Ghurye = Caste and Race in India (1932) · Louis Dumont = Homo Hierarchicus · M.N. Srinivas = Sanskritisation; dominant caste · Andre Beteille = Caste, Class and Power (1965) · Dipankar Gupta = Interrogating Caste · B.R. Ambedkar = Annihilation of Caste · Mahatma Gandhi = Harijan Sevak Sangh 1932"}, {"c": "21", "n": "Caste System, Untouchability and Dalit MovementsHigh priority", "id": "terms", "t": "In simple words", "x": "In simple words # Caste = hereditary, endogamous, ranked groups with ascribed status and no mobility . Ghurye : six features; Dumont : pure versus impure ideology ; Srinivas : Sanskritisation, dominant caste ; Beteille : class and power are changing it; Gupta : discrete castes, muddled hierarchies . Gandhi wanted a change of heart within Hinduism; Ambedkar wanted annihilation of caste and rejected Varna . Term In plain words Ascribed status Position fixed at birth in caste society. Endogamy Marriage within the caste; Ambedkar calls it the core mechanism of caste. Anuloma and pratiloma Hypergamous unions (tolerated) versus hypogamous unions (condemned). Roti and beti vyavahar Rules of food sharing and marital ties. Sanskritisation Lower caste or tribe adopting rituals, customs and language of higher castes. Dominant caste Numerically strong, wealthy and politically powerful caste of a locality. Homo Hierarchicus Dumont's Indian type: holism and hierarchy; the West is Homo Aequalis. Hridaya Parivartan Gandhi's change of heart among upper castes. Discrete castes Gupta: castes exist as separate units, each with its own rituals and deities."}, {"c": "21", "n": "Caste System, Untouchability and Dalit MovementsHigh priority", "id": "1-caste-system", "t": "1 · Caste System", "x": "1 · Caste System # Handout only Caste is a system of social stratification widely regarded as a distinctive feature of Indian society. The termcasteis derived from the Portuguese wordcasta, meaning lineage, which in turn originates from the Latin wordcastus, meaning pure. The caste system organizes society into hereditary, endogamous, and hierarchically ranked groups with specific social and ritual statuses. Various scholars have defined caste in different ways. According to Andre Beteille , “Caste is a small and named group of persons characterised by hereditary membership, endogamy, and a specific style of life. Its lifestyle includes pursuit by tradition of a particular occupation, and it is usually associated with a distinct ritual status in a hierarchical system.” The noted sociologist S.C. Dube says that “Jati is an endogamous unit, with a more or less defined ritual status, and some occupation traditionally linked to it.” While scholarly definitions may vary, some of the main features of the caste system are outlined below."}, {"c": "21", "n": "Caste System, Untouchability and Dalit MovementsHigh priority", "id": "2-features-of-the-caste-system", "t": "2 · Features of the Caste System", "x": "2 · Features of the Caste System # Handout only Picture hook The varna hierarchy as a pyramid with Dalits outside it. (handout p.3) 1. Ascribed Status : In caste society, an individual’s position is determined by and at birth. 2. Prohibition on Mobility : A member of caste society is not permitted to change his caste. Every person is born in a particular caste and spends his entire life as a member of that caste. The caste society strictly prohibits and provides no mechanism to acquire a new caste. 3. Occupational Specification : Each caste is traditionally associated with a specific occupation. Every member of that caste performs the same caste occupation. The skills required to perform the caste occupation are passed down hereditarily from one generation to the next. 4. Endogamy : Every person must marry another person of the same caste. Despite the injunction of endogamy, inter-caste marriages did take place historically In such cases, Anuloma (hypergamous) unions were relatively tolerated, whereas Pratiloma (hypogamous) marriages were strongly condemned and punished. 5. Hierarchy : In every part of the country, castes are arranged hierarchically. No two castes are equal. In every region, there is a highest caste, a lowest caste, and several castes between them, each of which is one above and one below another caste. This hierarchy is based on ritual purity and pollution, with some castes considered superior and others inferior. 6. Restrictions on Feeding and Social Intercourse : Social interactions are governed by strict rules related to food sharing (Roti Vyavahar) and marital ties (Beti Vyavahar) . Violations invited sanctions such as social boycott or other punishments. 7. Civil and Religious Disabilities and Privileges : Different castes are accorded unequal access to social, economic, and religious rights , with lower castes often facing restrictions and higher castes enjoying privileges."}, {"c": "21", "n": "Caste System, Untouchability and Dalit MovementsHigh priority", "id": "3-caste-a-closed-system-of-stratification", "t": "3 · Caste: a closed system of stratification", "x": "3 · Caste: a closed system of stratification # Handout only The caste system represents a closed, hierarchical, and hereditary form of social stratification, regulating not only social status but also occupation, marriage, and everyday interactions. Its rigidity and all-encompassing nature historically ensured social order, but also institutionalized inequality and exclusion within Indian society."}, {"c": "21", "n": "Caste System, Untouchability and Dalit MovementsHigh priority", "id": "4-mobility-in-caste-society", "t": "4 · Mobility in Caste Society", "x": "4 · Mobility in Caste Society # Handout only Conventionally, caste society is considered a classic example of a closed social system. According to its critics, in the caste system, one’s social position is birth-based. Moreover, the identity acquired at birth persists throughout life. Caste society provides no avenues or chances for mobility. Therefore, the caste system is described as closed, inflexible, restrictive, rigid, and stagnant. Caste system is often contrasted with the class-based stratification system in Western societies, which are seen as open, with institutionalized avenues for social mobility. However, no social system is entirely closed and none is fully open. Even in Western class societies, access to opportunities is restricted based on one’s race, gender, and ethnicity. Sexual minorities, immigrants, the disabled, and the elderly continue to face systemic barriers to mobility in the west. Equally, the caste system is far from being completely closed. Social mobility is not only prevalent in Indian caste society in modern times, but has also been historically present. Some of the avenues for social mobility in caste society are as follows: 1. Acquisition of Political Power: A caste or community that gained political dominance could elevate its position in the social hierarchy. According to historian K. M. Panikkar, the Nandas were the last ‘true’ Kshatriyas. Since then, every known royal family has come from a non-Kshatriya caste. According to Romila Thapar, even the Nandas were of lower-caste origin. Prominent non-Kshatriya origin ruling dynasties in Indian history include Mauryan empire in Magadha (Bihar), Maharaja Agrasen’s kingdom in Agroha (Haryana), the Jat kingdom of Bharatpur, Pasi chieftains in UP, Paraya chiefs in Kerala, and Nadar rulers in Tamil Nadu. Prominent communities with strong martial traditions like the Rajputs of Rajasthan and Marathas in Maharashtra also possibly had non-Kshatriya origins. 2. Proximity to Rulers : Some communities were able to rise in rank due to royal patronage. For instance, Kayasthas served various rulers as scribes and accountants. Over time, the community, though non- Dwij in origin, could successfully claim Dwij status. 3. Renunciation: Those who renounce material possessions and worldly ties are revered in Indian society and culture. Sadhus and Sants were not subjected to caste rules and restrictions. Instead, they were accorded respect by wider society, irrespective of their caste of origin. Numerous saints in Indian history, such as Kabir, Tukaram, and Ravidas, exemplify this. They were revered for their saintly qualities without reference to their caste of birth. 4. Census Operations: During British rule, census administrators enumerated and ranked castes hierarchically. Many communities filed petitions to claim higher ritual rank. To support their claims, they often fabricated genealogies linking themselves to warriors, royal families, or even deities. In rare cases, recognition by authorities provided an official upward shift in status. 5. Sanskritization: Several lower castes have sought to elevate their ritual position by imitating the lifestyle, customs, and rituals of higher castes. This process could enable them to gain social legitimacy and move upwards in the caste order. While caste has traditionally been viewed as a closed and rigid system of stratification, empirical reality shows that it has always allowed limited but significant avenues of mobility . Even in the traditional caste-based social order, social groups have renegotiated their status over time. Thus, caste should be understood not as an absolutely static structure, but as a system marked by limited and context-specific mobility within an overarching framework of hierarchy ."}, {"c": "21", "n": "Caste System, Untouchability and Dalit MovementsHigh priority", "id": "5-g-s-ghurye-s-theory-of-caste", "t": "5 · G.S. Ghurye’s Theory of Caste", "x": "5 · G.S. Ghurye’s Theory of Caste # Handout only In 1932, G.S. Ghurye published a book titled Caste and Race in India , which still is an important source on the caste system. The book, his first, also turned out to be his most important contribution to Indian sociology. Ghurye describes caste as a form of social organization which presents a clear contrast to social groupings in the rest of the world. Hindu society is divided into groupings known as caste, with varying degrees of respectability and social interaction. G.S. Ghurye (1893-1983) Ghurye brought out the following six features of the caste system: 1) Segmental division of society : The caste society comprises of heterogeneous groups with a distinct life of their own and the membership is determined not by selection but by birth. Castes are small and complete social world in themselves, marked off definitely from one another, though subsisting within the larger society. 2) Hierarchy : One of the principal characteristics of the caste society is the hierarchy of groups. This implies a definite scheme of social precedence amongst the castes with the Brahmin at the head of the hierarchy. 3) Restrictions on feeding and social intercourse : There are minute rules pertaining to what sort of food or drink can be accepted by a person and from what castes. While lower ca
