.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.btn{font:600 14px var(--sans);padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:40px 0 20px}.pager a{display:block;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;text-decoration:none;color:var(--ink);font:600 15px var(--sans)}.pager a.nx{text-align:right}.pager small{display:block;color:var(--muted);font-weight:500;font-size:12px}

/* ---- reader app ---- */
:root{--zoom:1;--lh:1.65;--pw:780px}
:root[data-theme="sepia"]{--bg:#F4ECD8;--surface:#FBF5E6;--surface2:#EADFC4;--ink:#3B3022;--muted:#7A6A52;--line:#D8C9A6;--acc:#7A4A12;--acc-ink:#fff;--acc-soft:#EFDDB8;--saf:#A4470A;--saf-soft:#F6E2BE;--red:#9C2A1C;--red-soft:#F3D9CB;--blue:#2F5C8A;--blue-soft:#DDE6E4;--good:#3E6B2A;--good-soft:#DDE8C8;--hl:#F2D98A;color-scheme:light}
:root[data-font="sans"] body{font-family:var(--sans)}
:root[data-font="sans"] .notes p,:root[data-font="sans"] .notes li{font-family:var(--sans)}
.page{zoom:var(--zoom);max-width:var(--pw)}
.notes p,.notes li{line-height:var(--lh)}
.rbar{position:fixed;left:0;top:0;height:3px;width:0;background:var(--acc);z-index:40;transition:width .15s}
.aabtn{color:var(--ink);border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:5px 12px;font:700 14px var(--serif);cursor:pointer;flex:none}
.h2read{float:right;margin:2px 0 0 10px;font:600 12px var(--sans);border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer;min-height:30px}
.h2read[aria-pressed="true"]{background:var(--acc-soft);color:var(--acc);border-color:var(--acc)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;justify-content:center}
.dock button{font:600 14px var(--sans);min-height:44px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;padding:0 14px;cursor:pointer}
.dock .mid{flex:1;max-width:520px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock .mid b{color:var(--acc)}
body.has-dock .page{padding-bottom:110px}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheetin{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:82vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));font:15px/1.4 var(--sans)}
.sheetin h3{margin:0 0 10px;font:700 17px var(--sans)}
.srow{display:flex;align-items:center;gap:10px;margin:12px 0;flex-wrap:wrap}
.srow label{flex:0 0 92px;color:var(--muted);font-weight:600}
.srow .grp{display:flex;gap:6px;flex-wrap:wrap}
.srow button{font:600 14px var(--sans);min-height:42px;min-width:48px;padding:0 12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;cursor:pointer}
.srow button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.secl a{display:flex;gap:10px;align-items:center;padding:12px 6px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;min-height:44px}
.secl a .tk{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--acc-ink)}
.secl a.rd .tk{background:var(--acc);border-color:var(--acc)}
.secl a.cur{background:var(--acc-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:50;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;font:600 14px var(--sans);max-width:92vw;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.toast button{font:700 14px var(--sans);background:transparent;border:0;color:var(--bg);text-decoration:underline;cursor:pointer;min-height:36px}
body.focus .bar{display:none}body.focus .sidetoc{display:none}
figcaption.clamp{max-height:3.3em;overflow:hidden;position:relative;cursor:pointer}

s, then show that unity rests on culture, administration and the Constitution."}, {"c": "17", "n": "Society in India: Diversity and UnityMedium priority", "id": "story", "t": "The story first", "x": "The story first # The story first Indian society is a bundle of contradictions held together by strong but invisible threads. Its races, religions, languages, tribes and castes look like a recipe for conflict, yet a deep cultural, political and administrative unity holds them together, so India is a salad bowl of unity in diversity. 1. A bundle of contradictions. Indian society shows cultural pluralism that has evolved over millennia, with remarkable tolerance of different ways of life. Nehru in The Discovery of India called India a bundle of contradictions held together by strong but invisible threads. *→ What are the diversities?* 2. A land of diversities. There are many racial and ethnic stocks (Aryans, Dravidian, Proto-Australoid, Mongoloid, Negroid and their admixtures), all major religions, hundreds of tribes, thousands of castes, 22 languages in the 8th Schedule, and regional differences in food, culture, development and politics. India has been called a sub-continent masquerading as a nation. *→ Does diversity mean danger?* 3. The fear of balkanisation. Multiple identities and hierarchies were wrongly read as a danger: left uncontrolled, groups would be in perpetual conflict. Winston Churchill prophesied the balkanisation of India once the British left. *→ Where is the unity?* 4. Socio-cultural unity. For M.N. Srinivas the unity of India is essentially religious: epics, Puranic legends, temples, pilgrimage places and sacred geography built a pan-India culture. Irawati Karve points to the joint family across regions; Louis Dumont to the common framework and ideology of caste. *→ Is the unity only cultural?* 5. Politico-administrative unity. One sovereign over the whole country is an ancient idea: Ashwamedha and Rajsuya yagyas, titles like Chakravartin and Raja-dhiraj, and rulers from Ashok to Aurangzeb. British rule put the entire population under a single administration, railways and the post spread ideas, nationalism showed unity as a political necessity, and after independence princely states were integrated. *→ How is it best described?* 6. Unity in diversity. Unity is not premised on uniformity. India is a salad bowl: communities coexist without assimilation. Syncretism blends elements of different traditions into hybrid forms, and cultural pluralism is enshrined in the Constitution. Cast: Jawaharlal Nehru = The Discovery of India: a bundle of contradictions · M.N. Srinivas = unity of India is essentially religious · Irawati Karve = joint family cuts across regions · Louis Dumont = caste ideology common across India · Winston Churchill = prophesied balkanisation"}, {"c": "17", "n": "Society in India: Diversity and UnityMedium priority", "id": "terms", "t": "In simple words", "x": "In simple words # India is full of different races, religions, languages, tribes and castes , yet it stays one society . The glue is a shared religious and cultural world (Srinivas), the joint family (Karve), the caste framework (Dumont), and one political-administrative system . India is a salad bowl (communities keep their identity) with syncretism (blending of traditions): unity in diversity , not unity through uniformity. Term In plain words Cultural pluralism Many cultures living together, each respected in the larger polity and society. Balkanisation Break-up of a country into small hostile units; Churchill predicted it for India. Salad bowl Communities coexist without assimilation, unlike a melting pot. Syncretism Blending of elements from diverse traditions into hybrid forms. Chakravartin Title of pan-India overlordship, with Raja-dhiraj. 8th Schedule Lists 22 languages recognised by the Government of India."}, {"c": "17", "n": "Society in India: Diversity and UnityMedium priority", "id": "1-indian-society-an-introduction", "t": "1 · INDIAN SOCIETY: AN INTRODUCTION", "x": "1 · INDIAN SOCIETY: AN INTRODUCTION # Handout only Indian society is characterized by vibrant cultural pluralism that has evolved over millennia. Despite numerous and diverse social identities, Indian society maintains cohesion and unity. Indians demonstrate remarkable tolerance and accommodation of different ways of life. Indian social life is marked by peaceful and harmonious coexistence of different social groups and their expression into a single national framework. As Jawaharlal Nehru aptly described in The Discovery of India, “India is …a bundle of contradictions held together by strong but invisible threads.”"}, {"c": "17", "n": "Society in India: Diversity and UnityMedium priority", "id": "2-india-a-land-of-diversities", "t": "2 · India: A Land of Diversities", "x": "2 · India: A Land of Diversities # Handout only Picture hook Map of India as a mosaic of cultures. (handout p.3) Picture hook Diverse people in dress and faith: India as a land of diversities. (handout p.3) Indian society is characterized by numerous diversities. The very multiplicity of diversities can be truly perplexing. In India, there are numerous racial and ethnic groups, multiple languages, religious pluralism, hundreds of tribes, and thousands of castes. In Indian society, there are diverse forms of marriage and family, styles of music, dance, drama, art and architecture. In India, we come across innumerable customs, a wide range of faiths, a large number of political parties and regional histories. Little wonder then that India has been variously described as “a sub-continent masquerading as a nation”, and as “a veritable museum of races, cultures, languages, and religions”. India is a land of many races, ethnic groups, religions, and cultures At the outset, a foreigner will be struck by the remarkable racial diversity in India. The Indian population belongs to various racial and ethnic stocks; including Aryans, Dravidian, Proto-Australoid, Mongoloid, Negroid, and many which are an outcome of their admixture. India is home to multiple religions . All the major faiths of the world have a substantial following in India. Apart from the major ones like Hinduism, Islam, and Christianity - there are scores of others with fewer members but still an important part of India’s social and cultural fabric. These include Buddhists, Jains, Sikhs, Parsis, Jews, and a small but growing population of atheists and rationalists. Then, there are numerous tribal religious beliefs and rituals ranging from ancestor worship to nature worship, totem worship, and spirit worship. Various religious communities, particularly the bigger ones - like Hindus & Muslims, are further divided into numerous sects. There are scores of languages , dialects, and scripts that make India’s social landscape even more complex. The 8th Schedule of the Indian Constitution lists 22 languages recognized by the Government of India, while the number of spoken languages is far greater. Yet another mystifying phenomenon in Indian society is the multiplicity of castes . By the most conservative estimates, there are thousands of castes. Moreover, castes vary regionally. Castes not only differ in traditional occupations but also in terms of social status and power. These diversities on the axes of traditional identities of caste, religion, ethnic and linguistic community are further complicated when they are super-imposed on modern axes of diversities like class and occupation. There are also important regional variations in food habits, culture, level of economic development, and political organisation. Multiple social identities and hierarchies have been erroneously interpreted as a sign of danger for Indian society - that the multiplicity of social groups, if left uncontrolled, will be in a perpetual state of conflict . Some, like Winston Churchill, prophesised the balkanisation of India once the British exited the country."}, {"c": "17", "n": "Society in India: Diversity and UnityMedium priority", "id": "3-unity-in-india", "t": "3 · Unity in India", "x": "3 · Unity in India # Handout only Picture hook Friends of different faiths together: unity in diversity. (handout p.5) While the diversities in India are undeniable, and are frequently a cause of tensions and social conflicts, equally unmistakable and omnipresent is a strong undercurrent of unity. Unity in India is both, modern and ancient. It is multifaceted and enduring. It is politico-administration as well as social and cultural. Socio-cultural unity Indian society is held together by strong threads of cultural unity. For M.N Srinivas, the unity of India is essentially religious . The epics and Puranic legends, numerous temples, places of pilgrimage and the whole sacred geography have all contributed to build a truly pan-India culture. Other aspects of social life, like the joint family system also cuts across regions and communities (Irawati Karve). The framework and ideology of caste is also broadly the same throughout India (Louis Dumont). Politico-administrative unity The idea of the whole country under a single sovereign is an ancient one in Indian thought. Yagyas like Ashwamedha and Rajsuyya, and titles like Chakravartin and Raja-dhiraj indicate the notion of pan-India overlordship. In fact, many rulers from Ashok to Aurangzeb sought to realise this political vision. British rule created new conditions for the unity of India. It brought under a single administration the entire population of the country. Railways and the postal system led to an exchange of people and ideas on an unprecedented scale. The rise of nationalism in the 19th and 20th centuries shows that the people had become conscious of unity as a political necessity. After independence, politico-administrative integration was carried out by the national leadership by the integration of princely states in the Indian Union, and through various Constitutional mechanisms . Indian Society is characterized by Unity in Diversity In conclusion, diversities in India do not necessarily result in divisions and conflicts. Our unity is not premised on uniformity. Heterogeneity in our society is not a source of weakness, but a cause for celebration and strength. The kaleidoscopic variety of traditions and customs enriches the cultural landscape. India’s cultural mosaic is made up of numerous linguistic, religious, and ethnic groups that fit beautifully together. Indian society is appropriately described as a salad bowl , characterized by healthy and harmonious coexistence of different communities, without assimilation. Indian culture is also characterized by syncretism i.e. the blending of different elements from diverse traditions into hybrid forms. India’s template of cultural pluralism, also enshrined in the Indian Constitution, celebrates the peaceful coexistence of diverse groups, each of which is valued and respected in the larger polity and society."}, {"c": "17", "n": "Society in India: Diversity and UnityMedium priority", "id": "traps", "t": "Traps", "x": "Traps # Common mix-ups and the rule for the exam hall Trap What goes wrong, and the rule Salad bowl vs melting pot The handout says communities coexist without assimilation. Exam-hall rule: India = salad bowl, never melting pot. Who says what Srinivas: religion; Karve: joint family; Dumont: caste ideology. Exam-hall rule: attach each unity thread to its thinker. Unity vs uniformity Unity is not premised on uniformity; diversity is a strength. Exam-hall rule: write unity in diversity, not uniform culture."}, {"c": "17", "n": "Society in India: Diversity and UnityMedium priority", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Who called India a bundle of contradictions? Nehru, in The Discovery of India How many languages are in the 8th Schedule? 22 Whose view is that unity is essentially religious? M.N. Srinivas Who linked unity to the joint family? Irawati Karve Who linked unity to the caste framework? Louis Dumont Who prophesied balkanisation? Winston Churchill Salad bowl means? Communities coexist without assimilation What is syncretism? Blending of elements from diverse traditions into hybrid forms"}, {"c": "17", "n": "Society in India: Diversity and UnityMedium priority", "id": "abbr", "t": "Abbreviation column", "x": "Abbreviation column # Meanings are plain-language aids; verify before quoting Short form Full form One-line meaning"}, {"c": "17", "n": "Society in India: Diversity and UnityMedium priority", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test: redraw the chapter map"}, {"c": "17", "n": "Society in India: Diversity and UnityMedium priority", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards Mains answer skeletons One for each Mains PYQ quoted in the handout. Tap to open; try the answer first. Next Perspectives on the Study of Indian Society Personal study notes built from: Sarrthi IAS · Sociology Optional Foundation 2027 · Society in India (17th August). Only the handout facts are used; memory aids are labelled own. Copyright belongs to the teacher or institute; keep this private."}, {"c": "18", "n": "Perspectives on the Study of Indian SocietyHigh priority", "id": "chapter-map", "t": "Chapter map", "x": "Chapter map # Map Outline Perspectives on Indian society Indology Ghurye Texts Book view critique Structural functionalism Srinivas Village studies Integration Marxist A.R. Desai Colonial state Five phases Subaltern Guha Subaltern politics Spivak critique"}, {"c": "18", "n": "Perspectives on the Study of Indian SocietyHigh priority", "id": "lens", "t": "Exam lens", "x": "Exam lens # Exam lens Priority: High. Mains PYQs quoted: 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2022, 2023, 2025, 2026. Prelims: not asked (Mains optional). Mains hooks The handout quotes Mains PYQs from 2014 to 2026: a top-priority chapter. Clusters: Ghurye and Indology, Srinivas and structural functionalism, A.R. Desai and the dialectical or colonial mode of production, Ghurye versus Desai, insider versus outsider views, and Indian nationalism's social background. Compare perspectives in a table, then say each one answers the failure of the previous one."}, {"c": "18", "n": "Perspectives on the Study of Indian SocietyHigh priority", "id": "story", "t": "The story first", "x": "The story first # The story first Four lenses explain Indian society. Ghurye's Indology reads texts, Srinivas's structural functionalism studies villages in the field, A.R. Desai's Marxism studies classes and the colonial state, and the Subaltern school listens to peasants and marginal groups. Each corrects the one before it and has its own limits. 1. Indology (Ghurye). Indology studies Indian society through Sanskritic, Pali and Dravidian texts, Dharmashastras, Puranas, Vedas, Upanishads, epics, inscriptions and travel accounts, assuming Indian society is historically unique. Ghurye is its pioneer in sociology, building on the Asiatic Society of Bengal (1784) founded by William Jones. *→ What went wrong with the book view?* 2. Criticism of Indology. Texts are prescriptive rather than descriptive; Srinivas called it a book view; it is ahistorical, conservative and status-quoist, and equates Indian culture with Hindu and then Brahminical culture. *→ What replaced the book view?* 3. Structural functionalism (Srinivas). Society is a system of interrelated institutions, each contributing to stability. Trained under Radcliffe-Brown and Evans-Pritchard, Srinivas pioneered fieldwork and village studies: Rampura in The Remembered Village, India's Villages (17 studies), alongside Dube's Shamirpet, Béteille's Sripuram and Marriott's Kishangarhi. *→ What are its limits?* 4. Evaluation of structural functionalism. It gave a field view, an empirical base, the dominant 1950s-60s paradigm, policy relevance and concepts like Sanskritisation and dominant caste. But it overstressed integration and caste, generalised across villages, copied British anthropology and neglected urban and industrial life. *→ What about conflict and class?* 5. Marxist sociology (A.R. Desai). Desai used historical materialism: colonial rule created the conditions for nationalism, destroyed handicrafts, and produced new classes. He traced five phases of the national movement and argued that the post-independence state promotes capitalist development. *→ Who speaks for the margins?* 6. Subaltern approach (Guha). Subaltern Studies (1982-2005) challenges elite and Marxist history by showing peasants and marginal groups as political agents with an autonomous subaltern politics, often in religious idioms. It is criticised by nationalists, Marxists and Spivak, and for neglecting gender. Cast: G.S. Ghurye = pioneer of Indology (1893-1983) · M.N. Srinivas = structural functionalism; Rampura (1916-1999) · A.R. Desai = Marxist sociologist (1915-1994) · Ranajit Guha = Subaltern Studies (1923-2023) · Gayatri Spivak = Can the Subaltern Speak? · Antonio Gramsci = source of the term subaltern"}, {"c": "18", "n": "Perspectives on the Study of Indian SocietyHigh priority", "id": "terms", "t": "In simple words", "x": "In simple words # Indology = study Indian society through ancient texts (Ghurye); Srinivas called it a book view . Structural functionalism = go to the village and see how caste, kinship and religion work together (Srinivas, Dube, Béteille, Marriott). Marxism (A.R. Desai) = look at classes, colonial economy and the state ; Subaltern (Guha) = look at the politics of peasants and marginal groups . Term In plain words Indology Study of Indian society, culture and literature through classical texts. Book view Srinivas's label for text-based Indology. Field view Understanding society through fieldwork and participant observation. Structural functionalism Society as interrelated parts each contributing to stability. Universalisation and parochialisation Marriott's concepts linked to Great and Little Tradition. Subaltern Gramsci's term for marginalised, subordinated groups. Historical materialism Marxist method used by Desai: material conditions shape social structure. Elite and subaltern politics Two parallel domains: petitions and meetings versus direct action."}, {"c": "18", "n": "Perspectives on the Study of Indian SocietyHigh priority", "id": "1-indology-g-s-ghurye", "t": "1 · Indology (G.S. Ghurye)", "x": "1 · Indology (G.S. Ghurye) # Handout only Indology refers to the systematic study of Indian society, culture, languages, and literature, primarily through the analysis of classical texts and traditions. The Indological approach is based on the assumption that Indian society is historically unique, and therefore, Western sociological theories alone are insufficient to fully understand it. To comprehend Indian social reality, this approach emphasizes the need to study norms, values, religious philosophies, and cultural traditions embedded in ancient texts. Accordingly, Indologists advocate a detailed examination of Sanskritic texts , along with Pali and Dravidian literature, and focus particularly on Indic religions such as Hinduism and Buddhism. This includes the study of Dharmashastras, Puranas, Vedas, Upanishads, and epics, along with inscriptions, manuscripts, archaeological evidence, and travel accounts, thereby reconstructing Indian society through its textual and historical sources. G.S. Ghurye (1893-1983) G.S. Ghurye is regarded as a pioneer of the Indological approach in Indian sociology. However, the roots of Indology go back to the late 18th and 19th centuries, with institutions such as the Asiatic Society of Bengal (1784), founded by William Jones, and later the Royal Asiatic Society (1823) in England, the American Oriental Society (1842), and the German Oriental Society (1845). European scholars and colonial administrators like Henry Maine, Charles Wilkins, and Max Müller made significant contributions through translation and interpretation of Indian texts. While these efforts were partly motivated by a desire to better understand Indian society, they were also linked to colonial administrative and ideological objectives. Indian scholars and leaders such as P.V. Kane, Jadunath Sarkar, B.R. Ambedkar, Tilak, Gandhi, and Aurobindo also engaged with Indological sources, either to reform society or to defend and reinterpret Indian traditions. Institutions like the Theosophical Society, Oriental Research Institutes, and Banaras Hindu University played an important role in promoting Indological research. The development of the Indological approach in sociology can be attributed to several factors . First, Ghurye’s academic background in Sanskrit enabled him to engage deeply with classical texts. Second, the socio-political climate of colonial India encouraged both colonial scholars and Indian intellectuals to study Indian traditions - albeit for different purposes, ranging from governance to cultural assertion. Third, Ghurye benefited from a pre-existing body of Indological scholarship, which he adapted for sociological analysis. The Indological approach has several strengths . It highlights the distinctiveness of Indian society and culture and attempts to develop an indigenous perspective, rather than relying exclusively on Western models. It draws attention to the cultural and civilizational continuity of Indian society and provides a deep understanding of its normative framework. While Ghurye is most closely associated with this approach, several scholars - such as Louis Dumont, McKim Marriott, Pocock, K.M. Kapadia, Irawati Karve, and R.K. Mukherjee - have also engaged with Indological perspectives in varying degrees. Importantly, Ghurye himself did not rely solely on texts but also used empirical methods, including surveys and field studies. However, the Indological approach has been widely criticized , as follows: 1. It relies heavily on texts that are often prescriptive rather than descriptive , and therefore may not reflect actual social practices. 2. M.N. Srinivas criticized it as a “ book view ”, arguing that it fails to capture the lived realities of society, which require field-based observation. 3. It has been described as ahistorical , in the sense that it tends to underplay processes of social change and transformation. 4. Critics argue that it can be conservative and status-quoist , as it may inadvertently legitimize existing hierarchies by treating them as part of a normative order. 5. 5. It has been criticized for equating Indian culture with Hindu culture , and further, for reducing Hindu culture to Brahminical traditions, thereby neglecting the diversity of practices and experiences, especially those of marginalized groups. Thus, the Indological approach remains valuable for understanding the normative and civilizational foundations of Indian society, but its over-reliance on texts limits its ability to capture lived realities and social change, making it necessary to complement it with empirical approaches."}, {"c": "18", "n": "Perspectives on the Study of Indian SocietyHigh priority", "id": "2-structural-functionalism-m-n-srinivas", "t": "2 · Structural functionalism (M. N. Srinivas)", "x": "2 · Structural functionalism (M. N. Srinivas) # Handout only The structural-functional approach views society as a system of interrelated parts or institutions, each performing functions that contribute to the stability and continuity of the whole. It emphasizes that institutions such as caste, kinship, religion, and economy are interdependent , and therefore must be studied in relation to one another rather than in isolation. Society is seen as an integrated whole where different parts perform specific roles to maintain social order and equilibrium. M. N. Srinivas (1916-1999) M.N. Srinivas, who trained under British social anthropologists A.R. Radcliffe-Brown and E.E. Evans-Pritchard, played a pivotal role in applying this approach to the study of Indian society. He emphasized fieldwork and participant observation , and initiated a tradition of village studies in India. Several scholars followed this approach, including André Béteille (Sripuram, Tamil Nadu), S.C. Dube (Shamirpet, Telangana), and McKim Marriott (Kishangarhi, Uttar Pradesh). The 1950s marked a crucial phase for village studies, with 1955 being particularly significant due to the publication of several important works. S.C. Dube’s Indian Village provided a detailed and holistic account of Shamirpet village, highlighting that despite the presence of multiple castes, village life was characterized by a degree of integration and interdependence. In his later work, India’s Changing Villages, Dube examined the impact of urban contact, particularly with Hyderabad, on rural transformation. M.N. Srinivas editedIndia’s Villages, a compilation of 17 village studies by Indian and foreign scholars, which challenged the colonial notion that Indian villages were self-sufficient and isolated. McKim Marriott, in Village India, developed the concepts of universalisation and parochialisation, linking them with the Great and Little Tradition framework. D.N. Majumdar, in Rural Profiles, revisited and critically examined key concepts such as Sanskritisation and dominant caste. In his classic workThe Remembered Village, Srinivas presented an in-depth study of Rampura village in Karnataka, based on fieldwork conducted in 1948. After his field notes were destroyed in a fire, he reconstructed the account from memory and surviving fragments. Srinivas employed participant observation, collected genealogies, conducted surveys, and attempted to build relationships across castes. However, he acknowledged certain limitations, such as his greater acceptance among the dominant/high caste groups, partly due to his own background as an educated Brahmin. The work provides detailed insights into the economic, political, religious, and kinship structures of village life."}, {"c": "18", "n": "Perspectives on the Study of Indian SocietyHigh priority", "id": "3-evaluation-of-the-structural-functional", "t": "3 · Evaluation of the Structural-Functional Approach", "x": "3 · Evaluation of the Structural-Functional Approach # Handout only Positives 1. Corrective to Indological Approach : It shifted focus from text-based (book-view) understanding to empirical field-based (field-view) analysis. 2. Empirical Foundation : It provided a strong empirical base to Indian sociology through systematic village studies. 3. Dominant Paradigm : It became the dominant approach in the 1950s and 1960s, shaping early sociological research in India. 4. Study of Change : Despite explaining social stability, it also highlighted processes of change such as Sanskritisation. It captured the impact of modernisation, urban contact, and state intervention on rural society. 5. Policy Relevance : Its findings were useful for policy-making and rural development planning. 6. Conceptual Contributions : It generated important concepts such as Sanskritisation, dominant caste, universalisation, and parochialisation, which remain central to understanding Indian society."}, {"c": "18", "n": "Perspectives on the Study of Indian SocietyHigh priority", "id": "4-criticisms", "t": "4 · Criticisms", "x": "4 · Criticisms # Handout only 1. Overemphasis on Integration : The approach tends to highlight cooperation, consensus, and integration, while downplaying conflict, inequality, and exploitation, especially caste-based oppression. 2. Limited View of Diversity : Many village studies generalized findings, thereby failing to fully capture the regional and cultural diversity of Indian villages. 3. Influence of British Anthropology : It is criticized for being heavily influenced by British structural-functionalism, which may not adequately reflect the specificities of Indian society. 4. Rural Bias : The approach focused predominantly on village studies, neglecting the growing importance of urban society and industrial life. 5. Overemphasis on Caste : Village society was often analysed primarily through the lens of caste, sometimes overlooking other dimensions such as class, gender, and state power. Thus, the structural-functional approach provided a strong empirical and analytical foundation for Indian sociology, but its emphasis on integration and stability restricts its ability to fully explain conflict, inequality, and rapid social transformation in contemporary India."}, {"c": "18", "n": "Perspectives on the Study of Indian SocietyHigh priority", "id": "5-marxist-sociology-a-r-desai", "t": "5 · Marxist sociology (A. R. Desai)", "x": "5 · Marxist sociology (A. R. Desai) # Handout only The Marxist perspective in Indian sociology, most prominently associated with A.R. Desai, seeks to understand Indian society through the lens of economic structures, class relations, and historical processes. Other important Indian Marxist thinkers include D.D. Kosambi, P.C. Joshi, R.K. Mukerjee, D.N. Dhanagare, D.P. Mukerji, and R.P. Dutt. Desai emphasized the centrality of economic factors and applied the Marxist method of historical materialism to analyse changes in Indian society, arguing that the material conditions of life shape social and political structures. A.R. Desai (1915-1994) According to Desai, pre-colonial Indian society was characterized by self-sufficient village communities, an agrarian economy, and relatively primitive technology. Villages were largely localized and stable, with production organized at the village level. He argued that these conditions were not conducive to the emergence of nationalism. In his works Social Background of Indian Nationalism (1948) and Recent Trends in Indian Nationalism (1960), Desai contends that it was colonial rule created the necessary conditions for the rise of nationalism in India . Colonialism introduced modern education, printing press, railways, and administrative structures, while simultaneously leading to the destruction of handicrafts, and the impoverishment of peasants and artisans. It also introduced modern industry, machinery, and new land tenure systems. These transformations resulted in the emergence of new social classes . In rural areas, classes such as absentee landlords, rich peasants, agricultural labourers, and moneylenders developed, while in urban areas, there emerged the capitalist class, industrial working class, professionals, and managerial groups. Desai viewed the Indian national movement as an all-class movement, in which different classes participated to pursue their own class interests. However, he argued that ultimately, the Indian bourgeoisie came to dominate the movement, largely through its control over the Indian National Congress. Desai identified different phases of the nationalist movement , noting that its social base expanded over time and its methods and demands evolved. First phase (Till 1885) During this initial phase, it was the Indian intelligentsia who contributed to development of Indian nationalism. They were a product of the modern education system and had imbibed western values of equality, liberty, rationalism, democracy, and nationalism. They undertook progressive social reforms and advocated the freedom of press. Second phase (1885 - 1905) During this time, the Congress was dominated by Liberals. It represented the interests of the educated middle class and Indian industrialists. Its demands were Indianization of civil services, holding the civil services exam in India, and stopping the economic drain. Third phase (1905 - 1918) L eadership of INC came into the hands of the Extremists, who were dissatisfied with the British response to moderate methods. The social base of the national movement widened to include sections of the lower middle class, and the movement became increasingly militant. Fourth phase (1918 - 1934) During this phase, the social base of the Indian national movement greatly expanded. It became a mass-based movement under the leadership of Gandhi. Indian capitalists had grown strong and began exerting a lot of influence on the Congress party. Fifth phase (1934 onwards) There was growing disillusionment against Gandhian leadership within the Congress part y. Those disillusioned formed the Congress Socialist Party . Also, outside of the Congress, numerous peasant revolts and movements of the working class, depressed classes (untouchables), and tribals started taking place . Communist Party also gained greater influence. Also, communalism gained greater traction. However, it was the Gandhi led Congress party that remained the mainstream. In his later work, India’s Path of Development (1984), Desai argued that the Indian state after independence has promoted capitalist development , despite adopting a mixed economy model and welfare rhetoric. According to him, the state, through its legal and administrative apparatus, has facilitated the growth of capitalist classes, including industrial bourgeoisie, rich farmers, and agricultural capitalists. He viewed the Indian Constitution as reflecting bourgeois interests, and argued that state policies have transformed agrarian relations from pre-capitalist to capitalist forms. Desai classified democratic rights into three types : bourgeois rights (such as property and trade), civil rights (like freedom of speech), and proletarian rights (such as the right to organize and strike). He contended that while civil and proletarian rights exist formally, they are often curtailed in practice to facilitate continued capital accumulation. From this perspective, the welfare state is criticized for having failed to eliminate poverty, inequality, and exploitation. Instead, the state is seen as actively promoting the class interests of the capitalists. Desai’s contribution: Desai’s analysis provided a strong contrast to the then dominant structural-functional approach, which emphasized integration, stability, and consensus. In contrast, the Marxist perspective highlights conflict, exploitation, and class struggle as central to understanding Indian society. While structural-functionalists focused largely on village-level (micro) studies, Desai adopted a macro-historical approach, using historical materialism and dialectics. His work shifted attention from caste-centric analysis to the importance of class and economic relations, and addressed a broader audience beyond academia. However, the Marxist approach has been subject to criticisms , as follows: 1. It is argued that Marxists tend to overemphasize class and economic factors, sometimes reducing caste to class, which overlooks the distinctiveness of caste as a social institution. 2. Critics also point out that Marxist analyses often underplay cultural and religious factors. 3. Desai’s work has been criticized for having a limited empirical base , with several claims not sufficiently supported by field data. 4. Some argue that Desai’s writings reflect a strong ideological commitment to Marxism, raising questions about objectivity and neutrality in his analysis. Thus, the Marxist approach offers a powerful lens to analyse class, exploitation, and structural inequalities, but its tendency to privilege economic factors can lead to an incomplete understanding of Indian society where caste and culture also play an autonomous role. Memory aid (own) · Desai's five phases of the national movement I L E G S In Lonely Evenings Girls Sing. I = Intelligentsia (till 1885); L = Liberals (1885-1905); E = Extremists (1905-1918); G = Gandhi and the mass phase (1918-1934); S = Socialists and Communists (1934 onwards). Sentence follows the handout order of the phases. (order kept (phases))"}, {"c": "18", "n": "Perspectives on the Study of Indian SocietyHigh priority", "id": "6-subaltern-approach-ranajit-guha", "t": "6 · Subaltern Approach (Ranajit Guha)", "x": "6 · Subaltern Approach (Ranajit Guha) # Handout only Picture hook Ranajit Guha. (handout p.5) The Subaltern approach is most closely associated with the work of Ranajit Guha, and emerged as a major perspective through the Subaltern Studies series (1982-2005), comprising multiple edited volumes by Guha and other scholars. One of the most influential works in this tradition is Guha’sElementary Aspects of Peasant Insurgency in Colonial India, which examines the patterns and logic of peasant rebellions."}, {"c": "18", "n": "Perspectives on the Study of Indian SocietyHigh priority", "id": "7-subaltern-politics-and-the-subaltern-dom", "t": "7 · Subaltern politics and the subaltern domain", "x": "7 · Subaltern politics and the subaltern domain # Handout only The Subaltern approach developed partly as a critique of conventional Marxist and nationalist historiography . Classical Marxist analysis tended to assign limited revolutionary potential to the peasantry, viewing it as lacking sustained political consciousness. Guha challenged this view by arguing that in colonial and post-colonial societies, peasants and other marginal groups have displayed significant political agency through recurrent rebellions and resistance movements. Marxist frameworks, according to Guha, were insufficient to fully capture the autonomous political expressions of these groups. The approach draws intellectual inspiration from Antonio Gramsci’s concept of the “subaltern” , which refers to social groups that are marginalized, subordinated, and excluded from dominant power structures as well as mainstream discourse. In the Indian context, this includes peasants, tribals, Dalits, and other oppressed groups, who experience not only economic exploitation but also social and cultural subordination. In colonial India, Subaltern scholars argue that there existed two parallel domains of politics - elite politics and subaltern politics . Elite politics, led by educated and propertied classes, relied on methods such as petitions, resolutions, public meetings, and press campaigns. In contrast, subaltern politics was expressed through direct action, often in forms that appeared spontaneous or violent, such as attacks on symbols of authority, destruction of property, and local uprisings. Mainstream historiography, according to Subaltern scholars, largely focused on elite politics and dismissed subaltern actions as “pre-political”. Guha and other scholars of the subaltern school rejected this characterization, arguing that subalterns were politically conscious and capable of autonomous action, even if their forms of expression differed from formal politics. Subaltern political activity was often dual in its orientation - directed not only against colonial rule, but also against local structures of oppression, such as landlords, moneylenders, and dominant castes. Moreover, subaltern mobilization frequently took place through religious and cultural idioms, drawing upon local beliefs and symbols. For instance, studies such as those by David Hardiman have shown how Adivasi movements in Gujarat mobilized around religious ideas to challenge both colonial authority and local exploitation. The relationship between elite and subaltern politics was often complex and tense. While nationalist leaders sought to mobilize the masses, they also attempted to contain and discipline subaltern militancy. As illustrated in Shahid Amin’s work “Gandhi as Mahatma”, popular perceptions of Gandhi among rural masses sometimes diverged significantly from his own message, leading to reinterpretations that could result in violent actions, as seen in events like Chauri Chaura."}, {"c": "18", "n": "Perspectives on the Study of Indian SocietyHigh priority", "id": "8-criticisms-of-the-subaltern-approach", "t": "8 · Criticisms of the Subaltern Approach", "x": "8 · Criticisms of the Subaltern Approach # Handout only 1. Critique by Nationalists : It is argued that the Subaltern approach tends to downplay the role and contribution of nationalist leaders, thereby offering a somewhat one-sided account of the freedom struggle. 2. Critique by Marxists : Marxist scholars argue that the approach underemphasizes economic structures and class relations. 3. Spivak’s Critique : In “Can the Subaltern Speak?”, Gayatri Chakravorty Spivak criticizes the assumption that all forms of subaltern resistance are inherently emancipatory. 4. Problem of Representation : Spivak argues that subaltern scholars often appropriate the authority to speak on behalf of the subaltern, thereby reproducing forms of intellectual domination. 5. Neglect of Gender : The subaltern studies tradition has been criticized for being male-dominated, and for insufficiently addressing the experiences of subaltern women. Thus, the subaltern approach successfully brings to the fore the agency and voices of marginalized groups, but its limitations in representation and relative neglect of broader structures mean it must be used alongside other perspectives for a more comprehensive understanding of Indian society."}, {"c": "18", "n": "Perspectives on the Study of Indian SocietyHigh priority", "id": "traps", "t": "Traps", "x": "Traps # Common mix-ups and the rule for the exam hall Trap What goes wrong, and the rule Ghurye vs Srinivas Ghurye: texts (Indology); Srinivas: fieldwork (structural functionalism). Exam-hall rule: text = Ghurye, field = Srinivas. Desai vs Guha Desai: class and colonial economy; Guha: autonomous subaltern politics. Exam-hall rule: class = Desai, subaltern agency = Guha. Dube vs Srinivas villages Dube: Shamirpet; Srinivas: Rampura; Béteille: Sripuram; Marriott: Kishangarhi. Exam-hall rule: match village to author."}, {"c": "18", "n": "Perspectives on the Study of Indian SocietyHigh priority", "id": "recall", "t": "Recall sheet", "x": "Recall sheet # Read once, hide it, then rebuild the chapter from memory. Pioneer of Indology in sociology? G.S. Ghurye Who called Indology a book view? M.N. Srinivas Srinivas's classic village study? The Remembered Village (Rampura, fieldwork 1948) India's Villages had how many studies? 17 Dube's villages book? Indian Village (Shamirpet) Marriott's concepts? Universalisation and parochialisation Desai's 1948 work? Social Background of Indian Nationalism Desai's 1984 work? India's Path of Development Subaltern Studies years? 1982-2005 Guha's key work? Elementary Aspects of Peasant Insurgency in Colonial India"}, {"c": "18", "n": "Perspectives on the Study of Indian SocietyHigh priority", "id": "abbr", "t": "Abbreviation column", "x": "Abbreviation column # Meanings are plain-language aids; verify before quoting Short form Full form One-line meaning INC Indian National Congress Party named in the handout discussion"}, {"c": "18", "n": "Perspectives on the Study of Indian SocietyHigh priority", "id": "revise", "t": "Revise", "x": "Revise # Spaced schedule (count from the day you finish the chapter) Day What to do Day 0 Read the Exam lens and the notes; mark the chapter done Day +1 Recall sheet: read once, hide, rebuild Day +3 Flashcards: missed ones only Day +7 Quick quiz; fix each miss against the Traps Day +21 Write two Mains answers from memory using the skeletons Day +45 Blank-page test: redraw the chapter map"}, {"c": "18", "n": "Perspectives on the Study of Indian SocietyHigh priority", "id": "practice", "t": "Test yourself", "x": "Test yourself # Quick quiz 0 / 0 correct Flashcards Tap the card to flip. Back Next Missed it Shuffle Only missed All cards Mains answer skeletons One for each Mains PYQ quoted in the handout. Tap to open; try the answer first. 2026 · 10 marks · Bring out the debates of insiders' and ' : finish with the matching criticisms section and a one-line judgement. 2022 · 10 marks · Elaborate on M.N. Srinivas's structural-functionalist approach to the study of Indian society. Question. Elaborate on M.N. Srinivas's structural-functionalist approach to the study of Indian society. Intro: name Perspectives on the Study of Indian Society and state the central idea in one line (see The story first). Body: build the answer from the notes under: Structural functionalism (M. N. Srinivas). Close: finish with the matching criticisms section and a one-line judgement. 2022 · 20 marks · Examine the social background of growth of Indian nationalism. Question. Examine the social background of growth of Indian nationalism. Intro: name Perspectives on the Study of Indian Society and state the central idea in one line (see The story first). Body: build the answer from the notes under: Marxist sociology (A. R. Desai). Close: finish with the matching criticisms section and a one-line judgement. 2020 · 10 marks · Elaborate A. R. Desai's perspective to the study of Indian society. Question. Elaborate A. R. Desai's perspective to the study of Indian society. Intro: name Perspectives on the Study of Indian Society and state the central idea in one line (see The story first). Body: build the answer from the notes under: Marxist sociology (A. R. Desai). Close: finish with the matching criticisms section and a one-line judgement. 2019 · 10 marks · Give an account of Ranajit Guha's approach in studying 'subaltern class'. Question. Give an account of Ranajit Guha's approach in studying 'subaltern class'. Intro: name Perspectives on the Study of Indian Society and state the central idea in one line (see The story first). Body: use the chapter sections that match the keywords of the question. Close: finish with the matching criticisms section and a one-line judgement. 2019 · 10 marks · Elaborate Srinivas's views on religion and society among the Coorgs. Question. Elaborate Srinivas's vi
